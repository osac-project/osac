{{- /* The AAP bootstrap job (pre-install with an external AAP) reads this
       Secret through envFrom, so it must exist before the job pod is
       created: regular chart resources apply only after pre-install
       hooks finish. Render it as an earlier-weight hook in that mode;
       the bundled-AAP path keeps it a regular resource. The hourly
       config-as-code rerun also reads it, so it is never deleted. */}}
{{- $secretHookPhase := "" }}
{{- if not .Values.aap.instance.enabled }}
{{- $secretHookPhase = "pre-install,pre-upgrade" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.configAsCode.secret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-aap.labels" . | nindent 4 }}
  {{- if $secretHookPhase }}
  annotations:
    "helm.sh/hook": {{ $secretHookPhase }}
    "helm.sh/hook-weight": "8"
    "helm.sh/hook-delete-policy": before-hook-creation
  {{- end }}
stringData:
  AAP_ADDON_OPERATOR_MAX_CONCURRENT_JOBS: {{ .Values.configAsCode.addonOperatorMaxConcurrentJobs | quote }}
  AAP_CONFIG_AS_CODE_SECRET: {{ .Values.configAsCode.secret | quote }}
  AAP_OSAC_SERVICE_ACCOUNT: {{ .Values.serviceAccounts.osacSa | quote }}
  OSAC_PUBLISH_TEMPLATES_ENABLED: {{ .Values.instanceGroups.publishTemplates.enabled | quote }}
  {{- if .Values.global }}
  {{- with .Values.global.instanceId }}
  # The run ID of shared-infrastructure E2E runs: one AAP serves many runs, so
  # config-as-code names this run's organization (and, through it, every
  # object it manages) after the run. Env flow: the bootstrap job reads this
  # Secret through envFrom, the hourly config-as-code rerun through its pod's
  # envFrom.
  OSAC_INSTANCE_ID: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- if include "osac-aap.vclusterApiServerUrl" . }}
  # Same two env flows as OSAC_INSTANCE_ID. The token itself stays out of
  # this Secret: the config-as-code-ig pod spec injects it from the named
  # Secret, so the token never passes through Helm values.
  VCLUSTER_API_URL: {{ include "osac-aap.vclusterApiServerUrl" . | quote }}
  VCLUSTER_TOKEN_SECRET_NAME: {{ .Values.vcluster.tokenSecret.name | quote }}
  VCLUSTER_TOKEN_SECRET_KEY: {{ .Values.vcluster.tokenSecret.key | quote }}
  {{- end }}
  {{- if .Values.configAsCode.importAgentsEnabled }}
  OSAC_IMPORT_AGENTS_ENABLED: "true"
  {{- end }}
  {{- if .Values.configAsCode.importBcmAgentsEnabled }}
  OSAC_IMPORT_BCM_AGENTS_ENABLED: "true"
  {{- end }}
  {{- with .Values.configAsCode.eeImage }}
  AAP_EE_IMAGE: {{ . | quote }}
  {{- end }}
  {{- with .Values.configAsCode.eeImagePull }}
  AAP_EE_IMAGE_PULL: {{ . | quote }}
  {{- end }}
  {{- with .Values.configAsCode.projectGitUri }}
  AAP_PROJECT_GIT_URI: {{ . | quote }}
  {{- end }}
  {{- with .Values.configAsCode.projectGitBranch }}
  AAP_PROJECT_GIT_BRANCH: {{ . | quote }}
  {{- end }}
  {{- /*
  Network-manager settings are read by network-fulfillment jobs from their
  network-fulfillment-ig ConfigMap and Secret. Config-as-code needs the CA
  ConfigMap name only to render the optional CA bundle mount.
  */}}
  {{- $netris := .Values.instanceGroups.networkFulfillment.config | default dict }}
  {{- /* Main's schema rules: an HTTPS URL and a boolean validation flag
  (config.yml casts any other value, including "", to false). */}}
  {{- with index $netris "NETRIS_CONTROLLER_URL" }}
  {{- if not (regexMatch "^https://[^/\\s:]+(:[0-9]+)?(/[^\\s]*)?$" (toString .)) }}
  {{- fail "instanceGroups.networkFulfillment.config.NETRIS_CONTROLLER_URL must be an https:// URL" }}
  {{- end }}
  {{- end }}
  {{- if hasKey $netris "NETRIS_VALIDATE_CERTS" }}
  {{- $validateCerts := index $netris "NETRIS_VALIDATE_CERTS" | toString | lower }}
  {{- if not (has $validateCerts (list "true" "false")) }}
  {{- fail "instanceGroups.networkFulfillment.config.NETRIS_VALIDATE_CERTS must be \"true\" or \"false\"" }}
  {{- end }}
  {{- end }}
  {{- with index $netris "NETRIS_CA_CONFIGMAP" }}
  {{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$" .) }}
  {{- fail "instanceGroups.networkFulfillment.config.NETRIS_CA_CONFIGMAP must be a ConfigMap name" }}
  {{- end }}
  NETRIS_CA_CONFIGMAP: {{ . | quote }}
  {{- end }}
  {{- with .Values.configAsCode.remoteClusterKubeconfigSecretName }}
  REMOTE_CLUSTER_KUBECONFIG_SECRET_NAME: {{ . | quote }}
  REMOTE_CLUSTER_KUBECONFIG_SECRET_KEY: {{ $.Values.configAsCode.remoteClusterKubeconfigSecretKey | default "kubeconfig" | quote }}
  {{- end }}
