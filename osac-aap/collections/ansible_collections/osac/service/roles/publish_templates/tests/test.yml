---
# Test playbook for osac.service.publish_templates role.
# Each play is guarded by a `when` condition with bool coercion -- only the
# play whose variable evaluates to true will run. Pass exactly one variable
# per invocation.
#
# These tests use a Python mock HTTP server to simulate the fulfillment-service
# API, so they can run without any external dependencies.
#
# Required variables for every test:
#   test_mock_port:  Port for the mock HTTP server (default: 18081)
#
#   Test 1 (empty API responses -- the MGMT-23770 bug scenario):
#     When no items exist, proto3 omits the `size` field entirely.
#     The role must handle {"items": []} without a `size` key.
#     Expected: All templates are created via POST, no PATCH calls.
#     ansible-playbook ... -e test_empty=true
#
#   Test 2 (populated API responses -- existing items):
#     When items already exist, the role should PATCH them.
#     New items that don't exist should be POSTed.
#     Expected: Existing templates updated via PATCH, new ones POSTed.
#     ansible-playbook ... -e test_populated=true
#
#   Test 3 (no items key in response -- edge case):
#     Some API responses might return {} without an items key.
#     The role should treat this as empty and POST all templates.
#     Expected: All templates created via POST.
#     ansible-playbook ... -e test_no_items_key=true
#
#   Test 4 (explicit NetworkClass selection override, OSAC-4073):
#     When multiple network roles are discovered and none is is_default, an explicit
#     publish_templates_network_class_implementation_strategy selects which one to publish.
#     Expected: Only the explicitly selected role is published.
#     ansible-playbook ... -e test_explicit_network_class=true
#
#   Test 5 (ambiguous NetworkClass selection, OSAC-4073):
#     When multiple network roles are discovered, none is is_default, and no explicit
#     override is given, the role must fail with a clear error rather than attempting to
#     publish all of them (which would fail against the API's singleton constraint).
#     Expected: The role fails at the "Select the single NetworkClass to publish" task.
#     ansible-playbook ... -e test_ambiguous_network_class=true

# ──────────────────────────────────────────────────────────────
# Test 1: Empty API responses (the MGMT-23770 bug scenario)
# Expected: role succeeds, all templates created via POST
# ──────────────────────────────────────────────────────────────
- name: "Test publish_templates -- empty API responses (MGMT-23770)"
  hosts: localhost
  gather_facts: false

  vars:
    test_mock_port: 18081

  tasks:
    - name: Kill any stale server on port
      ansible.builtin.shell: "fuser -k {{ test_mock_port }}/tcp 2>/dev/null || true"
      changed_when: false
      when: test_empty | default(false) | bool

    - name: Start mock API server (empty scenario)
      ansible.builtin.command:
        cmd: "python3 {{ playbook_dir }}/mock_api_server.py {{ test_mock_port }} empty"
      changed_when: false
      async: 30
      poll: 0
      register: mock_server
      when: test_empty | default(false) | bool

    - name: Wait for mock server to start
      ansible.builtin.wait_for:
        port: "{{ test_mock_port }}"
        timeout: 5
      when: test_empty | default(false) | bool

    - name: Run publish_templates role against empty API
      ansible.builtin.include_role:
        name: osac.service.publish_templates
      vars:
        osac_fulfillment_service_uri: "http://127.0.0.1:{{ test_mock_port }}"
        osac_fulfillment_service_token: "test-token"
        publish_templates_validate_certs: false
        osac_cluster_templates:
          - id: "new-cluster-template"
            title: "Test Cluster"
        osac_compute_instance_templates:
          - id: "new-ci-template"
            title: "Test CI"
        osac_network_classes:
          - implementation_strategy: "new-network-class"
            fabric_manager: "new-network-class"
            title: "Test NC"
      when: test_empty | default(false) | bool

    - name: Fetch API call log
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ test_mock_port }}/_calls"
        return_content: true
      register: call_log
      when: test_empty | default(false) | bool

    - name: Verify POST calls were made for all templates (empty = create new)
      ansible.builtin.assert:
        that:
          - call_log.json | selectattr('method', 'equalto', 'POST') | list | length == 3
          - call_log.json | selectattr('method', 'equalto', 'PATCH') | list | length == 0
        fail_msg: >-
          Expected 3 POSTs and 0 PATCHes for empty scenario.
          Calls: {{ call_log.json }}
        success_msg: "Empty scenario passed: all 3 templates created via POST"
      when: test_empty | default(false) | bool

    - name: Stop mock server
      ansible.builtin.shell: "fuser -k {{ test_mock_port }}/tcp 2>/dev/null || true"
      changed_when: false
      when: test_empty | default(false) | bool

# ──────────────────────────────────────────────────────────────
# Test 2: Populated API responses (existing items)
# Expected: existing templates PATCHed, new ones POSTed
# ──────────────────────────────────────────────────────────────
- name: "Test publish_templates -- populated API responses"
  hosts: localhost
  gather_facts: false

  vars:
    test_mock_port: 18081

  tasks:
    - name: Kill any stale server on port
      ansible.builtin.shell: "fuser -k {{ test_mock_port }}/tcp 2>/dev/null || true"
      changed_when: false
      when: test_populated | default(false) | bool

    - name: Start mock API server (populated scenario)
      ansible.builtin.command:
        cmd: "python3 {{ playbook_dir }}/mock_api_server.py {{ test_mock_port }} populated"
      changed_when: false
      async: 30
      poll: 0
      register: mock_server
      when: test_populated | default(false) | bool

    - name: Wait for mock server to start
      ansible.builtin.wait_for:
        port: "{{ test_mock_port }}"
        timeout: 5
      when: test_populated | default(false) | bool

    - name: Run publish_templates role with existing item IDs
      ansible.builtin.include_role:
        name: osac.service.publish_templates
      vars:
        osac_fulfillment_service_uri: "http://127.0.0.1:{{ test_mock_port }}"
        osac_fulfillment_service_token: "test-token"
        publish_templates_validate_certs: false
        osac_cluster_templates:
          - id: "existing-cluster-template"
            title: "Updated Cluster"
          - id: "brand-new-cluster"
            title: "New Cluster"
        osac_compute_instance_templates:
          - id: "existing-ci-template"
            title: "Updated CI"
        # Two network roles are discovered here (as enumerate_templates would find if the
        # collection had multiple network-typed roles), but only one may be published
        # (OSAC-4073) -- "cudn_net" is selected because it's marked is_default: true, and
        # "brand-new-nc" must be skipped entirely (see the assertion below).
        osac_network_classes:
          - implementation_strategy: "cudn_net"
            fabric_manager: "cudn_net"
            title: "Updated NC"
            is_default: true
          - implementation_strategy: "brand-new-nc"
            fabric_manager: "brand-new-nc"
            title: "New NC"
      when: test_populated | default(false) | bool

    - name: Fetch API call log
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ test_mock_port }}/_calls"
        return_content: true
      register: call_log
      when: test_populated | default(false) | bool

    - name: Verify PATCH calls for existing items and POST for new
      ansible.builtin.assert:
        that:
          - call_log.json | selectattr('method', 'equalto', 'PATCH') | list | length == 3
          - call_log.json | selectattr('method', 'equalto', 'POST') | list | length == 1
          - call_log.json | selectattr('method', 'equalto', 'PATCH') | selectattr('path', 'contains', 'cluster_templates') | list | length == 1
          - call_log.json | selectattr('method', 'equalto', 'PATCH') | selectattr('path', 'contains', 'compute_instance_templates') | list | length == 1
          - call_log.json | selectattr('method', 'equalto', 'PATCH') | selectattr('path', 'contains', 'network_classes') | list | length == 1
        fail_msg: >-
          Expected 3 PATCHes (existing items) and 1 POST (new cluster template only).
          Calls: {{ call_log.json }}
        success_msg: "Populated scenario passed: 3 existing PATCHed, 1 new POSTed"
      when: test_populated | default(false) | bool

    - name: Verify the non-default network class was never published
      ansible.builtin.assert:
        that:
          - >-
            call_log.json
            | selectattr('path', 'contains', 'network_classes')
            | rejectattr('method', 'equalto', 'GET')
            | list | length == 1
          - >-
            call_log.json
            | selectattr('path', 'contains', 'network_classes')
            | rejectattr('method', 'equalto', 'GET')
            | selectattr('body.implementation_strategy', 'equalto', 'brand-new-nc')
            | list | length == 0
        fail_msg: >-
          "brand-new-nc" must not be published when "cudn_net" is the is_default role.
          Calls: {{ call_log.json }}
        success_msg: "Non-default network class role was correctly skipped"
      when: test_populated | default(false) | bool

    - name: Stop mock server
      ansible.builtin.shell: "fuser -k {{ test_mock_port }}/tcp 2>/dev/null || true"
      changed_when: false
      when: test_populated | default(false) | bool

# ──────────────────────────────────────────────────────────────
# Test 3: Edge case -- no items key at all in response
# Expected: role succeeds, all templates created via POST
# ──────────────────────────────────────────────────────────────
- name: "Test publish_templates -- no items key edge case"
  hosts: localhost
  gather_facts: false

  vars:
    test_mock_port: 18081

  tasks:
    - name: Kill any stale server on port
      ansible.builtin.shell: "fuser -k {{ test_mock_port }}/tcp 2>/dev/null || true"
      changed_when: false
      when: test_no_items_key | default(false) | bool

    - name: Start mock API server (no_items_key scenario)
      ansible.builtin.command:
        cmd: "python3 {{ playbook_dir }}/mock_api_server.py {{ test_mock_port }} no_items_key"
      changed_when: false
      async: 30
      poll: 0
      register: mock_server
      when: test_no_items_key | default(false) | bool

    - name: Wait for mock server to start
      ansible.builtin.wait_for:
        port: "{{ test_mock_port }}"
        timeout: 5
      when: test_no_items_key | default(false) | bool

    - name: Run publish_templates role against edge-case API
      ansible.builtin.include_role:
        name: osac.service.publish_templates
      vars:
        osac_fulfillment_service_uri: "http://127.0.0.1:{{ test_mock_port }}"
        osac_fulfillment_service_token: "test-token"
        publish_templates_validate_certs: false
        osac_cluster_templates:
          - id: "edge-case-cluster"
            title: "Edge Cluster"
        osac_compute_instance_templates:
          - id: "edge-case-ci"
            title: "Edge CI"
        osac_network_classes:
          - implementation_strategy: "edge-case-nc"
            fabric_manager: "edge-case-nc"
            title: "Edge NC"
      when: test_no_items_key | default(false) | bool

    - name: Fetch API call log
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ test_mock_port }}/_calls"
        return_content: true
      register: call_log
      when: test_no_items_key | default(false) | bool

    - name: Verify all templates created via POST (no items = all new)
      ansible.builtin.assert:
        that:
          - call_log.json | selectattr('method', 'equalto', 'POST') | list | length == 3
          - call_log.json | selectattr('method', 'equalto', 'PATCH') | list | length == 0
        fail_msg: >-
          Expected 3 POSTs and 0 PATCHes for no-items-key scenario.
          Calls: {{ call_log.json }}
        success_msg: "No-items-key edge case passed: all 3 templates created via POST"
      when: test_no_items_key | default(false) | bool

    - name: Stop mock server
      ansible.builtin.shell: "fuser -k {{ test_mock_port }}/tcp 2>/dev/null || true"
      changed_when: false
      when: test_no_items_key | default(false) | bool

# ──────────────────────────────────────────────────────────────
# Test 4: Explicit NetworkClass selection override (OSAC-4073)
# Expected: only the explicitly selected role is published, regardless of is_default
# ──────────────────────────────────────────────────────────────
- name: "Test publish_templates -- explicit NetworkClass selection override"
  hosts: localhost
  gather_facts: false

  vars:
    test_mock_port: 18081

  tasks:
    - name: Kill any stale server on port
      ansible.builtin.shell: "fuser -k {{ test_mock_port }}/tcp 2>/dev/null || true"
      changed_when: false
      when: test_explicit_network_class | default(false) | bool

    - name: Start mock API server (empty scenario)
      ansible.builtin.command:
        cmd: "python3 {{ playbook_dir }}/mock_api_server.py {{ test_mock_port }} empty"
      changed_when: false
      async: 30
      poll: 0
      register: mock_server
      when: test_explicit_network_class | default(false) | bool

    - name: Wait for mock server to start
      ansible.builtin.wait_for:
        port: "{{ test_mock_port }}"
        timeout: 5
      when: test_explicit_network_class | default(false) | bool

    - name: Run publish_templates role with an explicit implementation_strategy override
      ansible.builtin.include_role:
        name: osac.service.publish_templates
      vars:
        osac_fulfillment_service_uri: "http://127.0.0.1:{{ test_mock_port }}"
        osac_fulfillment_service_token: "test-token"
        publish_templates_validate_certs: false
        publish_templates_network_class_implementation_strategy: "netris"
        osac_cluster_templates: []
        osac_compute_instance_templates: []
        # Neither role is marked is_default -- the explicit override must still win.
        osac_network_classes:
          - implementation_strategy: "cudn_net"
            fabric_manager: "cudn_net"
            title: "CUDN NC"
          - implementation_strategy: "netris"
            fabric_manager: "netris"
            title: "Netris NC"
      when: test_explicit_network_class | default(false) | bool

    - name: Fetch API call log
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ test_mock_port }}/_calls"
        return_content: true
      register: call_log
      when: test_explicit_network_class | default(false) | bool

    - name: Verify only the explicitly selected role was published
      ansible.builtin.assert:
        that:
          - >-
            call_log.json
            | selectattr('path', 'contains', 'network_classes')
            | rejectattr('method', 'equalto', 'GET')
            | list | length == 1
          - >-
            call_log.json
            | selectattr('path', 'contains', 'network_classes')
            | rejectattr('method', 'equalto', 'GET')
            | map(attribute='body') | map(attribute='implementation_strategy')
            | list == ['netris']
        fail_msg: >-
          Expected exactly one network_classes call, for "netris" only.
          Calls: {{ call_log.json }}
        success_msg: "Explicit override correctly selected 'netris' over the non-default 'cudn_net'"
      when: test_explicit_network_class | default(false) | bool

    - name: Stop mock server
      ansible.builtin.shell: "fuser -k {{ test_mock_port }}/tcp 2>/dev/null || true"
      changed_when: false
      when: test_explicit_network_class | default(false) | bool

# ──────────────────────────────────────────────────────────────
# Test 5: Ambiguous NetworkClass selection (OSAC-4073)
# Expected: role fails with a clear error instead of attempting to publish every role
# ──────────────────────────────────────────────────────────────
- name: "Test publish_templates -- ambiguous NetworkClass selection fails clearly"
  hosts: localhost
  gather_facts: false

  vars:
    test_mock_port: 18081

  tasks:
    - name: Kill any stale server on port
      ansible.builtin.shell: "fuser -k {{ test_mock_port }}/tcp 2>/dev/null || true"
      changed_when: false
      when: test_ambiguous_network_class | default(false) | bool

    - name: Start mock API server (empty scenario)
      ansible.builtin.command:
        cmd: "python3 {{ playbook_dir }}/mock_api_server.py {{ test_mock_port }} empty"
      changed_when: false
      async: 30
      poll: 0
      register: mock_server
      when: test_ambiguous_network_class | default(false) | bool

    - name: Wait for mock server to start
      ansible.builtin.wait_for:
        port: "{{ test_mock_port }}"
        timeout: 5
      when: test_ambiguous_network_class | default(false) | bool

    # A block/rescue is used here instead of register + ignore_errors: the failing task
    # lives inside network_classes.yaml, which the role statically imports -- ignore_errors
    # on the outer include_role task does not reliably propagate down to it. ansible_failed_result
    # (only set inside rescue:) reliably captures the failure regardless of how it's nested.
    - name: Run publish_templates role with two non-default roles and no override
      when: test_ambiguous_network_class | default(false) | bool
      block:
        - name: Include publish_templates role
          ansible.builtin.include_role:
            name: osac.service.publish_templates
          vars:
            osac_fulfillment_service_uri: "http://127.0.0.1:{{ test_mock_port }}"
            osac_fulfillment_service_token: "test-token"
            publish_templates_validate_certs: false
            osac_cluster_templates: []
            osac_compute_instance_templates: []
            osac_network_classes:
              - implementation_strategy: "cudn_net"
                fabric_manager: "cudn_net"
                title: "CUDN NC"
              - implementation_strategy: "netris"
                fabric_manager: "netris"
                title: "Netris NC"

        - name: Fail the test if the role did not raise an error
          ansible.builtin.fail:
            msg: >-
              Expected publish_templates to fail on ambiguous NetworkClass selection
              (two roles, neither is_default, no override), but it completed successfully.
      rescue:
        - name: Verify the role failed with a clear, actionable error
          ansible.builtin.assert:
            that:
              - "'is_default' in (ansible_failed_result.msg | default(''))"
            fail_msg: >-
              Expected the role to fail with an error mentioning 'is_default'.
              Result: {{ ansible_failed_result }}
            success_msg: "Role correctly failed with a clear error instead of attempting all discovered roles"

    - name: Stop mock server
      ansible.builtin.shell: "fuser -k {{ test_mock_port }}/tcp 2>/dev/null || true"
      changed_when: false
      when: test_ambiguous_network_class | default(false) | bool
