---
- name: "cumulus: remove port VLAN configuration using nvue"
  raw: |
    flock /tmp/nvue.lock -c '
      set -e
      nv unset interface {{ port_name }} bridge domain
      if diff="$(nv config diff --output commands)"; then
        diff_status=0
      else
        diff_status=$?
      fi
      if [ "$diff_status" -gt 1 ]; then
        exit "$diff_status"
      fi
      if [ "$diff_status" -eq 1 ] && [ -z "$diff" ]; then
        exit "$diff_status"
      fi
      if [ -n "$diff" ]; then
        case "$diff" in
          "nv set "*|"nv unset "*) ;;
          *) exit 1 ;;
        esac
        nv config apply -y
      fi
    '
