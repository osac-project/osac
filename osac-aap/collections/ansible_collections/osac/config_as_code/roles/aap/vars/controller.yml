controller_schedules: # noqa: var-naming[no-role-prefix]
  # Sync project every 10min to get the latest updates from the git repository
  - name: "{{ aap_prefix }}-sync"
    description: "Periodic sync job for {{ aap_project_name }} project"
    organization: "{{ aap_organization_name }}"
    unified_job_template: "{{ aap_prefix }}"
    rrule: "DTSTART:20250331T144500Z RRULE:FREQ=MINUTELY;INTERVAL=10"
  # Run config-as-code template every hour to apply new changes, if any
  - name: "{{ aap_prefix }}-config-as-code"
    description: "Periodic run of config-as-code"
    organization: "{{ aap_organization_name }}"
    unified_job_template: "{{ aap_prefix }}-config-as-code"
    rrule: "DTSTART:20250331T144500Z RRULE:FREQ=HOURLY;INTERVAL=1"
  - name: "{{ aap_prefix }}-publish-templates"
    description: "Periodic run of publish-templates"
    organization: "{{ aap_organization_name }}"
    unified_job_template: "{{ aap_prefix }}-publish-templates"
    rrule: "DTSTART:20250513T111500Z RRULE:FREQ=MINUTELY;INTERVAL=30"
    enabled: "{{ osac_publish_templates_enabled }}"
  - name: "{{ aap_prefix }}-import-agents"
    description: "Periodic agent import reconciliation"
    organization: "{{ aap_organization_name }}"
    unified_job_template: "{{ aap_prefix }}-import-agents"
    rrule: "DTSTART:20250331T144500Z RRULE:FREQ=MINUTELY;INTERVAL=10"
    enabled: "{{ osac_import_agents_enabled }}"
  - name: "{{ aap_prefix }}-import-bcm-agents"
    description: "Periodic BCM agent import reconciliation"
    organization: "{{ aap_organization_name }}"
    unified_job_template: "{{ aap_prefix }}-import-bcm-agents"
    rrule: "DTSTART:20250519T120000Z RRULE:FREQ=MINUTELY;INTERVAL=10"
    enabled: "{{ osac_import_bcm_agents_enabled }}"

# Create custom execution environments
controller_execution_environments: # noqa: var-naming[no-role-prefix]
  - name: "{{ aap_prefix }}-ee"
    organization: "{{ aap_organization_name }}"
    image: "{{ aap_ee_image }}"
    pull: "{{ aap_ee_image_pull }}"

# Customize pod templates in order to inject the configuration and the
# credentials when the template are run, that way Kubernetes is the source
# of truth for the secrets, and we don't need to sync credentials into AAP
controller_instance_groups: # noqa: var-naming[no-role-prefix]
  # For cluster-fulfillment use cases, we want to allow KubeAPI access to the
  # cluster the pod works on, so we mount the credentials for the osac
  # ServiceAccount. All other credentials (AWS, Openstack, ...) that would be
  # required by the playbooks are expected to be specified in the
  # (prefix)-cluster-fulfilment-ig secret.
  - name: "{{ aap_prefix }}-cluster-fulfillment-ig"
    is_container_group: true
    pod_spec_override: |
      apiVersion: v1
      kind: Pod
      metadata:
        labels:
          ansible_job: ''
      spec:
        serviceAccountName: osac-sa
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                      - key: ansible_job
                        operator: Exists
                  topologyKey: kubernetes.io/hostname
        containers:
          - image: >-
              registry.redhat.io/ansible-automation-platform-25/ee-supported-rhel8@sha256:d8400a472e769d0f3d591dafaad318522009c583b08e881c23b6d57a27cc10ed
            name: worker
            args:
              - ansible-runner
              - worker
              - '--private-data-dir=/runner'
            volumeMounts:
              - name: kube-api-access
                mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                readOnly: true
              - name: import-agents-inventory
                mountPath: /var/config/import-agents
                readOnly: true
              - name: agentless-net-inventory
                mountPath: /var/config/agentless-net
                readOnly: true
              - name: bcm-certs
                mountPath: /var/secrets/bcm-certs
                readOnly: true
            env:
              - name: POD_NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: POD_UID
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.uid
            envFrom:
              - configMapRef:
                  name: cluster-fulfillment-ig
                  optional: true
              - secretRef:
                  name: cluster-fulfillment-ig
        volumes:
        - name: bcm-certs
          secret:
            secretName: bcm-certs
            optional: true
        - name: kube-api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
              - configMap:
                  name: openshift-service-ca.crt
                  items:
                    - key: service-ca.crt
                      path: service-ca.crt
            defaultMode: 420
        - name: import-agents-inventory
          configMap:
            name: import-agents-inventory
            optional: true
        - name: agentless-net-inventory
          configMap:
            name: agentless-net-inventory
            optional: true
  # For config-as-code job template, we expect the configuration and the
  # credentials to be passed in (prefix)-config-as-code-ig secret
  - name: "{{ aap_prefix }}-config-as-code-ig"
    is_container_group: true
    pod_spec_override: |
      apiVersion: v1
      kind: Pod
      metadata:
        labels:
          ansible_job: ''
      spec:
        serviceAccountName: default
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                      - key: ansible_job
                        operator: Exists
                  topologyKey: kubernetes.io/hostname
        containers:
          - image: >-
              registry.redhat.io/ansible-automation-platform-25/ee-supported-rhel8@sha256:d8400a472e769d0f3d591dafaad318522009c583b08e881c23b6d57a27cc10ed
            name: worker
            args:
              - ansible-runner
              - worker
              - '--private-data-dir=/runner'
            envFrom:
              - secretRef:
                  name: config-as-code-ig
                  optional: true
            env:
              - name: NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              - name: AAP_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: osac-aap-admin-password
                    key: password
              - name: LICENSE_MANIFEST_PATH
                value: /var/secrets/config-as-code/license.zip
            volumeMounts:
              - name: config-as-code-manifest-volume
                mountPath: /var/secrets/config-as-code
                readOnly: true
        volumes:
          - name: config-as-code-manifest-volume
            secret:
              secretName: config-as-code-manifest-ig
  - name: "{{ aap_prefix }}-publish-templates-ig"
    is_container_group: true
    pod_spec_override: |
      apiVersion: v1
      kind: Pod
      metadata:
        labels:
          ansible_job: ''
      spec:
        serviceAccountName: template-publisher
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                      - key: ansible_job
                        operator: Exists
                  topologyKey: kubernetes.io/hostname
        containers:
          - image: >-
              registry.redhat.io/ansible-automation-platform-25/ee-supported-rhel8@sha256:d8400a472e769d0f3d591dafaad318522009c583b08e881c23b6d57a27cc10ed
            name: worker
            args:
              - ansible-runner
              - worker
              - '--private-data-dir=/runner'
            volumeMounts:
              - name: kube-api-access
                mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                readOnly: true
              - name: cas
                mountPath: /certs
            envFrom:
              - configMapRef:
                  name: publish-templates-ig
                  optional: true
            env:
              - name: OSAC_PUBLISH_TEMPLATES_NAMESPACE_DEFAULT
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              - name: SSL_CERT_FILE
                value: /certs/bundle.pem
        volumes:
          - name: kube-api-access
            projected:
              sources:
                - serviceAccountToken:
                    path: token
                    expirationSeconds: 3600
                - configMap:
                    name: kube-root-ca.crt
                    items:
                      - key: ca.crt
                        path: ca.crt
                - downwardAPI:
                    items:
                      - path: namespace
                        fieldRef:
                          apiVersion: v1
                          fieldPath: metadata.namespace
                - configMap:
                    name: openshift-service-ca.crt
                    items:
                      - key: service-ca.crt
                        path: service-ca.crt
              defaultMode: 420
          - name: cas
            configMap:
              name: ca-bundle
  - name: "{{ aap_prefix }}-create-hosted-cluster-post-install-ig"
    is_container_group: true

  - name: "{{ aap_prefix }}-compute-instance-operations-ig"
    is_container_group: true
    pod_spec_override: "{{ lookup('ansible.builtin.template', 'compute-instance-operations-ig.j2') }}"

  - name: "{{ aap_prefix }}-networking-operations-ig"
    is_container_group: true
    pod_spec_override: "{{ lookup('ansible.builtin.template', 'networking-operations-ig.j2') }}"

  - name: "{{ aap_prefix }}-bare-metal-fulfillment-ig"
    is_container_group: true
    pod_spec_override: |
      apiVersion: v1
      kind: Pod
      metadata:
        labels:
          ansible_job: ''
      spec:
        serviceAccountName: osac-sa
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                      - key: ansible_job
                        operator: Exists
                  topologyKey: kubernetes.io/hostname
        containers:
          - image: >-
              registry.redhat.io/ansible-automation-platform-25/ee-supported-rhel8@sha256:d8400a472e769d0f3d591dafaad318522009c583b08e881c23b6d57a27cc10ed
            name: worker
            args:
              - ansible-runner
              - worker
              - '--private-data-dir=/runner'
            volumeMounts:
              - name: kube-api-access
                mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                readOnly: true
              - name: os-clouds
                mountPath: /etc/openstack
                readOnly: true
            env:
              - name: POD_NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              - name: OS_CLIENT_CONFIG_FILE
                value: /etc/openstack/clouds.yaml
            envFrom:
              - secretRef:
                  name: bare-metal-fulfillment-ig
                  optional: true
        volumes:
          - name: kube-api-access
            projected:
              sources:
                - serviceAccountToken:
                    path: token
                    expirationSeconds: 3600
                - configMap:
                    name: kube-root-ca.crt
                    items:
                      - key: ca.crt
                        path: ca.crt
                - downwardAPI:
                    items:
                      - path: namespace
                        fieldRef:
                          apiVersion: v1
                          fieldPath: metadata.namespace
                - configMap:
                    name: openshift-service-ca.crt
                    items:
                      - key: service-ca.crt
                        path: service-ca.crt
              defaultMode: 420
          - name: os-clouds
            secret:
              secretName: osac-os-clouds
              items:
                - key: clouds.yaml
                  path: clouds.yaml
              defaultMode: 420
              optional: true

  - name: "{{ aap_prefix }}-storage-operations-ig"
    is_container_group: true
    pod_spec_override: "{{ lookup('ansible.builtin.template', 'storage-operations-ig.j2') }}"
