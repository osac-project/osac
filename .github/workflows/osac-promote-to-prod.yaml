name: OSAC Promote to Production

# Promotes an already-staged OSAC release to production by creating a
# SECOND Konflux Release against the exact Snapshot a prior
# osac-release.yaml dispatch already built, tested, and shipped to
# registry.stage.redhat.io -- never a rebuild. The point of a staging gate
# is that what ships to production is bit-for-bit what was already
# validated, not a fresh build of "the same" version that could in
# principle differ.
#
# Deliberately a standalone workflow, not a third `mode:` on
# osac-build-and-publish.yaml: that pipeline's jobs (build, test, tag) are
# all structured around building from source, and bolting a no-build/
# no-test/just-release operation onto it would mean heavily
# conditionalizing nearly every existing job for no benefit, risking the
# proven staging path.
#
# Deliberately duplicates (rather than imports) trigger-konflux-staging-
# release's/trigger-konflux-chart-staging-release's own apply_release/
# poll_release Python helpers in osac-build-and-publish.yaml -- a shared-
# extraction refactor is a reasonable future follow-up once this promotion
# path itself is proven, but touching the proven staging path's inline
# logic now would add risk for no immediate benefit. If you're tempted to
# "fix" this duplication, make sure promotion has actually shipped
# successfully a few times first.
#
# Both mutating jobs below sit behind the "production" GitHub Environment
# approval gate (Settings -> Environments -- a manual, one-time repo
# setup action, not something this file can create). resolve-and-verify
# itself is read-only and ungated: there's no reason to make a human
# approve before even checking whether promotion is possible.
#
# That manual setup MUST happen before this workflow is ever dispatched,
# not just "at some point": GitHub auto-creates an environment the first
# time a workflow run references one by name, with NO protection rules
# (no required reviewers) unless one already exists under that name. A
# premature first dispatch would silently create an unprotected
# "production" environment and sail straight through promote-image/
# promote-chart with no approval at all -- the opposite of the gate this
# workflow exists to provide. Confirm the environment already has
# required reviewers configured (Settings -> Environments -> production)
# before the first-ever dispatch, not after.
#
# cloud-extensions-prod/osac-charts-prod do not exist in Konflux yet
# (tracked under OSAC-1090, a GitLab MR outside this repo) -- this
# workflow cannot succeed until that lands. resolve-and-verify's
# ReleasePlan check is what surfaces that cleanly instead of this
# workflow hanging or failing cryptically.

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: >-
          The umbrella chart version being promoted (e.g. 0.4.0) --
          informational only (run name, Slack message); not used to
          compute anything, since the two inputs below already name the
          exact Snapshots directly.
        type: string
        required: true
      image_snapshot:
        description: >-
          The exact image Snapshot name to promote (e.g.
          osac-release-v0-4-0-attempt1) -- copy this verbatim from the
          "Image Snapshot (for prod promotion)" line in the Slack message
          osac-release.yaml posted for this release.
        type: string
        required: true
      chart_snapshot:
        description: >-
          The exact chart Snapshot name to promote (e.g.
          osac-charts-release-v0-4-0-attempt1) -- copy this verbatim from
          the same Slack message's "Chart Snapshot" line. Deliberately a
          separate input from image_snapshot rather than one shared
          "attempt" number: a "Re-run failed jobs" attempt that only
          re-ran one of the two staging jobs (image or chart) leaves the
          other on its original attempt, so the two Snapshots can
          legitimately have different attempt numbers.
        type: string
        required: true

concurrency:
  group: osac-promote-to-prod-${{ github.event.inputs.release_version }}
  cancel-in-progress: false

permissions: {}

jobs:
  resolve-and-verify:
    name: Resolve Snapshot names and verify they still exist
    runs-on: osac-ci
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      image-snapshot: ${{ steps.validate.outputs.image-snapshot }}
      chart-snapshot: ${{ steps.validate.outputs.chart-snapshot }}
      image-ready: ${{ steps.verify.outputs.image-ready }}
      chart-ready: ${{ steps.verify.outputs.chart-ready }}
    env:
      RELEASE_VERSION: ${{ github.event.inputs.release_version }}
      IMAGE_SNAPSHOT_INPUT: ${{ github.event.inputs.image_snapshot }}
      CHART_SNAPSHOT_INPUT: ${{ github.event.inputs.chart_snapshot }}

    steps:
    - name: Validate Snapshot name inputs
      id: validate
      run: |
        set -euo pipefail
        if [[ ! "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::release_version '${RELEASE_VERSION}' is not a plain X.Y.Z semver" >&2
          exit 1
        fi
        SLUG="${RELEASE_VERSION//./-}"

        # Each Snapshot name must encode release_version (only the
        # attempt number may differ between the two, per the "Re-run
        # failed jobs only re-runs failed jobs" reasoning above) --
        # otherwise an operator could accidentally pair a staged image
        # Snapshot from one release with a staged chart Snapshot from a
        # completely different one, and this workflow would promote and
        # report them as a single, coherent release.
        validate_name() {
          local name="$1" label="$2" expected_prefix="$3"
          if [[ ! "${name}" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ ]]; then
            echo "::error::${label}_snapshot '${name}' is not a valid Kubernetes resource name" >&2
            exit 1
          fi
          if [[ ! "${name}" =~ ^${expected_prefix}-v${SLUG}-attempt[0-9]+$ ]]; then
            echo "::error::${label}_snapshot '${name}' does not match release_version '${RELEASE_VERSION}' -- expected a name like '${expected_prefix}-v${SLUG}-attempt<N>', got '${name}'. The image and chart Snapshots must both belong to the SAME release; only their attempt numbers may differ." >&2
            exit 1
          fi
        }
        validate_name "${IMAGE_SNAPSHOT_INPUT}" "image" "osac-release"
        validate_name "${CHART_SNAPSHOT_INPUT}" "chart" "osac-charts-release"
        echo "image-snapshot=${IMAGE_SNAPSHOT_INPUT}" >> "$GITHUB_OUTPUT"
        echo "chart-snapshot=${CHART_SNAPSHOT_INPUT}" >> "$GITHUB_OUTPUT"

    - name: Log in to Konflux cluster
      uses: redhat-actions/oc-login@2a1614bc977c054c8786c8e35fc9534bd0ddc156  # v2.0.1
      with:
        openshift_server_url: https://api.kflux-prd-rh02.0fk9.p1.openshiftapps.com:6443
        openshift_token: ${{ secrets.KONFLUX_SA_TOKEN }}
        namespace: osac-tenant

    - name: Verify Snapshots and prod ReleasePlans exist
      id: verify
      env:
        IMAGE_SNAPSHOT: ${{ steps.validate.outputs.image-snapshot }}
        CHART_SNAPSHOT: ${{ steps.validate.outputs.chart-snapshot }}
      run: |
        set -euo pipefail
        NAMESPACE=osac-tenant

        # A Snapshot exists as soon as the staging job applies it -- that
        # happens BEFORE its integration tests run and BEFORE the staging
        # Release even gets created, let alone succeeds. Existence alone
        # is not evidence the content was ever actually validated or
        # shipped to staging, so check three things, not one:
        #  1. The Snapshot exists (distinguishing a genuine NotFound from
        #     an auth/network error, which must not be silently treated
        #     the same as "never shipped").
        #  2. Its integration tests actually passed
        #     (AppStudioTestSucceeded=True -- the real Konflux Integration
        #     Service condition for this, not a project-specific one).
        #  3. A real Release against the STAGING ReleasePlan for this
        #     exact Snapshot reached Released=True -- not by assuming a
        #     specific Release name (a retried staging release's
        #     successful Release is named "<snapshot>-retryN", not the
        #     snapshot's own name), but by searching every Release in the
        #     namespace for one whose spec actually references this
        #     Snapshot.
        # These functions print one of three words, not a plain boolean:
        # "true" (confirmed ready), "false" (a completed lookup that
        # affirmatively shows the Snapshot/ReleasePlan is not eligible --
        # e.g. a clean NotFound, or tests/release never succeeded), or
        # "error" (the lookup itself failed -- auth/network/etc). "error"
        # must never be silently folded into "false": doing so would let
        # a transient infra failure on, say, the image lookup read back
        # as "image isn't ready", which promote-chart's own gating
        # condition (image-ready != 'true' allows chart through) would
        # then treat as "image promotion was never attempted" rather than
        # "we don't actually know" -- letting chart promote while image's
        # real status is unknown instead of stopping outright.
        check_snapshot() {
          local name="$1" label="$2" stage_plan="$3"
          local get_output
          if ! get_output=$(oc get snapshot "${name}" -n "${NAMESPACE}" -o json 2>&1); then
            if [[ "${get_output}" == *"NotFound"* ]]; then
              echo "::warning::${label} Snapshot '${name}' not found -- it may have been pruned, or this name was never actually produced by a real osac-release.yaml dispatch. Double-check it against that release's Slack message; re-run osac-release.yaml fresh instead of promoting if it genuinely never shipped. This workflow will skip ${label} promotion." >&2
              echo "false"
            else
              # The raw oc output is logged as a plain, un-annotated line
              # (not through ::error::) -- GitHub surfaces ::error::/
              # ::warning:: annotations prominently in the PR checks UI,
              # so API error text that could echo back auth/hostname
              # details only goes to the step's own raw log, which
              # requires deliberately opening it.
              echo "${label} Snapshot lookup for '${name}' failed: ${get_output}" >&2
              echo "::error::${label} Snapshot lookup for '${name}' failed with an error other than NotFound (auth/network issue?) -- see the plain-text line just above in this step's raw log for details, deliberately not repeated in this annotation." >&2
              echo "error"
            fi
            return
          fi

          local tests_ok
          tests_ok=$(jq -r '[.status.conditions[]? | select(.type == "AppStudioTestSucceeded" and .status == "True")] | length > 0' <<<"${get_output}")
          if [[ "${tests_ok}" != "true" ]]; then
            echo "::warning::${label} Snapshot '${name}' exists but never reached AppStudioTestSucceeded=True -- its integration tests never passed, refusing to treat it as promotable." >&2
            echo "false"
            return
          fi

          local released_ok releases_json
          if ! releases_json=$(oc get release -n "${NAMESPACE}" -o json 2>&1); then
            echo "${label} Release list failed: ${releases_json}" >&2
            echo "::error::${label} Release list failed (auth/network issue?) -- see the plain-text line just above in this step's raw log for details, deliberately not repeated in this annotation." >&2
            echo "error"
            return
          fi
          released_ok=$(jq -r --arg snap "${name}" --arg plan "${stage_plan}" '
            [.items[]?
              | select(.spec.snapshot == $snap and .spec.releasePlan == $plan)
              | select([.status.conditions[]? | select(.type == "Released" and .status == "True")] | length > 0)
            ] | length > 0
          ' <<<"${releases_json}")
          if [[ "${released_ok}" != "true" ]]; then
            echo "::warning::${label} Snapshot '${name}' passed its tests, but no Release against '${stage_plan}' for it ever reached Released=True -- the staging release itself never succeeded, refusing to treat it as promotable." >&2
            echo "false"
            return
          fi

          echo "true"
        }

        check_releaseplan() {
          local name="$1" label="$2"
          local get_output
          if get_output=$(oc get releaseplan "${name}" -n "${NAMESPACE}" 2>&1); then
            echo "true"
          else
            if [[ "${get_output}" == *"NotFound"* ]]; then
              echo "::warning::${label} prod ReleasePlan '${name}' not found -- OSAC-1090 has not landed yet (or landed under a different name than expected). ${label} promotion will be skipped." >&2
              echo "false"
            else
              echo "${label} ReleasePlan lookup for '${name}' failed: ${get_output}" >&2
              echo "::error::${label} ReleasePlan lookup for '${name}' failed with an error other than NotFound (auth/network issue?) -- see the plain-text line just above in this step's raw log for details, deliberately not repeated in this annotation." >&2
              echo "error"
            fi
          fi
        }

        image_snapshot_ok=$(check_snapshot "${IMAGE_SNAPSHOT}" "image" "cloud-extensions-stage")
        chart_snapshot_ok=$(check_snapshot "${CHART_SNAPSHOT}" "chart" "osac-charts-stage")
        image_plan_ok=$(check_releaseplan "cloud-extensions-prod" "image")
        chart_plan_ok=$(check_releaseplan "osac-charts-prod" "chart")

        # A lookup that genuinely failed (not a clean "doesn't exist")
        # must stop this job outright, not be silently treated as
        # "unready" -- see the check_snapshot header comment above for
        # why that distinction matters for promote-chart's own gating.
        for result in "${image_snapshot_ok}" "${chart_snapshot_ok}" "${image_plan_ok}" "${chart_plan_ok}"; do
          if [[ "${result}" == "error" ]]; then
            echo "::error::A lookup failed with a genuine error (not a clean not-found) -- stopping rather than silently treating this release as unpromotable. See the ::error:: messages above for which lookup failed and why." >&2
            exit 1
          fi
        done

        image_ready=false
        [[ "${image_snapshot_ok}" == "true" && "${image_plan_ok}" == "true" ]] && image_ready=true
        chart_ready=false
        [[ "${chart_snapshot_ok}" == "true" && "${chart_plan_ok}" == "true" ]] && chart_ready=true

        echo "image-ready=${image_ready}" >> "$GITHUB_OUTPUT"
        echo "chart-ready=${chart_ready}" >> "$GITHUB_OUTPUT"

        if [[ "${image_ready}" != "true" && "${chart_ready}" != "true" ]]; then
          echo "::error::Neither image (${IMAGE_SNAPSHOT}) nor chart (${CHART_SNAPSHOT}) promotion is possible -- see warnings above" >&2
          exit 1
        fi

  promote-image:
    name: Promote image Snapshot to production
    needs: resolve-and-verify
    if: needs.resolve-and-verify.outputs.image-ready == 'true'
    environment: production
    runs-on: osac-ci
    timeout-minutes: 100
    permissions:
      contents: read
    env:
      IMAGE_SNAPSHOT: ${{ needs.resolve-and-verify.outputs.image-snapshot }}

    steps:
    - name: Log in to Konflux cluster
      uses: redhat-actions/oc-login@2a1614bc977c054c8786c8e35fc9534bd0ddc156  # v2.0.1
      with:
        openshift_server_url: https://api.kflux-prd-rh02.0fk9.p1.openshiftapps.com:6443
        openshift_token: ${{ secrets.KONFLUX_SA_TOKEN }}
        namespace: osac-tenant

    - name: Create and poll prod Release
      run: |
        set -euo pipefail
        python3 - <<'PYEOF'
        import json
        import os
        import subprocess
        import sys
        import time

        SNAPSHOT = os.environ["IMAGE_SNAPSHOT"]
        NAMESPACE = "osac-tenant"
        RELEASE_PLAN = "cloud-extensions-prod"
        POLL_INTERVAL_SECONDS = 30
        MAX_RELEASE_ATTEMPTS = 3
        TIMEOUT_SECONDS = 80 * 60
        RETRY_TIMEOUT_SECONDS = 30 * 60

        def condition_true(conditions, cond_type):
            return any(c.get("type") == cond_type and c.get("status") == "True" for c in conditions)

        def condition_false(conditions, cond_type):
            return any(c.get("type") == cond_type and c.get("status") == "False" for c in conditions)

        def is_permanent_auth_error(stderr):
            lowered = stderr.lower()
            return "unauthorized" in lowered or "forbidden" in lowered

        def apply_release(release_file, release_name, max_apply_retries=3, apply_retry_seconds=15):
            for i in range(1, max_apply_retries + 1):
                try:
                    subprocess.run(["oc", "apply", "-f", release_file], capture_output=True, text=True, check=True)
                    return
                except subprocess.CalledProcessError as e:
                    stderr = e.stderr or ""
                    if is_permanent_auth_error(stderr):
                        print(f"::error::oc apply failed with a permanent auth/RBAC error: {stderr.strip()}")
                        raise
                    if i == max_apply_retries:
                        print(f"::error::oc apply failed {max_apply_retries} times for {release_name}: {stderr.strip()}")
                        raise
                    print(f"::warning::oc apply failed for {release_name}, retrying same apply: {stderr.strip()}")
                    time.sleep(apply_retry_seconds)

        def poll_release(release_name, timeout_seconds):
            deadline = time.time() + timeout_seconds
            while time.time() < deadline:
                try:
                    out = subprocess.run(
                        ["oc", "get", "release", release_name, "-n", NAMESPACE, "-o", "json"],
                        capture_output=True, text=True, check=True,
                    )
                except subprocess.CalledProcessError as e:
                    stderr = e.stderr or ""
                    if is_permanent_auth_error(stderr):
                        print(f"::error::oc get release failed with a permanent auth/RBAC error: {stderr.strip()}")
                        raise
                    print(f"::warning::oc get release failed, will retry: {stderr.strip()}", flush=True)
                    time.sleep(POLL_INTERVAL_SECONDS)
                    continue
                conditions = json.loads(out.stdout).get("status", {}).get("conditions", [])
                if condition_true(conditions, "Released"):
                    print(f"::notice::Konflux production release succeeded: {release_name}")
                    return "succeeded"
                if condition_false(conditions, "Released") and any(
                    c.get("type") == "Released" and c.get("reason") == "Failed" for c in conditions
                ):
                    print(f"::warning::Konflux production release failed: {release_name}")
                    return "failed"
                if conditions:
                    summary = "; ".join(
                        f"{c.get('type')}={c.get('status')} ({c.get('reason')}: {c.get('message')})"
                        for c in conditions
                    )
                else:
                    summary = f"Waiting on {release_name} -- no conditions yet"
                print(f"[{release_name}] {summary}", flush=True)
                time.sleep(POLL_INTERVAL_SECONDS)
            print(f"::warning::Timed out waiting for {release_name}")
            return "timeout"

        # The "-prod" suffix matters: SNAPSHOT is also the name the
        # STAGING Release CR already used as its own metadata.name
        # (confirmed by reading both resource_name/release_name formulas
        # in osac-build-and-publish.yaml side by side). Reusing that name
        # here for the prod Release would make `oc apply` 3-way-merge
        # against the live, already-Released staging Release object
        # instead of creating a new one.
        #
        # A name derived from SNAPSHOT alone (with no per-dispatch
        # component) is also not safe across SEPARATE workflow dispatches:
        # if all MAX_RELEASE_ATTEMPTS fail and someone re-dispatches this
        # workflow (or re-runs the failed job) for the same release, `oc
        # apply` would find the same already-Failed Release objects still
        # sitting in the cluster and poll_release would immediately read
        # back their old Failed condition -- a failed promotion would be
        # unrecoverable. RUN_TAG makes every dispatch's names unique.
        RUN_TAG = f"r{os.environ['GITHUB_RUN_ID']}a{os.environ['GITHUB_RUN_ATTEMPT']}"

        # Don't create a redundant prod Release if a prior dispatch
        # already promoted this exact Snapshot to this exact ReleasePlan
        # successfully.
        existing = subprocess.run(
            ["oc", "get", "release", "-n", NAMESPACE, "-o", "json"],
            capture_output=True, text=True, check=True,
        )
        for item in json.loads(existing.stdout).get("items", []):
            spec = item.get("spec", {})
            if spec.get("snapshot") == SNAPSHOT and spec.get("releasePlan") == RELEASE_PLAN:
                conditions = item.get("status", {}).get("conditions", [])
                if condition_true(conditions, "Released"):
                    print(f"::notice::{SNAPSHOT} was already promoted to {RELEASE_PLAN} by {item['metadata']['name']} -- nothing to do")
                    sys.exit(0)
                # Release names include RUN_TAG, so each dispatch creates
                # a distinct object -- a Release that's merely still
                # in-flight (not yet Released=True, and not terminally
                # Failed either) would NOT be caught by the check above,
                # letting a second dispatch race ahead and create another
                # Release for the same Snapshot while the first is still
                # running. Only a confirmed terminal Failed is safe to
                # proceed past; anything else must block.
                is_terminal_failure = any(
                    c.get("type") == "Released" and c.get("status") == "False" and c.get("reason") == "Failed"
                    for c in conditions
                )
                if not is_terminal_failure:
                    print(f"::error::Release {item['metadata']['name']} for {SNAPSHOT} against {RELEASE_PLAN} is still in flight -- not creating a second one. Wait for it to finish or delete it, then re-dispatch.")
                    sys.exit(1)

        released = False
        for attempt_num in range(1, MAX_RELEASE_ATTEMPTS + 1):
            release_name = f"{SNAPSHOT}-prod-{RUN_TAG}" if attempt_num == 1 else f"{SNAPSHOT}-prod-{RUN_TAG}-retry{attempt_num - 1}"
            release = {
                "apiVersion": "appstudio.redhat.com/v1alpha1",
                "kind": "Release",
                "metadata": {"name": release_name, "namespace": NAMESPACE},
                "spec": {"releasePlan": RELEASE_PLAN, "snapshot": SNAPSHOT},
            }
            with open("/tmp/prod-release.json", "w") as f:
                json.dump(release, f)
            apply_release("/tmp/prod-release.json", release_name)
            print(f"Created Release {release_name} (attempt {attempt_num}/{MAX_RELEASE_ATTEMPTS})")
            outcome = poll_release(release_name, TIMEOUT_SECONDS if attempt_num == 1 else RETRY_TIMEOUT_SECONDS)
            if outcome == "succeeded":
                released = True
                break
            if outcome == "timeout":
                print(f"::error::Timed out waiting for {release_name} -- not retrying, to avoid a second Release racing the same Snapshot")
                sys.exit(1)
            # outcome == "failed": a confirmed terminal condition, so the
            # next loop iteration's new release_name is safe.

        if not released:
            print(f"::error::Production release failed after {MAX_RELEASE_ATTEMPTS} attempts: {SNAPSHOT}")
            sys.exit(1)
        PYEOF

  promote-chart:
    name: Promote chart Snapshot to production
    # Gated on promote-image's own result too (not just resolve-and-
    # verify's chart-ready), mirroring the staging pipeline's own
    # chart-depends-on-image-release ordering: the chart references
    # specific image tags, so it should never ship after an attempted
    # image promotion has failed. Still runs when image promotion was
    # never attempted at all (image-ready == 'false'), since that's an
    # independent, orthogonal reason to skip -- only an attempted-and-
    # failed image promotion blocks chart promotion.
    needs: [resolve-and-verify, promote-image]
    if: |
      always() &&
      needs.resolve-and-verify.outputs.chart-ready == 'true' &&
      (
        needs.resolve-and-verify.outputs.image-ready != 'true' ||
        needs.promote-image.result == 'success'
      )
    environment: production
    runs-on: osac-ci
    timeout-minutes: 100
    continue-on-error: true
    permissions:
      contents: read
    outputs:
      release-outcome: ${{ steps.release.outcome }}
    env:
      CHART_SNAPSHOT: ${{ needs.resolve-and-verify.outputs.chart-snapshot }}

    steps:
    - name: Log in to Konflux cluster
      uses: redhat-actions/oc-login@2a1614bc977c054c8786c8e35fc9534bd0ddc156  # v2.0.1
      with:
        openshift_server_url: https://api.kflux-prd-rh02.0fk9.p1.openshiftapps.com:6443
        openshift_token: ${{ secrets.KONFLUX_SA_TOKEN }}
        namespace: osac-tenant

    - name: Create and poll prod Release
      id: release
      run: |
        set -euo pipefail
        python3 - <<'PYEOF'
        import json
        import os
        import subprocess
        import sys
        import time

        SNAPSHOT = os.environ["CHART_SNAPSHOT"]
        NAMESPACE = "osac-tenant"
        RELEASE_PLAN = "osac-charts-prod"
        POLL_INTERVAL_SECONDS = 30
        MAX_RELEASE_ATTEMPTS = 3
        TIMEOUT_SECONDS = 80 * 60
        RETRY_TIMEOUT_SECONDS = 30 * 60

        def condition_true(conditions, cond_type):
            return any(c.get("type") == cond_type and c.get("status") == "True" for c in conditions)

        def condition_false(conditions, cond_type):
            return any(c.get("type") == cond_type and c.get("status") == "False" for c in conditions)

        def is_permanent_auth_error(stderr):
            lowered = stderr.lower()
            return "unauthorized" in lowered or "forbidden" in lowered

        def apply_release(release_file, release_name, max_apply_retries=3, apply_retry_seconds=15):
            for i in range(1, max_apply_retries + 1):
                try:
                    subprocess.run(["oc", "apply", "-f", release_file], capture_output=True, text=True, check=True)
                    return
                except subprocess.CalledProcessError as e:
                    stderr = e.stderr or ""
                    if is_permanent_auth_error(stderr):
                        print(f"::error::oc apply failed with a permanent auth/RBAC error: {stderr.strip()}")
                        raise
                    if i == max_apply_retries:
                        print(f"::error::oc apply failed {max_apply_retries} times for {release_name}: {stderr.strip()}")
                        raise
                    print(f"::warning::oc apply failed for {release_name}, retrying same apply: {stderr.strip()}")
                    time.sleep(apply_retry_seconds)

        def poll_release(release_name, timeout_seconds):
            deadline = time.time() + timeout_seconds
            while time.time() < deadline:
                try:
                    out = subprocess.run(
                        ["oc", "get", "release", release_name, "-n", NAMESPACE, "-o", "json"],
                        capture_output=True, text=True, check=True,
                    )
                except subprocess.CalledProcessError as e:
                    stderr = e.stderr or ""
                    if is_permanent_auth_error(stderr):
                        print(f"::error::oc get release failed with a permanent auth/RBAC error: {stderr.strip()}")
                        raise
                    print(f"::warning::oc get release failed, will retry: {stderr.strip()}", flush=True)
                    time.sleep(POLL_INTERVAL_SECONDS)
                    continue
                conditions = json.loads(out.stdout).get("status", {}).get("conditions", [])
                if condition_true(conditions, "Released"):
                    print(f"::notice::Konflux production release succeeded: {release_name}")
                    return "succeeded"
                if condition_false(conditions, "Released") and any(
                    c.get("type") == "Released" and c.get("reason") == "Failed" for c in conditions
                ):
                    print(f"::warning::Konflux production release failed: {release_name}")
                    return "failed"
                if conditions:
                    summary = "; ".join(
                        f"{c.get('type')}={c.get('status')} ({c.get('reason')}: {c.get('message')})"
                        for c in conditions
                    )
                else:
                    summary = f"Waiting on {release_name} -- no conditions yet"
                print(f"[{release_name}] {summary}", flush=True)
                time.sleep(POLL_INTERVAL_SECONDS)
            print(f"::warning::Timed out waiting for {release_name}")
            return "timeout"

        # See promote-image's identical comments on why the "-prod" suffix
        # and the RUN_TAG/duplicate-check both matter -- same reasoning,
        # applied to the chart Snapshot/Release.
        RUN_TAG = f"r{os.environ['GITHUB_RUN_ID']}a{os.environ['GITHUB_RUN_ATTEMPT']}"

        existing = subprocess.run(
            ["oc", "get", "release", "-n", NAMESPACE, "-o", "json"],
            capture_output=True, text=True, check=True,
        )
        for item in json.loads(existing.stdout).get("items", []):
            spec = item.get("spec", {})
            if spec.get("snapshot") == SNAPSHOT and spec.get("releasePlan") == RELEASE_PLAN:
                conditions = item.get("status", {}).get("conditions", [])
                if condition_true(conditions, "Released"):
                    print(f"::notice::{SNAPSHOT} was already promoted to {RELEASE_PLAN} by {item['metadata']['name']} -- nothing to do")
                    sys.exit(0)
                # Release names include RUN_TAG, so each dispatch creates
                # a distinct object -- a Release that's merely still
                # in-flight (not yet Released=True, and not terminally
                # Failed either) would NOT be caught by the check above,
                # letting a second dispatch race ahead and create another
                # Release for the same Snapshot while the first is still
                # running. Only a confirmed terminal Failed is safe to
                # proceed past; anything else must block.
                is_terminal_failure = any(
                    c.get("type") == "Released" and c.get("status") == "False" and c.get("reason") == "Failed"
                    for c in conditions
                )
                if not is_terminal_failure:
                    print(f"::error::Release {item['metadata']['name']} for {SNAPSHOT} against {RELEASE_PLAN} is still in flight -- not creating a second one. Wait for it to finish or delete it, then re-dispatch.")
                    sys.exit(1)

        released = False
        for attempt_num in range(1, MAX_RELEASE_ATTEMPTS + 1):
            release_name = f"{SNAPSHOT}-prod-{RUN_TAG}" if attempt_num == 1 else f"{SNAPSHOT}-prod-{RUN_TAG}-retry{attempt_num - 1}"
            release = {
                "apiVersion": "appstudio.redhat.com/v1alpha1",
                "kind": "Release",
                "metadata": {"name": release_name, "namespace": NAMESPACE},
                "spec": {"releasePlan": RELEASE_PLAN, "snapshot": SNAPSHOT},
            }
            with open("/tmp/prod-chart-release.json", "w") as f:
                json.dump(release, f)
            apply_release("/tmp/prod-chart-release.json", release_name)
            print(f"Created Release {release_name} (attempt {attempt_num}/{MAX_RELEASE_ATTEMPTS})")
            outcome = poll_release(release_name, TIMEOUT_SECONDS if attempt_num == 1 else RETRY_TIMEOUT_SECONDS)
            if outcome == "succeeded":
                released = True
                break
            if outcome == "timeout":
                print(f"::error::Timed out waiting for {release_name} -- not retrying, to avoid a second Release racing the same Snapshot")
                sys.exit(1)

        if not released:
            print(f"::error::Production chart release failed after {MAX_RELEASE_ATTEMPTS} attempts: {SNAPSHOT}")
            sys.exit(1)
        PYEOF

  notify-promotion:
    name: Notify production promotion result
    needs: [resolve-and-verify, promote-image, promote-chart]
    if: always()
    runs-on: osac-ci
    timeout-minutes: 10
    permissions:
      contents: read  # Checkout the Vault action only

    steps:
    - name: Checkout notification action
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      with:
        persist-credentials: false

    - name: Retrieve Slack webhook from Vault
      id: vault
      uses: ./.github/actions/vault-slack-webhook

    - name: Notify Slack of promotion outcome
      env:
        SLACK_WEBHOOK_URL: ${{ steps.vault.outputs.webhook-url }}
        VERSION: ${{ github.event.inputs.release_version }}
        IMAGE_READY: ${{ needs.resolve-and-verify.outputs.image-ready }}
        CHART_READY: ${{ needs.resolve-and-verify.outputs.chart-ready }}
        IMAGE_RESULT: ${{ needs.promote-image.result }}
        CHART_RESULT: ${{ needs.promote-chart.outputs.release-outcome || needs.promote-chart.result }}
        WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        IMAGE_TEXT="${IMAGE_RESULT}"
        [[ "${IMAGE_READY}" != "true" ]] && IMAGE_TEXT="skipped (Snapshot or ReleasePlan not found)"
        CHART_TEXT="${CHART_RESULT}"
        [[ "${CHART_READY}" != "true" ]] && CHART_TEXT="skipped (Snapshot or ReleasePlan not found)"

        HEADER_TEXT=":warning: ${VERSION} - Production promotion incomplete"
        if [[ "${IMAGE_TEXT}" == "success" && "${CHART_TEXT}" == "success" ]]; then
          HEADER_TEXT=":white_check_mark: ${VERSION} - Promoted to production"
        elif [[ "${IMAGE_TEXT}" == "failure" ]]; then
          HEADER_TEXT=":x: ${VERSION} - Production promotion failed"
        fi

        PAYLOAD=$(mktemp)
        trap 'rm -f "$PAYLOAD"' EXIT
        jq -n \
          --arg header "${HEADER_TEXT}" \
          --arg image "${IMAGE_TEXT}" \
          --arg chart "${CHART_TEXT}" \
          --arg workflow_url "${WORKFLOW_URL}" \
          '{blocks: [
            {type: "header", text: {type: "plain_text", text: $header}},
            {type: "section", text: {type: "mrkdwn", text: (
              "*Image promotion:* " + $image + "\n" +
              "*Chart promotion:* " + $chart
            )}},
            {type: "actions", elements: [
              {type: "button", text: {type: "plain_text", text: "View Run"}, url: $workflow_url}
            ]}
          ]}' > "$PAYLOAD"

        curl -sf --max-time 15 -X POST "${SLACK_WEBHOOK_URL}" \
          -H "Content-Type: application/json" \
          -d @"$PAYLOAD"
