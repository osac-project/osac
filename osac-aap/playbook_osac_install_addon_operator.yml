---
- name: Install one add-on operator
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    cluster_order: "{{ osac_job_vars.resource }}"
    addon_operator_role_name: >-
      {{ addon_operator_name | default((osac_job_vars | default({})).get('addon_operator_name', ''), true) }}
    addon_operator_kubeconfig: >-
      {{ admin_kubeconfig | default((osac_job_vars | default({})).get('admin_kubeconfig', ''), true) }}

  pre_tasks:
    - name: Validate add-on operator job inputs
      ansible.builtin.assert:
        that:
          - osac_job_vars is defined
          - osac_job_vars.resource is defined
          - addon_operator_role_name | length > 0
          - addon_operator_kubeconfig | length > 0
        fail_msg: "addon_operator_name, osac_job_vars.resource, and admin_kubeconfig are required"

    - name: Materialize target cluster kubeconfig
      ansible.builtin.set_fact:
        _addon_operator_kubeconfig: >-
          {{ addon_operator_kubeconfig | osac.service.to_temp_file(suffix=".kubeconfig") }}

  tasks:
    - name: Install requested add-on operator
      ansible.builtin.include_role:
        name: "osac.templates.{{ addon_operator_role_name }}"
        tasks_from: install
        apply:
          environment:
            KUBECONFIG: "{{ _addon_operator_kubeconfig }}"
            K8S_AUTH_KUBECONFIG: "{{ _addon_operator_kubeconfig }}"
