# This file describes how to do realeases of the project.

version: 2

builds:

- id: osac
  binary: osac
  main: ./cmd/osac
  env:
  - CGO_ENABLED=0
  goos:
  - linux
  - windows
  - darwin
  goarch:
  - amd64
  - arm64
  ldflags:
  - -X github.com/osac-project/osac/fulfillment-service/internal/version.id={{ .Version }}

- id: fulfillment-service
  binary: fulfillment-service
  main: ./cmd/fulfillment-service
  env:
  - CGO_ENABLED=0
  goos:
  - linux
  - windows
  - darwin
  goarch:
  - amd64
  - arm64
  ldflags:
  - -X github.com/osac-project/osac/fulfillment-service/internal/version.id={{ .Version }}

archives:
- formats: [binary]
  name_template: >-
    {{ .Binary }}_
    {{- title .Os }}_
    {{- if eq .Arch "amd64" }}x86_64
    {{- else }}{{ .Arch }}{{ end }}

# Keyless cosign signing of every release binary, same Fulcio/Rekor OIDC flow
# already used for container images and Helm charts (see the repo README) --
# no private key material here either. Produces a detached signature
# (<artifact>.sig) and Fulcio certificate (<artifact>.pem) per binary,
# which goreleaser uploads to the GitHub release alongside it.
signs:
- cmd: cosign
  certificate: '${artifact}.pem'
  args:
    - sign-blob
    - "--output-certificate=${certificate}"
    - "--output-signature=${signature}"
    - "${artifact}"
    - --yes
  artifacts: all
  output: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
