# Single, unified generator for the whole repo. Replaces the four
# former per-module buf.gen.yaml files (fulfillment-service, osac-operator,
# osac-csi-driver, osac-metering/metering-service), each of which used to
# generate its own private copy of the same types into its own internal/api/.
# Now every module imports one shared, committed tree at proto/gen/.
#
# API level: fulfillment-service / osac-operator / osac-csi-driver previously
# used API_HYBRID; osac-metering used API_OPEN. HYBRID is the superset (it emits
# both the opaque and open accessors), so all consumers compile against it.

version: v2

managed:
  enabled: true
  override:

  # internal/dummy is only for the 'cleanapi' module because there is no way
  # to tell the Go code generator that we will not be generating code for this
  # module: it will always include an import statement for this package. We
  # solve that creating a dummy package. This override must come after (well,
  # be more specific than) the per-osac-module prefixes below so it wins for
  # the cleanapi module.
  - module: buf.build/cleanapi/cleanapi
    file_option: go_package_prefix
    value: github.com/osac-project/osac/proto/gen/dummy

  - file_option: go_package_prefix
    module: buf.build/osac-project/public-api
    value: github.com/osac-project/osac/proto/gen
  - file_option: go_package_prefix
    module: buf.build/osac-project/private-api
    value: github.com/osac-project/osac/proto/gen
  - file_option: go_package_prefix
    module: buf.build/osac-project/tests
    value: github.com/osac-project/osac/proto/gen

  disable:
  - module: buf.build/googleapis/googleapis
  - module: buf.build/grpc-ecosystem/grpc-gateway
  - module: buf.build/bufbuild/protovalidate

inputs:

- directory: public
- directory: private
- directory: tests
- module: buf.build/cleanapi/cleanapi:v0.0.12

plugins:

- remote: buf.build/protocolbuffers/go:v1.36.5
  out: gen
  opt:
  - paths=source_relative
  - default_api_level=API_HYBRID

- remote: buf.build/grpc/go:v1.5.1
  out: gen
  opt:
  - paths=source_relative

- remote: buf.build/grpc-ecosystem/gateway:v2.26.1
  out: gen
  opt:
  - paths=source_relative
