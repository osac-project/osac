apiVersion: v1
kind: Service
metadata:
  name: {{ include "osac-operator.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-operator.labels" . | nindent 4 }}
    {{- /* Distinguishes this Service from the console-proxy Service, which
    shares most of the common labels. Selected by templates/servicemonitor.yaml;
    read it before changing this label or the port. */}}
    app.kubernetes.io/component: metrics
spec:
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: 8443
  selector:
    {{- include "osac-operator.selectorLabels" . | nindent 4 }}
