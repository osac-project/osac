{{- if dig "observability" "enabled" false (.Values.global | default dict) }}
{{- /* Runnable PromQL for the pipeline health table and for naming stopped
     clusters. The stopped-cluster threshold is derived from the two collection
     intervals: one scrape of the slower collector, plus one interval of
     tolerance. The query looks back over the full Thanos retention window
     instead of the five-minute instant-query lookback, so a cluster that
     stopped days ago is still named, and the threshold is not capped. */}}
{{- $threshold := include "osac-observability.stoppedClusterThresholdSeconds" . | int -}}
{{- $observability := (.Values.global | default dict).observability | default dict -}}
{{- $thanos := $observability.thanos | default dict -}}
{{- $retention := $thanos.retention | default "365d" -}}
{{- $ns := include "osac-observability.namespace" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: osac-observability-health-queries
  namespace: {{ $ns }}
  labels:
    {{- include "osac-observability.labels" . | nindent 4 }}
data:
  # Samples waiting in the writing Prometheus remote-write queue, per
  # cluster. This is the sender-side backlog; growth means a cluster cannot
  # ship at its scrape rate.
  receive-backlog: {{ `sum by (cluster) (prometheus_remote_storage_samples_pending)` | quote }}
  # Pending remote-write requests held by Thanos Receive, per cluster. The
  # OSAC-8004 acceptance criterion names this row "receive-queue-length"; the
  # shipped Receive metric is a pending-request count, not an age, so the row
  # name is kept and the meaning is documented here.
  receive-queue-length: {{ `sum by (cluster) (thanos_receive_pending_write_requests)` | quote }}
  # Compactions that failed in the last hour. A nonzero value means blocks are
  # not being downsampled or cleaned up.
  compaction-failures: {{ `sum by (cluster) (increase(thanos_compact_group_compactions_failures_total[1h]))` | quote }}
  # Object-storage failures in the last hour, as seen by Store.
  store-gateway-errors: {{ `sum by (cluster) (increase(thanos_objstore_bucket_operation_failures_total{job="thanos-store"}[1h]))` | quote }}
  # Head series in the management cluster's Prometheus. Compare with the
  # configured capacity; series leaving thanos-receive is the write path's
  # clearest health signal.
  capacity-series: {{ `max(prometheus_tsdb_head_series{cluster="management", job="thanos-receive"})` | quote }}
  # Clusters whose newest remote-written sample is older than the threshold:
  # the cluster stopped scraping, or its remote-write path stopped. A plain
  # timestamp(up) only sees samples inside the five-minute instant-query
  # lookback, so the sample timestamp is computed over a subquery spanning the
  # Thanos retention window and its newest value is taken from there.
  #
  # timestamp(last_over_time(up{...}[retention])) is not usable here: range
  # functions stamp their result at the evaluation time, so timestamp() would
  # report an age of zero for every cluster. The subquery keeps the timestamp
  # of the sample itself.
  #
  # The subquery step is the 30s tolerance, not the collection interval. A
  # coarser step can hide the newest sample behind the step boundary, which
  # overstates a current cluster's age by up to one step and would name a
  # healthy cluster; at 30s a current cluster stays at or below the threshold.
  # last_over_time over the subquery therefore reports the real sample
  # timestamp, so the compared value is the cluster's actual age in seconds.
  stopped-clusters: {{ printf `time() - max by (cluster) (last_over_time(timestamp(up{managed_by="osac"})[%s:30s])) > %d` $retention $threshold | quote }}
{{- end }}
