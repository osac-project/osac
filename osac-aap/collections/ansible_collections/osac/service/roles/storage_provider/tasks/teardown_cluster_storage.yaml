---
# Dispatches teardown_cluster_storage once per (provider, backend_id) pair.
# Removes cluster-side K8s resources (StorageClasses, VolumeSnapshotClasses,
# CSI Secret) without touching backend resources or hub Secret.
# Best-effort — ignore_errors so one provider's failure doesn't block others.

- name: Dispatch teardown_cluster_storage to each provider backend pair
  block:
    - name: Run teardown_cluster_storage per provider backend pair
      ansible.builtin.include_tasks: _dispatch_provider.yaml
      loop: "{{ _provider_backend_pairs }}"
      loop_control:
        loop_var: _current_pair
      ignore_errors: true  # noqa: ignore-errors
