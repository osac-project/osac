# Default scenario: validates that the chart renders with minimal overrides.
# Only sets values that subcharts mark as required.

global:
  osacDeploymentId: "ci/osac"
  mcp:
    enabled: true
    publicURL: "https://mcp.example.com/"
    issuerURL: "https://keycloak.example.com/realms/osac"
    audience: "osac-api"
    exchangeTokenEndpoint: "https://keycloak.example.com/realms/osac/protocol/openid-connect/token"
    exchangeClientID: "https://mcp.example.com/"
    exchangeClientSecret:
      name: "ci-mcp-exchange-credentials"
      key: "client-secret"
    trust:
      mode: "configMap"
      configMap: "ca-bundle"
    replicas: 2
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    limits:
      requestSize: "1Mi"
      concurrency: 100
      timeout: "30s"
  networking:
    # The Fabric Manager registration is applied by the admin; rendering only
    # needs its name.
    fabricManager: netris
    k8sManager: cudn_evpn

ui:
  enabled: true
  api:
    fulfillment:
      certs:
        caBundle:
          configMap: ca-bundle
  auth:
    oidcIssuerURL: https://keycloak.example.com/realms/osac
    certs:
      caBundle:
        configMap: ca-bundle

service:
  externalHostname: fulfillment-api.example.com
  internalHostname: fulfillment-internal-api.example.com
  auth:
    controllerCredentials:
    - secret:
        name: fulfillment-controller-credentials
        items:
        - key: client-id
          param: client-id
        - key: client-secret
          param: client-secret
  idp:
    url: https://keycloak.example.com
    credentials:
    - secret:
        name: fulfillment-controller-credentials
        items:
        - key: client-id
          param: client-id
  database:
    connection:
    - secret:
        name: osac-db-config
        items:
        - key: url
          param: url
  vault:
    endpoint: https://vault.example.com
    lifecycleRole: vault-lifecycle
    keycloakClientId: vault-client
    keycloakIssuerUrl: https://keycloak.example.com/realms/osac
    credentials:
    - secret:
        name: vault-credentials
        items:
        - key: client-secret
          param: client-secret
