                _s7a_unexpected: true
          rescue:
            - name: "S7a: Verify timestamp refusal"
              ansible.builtin.assert:
                that:
                  - >-
                    'deletionTimestamp' in
                    (ansible_failed_result.msg
                    | default(''))
                fail_msg: >-
                  Expected deletionTimestamp refusal.

        - name: "S7a: Assert refusal"
          ansible.builtin.assert:
            that: _s7a_unexpected is not defined
            fail_msg: >-
              Should have failed for VMI without
              deletionTimestamp (no launcher case).

        - name: "S7a: Verify VMI preserved"
          kubernetes.core.k8s_info:
            api_version: kubevirt.io/v1
            kind: VirtualMachineInstance
            name: "{{ compute_instance_name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
          register: s7a_vmi_after
          failed_when: >-
            s7a_vmi_after.resources | length == 0

        - name: "S7a: Verify integrity after refusal"
          ansible.builtin.assert:
            that:
              - >-
                'kubevirt.io/foregroundDeleteVirtualMachine'
                in (s7a_vmi_after.resources[0]
                .metadata.finalizers | default([]))
              - >-
                (s7a_vmi_after.resources[0]
                .metadata.deletionTimestamp
                | default('')) == ''
            fail_msg: >-
              VMI finalizer removed or
              deletionTimestamp introduced
              despite refusal.

        - name: "S7a: Verify parent VM preserved"
          kubernetes.core.k8s_info:
            api_version: kubevirt.io/v1
            kind: VirtualMachine
            name: "{{ compute_instance_name }}"
            namespace: >-
