# --- Prerequisites ---
certManager:
  enabled: true
trustManager:
  enabled: true
caIssuer:
  enabled: true
keycloak:
  enabled: true
aapOperator:
  enabled: true
lvms:
  enabled: true
metallb:
  enabled: true
cnv:
  enabled: true
mce:
  enabled: false

# OSAC VMaaS (VM-as-a-Service) CI Environment Values
# VMaaS CI values

# --- Operator ---
operator:
  image:
    repository: ghcr.io/osac-project/osac-operator
    tag: latest
    pullPolicy: Always
  provisioning:
    provider: "aap"
  aap:
    insecureSkipVerify: "true"
    tokenSecret:
      name: osac-aap-api-token
      key: token
  fulfillment:
    serverAddress: "fulfillment-internal-api:8001"
    tokenFile: "/var/run/secrets/kubernetes.io/serviceaccount/token"
  controllers:
    clusterOrder: false
    computeInstance: true
    tenant: true
    networking: true
    storage: true
  hubAccess:
    enabled: true
  tenants:
  - name: shared
  - name: osac-e2e-ci

# --- Fulfillment Service ---
service:
  externalHostname: ""  # Set to fulfillment-api-<namespace>.apps.<cluster>.<domain>
  internalHostname: ""  # Set to fulfillment-internal-api-<namespace>.apps.<cluster>.<domain>
  variant: openshift
  images:
    service: ghcr.io/osac-project/fulfillment-service:main
    envoy: ghcr.io/osac-project/envoy:v1.33.0
  certs:
    issuerRef:
      kind: ClusterIssuer
      name: default-ca
    caBundle:
      configMap: ca-bundle
  auth:
    issuerUrl: https://keycloak.keycloak.svc.cluster.local/realms/osac
    emergencyServiceAccounts:
    - admin
    - osac-operator
    - osac-operator-controller-manager
    - template-publisher
    - osac-metering
    controllerCredentials:
    - secret:
        name: fulfillment-controller-credentials
        items:
        - key: client-id
          param: client-id
        - key: client-secret
          param: client-secret
  idp:
    provider: keycloak
    url: https://keycloak.keycloak.svc.cluster.local
    credentials:
    - secret:
        name: fulfillment-controller-credentials
        items:
        - key: client-id
          param: client-id
        - key: client-secret
          param: client-secret
  database:
    connection:
    - secret:
        name: fulfillment-db
        items:
        - key: url
          param: url
    - secret:
        name: postgres-client-cert-service
        items:
        - key: tls.crt
          param: sslcert
        - key: tls.key
          param: sslkey
        - key: ca.crt
          param: sslrootcert
  log:
    level: debug

# --- UI ---
ui:
  enabled: true
  images:
    ui: ghcr.io/osac-project/osac-ui:v0.0.5
  api:
    fulfillment:
      certs:
        caBundle:
          configMap: ca-bundle
  auth:
    certs:
      caBundle:
        configMap: ca-bundle

# --- AAP ---
aap:
  aap:
    instance:
      enabled: true
      name: "osac-aap"
  bootstrap:
    enabled: true
    image: ghcr.io/osac-project/osac-aap:latest
    backoffLimit: 15
  configAsCode:
    manifestSecret: "config-as-code-manifest-ig"
    secret: "config-as-code-ig"
    # NOTE: e2e's COMPONENT_BUILD_RESULTS image-override step overrides
    # bootstrap.image with this PR's own built image but does not touch
    # eeImage, so the two can diverge at e2e runtime even though they're
    # the same base value here. Extending that override to cover eeImage
    # too is tracked separately (OSAC-3545), since it lives in
    # osac-test-infra, not this repo.
    eeImage: "ghcr.io/osac-project/osac-aap:latest"
    projectGitUri: "https://github.com/osac-project/osac"
    projectGitBranch: "main"
  instanceGroups:
    storageFulfillment:
      enabled: true

# --- Validation ---
validation:
  enabled: true

# --- Bare Metal Fulfillment Operator ---
bmf:
  enabled: false

# --- CI/dev only ---
# Hub access: registers local cluster as a hub. Only for environments
# where the fulfillment service and hub cluster are the same.
hubAccess:
  enabled: true

# Bundled PostgreSQL: single-pod ephemeral database for testing.
# Uses fsync=off — data is lost on restart. Not for production.
bundledPostgres:
  enabled: true
  database:
    name: service
    user: service

# --- Kafka (metering infrastructure) ---
kafka:
  enabled: true

# --- Metering ---
metering:
  enabled: true
  # Echo adapter — test/development tool only. Consumes metering events from
  # Kafka and exposes them via HTTP for E2E test assertions.
  echoAdapter:
    enabled: true
    image:
      repository: ghcr.io/osac-project/metering-echo-adapter
      tag: latest
      pullPolicy: Always
  database:
    connection:
    - secret:
        name: metering-db
        items:
        - key: url
          param: url
    - secret:
        name: postgres-client-cert-metering
        items:
        - key: tls.crt
          param: sslcert
        - key: tls.key
          param: sslkey
        - key: ca.crt
          param: sslrootcert
