{{- if .Values.bundledVault.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-infra.labels" . | nindent 4 }}
spec:
  issuerRef:
    kind: {{ .Values.certs.issuerRef.kind }}
    name: {{ .Values.certs.issuerRef.name }}
  dnsNames:
  - openbao
  - openbao.{{ .Release.Namespace }}
  - openbao.{{ .Release.Namespace }}.svc.cluster.local
  - localhost
  secretName: openbao-server-cert
  privateKey:
    rotationPolicy: Always
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-infra.labels" . | nindent 4 }}
data:
  config.hcl: |
    ui = false
    disable_mlock = true

    storage "file" {
      path = "/vault/data/storage"
    }

    listener "tcp" {
      address     = "0.0.0.0:8200"
      tls_cert_file = "/vault/tls/tls.crt"
      tls_key_file  = "/vault/tls/tls.key"
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-infra.labels" . | nindent 4 }}
data:
  init.sh: |
    #!/usr/bin/env sh
    set -eu

    # This bundled instance is for testing. Keep the unseal key and initial
    # root token with its data so the instance can recover after a restart.
    umask 077
    bootstrap_file=/vault/data/bootstrap.json
    temporary_bootstrap_file="${bootstrap_file}.tmp"

    get_status() {
      bao status -format=json 2>/dev/null || true
    }

    status_value() {
      printf '%s\n' "$status_json" | awk -F: -v field="\"$1\"" '
        index($1, field) {
          gsub(/[[:space:],"]/, "", $2)
          print $2
          exit
        }'
    }

    echo "Waiting for the OpenBao API..."
    status_json=""
    until [ -n "$status_json" ]; do
      status_json="$(get_status)"
      [ -n "$status_json" ] || sleep 1
    done

    if [ ! -s "$bootstrap_file" ] && [ -s "$temporary_bootstrap_file" ]; then
      mv "$temporary_bootstrap_file" "$bootstrap_file"
    fi

    initialized="$(status_value initialized)"
    if [ "$initialized" = false ]; then
      echo "Initializing OpenBao..."
      bao operator init -key-shares=1 -key-threshold=1 -format=json > "$temporary_bootstrap_file"
      mv "$temporary_bootstrap_file" "$bootstrap_file"
      status_json="$(get_status)"
    elif [ "$initialized" != true ]; then
      echo "ERROR: Could not determine whether OpenBao is initialized." >&2
      exit 1
    fi

    if [ ! -s "$bootstrap_file" ]; then
      echo "ERROR: OpenBao is initialized but its bootstrap file is missing." >&2
      exit 1
    fi

    unseal_key="$(awk -F '\"' '
      /\"unseal_keys_b64\"[[:space:]]*:/ { in_keys=1; next }
      in_keys && NF >= 3 { print $2; exit }
    ' "$bootstrap_file")"
    root_token="$(awk -F '\"' '/\"root_token\"[[:space:]]*:/ { print $4; exit }' "$bootstrap_file")"
    if [ -z "$unseal_key" ] || [ -z "$root_token" ]; then
      echo "ERROR: Could not read OpenBao bootstrap material." >&2
      exit 1
    fi

    sealed="$(status_value sealed)"
    if [ "$sealed" = true ]; then
      echo "Unsealing OpenBao..."
      bao operator unseal "$unseal_key" >/dev/null
      status_json="$(get_status)"
    fi
    if [ "$(status_value sealed)" != false ]; then
      echo "ERROR: OpenBao remains sealed after unsealing." >&2
      exit 1
    fi

    export BAO_TOKEN="$root_token"
    echo "OpenBao is ready."

    echo "Creating parent namespace '{{ .Values.bundledVault.vaultNamespace | default "osac" }}'..."
    bao namespace create {{ .Values.bundledVault.vaultNamespace | default "osac" }} 2>/dev/null || echo "Namespace '{{ .Values.bundledVault.vaultNamespace | default "osac" }}' already exists."

    echo "Enabling JWT auth in osac namespace..."
    bao auth enable -namespace={{ .Values.bundledVault.vaultNamespace | default "osac" }} -path=jwt jwt 2>/dev/null || echo "JWT auth already enabled."

    echo "Writing lifecycle policy..."
    bao policy write -namespace={{ .Values.bundledVault.vaultNamespace | default "osac" }} lifecycle - <<'POLICY'
    path "sys/namespaces/*" {
      capabilities = ["create", "read", "update", "delete", "list", "sudo"]
    }
    path "sys/namespaces" {
      capabilities = ["list"]
    }
    path "+/sys/mounts/*" {
      capabilities = ["create", "read", "update", "delete", "sudo"]
    }
    path "+/sys/mounts" {
      capabilities = ["read", "list"]
    }
    path "+/sys/policies/*" {
      capabilities = ["create", "read", "update", "delete", "list", "sudo"]
    }
    path "+/sys/auth/*" {
      capabilities = ["create", "read", "update", "delete", "list", "sudo"]
    }
    path "+/auth/*" {
      capabilities = ["create", "read", "update", "delete", "list", "sudo"]
    }
    POLICY

    {{- if .Values.bundledVault.keycloakIssuerUrl }}
    echo "Configuring JWT auth with Keycloak OIDC discovery..."
    attempts=0
    max_attempts=30
    until [ $attempts -ge $max_attempts ]; do
      {{- if .Values.certs.caBundle.configMap }}
      if bao write -namespace={{ .Values.bundledVault.vaultNamespace | default "osac" }} auth/jwt/config \
        oidc_discovery_url="${KEYCLOAK_ISSUER_URL}" \
        oidc_discovery_ca_pem=@/vault/ca/bundle.pem \
        default_role="lifecycle"; then
        break
      fi
      {{- else }}
      if bao write -namespace={{ .Values.bundledVault.vaultNamespace | default "osac" }} auth/jwt/config \
        oidc_discovery_url="${KEYCLOAK_ISSUER_URL}" \
        default_role="lifecycle"; then
        break
      fi
      {{- end }}
      attempts=$((attempts + 1))
      echo "OIDC discovery not reachable yet (attempt $attempts/$max_attempts), retrying in 10s..."
      sleep 10
    done
    if [ $attempts -ge $max_attempts ]; then
      echo "ERROR: Failed to configure OIDC discovery after $max_attempts attempts. Bootstrap cannot complete."
      exit 1
    else
      echo "Creating lifecycle role..."
      bao write -namespace={{ .Values.bundledVault.vaultNamespace | default "osac" }} auth/jwt/role/lifecycle \
        role_type="jwt" \
        bound_audiences="${KEYCLOAK_AUDIENCE}" \
        user_claim="sub" \
        policies="lifecycle" \
        token_ttl="1h"
    fi
    {{- end }}

    echo "OpenBao bootstrap complete."
    while :; do
      sleep 5
      status_json="$(get_status)"
      if [ "$(status_value sealed)" = true ]; then
        echo "OpenBao is sealed; unsealing it..."
        bao operator unseal "$unseal_key" >/dev/null
      fi
    done
---
apiVersion: v1
kind: Service
metadata:
  name: openbao
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-infra.labels" . | nindent 4 }}
spec:
  selector:
    app: openbao
  ports:
  - name: api
    port: 8200
    targetPort: api
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openbao-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-infra.labels" . | nindent 4 }}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao
  namespace: {{ .Release.Namespace }}
  labels:
    app: openbao
    {{- include "osac-infra.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openbao
  template:
    metadata:
      labels:
        app: openbao
        {{- include "osac-infra.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- if .Values.bundledVault.podSecurityContext }}
        {{- toYaml .Values.bundledVault.podSecurityContext | nindent 8 }}
        {{- else }}
        # Standard Kubernetes default: explicit numeric UID required because the
        # OpenBao image uses a named user ("openbao") — Kubernetes cannot satisfy
        # runAsNonRoot: true without a numeric UID at admission time.
        # On OpenShift, override podSecurityContext in the profile's instance.yaml
        # to just {runAsNonRoot: true}; the restricted-v2 SCC allocates the UID.
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
        {{- end }}
      volumes:
      - name: server-cert
        secret:
          secretName: openbao-server-cert
          defaultMode: 0444
      - name: config
        configMap:
          name: openbao-config
      - name: init-script
        configMap:
          name: openbao-init
          defaultMode: 0755
      {{- if .Values.certs.caBundle.configMap }}
      - name: ca-bundle
        configMap:
          name: {{ .Values.certs.caBundle.configMap }}
      {{- end }}
      - name: data
        persistentVolumeClaim:
          claimName: openbao-data
      - name: tmp
        emptyDir: {}
      # home-openbao: writable home dir for the openbao user.
      # The Alpine image sets HOME to / (no explicit home dir) while the UBI
      # image uses /home/openbao. We map both by setting HOME=/tmp in each
      # container's env and mounting this emptyDir there, so any HOME-relative
      # writes (e.g. ~/.vault-token from bao CLI) land in an emptyDir rather
      # than the read-only root filesystem.
      - name: home
        emptyDir: {}
      containers:
      - name: server
        image: {{ .Values.bundledVault.image }}
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          {{- toYaml .Values.bundledVault.resources | nindent 10 }}
        command:
        - bao
        - server
        - -config=/vault/config/config.hcl
        env:
        - name: BAO_ADDR
          value: "https://127.0.0.1:8200"
        - name: BAO_CACERT
          {{- if .Values.certs.caBundle.configMap }}
          value: "/vault/ca/bundle.pem"
          {{- else }}
          value: "/vault/tls/ca.crt"
          {{- end }}
        - name: SKIP_SETCAP
          value: "true"
        # HOME=/tmp: the Alpine image has no explicit home dir; redirecting HOME
        # to the already-mounted /tmp emptyDir prevents any HOME-relative writes
        # from hitting the read-only root filesystem.
        - name: HOME
          value: "/tmp"
        volumeMounts:
        - name: server-cert
          mountPath: /vault/tls
        - name: config
          mountPath: /vault/config
        {{- if .Values.certs.caBundle.configMap }}
        - name: ca-bundle
          mountPath: /vault/ca
        {{- end }}
        - name: data
          mountPath: /vault/data
        - name: tmp
          mountPath: /tmp
        - name: home
          mountPath: /home/openbao
        ports:
        - name: api
          protocol: TCP
          containerPort: 8200
        livenessProbe:
          httpGet:
            path: /v1/sys/health
            port: api
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /v1/sys/health
            port: api
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 5
        startupProbe:
          httpGet:
            path: /v1/sys/health
            port: api
            scheme: HTTPS
          periodSeconds: 5
          failureThreshold: 30
      - name: bootstrap
        image: {{ .Values.bundledVault.image }}
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        command:
        - /bin/sh
        - /scripts/init.sh
        env:
        - name: BAO_ADDR
          value: "https://localhost:8200"
        - name: BAO_CACERT
          {{- if .Values.certs.caBundle.configMap }}
          value: "/vault/ca/bundle.pem"
          {{- else }}
          value: "/vault/tls/ca.crt"
          {{- end }}
        - name: KEYCLOAK_ISSUER_URL
          value: {{ tpl (.Values.bundledVault.keycloakIssuerUrl | default "") . | quote }}
        - name: KEYCLOAK_AUDIENCE
          value: {{ .Values.bundledVault.keycloakAudience | default "" | quote }}
        # HOME=/tmp: ensures HOME-relative writes (e.g. bao CLI token cache) land
        # on the mounted /tmp emptyDir rather than the read-only root filesystem.
        - name: HOME
          value: "/tmp"
        volumeMounts:
        - name: init-script
          mountPath: /scripts
        - name: server-cert
          mountPath: /vault/tls
        - name: data
          mountPath: /vault/data
        {{- if .Values.certs.caBundle.configMap }}
        - name: ca-bundle
          mountPath: /vault/ca
        {{- end }}
        - name: tmp
          mountPath: /tmp
        - name: home
          mountPath: /home/openbao
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
{{- end }}
