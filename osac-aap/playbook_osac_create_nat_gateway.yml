---
- name: Create a NATGateway resource
  hosts: localhost
  gather_facts: false

  vars:
    nat_gateway: "{{ osac_job_vars.resource }}"
    nat_gateway_name: "{{ osac_job_vars.resource.metadata.name }}"
    implementation_strategy: >-
      {{ osac_job_vars.resource.metadata.annotations['osac.openshift.io/implementation-strategy'] }}

  pre_tasks:
    - name: Show resource metadata
      ansible.builtin.debug:
        var: osac_job_vars.resource.metadata

  tasks:
    - name: Display NATGateway information
      ansible.builtin.debug:
        msg:
          - "NATGateway name: {{ nat_gateway_name }}"
          - "Implementation strategy: {{ implementation_strategy }}"

    - name: Create NATGateway with sanitized Netris failure details
      block:
        - name: Call the selected NATGateway role
          ansible.builtin.include_role:
            name: "{{ template_id_override | default('osac.templates.' + (implementation_strategy | replace('-', '_'))) }}"
            tasks_from: create_nat_gateway
      rescue:
        - name: Report NATGateway creation failure
          ansible.builtin.include_role:
            name: osac.templates.netris
            tasks_from: _report_failure
          vars:
            _netris_failure_operation: create
            _netris_failure_resource_type: NATGateway
            _netris_failure_resource_name: "{{ nat_gateway_name }}"
            _netris_failure_task: "{{ ansible_failed_task.name | default('unknown provider task') }}"
            _netris_failure_result: "{{ ansible_failed_result | default({}) }}"
          when: implementation_strategy == 'netris' or template_id_override | default('') == 'osac.templates.netris'
        - name: Re-raise original failure for other networking managers
          ansible.builtin.fail:
            msg: "{{ ansible_failed_result.msg | default(ansible_failed_task.name | default('operation failed')) }}"
          when: implementation_strategy != 'netris' and template_id_override | default('') != 'osac.templates.netris'
