{{- if dig "observability" "enabled" false (.Values.global | default dict) }}
{{- $observability := .Values.global.observability | default dict -}}
{{- $keycloak := $observability.keycloak | default dict -}}
{{- $image := ($observability.services | default dict).metricsAuth | default dict -}}
{{- $ns := include "osac-observability.namespace" . -}}
{{- $name := "osac-observability-admin-credentials" -}}
{{- /* The cookie secrets are generated once and then left alone: Helm cannot
       own them because a template would rotate the value on every upgrade and
       log every admin out. The client secret is a copy of the Keycloak one, so
       it is read from the same Secret the Keycloak provisioning maintains. */ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: keycloak
  labels:
    {{- include "osac-observability.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    # After the Keycloak provisioning wrote keycloak-client-secrets.
    "helm.sh/hook-weight": "30"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - keycloak-client-secrets
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: keycloak
  labels:
    {{- include "osac-observability.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "30"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $ns }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "osac-observability.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    # After the namespace RBAC and the workloads that mount the Secrets.
    "helm.sh/hook-weight": "30"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        {{- include "osac-observability.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      securityContext:
        {{- include "osac-observability.podSecurityContext" . | nindent 8 }}
      containers:
        - name: admin-credentials
          image: "{{ $image.repository }}:{{ $image.tag }}"
          imagePullPolicy: IfNotPresent
          command:
            - /admin-credentials
          env:
            - name: KEYCLOAK_NAMESPACE
              value: keycloak
            - name: KEYCLOAK_SECRET_NAME
              value: keycloak-client-secrets
            - name: KEYCLOAK_SECRET_KEY
              value: {{ $keycloak.adminClientId | default "thanos-admin" | quote }}
            - name: OBS_NAMESPACE
              value: {{ $ns | quote }}
            - name: ADMIN_CLIENT_SECRET_NAME
              value: thanos-admin-client-secret
            - name: ADMIN_CLIENT_SECRET_KEY
              value: client-secret
            - name: ADMIN_COOKIE_SECRET_NAMES
              value: {{ list "thanos-admin-oauth2-proxy" "thanos-admin-openshift-oauth" | toJson | quote }}
            - name: ADMIN_COOKIE_SECRET_KEY
              value: cookie-secret
          securityContext:
            {{- include "osac-observability.containerSecurityContext" . | nindent 12 }}
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
{{- end }}
