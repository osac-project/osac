---
name: "Ansible Lint"

# Called by ci.yml (job ansible-lint); ci.yml decides whether osac-aap changed.
# Also runs nightly and on demand, where it always runs.

on:  # yamllint disable-line rule:truthy
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version-file: "osac-aap/pyproject.toml"
      - name: Install the project
        working-directory: osac-aap
        run: uv sync --locked --all-extras --group development
      - name: Run ansible-lint
        working-directory: osac-aap
        # Explicit "." is required: without a target path, ansible-lint
        # discovers files via `git ls-files` against the whole repo (not
        # CWD-scoped), which in this monorepo pulls in unrelated
        # fulfillment-service/osac-operator YAML and produces spurious
        # failures.
        run: uv run ansible-lint .
