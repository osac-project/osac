---
# Entry point: creates an OpenShift cluster on AWS with GPU workers,
# then installs RHOAI + MaaS. Delegates cluster creation to ocp_small
# and overrides both the hosted_cluster step (AWS platform instead of
# Agent) and the post-install hook.

- name: Bridge templateParameters to role variables
  ansible.builtin.set_fact:
    ocp_4_22_aws_maas_aws_region: "{{ template_parameters.aws_region | default('us-east-1') }}"
    ocp_4_22_aws_maas_aws_instance_type: "{{ template_parameters.aws_instance_type | default('g5.xlarge') }}"
    ocp_4_22_aws_maas_aws_worker_count: "{{ template_parameters.aws_worker_count | default(2) | int }}"
    ocp_4_22_aws_maas_aws_root_volume_size: "{{ template_parameters.aws_root_volume_size | default(120) | int }}"
    ocp_4_22_aws_maas_aws_root_volume_type: "{{ template_parameters.aws_root_volume_type | default('gp3') }}"
    ocp_4_22_aws_maas_aws_subnet_id: "{{ template_parameters.aws_subnet_id | default('') }}"
    ocp_4_22_aws_maas_aws_security_group_id: "{{ template_parameters.aws_security_group_id | default('') }}"
    ocp_4_20_ai_maas_enable_maas: "{{ template_parameters.enable_maas | default(true) | bool }}"
    ocp_4_20_ai_maas_oidc_issuer: "{{ template_parameters.oidc_issuer | default('') }}"
    ocp_4_20_ai_maas_oidc_client_id: "{{ template_parameters.oidc_client_id | default('') }}"
    ocp_4_20_ai_maas_tenants: "{{ template_parameters.tenants | default(ocp_4_20_ai_maas_tenants) }}"
    ocp_4_20_ai_maas_tenant_name: "{{ template_parameters.tenant_name | default(ocp_4_20_ai_maas_tenant_name) }}"
    ocp_4_20_ai_maas_tenant_admin_group: "{{ template_parameters.tenant_admin_group | default(ocp_4_20_ai_maas_tenant_admin_group) }}"
    ocp_4_20_ai_maas_enable_observability: "{{ template_parameters.enable_observability | default(true) | bool }}"
    ocp_4_20_ai_maas_enable_dashboard: "{{ template_parameters.enable_dashboard | default(true) | bool }}"
    ocp_4_20_ai_maas_hardware_profiles: "{{ template_parameters.hardware_profiles | default(ocp_4_20_ai_maas_hardware_profiles) }}"
    ocp_4_20_ai_maas_external_models: "{{ template_parameters.external_models | default(ocp_4_20_ai_maas_external_models) }}"
  when: template_parameters is defined

- name: Create AWS GPU cluster with RHOAI + MaaS post-install
  ansible.builtin.include_role:
    name: osac.templates.ocp_small
    tasks_from: install
  vars:
    install_step_hosted_cluster_override:
      name: osac.templates.ocp_4_22_aws_maas
      tasks_from: create_aws_hosted_cluster.yaml
    install_step_post_install_hook_override:
      name: osac.templates.ocp_4_20_ai_maas
      tasks_from: post_install.yaml
