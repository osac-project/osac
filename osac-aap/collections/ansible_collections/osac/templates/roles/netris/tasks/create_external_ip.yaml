---
# ExternalIP create entry point. Dispatches by the persisted contract
# version annotation: empty/missing routes to the legacy name-based
# tasks, explicit v1 routes to the shared v1 tasks, and any other
# nonempty version fails before any provider I/O.

- name: Resolve ExternalIP contract version
  ansible.builtin.set_fact:
    eip_contract_version: >-
      {{ external_ip.metadata.annotations
         ['osac.openshift.io/externalip-contract-version']
         | default('', true) | trim }}

- name: Route unversioned ExternalIP create to the legacy tasks
  ansible.builtin.include_tasks: _create_external_ip_legacy.yaml
  when: eip_contract_version | length == 0

- name: Route v1 ExternalIP create to the shared v1 tasks
  ansible.builtin.include_tasks: _external_ip_v1.yaml
  when: eip_contract_version == 'v1'
  vars:
    external_ip_v1_operation: external_ip.allocate

- name: Fail on unsupported ExternalIP contract version
  ansible.builtin.fail:
    msg: >-
      Unsupported ExternalIP contract version '{{ eip_contract_version }}'.
      Expected an empty value (legacy) or 'v1'.
  when:
    - eip_contract_version | length > 0
    - eip_contract_version != 'v1'
