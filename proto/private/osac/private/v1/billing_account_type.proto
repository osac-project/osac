syntax = "proto3";

package osac.private.v1;

import "buf/validate/validate.proto";
import "cleanapi/cleanapi.proto";
import "google/protobuf/timestamp.proto";

option (cleanapi.file).package = "osac.public.v1";

// BillingAccount is an OSAC reference to an account discovered in the
// configured billing provider. Its ID is generated by OSAC and is independent
// of the provider's account identifier.
// buf:lint:ignore OSAC_OBJECT_SHAPE
message BillingAccount {
  string id = 1;

  // Identifies the configured provider adapter, for example "m360".
  string provider_key = 2 [(buf.validate.field).string = {min_len: 1}];

  // Provider-supplied name displayed to authorized OSAC administrators.
  string display_name = 3 [(buf.validate.field).string = {min_len: 1}];

  // ISO-4217 currency code used for this account's prices, when supplied by
  // the provider.
  string base_currency = 4;

  // Last observed normalized provider state.
  BillingAccountState state = 5;

  // Time the provider state was last checked.
  google.protobuf.Timestamp status_observed_at = 6;

  // Provider-native account identifier. It is used only for backend calls and
  // is not part of the public API.
  string provider_account_reference = 7 [(cleanapi.field).private = true];
}

// BillingAccountState is OSAC's normalized billing-account state.
enum BillingAccountState {
  BILLING_ACCOUNT_STATE_UNSPECIFIED = 0;
  BILLING_ACCOUNT_STATE_ACTIVE = 1;
  BILLING_ACCOUNT_STATE_INACTIVE = 2;
  BILLING_ACCOUNT_STATE_UNKNOWN = 3;
}
