{{- if .Values.m360Adapter.enabled }}
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: osac-metering-m360-adapter
  namespace: {{ include "osac-metering.kafkaClusterNamespace" . }}
  labels:
    strimzi.io/cluster: {{ include "osac-metering.kafkaClusterName" . }}
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      {{- include "osac-metering.adapterKafkaUserAcls" "osac-metering-m360-adapter" | nindent 6 }}
{{- end }}
