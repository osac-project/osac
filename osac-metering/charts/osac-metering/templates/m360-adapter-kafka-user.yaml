{{- if and .Values.m360Adapter.enabled .Values.kafka.strimziResources }}
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: {{ include "osac-metering.m360AdapterKafkaUserName" . }}
  namespace: {{ include "osac-metering.kafkaClusterNamespace" . }}
  labels:
    strimzi.io/cluster: {{ include "osac-metering.kafkaClusterName" . }}
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      {{- include "osac-metering.adapterKafkaUserAcls" (dict "root" . "user" (include "osac-metering.m360AdapterKafkaUserName" .)) | nindent 6 }}
{{- end }}
