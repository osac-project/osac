{{- if .Values.apiToken.create }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "osac-aap.fullname" . }}-create-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-aap.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "15"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 5
  # Job-level CUMULATIVE deadline across every backoffLimit-driven pod retry
  # (not per-pod). Must stay comfortably above the combined worst-case runtime
  # of both init containers (wait-for-admin-secret + wait-for-aap, see
  # osac-aap.waitForAapScript's docstring in _helpers.tpl for the math) so a
  # stuck attempt hits the script's own clean "Timeout waiting for AAP" exit
  # (diagnosable, lets backoffLimit retry) rather than being silently
  # SIGKILLed by DeadlineExceeded mid-attempt. Note: osac-installer's
  # `make install-osac` wraps this in `helm ... --timeout 40m --wait`, a
  # separate, tighter ceiling on the overall install that this value doesn't
  # control.
  activeDeadlineSeconds: 8400
  template:
    metadata:
      labels:
        {{- include "osac-aap.labels" . | nindent 8 }}
    spec:
      # osac-sa (cluster-admin, see osac-sa.yaml) resolves to the anyuid SCC on
      # OpenShift rather than a range-constrained SCC like restricted-v2, so
      # unlike bootstrap-job.yaml's dedicated, non-admin ServiceAccount, this
      # pod gets no non-root UID auto-assigned. Without an explicit runAsUser,
      # the init containers' runAsNonRoot: true (see
      # osac-aap.waitForAapContainerSpec / osac-aap.waitForAdminSecretContainerSpec
      # in _helpers.tpl) fails admission outright -- origin-cli has no non-root
      # default user -- permanently blocking every backoffLimit retry instead of
      # guarding the transient readiness race those templates target. anyuid
      # accepts any explicit UID, so this is safe regardless of which one is used.
      securityContext:
        runAsUser: 1000
      initContainers:
      - name: wait-for-admin-secret
        image: {{ .Values.bootstrap.cliImage }}
        command:
          - /bin/bash
          - -c
          - |
            {{- include "osac-aap.waitForAdminSecretScript" . | nindent 12 }}
        {{- include "osac-aap.waitForAdminSecretContainerSpec" . | nindent 8 }}
      - name: wait-for-aap
        image: {{ .Values.bootstrap.cliImage }}
        command:
          - /bin/bash
          - -c
          - |
            {{- include "osac-aap.waitForAapScript" . | nindent 12 }}
        {{- include "osac-aap.waitForAapContainerSpec" . | nindent 8 }}
      containers:
      - name: create-token
        image: {{ .Values.bootstrap.cliImage }}
        command:
          - /bin/bash
          - -c
          - |
            set -euo pipefail
            AAP_PASSWORD=$(cat /var/run/secrets/aap-admin/password)
            # Credentials go into a netrc file rather than curl's -u flag: -u puts the
            # password on the command line, readable by any process in this container's
            # PID namespace (/proc/<pid>/cmdline, `ps`). Same pattern as the shared
            # wait-for-aap readiness script in _helpers.tpl.
            trap 'rm -f /tmp/.netrc' EXIT
            ( umask 077; printf 'machine %s\nlogin admin\npassword %s\n' "{{ include "osac-aap.gatewayHostname" . }}" "${AAP_PASSWORD}" > /tmp/.netrc )
            echo "Creating AAP API token..."
            TOKEN=$(curl -s --connect-timeout 5 --max-time 30 -X POST \
              --netrc-file /tmp/.netrc \
              -H "Content-Type: application/json" \
              -d '{"description": "osac-operator", "scope": "write"}' \
              "http://{{ include "osac-aap.gatewayHostname" . }}/api/gateway/v1/tokens/" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")
            [[ -n "${TOKEN}" ]] || { echo "ERROR: Token was empty"; exit 1; }
            echo "Storing token in secret osac-aap-api-token..."
            cat <<YAML | oc apply -f -
            apiVersion: v1
            kind: Secret
            metadata:
              name: osac-aap-api-token
              namespace: {{ .Release.Namespace }}
            type: Opaque
            stringData:
              token: "${TOKEN}"
            YAML
            echo "Token created and stored."
            echo "Restarting operator to pick up new token..."
            oc rollout restart deploy/osac-operator -n {{ .Release.Namespace }}
            oc rollout status deploy/osac-operator -n {{ .Release.Namespace }} --timeout=120s
            echo "Operator restarted."
            if oc get deploy/bmf-operator-controller-manager -n {{ .Release.Namespace }} &>/dev/null; then
              echo "Restarting BMF operator to pick up new token..."
              oc rollout restart deploy/bmf-operator-controller-manager -n {{ .Release.Namespace }}
              oc rollout status deploy/bmf-operator-controller-manager -n {{ .Release.Namespace }} --timeout=120s
              echo "BMF operator restarted."
            fi
        env:
        - name: HOME
          value: /tmp
        volumeMounts:
        - name: aap-admin-password
          mountPath: /var/run/secrets/aap-admin
          readOnly: true
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: aap-admin-password
        secret:
          secretName: {{ include "osac-aap.instanceName" . }}-admin-password
      - name: tmp
        emptyDir: {}
      serviceAccountName: {{ .Values.serviceAccounts.osacSa }}
      restartPolicy: Never
{{- end }}
