---
# ExternalIPAttachment -> Netris DNAT rule osac-eipa-<attachment id>:
# external_ip.address -> destination.address, in the VPC osac-vn-<VN id> of a
# tenant_virtual_network destination or in NETRIS_MGMT_VPC_ID for
# provider_management. Get-or-create by name; a rule of the same name in another
# VPC or with other addresses is a final error.
- name: Attach the ExternalIP on Netris
  block:
    - name: Check the settings
      ansible.builtin.include_tasks: _settings.yaml
      vars:
        netris_require: [controller, credentials, site, tenant]

    - name: Check the task input
      ansible.builtin.include_tasks: _input.yaml

    - name: Plan the DNAT rule
      ansible.builtin.set_fact:
        _netris_nat: "{{ osac_job_vars | osac.templates.netris_nat_plan }}"

    - name: Stop on an invalid attachment input
      vars:
        netris_fail:
          message: "{{ _netris_nat.error }}"
          retryable: false
      when: _netris_nat.error | length > 0
      ansible.builtin.include_tasks: _fail.yaml

    - name: Build the object names
      ansible.builtin.include_tasks: _names.yaml

    - name: Find the VPC of the destination
      ansible.builtin.include_tasks: _nat_vpc.yaml
      vars:
        netris_nat_domain: "{{ _netris_nat.domain }}"
        netris_nat_vpc_required: true

    - name: Create the DNAT rule
      ansible.builtin.include_role:
        name: netris.controller.nat
        tasks_from: create
      vars:
        nat_name: "{{ netris_names.eipa_dnat }}"
        nat_site_id: "{{ netris_site_id | int }}"
        nat_vpc_id: "{{ netris_nat_vpc.id }}"
        nat_vpc_name: "{{ netris_nat_vpc.name }}"
        nat_action: dnat
        nat_protocol: all
        nat_destination_address: "{{ _netris_nat.external }}/32"
        nat_dnat_to_ip: "{{ _netris_nat.internal }}/32"
        nat_comment: "OSAC ExternalIPAttachment {{ netris_in.resource_id }}"
  rescue:
    - name: Report the error
      ansible.builtin.include_tasks: _rescue.yaml
