---
argument_specs:
  main:
    options:
      cluster_infra_state:
        type: str
        choices: [present, absent]
      cluster_infra_name:
        type: str
        required: true
      cluster_infra_namespace:
        type: str
        required: true
      cluster_infra_node_requests:
        type: list
        elements: dict
        default: []
