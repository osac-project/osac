{{- if .Values.netbox.enabled }}
{{- $tokenSecretName := .Values.secrets.netboxToken }}
{{- $tokenSecretKey := .Values.netbox.tokenSecretKey }}
{{- $existingTokenSecret := lookup "v1" "Secret" .Release.Namespace $tokenSecretName }}
{{- $existingTokenData := dict }}
{{- $isCurrentReleaseTokenSecret := false }}
{{- if $existingTokenSecret }}
{{- $existingTokenData = default dict $existingTokenSecret.data }}
{{- if not (hasKey $existingTokenData $tokenSecretKey) }}
{{- fail (printf "Secret %q must contain key %q when netbox.enabled is true" $tokenSecretName $tokenSecretKey) }}
{{- end }}
{{- $labels := default dict $existingTokenSecret.metadata.labels }}
{{- $annotations := default dict $existingTokenSecret.metadata.annotations }}
{{- $isCurrentReleaseTokenSecret = and
  (eq (get $labels "app.kubernetes.io/managed-by") .Release.Service)
  (eq (get $annotations "meta.helm.sh/release-name") .Release.Name)
  (eq (get $annotations "meta.helm.sh/release-namespace") .Release.Namespace)
}}
{{- else if not .Values.netbox.tokenValue }}
{{- fail (printf "netbox.tokenValue is required when Secret %q does not exist" $tokenSecretName) }}
{{- end }}
{{- $renderTokenSecret := or (not $existingTokenSecret) $isCurrentReleaseTokenSecret }}
{{- if $renderTokenSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tokenSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bare-metal-fulfillment-operator.labels" . | nindent 4 }}
type: Opaque
{{- if $existingTokenSecret }}
data:
{{- toYaml $existingTokenData | nindent 2 }}
{{- else }}
stringData:
  {{ $tokenSecretKey | quote }}: {{ .Values.netbox.tokenValue | quote }}
{{- end }}
{{- end }}
{{- if .Values.netbox.caCert }}
{{- if $renderTokenSecret }}
---
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.netboxCA }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bare-metal-fulfillment-operator.labels" . | nindent 4 }}
type: Opaque
stringData:
  ca.crt: |
{{ .Values.netbox.caCert | nindent 4 }}
{{- end }}
{{- end }}
