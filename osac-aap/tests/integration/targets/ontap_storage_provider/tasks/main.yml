# ── Test 6: teardown_cluster_storage removes TBC and SCs ──
- name: "ONTAP Storage Provider - Teardown cluster storage"
  hosts: localhost
  gather_facts: false

  vars:
    tenant_name: "test-ontap"
    tenant_namespace: "osac-system"
    _t_assignment_key: "{{ (('ontap-be-1' ~ '|' ~ tenant_name) | hash('sha256'))[:16] | lower }}"
    _drift_assignment_key: "{{ (('ontap-be-drifted' ~ '|' ~ tenant_name) | hash('sha256'))[:16] | lower }}"
    storage_provider_tiers:
      - name: gold
        protocol: block
        provider: ontap
        backend_id: ontap-be-1
    storage_provider_backend_connections:
      ontap-be-1:
        endpoint: "https://10.46.246.90"

  tasks:
    - name: Seed a drifted backend's labeled TBC and CSI Secret
      kubernetes.core.k8s:
        state: present
        definition: "{{ item }}"
      loop:
        - apiVersion: trident.netapp.io/v1
          kind: TridentBackendConfig
          metadata:
            name: "ontap-{{ _drift_assignment_key }}"
            namespace: trident
            labels:
              app.kubernetes.io/managed-by: osac-aap
              osac.openshift.io/tenant: "{{ tenant_name }}"
              osac.openshift.io/storage-provider: ontap
          spec: {}
        - apiVersion: v1
          kind: Secret
          metadata:
            name: "ontap-csi-{{ _drift_assignment_key }}"
            namespace: trident
            labels:
              app.kubernetes.io/managed-by: osac-aap
              osac.openshift.io/tenant: "{{ tenant_name }}"
              osac.openshift.io/storage-provider: ontap
          type: Opaque
          stringData:
            username: drift-user
            password: "{{ lookup('env', 'OSAC_TEST_ONTAP_RUNTIME_PASSWORD') | default(lookup('env', 'OSAC_TEST_TENANT_PASSWORD'), true) }}"
      loop_control:
        label: "drifted-resource"
      no_log: true

    - name: Call storage_provider role with teardown_cluster_storage action
      ansible.builtin.include_role:
        name: osac.service.storage_provider
      vars:
        storage_provider_action: teardown_cluster_storage

    - name: Read back the TBCs by label
      kubernetes.core.k8s_info:
        api_version: trident.netapp.io/v1
        kind: TridentBackendConfig
        namespace: trident
        label_selectors:
          - "osac.openshift.io/tenant=test-ontap"
          - "osac.openshift.io/storage-provider=ontap"
      register: _tbc_after
      no_log: true

    - name: Assert all TBCs are gone (dispatched and drifted)
      ansible.builtin.assert:
        that:
          - _tbc_after.resources | length == 0
        fail_msg: "TBCs should be removed by teardown_cluster_storage"
        success_msg: "TBC removed (dispatched and drifted)"
      no_log: true

    - name: Read back the StorageClasses by label
      kubernetes.core.k8s_info:
        api_version: storage.k8s.io/v1
        kind: StorageClass
        label_selectors:
          - "osac.openshift.io/tenant=test-ontap"
          - "osac.openshift.io/storage-provider=ontap"
      register: _scs_after
      no_log: true

    - name: Assert the StorageClasses are gone
      ansible.builtin.assert:
        that:
          - _scs_after.resources | length == 0
        fail_msg: "StorageClasses should be removed by teardown_cluster_storage"
        success_msg: "StorageClasses removed"
      no_log: true

    - name: Read back the CSI Secrets by label
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: trident
        label_selectors:
          - "osac.openshift.io/tenant=test-ontap"
          - "osac.openshift.io/storage-provider=ontap"
      register: _csi_secrets_after
      no_log: true

    - name: Assert all CSI Secrets are gone (dispatched and drifted)
      ansible.builtin.assert:
        that:
          - _csi_secrets_after.resources | length == 0
        fail_msg: "CSI Secrets should be removed by teardown_cluster_storage"
        success_msg: "CSI Secret removed (dispatched and drifted)"
      no_log: true

# ── Test 7: prepare-ontap-svm.sh creates operator-compatible preparation Secrets ──
- name: "ONTAP Storage Provider - Developer preparation script (prepare-ontap-svm.sh)"
  hosts: localhost
  gather_facts: false

  vars:
    _prep_script: "{{ playbook_dir }}/../../../../../../osac-installer/scripts/dev-full/prepare-ontap-svm.sh"

  tasks:
    - name: Create a test Tenant CR with immutable osac.openshift.io/tenant-id label
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: osac.openshift.io/v1alpha1
          kind: Tenant
          metadata:
            name: test-ontap-prep
            namespace: osac-system
            labels:
              osac.openshift.io/tenant-id: tid-test-ontap-prep
          spec: {}
      no_log: true

    - name: Run prepare-ontap-svm.sh to create the storage-tenant-preparation Secret
      ansible.builtin.command:
        argv:
          - "{{ _prep_script }}"
          - "--tenant"
          - "test-ontap-prep"
          - "--backend"
          - "ontap-primary"
          - "--backend-id"
          - "ontap-be-1"
          - "--svm"
          - "svm_test_ontap_prep"
          - "--username"
          - "trident_test_prep"
          - "--generate-password"
      changed_when: true
      no_log: true

    - name: Query preparation Secret using osac-operator's label selector
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: osac-storage
        label_selectors:
          - "osac.openshift.io/secret-type=storage-tenant-preparation"
          - "osac.openshift.io/storage-backend=ontap-primary"
          - "osac.openshift.io/storage-backend-id=ontap-be-1"
          - "osac.openshift.io/tenant=test-ontap-prep"
          - "osac.openshift.io/tenant-id=tid-test-ontap-prep"
      register: _prep_secret_lookup
      no_log: true

    - name: Assert prepare-ontap-svm.sh created a valid storage-tenant-preparation Secret
      ansible.builtin.assert:
        that:
          - _prep_secret_lookup.resources | length == 1
          - _prep_secret_lookup.resources[0].metadata.labels['osac.openshift.io/storage-backend'] == 'ontap-primary'
          - _prep_secret_lookup.resources[0].metadata.labels['osac.openshift.io/tenant'] == 'test-ontap-prep'
          - _prep_secret_lookup.resources[0].data.username | b64decode == 'trident_test_prep'
          - _prep_secret_lookup.resources[0].data.svm | b64decode == 'svm_test_ontap_prep'
          - (_prep_secret_lookup.resources[0].data.password | b64decode | length) > 0
        fail_msg: "prepare-ontap-svm.sh did not create expected storage-tenant-preparation Secret"
        success_msg: "prepare-ontap-svm.sh created operator-compatible storage-tenant-preparation Secret"
      no_log: true

    - name: Delete test Tenant CR before recreating without osac.openshift.io/tenant-id label
      kubernetes.core.k8s:
        state: absent
        api_version: osac.openshift.io/v1alpha1
        kind: Tenant
        name: test-ontap-prep
        namespace: osac-system
      no_log: true

    - name: Recreate test Tenant CR without osac.openshift.io/tenant-id label
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: osac.openshift.io/v1alpha1
          kind: Tenant
          metadata:
            name: test-ontap-prep
            namespace: osac-system
          spec: {}
      no_log: true

    - name: Run prepare-ontap-svm.sh with --backend only (omitting --backend-id and --tenant-id)
      ansible.builtin.command:
        argv:
          - "{{ _prep_script }}"
          - "--tenant"
          - "test-ontap-prep"
          - "--backend"
          - "ontap-primary"
          - "--svm"
          - "svm_test_ontap_prep_fallback"
          - "--username"
          - "trident_test_prep_fallback"
          - "--generate-password"
      changed_when: true
      no_log: true

    - name: Query fallback preparation Secret created with --backend only
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: ontap-prep-test-ontap-prep-ontap-primary
        namespace: osac-storage
      register: _prep_fallback_secret_lookup
      no_log: true

    - name: Assert prepare-ontap-svm.sh created ontap-prep-test-ontap-prep-ontap-primary with fallback labels
      ansible.builtin.assert:
        that:
          - _prep_fallback_secret_lookup.resources | length == 1
          - _prep_fallback_secret_lookup.resources[0].metadata.name == 'ontap-prep-test-ontap-prep-ontap-primary'
          - _prep_fallback_secret_lookup.resources[0].metadata.namespace == 'osac-storage'
          - _prep_fallback_secret_lookup.resources[0].metadata.labels['osac.openshift.io/secret-type'] == 'storage-tenant-preparation'
          - _prep_fallback_secret_lookup.resources[0].metadata.labels['osac.openshift.io/storage-backend'] == 'ontap-primary'
          - _prep_fallback_secret_lookup.resources[0].metadata.labels['osac.openshift.io/storage-backend-id'] == 'ontap-primary'
          - _prep_fallback_secret_lookup.resources[0].metadata.labels['osac.openshift.io/tenant'] == 'test-ontap-prep'
          - _prep_fallback_secret_lookup.resources[0].metadata.labels['osac.openshift.io/tenant-id'] == 'test-ontap-prep'
          - _prep_fallback_secret_lookup.resources[0].data.username | b64decode == 'trident_test_prep_fallback'
          - _prep_fallback_secret_lookup.resources[0].data.svm | b64decode == 'svm_test_ontap_prep_fallback'
          - (_prep_fallback_secret_lookup.resources[0].data.password | b64decode | length) > 0
        fail_msg: "prepare-ontap-svm.sh --backend fallback did not create expected Secret or labels"
        success_msg: "prepare-ontap-svm.sh --backend fallback created Secret with expected labels"
      no_log: true

    - name: Clean up fallback preparation Secret ontap-prep-test-ontap-prep-ontap-primary
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Secret
        name: ontap-prep-test-ontap-prep-ontap-primary
        namespace: osac-storage
      no_log: true

    - name: Run prepare-ontap-svm.sh in batch --map mode with --password-stdin and non-DNS backend-id
      ansible.builtin.command:
        argv:
          - "{{ _prep_script }}"
          - "--backend"
          - "ontap-primary"
          - "--backend-id"
          - "ONTAP_BE.Batch_1"
          - "--map"
          - "test-ontap-prep:svm_batch_1:trident_batch_1"
          - "--map"
          - "test-ontap-prep-2:svm_batch_2:trident_batch_2:tid-batch-2:ontap-prep-custom-batch-2"
          - "--password-stdin"
        stdin: "{{ lookup('env', 'OSAC_TEST_ONTAP_RUNTIME_PASSWORD') | default(lookup('env', 'OSAC_TEST_TENANT_PASSWORD'), true) }}\n"
      changed_when: true
      no_log: true

    - name: Query normalized Secret created by first --map entry
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: ontap-prep-test-ontap-prep-ontap-be-batch-1
        namespace: osac-storage
      register: _prep_batch_secret_1
      no_log: true

    - name: Query explicit-name Secret created by second --map entry
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: ontap-prep-custom-batch-2
        namespace: osac-storage
      register: _prep_batch_secret_2
      no_log: true

    - name: Verify batch --password-stdin Secret passwords match runtime fixture in constant time
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - "import hmac, os, sys; sys.exit(0 if (hmac.compare_digest(os.environ['ACTUAL_1'], os.environ['EXPECTED']) and hmac.compare_digest(os.environ['ACTUAL_2'], os.environ['EXPECTED'])) else 1)"
      environment:
        ACTUAL_1: "{{ _prep_batch_secret_1.resources[0].data.password | default('') | b64decode }}"
        ACTUAL_2: "{{ _prep_batch_secret_2.resources[0].data.password | default('') | b64decode }}"
        EXPECTED: "{{ lookup('env', 'OSAC_TEST_ONTAP_RUNTIME_PASSWORD') | default(lookup('env', 'OSAC_TEST_TENANT_PASSWORD'), true) }}"
      changed_when: false
      no_log: true

    - name: Assert batch --map mode, safe_backend normalization, and --password-stdin worked
      ansible.builtin.assert:
        that:
          - _prep_batch_secret_1.resources | length == 1
          - _prep_batch_secret_1.resources[0].metadata.labels['osac.openshift.io/storage-backend-id'] == 'ONTAP_BE.Batch_1'
          - _prep_batch_secret_1.resources[0].data.svm | b64decode == 'svm_batch_1'
          - (_prep_batch_secret_1.resources[0].data.password | default('') | b64decode | length) > 0
          - _prep_batch_secret_2.resources | length == 1
          - _prep_batch_secret_2.resources[0].metadata.labels['osac.openshift.io/tenant-id'] == 'tid-batch-2'
          - _prep_batch_secret_2.resources[0].data.svm | b64decode == 'svm_batch_2'
          - (_prep_batch_secret_2.resources[0].data.password | default('') | b64decode | length) > 0
        fail_msg: "prepare-ontap-svm.sh batch --map mode or --password-stdin did not produce expected Secrets"
        success_msg: "prepare-ontap-svm.sh batch --map mode and --password-stdin verified"
      no_log: true

    - name: Clean up batch preparation Secrets
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Secret
        name: "{{ item }}"
        namespace: osac-storage
      loop:
        - ontap-prep-test-ontap-prep-ontap-be-batch-1
        - ontap-prep-custom-batch-2
      no_log: true

# ── Test 8: Shared-TBC setup validates profiles and pool selectors ──
- name: "ONTAP Storage Provider - Shared-TBC setup validation"
  hosts: localhost
  gather_facts: false

  vars:
    tenant_name: "test-ontap-shared"
    tenant_namespace: "osac-system"
    _t_assignment_key: "{{ (('ontap-shared-1' ~ '|' ~ tenant_name) | hash('sha256'))[:16] | lower }}"
    storage_provider_tiers:
      - name: extreme
        protocol: block
        provider: ontap
        backend_id: ontap-shared-1
        provider_config:
          profile: shared-fc
          pool_selector:
            performance: extreme
      - name: value
        protocol: block
        provider: ontap
        backend_id: ontap-shared-1
        provider_config:
          profile: shared-fc
          pool_selector:
            performance: value
    storage_provider_backend_connections:
      ontap-shared-1:
        provider_config:
          profiles:
            - name: shared-fc
              shared:
                tbc_namespace: trident
                tbc_name: customer-fc

  tasks:
    - name: Call storage_provider role with setup action for Shared-TBC backend
      ansible.builtin.include_role:
        name: osac.service.storage_provider
      vars:
        storage_provider_action: setup

    - name: Assert Shared-TBC tenant config output fact was set
      ansible.builtin.assert:
        that:
          - storage_provider_tenant_configs is defined
          - storage_provider_tenant_configs['ontap']['ontap-shared-1'].assignment_key == _t_assignment_key
          - storage_provider_tenant_configs['ontap']['ontap-shared-1'].mode == 'shared'
          - storage_provider_tenant_configs['ontap']['ontap-shared-1'].profiles['shared-fc'].tbc_namespace == 'trident'
          - storage_provider_tenant_configs['ontap']['ontap-shared-1'].profiles['shared-fc'].tbc_name == 'customer-fc'
          - storage_provider_tenant_configs['ontap']['ontap-shared-1'].status == 'ready'
        fail_msg: "Shared-TBC setup did not produce expected storage_provider_tenant_configs"
        success_msg: "Shared-TBC setup output verified"
      no_log: true

    - name: Attempt Shared-TBC setup with a malformed pool_selector containing semicolon
      block:
        - name: Call storage_provider setup with invalid pool_selector value
          ansible.builtin.include_role:
            name: osac.service.storage_provider
          vars:
            storage_provider_action: setup
            storage_provider_tiers:
              - name: extreme
                protocol: block
                provider: ontap
                backend_id: ontap-shared-1
                provider_config:
                  profile: shared-fc
                  pool_selector:
                    performance: "extreme;injected=1"
      rescue:
        - name: Record malformed pool_selector rejection
          ansible.builtin.set_fact:
            _malformed_selector_rejected: true

    - name: Assert malformed pool_selector was rejected
      ansible.builtin.assert:
        that:
          - _malformed_selector_rejected | default(false) | bool
        fail_msg: "Shared-TBC setup must reject pool_selector values containing ';'"
        success_msg: "Shared-TBC setup rejected malformed pool_selector"

    - name: Attempt Shared-TBC setup with an unknown profile reference
      block:
        - name: Call storage_provider setup with unknown profile name
          ansible.builtin.include_role:
            name: osac.service.storage_provider
          vars:
            storage_provider_action: setup
            storage_provider_tiers:
              - name: extreme
                protocol: block
                provider: ontap
                backend_id: ontap-shared-1
                provider_config:
                  profile: unknown-profile
                  pool_selector:
