[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osac-e2e"
version = "0.1.0"
description = "OSAC end-to-end test infrastructure"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "pyyaml>=6.0",
    "websocket-client>=1.6",
]

[project.scripts]
osac-conformance = "tests.conformance.cli:main"

[tool.setuptools.packages.find]
include = ["tests*"]

[tool.setuptools.package-data]
"tests.conformance" = ["*.yaml", "areas/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "conformance_generic: test selected by the generic selector",
    "conformance_vmaas: test selected by the vmaas selector",
    "conformance_bmaas: test selected by the bmaas selector",
    "conformance_caas: test selected by the caas selector",
    "conformance_netris: test selected by the netris selector",
    "conformance_blocking: blocking conformance test",
    "conformance_informing: informing conformance test",
    "sig_networking: test belongs to the networking domain",
]
pythonpath = ["."]
addopts = "-n 4 --dist loadfile"
log_level = "INFO"
log_cli = true
log_cli_date_format = "%Y-%m-%dT%H:%M:%S%z"
log_cli_format = "%(asctime)s %(levelname)-8s %(message)s"
log_cli_level = "INFO"
log_file = "/tmp/test-output/e2e.log"
log_file_date_format = "%Y-%m-%dT%H:%M:%S%z"
log_file_format = "%(asctime)s %(levelname)-8s %(name)s %(message)s"
log_file_level = "INFO"
log_file_mode = "a"

[tool.basedpyright]
reportUnusedCallResult = false
reportAny = false
reportExplicitAny = false

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "ANN", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN101", "ANN201"]
