{{- /*
The manager needs get/create/update/delete access to per-host BMC Secrets.
Their names are dynamic, so RBAC cannot restrict access by Secret name; keep
the BMH namespace dedicated to BareMetalHosts and their BMC credentials.
*/ -}}
{{- $bmhNamespace := "" -}}
{{- if .Values.bcm.enabled -}}
{{- $bmhNamespace = .Values.bcm.bmhNamespace -}}
{{- else if .Values.netbox.enabled -}}
{{- $bmhNamespace = .Values.netbox.bmhNamespace -}}
{{- end -}}
{{- if $bmhNamespace }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "bare-metal-fulfillment-operator.fullname" . }}-bmc-secrets
  namespace: {{ $bmhNamespace }}
  labels:
    {{- include "bare-metal-fulfillment-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "bare-metal-fulfillment-operator.fullname" . }}-bmc-secrets
  namespace: {{ $bmhNamespace }}
  labels:
    {{- include "bare-metal-fulfillment-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "bare-metal-fulfillment-operator.fullname" . }}-bmc-secrets
subjects:
- kind: ServiceAccount
  name: {{ include "bare-metal-fulfillment-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
