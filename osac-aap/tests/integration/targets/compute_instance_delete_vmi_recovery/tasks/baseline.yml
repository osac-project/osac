  gather_facts: false
  vars_files:
    - ../../../common_vars.yml
  vars:
    compute_instance_name: vmi-recovery-no-launcher
    compute_instance_target_namespace: test-subnet
    guest_os_family: linux
    compute_instance:
      spec: {}
    # Override production default (60) to avoid 5-min wait.
    ocp_virt_vm_graceful_wait_retries: 2
  tasks:
    - name: "S3: Run test with cleanup"
      block:
        - name: "S3: Create stuck VMI (no launcher)"
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: kubevirt.io/v1
              kind: VirtualMachineInstance
              metadata:
                name: "{{ compute_instance_name }}"
                namespace: >-
