name: Check pull request

# Required check names: Check Python code, Check Go and proto code, Build binaries
# No paths on pull_request: a trigger path filter leaves those names pending
# in the merge queue on PRs that do not touch fulfillment-service. Skip is on steps.

on:
  pull_request:
    branches:
    - main
  merge_group:

permissions:
  contents: read

jobs:

  # check-pre-commit (fulfillment-service's own .pre-commit-config-ci.yaml) is
  # intentionally removed here: the root pre-commit.yaml workflow now runs the
  # same hook set (trailing-whitespace, yamllint, etc.) repo-wide with
  # correctly component-scoped excludes, making this duplicate redundant.

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should-run: ${{ steps.filter.outputs.service == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.event_name == 'merge_group'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          filters: |
            service:
              - 'fulfillment-service/**'
              - '!fulfillment-service/OWNERS'
              - '!fulfillment-service/LICENSE'
              - '!fulfillment-service/**/*.md'
              - '!fulfillment-service/docs/**'
              - '.github/workflows/check-pull-request.yaml'

  check-python-code:
    name: Check Python code
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Fail if path filter failed
      if: needs.changes.result != 'success'
      run: exit 1
    - id: should-run
      if: needs.changes.result == 'success' && needs.changes.outputs.should-run == 'true'
      run: echo "run=true" >> "$GITHUB_OUTPUT"
    - if: steps.should-run.outputs.run
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - if: steps.should-run.outputs.run
      uses: ./.github/actions/setup-python
    - if: steps.should-run.outputs.run
      working-directory: fulfillment-service
      run: uv run ruff check

  check-go-code:
    name: Check Go and proto code
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Fail if path filter failed
      if: needs.changes.result != 'success'
      run: exit 1
    - id: should-run
      if: needs.changes.result == 'success' && needs.changes.outputs.should-run == 'true'
      run: echo "run=true" >> "$GITHUB_OUTPUT"
    - if: steps.should-run.outputs.run
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - if: steps.should-run.outputs.run
      uses: ./.github/actions/setup-go
      with:
        working-directory: fulfillment-service
    - if: steps.should-run.outputs.run
      uses: ./.github/actions/setup-python
    - if: steps.should-run.outputs.run
      uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3  # v1
      with:
        version: '1.50.0'
        setup_only: true
    - if: steps.should-run.outputs.run
      working-directory: fulfillment-service
      run: |
        uv run dev.py lint

  # check-generated-code (buf generate + diff) now lives in the shared,
  # component-matrixed .github/workflows/check-generated-code.yaml alongside
  # osac-operator's equivalent -- identical steps, only the directory differs.

  build-binaries:
    name: Build binaries
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Fail if path filter failed
      if: needs.changes.result != 'success'
      run: exit 1
    - id: should-run
      if: needs.changes.result == 'success' && needs.changes.outputs.should-run == 'true'
      run: echo "run=true" >> "$GITHUB_OUTPUT"
    - if: steps.should-run.outputs.run
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - if: steps.should-run.outputs.run
      uses: ./.github/actions/setup-go
      with:
        working-directory: fulfillment-service
    - if: steps.should-run.outputs.run
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7
      with:
        workdir: fulfillment-service
        args: build --snapshot --clean

  # Single required check aggregating the 3 jobs above, so PRs see one
  # "check-pull-request" line instead of 3. `skipped` counts as pass, same
  # as a real success -- only an actual failure or cancellation fails this
  # job. Mirrors the e2e-*-gate jobs' pattern in
  # e2e-vmaas-full-install.yml et al.
  check-pull-request:
    if: always()
    needs: [changes, check-python-code, check-go-code, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "Upstream job results:"
          echo "  changes: ${{ needs.changes.result }}"
          echo "  check-python-code: ${{ needs.check-python-code.result }}"
          echo "  check-go-code: ${{ needs.check-go-code.result }}"
          echo "  build-binaries: ${{ needs.build-binaries.result }}"
          echo ""
          echo "One or more upstream jobs failed or were cancelled."
          exit 1
      - if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: echo "All checks passed (or were skipped)."
