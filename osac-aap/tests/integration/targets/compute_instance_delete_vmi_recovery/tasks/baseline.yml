# Scenario 6 — Cross-VMI identity boundary: a Running
# pod with no ownerReferences and a mismatched
# created-by label is excluded by vmi_owned_pods.
# Recovery sees zero owned pods and proceeds with
# cleanup.  If the ownership filter were removed, the
# namespace pod list would include this Running pod
# and _owned_pods_terminal would be false.

- name: >-
    Scenario 6: Cross-VMI identity boundary
    (wrong UID ignored)
  hosts: localhost
  gather_facts: false
  vars:
    compute_instance_name: test-vmi-s6
    compute_instance_target_namespace: test-subnet
    guest_os_family: linux
    compute_instance:
      spec: {}
    ocp_virt_vm_graceful_wait_retries: 2
  tasks:
    - name: "S6: Run test with cleanup"
      block:
        - name: "S6: Clean up previous resources"
          kubernetes.core.k8s:
            state: absent
            api_version: "{{ item.api }}"
            kind: "{{ item.kind }}"
            name: "{{ item.name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
          loop:
            - api: kubevirt.io/v1
              kind: VirtualMachine
              name: "{{ compute_instance_name }}"
            - api: kubevirt.io/v1
              kind: VirtualMachineInstance
              name: "{{ compute_instance_name }}"
            - api: v1
              kind: Pod
              name: >-
                virt-launcher-{{
                compute_instance_name }}-alien
            - api: v1
              kind: Service
              name: >-
                {{ compute_instance_name
                }}-load-balancer
            - api: cdi.kubevirt.io/v1beta1
              kind: DataVolume
              name: >-
                {{ compute_instance_name
                }}-root-disk
            - api: v1
              kind: Secret
              name: >-
                {{ compute_instance_name
                }}-cloud-init
          failed_when: false

        - name: "S6: Create stuck VMI"
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: kubevirt.io/v1
              kind: VirtualMachineInstance
              metadata:
                name: "{{ compute_instance_name }}"
                namespace: >-
                  {{
                  compute_instance_target_namespace
                  }}
                finalizers:
                  - >-
                    kubevirt.io/foregroundDeleteVirtualMachine
              spec:
                domain:
                  devices: {}
                  resources:
                    requests:
                      memory: 128Mi

        - name: "S6: Request VMI deletion"
          kubernetes.core.k8s:
            state: absent
            api_version: kubevirt.io/v1
            kind: VirtualMachineInstance
            name: "{{ compute_instance_name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
          register: s6_delete_result
          failed_when: false

        - name: "S6: Verify VMI is stuck"
          kubernetes.core.k8s_info:
            api_version: kubevirt.io/v1
            kind: VirtualMachineInstance
            name: "{{ compute_instance_name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
          register: s6_vmi_check
          failed_when: >
            s6_vmi_check.resources | length == 0 or
            (s6_vmi_check.resources[0]
            .metadata.deletionTimestamp
            | default('')) == ''

        - name: >-
            S6: Create Running pod with wrong label
          # No ownerReferences — avoids Kubernetes GC
          # dependency on the target VMI.  The pod has
          # a mismatched created-by label, so the
          # vmi_owned_pods legacy fallback excludes it.
          # If the ownership filter were removed, the
          # namespace-wide pod list would include this
          # Running pod and _owned_pods_terminal would
          # be false, blocking recovery.
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Pod
              metadata:
                name: >-
                  virt-launcher-{{
                  compute_instance_name }}-alien
                namespace: >-
                  {{
                  compute_instance_target_namespace
                  }}
                labels:
                  kubevirt.io: virt-launcher
                  kubevirt.io/created-by: >-
                    00000000-0000-0000-0000-ffffffffffff
                annotations:
                  kubevirt.io/domain: >-
                    {{ compute_instance_name }}
              spec:
                restartPolicy: Never
                containers:
                  - name: compute
                    image: >-
                      registry.k8s.io/pause:3.9

        - name: "S6: Wait for alien launcher Running"
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Pod
            name: >-
              virt-launcher-{{
              compute_instance_name }}-alien
            namespace: >-
              {{ compute_instance_target_namespace }}
          register: s6_alien_wait
          until: >
            s6_alien_wait.resources | length > 0 and
            (s6_alien_wait.resources[0].status.phase
            | default('')) == 'Running'
          retries: 30
          delay: 2

        - name: >-
            S6: Assert alien pod has no ownerRefs,
            wrong label, and is Running
          ansible.builtin.assert:
            that:
              - >-
                s6_alien_wait.resources | length > 0
              - >-
                s6_alien_wait.resources[0].status.phase
                == 'Running'
              - >-
                (s6_alien_wait.resources[0]
                .metadata.ownerReferences
                | default([]) | length) == 0
              - >-
                s6_alien_wait.resources[0]
                .metadata.labels
                ['kubevirt.io/created-by']
                != (s6_vmi_check.resources[0]
                .metadata.uid)
            fail_msg: >-
              Alien pod must be Running with no
              ownerReferences and a created-by label
              that differs from the target VMI UID.

        - name: "S6: Create minimal VM fixture"
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: kubevirt.io/v1
              kind: VirtualMachine
              metadata:
                name: "{{ compute_instance_name }}"
                namespace: >-
                  {{
                  compute_instance_target_namespace
                  }}
              spec:
                runStrategy: Always
                template:
                  spec:
                    domain:
                      devices: {}
                      resources:
                        requests:
                          memory: 128Mi

        - name: "S6: Create dependent resource fixtures"
          kubernetes.core.k8s:
            state: present
            definition: "{{ item }}"
          loop:
            - apiVersion: v1
              kind: Service
              metadata:
                name: >-
                  {{ compute_instance_name
                  }}-load-balancer
                namespace: >-
                  {{
                  compute_instance_target_namespace
                  }}
              spec:
                ports:
                  - port: 22
                    targetPort: 22
            - apiVersion: cdi.kubevirt.io/v1beta1
              kind: DataVolume
              metadata:
                name: >-
                  {{ compute_instance_name
                  }}-root-disk
                namespace: >-
                  {{
                  compute_instance_target_namespace
                  }}
              spec:
                source:
                  blank: {}
                pvc:
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 1Mi
            - apiVersion: v1
              kind: Secret
              metadata:
                name: >-
                  {{ compute_instance_name
                  }}-cloud-init
                namespace: >-
                  {{
                  compute_instance_target_namespace
                  }}
              type: Opaque
              data:
                userdata: ""

        - name: "S6: Verify fixtures exist"
          kubernetes.core.k8s_info:
            api_version: "{{ item.api }}"
            kind: "{{ item.kind }}"
            name: "{{ item.name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
          register: _s6_fixture_check
          failed_when: >-
            _s6_fixture_check.resources
            | length == 0
          loop:
            - api: v1
              kind: Service
              name: >-
                {{ compute_instance_name
                }}-load-balancer
            - api: cdi.kubevirt.io/v1beta1
              kind: DataVolume
              name: >-
                {{ compute_instance_name
                }}-root-disk
            - api: v1
              kind: Secret
              name: >-
                {{ compute_instance_name
                }}-cloud-init

