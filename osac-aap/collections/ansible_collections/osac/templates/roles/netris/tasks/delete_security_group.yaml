---
# SecurityGroup deletion - removes the corresponding Netris ACL rules.
# Handles both old-style names (sg-ingress-N) and new per-subnet names
# (sg-ingress-N-M) for backward compatibility during transition.
# Desired-state prune of stale ACL rows is OSAC-4888 (out of scope here).
#
# SecurityGroup deletion. The contract path removes nothing: the Fabric
# SecurityGroup create is a documented no-op, so no ACL object exists and a
# delete of never-created state succeeds. The legacy path removes the
# per-subnet ACL rules it created.

- name: Normalize task input
  ansible.builtin.include_tasks: _contract_input.yaml
  vars:
    _osac_task_name: delete_security_group

- name: Extract SecurityGroup configuration
  ansible.builtin.set_fact:
    sg_name: "{{ security_group.metadata.name }}"
    sg_virtual_network: "{{ security_group.spec.virtualNetwork | default('') }}"
    ingress_rules: "{{ security_group.spec.ingressRules | default([]) }}"
    egress_rules: "{{ security_group.spec.egressRules | default([]) }}"

- name: Refuse delete of default SecurityGroup
  ansible.builtin.include_tasks: _refuse_if_default.yaml
  vars:
    _default_refuse_resource: "{{ security_group }}"
    _default_refuse_kind: SecurityGroup
    _default_refuse_name: "{{ sg_name }}"

- name: Confirm the contract delete has nothing to remove
  when: _osac_contract | default(false) | bool
  block:
    - name: Require the SecurityGroup snapshot identity
      ansible.builtin.assert:
        that:
          - _osac_resource.id | default('') | length > 0
          - sg_name | default('') | length > 0
        fail_msg: >-
          A SecurityGroup delete needs the SecurityGroup API ID and name in
          the resource snapshot.

    - name: Report the documented Fabric SecurityGroup no-op
      ansible.builtin.debug:
        msg: >-
          SecurityGroup '{{ sg_name }}': the Fabric SecurityGroup task is a
          documented no-op, so there is no ACL object to remove.
  rescue:
    - name: Publish the sanitized SecurityGroup delete error and fail
      ansible.builtin.include_tasks: _contract_rescue.yaml
      vars:
        _osac_error_label: SecurityGroup delete
        _osac_error_retryable_default: false

- name: Delete Netris ACL rules from the legacy CR input
  when: not _osac_contract | default(false) | bool
  block:
    - name: Display deletion information
      ansible.builtin.debug:
        msg:
          - "Deleting Netris ACL rules for SecurityGroup '{{ sg_name }}'"
          - "Ingress rules to delete: {{ ingress_rules | length }}"
          - "Egress rules to delete: {{ egress_rules | length }}"

    - name: Look up subnets in VirtualNetwork for per-subnet ACL cleanup
      when: sg_virtual_network | length > 0
      block:
        - name: Look up all Subnets
          kubernetes.core.k8s_info:
            api_version: osac.openshift.io/v1alpha1
            kind: Subnet
            namespace: "{{ security_group.metadata.namespace }}"
          register: _sg_del_subnets

        - name: Count subnets in this VN
          ansible.builtin.set_fact:
            _sg_del_subnet_count: >-
              {{ _sg_del_subnets.resources | default([])
                 | selectattr('spec.virtualNetwork', 'defined')
                 | selectattr('spec.virtualNetwork', 'equalto', sg_virtual_network)
                 | list | length }}

    - name: Default subnet count
      ansible.builtin.set_fact:
        _sg_del_subnet_count: "{{ _sg_del_subnet_count | default(1) | int }}"

    - name: Delete per-subnet ACL rules for ingress
      ansible.builtin.include_role:
        name: netris.controller.acl
        tasks_from: delete
      vars:
        _rule_idx: "{{ item.0 }}"
        _subnet_idx: "{{ item.1 }}"
        _flat_idx: "{{ item.0 * (_sg_del_subnet_count | int) + item.1 }}"
        acl_name: "{{ sg_name }}-ingress-{{ _flat_idx }}-{{ _subnet_idx }}"
      loop: "{{ range(ingress_rules | length) | product(range(_sg_del_subnet_count | int)) | list }}"
      loop_control:
        label: "ingress-rule{{ item.0 }}-subnet{{ item.1 }}"
      when: ingress_rules | length > 0

    - name: Delete legacy ACL rules for ingress
      ansible.builtin.include_role:
        name: netris.controller.acl
        tasks_from: delete
      vars:
        acl_name: "{{ sg_name }}-ingress-{{ idx }}"
      loop: "{{ ingress_rules }}"
      loop_control:
        index_var: idx
      when: ingress_rules | length > 0

    - name: Delete per-subnet ACL rules for egress
      ansible.builtin.include_role:
        name: netris.controller.acl
        tasks_from: delete
      vars:
        _rule_idx: "{{ item.0 }}"
        _subnet_idx: "{{ item.1 }}"
        _flat_idx: "{{ item.0 * (_sg_del_subnet_count | int) + item.1 }}"
        acl_name: "{{ sg_name }}-egress-{{ _flat_idx }}-{{ _subnet_idx }}"
      loop: "{{ range(egress_rules | length) | product(range(_sg_del_subnet_count | int)) | list }}"
      loop_control:
        label: "egress-rule{{ item.0 }}-subnet{{ item.1 }}"
      when: egress_rules | length > 0

    - name: Delete legacy ACL rules for egress
      ansible.builtin.include_role:
        name: netris.controller.acl
        tasks_from: delete
      vars:
        acl_name: "{{ sg_name }}-egress-{{ idx }}"
      loop: "{{ egress_rules }}"
      loop_control:
        index_var: idx
      when: egress_rules | length > 0

    - name: Display SecurityGroup deletion result
      ansible.builtin.debug:
        msg: "ACL rules deletion completed for SecurityGroup '{{ sg_name }}'"
