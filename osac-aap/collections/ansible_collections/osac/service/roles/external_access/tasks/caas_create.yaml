- name: Require a supported CaaS DNS domain
  ansible.builtin.assert:
    that:
      - external_access_base_domain in (external_access_supported_base_domains | default([]))
    fail_msg: >-
      The CaaS DNS base domain must be listed in
      external_access_supported_base_domains.

- name: Publish the API bootstrap DNS records
  ansible.builtin.include_tasks: caas_api_dns_create.yaml

- name: Configure the guest ingress VIP and publish its wildcard DNS record
  ansible.builtin.include_tasks: caas_ingress_create.yaml

- name: Publish CaaS endpoints to ClusterOrder
  ansible.builtin.include_tasks: publish.yaml
