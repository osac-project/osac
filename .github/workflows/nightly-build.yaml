name: Nightly Build

on:
  schedule:
    # Run nightly at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      skip_e2e:
        description: >-
          Skip e2e validation (vmaas/caas/bmaas) and publish anyway if
          unit/integration/security tests pass. Manual runs only -- this
          input does not exist on the scheduled trigger, so the nightly
          cron can never skip e2e.
        type: boolean
        default: false
        required: false

concurrency:
  group: nightly-build
  cancel-in-progress: true

permissions: {}

jobs:
  # The actual build/test/publish/tag pipeline lives in
  # osac-build-and-publish.yaml, shared with osac-release.yaml -- see that
  # file's module header and OSAC-5337 for why. This workflow only owns the
  # nightly-specific triggers (schedule + an ad-hoc manual run).
  nightly:
    name: Nightly
    permissions:
      contents: write
      packages: write
      id-token: write
      pull-requests: read
      security-events: write
      actions: read
    uses: ./.github/workflows/osac-build-and-publish.yaml
    # Reusable workflows never inherit the caller's secrets automatically --
    # without this, secrets.OSAC_BOT_PAT resolves to empty inside
    # osac-build-and-publish.yaml's "Tag and notify" job (its checkout step
    # requires that token unconditionally, in both nightly and release
    # mode), and checkout fails outright ("Input required and not supplied:
    # token"), confirmed live on a real release dispatch (OSAC-5357
    # follow-up).
    secrets: inherit
    with:
      mode: nightly
      skip_e2e: ${{ github.event.inputs.skip_e2e == 'true' }}
