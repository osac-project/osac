---
# Cluster infrastructure deletion.
# Agents live in the ClusterOrder namespace (created via the
# per-cluster InfraEnv). Remove any remaining agents while that namespace
# still exists; HyperShift's control-plane namespace is separate.

- name: Check if cluster namespace still exists
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: "{{ cluster_infra_agent_namespace }}"
  register: cluster_ns

- name: Clean up agents if namespace still exists
  when: cluster_ns.resources | length > 0
  block:
    - name: Find agents in ClusterOrder namespace
      kubernetes.core.k8s_info:
        api_version: agent-install.openshift.io/v1beta1
        kind: Agent
        namespace: "{{ cluster_infra_agent_namespace }}"
      register: cluster_infra_ci_agents
      no_log: true

    - name: Delete remaining agents
      kubernetes.core.k8s:
        api_version: agent-install.openshift.io/v1beta1
        kind: Agent
        namespace: "{{ cluster_infra_agent_namespace }}"
        name: "{{ item.metadata.name }}"
        state: absent
      loop: "{{ cluster_infra_ci_agents.resources }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      when: cluster_infra_ci_agents.resources | length > 0
      no_log: true
