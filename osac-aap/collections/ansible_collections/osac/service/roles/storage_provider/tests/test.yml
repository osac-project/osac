      rescue:
        - name: Verify role failed with expected duplicate-names message
          ansible.builtin.assert:
            that:
              - "'duplicate tier names' in ansible_failed_result.msg"
            fail_msg: "Role failed but with unexpected message: {{ ansible_failed_result.msg | default('unknown') }}"
            success_msg: "Role correctly rejected invalid input"

# ──────────────────────────────────────────────────────────────
# Test 9: Invalid DNS label tier name -- error path
# Expected: role fails with DNS label validation message
# ──────────────────────────────────────────────────────────────
- name: Test storage_provider -- invalid DNS label tier name (should fail)
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Run invalid-dns-label failure test
      block:
        - name: Attempt with tier name containing spaces and uppercase (expected to fail)
          ansible.builtin.include_role:
            name: osac.service.storage_provider
          vars:
            storage_provider_tiers:
              - name: "My Tier"
                protocol: nfs
                provider: vast
            storage_provider_action: setup
