name: Check generated code

on:
# No paths filter: the required check name "Check generated code (proto)" must
# report on every PR. Skip is on job steps (dorny + should-run); a trigger path
# filter would leave the name pending forever on PRs that don't touch proto/.
  pull_request:
    branches:
      - main
  merge_group:

permissions:
  contents: read

jobs:

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      proto: ${{ steps.filter.outputs.proto }}
    steps:
      # dorny/paths-filter uses git diff on merge_group (not the PR Files API),
      # so the repo must be checked out with enough history for base..head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.event_name == 'merge_group'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        id: filter
        with:
          filters: |
            proto:
              # One shared proto module. Anything touching proto
              # sources/config, or the fulfillment-service dev.py toolchain that
              # regenerates proto/public/, can change the committed output.
              - 'proto/**'
              - 'fulfillment-service/dev/**'
              - 'fulfillment-service/dev.py'
              - 'fulfillment-service/cmd/buf-plugin-osac-lint/**'

  check-generated-code:
    name: Check generated code (proto)
    needs: changes
    # Run even if `changes` failed: a skipped job reports success, which would
    # let the required check pass without buf generate. Fail in the first step.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Fail if path filter failed
      if: needs.changes.result != 'success'
      run: exit 1
    - id: should-run
      if: needs.changes.result == 'success' && needs.changes.outputs.proto == 'true'
      run: echo "run=true" >> "$GITHUB_OUTPUT"
    - if: steps.should-run.outputs.run
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - if: steps.should-run.outputs.run
      uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3  # v1
      with:
        version: '1.50.0'
        setup_only: true
    - if: steps.should-run.outputs.run
      name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: auto
        version: "latest-known"
    - if: steps.should-run.outputs.run
      name: Install protoc
      run: |
        # protoc is needed for the private -> public cleanapi generation step
        sudo apt-get update -qq
        sudo apt-get install -qq -y protobuf-compiler
    - if: steps.should-run.outputs.run
      name: Regenerate the shared proto module
      working-directory: proto
      # `make generate` = `dev.py build protos` (private -> public) + `buf generate`
      # (the single Go tree under proto/gen/ that every module imports).
      run: make generate
    - if: steps.should-run.outputs.run
      name: Check for uncommitted changes
      run: |
        if ! git diff --exit-code -- proto/ || [ -n "$(git ls-files --others --exclude-standard -- proto/)" ]; then
          echo "::error::Generated proto code is out of date. Run 'make generate' in proto/ and commit proto/public/ + proto/gen/."
          git status --porcelain -- proto/
          exit 1
        fi
