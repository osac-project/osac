name: Generated UI types

# Called by ci.yml when osac-ui changes and part of the required CI check.
# It holds no path logic of its own: ci.yml's ui filter selects it.
on:  # yamllint disable-line rule:truthy
  workflow_call:

permissions:
  contents: read

jobs:
  generated-types:
    name: Generated UI types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4.3.0
        with:
          run_install: false
          package_json_file: osac-ui/package.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: osac-ui/package.json
          cache: pnpm
          cache-dependency-path: osac-ui/pnpm-lock.yaml

      - name: Install UI dependencies
        working-directory: osac-ui
        run: pnpm install --frozen-lockfile

      - name: Regenerate UI types
        working-directory: osac-ui
        run: pnpm gen-types

      - name: Check generated UI types
        run: |
          if ! git diff --exit-code -- osac-ui/libs/types/src \
            || [ -n "$(git ls-files --others --exclude-standard -- osac-ui/libs/types/src)" ]; then
            echo "::error::Generated UI types are out of date. Run 'pnpm gen-types' in osac-ui and commit the generated files."
            git status --porcelain -- osac-ui/libs/types/src
            exit 1
          fi
