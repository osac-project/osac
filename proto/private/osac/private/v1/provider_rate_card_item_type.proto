syntax = "proto3";

package osac.private.v1;

option (cleanapi.file).package = "osac.public.v1";

import "buf/validate/validate.proto";
import "cleanapi/cleanapi.proto";

// How a resource condition's value compares against a configuration. UNSPECIFIED is never reported by the server.
enum BillingRateMatchOperator {
  BILLING_RATE_MATCH_OPERATOR_UNSPECIFIED = 0;

  // Matches every value; `value` is empty.
  BILLING_RATE_MATCH_OPERATOR_ANY = 1;

  // Matches only a configuration whose dimension value equals `value`.
  BILLING_RATE_MATCH_OPERATOR_EQUALS = 2;
}

// One match condition on a provider rate-card row.
message ProviderRateCardItemResourceCondition {
  // Metered dimension name, using the same names as CatalogPricingInputs (for example `instance_type`).
  string dimension = 1 [(buf.validate.field).string.min_len = 1];

  BillingRateMatchOperator operator = 2 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];

  // Comparison value for EQUALS; empty for ANY.
  string value = 3;
}

// Provider-supplied amount and unit. OSAC preserves both without rounding or unit validation.
message ProviderRateCardItemRate {
  // Provider rate as a decimal string; OSAC does not round it.
  string amount = 1;

  // Provider-advertised rate unit, preserved as reported. OSAC treats every rate as per second and performs no
  // unit validation or matching (design §2.3); the documented provider convention is `second`.
  string unit = 2;
}

// A provider-neutral, currency-specific rate-card row. Never carries a provider rule id, rate-card id, service id,
// native account id or raw provider payload.
message ProviderRateCardItem {
  // OSAC service this provider rule prices, such as `compute_instance`.
  string service = 1 [(buf.validate.field).string.min_len = 1];

  // ISO-4217 currency of rate.amount.
  string currency_code = 2 [(buf.validate.field).string.len = 3];

  // Match conditions for this rate; all conditions on a row apply together. Empty means the row matches every
  // configuration of the service.
  repeated ProviderRateCardItemResourceCondition resource_conditions = 3;

  ProviderRateCardItemRate rate = 4;

  // OSAC catalog item names this rule can price for at least one configuration a tenant can request from that
  // item. The rule's conditions alone decide this list; its `dimension` does not narrow it. Empty means no catalog
  // item offers a configuration the conditions accept, which is still a valid row.
  repeated string catalog_item_matches = 5;

  // Metered dimension this row prices, using the same names as CatalogPricingInputs and
  // resource_conditions[].dimension (for example `instance_type`). Always set: rows whose priced attribute has no
  // OSAC name are never listed.
  string dimension = 6 [(buf.validate.field).string.min_len = 1];
}
