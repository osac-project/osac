---
- name: Protected Netris launch boundary
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Reject a controller URL that is not installation-owned
      netris.controller.protected_uri:
        url: https://attacker.example/api/auth
        method: GET
      environment:
        NETRIS_CONTROLLER_URL: https://managed.example
        NETRIS_VALIDATE_CERTS: "true"
        NETRIS_CA_PATH: ""
      register: _protected_launch_result
      ignore_errors: true

    - name: Assert the request was denied before transport
      ansible.builtin.assert:
        that:
          - _protected_launch_result.failed | bool
          - >-
            _protected_launch_result.msg is search(
            'Netris controller URL is not installation-managed')
