---
# ExternalIPAttachment deletion - removes the DNAT rule from Netris

- name: Normalize task input
  ansible.builtin.include_tasks: _contract_input.yaml
  vars:
    _osac_task_name: detach_external_ip

- name: Extract ExternalIPAttachment name
  ansible.builtin.set_fact:
    attachment_name: "{{ _osac_resource.metadata.name }}"

- name: Detach the ExternalIP from the contract snapshot
  when: _osac_contract | default(false) | bool
  block:
    - name: Require the attachment identity and ownership inputs
      ansible.builtin.assert:
        that:
          - _osac_resource.id | default('') | length > 0
          - _osac_external_ip_ref.address | default('') | length > 0
          - _osac_destination.address | default('') | length > 0
          - >-
            _osac_destination.routing_domain.type | default('')
            in ['provider_management', 'tenant_virtual_network']
        fail_msg: >-
          An ExternalIPAttachment delete needs the attachment API ID, the
          external_ip address, the destination address, and a routing
          domain, so the DNAT rule can be verified before deletion.

    - name: Require a routing domain the Fabric can resolve
      ansible.builtin.fail:
        msg: >-
          The ExternalIPAttachment routing domain is tenant_virtual_network,
          which carries only the VirtualNetwork API ID. Netris names its VPC
          after the VirtualNetwork, so the VPC cannot be resolved here until
          the core dispatch supplies the VirtualNetwork name. Nothing was
          changed.
      when: _osac_destination.routing_domain.type == 'tenant_virtual_network'

    - name: Ensure Netris auth
      ansible.builtin.include_role:
        name: netris.controller.auth
      when:
        - netris_session_cookie is not defined
        - not ansible_check_mode

    - name: Require the management VPC for the DNAT scope
      ansible.builtin.assert:
        that:
          - netris_mgmt_vpc_id | default('') | string | length > 0
        fail_msg: >-
          A provider_management ExternalIPAttachment delete needs
          netris_mgmt_vpc_id so the DNAT rule can be scoped to the
          management VPC.

    - name: Delete the DNAT rule for the attachment
      ansible.builtin.include_role:
        name: netris.controller.nat
        tasks_from: delete
      vars:
        nat_name: "{{ _osac_resource.id }}-dnat"
        nat_site_id: "{{ netris_site_id }}"
        nat_expected_fields:
          action: DNAT
          "site.id": "{{ netris_site_id }}"
          "vpc.id": "{{ netris_mgmt_vpc_id }}"
          destinationAddress: "{{ _osac_external_ip_ref.address }}/32"
          dnatToIP: "{{ _osac_destination.address }}/32"

    - name: Display deletion result
      ansible.builtin.debug:
        msg: "DNAT rule '{{ attachment_name }}-dnat' deletion completed"
  rescue:
    - name: Publish the sanitized ExternalIPAttachment detach error and fail
      ansible.builtin.include_tasks: _contract_rescue.yaml
      vars:
        _osac_error_label: ExternalIPAttachment detach
- name: Run the legacy externalipattachment detach path
  when: not _osac_contract | default(false) | bool
  block:
    - name: Validate ExternalIPAttachment ownership annotations
      ansible.builtin.assert:
        that:
          - external_ip_attachment.metadata.annotations is defined
          - "'osac.openshift.io/externalip-name' in external_ip_attachment.metadata.annotations"
          - "'osac.openshift.io/target-ip' in external_ip_attachment.metadata.annotations"
        fail_msg: >-
          Cannot safely delete Netris DNAT rule for ExternalIPAttachment
          '{{ attachment_name }}': required ownership annotations
          'osac.openshift.io/externalip-name' and
          'osac.openshift.io/target-ip' are missing.

    - name: Extract the legacy ownership annotations
      ansible.builtin.set_fact:
        attachment_externalip_name: >-
          {{ external_ip_attachment.metadata.annotations['osac.openshift.io/externalip-name'] }}
        attachment_target_ip: >-
          {{ external_ip_attachment.metadata.annotations['osac.openshift.io/target-ip'] }}

    - name: Display ExternalIPAttachment deletion info
      ansible.builtin.debug:
        msg: "Deleting Netris DNAT rule for ExternalIPAttachment '{{ attachment_name }}'"

    - name: Read the ExternalIP when it is still available
      kubernetes.core.k8s_info:
        api_version: osac.openshift.io/v1alpha1
        kind: ExternalIP
        name: "{{ attachment_externalip_name }}"
        namespace: "{{ external_ip_attachment.metadata.namespace }}"
      register: _attachment_eip_lookup
      when: attachment_externalip_name | length > 0

    - name: Determine tenant VirtualNetwork name for DNAT ownership check
      ansible.builtin.set_fact:
        attachment_vn_name: >-
          {{ external_ip_attachment.metadata.annotations['osac.openshift.io/virtual-network-name']
             | default('', true) }}

    - name: Default DNAT ownership check to management VPC
      ansible.builtin.set_fact:
        attachment_nat_vpc_id: "{{ netris_mgmt_vpc_id }}"

    - name: Look up tenant VPC for DNAT ownership check
      ansible.builtin.include_role:
        name: netris.controller.vpc
        tasks_from: read
      vars:
        vpc_name: "{{ attachment_vn_name }}"
      when: attachment_vn_name | length > 0

    - name: Use tenant VPC for DNAT ownership check
      ansible.builtin.set_fact:
        attachment_nat_vpc_id: "{{ netris_vpc.id }}"
      when:
        - attachment_vn_name | length > 0
        - netris_vpc is defined
        - netris_vpc is not none

    - name: Build DNAT ownership fields
      ansible.builtin.set_fact:
        _attachment_nat_expected_fields:
          action: DNAT
          "site.id": "{{ netris_site_id }}"
          "vpc.id": "{{ attachment_nat_vpc_id }}"

    - name: Add DNAT target IP to ownership fields when available
      ansible.builtin.set_fact:
        _attachment_nat_expected_fields: >-
          {{ _attachment_nat_expected_fields | combine({
               'dnatToIP': attachment_target_ip ~ '/32'
             }) }}
      when: attachment_target_ip | length > 0

    - name: Add DNAT external IP to ownership fields when ExternalIP remains available
      ansible.builtin.set_fact:
        _attachment_nat_expected_fields: >-
          {{ _attachment_nat_expected_fields | combine({
               'destinationAddress': _attachment_eip_lookup.resources[0].metadata.annotations['osac.openshift.io/allocated-address'] ~ '/32'
             }) }}
      when:
        - _attachment_eip_lookup is defined
        - _attachment_eip_lookup.resources | default([]) | length > 0
        - _attachment_eip_lookup.resources[0].metadata.annotations is defined
        - _attachment_eip_lookup.resources[0].metadata.annotations['osac.openshift.io/allocated-address'] is defined

    - name: Ensure Netris auth
      ansible.builtin.include_role:
        name: netris.controller.auth
      when: netris_session_cookie is not defined

    - name: Delete DNAT rule for ExternalIPAttachment
      ansible.builtin.include_role:
        name: netris.controller.nat
        tasks_from: delete
      vars:
        nat_name: "{{ attachment_name }}-dnat"
        nat_site_id: "{{ netris_site_id }}"
        nat_expected_fields: "{{ _attachment_nat_expected_fields }}"

    - name: Display deletion result
      ansible.builtin.debug:
        msg: "DNAT rule '{{ attachment_name }}-dnat' deletion completed"
