---
- name: Move network attachments
  hosts: localhost
  gather_facts: false

  vars:
    resource: "{{ osac_job_vars.resource }}"
    resource_name: "{{ resource.metadata.name }}"
    implementation_strategy: >-
      {{ (resource.metadata.annotations | default({}, true))
         ['osac.openshift.io/implementation-strategy']
         | default('netris', true) }}
    network_attachments: "{{ resource.spec.networkAttachments | default([]) }}"
    agentless_net_provisioning_vnet: >-
      {{ ((lookup('ansible.builtin.env', 'AGENTLESS_NET_VN_INVENTORY')
           | default('{}', true) | from_yaml).get('all', {}).get('vars', {})
           .get('agentless_net_provisioning_network', {}).get('name', '')) }}
    provisioning_vnet: >-
      {{ agentless_net_provisioning_vnet
         if implementation_strategy == 'agentless_net'
         else netris_bm_provisioning_vnet | default('', true) }}
    # A resource carrying a deletionTimestamp is being deprovisioned (offboard:
    # tenant -> provisioning); otherwise it is being provisioned (onboard: provisioning ->
    # tenant). Test presence type-agnostically: ansible-core auto-tags an
    # ISO-8601 deletionTimestamp as a datetime object (not a string), so `length`
    # would raise; `default(None, true)` maps undefined/empty to None and any
    # real value passes the `is not none` check.
    offboard: "{{ (resource.metadata.deletionTimestamp | default(None, true)) is not none }}"
    host_name: >-
      {{ (resource.spec.externalHostName
         | default(resource.spec.externalHostID, true)).split('/')[-1] }}

  pre_tasks:
    - name: Show resource metadata
      ansible.builtin.debug:
        var: resource.metadata

    - name: Require tenant ownership metadata on the BMI resource
      ansible.builtin.assert:
        that:
          - resource.metadata.annotations is mapping
          - resource.metadata.annotations.get('osac.openshift.io/tenant', '') | length > 0
        fail_msg: Network attachment moves require the BareMetalInstance tenant annotation.
      no_log: true

  tasks:
    - name: Resolve tenant network segment name for each attachment
      kubernetes.core.k8s_info:
        api_version: osac.openshift.io/v1alpha1
        kind: Subnet
        namespace: "{{ resource.metadata.namespace }}"
        label_selectors:
          - "osac.openshift.io/subnet-uuid={{ item.subnetRef }}"
        # Kubernetes credentials are supplied by an AAP credential through the
        # K8S_AUTH_* environment variables. This also works when newer
        # Automation Controller releases reject pod_spec_override token mounts.
      register: _subnet_lookups
      loop: "{{ network_attachments }}"
      loop_control:
        label: "{{ item.subnetRef }}"
      when: network_attachments | length > 0
      no_log: true

    - name: Validate Subnet namespace, tenant, and onboarding readiness
      ansible.builtin.assert:
        that:
          - item.resources | length == 0 or item.resources[0].metadata.namespace == resource.metadata.namespace
          - >-
            item.resources | length == 0
            or item.resources[0].metadata.annotations.get('osac.openshift.io/tenant', '')
               == resource.metadata.annotations['osac.openshift.io/tenant']
          - >-
            offboard
            or item.resources | length == 0
            or item.resources[0].status.phase == 'Ready'
          - >-
            offboard
            or item.resources | length == 0
            or item.resources[0].metadata.deletionTimestamp is not defined
        fail_msg: >-
          A BareMetalInstance network attachment must reference a ready Subnet
          in the same namespace and tenant before onboarding.
      loop: "{{ _subnet_lookups.results | default([]) }}"
      loop_control:
        label: "{{ item.item.subnetRef }}"
      when: network_attachments | length > 0
      no_log: true

    - name: Build resolved attachment list (interface + tenant network name)
      ansible.builtin.set_fact:
        _resolved_attachments: >-
          {{ _resolved_attachments | default([]) + [{
               'interface': item.item.interface,
               'subnet_ref': item.item.subnetRef,
               'tenant_vnet': (item.resources[0].metadata.name
                               if (item.resources | length > 0) else ''),
               'subnet': (item.resources[0]
                          if (item.resources | length > 0) else {})
             }] }}
      loop: "{{ _subnet_lookups.results | default([]) }}"
      loop_control:
        label: "{{ item.item.subnetRef }}"
      when: network_attachments | length > 0

    # Onboard needs the tenant network segment to exist. Offboard tolerates a missing
    # Subnet CR (subnet already deleted): the tenant detach is skipped and the
    # port is still returned to the provisioning network.
    - name: Fail if a tenant Subnet CR is missing (onboard only)
      ansible.builtin.fail:
        msg: >-
          Subnet CR not found for one or more attachments:
          {{ _resolved_attachments | selectattr('tenant_vnet', 'equalto', '')
             | list }}
      when:
        - not offboard
        - _resolved_attachments | default([]) | selectattr('tenant_vnet', 'equalto', '') | list | length > 0

    - name: Move each fabric port (with V-Net locking)
      ansible.builtin.include_tasks: _move_one_attachment.yaml
      loop: "{{ _resolved_attachments | default([]) }}"
      loop_control:
        label: >-
          {{ item.interface | default('default') }}:
          {{ offboard | ternary(item.tenant_vnet ~ ' -> ' ~ provisioning_vnet,
                                provisioning_vnet ~ ' -> ' ~ item.tenant_vnet) }}
