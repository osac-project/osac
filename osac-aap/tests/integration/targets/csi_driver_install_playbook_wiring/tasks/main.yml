---
# Integration test for the playbook-level wiring of osac.service.csi_driver_install
# into playbook_osac_create_tenant_storage_backend.yml -- the real AAP entry point,
# not the role directly (see csi_driver_install's own role-level test for that).
#
# Verifies the playbook's when:/vars: mapping into csi_driver_install by stubbing
# the actual Helm install via csi_driver_install_override (mirroring the exact
# override pattern osac.templates.ocp_virt_vm already uses and
# compute_instance_create/tasks/overrides.yml already tests), then runs the rest
# of the playbook (the real osac.service.storage_provider setup dispatch) for real
# against the mock VMS server -- proving the new csi_driver_install step composes
# correctly with the pre-existing storage_provider step in the same playbook, not
# just that each role works in isolation.
#
# Requires: mock VMS server on 127.0.0.1:18443, kind cluster with osac-system
# namespace (same requirements as storage_provider_setup, which this test's
# fixture mirrors). Does NOT require a published osac-csi-driver chart tag or
# the local chart registry setup_test_env.sh stands up for csi_driver_install's
# own role-level test -- the real Helm install is stubbed out entirely here.

- name: "CSI Driver Install Playbook Wiring - Setup"
  hosts: localhost
  gather_facts: true

  tasks:
    # Every vast_storage_* var below must be a fact (set_fact), not a play var
    # or an `environment:` block: the imported playbook below runs in a
    # separate play, and only host facts -- not play-level vars -- cross that
    # boundary. `environment:` is a stricter trap than vars: -- it only wraps
    # module subprocess execution, so it never affects lookup('env', ...)
    # calls at all (those read the controller process's real OS environment
    # directly), even within the SAME play. vast_storage_config_namespace's
    # default is exactly such a lookup('env', 'OSAC_STORAGE_CONFIG_NAMESPACE')
    # expression, so an `environment:` block setting that var name is silently
    # a no-op -- discovered via this test's own hub Secret creation failing
    # with "Namespace is required for v1.Secret" (an empty
    # vast_storage_config_namespace) despite the (ineffective) environment:
    # block appearing to set it.
    - name: Set vast_storage_* config as cross-play facts
      ansible.builtin.set_fact:
        vast_storage_validate_certs: false
        vast_storage_vip_pool_name: "osac-test-pool"
        vast_storage_vip_pool_ip_ranges: '[["10.0.0.10","10.0.0.50"]]'
        vast_storage_vip_pool_subnet_cidr: "24"
        vast_storage_config_namespace: "osac-system"

    - name: Delete any pre-existing hub Secret (clean slate)
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Secret
        name: "vast-tenant-config-test-csi-wiring"
        namespace: "osac-system"

    - name: Clear override log
      ansible.builtin.file:
        path: /tmp/osac_test_overrides.log
        state: absent

    - name: Create empty override log
      ansible.builtin.file:
        path: /tmp/osac_test_overrides.log
        state: touch

    - name: Set test variables (Tenant dispatch, csi_driver_install stubbed)
      ansible.builtin.set_fact:
        osac_job_vars:
          resource:
            apiVersion: osac.openshift.io/v1alpha1
            kind: Tenant
            metadata:
              name: test-csi-wiring
              namespace: osac-system
              uid: test-uid-csi-wiring
            spec: {}
          storage_tier_definitions:
            - name: default
              protocol: nfs
              provider: vast
              backend_id: be-test
              qos_limits:
                static_limits:
                  max_reads_bw_mbps: 100
                  max_writes_bw_mbps: 100
          storage_backend_connections:
            be-test:
              endpoint: "127.0.0.1:18443"
              username: "admin"
              password: "mock-admin-password"
        csi_driver_install_override:
          name: osac.test_overrides.csi_driver_install_hooks
          tasks_from: install.yaml
        # This test's own storage_provider dispatch (storage_provider_action: setup) is
        # real, unstubbed -- it's the one action that invokes ensure_csi_backends.yaml,
        # which would otherwise attempt a real Helm install against the not-yet-published
        # osac-csi-driver chart. This test only stubs csi_driver_install (above), not
        # storage_provider, so this must be suppressed independently.
        storage_provider_csi_backends_enabled: false

- name: Run tenant storage backend playbook with csi_driver_install stubbed
  ansible.builtin.import_playbook: ../../../../../playbook_osac_create_tenant_storage_backend.yml

- name: "CSI Driver Install Playbook Wiring - Verify results"
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Read override log
      ansible.builtin.slurp:
        path: /tmp/osac_test_overrides.log
      register: _override_log_content

    - name: Parse override log
      ansible.builtin.set_fact:
        _override_log: "{{ _override_log_content.content | b64decode }}"

    - name: "Assert csi_driver_install's override fired with the playbook's own vars mapping"
      ansible.builtin.assert:
        that:
          - "'csi_driver_install' in _override_log"
          - >-
            'tiers=' ~ (osac_job_vars.storage_tier_definitions | to_json) in _override_log
        fail_msg: >-
          csi_driver_install override did not fire with the expected playbook-computed vars.
          Log: {{ _override_log }}
        success_msg: "csi_driver_install override fired with the correct tiers from the playbook's vars: mapping"

    # Proves the rest of the playbook (the pre-existing osac.service.storage_provider
    # dispatch) still executed for real and succeeded, immediately after the stubbed
    # csi_driver_install step -- not just that csi_driver_install's own wiring point
    # was reached in isolation.
    - name: Read hub Secret created by the real storage_provider dispatch that followed
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "vast-tenant-config-test-csi-wiring"
        namespace: "osac-system"
      register: _hub_secret

    - name: Assert the real storage_provider dispatch after the stubbed csi_driver_install step succeeded
      ansible.builtin.assert:
        that:
          - _hub_secret.resources | length == 1
        fail_msg: >-
          Hub Secret 'vast-tenant-config-test-csi-wiring' was not created -- the real
          storage_provider dispatch that runs after the stubbed csi_driver_install step
          did not complete successfully.
        success_msg: "storage_provider's real dispatch succeeded immediately after the stubbed csi_driver_install step"

    - name: Delete the hub Secret created by this test
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Secret
        name: "vast-tenant-config-test-csi-wiring"
        namespace: "osac-system"

    - name: Delete override log
      ansible.builtin.file:
        path: /tmp/osac_test_overrides.log
        state: absent
