---
- name: Teardown a hosted control plane cluster from a ClusterOrder
  hosts: localhost
  gather_facts: false

  vars:
    cluster_order: "{{ osac_job_vars.resource }}"

  pre_tasks:
    - name: Include get remote cluster kubeconfig
      ansible.builtin.include_role:
        name: osac.service.common
        tasks_from: get_remote_cluster_kubeconfig

    - name: Apply default settings
      ansible.builtin.include_role:
        name: osac.service.cluster_settings

    - name: Extract template info
      ansible.builtin.include_role:
        name: osac.service.extract_template_info

    - name: Determine working namespace
      ansible.builtin.include_role:
        name: osac.service.cluster_working_namespace
      vars:
        cluster_working_namespace_cluster_order_name: "{{ cluster_order.metadata.name }}"

  tasks:
    - name: Call the selected template
      ansible.builtin.include_role:
        name: "{{ template_id }}"
        tasks_from: "delete"

    - name: Remove infrastructure finalizer from the cluster order
      # The ClusterOrder is a hub object: its finalizer stays in-cluster.
      ansible.builtin.include_role:
        name: osac.service.finalizer
      vars:
        finalizer_state: absent
        finalizer_name: "{{ cluster_order_infrastructure_finalizer }}"
        finalizer_target:
          api_version: osac.openshift.io/v1alpha1
          kind: ClusterOrder
          namespace: "{{ lookup('env', 'POD_NAMESPACE') }}"
          name: "{{ cluster_order.metadata.name }}"

    - name: Remove infrastructure finalizer from the working namespace
      # The working namespace is infrastructure: it lives in the outer
      # cluster, so its finalizer follows the remote kubeconfig.
      ansible.builtin.include_role:
        name: osac.service.finalizer
      vars:
        finalizer_state: absent
        finalizer_name: "{{ cluster_order_infrastructure_finalizer }}"
        finalizer_kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
        finalizer_target:
          api_version: v1
          kind: Namespace
          name: "{{ cluster_working_namespace }}"
