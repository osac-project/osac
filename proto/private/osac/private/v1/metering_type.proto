syntax = "proto3";

package osac.private.v1;

import "cleanapi/cleanapi.proto";
import "google/protobuf/descriptor.proto";

// This file is private: metering reads the annotations from the private protos, and the public
// API doesn't need them.
option (cleanapi.file).private = true;

// How metering tracks a field of a billable resource. The database triggers that enforce the
// source contract and the metering service both take their list of tracked fields from these
// annotations, so the two can't drift apart.
enum MeteringFieldKind {
  // The field is not tracked. Never used on an annotated field.
  METERING_FIELD_KIND_UNSPECIFIED = 0;

  // The field's value changes over the life of the resource, and another field holds the time of
  // each change. A changed value must carry a later change time; a write that changes the time
  // without the value keeps the old time.
  METERING_FIELD_KIND_CHANGING = 1;

  // The field is set when the resource is created and never changes. Only annotate a field this
  // way when the API already rejects changing it.
  METERING_FIELD_KIND_FIXED_AT_CREATION = 2;

  // The field starts empty, is set once, and never changes after. Its value is treated as known
  // from creation.
  METERING_FIELD_KIND_SET_ONCE_LATER = 3;
}

// Options of a field that metering tracks.
message MeteringFieldOptions {
  // How the field is tracked.
  MeteringFieldKind kind = 1;

  // Proto field path, relative to the resource message, of the timestamp field that holds the
  // time of the last change of this field. Required for changing fields, empty for the other
  // kinds.
  string transition_time = 2;
}

extend google.protobuf.FieldOptions {
  MeteringFieldOptions metering = 50002;
}
