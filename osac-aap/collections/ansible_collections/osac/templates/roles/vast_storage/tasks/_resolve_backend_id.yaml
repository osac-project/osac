---
# Sets _vast_backend_id to the backend of this dispatch. Every entry point
# includes this first so a value left by an earlier dispatch is never reused.
# The dispatcher sets _current_backend_id once per (provider, backend_id) pair.

- name: Set the backend_id this dispatch is scoped to
  ansible.builtin.set_fact:
    _vast_backend_id: "{{ _current_backend_id }}"
