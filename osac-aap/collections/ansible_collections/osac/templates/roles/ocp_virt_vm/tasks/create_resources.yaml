---
# Phase 1: Resolve all storage tiers before creating any resources.

- name: Resolve StorageClass for boot disk tier
  ansible.builtin.include_role:
    name: osac.service.tenant_storage_class
  vars:
    tenant_storage_class_storage_tier: "{{ compute_instance.spec.bootDisk.storageTier }}"
    tenant_storage_class_disk_label: "boot disk"

- name: Set boot disk StorageClass
  ansible.builtin.set_fact:
    boot_disk_storage_class: "{{ tenant_storage_class_name }}"

- name: Initialize additional disk StorageClasses list
  ansible.builtin.set_fact:
    additional_disk_storage_classes: []

- name: Resolve StorageClass for each additional disk
  ansible.builtin.include_tasks: resolve_additional_disk.yaml
  loop: "{{ vm_additional_disks }}"
  loop_control:
    index_var: resolve_disk_index
  when: vm_additional_disks | length > 0

- name: Display resolved StorageClasses
  ansible.builtin.debug:
    msg: "Resolved StorageClasses for boot disk + {{ additional_disk_storage_classes | length }} additional disk(s)"

# Phase 2: Create resources using resolved StorageClasses.

- name: Create DataVolume for VM root disk
  kubernetes.core.k8s:
    kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
    apply: true
    definition:
      apiVersion: cdi.kubevirt.io/v1beta1
      kind: DataVolume
      metadata:
        name: "{{ compute_instance_name }}-root-disk"
        labels: "{{ default_vm_labels }}"
        namespace: "{{ compute_instance_target_namespace }}"
      spec:
        source:
          registry:
            url: "docker://{{ vm_image_source }}"
        pvc:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: "{{ vm_boot_disk_size }}"
          storageClassName: "{{ boot_disk_storage_class }}"
    state: present

- name: Create DataVolumes for additional disks
  kubernetes.core.k8s:
    kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
    apply: true
    definition:
      apiVersion: cdi.kubevirt.io/v1beta1
      kind: DataVolume
      metadata:
        name: "{{ compute_instance_name }}-disk-{{ idx + 1 }}"
        labels: "{{ default_vm_labels }}"
        namespace: "{{ compute_instance_target_namespace }}"
      spec:
        source:
          blank: {}
        pvc:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: "{{ item.sizeGiB }}Gi"
          storageClassName: "{{ additional_disk_storage_classes[idx] }}"
    state: present
  loop: "{{ vm_additional_disks }}"
  loop_control:
    index_var: idx
  when: vm_additional_disks | length > 0

- name: Add additional disks to template spec
  ansible.builtin.set_fact:
    vm_template_spec: "{{ vm_template_spec | combine(additional_disk_patch, recursive=True, list_merge='append') }}"
  vars:
    additional_disk_patch:
      domain:
        devices:
          disks:
            - name: "additional-disk-{{ idx + 1 }}"
              disk:
                bus: virtio
      volumes:
        - name: "additional-disk-{{ idx + 1 }}"
          dataVolume:
            name: "{{ compute_instance_name }}-disk-{{ idx + 1 }}"
  loop: "{{ vm_additional_disks }}"
  loop_control:
    index_var: idx
  when: vm_additional_disks | length > 0

- name: Create VirtualMachine
  kubernetes.core.k8s:
    kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
    apply: true
    definition:
      apiVersion: kubevirt.io/v1
      kind: VirtualMachine
      metadata:
        name: "{{ compute_instance_name }}"
        namespace: "{{ compute_instance_target_namespace }}"
        labels: "{{ default_vm_labels }}"
      spec:
        runStrategy: "{{ vm_run_strategy }}"
        template:
          metadata:
            labels: "{{ default_vm_labels }}"
          spec: "{{ vm_template_spec }}"
    state: present

- name: Check if restart is requested
  ansible.builtin.set_fact:
    restart_requested: >-
      {{
        (compute_instance.spec.restartRequestedAt | default('') | string | length > 0)
        and
        (
          (compute_instance.status.lastRestartedAt | default('') | string | length == 0)
          or
          (compute_instance.spec.restartRequestedAt | string > compute_instance.status.lastRestartedAt | default('1970-01-01T00:00:00Z') | string)
        )
      }}

- name: Delete VirtualMachineInstance to trigger restart
  kubernetes.core.k8s:
    kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
    api_version: kubevirt.io/v1
    kind: VirtualMachineInstance
    name: "{{ compute_instance_name }}"
    namespace: "{{ compute_instance_target_namespace }}"
    state: absent
  when: restart_requested | bool

- name: Wait for VMI to be recreated after restart
  kubernetes.core.k8s_info:
    kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
    api_version: kubevirt.io/v1
    kind: VirtualMachineInstance
    name: "{{ compute_instance_name }}"
    namespace: "{{ compute_instance_target_namespace }}"
  register: vmi_info
  until:
    - vmi_info.resources | length > 0
    - vmi_info.resources[0].metadata.creationTimestamp | string > compute_instance.spec.restartRequestedAt | string
  retries: 60
  delay: 5
  when: restart_requested | bool
