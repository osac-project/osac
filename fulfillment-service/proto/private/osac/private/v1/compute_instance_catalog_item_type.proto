syntax = "proto3";

package osac.private.v1;

import "buf/validate/validate.proto";
import "cleanapi/cleanapi.proto";
import "google/api/field_behavior.proto";
import "osac/private/v1/compute_instance_template_type.proto";
import "osac/private/v1/field_definition_type.proto";
import "osac/private/v1/field_policy_type.proto";
import "osac/private/v1/metadata_type.proto";

option (cleanapi.file).package = "osac.public.v1";

// A compute instance catalog item defines a curated infrastructure offering that references an underlying compute
// instance template. Admins control which fields users can set, enforce defaults, and validate input via JSON Schema.
//
// buf:lint:ignore OSAC_OBJECT_SHAPE
message ComputeInstanceCatalogItem {
  // Unique identifier of the catalog item.
  string id = 1;

  Metadata metadata = 2;

  // Human friendly short description of the catalog item, suitable for displaying in one single line on a UI or CLI.
  string title = 3;

  // Human friendly long description of the catalog item, using Markdown format.
  string description = 4;

  // Reference to the underlying compute instance template that this catalog item references.
  ComputeInstanceTemplateReference template = 5 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE,
    (buf.validate.field).required = true
  ];

  // Whether this catalog item is published.
  bool published = 6;

  // Field 7 is omitted: `tenant` is an internal field managed by the server, not exposed through the public API.


  // Tenant scope for this catalog item. An empty string means the item is global and visible to all tenants.
  string tenant = 7 [(cleanapi.field).private = true];

  // Deprecated: definitions of the fields that users can or cannot set when creating a resource from this catalog item.
  // Use `fields` and `template_parameters` instead.
  repeated FieldDefinition field_definitions = 8 [deprecated = true];

  // Policies that govern template parameters during resource creation.
  map<string, TemplateParameterPolicy> template_parameters = 9 [(cleanapi.field).private = true];

  // Policies that govern compute instance fields during resource creation.
  ComputeInstanceCatalogItemFields fields = 10 [(cleanapi.field).private = true];
}

// Groups the policies for governable compute instance fields.
message ComputeInstanceCatalogItemFields {
  option (cleanapi.message).private = true;

  DiskImageReferenceFieldPolicy disk_image = 1;
  InstanceTypeReferenceFieldPolicy instance_type = 2;
  StringFieldPolicy ssh_public_key = 3;
  ComputeInstanceBootDiskFieldPolicies boot_disk = 4;
  ComputeInstanceRunStrategyFieldPolicy run_strategy = 5;
  StringFieldPolicy user_data = 6;
  ComputeNetworkAttachmentListFieldPolicy network_attachments = 7;
  BoolFieldPolicy auto_external_ip_attachment = 8;
}

// Groups policies for governable compute instance boot disk fields.
message ComputeInstanceBootDiskFieldPolicies {
  option (cleanapi.message).private = true;

  Int32FieldPolicy size_gib = 1;
}

// Reference to a ComputeInstanceCatalogItem resource.
message ComputeInstanceCatalogItemReference {
  string id = 1;
  string name = 2;
  string project = 3;
  bool shared = 4;
}
