{{- if .Values.metering.enabled }}
{{- $issuer := tpl (required "service.auth.issuerUrl is required when metering.enabled is true" .Values.service.auth.issuerUrl) . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: osac-metering-fulfillment-config
  namespace: {{ .Release.Namespace }}
data:
  FULFILLMENT_ISSUER_URL: {{ $issuer | quote }}
{{- end }}
