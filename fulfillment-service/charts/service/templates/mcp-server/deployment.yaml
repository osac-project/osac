{{- if .Values.global.mcp.enabled }}
{{- $mcp := .Values.global.mcp }}
{{- $publicURL := tpl (include "fulfillment-mcp-server.publicURL" .) . }}
{{- $issuerURL := tpl (required "global.mcp.issuerURL is required when global.mcp.enabled=true" $mcp.issuerURL) . }}
{{- $audience := required "global.mcp.audience is required when global.mcp.enabled=true" $mcp.audience }}
{{- $exchangeTokenEndpoint := tpl (required "global.mcp.exchangeTokenEndpoint is required when global.mcp.enabled=true" $mcp.exchangeTokenEndpoint) . }}
{{- $exchangeClientID := required "global.mcp.exchangeClientID is required when global.mcp.enabled=true" $mcp.exchangeClientID }}
{{- $exchangeSecretName := required "global.mcp.exchangeClientSecret.name is required when global.mcp.enabled=true" $mcp.exchangeClientSecret.name }}
{{- $exchangeSecretKey := required "global.mcp.exchangeClientSecret.key is required when global.mcp.enabled=true" $mcp.exchangeClientSecret.key }}
{{- $trustMode := $mcp.trust.mode }}
{{- $caConfigMap := "" }}
{{- if eq $trustMode "configMap" }}
{{- $caConfigMap = required "global.mcp.trust.configMap is required when global.mcp.enabled=true and trust.mode=configMap" $mcp.trust.configMap }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace }}
  name: fulfillment-mcp-server
spec:
  selector:
    matchLabels:
      app: fulfillment-mcp-server
  replicas: {{ $mcp.replicas }}
  strategy:
    type: {{ if .Values.debug }}Recreate{{ else }}RollingUpdate{{ end }}
    {{- if not .Values.debug }}
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
    {{- end }}
  template:
    metadata:
      labels:
        app: fulfillment-mcp-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
      {{- if $caConfigMap }}
      - name: cas
        configMap:
          name: {{ $caConfigMap }}
      {{- end }}
      - name: tls
        secret:
          secretName: fulfillment-mcp-server-tls
      - name: exchange-credentials
        secret:
          secretName: {{ $exchangeSecretName }}
          items:
          - key: {{ $exchangeSecretKey }}
            path: client-secret
      containers:
      - name: mcp-server
        image: {{ .Values.images.service.repository }}:{{ .Values.images.service.tag }}
        imagePullPolicy: {{ .Values.images.service.pullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          {{- toYaml $mcp.resources | nindent 10 }}
        volumeMounts:
        {{- if $caConfigMap }}
        - name: cas
          mountPath: /etc/fulfillment-mcp-server/tls/cas
        {{- end }}
        - name: tls
          mountPath: /etc/fulfillment-mcp-server/tls
        - name: exchange-credentials
          mountPath: /etc/fulfillment-mcp-server/oauth
          readOnly: true
        command:
        - /usr/local/bin/fulfillment-service
        - start
        - mcp-server
        - --log-level={{ .Values.log.level }}
        # OAuth bearer tokens and tenant resource data must not be logged.
        - --log-headers=false
        - --log-bodies=false
        {{- if $caConfigMap }}
        - --ca-file=/etc/fulfillment-mcp-server/tls/cas
        {{- end }}
        - --http-listener-address=0.0.0.0:8000
        - --http-listener-tls-crt=/etc/fulfillment-mcp-server/tls/tls.crt
        - --http-listener-tls-key=/etc/fulfillment-mcp-server/tls/tls.key
        - --http-cors-allowed-origins={{ trimSuffix "/" $publicURL }}
        - --grpc-server-address=fulfillment-api:8000
        - --grpc-authn-trusted-token-issuers={{ $issuerURL }}
        - --oauth-authorization-server={{ $issuerURL }}
        - --oauth-resource-url={{ $publicURL }}
        - --oauth-token-endpoint={{ $exchangeTokenEndpoint }}
        - --oauth-exchange-client-id={{ $exchangeClientID }}
        - --oauth-api-audience={{ $audience }}
        - --oauth-exchange-client-secret-file=/etc/fulfillment-mcp-server/oauth/client-secret
        ports:
        - name: mcp
          containerPort: 8000
          protocol: TCP
        livenessProbe:
          tcpSocket:
            port: mcp
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          tcpSocket:
            port: mcp
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
{{- end }}
