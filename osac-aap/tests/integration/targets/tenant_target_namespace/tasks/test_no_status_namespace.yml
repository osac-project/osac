---
- name: "TenantTargetNamespace - Test missing target namespace status"
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../../common_vars.yml

  tasks:
    - name: Test missing target namespace status
      block:
        - name: Create test Tenant without a target namespace
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: osac.openshift.io/v1alpha1
              kind: Tenant
              metadata:
                name: ttn-test-no-status-namespace
                namespace: osac-system

        - name: Run tenant_target_namespace role
          ansible.builtin.include_role:
            name: osac.service.tenant_target_namespace
          vars:
            compute_instance:
              status:
                tenantReference:
                  name: ttn-test-no-status-namespace
                  namespace: osac-system

        - name: Verify tenant name used when status.namespace is absent
          ansible.builtin.assert:
            that:
              - tenant_target_namespace == "ttn-test-no-status-namespace"

      always:
        - name: Cleanup test Tenant
          kubernetes.core.k8s:
            state: absent
            api_version: osac.openshift.io/v1alpha1
            kind: Tenant
            namespace: osac-system
            name: ttn-test-no-status-namespace
