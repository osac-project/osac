---
# The BMaaS NetBox sanity + regression suite of a pull request, as a run of its own.
#
# What runs here: what e2e-pr-bmaas-netbox.yml runs, plus the regression tests —
# the netbox equivalent of e2e-bmaas-full for metal3 (`tier: full`). The policy's
# variant mechanism only fits suites the decision chooses, so this is a suite of
# its own, following the netris pattern: own line, manual only, never blocking
# the E2E check.
#
# Who starts it: the decision of e2e-pr.yml (osac-ci), by hand through the E2E
# comment or `/test bmaas-netbox-full`. The policy names this file for the suite
# (`workflow: e2e-pr-bmaas-netbox-full.yml` in .github/e2e-policy.yml).
#
# Input trust: anyone with write access can dispatch this workflow with any
# inputs. `verify` (osac-ci) checks them against the pull request — the
# fork author and association, which decide whether a fork's code may run
# with secrets, are read from the pull request, never taken from the inputs.
#
# Do not rename the run: its end is recognised by the exact format
# `E2E suite · <suite id> · #<pull request> · <commit>` (the `#` is quoted
# because an unquoted one starts a YAML comment). The workflow runs from
# the default branch, while the code under test is the commit.
# See .github/CI.md.
name: E2E BMaaS NetBox Full PR suite
run-name: "E2E suite · bmaas-netbox-full · #${{ inputs.pr-number }} · ${{ inputs.sha }}"

on:
  workflow_dispatch:
    inputs:
      repo:
        description: The repository that holds the commit (a fork for a fork pull request), owner/name
        required: true
        type: string
      sha:
        description: The head commit to test
        required: true
        type: string
      pr-number:
        description: The pull request number
        required: true
        type: string
      # The decision sends these two with every suite. They are not used: `verify` reads the author and association from
      # the pull request, so a dispatch cannot claim to be a member.
      fork-pr-author:
        description: Ignored (read from the pull request)
        required: false
        type: string
        default: ""
      fork-pr-author-association:
        description: Ignored (read from the pull request)
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  verify:
    permissions:
      contents: read
      pull-requests: read
    uses: osac-project/osac-ci/.github/workflows/suite-inputs.yml@728d1b064cdbfa429c68ce5bc5a35b47b6c127d7  # v1.3.10
    with:
      repo: ${{ inputs.repo }}
      sha: ${{ inputs.sha }}
      pr-number: ${{ inputs.pr-number }}

  # Named after the suite id of .github/e2e-policy.yml: the line of the suite follows the deepest job of this run.

  bmaas-netbox-full:
    needs: verify
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/e2e-bmaas-full-install.yml
    with:
      tier: full
      repo: ${{ inputs.repo }}
      sha: ${{ inputs.sha }}
      pr-number: ${{ inputs.pr-number }}
      fork-pr-author: ${{ needs.verify.outputs.fork-author }}
      fork-pr-author-association: ${{ needs.verify.outputs.fork-association }}
      inventory-backend: netbox
    secrets:
      # Every run captures telemetry now, so the password is always passed.
      # Without it the run still passes, it just leaves no telemetry.
      CI_OBSERVE_OTLP_PASSWORD: ${{ secrets.CI_OBSERVE_OTLP_PASSWORD }}
      OSAC_CI_APP_ID: ${{ secrets.OSAC_CI_APP_ID }}
      OSAC_CI_APP_PRIVATE_KEY: ${{ secrets.OSAC_CI_APP_PRIVATE_KEY }}
