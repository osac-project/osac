# ── Cleanup ──
- name: "ONTAP Storage Provider - Cleanup"
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Find any remaining ONTAP test StorageClasses by label
      kubernetes.core.k8s_info:
        api_version: storage.k8s.io/v1
        kind: StorageClass
        label_selectors:
          - "osac.openshift.io/storage-provider=ontap"
      register: _remaining_ontap_scs
      failed_when: false
      no_log: true

    - name: Delete any remaining ONTAP test StorageClasses discovered by label
      kubernetes.core.k8s:
        state: absent
        api_version: storage.k8s.io/v1
        kind: StorageClass
        name: "{{ item.metadata.name }}"
      loop: "{{ _remaining_ontap_scs.resources | default([]) }}"
      loop_control:
        label: "cleanup-labeled-sc"
      failed_when: false
      no_log: true

    - name: Delete test Tenant CR, preparation Secrets, and Shared-TBC test resources
      kubernetes.core.k8s:
        state: absent
        definition: "{{ item }}"
      loop:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: ontap-prep-test-ontap-prep-ontap-be-1
            namespace: osac-storage
        - apiVersion: v1
          kind: Secret
