# CaaS external access is owned by the service role: it publishes the API
# bootstrap records, reserves and configures the guest ingress VIP, publishes
# wildcard apps DNS from the confirmed Service address, and writes the endpoint
# annotations on the ClusterOrder.
- name: Run the CaaS external access flow
  ansible.builtin.include_role:
    name: osac.service.external_access
    tasks_from: caas_create.yaml

- name: Wait for cluster network operator to become ready
  when: not (external_access_skip_network_operator_wait | default(false))
  ansible.builtin.include_role:
    name: osac.service.wait_for
    tasks_from: wait_for_network_cluster_operator
  vars:
    wait_for_kubeconfig: "{{ admin_kubeconfig }}"
