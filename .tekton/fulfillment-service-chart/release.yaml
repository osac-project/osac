apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/osac-project/osac?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "push" && target_branch.startsWith("refs/tags/osac-release/")
  labels:
    appstudio.openshift.io/application: osac
    appstudio.openshift.io/component: fulfillment-service-chart
    pipelines.appstudio.openshift.io/type: build
  name: fulfillment-service-chart-on-release
  namespace: osac-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/redhat-user-workloads/osac-tenant/fulfillment-service-chart:{{revision}}
  - name: chart-context
    value: fulfillment-service/charts/service
  # Chart version is resolved by tag NAME (resolve-chart-version task
  # below), not by build-helm-chart-oci-ta's own default git-describe/
  # TAG_PREFIX mechanism: that mechanism requires this dedicated
  # fulfillment-service-chart-vX.Y.Z tag to be reachable via git ancestry from this
  # exact commit, but osac-build-and-publish.yaml's "Create chart release
  # tags" step only pushes it when this chart's owning component is
  # actually bumped this release -- a release that pins everything
  # (the common case) leaves no such tag anywhere in this commit's
  # history (per-release stamping commits are never merged into main),
  # so git describe falls back to a nonsense, non-semver version like
  # "0.1.7392_5f8626895" -- confirmed live, a real release dispatch
  # with nothing bumped produced exactly that, and either silently
  # published it (charts with no rewrite-registry-image-refs task) or
  # hard-failed downstream (helm pull --version rejecting it as invalid
  # semver, in charts that do). tag-prefix is still the dedicated,
  # slash-free tag (not the per-component "<component>/vX.Y.Z" one --
  # see resolve-chart-version's own comment for why slash-free matters).
  - name: tag-prefix
    value: fulfillment-service-chart-v
  # Patches this chart's own image reference field(s) in its SOURCE
  # values.yaml -- which commits a GHCR dev placeholder (e.g.
  # "ghcr.io/osac-project/<component>:sha-<short>") -- to point at
  # the real registry.stage.redhat.io image, before build-helm-chart-
  # oci-ta packages and pushes it (see patch-chart-image-refs task
  # below). NOT a separate re-pull/re-push to registry.stage.redhat.io
  # after the fact: that approach needed its own push credentials for
  # that registry inside the BUILD pipeline, which this component's
  # build-time service account deliberately doesn't have (confirmed
  # live: a real push attempt failed immediately, auths scoped only
  # to this component's own quay.io/redhat-user-workloads repo) --
  # registry.stage.redhat.io write access is reserved for the
  # managed release pipeline, which already promotes this exact
  # chart there via the existing osac-charts-stage RPA.
  # owning-component-tag-prefix reuses the EXISTING fulfillment-service/vX.Y.Z
  # tag (not the dedicated chart tag above) since that's what
  # identifies the real released *image* version.
  - name: owning-component-tag-prefix
    value: fulfillment-service/v
  - name: registry-image
    value: registry.stage.redhat.io/cloud-extensions/fulfillment-service-rhel10
  # Operates directly on the source tree's own "values.yaml" inside
  # chart-context, before build-helm-chart-oci-ta packages it -- not
  # the post-package flat layout (that only exists after packaging
  # renames the chart root to the Konflux component name).
  - name: image-rewrite-yq
    value: TARGET_IMAGE="${TARGET_IMAGE}" TARGET_REPO="${TARGET_IMAGE%:*}" TARGET_TAG="${TARGET_IMAGE##*:}" yq -i '.images.service.repository = strenv(TARGET_REPO) | .images.service.tag = strenv(TARGET_TAG)' "values.yaml"
  pipelineSpec:
    description: |
      Packages and pushes a Helm chart to an OCI repository using trusted artifacts,
      for a real release. Chart version is computed from the dedicated chart git tag
      already pushed at this exact commit by osac-build-and-publish.yaml's own
      release tagging step.
    params:
    - description: Source Repository URL
      name: git-url
      type: string
    - default: ""
      description: Revision of the Source Repository
      name: revision
      type: string
    - description: Fully Qualified Output Image
      name: output-image
      type: string
    - default: dist/chart/
      description: Path to the Helm chart directory relative to the source root
      name: chart-context
      type: string
    - default: helm-
      description: An identifying prefix on which the version tag is to be matched
      name: tag-prefix
      type: string
    - default: "false"
      description: Execute the build with network isolation
      name: hermetic
      type: string
    - default: ""
      description: Build dependencies to be prefetched
      name: prefetch-input
      type: string
    - default: ""
      description: Image tag expiration time, time values could be something like
        1h, 2d, 3w for hours, days, and weeks, respectively.
      name: image-expires-after
      type: string
    - default: "false"
      description: Enable cache proxy configuration
      name: enable-cache-proxy
    - default: "true"
      description: Use the package registry proxy when prefetching dependencies
      name: enable-package-registry-proxy
      type: string
    - description: Existing per-component tag prefix identifying the real released image version
      name: owning-component-tag-prefix
      type: string
    - description: Fully qualified registry.stage.redhat.io image (no tag) this chart should reference
      name: registry-image
      type: string
    - description: Full yq command rewriting this chart's own image value field(s), given $TARGET_IMAGE
      name: image-rewrite-yq
      type: string
    results:
    - description: ""
      name: IMAGE_URL
      value: $(tasks.build-helm-chart.results.IMAGE_URL)
    - description: ""
      name: IMAGE_DIGEST
      value: $(tasks.build-helm-chart.results.IMAGE_DIGEST)
    - description: ""
      name: CHAINS-GIT_URL
      value: $(tasks.clone-repository.results.url)
    - description: ""
      name: CHAINS-GIT_COMMIT
      value: $(tasks.clone-repository.results.commit)
    tasks:
    - name: init
      params:
      - name: enable-cache-proxy
        value: $(params.enable-cache-proxy)
      taskRef:
        params:
        - name: name
          value: init
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-init:0.4.3@sha256:c6c414a3b5dcd827720f3443a128a02d27a0a5071ea3e4dc0063d578f1f73a74
        - name: kind
          value: task
        resolver: bundles
    - name: resolve-chart-version
      params:
      - name: git-url
        value: $(params.git-url)
      - name: tag-prefix
        value: $(params.tag-prefix)
      runAfter:
      - init
      taskSpec:
        params:
        - name: git-url
          type: string
        - name: tag-prefix
          type: string
        results:
        - name: CHART_VERSION
          description: The real chart version, resolved by tag name
        steps:
        - name: resolve
          # Same image build-helm-chart-oci-ta's own "package-and-push" step
          # uses -- already has git.
          image: quay.io/konflux-ci/tools@sha256:2112b51ba80d1041c120c32b67b871d371fde4e5775b32a3c7bf01a2f9ec0964
          script: |
            #!/bin/bash
            set -euo pipefail

            # Resolve by tag NAME, not by git ancestry/revision -- see this
            # pipeline's own comment above tag-prefix for the full reasoning
            # (per-release stamping commits are never merged into main, so
            # neither an exact-match nor an ancestor-walking git describe can
            # find this chart's own tag unless it was bumped this exact
            # release). Tags are monotonically increasing, so the highest
            # version by semver sort is always the real, currently-released
            # one, bumped this release or not.
            echo "Resolving real chart version from $(params.tag-prefix)*..."
            git clone --filter=blob:none --no-checkout "$(params.git-url)" /tmp/repo
            cd /tmp/repo
            git fetch --tags origin
            CHART_VERSION=$(git tag -l "$(params.tag-prefix)*" \
              | sed "s#^$(params.tag-prefix)##" \
              | { grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
              | sort -V | tail -1)
            if [ -z "${CHART_VERSION}" ]; then
              echo "ERROR: no tag matching $(params.tag-prefix)* found" >&2
              exit 1
            fi
            echo "Real chart version: ${CHART_VERSION}"
            echo -n "${CHART_VERSION}" >"$(results.CHART_VERSION.path)"
    - name: clone-repository
      params:
      - name: url
        value: $(params.git-url)
      - name: revision
        value: $(params.revision)
      - name: ociStorage
        value: $(params.output-image).git
      - name: ociArtifactExpiresAfter
        value: $(params.image-expires-after)
      runAfter:
      - init
      taskRef:
        params:
        - name: name
          value: git-clone-oci-ta
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-git-clone-oci-ta:0.2.6@sha256:a3678910c2bf9187a66a96066193cb41046fbb7097160bf2be6a374ed5e49d30
        - name: kind
          value: task
        resolver: bundles
      workspaces:
      - name: basic-auth
        workspace: git-auth
    - name: patch-chart-image-refs
      params:
      - name: SOURCE_ARTIFACT
        value: $(tasks.clone-repository.results.SOURCE_ARTIFACT)
      - name: ociStorage
        value: $(params.output-image).patched
      - name: ociArtifactExpiresAfter
        value: $(params.image-expires-after)
      - name: git-url
        value: $(params.git-url)
      - name: chart-context
        value: $(params.chart-context)
      - name: owning-component-tag-prefix
        value: $(params.owning-component-tag-prefix)
      - name: registry-image
        value: $(params.registry-image)
      - name: image-rewrite-yq
        value: $(params.image-rewrite-yq)
      runAfter:
      - clone-repository
      taskSpec:
        params:
        - name: SOURCE_ARTIFACT
          type: string
        - name: ociStorage
          type: string
        - name: ociArtifactExpiresAfter
          type: string
        - name: git-url
          type: string
        - name: chart-context
          type: string
        - name: owning-component-tag-prefix
          type: string
        - name: registry-image
          type: string
        - name: image-rewrite-yq
          type: string
        results:
        - name: SOURCE_ARTIFACT
          description: The Trusted Artifact URI pointing to the source tree, now
            with this chart's own image reference(s) pointed at the real
            registry.stage.redhat.io image
        stepTemplate:
          volumeMounts:
          - mountPath: /var/workdir
            name: workdir
        steps:
        - name: use-trusted-artifact
          image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:6fdd8890c52acb20ffc5f2d2a6cab2a11b7a2e431bf175bf5577ae4b9849a434
          args:
          - use
          - $(params.SOURCE_ARTIFACT)=/var/workdir/source
        - name: patch-values
          # Same image build-helm-chart-oci-ta's own "package-and-push" step
          # uses -- already has git and yq. Runs as root: use-trusted-artifact
          # (the preceding step) extracts the source tree as build-trusted-
          # artifacts' own non-root user, a different uid than this image's
          # default (1001) -- the extracted files' plain git-clone modes
          # (644/755) grant no cross-uid write, so `yq -i` on values.yaml
          # fails "permission denied" otherwise. Confirmed live on a real
          # release. Same cross-image uid mismatch already solved once
          # before for generate-ee-context (see its own securityContext).
          securityContext:
            runAsUser: 0
          image: quay.io/konflux-ci/tools@sha256:2112b51ba80d1041c120c32b67b871d371fde4e5775b32a3c7bf01a2f9ec0964
          script: |
            #!/bin/bash
            set -euo pipefail

            # Resolve the real per-component image version by tag NAME, not
            # git ancestry/revision: this release's own stamping commit
            # (and the owning image component's own stamping commit, if
            # that component wasn't rebuilt this release) each live on
            # their own throwaway per-release branch that's never merged
            # into main, so neither --exact-match nor an ancestor-walking
            # git describe can find a component's tag unless that exact
            # component was bumped in this exact release. Tags are
            # monotonically increasing per component, so the highest
            # version by semver sort is always the real, currently-
            # released one, bumped this release or not.
            echo "Resolving real image version from $(params.owning-component-tag-prefix)*..."
            git clone --filter=blob:none --no-checkout "$(params.git-url)" /tmp/repo
            cd /tmp/repo
            git fetch --tags origin
            REAL_VERSION=$(git tag -l "$(params.owning-component-tag-prefix)*" \
              | sed "s#^$(params.owning-component-tag-prefix)##" \
              | sort -V | tail -1)
            if [ -z "${REAL_VERSION}" ]; then
              echo "ERROR: no tag matching $(params.owning-component-tag-prefix)* found" >&2
              exit 1
            fi
            TARGET_IMAGE="$(params.registry-image):${REAL_VERSION}"
            echo "Real image version: ${REAL_VERSION} -> ${TARGET_IMAGE}"

            cd /var/workdir/source/$(params.chart-context)
            $(params.image-rewrite-yq)
        - name: create-trusted-artifact
          image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:6fdd8890c52acb20ffc5f2d2a6cab2a11b7a2e431bf175bf5577ae4b9849a434
          args:
          - create
          - --store
          - $(params.ociStorage)
          - $(results.SOURCE_ARTIFACT.path)=/var/workdir/source
          env:
          - name: IMAGE_EXPIRES_AFTER
            value: $(params.ociArtifactExpiresAfter)
        volumes:
        - name: workdir
          emptyDir: {}
    - name: prefetch-dependencies
      params:
      - name: input
        value: $(params.prefetch-input)
      - name: SOURCE_ARTIFACT
        value: $(tasks.patch-chart-image-refs.results.SOURCE_ARTIFACT)
      - name: ociStorage
        value: $(params.output-image).prefetch
      - name: ociArtifactExpiresAfter
        value: $(params.image-expires-after)
      - name: enable-package-registry-proxy
        value: $(params.enable-package-registry-proxy)
      runAfter:
      - patch-chart-image-refs
      taskRef:
        params:
        - name: name
          value: prefetch-dependencies-oci-ta
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-prefetch-dependencies-oci-ta:0.10.3@sha256:0c386f2c26b46b978280c5c54caac26bcd524975f8f7cc06bb080ba00eae3ad4
        - name: kind
          value: task
        resolver: bundles
      workspaces:
      - name: git-basic-auth
        workspace: git-auth
      - name: netrc
        workspace: netrc
    - name: build-helm-chart
      params:
      - name: IMAGE
        value: $(params.output-image)
      - name: COMMIT_SHA
        value: $(tasks.clone-repository.results.commit)
      - name: SOURCE_ARTIFACT
        value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
      - name: CHART_CONTEXT
        value: $(params.chart-context)
      - name: CHART_VERSION
        value: $(tasks.resolve-chart-version.results.CHART_VERSION)
      runAfter:
      - prefetch-dependencies
      - resolve-chart-version
      taskRef:
        params:
        - name: name
          value: build-helm-chart-oci-ta
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-build-helm-chart-oci-ta:0.3@sha256:cc59ae16baa756d23f3e5f8328cd9f8ba39a388f8eafbb9db666dea694814d25
        - name: kind
          value: task
        resolver: bundles
    workspaces:
    - name: git-auth
      optional: true
    - name: netrc
      optional: true
  taskRunTemplate:
    serviceAccountName: build-pipeline-fulfillment-service-chart
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
