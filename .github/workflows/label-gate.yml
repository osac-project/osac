---
name: label-gate

permissions:
  contents: read

on:
  pull_request:
    types: [opened, labeled, unlabeled, synchronize, reopened]
    branches: [main]
  merge_group:

jobs:
  check-labels:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: read
    steps:
      - name: Auto-pass for merge queue
        if: github.event_name == 'merge_group'
        run: echo "Labels already validated on PR"
      - name: Prepare e2e merge gates on unlock
        if: >-
          github.event_name == 'pull_request'
          && github.event.action == 'labeled'
          && contains(fromJSON('["lgtm","e2e-ready"]'), github.event.label.name)
        uses: osac-project/osac-test-infra/.github/actions/invalidate-e2e-gates@main
        with:
          head-sha: ${{ github.event.pull_request.head.sha }}
          reason: >-
            ${{ format('{0} unlock - waiting for fresh full-install run',
            github.event.label.name) }}
          skip-if-all-green: "true"
        continue-on-error: true
      - name: Check required Prow labels
        if: github.event_name == 'pull_request'
        env:
          # Fetch live labels rather than trusting github.event.pull_request.labels:
          # Prow-style bots apply lgtm/approved/jira-valid-reference as separate
          # `labeled` events in quick succession, so each event's own payload only
          # has whatever labels existed at that exact instant -- not the final set.
          # That's why this check would fail on the first one or two labels and
          # only pass on the last: reading live state instead means every run sees
          # the same (already-complete, by the time it executes) label set.
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          for i in 1 2 3; do
            LABELS=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json labels --jq '[.labels[].name]') && break
            if [ "$i" -lt 3 ]; then
              echo "::warning::gh pr view attempt $i/3 failed, retrying in 3s..."
              sleep 3
            else
              echo "::error::gh pr view failed after 3 attempts"
              exit 1
            fi
          done
          missing=()
          for label in lgtm approved jira/valid-reference; do
            if ! echo "$LABELS" | jq -e "index(\"$label\")" > /dev/null 2>&1; then
              missing+=("$label")
            fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing required labels: ${missing[*]}"
            echo ""
            echo "Required labels are set by Prow plugins via OWNERS files:"
            echo "  lgtm           - reviewer types /lgtm"
            echo "  approved       - approver types /approve"
            echo "  jira/valid-reference - PR title has valid Jira key"
            exit 1
          fi
          echo "All required labels present"
