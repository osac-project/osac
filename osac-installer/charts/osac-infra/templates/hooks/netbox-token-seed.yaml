{{- if .Values.netbox.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-netbox-token-seed
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
---
# The seed Job writes the API token Secret into osacNamespace, which differs
# from Release.Namespace, so the RBAC lives there and binds the release-local
# ServiceAccount across namespaces. These are regular release resources, not
# hooks: Helm applies them before the post-install seed Job runs and removes
# them on uninstall, so only the out-of-namespace Secret needs a cleanup hook.
# get/patch/delete are scoped to the specific Secret name; create cannot be
# name-scoped.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-netbox-token-seed
  namespace: {{ .Values.osacNamespace }}
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["{{ default "netbox-api-token" .Values.netbox.apiTokenSecret }}"]
  verbs: ["get", "patch", "delete"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-netbox-token-seed
  namespace: {{ .Values.osacNamespace }}
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-netbox-token-seed
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}-netbox-token-seed
  namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-netbox-token-seed
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    # Must run after apply-ca-bundle (weight 12): NetBox waits on the shared
    # PostgreSQL, whose pod mounts the ca-bundle ConfigMap that apply-ca-bundle
    # distributes. At a lower weight this hook would deadlock the hook chain
    # (netbox -> postgres -> ca-bundle -> apply-ca-bundle) and fail the release.
    helm.sh/hook-weight: "13"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 5
  # Generous deadline: on a cold cluster the shared PostgreSQL image pull,
  # first-boot init, and NetBox migrations must all finish before NetBox
  # answers /login/ (the script polls every 5s and exits as soon as it does).
  activeDeadlineSeconds: 1200
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        {{- include "osac-infra.cliJobPodSecurityContext" . | nindent 8 }}
      serviceAccountName: {{ .Release.Name }}-netbox-token-seed
      containers:
      - name: seed
        image: {{ .Values.cliImage }}
        command: ["/bin/sh", "/scripts/netbox-token-seed.sh"]
        env:
        - name: OPERATOR_NS
          value: {{ .Values.osacNamespace | quote }}
        - name: SECRET_NAME
          value: {{ default "netbox-api-token" .Values.netbox.apiTokenSecret | quote }}
        - name: NETBOX_SVC
          value: "http://{{ .Release.Name }}-netbox.{{ .Release.Namespace }}.svc.cluster.local"
        - name: NETBOX_USERNAME
          value: {{ default "admin" .Values.netbox.superuser.name | quote }}
        - name: HOME
          value: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          {{- toYaml .Values.hookResources | nindent 10 }}
        volumeMounts:
        - name: scripts
          mountPath: /scripts
          readOnly: true
        - name: superuser
          mountPath: /credentials
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: scripts
        configMap:
          name: osac-infra-hook-scripts
          defaultMode: 0755
      - name: superuser
        secret:
          secretName: {{ .Release.Name }}-netbox-superuser
          items:
          - key: password
            path: password
      - name: tmp
        emptyDir: {}
---
# Helm removes release-managed resources on uninstall, but the token Secret
# lives in osacNamespace, outside this release. This pre-delete hook removes
# it before the release (and the ServiceAccount behind it) goes away; it runs
# while the RBAC above is still in place and reuses its identity. If an
# install fails before that RBAC is applied, uninstall with --no-hooks and
# remove the Secret manually.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-netbox-token-cleanup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        {{- include "osac-infra.cliJobPodSecurityContext" . | nindent 8 }}
      serviceAccountName: {{ .Release.Name }}-netbox-token-seed
      containers:
      - name: cleanup
        image: {{ .Values.cliImage }}
        command: ["/bin/sh", "/scripts/netbox-token-cleanup.sh"]
        env:
        - name: OPERATOR_NS
          value: {{ .Values.osacNamespace | quote }}
        - name: SECRET_NAME
          value: {{ default "netbox-api-token" .Values.netbox.apiTokenSecret | quote }}
        - name: HOME
          value: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          {{- toYaml .Values.hookResources | nindent 10 }}
        volumeMounts:
        - name: scripts
          mountPath: /scripts
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: scripts
        configMap:
          name: osac-infra-hook-scripts
          defaultMode: 0755
      - name: tmp
        emptyDir: {}
{{- end }}
