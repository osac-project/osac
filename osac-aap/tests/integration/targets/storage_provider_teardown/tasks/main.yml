---
# Integration test for osac.service.storage_provider teardown action.
# Tests the full teardown lifecycle: deletes StorageClasses (by label, including
# JIT-created ones), CSI Secret, hub Secret, and verifies mock VMS server
# received live-query delete calls.
# Requires: mock VMS server on 127.0.0.1:18443, kind cluster with osac-system namespace.

# ── Setup: Pre-create resources to be torn down ──
- name: "Storage Provider Teardown - Setup fixtures"
  hosts: localhost
  gather_facts: false

  vars:
    mock_tenant_manager_password: "test-csi-password"
    mock_csi_token: "test-api-token-for-csi"

  tasks:
    - name: Reset mock VMS server (sequential execution — safe to reset)
      ansible.builtin.uri:
        url: "https://127.0.0.1:18443/_reset"
        validate_certs: false
        method: POST
      failed_when: false

    - name: Pre-seed mock VMS with tenant resources for live-query teardown
      ansible.builtin.uri:
        url: "https://127.0.0.1:18443/api/{{ item.resource }}/"
        method: POST
        body_format: json
        body: "{{ item.body }}"
        validate_certs: false
        status_code: [200, 201]
      loop:
        - resource: tenants
          body:
            name: "test-teardown"
            local_provider_id: 1
        - resource: views
          body:
            name: "view-test-teardown-default"
            path: "/osac/test-teardown/default"
            tenant_id: 1
        - resource: views
          body:
            name: "view-test-teardown-extra"
            path: "/osac/test-teardown/extra"
            tenant_id: 1
        - resource: quotas
          body:
            name: "quota-test-teardown-default"
            path: "/osac/test-teardown/default"
            tenant_id: 1
        - resource: viewpolicies
          body:
            name: "osac-test-teardown-nfs"
            flavor: "NFS"
            tenant_id: 1
        - resource: qospolicies
          body:
            name: "osac-test-teardown-default"
            tenant_id: 1
            mode: "STATIC"
            static_limits:
              max_reads_bw_mbps: 100
        - resource: managers
          body:
            username: "osac-test-teardown"
            roles: [1]
        - resource: roles
          body:
            name: "osac-csi-test-teardown"
      loop_control:
        label: "{{ item.resource }}/{{ item.body.name | default(item.body.username | default('?')) }}"

    - name: Create hub Secret fixture
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "vast-tenant-config-test-teardown-be-test"
            namespace: "osac-system"
            labels:
              app.kubernetes.io/managed-by: osac-aap
              osac.openshift.io/tenant: "test-teardown"
              osac.openshift.io/storage-provider: vast
              osac.openshift.io/storage-backend-id: be-test
          type: Opaque
          stringData:
            vast_tenant_id: "1"
            vast_local_provider_id: "1"
            vip_pool_name: "osac-test-pool"
            vast_endpoint: "127.0.0.1:18443"
            storage_provider_type: "vast"
            tenant_manager_name: "osac-test-teardown"
            tenant_manager_username: "osac-test-teardown"
            tenant_manager_password: "{{ mock_tenant_manager_password }}"
            tenant_manager_id: "7"
            tenant_role_id: "8"

    - name: Create StorageClass fixture (setup-created)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: "vast-nfs-test-teardown-default"
            labels:
              app.kubernetes.io/managed-by: osac-aap
              osac.openshift.io/tenant: "test-teardown"
              osac.openshift.io/storage-tier: "default"
              osac.openshift.io/storage-protocol: "nfs"
          provisioner: csi.vastdata.com
          parameters:
            vip_pool_name: "osac-test-pool"
            root_export: "/osac/test-teardown/default"
            csi.storage.k8s.io/provisioner-secret-name: "vast-csi-test-teardown-be-test"
            csi.storage.k8s.io/provisioner-secret-namespace: "osac-system"
          reclaimPolicy: Delete
          volumeBindingMode: Immediate

    - name: Create JIT StorageClass fixture (ensure_storage_class-created, extra tier)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: "vast-block-test-teardown-performance"
            labels:
              app.kubernetes.io/managed-by: osac-aap
              osac.openshift.io/tenant: "test-teardown"
              osac.openshift.io/storage-tier: "performance"
              osac.openshift.io/storage-protocol: "block"
          provisioner: block.csi.vastdata.com
          parameters:
            vip_pool_name: "osac-test-pool"
            subsystem: "view-test-teardown-performance"
            tenant_name: "test-teardown"
          reclaimPolicy: Delete
          volumeBindingMode: WaitForFirstConsumer

    - name: Create CSI Secret fixture
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "vast-csi-test-teardown-be-test"
            namespace: "osac-system"
            labels:
              app.kubernetes.io/managed-by: osac-aap
              osac.openshift.io/tenant: "test-teardown"
          type: Opaque
          stringData:
            token: "{{ mock_csi_token }}"
            endpoint: "127.0.0.1:18443"

    - name: Check if VolumeSnapshotClass CRD exists
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: volumesnapshotclasses.snapshot.storage.k8s.io
      register: _vsc_crd_check

    - name: Create VolumeSnapshotClass fixture (when CRD exists)
      when: _vsc_crd_check.resources | length > 0
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: snapshot.storage.k8s.io/v1
          kind: VolumeSnapshotClass
          metadata:
            name: "vast-snapshot-test-teardown-default"
            labels:
              app.kubernetes.io/managed-by: osac-aap
              osac.openshift.io/tenant: "test-teardown"
              osac.openshift.io/storage-tier: "default"
          driver: csi.vastdata.com
          deletionPolicy: Delete
          parameters:
            csi.storage.k8s.io/snapshotter-secret-name: "vast-csi-test-teardown-be-test"
            csi.storage.k8s.io/snapshotter-secret-namespace: "osac-system"

    - name: Verify all fixtures created
      block:
        - name: Verify hub Secret exists
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Secret
            name: "vast-tenant-config-test-teardown-be-test"
            namespace: "osac-system"
          register: _verify_hub

        - name: Verify both StorageClasses exist (setup + JIT)
          kubernetes.core.k8s_info:
            api_version: storage.k8s.io/v1
            kind: StorageClass
            label_selectors:
              - "osac.openshift.io/tenant=test-teardown"
          register: _verify_scs

        - name: Assert all fixtures are in place
          ansible.builtin.assert:
            that:
              - _verify_hub.resources | length == 1
              - _verify_scs.resources | length == 2
            fail_msg: "Not all fixtures were created successfully (expected 1 hub Secret, 2 SCs)"
            success_msg: "All fixtures created: hub Secret, 2 StorageClasses (setup + JIT), CSI Secret"

# ── Test: Run teardown ──
- name: "Storage Provider Teardown - Run teardown"
  hosts: localhost
  gather_facts: false

  environment:
    OSAC_STORAGE_CONFIG_NAMESPACE: "osac-system"

  vars:
    vast_storage_config_namespace: osac-system
    tenant_name: "test-teardown"
    tenant_namespace: "osac-system"
    storage_provider_tiers:
      - name: default
        protocol: nfs
        provider: vast
        backend_id: be-test
    storage_provider_backend_connections:
      be-test:
        endpoint: "127.0.0.1:18443"
        username: "admin"
        password: "mock-admin-password"
    storage_provider_provisioning_target: vmaas
    vast_storage_validate_certs: false

  tasks:
    - name: Call storage_provider role with teardown_cluster_storage action
      ansible.builtin.include_role:
        name: osac.service.storage_provider
      vars:
        storage_provider_action: teardown_cluster_storage

    - name: Call storage_provider role with teardown_backend action
      ansible.builtin.include_role:
        name: osac.service.storage_provider
      vars:
        storage_provider_action: teardown_backend

# ── Verify: K8s resources deleted (including JIT SCs) ──
- name: "Storage Provider Teardown - Verify K8s resource deletion"
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Check all tenant StorageClasses deleted (by label)
      kubernetes.core.k8s_info:
        api_version: storage.k8s.io/v1
        kind: StorageClass
        label_selectors:
          - "osac.openshift.io/tenant=test-teardown"
      register: _td_scs

    - name: Assert ALL tenant StorageClasses deleted (including JIT)
      ansible.builtin.assert:
        that:
          - _td_scs.resources | length == 0
        fail_msg: >-
          {{ _td_scs.resources | length }} StorageClass(es) still exist:
          {{ _td_scs.resources | map(attribute='metadata.name') | list }}
        success_msg: "All tenant StorageClasses deleted (setup + JIT)"

    - name: Check CSI Secret deleted
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "vast-csi-test-teardown-be-test"
        namespace: "osac-system"
      register: _td_csi

    - name: Assert CSI Secret deleted
      ansible.builtin.assert:
        that:
          - _td_csi.resources | length == 0
        fail_msg: "CSI Secret 'vast-csi-test-teardown-be-test' was not deleted"
        success_msg: "CSI Secret deleted"

    - name: Check hub Secret deleted (should be deleted when cleanup succeeds)
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "vast-tenant-config-test-teardown-be-test"
        namespace: "osac-system"
      register: _td_hub

    - name: Assert hub Secret deleted
      ansible.builtin.assert:
        that:
          - _td_hub.resources | length == 0
        fail_msg: "Hub Secret 'vast-tenant-config-test-teardown-be-test' was not deleted (cleanup may have failed)"
        success_msg: "Hub Secret deleted"

    - name: Check VolumeSnapshotClass CRD exists for verification
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: volumesnapshotclasses.snapshot.storage.k8s.io
      register: _td_vsc_crd

    - name: Check VolumeSnapshotClass deleted (when CRD exists)
      when: _td_vsc_crd.resources | length > 0
      kubernetes.core.k8s_info:
        api_version: snapshot.storage.k8s.io/v1
        kind: VolumeSnapshotClass
        label_selectors:
          - "osac.openshift.io/tenant=test-teardown"
      register: _td_vsc

    - name: Assert VolumeSnapshotClass deleted (when CRD exists)
      when: _td_vsc_crd.resources | length > 0
      ansible.builtin.assert:
        that:
          - _td_vsc.resources | length == 0
        fail_msg: "VolumeSnapshotClass(es) still exist for tenant test-teardown"
        success_msg: "All VolumeSnapshotClasses deleted"

# ── Verify: Mock server received live-query delete calls ──
- name: "Storage Provider Teardown - Verify mock API calls"
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Get mock server call log
      ansible.builtin.uri:
        url: "https://127.0.0.1:18443/_calls"
        validate_certs: false
        method: GET
        return_content: true
      register: _mock_calls

    - name: Parse mock call log
      ansible.builtin.set_fact:
        _call_log: "{{ _mock_calls.json }}"

    - name: Assert admin auth was performed for VMS cleanup
      ansible.builtin.assert:
        that:
          - _call_log | selectattr('path', 'equalto', '/api/token/') | selectattr('method', 'equalto', 'POST') | list | length > 0
        fail_msg: "No admin auth call found — teardown did not authenticate to VMS"
        success_msg: "Admin auth call detected"

    - name: Assert views were queried by tenant_id (live query)
      ansible.builtin.assert:
        that:
          - _call_log | selectattr('path', 'search', 'views.*tenant_id=') | selectattr('method', 'equalto', 'GET') | list | length > 0
        fail_msg: "No live view query by tenant_id found in mock call log"
        success_msg: "Views queried by tenant_id"

    - name: Assert view DELETE calls were made
      ansible.builtin.assert:
        that:
          - _call_log | selectattr('path', 'search', 'views/') | selectattr('method', 'equalto', 'DELETE') | list | length > 0
        fail_msg: "No view DELETE calls found in mock call log"
        success_msg: "View DELETE calls detected"

    - name: Assert quotas were queried by tenant_id (live query)
      ansible.builtin.assert:
        that:
          - _call_log | selectattr('path', 'search', 'quotas.*tenant_id=') | selectattr('method', 'equalto', 'GET') | list | length > 0
        fail_msg: "No live quota query by tenant_id found in mock call log"
        success_msg: "Quotas queried by tenant_id"

    - name: Assert view policies were queried by tenant_id (live query)
      ansible.builtin.assert:
        that:
          - _call_log | selectattr('path', 'search', 'viewpolicies.*tenant_id=') | selectattr('method', 'equalto', 'GET') | list | length > 0
        fail_msg: "No live view policy query by tenant_id found in mock call log"
        success_msg: "View policies queried by tenant_id"

    - name: Assert QoS policies were queried by tenant_id (live query)
      ansible.builtin.assert:
        that:
          - _call_log | selectattr('path', 'search', 'qospolicies.*tenant_id=') | selectattr('method', 'equalto', 'GET') | list | length > 0
        fail_msg: "No live QoS policy query by tenant_id found in mock call log"
        success_msg: "QoS policies queried by tenant_id"

    - name: Assert tenant deletion was attempted
      ansible.builtin.assert:
        that:
          - _call_log | selectattr('path', 'search', 'tenants') | list | length > 0
        fail_msg: "No tenant API call found in mock call log"
        success_msg: "Tenant API call detected"

    - name: Assert manager lookup was attempted
      ansible.builtin.assert:
        that:
          - _call_log | selectattr('path', 'search', 'managers') | list | length > 0
        fail_msg: "No manager API call found in mock call log"
        success_msg: "Manager API call detected"

    - name: Assert role lookup was attempted
      ansible.builtin.assert:
        that:
          - _call_log | selectattr('path', 'search', 'roles') | list | length > 0
        fail_msg: "No role API call found in mock call log"
        success_msg: "Role API call detected"

    - name: Assert local provider was deleted by ID (from hub Secret)
      ansible.builtin.assert:
        that:
          - _call_log | selectattr('path', 'search', 'localproviders/') | selectattr('method', 'equalto', 'DELETE') | list | length > 0
        fail_msg: "No local provider DELETE call found — orphaned provider not cleaned up"
        success_msg: "Local provider deleted by ID from hub Secret"

    - name: Assert tenant DELETE precedes local provider DELETE (correct ordering)
      vars:
        _delete_paths: "{{ _call_log | selectattr('method', 'equalto', 'DELETE') | map(attribute='path') | list }}"
        _tenant_del_paths: "{{ _delete_paths | select('search', 'tenants/') | list }}"
        _lp_del_paths: "{{ _delete_paths | select('search', 'localproviders/') | list }}"
      ansible.builtin.assert:
        that:
          - _tenant_del_paths | length > 0
          - _lp_del_paths | length > 0
          - _delete_paths.index(_tenant_del_paths[0]) < _delete_paths.index(_lp_del_paths[0])
        fail_msg: >-
          Tenant must be deleted before local provider (OSAC-4854).
          DELETE call order: {{ _delete_paths }}
        success_msg: "Correct order: tenant deleted before local provider"

    - name: Assert tenant deletion uses force_remove
      vars:
        _tenant_del_paths: "{{ _call_log | selectattr('method', 'equalto', 'DELETE') | map(attribute='path') | select('search', 'tenants/') | list }}"
      ansible.builtin.assert:
        that:
          - _tenant_del_paths | select('search', 'force_remove') | list | length > 0
        fail_msg: >-
          Tenant DELETE must include force_remove query parameter.
          Tenant DELETE paths: {{ _tenant_del_paths }}
        success_msg: "Correct: tenant deletion uses force_remove"

# ── Test: Two-backend partial state (backend A's hub Secret missing) ──
- name: "Storage Provider Teardown - Two-backend setup"
  hosts: localhost
  gather_facts: false

  vars:
    mock_tenant_manager_password: "test-csi-password"

  tasks:
    - name: Reset mock VMS server for two-backend scenario
      ansible.builtin.uri:
        url: "https://127.0.0.1:18443/_reset"
        validate_certs: false
        method: POST
      failed_when: false

    - name: Pre-seed mock VMS with tenant resources for two-backend teardown
      ansible.builtin.uri:
        url: "https://127.0.0.1:18443/api/{{ item.resource }}/"
        method: POST
        body_format: json
        body: "{{ item.body }}"
        validate_certs: false
        status_code: [200, 201]
      loop:
        - resource: tenants
          body:
            name: "test-td-2be"
            local_provider_id: 1
        - resource: tenants
          body:
            name: "different-tenant"
            local_provider_id: 2
        - resource: managers
          body:
            username: "osac-test-td-2be"
            roles: [1]
      loop_control:
        label: "{{ item.resource }}/{{ item.body.name | default(item.body.username | default('?')) }}"

    - name: Create hub Secret for backend A (will be deleted before teardown)
      no_log: true
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "vast-tenant-config-test-td-2be-be-a"
            namespace: "osac-system"
            labels:
              app.kubernetes.io/managed-by: osac-aap
              osac.openshift.io/tenant: "test-td-2be"
              osac.openshift.io/storage-provider: vast
              osac.openshift.io/storage-backend-id: be-a
          type: Opaque
          stringData:
            vast_tenant_id: "1"
            vast_local_provider_id: "1"
            vip_pool_name: "osac-test-pool-a"
            vast_endpoint: "127.0.0.1:18443"
            storage_provider_type: "vast"
            tenant_manager_name: "osac-test-td-2be-a"
            tenant_manager_username: "osac-test-td-2be-a"
            tenant_manager_password: "{{ mock_tenant_manager_password }}"
            tenant_manager_id: "7"
            tenant_role_id: "8"

    - name: Create hub Secret for backend B (will remain until teardown runs)
      no_log: true
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "vast-tenant-config-test-td-2be-be-b"
            namespace: "osac-system"
            labels:
              app.kubernetes.io/managed-by: osac-aap
              osac.openshift.io/tenant: "test-td-2be"
              osac.openshift.io/storage-provider: vast
              osac.openshift.io/storage-backend-id: be-b
          type: Opaque
          stringData:
            vast_tenant_id: "1"
            vast_local_provider_id: "1"
            vip_pool_name: "osac-test-pool-b"
            vast_endpoint: "127.0.0.1:18443"
            storage_provider_type: "vast"
            tenant_manager_name: "osac-test-td-2be-b"
            tenant_manager_username: "osac-test-td-2be-b"
            tenant_manager_password: "{{ mock_tenant_manager_password }}"
            tenant_manager_id: "7"
            tenant_role_id: "8"

    - name: Create CSI Secret for backend A
      no_log: true
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "vast-csi-test-td-2be-be-a"
            namespace: "osac-system"
            labels:
              app.kubernetes.io/managed-by: osac-aap
              osac.openshift.io/tenant: "test-td-2be"
          type: Opaque
          stringData:
            username: "osac-test-td-2be-a"
            password: "{{ mock_tenant_manager_password }}"
            endpoint: "127.0.0.1:18443"
            tenant: "test-td-2be"

    - name: Create CSI Secret for backend B
      no_log: true
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "vast-csi-test-td-2be-be-b"
            namespace: "osac-system"
            labels:
              app.kubernetes.io/managed-by: osac-aap
              osac.openshift.io/tenant: "test-td-2be"
          type: Opaque
          stringData:
            username: "osac-test-td-2be-b"
            password: "{{ mock_tenant_manager_password }}"
            endpoint: "127.0.0.1:18443"
            tenant: "test-td-2be"

    - name: Create hub Secret for a different tenant (should not be touched)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "vast-tenant-config-different-tenant-be-x"
            namespace: "osac-system"
            labels:
              app.kubernetes.io/managed-by: osac-aap
              osac.openshift.io/tenant: "different-tenant"
              osac.openshift.io/storage-provider: vast
              osac.openshift.io/storage-backend-id: be-x
          type: Opaque
          stringData:
            vast_tenant_id: "2"
            vast_local_provider_id: "2"
            vip_pool_name: "osac-other-pool"
            vast_endpoint: "127.0.0.1:18443"
            storage_provider_type: "vast"

    - name: Delete backend A's hub Secret (simulating partial state)
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Secret
        name: "vast-tenant-config-test-td-2be-be-a"
        namespace: "osac-system"

    - name: Verify backend A's hub Secret is gone
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "vast-tenant-config-test-td-2be-be-a"
        namespace: "osac-system"
      register: _verify_a_gone

    - name: Assert backend A's hub Secret was deleted
      ansible.builtin.assert:
        that:
          - _verify_a_gone.resources | length == 0
        fail_msg: "Backend A's hub Secret should be deleted before teardown"

    - name: Verify backend B's hub Secret still exists
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "vast-tenant-config-test-td-2be-be-b"
        namespace: "osac-system"
      register: _verify_b_present

    - name: Assert backend B's hub Secret exists before teardown
      ansible.builtin.assert:
        that:
          - _verify_b_present.resources | length == 1
        fail_msg: "Backend B's hub Secret should exist before teardown"

- name: "Storage Provider Teardown - Run teardown for both backends"
  hosts: localhost
  gather_facts: false

  environment:
    OSAC_STORAGE_CONFIG_NAMESPACE: "osac-system"

  vars:
    vast_storage_config_namespace: osac-system
    tenant_name: "test-td-2be"
    tenant_namespace: "osac-system"
    storage_provider_tiers:
      - name: default
        protocol: nfs
        provider: vast
        backend_id: be-a
      - name: default-b
        protocol: nfs
        provider: vast
        backend_id: be-b
    storage_provider_backend_connections:
      be-a:
        endpoint: "127.0.0.1:18443"
        username: "admin"
        password: "mock-admin-password"
      be-b:
        endpoint: "127.0.0.1:18443"
        username: "admin"
        password: "mock-admin-password"
    storage_provider_provisioning_target: vmaas
    vast_storage_validate_certs: false

  tasks:
    - name: Call storage_provider with teardown_cluster_storage for both backends
      ansible.builtin.include_role:
        name: osac.service.storage_provider
      vars:
        storage_provider_action: teardown_cluster_storage

    - name: Call storage_provider with teardown_backend for both backends
      ansible.builtin.include_role:
        name: osac.service.storage_provider
      vars:
        storage_provider_action: teardown_backend

- name: "Storage Provider Teardown - Verify two-backend partial state"
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Check backend A's CSI Secret deleted (despite missing hub Secret)
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "vast-csi-test-td-2be-be-a"
        namespace: "osac-system"
      register: _td_2be_csi_a

    - name: Assert backend A's CSI Secret deleted
      ansible.builtin.assert:
        that:
          - _td_2be_csi_a.resources | length == 0
        fail_msg: "Backend A's CSI Secret should be deleted even when hub Secret was missing"
        success_msg: "Backend A's CSI Secret correctly deleted despite missing hub Secret"

    - name: Check backend B's hub Secret deleted
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "vast-tenant-config-test-td-2be-be-b"
        namespace: "osac-system"
      register: _td_2be_hub_b

    - name: Assert backend B's hub Secret deleted
      ansible.builtin.assert:
        that:
          - _td_2be_hub_b.resources | length == 0
        fail_msg: "Backend B's hub Secret should be deleted by teardown"
        success_msg: "Backend B's hub Secret correctly deleted"

    - name: Check backend B's CSI Secret deleted
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "vast-csi-test-td-2be-be-b"
        namespace: "osac-system"
      register: _td_2be_csi_b

    - name: Assert backend B's CSI Secret deleted
      ansible.builtin.assert:
        that:
          - _td_2be_csi_b.resources | length == 0
        fail_msg: "Backend B's CSI Secret should be deleted by teardown"
        success_msg: "Backend B's CSI Secret correctly deleted"

    - name: Check different-tenant Secret was NOT touched
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "vast-tenant-config-different-tenant-be-x"
        namespace: "osac-system"
      register: _td_2be_other_tenant

    - name: Assert different-tenant Secret untouched
      ansible.builtin.assert:
        that:
          - _td_2be_other_tenant.resources | length == 1
        fail_msg: "Teardown should not delete Secrets from different tenants"
        success_msg: "Different-tenant Secret correctly preserved"

# ── Cleanup: Best-effort removal of any remaining resources ──
- name: "Storage Provider Teardown - Final cleanup"
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Delete hub Secret (safety net)
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Secret
        name: "vast-tenant-config-test-teardown-be-test"
        namespace: "osac-system"
      failed_when: false

    - name: Delete any remaining tenant StorageClasses (safety net)
      kubernetes.core.k8s_info:
        api_version: storage.k8s.io/v1
        kind: StorageClass
        label_selectors:
          - "osac.openshift.io/tenant=test-teardown"
      register: _cleanup_scs

    - name: Remove remaining StorageClasses
      kubernetes.core.k8s:
        state: absent
        api_version: storage.k8s.io/v1
        kind: StorageClass
        name: "{{ item.metadata.name }}"
      loop: "{{ _cleanup_scs.resources | default([]) }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      failed_when: false

    - name: Delete CSI Secret (safety net)
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Secret
        name: "vast-csi-test-teardown-be-test"
        namespace: "osac-system"
      failed_when: false

    - name: Delete two-backend test Secrets (safety net)
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Secret
        name: "{{ item }}"
        namespace: "osac-system"
      loop:
        - "vast-tenant-config-test-td-2be-be-a"
        - "vast-tenant-config-test-td-2be-be-b"
        - "vast-csi-test-td-2be-be-a"
        - "vast-csi-test-td-2be-be-b"
        - "vast-tenant-config-different-tenant-be-x"
      failed_when: false

# ══════════════════════════════════════════════════════════════════════════════
# Test: Different endpoints teardown (verify independent cleanup per array)
# ══════════════════════════════════════════════════════════════════════════════

- name: "Storage Provider Different-Endpoint Teardown - Setup"
  hosts: localhost
  gather_facts: false

  environment:
    VAST_VIP_POOL_SUPERNET: "10.0.0.0/24"
    OSAC_STORAGE_CONFIG_NAMESPACE: "osac-system"

  vars:
    _mock_vast_password: "{{ lookup('env', 'MOCK_VAST_PASSWORD') | default('mock-admin-password', true) }}"
    vast_storage_config_namespace: osac-system
    tenant_name: "test-td-diffep"
    tenant_namespace: "osac-system"
    tenant_uid: "test-uid-diffep"
    _cluster_name: "test-cluster"

  tasks:
    - name: Reset both mock VMS servers
      ansible.builtin.uri:
        url: "https://{{ item }}/_reset"
        validate_certs: false
        method: POST
      loop:
        - "127.0.0.1:18443"
        - "127.0.0.1:18445"
      failed_when: false

    - name: Setup backend A on endpoint1 (port 18443)
      ansible.builtin.include_role:
        name: osac.service.storage_provider
      vars:
        storage_provider_action: setup
        storage_provider_tiers:
          - name: tier-a
            protocol: nfs
            provider: vast
            backend_id: be-a
        storage_provider_backend_connections:
          be-a:
            endpoint: "127.0.0.1:18443"
            username: "admin"
            password: "{{ _mock_vast_password }}"
        vast_storage_validate_certs: false

    - name: Setup backend B on endpoint2 (port 18445)
      ansible.builtin.include_role:
        name: osac.service.storage_provider
      vars:
        storage_provider_action: setup
        storage_provider_tiers:
          - name: tier-b
            protocol: nfs
            provider: vast
            backend_id: be-b
        storage_provider_backend_connections:
          be-b:
            endpoint: "127.0.0.1:18445"
            username: "admin"
            password: "{{ _mock_vast_password }}"
        vast_storage_validate_certs: false

- name: "Storage Provider Different-Endpoint Teardown - Teardown backend A"
  hosts: localhost
  gather_facts: false

  environment:
    OSAC_STORAGE_CONFIG_NAMESPACE: "osac-system"

  vars:
    _mock_vast_password: "{{ lookup('env', 'MOCK_VAST_PASSWORD') | default('mock-admin-password', true) }}"
    vast_storage_config_namespace: osac-system
    tenant_name: "test-td-diffep"
    tenant_namespace: "osac-system"
    tenant_uid: "test-uid-diffep"

  tasks:
    - name: Record endpoint1 call log before teardown
      ansible.builtin.uri:
        url: "https://127.0.0.1:18443/_calls"
        validate_certs: false
        method: GET
        return_content: true
      register: _diffep_pre_ep1

    - name: Save endpoint1 call count
      ansible.builtin.set_fact:
        _diffep_mark_ep1: "{{ _diffep_pre_ep1.json | length }}"

    - name: Record endpoint2 call log before teardown
      ansible.builtin.uri:
        url: "https://127.0.0.1:18445/_calls"
        validate_certs: false
        method: GET
        return_content: true
      register: _diffep_pre_ep2

    - name: Save endpoint2 call count
      ansible.builtin.set_fact:
        _diffep_mark_ep2: "{{ _diffep_pre_ep2.json | length }}"

    - name: Teardown backend A (endpoint1)
      ansible.builtin.include_role:
        name: osac.service.storage_provider
      vars:
        storage_provider_action: teardown_backend
        storage_provider_tiers:
          - name: tier-a
            protocol: nfs
            provider: vast
            backend_id: be-a
        storage_provider_backend_connections:
          be-a:
            endpoint: "127.0.0.1:18443"
            username: "admin"
            password: "{{ _mock_vast_password }}"
        vast_storage_validate_certs: false

- name: "Storage Provider Different-Endpoint Teardown - Verify isolation"
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Get endpoint1 calls during teardown
      ansible.builtin.uri:
        url: "https://127.0.0.1:18443/_calls"
        validate_certs: false
        method: GET
        return_content: true
      register: _diffep_post_ep1

    - name: Get endpoint2 calls during teardown
      ansible.builtin.uri:
        url: "https://127.0.0.1:18445/_calls"
        validate_certs: false
        method: GET
        return_content: true
      register: _diffep_post_ep2

    - name: Verify endpoint1 tenant was deleted
      vars:
        _ep1_window: "{{ _diffep_post_ep1.json[_diffep_mark_ep1 | int:] }}"
        _tenant_deletes: >-
          {{
            _ep1_window
            | selectattr('method', 'equalto', 'DELETE')
            | selectattr('path', 'search', 'tenants/')
            | list
          }}
      ansible.builtin.assert:
        that:
          - _tenant_deletes | length > 0
        fail_msg: "Endpoint1 tenant should have been deleted (backend A was last on this array)"
        success_msg: "Endpoint1 tenant correctly deleted"

    - name: Verify endpoint2 was NOT touched
      vars:
        _ep2_window: "{{ _diffep_post_ep2.json[_diffep_mark_ep2 | int:] }}"
      ansible.builtin.assert:
        that:
          - _ep2_window | length == 0
        fail_msg: >-
          Teardown of backend A (endpoint1) incorrectly made {{ _ep2_window | length }}
          API calls to endpoint2. Different endpoints should be independent!
        success_msg: "Endpoint2 correctly untouched by backend A teardown"

    - name: Verify backend A hub Secret was deleted
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "vast-tenant-config-test-td-diffep-be-a"
        namespace: "osac-system"
      register: _diffep_hub_a

    - name: Assert backend A hub Secret deleted
      ansible.builtin.assert:
        that:
          - _diffep_hub_a.resources | length == 0
        fail_msg: "Backend A hub Secret should be deleted"
        success_msg: "Backend A hub Secret correctly deleted"

    - name: Verify backend B hub Secret still exists
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "vast-tenant-config-test-td-diffep-be-b"
        namespace: "osac-system"
      register: _diffep_hub_b

    - name: Assert backend B hub Secret survived
      ansible.builtin.assert:
        that:
          - _diffep_hub_b.resources | length == 1
        fail_msg: "Backend B hub Secret should still exist (on different endpoint)"
        success_msg: "Backend B hub Secret correctly preserved"

- name: "Storage Provider Different-Endpoint Teardown - Cleanup"
  hosts: localhost
  gather_facts: false

  vars:
    _mock_vast_password: "{{ lookup('env', 'MOCK_VAST_PASSWORD') | default('mock-admin-password', true) }}"

  tasks:
    - name: Teardown backend B
      block:
        - name: Run teardown for backend B
          ansible.builtin.include_role:
            name: osac.service.storage_provider
          vars:
            storage_provider_action: teardown_backend
            tenant_name: "test-td-diffep"
            tenant_namespace: "osac-system"
            tenant_uid: "test-uid-diffep"
            storage_provider_tiers:
              - name: tier-b
                protocol: nfs
                provider: vast
                backend_id: be-b
            storage_provider_backend_connections:
              be-b:
                endpoint: "127.0.0.1:18445"
                username: "admin"
                password: "{{ _mock_vast_password }}"
            vast_storage_validate_certs: false
            vast_storage_config_namespace: osac-system
      rescue:
        - name: Teardown failed but continuing cleanup
          ansible.builtin.debug:
            msg: "Teardown failed but continuing with Secret cleanup"

    - name: Delete any remaining Secrets
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Secret
        name: "{{ item }}"
        namespace: "osac-system"
      loop:
        - "vast-tenant-config-test-td-diffep-be-a"
        - "vast-tenant-config-test-td-diffep-be-b"
      failed_when: false

# ── Tenant-credentials-only teardown cases ──
# A connection entry with an endpoint and no username or password selects the
# mode. The storage_provider dispatcher includes teardown_backend with
# ignore_errors, so these cases call the vast_storage role directly to observe
# failures. Each case is its own play with its tenant and backend as play vars,
# so a run started with --start-at-task at its clean slate has what it needs.

# Case A: nothing to clean up, so the role skips without error and no VAST calls.
- name: "Storage Provider TCO Teardown - Case A, nothing to clean"
  hosts: localhost
  gather_facts: false

  environment:
    OSAC_STORAGE_CONFIG_NAMESPACE: "osac-system"

  vars:
    tenant_name: "test-td-tco-a"
    tenant_namespace: "osac-system"
    _tco_backend: "be-td-tco-a"
    _tco_secret_name: "vast-tenant-config-test-td-tco-a-be-td-tco-a"

  tasks:
    - name: Clean slate for teardown case A
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Secret
        name: "{{ _tco_secret_name }}"
        namespace: "osac-system"

    - name: Reset mock VMS server for teardown case A
      ansible.builtin.uri:
        url: "https://127.0.0.1:18443/_reset"
        validate_certs: false
        method: POST

    - name: Run vast_storage teardown_backend without admin credentials
      ansible.builtin.include_role:
        name: osac.templates.vast_storage
        tasks_from: teardown_backend
      vars:
        vast_storage_config_namespace: osac-system
        vast_storage_validate_certs: false
        _provider_tiers:
          - name: default
            protocol: nfs
            provider: vast
            backend_id: "{{ _tco_backend }}"
        _provider_backend_connections:
          be-td-tco-a:
            endpoint: "127.0.0.1:18443"

    - name: Get mock server call log after case A
      ansible.builtin.uri:
        url: "https://127.0.0.1:18443/_calls"
        validate_certs: false
        method: GET
        return_content: true
      register: _tco_a_calls

    - name: Assert case A made no VAST calls
      ansible.builtin.assert:
        that:
          - _tco_a_calls.json | length == 0
        fail_msg: "Teardown without admin credentials and without a hub Secret made {{ _tco_a_calls.json | length }} VAST calls"
        success_msg: "Case A: nothing to clean, no VAST calls"

# Case B: admin-flow leftovers exist, so the role must refuse rather than skip.
- name: "Storage Provider TCO Teardown - Case B, admin-flow leftovers"
  hosts: localhost
  gather_facts: false

  environment:
    OSAC_STORAGE_CONFIG_NAMESPACE: "osac-system"

  vars:
    tenant_name: "test-td-tco-b"
    tenant_namespace: "osac-system"
    _tco_backend: "be-td-tco-b"
    _tco_secret_name: "vast-tenant-config-test-td-tco-b-be-td-tco-b"

  tasks:
    - name: Clean slate for teardown case B
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ _tco_secret_name }}"
            namespace: "osac-system"
            labels:
              app.kubernetes.io/managed-by: osac-aap
              osac.openshift.io/storage-provider: vast
              osac.openshift.io/tenant: "test-td-tco-b"
              osac.openshift.io/storage-backend-id: "be-td-tco-b"
          type: Opaque
          stringData:
            vast_tenant_id: "1"
      no_log: true

    - name: Reset mock VMS server for teardown case B
      ansible.builtin.uri:
        url: "https://127.0.0.1:18443/_reset"
        validate_certs: false
        method: POST

    - name: Run teardown_backend with leftovers and no admin credentials
      block:
        - name: Run vast_storage teardown_backend without admin credentials
          ansible.builtin.include_role:
            name: osac.templates.vast_storage
            tasks_from: teardown_backend
          vars:
            vast_storage_config_namespace: osac-system
            vast_storage_validate_certs: false
            _provider_tiers:
              - name: default
                protocol: nfs
                provider: vast
                backend_id: "{{ _tco_backend }}"
            _provider_backend_connections:
              be-td-tco-b:
                endpoint: "127.0.0.1:18443"

        - name: Fail test if teardown succeeded despite leftovers
          ansible.builtin.fail:
            msg: "Teardown must fail when a hub Secret exists and no admin credentials were supplied"

      rescue:
        - name: Get mock server call log after case B
          ansible.builtin.uri:
            url: "https://127.0.0.1:18443/_calls"
            validate_certs: false
            method: GET
            return_content: true
          register: _tco_b_calls

        - name: Read hub Secret after case B
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Secret
            name: "{{ _tco_secret_name }}"
            namespace: "osac-system"
          register: _tco_b_secret

        - name: Assert case B refused, issued no DELETE and kept the hub Secret
          ansible.builtin.assert:
            that:
              - "'no admin credentials' in (ansible_failed_result.msg | default(''))"
              - "_tco_secret_name in (ansible_failed_result.msg | default(''))"
              - _tco_b_calls.json | selectattr('method', 'equalto', 'DELETE') | list | length == 0
              - _tco_b_secret.resources | length == 1
            fail_msg: >-
              Case B must refuse naming the hub Secret, issue no DELETE and keep the Secret.
              Message: {{ ansible_failed_result.msg | default('unknown error') }}
            success_msg: "Case B: refused to skip past admin-flow leftovers"

# Case C: the hub Secret cannot be read, so the role must refuse, not assume absent.
- name: "Storage Provider TCO Teardown - Case C, unreadable hub secret"
  hosts: localhost
  gather_facts: false

  environment:
    OSAC_STORAGE_CONFIG_NAMESPACE: "osac-system"

  vars:
    tenant_name: "test-td-tco-c"
    tenant_namespace: "osac-system"
    _tco_backend: "be-td-tco-c"
    _tco_secret_name: "vast-tenant-config-test-td-tco-c-be-td-tco-c"

  tasks:
    - name: Clean slate for teardown case C
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Secret
        name: "{{ _tco_secret_name }}"
        namespace: "osac-system"

    - name: Reset mock VMS server for teardown case C
      ansible.builtin.uri:
        url: "https://127.0.0.1:18443/_reset"
        validate_certs: false
        method: POST

    - name: Run teardown_backend with an unreachable hub API
      module_defaults:
        kubernetes.core.k8s_info:
          host: "https://127.0.0.1:9"
          validate_certs: false
      block:
        - name: Run vast_storage teardown_backend without admin credentials
          ansible.builtin.include_role:
            name: osac.templates.vast_storage
            tasks_from: teardown_backend
          vars:
            vast_storage_config_namespace: osac-system
            vast_storage_validate_certs: false
            _provider_tiers:
              - name: default
                protocol: nfs
                provider: vast
                backend_id: "{{ _tco_backend }}"
            _provider_backend_connections:
              be-td-tco-c:
                endpoint: "127.0.0.1:18443"

        - name: Fail test if teardown succeeded without reading the hub Secret
          ansible.builtin.fail:
            msg: "Teardown must fail when the hub Secret cannot be read"

      rescue:
        - name: Get mock server call log after case C
          ansible.builtin.uri:
            url: "https://127.0.0.1:18443/_calls"
            validate_certs: false
            method: GET
            return_content: true
          register: _tco_c_calls

        - name: Assert case C refused as unreadable and made no VAST calls
          ansible.builtin.assert:
            that:
              - "'could not read hub secret' in (ansible_failed_result.msg | default('') | lower)"
              - _tco_c_calls.json | length == 0
            fail_msg: >-
              Case C must refuse as an unreadable hub Secret and make no VAST calls.
              Message: {{ ansible_failed_result.msg | default('unknown error') }}
            success_msg: "Case C: refused to treat an unreadable hub Secret as absent"

- name: "Storage Provider TCO Teardown - Cleanup"
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Delete case B hub Secret
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Secret
        name: "vast-tenant-config-test-td-tco-b-be-td-tco-b"
        namespace: "osac-system"
      failed_when: false
