{{/*
Bridge the selectorless fulfillment-api / fulfillment-internal-api Services to the
gateway. Each Service port (8000 / 8001) maps to the gateway's 443 by EndpointSlice
port name. The gateway address is not known at render time, so this is rendered only
when ingress.gatewayapi.gatewayAddress is set; otherwise the lifecycle controller/hook
maintains the EndpointSlices against the current gateway Service ClusterIP.
*/}}
{{- if and (eq .Values.ingress.driver "gatewayapi") .Values.ingress.gatewayapi.gatewayAddress }}
{{- range $b := list (dict "svc" "fulfillment-api" "portName" "external-api") (dict "svc" "fulfillment-internal-api" "portName" "internal-api") }}
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  namespace: {{ $.Release.Namespace }}
  name: {{ $b.svc }}-gateway
  labels:
    kubernetes.io/service-name: {{ $b.svc }}
addressType: IPv4
endpoints:
- addresses:
  - {{ $.Values.ingress.gatewayapi.gatewayAddress | quote }}
ports:
- name: {{ $b.portName }}
  port: 443
  protocol: TCP
{{- end }}
{{- end }}
