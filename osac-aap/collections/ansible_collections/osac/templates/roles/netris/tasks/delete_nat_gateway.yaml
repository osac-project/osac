---
# Delete the SNAT rule osac-natgw-<NATGateway id>. A rule that is already gone
# is a success. When the VirtualNetwork is in the input, the rule must be in its
# VPC; a rule of another VPC is a final error and is not deleted. The same holds
# for a rule whose sourceAddress or snatToIP differs from the input.
- name: Delete the NATGateway from Netris
  block:
    - name: Check the settings
      ansible.builtin.include_tasks: _settings.yaml
      vars:
        netris_require: [controller, credentials, site, tenant]

    - name: Check the task input
      ansible.builtin.include_tasks: _input.yaml

    - name: Build the object names
      ansible.builtin.include_tasks: _names.yaml

    - name: Find the VPC of the VirtualNetwork
      ansible.builtin.include_tasks: _nat_vpc.yaml
      vars:
        netris_nat_domain: "{{ 'tenant_virtual_network' if netris_names.vpc | length > 0 else '' }}"
        netris_nat_vpc_required: false

    - name: Delete the SNAT rule
      ansible.builtin.include_role:
        name: netris.controller.nat
        tasks_from: delete
      vars:
        nat_name: "{{ netris_names.natgw_snat }}"
        nat_site_id: "{{ netris_site_id | int }}"
        nat_expected_fields: >-
          {{ {'action': 'SNAT', 'site.id': netris_site_id | int}
             | combine({'vpc.id': netris_nat_vpc.id} if netris_nat_vpc.id | string | length > 0 else {})
             | combine({'sourceAddress': osac_job_vars.virtual_network.spec.ipv4Cidr}
                       if ((osac_job_vars.virtual_network | default({}, true)).spec | default({}, true)).ipv4Cidr | default('', true) | length > 0 else {})
             | combine({'snatToIP': osac_job_vars.external_ip.address ~ '/32'}
                       if (osac_job_vars.external_ip | default({}, true)).address | default('', true) | length > 0 else {}) }}
  rescue:
    - name: Report the error
      ansible.builtin.include_tasks: _rescue.yaml
