---
- name: Protected Netris launch boundary
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Reject a launch without an installation-owned controller URL
      netris.controller.protected_uri:
        url: https://attacker.example/api/auth
        method: GET
        validate_certs: false
      register: _protected_launch_result
      ignore_errors: true

    - name: Assert the request was denied before transport
      ansible.builtin.assert:
        that:
          - _protected_launch_result.failed | bool
          - >-
            _protected_launch_result.msg is search('Netris controller URL is not installation-managed')
