---
# CI-specific cluster infrastructure creation.
# Assisted Service creates Agents in the InfraEnv's namespace and labels them
# with the InfraEnv name. The tenant Agent namespace is shared, so wait for and
# approve only Agents created by this ClusterOrder's InfraEnv; no hot-pool
# selection or ClusterOrder labeling is needed. Networking CRs
# (VirtualNetwork, Subnet, SecurityGroup, ExternalIP) are handled separately
# by the Networking API dispatcher (NetworkClass → operator → AAP → k8s_only).

- name: Wait for control plane namespace
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: "{{ cluster_infra_namespace }}-{{ cluster_infra_name }}"
  register: cp_ns
  until: cp_ns.resources | length > 0
  retries: 30
  delay: 10

- name: Wait for this order's agents in the Agent namespace
  kubernetes.core.k8s_info:
    api_version: agent-install.openshift.io/v1beta1
    kind: Agent
    namespace: "{{ default_agent_namespace }}"
    label_selectors:
      - "infraenvs.agent-install.openshift.io={{ cluster_infra_name }}-infraenv"
  register: ci_agents
  until: >-
    (ci_agents.resources | default([])) | length >=
    (cluster_infra_node_requests
     | map(attribute='numberOfNodes') | map('int') | sum)
  retries: 270
  delay: 10

- name: Select unapproved agents
  ansible.builtin.set_fact:
    ci_unapproved_agents: >-
      {{ (ci_agents.resources | default([])) | selectattr('spec.approved', 'false') | list }}

- name: Approve unapproved agents for this order
  kubernetes.core.k8s_json_patch:
    api_version: agent-install.openshift.io/v1beta1
    kind: Agent
    name: "{{ item.metadata.name }}"
    namespace: "{{ item.metadata.namespace }}"
    patch:
      - op: add
        path: /spec/approved
        value: true
  loop: "{{ ci_unapproved_agents }}"
  loop_control:
    label: "Approve agent {{ item.metadata.name }}"

- name: Set cluster_infra_network_name
  ansible.builtin.set_fact:
    cluster_infra_network_name: "network-{{ cluster_infra_name }}"
