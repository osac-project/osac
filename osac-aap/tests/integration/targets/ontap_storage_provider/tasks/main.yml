    - name: Attempt ensure_storage_class against visible Failed customer TBC
      block:
        - name: Call storage_provider ensure_storage_class with Failed customer TBC
          ansible.builtin.include_role:
            name: osac.service.storage_provider
          vars:
            storage_provider_action: ensure_storage_class
      rescue:
        - name: Record Failed customer TBC error
          ansible.builtin.set_fact:
            _shared_failed_tbc_error: "{{ ansible_failed_result.msg | default('') }}"
          no_log: true

    - name: Assert ensure_storage_class failed fast on visible Failed customer TBC
      ansible.builtin.assert:
        that:
          - _shared_failed_tbc_error | default('') | length > 0
          - "'Failed' in _shared_failed_tbc_error"
        fail_msg: "Shared-TBC ensure_storage_class must fail fast when customer TBC is Failed"
        success_msg: "Shared-TBC ensure_storage_class failed fast on Failed customer TBC"
      no_log: true

# ── Test 12: Shared-TBC teardown_cluster_storage preserves customer TBC ──
- name: "ONTAP Storage Provider - Shared-TBC teardown preserves customer TBC"
  hosts: localhost
  gather_facts: false

  vars:
    tenant_name: "test-ontap-shared-nf"
    tenant_namespace: "osac-system"
    _t_assignment_key: "{{ (('ontap-shared-nf' ~ '|' ~ tenant_name) | hash('sha256'))[:16] | lower }}"
    _sc_extreme: "ontap-{{ _t_assignment_key }}-{{ ('extreme' | hash('sha256'))[:16] | lower }}"
    storage_provider_tiers:
      - name: extreme
        protocol: block
        provider: ontap
        backend_id: ontap-shared-nf
        provider_config:
          profile: shared-unreadable
          pool_selector:
            performance: extreme
    storage_provider_backend_connections:
      ontap-shared-nf:
        provider_config:
          profiles:
            - name: shared-unreadable
              shared:
                tbc_namespace: trident
                tbc_name: customer-fc

  tasks:
    - name: Run teardown_cluster_storage for Shared-TBC tenant
      ansible.builtin.include_role:
        name: osac.service.storage_provider
      vars:
        storage_provider_action: teardown_cluster_storage

    - name: Verify tenant Shared-TBC StorageClass was deleted
      kubernetes.core.k8s_info:
        api_version: storage.k8s.io/v1
        kind: StorageClass
        name: "{{ _sc_extreme }}"
      register: _shared_sc_after_teardown
      no_log: true

    - name: Verify customer-owned trident/customer-fc TBC remains intact
      kubernetes.core.k8s_info:
        api_version: trident.netapp.io/v1
        kind: TridentBackendConfig
        name: customer-fc
        namespace: trident
      register: _customer_tbc_after_teardown
      no_log: true

    - name: Assert tenant StorageClass was removed and customer TBC was retained
      ansible.builtin.assert:
        that:
          - _shared_sc_after_teardown.resources | length == 0
          - _customer_tbc_after_teardown.resources | length == 1
        fail_msg: "teardown_cluster_storage either left tenant StorageClass or deleted customer TBC"
        success_msg: "teardown_cluster_storage removed tenant StorageClass and preserved customer TBC"
      no_log: true

# ── Cleanup ──
- name: "ONTAP Storage Provider - Cleanup"
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Delete test Tenant CR, preparation Secret, and Shared-TBC test resources
      kubernetes.core.k8s:
        state: absent
        definition: "{{ item }}"
      loop:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: ontap-prep-test-ontap-prep-ontap-be-1
            namespace: osac-storage
        - apiVersion: osac.openshift.io/v1alpha1
          kind: Tenant
          metadata:
            name: test-ontap-prep
            namespace: osac-system
        - apiVersion: trident.netapp.io/v1
          kind: TridentBackendConfig
          metadata:
            name: customer-fc
            namespace: trident
      loop_control:
        label: "cleanup-prep-resource"
      failed_when: false
      no_log: true

    - name: Delete the stub Trident operator
      kubernetes.core.k8s:
        state: absent
        definition: "{{ item }}"
        wait: true
      loop:
        - apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: stub-trident-operator
            namespace: trident
      failed_when: false
