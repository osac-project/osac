---
argument_specs:
  main:
    short_description: Deploy MaaS on RHOAI 3.5 GA (0..n tenants, no Keycloak)
    description: >
      Provisions an OpenShift 4.21 cluster with Red Hat OpenShift AI 3.5,
      Models-as-a-Service (GA), and observability. Supports 0..n tenants with
      per-tenant gateways, models, and subscription tiers. Identity is via an
      external OIDC issuer (optional, written to AITenant.spec.oidc) plus K8s
      ServiceAccount/TokenReview — no Keycloak is deployed. Service Mesh is
      Sail-embedded on OCP 4.21.22 (no OSSM subscription); RHCL 1.4.x installs
      Authorino/Limitador/DNS as dependencies (no version pinning).
      SECURITY: db_password default is DEV ONLY — override before production.
    options:
      # --- Feature flags ---
      ocp_4_20_ai_maas_enable_maas:
        type: bool
        required: false
        default: true
        description: Enable MaaS deployment (operators + configuration).
      ocp_4_20_ai_maas_enable_observability:
        type: bool
        required: false
        default: true
        description: Install COO (stable channel) + OTel and configure DSCI metrics.
      ocp_4_20_ai_maas_enable_dashboard:
        type: bool
        required: false
        default: true
        description: Deploy the RHOAI web console. False for headless clusters.
      ocp_4_20_ai_maas_run_verify:
        type: bool
        required: false
        default: true
        description: Gate for the inline verify hook / verify playbook.

      # --- Identity (no Keycloak) ---
      ocp_4_20_ai_maas_oidc_issuer:
        type: str
        required: false
        default: ""
        description: >
          External OIDC issuer URL. Optional — when set it is written to
          AITenant.spec.oidc. When empty, tenants use K8s SA tokens only.
      ocp_4_20_ai_maas_oidc_client_id:
        type: str
        required: false
        default: ""
        description: OIDC client ID. Required together with oidc_issuer (both or neither).

      # --- Tenancy (0..n) ---
      ocp_4_20_ai_maas_tenants:
        type: list
        elements: dict
        required: false
        default: []
        description: >
          Tenants to onboard. Each entry: {name, admin_group (optional), tiers}.
          When non-empty this wins over tenant_name/tenant_admin_group.
          Formats/ranges (name, tier fields) are enforced in tasks/validate_inputs.yaml.
        options:
          name:
            type: str
            required: true
            description: Tenant name (AITenant metadata.name; DNS-1123 label, <=41).
          admin_group:
            type: str
            required: false
            description: OpenShift/IdP group for tenant-admin RBAC.
          tiers:
            type: list
            elements: dict
            required: false
            description: Per-tenant subscription tiers (defaults to ocp_4_20_ai_maas_tiers).
            options:
              name:
                type: str
                required: true
              group:
                type: str
                required: false
              token_limit:
                type: int
                required: true
              window:
                type: str
                required: true
              priority:
                type: int
                required: true
      ocp_4_20_ai_maas_tenant_name:
        type: str
        required: false
        default: ""
        description: >
          Single-tenant convenience. Creates one custom tenant with this name.
          Empty = no custom tenant (configures the operator-created default tenant).
      ocp_4_20_ai_maas_tenant_admin_group:
        type: str
        required: false
        default: ""
        description: >
          OpenShift/IdP group for tenant-admin RBAC. The role binds this group to the
          operator-created tenant-admin Role (self-service maassubscriptions/
          maasauthpolicies/maastenantconfigs) and object-admin Role (read the
          AITenant), to ClusterRole admin on the tenant governance namespace, and to a
          model-admin Role (deploy LLMInferenceServices in the governance namespace).
          Also written to AITenant.spec.rbac.admins (deprecated/no-op on RHOAI 3.5 GA).
          Empty = no admin bindings created.

      # --- Verification ---
      ocp_4_20_ai_maas_verify_depth:
        type: str
        required: false
        default: "standard"
        choices: ["smoke", "standard", "full"]
        description: >
          smoke = L1+L2 for all in-scope tenants; standard = + L3 (429) on the
          representative + L4 isolation; full = L3 for every tenant + L4.
      ocp_4_20_ai_maas_verify_tenants:
        type: list
        elements: str
        required: false
        default: []
        description: Subset of tenant names to verify. Empty = all in-scope.
      ocp_4_20_ai_maas_verify_representative:
        type: str
        required: false
        default: ""
        description: Tenant that gets the deep (L3) pass. Empty = first in-scope.
      ocp_4_20_ai_maas_verify_skip_isolation:
        type: bool
        required: false
        default: false
        description: Skip Layer 4 cross-tenant isolation even with >= 2 tenants.
      ocp_4_20_ai_maas_provision_test_identities:
        type: bool
        required: false
        default: true
        description: >
          Create per-tier test ServiceAccounts and wire them into
          MaaSAuthPolicy.subjects.users for the verify playbook's SA-token path.

      # --- External models / hardware profiles ---
      ocp_4_20_ai_maas_hardware_profiles:
        type: list
        elements: dict
        required: false
        default: []
        description: >
          List of HardwareProfile CRs (infrastructure.opendatahub.io/v1) to create.
          Empty = none. Count ordering (min<=default<=max) is enforced in
          tasks/validate_inputs.yaml. Count fields are `raw` (int or quantity string).
        options:
          name:
            type: str
            required: true
          cpu_default: {type: raw, required: true}
          cpu_min: {type: raw, required: true}
          cpu_max: {type: raw, required: true}
          memory_default: {type: raw, required: true}
          memory_min: {type: raw, required: true}
          memory_max: {type: raw, required: true}
          display_name: {type: str, required: false}
          description: {type: str, required: false}
          enabled: {type: bool, required: false}
          accelerator_id: {type: str, required: false}
          accelerator_name: {type: str, required: false}
          gpu_count: {type: int, required: false}
          gpu_max: {type: int, required: false}
          node_selectors: {type: dict, required: false}
          tolerations: {type: list, elements: dict, required: false}
      ocp_4_20_ai_maas_external_models:
        type: list
        elements: dict
        required: false
        default: []
        description: >-
          External models, created as inference.opendatahub.io ExternalProvider +
          ExternalModel CRs with the `path` field (RHOAI 3.5 GA — no maas-proxy).
          Requires enable_maas=true. `secured: true` selects the spoke-prefixed path
          (/<upstream_model_ns>/<upstream_model_name>/v1/chat/completions); otherwise
          the path is /v1/chat/completions. `endpoint` always points at the real
          upstream. NOTE: external models are DEFAULT-TENANT / DEFAULT-GATEWAY only in
          GA 3.5 — the external-model reconciler runs only on the default IPP, so the
          route is always on maas-default-gateway and per-tenant binding is not possible
          (RHOAIENG-79526, planned). Governance is created in models-as-a-service with
          system:authenticated; consume with an SA token at the default gateway. The
          per-model token_limit/window still enforce rate limiting (429).
          Formats (endpoint FQDN, window, ranges, secured-conditional fields) are
          enforced in tasks/validate_inputs.yaml.
        options:
          name:
            type: str
            required: true
          upstream_endpoint:
            type: str
            required: true
            description: ExternalProvider.spec.endpoint — dotted FQDN, no scheme/port/path.
          upstream_credential:
            type: str
            required: true
          model_id:
            type: str
            required: true
            description: >-
              ExternalModel targetModel — the provider-side model identifier, i.e. the
              name the upstream actually serves.
          client_model_id:
            type: str
            required: false
            description: >-
              ExternalModel.spec.modelName — the client-facing model name sent in the
              request body and advertised by GET /maas-api/v1/models. Defaults to
              model_id (backward compat with RHOAI 3.5.0). On RHOAI 3.5.1+ (current
              GA), the IPP matches the HTTPRoute on the ExternalModel CR name, so this
              MUST be set to this entry's `name` — otherwise inference returns 404.
          token_limit:
            type: int
            required: true
          window:
            type: str
            required: true
          priority:
            type: int
            required: true
          secured:
            type: bool
            required: false
          upstream_model_ns:
            type: str
            required: false
          upstream_model_name:
            type: str
            required: false
      ocp_4_20_ai_maas_external_model_namespace:
        type: str
        required: false
        default: "external-models"
        description: Namespace for ExternalModel CRs and credential Secrets.

      # --- Platform operators ---
      ocp_4_20_ai_maas_cert_manager_channel:
        type: str
        required: false
        default: "stable-v1.18"
        description: OLM channel for cert-manager (RHCL 1.4.x prerequisite).
      ocp_4_20_ai_maas_cert_manager_source:
        type: str
        required: false
        default: "redhat-operators"
        description: OLM catalog source for cert-manager.
      ocp_4_20_ai_maas_rhcl_channel:
        type: str
        required: false
        default: "stable"
        description: OLM channel for RHCL (Connectivity Link 1.4.x; deps auto-installed).
      ocp_4_20_ai_maas_rhcl_source:
        type: str
        required: false
        default: "redhat-operators"
        description: OLM catalog source for RHCL.
      ocp_4_20_ai_maas_lws_channel:
        type: str
        required: false
        default: "stable-v1.0"
        description: OLM channel for Leader Worker Set operator.
      ocp_4_20_ai_maas_lws_source:
        type: str
        required: false
        default: "redhat-operators"
        description: OLM catalog source for Leader Worker Set.
      ocp_4_20_ai_maas_rhoai_channel:
        type: str
        required: false
        default: "stable-3.5"
        description: OLM channel for Red Hat OpenShift AI.
      ocp_4_20_ai_maas_rhoai_source:
        type: str
        required: false
        default: "redhat-operators"
        description: OLM catalog source for RHOAI.

      # --- Observability operators ---
      ocp_4_20_ai_maas_coo_channel:
        type: str
        required: false
        default: "stable"
        description: >
          OLM channel for the Cluster Observability Operator (COO). Installed
          unpinned with Automatic approval; COO 1.5.x is compatible with RHOAI
          3.5 observability.
      ocp_4_20_ai_maas_coo_source:
        type: str
        required: false
        default: "redhat-operators"
        description: OLM catalog source for Cluster Observability Operator.
      ocp_4_20_ai_maas_otel_package:
        type: str
        required: false
        default: "opentelemetry-product"
        description: OLM package name for the OpenTelemetry operator.
      ocp_4_20_ai_maas_otel_channel:
        type: str
        required: false
        default: "stable"
        description: OLM channel for the OpenTelemetry operator.
      ocp_4_20_ai_maas_otel_source:
        type: str
        required: false
        default: "redhat-operators"
        description: OLM catalog source for OpenTelemetry.
      ocp_4_20_ai_maas_dsci_metrics_replicas:
        type: int
        required: false
        default: 1
        description: Prometheus replicas for DSCI metrics collection.
      ocp_4_20_ai_maas_dsci_metrics_retention:
        type: str
        required: false
        default: "7d"
        description: Prometheus metrics retention for DSCI.
      ocp_4_20_ai_maas_dsci_metrics_storage:
        type: str
        required: false
        default: "10Gi"
        description: PVC size for DSCI Prometheus metrics.

      # --- DSC ---
      ocp_4_20_ai_maas_dsc_components:
        type: dict
        required: false
        default:
          dashboard: Managed
          kserve: Managed
          aigateway: Removed
          aipipelines: Removed
          kueue: Removed
          ray: Removed
          trainingoperator: Removed
          trustyai: Removed
          workbenches: Removed
        description: >
          Base DataScienceCluster (v2) component states. aigateway starts Removed
          and is enabled by configure_maas_cluster.yaml after gateways + DB exist.

      # --- Gateway ---
      ocp_4_20_ai_maas_gateway_hostname:
        type: str
        required: false
        default: "maas"
        description: >
          Hostname prefix. Default gateway = {prefix}.{domain}; per-tenant =
          {tenant}-{prefix}.{domain}.
      ocp_4_20_ai_maas_gateway_memory_limit:
        type: str
        required: false
        default: "2Gi"
        description: istio-proxy memory limit via the {gateway}-options ConfigMap.
      ocp_4_20_ai_maas_gateway_cert_name:
        type: str
        required: false
        default: "router-certs"
        description: TLS certificate Secret name in openshift-ingress for gateways.

      # --- PostgreSQL ---
      ocp_4_20_ai_maas_db_image:
        type: str
        required: false
        default: "registry.redhat.io/rhel9/postgresql-16:latest"
        description: PostgreSQL image for the maas-api database.
      ocp_4_20_ai_maas_db_user:
        type: str
        required: false
        default: "maas"
        description: PostgreSQL username for the maas-api database.
      ocp_4_20_ai_maas_db_password:
        type: str
        required: false
        default: "maas-db-password"
        description: "DEV ONLY — PostgreSQL password. Override for production."
      ocp_4_20_ai_maas_db_name:
        type: str
        required: false
        default: "maas"
        description: PostgreSQL database name for maas-api.
      ocp_4_20_ai_maas_db_storage:
        type: str
        required: false
        default: "5Gi"
        description: PVC size for the maas-api PostgreSQL database.
      ocp_4_20_ai_maas_db_secret_namespace:
        type: str
        required: false
        default: "redhat-ai-gateway-infra"
        description: >
          Namespace for the maas-db-config secret (DB_CONNECTION_URL) that
          maas-api reads at startup.

      # --- Tenant runtime config ---
      ocp_4_20_ai_maas_api_key_max_expiration_days:
        type: int
        required: false
        default: 90
        description: MaasTenantConfig apiKeys.maxExpirationDays.
      ocp_4_20_ai_maas_telemetry_enabled:
        type: bool
        required: false
        default: true
        description: Enable telemetry in MaasTenantConfig.
      ocp_4_20_ai_maas_telemetry_capture_user:
        type: bool
        required: false
        default: false
        description: Include user identity in metrics (privacy-sensitive; default off).
      ocp_4_20_ai_maas_telemetry_capture_group:
        type: bool
        required: false
        default: false
        description: Include group labels in metrics (default off).
      ocp_4_20_ai_maas_telemetry_capture_organization:
        type: bool
        required: false
        default: true
        description: Include organization_id in metrics.
      ocp_4_20_ai_maas_telemetry_capture_model_usage:
        type: bool
        required: false
        default: true
        description: Include model labels in usage metrics.

      # --- Model (per-tenant: {base}-{tenant}, default {base}-simulated) ---
      ocp_4_20_ai_maas_model_name_base:
        type: str
        required: false
        default: "facebook-opt-125m"
        description: Base name for per-tenant LLMInferenceService/MaaSModelRef.
      ocp_4_20_ai_maas_model_id:
        type: str
        required: false
        default: "facebook/opt-125m"
        description: Model identifier used in inference requests and container args.
      ocp_4_20_ai_maas_model_namespace:
        type: str
        required: false
        default: "llm"
        description: Namespace where models are deployed.
      ocp_4_20_ai_maas_model_replicas:
        type: int
        required: false
        default: 1
        description: Number of model serving replicas.
      ocp_4_20_ai_maas_model_image:
        type: str
        required: false
        default: "ghcr.io/llm-d/llm-d-inference-sim:v0.7.1"
        description: Model container image. Default is the CPU-only simulator.
      ocp_4_20_ai_maas_model_uri:
        type: str
        required: false
        default: "hf://sshleifer/tiny-gpt2"
        description: Model URI (required by the LLMInferenceService spec; unused by the sim).

      # --- Subscription tiers ---
      ocp_4_20_ai_maas_tiers:
        type: list
        elements: dict
        required: false
        default:
          - name: free-subscription
            group: tier-free-users
            token_limit: 100
            window: 1m
            priority: 0
          - name: premium-subscription
            group: tier-premium-users
            token_limit: 50000
            window: 1m
            priority: 1
          - name: enterprise-subscription
            group: tier-enterprise-users
            token_limit: 100000
            window: 1m
            priority: 2
        description: >
          Default subscription tiers (overridable per tenant). Each entry needs
          name, group, token_limit, window, priority. Formats/ranges (window regex,
          token_limit 1-1e9, name DNS-1123) are enforced in tasks/validate_inputs.yaml.
        options:
          name:
            type: str
            required: true
          group:
            type: str
            required: false
          token_limit:
            type: int
            required: true
          window:
            type: str
            required: true
          priority:
            type: int
            required: true

      # --- Monitoring ---
      ocp_4_20_ai_maas_monitoring_retention:
        type: str
        required: false
        default: "24h"
        description: Prometheus retention for user workload monitoring.

      # --- Timeouts ---
      ocp_4_20_ai_maas_operator_retries:
        type: int
        required: false
        default: 50
        description: Retry count for operator/resource waits.
      ocp_4_20_ai_maas_operator_delay:
        type: int
        required: false
        default: 10
        description: Delay (seconds) between wait retries.
      ocp_4_20_ai_maas_long_retries:
        type: int
        required: false
        default: 60
        description: Retry count for long-running waits (RHOAI CSV, DSCI).
      ocp_4_20_ai_maas_dsc_retries:
        type: int
        required: false
        default: 90
        description: Retry count for DataScienceCluster / default-tenant Ready waits.
