syntax = "proto3";

package osac.private.v1;

import "cleanapi/cleanapi.proto";
import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "osac/private/v1/workload_cluster_type.proto";

option (cleanapi.file).package = "osac.public.v1";
option (cleanapi.file).http_route_prefix_map = "private:fulfillment";

message WorkloadClustersListRequest {
  optional int32 offset = 1;
  optional int32 limit = 2;
  optional string filter = 3;
  optional string order = 4;
}

message WorkloadClustersListResponse {
  int32 size = 1;
  int32 total = 2;
  repeated WorkloadCluster items = 3;
}

message WorkloadClustersGetRequest { string id = 1; }
message WorkloadClustersGetResponse { WorkloadCluster object = 1; }
message WorkloadClustersCreateRequest { WorkloadCluster object = 1; }
message WorkloadClustersCreateResponse { WorkloadCluster object = 1; }

message WorkloadClustersUpdateRequest {
  WorkloadCluster object = 1;
  google.protobuf.FieldMask update_mask = 2;
  bool lock = 3;
}

message WorkloadClustersUpdateResponse { WorkloadCluster object = 1; }
message WorkloadClustersDeleteRequest { string id = 1; }
message WorkloadClustersDeleteResponse {}

message WorkloadClustersSignalRequest {
  option (cleanapi.message).private = true;
  string id = 1;
}

message WorkloadClustersSignalResponse { option (cleanapi.message).private = true; }

service WorkloadClusters {
  rpc List(WorkloadClustersListRequest) returns (WorkloadClustersListResponse) {
    option (google.api.http) = {get: "/api/private/v1/workload-clusters"};
  }
  rpc Get(WorkloadClustersGetRequest) returns (WorkloadClustersGetResponse) {
    option (google.api.http) = {
      get: "/api/private/v1/workload-clusters/{id}"
      response_body: "object"
    };
  }
  rpc Create(WorkloadClustersCreateRequest) returns (WorkloadClustersCreateResponse) {
    option (google.api.http) = {
      post: "/api/private/v1/workload-clusters"
      body: "object"
      response_body: "object"
    };
  }
  rpc Update(WorkloadClustersUpdateRequest) returns (WorkloadClustersUpdateResponse) {
    option (google.api.http) = {
      patch: "/api/private/v1/workload-clusters/{object.id}"
      body: "object"
      response_body: "object"
    };
  }
  rpc Delete(WorkloadClustersDeleteRequest) returns (WorkloadClustersDeleteResponse) {
    option (google.api.http) = {delete: "/api/private/v1/workload-clusters/{id}"};
  }
  rpc Signal(WorkloadClustersSignalRequest) returns (WorkloadClustersSignalResponse) {
    option (cleanapi.method).private = true;
  }
}
