{{- if dig "observability" "enabled" false (.Values.global | default dict) }}
{{- $ns := include "osac-observability.namespace" . -}}
{{- /* One list, mounted by both admin proxies. The key is the file name the
       proxies read (/etc/query-allowlist/endpoints.txt), so a rename on either
       side is a startup error rather than a silent fallback. The entries
       mirror allowlist.DefaultSpecifiers in osac-observability/internal/
       allowlist; the proxy fails to start on a missing or unparseable file. */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: osac-observability-query-allowlist
  namespace: {{ $ns }}
  labels:
    {{- include "osac-observability.labels" . | nindent 4 }}
data:
  endpoints.txt: |
    /api/v1/query
    /api/v1/query_range
    /api/v1/series
    /api/v1/labels
    /api/v1/label/<name>/values
{{- end }}
