{{- if .Values.validation.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "osac.fullname" . }}-pre-install-validate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        {{- include "osac.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "osac.fullname" . }}-validate
      containers:
      - name: validate
        image: {{ .Values.cliImage }}
        {{- $ext := include "osac.externalAap.cfg" . | fromYaml }}
        {{- $aapExt := dig "externalAap" (dict) .Values.aap }}
        {{- $globExt := dig "externalAap" (dict) (.Values.global | default dict) }}
        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "=== OSAC Pre-install Validation ==="

          # Check that cert-manager CRDs exist
          echo "Checking for cert-manager CRDs..."
          if kubectl get crd certificates.cert-manager.io >/dev/null; then
            echo "  cert-manager CRDs found."
          else
            echo "ERROR: cert-manager CRDs not found."
            echo "Please install cert-manager before deploying OSAC."
            exit 1
          fi

          # Check that a default StorageClass exists
          echo "Checking for default StorageClass..."
          DEFAULT_SC=$(kubectl get sc -o jsonpath='{.items[?(@.metadata.annotations.storageclass\.kubernetes\.io/is-default-class=="true")].metadata.name}')
          if [ -n "$DEFAULT_SC" ]; then
            echo "  Default StorageClass found: $DEFAULT_SC"
          else
            echo "WARNING: No default StorageClass found."
            echo "Some components (PostgreSQL, Keycloak) may fail to create PVCs."
          fi

          {{- if $ext.enabled }}
          # Validate external AAP configuration
          echo "Checking external AAP configuration..."
          {{- if not $ext.url }}
          echo "ERROR: external AAP is enabled but url is empty."
          echo "Set global.externalAap.url (and aap.externalAap.url) to the full URL of your existing AAP controller API."
          echo "Example: https://my-aap.aap-namespace.apps.mycluster.example.com/api/controller"
          exit 1
          {{- else if not (hasPrefix "https://" ($ext.url | lower)) }}
          echo "ERROR: external AAP url must start with https://"
          echo "The AAP client sends a bearer token to this URL. HTTP is not allowed."
          exit 1
          {{- end }}
          {{- if not (dig "tokenSecret" "name" "" $ext) }}
          echo "ERROR: external AAP is enabled but tokenSecret.name is empty."
          echo "Create a Secret in the OSAC namespace with your AAP API token and set"
          echo "global.externalAap.tokenSecret.name (and aap.externalAap.tokenSecret.name) to its name."
          exit 1
          {{- end }}
          {{- if not (dig "externalAap" "enabled" false .Values.global) }}
          echo "ERROR: aap.externalAap.enabled is true but global.externalAap.enabled is false."
          echo "Helm only shares global.* with subcharts. Set global.externalAap to the same"
          echo "values so the OSAC operator and BMF auto-wire OSAC_AAP_URL and OSAC_AAP_TOKEN."
          echo "See values/examples/external-aap.yaml for a YAML-anchor copy."
          exit 1
          {{- end }}
          {{- if and (dig "enabled" false $aapExt) (dig "enabled" false $globExt) }}
          {{- if or (ne (printf "%v" (dig "url" "" $aapExt)) (printf "%v" (dig "url" "" $globExt))) (ne (printf "%v" (dig "tokenSecret" "name" "" $aapExt)) (printf "%v" (dig "tokenSecret" "name" "" $globExt))) (ne (printf "%v" (dig "tokenSecret" "key" "token" $aapExt)) (printf "%v" (dig "tokenSecret" "key" "token" $globExt))) }}
          echo "ERROR: aap.externalAap and global.externalAap must match."
          echo "Set the same url, tokenSecret.name, and tokenSecret.key on both copies"
          echo "(YAML anchor as in values/examples/external-aap.yaml). Umbrella hooks read"
          echo "aap.externalAap; the operator and BMF read global.externalAap."
          exit 1
          {{- end }}
          {{- end }}
          {{- if .Values.aap.aap.instance.enabled }}
          echo "ERROR: external AAP is enabled but aap.aap.instance.enabled is also true."
          echo "When using an external AAP, set aap.aap.instance.enabled to false to prevent"
          echo "the installer from creating a conflicting AnsibleAutomationPlatform CR."
          exit 1
          {{- end }}
          {{- if .Values.aap.bootstrap.enabled }}
          echo "ERROR: external AAP is enabled but aap.bootstrap.enabled is also true."
          echo "When using an external AAP, set aap.bootstrap.enabled to false. The external"
          echo "controller must be pre-configured with OSAC job templates and credentials."
          exit 1
          {{- end }}
          {{- if .Values.aap.apiToken.create }}
          echo "ERROR: external AAP is enabled but aap.apiToken.create is also true."
          echo "When using an external AAP, set aap.apiToken.create to false. The installer"
          echo "must not create a token against a managed osac-aap instance that will not exist."
          exit 1
          {{- end }}
          printf '%s\n' "  External AAP URL: ${OSAC_EXTERNAL_AAP_URL}"
          printf '%s\n' "  Token secret: ${OSAC_EXTERNAL_AAP_TOKEN_SECRET}"
          echo "  External AAP configuration valid."
          {{- end }}

          {{- if .Values.bmf.metal3.enabled }}
          # Check that Metal3 BareMetalHost CRD exists
          echo "Checking for Metal3 BareMetalHost CRD..."
          if kubectl get crd baremetalhosts.metal3.io >/dev/null; then
            echo "  BareMetalHost CRD found."
          else
            echo "ERROR: BareMetalHost CRD (baremetalhosts.metal3.io) not found."
            echo "Metal3 backend is configured but BareMetalOperator is not installed."
            echo "Install BareMetalOperator before deploying OSAC with Metal3 backend."
            exit 1
          fi

          # Check that the Provisioning CR has watchAllNamespaces enabled
          echo "Checking Provisioning CR watchAllNamespaces setting..."
          WATCH_ALL=$(kubectl get provisioning -o jsonpath='{.items[0].spec.watchAllNamespaces}' 2>/dev/null || true)
          if [ -z "$WATCH_ALL" ]; then
            echo "ERROR: No Provisioning CR found."
            echo "Metal3 backend requires a Provisioning CR with watchAllNamespaces: true."
            echo "Configure BareMetalOperator to watch all namespaces for BareMetalHost resources."
            exit 1
          elif [ "$WATCH_ALL" != "true" ]; then
            echo "ERROR: Provisioning CR has watchAllNamespaces: ${WATCH_ALL}."
            echo "Metal3 backend requires watchAllNamespaces: true on the Provisioning CR."
            echo "Set spec.watchAllNamespaces to true so BMO can discover BareMetalHost resources across namespaces."
            exit 1
          else
            echo "  Provisioning CR watchAllNamespaces: true."
          fi
          {{- end }}

          echo "=== Validation passed ==="
        {{- if $ext.enabled }}
        env:
        - name: OSAC_EXTERNAL_AAP_URL
          value: {{ $ext.url | quote }}
        - name: OSAC_EXTERNAL_AAP_TOKEN_SECRET
          value: {{ dig "tokenSecret" "name" "" $ext | quote }}
        {{- end }}
  backoffLimit: 0
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "osac.fullname" . }}-validate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-11"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "osac.fullname" . }}-validate-{{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-11"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get"]
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses"]
  verbs: ["list"]
{{- if .Values.bmf.metal3.enabled }}
- apiGroups: ["metal3.io"]
  resources: ["provisionings"]
  verbs: ["list"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "osac.fullname" . }}-validate-{{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-11"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "osac.fullname" . }}-validate-{{ .Release.Namespace }}
subjects:
- kind: ServiceAccount
  name: {{ include "osac.fullname" . }}-validate
  namespace: {{ .Release.Namespace }}
{{- end }}
