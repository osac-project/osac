---
name: auto-queue

# Queue policy lives in .github/scripts/auto-queue.sh. If lgtm is present,
# every Request changes review is dismissed (OSAC-5507) and auto-merge is
# enabled so required tests can run.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, labeled, unlabeled]
    branches: [main]
  pull_request_review:
    types: [submitted]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  enable-auto-merge:
    if: github.repository == 'osac-project/osac' && (github.event_name == 'pull_request_target' || github.event_name == 'pull_request_review')
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout the base-branch script only
    steps:
      # Base SHA, not the PR head: this job can run on pull_request_review.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Sync merge queue
        env:
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ACTION: ${{ github.event.action }}
        run: .github/scripts/auto-queue.sh sync

  requeue-eligible-prs:
    if: github.repository == 'osac-project/osac' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout the base-branch script only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Maintain merge queue
        env:
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          REPO: ${{ github.repository }}
        run: .github/scripts/auto-queue.sh maintain
