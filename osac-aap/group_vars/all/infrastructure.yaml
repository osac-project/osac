dns_ttl: 1800
default_agent_namespace: &agent_namespace >-
  {{ (osac_job_vars.resource.metadata.namespace | default(''))
     if (osac_job_vars is defined and osac_job_vars.resource is defined)
     else 'hardware-inventory' }}
manage_agents_namespace: *agent_namespace
external_access_agent_namespace: *agent_namespace

# Hosted cluster defaults
hosted_cluster_default_agent_namespace: *agent_namespace
hosted_cluster_default_infraenv: "infraenv"
