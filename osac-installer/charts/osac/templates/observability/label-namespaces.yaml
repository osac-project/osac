{{- $fullname := include "osac.fullname" . -}}
{{- $enabled := .Values.global.observability.enabled | default false -}}
{{- /*
Helm cannot label its own release namespace declaratively, and rendering a
Namespace object for it would make Helm own (and delete) the namespace on
uninstall. Namespaces are cluster-scoped, so a Role cannot grant patch on them;
the ClusterRole below is limited by resourceNames to the release namespace,
which is the narrowest grant that works. Do not replace this with a
release-namespace Namespace object.

Enabled renders a pre-install/pre-upgrade Job that adds the label, plus a
pre-delete Job that removes it when the release is uninstalled. Disabled renders
a pre-upgrade Job that removes a label left behind by an earlier enabled
release; it has only the pre-upgrade event, so a fresh disabled install neither
creates nor runs it. Each Job needs its RBAC to exist when it runs, so the RBAC
carries the same hook events: pre-install hooks run before regular resources are
created, and hook resources deleted on success are gone by pre-delete.
*/ -}}
{{- $rbacHookEvents := "pre-upgrade" -}}
{{- $removeHookEvents := "pre-upgrade" -}}
{{- if $enabled -}}
{{- $rbacHookEvents = "pre-install,pre-upgrade,pre-delete" -}}
{{- $removeHookEvents = "pre-delete" -}}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}-label-namespaces
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": {{ $rbacHookEvents | quote }}
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-label-namespaces
  labels:
    {{- include "osac.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": {{ $rbacHookEvents | quote }}
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
- apiGroups: [""]
  resources: ["namespaces"]
  resourceNames: ["{{ .Release.Namespace }}"]
  verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-label-namespaces
  labels:
    {{- include "osac.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": {{ $rbacHookEvents | quote }}
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-label-namespaces
subjects:
- kind: ServiceAccount
  name: {{ $fullname }}-label-namespaces
  namespace: {{ .Release.Namespace }}
{{- if $enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-label-namespaces
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-output-log-policy": hook-failed
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        {{- include "osac.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: {{ $fullname }}-label-namespaces
      restartPolicy: Never
      containers:
      - name: label-namespace
        image: {{ .Values.cliImage }}
        command:
        - kubectl
        - label
        - namespace
        - {{ .Release.Namespace }}
        - openshift.io/cluster-monitoring=true
        - --overwrite
        env:
        - name: HOME
          value: /tmp
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: tmp
        emptyDir: {}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-unlabel-namespaces
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": {{ $removeHookEvents }}
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-output-log-policy": hook-failed
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        {{- include "osac.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: {{ $fullname }}-label-namespaces
      restartPolicy: Never
      containers:
      - name: unlabel-namespace
        image: {{ .Values.cliImage }}
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          ns="{{ .Release.Namespace }}"
          kubectl get namespace "$ns" -o jsonpath='{.metadata.labels.openshift\.io/cluster-monitoring}' > /tmp/monitoring-label
          current=$(cat /tmp/monitoring-label)
          if [ -n "$current" ]; then
            kubectl label namespace "$ns" openshift.io/cluster-monitoring-
          fi
        env:
        - name: HOME
          value: /tmp
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: tmp
        emptyDir: {}
