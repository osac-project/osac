{{- if and .Values.bmf.enabled .Values.bmf.testBackend.metal3.enabled }}
# Kind/IT only: seeds a fake metal3-backend inventory/management config so the BMF
# manager can start without a real OpenStack/Ironic deployment. Fake BareMetalHost
# objects (see bare-metal-fulfillment-operator's test/integration suite) stand in
# for what a real Metal3 BareMetalOperator/Ironic would otherwise manage.
#
# Deliberately named *-metal3-test, distinct from bmf.secrets.inventoryConfig/
# managementConfig's real defaults (osac-inventory-config/osac-management-config,
# used for real credentials in production) -- this chart is shared with real
# installs, and reusing the real names here would mean enabling this flag against
# a real cluster silently overwrites real credentials via `helm upgrade`, with no
# error. values/kind/osac.yaml additionally repoints bmf.secrets.inventoryConfig/
# managementConfig at these two names, so the deployment only ever picks these up
# when BOTH testBackend.metal3.enabled AND that repointing are set -- never as a
# side effect of testBackend.metal3.enabled alone.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.bmf.testBackend.metal3.secretNames.inventoryConfig }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
stringData:
  inventory.yaml: |
    name: metal3-inventory
    type: metal3
    hostClass: metal3
    options:
      metal3:
        namespace: {{ .Values.bmf.testBackend.metal3.namespace | default .Release.Namespace | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.bmf.testBackend.metal3.secretNames.managementConfig }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
stringData:
  management.yaml: |
    name: metal3-management
    type: metal3
    options:
      metal3:
        namespace: {{ .Values.bmf.testBackend.metal3.namespace | default .Release.Namespace | quote }}
{{- end }}
