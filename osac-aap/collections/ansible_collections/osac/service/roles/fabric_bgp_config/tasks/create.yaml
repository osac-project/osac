---
# Validate and apply direct worker-to-fabric BGP/EVPN configuration.
# Uses only FRR-K8s typed API fields; no raw FRR config.

- name: Validate fabric BGP worker list is nonempty
  ansible.builtin.assert:
    that:
      - fabric_bgp_workers is defined
      - fabric_bgp_workers | length > 0
    fail_msg: >-
      fabricBGP.workers must be a nonempty list. No resources were
      changed.

- name: Validate each worker entry
  ansible.builtin.assert:
    that:
      - >-
        item.nodeName is defined and
        item.nodeName is match('^[a-z0-9]([a-z0-9._-]{0,61}[a-z0-9])?$')
      - >-
        item.interface is defined and
        item.interface is match('^[a-zA-Z0-9][a-zA-Z0-9_.:-]{0,14}$')
      - >-
        item.localAddress is defined and
        (item.localAddress | ansible.utils.ipaddr('address')) != false
      - >-
        item.peerAddress is defined and
        (item.peerAddress | ansible.utils.ipv4) != false
      - >-
        item.localASN is defined and
        item.localASN | int >= 1 and
        item.localASN | int <= 4294967295
      - >-
        item.peerASN is defined and
        item.peerASN | int >= 1 and
        item.peerASN | int <= 4294967295
      - >-
        item.localVTEP is defined and
        item.localVTEP is match('^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/32$')
      - >-
        item.remoteVTEPRanges is defined and
        item.remoteVTEPRanges | length > 0
    fail_msg: >-
      Worker entry at index {{ ansible_loop.index0 }} has invalid
      fabric BGP configuration. Each worker requires a valid DNS
      nodeName, an interface name (alphanumeric, max 15 chars),
      localAddress (IPv4 CIDR), peerAddress (IPv4),
      localASN (1-4294967295), peerASN (1-4294967295),
      localVTEP (/32 CIDR), and a nonempty remoteVTEPRanges list.
      No Kubernetes resources were changed.
  loop: "{{ fabric_bgp_workers }}"
  loop_control:
    label: "worker {{ ansible_loop.index0 }}"
    extended: true

- name: Validate remote VTEP ranges are valid CIDRs
  ansible.builtin.assert:
    that:
      - >-
        vtep_range | ansible.utils.ipaddr('network/prefix') != false
    fail_msg: >-
      Remote VTEP range at index {{ ansible_loop.index0 }} is not
      a valid CIDR. No Kubernetes resources were changed.
  loop: >-
    {{ fabric_bgp_workers | subelements('remoteVTEPRanges') }}
  loop_control:
    label: "range {{ ansible_loop.index0 }}"
    extended: true
  vars:
    vtep_range: "{{ item.1 }}"

- name: Check FRRConfiguration CRD availability
  kubernetes.core.k8s_info:
    kubeconfig: "{{ fabric_bgp_remote_kubeconfig | default(omit) }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: frrconfigurations.frrk8s.metallb.io
  register: _fabric_bgp_frr_crd

- name: Validate FRRConfiguration CRD is installed
  ansible.builtin.assert:
    that:
      - _fabric_bgp_frr_crd.resources | length == 1
    fail_msg: >-
      FRRConfiguration CRD (frrk8s.metallb.io) is not installed on
      the target cluster. The MetalLB operator with FRR mode is
      required. No Kubernetes resources were changed.

- name: Extract served FRRConfiguration schema version
  ansible.builtin.set_fact:
    _fabric_bgp_frr_served_version: >-
      {{ _fabric_bgp_frr_crd.resources[0].spec.versions
         | selectattr('served', 'equalto', true)
         | map(attribute='name') | first | default('') }}
    _fabric_bgp_frr_schema_properties: >-
      {{ (_fabric_bgp_frr_crd.resources[0].spec.versions
          | selectattr('served', 'equalto', true) | first
          | default({}))
         .get('schema', {})
         .get('openAPIV3Schema', {})
         .get('properties', {})
         .get('spec', {})
         .get('properties', {})
         .get('bgp', {})
         .get('properties', {})
         .get('routers', {})
         .get('items', {})
         .get('properties', {})
         .get('neighbors', {})
         .get('items', {})
         .get('properties', {}) }}

- name: Validate FRR-K8s CRD supports required fields
  ansible.builtin.assert:
    that:
      - "'allowAsIn' in _fabric_bgp_frr_schema_properties"
      - "'addressFamilies' in _fabric_bgp_frr_schema_properties"
    fail_msg: >-
      The served FRRConfiguration CRD schema does not include
      allowAsIn and addressFamilies fields (added in FRR-K8s
      v0.0.26). These are required for safe EVPN peering.
      Upgrade the MetalLB/FRR-K8s operator before enabling
      fabric BGP. No Kubernetes resources were changed.

- name: Check NodeNetworkConfigurationPolicy CRD availability
  kubernetes.core.k8s_info:
    kubeconfig: "{{ fabric_bgp_remote_kubeconfig | default(omit) }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: nodenetworkconfigurationpolicies.nmstate.io
  register: _fabric_bgp_nncp_crd

- name: Validate NNCP CRD is installed
  ansible.builtin.assert:
    that:
      - _fabric_bgp_nncp_crd.resources | length == 1
    fail_msg: >-
      NodeNetworkConfigurationPolicy CRD (nmstate.io) is not
      installed on the target cluster. The NMState operator is
      required. No Kubernetes resources were changed.

- name: Apply NMState policy for each worker
  kubernetes.core.k8s:
    kubeconfig: "{{ fabric_bgp_remote_kubeconfig | default(omit) }}"
    state: present
    definition: "{{ lookup('template', 'nncp.yaml.j2') }}"
  loop: "{{ fabric_bgp_workers }}"
  loop_control:
    loop_var: _fabric_bgp_worker
    label: "worker {{ ansible_loop.index0 }}"
    extended: true
  vars:
    worker_node_name: "{{ _fabric_bgp_worker.nodeName }}"
    worker_interface: "{{ _fabric_bgp_worker.interface }}"
    worker_local_address: "{{ _fabric_bgp_worker.localAddress }}"

- name: Wait for NNCP Available on each worker
  kubernetes.core.k8s_info:
    kubeconfig: "{{ fabric_bgp_remote_kubeconfig | default(omit) }}"
    api_version: nmstate.io/v1
    kind: NodeNetworkConfigurationPolicy
    name: "fabric-bgp-{{ _fabric_bgp_worker.nodeName }}"
  register: _fabric_bgp_nncp_status
  until: >-
    _fabric_bgp_nncp_status.resources | default([]) | length > 0 and
    (_fabric_bgp_nncp_status.resources[0].status.conditions | default([])
    | selectattr('type', 'equalto', 'Available')
    | selectattr('status', 'equalto', 'True')
    | list | length > 0)
  retries: 30
  delay: 10
  loop: "{{ fabric_bgp_workers }}"
  loop_control:
    loop_var: _fabric_bgp_worker
    label: "worker {{ ansible_loop.index0 }}"
    extended: true

- name: Apply FRRConfiguration for each worker
  kubernetes.core.k8s:
    kubeconfig: "{{ fabric_bgp_remote_kubeconfig | default(omit) }}"
    state: present
    definition: "{{ lookup('template', 'frr_configuration.yaml.j2') }}"
  loop: "{{ fabric_bgp_workers }}"
  loop_control:
    loop_var: _fabric_bgp_worker
    label: "worker {{ ansible_loop.index0 }}"
    extended: true
  vars:
    worker_node_name: "{{ _fabric_bgp_worker.nodeName }}"
    worker_local_asn: "{{ _fabric_bgp_worker.localASN }}"
    worker_peer_address: "{{ _fabric_bgp_worker.peerAddress }}"
    worker_peer_asn: "{{ _fabric_bgp_worker.peerASN }}"
    worker_local_address: "{{ _fabric_bgp_worker.localAddress }}"
    worker_local_vtep: "{{ _fabric_bgp_worker.localVTEP }}"
    worker_remote_vtep_ranges: "{{ _fabric_bgp_worker.remoteVTEPRanges }}"
    worker_ebgp_multihop: "{{ _fabric_bgp_worker.ebgpMultihop | default(true) }}"
    worker_graceful_restart: "{{ _fabric_bgp_worker.gracefulRestart | default(true) }}"

- name: Log fabric BGP configuration result
  ansible.builtin.debug:
    msg: >-
      Applied fabric BGP configuration for
      {{ fabric_bgp_workers | length }} worker(s).
