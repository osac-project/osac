# Sets no output fact — the dispatcher reads nothing back from this action.

- name: Report that pure_storage teardown_backend is not yet implemented
  ansible.builtin.debug:
    msg: >-
      pure_storage teardown_backend is a placeholder — FlashBlade cleanup and
      Realm release are implemented by OSAC-5022.
      Tiers: {{ _provider_tiers | default([]) | map(attribute='name') | list }}
