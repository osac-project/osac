syntax = "proto3";

package osac.private.v1;

import "osac/private/v1/metadata_type.proto";
import "osac/private/v1/secret_type.proto";

// Contains the details of a hub.
message Hub {
  // Unique identifier of the hub.
  //
  // This will be automatically generated by the server when the hub is created.
  string id = 1;

  // Metadata of the hub.
  private.v1.Metadata metadata = 2;

  // Desired and current state of the hub.
  HubSpec spec = 3;
  HubStatus status = 4;
}

// Desired state of the hub.
message HubSpec {
  // The Kubeconfig containing the address and credentials that the service will use to connect to the hub.
  //
  // Mutually exclusive with `kubeconfig_secret`.
  bytes kubeconfig = 3;

  // Namespace where the cluster orders will be created.
  string namespace = 4;

  // Reference to a Secret resource containing kubeconfig credentials.
  //
  // Mutually exclusive with `kubeconfig`. When set, the system resolves the referenced Secret and reads the
  // `kubeconfig` data key. The referenced Secret must exist in the same tenant.
  SecretLocalReference kubeconfig_secret = 5;
}

// Current state of the hub.
message HubStatus {
}
