# This workflow publishes the protocol buffers specification to the buf schema registry.

name: Publish proto

# Only ever called directly by osac-build-and-publish.yaml, right after it
# pushes fulfillment-service's real tag -- never triggered by the tag push
# itself. See publish-binaries.yaml's identical header comment for why.
on:
  workflow_call:
    inputs:
      version:
        description: Bare, semver-parseable version with its leading "v" (e.g. "v0.0.109"), used as the buf push label.
        required: true
        type: string
      ref:
        description: Commit or branch to check out and publish the proto schema from.
        required: true
        type: string
    secrets:
      buf-token:
        required: true

jobs:

  publish-proto:
    name: Publish proto
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        ref: ${{ inputs.ref }}
        persist-credentials: false
    - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3  # v1
      with:
        setup_only: true
        token: ${{ secrets.buf-token }}
        version: 1.71.0
    # Buf config lives in the top-level proto/ module now. The buf.yaml
    # module names (buf.build/osac-project/{public,private}-api) are
    # unchanged.
    - working-directory: proto
      run: buf push --label "${{ inputs.version }}"
