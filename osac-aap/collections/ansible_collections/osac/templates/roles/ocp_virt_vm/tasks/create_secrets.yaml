---
- name: Validate tenant annotation for sysprep Secret
  when:
    - guest_os_family == 'windows'
    - vm_user_data_secret_ref | length > 0 or vm_user_data_fulfillment_secret_id | default('') | length > 0
  ansible.builtin.assert:
    that:
      - >-
        (compute_instance.metadata.annotations | default({}, true)).get('osac.openshift.io/tenant', '') | default('', true) | length > 0
    fail_msg: >-
      ComputeInstance must have a non-empty 'osac.openshift.io/tenant'
      annotation before creating a sysprep Secret

- name: Initialize VM user data
  ansible.builtin.set_fact:
    vm_userdata: ''

- name: Read inline user data from the ComputeInstance namespace
  when: vm_user_data_secret_ref | length > 0
  block:
    - name: Read staging Secret from the management cluster
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "{{ vm_user_data_secret_ref }}"
        namespace: "{{ compute_instance.metadata.namespace }}"
      register: user_data_secret
      no_log: true

    - name: Require user data in the staging Secret
      ansible.builtin.assert:
        that:
          - user_data_secret.resources | length > 0
          - user_data_secret.resources[0].data.userdata | default('', true) | length > 0
        fail_msg: The management-cluster staging Secret is unavailable or missing its userdata key.

    - name: Select inline user data
      ansible.builtin.set_fact:
        vm_userdata: "{{ user_data_secret.resources[0].data.userdata }}"
      no_log: true

- name: Read referenced user data from Fulfillment
  when: vm_user_data_fulfillment_secret_id | default('') | length > 0
  block:
    - name: Fetch the selected Fulfillment Secret
      ansible.builtin.set_fact:
        fulfillment_user_data_result: >-
          {{ query('osac.service.fulfillment_secret_data', vm_user_data_fulfillment_secret_id, data_key='userdata') | first }}
      no_log: true

    - name: Report Fulfillment read failure
      ansible.builtin.fail:
        msg: "Unable to read ComputeInstance user data. {{ fulfillment_user_data_result.error }}"
      when: fulfillment_user_data_result.error is defined

    - name: Select referenced user data
      ansible.builtin.set_fact:
        vm_userdata: "{{ fulfillment_user_data_result.value }}"
      no_log: true

- name: Create a Sysprep Secret and disk for Windows
  when:
    - guest_os_family == 'windows'
    - vm_userdata | length > 0
  block:
    - name: Create sysprep secret in VM namespace with Unattend.xml key
      kubernetes.core.k8s:
        kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ compute_instance_name }}-sysprep"
            namespace: "{{ compute_instance_target_namespace }}"
            labels: "{{ default_vm_labels }}"
            annotations:
              osac.openshift.io/tenant: "{{ compute_instance.metadata.annotations['osac.openshift.io/tenant'] }}"
          type: Opaque
          data:
            Unattend.xml: "{{ vm_userdata }}"
      no_log: true

    - name: Add sysprep disk to template spec
      ansible.builtin.set_fact:
        vm_template_spec: "{{ vm_template_spec | combine(sysprep_patch, recursive=True, list_merge='append') }}"
      vars:
        sysprep_patch:
          domain:
            devices:
              disks:
                - name: sysprep-disk
                  cdrom:
                    bus: sata
          volumes:
            - name: sysprep-disk
              sysprep:
                secret:
                  name: "{{ compute_instance_name }}-sysprep"

- name: Create a cloud-init Secret and disk for Linux
  when:
    - guest_os_family != 'windows'
    - vm_userdata | length > 0
  block:
    - name: Create user-data secret in VM namespace
      kubernetes.core.k8s:
        kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ compute_instance_name }}-user-data"
            namespace: "{{ compute_instance_target_namespace }}"
            labels: "{{ default_vm_labels }}"
          type: Opaque
          data:
            userdata: "{{ vm_userdata }}"
      no_log: true

    - name: Add cloud-init disk to template spec
      ansible.builtin.set_fact:
        vm_template_spec: "{{ vm_template_spec | combine(cloud_init_patch, recursive=True, list_merge='append') }}"
      vars:
        cloud_init_patch:
          domain:
            devices:
              disks:
                - name: cloud-init-disk
                  disk:
                    bus: virtio
                  serial: cloud-init
          volumes:
            - name: cloud-init-disk
              cloudInitNoCloud:
                secretRef:
                  name: "{{ compute_instance_name }}-user-data"

- name: Add minimal cloud-init disk for SSH key propagation (Linux)
  ansible.builtin.set_fact:
    vm_template_spec: "{{ vm_template_spec | combine(cloud_init_patch, recursive=True, list_merge='append') }}"
  vars:
    cloud_init_patch:
      domain:
        devices:
          disks:
            - name: cloud-init-disk
              disk:
                bus: virtio
              serial: cloud-init
      volumes:
        - name: cloud-init-disk
          cloudInitNoCloud:
            userData: "#cloud-config"
  when:
    - guest_os_family == 'linux'
    - vm_ssh_key | length > 0
    - vm_userdata | length == 0

- name: Create ssh public key secret and add accessCredentials to template spec (Linux)
  when:
    - guest_os_family == 'linux'
    - vm_ssh_key | length > 0
  block:
    - name: Create Secret resource containing ssh public key
      kubernetes.core.k8s:
        kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ compute_instance_name }}-ssh-public-key"
            namespace: "{{ compute_instance_target_namespace }}"
            labels: "{{ default_vm_labels }}"
          data:
            ssh-public-key: "{{ vm_ssh_key | b64encode }}"
          type: Opaque

    - name: Add accessCredentials to template spec
      ansible.builtin.set_fact:
        vm_template_spec: "{{ vm_template_spec | combine(ssh_public_key_patch, recursive=True, list_merge='append') }}"
      vars:
        ssh_public_key_patch:
          accessCredentials:
            - sshPublicKey:
                source:
                  secret:
                    secretName: "{{ compute_instance_name }}-ssh-public-key"
                propagationMethod:
                  noCloud: {}
