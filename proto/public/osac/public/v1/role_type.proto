syntax = "proto3";

package osac.public.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "osac/public/v1/metadata_type.proto";

// Represents a role that can be assigned to groups.
//
// Roles are named entities that represent a set of permissions within the system. They are assigned to
// groups to control what actions the members of those groups can perform. The permissions of a role are
// defined by the rules of its spec
//
// Predefined roles include `cloud-provider-admin`, `cloud-provider-reader`, `tenant-idp-manager`, `tenant-admin`, and `tenant-reader`.
message Role {
  // Unique identifier of the role.
  string id = 1;

  // Metadata of the role.
  Metadata metadata = 2;

  // Desired state of the role.
  RoleSpec spec = 3;

  // Current observed state of the role.
  RoleStatus status = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Desired state of a role.
message RoleSpec {
  // Human-friendly short description of the role, only a few words, suitable for displaying in one single line on
  // a UI or CLI. For example: "Cloud Provider Administrator" or "Tenant Administrator".
  string title = 1;

  // Human-friendly long description of the role, using Markdown format. This should explain what permissions the
  // role grants and in what contexts it is typically used.
  string description = 2;

  // Permission rules that define what the role grants. Each rule names one service and the methods of that service
  // that are granted.
  repeated PermissionRule permissions = 3;
}

// A permission rule granting a set of methods of one API service.
message PermissionRule {
  // Name of the service that the methods belong to, in lower case and without the version segment, for example
  // "osac.public.clusters" or "osac.private.volumes". The wildcards "*" (every service), "osac.public.*" and
  // "osac.private.*" (every service of one API layer) select multiple services. The server resolves the name
  // against a permission catalog and rejects names that don't correspond to a cataloged service.
  string service = 1 [(buf.validate.field).string.pattern = "^(\\*|osac\\.(public|private)\\.\\*|osac\\.(public|private)\\.[a-z]+)$"];

  // Names of the methods that the rule grants, in lower case, for example "get" or "create". The
  // wildcard "*" selects all the methods of the service. The server rejects names that don't correspond to a
  // method of the selected service.
  repeated string methods = 2 [(buf.validate.field).repeated = {
    min_items: 1
    items: {
      string: {pattern: "^(\\*|[a-z]+)$"}
    }
  }];
}

// Current observed state of a role, reflecting its synchronization with the underlying authorization system.
message RoleStatus {
  // Current synchronization state of the role.
  RoleState state = 1;

  // Human-readable message providing additional details about the current state. For example, if the state is
  // FAILED, this field may explain why the synchronization with the authorization system failed.
  optional string message = 2;
}

// Synchronization states for Role resources with the underlying authorization system.
enum RoleState {
  // State is unknown or has not been determined yet.
  ROLE_STATE_UNSPECIFIED = 0;

  // The role is being created or applied to the underlying authorization system and cannot be used yet.
  ROLE_STATE_PENDING = 1;

  // The role is fully synchronized with the underlying authorization system and can be used.
  ROLE_STATE_READY = 2;

  // The role failed to be applied to the underlying authorization system.
  ROLE_STATE_FAILED = 3;
}

// Reference to a Role resource.
message RoleReference {
  string id = 1;
  string name = 2;
  string project = 3;
  bool shared = 4;
  // Tenant where the referenced object lives. If omitted, the owner tenant is used;
  // the legacy shared selector can select the shared tenant.
  string tenant = 5;
}
