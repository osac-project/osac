---
# TC-3.5: Windows sysprep Secret copy — component integration test.
# Exercises the real create_secrets.yaml Kubernetes path against Kind.
# Verifies: source data.userdata is copied unchanged to destination
# data.Unattend.xml in the VM namespace, and the VM template spec
# references that destination Secret through a sysprep volume and
# SATA CD-ROM disk.
#
# Prerequisites (provided by setup_test_env.sh):
#   - Kind cluster with OSAC and KubeVirt CRDs
#   - Namespaces: osac-system, computeinstance-test-vm-work
#
# Run:
#   cd tests/integration
#   source <env setup from run_tests.sh>
#   uv run ansible-playbook \
#     targets/compute_instance_create/tasks/sysprep_secret_copy.yml \
#     -e "@common_vars.yml" -v

- name: "TC-3.5 Setup — create source userdata Secret"
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../../common_vars.yml

  tasks:
    - name: Read Windows ComputeInstance fixture
      ansible.builtin.set_fact:
        test_compute_instance: >-
          {{ lookup('file',
             '../../../fixtures/computeinstance-windows-userdata-test.yaml')
             | from_yaml }}

    - name: Define test Unattend.xml content
      ansible.builtin.set_fact:
        test_unattend_content: >-
          <?xml version="1.0" encoding="utf-8"?>
          <unattend xmlns="urn:schemas-microsoft-com:unattend">
            <settings pass="specialize">
              <component name="osac-tc35-marker"/>
            </settings>
          </unattend>

    - name: Create source Secret with userdata key
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "test-win-sysprep-userdata"
            namespace: "osac-system"
            annotations:
              osac.openshift.io/tenant: integration-tenant
          type: Opaque
          data:
            userdata: >-
              {{ test_unattend_content | b64encode }}

    - name: Set workflow variables
      ansible.builtin.set_fact:
        osac_job_vars:
          resource: "{{ test_compute_instance }}"
        tenant_storage_class_storage_classes:
          - name: "test-storage-class"
            tier: "local"
        # Let create_secrets.yaml run for real (no override).
        # Override only the expensive downstream steps that
        # require a running VM or DataVolume.
        create_step_resources_override:
          name: osac.workflows.workflow_helpers
          tasks_from: noop.yml
        create_step_wait_annotate_override:
          name: osac.workflows.workflow_helpers
          tasks_from: noop.yml

    - name: Verify missing tenant annotation is rejected before Secret operations
      block:
        - name: Run sysprep task with no tenant annotation
          ansible.builtin.include_tasks:
            file: "{{ playbook_dir }}/../../../../../collections/ansible_collections/osac/templates/roles/ocp_virt_vm/tasks/create_secrets.yaml"
          vars:
            guest_os_family: windows
            vm_user_data_secret_ref: missing-tenant-userdata
            compute_instance_name: test-win-no-tenant
            compute_instance_target_namespace: computeinstance-test-vm-work
            compute_instance:
              metadata:
                name: test-win-no-tenant
                namespace: osac-system
                annotations: {}
        - name: Fail if missing tenant annotation was accepted
          ansible.builtin.fail:
            msg: Expected create_secrets.yaml to reject a missing tenant annotation
      rescue:
        - name: Confirm tenant guard rejected the ComputeInstance
          ansible.builtin.assert:
            that:
              - >-
                'ComputeInstance must have a non-empty' in
                (ansible_failed_result | default({}) | to_json)
            fail_msg: >-
              Expected the missing-tenant validation to fail before Kubernetes
              Secret operations, but got {{ ansible_failed_result | default({}) }}

- name: Import compute instance create workflow
  ansible.builtin.import_playbook: osac.workflows.compute_instance.create

- name: "TC-3.5 Verify — Secret data and VM spec assertions"
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../../common_vars.yml

  tasks:
    - name: Verify and clean up sysprep Secret copy
      block:
        - name: Read destination sysprep Secret
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Secret
            name: "test-win-sysprep-sysprep"
            namespace: "computeinstance-test-vm-work"
          register: dest_secret

        - name: Verify destination Secret exists
          ansible.builtin.assert:
            that:
              - dest_secret.resources | length == 1
            fail_msg: >-
              Expected Secret 'test-win-sysprep-sysprep'
              in 'computeinstance-test-vm-work',
              found {{ dest_secret.resources | length }}

        - name: Verify Unattend.xml key present
          ansible.builtin.assert:
            that:
              - >-
                dest_secret.resources[0]
                .data['Unattend.xml'] is defined
              - >-
                dest_secret.resources[0]
                .data['Unattend.xml'] | length > 0
            fail_msg: >-
              Expected 'Unattend.xml' key in Secret,
              got keys:
              {{ dest_secret.resources[0].data.keys()
                 | list }}

        - name: Read source Secret for comparison
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Secret
            name: "test-win-sysprep-userdata"
            namespace: "osac-system"
          register: src_secret

        - name: >-
            Verify data.userdata ==
            data.Unattend.xml (unchanged)
          ansible.builtin.assert:
            that:
              - >-
                src_secret.resources[0].data.userdata
                == dest_secret.resources[0]
                   .data['Unattend.xml']
            fail_msg: >-
              Source data.userdata does not match
              destination data.Unattend.xml

        - name: Verify SATA CD-ROM sysprep disk
          ansible.builtin.assert:
            that:
              - >-
                vm_template_spec.domain.devices.disks
                | selectattr('name', 'equalto',
                             'sysprep-disk')
                | list | length == 1
              - >-
                (vm_template_spec.domain.devices.disks
                | selectattr('name', 'equalto',
                             'sysprep-disk')
                | first).cdrom.bus == 'sata'
            fail_msg: >-
              Expected sysprep-disk cdrom.bus=sata,
              got
              {{ vm_template_spec.domain.devices.disks }}

        - name: Verify sysprep volume Secret ref
          ansible.builtin.assert:
            that:
              - >-
                vm_template_spec.volumes
                | selectattr('name', 'equalto',
                             'sysprep-disk')
                | list | length == 1
              - >-
                (vm_template_spec.volumes
                | selectattr('name', 'equalto',
                             'sysprep-disk')
                | first).sysprep.secret.name
                == "test-win-sysprep-sysprep"
            fail_msg: >-
              Expected sysprep volume referencing
              'test-win-sysprep-sysprep',
              got {{ vm_template_spec.volumes }}

        - name: Verify destination Secret tenant and VM labels
          ansible.builtin.assert:
            that:
              - >-
                dest_secret.resources[0]
                .metadata.annotations['osac.openshift.io/tenant']
                == 'integration-tenant'
              - >-
                dest_secret.resources[0]
                .metadata.labels[compute_instance_label]
                == 'test-win-sysprep'
            fail_msg: >-
              Expected tenant=integration-tenant and label
              {{ compute_instance_label }}=test-win-sysprep, got
              annotations={{ dest_secret.resources[0].metadata.annotations }}
              labels={{ dest_secret.resources[0].metadata.labels }}

      always:
        - name: Remove destination sysprep Secret
          kubernetes.core.k8s:
            state: absent
            api_version: v1
            kind: Secret
            name: "test-win-sysprep-sysprep"
            namespace: "computeinstance-test-vm-work"
          failed_when: false

        - name: Remove source userdata Secret
          kubernetes.core.k8s:
            state: absent
            api_version: v1
            kind: Secret
            name: "test-win-sysprep-userdata"
            namespace: "osac-system"
          failed_when: false
