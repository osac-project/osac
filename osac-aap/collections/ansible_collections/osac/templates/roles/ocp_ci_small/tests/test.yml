---
- name: CI cluster deletion passes the correct node count to hosted-cluster teardown
  hosts: localhost
  gather_facts: false
  vars:
    cluster_order:
      metadata:
        name: test-cluster
      spec:
        nodeRequests:
          - nodeSet: workers
            numberOfNodes: 2
            bareMetal:
              instanceType: bm.large
    cluster_working_namespace: test-work
    ocp_release_image: example.test/release:latest
    template_parameters:
      pull_secret: test-secret
      ssh_public_key: ssh-rsa
    delete_step_hosted_cluster_override:
      name: osac.workflows.workflow_helpers
      tasks_from: noop.yml
    delete_step_cluster_infra_override:
      name: osac.workflows.workflow_helpers
      tasks_from: noop.yml
    delete_step_external_access_override:
      name: osac.workflows.workflow_helpers
      tasks_from: noop.yml
  tasks:
    - name: Run CI cluster delete without external calls
      ansible.builtin.include_role:
        name: osac.templates.ocp_ci_small
        tasks_from: delete.yaml

    - name: Verify CI delete uses cluster_infra and external_access normal entry points
      ansible.builtin.assert:
        that:
          - delete_step_cluster_infra_default is defined
          - delete_step_cluster_infra_default.name == "osac.service.cluster_infra"
          - delete_step_cluster_infra_default.tasks_from == "delete.yaml"
          - delete_step_external_access_default is defined
          - delete_step_external_access_default.name == "osac.service.external_access"
          - delete_step_external_access_default.tasks_from == "delete.yaml"
          - delete_step_cluster_network_default is not defined
