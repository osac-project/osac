argument_specs:
  main:
    options:
      finalizer_state:
        type: str
        required: true
        choices:
          - absent
          - present
      finalizer_name:
        type: str
        required: true
      finalizer_target:
        type: dict
        required: true
        options:
          api_version:
            type: str
            required: true
          kind:
            type: str
            required: true
          namespace:
            type: str
            required: false
          name:
            type: str
            required: true
      finalizer_kubeconfig:
        type: str
        required: false
        description: >-
          Kubeconfig of the cluster holding the target, for finalizers on
          infrastructure objects that live outside the hub. Unset, the calls
          use the in-cluster (or K8S_AUTH_KUBECONFIG) credentials, which is
          the behavior of every hub-side caller.
