columns:

- header: ID
  value: "this.id != '' ? this.id : '-'"

- header: NAME
  value: "this.metadata.name != '' ? this.metadata.name : '-'"

# Render canonical stored identities directly, without resolving live objects.
- header: TENANT
  value: "this.metadata.tenant != '' ? this.metadata.tenant : '-'"

- header: ACCOUNT
  value: "this.spec.billing_account.id != '' ? this.spec.billing_account.id : '-'"

- header: STATE
  value: "this.status.connection_state == 0 ? dyn('UNKNOWN') : dyn(this.status.connection_state)"
  type: osac.private.v1.TenantBillingAssignmentConnectionState

- header: EFFECTIVE-FROM
  value: "has(this.status.effective_from_timestamp) ? string(this.status.effective_from_timestamp) : '-'"

- header: EFFECTIVE-TO
  value: "has(this.status.effective_to_timestamp) ? string(this.status.effective_to_timestamp) : '-'"

# Replace C0/C1 controls only in table cells, retaining full remediation and tombstone text.
- header: MESSAGE
  value: >-
    this.status.message != '' ? this.status.message.split('').map(c,
      c < ' ' || (c >= '\u007f' && c <= '\u009f') ? ' ' : c).join('') : '-'
