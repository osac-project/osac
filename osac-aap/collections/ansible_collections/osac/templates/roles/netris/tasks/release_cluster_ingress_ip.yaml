---
# Releases the CaaS guest ingress address reserved for a Cluster. The delete
# succeeds when the reservation is already absent, including when the reserve
# never ran.

- name: Normalize task input
  ansible.builtin.include_tasks: _contract_input.yaml
  vars:
    _osac_task_name: release_cluster_ingress_ip

- name: Require the contract envelope
  ansible.builtin.assert:
    that:
      - _osac_contract | default(false) | bool
    fail_msg: >-
      release_cluster_ingress_ip is a CaaS contract task and requires
      osac_job_vars.

- name: Release the cluster ingress address
  block:
    - name: Ensure Netris auth
      ansible.builtin.include_role:
        name: netris.controller.auth
      when:
        - netris_session_cookie is not defined
        - not ansible_check_mode

    - name: Release the address in Netris IPAM
      osac.templates.netris_cluster_ingress:
        operation: cluster_ingress.release
        cluster_id: "{{ osac_job_vars.cluster_id | default('') }}"
        subnet: "{{ _osac_subnet }}"
        ipam: "{{ _osac_ipam }}"
        controller_url: "{{ netris_controller_url }}"
        session_cookie: "{{ netris_session_cookie | default('') }}"
        site_id: "{{ netris_site_id | int }}"
        tenant_id: "{{ netris_tenant_id | int }}"
        timeout: "{{ netris_timeout | default(30) }}"
        validate_certs: "{{ netris_validate_certs | default(true) }}"
        ca_path: "{{ netris_ca_path | default(omit, true) }}"
      register: _ci_result
  rescue:
    - name: Publish the sanitized release error
      ansible.builtin.include_tasks: _fail_task.yaml
      vars:
        _osac_error_message: >-
          {{ ansible_failed_result.msg
             | default('The Netris cluster ingress release failed') }}
        _osac_error_retryable: >-
          {{ ansible_failed_result.retryable | default(true) }}

    - name: Fail the release after publishing the error
      ansible.builtin.fail:
        msg: "{{ _osac_error_message }}"
