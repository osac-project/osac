apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1alpha1.console.osac.openshift.io
  annotations:
    # Namespace is hardcoded here; the Helm chart template overrides it
    # with {{ .Release.Namespace }}.
    cert-manager.io/inject-ca-from: osac/osac-console-proxy
spec:
  group: console.osac.openshift.io
  version: v1alpha1
  service:
    name: osac-console-proxy
    namespace: osac
  groupPriorityMinimum: 1000
  versionPriority: 15
