syntax = "proto3";

package osac.private.v1;

import "buf/validate/validate.proto";
import "cleanapi/cleanapi.proto";
import "google/api/field_behavior.proto";
import "osac/private/v1/metadata_type.proto";

option (cleanapi.file).package = "osac.public.v1";

// Lifecycle states for QuotaLimitRequest resources.
//
// A request starts PENDING. Approving it sets the requested limit for its tenant and dimension and
// moves it to APPROVED; denying it moves it to DENIED and changes no limit. Both are terminal: a
// new request replaces an old one.
enum QuotaLimitRequestState {
  // State is unknown or has not been determined yet.
  QUOTA_LIMIT_REQUEST_STATE_UNSPECIFIED = 0;

  // The request waits for a Cloud Provider Admin to approve or deny it.
  QUOTA_LIMIT_REQUEST_STATE_PENDING = 1;

  // The request was approved and its requested limit was set for the tenant and dimension.
  QUOTA_LIMIT_REQUEST_STATE_APPROVED = 2;

  // The request was denied. No limit changed.
  QUOTA_LIMIT_REQUEST_STATE_DENIED = 3;
}

// Represents a tenant's request to raise the limit of one quota dimension.
//
// A Tenant Admin creates a request for their tenant and a dimension with the value they need. One
// pending request exists per dimension per tenant. Approving the request sets a tenant override
// with the requested value, in the same transaction as the approval. The built-in `shared` and
// `system` tenants hold no quota state, so they cannot request limits.
message QuotaLimitRequest {
  // Unique identifier of the request.
  string id = 1;

  // Metadata of the request. The tenant is required and the project is always empty.
  Metadata metadata = 2;

  // Desired configuration of the request (user-specified).
  QuotaLimitRequestSpec spec = 3;

  // Current state of the request (system-provided, read-only).
  QuotaLimitRequestStatus status = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Defines the desired configuration for a QuotaLimitRequest.
message QuotaLimitRequestSpec {
  // The quota dimension whose limit the request raises, such as `compute.vcpus`. Required and
  // immutable after creation. When the `metadata.name` is omitted it is generated from the
  // dimension.
  string dimension = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE,
    (buf.validate.field).string = {min_len: 1, max_len: 256}
  ];

  // The limit value the tenant asks for. Immutable after creation; create a new request to ask
  // for a different value.
  int64 requested_value = 2 [(buf.validate.field).int64.gte = 0];
}

// Represents the current state of a QuotaLimitRequest.
message QuotaLimitRequestStatus {
  // The review state of the request. Set to PENDING on creation, changed only by Approve and
  // Deny.
  QuotaLimitRequestState state = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}
