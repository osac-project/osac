---
# ONTAP ensure_storage_class: per-backend TridentBackendConfig + per-tier
# StorageClasses on the target cluster.
#
# Per backend there is exactly ONE TridentBackendConfig (ontap-<assignment_key>,
# ontap-san driver, block-only) whose virtual pools carry per-tier labels
# (osac_backend, tier) and defaults (encryption, qosPolicy); per tier there is
# one StorageClass (ontap-<assignment_key>-<tier_key>) selecting its virtual
# pool via parameters.selector.
# The CSI Secret the TBC references is created in the Trident install
# namespace — Trident only reconciles TBCs and their credential Secrets there.

- name: Include shared tier validation
  ansible.builtin.include_tasks: _validate_tiers.yaml

- name: Compute the dispatched backend ids
  ansible.builtin.set_fact:
    _ontap_backend_ids: "{{ _provider_tiers | map(attribute='backend_id') | unique | list }}"

- name: Build expected StorageClass entries per tier
  ansible.builtin.set_fact:
    _ontap_expected_sc_entries: >-
      {% set entries = [] -%}
      {% for tier in _provider_tiers -%}
      {% set _key = ((tier.backend_id ~ '|' ~ tenant_name) | hash('sha256'))[:16] | lower -%}
      {% set _tier_key = (tier.name | hash('sha256'))[:16] | lower -%}
      {% set _ = entries.append({'name': 'ontap-' ~ _key ~ '-' ~ _tier_key, 'tier': tier.name}) -%}
      {% endfor -%}
      {{ entries }}
    _ontap_expected_sc_names: >-
      {% set names = [] -%}
      {% for tier in _provider_tiers -%}
      {% set _key = ((tier.backend_id ~ '|' ~ tenant_name) | hash('sha256'))[:16] | lower -%}
      {% set _tier_key = (tier.name | hash('sha256'))[:16] | lower -%}
      {% set _ = names.append('ontap-' ~ _key ~ '-' ~ _tier_key) -%}
      {% endfor -%}
      {{ names }}
  no_log: true

# Check if all tiers' StorageClasses already exist (single API call).
# Ownership and lifecycle checks in _ensure_storage_class_backend.yaml ALWAYS
# run before any short-circuit so a retained or foreign-claimed assignment is
# rejected even if StorageClasses are still present on the cluster.
- name: Check existing tenant StorageClasses
  kubernetes.core.k8s_info:
    api_version: storage.k8s.io/v1
    kind: StorageClass
    label_selectors:
      - "osac.openshift.io/tenant={{ tenant_name }}"
      - "osac.openshift.io/storage-provider=ontap"
      - "app.kubernetes.io/managed-by=osac-aap"
  register: _ontap_sc_checks
  no_log: true

- name: Determine if all StorageClasses already exist
  ansible.builtin.set_fact:
    _ontap_all_sc_exist: >-
      {{ (_ontap_expected_sc_names | difference(
            _ontap_sc_checks.resources | map(attribute='metadata.name') | list
          ) | length) == 0 }}

- name: Verify lifecycle records and provision TridentBackendConfig and StorageClasses
  block:
    # Pre-flight (only when provisioning is needed): since OSAC does not
    # install Trident, verify the TridentBackendConfig CRD exists on the target
    # cluster before attempting to create backend resources.
    - name: Verify TridentBackendConfig CRD is installed on the target cluster
      when: not (_ontap_all_sc_exist | bool)
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: tridentbackendconfigs.trident.netapp.io
      register: _trident_crd_check

    - name: Fail if Trident is not installed on the target cluster
      when:
        - not (_ontap_all_sc_exist | bool)
        - _trident_crd_check.resources | default([]) | length == 0
      ansible.builtin.fail:
        msg: >-
          TridentBackendConfig CRD (tridentbackendconfigs.trident.netapp.io) was
          not found on the target cluster. NetApp Trident must be pre-installed
          by the cluster administrator in namespace
          '{{ ontap_storage_trident_namespace }}' before onboarding ONTAP
          storage tiers.

    - name: Verify lifecycle ownership and provision per backend
      ansible.builtin.include_tasks: _ensure_storage_class_backend.yaml
      loop: "{{ _ontap_backend_ids }}"
      loop_control:
        loop_var: _ontap_backend_id

    - name: Log short-circuit when all StorageClasses already exist
      when: _ontap_all_sc_exist | bool
      ansible.builtin.debug:
        msg: "All {{ _ontap_expected_sc_names | length }} StorageClasses already exist and lifecycle ownership verified — skipping provisioning."

    - name: Set StorageClass names output (list)
      ansible.builtin.set_fact:
        storage_provider_storage_class_names: "{{ _ontap_expected_sc_entries }}"

  always:
    - name: Clear credential-bearing facts
      ansible.builtin.set_fact:
        _ontap_sc_checks: {}
        _trident_crd_check: {}
      no_log: true
