- name: Discover and publish templates to fulfillment service
  hosts: localhost
  gather_facts: false
  vars:
    osac_fulfillment_service_uri: "{{ lookup('env', 'OSAC_FULFILLMENT_SERVICE_URI', default='https://fulfillment-api:8000') }}"
    osac_template_collections: "{{ lookup('env', 'OSAC_TEMPLATE_COLLECTIONS') | default('osac.templates', true) | split(',') }}"
  tasks:
    - name: Display configuration values
      ansible.builtin.debug:
        msg:
          - "osac_fulfillment_service_uri: {{ osac_fulfillment_service_uri }}"
          - "osac_template_collections: {{ osac_template_collections }}"

    - name: Discover templates
      ansible.builtin.include_role:
        name: osac.service.enumerate_templates

    - name: Print cluster templates found.
      ansible.builtin.debug:
        var: osac_cluster_templates

    - name: Print ComputeInstance templates found.
      ansible.builtin.debug:
        var: osac_compute_instance_templates

    - name: Print BareMetalInstance templates found.
      ansible.builtin.debug:
        var: osac_bare_metal_instance_templates

    - name: Publish templates
      ansible.builtin.include_role:
        name: osac.service.publish_templates
