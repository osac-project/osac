syntax = "proto3";

package osac.public.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "osac/public/v1/billing_invoice_type.proto";

message BillingInvoicesListRequest {
  option (buf.validate.message).cel = {
    id: "billing_invoices_date_range"
    message: "from_date must be on or before to_date"
    expression: "!has(this.from_date) || !has(this.to_date) || this.from_date <= this.to_date"
  };

  // Target tenant for Cloud Provider Admin requests. Other callers are scoped to their own tenant.
  optional string tenant_id = 1 [(buf.validate.field).string = {min_len: 1}];
  // Optional inclusive invoice-date bounds in YYYY-MM-DD format.
  optional string from_date = 2 [(buf.validate.field).string = {pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"}];
  optional string to_date = 3 [(buf.validate.field).string = {pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"}];
  optional int32 offset = 4 [(buf.validate.field).int32.gte = 0];
  optional int32 limit = 5 [(buf.validate.field).int32 = {gte: 1, lte: 100}];
}

message BillingInvoicesListResponse {
  int32 size = 1;
  int32 total = 2;
  repeated BillingInvoice items = 3;
}

message BillingInvoicesGetRequest {
  // Target tenant for Cloud Provider Admin requests. Other callers are scoped to their own tenant.
  optional string tenant_id = 1 [(buf.validate.field).string = {min_len: 1}];
  // Stable OSAC invoice identifier returned by List (the invoice number).
  string id = 2 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
}

message BillingInvoicesGetResponse {
  BillingInvoice object = 1;
}

service BillingInvoices {
  // Lists past invoices for the caller's authorized tenant.
  rpc List(BillingInvoicesListRequest) returns (BillingInvoicesListResponse) {
    option (google.api.http) = {get: "/api/fulfillment/v1/billing/invoices"};
  }

  // Retrieves one invoice and its itemized charges by OSAC invoice identifier.
  rpc Get(BillingInvoicesGetRequest) returns (BillingInvoicesGetResponse) {
    option (google.api.http) = {
      get: "/api/fulfillment/v1/billing/invoices/{id}"
      response_body: "object"
    };
  }
}
