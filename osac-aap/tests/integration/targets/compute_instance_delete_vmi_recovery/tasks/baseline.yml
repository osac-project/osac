                }}-load-balancer
            - api: cdi.kubevirt.io/v1beta1
              kind: DataVolume
              name: >-
                {{ compute_instance_name
                }}-root-disk
            - api: v1
              kind: Secret
              name: >-
                {{ compute_instance_name
