syntax = "proto3";

package osac.private.v1;

import "buf/validate/validate.proto";
import "cleanapi/cleanapi.proto";

option (cleanapi.file).package = "osac.public.v1";

// BillingInvoice is a provider-neutral read-only view of an invoice.
// buf:lint:ignore OSAC_OBJECT_SHAPE
message BillingInvoice {
  // Stable OSAC identifier. It is the invoice number, not the provider's record ID.
  string id = 1 [(buf.validate.field).string = {min_len: 1}];

  string invoice_number = 2;
  string invoice_date = 3;
  string status = 4;
  string type = 5;
  string amount = 6;
  string tax_amount = 7;
  string balance = 8;
  string currency_code = 9;
  string due_date = 10;
  string period_start = 11;
  string period_end = 12;
  string payment_status = 13;
  string approval_status = 14;

  // Present on Get responses; list responses contain invoice headers only.
  repeated BillingInvoiceLineItem items = 15;
}

// BillingInvoiceLineItem is one itemized charge from a provider invoice.
// buf:lint:ignore OSAC_OBJECT_SHAPE
message BillingInvoiceLineItem {
  string description = 1;
  string service_name = 2;
  string service_code = 3;
  string volume = 4;
  string rate_per_unit = 5;
  string amount = 6;
  string tax_amount = 7;
  string balance = 8;
  string charge_type = 9;
  string price_method = 10;
  string period_start = 11;
  string period_end = 12;
  string currency_code = 13;
}
