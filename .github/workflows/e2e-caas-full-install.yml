---
name: E2E CaaS Full Install

permissions:
  contents: read

on:
  workflow_call:
  schedule:
    - cron: "38 0,2,5,7,10,12,14,17,19,22 * * *"
  workflow_dispatch:
    inputs:
      test-suite:
        description: "Test suite (caas, or empty for all)"
        required: false
        default: "caas"
      test-filter:
        description: "pytest -k filter"
        required: false
        default: ""
      test-infra-ref:
        description: "Branch/ref of osac-test-infra"
        required: false
        default: "main"

jobs:
  e2e-caas-full-install:
    uses: osac-project/osac-test-infra/.github/workflows/e2e-caas-full-install.yml@main
    with:
      test-suite: ${{ inputs.test-suite || 'caas' }}
      test-filter: ${{ inputs.test-filter || '' }}
      installer-repo: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      installer-ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      components: '[{"repo":"${{ github.event.pull_request.head.repo.full_name || github.repository }}","ref":"${{ github.event.pull_request.head.ref || github.ref_name }}","containerfile":"fulfillment-service/Containerfile","context":".","imageKey":"service.images.service"},{"repo":"${{ github.event.pull_request.head.repo.full_name || github.repository }}","ref":"${{ github.event.pull_request.head.ref || github.ref_name }}","containerfile":"osac-operator/Containerfile","context":".","imageKey":"operator.image.repository"},{"repo":"${{ github.event.pull_request.head.repo.full_name || github.repository }}","ref":"${{ github.event.pull_request.head.ref || github.ref_name }}","containerfile":"osac-aap/execution-environment/execution-environment.yaml","imageKey":"aap.bootstrap.image","buildType":"ansible-builder"},{"repo":"${{ github.event.pull_request.head.repo.full_name || github.repository }}","ref":"${{ github.event.pull_request.head.ref || github.ref_name }}","containerfile":"osac-aap/execution-environment/execution-environment.yaml","imageKey":"aap.configAsCode.eeImage","buildType":"ansible-builder"},{"repo":"${{ github.event.pull_request.head.repo.full_name || github.repository }}","ref":"${{ github.event.pull_request.head.ref || github.ref_name }}","containerfile":"bare-metal-fulfillment-operator/Containerfile","context":".","imageKey":"bmf.image.repository"},{"repo":"${{ github.event.pull_request.head.repo.full_name || github.repository }}","ref":"${{ github.event.pull_request.head.ref || github.ref_name }}","containerfile":"osac-metering/metering-service/Containerfile","imageKey":"metering.image.repository"},{"repo":"${{ github.event.pull_request.head.repo.full_name || github.repository }}","ref":"${{ github.event.pull_request.head.ref || github.ref_name }}","containerfile":"osac-csi-driver/Containerfile","context":".","imageKey":"csiDriver.image.repository"}]'
      fork-pr-author-association: ${{ github.event.pull_request.head.repo.fork && github.event.pull_request.author_association || '' }}
      fork-pr-author: ${{ github.event.pull_request.head.repo.fork && github.event.pull_request.user.login || '' }}
      pr-number: ${{ github.event.pull_request.number }}
      test-infra-repository: osac-project/osac-test-infra
      test-infra-ref: ${{ inputs.test-infra-ref || 'main' }}
