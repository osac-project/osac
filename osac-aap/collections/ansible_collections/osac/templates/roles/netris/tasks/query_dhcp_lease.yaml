---
# Query DHCP leases for a network attachment against IPAM host entries in
# the target subnet. Bare-metal hosts are matched by NIC MAC address (they
# are not registered as named fabric servers); named fabric servers (e.g.
# CaaS agents) fall back to matching by server name.
#
# Input: network_attachment dict with host_name, logical_interface_name,
#        subnet_ref. The subnet-ref → MAC map is supplied by the operator as
#        osac_job_vars.network_attachment_macs.
# Output: accumulates one entry per attachment into the _dhcp_leases fact,
#         which the playbook publishes as the job's leases artifact.

- name: Normalize task input
  ansible.builtin.include_tasks: _contract_input.yaml
  vars:
    _osac_task_name: query_dhcp_lease

- name: Extract network attachment configuration
  ansible.builtin.set_fact:
    _dq_host_name: >-
      {{ _osac_target.host_name | default('')
         if _osac_contract | default(false) | bool
         else network_attachment.host_name | default('') }}
    _dq_subnet_ref: >-
      {{ _osac_subnet.id | default('')
         if _osac_contract | default(false) | bool
         else network_attachment.subnet_ref | default('') }}
    _dq_interface: >-
      {{ _osac_interface.name | default('')
         if _osac_contract | default(false) | bool
         else network_attachment.logical_interface_name | default('') }}

- name: Set the Subnet name from the supplied snapshot
  ansible.builtin.set_fact:
    _dq_subnet_name: "{{ subnet.metadata.name }}"
  when: _osac_contract | default(false) | bool

- name: Look up Subnet CR by UUID label
  kubernetes.core.k8s_info:
    api_version: osac.openshift.io/v1alpha1
    kind: Subnet
    label_selectors:
      - "osac.openshift.io/subnet-uuid={{ _dq_subnet_ref }}"
  register: _dq_subnet_lookup
  when: not _osac_contract | default(false) | bool

- name: Fail if Subnet CR not found
  ansible.builtin.fail:
    msg: >-
      Subnet with UUID '{{ _dq_subnet_ref }}' not found.
  when: >-
    not _osac_contract | default(false) | bool
    and _dq_subnet_lookup.resources | length == 0

- name: Set subnet name
  ansible.builtin.set_fact:
    _dq_subnet_name: "{{ _dq_subnet_lookup.resources[0].metadata.name }}"
  when: not _osac_contract | default(false) | bool

- name: Display DHCP lease query parameters
  ansible.builtin.debug:
    msg:
      - "Querying DHCP lease for host '{{ _dq_host_name }}'"
      - "Subnet: {{ _dq_subnet_name }} (UUID: {{ _dq_subnet_ref }})"

# Provider failures use the shared HTTP/transport classifier. Only lease
# acceptance forces a retry, since a booting host or stale DHCP state can settle.
- name: Query the provider for active DHCP leases
  block:
    - name: Find IPAM subnet by name
      ansible.builtin.include_role:
        name: netris.controller.ipam
        tasks_from: read_subnets
      vars:
        ipam_subnet_name: "{{ _dq_subnet_name }}"

    - name: Set IPAM subnet reference
      ansible.builtin.set_fact:
        _dq_ipam_subnet: "{{ netris_ipam_subnet }}"

    - name: Fail if IPAM subnet not found
      ansible.builtin.fail:
        msg: >-
          IPAM subnet '{{ _dq_subnet_name }}' not found in Netris controller.
      when: _dq_ipam_subnet is none

    - name: Query IPAM hosts for subnet
      ansible.builtin.include_role:
        name: netris.controller.ipam
        tasks_from: read_hosts
      vars:
        ipam_subnet_id: "{{ _dq_ipam_subnet.id }}"

    # The operator supplies the NIC MAC per subnet-ref. Netris stores lease
    # MACs lowercase (sourced from the DHCP request), so normalise for
    # comparison.
    - name: Determine expected MAC for this attachment
      ansible.builtin.set_fact:
        _dq_mac: >-
          {{ (_osac_interface.mac_address | default('') | lower)
             if _osac_contract | default(false) | bool
             else (((osac_job_vars.network_attachment_macs | default({}))[_dq_subnet_ref]
                    | default('')) | lower) }}

    # A Netris IPAM host's `mac` is a list of dicts
    # ([{address, source, state, ...}]). Only a DHCP-sourced active binding
    # is a lease: a MAC match alone also covers inactive history and
    # reservation-only records, which contract 4.10 does not accept.
    - name: Find the active DHCP leases matching the attachment MAC
      ansible.builtin.set_fact:
        _dq_lease_addresses: >-
          {{ (netris_ipam_hosts | default([]))
             | map('netris.controller.netris_active_dhcp_addresses', _dq_mac)
             | flatten | unique | list }}
  rescue:
    - name: Publish the sanitized DHCP provider error and fail
      ansible.builtin.include_tasks: _contract_rescue.yaml
      vars:
        _osac_error_label: DHCP provider query

- name: Require exactly one active DHCP lease
  block:
    - name: Fail if no active DHCP lease was found yet
      ansible.builtin.fail:
        msg: >-
          No active DHCP lease found for host '{{ _dq_host_name }}'
          (interface '{{ _dq_interface }}', mac '{{ _dq_mac }}')
          in subnet '{{ _dq_subnet_name }}'.
          The server may not have booted yet or DHCP has not assigned a lease.
      when: _dq_lease_addresses | length == 0

    - name: Fail on more than one active DHCP lease for the MAC
      ansible.builtin.fail:
        msg: >-
          Expected exactly one active DHCP lease for mac '{{ _dq_mac }}' in
          subnet '{{ _dq_subnet_name }}', found {{ _dq_lease_addresses | length }}.
      when: _dq_lease_addresses | length > 1

    - name: Set discovered IP address
      ansible.builtin.set_fact:
        discovered_ip_address: "{{ _dq_lease_addresses | first | default('') }}"
  rescue:
    - name: Publish the sanitized DHCP lease error and fail
      ansible.builtin.include_tasks: _contract_rescue.yaml
      vars:
        _osac_error_label: DHCP lease query
        _osac_error_retryable_default: true

# Accumulate across the playbook's per-attachment loop; the playbook publishes
# the aggregated list once as the job's leases artifact. Keys match the
# operator's DHCPLease struct (subnet_ref, interface, ip_address, mac_address).
- name: Accumulate discovered lease for this attachment
  ansible.builtin.set_fact:
    _dhcp_leases: >-
      {{ (_dhcp_leases | default([])) + [{
           'subnet_ref': _dq_subnet_ref,
           'interface': _dq_interface,
           'ip_address': discovered_ip_address,
           'mac_address': _dq_mac,
         }] }}

- name: Build the typed lease result
  ansible.builtin.set_fact:
    _osac_result_data: >-
      {{ {'dhcp_lease': {'ip_address': discovered_ip_address,
                         'mac_address': _dq_mac}} }}
  when: _osac_contract | default(false) | bool

- name: Emit the typed lease result
  ansible.builtin.include_tasks: _emit_result.yaml
  when: _osac_contract | default(false) | bool

- name: Display DHCP lease query result
  ansible.builtin.debug:
    msg: "DHCP lease found: host '{{ _dq_host_name }}' → IP '{{ discovered_ip_address }}' in subnet '{{ _dq_subnet_name }}'"
