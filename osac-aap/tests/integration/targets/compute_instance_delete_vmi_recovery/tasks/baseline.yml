      spec: {}
    # Override production default (60) to avoid 5-min wait.
    ocp_virt_vm_graceful_wait_retries: 2
  tasks:
    - name: "S4: Run test with cleanup"
      block:
        - name: "S4: Clean up previous resources"
          kubernetes.core.k8s:
            state: absent
            api_version: "{{ item.api }}"
            kind: "{{ item.kind }}"
            name: "{{ item.name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
          loop:
            - api: kubevirt.io/v1
              kind: VirtualMachine
              name: "{{ compute_instance_name }}"
            - api: kubevirt.io/v1
              kind: VirtualMachineInstance
              name: "{{ compute_instance_name }}"
            - api: v1
              kind: Pod
              name: >-
                virt-launcher-{{
                compute_instance_name }}
          failed_when: false

        - name: "S4: Create stuck VMI"
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: kubevirt.io/v1
              kind: VirtualMachineInstance
              metadata:
                name: "{{ compute_instance_name }}"
                namespace: >-
                  {{
                  compute_instance_target_namespace
                  }}
                finalizers:
                  - kubevirt.io/foregroundDeleteVirtualMachine
              spec:
                domain:
                  devices: {}
                  resources:
                    requests:
                      memory: 128Mi

        - name: "S4: Request VMI deletion"
          kubernetes.core.k8s:
            state: absent
            api_version: kubevirt.io/v1
            kind: VirtualMachineInstance
            name: "{{ compute_instance_name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
          register: s4_delete_result
          failed_when: false

        - name: "S4: Capture VMI UID for launcher labels"
          kubernetes.core.k8s_info:
            api_version: kubevirt.io/v1
            kind: VirtualMachineInstance
            name: "{{ compute_instance_name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
          register: s4_vmi_check

        - name: "S4: Set VMI UID fact"
          ansible.builtin.set_fact:
            _s4_vmi_uid: >-
              {{ s4_vmi_check.resources[0]
                 .metadata.uid }}

        - name: "S4: Create Running launcher pod"
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Pod
              metadata:
                name: >-
                  virt-launcher-{{
                  compute_instance_name }}
                namespace: >-
                  {{
                  compute_instance_target_namespace
                  }}
                ownerReferences:
                  - apiVersion: kubevirt.io/v1
                    kind: VirtualMachineInstance
                    name: >-
                      {{ compute_instance_name }}
                    uid: "{{ _s4_vmi_uid }}"
                    controller: true
                    blockOwnerDeletion: true
                labels:
                  kubevirt.io: virt-launcher
                  kubevirt.io/created-by: >-
                    {{ _s4_vmi_uid }}
                annotations:
                  kubevirt.io/domain: >-
                    {{ compute_instance_name }}
              spec:
                restartPolicy: Never
                containers:
                  - name: compute
                    image: >-
                      registry.k8s.io/pause:3.9

        - name: "S4: Wait for launcher Running"
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Pod
            name: >-
              virt-launcher-{{
              compute_instance_name }}
            namespace: >-
              {{ compute_instance_target_namespace }}
          register: s4_launcher_wait
          until: >
            s4_launcher_wait.resources | length > 0 and
            (s4_launcher_wait.resources[0].status.phase
            | default('')) == 'Running'
          retries: 30
          delay: 2

        - name: "S4: Create minimal VM fixture"
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: kubevirt.io/v1
              kind: VirtualMachine
              metadata:
                name: "{{ compute_instance_name }}"
                namespace: >-
                  {{
                  compute_instance_target_namespace
                  }}
              spec:
                runStrategy: Always
                template:
                  spec:
                    domain:
                      devices: {}
                      resources:
                        requests:
                          memory: 128Mi

        - name: "S4: Expect delete_resources to fail"
          block:
            - name: "S4: Run delete_resources"
              ansible.builtin.include_role:
                name: osac.templates.ocp_virt_vm
                tasks_from: delete_resources.yaml

            - name: "S4: Record unexpected success"
              ansible.builtin.set_fact:
                _s4_unexpected_success: true

          rescue:
            - name: >-
                S4: Assert failure is from launcher
                guard
              ansible.builtin.assert:
                that:
                  - >-
                    'VMI-owned pods are still in phase'
                    in (ansible_failed_result.msg
                        | default(''))
                fail_msg: >-
                  delete_resources failed for an
                  unexpected reason:
                  {{ ansible_failed_result.msg
                     | default('unknown') }}

        - name: >-
            S4: Assert delete_resources did not succeed
          ansible.builtin.assert:
            that:
              - >-
                _s4_unexpected_success is not defined
            fail_msg: >-
              delete_resources should have failed when
              the launcher is still Running.

        - name: "S4: Verify VMI still exists"
          kubernetes.core.k8s_info:
            api_version: kubevirt.io/v1
            kind: VirtualMachineInstance
            name: "{{ compute_instance_name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
          register: s4_vmi_after
          failed_when: >-
            s4_vmi_after.resources | length == 0

        - name: "S4: Assert data preserved"
          ansible.builtin.debug:
            msg: >-
              Scenario 4 passed: recovery correctly
              refused when launcher is still running,
              VMI preserved.

      always:
        # Remove the foreground-delete finalizer so the
        # subsequent grace-period-0 delete completes
        # instead of leaving a terminating VMI that
        # blocks reruns.
        - name: "S4: Read VMI for finalizer removal"
          kubernetes.core.k8s_info:
            api_version: kubevirt.io/v1
            kind: VirtualMachineInstance
            name: "{{ compute_instance_name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
          register: _s4_cleanup_vmi
          failed_when: false

        - name: >-
            S4: Remove foreground-delete finalizer
            for cleanup
          vars:
            _s4_fins: >-
              {{ _s4_cleanup_vmi.resources[0]
                 .metadata.finalizers
                 | default([]) }}
            _s4_target: >-
              kubevirt.io/foregroundDeleteVirtualMachine
          kubernetes.core.k8s_json_patch:
            api_version: kubevirt.io/v1
            kind: VirtualMachineInstance
            name: "{{ compute_instance_name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
            patch:
              - op: test
                path: /metadata/finalizers
                value: "{{ _s4_fins }}"
              - op: replace
                path: /metadata/finalizers
                value: >-
                  {{ _s4_fins
                     | difference([_s4_target]) }}
          when: >-
            _s4_cleanup_vmi.resources | length > 0
            and
            'kubevirt.io/foregroundDeleteVirtualMachine'
            in (_s4_cleanup_vmi.resources[0]
                .metadata.finalizers | default([]))
          failed_when: false

        - name: "S4: Cleanup"
          kubernetes.core.k8s:
            state: absent
            api_version: "{{ item.api }}"
            kind: "{{ item.kind }}"
            name: "{{ item.name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
            delete_options:
              gracePeriodSeconds: 0
          loop:
            - api: kubevirt.io/v1
              kind: VirtualMachine
              name: "{{ compute_instance_name }}"
            - api: kubevirt.io/v1
              kind: VirtualMachineInstance
              name: "{{ compute_instance_name }}"
            - api: v1
              kind: Pod
              name: >-
                virt-launcher-{{
                compute_instance_name }}
          failed_when: false

