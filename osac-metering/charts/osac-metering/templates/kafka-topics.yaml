{{- /*
The shared MaaS inference topic and its dead-letter topic. The metering
design keeps MaaS metered separately from the per-tenant heartbeat
pipeline: inference usage events land on this one shared topic and the
provider adapters read it alongside every tenant's heartbeat topic.
Records the provider rejects land on the inference dead-letter topic;
like the per-tenant dead-letter topics, it is never consumed back. The
per-tenant event topics are created by fulfillment's event publisher, and
the per-tenant heartbeat and dead-letter topics by metering itself, not
here.
*/}}
{{- $ns := include "osac-metering.kafkaClusterNamespace" . -}}
{{- $cluster := include "osac-metering.kafkaClusterName" . -}}
{{- $replicas := include "osac-metering.kafkaReplicas" . | int -}}
{{- $minIsr := min $replicas 2 -}}
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: osac.metering.inference
  namespace: {{ $ns }}
  labels:
    strimzi.io/cluster: {{ $cluster }}
spec:
  partitions: 3
  replicas: {{ $replicas }}
  config:
    retention.ms: "{{ mul 30 86400000 }}"
    min.insync.replicas: "{{ $minIsr }}"
    cleanup.policy: delete
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: osac.metering.inference.dlq
  namespace: {{ $ns }}
  labels:
    strimzi.io/cluster: {{ $cluster }}
spec:
  partitions: 3
  replicas: {{ $replicas }}
  config:
    retention.ms: "{{ mul 30 86400000 }}"
    min.insync.replicas: "{{ $minIsr }}"
    cleanup.policy: delete
