---
# ONTAP-specific defaults — all use netapp_storage_ prefix.

# Namespace where Trident is installed on the target hosting cluster.
# The TridentBackendConfig CRD is namespaced and Trident only reconciles TBCs
# (and their credentials Secrets) in its own install namespace, so both the
# CSI Secret and the TBC must live here. Configurable via NETAPP_TRIDENT_NAMESPACE.
netapp_storage_trident_namespace: "{{ lookup('env', 'NETAPP_TRIDENT_NAMESPACE') | default('trident', true) }}"

# SAN transport for the ontap-san driver. Valid values: iscsi, fcp, nvme.
# Must match what the prepared SVM's LIFs actually carry; Trident validates
# the value against its own allowlist. Configurable via NETAPP_SAN_TYPE.
netapp_storage_san_type: "{{ lookup('env', 'NETAPP_SAN_TYPE') | default('fcp', true) }}"

# Path to the cluster-installed PEM CA bundle. When present and
# netapp_storage_validate_certs is true, used to populate
# TridentBackendConfig.spec.trustedCACertificate. Configurable via NETAPP_CA_BUNDLE_PATH.
netapp_storage_ca_bundle_path: "{{ lookup('env', 'NETAPP_CA_BUNDLE_PATH') | default('/etc/ca-bundle/bundle.pem', true) }}"

# Keep TLS certificate verification enabled unless NETAPP_VALIDATE_CERTS is
# explicitly set to "false" (e.g. for a lab ONTAP endpoint with a self-signed
# or expired certificate). Blank or malformed values fail closed to true.
# When false, trustedCACertificate is omitted from the TridentBackendConfig.
netapp_storage_validate_certs: >-
  {{ (lookup('env', 'NETAPP_VALIDATE_CERTS')
      | default('true', true) | lower | trim) != 'false' }}
