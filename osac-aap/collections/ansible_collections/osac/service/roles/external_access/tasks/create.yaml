---
- name: Validate the network steps collection
  ansible.builtin.assert:
    that:
      - network_steps_collection | default('') | length > 0
    fail_msg: >-
      NETWORK_STEPS_COLLECTION must identify the network steps collection for
      the generic external-access flow.

- name: Include network-class-specific external access create tasks
  ansible.builtin.include_role:
    name: "{{ network_steps_collection }}.external_access"
    tasks_from: create.yaml

- name: Publish backend endpoint addresses
  ansible.builtin.include_tasks: publish.yaml
