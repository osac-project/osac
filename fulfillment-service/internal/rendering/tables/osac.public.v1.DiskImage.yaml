columns:

- header: NAME
  value: this.id

- header: SOURCE_REF
  value: this.spec.source_ref

- header: GUEST_OS_FAMILY
  value: this.spec.guest_os_family
  type: osac.public.v1.GuestOSFamily

- header: ARCHITECTURE
  value: this.spec.architecture

- header: LIFECYCLE
  value: this.spec.lifecycle
  type: osac.public.v1.DiskImageLifecycle

- header: TENANT
  value: "has(this.metadata.tenant)? this.metadata.tenant: '-'"
