{{- $fulfillment := .Values.controller.fulfillment -}}
{{- $endpoint := $fulfillment.endpoint | default "" -}}
{{- $issuerURL := $fulfillment.issuerUrl | default "" -}}
{{- $configMapName := $fulfillment.configMap.name | default "" -}}
{{- $secretName := $fulfillment.credentials.secretName | default "" -}}
{{- if and $configMapName (or $endpoint $issuerURL) -}}
{{- fail "controller.fulfillment.configMap cannot be combined with direct endpoint or issuerUrl values" -}}
{{- end -}}
{{- if and (or $endpoint $issuerURL) (not (and $endpoint $issuerURL)) -}}
{{- fail "controller.fulfillment.endpoint and issuerUrl must be provided together" -}}
{{- end -}}
{{- if and $secretName (not (or $configMapName (and $endpoint $issuerURL))) -}}
{{- fail "controller.fulfillment.credentials.secretName requires fulfillment configuration" -}}
{{- end -}}
{{- if and (or $configMapName (and $endpoint $issuerURL)) (not $secretName) -}}
{{- fail "controller.fulfillment.credentials.secretName is required when fulfillment is configured" -}}
{{- end -}}
{{- if and (not $configMapName) (not $endpoint) (not $issuerURL) (not $fulfillment.allowStub) -}}
{{- fail "fulfillment configuration is required when controller.fulfillment.allowStub is false" -}}
{{- end -}}
{{- $configured := or $configMapName (and $endpoint $issuerURL) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "csi-driver.fullname" . }}-controller
  namespace: {{ include "csi-driver.namespace" . }}
  labels:
    {{- include "csi-driver.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      {{- include "csi-driver.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        {{- include "csi-driver.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: {{ include "csi-driver.controllerServiceAccountName" . }}
      containers:
        - name: osac-csi-driver
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--csi-endpoint=unix:///csi/osac/csi.sock"
            - "--node-id=controller"
            {{- if .Values.controller.clusterID }}
            - "--cluster-id={{ .Values.controller.clusterID }}"
            {{- end }}
            {{- if $configMapName }}
            - "--fulfillment-endpoint=$(OSAC_FULFILLMENT_ENDPOINT)"
            - "--fulfillment-issuer-url=$(OSAC_FULFILLMENT_ISSUER_URL)"
            {{- else if and $endpoint $issuerURL }}
            - "--fulfillment-endpoint={{ $endpoint }}"
            - "--fulfillment-issuer-url={{ $issuerURL }}"
            {{- end }}
            {{- if $configured }}
            - "--fulfillment-client-id=$(FULFILLMENT_CLIENT_ID)"
            - "--fulfillment-client-secret-file=/etc/osac-csi/credentials/client-secret"
            {{- if $fulfillment.tls.insecureSkipVerify }}
            - "--grpc-insecure"
            {{- end }}
            {{- end }}
            {{- if $fulfillment.allowStub }}
            - "--allow-stub"
            {{- end }}
            {{- if .Values.controller.vendorSockets }}
            - "--vendor-sockets={{ .Values.controller.vendorSockets }}"
            {{- end }}
            {{- if .Values.controller.vendorControllers }}
            - "--vendor-controllers={{ .Values.controller.vendorControllers }}"
            {{- end }}
            - "--v=2"
          {{- if $configured }}
          env:
            {{- if $configMapName }}
            - name: OSAC_FULFILLMENT_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: {{ $configMapName }}
                  key: {{ $fulfillment.configMap.endpointKey }}
                  optional: false
            - name: OSAC_FULFILLMENT_ISSUER_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ $configMapName }}
                  key: {{ $fulfillment.configMap.issuerUrlKey }}
                  optional: false
            {{- end }}
            - name: FULFILLMENT_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ $fulfillment.credentials.clientIdKey }}
          {{- end }}
          volumeMounts:
            - name: osac-socket-dir
              mountPath: /csi/osac
            {{- if $configured }}
            - name: fulfillment-credentials
              mountPath: /etc/osac-csi/credentials
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

        - name: csi-provisioner
          image: "{{ .Values.sidecars.provisioner.image.repository }}:{{ .Values.sidecars.provisioner.image.tag }}"
          args:
            - "--csi-address=/csi/osac/csi.sock"
            - "--leader-election={{ .Values.controller.leaderElection }}"
            - "--extra-create-metadata"
            - "--timeout=120s"
            - "--v=2"
          volumeMounts:
            - name: osac-socket-dir
              mountPath: /csi/osac
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

        - name: csi-attacher
          image: "{{ .Values.sidecars.attacher.image.repository }}:{{ .Values.sidecars.attacher.image.tag }}"
          args:
            - "--csi-address=/csi/osac/csi.sock"
            - "--leader-election={{ .Values.controller.leaderElection }}"
            - "--v=2"
          volumeMounts:
            - name: osac-socket-dir
              mountPath: /csi/osac
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

      volumes:
        - name: osac-socket-dir
          emptyDir: {}
        {{- if $configured }}
        - name: fulfillment-credentials
          secret:
            secretName: {{ $secretName }}
            items:
              - key: {{ $fulfillment.credentials.clientSecretKey }}
                path: client-secret
        {{- end }}
