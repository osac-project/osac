name: Setup Go
description: Install and Go and Ginkgo
inputs:
  working-directory:
    description: Directory containing go.mod (composite action steps don't inherit a calling job's defaults.run.working-directory)
    required: false
    default: '.'
runs:
  using: composite
  steps:
  - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
    with:
      go-version: '1.26.3'
      # Without this, setup-go looks for go.sum at the repo root by
      # default -- this is a mono-repo, every component's go.sum lives in
      # its own subdirectory, so the built-in module cache silently never
      # hit ("Restore cache failed: Dependencies file is not found").
      cache-dependency-path: ${{ inputs.working-directory }}/go.sum
  - name: Download Go modules
    shell: bash
    working-directory: ${{ inputs.working-directory }}
    run: |
      for i in 1 2 3; do
        go mod download && exit 0
        if [ "$i" -lt 3 ]; then
          echo "::warning::go mod download attempt $i/3 failed, retrying in 10s..."
          sleep 10
        fi
      done
      echo "::error::go mod download failed after 3 attempts"
      exit 1
  - id: ginkgo-cache
    uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
    with:
      key: ginkgo-${{ hashFiles(format('{0}/go.mod', inputs.working-directory)) }}
      path: ~/go/bin/ginkgo
  - if: steps.ginkgo-cache.outputs.cache-hit != 'true'
    shell: bash
    working-directory: ${{ inputs.working-directory }}
    run: |
      module="github.com/onsi/ginkgo/v2"
      version=$(go list -f '{{ .Version }}' -m "${module}")
      go install "${module}/ginkgo@${version}"
