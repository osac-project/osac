name: Check generated code

on:
# No paths: required names "Check generated code (fulfillment-service)",
# "(osac-operator)", and "(osac-metering/metering-service)" must report on
# every PR. Skip is on job steps (dorny + should-run). A trigger path filter
# leaves those names pending forever on PRs that only touch other components.
  pull_request:
    branches:
      - main
  merge_group:

permissions:
  contents: read

jobs:

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changes: ${{ steps.filter.outputs.changes || '[]' }}
    steps:
      # dorny/paths-filter uses git diff on merge_group (not the PR Files API),
      # so the repo must be checked out with enough history for base..head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.event_name == 'merge_group'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            fulfillment-service:
              - 'fulfillment-service/**'
              - '!fulfillment-service/OWNERS'
              - '!fulfillment-service/LICENSE'
              - '!fulfillment-service/**/*.md'
              - '!fulfillment-service/docs/**'
              - '!fulfillment-service/.claude/**'
            osac-operator:
              # buf.gen.yaml reads ../fulfillment-service/proto/private
              - '{osac-operator,fulfillment-service/proto/private}/**'
              - '!osac-operator/OWNERS'
              - '!osac-operator/LICENSE'
              - '!osac-operator/**/*.md'
              - '!osac-operator/docs/**'
              - '!osac-operator/.claude/**'
              - 'fulfillment-service/proto/private/**'
            osac-metering/metering-service:
              - '{osac-metering/metering-service,fulfillment-service/proto/private}/**'
              - '!osac-metering/metering-service/OWNERS'
              - '!osac-metering/metering-service/LICENSE'
              - '!osac-metering/metering-service/**/*.md'
              - '!osac-metering/metering-service/docs/**'
              - '!osac-metering/metering-service/.claude/**'
              - 'fulfillment-service/proto/private/**'

  # Job id renamed from `check-generated-code` (its `name:` below, which is
  # what shows on PRs, is unchanged) to free that bare id up for the
  # aggregate gate job below.
  check-generated-code-matrix:
    name: Check generated code (${{ matrix.component }})
    needs: changes
    # Run even if `changes` failed: a skipped job reports success, which would
    # let required checks pass without buf generate. Fail in the first step.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Fixed list so all required names always exist. Skip is on steps
        # (`matrix` is not valid in a job-level `if:`).
        component:
          - fulfillment-service
          - osac-operator
          - osac-metering/metering-service
    steps:
    - name: Fail if path filter failed
      if: needs.changes.result != 'success'
      run: exit 1
    - id: should-run
      if: needs.changes.result == 'success' && contains(fromJSON(needs.changes.outputs.changes), matrix.component)
      run: echo "run=true" >> "$GITHUB_OUTPUT"
    - if: steps.should-run.outputs.run
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - if: steps.should-run.outputs.run
      uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3  # v1
      with:
        version: '1.50.0'
        setup_only: true
    - if: steps.should-run.outputs.run && matrix.component == 'fulfillment-service'
      name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: auto
        version: "latest-known"
    - if: steps.should-run.outputs.run && matrix.component == 'fulfillment-service'
      name: Install protoc
      run: |
        # Install protoc for the public proto generation step
        sudo apt-get update -qq
        sudo apt-get install -qq -y protobuf-compiler
    - if: steps.should-run.outputs.run && matrix.component == 'fulfillment-service'
      name: Generate public protos from private
      working-directory: fulfillment-service
      run: uv run dev.py build protos
    - if: steps.should-run.outputs.run
      name: Generate Go code from protos
      working-directory: ${{ matrix.component }}
      run: buf generate
    - if: steps.should-run.outputs.run
      name: Check for uncommitted changes
      working-directory: ${{ matrix.component }}
      run: |
        if ! git diff --exit-code -- . || [ -n "$(git ls-files --others --exclude-standard -- .)" ]; then
          if [ "${{ matrix.component }}" = "fulfillment-service" ]; then
            echo "::error::Generated code is out of date. Run 'uv run dev.py build protos && buf generate' in fulfillment-service/ and commit the changes."
          else
            echo "::error::Generated code is out of date. Run 'buf generate' in ${{ matrix.component }}/ and commit the changes."
          fi
          exit 1
        fi

  # Single required check aggregating the matrix above, so PRs see one
  # "check-generated-code" line instead of one per component. `skipped`
  # counts as pass, same as a real success -- only an actual failure or
  # cancellation fails this job. Mirrors the e2e-*-gate jobs' pattern in
  # e2e-vmaas-full-install.yml et al.
  check-generated-code:
    if: always()
    needs: [changes, check-generated-code-matrix]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "Upstream job results:"
          echo "  changes: ${{ needs.changes.result }}"
          echo "  check-generated-code-matrix: ${{ needs.check-generated-code-matrix.result }}"
          echo ""
          echo "One or more upstream jobs failed or were cancelled."
          exit 1
      - if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: echo "All components' generated code is up to date (or were skipped)."
