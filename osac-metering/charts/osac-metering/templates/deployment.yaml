apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "osac-metering.fullname" . }}
  labels:
    {{- include "osac-metering.labels" . | nindent 4 }}
    app.kubernetes.io/component: metering
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "osac-metering.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "osac-metering.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: metering
    spec:
      serviceAccountName: {{ include "osac-metering.fullname" . }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: kafka-secrets
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: database
          projected:
            sources:
            {{- range .Values.database.connection }}
            {{- if .secret }}
            - secret:
                name: {{ .secret.name }}
                items:
                {{- range .secret.items }}
                - key: {{ .key }}
                  path: {{ .param }}
                {{- end }}
            {{- end }}
            {{- if .configMap }}
            - configMap:
                name: {{ .configMap.name }}
                items:
                {{- range .configMap.items }}
                - key: {{ .key }}
                  path: {{ .param }}
                {{- end }}
            {{- end }}
            {{- end }}
        - name: tmp
          emptyDir: {}
        - name: ca-bundle
          configMap:
            name: {{ .Values.certs.caBundle.configMap }}
            items:
              - key: bundle.pem
                path: bundle.pem
      initContainers:
        {{- include "osac-metering.kafkaSecretsInitContainer" (list . (include "osac-metering.kafkaSaslSecretName" .)) | nindent 8 }}
      containers:
        - name: {{ include "osac-metering.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: METERING_DEPLOYMENT_ID
              value: {{ include "osac-metering.osacDeploymentId" . | quote }}
            - name: DB_URL_FILE
              value: /etc/metering/db/url
            - name: HEARTBEAT_INTERVAL
              value: {{ .Values.heartbeat.interval | default "60s" | quote }}
            - name: METERING_TOPIC_RETENTION_MS
              value: {{ .Values.topics.retentionMs | default "-1" | quote }}
            - name: KAFKA_BROKERS
              value: {{ include "osac-metering.kafkaBrokers" . | quote }}
            - name: KAFKA_TLS_CA_CERT
              value: /etc/ca-bundle/bundle.pem
            - name: KAFKA_SASL_USERNAME
              value: {{ include "osac-metering.kafkaSaslUsername" . | quote }}
            - name: KAFKA_SASL_PASSWORD_FILE
              value: /etc/kafka-secrets/password
          volumeMounts:
            - name: kafka-secrets
              mountPath: /etc/kafka-secrets
              readOnly: true
            - name: database
              mountPath: /etc/metering/db
              readOnly: true
            - name: ca-bundle
              mountPath: /etc/ca-bundle
              readOnly: true
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
