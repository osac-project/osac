---
- name: Cluster Create - Baseline Test
  hosts: localhost
  gather_facts: true
  vars_files:
    - ../../../common_vars.yml

  tasks:
    - name: Read ClusterOrder fixture
      ansible.builtin.set_fact:
        test_cluster_order: "{{ lookup('file', '../../../fixtures/clusterorder-test.yaml') | from_yaml }}"

    - name: Set test variables for baseline workflow
      ansible.builtin.set_fact:
        osac_job_vars:
          resource: "{{ test_cluster_order }}"
        cluster_working_namespace: "cluster-test-cluster-work"
        # NOTE: Using real template (osac.templates.ocp_small from fixture)
        # Override infrastructure-creating steps to avoid actual resource creation
        install_step_hosted_cluster_override:
          name: osac.workflows.workflow_helpers
          tasks_from: noop.yml
        # OSAC-4172: no cluster_infra override — the ocp_small template no longer
        # dispatches a cluster_infra step (CaaS pool creation removed; workers are
        # provisioned on-demand by the BareMetalWorkerReconciler). Asserted below.
        install_step_external_access_override:
          name: osac.workflows.workflow_helpers
          tasks_from: noop.yml
        install_step_wait_for_nodes_override:
          name: osac.workflows.workflow_helpers
          tasks_from: noop.yml
        install_step_wait_for_cluster_operators_override:
          name: osac.workflows.workflow_helpers
          tasks_from: noop.yml
        install_step_retrieve_kubeconfig_override:
          name: osac.workflows.workflow_helpers
          tasks_from: noop.yml

- name: Import cluster create workflow (baseline)
  ansible.builtin.import_playbook: osac.workflows.cluster.create

- name: Verify baseline results
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Verify cluster order name extracted
      ansible.builtin.assert:
        that:
          - cluster_order_name is defined
          - cluster_order_name == "test-cluster"
        fail_msg: "Cluster order name not extracted correctly"

    - name: Verify cluster working namespace determined
      ansible.builtin.assert:
        that:
          - cluster_working_namespace is defined
          - cluster_working_namespace == "cluster-test-cluster-work"
        fail_msg: "Cluster working namespace not set correctly"

    - name: Verify template ID extracted
      ansible.builtin.assert:
        that:
          - template_id is defined
          - template_id == "osac.templates.ocp_small"
        fail_msg: "Template ID not extracted correctly"

    # OSAC-4172: the CaaS pre-boot pool is removed — ocp_small must not dispatch a
    # cluster_infra step, so no BareMetalPool CR is ever created for a CaaS cluster.
    # The step is gated on install_step_cluster_infra_default (set by the template's
    # "Set install step defaults" task); its absence proves the step was removed.
    # This is a cluster-independent guard: the BareMetalPool CRD is not installed in
    # the kind test env, so a k8s_info query is not viable here (real behavioral
    # verification is owned by e2e OSAC-4175, blocked on OSAC-1436 networking).
    - name: Verify cluster_infra step is not dispatched by ocp_small
      ansible.builtin.assert:
        that:
          - install_step_cluster_infra_default is not defined
        fail_msg: >-
          ocp_small still defines install_step_cluster_infra_default — the
          cluster_infra (BareMetalPool) step must be removed from the CaaS
          provisioning path (OSAC-4172).
