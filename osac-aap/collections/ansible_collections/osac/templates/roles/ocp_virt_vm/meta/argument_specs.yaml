argument_specs:
  main:
    options:
      guest_os_family:
        type: str
        required: false
        default: "linux"
        description: >
          OS family for the guest VM. Read from ComputeInstance spec.guestOSFamily field,
          defaults to 'linux'. Unrecognized values (including typos) fall back to the 'linux'
          profile. The 'linux' profile uses cloud-init / SSH defaults; 'windows' applies
          Windows sizing defaults, sysprep, Hyper-V / clock domain spec, and matching
          delete cleanup.
      compute_instance:
        type: dict
        required: true
        description: ComputeInstance configuration
      template_parameters:
        type: dict
        required: false
        description: Template parameters for the VM.
