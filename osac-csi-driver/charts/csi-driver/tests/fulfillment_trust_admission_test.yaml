suite: fulfillment trust admission bootstrap
templates:
  - templates/fulfillment-trust-admission.yaml
tests:
  - it: should render nothing while fulfillment trust is disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: should render no tenant admission resources without an order identity
    set:
      global.fulfillmentTrust.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should render isolated trust identities with a static least-privilege sync binding
    set:
      namespace: osac-csi
      global.fulfillmentTrust.enabled: true
      global.fulfillmentTrust.tenantNamespace: osac-csi
      global.fulfillmentTrust.admission.image.tag: test-version
      global.fulfillmentTrust.clusterOrderUID: order-uid
      global.fulfillmentTrust.tenant: tenant-a
      controller.fulfillment.configMap.name: osac-csi-fulfillment-config
      controller.fulfillment.credentials.secretName: osac-csi-driver-credentials
    asserts:
      - hasDocuments:
          count: 25
      - isKind:
          of: Secret
        documentIndex: 24
      - equal:
          path: metadata.name
          value: osac-fulfillment-trust-expected-bundles
        documentIndex: 24
      - equal:
          path: data["records.json"]
          value: W10=
        documentIndex: 24
      - equal:
          path: metadata.annotations["osac.openshift.io/tenant"]
          value: tenant-a
        documentIndex: 24
      - equal:
          path: metadata.annotations["osac.openshift.io/owner-reference"]
          value: order-uid
        documentIndex: 24
      - isKind:
          of: ServiceAccount
        documentIndex: 0
