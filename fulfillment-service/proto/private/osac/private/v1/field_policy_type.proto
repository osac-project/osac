syntax = "proto3";

package osac.private.v1;

import "buf/validate/validate.proto";
import "cleanapi/cleanapi.proto";
import "google/protobuf/any.proto";
import "osac/private/v1/baremetal_instance_common_type.proto";
import "osac/private/v1/cluster_version_type.proto";
import "osac/private/v1/compute_instance_common_type.proto";
import "osac/private/v1/disk_image_type.proto";
import "osac/private/v1/instance_type_type.proto";
import "osac/private/v1/secret_type.proto";

option (cleanapi.file).private = true;

// Defines whether a string field is locked or editable.
message StringFieldPolicy {
  oneof behavior {
    option (buf.validate.oneof).required = true;

    string locked = 1;
    EditableStringField editable = 2;
  }
}

// Configures an editable string field.
message EditableStringField {
  optional string default_value = 1;
}

// Defines whether an int32 field is locked or editable.
message Int32FieldPolicy {
  oneof behavior {
    option (buf.validate.oneof).required = true;

    int32 locked = 1;
    EditableInt32Field editable = 2;
  }
}

// Configures an editable int32 field.
message EditableInt32Field {
  optional int32 default_value = 1;
}

// Defines whether a boolean field is locked or editable.
message BoolFieldPolicy {
  oneof behavior {
    option (buf.validate.oneof).required = true;

    bool locked = 1;
    EditableBoolField editable = 2;
  }
}

// Configures an editable boolean field.
message EditableBoolField {
  optional bool default_value = 1;
}

// Defines whether an InstanceType reference is locked or editable.
message InstanceTypeReferenceFieldPolicy {
  oneof behavior {
    option (buf.validate.oneof).required = true;

    InstanceTypeReference locked = 1;
    EditableInstanceTypeReferenceField editable = 2;
  }
}

// Configures an editable InstanceType reference.
message EditableInstanceTypeReferenceField {
  InstanceTypeReference default_value = 1;
}

// Defines whether a DiskImage reference is locked or editable.
message DiskImageReferenceFieldPolicy {
  oneof behavior {
    option (buf.validate.oneof).required = true;

    DiskImageReference locked = 1;
    EditableDiskImageReferenceField editable = 2;
  }
}

// Configures an editable DiskImage reference.
message EditableDiskImageReferenceField {
  DiskImageReference default_value = 1;
}

// Defines whether a ClusterVersion reference is locked or editable.
message ClusterVersionReferenceFieldPolicy {
  oneof behavior {
    option (buf.validate.oneof).required = true;

    ClusterVersionReference locked = 1;
    EditableClusterVersionReferenceField editable = 2;
  }
}

// Configures an editable ClusterVersion reference.
message EditableClusterVersionReferenceField {
  ClusterVersionReference default_value = 1;
}

// Defines whether a Secret reference is locked or editable.
message SecretReferenceFieldPolicy {
  oneof behavior {
    option (buf.validate.oneof).required = true;

    SecretLocalReference locked = 1;
    EditableSecretReferenceField editable = 2;
  }
}

// Configures an editable Secret reference.
message EditableSecretReferenceField {
  SecretLocalReference default_value = 1;
}

// Defines whether a bare metal instance image is locked or editable.
message BareMetalInstanceImageFieldPolicy {
  oneof behavior {
    option (buf.validate.oneof).required = true;

    BareMetalInstanceImage locked = 1;
    EditableBareMetalInstanceImageField editable = 2;
  }
}

// Configures an editable bare metal instance image.
message EditableBareMetalInstanceImageField {
  BareMetalInstanceImage default_value = 1;
}

// Defines whether a compute instance run strategy is locked or editable.
message ComputeInstanceRunStrategyFieldPolicy {
  oneof behavior {
    option (buf.validate.oneof).required = true;

    ComputeInstanceRunStrategy locked = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
    EditableComputeInstanceRunStrategyField editable = 2;
  }
}

// Configures an editable compute instance run strategy.
message EditableComputeInstanceRunStrategyField {
  optional ComputeInstanceRunStrategy default_value = 1 [
    (buf.validate.field).enum = {defined_only: true, not_in: [0]}
  ];
}

// Defines whether a bare metal instance run strategy is locked or editable.
message BareMetalInstanceRunStrategyFieldPolicy {
  oneof behavior {
    option (buf.validate.oneof).required = true;

    BareMetalInstanceRunStrategy locked = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
    EditableBareMetalInstanceRunStrategyField editable = 2;
  }
}

// Configures an editable bare metal instance run strategy.
message EditableBareMetalInstanceRunStrategyField {
  optional BareMetalInstanceRunStrategy default_value = 1 [
    (buf.validate.field).enum = {defined_only: true, not_in: [0]}
  ];
}

// Wraps compute network attachments for use in a field policy.
message ComputeNetworkAttachmentList {
  repeated ComputeNetworkAttachment items = 1;
}

// Defines whether compute network attachments are locked or editable.
message ComputeNetworkAttachmentListFieldPolicy {
  oneof behavior {
    option (buf.validate.oneof).required = true;

    ComputeNetworkAttachmentList locked = 1;
    EditableComputeNetworkAttachmentList editable = 2;
  }
}

// Configures editable compute network attachments.
message EditableComputeNetworkAttachmentList {
  ComputeNetworkAttachmentList default_value = 1;
}

// Wraps bare metal network attachments for use in a field policy.
message BareMetalNetworkAttachmentList {
  repeated BareMetalNetworkAttachment items = 1;
}

// Defines whether bare metal network attachments are locked or editable.
message BareMetalNetworkAttachmentListFieldPolicy {
  oneof behavior {
    option (buf.validate.oneof).required = true;

    BareMetalNetworkAttachmentList locked = 1;
    EditableBareMetalNetworkAttachmentList editable = 2;
  }
}

// Configures editable bare metal network attachments.
message EditableBareMetalNetworkAttachmentList {
  BareMetalNetworkAttachmentList default_value = 1;
}

// Defines whether a template parameter is locked or editable.
message TemplateParameterPolicy {
  oneof behavior {
    option (buf.validate.oneof).required = true;

    google.protobuf.Any locked = 1;
    EditableTemplateParameter editable = 2;
  }
}

// Configures an editable template parameter.
message EditableTemplateParameter {
  google.protobuf.Any default_value = 1;
}
