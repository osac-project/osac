- name: OSAC CSI driver setup is a no-op (handled by OSAC-4197)
  ansible.builtin.debug:
    msg: >-
      osac_csi_driver setup: tenant-scoped CSI credentials are created by OSAC-4197.
      No hub-side setup is required here.
