name: Check generated code

on:
  workflow_call:

permissions:
  contents: read

jobs:

  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      changes: ${{ steps.filter.outputs.changes || '[]' }}
    steps:
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4.0.2
        if: github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            fulfillment-service:
              - 'fulfillment-service/**'
              - '!fulfillment-service/OWNERS'
              - '!fulfillment-service/LICENSE'
              - '!fulfillment-service/**/*.md'
              - '!fulfillment-service/docs/**'
              - '!fulfillment-service/.claude/**'
            osac-operator:
              - 'osac-operator/**'
              - '!osac-operator/OWNERS'
              - '!osac-operator/LICENSE'
              - '!osac-operator/**/*.md'
              - '!osac-operator/docs/**'
              - '!osac-operator/.claude/**'

  check-generated-code:
    name: Check generated code (${{ matrix.component }})
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.changes) }}
    if: needs.changes.outputs.changes != '[]'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3  # v1
      with:
        version: '1.50.0'
        setup_only: true
    - working-directory: ${{ matrix.component }}
      run: |
        buf generate
        git diff --exit-code -- .
