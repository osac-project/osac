---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: subnets.osac.openshift.io
spec:
  group: osac.openshift.io
  names:
    kind: Subnet
    listKind: SubnetList
    plural: subnets
    shortNames:
    - subnet
    singular: subnet
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.virtualNetwork
      name: VirtualNetwork
      type: string
    - jsonPath: .spec.ipv4Cidr
      name: IPv4CIDR
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Subnet is the Schema for the subnets API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Subnet
            properties:
              addressPlan:
                description: |-
                  AddressPlan is the NetworkClass address plan at the Subnet's create, in
                  sixteenths. OSAC computes status.ipam from it once.
                properties:
                  fabric:
                    description: Fabric is the share of the Fabric Manager's range,
                      in sixteenths.
                    format: int32
                    maximum: 16
                    minimum: 0
                    type: integer
                  lbVip:
                    description: LBVIP is the share of LoadBalancer VIP reservations,
                      in sixteenths.
                    format: int32
                    maximum: 16
                    minimum: 0
                    type: integer
                  overlay:
                    description: Overlay is the share of VM addresses from the Kubernetes
                      Manager, in sixteenths.
                    format: int32
                    maximum: 16
                    minimum: 0
                    type: integer
                required:
                - fabric
                - lbVip
                - overlay
                type: object
                x-kubernetes-validations:
                - message: addressPlan shares must sum to 16 sixteenths
                  rule: self.overlay + self.fabric + self.lbVip == 16
              ipv4Cidr:
                description: IPv4CIDR is the required canonical IPv4 CIDR block for
                  this subnet.
                maxLength: 18
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: ipv4Cidr must be a canonical IPv4 CIDR
                  rule: string(cidr(self).masked()) == self && !self.contains(':')
                - message: ipv4Cidr is immutable
                  rule: self == oldSelf
              virtualNetwork:
                description: VirtualNetwork is the API ID of the parent VirtualNetwork
                type: string
                x-kubernetes-validations:
                - message: virtualNetwork is immutable
                  rule: self == oldSelf
            required:
            - addressPlan
            - ipv4Cidr
            - virtualNetwork
            type: object
            x-kubernetes-validations:
            - message: spec is immutable after creation
              rule: self == oldSelf
          status:
            description: status defines the observed state of Subnet
            properties:
              computeInstanceSupported:
                description: |-
                  Compute eligibility is independent of lifecycle readiness. An absent value
                  means the Kubernetes manager has not reported eligibility.
                type: boolean
              computeInstanceUnsupportedReason:
                type: string
              conditions:
                description: Conditions holds the Ready condition of the Subnet.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              ipam:
                description: IPAM is the address layout computed once at create (contract
                  §4.8).
                properties:
                  gatewayIpv4:
                    description: GatewayIPv4 is the Subnet's network address plus
                      one.
                    type: string
                  lbVipIpv4Cidrs:
                    description: LBVIPIPv4CIDRs is the LoadBalancer VIP range.
                    items:
                      type: string
                    type: array
                  overlayIpv4Cidrs:
                    description: OverlayIPv4CIDRs is the overlay range.
                    items:
                      type: string
                    type: array
                  physicalIpv4Cidrs:
                    description: PhysicalIPv4CIDRs is the Fabric Manager's range.
                    items:
                      type: string
                    type: array
                required:
                - gatewayIpv4
                type: object
              jobs:
                description: Jobs tracks the latest job per task and manager (contract
                  §4.7).
                items:
                  description: |-
                    NetworkJobStatus tracks the latest AAP job of one task on one manager
                    (contract §4.7 Job tracking). OSAC never removes an entry.
                  properties:
                    attempt:
                      description: Attempt counts the task's launches on this manager.
                      format: int32
                      minimum: 0
                      type: integer
                    jobID:
                      description: JobID is the AAP job ID; empty until AAP returned
                        it.
                      type: string
                    manager:
                      description: Manager is the manager type the task runs on.
                      enum:
                      - fabric
                      - kubernetes
                      - none
                      type: string
                    message:
                      description: |-
                        Message is the job's osac_error message, the AAP failure text, or why
                        OSAC rejected the result; while retrying it also names the next retry time.
                      type: string
                    state:
                      description: State is the state of the latest job.
                      enum:
                      - Running
                      - Retrying
                      - Succeeded
                      - Failed
                      - Cancelled
                      type: string
                    task:
                      description: Task is the task name, for example create_subnet.
                      minLength: 1
                      type: string
                  required:
                  - attempt
                  - manager
                  - state
                  - task
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - task
                - manager
                x-kubernetes-list-type: map
              networkManagers:
                description: NetworkManagers records the managers copied from the
                  parent at create.
                properties:
                  fabric:
                    description: Fabric is the Fabric Manager.
                    properties:
                      ansibleRole:
                        description: AnsibleRole is the fully qualified Ansible role
                          of the manager.
                        minLength: 1
                        type: string
                      name:
                        description: Name is the registration name of the manager.
                        minLength: 1
                        type: string
                    required:
                    - ansibleRole
                    - name
                    type: object
                  kubernetes:
                    description: Kubernetes is the OSAC Kubernetes Manager; absent
                      when none is selected.
                    properties:
                      ansibleRole:
                        description: AnsibleRole is the fully qualified Ansible role
                          of the manager.
                        minLength: 1
                        type: string
                      name:
                        description: Name is the registration name of the manager.
                        minLength: 1
                        type: string
                    required:
                    - ansibleRole
                    - name
                    type: object
                type: object
              networkSegment:
                description: NetworkSegment is the accepted segment of the Fabric
                  create_subnet (contract §4.9).
                properties:
                  l2Vni:
                    description: L2VNI is the Subnet's L2 VNI.
                    format: int32
                    maximum: 16777215
                    minimum: 1
                    type: integer
                  type:
                    description: Type is the network type of the segment.
                    enum:
                    - evpn
                    type: string
                required:
                - l2Vni
                - type
                type: object
              networkType:
                description: NetworkType records the network type copied from the
                  parent at create; empty without a Kubernetes Manager.
                enum:
                - evpn
                type: string
              taskInput:
                description: TaskInput is the task input stored before the first job
                  (contract §4.5).
                type: object
                x-kubernetes-preserve-unknown-fields: true
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
