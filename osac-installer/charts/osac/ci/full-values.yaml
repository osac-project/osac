# Full scenario: everything enabled, exercises all template branches.

global:
  osacDeploymentId: "ci/osac"
  networking:
    provisioningEnabled: true
    excludedIpv4Cidrs:
    - 192.0.2.0/24
    # Synthetic registration names keep this chart smoke fixture independent
    # of provider-specific manager configuration owned by the manager teams.
    fabricManager: test_fabric
    k8sManager: cudn_evpn
    networkClass:
      defaults:
        virtualNetworkIPv4CIDR: 10.200.0.0/16
        subnetIPv4CIDR: 10.200.0.0/22
        ingressRules:
        - protocol: PROTOCOL_TCP
          ipv4Cidr: 0.0.0.0/0
          portFrom: 22
          portTo: 22
        egressRules:
        - protocol: PROTOCOL_ALL
          ipv4Cidr: 0.0.0.0/0
      eastWestCapabilities:
        supportsEastWestEthernet: true
      addressPlan:
        overlay: 0.5
        fabric: 0.25
        lbVip: 0.25

ui:
  enabled: true
  externalHostname: osac-ui.example.com
  api:
    fulfillment:
      url: https://fulfillment-api:8000
      certs:
        caBundle:
          configMap: ca-bundle
  auth:
    oidcClientId: osac-ui
    oidcIssuerURL: https://keycloak.keycloak.svc.cluster.local/realms/osac
    certs:
      caBundle:
        configMap: ca-bundle
  images:
    ui: ghcr.io/osac-project/osac-ui:latest

operator:
  aap:
    url: "https://aap.example.com/api/controller"
    token: "test-token"
    insecureSkipVerify: "true"
    statusPollInterval: "30s"
    templatePrefix: "osac"
  fulfillment:
    serverAddress: "fulfillment-internal-api:8001"
    credentials:
      secretName: fulfillment-controller-credentials
      clientIdKey: client-id
      clientSecretKey: client-secret

service:
  variant: openshift
  externalHostname: fulfillment-api.example.com
  internalHostname: fulfillment-internal-api.example.com
  auth:
    issuerUrl: https://keycloak.keycloak.svc.cluster.local/realms/osac
    controllerCredentials:
    - secret:
        name: fulfillment-controller-credentials
        items:
        - key: client-id
          param: client-id
        - key: client-secret
          param: client-secret
  idp:
    provider: keycloak
    url: https://keycloak.keycloak.svc.cluster.local
    credentials:
    - secret:
        name: fulfillment-controller-credentials
        items:
        - key: client-id
          param: client-id
  database:
    connection:
    - secret:
        name: osac-db-config
        items:
        - key: url
          param: url
  vault:
    endpoint: https://vault.example.com
    lifecycleRole: vault-lifecycle
    keycloakClientId: vault-client
    keycloakIssuerUrl: https://keycloak.keycloak.svc.cluster.local/realms/osac
    credentials:
    - secret:
        name: vault-credentials
        items:
        - key: client-secret
          param: client-secret

aap:
  aap:
    instance:
      enabled: true
      name: "osac-aap"
  bootstrap:
    enabled: true
    image: ghcr.io/osac-project/osac-aap:latest
  instanceGroups:
    clusterFulfillment:
      enabled: true
      config:
        DNS_CLASS: "dns.route53.dns"
        DNS_ZONE: "test.example.com"
        EXTERNAL_ACCESS_BASE_DOMAIN: "test.example.com"
        EXTERNAL_ACCESS_SUPPORTED_BASE_DOMAINS: "test.example.com"
        EXTERNAL_ACCESS_API_INTERNAL_NETWORK: "hypershift"
        HOSTED_CLUSTER_BASE_DOMAIN: "test.example.com"
        HOSTED_CLUSTER_CONTROLLER_AVAILABILITY_POLICY: "SingleReplica"
        HOSTED_CLUSTER_INFRASTRUCTURE_AVAILABILITY_POLICY: "SingleReplica"
      secret: {}
    networkFulfillment:
      enabled: true
      config:
        ACME_FABRIC_URL: "https://test-fabric.example.com"
      secret: {}

bmf:
  bcm:
    enabled: true
    url: "https://bcm-head.example.com:8081"
    cert: "test-cert-placeholder"
    key: "test-key-placeholder"
    caCert: ""
    insecureSkipVerify: false
    hostClass: "bcm"
    bmhNamespace: "hardware-inventory"
  metal3:
    enabled: false
    namespace: "hardware-inventory"
    hostClass: "metal3"

validation:
  enabled: true

dbMigrate:
  enabled: true
  image: ghcr.io/osac-project/fulfillment-service:latest
  dbUrlFile: "/etc/fulfillment-service/db/url"
