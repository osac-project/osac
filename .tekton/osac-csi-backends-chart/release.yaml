apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/osac-project/osac?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "push" && target_branch.startsWith("refs/tags/osac-release/")
  labels:
    appstudio.openshift.io/application: osac
    appstudio.openshift.io/component: osac-csi-backends-chart
    pipelines.appstudio.openshift.io/type: build
  name: osac-csi-backends-chart-on-release
  namespace: osac-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/redhat-user-workloads/osac-tenant/osac-csi-backends-chart:{{revision}}
  - name: chart-context
    value: osac-csi-driver/charts/csi-backends
  # Chart version is resolved by tag NAME (resolve-chart-version task
  # below), not by build-helm-chart-oci-ta's own default git-describe/
  # TAG_PREFIX mechanism: that mechanism requires this dedicated
  # osac-csi-backends-chart-vX.Y.Z tag to be reachable via git ancestry from this
  # exact commit, but osac-build-and-publish.yaml's "Create chart release
  # tags" step only pushes it when this chart's owning component is
  # actually bumped this release -- a release that pins everything
  # (the common case) leaves no such tag anywhere in this commit's
  # history (per-release stamping commits are never merged into main),
  # so git describe falls back to a nonsense, non-semver version like
  # "0.1.7392_5f8626895" -- confirmed live, a real release dispatch
  # with nothing bumped produced exactly that, and either silently
  # published it (charts with no rewrite-registry-image-refs task) or
  # hard-failed downstream (helm pull --version rejecting it as invalid
  # semver, in charts that do). tag-prefix is still the dedicated,
  # slash-free tag (not the per-component "<component>/vX.Y.Z" one --
  # see resolve-chart-version's own comment for why slash-free matters).
  - name: tag-prefix
    value: osac-csi-backends-chart-v
  pipelineSpec:
    description: |
      Packages and pushes a Helm chart to an OCI repository using trusted artifacts,
      for a real release. Chart version is computed from the dedicated chart git tag
      already pushed at this exact commit by osac-build-and-publish.yaml's own
      release tagging step.
    params:
    - description: Source Repository URL
      name: git-url
      type: string
    - default: ""
      description: Revision of the Source Repository
      name: revision
      type: string
    - description: Fully Qualified Output Image
      name: output-image
      type: string
    - default: dist/chart/
      description: Path to the Helm chart directory relative to the source root
      name: chart-context
      type: string
    - default: helm-
      description: An identifying prefix on which the version tag is to be matched
      name: tag-prefix
      type: string
    - default: "false"
      description: Execute the build with network isolation
      name: hermetic
      type: string
    - default: ""
      description: Build dependencies to be prefetched
      name: prefetch-input
      type: string
    - default: ""
      description: Image tag expiration time, time values could be something like
        1h, 2d, 3w for hours, days, and weeks, respectively.
      name: image-expires-after
      type: string
    - default: "false"
      description: Enable cache proxy configuration
      name: enable-cache-proxy
    - default: "true"
      description: Use the package registry proxy when prefetching dependencies
      name: enable-package-registry-proxy
      type: string
    results:
    - description: ""
      name: IMAGE_URL
      value: $(tasks.build-helm-chart.results.IMAGE_URL)
    - description: ""
      name: IMAGE_DIGEST
      value: $(tasks.build-helm-chart.results.IMAGE_DIGEST)
    - description: ""
      name: CHAINS-GIT_URL
      value: $(tasks.clone-repository.results.url)
    - description: ""
      name: CHAINS-GIT_COMMIT
      value: $(tasks.clone-repository.results.commit)
    tasks:
    - name: init
      params:
      - name: enable-cache-proxy
        value: $(params.enable-cache-proxy)
      taskRef:
        params:
        - name: name
          value: init
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-init:0.4.3@sha256:c6c414a3b5dcd827720f3443a128a02d27a0a5071ea3e4dc0063d578f1f73a74
        - name: kind
          value: task
        resolver: bundles
    - name: resolve-chart-version
      params:
      - name: git-url
        value: $(params.git-url)
      - name: tag-prefix
        value: $(params.tag-prefix)
      runAfter:
      - init
      taskSpec:
        params:
        - name: git-url
          type: string
        - name: tag-prefix
          type: string
        results:
        - name: CHART_VERSION
          description: The real chart version, resolved by tag name
        steps:
        - name: resolve
          # Same image build-helm-chart-oci-ta's own "package-and-push" step
          # uses -- already has git.
          image: quay.io/konflux-ci/tools@sha256:2112b51ba80d1041c120c32b67b871d371fde4e5775b32a3c7bf01a2f9ec0964
          script: |
            #!/bin/bash
            set -euo pipefail

            # Resolve by tag NAME, not by git ancestry/revision -- see this
            # pipeline's own comment above tag-prefix for the full reasoning
            # (per-release stamping commits are never merged into main, so
            # neither an exact-match nor an ancestor-walking git describe can
            # find this chart's own tag unless it was bumped this exact
            # release). Tags are monotonically increasing, so the highest
            # version by semver sort is always the real, currently-released
            # one, bumped this release or not.
            echo "Resolving real chart version from $(params.tag-prefix)*..."
            git clone --filter=blob:none --no-checkout "$(params.git-url)" /tmp/repo
            cd /tmp/repo
            git fetch --tags origin
            CHART_VERSION=$(git tag -l "$(params.tag-prefix)*" \
              | sed "s#^$(params.tag-prefix)##" \
              | { grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
              | sort -V | tail -1)
            if [ -z "${CHART_VERSION}" ]; then
              echo "ERROR: no tag matching $(params.tag-prefix)* found" >&2
              exit 1
            fi
            echo "Real chart version: ${CHART_VERSION}"
            echo -n "${CHART_VERSION}" >"$(results.CHART_VERSION.path)"
    - name: clone-repository
      params:
      - name: url
        value: $(params.git-url)
      - name: revision
        value: $(params.revision)
      - name: ociStorage
        value: $(params.output-image).git
      - name: ociArtifactExpiresAfter
        value: $(params.image-expires-after)
      runAfter:
      - init
      taskRef:
        params:
        - name: name
          value: git-clone-oci-ta
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-git-clone-oci-ta:0.2.6@sha256:a3678910c2bf9187a66a96066193cb41046fbb7097160bf2be6a374ed5e49d30
        - name: kind
          value: task
        resolver: bundles
      workspaces:
      - name: basic-auth
        workspace: git-auth
    - name: prefetch-dependencies
      params:
      - name: input
        value: $(params.prefetch-input)
      - name: SOURCE_ARTIFACT
        value: $(tasks.clone-repository.results.SOURCE_ARTIFACT)
      - name: ociStorage
        value: $(params.output-image).prefetch
      - name: ociArtifactExpiresAfter
        value: $(params.image-expires-after)
      - name: enable-package-registry-proxy
        value: $(params.enable-package-registry-proxy)
      runAfter:
      - clone-repository
      taskRef:
        params:
        - name: name
          value: prefetch-dependencies-oci-ta
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-prefetch-dependencies-oci-ta:0.10.3@sha256:0c386f2c26b46b978280c5c54caac26bcd524975f8f7cc06bb080ba00eae3ad4
        - name: kind
          value: task
        resolver: bundles
      workspaces:
      - name: git-basic-auth
        workspace: git-auth
      - name: netrc
        workspace: netrc
    - name: build-helm-chart
      params:
      - name: IMAGE
        value: $(params.output-image)
      - name: COMMIT_SHA
        value: $(tasks.clone-repository.results.commit)
      - name: SOURCE_ARTIFACT
        value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
      - name: CHART_CONTEXT
        value: $(params.chart-context)
      - name: CHART_VERSION
        value: $(tasks.resolve-chart-version.results.CHART_VERSION)
      runAfter:
      - prefetch-dependencies
      - resolve-chart-version
      taskRef:
        params:
        - name: name
          value: build-helm-chart-oci-ta
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-build-helm-chart-oci-ta:0.3@sha256:cc59ae16baa756d23f3e5f8328cd9f8ba39a388f8eafbb9db666dea694814d25
        - name: kind
          value: task
        resolver: bundles
    workspaces:
    - name: git-auth
      optional: true
    - name: netrc
      optional: true
  taskRunTemplate:
    serviceAccountName: build-pipeline-osac-csi-backends-chart
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
