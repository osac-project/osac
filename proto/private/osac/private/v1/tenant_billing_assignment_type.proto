syntax = "proto3";

package osac.private.v1;

import "buf/validate/validate.proto";
import "cleanapi/cleanapi.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "osac/private/v1/metadata_type.proto";

option (cleanapi.file).package = "osac.public.v1";

// Assignment-time provider account-match validation state. PENDING means validation is incomplete; gated publish
// and launch fail with BILLING_ACCOUNT_UNAVAILABLE while an assignment is PENDING. CONNECTED means the required
// provider match was validated: where the provider exposes a correlation field, exactly one account carried it.
// FAILED means the match could not be validated or was not unique; this contract value exists for completeness,
// the current implementation never persists an assignment in this state.
enum TenantBillingAssignmentConnectionState {
  // Unset. Never reported by the server.
  TENANT_BILLING_ASSIGNMENT_CONNECTION_STATE_UNSPECIFIED = 0;

  TENANT_BILLING_ASSIGNMENT_CONNECTION_STATE_PENDING = 1;

  TENANT_BILLING_ASSIGNMENT_CONNECTION_STATE_CONNECTED = 2;

  TENANT_BILLING_ASSIGNMENT_CONNECTION_STATE_FAILED = 3;
}

// Desired tenant and billing-account association for one assignment interval.
message TenantBillingAssignmentSpec {
  // OSAC tenant billed by this interval. Not an authorization credential: a tenant caller's own identity, not this
  // field, determines which assignments they may read.
  string tenant_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {min_len: 1}
  ];

  // BillingAccount.id assigned to the tenant for this interval.
  string billing_account_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {min_len: 1}
  ];
}

// Server-observed assignment validation state and interval.
message TenantBillingAssignmentStatus {
  // Assignment-time provider account-match validation.
  TenantBillingAssignmentConnectionState connection_state = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Time this assignment interval became active.
  google.protobuf.Timestamp effective_from = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Time this assignment interval stopped being active. Unset while it is the current assignment.
  google.protobuf.Timestamp effective_to = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional detail, such as the PENDING remediation and its stable reason
  // (BILLING_PROVIDER_CORRELATION_WRITE_UNSUPPORTED). Empty on success.
  string message = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A time-bounded association between an OSAC tenant and a billing account. Reassignment closes the current
// interval and opens a new one; history is retained. At most one active (status.connection_state with
// effective_to unset) assignment exists per tenant and per billing account at a time, enforced at the database
// level by a partial unique index, not by this API alone.
message TenantBillingAssignment {
  // OSAC id of this assignment interval. A later reassignment creates a new id; it does not reuse this one.
  string id = 1;

  Metadata metadata = 2;

  // Desired configuration for this interval. Immutable after creation except billing_account_id on Update.
  TenantBillingAssignmentSpec spec = 3;

  // System-provided, read-only current state.
  TenantBillingAssignmentStatus status = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}
