---
- name: BMH Patch Construction - OCI image omits checksum
  hosts: localhost
  gather_facts: false

  vars:
    bm_host_metal3_default_image_url: "oci://quay.io/osac-project/fedora-cloud-bmi:44"

  tasks:
    - name: Test OCI image - set template_params with oci:// URL
      ansible.builtin.set_fact:
        template_params:
          imageURL: "oci://quay.io/openshift-release-dev/ocp-v4.0-art-dev@sha256:abc123"
          sshPublicKey: ""

    - name: Apply image defaults to template parameters
      ansible.builtin.set_fact:
        template_params: "{{ {'imageURL': bm_host_metal3_default_image_url}
                            | combine(template_params) }}"

    - name: Set variables expected by build_bmh_patch
      ansible.builtin.set_fact:
        ssh_key: ""
        user_data_secret_ref: ""
        bmh_name: "test-bmh"
        bmh_namespace: "test-ns"

    - name: Build BMH patch using actual role code
      ansible.builtin.include_role:
        name: osac.templates.bm_host_provisioning
        tasks_from: build_bmh_patch.yaml

    - name: Assert OCI image patch has no checksum fields
      ansible.builtin.assert:
        that:
          - bmh_patch.spec.image.url == "oci://quay.io/openshift-release-dev/ocp-v4.0-art-dev@sha256:abc123"
          - "'checksum' not in bmh_patch.spec.image"
          - "'checksumType' not in bmh_patch.spec.image"
        fail_msg: "OCI image BMH patch must not contain checksum or checksumType"

- name: BMH Patch Construction - Non-OCI image includes checksum
  hosts: localhost
  gather_facts: false

  vars:
    bm_host_metal3_default_image_url: "oci://quay.io/osac-project/fedora-cloud-bmi:44"

  tasks:
    - name: Test qcow2 image - set template_params with https URL
      ansible.builtin.set_fact:
        template_params:
          imageURL: "https://example.com/image.qcow2"
          imageChecksum: "deadbeef1234"
          checksumType: "md5"

    - name: Apply image defaults to template parameters
      ansible.builtin.set_fact:
        template_params: "{{ {'imageURL': bm_host_metal3_default_image_url}
                            | combine(template_params) }}"

    - name: Set variables expected by build_bmh_patch
      ansible.builtin.set_fact:
        ssh_key: ""
        user_data_secret_ref: ""
        bmh_name: "test-bmh"
        bmh_namespace: "test-ns"

    - name: Build BMH patch using actual role code
      ansible.builtin.include_role:
        name: osac.templates.bm_host_provisioning
        tasks_from: build_bmh_patch.yaml

    - name: Assert non-OCI image patch includes checksum fields
      ansible.builtin.assert:
        that:
          - bmh_patch.spec.image.url == "https://example.com/image.qcow2"
          - bmh_patch.spec.image.checksum == "deadbeef1234"
          - bmh_patch.spec.image.checksumType == "md5"
        fail_msg: "Non-OCI image BMH patch must contain checksum and checksumType"
