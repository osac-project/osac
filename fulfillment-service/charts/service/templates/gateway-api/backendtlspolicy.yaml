{{/*
Upstream TLS validation from the gateway to each backend. The CA ConfigMap must be
keyed ca.crt (see backend-ca-bundle.yaml); the hostname is the backend serving-cert
SAN.
*/}}
{{- if eq .Values.ingress.driver "gatewayapi" }}
{{- range $svc := list "grpc-server" "rest-gateway" "console-proxy" }}
---
apiVersion: gateway.networking.k8s.io/v1alpha3
kind: BackendTLSPolicy
metadata:
  namespace: {{ $.Release.Namespace }}
  name: btls-{{ $svc }}
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: fulfillment-{{ $svc }}
  validation:
    caCertificateRefs:
    - group: ""
      kind: ConfigMap
      name: {{ $.Values.ingress.gatewayapi.backendCaConfigMap }}
    hostname: fulfillment-{{ $svc }}.{{ $.Release.Namespace }}.svc.cluster.local
{{- end }}
{{- end }}
