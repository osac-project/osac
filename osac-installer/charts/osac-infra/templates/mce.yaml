{{- if .Values.mce.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: osac-infra-mce-config
  labels:
    {{- include "osac-infra.labels" . | nindent 4 }}
data:
  # Applied after MCE is ready, not as a Helm-owned CR during bootstrap.
  acm-import-policy.yaml: |
    apiVersion: addon.open-cluster-management.io/v1alpha1
    kind: AddOnDeploymentConfig
    metadata:
      name: hypershift-addon-deploy-config
      namespace: multicluster-engine
      annotations:
        osac.openshift.io/tenant: platform
        osac.openshift.io/owner-reference: MultiClusterEngine/multiclusterengine
    spec:
      customizedVariables:
        - name: autoImportDisabled
          value: "true"
  config.yaml: |
    apiVersion: agent-install.openshift.io/v1beta1
    kind: AgentServiceConfig
    metadata:
      name: agent
{{- if not .Values.mce.imageService.enabled }}
      annotations:
        agent-install.openshift.io/enable-image-service: "false"
{{- end }}
    spec:
      databaseStorage:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
      filesystemStorage:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
      imageStorage:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
{{- if .Values.mce.osImages }}
      osImages:
{{ toYaml .Values.mce.osImages | indent 8 }}
{{- end }}
{{- end }}
