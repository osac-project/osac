# Base URL of the AAP controller API, without a path suffix; callers append
# their own API paths (for example /api/controller/v2/...). Set it when the AAP
# instance is disabled and OSAC talks to an AAP outside this release; an empty
# value then fails the render. While the instance is enabled, consumers address
# it by its service name and this value is not read.
controllerUrl: ""

aap:
  instance:
    enabled: true
    name: "osac-aap"
    controller:
      disabled: false
    eda:
      disabled: true
    hub:
      disabled: true
    lightspeed:
      disabled: true
    redisMode: standalone
    routeTlsTerminationMechanism: Edge
    imagePullPolicy: IfNotPresent

bootstrap:
  enabled: true
  image: ghcr.io/osac-project/osac-aap:latest # PLACEHOLDER -- overwritten at release time by osac-build-and-publish.yaml
  cliImage: quay.io/openshift/origin-cli:4.20.0
  backoffLimit: 15
  readinessConsecutiveSuccesses: 3
  # Admin credentials the bootstrap job and the create-token hook
  # authenticate with when aap.instance.enabled=false. Defaults match the
  # Secret the in-cluster instance creates, so a deployment that copies the
  # external AAP's admin password under that name needs no override.
  adminPasswordSecret:
    name: "osac-aap-admin-password"
    key: "password"

configAsCode:
  manifestSecret: "config-as-code-manifest-ig"
  secret: "config-as-code-ig"
  # Maximum number of add-on operator jobs allowed to run concurrently.
  addonOperatorMaxConcurrentJobs: 50
  eeImage: ""
  # Controller's own execution_environment.pull field (always / missing /
  # never). Left empty by default (config-as-code-secret.yaml omits the env
  # var, Ansible side falls back to "always", preserving today's behavior
  # for the shipped mutable :latest default); e2e sets this to "missing"
  # alongside its own eeImage override, since that image only exists in the
  # node's local store and was never pushed to a real registry.
  eeImagePull: ""
  projectGitUri: ""
  projectGitBranch: ""
  remoteClusterKubeconfigSecretName: ""
  remoteClusterKubeconfigSecretKey: kubeconfig
  manifest:
    create: false
    data: {}
serviceAccounts:
  osacSa: "osac-sa"
  templatePublisher: "template-publisher"

apiToken:
  create: true

instanceGroups:
  clusterFulfillment:
    enabled: false
    config: {}
    secret: {}
  networkFulfillment:
    enabled: false
    config: {}
    secret: {}
  storageFulfillment:
    enabled: false
    config: {}
    secret: {}
  publishTemplates:
    enabled: false
    config:
      OSAC_TEMPLATE_COLLECTIONS: ""
      OSAC_FULFILLMENT_SERVICE_URI: ""
