---
# FabricDomain deletion removes the Netris server cluster. The delete finds
# its object by name within the VirtualNetwork's VPC and succeeds when it is
# already absent.

- name: Normalize task input
  ansible.builtin.include_tasks: _contract_input.yaml
  vars:
    _osac_task_name: delete_fabric_domain

- name: Extract FabricDomain name
  ansible.builtin.set_fact:
    fabric_domain_name: "{{ _osac_resource.metadata.name }}"

- name: Validate the contract FabricDomain identity
  ansible.builtin.assert:
    that:
      - fabric_domain_name | default('') | length > 0
      - _osac_virtual_network.metadata.name | default('') | length > 0
    fail_msg: >-
      A FabricDomain delete needs the domain name and its VirtualNetwork
      snapshot.
  when: _osac_contract | default(false) | bool

- name: Delete the FabricDomain from Netris
  block:
    - name: Ensure Netris auth
      ansible.builtin.include_role:
        name: netris.controller.auth
      when:
        - netris_session_cookie is not defined
        - not ansible_check_mode

    - name: Look up the parent VPC by VirtualNetwork name
      ansible.builtin.include_role:
        name: netris.controller.vpc
        tasks_from: read
      vars:
        vpc_name: "{{ _osac_virtual_network.metadata.name }}"
      when: _osac_contract | default(false) | bool

    - name: Require the parent VPC for the FabricDomain
      ansible.builtin.assert:
        that:
          - netris_vpc is mapping
          - netris_vpc.id is defined
        fail_msg: >-
          VirtualNetwork '{{ _osac_virtual_network.metadata.name }}' has no
          Netris VPC named after it; refusing to delete a FabricDomain from
          another routing domain.
      when: _osac_contract | default(false) | bool

    - name: Set the FabricDomain deletion scope
      ansible.builtin.set_fact:
        _fd_site_id: >-
          {{ netris_site_id | int
             if _osac_contract | default(false) | bool
             else (server_cluster.spec.siteId
                   | default((netris_region_site_map | default({}))[server_cluster.spec.region | default('')]
                             | default(netris_site_id)) | int) }}
        _fd_vpc_id: >-
          {{ (netris_vpc.id | int)
             if _osac_contract | default(false) | bool
             else (server_cluster.spec.vpcId | default(0) | int) }}
        _fd_backend_id: >-
          {{ server_cluster.spec.backendId | default('') | string
             if not _osac_contract | default(false) | bool
             else '' }}

    - name: Delete the FabricDomain
      ansible.builtin.include_role:
        name: netris.controller.server_cluster
        tasks_from: delete
      vars:
        server_cluster_name: "{{ fabric_domain_name }}"
        server_cluster_site_id: "{{ _fd_site_id | int }}"
        server_cluster_backend_id: "{{ _fd_backend_id }}"
        server_cluster_vpc_id: "{{ _fd_vpc_id | int }}"
  rescue:
    - name: Publish the sanitized FabricDomain error
      ansible.builtin.include_tasks: _fail_task.yaml
      vars:
        _osac_error_message: >-
          {{ ansible_failed_result.msg
             | default('The Netris FabricDomain delete failed') }}
        _osac_error_retryable: >-
          {{ ansible_failed_result.retryable | default(true) }}
      when: _osac_contract | default(false) | bool

    - name: Fail the FabricDomain task after the rescue
      ansible.builtin.fail:
        msg: >-
          {{ _osac_error_message | default(ansible_failed_result.msg
             | default('FabricDomain delete failed')) }}
