---
- name: Compute Instance Create GPU - Baseline Test
  hosts: localhost
  gather_facts: true
  vars_files:
    - ../../../common_vars.yml

  tasks:
    - name: Read ComputeInstance GPU fixture
      ansible.builtin.set_fact:
        test_compute_instance: "{{ lookup('file', '../../../fixtures/computeinstance-with-gpu-test.yaml') | from_yaml }}"

    - name: Set test variables for baseline workflow
      ansible.builtin.set_fact:
        osac_job_vars:
          resource: "{{ test_compute_instance }}"
          # Provider networking disabled (what CI deploys): the operator's vm_network is
          # the default pod network with masquerade in the VM namespace.
          vm_network:
            namespace: test-subnet
            networks: [{name: default, pod: {}}]
            interfaces: [{name: default, masquerade: {}}]
            labels: {osac.openshift.io/compute-instance-id: 3c0b9d2e-2222-4a5b-9c7d-2e4f6a8b0c12}
        tenant_storage_class_storage_classes:
          - name: "test-storage-class"
            tier: "local"
        create_step_resources_override:
          name: osac.workflows.workflow_helpers
          tasks_from: noop.yml
        create_step_wait_annotate_override:
          name: osac.workflows.workflow_helpers
          tasks_from: noop.yml

- name: Import compute instance create workflow (baseline with GPU)
  ansible.builtin.import_playbook: osac.workflows.compute_instance.create

- name: Verify baseline results with GPU
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../../common_vars.yml

  tasks:
    - name: Verify GPU host devices are present in VM template spec
      ansible.builtin.assert:
        that:
          - vm_template_spec is defined
          - vm_template_spec.domain.devices.hostDevices is defined
          - vm_template_spec.domain.devices.hostDevices | length == (test_compute_instance.spec.gpu.count | int)
          - vm_template_spec.domain.devices.hostDevices[0].name == 'gpu-0'
          - vm_template_spec.domain.devices.hostDevices[0].deviceName == test_compute_instance.spec.gpu.resourceName
        fail_msg: "GPU devices not found in VM template spec: {{ vm_template_spec }}"

    - name: Verify the disabled-mode VM network (default pod network, masquerade) next to the GPU
      ansible.builtin.assert:
        that:
          - compute_instance_target_namespace == osac_job_vars.vm_network.namespace
          - "vm_template_spec.networks == [{'name': 'default', 'pod': {}}]"
          - "vm_template_spec.domain.devices.interfaces == [{'name': 'default', 'masquerade': {}}]"
        fail_msg: >-
          With provider networking disabled the VM must use vm_network unchanged: namespace
          {{ compute_instance_target_namespace | default('<unset>') }} (expected {{ osac_job_vars.vm_network.namespace }}),
          networks {{ vm_template_spec.networks | default('<unset>') }},
          interfaces {{ vm_template_spec.domain.devices.interfaces | default('<unset>') }}

    - name: Read HyperConverged CR
      kubernetes.core.k8s_info:
        api_version: hco.kubevirt.io/v1
        kind: HyperConverged
        name: kubevirt-hyperconverged
        namespace: openshift-cnv
      register: hc_cr

    - name: Ensure HyperConverged CR exists
      ansible.builtin.assert:
        that:
          - hc_cr.resources | length == 1
        fail_msg: "Expected exactly one HyperConverged CR, got: {{ hc_cr.resources | default([]) | length }}"

    - name: Resolve pciHostDevices from HyperConverged CR
      ansible.builtin.set_fact:
        hc_pci_host_devices: >-
          {{
            (hc_cr.resources[0].spec.virtualization.permittedHostDevices.pciHostDevices | default([]))
            if hc_cr.resources[0].spec.virtualization is defined
            else (hc_cr.resources[0].spec.permittedHostDevices.pciHostDevices | default([]))
          }}

    - name: Find matching GPU host device entries
      ansible.builtin.set_fact:
        hc_matching_gpu_devices: >-
          {{
            hc_pci_host_devices
            | selectattr('pciDeviceSelector', 'equalto', test_compute_instance.spec.gpu.pciDeviceSelector)
            | selectattr('resourceName', 'equalto', test_compute_instance.spec.gpu.resourceName)
            | list
          }}

    - name: Verify GPU device was registered in HyperConverged CR
      ansible.builtin.assert:
        that:
          - hc_matching_gpu_devices | length == 1
        fail_msg: "GPU device not registered in HyperConverged CR: {{ hc_cr.resources }}"
