- name: Get list of existing ComputeInstance templates
  ansible.builtin.uri:
    url: "{{ publish_templates_compute_instance_api_endpoint }}"
    validate_certs: "{{ publish_templates_validate_certs | default(true) | bool }}"
    headers:
      authorization: Bearer {{ osac_fulfillment_service_token }}
    status_code: [200, 404, 503]
  register: compute_instance_template_check

- name: Skip ComputeInstance templates when service is disabled
  ansible.builtin.debug:
    msg: "VMaaS service not available (HTTP {{ compute_instance_template_check.status }}) — skipping compute instance template publishing"
  when: compute_instance_template_check.status in [404, 503]

- name: Create list of existing ComputeInstance template IDs
  ansible.builtin.set_fact:
    compute_instance_template_ids: >-
      {{
      compute_instance_template_check | json_query("json.items[].id")
      }}
  when: >-
    compute_instance_template_check.status not in [404, 503]
    and compute_instance_template_check is success
    and compute_instance_template_check.json.get('items', []) | length > 0

- name: Publish ComputeInstance template records
  ansible.builtin.include_tasks: publish_template_items.yaml
  vars:
    publish_template_items: "{{ osac_compute_instance_templates }}"
    publish_template_existing_ids: "{{ compute_instance_template_ids | default([]) }}"
    publish_template_api_endpoint: "{{ publish_templates_compute_instance_api_endpoint }}"
    publish_template_resource_name: ComputeInstance template
  when: compute_instance_template_check.status not in [404, 503]
