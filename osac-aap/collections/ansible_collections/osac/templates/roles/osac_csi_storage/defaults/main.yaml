---
# Chart settings shared with osac.service.csi_driver_install, which installs
# the same csi-driver chart on the hub. They are read from its defaults so hub
# and tenant clusters cannot drift apart.
_osac_csi_driver_install_defaults_file: >-
  {{ role_path }}/../../../service/roles/csi_driver_install/defaults/main.yaml

# Namespace created on the tenant cluster for the OSAC CSI driver workloads.
osac_csi_driver_namespace: >-
  {{ (lookup('ansible.builtin.file', _osac_csi_driver_install_defaults_file)
      | from_yaml).csi_driver_install_namespace }}

# CSI driver name registered with Kubernetes, and the StorageClass provisioner.
osac_csi_driver_name: >-
  {{ (lookup('ansible.builtin.file', _osac_csi_driver_install_defaults_file)
      | from_yaml).csi_driver_install_storage_class_provisioner }}

osac_csi_driver_chart_ref: >-
  {{ (lookup('ansible.builtin.file', _osac_csi_driver_install_defaults_file)
      | from_yaml).csi_driver_install_chart_registry }}/csi-driver

osac_csi_driver_chart_version: >-
  {{ (lookup('ansible.builtin.file', _osac_csi_driver_install_defaults_file)
      | from_yaml).csi_driver_install_chart_version }}

# Per-vendor node CSI socket directories on guest worker nodes.
osac_csi_driver_vendor_node_socket_paths: >-
  {{ (lookup('ansible.builtin.file', _osac_csi_driver_install_defaults_file)
      | from_yaml).csi_driver_install_vendor_node_socket_paths }}

osac_csi_driver_reclaim_policy: >-
  {{ (lookup('ansible.builtin.file', _osac_csi_driver_install_defaults_file)
      | from_yaml).csi_driver_install_storage_class_reclaim_policy }}

# Helm release name, matching the hub release. The chart's fullname template
# yields "<release>-controller" when the release name contains the chart name.
osac_csi_driver_helm_release: csi-driver

# Name of the Kubernetes Secret created on the tenant cluster holding OAuth2 credentials.
osac_csi_driver_credentials_secret_name: osac-csi-driver-credentials

# TLS: set true to skip TLS verification when the fulfillment-service endpoint uses a
# self-signed certificate.  Should be false in production.
osac_csi_driver_fulfillment_tls_insecure: false

# StorageClass volumeBindingMode. Unlike the hub's local tier (WaitForFirstConsumer),
# OSAC-managed tiers bind Immediate because the backend handles topology.
osac_csi_driver_volume_binding_mode: Immediate
