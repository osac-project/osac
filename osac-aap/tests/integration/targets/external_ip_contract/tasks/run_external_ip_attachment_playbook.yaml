---
- name: Build the ExternalIPAttachment AAP job variables
  ansible.builtin.set_fact:
    eip_contract_attachment_job_vars:
      resource: "{{ eip_contract_attachment }}"

- name: Write the ExternalIPAttachment playbook input
  ansible.builtin.copy:
    dest: "{{ eip_contract_vars_file }}"
    mode: "0600"
    content: >-
      {{ {'osac_job_vars': eip_contract_attachment_job_vars,
          'ansible_connection': 'local',
          'ansible_become': false,
          'ansible_python_interpreter': ansible_playbook_python} | to_json }}

- name: Run the top-level ExternalIPAttachment playbook
  ansible.builtin.command:
    argv:
      - uv
      - run
      - ansible-playbook
      - -i
      - localhost,
      - "{{ playbook_dir }}/../../../../../playbook_osac_{{ eip_contract_attachment_operation }}_external_ip.yml"
      - -e
      - "@{{ eip_contract_vars_file }}"
  args:
    chdir: "{{ playbook_dir }}/../../../../../"
  environment:
    ANSIBLE_STDOUT_CALLBACK: ansible.posix.json
    ANSIBLE_SHOW_CUSTOM_STATS: "true"
    KUBECONFIG: "{{ lookup('env', 'KUBECONFIG') }}"
    K8S_AUTH_KUBECONFIG: "{{ lookup('env', 'K8S_AUTH_KUBECONFIG') }}"
  register: eip_contract_attachment_playbook_result
  changed_when: false
  failed_when: false

- name: Remove the temporary ExternalIPAttachment input file
  ansible.builtin.file:
    path: "{{ eip_contract_vars_file }}"
    state: absent

- name: Check the ExternalIPAttachment playbook result
  ansible.builtin.assert:
    that:
      - eip_contract_attachment_playbook_result.rc == 0
    fail_msg: >-
      The {{ eip_contract_attachment_operation }} ExternalIPAttachment playbook
      returned {{ eip_contract_attachment_playbook_result.rc }}.
      stdout={{ eip_contract_attachment_playbook_result.stdout | default('') }}
      stderr={{ eip_contract_attachment_playbook_result.stderr | default('') }}
