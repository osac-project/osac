# OSAC-3370: fork CodeRabbit APPROVED cannot gh run rerun from
# pull_request_review (read-only token). Listener must live here.
# Resolve + replay live in osac-test-infra e2e-on-approval-fork.yml.
name: E2E on CodeRabbit approval (fork replay)

on:
  workflow_run:
    workflows: ["E2E on CodeRabbit approval"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: e2e-start-fork-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  replay:
    permissions:
      actions: write
      checks: write
      contents: read
      issues: read
      pull-requests: write
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request_review'
    uses: osac-project/osac-test-infra/.github/workflows/e2e-on-approval-fork.yml@main
    with:
      workflows: e2e-vmaas-full-install.yml,e2e-bmaas-full-install.yml,e2e-caas-full-install.yml
