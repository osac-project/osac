# ──────────────────────────────────────────────────────────────
# Test 12: Missing tenant_namespace -- error path
# Expected: role fails with tenant_namespace required message
# ──────────────────────────────────────────────────────────────
- name: Test storage_provider -- missing tenant_namespace (should fail)
