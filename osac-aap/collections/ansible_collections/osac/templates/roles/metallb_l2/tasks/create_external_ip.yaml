---
- name: Read the ExternalIP contract version
  ansible.builtin.set_fact:
    metallb_external_ip_contract_version: >-
      {{ (external_ip.metadata.annotations | default({})).get(
           'osac.openshift.io/externalip-contract-version', '') }}

- name: Validate the ExternalIP contract version
  ansible.builtin.assert:
    that:
      - metallb_external_ip_contract_version in ['', 'v1']
    fail_msg: >-
      MetalLB ExternalIP supports the unversioned contract and v1; received
      '{{ metallb_external_ip_contract_version }}'.

- name: Create ExternalIP with the v1 result contract
  ansible.builtin.include_tasks: _create_external_ip_v1.yaml
  when: metallb_external_ip_contract_version == 'v1'

- name: Create ExternalIP with the legacy annotation contract
  ansible.builtin.include_tasks: _create_external_ip_legacy.yaml
  when: metallb_external_ip_contract_version == ''
