---
- name: Ensure Netris auth
  ansible.builtin.include_role:
    name: netris.controller.auth
  when: netris_session_cookie is not defined

- name: Query IPAM tree filtered by VPC
  netris.controller.protected_uri:
    force: true
    url: >-
      {{ netris_controller_url }}/api/v2/ipam{{
        ('?filterByVpc=' + (ipam_vpc_id | string))
        if ipam_vpc_id is defined and ipam_vpc_id | string | length > 0 else ''
      }}
    method: GET
    headers:
      Cookie: "connect.sid={{ netris_session_cookie }}"
      Cache-Control: "no-cache"
      Pragma: "no-cache"
    return_content: true
    status_code: [200]
    timeout: "{{ netris_timeout | default(30) }}"
    validate_certs: "{{ netris_validate_certs | default(true) }}"
    ca_path: "{{ netris_ca_path | default(omit, true) }}"
  register: _ipam_tree_resp
  no_log: true

- name: Find allocation by name
  ansible.builtin.set_fact:
    _existing_ipam_alloc: >-
      {{ (_ipam_tree_resp.json.data | default([]))
         | selectattr('name', 'equalto', ipam_name)
         | list | first | default(none) }}

- name: Verify IPAM allocation ownership before deletion
  when:
    - _existing_ipam_alloc is defined
    - _existing_ipam_alloc is mapping
    - ipam_expected_fields is defined
    - _ipam_tree_resp.json is defined
    - _ipam_tree_resp.json is mapping
  block:
    - name: Compare IPAM allocation with the OSAC resource
      ansible.builtin.set_fact:
        _ipam_delete_mismatches: >-
          {{ _existing_ipam_alloc | netris.controller.netris_immutable_mismatch(
               ipam_expected_fields
             ) }}

    - name: Refuse to delete a mismatched or unverifiable IPAM allocation
      ansible.builtin.fail:
        msg: >-
          {{ 'IPAM allocation' | netris.controller.format_immutable_mismatch_message(
               ipam_name, _ipam_delete_mismatches) }}
      when: _ipam_delete_mismatches | length > 0

- name: Validate existing IPAM allocation has an ID before deletion
  ansible.builtin.assert:
    that:
      - _existing_ipam_alloc.id is defined
      - _existing_ipam_alloc.id is not none
      - _existing_ipam_alloc.id | string | length > 0
    fail_msg: >-
      Netris IPAM allocation '{{ ipam_name }}' was found but its list response
      omitted the ID; refusing to delete without a stable provider identifier.
  when: _existing_ipam_alloc is defined and _existing_ipam_alloc is mapping

- name: Delete IPAM allocation
  when: _existing_ipam_alloc is defined and _existing_ipam_alloc is mapping
  netris.controller.protected_uri:
    url: "{{ netris_controller_url }}/api/v2/ipam/allocation/{{ _existing_ipam_alloc.id }}"
    method: DELETE
    headers:
      Cookie: "connect.sid={{ netris_session_cookie }}"
    return_content: true
    status_code: [200, 204, 400, 404]
    timeout: "{{ netris_timeout | default(30) }}"
    validate_certs: "{{ netris_validate_certs | default(true) }}"
    ca_path: "{{ netris_ca_path | default(omit, true) }}"
  register: _ipam_alloc_delete_resp
  no_log: true

- name: Fail if IPAM allocation deletion returned an error
  when:
    - _ipam_alloc_delete_resp is defined
    - _ipam_alloc_delete_resp.status | default(200) == 400
  ansible.builtin.fail:
    msg: >-
      Failed to delete IPAM allocation '{{ ipam_name }}' (ID: {{ _existing_ipam_alloc.id }}).
      Netris responded with: {{ _ipam_alloc_delete_resp.json.message | default(_ipam_alloc_delete_resp.content | default('unknown error')) }}.
      This usually means the allocation still has child subnets that must be deleted first.
