{{- if and .Values.tenants .Values.controllers.storage }}
{{- range .Values.tenants }}
---
apiVersion: v1
kind: Secret
metadata:
  name: lvms-tenant-config-{{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    osac.openshift.io/tenant: {{ .name | quote }}
    osac.openshift.io/storage-provider: lvms
type: Opaque
stringData:
  provider: lvms
{{- end }}
{{- end }}
