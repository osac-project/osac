---
apiVersion: osac.openshift.io/v1alpha1
kind: ClusterOrder
metadata:
  name: test-cluster
  namespace: osac-system
spec:
  templateID: osac.templates.ocp_ci_small
  pullSecretRef:
    name: fixture-source
  pullSecretRevision: fixture-revision
  templateParameters: |
    {
      "ssh_public_key": "ssh-rsa test-key test@example.com"
    }
  nodeRequests:
    - nodeSet: workers
      numberOfNodes: 1
      bareMetal:
        instanceType: ci-worker
