---
# Shared tenant-credentials-only guard for setup.yaml and teardown_backend.yaml.
# Without admin credentials this role cannot manage VAST objects, so it may only
# carry on when the hub Secret lookup succeeded and found no Secret. Order:
# reduce the lookup to booleans, clear the caller's lookup variable, refuse when
# the Secret is unreadable, then refuse when it is present.
#
# Callers MUST have included _detect_credential_mode.yaml first, and MUST include
# this file with `when: _vast_tenant_credentials_only | bool`.
#
# Requires (include vars):
#   _vast_hub_secret_var       name of the variable holding the registered
#                              kubernetes.core.k8s_info result (a string)
#   _vast_hub_secret_cleared   value the caller's lookup variable is reset to
#                              once reduced ({} for setup, {resources: []} for
#                              teardown, whose later tasks still read `resources`)
#   _vast_refuse_unreadable_tail  ends the "could not read" message
#   _vast_refuse_present_tail     ends the "leftovers" message
#   _vast_backend_id, _provider_tiers, tenant_name,
#   vast_storage_tenant_config_secret_prefix
#
# Sets:
#   _vast_hub_secret_unreadable, _vast_hub_secret_present (booleans),
#   osac_storage_provider_failures (only when refusing)
#
# Fails with the unreadable or the leftovers message; returns normally only when
# the lookup succeeded and found no Secret.

- name: Reduce the hub Secret lookup to booleans and clear it
  ansible.builtin.set_fact:
    _vast_hub_secret_unreadable: >-
      {{ (lookup('ansible.builtin.vars', _vast_hub_secret_var)).resources is not defined
         or ((lookup('ansible.builtin.vars', _vast_hub_secret_var)).api_found is defined
             and not (lookup('ansible.builtin.vars', _vast_hub_secret_var)).api_found) }}
    _vast_hub_secret_present: >-
      {{ (lookup('ansible.builtin.vars', _vast_hub_secret_var)).resources is defined
         and ((lookup('ansible.builtin.vars', _vast_hub_secret_var)).resources | length > 0) }}
    "{{ _vast_hub_secret_var }}": "{{ _vast_hub_secret_cleared }}"
  no_log: true

- name: Build structured failure artifact for unreadable hub Secret
  when: _vast_hub_secret_unreadable | bool
  ansible.builtin.set_fact:
    osac_storage_provider_failures:
      - reason: hub_secret_unreadable
        tiers: "{{ _provider_tiers | map(attribute='name') | list }}"
        backend_ids:
          - "{{ _vast_backend_id }}"
        message: >-
          Could not read hub Secret
          '{{ vast_storage_tenant_config_secret_prefix }}{{ tenant_name }}-{{ _vast_backend_id }}'
          for backend '{{ _vast_backend_id }}'.

- name: Emit structured failure artifact for unreadable hub Secret
  when: _vast_hub_secret_unreadable | bool
  ansible.builtin.set_stats:
    data:
      osac_storage_provider_failures: "{{ osac_storage_provider_failures }}"
    aggregate: false

- name: Fail when the hub Secret cannot be read without admin credentials
  when: _vast_hub_secret_unreadable | bool
  ansible.builtin.fail:
    msg: >-
      Could not read hub Secret
      '{{ vast_storage_tenant_config_secret_prefix }}{{ tenant_name }}-{{ _vast_backend_id }}';
      {{ _vast_refuse_unreadable_tail }}

- name: Build structured failure artifact for admin-flow leftovers
  when: _vast_hub_secret_present | bool
  ansible.builtin.set_fact:
    osac_storage_provider_failures:
      - reason: admin_flow_leftovers_without_credentials
        tiers: "{{ _provider_tiers | map(attribute='name') | list }}"
        backend_ids:
          - "{{ _vast_backend_id }}"
        message: >-
          Hub Secret
          '{{ vast_storage_tenant_config_secret_prefix }}{{ tenant_name }}-{{ _vast_backend_id }}'
          exists but no admin credentials were supplied for backend '{{ _vast_backend_id }}'.

- name: Emit structured failure artifact for admin-flow leftovers
  when: _vast_hub_secret_present | bool
  ansible.builtin.set_stats:
    data:
      osac_storage_provider_failures: "{{ osac_storage_provider_failures }}"
    aggregate: false

- name: Fail when admin-flow leftovers exist and no admin credentials were supplied
  when: _vast_hub_secret_present | bool
  ansible.builtin.fail:
    msg: >-
      Hub Secret '{{ vast_storage_tenant_config_secret_prefix }}{{ tenant_name }}-{{ _vast_backend_id }}'
      exists but no admin credentials were supplied for backend '{{ _vast_backend_id }}'.
      The VAST objects it records were created with admin credentials and
      {{ _vast_refuse_present_tail }}
