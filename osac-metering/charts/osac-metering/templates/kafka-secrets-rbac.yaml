{{- /* Grants the metering ServiceAccount read access to Kafka secrets
     in the Kafka cluster namespace. The initContainer uses this to
     fetch SASL credentials and CA cert at startup. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "osac-metering.fullname" . }}-read-kafka-secrets
  namespace: {{ include "osac-metering.kafkaClusterNamespace" . }}
  labels:
    {{- include "osac-metering.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ include "osac-metering.kafkaSaslSecretName" . }}
      - {{ include "osac-metering.kafkaCaSecret" . }}
      {{- if .Values.echoAdapter.enabled }}
      - osac-metering-echo-adapter
      {{- end }}
      {{- if .Values.m360Adapter.enabled }}
      - osac-metering-m360-adapter
      {{- end }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "osac-metering.fullname" . }}-read-kafka-secrets
  namespace: {{ include "osac-metering.kafkaClusterNamespace" . }}
  labels:
    {{- include "osac-metering.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "osac-metering.fullname" . }}-read-kafka-secrets
subjects:
  - kind: ServiceAccount
    name: {{ include "osac-metering.fullname" . }}
    namespace: {{ .Release.Namespace }}
