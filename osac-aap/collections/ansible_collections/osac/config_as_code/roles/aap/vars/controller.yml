---
gateway_settings:
  gateway_access_token_expiration: 7200

# Name of the credential that makes the AAP controller create this run's job
# pods inside the run's vcluster: attached to every container group below, it
# points the controller at the vcluster API with the run's bearer token.
# Empty when no vcluster API URL is set; the vendored instance-group role
# turns an empty credential into an omitted module argument, so the groups
# stay exactly as they are today.
aap_vcluster_credential_name: "{{ (aap_prefix ~ '-vcluster') if vcluster_api_url else '' }}"

# Coordinates of the AAP admin-password Secret that the hourly config-as-code
# rerun reads its own login from. config-as-code-secret.yaml sets both to the
# Secret the bootstrap job uses: the bundled instance's
# <instance>-admin-password, or bootstrap.adminPasswordSecret for an external
# AAP. A direct playbook run without that Secret falls back to the bundled
# defaults.
aap_admin_password_secret_name: "{{ lookup('env', 'AAP_ADMIN_PASSWORD_SECRET_NAME', default='osac-aap-admin-password') }}"
aap_admin_password_secret_key: "{{ lookup('env', 'AAP_ADMIN_PASSWORD_SECRET_KEY', default='password') }}"

# The credential itself. verify_ssl is false: the CI CA that signed the
# vcluster API certificate is not in the controller's trust store. The empty
# list without a vcluster API URL leaves the dispatcher's credentials step a
# no-op, like controller_roles in vars/aap.yml.
controller_credentials: # noqa: var-naming[no-role-prefix]
  "{{ [{
         'name': aap_prefix ~ '-vcluster',
         'description': 'Bearer token for the vcluster API of ' ~ aap_organization_name,
         'organization': aap_organization_name,
         'credential_type': 'OpenShift or Kubernetes API Bearer Token',
         'inputs': {
           'host': vcluster_api_url,
           'bearer_token': vcluster_token,
           'verify_ssl': false,
         },
       }] if vcluster_api_url else [] }}"

# Create a project from the specified git repo. scm_url/scm_branch aren't
# set here -- configure_project_scm.yml merges them in at runtime from
# aap_project_git_uri/aap_project_git_branch (config.yml), which now default
# to the mono-repo. AWX/Controller Projects clone the whole repo with no
# native subdirectory-scoping mechanism, so every playbook: path below is
# prefixed with osac-aap/ to stay resolvable against that mono-repo checkout.
controller_projects: # noqa: var-naming[no-role-prefix]
  - name: "{{ aap_prefix }}"
    description: "{{ aap_project_name }}'s project"
    organization: "{{ aap_organization_name }}"
    scm_clean: true
    scm_update_on_launch: false
    scm_credential: ""
    update_project: true
    wait: true

# The dispatcher registers credential types and credentials before job templates.
aap_fulfillment_reader_enabled: "{{ aap_fulfillment_reader_issuer_url | default('') | length > 0 }}"
aap_fulfillment_reader_credential_name: "{{ aap_prefix }}-fulfillment-secret-reader"
controller_configuration_credentials_secure_logging: true # noqa: var-naming[no-role-prefix]
controller_credential_types: >- # noqa: var-naming[no-role-prefix]
  {{ [aap_fulfillment_reader_credential_type] if aap_fulfillment_reader_enabled | bool else [] }}
controller_credentials: >- # noqa: var-naming[no-role-prefix]
  {{ [aap_fulfillment_reader_credential] if aap_fulfillment_reader_enabled | bool else [] }}
aap_fulfillment_reader_credential_type:
  name: "{{ aap_fulfillment_reader_credential_name }}"
  kind: cloud
  inputs:
    fields:
      - id: client_id
        label: Keycloak client ID
        type: string
      - id: client_secret
        label: Keycloak client secret
        type: string
        secret: true
      - id: issuer_url
        label: Keycloak issuer URL
        type: string
      - id: api_url
        label: Fulfillment internal API URL
        type: string
    required: [client_id, client_secret, issuer_url, api_url]
  # The controller credential types role restores the split opening braces.
  injectors: >-
    {
      "file": {"template": "{  { client_secret }}"},
      "env": {
        "OSAC_FULFILLMENT_CLIENT_SECRET_FILE": "{  { tower.filename }}",
        "OSAC_FULFILLMENT_CLIENT_ID": "{  { client_id }}",
        "OSAC_FULFILLMENT_ISSUER_URL": "{  { issuer_url }}",
        "OSAC_FULFILLMENT_INTERNAL_API_URL": "{  { api_url }}",
        "OSAC_FULFILLMENT_CA_FILE": "/etc/ca-bundle/bundle.pem"
      }
    }
aap_fulfillment_reader_credential:
  name: "{{ aap_fulfillment_reader_credential_name }}"
  organization: "{{ aap_organization_name }}"
  credential_type: "{{ aap_fulfillment_reader_credential_name }}"
  update_secrets: true
  inputs:
    client_id: osac-aap-secret-reader
    client_secret: "{{ lookup('ansible.builtin.env', 'OSAC_AAP_SECRET_READER_CLIENT_SECRET') }}"
    issuer_url: "{{ aap_fulfillment_reader_issuer_url }}"
    api_url: "{{ aap_fulfillment_reader_api_url }}"

