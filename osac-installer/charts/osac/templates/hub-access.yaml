{{- if .Values.hubAccess.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hub-access
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
---
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: hub-access
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: hub-access
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-hub-access
  labels:
    {{- include "osac.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - osac.openshift.io
    resources:
      - baremetalinstances
      - clusterorders
      - computeinstances
      - externalipattachments
      - externalippools
      - externalips
      - natgateways
      - securitygroups
      - subnets
      - tenants
      - virtualnetworks
      - volumes
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - osac.openshift.io
    resources:
      - baremetalinstances/status
      - clusterorders/status
      - computeinstances/status
      - externalipattachments/status
      - externalippools/status
      - externalips/status
      - natgateways/status
      - securitygroups/status
      - subnets/status
      - tenants/status
      - virtualnetworks/status
      - volumes/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - console.osac.openshift.io
    resources:
      - computeinstances/console
      - computeinstances/vnc
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hub-access
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-hub-access
subjects:
  - kind: ServiceAccount
    name: hub-access
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-hub-access-hosted-clusters
  labels:
    {{- include "osac.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - hypershift.openshift.io
    resources:
      - hostedclusters
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - osac.openshift.io
    resources:
      - subnets
      - networkclasses
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-hub-access-hosted-clusters
  labels:
    {{- include "osac.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-hub-access-hosted-clusters
subjects:
  - kind: ServiceAccount
    name: hub-access
    namespace: {{ .Release.Namespace }}
{{- end }}
