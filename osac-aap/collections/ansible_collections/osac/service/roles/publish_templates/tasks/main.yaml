---
# Reject cleartext HTTP endpoints (except loopback) before sending any
# authenticated request.  HTTPS is always accepted; plain HTTP is allowed
# only for loopback addresses used by test mocks (127.0.0.1, localhost,
# [::1]).  The base URI and all per-type endpoint overrides are validated
# because each independently carries a Bearer token.
# See OSAC-5383.
- name: Validate publish endpoint URI schemes
  ansible.builtin.assert:
    that:
      - >-
        _endpoint.uri is regex('^https://', ignorecase=True)
        or (
          _endpoint.uri is regex('^http://', ignorecase=True)
          and _endpoint.uri is regex('^http://(localhost|127\.0\.0\.1|\[::1\])(:|/|$)', ignorecase=True)
        )
    fail_msg: >-
      Fulfillment-service URI must use HTTPS (or loopback HTTP for testing).
  loop:
    - name: osac_fulfillment_service_uri
      uri: "{{ osac_fulfillment_service_uri }}"
    - name: publish_templates_cluster_api_endpoint
      uri: "{{ publish_templates_cluster_api_endpoint }}"
    - name: publish_templates_compute_instance_api_endpoint
      uri: "{{ publish_templates_compute_instance_api_endpoint }}"
    - name: publish_templates_bare_metal_instance_api_endpoint
      uri: "{{ publish_templates_bare_metal_instance_api_endpoint }}"
    - name: publish_templates_addon_operator_api_endpoint
      uri: "{{ publish_templates_addon_operator_api_endpoint }}"
  loop_control:
    loop_var: _endpoint
    label: "{{ _endpoint.name }}"

- name: Apply templates for clusters
  ansible.builtin.include_tasks: clusters.yaml

- name: Apply templates for compute instances
  ansible.builtin.include_tasks: compute_instances.yaml

- name: Apply templates for bare metal instances
  ansible.builtin.include_tasks: bare_metal_instances.yaml

- name: Apply templates for add-on operators
  ansible.builtin.include_tasks: addon_operators.yaml
