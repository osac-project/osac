{{- if dig "observability" "enabled" false (.Values.global | default dict) }}
{{- $obs := .Values.global.observability -}}
{{- $storage := $obs.objectStorage | default dict -}}
{{- $endpoint := required "global.observability.objectStorage.endpoint is required when observability is enabled" $storage.endpoint -}}
{{- /*
Thanos's S3 provider rejects an endpoint that carries a scheme or a path
("Endpoint url cannot have fully qualified paths"); TLS is selected by
`insecure` instead. The value keeps its scheme so the chart schema and the
preflight can validate it, and only the rendered file is reduced to host:port.
An http:// endpoint is plaintext by definition, so it forces insecure: true
rather than letting a TLS handshake fail against the listener.
*/ -}}
{{- $insecure := $storage.insecure | default false -}}
{{- if hasPrefix "http://" $endpoint -}}
{{- $insecure = true -}}
{{- end -}}
{{- $endpoint = regexReplaceAll "^[a-zA-Z][a-zA-Z0-9+.-]*://" $endpoint "" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: thanos-object-storage
  namespace: {{ include "osac-observability.namespace" . }}
  labels:
    {{- include "osac-observability.labels" . | nindent 4 }}
data:
  # Non-secret description of the bucket. Credentials come from the existing
  # Secret named by global.observability.objectStorage.secretName.
  objstore.yml: |
    type: S3
    config:
      bucket: {{ required "global.observability.objectStorage.bucket is required when observability is enabled" $storage.bucket | quote }}
      endpoint: {{ $endpoint | quote }}
      insecure: {{ $insecure }}
      # Use the pod's credential chain (the mounted Secret) instead of the
      # anonymous default, which would make every bucket read fail.
      aws_sdk_auth: true
      {{- with $storage.region }}
      region: {{ . | quote }}
      {{- end }}
{{- end }}
