syntax = "proto3";

package osac.private.v1;

import "buf/validate/validate.proto";
import "cleanapi/cleanapi.proto";
import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "osac/private/v1/notification_subscription_type.proto";

option (cleanapi.file).package = "osac.public.v1";
option (cleanapi.file).http_route_prefix_map = "private:fulfillment";

message NotificationSubscriptionsListRequest {
  optional int32 offset = 1;
  optional int32 limit = 2;
  optional string filter = 3;
  optional string order = 4;
}

message NotificationSubscriptionsListResponse {
  int32 size = 1;
  int32 total = 2;
  repeated NotificationSubscription items = 3;
}

message NotificationSubscriptionsGetRequest {
  string id = 1;
}

message NotificationSubscriptionsGetResponse {
  NotificationSubscription object = 1;
}

message NotificationSubscriptionsCreateRequest {
  NotificationSubscription object = 1 [(buf.validate.field).required = true];
}

message NotificationSubscriptionsCreateResponse {
  NotificationSubscription object = 1;

  // HMAC signing secret. Returned only on Create; never on Get or List.
  string signing_secret = 2;
}

message NotificationSubscriptionsUpdateRequest {
  NotificationSubscription object = 1;
  google.protobuf.FieldMask update_mask = 2;
  bool lock = 3;
}

message NotificationSubscriptionsUpdateResponse {
  NotificationSubscription object = 1;
}

message NotificationSubscriptionsDeleteRequest {
  string id = 1;
}

message NotificationSubscriptionsDeleteResponse {}

message NotificationSubscriptionsSignalRequest {
  option (cleanapi.message).private = true;
  string id = 1;
}

message NotificationSubscriptionsSignalResponse {
  option (cleanapi.message).private = true;
}

// Manages Tenant Admin webhook subscriptions.
service NotificationSubscriptions {
  rpc List(NotificationSubscriptionsListRequest) returns (NotificationSubscriptionsListResponse) {
    option (google.api.http) = {get: "/api/private/v1/notification_subscriptions"};
  }

  rpc Get(NotificationSubscriptionsGetRequest) returns (NotificationSubscriptionsGetResponse) {
    option (google.api.http) = {
      get: "/api/private/v1/notification_subscriptions/{id}"
      response_body: "object"
    };
  }

  rpc Create(NotificationSubscriptionsCreateRequest) returns (NotificationSubscriptionsCreateResponse) {
    option (google.api.http) = {
      post: "/api/private/v1/notification_subscriptions"
      body: "object"
    };
  }

  rpc Update(NotificationSubscriptionsUpdateRequest) returns (NotificationSubscriptionsUpdateResponse) {
    option (google.api.http) = {
      patch: "/api/private/v1/notification_subscriptions/{object.id}"
      body: "object"
      response_body: "object"
    };
  }

  rpc Delete(NotificationSubscriptionsDeleteRequest) returns (NotificationSubscriptionsDeleteResponse) {
    option (google.api.http) = {delete: "/api/private/v1/notification_subscriptions/{id}"};
  }

  rpc Signal(NotificationSubscriptionsSignalRequest) returns (NotificationSubscriptionsSignalResponse) {
    option (cleanapi.method).private = true;
  }
}
