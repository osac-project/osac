---
# Per-backend validation and claim of a prepared ONTAP assignment (included by
# setup.yaml with loop_var _ontap_backend_id).
#
# Consumes the PR#1553 operator-injected tenant_preparation payload:
#   _provider_backend_connections[_ontap_backend_id].tenant_preparation:
#     tenant_id:       <immutable-osac-tenant-id>
#     source:          {namespace, name, uid, resource_version}
#     provider_config: {username, password, svm}
#
# No prepared Secret is read or patched on the hub cluster — osac-operator
# resolves the preparation Secret and passes the explicit SVM name and runtime
# credentials in tenant_preparation.
#
# Records claim ownership and completed stage in a deterministic hub lifecycle
# Secret (ontap-tenant-<assignment_key>) in ontap_storage_config_namespace
# without copying the runtime password.

- name: Compute assignment key and select tiers for backend {{ _ontap_backend_id }}
  ansible.builtin.set_fact:
    _assignment_key: >-
      {{ ((_ontap_backend_id ~ '|' ~ tenant_name) | hash('sha256'))[:16] | lower }}
    _lifecycle_secret_name: "ontap-tenant-{{ ((_ontap_backend_id ~ '|' ~ tenant_name) | hash('sha256'))[:16] | lower }}"
    _backend_tiers: "{{ _provider_tiers | selectattr('backend_id', 'equalto', _ontap_backend_id) | list }}"
  no_log: true

- name: Fail if tenant_preparation is missing for backend {{ _ontap_backend_id }}
  ansible.builtin.fail:
    msg: >-
      storage_backend_connections['{{ _ontap_backend_id }}'] is missing
      tenant_preparation.provider_config. osac-operator must resolve the tenant
      preparation and supply provider_config (username, password, svm) in
      storage_backend_connections.
  when: >-
    _provider_backend_connections[_ontap_backend_id].tenant_preparation is not defined or
    _provider_backend_connections[_ontap_backend_id].tenant_preparation is not mapping or
    _provider_backend_connections[_ontap_backend_id].tenant_preparation.provider_config is not defined or
    _provider_backend_connections[_ontap_backend_id].tenant_preparation.provider_config is not mapping

- name: Extract operator-supplied tenant preparation for backend {{ _ontap_backend_id }}
  ansible.builtin.set_fact:
    _prep_config: "{{ _provider_backend_connections[_ontap_backend_id].tenant_preparation.provider_config }}"
    _prep_source: "{{ _provider_backend_connections[_ontap_backend_id].tenant_preparation.source | default({}) }}"
    _prep_tenant_id: "{{ _provider_backend_connections[_ontap_backend_id].tenant_preparation.tenant_id | default('') }}"
  no_log: true

- name: Validate operator-supplied tenant preparation fields
  ansible.builtin.fail:
    msg: >-
      tenant_preparation for backend '{{ _ontap_backend_id }}' is missing one
      or more required provider_config fields (username, password, svm).
  when: >-
    _prep_config.username is not defined or _prep_config.username is none or _prep_config.username | default('') | string | trim | length == 0 or
    _prep_config.password is not defined or _prep_config.password is none or _prep_config.password | default('') | string | trim | length == 0 or
    _prep_config.svm is not defined or _prep_config.svm is none or _prep_config.svm | default('') | string | trim | length == 0

- name: Set expected SVM and source identity from operator-supplied preparation
  ansible.builtin.set_fact:
    _expected_svm_name: "{{ _prep_config.svm | string | trim }}"
    _source_secret_name: "{{ _prep_source.name | default('') }}"
    _source_secret_namespace: "{{ _prep_source.namespace | default(ontap_storage_trident_namespace) }}"
    _source_secret_uid: "{{ _prep_source.uid | default('') }}"
  no_log: true

# Check existing hub lifecycle Secret for ownership conflicts BEFORE probing or
# mutating state (prevents a recreated tenant with the same name from adopting a
# retained assignment).
- name: Read existing hub lifecycle Secret for backend {{ _ontap_backend_id }}
  kubernetes.core.k8s_info:
    kubeconfig: ~
    api_version: v1
    kind: Secret
    name: "{{ _lifecycle_secret_name }}"
    namespace: "{{ ontap_storage_config_namespace }}"
  register: _existing_lifecycle_secret
  no_log: true

- name: Fail if hub lifecycle Secret is owned by another tenant or retained
  ansible.builtin.fail:
    msg: >-
      Assignment '{{ _assignment_key }}' for backend '{{ _ontap_backend_id }}'
      is already owned by another tenant instance or is in state 'retained'.
      Recreating a tenant with the same name does not authorize reuse of a
      claimed or retained assignment.
  when: >-
    _existing_lifecycle_secret.resources | length > 0 and (
      (_existing_lifecycle_secret.resources[0].data.lifecycle_stage | default('') | b64decode) == 'retained' or
      (
        (_existing_lifecycle_secret.resources[0].data.tenant_uid | default('') | b64decode) | length > 0 and
        (_existing_lifecycle_secret.resources[0].data.tenant_uid | default('') | b64decode) != tenant_uid
      )
    )

# Check if the cluster CA bundle file exists on disk so uri can use it when
# present, falling back to system trust store when absent.
- name: Check if cluster CA bundle exists at {{ ontap_storage_ca_bundle_path }}
  ansible.builtin.stat:
    path: "{{ ontap_storage_ca_bundle_path }}"
  register: _ontap_ca_bundle_stat

- name: Set ONTAP discovery connection for backend {{ _ontap_backend_id }}
  ansible.builtin.set_fact:
    _ontap_discovery:
      url: "{{ _provider_backend_connections[_ontap_backend_id].endpoint }}"
      username: "{{ _provider_backend_connections[_ontap_backend_id].username }}"
      password: "{{ _provider_backend_connections[_ontap_backend_id].password }}"
      ca_path: "{{ ontap_storage_ca_bundle_path if (_ontap_ca_bundle_stat.stat.exists | default(false)) else '' }}"
  no_log: true

- name: Discover the prepared SVM via the ONTAP REST API
  ansible.builtin.uri:
    url: "{{ _ontap_discovery.url }}/api/svm/svms?name={{ _expected_svm_name | urlencode }}&fields=uuid,name,state"
    method: GET
    user: "{{ _ontap_discovery.username }}"
    password: "{{ _ontap_discovery.password }}"
    force_basic_auth: true
    validate_certs: true
    ca_path: "{{ _ontap_discovery.ca_path if _ontap_discovery.ca_path | length > 0 else omit }}"
    timeout: "{{ ontap_storage_api_timeout | int }}"
    status_code: [200]
    return_content: true
  register: _svm_discovery
  no_log: true
  ignore_errors: true

- name: Fail on authentication failure against the ONTAP API
  ansible.builtin.fail:
    msg: >-
      Authentication failed against the ONTAP management endpoint
      '{{ _ontap_discovery.url }}' for backend '{{ _ontap_backend_id }}'
      (assignment '{{ _assignment_key }}'). Check the backend connection
      credentials passed by osac-operator.
  when: >-
    _svm_discovery.failed and
    (_svm_discovery.status | default(0) | int in [401, 403])

- name: Fail on unreachable ONTAP management endpoint
  ansible.builtin.fail:
    msg: >-
      Failed to reach the ONTAP management endpoint '{{ _ontap_discovery.url }}'
      for backend '{{ _ontap_backend_id }}' (assignment '{{ _assignment_key }}',
      status {{ _svm_discovery.status | default('none') }}). Verify the backend
      connection endpoint, TLS certificate trust, and network reachability from
      the storage-operations IG.
  when: _svm_discovery.failed

- name: Parse SVM discovery response
  ansible.builtin.set_fact:
    _svm_info: "{{ _svm_discovery.json }}"
  no_log: true

- name: Fail if the prepared SVM does not exist on the backend
  ansible.builtin.fail:
    msg: >-
      Prepared SVM for assignment '{{ _assignment_key }}' does not exist on
      backend '{{ _ontap_backend_id }}'. Re-run the admin preparation for this
      assignment.
  when: _svm_info.num_records | int == 0

- name: Extract SVM UUID
  ansible.builtin.set_fact:
    _svm_uuid: "{{ _svm_info.records[0].uuid }}"
  no_log: true

# Validate capped-tier QoS policies against the live ONTAP cluster when any
# tier on this backend specifies qos_limits.provider_config.max_iops > 0.
- name: Filter tiers requiring QoS validation on backend {{ _ontap_backend_id }}
  ansible.builtin.set_fact:
    _capped_tiers: >-
      {% set _list = [] -%}
      {% for tier in _backend_tiers -%}
      {% set _max_iops = (tier.qos_limits.provider_config.max_iops | default(0) | int)
                         if (tier.qos_limits is defined and tier.qos_limits.provider_config is defined)
                         else 0 -%}
      {% if _max_iops > 0 -%}
      {% set _tier_key = (tier.name | hash('sha256'))[:16] | lower -%}
      {% set _ = _list.append({
           'name': tier.name,
           'max_iops': _max_iops,
           'policy_name': 'osac-' ~ _assignment_key ~ '-' ~ _tier_key ~ '-qos'
         }) -%}
      {% endif -%}
      {% endfor -%}
      {{ _list }}
  no_log: true

- name: Discover prepared QoS policies on the ONTAP cluster for capped tiers
  when: _capped_tiers | length > 0
  ansible.builtin.uri:
    url: "{{ _ontap_discovery.url }}/api/storage/qos/policies?name={{ item.policy_name | urlencode }}&fields=uuid,name,svm,fixed"
    method: GET
    user: "{{ _ontap_discovery.username }}"
    password: "{{ _ontap_discovery.password }}"
    force_basic_auth: true
    validate_certs: true
    ca_path: "{{ _ontap_discovery.ca_path if _ontap_discovery.ca_path | length > 0 else omit }}"
    timeout: "{{ ontap_storage_api_timeout | int }}"
    status_code: [200]
    return_content: true
  loop: "{{ _capped_tiers }}"
  loop_control:
    label: "{{ item.policy_name }}"
  register: _qos_discovery_results
  no_log: true

- name: Validate each capped tier's prepared QoS policy matches the requested ceiling
  ansible.builtin.fail:
    msg: >-
      Prepared QoS policy '{{ item.item.policy_name }}' for tier
      '{{ item.item.name }}' on backend '{{ _ontap_backend_id }}' (assignment
      '{{ _assignment_key }}') is missing or invalid. Expected a fixed,
      non-shared (capacity_shared=false) policy owned by the prepared SVM with
      max_throughput_iops={{ item.item.max_iops }}.
  loop: "{{ _qos_discovery_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item.policy_name }}"
  when: >-
    (_capped_tiers | length > 0) and (
      (item.json.num_records | default(0) | int) == 0 or
      (item.json.records[0].svm is defined and item.json.records[0].svm.uuid is defined and item.json.records[0].svm.uuid != _svm_uuid) or
      item.json.records[0].fixed is not defined or
      (item.json.records[0].fixed.capacity_shared | default(false) | bool) or
      (item.json.records[0].fixed.max_throughput_iops | default(0) | int) != (item.item.max_iops | int)
    )

- name: Persist hub lifecycle Secret for backend {{ _ontap_backend_id }}
  kubernetes.core.k8s:
    kubeconfig: ~
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ _lifecycle_secret_name }}"
        namespace: "{{ ontap_storage_config_namespace }}"
        labels:
          app.kubernetes.io/managed-by: osac-aap
          osac.openshift.io/tenant: "{{ tenant_name }}"
          osac.openshift.io/storage-provider: ontap
          osac.openshift.io/storage-backend-id: "{{ _ontap_backend_id }}"
      type: Opaque
      stringData:
        assignment_key: "{{ _assignment_key }}"
        backend_id: "{{ _ontap_backend_id }}"
        tenant_name: "{{ tenant_name }}"
        tenant_uid: "{{ tenant_uid }}"
        tenant_id: "{{ _prep_tenant_id | default('') }}"
        svm_name: "{{ _expected_svm_name }}"
        svm_uuid: "{{ _svm_uuid }}"
        source_secret_name: "{{ _source_secret_name | default('') }}"
        source_secret_namespace: "{{ _source_secret_namespace | default('') }}"
        source_secret_uid: "{{ _source_secret_uid | default('') }}"
        trident_namespace: "{{ ontap_storage_trident_namespace }}"
        lifecycle_stage: "claimed"
  no_log: true

- name: Record the per-backend tenant config
  ansible.builtin.set_fact:
    _ontap_tenant_configs: >-
      {{ _ontap_tenant_configs | combine({
           _ontap_backend_id: {
             'assignment_key': _assignment_key,
             'svm_name': _expected_svm_name,
             'svm_uuid': _svm_uuid,
             'status': 'claimed'
           }
         }) }}
  no_log: true

- name: Clear credential-bearing facts
  ansible.builtin.set_fact:
    _prep_config: {}
    _prep_source: {}
    _existing_lifecycle_secret: {}
    _svm_discovery: {}
    _svm_info: {}
    _qos_discovery_results: {}
    _ontap_discovery: {}
  no_log: true
