# ── Test 9: Shared-TBC ensure_storage_class (Bound TBC + selector update) ──
- name: "ONTAP Storage Provider - Shared-TBC ensure_storage_class with Bound customer TBC"
  hosts: localhost
  gather_facts: false

  vars:
    tenant_name: "test-ontap-shared"
    tenant_namespace: "osac-system"
    _t_assignment_key: "{{ (('ontap-shared-1' ~ '|' ~ tenant_name) | hash('sha256'))[:16] | lower }}"
    _sc_extreme: "ontap-{{ _t_assignment_key }}-{{ ('extreme' | hash('sha256'))[:16] | lower }}"
    _sc_value: "ontap-{{ _t_assignment_key }}-{{ ('value' | hash('sha256'))[:16] | lower }}"
    storage_provider_tiers:
      - name: extreme
        protocol: block
        provider: ontap
        backend_id: ontap-shared-1
        provider_config:
          profile: shared-fc
          pool_selector:
            performance: extreme
      - name: value
        protocol: block
        provider: ontap
        backend_id: ontap-shared-1
        provider_config:
          profile: shared-fc
          pool_selector:
            performance: value
    storage_provider_backend_connections:
      ontap-shared-1:
        provider_config:
          profiles:
            - name: shared-fc
              shared:
                tbc_namespace: trident
                tbc_name: customer-fc

  tasks:
    - name: Pre-create customer-owned TridentBackendConfig trident/customer-fc
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: trident.netapp.io/v1
          kind: TridentBackendConfig
          metadata:
            name: customer-fc
            namespace: trident
          spec:
            version: 1
            backendName: osiscsibackend
            storageDriverName: ontap-san
            dataLIF: 192.168.1.6
            storage:
              - labels:
                  performance: extreme
              - labels:
                  performance: highwrite
              - labels:
                  performance: value
      no_log: true

    - name: Patch customer-fc TBC status to Bound with backendInfo.backendName=osiscsibackend
      ansible.builtin.command:
        cmd: >-
          kubectl patch tridentbackendconfig customer-fc -n trident
          --subresource=status --type=merge
          -p '{"status":{"phase":"Bound","lastOperationStatus":"Success","backendInfo":{"backendName":"osiscsibackend","backendUUID":"uuid-customer-fc"}}}'
      changed_when: true
      no_log: true

    - name: Run ensure_storage_class for Shared-TBC backend
      ansible.builtin.include_role:
        name: osac.service.storage_provider
      vars:
        storage_provider_action: ensure_storage_class

    - name: Read back Shared-TBC StorageClasses
      kubernetes.core.k8s_info:
        api_version: storage.k8s.io/v1
        kind: StorageClass
        name: "{{ item }}"
      loop:
        - "{{ _sc_extreme }}"
        - "{{ _sc_value }}"
      loop_control:
        label: "shared-storage-class"
      register: _shared_scs
      no_log: true

    - name: Assert Shared-TBC StorageClasses carry selector and storagePools
      ansible.builtin.assert:
        that:
          - _shared_scs.results | map(attribute='resources') | flatten | length == 2
          - _shared_scs.results[0].resources[0].parameters['backendType'] == 'ontap-san'
          - _shared_scs.results[0].resources[0].parameters['selector'] == 'performance=extreme'
          - _shared_scs.results[0].resources[0].parameters['storagePools'] == 'osiscsibackend:.*'
          - _shared_scs.results[1].resources[0].parameters['backendType'] == 'ontap-san'
          - _shared_scs.results[1].resources[0].parameters['selector'] == 'performance=value'
          - _shared_scs.results[1].resources[0].parameters['storagePools'] == 'osiscsibackend:.*'
        fail_msg: "Shared-TBC StorageClasses did not match expected selector or storagePools parameters"
        success_msg: "Shared-TBC StorageClasses verified"
      no_log: true

    - name: Check that no OSAC-managed TBC or CSI Secret was created for Shared-TBC tenant
      kubernetes.core.k8s_info:
        api_version: "{{ item.api_version }}"
        kind: "{{ item.kind }}"
        name: "{{ item.name }}"
        namespace: trident
      loop:
        - api_version: trident.netapp.io/v1
          kind: TridentBackendConfig
          name: "ontap-{{ _t_assignment_key }}"
        - api_version: v1
          kind: Secret
          name: "ontap-csi-{{ _t_assignment_key }}"
      loop_control:
        label: "osac-managed-check"
      register: _shared_osac_resources
      no_log: true

    - name: Assert no OSAC-managed TBC or CSI Secret exists for Shared-TBC backend
      ansible.builtin.assert:
        that:
          - (_shared_osac_resources.results | map(attribute='resources') | flatten | length) == 0
        fail_msg: "Shared-TBC mode must not create per-tenant TBC or CSI Secret"
        success_msg: "No per-tenant TBC or CSI Secret created in Shared-TBC mode"
      no_log: true

    - name: Re-run ensure_storage_class for Shared-TBC backend (idempotent short-circuit)
      ansible.builtin.include_role:
        name: osac.service.storage_provider
      vars:
        storage_provider_action: ensure_storage_class

    - name: Update customer-fc TBC to dotted spec.backendName and clear status.backendInfo.backendName
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: trident.netapp.io/v1
          kind: TridentBackendConfig
          metadata:
            name: customer-fc
            namespace: trident
          spec:
            version: 1
            backendName: osiscsi.backend.v1
            storageDriverName: ontap-san
            dataLIF: 192.168.1.6
            storage:
              - labels:
                  performance: highwrite
                  zone: az1
              - labels:
                  performance: value
      no_log: true

    - name: Patch customer-fc TBC status to Bound without backendInfo.backendName (fallback to spec.backendName)
      ansible.builtin.command:
        cmd: >-
          kubectl patch tridentbackendconfig customer-fc -n trident
          --subresource=status --type=merge
          -p '{"status":{"phase":"Bound","lastOperationStatus":"Success","backendInfo":null}}'
      changed_when: true
      no_log: true

    - name: Update extreme tier to multi-key pool_selector and re-run ensure_storage_class
      ansible.builtin.include_role:
        name: osac.service.storage_provider
      vars:
        storage_provider_action: ensure_storage_class
        storage_provider_tiers:
          - name: extreme
            protocol: block
            provider: ontap
            backend_id: ontap-shared-1
            provider_config:
              profile: shared-fc
              pool_selector:
                zone: az1
                performance: highwrite
          - name: value
            protocol: block
            provider: ontap
            backend_id: ontap-shared-1
            provider_config:
              profile: shared-fc
              pool_selector:
                performance: value

    - name: Read back updated extreme StorageClass
      kubernetes.core.k8s_info:
        api_version: storage.k8s.io/v1
        kind: StorageClass
        name: "{{ _sc_extreme }}"
      register: _updated_extreme_sc
      no_log: true

    - name: Assert extreme StorageClass was recreated with sorted multi-key selector and escaped dotted spec.backendName
      ansible.builtin.assert:
        that:
          - _updated_extreme_sc.resources | length == 1
          - _updated_extreme_sc.resources[0].parameters['selector'] == 'performance=highwrite;zone=az1'
          - _updated_extreme_sc.resources[0].parameters['storagePools'] == 'osiscsi\\.backend\\.v1:.*'
        fail_msg: "StorageClass was not recreated with sorted multi-key selector and escaped dotted spec.backendName"
        success_msg: "StorageClass recreated with sorted multi-key selector and escaped dotted spec.backendName"
      no_log: true

    - name: Restore customer-fc TBC to osiscsibackend with Bound backendInfo
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: trident.netapp.io/v1
          kind: TridentBackendConfig
          metadata:
            name: customer-fc
            namespace: trident
          spec:
            version: 1
            backendName: osiscsibackend
            storageDriverName: ontap-san
            dataLIF: 192.168.1.6
            storage:
              - labels:
                  performance: extreme
              - labels:
                  performance: highwrite
              - labels:
                  performance: value
      no_log: true

    - name: Restore customer-fc TBC status to Bound with backendInfo.backendName=osiscsibackend
      ansible.builtin.command:
        cmd: >-
          kubectl patch tridentbackendconfig customer-fc -n trident
          --subresource=status --type=merge
          -p '{"status":{"phase":"Bound","lastOperationStatus":"Success","backendInfo":{"backendName":"osiscsibackend","backendUUID":"uuid-customer-fc"}}}'
      changed_when: true
      no_log: true

# ── Test 10: Shared-TBC ensure_storage_class fallback when customer TBC is NotFound ──
- name: "ONTAP Storage Provider - Shared-TBC NotFound TBC fallback to selector-only"
  hosts: localhost
  gather_facts: false

  vars:
    tenant_name: "test-ontap-shared-nf"
