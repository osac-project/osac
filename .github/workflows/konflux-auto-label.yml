---
name: konflux-auto-label

# Konflux (GitHub App `red-hat-konflux-kflux-prd-rh02[bot]`) opens automated
# dependency-bump PRs against this repo. Its titles never contain a Jira key, so
# Prow's Jira check never sets `jira/valid-reference`, which the required
# jira-reference check reads: without help every Konflux PR would be stuck.
# This workflow sets that label for this one trusted bot, prefixes the title
# with NO-ISSUE: (this repo's convention for ticket-less changes) when it has
# no reference yet, and approves the workflow runs of a PR that GitHub holds
# back as `action_required` because the bot is an external App identity (the
# same step osac-test-infra's slash-command handler used to take).
#
# Approval of the PR itself is not done here: bot-approve.yml approves a
# dependency update as the osac-ci bot when only dependency files changed.
#
# Scoped tightly to this one specific, trusted bot login -- not "any bot"
# or "any dependency PR" -- per direct instruction; broadening this scope
# needs a deliberate follow-up decision, not an accidental side effect of
# editing this file.
#
# SECURITY: pull_request_target runs with write permissions and secrets
# against the BASE repo's copy of this workflow, regardless of what the PR
# branch contains -- safe here specifically because this workflow never
# checks out or executes anything from the PR branch. It only reads
# trusted fields already present on the event context (author login, PR
# number, head SHA) and mutates via the GitHub API.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  auto-label-konflux:
    if: github.event.pull_request.user.login == 'red-hat-konflux-kflux-prd-rh02[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Apply the Jira reference label
        env:
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
        run: |
          set -euo pipefail
          pr=${{ github.event.pull_request.number }}
          echo "Labelling Konflux PR #${pr}..."
          gh pr edit "${pr}" --repo "${{ github.repository }}" --add-label jira/valid-reference

      - name: Prefix title with NO-ISSUE when it has no Jira reference
        env:
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
        run: |
          set -euo pipefail
          # Konflux titles ("Update dependency X to vY.Y.Y") never contain a
          # Jira key -- this repo's NO-ISSUE: convention (already used in
          # commit messages here) is the closest match. Re-fetches the live
          # title rather than trusting the event payload, and checks for an
          # existing NO-ISSUE/Jira-key prefix first, so repeated synchronize
          # events on the same PR don't stack prefixes.
          pr=${{ github.event.pull_request.number }}
          title=$(gh pr view "${pr}" --repo "${{ github.repository }}" --json title --jq '.title')
          if [[ "${title}" =~ ^(NO-ISSUE|[A-Z][A-Z0-9]*-[0-9]+): ]]; then
            echo "Title already has a NO-ISSUE/Jira-key prefix, leaving as-is: ${title}"
          else
            new_title="NO-ISSUE: ${title}"
            echo "Prefixing title: ${new_title}"
            gh pr edit "${pr}" --repo "${{ github.repository }}" --title "${new_title}"
          fi

      - name: Approve pending action_required runs for this PR's head SHA
        env:
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
        run: |
          set -euo pipefail
          # An external App identity's workflow runs can land in GitHub's
          # native fork/first-time-contributor action_required gate and never
          # execute at all otherwise.
          head_sha="${{ github.event.pull_request.head.sha }}"
          approved=0
          failed=0

          # A real listing failure (auth, rate limit, bad request) must not
          # be indistinguishable from "no pending runs found" -- no
          # suppression here, so a non-zero exit propagates and fails the
          # job immediately, before the loop below can silently do nothing.
          if ! pending_runs=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${head_sha}&status=action_required" \
            --jq '.workflow_runs[].id'); then
            echo "::error::Failed to list action_required runs for ${head_sha:0:7}" >&2
            exit 1
          fi

          for run_id in ${pending_runs}; do
            if gh api "repos/${{ github.repository }}/actions/runs/${run_id}/approve" --method POST --silent; then
              approved=$((approved + 1))
            else
              # Don't abort the loop over a single run's failure (e.g. a
              # race where it was already approved or completed between
              # listing and approving), but don't silently swallow it
              # either -- log it and fail the job at the end so a genuine
              # approval failure is never hidden behind a green check.
              failed=$((failed + 1))
              echo "::error::Failed to approve run ${run_id} for ${head_sha:0:7}" >&2
            fi
          done
          echo "Approved ${approved} pending run(s) for ${head_sha:0:7}."
          [[ "${failed}" -eq 0 ]]
