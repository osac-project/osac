# Minimal Strimzi KafkaTopic CRD for envtest. It mirrors the parts of the
# upstream CRD schema that the onboarding reconciler writes; everything else
# is left open so the test does not track unrelated upstream changes.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kafkatopics.kafka.strimzi.io
spec:
  group: kafka.strimzi.io
  names:
    kind: KafkaTopic
    listKind: KafkaTopicList
    singular: kafkatopic
    plural: kafkatopics
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              topicName:
                type: string
              partitions:
                type: integer
                minimum: 1
              replicas:
                type: integer
                minimum: 1
              config:
                type: object
                x-kubernetes-preserve-unknown-fields: true
