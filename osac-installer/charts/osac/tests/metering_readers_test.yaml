suite: metering reader grants through umbrella values
templates:
  - charts/metering/templates/readers.yaml
values:
  - ../ci/default-values.yaml
tests:
  - it: passes metering.readers to the metering subchart
    set:
      metering.readers:
        - name: billing-reader
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: KafkaUser
      - equal:
          path: metadata.name
          value: billing-reader
      - equal:
          path: spec.authorization.acls[0].resource.name
          value: osac.metering.heartbeat.
      - equal:
          path: spec.authorization.acls[0].resource.patternType
          value: prefix
      - equal:
          path: spec.authorization.acls[0].operations
          value:
            - Read
            - Describe
      - equal:
          path: spec.authorization.acls[1].resource.name
          value: osac.metering.heartbeat.system
      - equal:
          path: spec.authorization.acls[1].type
          value: deny
      - equal:
          path: spec.authorization.acls[2].resource.name
          value: osac.metering.heartbeat.shared
      - equal:
          path: spec.authorization.acls[2].type
          value: deny
      - equal:
          path: spec.authorization.acls[3].resource.name
          value: billing-reader

  - it: rejects a tenant field, because one reader covers every tenant
    set:
      metering.readers:
        - name: billing-reader
          tenant: acme
    asserts:
      - failedTemplate:
          errorPattern: "at '/metering/readers/0': additional properties 'tenant' not allowed"

  - it: rejects a reader entry without a name
    set:
      metering.readers:
        - {}
    asserts:
      - failedTemplate:
          errorPattern: "'/metering/readers/0': missing property 'name'"

  - it: rejects a reader name longer than a KafkaUser name
    set:
      metering.readers:
        - name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - failedTemplate:
          errorPattern: "'/metering/readers/0/name': maxLength: got 254, want 253"
