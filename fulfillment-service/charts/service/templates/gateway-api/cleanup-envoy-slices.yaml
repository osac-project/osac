{{/*
Remove controller-managed EndpointSlices of the two API Services when the
release switches to the gatewayapi driver. The Services become selectorless
in that mode, so the EndpointSlice controller stops reconciling them but
leaves the Envoy-era slices in place; consumers aggregate every slice of a
Service and would keep reaching the removed Envoy Pods next to the bridge
endpoints. Only slices managed by endpointslice-controller are deleted: the
bridge slices carry no managed-by label and survive, which also makes this
hook safe when the installer applies the bridge before the hook runs.
*/}}
{{- if eq .Values.ingress.driver "gatewayapi" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Chart.Name }}-envoy-slice-cleanup
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}-envoy-slice-cleanup
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "-5"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Chart.Name }}-envoy-slice-cleanup
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}-envoy-slice-cleanup
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "-5"
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "delete"]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Chart.Name }}-envoy-slice-cleanup
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}-envoy-slice-cleanup
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "-5"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}-envoy-slice-cleanup
    spec:
      # origin-cli has no non-root USER; on OpenShift restricted-v2 injects a
      # namespace UID, elsewhere pin one explicitly (same pattern as the
      # installer's cli hook Jobs).
      securityContext:
        runAsNonRoot: true
        {{- if not (.Capabilities.APIVersions.Has "security.openshift.io/v1") }}
        runAsUser: 1000
        fsGroup: 1000
        {{- end }}
      serviceAccountName: {{ .Chart.Name }}-envoy-slice-cleanup
      restartPolicy: OnFailure
      containers:
        - name: envoy-slice-cleanup
          image: {{ .Values.cliImage }}
          env:
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              ns=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
              for svc in fulfillment-api fulfillment-internal-api; do
                kubectl get endpointslices -n "$ns" -l kubernetes.io/service-name="$svc" \
                  -o go-template='{{`{{range .items}}{{if eq (index .metadata.labels "endpointslice.kubernetes.io/managed-by") "endpointslice-controller.k8s.io"}}{{.metadata.name}}{{"\n"}}{{end}}{{end}}`}}' \
                  | while read -r slice; do
                      [ -n "$slice" ] || continue
                      echo "removing stale Envoy EndpointSlice $ns/$slice (service $svc)"
                      kubectl delete endpointslice -n "$ns" "$slice"
                    done
              done
              echo "Envoy EndpointSlice cleanup complete."
{{- end }}
