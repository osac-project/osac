{{- /*
Reject reader names that collide with a KafkaUser the umbrella chart already
creates. The metering chart rejects the osac- and osac. prefixes and its own
users; the fulfillment service's KafkaUser is named by an umbrella helper, so
only this chart can check it. A collision on upgrade lets the later document
replace the other user's ACLs.
*/}}
{{- $reserved := list (include "osac.fulfillmentKafkaUserName" .) "osac-metering" "osac-metering-echo-adapter" "osac-metering-m360-adapter" -}}
{{- range .Values.metering.readers }}
{{- $name := required "metering.readers[].name is required" .name -}}
{{- if has $name $reserved }}
{{- fail (printf "metering reader %q is a KafkaUser OSAC owns; pick another name" $name) }}
{{- end }}
{{- if or (hasPrefix "osac-" $name) (hasPrefix "osac." $name) }}
{{- fail (printf "metering reader %q uses the reserved osac- or osac. name prefix" $name) }}
{{- end }}
{{- end }}
