# OSAC umbrella 0.0.62, core + VMaaS on the same SNO hub (dev, disconnected).
# Generated from the 0.0.62 chart defaults:
#   helm show values oci://ghcr.io/osac-project/charts/osac --version 0.0.62
# Service selection per the disconnected installation guide Section 6.1;
# disconnected overrides (cliImage, AAP EE, internal Git) per Section 5.
# Replace <approved-site-apps-domain> in all four domain-bearing fields below
# with the same exact owner-approved application domain before use. This is
# a documentation placeholder, not Helm interpolation; no shell variable or
# tpl expansion is implied. Supply credentials, license and mirrors separately.
# Keep global.clusterDomain and the explicit service/issuer hostnames in this
# protected values file; do not correct only the command-line clusterDomain.
# Identity endpoint URL forms:
# service.idp.url is the Keycloak BASE URL, for example:
#   https://keycloak-keycloak.<approved-site-apps-domain>
# Do not append /realms/<realm> to that base URL.
# ui.auth.oidcIssuerURL, service.auth.issuerUrl and
# service.vault.keycloakIssuerUrl are full REALM ISSUER URLs, for example:
#   https://keycloak-keycloak.<approved-site-apps-domain>/realms/osac
# Keep these three issuer URLs equal to the exact approved OIDC issuer.
# The application-domain placeholder remains valid for this reference profile.
# If the approved identity hostname or realm differs, explicitly override
# these issuer fields and the corresponding Keycloak base URL rather than
# inferring the identity hostname or realm from the application domain.
# Preserve the existing credential and CA settings.
global:
  osacDeploymentId: demo/osac-sno-01
  clusterDomain: <approved-site-apps-domain>
  fulfillmentTrust:
    enabled: false
  services:
    caas:
      enabled: false
    vmaas:
      enabled: true
    bmaas:
      enabled: false
    maas:
      enabled: false
  networking:
    fabricManager: ''
    k8sManager: k8s_only
# Disconnected requirement (Section 5): approved mirror-resident CLI image.
# aap.bootstrap.cliImage is an independent override; setting cliImage alone
# does not change it. Replace with the approved mirror reference.
cliImage: quay.io/openshift/origin-cli:4.20.0
operator:
  replicaCount: 1
  aap:
    # Dev-lab-only override: the 0.0.62 chart has no AAP CA-bundle input
    # , so certificate verification against the AAP route cannot be enabled here.
    #  Do not copy this into a production profile.
    insecureSkipVerify: "true"
  hubAccess:
    enabled: true
  vendorControllers:
    lvms: none
  controllers:
    tenant: true
    networking: true
    storage: true
    volume: true
  # 0.0.62 replaced operator.fulfillment.tokenFile with OIDC client
  # credentials; defaults already point at the prepared Secret.
  fulfillment:
    serverAddress: fulfillment-internal-api:8001
    credentials:
      secretName: fulfillment-controller-credentials
      clientIdKey: client-id
      clientSecretKey: client-secret
    tls:
      caBundle:
        configMap: ca-bundle
kafka:
  enabled: true
  clusterName: osac-kafka
  clusterNamespace: osac-kafka
  replicas: 1
dbInit:
  host: postgres.osac-infra.svc.cluster.local
service:
  variant: openshift
  externalHostname: fulfillment-api-osac.<approved-site-apps-domain>
  internalHostname: fulfillment-internal-api-osac.<approved-site-apps-domain>
  auth:
    controllerCredentials:
    - secret:
        name: fulfillment-controller-credentials
        items:
        - key: client-id
          param: client-id
        - key: client-secret
          param: client-secret
  idp:
    credentials:
    - secret:
        name: fulfillment-controller-credentials
        items:
        - key: client-id
          param: client-id
        - key: client-secret
          param: client-secret
  database:
    connection:
    - secret:
        name: osac-db-config
        items:
        - key: url
          param: url
    - secret:
        name: osac-db-client-cert
        items:
        - key: tls.crt
          param: sslcert
        - key: tls.key
          param: sslkey
        - key: ca.crt
          param: sslrootcert
  vault:
    namespace: osac
    kvMountPath: secret
    lifecycleRole: lifecycle
    lifecycleMountPath: jwt
    keycloakClientId: osac-controller
    keycloakAudience: osac-api
    caBundle:
      configMap: ca-bundle
    credentials:
    - secret:
        name: fulfillment-controller-credentials
        items:
        - key: client-secret
          param: client-secret
ui:
  auth:
    # tpl is not applied for subcharts: set the issuer URL explicitly.
    oidcIssuerURL: https://keycloak-keycloak.<approved-site-apps-domain>/realms/osac
    certs:
      caBundle:
        configMap: ca-bundle
  api:
    fulfillment:
      certs:
        caBundle:
          configMap: ca-bundle
aap:
  bootstrap:
    image: ghcr.io/osac-project/osac-aap:0.0.45
    # Independent CLI image override; keep aligned with the top-level cliImage.
    cliImage: quay.io/openshift/origin-cli:4.20.0
  configAsCode:
    eeImage: registry-vm-svc.aap-portal-lab.svc.cluster.local:8443/osac-project/osac-aap:0.0.45
    eeImagePull: missing
    projectGitUri: git://192.168.100.2:9418/osac.git
    projectGitBranch: e526ec64b1d54981c13505af3c7142d1b6591239
    addonOperatorMaxConcurrentJobs: 1
  instanceGroups:
    clusterFulfillment:
      enabled: false
    networkFulfillment:
      enabled: false
    storageFulfillment:
      enabled: true
    publishTemplates:
      enabled: true
# Metering is always deployed in 0.0.62 and wires its database through the
# chart-created osac-db-metering-config / osac-db-metering-client-cert
# Secrets for dbInit.host; no override is needed here.
validation:
  enabled: true
hubAccess:
  enabled: true
lvms:
  enabled: true  # Registers backend local / block tier local, NOT StorageClass lvms-vg1.
# The umbrella csiDriver block was removed in 0.0.62; hub/tenant CSI is no
# longer configured through this chart.
