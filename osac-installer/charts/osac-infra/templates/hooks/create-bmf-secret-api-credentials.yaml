{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: osac-infra-create-bmf-secret-api-creds
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
  annotations:
    osac.openshift.io/tenant: system
    osac.openshift.io/owner-reference: Deployment/bmf-operator-controller-manager
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: osac-infra-create-bmf-secret-api-creds
  namespace: keycloak
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
  annotations:
    osac.openshift.io/tenant: system
    osac.openshift.io/owner-reference: Deployment/bmf-operator-controller-manager
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
- apiGroups: [""]
  resources: [secrets]
  resourceNames: [keycloak-client-secrets]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: osac-infra-create-bmf-secret-api-creds
  namespace: keycloak
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
  annotations:
    osac.openshift.io/tenant: system
    osac.openshift.io/owner-reference: Deployment/bmf-operator-controller-manager
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: osac-infra-create-bmf-secret-api-creds
subjects:
- kind: ServiceAccount
  name: osac-infra-create-bmf-secret-api-creds
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: osac-infra-create-bmf-secret-api-creds
  namespace: {{ .Values.osacNamespace }}
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
  annotations:
    osac.openshift.io/tenant: system
    osac.openshift.io/owner-reference: Deployment/bmf-operator-controller-manager
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
- apiGroups: [""]
  resources: [secrets]
  resourceNames: [osac-bmf-secret-api-credentials]
  verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: osac-infra-create-bmf-secret-api-creds
  namespace: {{ .Values.osacNamespace }}
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
  annotations:
    osac.openshift.io/tenant: system
    osac.openshift.io/owner-reference: Deployment/bmf-operator-controller-manager
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: osac-infra-create-bmf-secret-api-creds
subjects:
- kind: ServiceAccount
  name: osac-infra-create-bmf-secret-api-creds
  namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: osac-infra-create-bmf-secret-api-creds
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
  annotations:
    osac.openshift.io/tenant: system
    osac.openshift.io/owner-reference: Deployment/bmf-operator-controller-manager
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "osac-infra.hookLabels" . | nindent 8 }}
      annotations:
        osac.openshift.io/tenant: system
        osac.openshift.io/owner-reference: Deployment/bmf-operator-controller-manager
    spec:
      securityContext:
        {{- include "osac-infra.cliJobPodSecurityContext" . | nindent 8 }}
      restartPolicy: OnFailure
      serviceAccountName: osac-infra-create-bmf-secret-api-creds
      containers:
      - name: create-bmf-secret-api-creds
        image: {{ .Values.cliImage }}
        command: ["/bin/bash", "/scripts/create-bmf-secret-api-credentials.sh"]
        env:
        - name: KEYCLOAK_NAMESPACE
          value: keycloak
        - name: OSAC_NAMESPACE
          value: {{ .Values.osacNamespace }}
        - name: HOME
          value: /tmp
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - "ALL"
        volumeMounts:
        - name: scripts
          mountPath: /scripts
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: scripts
        configMap:
          name: osac-infra-hook-scripts
          defaultMode: 0755
      - name: tmp
        emptyDir: {}
{{- end }}
