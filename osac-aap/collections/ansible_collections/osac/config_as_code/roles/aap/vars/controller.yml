# Customize pod templates in order to inject the configuration and the
# credentials when the template are run, that way Kubernetes is the source
# of truth for the secrets, and we don't need to sync credentials into AAP
controller_instance_groups: # noqa: var-naming[no-role-prefix]
  # For cluster-fulfillment use cases, we want to allow KubeAPI access to the
  # cluster the pod works on, so we mount the credentials for the osac
  # ServiceAccount. All other credentials (AWS, Openstack, ...) that would be
  # required by the playbooks are expected to be specified in the
  # (prefix)-cluster-fulfilment-ig secret.
  - name: "{{ aap_prefix }}-cluster-fulfillment-ig"
    is_container_group: true
    credential: "{{ aap_vcluster_credential_name }}"
    pod_spec_override: "{{ lookup('ansible.builtin.template', 'cluster-fulfillment-ig.j2') }}"
  # For config-as-code job template, we expect the configuration and the
  # credentials to be passed in (prefix)-config-as-code-ig secret
  - name: "{{ aap_prefix }}-config-as-code-ig"
    is_container_group: true
    credential: "{{ aap_vcluster_credential_name }}"
    pod_spec_override: |
      apiVersion: v1
      kind: Pod
      metadata:
        labels:
          ansible_job: ''
      {% if vcluster_api_url %}
        namespace: {{ current_namespace }}
      {% endif %}
      spec:
        serviceAccountName: default
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                      - key: ansible_job
                        operator: Exists
                  topologyKey: kubernetes.io/hostname
        containers:
          - image: >-
              registry.redhat.io/ansible-automation-platform-25/ee-supported-rhel8@sha256:d8400a472e769d0f3d591dafaad318522009c583b08e881c23b6d57a27cc10ed
            name: worker
            args:
              - ansible-runner
              - worker
              - '--private-data-dir=/runner'
            envFrom:
              - secretRef:
                  name: "{{ aap_config_as_code_secret_name }}"
                  optional: true
            env:
              - name: NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
      {% if vcluster_api_url %}
              # The hourly rerun re-creates the vcluster credential, so it
              # needs the token too; the Secret coordinates come from the
              # envFrom Secret above (VCLUSTER_TOKEN_SECRET_NAME/KEY).
              - name: VCLUSTER_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: {{ vcluster_token_secret_name }}
                    key: {{ vcluster_token_secret_key }}
      {% endif %}
              # Same Secret the bootstrap job authenticates with; the
              # coordinates come from the envFrom Secret above, so an
              # external AAP's own admin-password Secret name works here too.
              - name: AAP_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: {{ aap_admin_password_secret_name }}
                    key: {{ aap_admin_password_secret_key }}
              - name: LICENSE_MANIFEST_PATH
                value: /var/secrets/config-as-code/license.zip
            volumeMounts:
              - name: config-as-code-manifest-volume
                mountPath: /var/secrets/config-as-code
                readOnly: true
        volumes:
          - name: config-as-code-manifest-volume
            secret:
              secretName: config-as-code-manifest-ig
  - name: "{{ aap_prefix }}-publish-templates-ig"
    is_container_group: true
    credential: "{{ aap_vcluster_credential_name }}"
    pod_spec_override: |
      apiVersion: v1
      kind: Pod
      metadata:
        labels:
          ansible_job: ''
      {% if vcluster_api_url %}
        namespace: {{ current_namespace }}
      {% endif %}
      spec:
        serviceAccountName: template-publisher
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                      - key: ansible_job
                        operator: Exists
                  topologyKey: kubernetes.io/hostname
        containers:
          - image: >-
              registry.redhat.io/ansible-automation-platform-25/ee-supported-rhel8@sha256:d8400a472e769d0f3d591dafaad318522009c583b08e881c23b6d57a27cc10ed
            name: worker
            args:
              - ansible-runner
              - worker
              - '--private-data-dir=/runner'
            volumeMounts:
              - name: kube-api-access
                mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                readOnly: true
              - name: cas
                mountPath: /certs
            envFrom:
              - configMapRef:
                  name: publish-templates-ig
                  optional: true
            env:
              - name: OSAC_FULFILLMENT_ISSUER_URL
                valueFrom:
                  configMapKeyRef:
                    name: aap-fulfillment-auth-config
                    key: OSAC_FULFILLMENT_ISSUER_URL
              - name: OSAC_FULFILLMENT_CLIENT_ID
                valueFrom:
                  secretKeyRef:
                    name: fulfillment-controller-credentials
                    key: client-id
              - name: OSAC_FULFILLMENT_CLIENT_SECRET
                valueFrom:
                  secretKeyRef:
                    name: fulfillment-controller-credentials
                    key: client-secret
              - name: SSL_CERT_FILE
                value: /certs/bundle.pem
        volumes:
          - name: kube-api-access
            projected:
              sources:
                - serviceAccountToken:
                    path: token
                    expirationSeconds: 3600
                - configMap:
                    name: kube-root-ca.crt
                    items:
                      - key: ca.crt
                        path: ca.crt
                - downwardAPI:
                    items:
                      - path: namespace
                        fieldRef:
                          apiVersion: v1
                          fieldPath: metadata.namespace
                - configMap:
                    name: openshift-service-ca.crt
                    items:
                      - key: service-ca.crt
                        path: service-ca.crt
              defaultMode: 420
          - name: cas
            configMap:
              name: ca-bundle
  # No pod spec of their own today: under the vcluster they get the minimal
  # spec (osac-sa, release namespace) so their job pods land inside the
  # vcluster like every other group's; without it the empty string omits the
  # override, as it does for the credential. These groups stay without the
  # remote kubeconfig on purpose: the post-install and add-on-operator jobs
  # drive the guest hosted cluster through the admin kubeconfig the workflow
  # passes them, never the outer infrastructure cluster.
  - name: "{{ aap_prefix }}-create-hosted-cluster-post-install-ig"
    is_container_group: true
    credential: "{{ aap_vcluster_credential_name }}"
    pod_spec_override: "{{ lookup('ansible.builtin.template', 'vcluster-minimal-ig.j2') if vcluster_api_url else '' }}"

  - name: "{{ aap_prefix }}-addon-operators-ig"
    is_container_group: true
    credential: "{{ aap_vcluster_credential_name }}"
    pod_spec_override: "{{ lookup('ansible.builtin.template', 'vcluster-minimal-ig.j2') if vcluster_api_url else '' }}"
    max_concurrent_jobs: "{{ addon_operator_max_concurrent_jobs }}"

  # The protected tenant credential is attached to the job at launch.  This
  # isolated group deliberately has no Secret or kubeconfig volume: Kubernetes
  # injects only the trust-sync ServiceAccount and Controller injects the
  # selected credential into the runner at runtime. The AAP Helm chart creates
  # the dedicated ServiceAccount in this namespace.
  - name: "{{ aap_prefix }}-fulfillment-trust-sync-ig"
    is_container_group: true
    credential: "{{ aap_vcluster_credential_name }}"
    pod_spec_override: |
      apiVersion: v1
      kind: Pod
      metadata:
        labels:
          ansible_job: ''
      {% if vcluster_api_url %}
        namespace: {{ current_namespace }}
      {% endif %}
      spec:
        serviceAccountName: osac-fulfillment-trust-sync
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                      - key: ansible_job
                        operator: Exists
                  topologyKey: kubernetes.io/hostname
        containers:
          - image: >-
              {{ aap_ee_image }}
            name: worker
            args:
              - ansible-runner
              - worker
              - '--private-data-dir=/runner'
            volumeMounts:
              - name: kube-api-access
                mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                readOnly: true
        volumes:
          - name: kube-api-access
            projected:
              sources:
                - serviceAccountToken:
                    path: token
                    expirationSeconds: 3600
                - configMap:
                    name: kube-root-ca.crt
                    items:
                      - key: ca.crt
                        path: ca.crt
                - downwardAPI:
                    items:
                      - path: namespace
                        fieldRef:
                          apiVersion: v1
                          fieldPath: metadata.namespace
                - configMap:
                    name: openshift-service-ca.crt
                    items:
                      - key: service-ca.crt
                        path: service-ca.crt
              defaultMode: 420

  - name: "{{ aap_prefix }}-compute-instance-operations-ig"
    is_container_group: true
    credential: "{{ aap_vcluster_credential_name }}"
    pod_spec_override: "{{ lookup('ansible.builtin.template', 'compute-instance-operations-ig.j2') }}"

  - name: "{{ aap_prefix }}-networking-operations-ig"
    is_container_group: true
    credential: "{{ aap_vcluster_credential_name }}"
    pod_spec_override: "{{ lookup('ansible.builtin.template', 'networking-operations-ig.j2') }}"

  - name: "{{ aap_prefix }}-bare-metal-fulfillment-ig"
    is_container_group: true
    credential: "{{ aap_vcluster_credential_name }}"
    pod_spec_override: |
      apiVersion: v1
      kind: Pod
      metadata:
        labels:
          ansible_job: ''
      {% if vcluster_api_url %}
        namespace: {{ current_namespace }}
      {% endif %}
      spec:
        serviceAccountName: {{ osac_sa_name }}
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                      - key: ansible_job
                        operator: Exists
                  topologyKey: kubernetes.io/hostname
        containers:
          - image: >-
              registry.redhat.io/ansible-automation-platform-25/ee-supported-rhel8@sha256:d8400a472e769d0f3d591dafaad318522009c583b08e881c23b6d57a27cc10ed
            name: worker
            args:
              - ansible-runner
              - worker
              - '--private-data-dir=/runner'
            volumeMounts:
              - name: kube-api-access
                mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                readOnly: true
              - name: os-clouds
                mountPath: /etc/openstack
                readOnly: true
      {% if remote_cluster_kubeconfig_secret_name %}
              # Bare-metal fulfillment drives BareMetalHosts and their
              # Secrets in the outer infrastructure cluster through
              # OSAC_REMOTE_CLUSTER_KUBECONFIG.
              - name: remote-cluster-kubeconfig
                mountPath: /etc/osac
                readOnly: true
      {% endif %}
            env:
              - name: POD_NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              - name: OS_CLIENT_CONFIG_FILE
                value: /etc/openstack/clouds.yaml
      {% if remote_cluster_kubeconfig_secret_name %}
              - name: OSAC_REMOTE_CLUSTER_KUBECONFIG
                value: /etc/osac/remote-cluster-kubeconfig
      {% endif %}
      {% if osac_instance_id %}
              - name: OSAC_INSTANCE_ID
                value: {{ osac_instance_id }}
      {% endif %}
            envFrom:
              - secretRef:
                  name: bare-metal-fulfillment-ig
                  optional: true
        volumes:
          - name: kube-api-access
            projected:
              sources:
                - serviceAccountToken:
                    path: token
                    expirationSeconds: 3600
                - configMap:
                    name: kube-root-ca.crt
                    items:
                      - key: ca.crt
                        path: ca.crt
                - downwardAPI:
                    items:
                      - path: namespace
                        fieldRef:
                          apiVersion: v1
                          fieldPath: metadata.namespace
                - configMap:
                    name: openshift-service-ca.crt
                    items:
                      - key: service-ca.crt
                        path: service-ca.crt
              defaultMode: 420
          - name: os-clouds
            secret:
              secretName: osac-os-clouds
              items:
                - key: clouds.yaml
                  path: clouds.yaml
              defaultMode: 420
              optional: true
      {% if remote_cluster_kubeconfig_secret_name %}
          - name: remote-cluster-kubeconfig
            secret:
              secretName: {{ remote_cluster_kubeconfig_secret_name }}
              items:
                - key: {{ remote_cluster_kubeconfig_secret_key }}
                  path: remote-cluster-kubeconfig
              defaultMode: 420
      {% endif %}

  - name: "{{ aap_prefix }}-storage-operations-ig"
    is_container_group: true
    credential: "{{ aap_vcluster_credential_name }}"
    pod_spec_override: "{{ lookup('ansible.builtin.template', 'storage-operations-ig.j2') }}"
