{{- if .Values.kafka.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: osac-kafka
  labels:
    {{- include "osac-deps.labels" . | nindent 4 }}
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: amq-streams
  namespace: osac-kafka
  labels:
    {{- include "osac-deps.labels" . | nindent 4 }}
spec:
  targetNamespaces:
    - osac-kafka
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: amq-streams
  namespace: osac-kafka
  labels:
    {{- include "osac-deps.labels" . | nindent 4 }}
spec:
  channel: {{ .Values.kafka.channel }}
  name: amq-streams
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Manual
{{- end }}
