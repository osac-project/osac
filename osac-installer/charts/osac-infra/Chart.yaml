apiVersion: v2
name: osac-infra
description: OSAC shared infrastructure - CA chain, Keycloak, Gateway, trust-manager, shared PostgreSQL, CRD instances
type: application
version: 0.0.1

dependencies:
  - name: topolvm
    version: "17.2.0"
    repository: https://topolvm.github.io/topolvm
    condition: topolvm.enabled
  - name: netbox
    version: "8.3.91"
    repository: https://netbox-community.github.io/netbox-chart/
    condition: netbox.enabled
