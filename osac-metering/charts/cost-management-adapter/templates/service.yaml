{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cost-management-adapter.fullname" . }}
  labels:
    {{- include "cost-management-adapter.labels" . | nindent 4 }}
    app.kubernetes.io/component: cost-management-adapter
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "cost-management-adapter.selectorLabels" . | nindent 4 }}
{{- end }}
