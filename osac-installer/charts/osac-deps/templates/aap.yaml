{{- if .Values.aapOperator.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: ansible-aap
  labels:
    openshift.io/cluster-monitoring: "true"
    {{- include "osac-deps.labels" . | nindent 4 }}
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: dev-ansible-automation-platform-operator
  namespace: ansible-aap
  labels:
    {{- include "osac-deps.labels" . | nindent 4 }}
spec: {}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: dev-ansible-automation-platform
  namespace: ansible-aap
  labels:
    {{- include "osac-deps.labels" . | nindent 4 }}
spec:
  channel: {{ .Values.aapOperator.channel }}
  # FIXME(OSAC-5621): Subscription pinned to the last pre-CVE-2026-75884 CSV
  # via startingCSV + Manual approval.  aap-operator.v2.6.0-0.1789678003+
  # ships Automation Controller >=4.7.17, which tightens the
  # pod_spec_override blocklist and breaks OSAC's instance-group
  # secret-mounting patterns.  startingCSV ensures fresh installs resolve to
  # the pinned version; installPlanApproval: Manual prevents OLM from
  # auto-approving upgrades past it.  Remove both pins and revert to
  # Automatic once the credential-type migration in OSAC-5621 is complete.
  installPlanApproval: Manual
  startingCSV: aap-operator.v2.6.0-0.1787258256
  name: ansible-automation-platform-operator
  source: {{ .Values.catalogSource }}
  sourceNamespace: {{ .Values.catalogSourceNamespace }}
{{- end }}
