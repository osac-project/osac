syntax = "proto3";

package osac.private.v1;

import "buf/validate/validate.proto";
import "cleanapi/cleanapi.proto";
import "google/protobuf/timestamp.proto";

option (cleanapi.file).package = "osac.public.v1";

// BillingExportState is the normalized state of a provider export operation.
enum BillingExportState {
  BILLING_EXPORT_STATE_UNSPECIFIED = 0;
  BILLING_EXPORT_STATE_PENDING = 1;
  BILLING_EXPORT_STATE_RUNNING = 2;
  BILLING_EXPORT_STATE_SUCCEEDED = 3;
  BILLING_EXPORT_STATE_FAILED = 4;
}

// BillingExport describes an asynchronous provider export operation.
// buf:lint:ignore OSAC_OBJECT_SHAPE
message BillingExport {
  // Opaque OSAC identifier for this export operation.
  string id = 1 [(buf.validate.field).string = {min_len: 1}];
  string tenant_id = 2 [(buf.validate.field).string = {min_len: 1}];
  string from_date = 3;
  string to_date = 4;
  BillingExportState state = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp completed_at = 7;
}
