- name: Get list of existing cluster templates
  ansible.builtin.uri:
    url: "{{ publish_templates_cluster_api_endpoint }}"
    validate_certs: "{{ publish_templates_validate_certs | default(true) | bool }}"
    headers:
      authorization: Bearer {{ osac_fulfillment_service_token }}
    status_code: [200, 404, 503]
  register: cluster_template_check

- name: Skip cluster templates when service is disabled
  ansible.builtin.debug:
    msg: "CaaS service not available (HTTP {{ cluster_template_check.status }}) — skipping cluster template publishing"
  when: cluster_template_check.status in [404, 503]

- name: Create list of existing cluster template template ids    # noqa: jinja[invalid]
  ansible.builtin.set_fact:
    cluster_template_ids: >-
      {{
      cluster_template_check | json_query("json.items[].id")
      }}
  when: cluster_template_check.status not in [404, 503] and cluster_template_check is success and cluster_template_check.json.get('items', []) | length > 0

- name: Publish cluster template records
  ansible.builtin.include_tasks: publish_template_items.yaml
  vars:
    publish_template_items: "{{ osac_cluster_templates }}"
    publish_template_existing_ids: "{{ cluster_template_ids | default([]) }}"
    publish_template_api_endpoint: "{{ publish_templates_cluster_api_endpoint }}"
    publish_template_resource_name: cluster template
  when: cluster_template_check.status not in [404, 503]
