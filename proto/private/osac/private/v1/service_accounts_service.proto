syntax = "proto3";

package osac.private.v1;

import "buf/validate/validate.proto";
import "cleanapi/cleanapi.proto";
import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "osac/private/v1/service_account_type.proto";

option (cleanapi.file).package = "osac.public.v1";
option (cleanapi.file).http_route_prefix_map = "private:fulfillment";

message ServiceAccountsListRequest {
  // Zero-based index of the first result.
  optional int32 offset = 1;
  // Maximum number of results. Zero returns only the total count.
  optional int32 limit = 2;
  // CEL expression selecting visible service accounts.
  optional string filter = 3;
  // Ordering of results.
  optional string order = 4;
}

message ServiceAccountsListResponse {
  int32 size = 1;
  int32 total = 2;
  repeated ServiceAccount items = 3;
}

message ServiceAccountsGetRequest {
  string id = 1;
}

message ServiceAccountsGetResponse {
  ServiceAccount object = 1;
}

message ServiceAccountsCreateRequest {
  ServiceAccount object = 1 [(buf.validate.field).required = true];
}

message ServiceAccountsCreateResponse {
  ServiceAccount object = 1;
}

message ServiceAccountsUpdateRequest {
  ServiceAccount object = 1;
  google.protobuf.FieldMask update_mask = 2;
  // Reject the update with ABORTED when metadata.version does not match the stored version.
  bool lock = 3;
}

message ServiceAccountsUpdateResponse {
  ServiceAccount object = 1;
}

message ServiceAccountsDeleteRequest {
  string id = 1;
}

message ServiceAccountsDeleteResponse {}

message ServiceAccountsSignalRequest {
  option (cleanapi.message).private = true;
  string id = 1;
}

message ServiceAccountsSignalResponse {
  option (cleanapi.message).private = true;
}

// Manages tenant-owned service accounts.
service ServiceAccounts {
  rpc List(ServiceAccountsListRequest) returns (ServiceAccountsListResponse) {
    option (google.api.http) = {get: "/api/private/v1/service_accounts"};
  }
  rpc Get(ServiceAccountsGetRequest) returns (ServiceAccountsGetResponse) {
    option (google.api.http) = {
      get: "/api/private/v1/service_accounts/{id}"
      response_body: "object"
    };
  }
  // Creates an account. A controller provisions its Keycloak client asynchronously and stores the credential in a
  // separate Secret resource referenced by status.client_secret.
  rpc Create(ServiceAccountsCreateRequest) returns (ServiceAccountsCreateResponse) {
    option (google.api.http) = {
      post: "/api/private/v1/service_accounts"
      body: "object"
    };
  }
  // Updates labels. Identity and status are server-controlled.
  rpc Update(ServiceAccountsUpdateRequest) returns (ServiceAccountsUpdateResponse) {
    option (google.api.http) = {
      patch: "/api/private/v1/service_accounts/{object.id}"
      body: "object"
      response_body: "object"
    };
  }
  // Marks the account deleting; cleanup completes asynchronously before archival.
  rpc Delete(ServiceAccountsDeleteRequest) returns (ServiceAccountsDeleteResponse) {
    option (google.api.http) = {delete: "/api/private/v1/service_accounts/{id}"};
  }
  rpc Signal(ServiceAccountsSignalRequest) returns (ServiceAccountsSignalResponse) {
    option (cleanapi.method).private = true;
  }
}
