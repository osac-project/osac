suite: admin trust bundle copy
templates:
  - templates/*.yaml
release:
  name: osac
  namespace: osac
set:
  global.observability.enabled: true
  global.observability.keycloak.issuerUrl: https://keycloak.example.com/realms/osac
  global.observability.services.metricsAuth.repository: ghcr.io/osac-project/osac-observability
  global.observability.services.metricsAuth.tag: test-metrics-auth
  global.observability.thanos.image.registry: registry.redhat.io
  global.observability.thanos.image.repository: openshift4/ose-thanos-rhel8
  global.observability.thanos.image.tag: test-thanos
  global.observability.objectStorage.secretName: thanos-object-storage
  global.observability.objectStorage.endpoint: https://s3.example.com
  global.observability.objectStorage.bucket: thanos
  global.observability.objectStorage.region: us-east-1

tests:
  - it: runs the copy job under a dedicated service account
    template: templates/admin-credentials-rbac.yaml
    documentSelector:
      path: kind
      value: ServiceAccount
    asserts:
      - equal:
          path: metadata.name
          value: osac-observability-admin-credentials
      - equal:
          path: metadata.namespace
          value: osac-observability

  - it: grants create without resourceNames and every other verb by name
    template: templates/admin-credentials-rbac.yaml
    documentSelector:
      path: kind
      value: Role
    asserts:
      - equal:
          path: metadata.name
          value: osac-observability-admin-credentials
      - equal:
          path: metadata.namespace
          value: osac-observability
      - equal:
          path: rules
          value:
            # A create request carries no resource name, so resourceNames can
            # never match it: create gets its own unnarrowed rule.
            - apiGroups: [""]
              resources: ["configmaps"]
              verbs: ["create"]
            - apiGroups: [""]
              resources: ["configmaps"]
              resourceNames: ["keycloak-ca-bundle"]
              verbs: ["get", "update", "patch"]

  - it: binds the copy role to its own service account
    template: templates/admin-credentials-rbac.yaml
    documentSelector:
      path: kind
      value: RoleBinding
    asserts:
      - equal:
          path: metadata.name
          value: osac-observability-admin-credentials
      - equal:
          path: roleRef.kind
          value: Role
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: osac-observability-admin-credentials
              namespace: osac-observability

  # The bundle lives in the Keycloak namespace and a volume cannot cross
  # namespaces, so the job reads it there under a Role scoped to it.
  - it: reads only the Keycloak trust bundle
    template: templates/admin-credentials-hook.yaml
    documentSelector:
      path: kind
      value: Role
    asserts:
      - equal:
          path: metadata.namespace
          value: keycloak
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: ["configmaps"]
              resourceNames: ["ca-bundle"]
              verbs: ["get"]

  - it: runs the copy job after install and before upgrade
    template: templates/admin-credentials-hook.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: metadata.namespace
          value: osac-observability
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "30"
      - equal:
          path: spec.template.spec.serviceAccountName
          value: osac-observability-admin-credentials
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - /admin-credentials
      # The job copies one ConfigMap; no secret material passes through it.
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: OBS_NAMESPACE
              value: osac-observability

  - it: renders no namespace RBAC when observability is disabled
    template: templates/admin-credentials-rbac.yaml
    set:
      global.observability.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no hook when observability is disabled
    template: templates/admin-credentials-hook.yaml
    set:
      global.observability.enabled: false
    asserts:
      - hasDocuments:
          count: 0
