suite: admin proxy credentials
templates:
  - templates/*.yaml
release:
  name: osac
  namespace: osac
set:
  global.observability.enabled: true
  global.observability.keycloak.issuerUrl: https://keycloak.example.com/realms/osac
  global.observability.keycloak.adminClientId: thanos-admin
  global.observability.services.metricsAuth.repository: ghcr.io/osac-project/osac-observability
  global.observability.services.metricsAuth.tag: test-metrics-auth
  global.observability.thanos.image.registry: registry.redhat.io
  global.observability.thanos.image.repository: openshift4/ose-thanos-rhel8
  global.observability.thanos.image.tag: test-thanos
  global.observability.services.oauth2Proxy.tag: test-oauth2-proxy
  global.observability.services.openshiftOauthProxy.tag: test-ose-oauth-proxy
  global.observability.objectStorage.secretName: thanos-object-storage
  global.observability.objectStorage.endpoint: https://s3.example.com
  global.observability.objectStorage.bucket: thanos
  global.observability.objectStorage.region: us-east-1

tests:
  - it: runs the credentials job under a dedicated service account
    template: templates/admin-credentials-rbac.yaml
    documentSelector:
      path: kind
      value: ServiceAccount
    asserts:
      - equal:
          path: metadata.name
          value: osac-observability-admin-credentials
      - equal:
          path: metadata.namespace
          value: osac-observability

  # Kubernetes never matches create against resourceNames: a create request
  # carries no resource name, so a named rule with the create verb grants
  # nothing and a fresh install cannot create the three Secrets. Create must be
  # its own unnarrowed rule; every other verb stays limited to the names.
  - it: grants create without resourceNames and every other verb by name
    template: templates/admin-credentials-rbac.yaml
    documentSelector:
      path: kind
      value: Role
    asserts:
      - equal:
          path: metadata.namespace
          value: osac-observability
      # A hook, not a normal resource: Helm applies an upgrade's normal
      # resources only after its pre-upgrade hooks, so a newly needed
      # permission would be missing when the job first asks for it.
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "28"
      - equal:
          path: rules
          value:
            - apiGroups:
                - ""
              resources:
                - secrets
              verbs:
                - create
            - apiGroups:
                - ""
              resources:
                - secrets
              resourceNames:
                - thanos-admin-client-secret
                - thanos-admin-oauth2-proxy
                - thanos-admin-openshift-oauth
              verbs:
                - get
                - update
                - patch
            # The copied trust bundle follows the same shape.
            - apiGroups:
                - ""
              resources:
                - configmaps
              verbs:
                - create
            - apiGroups:
                - ""
              resources:
                - configmaps
              resourceNames:
                - keycloak-ca-bundle
              verbs:
                - get
                - update
                - patch

  - it: binds the credentials role to its own service account
    template: templates/admin-credentials-rbac.yaml
    documentSelector:
      path: kind
      value: RoleBinding
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install,pre-upgrade
      - equal:
          path: roleRef.kind
          value: Role
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: osac-observability-admin-credentials
              namespace: osac-observability

  - it: reads only the Keycloak client secret for the job
    template: templates/admin-credentials-hook.yaml
    documentSelector:
      path: kind
      value: Role
    asserts:
      - equal:
          path: metadata.namespace
          value: keycloak
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install,pre-upgrade
      # Below the Job, which Helm would otherwise start in the same weight
      # batch: with backoffLimit 0 a 403 from the missing Role fails the release.
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "29"
      - equal:
          path: rules
          value:
            - apiGroups:
                - ""
              resources:
                - secrets
              resourceNames:
                - keycloak-client-secrets
              verbs:
                - get
            # The trust bundle the Keycloak chart publishes to that namespace.
            - apiGroups:
                - ""
              resources:
                - configmaps
              resourceNames:
                - ca-bundle
              verbs:
                - get

  - it: binds the Keycloak read role to the job service account
    template: templates/admin-credentials-hook.yaml
    documentSelector:
      path: kind
      value: RoleBinding
    asserts:
      - equal:
          path: metadata.namespace
          value: keycloak
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "29"
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: osac-observability-admin-credentials
              namespace: osac-observability

  # Before an upgrade so a Secret the job rewrites is in place before the pods
  # that read it start; after an install, once the namespace exists.
  - it: runs the copy job after install and before upgrade
    template: templates/admin-credentials-hook.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: metadata.namespace
          value: osac-observability
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "30"
      - equal:
          path: spec.backoffLimit
          value: 0
      - equal:
          path: spec.activeDeadlineSeconds
          value: 120
      - equal:
          path: spec.template.spec.serviceAccountName
          value: osac-observability-admin-credentials
      - equal:
          path: spec.template.spec.restartPolicy
          value: Never
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/osac-project/osac-observability:test-metrics-auth
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - /admin-credentials
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true

  - it: passes the object names to the job without any secret value
    template: templates/admin-credentials-hook.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].env
          count: 8
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KEYCLOAK_NAMESPACE
            value: keycloak
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KEYCLOAK_SECRET_NAME
            value: keycloak-client-secrets
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KEYCLOAK_SECRET_KEY
            value: thanos-admin
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OBS_NAMESPACE
            value: osac-observability
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ADMIN_CLIENT_SECRET_NAME
            value: thanos-admin-client-secret
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ADMIN_CLIENT_SECRET_KEY
            value: client-secret
      # oauth2-proxy decodes base64url from its environment variable while
      # ose-oauth-proxy decodes standard base64 from the file it mounts, so the
      # two Secrets differ.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ADMIN_COOKIE_SECRETS
            value: '[{"name":"thanos-admin-oauth2-proxy"},{"base64":true,"name":"thanos-admin-openshift-oauth"}]'
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ADMIN_COOKIE_SECRET_KEY
            value: cookie-secret

  - it: renders no namespace RBAC when observability is disabled
    template: templates/admin-credentials-rbac.yaml
    set:
      global.observability.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no hook when observability is disabled
    template: templates/admin-credentials-hook.yaml
    set:
      global.observability.enabled: false
    asserts:
      - hasDocuments:
          count: 0
