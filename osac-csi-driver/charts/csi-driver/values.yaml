namespace: osac-csi

driverName: csi.osac.openshift.io

image:
  repository: ghcr.io/osac-project/osac-csi-driver
  tag: main  # PLACEHOLDER -- overwritten at release time
  pullPolicy: Always

controller:
  replicas: 1
  clusterID: ""
  fulfillmentEndpoint: ""
  vendorSockets: ""
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  leaderElection: true

node:
  privileged: true
  vendorSockets: ""
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

sidecars:
  provisioner:
    image:
      repository: registry.k8s.io/sig-storage/csi-provisioner
      tag: v5.1.0
  attacher:
    image:
      repository: registry.k8s.io/sig-storage/csi-attacher
      tag: v4.7.0
  registrar:
    image:
      repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
      tag: v2.12.0

serviceAccount:
  controller:
    create: true
    name: ""
  node:
    create: true
    name: ""

vendors:
  trident:
    enabled: false
    image:
      repository: registry.connect.redhat.com/netapp/trident
      tag: 25.10.0
    config:
      certsSecret: ""
    node:
      socketPath: /var/lib/kubelet/plugins/csi.trident.netapp.io

  vast:
    enabled: false
    image:
      repository: docker.io/vastdataorg/csi
      tag: v2.6.5
    config:
      vmsHost: ""
      vipPoolName: ""
      nfsExport: /k8s
      viewPolicy: default
      verifySsl: "true"
      credentialsSecret: ""
    node:
      socketPath: /var/lib/kubelet/plugins/csi.vast.vastdata.com

  pure:
    enabled: false
    image:
      repository: docker.io/portworx/px-pure-csi-driver
      tag: "26.2.0"
    config:
      credentialsSecret: ""
      clusterUuid: ""
    node:
      socketPath: /var/lib/kubelet/plugins/csi.pure.purestorage.com
      sanType: "ISCSI"
      clusterName: ""
