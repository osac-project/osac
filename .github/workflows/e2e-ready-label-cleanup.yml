---
name: Remove e2e unlock labels on new push
on:
  pull_request_target:
    types: [synchronize]

jobs:
  remove-label:
    # Must match reusable: actions:read for head_seen_at runs lookup.
    permissions:
      actions: read
      contents: read
      pull-requests: write
    if: >-
      contains(github.event.pull_request.labels.*.name, 'e2e-ready') ||
      contains(github.event.pull_request.labels.*.name, 'lgtm')
    uses: osac-project/osac-test-infra/.github/workflows/e2e-ready-label-cleanup.yml@main
    secrets: inherit
