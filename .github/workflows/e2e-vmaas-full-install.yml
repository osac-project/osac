---
name: E2E VMaaS Full Install

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  merge_group:
  # 10x/day. Offset 7 minutes past the hour, not on the hour -- GitHub
  # Actions' shared cron scheduler queues everyone's on-the-hour
  # schedules together and can delay/drop them under load (see
  # osac-test-infra's e2e-caas-netris-caller.yml for the same reasoning).
  # Staggered from the other periodic workflows in this repo too, so they
  # don't all land on the same offset simultaneously. 24 doesn't divide
  # evenly by 10, so this lists 10 explicit hours (roughly every 2-3h)
  # instead of a bare */N pattern.
  schedule:
    - cron: "7 0,2,5,7,10,12,14,17,19,22 * * *"
  workflow_dispatch:
    inputs:
      test-suite:
        description: "Test suite (vmaas/sanity, vmaas/regression, vmaas/serial, or vmaas for all)"
        required: false
        default: "vmaas/sanity"
      test-filter:
        description: "pytest -k filter"
        required: false
        default: ""
      test-infra-ref:
        description: "Branch/ref of osac-test-infra"
        required: false
        default: "main"

concurrency:
  # pull_request: one run per PR; a newer push cancels the older run.
  # merge_group: a UNIQUE group per run (github.run_id) -- NEVER a shared one.
  # GitHub's merge queue tests entries speculatively in parallel (one run per
  # queue position, re-fired on every reshuffle), so a shared group with
  # cancel-in-progress makes those concurrent runs cancel each other; the
  # survivors' required e2e-*-gate never reports and the whole queue deadlocks
  # with every entry stuck on AWAITING_CHECKS. Stale runs left behind by a
  # reshuffle are cancelled precisely, per queue entry, by the
  # cancel-stale-merge-queue job below -- not by collapsing this group.
  group: e2e-vmaas-full-install-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # merge_group only: cancel a superseded run for THIS PR's queue entry.
  #
  # GitHub tests queue entries speculatively in parallel and re-creates an
  # entry's gh-readonly-queue branch (new sha) on every reshuffle, but does not
  # reliably cancel the now-stale run for the entry it replaced -- so the old
  # run keeps executing against a deleted ref until it hits the ~40-minute helm
  # timeout. This job kills that stale run (the problem #712 targeted) WITHOUT
  # cancelling other PRs' concurrent entries. It cannot be done in the
  # concurrency block above: a per-PR key can't be extracted there (Actions
  # concurrency expressions have no regex, and merge_group carries no PR number
  # field), and `concurrency` is not an allowed key on the reusable-workflow
  # caller job.
  #
  # A PR is in the queue at most once, so an OLDER run (lower run id) of THIS
  # workflow for the same pr-<N> is by definition superseded. Run ids are
  # monotonic, so cancelling only older runs means the newest run for the entry
  # always survives -- no mutual-cancel race, even across back-to-back
  # reshuffles. Every other PR has a different pr-<N> and is left untouched --
  # that is what preserves parallel queue testing.
  cancel-stale-merge-queue:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel superseded runs for this queue entry
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          THIS_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # HEAD_REF: .../gh-readonly-queue/<base>/pr-<N>-<sha> -> take "pr-<N>".
          entry="${HEAD_REF##*/}"   # pr-<N>-<sha>
          pr="${entry%-*}"          # pr-<N>
          case "$pr" in
            pr-[0-9]*) ;;
            *) echo "unexpected merge_group head_ref: '${HEAD_REF}'" >&2; exit 1 ;;
          esac
          echo "This entry: ${pr} (run ${THIS_RUN}); cancelling any older run for it."
          # `gh run list` runs without a fallback: a failure here (auth/API) is
          # real and must surface loudly. Only the per-run cancel tolerates the
          # benign race where the target run finished between listing and cancel.
          gh run list --workflow e2e-vmaas-full-install.yml --event merge_group \
            --limit 100 --json databaseId,headBranch,status \
            --jq ".[] | select(.headBranch | contains(\"/${pr}-\"))
                      | select(.status == \"in_progress\" or .status == \"queued\")
                      | select(.databaseId < ${THIS_RUN}) | .databaseId" \
          | while read -r id; do
              echo "Cancelling superseded run ${id}"
              gh run cancel "${id}" || echo "run ${id} already finished; nothing to cancel"
            done

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Same ignore list for pull_request and merge_group (OSAC-3879).
      # schedule / workflow_dispatch always run. Docs-only: e2e-*-gate still
      # reports success. Unreadiness skips the gate so the required check
      # stays pending instead of failing.
      # tests/e2e/** is the full-install suite (OSAC-3593); still run when that
      # tree changes even though `code` ignores **/tests/**.
      should-run: ${{ (github.event_name != 'pull_request' && github.event_name != 'merge_group') || steps.filter.outputs.code == 'true' || steps.filter.outputs.e2e-suite == 'true' }}
    steps:
      # dorny/paths-filter uses git diff on merge_group (not the PR Files API),
      # so the repo must be checked out with enough history for base..head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.event_name == 'merge_group'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!**/OWNERS'
              - '!**/LICENSE'
              - '!**/*.md'
              - '!**/docs/**'
              - '!**/.claude/**'
              - '!**/.cursor/**'
              - '!**/.gemini/**'
              - '!.design/**'
              - '!.skillsaw.yaml'
              - '!.pre-commit-config.yaml'
              - '!**/*_test.go'
              - '!**/testdata/**'
              - '!**/test/**'
              - '!**/tests/**'
              - '!**/it/**'
              - '!**/conftest.py'
              - '!**/fixtures/**'
            e2e-suite:
              - 'tests/e2e/**'

  # OSAC-3370: cheap readiness gate before expensive runners.
  # Allow: lgtm (present or previously applied), e2e-ready by github-actions[bot], or
  # coderabbitai[bot] APPROVED on exact HEAD (blocked by human CHANGES_REQUESTED).
  # Human APPROVED does not unlock. Non-PR events skip this job.
  # Not ready: ready=false (wait). Do not fail this job.
  e2e-readiness:
    name: e2e-readiness (vmaas)
    needs: changes
    if: needs.changes.outputs.should-run == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - name: Check e2e readiness
        id: check
        uses: osac-project/osac-test-infra/.github/actions/check-e2e-readiness@main
        with:
          pr-number: ${{ github.event.pull_request.number }}
          head-sha: ${{ github.event.pull_request.head.sha }}

  # Builds fulfillment-service, osac-operator, osac-aap's execution
  # environment (twice -- once each for aap.bootstrap.image and
  # aap.configAsCode.eeImage, see OSAC-3546), and bare-metal-fulfillment-operator
  # from this PR's current code and installs them together in one cluster --
  # not one "component under test" plus stale pinned images for the others.
  # Runs for any change touching any component (see `changes` above) rather
  # than being path-scoped per component; splitting this by component to
  # avoid running both suites when only one changed is deferred to the future
  # full path-based CI matrix, once its skip-logic pattern is verified.
  #
  # bare-metal-fulfillment-operator's image override (bmf.image.repository)
  # is currently a no-op in this flow specifically: values/vmaas-ci/values.yaml
  # sets bmf.enabled: false, so the chart isn't deployed here at all. Still
  # built from source for consistency with the other 3 components (all 4
  # should build from the PR in every e2e flow, even where one isn't
  # currently deployed) -- revisit if vmaas ever needs BMF enabled.
  e2e-vmaas-full-install:
    needs: [changes, e2e-readiness]
    if: >-
      always()
      && needs.changes.result == 'success'
      && needs.changes.outputs.should-run == 'true'
      && (needs.e2e-readiness.result == 'skipped'
          || needs.e2e-readiness.outputs.ready == 'true')
    permissions:
      contents: read
      # Required by e2e-vmaas-full-install.yml@main's "e2e" job -- only
      # exercised there when enable-ai-diagnostic is true (we never pass
      # it), but GitHub statically validates a called reusable workflow's
      # declared job permissions against what the caller grants regardless
      # of runtime reachability, so it must still be granted here.
      id-token: write
    uses: osac-project/osac-test-infra/.github/workflows/e2e-vmaas-full-install.yml@main
    with:
      # PR/merge_group: sanity (fast smoke). Schedule: full vmaas suite
      # (sanity + regression + serial). workflow_dispatch: honor input,
      # else sanity.
      test-suite: >-
        ${{
          inputs.test-suite != '' && inputs.test-suite ||
          (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'vmaas/sanity' ||
          github.event_name == 'schedule' && 'vmaas' ||
          'vmaas/sanity'
        }}
      test-filter: ${{ inputs.test-filter || '' }}
      # osac-installer now lives as a subdirectory of this same monorepo checkout
      # (its Chart.yaml deps resolve fulfillment-service/osac-operator/osac-aap/BMF
      # as ../../../<name> siblings within it), so a PR touching those components
      # must deploy from this PR's own fork/ref, not the reusable workflow's
      # standalone-repo default.
      installer-repo: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      installer-ref: ${{ github.event.pull_request.head.ref || github.sha }}
      # Build all component images from the PR's fork/branch (same monorepo checkout).
      # osac-aap's execution-environment is built twice (aap.bootstrap.image and
      # aap.configAsCode.eeImage): the two are logically the same image but the
      # override mechanism keys strictly off imageKey, one build per key, so this
      # is the only way to get both fields covered without changing that mechanism
      # (which lives in osac-test-infra, not here). See OSAC-3546.
      components: '[{"repo":"${{ github.event.pull_request.head.repo.full_name || github.repository }}","ref":"${{ github.event.pull_request.head.ref || github.sha }}","containerfile":"fulfillment-service/Containerfile","context":".","imageKey":"service.images.service"},{"repo":"${{ github.event.pull_request.head.repo.full_name || github.repository }}","ref":"${{ github.event.pull_request.head.ref || github.sha }}","containerfile":"osac-operator/Containerfile","context":".","imageKey":"operator.image.repository"},{"repo":"${{ github.event.pull_request.head.repo.full_name || github.repository }}","ref":"${{ github.event.pull_request.head.ref || github.sha }}","containerfile":"osac-aap/execution-environment/execution-environment.yaml","imageKey":"aap.bootstrap.image","buildType":"ansible-builder"},{"repo":"${{ github.event.pull_request.head.repo.full_name || github.repository }}","ref":"${{ github.event.pull_request.head.ref || github.sha }}","containerfile":"osac-aap/execution-environment/execution-environment.yaml","imageKey":"aap.configAsCode.eeImage","buildType":"ansible-builder"},{"repo":"${{ github.event.pull_request.head.repo.full_name || github.repository }}","ref":"${{ github.event.pull_request.head.ref || github.sha }}","containerfile":"bare-metal-fulfillment-operator/Containerfile","context":".","imageKey":"bmf.image.repository"},{"repo":"${{ github.event.pull_request.head.repo.full_name || github.repository }}","ref":"${{ github.event.pull_request.head.ref || github.sha }}","containerfile":"osac-metering/metering-service/Containerfile","context":"osac-metering","imageKey":"metering.image.repository"},{"repo":"${{ github.event.pull_request.head.repo.full_name || github.repository }}","ref":"${{ github.event.pull_request.head.ref || github.sha }}","containerfile":"osac-metering/adapters/Containerfile.echo-adapter","context":"osac-metering","imageKey":"metering.echoAdapter.image.repository"},{"repo":"${{ github.event.pull_request.head.repo.full_name || github.repository }}","ref":"${{ github.event.pull_request.head.ref || github.sha }}","containerfile":"osac-csi-driver/Containerfile","context":".","imageKey":"csiDriver.image.repository"}]'
      # Pass author_association for fork PR authorization (empty for non-fork PRs)
      fork-pr-author-association: ${{ github.event.pull_request.head.repo.fork && github.event.pull_request.author_association || '' }}
      fork-pr-author: ${{ github.event.pull_request.head.repo.fork && github.event.pull_request.user.login || '' }}
      pr-number: ${{ github.event.pull_request.number }}
      # Checkout osac-test-infra for tests/Containerfile (not the caller repo)
      test-infra-repository: osac-project/osac-test-infra
      test-infra-ref: ${{ inputs.test-infra-ref || 'main' }}
      # OSAC-3593: Use tests from osac mono-repo instead of osac-test-infra
      test-source: "osac"
      test-repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      test-ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # Gated on ref, not event type: the real constraint is WIF trust
      # (main branch only), not which event triggered the run. This
      # correctly covers schedule (always main) AND a manual
      # workflow_dispatch run against main (same safe WIF context) --
      # checking event_name == 'schedule' alone would wrongly exclude the
      # latter, making it impossible to manually validate this feature
      # through the real caller. pull_request is naturally excluded since
      # its github.ref is the synthetic PR-merge ref, never
      # refs/heads/main -- and moot regardless, since every real PR here
      # is fork-originated and gets no OIDC/WIF access at all by GitHub
      # Actions policy. merge_group is excluded the same way (its
      # github.ref is the readonly-queue ref).
      enable-ai-diagnostic: ${{ github.ref == 'refs/heads/main' }}

  # Skip this required check on unreadiness so it stays pending (not red).
  # Docs-only / non-PR / unlocked still report here.
  e2e-vmaas-gate:
    if: >-
      always()
      && (github.event_name != 'pull_request'
          || needs.changes.outputs.should-run != 'true'
          || needs.e2e-readiness.result != 'success'
          || needs.e2e-readiness.outputs.ready == 'true')
    needs: [changes, e2e-readiness, e2e-vmaas-full-install]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "Upstream job results:"
          echo "  changes: ${{ needs.changes.result }}"
          echo "  e2e-readiness: ${{ needs.e2e-readiness.result }}"
          echo "  e2e-vmaas-full-install: ${{ needs.e2e-vmaas-full-install.result }}"
          echo ""
          echo "One or more upstream jobs failed or were cancelled."
          exit 1
      - if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ needs.changes.outputs.should-run }}" != "true" ]; then
            echo "docs-only, skipped"
          else
            echo "e2e passed"
          fi

  # Latest check named e2e-vmaas-gate after the skipped gate job. Forks may
  # lack checks:write; unreported check is still Expected/Waiting.
  e2e-vmaas-pending:
    if: >-
      always()
      && github.event_name == 'pull_request'
      && needs.changes.outputs.should-run == 'true'
      && needs.e2e-readiness.result == 'success'
      && needs.e2e-readiness.outputs.ready != 'true'
    needs: [changes, e2e-readiness, e2e-vmaas-full-install, e2e-vmaas-gate]
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: Mark e2e-vmaas-gate pending
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECK_NAME: e2e-vmaas-gate
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REASON: ${{ needs.e2e-readiness.outputs.reason }}
        run: |
          set -euo pipefail
          title="${REASON:-waiting for e2e unlock}"
          summary=$(printf '%s\n\n%s\n\n%s' "${title}" \
            "Need coderabbitai[bot] APPROVED on this HEAD, lgtm, or /e2e-ready." \
            "See .github/e2e-readiness.md")
          payload=$(jq -n \
            --arg name "${CHECK_NAME}" \
            --arg sha "${HEAD_SHA}" \
            --arg started "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg title "${title}" \
            --arg details "${DETAILS_URL}" \
            --arg summary "${summary}" \
            '{
              name: $name,
              head_sha: $sha,
              status: "in_progress",
              details_url: $details,
              started_at: $started,
              output: {
                title: $title,
                summary: $summary
              }
            }')
          if ! gh api "repos/${REPO}/check-runs" --input - <<<"${payload}"; then
            echo "Could not post in_progress check ${CHECK_NAME} (fork PRs may lack checks:write)."
            echo "Required check stays unreported until unlock rerun."
          fi
