---
# Generate pure.json CSI credentials Secret from hub Realm Secret.
#
# Expected inputs (from ensure_storage_class or other caller):
#   _realm_name          — Realm name (from tenant config Secret)
#   _api_token           — Realm-scoped API token
#   _mgmt_endpoint       — FlashBlade management endpoint
#   _nfs_endpoint        — FlashBlade NFS data VIP
#
# Creates:
#   pure.json Secret in pure_storage_csi_backends_namespace
#
# CRITICAL SECURITY: This Secret contains Realm-scoped credentials, not
# array-admin credentials. The token can only access resources within the Realm.

- name: Build FlashBlades array for pure.json
  ansible.builtin.set_fact:
    _pure_flashblades_json:
      FlashBlades:
        - MgmtEndPoint: "{{ _mgmt_endpoint }}"
          APIToken: "{{ _api_token }}"
          NFSEndPoint: "{{ _nfs_endpoint }}"
  no_log: true

- name: Create CSI credentials Secret namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ pure_storage_csi_backends_namespace }}"
        labels:
          app.kubernetes.io/managed-by: osac-aap

- name: Create pure.json CSI credentials Secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ pure_storage_csi_credential_secret_name }}"
        namespace: "{{ pure_storage_csi_backends_namespace }}"
        labels:
          osac.openshift.io/tenant: "{{ tenant_name }}"
          app.kubernetes.io/managed-by: osac-aap
      stringData:
        pure.json: "{{ _pure_flashblades_json | to_nice_json }}"
  no_log: true

- name: Clear CSI credentials from facts
  ansible.builtin.set_fact:
    _pure_flashblades_json: null
