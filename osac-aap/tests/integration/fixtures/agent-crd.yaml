---
# Minimal Agent CRD for integration testing.
# The real assisted-service Agent CRD is much larger; this captures only the
# fields exercised by manage_agents role tests: spec.clusterDeploymentName
# (ClusterReference object), status.debugInfo.state, status.conditions, and
# metadata.labels (including agent-install.openshift.io/clusterdeployment-namespace).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agents.agent-install.openshift.io
spec:
  group: agent-install.openshift.io
  names:
    kind: Agent
    listKind: AgentList
    plural: agents
    singular: agent
  scope: Namespaced
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                approved:
                  type: boolean
                clusterDeploymentName:
                  type: object
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
            status:
              type: object
              properties:
                debugInfo:
                  type: object
                  properties:
                    state:
                      type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
      subresources:
        status: {}
