- name: EIP recovery - one SNAT rule
  ansible.builtin.assert:
    that:
      - nf_state.nats | selectattr('name', 'equalto', 'osac-natgw-' ~ nf_ids.natgw) | list | length == 1
      - nf_writes == []
    quiet: true

- name: EIP recovery - the DNAT delete commits but the response is lost
  ansible.builtin.include_tasks: admin.yaml
  vars:
    nf_steps:
      - {path: faults, body: {key: "DELETE /api/v2/nat/*", mode: commit_then_drop}}

- name: EIP recovery - detach_external_ip fails retryably
