---
# Minimal TridentBackendConfig CRD for ONTAP storage provider integration tests.
# Mirrors only the fields the ontap_storage role sets and reads (spec fields are
# x-kubernetes-preserve-unknown-fields so any backend config validates; status.phase
# carries the Bound value the role waits on, status.message the failure reason the
# role surfaces on phase Failed). The real CRD ships with Trident —
# applying that here would require the full operator, which the kind test env
# does not install. A stub Deployment in the same fixture set plays the Trident
# operator by patching status.phase to Bound.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tridentbackendconfigs.trident.netapp.io
spec:
  group: trident.netapp.io
  scope: Namespaced
  names:
    plural: tridentbackendconfigs
    singular: tridentbackendconfig
    kind: TridentBackendConfig
    shortNames:
      - tbc
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string
                lastOperationStatus:
                  type: string
                backendInfo:
                  type: object
                  properties:
                    backendName:
                      type: string
                    backendUUID:
                      type: string
