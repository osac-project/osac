---
argument_specs:
  create_virtual_network:
    options:
      virtual_network:
        type: dict
        required: true
        description: VirtualNetwork CR from fulfillment-api via osac_job_vars
      template_parameters:
        type: dict
        description: Template-specific parameters (reserved for future use)
        options: {}
        default: {}

  delete_virtual_network:
    options:
      virtual_network:
        type: dict
        required: true
        description: VirtualNetwork CR from fulfillment-api via osac_job_vars

  create_subnet:
    options:
      subnet:
        type: dict
        required: true
        description: Subnet CR from fulfillment-api via osac_job_vars
      template_parameters:
        type: dict
        description: Template-specific parameters (reserved for future use)
        options: {}
        default: {}

  delete_subnet:
    options:
      subnet:
        type: dict
        required: true
        description: Subnet CR from fulfillment-api via osac_job_vars

  create_security_group:
    options:
      security_group:
        type: dict
        required: true
        description: SecurityGroup CR from fulfillment-api via osac_job_vars
      template_parameters:
        type: dict
        description: Template-specific parameters (reserved for future use)
        options: {}
        default: {}

  delete_security_group:
    options:
      security_group:
        type: dict
        required: true
        description: SecurityGroup CR from fulfillment-api via osac_job_vars

  create_external_ip:
    options:
      external_ip:
        type: dict
        required: true
        description: ExternalIP CR from fulfillment-api via osac_job_vars
      template_parameters:
        type: dict
        description: Template-specific parameters (reserved for future use)
        options: {}
        default: {}

  delete_external_ip:
    options:
      external_ip:
        type: dict
