apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace }}
  name: fulfillment-event-publisher
  labels:
    app: fulfillment-event-publisher
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8002"
spec:
  selector:
    app: fulfillment-event-publisher
  clusterIP: None
  ports:
  - name: metrics
    port: 8002
    targetPort: metrics
