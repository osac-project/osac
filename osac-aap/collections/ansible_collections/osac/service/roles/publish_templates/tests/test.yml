---
# Test playbook for osac.service.publish_templates role.
# Each play is guarded by a `when` condition with bool coercion -- only the
# play whose variable evaluates to true will run. Pass exactly one variable
# per invocation.
#
# These tests use a Python mock HTTP server to simulate the fulfillment-service
# API, so they can run without any external dependencies.
#
# Required variables for every test:
#   test_mock_port:  Port for the mock HTTP server (default: 18081)
#
#   Test 1 (empty API responses -- the MGMT-23770 bug scenario):
#     When no items exist, proto3 omits the `size` field entirely.
#     The role must handle {"items": []} without a `size` key.
#     Expected: All four resource types are created via POST, no PATCH calls.
#     ansible-playbook ... -e test_empty=true
#
#   Test 2 (populated API responses -- existing items):
#     When items already exist, the role should PATCH them.
#     New items that don't exist should be POSTed.
#     Expected: Existing templates updated via PATCH, new ones POSTed.
#     ansible-playbook ... -e test_populated=true
#
#   Test 2b (populated paginated API responses):
#     Existing AddOnOperators span short pages and must still be PATCHed.
#     ansible-playbook ... -e test_populated_paginated=true
#
#   Test 2c/2d (pagination failure responses):
#     Zero-progress and failed later pages must suppress writes.
#     ansible-playbook ... -e test_pagination_stall=true
#     ansible-playbook ... -e test_pagination_failure=true
#
#   Test 3 (no items key in response -- edge case):
#     Some API responses might return {} without an items key.
#     The role should treat this as empty and POST all templates.
#     Expected: All templates created via POST.
#     ansible-playbook ... -e test_no_items_key=true
#
#   Test 4 (service disabled -- 404 response):
#     The role must skip writes when the endpoint returns 404.
#     ansible-playbook ... -e test_disabled=true

# ──────────────────────────────────────────────────────────────
# Test 1: Empty API responses (the MGMT-23770 bug scenario)
# Expected: role succeeds, all templates created via POST
# ──────────────────────────────────────────────────────────────
- name: "Test publish_templates -- empty API responses (MGMT-23770)"
  hosts: localhost
  gather_facts: false

  vars:
    test_mock_port: 18081

  tasks:
    - name: Kill any stale server on port
      ansible.builtin.shell: "fuser -k {{ test_mock_port }}/tcp 2>/dev/null || true"
      changed_when: false
      when: test_empty | default(false) | bool

    - name: Start mock API server (empty scenario)
      ansible.builtin.command:
        cmd: "python3 {{ playbook_dir }}/mock_api_server.py {{ test_mock_port }} empty"
      changed_when: false
      async: 30
      poll: 0
      register: mock_server
      when: test_empty | default(false) | bool

    - name: Wait for mock server to start
      ansible.builtin.wait_for:
        port: "{{ test_mock_port }}"
        timeout: 5
      when: test_empty | default(false) | bool

    - name: Run publish_templates role against empty API
      ansible.builtin.include_role:
        name: osac.service.publish_templates
      vars:
        osac_fulfillment_service_uri: "http://127.0.0.1:{{ test_mock_port }}"
        osac_fulfillment_service_token: "test-token"
        publish_templates_validate_certs: false
        osac_cluster_templates:
          - id: "new-cluster-template"
            title: "Test Cluster"
        osac_compute_instance_templates:
          - id: "new-ci-template"
            title: "Test CI"
        osac_bare_metal_instance_templates:
          - id: "new-bm-template"
            title: "Test BM"
        osac_addon_operator_templates:
          - id: "new-addon-operator"
            metadata:
              name: cert-manager
              tenant: shared
            title: "Test AddOnOperator"
            min_ocp_version: "4.14.0"
            max_ocp_version: ""
            exclusions: []
            dependencies: []
      when: test_empty | default(false) | bool

    - name: Fetch API call log
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ test_mock_port }}/_calls"
        return_content: true
      register: call_log
      when: test_empty | default(false) | bool

    - name: Select AddOnOperator POST calls
      ansible.builtin.set_fact:
        addon_operator_get_calls: >-
          {{ call_log.json
             | selectattr('method', 'equalto', 'GET')
             | selectattr('path', 'equalto', '/api/private/v1/add_on_operators')
             | list }}
        addon_operator_post_calls: >-
          {{ call_log.json
             | selectattr('method', 'equalto', 'POST')
             | selectattr('path', 'equalto', '/api/private/v1/add_on_operators')
             | list }}
        expected_addon_operator_payload:
          id: new-addon-operator
          metadata:
            name: cert-manager
            tenant: shared
          title: Test AddOnOperator
          min_ocp_version: 4.14.0
          max_ocp_version: ""
          exclusions: []
          dependencies: []
      when: test_empty | default(false) | bool

    - name: Verify POST calls were made for all templates (empty = create new)
      ansible.builtin.assert:
        that:
          - call_log.json | selectattr('method', 'equalto', 'POST') | list | length == 4
          - call_log.json | selectattr('method', 'equalto', 'PATCH') | list | length == 0
          - call_log.json | selectattr('method', 'equalto', 'POST') | selectattr('path', 'contains', 'cluster_templates') | list | length == 1
          - call_log.json | selectattr('method', 'equalto', 'POST') | selectattr('path', 'contains', 'compute_instance_templates') | list | length == 1
          - call_log.json | selectattr('method', 'equalto', 'POST') | selectattr('path', 'contains', 'baremetal_instance_templates') | list | length == 1
          - addon_operator_get_calls | length == 1
          - addon_operator_get_calls[0].authorization == 'Bearer test-token'
          - addon_operator_post_calls | length == 1
          - addon_operator_post_calls[0].body == expected_addon_operator_payload
          - addon_operator_post_calls[0].authorization == 'Bearer test-token'
        fail_msg: >-
          Expected 4 POSTs and 0 PATCHes for empty scenario.
          Calls: {{ call_log.json }}
        success_msg: "Empty scenario passed: all 4 resource types created via POST"
      when: test_empty | default(false) | bool

    - name: Stop mock server
      ansible.builtin.shell: "fuser -k {{ test_mock_port }}/tcp 2>/dev/null || true"
      changed_when: false
      when: test_empty | default(false) | bool

# ──────────────────────────────────────────────────────────────
# Test 2: Populated API responses (existing items)
# Expected: existing templates PATCHed, new ones POSTed
# ──────────────────────────────────────────────────────────────
- name: "Test publish_templates -- populated API responses"
  hosts: localhost
  gather_facts: false

  pre_tasks:
    - name: Enable populated scenario for pagination test
      ansible.builtin.set_fact:
        test_populated: true
      when: test_populated_paginated | default(false) | bool

  vars:
    test_mock_port: 18081

  tasks:
    - name: Kill any stale server on port
      ansible.builtin.shell: "fuser -k {{ test_mock_port }}/tcp 2>/dev/null || true"
      changed_when: false
      when: test_populated | default(false) | bool

    - name: Start mock API server (populated scenario)
      ansible.builtin.command:
        cmd: >-
          python3 {{ playbook_dir }}/mock_api_server.py {{ test_mock_port }}
          {{ 'paginated' if test_populated_paginated | default(false) | bool else 'populated' }}
      changed_when: false
      async: 30
      poll: 0
      register: mock_server
      when: test_populated | default(false) | bool

    - name: Wait for mock server to start
      ansible.builtin.wait_for:
        port: "{{ test_mock_port }}"
        timeout: 5
      when: test_populated | default(false) | bool

    - name: Run publish_templates role with existing item IDs
      ansible.builtin.include_role:
        name: osac.service.publish_templates
      vars:
        osac_fulfillment_service_uri: "http://127.0.0.1:{{ test_mock_port }}"
        osac_fulfillment_service_token: "test-token"
        publish_templates_validate_certs: false
        osac_cluster_templates:
          - id: "existing-cluster-template"
            title: "Updated Cluster"
          - id: "brand-new-cluster"
            title: "New Cluster"
        osac_compute_instance_templates:
          - id: "existing-ci-template"
            title: "Updated CI"
        osac_bare_metal_instance_templates:
          - id: "existing-bm-template"
            title: "Updated BM"
        osac_addon_operator_templates:
          - id: "existing-addon-operator"
            metadata:
              name: cert-manager
              tenant: shared
            title: "Updated AddOnOperator"
            min_ocp_version: "4.14.0"
            max_ocp_version: ""
            exclusions: []
            dependencies: []
      when: test_populated | default(false) | bool

    - name: Fetch API call log
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ test_mock_port }}/_calls"
        return_content: true
      register: call_log
      when: test_populated | default(false) | bool

    - name: Select AddOnOperator PATCH calls
      ansible.builtin.set_fact:
        addon_operator_patch_calls: >-
          {{ call_log.json
             | selectattr('method', 'equalto', 'PATCH')
             | selectattr('path', 'equalto', '/api/private/v1/add_on_operators/existing-addon-operator')
             | list }}
        expected_addon_operator_payload:
          id: existing-addon-operator
          metadata:
            name: cert-manager
            tenant: shared
          title: Updated AddOnOperator
          min_ocp_version: 4.14.0
          max_ocp_version: ""
          exclusions: []
          dependencies: []
      when: test_populated | default(false) | bool

    - name: Verify PATCH calls for existing items and POST for new
      ansible.builtin.assert:
        that:
          - call_log.json | selectattr('method', 'equalto', 'PATCH') | list | length == 4
          - call_log.json | selectattr('method', 'equalto', 'POST') | list | length == 1
          - call_log.json | selectattr('method', 'equalto', 'PATCH') | selectattr('path', 'contains', 'cluster_templates') | list | length == 1
          - call_log.json | selectattr('method', 'equalto', 'PATCH') | selectattr('path', 'contains', 'compute_instance_templates') | list | length == 1
          - call_log.json | selectattr('method', 'equalto', 'PATCH') | selectattr('path', 'contains', 'baremetal_instance_templates') | list | length == 1
          - addon_operator_patch_calls | length == 1
          - addon_operator_patch_calls[0].body == expected_addon_operator_payload
          - >-
            addon_operator_patch_calls[0].request_uri ==
            '/api/private/v1/add_on_operators/existing-addon-operator?update_mask=metadata.name,title,description,min_ocp_version,max_ocp_version,exclusions,dependencies'
          - addon_operator_patch_calls[0].authorization == 'Bearer test-token'
        fail_msg: >-
          Expected 4 PATCHes (existing items) and 1 POST (new item).
          Calls: {{ call_log.json }}
        success_msg: "Populated scenario passed: 4 existing PATCHed, 1 new POSTed"
      when: test_populated | default(false) | bool

    - name: Stop mock server
      ansible.builtin.shell: "fuser -k {{ test_mock_port }}/tcp 2>/dev/null || true"
      changed_when: false
      when: test_populated | default(false) | bool

# ──────────────────────────────────────────────────────────────
# Test 3: Edge case -- no items key at all in response
# Expected: role succeeds, all templates created via POST
# ──────────────────────────────────────────────────────────────
- name: "Test publish_templates -- no items key edge case"
  hosts: localhost
  gather_facts: false

  vars:
    test_mock_port: 18081

  tasks:
    - name: Kill any stale server on port
      ansible.builtin.shell: "fuser -k {{ test_mock_port }}/tcp 2>/dev/null || true"
      changed_when: false
      when: test_no_items_key | default(false) | bool

    - name: Start mock API server (no_items_key scenario)
      ansible.builtin.command:
        cmd: "python3 {{ playbook_dir }}/mock_api_server.py {{ test_mock_port }} no_items_key"
      changed_when: false
      async: 30
      poll: 0
      register: mock_server
      when: test_no_items_key | default(false) | bool

    - name: Wait for mock server to start
      ansible.builtin.wait_for:
        port: "{{ test_mock_port }}"
        timeout: 5
      when: test_no_items_key | default(false) | bool

    - name: Run publish_templates role against edge-case API
      ansible.builtin.include_role:
        name: osac.service.publish_templates
      vars:
        osac_fulfillment_service_uri: "http://127.0.0.1:{{ test_mock_port }}"
        osac_fulfillment_service_token: "test-token"
        publish_templates_validate_certs: false
        osac_cluster_templates:
          - id: "edge-case-cluster"
            title: "Edge Cluster"
        osac_compute_instance_templates:
          - id: "edge-case-ci"
            title: "Edge CI"
        osac_bare_metal_instance_templates:
          - id: "edge-case-bm"
            title: "Edge BM"
        osac_addon_operator_templates:
          - id: "edge-case-addon-operator"
            metadata:
              name: cert-manager
              tenant: shared
            title: "Edge AddOnOperator"
            min_ocp_version: "4.14.0"
            max_ocp_version: ""
            exclusions: []
            dependencies: []
      when: test_no_items_key | default(false) | bool

    - name: Fetch API call log
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ test_mock_port }}/_calls"
        return_content: true
      register: call_log
      when: test_no_items_key | default(false) | bool

    - name: Verify all templates created via POST (no items = all new)
      ansible.builtin.assert:
        that:
          - call_log.json | selectattr('method', 'equalto', 'POST') | list | length == 4
          - call_log.json | selectattr('method', 'equalto', 'PATCH') | list | length == 0
        fail_msg: >-
          Expected 4 POSTs and 0 PATCHes for no-items-key scenario.
          Calls: {{ call_log.json }}
        success_msg: "No-items-key edge case passed: all 4 resource types created via POST"
      when: test_no_items_key | default(false) | bool

    - name: Stop mock server
      ansible.builtin.shell: "fuser -k {{ test_mock_port }}/tcp 2>/dev/null || true"
      changed_when: false
      when: test_no_items_key | default(false) | bool

# ---------------------------------------------------------------------------
# Test 4: Fulfillment service disabled
# ---------------------------------------------------------------------------
- name: "Test publish_templates -- service disabled"
  hosts: localhost
  gather_facts: false

  vars:
    test_mock_port: 18081
    expected_disabled_status: "{{ 404 if test_not_found | default(false) | bool else 503 }}"

  pre_tasks:
    - name: Enable disabled scenario for 404 test
      ansible.builtin.set_fact:
        test_disabled: true
      when: test_not_found | default(false) | bool

  tasks:
    - name: Kill any stale server on port
      ansible.builtin.shell: "fuser -k {{ test_mock_port }}/tcp 2>/dev/null || true"
      changed_when: false
      when: test_disabled | default(false) | bool

    - name: Start mock API server (disabled scenario)
      ansible.builtin.command:
        cmd: >-
          python3 {{ playbook_dir }}/mock_api_server.py {{ test_mock_port }}
          {{ 'not_found' if test_not_found | default(false) | bool else 'disabled' }}
      changed_when: false
      async: 30
      poll: 0
      register: mock_server
      when: test_disabled | default(false) | bool

    - name: Wait for mock server to start
      ansible.builtin.wait_for:
        port: "{{ test_mock_port }}"
        timeout: 5
      when: test_disabled | default(false) | bool

    - name: Run publish_templates role against disabled API
      ansible.builtin.include_role:
        name: osac.service.publish_templates
      vars:
        osac_fulfillment_service_uri: "http://127.0.0.1:{{ test_mock_port }}"
        osac_fulfillment_service_token: "test-token"
        publish_templates_validate_certs: false
        osac_cluster_templates: []
        osac_compute_instance_templates: []
        osac_bare_metal_instance_templates: []
        osac_addon_operator_templates:
          - id: "disabled-addon-operator"
            metadata:
              name: cert-manager
              tenant: shared
            title: "Disabled AddOnOperator"
            min_ocp_version: "4.14.0"
            max_ocp_version: ""
            exclusions: []
            dependencies: []
      when: test_disabled | default(false) | bool

    - name: Fetch API call log
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ test_mock_port }}/_calls"
        return_content: true
      register: call_log
      when: test_disabled | default(false) | bool

    - name: Select disabled AddOnOperator GET calls
      ansible.builtin.set_fact:
        disabled_addon_operator_get_calls: >-
          {{ call_log.json
             | selectattr('method', 'equalto', 'GET')
             | selectattr('path', 'equalto', '/api/private/v1/add_on_operators')
             | list }}
      when: test_disabled | default(false) | bool

    - name: Verify disabled service receives no writes
      ansible.builtin.assert:
        that:
          - disabled_addon_operator_get_calls | length == 1
          - disabled_addon_operator_get_calls[0].status == expected_disabled_status | int
          - call_log.json | selectattr('method', 'equalto', 'POST') | list | length == 0
          - call_log.json | selectattr('method', 'equalto', 'PATCH') | list | length == 0
        fail_msg: >-
          Expected no writes when the AddOnOperator endpoint is disabled.
          Calls: {{ call_log.json }}
        success_msg: "Disabled service skipped AddOnOperator writes"
      when: test_disabled | default(false) | bool

    - name: Stop mock server
      ansible.builtin.shell: "fuser -k {{ test_mock_port }}/tcp 2>/dev/null || true"
      changed_when: false
      when: test_disabled | default(false) | bool

# ---------------------------------------------------------------------------
# Test 5: Pagination failure must fail closed
# ---------------------------------------------------------------------------
- name: "Test publish_templates -- pagination failure"
  hosts: localhost
  gather_facts: false

  vars:
    test_mock_port: 18081

  tasks:
    - name: Kill any stale server on port
      ansible.builtin.shell: "fuser -k {{ test_mock_port }}/tcp 2>/dev/null || true"
      changed_when: false
      when: >-
        test_pagination_stall | default(false) | bool or
        test_pagination_failure | default(false) | bool

    - name: Start mock API server (pagination failure scenario)
      ansible.builtin.command:
        cmd: >-
          python3 {{ playbook_dir }}/mock_api_server.py {{ test_mock_port }}
          {{ 'pagination_stall' if test_pagination_stall | default(false) | bool else 'pagination_failure' }}
      changed_when: false
      async: 30
      poll: 0
      register: mock_server
      when: >-
        test_pagination_stall | default(false) | bool or
        test_pagination_failure | default(false) | bool

    - name: Wait for mock server to start
      ansible.builtin.wait_for:
        port: "{{ test_mock_port }}"
        timeout: 5
      when: >-
        test_pagination_stall | default(false) | bool or
        test_pagination_failure | default(false) | bool

    - name: Run publish_templates role against pagination failure
      ansible.builtin.include_role:
        name: osac.service.publish_templates
      vars:
        osac_fulfillment_service_uri: "http://127.0.0.1:{{ test_mock_port }}"
        osac_fulfillment_service_token: "test-token"
        publish_templates_validate_certs: false
        osac_cluster_templates: []
        osac_compute_instance_templates: []
        osac_bare_metal_instance_templates: []
        osac_addon_operator_templates:
          - id: "pagination-addon-operator"
            metadata:
              name: cert-manager
              tenant: shared
            title: "Pagination AddOnOperator"
            min_ocp_version: "4.14.0"
            max_ocp_version: ""
            exclusions: []
            dependencies: []
      when: >-
        test_pagination_stall | default(false) | bool or
        test_pagination_failure | default(false) | bool

    - name: Fetch API call log
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ test_mock_port }}/_calls"
        return_content: true
      register: call_log
      when: >-
        test_pagination_stall | default(false) | bool or
        test_pagination_failure | default(false) | bool

    - name: Verify pagination failure suppresses writes
      ansible.builtin.assert:
        that:
          - call_log.json | selectattr('method', 'equalto', 'POST') | list | length == 0
          - call_log.json | selectattr('method', 'equalto', 'PATCH') | list | length == 0
        fail_msg: >-
          Expected no writes after pagination failure. Calls: {{ call_log.json }}
        success_msg: "Pagination failure correctly suppressed AddOnOperator writes"
      when: >-
        test_pagination_stall | default(false) | bool or
        test_pagination_failure | default(false) | bool

    - name: Stop mock server
      ansible.builtin.shell: "fuser -k {{ test_mock_port }}/tcp 2>/dev/null || true"
      changed_when: false
      when: >-
        test_pagination_stall | default(false) | bool or
        test_pagination_failure | default(false) | bool
