ocp_release_version: "4.22.0"
ocp_release_image: "quay.io/openshift-release-dev/ocp-release:{{ ocp_release_version }}-multi"
# Regular CaaS clusters are not registered with ACM (OSAC-6313). Templates
# building on ocp_small that must stay hub-registered (AI MaaS workload
# clusters, OSAC-6488) override this to true.
ocp_small_enable_acm_registration: false
