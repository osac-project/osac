# Generates the OpenAPI 2 spec of the public API, currently filtered to the bare metal instances service, using the
# plugin of the grpc-gateway, so the result matches the REST contract exactly, including the `body` and
# `response_body` options of the `google.api.http` annotations. Run from the proto directory so that the module
# dependencies resolve:
#
#   cd ../../proto && buf generate --template ../terraform-provider/tools/codegen/buf.gen.openapi.yaml \
#     --path public/osac/public/v1/baremetal_instances_service.proto
#
# Requires the plugin binary in the PATH:
#
#   go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-openapiv2@latest
#
version: v2
managed:
  enabled: true
  override:
  - file_option: go_package_prefix
    module: buf.build/osac-project/public-api
    value: github.com/osac-project/osac/proto/gen
  disable:
  - module: buf.build/googleapis/googleapis
  - module: buf.build/grpc-ecosystem/grpc-gateway
  - module: buf.build/bufbuild/protovalidate
inputs:
  - directory: public
plugins:
  - local: protoc-gen-openapiv2
    out: ../terraform-provider/tools/codegen/out
    opt:
      # Use the original proto field names (snake_case) instead of the protojson camelCase names:
      - json_names_for_fields=false
