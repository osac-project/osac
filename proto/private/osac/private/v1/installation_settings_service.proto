syntax = "proto3";

package osac.private.v1;

import "cleanapi/cleanapi.proto";

option (cleanapi.file).private = true;

// Request for the installation's immutable networking mode.
message InstallationSettingsGetRequest {}

// The networking mode selected when Fulfillment first started with this schema.
message InstallationSettingsGetResponse {
  bool networking_provisioning_enabled = 1;
}

// Read-only installation configuration for authorized internal clients.
service InstallationSettings {
  rpc Get(InstallationSettingsGetRequest) returns (InstallationSettingsGetResponse);
}
