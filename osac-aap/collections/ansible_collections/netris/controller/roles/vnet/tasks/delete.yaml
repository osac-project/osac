---
- name: Ensure Netris auth
  ansible.builtin.include_role:
    name: netris.controller.auth
  when: netris_session_cookie is not defined

- name: Get existing V-Nets
  netris.controller.protected_uri:
    url: "{{ netris_controller_url }}/api/v2/vnet"
    method: GET
    headers:
      Cookie: "connect.sid={{ netris_session_cookie }}"
    return_content: true
    status_code: 200
    validate_certs: "{{ netris_validate_certs | default(true) }}"
    ca_path: "{{ netris_ca_path | default(omit, true) }}"
  register: _vnet_list_resp
  no_log: true

- name: Find V-Nets by name
  ansible.builtin.set_fact:
    _vnets_by_name: >-
      {{ (_vnet_list_resp.json.data | default([]))
         | selectattr('name', 'equalto', vnet_name)
         | list }}
  when: _vnet_list_resp.json is mapping

- name: Initialize V-Net deletion candidates
  ansible.builtin.set_fact:
    _existing_vnets: "{{ _vnets_by_name }}"

- name: Filter V-Nets by VPC
  ansible.builtin.set_fact:
    _existing_vnets: >-
      {{ _existing_vnets
         | selectattr('vpc.id', 'defined')
         | selectattr('vpc.id', 'equalto', vnet_vpc_id | int)
         | list }}
  when: vnet_vpc_id is defined

- name: Filter V-Nets by tenant
  ansible.builtin.set_fact:
    _existing_vnets: >-
      {{ _existing_vnets
         | selectattr('tenant.id', 'defined')
         | selectattr('tenant.id', 'equalto', vnet_tenant_id | int)
         | list }}
  when: vnet_tenant_id is defined

- name: Keep same-name V-Net candidates when identity filtering found no match
  ansible.builtin.set_fact:
    _existing_vnets: "{{ _vnets_by_name }}"
  when:
    - _existing_vnets | length == 0
    - _vnets_by_name | length > 0

- name: Fail if the V-Net deletion identity is ambiguous
  ansible.builtin.assert:
    that:
      - _existing_vnets | length <= 1
    fail_msg: >-
      More than one Netris V-Net named '{{ vnet_name }}' matches the supplied
      VPC/tenant identity. Refusing to delete an ambiguous resource.

- name: Set the matching V-Net
  ansible.builtin.set_fact:
    _existing_vnet: "{{ _existing_vnets | first | default({}) }}"

- name: Validate existing V-Net summary has an ID
  ansible.builtin.assert:
    that:
      - _existing_vnet.id is defined
      - _existing_vnet.id is not none
      - _existing_vnet.id | string | length > 0
    fail_msg: >-
      Netris V-Net '{{ vnet_name }}' was found but its list response omitted
      the ID; refusing to delete without a stable provider identifier.
  when:
    - _existing_vnet is mapping
    - _existing_vnet | length > 0

- name: Detect V-Net ownership fields omitted from the list response
  ansible.builtin.set_fact:
    _vnet_delete_missing_fields: >-
      {{ _existing_vnet | netris.controller.netris_immutable_missing_fields(
           vnet_expected_fields
         ) }}
  when:
    - _existing_vnet is mapping
    - _existing_vnet | length > 0
    - vnet_expected_fields is defined

- name: Read V-Net details when the list response omits ownership fields
  ansible.builtin.include_role:
    name: netris.controller.vnet
    tasks_from: read_by_id
  vars:
    vnet_id: "{{ _existing_vnet.id }}"
  when: _vnet_delete_missing_fields | default([]) | length > 0

- name: Use detailed V-Net response for ownership comparison
  ansible.builtin.set_fact:
    _existing_vnet: "{{ netris_vnet_detail }}"
  when:
    - netris_vnet_detail is defined
    - _vnet_delete_missing_fields | default([]) | length > 0

- name: Verify V-Net ownership before deletion
  when:
    - _existing_vnet is mapping
    - _existing_vnet | length > 0
    - vnet_expected_fields is defined
  block:
    - name: Compare V-Net identity with the OSAC resource
      ansible.builtin.set_fact:
        _vnet_delete_mismatches: >-
          {{ _existing_vnet | netris.controller.netris_immutable_mismatch(
               vnet_expected_fields
             ) }}

    - name: Refuse to delete a V-Net with mismatched or unverifiable ownership
      ansible.builtin.fail:
        msg: >-
          {{ 'V-Net' | netris.controller.format_immutable_mismatch_message(
               vnet_name, _vnet_delete_mismatches) }}
      when: _vnet_delete_mismatches | length > 0

- name: Validate detailed V-Net response has an ID before deletion
  ansible.builtin.assert:
    that:
      - _existing_vnet.id is defined
      - _existing_vnet.id is not none
      - _existing_vnet.id | string | length > 0
    fail_msg: >-
      Netris V-Net '{{ vnet_name }}' details omitted the ID; refusing to delete
      without a stable provider identifier.
  when:
    - _existing_vnet is mapping
    - _existing_vnet | length > 0

- name: Delete V-Net
  when: _existing_vnet | length > 0
  netris.controller.protected_uri:
    url: "{{ netris_controller_url }}/api/v2/vnet/{{ _existing_vnet.id }}"
    method: DELETE
    headers:
      Cookie: "connect.sid={{ netris_session_cookie }}"
    # 404 means the V-Net was removed concurrently after the list lookup;
    # the deletion target is already absent, so treat it as deleted.
    status_code: [200, 204, 404]
    validate_certs: "{{ netris_validate_certs | default(true) }}"
    ca_path: "{{ netris_ca_path | default(omit, true) }}"
  register: _vnet_delete_resp
  no_log: true

- name: Report the concurrently removed V-Net
  ansible.builtin.debug:
    msg: >-
      A V-Net was already absent (HTTP 404) at deletion time; treating it
      as deleted.
  when: _vnet_delete_resp is defined and _vnet_delete_resp.status | default(0) == 404
