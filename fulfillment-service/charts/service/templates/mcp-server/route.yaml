{{- if .Values.mcp.enabled }}
{{- $hostname := include "fulfillment-mcp-server.hostname" . }}
{{- if eq .Values.variant "openshift" }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  namespace: {{ .Release.Namespace }}
  name: fulfillment-mcp-server
spec:
  host: {{ $hostname }}
  to:
    kind: Service
    name: fulfillment-mcp-server
  port:
    targetPort: mcp
  tls:
    termination: passthrough
{{- end }}
{{- if eq .Values.variant "kind" }}
apiVersion: gateway.networking.k8s.io/v1alpha3
kind: TLSRoute
metadata:
  namespace: {{ .Release.Namespace }}
  name: fulfillment-mcp-server
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    namespace: envoy-gateway
    name: default
    sectionName: tls
  hostnames:
  - {{ $hostname }}
  rules:
  - backendRefs:
    - name: fulfillment-mcp-server
      port: 8000
{{- end }}
{{- end }}
