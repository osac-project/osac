name: Component Hooks Smoke Tests

# Keep this workflow present on every PR and merge-queue run so a skipped test
# reports success instead of leaving a required check pending. The smoke test
# itself runs only when its component hooks/config or test inputs change.
on:
  pull_request:
    branches:
    - main
  merge_group:

permissions: {}

concurrency:
  group: component-hooks-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout the shared filter definition
      pull-requests: read  # read changed paths for pull requests
    outputs:
      hooks-changed: ${{ steps.filter.outputs.component-hooks-smoke }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: .github/filters/ci-filters.yml

  run-component-hooks-smoke:
    name: Run component hooks smoke tests
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout test inputs only
    steps:
      - name: Fail if path filter failed
        if: needs.changes.result != 'success'
        run: exit 1
      - id: should-run
        if: needs.changes.result == 'success' && needs.changes.outputs.hooks-changed == 'true'
        run: echo "run=true" >> "$GITHUB_OUTPUT"
      - if: steps.should-run.outputs.run
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - if: steps.should-run.outputs.run
        name: Run component hook smoke tests
        run: bash tools/test/component-hooks-smoke.sh
