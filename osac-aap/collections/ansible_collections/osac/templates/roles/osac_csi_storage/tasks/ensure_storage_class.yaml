---
# OSAC CSI driver ensure_storage_class: creates one StorageClass per tier with
# provisioner osac_csi_driver_name on the tenant cluster.
#
# Precondition: the CSI driver is already registered on the tenant cluster, that
# is, a CSIDriver object named osac_csi_driver_name exists. This task file does
# not install the driver, create a namespace or write any Secret. When the
# CSIDriver is absent it records the reason csi_driver_not_registered in the
# osac_storage_provider_failures stat and fails.
#
# This task file MUST only be called via _dispatch_provider.yaml when a CaaS
# admin_kubeconfig is present (_remote_kubeconfig defined).  It raises an explicit
# error when called in a hub-cluster (VMaaS) context because the OSAC CSI driver
# belongs on tenant clusters only — hub-side provisioning uses vendor-specific roles.
#
# Idempotent: re-applying updates mutable fields (for example allowVolumeExpansion).

- name: Assert _provider_tiers is defined and non-empty
  ansible.builtin.assert:
    that:
      - _provider_tiers is defined
      - _provider_tiers | length > 0
    fail_msg: _provider_tiers must be provided by the service role dispatcher.

- name: Fail when called without a guest-cluster kubeconfig (hub path unsupported)
  ansible.builtin.fail:
    msg: >-
      osac_csi_storage ensure_storage_class requires a guest-cluster admin_kubeconfig
      (_remote_kubeconfig must be set).  The OSAC CSI meta-driver is only deployed to
      CaaS tenant clusters, not to the hub cluster.  Remove the netapp, pure and osac-csi
      providers from the storage tiers for this Tenant if VMaaS-only storage is intended.
  when: _remote_kubeconfig is not defined or _remote_kubeconfig | length == 0

- name: Validate tenant_name is a valid DNS label
  ansible.builtin.fail:
    msg: "tenant_name '{{ tenant_name }}' is not a valid DNS label."
  when: tenant_name is not regex('^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$')

- name: Build expected StorageClass entries
  ansible.builtin.set_fact:
    _osac_csi_expected_sc_entries: >-
      {% set entries = [] -%}
      {% for tier in _provider_tiers -%}
      {% set _ = entries.append({'name': 'osac-' ~ tenant_name ~ '-' ~ tier.name, 'tier': tier.name, 'protocol': tier.protocol}) -%}
      {% endfor -%}
      {{ entries }}

- name: Look up the OSAC CSI driver registration on guest cluster
  kubernetes.core.k8s_info:
    kubeconfig: "{{ _remote_kubeconfig }}"
    validate_certs: "{{ false if (_remote_kubeconfig_insecure | default(false) | bool) else omit }}"
    api_version: storage.k8s.io/v1
    kind: CSIDriver
    name: "{{ osac_csi_driver_name }}"
  register: _osac_csi_driver_lookup

- name: Require the OSAC CSI driver to be registered
  block:
    - name: Fail if the CSIDriver object is absent
      ansible.builtin.fail:
        msg: >-
          CSI driver '{{ osac_csi_driver_name }}' is not registered on the target cluster.
          Install the OSAC CSI driver on the cluster before creating StorageClasses;
          this role does not install it.
      when: _osac_csi_driver_lookup.resources | default([]) | length == 0
  rescue:
    - name: Build structured failure artifact for unregistered CSI driver
      ansible.builtin.set_fact:
        osac_storage_provider_failures:
          - reason: csi_driver_not_registered
            tiers: "{{ _provider_tiers | map(attribute='name') | list }}"
            backend_ids: "{{ _provider_tiers | map(attribute='backend_id', default='') | map('string') | reject('equalto', '') | unique | list }}"
            message: "{{ ansible_failed_result.msg }}"

    - name: Emit structured failure artifact for unregistered CSI driver
      ansible.builtin.set_stats:
        data:
          osac_storage_provider_failures: "{{ osac_storage_provider_failures }}"
        aggregate: false

    - name: Re-raise the original unregistered-driver failure
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg }}"

- name: Create per-tier OSAC CSI StorageClasses on guest cluster
  kubernetes.core.k8s:
    kubeconfig: "{{ _remote_kubeconfig }}"
    validate_certs: "{{ false if (_remote_kubeconfig_insecure | default(false) | bool) else omit }}"
    state: present
    definition:
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: "{{ item.name }}"
        labels:
          app.kubernetes.io/managed-by: osac-aap
          osac.openshift.io/managed-by: osac-csi-driver
          osac.openshift.io/tenant: "{{ tenant_name }}"
          osac.openshift.io/storage-tier: "{{ item.tier }}"
          osac.openshift.io/storage-protocol: "{{ item.protocol }}"
      provisioner: "{{ osac_csi_driver_name }}"
      parameters:
        tier: "{{ item.tier }}"
        tenant: "{{ tenant_name }}"
        osac.openshift.io/tenant: "{{ tenant_name }}"
        osac.openshift.io/storage-tier: "{{ item.tier }}"
      reclaimPolicy: "{{ osac_csi_driver_reclaim_policy }}"
      volumeBindingMode: "{{ osac_csi_driver_volume_binding_mode }}"
      allowVolumeExpansion: false
  loop: "{{ _osac_csi_expected_sc_entries }}"
  loop_control:
    label: "{{ item.name }}"

- name: Set StorageClass names output
  ansible.builtin.set_fact:
    storage_provider_storage_class_names: "{{ _osac_csi_expected_sc_entries }}"
