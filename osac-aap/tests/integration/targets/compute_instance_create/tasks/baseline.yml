---
- name: Compute Instance Create - Baseline Test
  hosts: localhost
  gather_facts: true
  vars_files:
    - ../../../common_vars.yml

  tasks:
    - name: Read ComputeInstance fixture
      ansible.builtin.set_fact:
        test_compute_instance: "{{ lookup('file', '../../../fixtures/computeinstance-test.yaml') | from_yaml }}"

    - name: Set test variables for baseline workflow
      ansible.builtin.set_fact:
        osac_job_vars:
          resource: "{{ test_compute_instance }}"
        tenant_storage_class_storage_classes:
          - name: "test-storage-class"
            tier: "local"
        # Override only resource creation to prevent actual VM/DataVolume creation
        create_step_resources_override:
          name: osac.workflows.workflow_helpers
          tasks_from: noop.yml
        # Override wait/annotate since there's no VM to wait for
        create_step_wait_annotate_override:
          name: osac.workflows.workflow_helpers
          tasks_from: noop.yml

- name: Import compute instance create workflow (baseline)
  ansible.builtin.import_playbook: osac.workflows.compute_instance.create

- name: Verify baseline results
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../../common_vars.yml

  tasks:
    - name: Verify compute instance name extracted
      ansible.builtin.assert:
        that:
          - compute_instance_name is defined
          - compute_instance_name == "test-vm"
        fail_msg: "Compute instance name not extracted correctly"

    - name: Verify subnet target namespace supplied
      ansible.builtin.assert:
        that:
          - test_compute_instance.metadata.annotations['osac.openshift.io/subnet-target-namespace'] == 'test-subnet'
          - compute_instance_target_namespace == 'test-subnet'
        fail_msg: "Subnet target namespace not set correctly"

    - name: Exercise namespaced resource creation in the resolved subnet namespace
      block:
        - name: Create a test ConfigMap in the VM target namespace
          kubernetes.core.k8s:
            kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
            state: present
            definition:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: test-vm-placement
                namespace: "{{ compute_instance_target_namespace }}"

        - name: Read the test ConfigMap from the VM target namespace
          kubernetes.core.k8s_info:
            kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
            api_version: v1
            kind: ConfigMap
            name: test-vm-placement
            namespace: "{{ compute_instance_target_namespace }}"
          register: placement_configmap

        - name: Verify resource placement
          ansible.builtin.assert:
            that:
              - placement_configmap.resources | length == 1
              - placement_configmap.resources[0].metadata.namespace == 'test-subnet'
      always:
        - name: Remove the test ConfigMap
          kubernetes.core.k8s:
            kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
            state: absent
            api_version: v1
            kind: ConfigMap
            name: test-vm-placement
            namespace: "{{ compute_instance_target_namespace }}"

    - name: Verify template ID extracted
      ansible.builtin.assert:
        that:
          - template_id is defined
          - template_id == "osac.templates.ocp_virt_vm"
        fail_msg: "Template ID not extracted correctly"

    - name: Verify user-specified spec values override template defaults
      ansible.builtin.assert:
        that:
          - vm_memory == "4Gi"
          - vm_boot_disk_size == "20Gi"
        fail_msg: "User spec values should override template defaults."
