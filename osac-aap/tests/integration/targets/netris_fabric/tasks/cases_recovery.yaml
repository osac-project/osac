- name: EIP recovery - the rule is gone and the rerun wrote nothing
  ansible.builtin.assert:
    that:
      - nf_state.nats | selectattr('name', 'equalto', 'osac-eipa-' ~ nf_ids.eipa) | list == []
      - nf_writes == []
    quiet: true

- name: EIP recovery - the SNAT delete commits but the response is lost
  ansible.builtin.include_tasks: admin.yaml
  vars:
    nf_steps:
      - {path: faults, body: {key: "DELETE /api/v2/nat/*", mode: commit_then_drop}}

- name: EIP recovery - delete_nat_gateway fails retryably
  ansible.builtin.include_tasks: run_task.yaml
  vars:
    nf_task: delete_nat_gateway
    sft_label: eiprec-natgw-delete-lost-response
    sft_expect: retryable
    nf_job: "{{ nf_natgw_job }}"

- name: EIP recovery - the rerun finds the rule gone
  ansible.builtin.include_tasks: run_task.yaml
  vars:
    nf_task: delete_nat_gateway
    sft_label: eiprec-natgw-delete-rerun
    sft_expect: success
    nf_job: "{{ nf_natgw_job }}"
    nf_result: {}

- name: EIP recovery - the reservation release commits but the response is lost
  ansible.builtin.include_tasks: admin.yaml
  vars:
    nf_steps:
      - {path: faults, body: {key: "DELETE /api/v2/ipam/subnet/*", mode: commit_then_drop}}

- name: EIP recovery - delete_external_ip fails retryably
  ansible.builtin.include_tasks: run_task.yaml
  vars:
    nf_task: delete_external_ip
    sft_label: eiprec-eip-delete-lost-response
    sft_expect: retryable
    nf_job: "{{ nf_eip_job }}"

- name: EIP recovery - the rerun finds the reservation gone
  ansible.builtin.include_tasks: run_task.yaml
  vars:
    nf_task: delete_external_ip
    sft_label: eiprec-eip-delete-rerun
    sft_expect: success
    nf_job: "{{ nf_eip_job }}"
    nf_result: {}

- name: EIP recovery - the reservation is gone and the rerun wrote nothing
  ansible.builtin.assert:
    that:
      - nf_state.ipam_subnets == []
      - nf_writes == []
    quiet: true
