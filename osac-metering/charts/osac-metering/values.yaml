image:
  repository: ghcr.io/osac-project/metering-service
  tag: latest
  pullPolicy: Always

# Fulfillment address is auto-derived from release namespace.
# Override fulfillment.address for cross-namespace/cross-cluster (OSAC-3537).

database:
  connection: []

heartbeat:
  interval: "60s"

reconciliation:
  interval: "60m"

certs:
  caBundle:
    configMap: ca-bundle

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

## Echo adapter — test/development tool only, not for production use.
## Enable and configure via environment-specific values (e.g., values/vmaas-ci/values.yaml).
echoAdapter:
  enabled: false
  # image:
  #   repository: ghcr.io/osac-project/metering-echo-adapter
  #   tag: latest
  #   pullPolicy: Always

## M360 adapter — forwards metering events to Monetize360 Usage API.
m360Adapter:
  enabled: false
  image:
    repository: ghcr.io/osac-project/metering-m360-adapter
    tag: latest
    pullPolicy: Always
  m360:
    apiUrl: ""
    apiKeySecret: ""     # name of K8s Secret with key "api-key"
    apiVersion: "v1"
  output:
    protocol: "rest"       # "rest" or "kafka"
    kafka:
      brokers: ""          # M360 Kafka bootstrap servers (required when protocol=kafka)
      tls:
        enabled: true
        caCertSecret: ""   # K8s Secret name with key "ca.crt"
      sasl:
        username: ""
        passwordSecret: "" # K8s Secret name with key "password"
      topics:
        vmaas: "m360.metering.vmaas"
        caas: "m360.metering.caas"
        maas: "m360.metering.maas"
