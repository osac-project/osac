---
# SecurityGroup maps to Netris ACL rules (v1 API)
# Creates permit ACL rules for each ingress and egress rule in the SecurityGroup CR.
# ACL rules are created per-subnet in the VN — each subnet maps to a Netris network
# segment, and Netris ACL rules must use subnet CIDRs (not the wider VN CIDR).
#
# Idempotency (OSAC-4923): create is get-or-create by ACL name (controller skip).
# Stale-rule prune / desired-state reconcile when ingress/egress change is
# OSAC-4888 (out of scope). Attached-subnet scoping is OSAC-4925.
#
# Contract path: the snapshot is validated against the contract rule mapping.
# Netris v1 ACLs are flat, VPC-scoped prefix rules that need the Subnet CIDR
# they protect, and there is no subnet-less, per-group policy object to create
# here. The Fabric SecurityGroup task is therefore a documented no-op (contract
# 4.10) until a Subnet binding supplies the CIDR. The legacy path keeps
# creating per-subnet ACL rules for today's dispatch.

- name: Normalize task input
  ansible.builtin.include_tasks: _contract_input.yaml
  vars:
    _osac_task_name: create_security_group

- name: Extract SecurityGroup configuration
  ansible.builtin.set_fact:
    sg_name: "{{ security_group.metadata.name }}"
    sg_virtual_network: "{{ security_group.spec.virtualNetwork | default('') }}"
    ingress_rules: "{{ security_group.spec.ingressRules | default([]) }}"
    egress_rules: "{{ security_group.spec.egressRules | default([]) }}"

- name: Apply the SecurityGroup rules from the contract snapshot
  when: _osac_contract | default(false) | bool
  block:
    - name: Require the SecurityGroup snapshot identity
      ansible.builtin.assert:
        that:
          - _osac_resource.id | default('') | length > 0
          - sg_name | default('') | length > 0
        fail_msg: >-
          A SecurityGroup create needs the SecurityGroup API ID and name in
          the resource snapshot.

    - name: Plan the ACL rules with the contract mapping
      ansible.builtin.set_fact:
        _sg_plan: >-
          {{ security_group.spec
             | osac.templates.security_group_plan(_osac_resource.id | default('')) }}

    - name: Reject a rule Netris cannot enforce exactly
      ansible.builtin.assert:
        that:
          - _sg_plan.error | default('') | length == 0
        fail_msg: >-
          SecurityGroup '{{ sg_name }}' cannot be enforced exactly:
          {{ _sg_plan.error | default('unknown rule error') }}

    - name: Report the documented Fabric SecurityGroup no-op
      ansible.builtin.debug:
        msg:
          - >-
            SecurityGroup '{{ sg_name }}' rules validated:
            {{ _sg_plan.ingress | length }} ingress,
            {{ _sg_plan.egress | length }} egress.
          - >-
            Netris v1 ACLs are flat VPC prefix rules and need the Subnet CIDR
            they protect, so this task creates no policy object before a
            Subnet binding. Contract 4.10 permits this documented no-op.
  rescue:
    - name: Publish the sanitized SecurityGroup error
      ansible.builtin.include_tasks: _fail_task.yaml
      vars:
        _osac_error_message: >-
          {{ _sg_plan.error | default('SecurityGroup snapshot has no usable rules') }}
        _osac_error_retryable: false

    - name: Fail the SecurityGroup task after publishing the error
      ansible.builtin.fail:
        msg: "{{ _osac_error_message }}"

- name: Create Netris ACL rules from the legacy CR input
  when: not _osac_contract | default(false) | bool
  block:
    - name: Display SecurityGroup information
      ansible.builtin.debug:
        msg:
          - "Creating Netris ACL rules for SecurityGroup '{{ sg_name }}'"
          - "VirtualNetwork: {{ sg_virtual_network }}"
          - "Ingress rules count: {{ ingress_rules | length }}"
          - "Egress rules count: {{ egress_rules | length }}"

    - name: Resolve VirtualNetwork UUID to VPC ID and discover subnets
      when: sg_virtual_network | length > 0
      block:
        - name: Look up VirtualNetwork CR by UUID label
          kubernetes.core.k8s_info:
            api_version: osac.openshift.io/v1alpha1
            kind: VirtualNetwork
            namespace: "{{ security_group.metadata.namespace }}"
            label_selectors:
              - "osac.openshift.io/virtualnetwork-uuid={{ sg_virtual_network }}"
          register: _sg_vn_lookup

        - name: Look up VPC for VirtualNetwork
          ansible.builtin.include_role:
            name: netris.controller.vpc
            tasks_from: read
          vars:
            vpc_name: "{{ _sg_vn_lookup.resources[0].metadata.name }}"
          when: _sg_vn_lookup.resources | length > 0

        - name: Set VPC ID
          ansible.builtin.set_fact:
            _sg_vpc_id: "{{ (netris_vpc.id | default(1)) }}"
          when: _sg_vn_lookup.resources | length > 0

        - name: Look up all Subnets in this VirtualNetwork
          kubernetes.core.k8s_info:
            api_version: osac.openshift.io/v1alpha1
            kind: Subnet
            namespace: "{{ security_group.metadata.namespace }}"
          register: _sg_all_subnets
          when: _sg_vn_lookup.resources | length > 0

        - name: Filter subnets belonging to this VirtualNetwork
          ansible.builtin.set_fact:
            _sg_subnet_cidrs: >-
              {{ _sg_all_subnets.resources | default([])
                 | selectattr('spec.virtualNetwork', 'defined')
                 | selectattr('spec.virtualNetwork', 'equalto', sg_virtual_network)
                 | map(attribute='spec.ipv4Cidr')
                 | select('defined')
                 | reject('equalto', '')
                 | list }}
          when: _sg_vn_lookup.resources | length > 0

    - name: Default VPC ID and subnet CIDRs if not resolved
      ansible.builtin.set_fact:
        _sg_vpc_id: "{{ _sg_vpc_id | default(1) }}"
        _sg_subnet_cidrs: "{{ _sg_subnet_cidrs | default(['0.0.0.0/0']) }}"

    - name: Display resolved subnet CIDRs
      ansible.builtin.debug:
        msg: "ACL rules will be created for subnet CIDRs: {{ _sg_subnet_cidrs }}"

    - name: Validate SecurityGroup rule CIDRs
      ansible.builtin.include_role:
        name: osac.templates.security_group_validation
        tasks_from: validate_cidrs

    - name: Create ACL rules for ingress (per subnet)
      ansible.builtin.include_role:
        name: netris.controller.acl
        tasks_from: create
      vars:
        subnet_idx: "{{ _sg_subnet_cidrs.index(item.1) }}"
        acl_name: "{{ sg_name }}-ingress-{{ idx }}-{{ subnet_idx }}"
        acl_action: permit
        acl_proto: "{{ item.0.protocol }}"
        acl_vpc_id: "{{ _sg_vpc_id }}"
        acl_src_prefix: "{{ item.0.sourceCidr }}"
        acl_dst_prefix: "{{ item.1 }}"
        acl_dst_port_from: "{{ item.0.portFrom | default(none) }}"
        acl_dst_port_to: "{{ item.0.portTo | default(item.0.portFrom) | default(none) }}"
        acl_comment: "OSAC SG {{ sg_name }} ingress rule {{ idx }} subnet {{ subnet_idx }}"
      loop: "{{ ingress_rules | product(_sg_subnet_cidrs) | list }}"
      loop_control:
        index_var: idx
        label: "{{ item.0.protocol | default('all') }}:{{ item.1 }}"
      when: ingress_rules | length > 0

    - name: Create ACL rules for egress (per subnet)
      ansible.builtin.include_role:
        name: netris.controller.acl
        tasks_from: create
      vars:
        subnet_idx: "{{ _sg_subnet_cidrs.index(item.1) }}"
        acl_name: "{{ sg_name }}-egress-{{ idx }}-{{ subnet_idx }}"
        acl_action: permit
        acl_proto: "{{ item.0.protocol }}"
        acl_vpc_id: "{{ _sg_vpc_id }}"
        acl_src_prefix: "{{ item.1 }}"
        acl_dst_prefix: "{{ item.0.destinationCidr }}"
        acl_dst_port_from: "{{ item.0.portFrom | default(none) }}"
        acl_dst_port_to: "{{ item.0.portTo | default(item.0.portFrom) | default(none) }}"
        acl_comment: "OSAC SG {{ sg_name }} egress rule {{ idx }} subnet {{ subnet_idx }}"
      loop: "{{ egress_rules | product(_sg_subnet_cidrs) | list }}"
      loop_control:
        index_var: idx
        label: "{{ item.0.protocol | default('all') }}:{{ item.1 }}"
      when: egress_rules | length > 0

    - name: Display SecurityGroup creation result
      ansible.builtin.debug:
        msg: >-
          ACL rules created for SecurityGroup '{{ sg_name }}':
          {{ ingress_rules | length }} ingress × {{ _sg_subnet_cidrs | length }} subnets,
          {{ egress_rules | length }} egress × {{ _sg_subnet_cidrs | length }} subnets
