syntax = "proto3";

package osac.public.v1;

import "buf/validate/validate.proto";
import "osac/public/v1/metadata_type.proto";

// An add-on operator represents a platform-supported OLM operator that can be installed on CaaS clusters. The resource
// stores metadata for validation and display; OLM subscription details remain in the Ansible role.
//
// buf:lint:ignore OSAC_OBJECT_SHAPE
message AddOnOperator {
  // Unique identifier of the add-on operator.
  string id = 1;

  Metadata metadata = 2;

  // Human friendly short description of the add-on operator, suitable for displaying in one single line on a UI or CLI.
  string title = 3 [(buf.validate.field).string.min_len = 1];

  // Human friendly long description of the add-on operator, using Markdown format.
  string description = 4;

  // Minimum supported OpenShift version (inclusive semver). Empty means no minimum.
  string min_ocp_version = 5;

  // Maximum supported OpenShift version (inclusive semver). Empty means no maximum.
  string max_ocp_version = 6;

  // Other add-on operators that are mutually exclusive with this one. Bidirectional: if A excludes B, ordering a
  // cluster with both A and B is rejected at order time.
  repeated AddOnOperatorLocalReference exclusions = 7;

  // Other add-on operators that this one depends on. Dependencies are auto-included in the resolved operator set at
  // order time.
  repeated AddOnOperatorLocalReference dependencies = 8;

  // Whether this add-on operator is visible through the public API. Defaults to false; the Cloud Provider Admin
  // publishes operators explicitly after review.
  bool published = 9;
}

// Standard reference to an AddOnOperator resource (used by ClusterCatalogItem and ClusterSpec).
message AddOnOperatorReference {
  string id = 1;
  string name = 2;
  string project = 3;
  bool shared = 4;
}

// Local reference to an AddOnOperator (used within the AddOnOperator message for exclusions and dependencies).
message AddOnOperatorLocalReference {
  string id = 1;
  string name = 2;
}
