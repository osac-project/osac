        - name: Run create_build_spec to build VM template spec
          ansible.builtin.include_role:
            name: osac.templates.ocp_virt_vm
            tasks_from: create_build_spec.yaml

        - name: Verify exactly three hostDevices entries
          ansible.builtin.assert:
            that:
              - vm_template_spec.domain.devices.hostDevices is defined
              - vm_template_spec.domain.devices.hostDevices | length == 3
            fail_msg: >-
              Expected 3 hostDevices entries, got
              {{ vm_template_spec.domain.devices.hostDevices | default([]) | length }}

        - name: Verify hostDevices entries have sequential names and correct deviceName
          ansible.builtin.assert:
            that:
              - vm_template_spec.domain.devices.hostDevices[0].name == 'gpu-0'
              - vm_template_spec.domain.devices.hostDevices[1].name == 'gpu-1'
              - vm_template_spec.domain.devices.hostDevices[2].name == 'gpu-2'
              - vm_template_spec.domain.devices.hostDevices[0].deviceName == 'nvidia.com/GB100'
              - vm_template_spec.domain.devices.hostDevices[1].deviceName == 'nvidia.com/GB100'
              - vm_template_spec.domain.devices.hostDevices[2].deviceName == 'nvidia.com/GB100'
            fail_msg: >-
              hostDevices entries incorrect: {{ vm_template_spec.domain.devices.hostDevices }}

