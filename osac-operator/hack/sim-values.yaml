# Minimal values for the sim integration test environment.
# Deploys fulfillment-service + bundled Postgres + self-signed CA on kind.
# Usage: helm install osac ../../osac-installer/charts/osac/ -n osac --create-namespace -f hack/sim-values.yaml

# --- Self-signed CA (cert-manager + trust-manager installed separately by sim-up.sh) ---
ca:
  selfSigned:
    enabled: true

# --- Fulfillment Service ---
kafka:
  enabled: false

service:
  variant: kind
  externalHostname: fulfillment-api.osac.svc.cluster.local
  internalHostname: fulfillment-internal-api.osac.svc.cluster.local
  images:
    # The sim script supplies a unique image built from the current checkout.
    pullPolicy: IfNotPresent
  eventPublisher:
    enabled: false
  certs:
    issuerRef:
      kind: ClusterIssuer
      name: default-ca
    caBundle:
      configMap: ca-bundle
  auth:
    issuerUrl: https://keycloak.keycloak.svc.cluster.local/realms/osac
    controllerCredentials:
      - secret:
          name: fulfillment-controller-credentials
          items:
            - key: client-id
              param: client-id
            - key: client-secret
              param: client-secret
    emergencyServiceAccounts:
      - admin
      - osac-operator
      - osac-operator-controller-manager
  database:
    connection:
      - secret:
          name: osac-db-config
          items:
            - key: url
              param: url
      - secret:
          name: osac-db-client-cert
          items:
            - key: tls.crt
              param: sslcert
            - key: tls.key
              param: sslkey
            - key: ca.crt
              param: sslrootcert
  vault:
    # The sim API path does not exercise fulfillment-service Vault integration.
    endpoint: ""
  idp:
    provider: keycloak
    url: https://keycloak.keycloak.svc.cluster.local
    credentials:
      - secret:
          name: fulfillment-controller-credentials
          items:
            - key: client-id
              param: client-id
            - key: client-secret
              param: client-secret
  log:
    level: debug

# --- Operator ---
# The worker reconciler is invoked in-process by the connected test suite.
# Do not deploy an operator image or enable its ClusterOrder provisioning controller.
operator:
  enabled: false
  fulfillment:
    serverAddress: "fulfillment-internal-api:8001"
    tokenFile: "/var/run/secrets/kubernetes.io/serviceaccount/token"
  networkManagers:
    # Keep umbrella chart networking validation satisfied; operator.enabled stays false.
    enabled: true
  controllers:
    clusterOrder: false
    computeInstance: false
    tenant: false
    networking: false
    bareMetalInstance: false
    storage: false

# --- Disabled components ---
aap:
  apiToken:
    create: false
  aap:
    instance:
      enabled: false
  bootstrap:
    enabled: false
  instanceGroups:
    publishTemplates:
      enabled: false

bmf:
  # Keep the service's BMaaS API enabled while preventing a BMF controller pod.
  replicaCount: 0

ui:
  enabled: false

metering:
  enabled: false

csiDriver:
  enabled: false

validation:
  enabled: false

# Registers this Kind cluster as the fulfillment hub using an in-cluster API
# endpoint and the least-privilege hub-access service account.
hubAccess:
  enabled: true

metallb:
  enabled: false

capiProvider:
  enabled: false

clusterFulfillment:
  enabled: false

networkFulfillment:
  enabled: false

storageFulfillment:
  enabled: false
