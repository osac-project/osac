syntax = "proto3";

package osac.public.v1;

import "buf/validate/validate.proto";
import "osac/public/v1/metadata_type.proto";

// Represents a secret containing typed or opaque key-value data.
//
// Secrets store sensitive information such as TLS certificates, pull secrets, and credentials. Each secret holds a map
// of named binary values. Typed secrets require a particular key to be present, but do not validate the content of the
// value. Opaque secrets have no required keys.
//
// Secrets are scoped to a tenant and can be referenced by other resources that require sensitive configuration data.
//
// buf:lint:ignore OSAC_OBJECT_SHAPE
message Secret {
  // Unique identifier of the secret.
  string id = 1;

  // Metadata of the secret.
  Metadata metadata = 2;

  // Opaque key-value data. Each key identifies a named entry (for example, `crt` or `key`) and the
  // corresponding value is the raw secret material. Populated in Get responses; omitted from List and
  // mutating responses.
  map<string, bytes> data = 3 [(buf.validate.field).map = {
    keys: {
      string: {
        min_len: 1
      }
    }
  }];

  // Type of data stored in the secret. Opaque secrets have no required data keys. Pull secrets require a
  // `.dockerconfigjson` key, kubeconfig secrets require a `kubeconfig` key, user data secrets require a `userdata` key,
  // and value secrets require a `value` key. Secret contents are not parsed or otherwise validated.
  SecretType type = 6 [(buf.validate.field).enum.defined_only = true];
}

// The type of data stored in a secret.
enum SecretType {
  // The secret type is not specified. The service treats an unspecified type as opaque when creating a secret.
  SECRET_TYPE_UNSPECIFIED = 0;

  // A Kubernetes-compatible container registry pull secret. Requires a `.dockerconfigjson` data key.
  SECRET_TYPE_PULL_SECRET = 1;

  // A Kubernetes client configuration. Requires a `kubeconfig` data key.
  SECRET_TYPE_KUBECONFIG = 2;

  // Cloud-init or other instance user data. Requires a `userdata` data key.
  SECRET_TYPE_USER_DATA = 3;

  // An opaque secret with no required data keys.
  SECRET_TYPE_OPAQUE = 4;

  // A single scalar value. Requires a `value` data key.
  SECRET_TYPE_VALUE = 5;
}

// Local reference to a Secret resource.
message SecretLocalReference {
  string id = 1;
  string name = 2;
}
