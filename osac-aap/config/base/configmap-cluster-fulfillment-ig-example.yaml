apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-fulfillment-ig
data:
  # -- External access --
  EXTERNAL_ACCESS_BASE_DOMAIN: "box.massopen.cloud"
  EXTERNAL_ACCESS_SUPPORTED_BASE_DOMAINS: "box.massopen.cloud"
  EXTERNAL_ACCESS_API_INTERNAL_NETWORK: "hypershift"

  # -- DNS readiness checks --
  # Recursive DNS resolver queried directly by the external_access DNS waits.
  # When set, waits query this resolver (dig @<DNS_SERVER>) instead of the zone
  # authoritative nameserver, so restricted environments that cannot reach the
  # authoritative server over port 53 can still verify records. Empty uses the
  # system resolver.
  DNS_SERVER: ""
  # Opt in to direct authoritative-nameserver DNS waits (bypasses resolver
  # negative cache). Ignored when DNS_SERVER is set.
  EXTERNAL_ACCESS_DNS_WAIT_USE_AUTHORITATIVE: "false"

  # -- Hosted cluster --
  HOSTED_CLUSTER_BASE_DOMAIN: "box.massopen.cloud"
  HOSTED_CLUSTER_CONTROLLER_AVAILABILITY_POLICY: "HighlyAvailable"
  HOSTED_CLUSTER_INFRASTRUCTURE_AVAILABILITY_POLICY: "HighlyAvailable"

  # -- Management network routing --
  SERVER_MGMT_ROUTE_DESTINATION: "10.8.0.0/30"
  SERVER_MGMT_ROUTE_GATEWAY: "192.168.16.1"

  # -- SSH bastion (non-secret parts) --
  SERVER_SSH_BASTION_HOST: "redhat-ctl.netris.io"
  SERVER_SSH_BASTION_USER: "ubuntu"
  SERVER_SSH_USER: "core"
