---
name: auto-queue

# Prow labels still required (label-gate). The Prow `lgtm` label is the
# authoritative approval signal for queue eligibility, so a stale human GitHub
# "Request changes" review does not block after LGTM. Bot Request changes
# (CodeRabbit, etc.) are dismissed and do not block.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, labeled, unlabeled]
    branches: [main]
  pull_request_review:
    types: [submitted]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  enable-auto-merge:
    if: github.repository == 'osac-project/osac' && (github.event_name == 'pull_request_target' || github.event_name == 'pull_request_review')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Remove lgtm on new push
        if: github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if gh pr view "$PR" --repo "$REPO" --json labels --jq '[.labels[].name]' | jq -e 'index("lgtm")' > /dev/null; then
            echo "Removing lgtm label from PR #$PR after new push"
            gh pr edit "$PR" --repo "$REPO" --remove-label lgtm
          fi

      - name: Dismiss bot changes-requested reviews
        env:
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "MERGE_QUEUE_TOKEN unavailable; skip bot review dismiss."
            exit 0
          fi
          reviews=$(gh api --paginate --slurp "repos/${REPO}/pulls/${PR}/reviews" | jq 'add // []')
          while read -r review_id; do
            [[ -z "${review_id}" ]] && continue
            echo "Dismissing bot review ${review_id} on PR #${PR}"
            gh api "repos/${REPO}/pulls/${PR}/reviews/${review_id}/dismissals" \
              -X PUT -f message="Auto-dismissed: bot Request changes do not block merge"
          done < <(jq -r '
            .[]
            | select(.state == "CHANGES_REQUESTED")
            | select(.user != null)
            | select(((.user.login // "") | endswith("[bot]")) or ((.user.type // "") == "Bot"))
            | .id
          ' <<<"${reviews}")

      - name: Check repo collaborator
        id: org-check
        env:
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          DRAFT: ${{ github.event.pull_request.draft }}
          REPO: ${{ github.repository }}
        run: |
          echo "author=$AUTHOR"
          echo "draft=$DRAFT"
          if gh api "repos/${REPO}/collaborators/${AUTHOR}"; then
            echo "org_member=true"
            echo "org_member=true" >> "$GITHUB_OUTPUT"
          else
            echo "org_member=false"
            echo "org_member=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check merge blockers
        if: steps.org-check.outputs.org_member == 'true'
        id: label-check
        env:
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          blocked=false
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "MERGE_QUEUE_TOKEN unavailable; cannot evaluate human reviews. Treating as blocked."
            blocked=true
          else
            # Read live labels because Prow can apply lgtm/approved/jira-valid-reference
            # as separate events. See OSAC-5507.
            if ! LABELS=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '[.labels[].name]'); then
              echo "Unable to evaluate live labels; treating PR as blocked."
              echo "blocked=true" >> "$GITHUB_OUTPUT"
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "labels=$LABELS"
            for label in "do-not-merge/hold" "do-not-merge/work-in-progress" "do-not-merge/invalid-owners-file" "needs-rebase"; do
              if echo "$LABELS" | jq -e "index(\"$label\")" > /dev/null; then
                echo "Blocking label found: $label"
                blocked=true
              fi
            done

            if echo "$LABELS" | jq -e 'index("lgtm")' > /dev/null; then
              # Prow's lgtm plugin applies this label only for its configured
              # OWNERS-based approval, so it is the trusted approval signal.
              echo "lgtm label present; ignoring stale human CHANGES_REQUESTED reviews"
            else
              reviews=$(gh api --paginate --slurp "repos/${REPO}/pulls/${PR}/reviews" | jq 'add // []')
              set +e
              jq -e '
                [.[]
                  | select(.user != null)
                  | select(((.user.login // "") | endswith("[bot]")) | not)
                  | select((.user.type // "User") != "Bot")
                  | select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")
                ]
                | group_by(.user.login)
                | map(max_by([(.submitted_at // ""), (.id // 0)]))
                | map(select(.state == "CHANGES_REQUESTED"))
                | length > 0
              ' <<<"${reviews}" >/dev/null
              rc=$?
              set -e
              if [[ ${rc} -eq 0 ]]; then
                echo "Human CHANGES_REQUESTED still outstanding"
                blocked=true
              elif [[ ${rc} -ne 1 ]]; then
                echo "Cannot evaluate human review state (jq rc=${rc}); treating as blocked."
                blocked=true
              fi
            fi
          fi
          eligible=true
          for label in lgtm approved jira/valid-reference; do
            if ! echo "$LABELS" | jq -e "index(\"$label\")" > /dev/null; then
              echo "Missing required merge label: $label"
              eligible=false
            fi
          done
          echo "blocked=$blocked"
          echo "blocked=$blocked" >> "$GITHUB_OUTPUT"
          echo "eligible=$eligible"
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: >-
          github.event.pull_request.draft == false
          && steps.org-check.outputs.org_member == 'true'
          && steps.label-check.outputs.blocked == 'false'
          && steps.label-check.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        # No explicit strategy: the merge_queue ruleset on main already fixes
        # the method (SQUASH). Passing --rebase here fails outright once a PR
        # already has auto-merge enabled ("the merge strategy for main is set
        # by the merge queue") -- harmless on first enable, but breaks the
        # re-enable path used by requeue-eligible-prs below.
        run: gh pr merge "$PR" --repo "$REPO" --auto

      - name: Disable auto-merge
        if: >-
          always()
          &&
          steps.org-check.outputs.org_member == 'true'
          && (
            steps.label-check.outcome != 'success' ||
            steps.label-check.outputs.blocked != 'false' ||
            steps.label-check.outputs.eligible != 'true'
          )
        env:
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr merge "$PR" --repo "$REPO" --disable-auto

  requeue-eligible-prs:
    if: github.repository == 'osac-project/osac' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # A PR can have auto-merge enabled and be fully green (mergeStateStatus
      # CLEAN) yet never actually be sitting in the merge queue: GitHub only
      # enqueues on specific triggers (new commit, review, label, or the
      # enable-auto-merge call above), not on a passive change to *why* the
      # PR became mergeable -- e.g. a branch-protection/ruleset update that
      # drops a stale required check. Reconcile both cases in one step so the
      # label/blocker predicate stays shared and consistent.
      - name: Reconcile scheduled merge-queue maintenance
        env:
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "MERGE_QUEUE_TOKEN missing"
            exit 1
          fi
          required_labels_jq='([.labels[].name] | contains(["lgtm","approved","jira/valid-reference"])) and ([.labels[].name] | any(. == "do-not-merge/hold" or . == "do-not-merge/work-in-progress" or . == "do-not-merge/invalid-owners-file" or . == "needs-rebase") | not)'
          is_requeue_eligible() {
            jq -e ".isDraft == false and .autoMergeRequest == null and ${required_labels_jq}"
          }
          is_enqueue_eligible() {
            jq -e ".isDraft == false and .autoMergeRequest != null and .mergeable == \"MERGEABLE\" and .mergeStateStatus == \"CLEAN\" and ${required_labels_jq}"
          }

          echo "Scanning eligible PRs without auto-merge..."
          candidates=$(gh pr list --repo "${REPO}" --state open --limit 200 \
            --json number,isDraft,autoMergeRequest,labels)
          prs=$(jq -c '.[]' <<<"${candidates}" | while read -r candidate; do
            if is_requeue_eligible <<<"${candidate}" >/dev/null; then
              jq -r '.number' <<<"${candidate}"
            fi
          done | jq -Rsc 'split("\n") | map(select(length > 0) | tonumber)')
          echo "Eligible PRs without auto-merge: $prs"
          for pr in $(echo "$prs" | jq -r '.[]'); do
            reviews=$(gh api --paginate --slurp "repos/${REPO}/pulls/${pr}/reviews" | jq 'add // []')
            while read -r review_id; do
              [[ -z "${review_id}" ]] && continue
              echo "Dismissing bot review ${review_id} on PR #${pr}"
              gh api "repos/${REPO}/pulls/${pr}/reviews/${review_id}/dismissals" \
                -X PUT -f message="Auto-dismissed: bot Request changes do not block merge"
            done < <(jq -r '
              .[]
              | select(.state == "CHANGES_REQUESTED")
              | select(.user != null)
              | select(((.user.login // "") | endswith("[bot]")) or ((.user.type // "") == "Bot"))
              | .id
            ' <<<"${reviews}")

            # Re-read labels and HEAD immediately before mutation because the
            # bulk candidate list may be stale after a new push (OSAC-5507).
            if ! current=$(gh pr view "$pr" --repo "${REPO}" \
              --json headRefOid,isDraft,autoMergeRequest,labels); then
              echo "Unable to refresh PR #${pr}, skipping this run"
              continue
            fi
            if ! is_requeue_eligible <<<"${current}" >/dev/null; then
              echo "PR #${pr} is no longer eligible, skipping"
              continue
            fi
            head=$(jq -r '.headRefOid' <<<"${current}")
            echo "Re-enabling auto-merge on PR #$pr at ${head}"
            gh pr merge "$pr" --repo "${REPO}" --auto --match-head-commit "$head"
          done

          echo "Scanning CLEAN PRs with auto-merge already enabled..."
          # mergeStateStatus alone is not enough: required_approving_review_count
          # is 0 on this repo's pull_request ruleset rule, so CLEAN says nothing
          # about outstanding human review state or do-not-merge/* labels.
          candidates=$(gh pr list --repo "${REPO}" --state open --limit 200 \
            --json number,isDraft,mergeable,mergeStateStatus,autoMergeRequest,labels)
          prs=$(jq -c '.[]' <<<"${candidates}" | while read -r candidate; do
            if is_enqueue_eligible <<<"${candidate}" >/dev/null; then
              jq -c '{number, id}' <<<"${candidate}"
            fi
          done | jq -sc '.')
          echo "CLEAN with auto-merge already on: $(echo "$prs" | jq -c '[.[].number]')"
          echo "$prs" | jq -c '.[]' | while read -r pr; do
            number=$(jq -r '.number' <<<"$pr")

            # Re-read labels, merge state, and HEAD immediately before
            # enqueueing because the bulk candidate list may be stale after a
            # new push (OSAC-5507).
            if ! current=$(gh pr view "$number" --repo "${REPO}" \
              --json id,headRefOid,isDraft,mergeable,mergeStateStatus,autoMergeRequest,labels); then
              echo "Unable to refresh PR #${number}, skipping this run"
              continue
            fi
            if ! is_enqueue_eligible <<<"${current}" >/dev/null; then
              echo "PR #${number} is no longer eligible, skipping"
              continue
            fi
            id=$(jq -r '.id' <<<"${current}")
            head=$(jq -r '.headRefOid' <<<"${current}")
            if ! already_queued=$(gh api graphql -f query='
              query($id: ID!) {
                node(id: $id) {
                  ... on PullRequest {
                    mergeQueueEntry { id }
                  }
                }
              }' -f id="$id" --jq '.data.node.mergeQueueEntry != null' 2>&1); then
              echo "Failed to check merge-queue status for PR #${number}, skipping this run: ${already_queued}"
              continue
            fi
            if [[ "${already_queued}" == "true" ]]; then
              continue
            fi
            echo "PR #${number} is CLEAN with auto-merge on but not queued -- enqueuing ${head}"
            gh api graphql -f query='
              mutation($id: ID!, $head: GitObjectID!) {
                enqueuePullRequest(input: {pullRequestId: $id, expectedHeadOid: $head}) {
                  mergeQueueEntry { position state }
                }
              }' -f id="$id" -f head="$head" || echo "Failed to enqueue PR #${number}, will retry next run"
          done
          echo "Scan complete."
