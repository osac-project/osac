global:
  networking:
    # Shared provider-networking setting, independent of service/controller enablement.
    provisioningEnabled: true

fullnameOverride: "bmf-operator"

image:
  repository: ghcr.io/osac-project/bare-metal-fulfillment-operator
  tag: latest  # PLACEHOLDER -- overwritten at release time by osac-build-and-publish.yaml
  pullPolicy: Always

replicaCount: 1

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

serviceAccount:
  create: true
  name: ""

secrets:
  inventoryConfig: "osac-inventory-config"
  managementConfig: "osac-management-config"
  osClouds: "osac-os-clouds"
  bcmCerts: "osac-bcm-certs"
  netboxToken: "osac-netbox-token"
  netboxCA: "osac-netbox-ca"

configMaps:
  profiles: "osac-profiles"

env:
  aapUrl: ""
  aapTokenSecretName: "osac-aap-api-token"
  aapTokenSecretKey: "token"
  aapInsecureSkipVerify: ""
  # Prefix of the AAP job template names the operator launches
  # (<prefix>-create-bare-metal-pool, ...). Empty keeps the operator's own
  # "osac" default, which matches the config-as-code's fixed organization.
  # A shared AAP names every object after the deployment's instance ID, so
  # those installs set this to the same prefix the osac-operator gets
  # through operator.aap.templatePrefix.
  aapTemplatePrefix: ""

secretAPI:
  url: "https://fulfillment-internal-api:8001"
  # Must match the OIDC issuer configured for the Fulfillment Service.
  issuerUrl: ""
  # Secret, in the release namespace, holding the Keycloak client
  # credentials (keys client-id and client-secret) the operator
  # authenticates to the Fulfillment Service with. Installs that share one
  # Keycloak between several deployments name each deployment's client
  # credentials differently; keep it aligned with
  # operator.fulfillment.credentials.secretName.
  credentialsSecret: "fulfillment-controller-credentials"
  caBundle:
    # Fresh installs using system-trusted certificates can leave this empty.
    # Standalone upgrades that relied on the former "ca-bundle" default must
    # set the existing ConfigMap here before rollout.
    configMap: ""
    key: "bundle.pem"

netbox:
  enabled: false
  # BMH namespace used for Metal3 management and BMC Secret RBAC in NetBox mode.
  bmhNamespace: ""
  url: ""
  tokenSecretKey: "token"
  tokenValue: ""
  caCert: ""
  # Permits an http:// bmf.netbox.url; applies to the NetBox API transport.
  clientAllowInsecureHTTP: false
  # Verify the BMC's TLS certificate on the BareMetalHosts this backend creates.
  # Leave true unless the BMCs use untrusted certificates; a single device can
  # override it with the NetBox custom field osac_bmc_certificate_verification.
  enableBMCCertificateVerification: true

bcm:
  enabled: false
  url: ""
  cert: ""
  key: ""
  caCert: ""
  insecureSkipVerify: false
  hostClass: "bcm"
  bmhNamespace: ""

metal3:
  enabled: false
  namespace: ""
  hostClass: "metal3"

# Path and Secret used to read BareMetalHosts and their BMC credential
# Secrets from a remote (outer) cluster, as remoteClusterKubeconfig does for
# the osac-operator. Set path and Secret name together to enable
# remote-cluster mode; leave both empty for local mode.
remoteClusterKubeconfig: ""
remoteClusterKubeconfigSecretName: ""
remoteClusterKubeconfigSecretKey: kubeconfig
