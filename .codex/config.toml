# OpenAI Codex project configuration for the OSAC mono-repo.
# Codex walks from the .git root down to the working directory and merges any
# .codex/config.toml it finds, so this file applies repo-wide.

# Keep the project-instruction budget explicit for the root plus nearest
# component AGENTS.md files. The current compact files fit within the default;
# this leaves modest headroom without restoring the former oversized budget.
project_doc_max_bytes = 32768
