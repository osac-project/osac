title = "OSAC PR Dashboard"
description = "Live view of open pull requests across all OSAC component repos, updated every 30 minutes."

# Repos to monitor (used by generate.py and notify.py)
repos = [
    "osac-project/osac",
    "osac-project/osac-ui",
    "osac-project/osac-test-infra",
    "osac-project/enhancement-proposals",
]

# Slack settings (used by notify.py only)
slack_channel = "C08ESMFV85Q"
slack_creds_dir = "~/.config/slack/"

# Dashboard settings (used by generate.py for output path, notify.py for data URL)
[dashboard]
repo = "osac-project/osac"
branch = "main"
base_url = "https://osac-project.github.io/osac/pr-dashboard"
data_path = "docs/pr-dashboard/data.json"
