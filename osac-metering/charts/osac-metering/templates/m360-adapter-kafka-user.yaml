{{- if .Values.m360Adapter.enabled }}
{{- /* The adapter reads every tenant's heartbeat topic and the shared
     inference topic, and writes every tenant's dead-letter topic plus
     the inference dead-letter topic. */}}
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: osac-metering-m360-adapter
  namespace: {{ include "osac-metering.kafkaClusterNamespace" . }}
  labels:
    strimzi.io/cluster: {{ include "osac-metering.kafkaClusterName" . }}
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: osac.metering.heartbeat.
          patternType: prefix
        operations:
          - Read
          - Describe
        host: "*"
      - resource:
          type: topic
          name: osac.metering.inference
          patternType: literal
        operations:
          - Read
          - Describe
        host: "*"
      - resource:
          type: topic
          name: osac.metering.dlq.
          patternType: prefix
        operations:
          - Write
          - Describe
        host: "*"
      - resource:
          type: topic
          name: osac.metering.inference.dlq
          patternType: literal
        operations:
          - Write
          - Describe
        host: "*"
      - resource:
          type: group
          name: osac-metering-m360-adapter
          patternType: literal
        operations:
          - Read
        host: "*"
{{- end }}
