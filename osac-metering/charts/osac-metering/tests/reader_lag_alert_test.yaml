suite: metering reader lag alert
templates:
  - templates/prometheusrule-readers.yaml
tests:
  - it: reports lag for one reader group and names the topic
    set:
      prometheusRule.enabled: true
      readers:
        - name: billing-reader
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.namespace
          value: osac-kafka
      - lengthEqual:
          path: spec.groups[0].rules
          count: 1
      - equal:
          path: spec.groups[0].rules[0].expr
          value: 'kafka_consumergroup_lag{consumergroup="billing-reader"} > 15'
      - equal:
          path: spec.groups[0].rules[0].labels.reader
          value: billing-reader
      - equal:
          path: spec.groups[0].rules[0].annotations.summary
          value: Metering reader billing-reader is behind
      # The exporter reports one lag series per heartbeat topic, so the
      # annotation names the topic that is behind.
      - matchRegex:
          path: spec.groups[0].rules[0].annotations.description
          pattern: '\$labels\.topic'
      - equal:
          path: spec.groups[0].rules[0].for
          value: 15m

  - it: renders one rule per reader
    set:
      prometheusRule.enabled: true
      readers:
        - name: billing-reader
        - name: audit-reader
    asserts:
      - lengthEqual:
          path: spec.groups[0].rules
          count: 2
      - equal:
          path: spec.groups[0].rules[0].expr
          value: 'kafka_consumergroup_lag{consumergroup="billing-reader"} > 15'
      - equal:
          path: spec.groups[0].rules[1].expr
          value: 'kafka_consumergroup_lag{consumergroup="audit-reader"} > 15'
      - equal:
          path: spec.groups[0].rules[1].labels.reader
          value: audit-reader
      - equal:
          path: spec.groups[0].rules[1].annotations.summary
          value: Metering reader audit-reader is behind

  - it: uses a dotted reader name literally
    set:
      prometheusRule.enabled: true
      readers:
        - name: billing.reader
    asserts:
      - equal:
          path: spec.groups[0].rules[0].expr
          value: 'kafka_consumergroup_lag{consumergroup="billing.reader"} > 15'

  - it: uses the configured lag threshold
    set:
      prometheusRule.enabled: true
      prometheusRule.readerLagThreshold: 5
      readers:
        - name: billing-reader
    asserts:
      - equal:
          path: spec.groups[0].rules[0].expr
          value: 'kafka_consumergroup_lag{consumergroup="billing-reader"} > 5'

  - it: renders no reader alert when no readers are configured
    set:
      prometheusRule.enabled: true
    asserts:
      - hasDocuments:
          count: 0
