---
# ONTAP-specific settings checks, shared by setup and ensure_storage_class.
# The dispatcher validates the tiers themselves.

- name: Fail if sanType is not a valid Trident SAN transport
  ansible.builtin.fail:
    msg: >-
      netapp_storage_san_type is invalid. Trident accepts one of: iscsi, fcp,
      nvme. The value must match the transport the prepared SVM's LIFs
      actually carry.
  when: netapp_storage_san_type not in ['iscsi', 'fcp', 'nvme']
  no_log: true

- name: Fail if the CSI operator namespace is empty
  ansible.builtin.fail:
    msg: >-
      netapp_storage_csi_operator_namespace resolved to an empty value. Set
      NETAPP_CSI_OPERATOR_NAMESPACE to a valid namespace name (default: trident).
  when: netapp_storage_csi_operator_namespace | default('') | length == 0
  no_log: true
