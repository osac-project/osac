syntax = "proto3";

package osac.private.v1;

import "buf/validate/validate.proto";
import "cleanapi/cleanapi.proto";
import "google/api/annotations.proto";
import "osac/private/v1/billing_export_type.proto";

option (cleanapi.file).package = "osac.public.v1";
option (cleanapi.file).http_route_prefix_map = "private:fulfillment";

message BillingExportsCreateRequest {
  option (buf.validate.message).cel = {
    id: "billing_exports_date_range"
    message: "from_date must be on or before to_date"
    expression: "this.from_date <= this.to_date"
  };

  string tenant_id = 1 [(buf.validate.field).string = {min_len: 1}];
  string from_date = 2 [(buf.validate.field).string = {len: 10, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"}];
  string to_date = 3 [(buf.validate.field).string = {len: 10, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"}];
  // Stable key used to make retries of the same export request idempotent.
  string idempotency_key = 4 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
}

message BillingExportsCreateResponse {
  BillingExport object = 1;
}

message BillingExportsGetRequest {
  string tenant_id = 1 [(buf.validate.field).string = {min_len: 1}];
  string id = 2 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
}

message BillingExportsGetResponse {
  BillingExport object = 1;
}

service BillingExports {
  // Starts an export of a tenant's charges when supported by the configured provider.
  rpc Create(BillingExportsCreateRequest) returns (BillingExportsCreateResponse) {
    option (google.api.http) = {
      post: "/api/private/v1/billing/exports"
      body: "*"
    };
  }

  // Retrieves the state of an export operation for the requested tenant.
  rpc Get(BillingExportsGetRequest) returns (BillingExportsGetResponse) {
    option (google.api.http) = {
      get: "/api/private/v1/billing/exports/{id}"
      response_body: "object"
    };
  }
}
