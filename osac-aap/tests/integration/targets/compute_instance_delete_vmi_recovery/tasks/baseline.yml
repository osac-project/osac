            state: absent
            api_version: kubevirt.io/v1
            kind: VirtualMachineInstance
            name: "{{ compute_instance_name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
          register: s3_delete_result
          failed_when: false

        - name: "S3: Verify VMI has timestamp"
          kubernetes.core.k8s_info:
            api_version: kubevirt.io/v1
            kind: VirtualMachineInstance
            name: "{{ compute_instance_name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
          register: s3_vmi_check
          failed_when: >
            s3_vmi_check.resources | length == 0 or
            (s3_vmi_check.resources[0].metadata.deletionTimestamp
            | default('')) == ''

        - name: "S3: Create minimal VM fixture"
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: kubevirt.io/v1
