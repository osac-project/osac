{{/*
BackendTLSPolicy needs a ConfigMap keyed ca.crt. The shared trust bundle
(certs.caBundle.configMap) is keyed bundle.pem, so re-materialize it under ca.crt via
a trust-manager Bundle. trust-manager ships with osac-deps. Rendered only when a CA
bundle source is configured; otherwise provide the ConfigMap named by
ingress.gatewayapi.backendCaConfigMap out of band.
*/}}
{{- if and (eq .Values.ingress.driver "gatewayapi") .Values.certs.caBundle.configMap }}
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: {{ .Values.ingress.gatewayapi.backendCaConfigMap }}
spec:
  sources:
  - configMap:
      name: {{ .Values.certs.caBundle.configMap }}
      key: bundle.pem
  target:
    configMap:
      key: ca.crt
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace }}
{{- end }}
