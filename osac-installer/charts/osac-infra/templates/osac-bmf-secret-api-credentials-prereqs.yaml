{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: osac-bmf-secret-api-credentials
  namespace: {{ .Values.osacNamespace }}
  labels:
    {{- include "osac-infra.labels" . | nindent 4 }}
  annotations:
    osac.openshift.io/tenant: system
    osac.openshift.io/owner-reference: Deployment/bmf-operator-controller-manager
type: Opaque
stringData:
  client-id: osac-bmf
  client-secret: pending
{{- end }}
