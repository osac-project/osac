---
- name: Copy user-data secret to VM namespace as sysprep Secret (Windows)
  when:
    - guest_os_family == 'windows'
    - vm_user_data_secret_ref | length > 0
  block:
    - name: Validate tenant annotation for sysprep Secret
      ansible.builtin.assert:
        that:
          - >-
            (compute_instance.metadata.annotations | default({}, true)).get('osac.openshift.io/tenant', '') | default('', true) | length > 0
        fail_msg: >-
          ComputeInstance must have a non-empty 'osac.openshift.io/tenant'
          annotation before creating a sysprep Secret

    - name: Read user-data secret from ComputeInstance namespace
      kubernetes.core.k8s_info:
        # Note: Reads from management cluster (in-cluster auth) where ComputeInstance exists.
        # Do NOT use remote_cluster_kubeconfig here - that targets the workload cluster.
        api_version: v1
        kind: Secret
        name: "{{ vm_user_data_secret_ref }}"
        namespace: "{{ compute_instance.metadata.namespace }}"
      register: user_data_secret
      no_log: true

    - name: Fail if user-data secret not found
      ansible.builtin.assert:
        that:
          - user_data_secret.resources | length > 0
        fail_msg: >-
          Secret '{{ vm_user_data_secret_ref }}' not found in namespace
          '{{ compute_instance.metadata.namespace }}'
      no_log: true

    - name: Fail if userdata key is missing or empty
      ansible.builtin.assert:
        that:
          - user_data_secret.resources[0].data.userdata is defined
          - user_data_secret.resources[0].data.userdata | length > 0
        fail_msg: >-
          Secret '{{ vm_user_data_secret_ref }}' in namespace
          '{{ compute_instance.metadata.namespace }}' does not contain
          a non-empty 'userdata' key
      no_log: true

    - name: Create sysprep secret in VM namespace with Unattend.xml key
      kubernetes.core.k8s:
        kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ compute_instance_name }}-sysprep"
            namespace: "{{ compute_instance_target_namespace }}"
            labels: "{{ default_vm_labels }}"
            annotations:
              osac.openshift.io/tenant: "{{ compute_instance.metadata.annotations['osac.openshift.io/tenant'] }}"
          type: Opaque
          data:
            Unattend.xml: "{{ user_data_secret.resources[0].data.userdata }}"
      no_log: true

    - name: Add sysprep disk to template spec
      ansible.builtin.set_fact:
        vm_template_spec: "{{ vm_template_spec | combine(sysprep_patch, recursive=True, list_merge='append') }}"
      vars:
        sysprep_patch:
          domain:
            devices:
              disks:
                - name: sysprep-disk
                  cdrom:
                    bus: sata
          volumes:
            - name: sysprep-disk
              sysprep:
                secret:
                  name: "{{ compute_instance_name }}-sysprep"

- name: Copy user-data secret to VM namespace and add cloud-init disk to template spec
  when:
    - vm_user_data_secret_ref | length > 0
    - guest_os_family != 'windows'
  block:
    - name: Read user-data secret from ComputeInstance namespace
      kubernetes.core.k8s_info:
        # Note: Reads from management cluster (in-cluster auth) where ComputeInstance exists.
        # Do NOT use remote_cluster_kubeconfig here - that targets the workload cluster.
        api_version: v1
        kind: Secret
        name: "{{ vm_user_data_secret_ref }}"
        namespace: "{{ compute_instance.metadata.namespace }}"
      register: user_data_secret

    - name: Fail if user-data secret not found
      ansible.builtin.assert:
        that:
          - user_data_secret.resources | length > 0
        fail_msg: >-
          Secret '{{ vm_user_data_secret_ref }}' not found in namespace
          '{{ compute_instance.metadata.namespace }}'

    - name: Create user-data secret in VM namespace
      kubernetes.core.k8s:
        kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ compute_instance_name }}-user-data"
            namespace: "{{ compute_instance_target_namespace }}"
            labels: "{{ default_vm_labels }}"
          type: Opaque
          data: "{{ user_data_secret.resources[0].data }}"

    - name: Add cloud-init disk to template spec
      ansible.builtin.set_fact:
        vm_template_spec: "{{ vm_template_spec | combine(cloud_init_patch, recursive=True, list_merge='append') }}"
      vars:
        cloud_init_patch:
          domain:
            devices:
              disks:
                - name: cloud-init-disk
                  disk:
                    bus: virtio
                  serial: cloud-init
          volumes:
            - name: cloud-init-disk
              cloudInitNoCloud:
                secretRef:
                  name: "{{ compute_instance_name }}-user-data"

- name: Add minimal cloud-init disk for SSH key propagation (Linux)
  ansible.builtin.set_fact:
    vm_template_spec: "{{ vm_template_spec | combine(cloud_init_patch, recursive=True, list_merge='append') }}"
  vars:
    cloud_init_patch:
      domain:
        devices:
          disks:
            - name: cloud-init-disk
              disk:
                bus: virtio
              serial: cloud-init
      volumes:
        - name: cloud-init-disk
          cloudInitNoCloud:
            userData: "#cloud-config"
  when:
    - guest_os_family == 'linux'
    - vm_ssh_key | length > 0
    - vm_user_data_secret_ref | length == 0

- name: Create ssh public key secret and add accessCredentials to template spec (Linux)
  when:
    - guest_os_family == 'linux'
    - vm_ssh_key | length > 0
  block:
    - name: Create Secret resource containing ssh public key
      kubernetes.core.k8s:
        kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ compute_instance_name }}-ssh-public-key"
            namespace: "{{ compute_instance_target_namespace }}"
            labels: "{{ default_vm_labels }}"
          data:
            ssh-public-key: "{{ vm_ssh_key | b64encode }}"
          type: Opaque

    - name: Add accessCredentials to template spec
      ansible.builtin.set_fact:
        vm_template_spec: "{{ vm_template_spec | combine(ssh_public_key_patch, recursive=True, list_merge='append') }}"
      vars:
        ssh_public_key_patch:
          accessCredentials:
            - sshPublicKey:
                source:
                  secret:
                    secretName: "{{ compute_instance_name }}-ssh-public-key"
                propagationMethod:
                  noCloud: {}
