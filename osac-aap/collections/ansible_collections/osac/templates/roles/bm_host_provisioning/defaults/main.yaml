---
bm_host_openstack_external_network: "external"
# Polling budget for the Metal3 create/delete waits on the BMH provisioning
# state. The defaults tolerate a slow bare-metal provision; callers that
# drive the status themselves (integration tests) can lower both.
bm_host_metal3_wait_retries: 120
bm_host_metal3_wait_delay: 30
