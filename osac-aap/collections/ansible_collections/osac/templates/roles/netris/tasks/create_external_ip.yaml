---
# ExternalIP -> a /32 nat reservation osac-eip-<ExternalIP id> inside the CIDR
# of its pool, made by the osac.templates.netris_external_ip module (first free
# host address; the same address on every rerun). The address is returned as
# external_ip.address. A full pool and an object of another tenant or site are
# final errors; any other failure is retryable.
- name: Allocate the ExternalIP on Netris
  block:
    - name: Check the settings
      ansible.builtin.include_tasks: _settings.yaml
      vars:
        netris_require: [controller, credentials, site, tenant]

    - name: Check the task input
      ansible.builtin.include_tasks: _input.yaml
      vars:
        netris_require_parents: [external_ip_pool]

    - name: Build the object names
      ansible.builtin.include_tasks: _names.yaml

    - name: Log in to Netris
      ansible.builtin.include_role:
        name: netris.controller.auth
      when: netris_session_cookie is not defined

    - name: Allocate the address
      osac.templates.netris_external_ip:
        operation: external_ip.allocate
        resource: "{{ osac_job_vars.resource }}"
        pool: "{{ osac_job_vars.external_ip_pool }}"
        reservation_name: "{{ netris_names.eip_reservation }}"
        controller_url: "{{ netris_controller_url }}"
        session_cookie: "{{ netris_session_cookie }}"
        site_id: "{{ netris_site_id | int }}"
        tenant_id: "{{ netris_tenant_id | int }}"
        timeout: "{{ netris_timeout | default(30) }}"
        validate_certs: "{{ netris_validate_certs | default(true) }}"
        ca_path: "{{ netris_ca_path | default(omit, true) }}"
      register: _netris_eip
      ignore_errors: true

    - name: Stop when the module cannot continue
      ansible.builtin.include_tasks: _eip_module_result.yaml

    - name: Return the address to OSAC
      ansible.builtin.include_tasks: _publish.yaml
      vars:
        netris_result:
          external_ip:
            address: "{{ _netris_eip.address }}"
  rescue:
    - name: Report the error
      ansible.builtin.include_tasks: _rescue.yaml
