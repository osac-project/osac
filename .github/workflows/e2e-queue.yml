---
# The merge queue's E2E: plans the suites for the queue entry from its changed files (a documentation-only entry needs
# none), runs them on the entry's speculative commit, and writes the required `E2E` check of that commit. The plan, the
# cancelling of superseded runs and the check are the shared workflows of osac-ci (pinned by commit, release tag in a
# comment); the suite jobs are this repository's, named after the suite ids of .github/e2e-policy.yml.
name: E2E for the merge queue

on:
  merge_group:

permissions: {}

jobs:
  plan:
    uses: osac-project/osac-ci/.github/workflows/e2e-queue-plan.yml@728d1b064cdbfa429c68ce5bc5a35b47b6c127d7  # v1.3.10
    permissions:
      contents: read
      actions: write

  # The pull request of the entry, for the ci-observe capture. A merge_group event carries no pull request number: the
  # only place GitHub exposes it is the temporary branch it creates for the entry,
  # "gh-readonly-queue/<base>/pr-<N>-<sha>" (the monitoring backfill of the CI dashboard reads the number from the same
  # branch). The suites get it as `pr-number`, so a queue attempt is captured as "pull request N" (`caas-pr<N>-...`,
  # with osac.ci.pr=<N> on every signal) and the Pull requests dashboard can link the attempt to that capture.
  entry:
    runs-on: ubuntu-latest
    outputs:
      pr-number: ${{ steps.derive.outputs.number }}
    steps:
      - name: Derive the pull request number from the queue branch
        id: derive
        # Telemetry never decides whether the entry passes: a number this step cannot read leaves the suites running,
        # with a capture named as it is on main, instead of stopping the required E2E check.
        continue-on-error: true
        env:
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          # <base> may contain "/" itself (release/4.20), so match the anchored pr-<N>-<sha> suffix and not one path
          # segment. `merge_group.head_ref` arrives as a branch name but can carry the refs/heads/ prefix; strip it
          # first so both forms match. No match leaves the number empty: the suite then runs as it does on main, under
          # no pull request.
          ref="${HEAD_REF#refs/heads/}"
          if [[ "${ref}" =~ ^gh-readonly-queue/.+/pr-([0-9]+)-[0-9a-f]+$ ]]; then
            echo "number=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "number=" >> "$GITHUB_OUTPUT"
            echo "::warning::no pull request number in the queue branch '${HEAD_REF}'; the capture will be named main"
          fi

  vmaas:
    needs: [plan, entry]
    # always() keeps the suite running when `entry` failed (a runner/network failure must not skip the
    # required check); the plan result still gates it, and telemetry stays non-gating.
    if: ${{ always() && needs.plan.result == 'success' && contains(needs.plan.outputs.suites, '"vmaas"') }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/e2e-vmaas-full-install.yml
    with:
      repo: ${{ github.repository }}
      sha: ${{ github.event.merge_group.head_sha }}
      pr-number: ${{ needs.entry.outputs.pr-number }}
      # Telemetry is always on for every suite run; this workflow has no switch.
    secrets:
      CI_OBSERVE_OTLP_PASSWORD: ${{ secrets.CI_OBSERVE_OTLP_PASSWORD }}
      OSAC_CI_APP_ID: ${{ secrets.OSAC_CI_APP_ID }}
      OSAC_CI_APP_PRIVATE_KEY: ${{ secrets.OSAC_CI_APP_PRIVATE_KEY }}

  caas:
    needs: [plan, entry]
    # always() keeps the suite running when `entry` failed (a runner/network failure must not skip the
    # required check); the plan result still gates it, and telemetry stays non-gating.
    if: ${{ always() && needs.plan.result == 'success' && contains(needs.plan.outputs.suites, '"caas"') }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/e2e-caas-full-install.yml
    with:
      repo: ${{ github.repository }}
      sha: ${{ github.event.merge_group.head_sha }}
      pr-number: ${{ needs.entry.outputs.pr-number }}
      # Always on for every suite run (see the vmaas job).
    secrets:
      CI_OBSERVE_OTLP_PASSWORD: ${{ secrets.CI_OBSERVE_OTLP_PASSWORD }}
      OSAC_CI_APP_ID: ${{ secrets.OSAC_CI_APP_ID }}
      OSAC_CI_APP_PRIVATE_KEY: ${{ secrets.OSAC_CI_APP_PRIVATE_KEY }}

  bmaas:
    needs: [plan, entry]
    # always() keeps the suite running when `entry` failed (a runner/network failure must not skip the
    # required check); the plan result still gates it, and telemetry stays non-gating.
    if: ${{ always() && needs.plan.result == 'success' && contains(needs.plan.outputs.suites, '"bmaas"') }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/e2e-bmaas-full-install.yml
    with:
      repo: ${{ github.repository }}
      sha: ${{ github.event.merge_group.head_sha }}
      pr-number: ${{ needs.entry.outputs.pr-number }}
      # Always on for every suite run (see the vmaas job).
    secrets:
      CI_OBSERVE_OTLP_PASSWORD: ${{ secrets.CI_OBSERVE_OTLP_PASSWORD }}
      OSAC_CI_APP_ID: ${{ secrets.OSAC_CI_APP_ID }}
      OSAC_CI_APP_PRIVATE_KEY: ${{ secrets.OSAC_CI_APP_PRIVATE_KEY }}

  # The Netris suites, only for an entry with a networking change (the `connectivity` filter of .github/e2e-policy.yml).
  # Each runs as `<suite>-run`, and the job named after the suite only reports how that ended. The result job of osac-ci
  # follows a suite by its deepest jobs, but a Netris suite is several jobs in a row (provision, push-secrets, e2e,
  # teardown) of which GitHub lists only those that have started, and provision and teardown sit deeper than the tests:
  # followed directly, the suite would count as passed after provisioning, before its tests. The job named after the
  # suite starts only once the whole suite has ended, and passes only when GitHub's own result of it is success.
  # No pr-number: with one, the Netris workflow would take the entry's commit for the head of a pull request.
  bmaas-netris-run:
    needs: plan
    if: ${{ needs.plan.result == 'success' && contains(needs.plan.outputs.suites, '"bmaas-netris"') }}
    permissions:
      contents: read
      id-token: write
      checks: write
      pull-requests: read
    uses: ./.github/workflows/e2e-bmaas-netris-full-install.yml
    with:
      repo: ${{ github.repository }}
      sha: ${{ github.event.merge_group.head_sha }}

  bmaas-netris:
    needs: [plan, bmaas-netris-run]
    if: ${{ always() && needs.plan.result == 'success' && contains(needs.plan.outputs.suites, '"bmaas-netris"') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          RESULT: ${{ needs['bmaas-netris-run'].result }}
        run: |
          echo "bmaas-netris ended: ${RESULT}"
          [ "${RESULT}" = success ]

  vmaas-netris-run:
    needs: plan
    if: ${{ needs.plan.result == 'success' && contains(needs.plan.outputs.suites, '"vmaas-netris"') }}
    permissions:
      contents: read
      id-token: write
      checks: write
      pull-requests: read
    uses: ./.github/workflows/e2e-vmaas-netris-full-install.yml
    with:
      repo: ${{ github.repository }}
      sha: ${{ github.event.merge_group.head_sha }}

  vmaas-netris:
    needs: [plan, vmaas-netris-run]
    if: ${{ always() && needs.plan.result == 'success' && contains(needs.plan.outputs.suites, '"vmaas-netris"') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          RESULT: ${{ needs['vmaas-netris-run'].result }}
        run: |
          echo "vmaas-netris ended: ${RESULT}"
          [ "${RESULT}" = success ]

  # One job that looks after the queue entry: it watches the suites and the other required checks of the commit (the
  # unit and integration tests of CI, the Jira check), writes the required E2E check at once when one of them fails, and
  # stops everything that still runs for the commit, so the entry leaves the queue instead of holding its place until
  # every suite has ended. It also writes E2E when everything passed. See osac-ci's docs/CALLERS.md.
  result:
    needs: plan
    if: always()
    uses: osac-project/osac-ci/.github/workflows/e2e-queue-result.yml@728d1b064cdbfa429c68ce5bc5a35b47b6c127d7  # v1.3.10
    permissions:
      actions: write
      contents: read
    with:
      sha: ${{ github.event.merge_group.head_sha }}
      branch: ${{ github.event.merge_group.base_ref }}
      plan-result: ${{ needs.plan.result }}
      suites: ${{ needs.plan.outputs.suites }}
    secrets:
      OSAC_CI_APP_PRIVATE_KEY: ${{ secrets.OSAC_CI_APP_PRIVATE_KEY }}
