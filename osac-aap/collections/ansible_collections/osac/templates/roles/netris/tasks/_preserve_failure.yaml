---
# Keeps the provider failure that the task's own rescue is about to replace.
# The rescue re-raises a plain message so the play still fails; without this,
# the playbook-level legacy reporter would lose the HTTP status and provider
# body that netris_safe_error_detail needs for a useful, sanitized message.

- name: Preserve the underlying provider failure for the legacy report
  ansible.builtin.set_fact:
    _netris_failure_origin_task: "{{ ansible_failed_task.name | default('unknown provider task') }}"
    _netris_failure_origin_result: "{{ ansible_failed_result }}"
  when: not (_osac_contract | default(false) | bool)
