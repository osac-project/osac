# ============================================================
# Scenario 4 — Recovery refusal: launcher still Running
# ============================================================
- name: "Scenario 4: Recovery refused (launcher running)"
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../../common_vars.yml
  vars:
    compute_instance_name: vmi-recovery-running
    compute_instance_target_namespace: test-subnet
    guest_os_family: linux
