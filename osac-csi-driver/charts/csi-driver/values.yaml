namespace: osac-csi

driverName: csi.osac.openshift.io

image:
  repository: ghcr.io/osac-project/osac-csi-driver
  tag: main  # PLACEHOLDER -- overwritten at release time by publish-charts.yaml
  pullPolicy: Always

controller:
  replicas: 1
  clusterID: ""
  vendorSockets: ""
  # Comma-separated backend=endpoint pairs for vendor CSI controllers, used to
  # proxy attach/detach (ControllerPublish/UnpublishVolume). The routing key is
  # the "osac.backend" volume-context value, which is the StorageBackend name
  # resolved from the volume's StorageTier — so each key MUST match a
  # StorageBackend's metadata.name that a Cloud Provider Admin created. The names
  # below are the expected convention; align them with your actual backends.
  # Endpoints for network-attached vendors are the Services created by the
  # csi-backends chart (namespace osac-csi-backends, gRPC port 50051). Use the
  # special value "none" for node-local backends (e.g. lvms/topolvm) that need no
  # controller-side attach — publish/unpublish become a no-op for those.
  # An entry for a backend that is not deployed is harmless — it is only dialed
  # when a volume names it.
  # OSAC-4187 (0.2, temporary): direct vendor-controller proxying; reworked in 0.3.
  vendorControllers: "local=none,vast=vast-csi-controller.osac-csi-backends.svc:50051,pure=pure-csi-controller.osac-csi-backends.svc:50051,ontap=trident-csi-controller.osac-csi-backends.svc:50051"
  # Connection to the OSAC fulfillment-service (runs on the hub / control plane cluster).
  # The CSI driver runs on tenant clusters and authenticates to the
  # fulfillment-service using OAuth2 client_credentials via Keycloak. The
  # credentials Secret must be provisioned in the release namespace before
  # the chart is installed.
  fulfillment:
    # gRPC endpoint of the fulfillment-service (e.g. "fulfillment-api.osac.svc:8000").
    # Leave empty to use in-memory stubs.
    endpoint: ""
    # OIDC issuer URL for token endpoint discovery
    # (e.g. "https://keycloak.example.com/realms/myrealm").
    issuerUrl: ""
    # Secret containing OAuth2 client credentials for fulfillment-service
    # authentication via the client_credentials grant. The Secret must exist
    # in the release namespace before the chart is installed.
    credentials:
      # Name of the Kubernetes Secret (required when endpoint is set).
      secretName: ""
      # Key inside the Secret that holds the OAuth2 client ID.
      clientIdKey: "client-id"
      # Key inside the Secret that holds the OAuth2 client secret.
      clientSecretKey: "client-secret"
    tls:
      # Skip server certificate verification (use for self-signed certs).
      insecureSkipVerify: false
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  leaderElection: true

node:
  privileged: true
  vendorSockets: ""
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

sidecars:
  provisioner:
    image:
      repository: registry.k8s.io/sig-storage/csi-provisioner
      tag: v5.1.0
  attacher:
    image:
      repository: registry.k8s.io/sig-storage/csi-attacher
      tag: v4.7.0
  registrar:
    image:
      repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
      tag: v2.12.0

serviceAccount:
  controller:
    create: true
    name: ""
  node:
    create: true
    name: ""

vendors:
  trident:
    enabled: false
    image:
      repository: registry.connect.redhat.com/netapp/trident
      tag: 25.10.0
    config:
      certsSecret: ""
    node:
      socketPath: /var/lib/kubelet/plugins/csi.trident.netapp.io

  vast:
    enabled: false
    image:
      repository: docker.io/vastdataorg/csi
      tag: v2.6.5
    config:
      vmsHost: ""
      vipPoolName: ""
      nfsExport: /k8s
      viewPolicy: default
      verifySsl: "true"
      credentialsSecret: ""
    node:
      socketPath: /var/lib/kubelet/plugins/csi.vast.vastdata.com

  pure:
    enabled: false
    image:
      repository: docker.io/portworx/px-pure-csi-driver
      tag: "26.2.1"
    config:
      credentialsSecret: ""
      clusterUuid: ""
    node:
      socketPath: /var/lib/kubelet/plugins/csi.pure.purestorage.com
      sanType: "ISCSI"
      clusterName: ""
