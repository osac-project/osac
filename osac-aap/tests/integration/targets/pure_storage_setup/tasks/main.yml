---
# Integration test for the Pure FlashBlade setup action, end to end through
# osac.service.storage_provider.
#
# Covers Realm checkout, hub Secret creation, rollback in both Secret variants,
# and credential hygiene. Does NOT test filesystem creation (filesystems are
# created on-demand by the Pure CSI driver when PVCs are provisioned, not by
# setup.yaml).
#
# Requires: kind cluster with osac-system, and the mock FlashBlade server on
# 127.0.0.1:18444 (started by setup_test_env.sh).
#
# WARNING: every credential value below is a PLACEHOLDER. Never insert real
# credentials into this file.
#
# For POC runs against the real MOC array, override these variables:
#   pure_test_mgmt_endpoint: <real-array-ip>
#   pure_test_nfs_endpoint: <real-data-vip>
#   pure_test_realm_token: <real-realm-token>
#   pure_test_skip_mock_calls: true

# ── Prepare ──
- name: "Pure Storage Setup - Prepare"
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Reset the mock FlashBlade
      when: not (pure_test_skip_mock_calls | default(false) | bool)
      ansible.builtin.uri:
        url: "https://{{ pure_test_mgmt_endpoint | default('127.0.0.1:18444') }}/_reset"
        validate_certs: false
        method: GET

    # The Realm, its NFS server and its export policy are pre-provisioned.
    # The setup action only checks out a Realm and creates the hub Secret;
    # it does NOT create filesystems (filesystems are created on-demand by
    # the CSI driver when PVCs are provisioned).
    - name: Seed the Realm-owned FlashBlade resources
      when: not (pure_test_skip_mock_calls | default(false) | bool)
      ansible.builtin.uri:
        url: "https://{{ pure_test_mgmt_endpoint | default('127.0.0.1:18444') }}/_seed"
        validate_certs: false
        method: POST
        body_format: json
        body:
          resource: "{{ item.resource }}"
          name: "{{ item.name }}"
      loop:
        - resource: realms
          name: ps-realm
        - resource: servers
          name: "ps-realm::nfs-server"
        - resource: nfs-export-policies
          name: "ps-realm::export-policy"
      loop_control:
        label: "{{ item.name }}"

    - name: Delete Secrets left behind by an earlier run
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Secret
        name: "{{ item }}"
        namespace: osac-system
      loop:
        - pure-tenant-config-ps-new-be-pure
        - pure-tenant-config-ps-roll-be-pure
        - pure-tenant-config-ps-existing-be-pure
        - pure-realm-ps-realm
      failed_when: false

    - name: Create the Realm credential Secret (backend A)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: pure-realm-ps-realm
            namespace: osac-system
            labels:
              app.kubernetes.io/managed-by: osac-aap
              osac.openshift.io/pure-realm-credential: ps-realm
          stringData:
            realm_name: ps-realm
            api_token: "{{ pure_test_realm_token | default('PLACEHOLDER_DO_NOT_USE_realm_token') }}"
            mgmt_endpoint: "{{ pure_test_mgmt_endpoint | default('127.0.0.1:18444') }}"
            nfs_endpoint: "{{ pure_test_nfs_endpoint | default('192.0.2.20') }}"

    - name: Create a second Realm credential Secret (also backend A, for backend scoping test)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: pure-realm-ps-realm-a2
            namespace: osac-system
            labels:
              app.kubernetes.io/managed-by: osac-aap
              osac.openshift.io/pure-realm-credential: ps-realm-a2
          stringData:
            realm_name: ps-realm-a2
            api_token: "{{ pure_test_realm_token | default('PLACEHOLDER_DO_NOT_USE_realm_token_a2') }}"
            mgmt_endpoint: "{{ pure_test_mgmt_endpoint | default('127.0.0.1:18444') }}"
            nfs_endpoint: "{{ pure_test_nfs_endpoint | default('192.0.2.20') }}"

    - name: Create a third Realm credential Secret (backend B)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: pure-realm-ps-realm-b
            namespace: osac-system
            labels:
              app.kubernetes.io/managed-by: osac-aap
              osac.openshift.io/pure-realm-credential: ps-realm-b
          stringData:
            realm_name: ps-realm-b
            api_token: "{{ pure_test_realm_token | default('PLACEHOLDER_DO_NOT_USE_realm_token_b') }}"
            mgmt_endpoint: "192.0.2.100"
            nfs_endpoint: "192.0.2.101"

    # setup.yaml reads the pool from this ConfigMap, so the target seeds it
    # rather than relying on a manually provisioned cluster.
    - name: Seed the Realm pool ConfigMap
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: pure-realm-pool
            namespace: osac-system
          data:
            PURE_REALM_POOL: |
              [
                {"realm_name":"ps-realm","secret_name":"pure-realm-ps-realm"},
                {"realm_name":"ps-realm-a2","secret_name":"pure-realm-ps-realm-a2"},
                {"realm_name":"ps-realm-b","secret_name":"pure-realm-ps-realm-b"}
              ]

# ── Happy path: provision a new tenant ──
- name: "Pure Storage Setup - Provision a new tenant"
  hosts: localhost
  gather_facts: false

  vars: &pure_setup_vars
    pure_storage_config_namespace: osac-system
    tenant_namespace: osac-system
    storage_provider_action: setup
    storage_provider_provisioning_target: vmaas
    storage_provider_tiers:
      - name: default
        protocol: nfs
        provider: pure
        backend_id: be-pure
      - name: fast
        protocol: nfs
        provider: pure
        backend_id: be-pure
    storage_provider_backend_connections:
      be-pure:
        endpoint: "{{ pure_test_mgmt_endpoint | default('127.0.0.1:18444') }}"

  pre_tasks:
    # Facts persist across plays for the same host; without this a rescue in a
    # later play would act on the filesystem list a previous play left behind.
    - name: Isolate this case from facts set by earlier cases
      ansible.builtin.meta: clear_facts

  tasks:
    - name: Run the setup dispatch for a new tenant
      ansible.builtin.include_role:
        name: osac.service.storage_provider
      vars:
        tenant_name: ps-new
        tenant_uid: test-uid-ps-new

    - name: Read the hub Secret the run wrote
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: pure-tenant-config-ps-new-be-pure
        namespace: osac-system
      register: _ps_secret

    - name: Assert the hub Secret carries the Realm claim labels
      vars:
        _labels: "{{ _ps_secret.resources[0].metadata.labels }}"
      ansible.builtin.assert:
        that:
          - _ps_secret.resources | length == 1
          - _labels['osac.openshift.io/tenant'] == 'ps-new'
          - _labels['osac.openshift.io/pure-realm'] == 'ps-realm'
          - _labels['app.kubernetes.io/managed-by'] == 'osac-aap'
        fail_msg: "Hub Secret labels do not record the Realm claim"
        success_msg: "Hub Secret labels record the Realm claim"

    - name: Assert the hub Secret carries every documented field
      ansible.builtin.assert:
        that:
          - (_ps_secret.resources[0].data | list | sort) ==
            ['api_token', 'mgmt_endpoint', 'nfs_endpoint', 'nfs_policy',
             'nfs_server', 'realm_name', 'storage_provider_type', 'tenant_uid_hash']
        fail_msg: >-
          Hub Secret fields are {{ _ps_secret.resources[0].data | list | sort }}
        success_msg: "Hub Secret carries all eight fields"

    - name: Assert the Realm-qualified resource names were recorded
      ansible.builtin.assert:
        that:
          - (_ps_secret.resources[0].data.realm_name | b64decode) == 'ps-realm'
          - (_ps_secret.resources[0].data.nfs_server | b64decode) == 'ps-realm::nfs-server'
          - (_ps_secret.resources[0].data.nfs_policy | b64decode) == 'ps-realm::export-policy'
        fail_msg: "Hub Secret does not record the Realm-qualified resource names"
        success_msg: "Hub Secret records the Realm-qualified resource names"

    - name: Assert the dispatcher received a populated tenant config
      ansible.builtin.assert:
        that:
          - storage_provider_tenant_configs['be-pure'].realm_name == 'ps-realm'
          - storage_provider_tenant_configs['be-pure'].nfs_server == 'ps-realm::nfs-server'
          - storage_provider_tenant_configs['be-pure'].nfs_policy == 'ps-realm::export-policy'
        fail_msg: >-
          Dispatcher tenant config:
          {{ storage_provider_tenant_configs['be-pure'] | default('absent') }}
        success_msg: "Dispatcher received the pure tenant config"

    # AC-13: the always block clears the credentials it read, so nothing
    # downstream in the same play can leak them.
    - name: Assert the credential facts were cleared after the block
      ansible.builtin.assert:
        that:
          - _pure_api_token == ""
          - _pure_mgmt_endpoint == ""
          - _pure_nfs_endpoint == ""
          # Not endpoints but credentials all the same: _pure_existing_config
          # is a previous onboard's hub Secret with every field decoded, its
          # api_token included, and _pure_existing_secret is the k8s_info result
          # it was read from.
          - _pure_existing_config == {}
          - _pure_existing_secret.resources | default([]) | length == 0
        fail_msg: "Credential facts survived the setup block"
        success_msg: "Credential facts cleared after setup"

- name: "Pure Storage Setup - Verify no filesystem creation"
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Get the mock FlashBlade call log
      ansible.builtin.uri:
        url: "https://127.0.0.1:18444/_calls"
        validate_certs: false
        method: GET
        return_content: true
      register: _ps_calls
      when: not (pure_test_skip_mock_calls | default(false) | bool)

    - name: Assert setup did NOT create filesystems
      vars:
        _creates: >-
          {{ _ps_calls.json | selectattr('method', 'equalto', 'POST')
             | map(attribute='path') | select('search', 'file-systems') | list }}
      ansible.builtin.assert:
        that:
          - _creates | length == 0
        fail_msg: "Setup created filesystems (should not): {{ _creates }}"
        success_msg: "Setup correctly did NOT create filesystems (CSI driver creates on-demand)"
      when: not (pure_test_skip_mock_calls | default(false) | bool)


    # AC-12: the mock redacts token-shaped headers, so a token reaching the
    # call log at all would mean it travelled somewhere it was not redacted.
    - name: Assert the Realm token never appears in the call log
      ansible.builtin.assert:
        that:
          - "'PLACEHOLDER_DO_NOT_USE_realm_token' not in _ps_calls.content"
        fail_msg: "The Realm API token leaked into the mock call log"
        success_msg: "No token material in the call log"
      when: not (pure_test_skip_mock_calls | default(false) | bool)


# ── Re-onboarding an already-provisioned tenant (AC-2) ──
#
# Re-running setup is the design's sanctioned token-rotation path, so the
# idempotency short-circuit must reuse the existing Realm without skipping the
# hub Secret write -- a rotated Realm token has to reach the Secret.
- name: "Pure Storage Setup - Re-onboarding rewrites the Secret"
  hosts: localhost
  gather_facts: false

  vars: *pure_setup_vars

  pre_tasks:
    - name: Isolate this case from facts set by earlier cases
      ansible.builtin.meta: clear_facts

  tasks:
    # A different tenant_uid than the first run: tenant_uid_hash stores its
    # first eight characters, so a run that skips the Secret write keeps the
    # old hash and the assertion below fails.
    - name: Run the setup dispatch for the already-onboarded tenant
      ansible.builtin.include_role:
        name: osac.service.storage_provider
      vars:
        tenant_name: ps-new
        tenant_uid: rerun-uid-ps-new

    - name: Read the hub Secret after the re-run
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: pure-tenant-config-ps-new-be-pure
        namespace: osac-system
      register: _ps_secret_rerun

    # The Secret write is what rotates the token, so it must still happen on a
    # run that provisions nothing. Asserting the full field set catches a
    # short-circuit that skips the write and leaves the first run's Secret.
    - name: Assert the re-run rewrote a complete hub Secret
      ansible.builtin.assert:
        that:
          - (_ps_secret_rerun.resources[0].data | list | sort) ==
            ['api_token', 'mgmt_endpoint', 'nfs_endpoint', 'nfs_policy',
             'nfs_server', 'realm_name', 'storage_provider_type', 'tenant_uid_hash']
          - (_ps_secret_rerun.resources[0].data.realm_name | b64decode) == 'ps-realm'
          - (_ps_secret_rerun.resources[0].data.nfs_server | b64decode) == 'ps-realm::nfs-server'
          - (_ps_secret_rerun.resources[0].data.nfs_policy | b64decode) == 'ps-realm::export-policy'
          - (_ps_secret_rerun.resources[0].data.tenant_uid_hash | b64decode) == 'rerun-ui'
        fail_msg: >-
          Hub Secret after re-onboarding:
          {{ _ps_secret_rerun.resources[0].data | list | sort }}
        success_msg: "Re-onboarding rewrote the full hub Secret"

    - name: Assert the dispatcher still received the tenant config
      ansible.builtin.assert:
        that:
          - storage_provider_tenant_configs['be-pure'].realm_name == 'ps-realm'
          - storage_provider_tenant_configs['be-pure'].nfs_server == 'ps-realm::nfs-server'
          - storage_provider_tenant_configs['be-pure'].nfs_policy == 'ps-realm::export-policy'
        fail_msg: >-
          Dispatcher tenant config after re-onboarding:
          {{ storage_provider_tenant_configs['be-pure'] | default('absent') }}
        success_msg: "Re-onboarding returned the tenant config to the dispatcher"

# ── Rollback before the Realm is selected must not touch the Secret (AC-11) ──
#
# The dangerous case is a failure before select_realm has read the tenant's
# Secret -- a lease that times out, a mistyped PURE_REALM_POOL -- because the
# rescue then runs with nothing recording that the tenant was already
# onboarded. Deleting the Secret there would release the Realm to the next
# tenant while this tenant's filesystems still exist on it. A pool entry
# missing secret_name is used as the trigger: pool validation is the last step
# before the Secret is read, so it fails on the far side of that boundary.
#
# An empty pool would not do: for an already-onboarded tenant the reuse branch
# reads the Secret first and fails later, with _pure_secret_preexisting already
# true -- the safe side of the same boundary.
- name: "Pure Storage Setup - A failure before Realm selection keeps the Secret"
  hosts: localhost
  gather_facts: false

  vars: *pure_setup_vars

  pre_tasks:
    - name: Isolate this case from facts set by earlier cases
      ansible.builtin.meta: clear_facts

  tasks:
    # ps-new is onboarded and holds a complete hub Secret from the plays above.
    - name: Corrupt the Realm pool with an incomplete entry
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: pure-realm-pool
            namespace: "{{ pure_storage_config_namespace }}"
          data:
            PURE_REALM_POOL: >-
              [{"realm_name": "ps-realm", "secret_name": "pure-realm-ps-realm"},
               {"realm_name": "ps-realm-typo"}]

    - name: Run the setup dispatch against a malformed pool
      block:
        - name: Dispatch setup for an onboarded tenant with a malformed pool
          ansible.builtin.include_role:
            name: osac.service.storage_provider
          vars:
            tenant_name: ps-new
            tenant_uid: test-uid-ps-new

        - name: Fail the test if setup succeeded on a malformed pool
          ansible.builtin.fail:
            msg: "Setup succeeded with an incomplete Realm pool entry"

      rescue:
        - name: Assert the run failed on the pool, before the tenant Secret was read
          ansible.builtin.assert:
            that:
              # The role's rescue reports a failed loop as "One or more items
              # failed" and drops the per-item message, so assert on the task
              # that failed instead.
              - ansible_failed_result.msg is search(
                  'Check each Realm pool entry has required fields')
            fail_msg: "Unexpected failure: {{ ansible_failed_result.msg | default('') }}"
            success_msg: "Failed on pool validation, before the Secret was read"

      always:
        - name: Restore the valid Realm pool
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: pure-realm-pool
                namespace: "{{ pure_storage_config_namespace }}"
              data:
                PURE_REALM_POOL: >-
                  [{"realm_name": "ps-realm",
                    "secret_name": "pure-realm-ps-realm"}]

    - name: Read the onboarded tenant's hub Secret after the failed run
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: pure-tenant-config-ps-new-be-pure
        namespace: osac-system
      register: _ps_untouched

    - name: Assert the onboarded tenant's Secret and Realm claim survived
      ansible.builtin.assert:
        that:
          - _ps_untouched.resources | length == 1
          - (_ps_untouched.resources[0].data.realm_name | b64decode) == 'ps-realm'
          - _ps_untouched.resources[0].metadata.labels['osac.openshift.io/pure-realm'] == 'ps-realm'
        fail_msg: >-
          Rollback deleted the hub Secret of an already-onboarded tenant after a
          failure that never reached Realm selection, releasing its Realm
        success_msg: "An early failure left the onboarded tenant's Secret intact"

# ── Rollback with no pre-existing Secret: no Realm claim may survive ──
# Since setup no longer creates filesystems, we test rollback by triggering
# a failure during Realm pool validation (simpler than the old filesystem
# creation failure path).
- name: "Pure Storage Setup - A failed onboard leaves no Realm claim"
  hosts: localhost
  gather_facts: false

  vars: *pure_setup_vars

  pre_tasks:
    - name: Isolate this case from facts set by earlier cases
      ansible.builtin.meta: clear_facts

  tasks:
    # Remove ps-new's Secret so the pool has an available Realm for ps-roll
    - name: Remove the hub Secret so this tenant onboards fresh
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Secret
        name: "{{ item }}"
        namespace: osac-system
      loop:
        - pure-tenant-config-ps-roll-be-pure
        - pure-tenant-config-ps-new-be-pure

    - name: Corrupt the Realm pool with an entry missing secret_name
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: pure-realm-pool
            namespace: "{{ pure_storage_config_namespace }}"
          data:
            PURE_REALM_POOL: '[{"realm_name":"ps-realm-invalid"}]'

    - name: Run the setup dispatch with an invalid pool and expect it to fail
      block:
        - name: Dispatch setup with malformed Realm pool
          ansible.builtin.include_role:
            name: osac.service.storage_provider
          vars:
            tenant_name: ps-roll
            tenant_uid: test-uid-ps-roll

        - name: Fail the test if setup succeeded with invalid pool
          ansible.builtin.fail:
            msg: "Setup succeeded despite invalid Realm pool"

      rescue:
        - name: Assert the failure was due to pool validation
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search(
                  'Check each Realm pool entry has required fields')
            fail_msg: "Unexpected failure: {{ ansible_failed_result.msg | default('') }}"
            success_msg: "Setup failed on pool validation as expected"

      always:
        - name: Restore the valid Realm pool
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: pure-realm-pool
                namespace: "{{ pure_storage_config_namespace }}"
              data:
                PURE_REALM_POOL: >-
                  [{"realm_name": "ps-realm",
                    "secret_name": "pure-realm-ps-realm"}]

    - name: Look for a hub Secret after rollback
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: pure-tenant-config-ps-roll-be-pure
        namespace: osac-system
      register: _ps_rolled_back

    - name: Assert the failed onboard left no hub Secret claiming the Realm
      ansible.builtin.assert:
        that:
          - _ps_rolled_back.resources | length == 0
        fail_msg: "Rollback left a hub Secret behind, claiming the Realm for a tenant with no storage"
        success_msg: "The failed onboard left no Realm claim behind"

# ── Rollback with a pre-existing Secret: it must survive (AC-11) ──
- name: "Pure Storage Setup - Rollback preserves a pre-existing Secret"
  hosts: localhost
  gather_facts: false

  vars: *pure_setup_vars

  pre_tasks:
    # Facts persist across plays for the same host; without this a rescue in a
    # later play would act on the filesystem list a previous play left behind.
    - name: Isolate this case from facts set by earlier cases
      ansible.builtin.meta: clear_facts

  tasks:
    # A re-onboard skips provisioning entirely, so the array cannot be the
    # source of the failure. Recording the Realm without the resource names it
    # was supposed to carry -- a Secret edited or truncated out of band -- fails
    # the reuse step instead, which is after _pure_secret_preexisting is true.
    - name: Record a damaged earlier onboard
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: pure-tenant-config-ps-existing-be-pure
            namespace: osac-system
            labels:
              osac.openshift.io/tenant: ps-existing
              osac.openshift.io/pure-realm: ps-realm
              app.kubernetes.io/managed-by: osac-aap
          stringData:
            storage_provider_type: pure
            realm_name: ps-realm

    - name: Run the setup dispatch for the re-onboarding tenant
      block:
        - name: Dispatch setup for a tenant that already holds the Realm
          ansible.builtin.include_role:
            name: osac.service.storage_provider
          vars:
            tenant_name: ps-existing
            tenant_uid: test-uid-ps-existing

        - name: Fail the test if setup accepted the damaged allocation
          ansible.builtin.fail:
            msg: "Setup succeeded despite a damaged pre-existing allocation"

      rescue:
        - name: Assert the failure came from the reuse validation
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search(
                  'Verify existing allocation has required fields')
              - ansible_failed_result.msg is search('missing required fields')
            fail_msg: "Unexpected failure: {{ ansible_failed_result.msg | default('') }}"
            success_msg: "Failed on the existing allocation's required fields"

    - name: Read the pre-existing hub Secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: pure-tenant-config-ps-existing-be-pure
        namespace: osac-system
      register: _ps_preexisting

    - name: Assert the pre-existing Secret survived
      ansible.builtin.assert:
        that:
          - _ps_preexisting.resources | length == 1
          - (_ps_preexisting.resources[0].data.realm_name | b64decode) == 'ps-realm'
        fail_msg: >-
          Rollback deleted a hub Secret it did not create, releasing the Realm
          while the tenant's filesystems still exist
        success_msg: "Pre-existing hub Secret survived rollback"

    # Realm-owned resources (server, export policy) are pre-provisioned and
    # shared by all tenants. Setup does not create or delete them.
    - name: Read the Realm's NFS server and export policy from the mock
      ansible.builtin.uri:
        url: "https://127.0.0.1:18444/api/2.26/{{ item }}"
        validate_certs: false
        method: GET
        return_content: true
      register: _ps_realm_resources
      loop:
        - servers
        - nfs-export-policies
      when: not (pure_test_skip_mock_calls | default(false) | bool)

    # Subscript, not dot: Jinja resolves .items to the dict method rather than
    # to the response's items key, and a method is not iterable.
    - name: Assert the Realm's shared resources were not touched
      ansible.builtin.assert:
        that:
          - _ps_realm_resources.results[0].json['items']
            | selectattr('name', 'equalto', 'ps-realm::nfs-server') | list | length == 1
          - _ps_realm_resources.results[1].json['items']
            | selectattr('name', 'equalto', 'ps-realm::export-policy') | list | length == 1
        fail_msg: "Setup incorrectly modified Realm-owned resources"
        success_msg: "Realm server and export policy remain untouched (pre-provisioned)"
      when: not (pure_test_skip_mock_calls | default(false) | bool)


# ── Test: Backend scoping ──
- name: "Pure Storage Setup - Backend scoping"
  hosts: localhost
  gather_facts: false

  vars:
    pure_storage_config_namespace: osac-system
    tenant_namespace: osac-system
    storage_provider_action: setup
    storage_provider_provisioning_target: vmaas
    storage_provider_tiers:
      - name: default
        protocol: nfs
        provider: pure
        backend_id: be-pure-b
    storage_provider_backend_connections:
      be-pure-b:
        endpoint: "192.0.2.100"

  pre_tasks:
    - name: Isolate this case from facts set by earlier cases
      ansible.builtin.meta: clear_facts

  tasks:
    - name: Run setup for tenant on backend B
      ansible.builtin.include_role:
        name: osac.service.storage_provider
      vars:
        tenant_name: ps-backend-b
        tenant_uid: test-uid-backend-b

    - name: Read the hub Secret for backend B tenant
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: pure-tenant-config-ps-backend-b-be-pure-b
        namespace: osac-system
      register: _ps_backend_b_secret

    - name: Assert backend B tenant got ps-realm-b (not ps-realm)
      vars:
        _realm: "{{ _ps_backend_b_secret.resources[0].data.realm_name | b64decode }}"
        _endpoint: "{{ _ps_backend_b_secret.resources[0].data.mgmt_endpoint | b64decode }}"
      ansible.builtin.assert:
        that:
          - _realm == 'ps-realm-b'
          - _endpoint == '192.0.2.100'
        fail_msg: >-
          Backend scoping failed: tenant on backend B (192.0.2.100) got realm {{ _realm }}
          with endpoint {{ _endpoint }}, expected ps-realm-b with 192.0.2.100
        success_msg: "Backend scoping works: tenant on backend B got ps-realm-b"


# ── Cleanup ──
- name: "Pure Storage Setup - Cleanup"
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Delete the Secrets this target created
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Secret
        name: "{{ item }}"
        namespace: osac-system
      loop:
        - pure-tenant-config-ps-new-be-pure
        - pure-tenant-config-ps-roll-be-pure
        - pure-tenant-config-ps-existing-be-pure
        - pure-tenant-config-ps-backend-b-be-pure-b
        - pure-realm-ps-realm
        - pure-realm-ps-realm-a2
        - pure-realm-ps-realm-b
      failed_when: false

    - name: Reset the mock FlashBlade for the next target
      ansible.builtin.uri:
        url: "https://127.0.0.1:18444/_reset"
        validate_certs: false
        method: GET
      failed_when: false
      when: not (pure_test_skip_mock_calls | default(false) | bool)


    - name: Leave a valid Realm pool for the next run
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: pure-realm-pool
            namespace: osac-system
          data:
            PURE_REALM_POOL: '[{"realm_name":"ps-realm","secret_name":"pure-realm-ps-realm"}]'
      failed_when: false
