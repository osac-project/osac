---
apiVersion: osac.openshift.io/v1alpha1
kind: ClusterOrder
metadata:
  name: test-cluster
  namespace: osac-system
spec:
  templateID: osac.templates.ocp_small
  templateParameters: |
    {
      "pull_secret": "test-pull-secret-content",
      "ssh_public_key": "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA test@example.com"
    }
  nodeRequests:
    - nodeSet: workers
      numberOfNodes: 1
      bareMetal:
        instanceType: test-class
