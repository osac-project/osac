{{- if .Values.bootstrap.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "osac-aap.fullname" . }}-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-aap.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.bootstrap.backoffLimit }}
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        {{- include "osac-aap.labels" . | nindent 8 }}
    spec:
      initContainers:
      - name: wait-for-aap
        image: {{ .Values.bootstrap.cliImage }}
        command:
          - /bin/bash
          - -c
          - |
            {{- include "osac-aap.waitForAapScript" . | nindent 12 }}
        env:
        - name: HOME
          value: /tmp
        - name: AAP_GATEWAY_HOSTNAME
          value: {{ include "osac-aap.gatewayHostname" . | quote }}
        - name: AAP_CONTROLLER_GATEWAY_HOSTNAME
          value: {{ include "osac-aap.controllerHostname" . | quote }}
        - name: AAP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "osac-aap.instanceName" . }}-admin-password
              key: password
        - name: AAP_READINESS_CONSECUTIVE_SUCCESSES
          value: {{ .Values.bootstrap.readinessConsecutiveSuccesses | quote }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
      containers:
      - name: bootstrap
        image: {{ .Values.bootstrap.image }}
        args:
        - ansible-playbook
        - osac.config_as_code.subscription
        - osac.config_as_code.configure
        envFrom:
        - secretRef:
            name: {{ .Values.configAsCode.secret }}
        env:
        - name: AAP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "osac-aap.instanceName" . }}-admin-password
              key: password
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        volumeMounts:
        - name: config-as-code-manifest-volume
          mountPath: /var/secrets/config-as-code-manifest
          readOnly: true
      volumes:
      - name: config-as-code-manifest-volume
        secret:
          secretName: {{ .Values.configAsCode.manifestSecret }}
      - name: tmp
        emptyDir: {}
      restartPolicy: Never
{{- end }}
