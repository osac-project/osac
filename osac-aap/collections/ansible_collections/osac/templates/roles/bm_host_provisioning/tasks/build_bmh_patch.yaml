---
- name: Build base BMH patch
  ansible.builtin.set_fact:
    bmh_patch:
      spec:
        image:
          url: "{{ ('oci://' ~ bmh_image_url) if (template_params.imageSourceType | default('') == 'registry' and not bmh_image_url.startswith('oci://')) else bmh_image_url }}"
        online: true

- name: Add image format to BMH patch
  when: bmh_image_format | default('') | length > 0
  ansible.builtin.set_fact:
    bmh_patch: >-
      {{ bmh_patch | combine({
           'spec': bmh_patch.spec | combine({
             'image': bmh_patch.spec.image | combine({
               'format': bmh_image_format
             })
           })
         }, recursive=True) }}

- name: Add checksum to BMH patch for non-OCI images
  when: >-
    (bmh_image_format | default('') != 'live-iso')
    and
    (template_params.imageSourceType | default('') != 'registry')
    and
    (template_params.imageSourceType | default('') != '' or not bmh_image_url.startswith('oci://'))
  ansible.builtin.set_fact:
    bmh_patch: >-
      {{ bmh_patch | combine({
           'spec': bmh_patch.spec | combine({
             'image': bmh_patch.spec.image | combine({
               'checksum': template_params.imageChecksum,
               'checksumType': template_params.checksumType
             })
           })
         }, recursive=True) }}

- name: Add networkData to BMH patch
  when: bmh_network_data | default('') | length > 0
  ansible.builtin.set_fact:
    bmh_patch: >-
      {{ bmh_patch | combine({
           'spec': bmh_patch.spec | combine({
             'networkData': {
               'name': bmh_name ~ '-network-data',
               'namespace': bmh_namespace
             }
           })
         }, recursive=True) }}

- name: Add userData to BMH patch
  when: user_data_secret_ref | length > 0
  ansible.builtin.set_fact:
    bmh_patch: >-
      {{ bmh_patch | combine({
           'spec': bmh_patch.spec | combine({
             'userData': {
               'name': bmh_name ~ '-user-data',
               'namespace': bmh_namespace
             }
           })
         }, recursive=True) }}

- name: Add metaData to BMH patch
  when: ssh_key | length > 0
  ansible.builtin.set_fact:
    bmh_patch: >-
      {{ bmh_patch | combine({
           'spec': bmh_patch.spec | combine({
             'metaData': {
               'name': bmh_name ~ '-meta-data',
               'namespace': bmh_namespace
             }
           })
         }, recursive=True) }}
