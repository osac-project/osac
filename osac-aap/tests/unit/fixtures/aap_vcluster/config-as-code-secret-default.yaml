---
# Source: osac-aap/templates/config-as-code-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: config-as-code-ig
  namespace: default
  labels:
    helm.sh/chart: osac-aap-0.0.0
    app.kubernetes.io/name: osac-aap
    app.kubernetes.io/instance: aap-test
    app.kubernetes.io/managed-by: Helm
stringData:
  AAP_ADDON_OPERATOR_MAX_CONCURRENT_JOBS: "50"
  AAP_CONFIG_AS_CODE_SECRET: "config-as-code-ig"
  AAP_OSAC_SERVICE_ACCOUNT: "osac-sa"
  # The hourly config-as-code rerun logs in with the same admin-password Secret
  # the bootstrap job reads: the bundled instance's <instance>-admin-password,
  # or bootstrap.adminPasswordSecret for an external AAP. Its pod spec reads
  # these two names (controller.yml) instead of a fixed Secret name.
  AAP_ADMIN_PASSWORD_SECRET_NAME: "osac-aap-admin-password"
  AAP_ADMIN_PASSWORD_SECRET_KEY: "password"
  OSAC_PUBLISH_TEMPLATES_ENABLED: "false"
