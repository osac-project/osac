fullnameOverride: "bmf-operator"

image:
  repository: ghcr.io/osac-project/bare-metal-fulfillment-operator
  tag: latest  # PLACEHOLDER -- overwritten at release time by osac-build-and-publish.yaml
  pullPolicy: Always

replicaCount: 1

validation:
  cliImage: "quay.io/openshift/origin-cli:4.20.0"

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

serviceAccount:
  create: true
  name: ""

secrets:
  inventoryConfig: "osac-inventory-config"
  managementConfig: "osac-management-config"
  osClouds: "osac-os-clouds"
  bcmCerts: "osac-bcm-certs"
  netboxToken: "osac-netbox-token"
  netboxCA: "osac-netbox-ca"

configMaps:
  profiles: "osac-profiles"

env:
  aapUrl: ""
  aapTokenSecretName: "osac-aap-api-token"
  aapTokenSecretKey: "token"
  aapInsecureSkipVerify: ""
  enableNetworkingProvisioning: "false"

secretAPI:
  url: "https://fulfillment-internal-api:8001"
  # Must match the OIDC issuer configured for the Fulfillment Service.
  issuerUrl: ""
  caBundle:
    configMap: "ca-bundle"
    key: "bundle.pem"

netbox:
  enabled: false
  # BMH namespace used for Metal3 management and BMC Secret RBAC in NetBox mode.
  bmhNamespace: ""
  url: ""
  tokenSecretKey: "token"
  tokenValue: ""
  useExistingTokenSecret: false
  caCert: ""
  allowInsecureHTTP: false

bcm:
  enabled: false
  url: ""
  cert: ""
  key: ""
  caCert: ""
  insecureSkipVerify: false
  hostClass: "bcm"
  bmhNamespace: ""

metal3:
  enabled: false
  # Namespace used when Metal3 is the inventory backend. NetBox configures its
  # Metal3 management namespace under netbox.bmhNamespace.
  namespace: ""
  hostClass: "metal3"
