---
# Integration test for setup rescue/rollback path.
# Injects a failure on view creation so setup hits the rescue block,
# which calls delete_qos_policy.yaml with _provider_tiers (not _vast_teardown_tiers).
# Verifies the rollback completes without undefined variable errors.
# Requires: mock VMS server on 127.0.0.1:18443, kind cluster with osac-system namespace.

# ── Setup: Clean slate + inject failure ──
- name: "Storage Provider Setup Rollback - Prepare"
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Delete any pre-existing hub Secret
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Secret
        name: "vast-tenant-config-test-rollback-be-test"
        namespace: "osac-system"
      failed_when: false

    - name: Record call log mark (isolate this target's traffic from prior tests)
      ansible.builtin.uri:
        url: "https://127.0.0.1:18443/_calls"
        validate_certs: false
        method: GET
        return_content: true
      register: _pre_calls

    - name: Save call log offset
      ansible.builtin.set_fact:
        _call_log_mark: "{{ _pre_calls.json | length }}"

    - name: Inject failure on manager creation (triggers rescue block)
      ansible.builtin.uri:
        url: "https://127.0.0.1:18443/_inject_failure"
        validate_certs: false
        method: POST
        body_format: json
        body:
          resource: managers
          method: POST
          status: 500
          body:
            error: "injected: simulating manager creation failure"

# ── Test: Setup should fail but rescue should complete cleanly ──
- name: "Storage Provider Setup Rollback - Run setup (expect failure)"
  hosts: localhost
  gather_facts: false

  environment:
    VAST_VIP_POOL_SUPERNET: "10.0.0.0/24"
    OSAC_STORAGE_CONFIG_NAMESPACE: "osac-system"

  vars:
    vast_storage_config_namespace: osac-system
    tenant_name: "test-rollback"
    tenant_namespace: "osac-system"
    tenant_uid: "test-uid-rollback"
    storage_provider_tiers:
      - name: default
        protocol: nfs
        provider: vast
        backend_id: be-test
        # qos_policy intentionally omitted: the role always derives it from the tier
        # name now, discarding any caller-supplied value.
        qos_limits:
          static_limits:
            max_reads_bw_mbps: 100
    storage_provider_backend_connections:
      be-test:
        endpoint: "127.0.0.1:18443"
        username: "admin"
        password: "mock-admin-password"
    storage_provider_action: setup
    storage_provider_provisioning_target: vmaas
    vast_storage_validate_certs: false

  tasks:
    - name: Run setup and capture failure
      block:
        - name: Call storage_provider role with setup action (should fail)
          ansible.builtin.include_role:
            name: osac.service.storage_provider
          vars:
            storage_provider_action: setup

        - name: Fail test if setup unexpectedly succeeded
          ansible.builtin.fail:
            msg: "Setup should have failed due to injected view creation error but succeeded"

      rescue:
        - name: Assert setup failed as expected (rescue block executed)
          ansible.builtin.debug:
            msg: "Setup failed as expected — rescue block executed: {{ ansible_failed_result.msg | default('') }}"

# ── Verify: Rollback cleaned up and no undefined variable crash ──
- name: "Storage Provider Setup Rollback - Verify cleanup"
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Get mock server call log
      ansible.builtin.uri:
        url: "https://127.0.0.1:18443/_calls"
        validate_certs: false
        method: GET
        return_content: true
      register: _mock_calls

    - name: Slice call log to this target's traffic only
      ansible.builtin.set_fact:
        _call_log: "{{ _mock_calls.json[_call_log_mark | int :] }}"

    - name: Assert rollback queried VMS resources for cleanup
      ansible.builtin.assert:
        that:
          - >-
            _call_log | selectattr('path', 'search', 'views.*tenant_id=')
            | selectattr('method', 'equalto', 'GET') | list | length > 0
            or _call_log | selectattr('path', 'search', 'qospolicies.*tenant_id=')
            | selectattr('method', 'equalto', 'GET') | list | length > 0
        fail_msg: "Rollback did not query VMS resources by tenant_id for cleanup"
        success_msg: "Rollback queried VMS resources by tenant_id"

    - name: Assert rollback attempted tenant deletion
      ansible.builtin.assert:
        that:
          - _call_log | selectattr('path', 'search', 'tenants') | selectattr('method', 'equalto', 'DELETE') | list | length > 0
        fail_msg: "Rollback did not attempt tenant deletion"
        success_msg: "Rollback attempted tenant deletion"

    - name: Assert rollback deletes tenant before local provider (correct ordering)
      vars:
        _delete_paths: "{{ _call_log | selectattr('method', 'equalto', 'DELETE') | map(attribute='path') | list }}"
        _tenant_del_paths: "{{ _delete_paths | select('search', 'tenants/') | list }}"
        _lp_del_paths: "{{ _delete_paths | select('search', 'localproviders/') | list }}"
      ansible.builtin.assert:
        that:
          - _tenant_del_paths | length > 0
          - _lp_del_paths | length > 0
          - _delete_paths.index(_tenant_del_paths[0]) < _delete_paths.index(_lp_del_paths[0])
        fail_msg: >-
          Rollback must delete the tenant before the local provider (OSAC-4854).
          DELETE call order: {{ _delete_paths }}
        success_msg: "Correct order: rollback deleted tenant before local provider"

    - name: Assert rollback tenant deletion uses force_remove
      vars:
        _tenant_del_paths: "{{ _call_log | selectattr('method', 'equalto', 'DELETE') | map(attribute='path') | select('search', 'tenants/') | list }}"
      ansible.builtin.assert:
        that:
          - _tenant_del_paths | select('search', 'force_remove') | list | length > 0
        fail_msg: >-
          Rollback tenant DELETE must include force_remove query parameter.
          Tenant DELETE paths: {{ _tenant_del_paths }}
        success_msg: "Correct: rollback tenant deletion uses force_remove"

    # NOTE: this scenario injects the failure on POST /api/managers/, which runs
    # BEFORE setup persists the hub Secret, so this assertion only guards against
    # the Secret being written early — it cannot detect a rollback that fails to
    # delete it. The multi-backend scenario below covers the actual delete, by
    # rolling back over a hub Secret that already exists.
    - name: Verify hub Secret was NOT persisted (failure precedes persistence)
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "vast-tenant-config-test-rollback-be-test"
        namespace: "osac-system"
      register: _hub_secret_check

    - name: Assert hub Secret does not exist after rollback
      ansible.builtin.assert:
        that:
          - _hub_secret_check.resources | length == 0
        fail_msg: "Hub Secret should not exist after setup rollback"
        success_msg: "Hub Secret correctly absent after rollback"

# ── Cleanup ──
- name: "Storage Provider Setup Rollback - Cleanup"
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Delete hub Secret if somehow created
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Secret
        name: "vast-tenant-config-test-rollback-be-test"
        namespace: "osac-system"
      failed_when: false

# ══════════════════════════════════════════════════════════════
# Multi-backend rollback scenario (OSAC-6448): one tenant, two VAST
# backends on two separate arrays. The second backend's setup fails.
#
# Proves two things the single-backend scenario above cannot:
#   1. Rollback actually DELETES the failing backend's hub Secret. The Secret
#      is pre-created here, so its absence afterwards can only be the result of
#      the rollback deleting it.
#   2. Rollback stays scoped to the failing backend: the first backend's hub
#      Secret and its array's VMS resources are left alone.
#
# The pre-created be-b hub Secret carries a manager username but an EMPTY
# password — the "setup got part way and left an unusable Secret" state — so
# create_tenant_manager.yaml does NOT take its idempotency short-circuit and
# still reaches the injected manager-creation failure.
# ══════════════════════════════════════════════════════════════
- name: "Storage Provider Multi-Backend Rollback - Prepare"
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Delete any pre-existing multi-backend rollback Secrets
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Secret
        name: "{{ item }}"
        namespace: "osac-system"
      loop:
        - "vast-tenant-config-test-rbmulti-be-a"
        - "vast-tenant-config-test-rbmulti-be-b"
      failed_when: false

    - name: Pre-create a stale, credential-less hub Secret for backend be-b
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "vast-tenant-config-test-rbmulti-be-b"
            namespace: "osac-system"
            labels:
              app.kubernetes.io/managed-by: osac-aap
              osac.openshift.io/tenant: "test-rbmulti"
              osac.openshift.io/storage-provider: vast
              osac.openshift.io/storage-backend-id: be-b
          type: Opaque
          stringData:
            tenant_uid_hash: "d0f7f176"
            vast_tenant_id: "903"
            vip_pool_name: "pool-array-two"
            vast_endpoint: "127.0.0.1:18445"
            storage_provider_type: "vast"
            tenant_manager_name: "osac-test-rbmulti"
            tenant_manager_username: "osac-test-rbmulti"
            tenant_manager_password: ""

    - name: Confirm the be-b hub Secret exists before the run (fixture precondition)
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "vast-tenant-config-test-rbmulti-be-b"
        namespace: "osac-system"
      register: _rbmulti_pre_secret

    - name: Assert the be-b hub Secret precondition holds
      ansible.builtin.assert:
        that:
          - _rbmulti_pre_secret.resources | length == 1
        fail_msg: >-
          The be-b hub Secret fixture was not created, so its later absence would
          prove nothing about the rollback.
        success_msg: "be-b hub Secret present before the failing run"

    - name: Record call log mark on array one (port 18443)
      ansible.builtin.uri:
        url: "https://127.0.0.1:18443/_calls"
        validate_certs: false
        method: GET
        return_content: true
      register: _rbmulti_pre_calls_a

    - name: Save array-one call log offset
      ansible.builtin.set_fact:
        _rbmulti_mark_a: "{{ _rbmulti_pre_calls_a.json | length }}"

    - name: Record call log mark on array two (port 18445)
      ansible.builtin.uri:
        url: "https://127.0.0.1:18445/_calls"
        validate_certs: false
        method: GET
        return_content: true
      register: _rbmulti_pre_calls_b

    - name: Save array-two call log offset
      ansible.builtin.set_fact:
        _rbmulti_mark_b: "{{ _rbmulti_pre_calls_b.json | length }}"

    - name: Inject manager-creation failure on array two only (port 18445)
      ansible.builtin.uri:
        url: "https://127.0.0.1:18445/_inject_failure"
        validate_certs: false
        method: POST
        body_format: json
        body:
          resource: managers
          method: POST
          status: 500
          body:
            error: "injected: simulating manager creation failure on backend be-b"

- name: "Storage Provider Multi-Backend Rollback - Run setup (expect failure)"
  hosts: localhost
  gather_facts: false

  environment:
    VAST_VIP_POOL_SUPERNET: "10.0.0.0/24"
    OSAC_STORAGE_CONFIG_NAMESPACE: "osac-system"

  vars:
    vast_storage_config_namespace: osac-system
    tenant_name: "test-rbmulti"
    tenant_namespace: "osac-system"
    tenant_uid: "test-uid-rbmulti"
    # Dispatch order is sorted by (provider, backend_id), so be-a runs first and
    # succeeds, then be-b runs and hits the injected failure.
    storage_provider_tiers:
      - name: tier-a
        protocol: nfs
        provider: vast
        backend_id: be-a
      - name: tier-b
        protocol: nfs
        provider: vast
        backend_id: be-b
    storage_provider_backend_connections:
      be-a:
        endpoint: "127.0.0.1:18443"
        username: "admin"
        password: "mock-admin-password"
      be-b:
        endpoint: "127.0.0.1:18445"
        username: "admin"
        password: "mock-admin-password"
    storage_provider_action: setup
    storage_provider_provisioning_target: vmaas
    vast_storage_validate_certs: false

  tasks:
    - name: Run two-backend setup and capture the expected failure
      block:
        - name: Call storage_provider role with setup action (should fail on be-b)
          ansible.builtin.include_role:
            name: osac.service.storage_provider
          vars:
            storage_provider_action: setup

        - name: Fail test if setup unexpectedly succeeded
          ansible.builtin.fail:
            msg: "Setup should have failed for backend be-b but the whole run succeeded"

      rescue:
        - name: Record that setup failed as expected
          ansible.builtin.debug:
            msg: "Setup failed as expected: {{ ansible_failed_result.msg | default('') }}"

- name: "Storage Provider Multi-Backend Rollback - Verify scoping"
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Read the be-b hub Secret after rollback
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "vast-tenant-config-test-rbmulti-be-b"
        namespace: "osac-system"
      register: _rbmulti_secret_b

    - name: Assert rollback deleted the failing backend's hub Secret
      ansible.builtin.assert:
        that:
          - _rbmulti_secret_b.resources | length == 0
        fail_msg: >-
          The be-b hub Secret existed before the run and still exists after it —
          the setup rescue did not delete it.
        success_msg: "Rollback deleted the failing backend's hub Secret"

    - name: Read the be-a hub Secret after rollback
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "vast-tenant-config-test-rbmulti-be-a"
        namespace: "osac-system"
      register: _rbmulti_secret_a

    - name: Assert the surviving backend's hub Secret is untouched
      ansible.builtin.assert:
        that:
          - _rbmulti_secret_a.resources | length == 1
          - _rbmulti_secret_a.resources[0].metadata.labels['osac.openshift.io/storage-backend-id'] == 'be-a'
          - (_rbmulti_secret_a.resources[0].data.tenant_manager_password | b64decode | length) > 0
        fail_msg: >-
          Backend be-a's hub Secret was removed or emptied by backend be-b's
          rollback — rollback is not scoped to the failing backend.
        success_msg: "Rollback left the surviving backend's hub Secret intact"

    - name: Get array-two call log (the failing backend)
      ansible.builtin.uri:
        url: "https://127.0.0.1:18445/_calls"
        validate_certs: false
        method: GET
        return_content: true
      register: _rbmulti_calls_b

    - name: Assert rollback cleaned up on the failing backend's array
      ansible.builtin.assert:
        that:
          - _rbmulti_calls_b.json[_rbmulti_mark_b | int:] | selectattr('method', 'equalto', 'DELETE')
            | map(attribute='path') | select('search', 'tenants/') | list | length > 0
        fail_msg: "Rollback did not attempt tenant deletion on backend be-b's array"
        success_msg: "Rollback cleaned up on the failing backend's array"

    - name: Get array-one call log since the mark (the surviving backend)
      ansible.builtin.uri:
        url: "https://127.0.0.1:18443/_calls"
        validate_certs: false
        method: GET
        return_content: true
      register: _rbmulti_calls_a

    - name: Assert no deletions were issued against the surviving backend's array
      vars:
        _rbmulti_a_window: "{{ _rbmulti_calls_a.json[_rbmulti_mark_a | int:] }}"
      ansible.builtin.assert:
        that:
          - _rbmulti_a_window | selectattr('method', 'equalto', 'DELETE') | list | length == 0
        fail_msg: >-
          Backend be-b's rollback issued DELETE calls against backend be-a's array:
          {{ _rbmulti_a_window | selectattr('method', 'equalto', 'DELETE')
             | map(attribute='path') | list }}
        success_msg: "No collateral deletions on the surviving backend's array"

- name: "Storage Provider Multi-Backend Rollback - Cleanup"
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Delete multi-backend rollback hub Secrets
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Secret
        name: "{{ item }}"
        namespace: "osac-system"
      loop:
        - "vast-tenant-config-test-rbmulti-be-a"
        - "vast-tenant-config-test-rbmulti-be-b"
      failed_when: false

# ══════════════════════════════════════════════════════════════════════════════
# Test: Same-endpoint rollback (critical bug - rollback destroying shared tenant)
# ══════════════════════════════════════════════════════════════════════════════

- name: "Storage Provider Same-Endpoint Rollback - Prepare"
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Reset mock VMS to clear leftover managers from previous runs
      ansible.builtin.uri:
        url: "https://127.0.0.1:18443/_reset"
        method: POST
        validate_certs: false
      failed_when: false

    - name: Inject failure on backend B manager creation
      ansible.builtin.uri:
        url: "https://127.0.0.1:18443/_inject_failure"
        validate_certs: false
        method: POST
        body_format: json
        body:
          resource: managers
          method: POST
          status: 500
          body:
            error: "injected: simulating backend B manager creation failure"

    - name: Delete any leftover same-endpoint rollback hub Secrets
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Secret
        name: "{{ item }}"
        namespace: "osac-system"
      loop:
        - "vast-tenant-config-test-rbsame-be-a"
        - "vast-tenant-config-test-rbsame-be-b"
      failed_when: false

- name: "Storage Provider Same-Endpoint Rollback - Setup backend A"
  hosts: localhost
  gather_facts: false

  environment:
    VAST_VIP_POOL_SUPERNET: "10.0.0.0/24"
    OSAC_STORAGE_CONFIG_NAMESPACE: "osac-system"

  vars:
    _mock_vast_password: "{{ lookup('env', 'MOCK_VAST_PASSWORD') | default('mock-admin-password', true) }}"
    vast_storage_config_namespace: osac-system
    tenant_name: "test-rbsame"
    tenant_namespace: "osac-system"
    tenant_uid: "test-uid-rbsame"
    _cluster_name: "test-cluster"
    storage_provider_tiers:
      - name: tier-a
        protocol: nfs
        provider: vast
        backend_id: be-a
    storage_provider_backend_connections:
      be-a:
        endpoint: "127.0.0.1:18443"
        username: "admin"
        password: "{{ _mock_vast_password }}"
    vast_storage_validate_certs: false

  tasks:
    - name: Setup backend A successfully
      ansible.builtin.include_role:
        name: osac.service.storage_provider
      vars:
        storage_provider_action: setup

- name: "Storage Provider Same-Endpoint Rollback - Force backend B failure"
  hosts: localhost
  gather_facts: false

  environment:
    VAST_VIP_POOL_SUPERNET: "10.0.0.0/24"
    OSAC_STORAGE_CONFIG_NAMESPACE: "osac-system"

  vars:
    _mock_vast_password: "{{ lookup('env', 'MOCK_VAST_PASSWORD') | default('mock-admin-password', true) }}"
    vast_storage_config_namespace: osac-system
    tenant_name: "test-rbsame"
    tenant_namespace: "osac-system"
    tenant_uid: "test-uid-rbsame"
    _cluster_name: "test-cluster"
    storage_provider_tiers:
      - name: tier-b
        protocol: nfs
        provider: vast
        backend_id: be-b
    storage_provider_backend_connections:
      be-b:
        endpoint: "127.0.0.1:18443"
        username: "admin"
        password: "{{ _mock_vast_password }}"
    vast_storage_validate_certs: false

  tasks:
    - name: Record call log mark before failing setup
      ansible.builtin.uri:
        url: "https://127.0.0.1:18443/_calls"
        validate_certs: false
        method: GET
        return_content: true
      register: _rbsame_pre_calls

    - name: Save call log offset
      ansible.builtin.set_fact:
        _rbsame_mark: "{{ _rbsame_pre_calls.json | length }}"

    - name: Attempt backend B setup (expect failure)
      block:
        - name: Run backend B setup
          ansible.builtin.include_role:
            name: osac.service.storage_provider
          vars:
            storage_provider_action: setup

        - name: Setup should have failed but succeeded
          ansible.builtin.fail:
            msg: "Backend B setup should have failed but succeeded"
      rescue:
        - name: Backend B setup failed as expected
          ansible.builtin.debug:
            msg: "Backend B setup failed as expected (rollback ran)"

- name: "Storage Provider Same-Endpoint Rollback - Verify A survives"
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Get call log since backend B failure
      ansible.builtin.uri:
        url: "https://127.0.0.1:18443/_calls"
        validate_certs: false
        method: GET
        return_content: true
      register: _rbsame_calls

    - name: Check for tenant deletions in rollback window
      vars:
        _rbsame_window: "{{ _rbsame_calls.json[_rbsame_mark | int:] }}"
        _tenant_deletes: >-
          {{
            _rbsame_window
            | selectattr('method', 'equalto', 'DELETE')
            | selectattr('path', 'search', 'tenants/')
            | list
          }}
      ansible.builtin.assert:
        that:
          - _tenant_deletes | length == 0
        fail_msg: >-
          Rollback incorrectly deleted shared tenant ({{ _tenant_deletes | length }} DELETE calls found).
          This destroys backend A's working storage!
        success_msg: "Rollback correctly skipped tenant deletion (shared with backend A)"

    - name: Verify backend A's hub Secret still exists
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "vast-tenant-config-test-rbsame-be-a"
        namespace: "osac-system"
      register: _rbsame_hub_a

    - name: Assert backend A hub Secret survived
      ansible.builtin.assert:
        that:
          - _rbsame_hub_a.resources | length == 1
        fail_msg: "Backend A's hub Secret was deleted - should have survived"
        success_msg: "Backend A's hub Secret survived rollback"

    - name: Verify backend B's hub Secret was deleted (rollback cleanup)
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "vast-tenant-config-test-rbsame-be-b"
        namespace: "osac-system"
      register: _rbsame_hub_b

    - name: Assert backend B hub Secret was cleaned up
      ansible.builtin.assert:
        that:
          - _rbsame_hub_b.resources | length == 0
        fail_msg: "Backend B's hub Secret should have been deleted in rollback"
        success_msg: "Backend B's hub Secret correctly deleted"

- name: "Storage Provider Same-Endpoint Rollback - Cleanup"
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Teardown backend A
      block:
        - name: Run backend A teardown
          ansible.builtin.include_role:
            name: osac.service.storage_provider
          vars:
            storage_provider_action: teardown_backend
            tenant_name: "test-rbsame"
            tenant_namespace: "osac-system"
            tenant_uid: "test-uid-rbsame"
            storage_provider_tiers:
              - name: tier-a
                protocol: nfs
                provider: vast
                backend_id: be-a
            storage_provider_backend_connections:
              be-a:
                endpoint: "127.0.0.1:18443"
                username: "admin"
                password: "{{ lookup('env', 'MOCK_VAST_PASSWORD') | default('mock-admin-password', true) }}"
            vast_storage_validate_certs: false
      rescue:
        - name: Cleanup teardown failures are ignored
          ansible.builtin.debug:
            msg: "Backend A teardown failed (cleanup phase - ignored)"

    - name: Delete any remaining Secrets
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Secret
        name: "{{ item }}"
        namespace: "osac-system"
      loop:
        - "vast-tenant-config-test-rbsame-be-a"
        - "vast-tenant-config-test-rbsame-be-b"
      failed_when: false
