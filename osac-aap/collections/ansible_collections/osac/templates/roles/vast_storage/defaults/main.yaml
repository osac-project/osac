---
# VAST-specific defaults — all use vast_storage_ prefix.

# Protocol-to-CSI-driver map used by ensure_csi_operator and ensure_storage_class.
# These must match the CSI driver names registered by the VAST CSI Operator
# (same names as the Helm chart defaults: csi.vastdata.com / block.csi.vastdata.com).
vast_storage_csi_provisioner_map:
  nfs: "csi.vastdata.com"
  block: "block.csi.vastdata.com"

# K8s Secret on hub cluster that stores per-tenant VAST config
vast_storage_tenant_config_secret_prefix: "vast-tenant-config-"

# Namespace for hub-cluster config secrets. Resolution order:
#   1. OSAC_STORAGE_CONFIG_NAMESPACE env var — explicit override via the storage-operations-ig
#      ConfigMap, only needed if the config namespace differs from the IG pod's own namespace.
#   2. The IG pod's own namespace, read from the standard K8s-mounted service account file —
#      always accurate for wherever the pod actually runs, no per-deployment config needed.
# No hardcoded fallback — fail loudly if neither source is available
# rather than silently targeting a wrong namespace.
vast_storage_config_namespace: >-
  {{ lookup('env', 'OSAC_STORAGE_CONFIG_NAMESPACE')
     | default(lookup('file', '/var/run/secrets/kubernetes.io/serviceaccount/namespace', errors='ignore'), true) }}

# TLS certificate validation for VAST VMS API calls.
vast_storage_validate_certs: "{{ lookup('env', 'VAST_VALIDATE_CERTS') | default('true', true) | bool }}"

# API timeout (seconds) passed to the vastdata.vms modules via the vms: connection dict.
vast_storage_api_timeout: 30

# Per-tenant VIP pool, referenced by CONVENTION: osac-<tenant>-vippool.
# OSAC reuses the pool if it already exists (pre-created by the cloud admin or a
# prior run). If it is missing and vast_storage_vip_pool_supernet is set, OSAC
# self-creates a dedicated pool owned by the tenant with a carved IP slice; if
# missing and no supernet is set, onboarding fails with pre-create instructions.
# For block/NVMe the CSI TENANT_ADMIN resolves the pool by name, so it must exist
# and be tenant-visible (OSAC-4260). setup.yaml sets this name per tenant; the
# default documents the convention.
vast_storage_vip_pool_name: "osac-{{ tenant_name }}-vippool"

# Optional DNS-based VIP resolution: when set, StorageClasses use vip_pool_fqdn
# instead of vip_pool_name.
vast_storage_vip_pool_fqdn: "{{ lookup('env', 'VAST_VIP_POOL_FQDN') | default('', true) }}"

# Supernet for self-creating dedicated per-tenant VIP pools (optional). When set,
# tenant N (by VAST tenant_id) gets vast_storage_vip_pool_slice_size addresses at
# offset tenant_id * slice_size within this supernet. Must be a real routable
# range on the VAST data network. Leave empty to require pre-created pools.
vast_storage_vip_pool_supernet: "{{ lookup('env', 'VAST_VIP_POOL_SUPERNET') | default('', true) }}"
vast_storage_vip_pool_slice_size: "{{ lookup('env', 'VAST_VIP_POOL_SLICE_SIZE') | default('4', true) | int }}"

# Optional gateway IPs applied to self-created VIP pools.
vast_storage_vip_pool_gw_ip: "{{ lookup('env', 'VAST_VIP_POOL_GW_IP') | default('', true) }}"
vast_storage_vip_pool_gw_ipv6: "{{ lookup('env', 'VAST_VIP_POOL_GW_IPV6') | default('', true) }}"

# Client IP ranges for tenant NFS access on shared VIP pools.
# Required when using shared (tenant_id=null) VIP pools — VAST resolves the
# tenant by matching the NFS client's source IP against each tenant's ranges.
# Without this, NFS access is denied for non-default tenants.
# Format: JSON array of [start, end] pairs, e.g. '[["10.0.0.1","10.0.0.10"]]'
vast_storage_client_ip_ranges: "{{ lookup('env', 'VAST_CLIENT_IP_RANGES') | default('', true) }}"

# Local provider naming — each tenant gets its own identity provider.
vast_storage_local_provider_prefix: "lp-"

# CSI Operator installation via OLM
vast_storage_csi_operator_namespace: "vast-csi-system"
vast_storage_csi_operator_channel: "stable"
vast_storage_csi_operator_approval: "Automatic"
vast_storage_csi_operator_catalog_source: "certified-operators"
vast_storage_csi_operator_catalog_namespace: "openshift-marketplace"
