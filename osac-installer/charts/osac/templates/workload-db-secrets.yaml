{{- $serviceDb := include "osac.dbNameService" . }}
{{- $meteringDb := include "osac.dbNameMetering" . }}
{{- $dbHost := .Values.dbInit.host | default "postgres.osac-infra.svc.cluster.local" }}
{{/*
Named off osac.pgPrefix (a fixed literal), not osac.fullname: these secret
names are a cross-chart contract with fulfillment-service/osac-metering's
own database.connection values (see values/vmaas-ci/instance.yaml and the
installation guide), which reference them by this literal name directly.
osac.fullname depends on .Chart.Name, which is NOT stable across how this
chart gets packaged/published (the real OCI artifact built via Konflux's
generic build-helm-chart-oci-ta task is named "osac-chart", not "osac" as
in this source tree, breaking that contract) -- same reasoning already
applied to osac.fulfillmentKafkaSecretName's fixed literal.
*/}}
{{- $pgPrefix := include "osac.pgPrefix" . }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $pgPrefix }}-db-client
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
spec:
  issuerRef:
    kind: {{ .Values.service.certs.issuerRef.kind }}
    name: {{ .Values.service.certs.issuerRef.name }}
  commonName: {{ $serviceDb }}
  usages:
  - client auth
  secretName: {{ $pgPrefix }}-db-client-cert
  privateKey:
    encoding: PKCS8
    rotationPolicy: Always
  additionalOutputFormats:
  - type: DER
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $pgPrefix }}-db-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: "postgres://{{ $serviceDb }}@{{ $dbHost }}:5432/{{ $serviceDb }}?sslmode=verify-full&sslrootcert=/etc/fulfillment-grpc-server/db/sslrootcert&sslcert=/etc/fulfillment-grpc-server/db/sslcert&sslkey=/etc/fulfillment-grpc-server/db/sslkey"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $pgPrefix }}-db-metering-client
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
spec:
  issuerRef:
    kind: {{ .Values.service.certs.issuerRef.kind }}
    name: {{ .Values.service.certs.issuerRef.name }}
  commonName: {{ $meteringDb }}
  usages:
  - client auth
  secretName: {{ $pgPrefix }}-db-metering-client-cert
  privateKey:
    encoding: PKCS8
    rotationPolicy: Always
  additionalOutputFormats:
  - type: DER
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $pgPrefix }}-db-metering-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: "postgres://{{ $meteringDb }}@{{ $dbHost }}:5432/{{ $meteringDb }}?sslmode=verify-full&sslrootcert=/etc/metering/db/sslrootcert&sslcert=/etc/metering/db/sslcert&sslkey=/etc/metering/db/sslkey"
