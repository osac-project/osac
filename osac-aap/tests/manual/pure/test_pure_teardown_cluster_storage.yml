---
# Test Pure Storage teardown_cluster_storage.yaml
# Prerequisites: Run test_pure_ensure_sc.yml first to create StorageClasses and CSI Secret
# Tests: StorageClass deletion, CSI Secret deletion, idempotency

- name: Test Pure Storage Teardown Cluster Storage
  hosts: localhost
  gather_facts: false

  vars:
    test_namespace: osac-system
    test_tenant: test-pure-tenant
    test_tenant_uid: test-uid-12345
    test_backend_id: be-pure-test

  tasks:
    - name: Verify StorageClasses exist before teardown
      kubernetes.core.k8s_info:
        api_version: storage.k8s.io/v1
        kind: StorageClass
        label_selectors:
          - "osac.openshift.io/tenant={{ test_tenant }}"
      register: _sc_before

    - name: Show StorageClasses before teardown
      ansible.builtin.debug:
        msg: "StorageClasses before: {{ _sc_before.resources | map(attribute='metadata.name') | list }}"

    - name: Verify CSI Secret exists before teardown
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: pure-csi-secret
        namespace: "{{ test_namespace }}"
      register: _secret_before

    - name: Show CSI Secret status before teardown
      ansible.builtin.debug:
        msg: "CSI Secret exists: {{ _secret_before.resources | length > 0 }}"

    - name: Run teardown_cluster_storage through dispatcher
      ansible.builtin.include_role:
        name: osac.service.storage_provider
      vars:
        storage_provider_action: teardown_cluster_storage
        storage_provider_provisioning_target: vmaas
        tenant_name: "{{ test_tenant }}"
        tenant_uid: "{{ test_tenant_uid }}"
        tenant_namespace: "{{ test_namespace }}"
        storage_provider_tiers:
          - name: default
            protocol: nfs
            provider: pure
            backend_id: "{{ test_backend_id }}"
          - name: fast
            protocol: nfs
            provider: pure
            backend_id: "{{ test_backend_id }}"
        storage_provider_backend_connections:
          "{{ test_backend_id }}":
            endpoint: "10.3.11.50"

    - name: Verify StorageClasses were deleted
      kubernetes.core.k8s_info:
        api_version: storage.k8s.io/v1
        kind: StorageClass
        label_selectors:
          - "osac.openshift.io/tenant={{ test_tenant }}"
      register: _sc_after

    - name: Assert StorageClasses were deleted
      ansible.builtin.assert:
        that:
          - _sc_after.resources | length == 0
        fail_msg: "StorageClasses still exist: {{ _sc_after.resources | map(attribute='metadata.name') | list }}"
        success_msg: "All StorageClasses deleted"

    - name: Verify CSI Secret was deleted
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: pure-csi-secret
        namespace: "{{ test_namespace }}"
      register: _secret_after

    - name: Assert CSI Secret was deleted
      ansible.builtin.assert:
        that:
          - _secret_after.resources | length == 0
        fail_msg: "CSI Secret still exists"
        success_msg: "CSI Secret deleted"

    - name: Test idempotency - run teardown again
      ansible.builtin.include_role:
        name: osac.service.storage_provider
      vars:
        storage_provider_action: teardown_cluster_storage
        storage_provider_provisioning_target: vmaas
        tenant_name: "{{ test_tenant }}"
        tenant_uid: "{{ test_tenant_uid }}"
        tenant_namespace: "{{ test_namespace }}"
        storage_provider_tiers:
          - name: default
            protocol: nfs
            provider: pure
            backend_id: "{{ test_backend_id }}"
        storage_provider_backend_connections:
          "{{ test_backend_id }}":
            endpoint: "10.3.11.50"

    - name: Verify resources still deleted after second run
      kubernetes.core.k8s_info:
        api_version: storage.k8s.io/v1
        kind: StorageClass
        label_selectors:
          - "osac.openshift.io/tenant={{ test_tenant }}"
      register: _sc_final

    - name: Assert idempotency
      ansible.builtin.assert:
        that:
          - _sc_final.resources | length == 0
        fail_msg: "Idempotency failed"
        success_msg: "Idempotency: second teardown succeeded"

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════"
          - "TEARDOWN_CLUSTER_STORAGE TEST PASSED"
          - "   - StorageClasses deleted from cluster"
          - "   - CSI Secret deleted from tenant namespace"
          - "   - Idempotent (second run succeeded)"
          - "   - Backend resources untouched (hub Secret preserved)"
          - "════════════════════════════════════════"
