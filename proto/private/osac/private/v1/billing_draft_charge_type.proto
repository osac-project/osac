syntax = "proto3";

package osac.private.v1;

import "buf/validate/validate.proto";
import "cleanapi/cleanapi.proto";

option (cleanapi.file).package = "osac.public.v1";

// BillingDraftCharge is one provider-calculated charge that has not yet been
// finalized on an invoice.
// buf:lint:ignore OSAC_OBJECT_SHAPE
message BillingDraftCharge {
  // Opaque identifier for this draft charge.
  string id = 1 [(buf.validate.field).string = {min_len: 1}];
  // Human-readable description supplied by the provider.
  string description = 2;
  // OSAC service associated with the charge, when known.
  string service = 3;
  // OSAC project and resource attribution, when supplied by the provider.
  optional string project_id = 4;
  optional string resource_id = 5;
  // Provider-calculated amount and its currency.
  string amount = 6 [(buf.validate.field).string = {min_len: 1}];
  string currency_code = 7 [(buf.validate.field).string = {len: 3}];
  // Billing period covered by this charge, in YYYY-MM-DD format.
  string period_start = 8;
  string period_end = 9;
}
