# Kind dev environment -- infrastructure values for osac-infra chart.
# cert-manager, trust-manager, envoy gateway, and Strimzi are installed as
# separate Helm releases by the root Makefile (install-infra).
# This values file configures the infra chart templates only.

# --- Disable OLM subscription templates (not available in Kind) ---
certManager:
  enabled: false
trustManager:
  enabled: false
aapOperator:
  enabled: false
cnv:
  enabled: false
lvms:
  enabled: false
metallb:
  enabled: false
mce:
  enabled: false
kafka:
  enabled: true
  replicas: 1
  storage:
    size: 10Gi

# --- Envoy Gateway resources (Gateway, GatewayClass, EnvoyProxy) ---
envoygateway:
  resources: true
  httpNodePort: 30080
  httpsNodePort: 30443

# --- Bundled PostgreSQL ---
bundledPostgres:
  enabled: true

# --- Bundled OpenBao ---
# Single-pod ephemeral Vault-compatible secret store for testing. Dev mode --
# data is lost on restart. Not for production.
bundledVault:
  enabled: true
  devRootToken: "dev-root-token"
  keycloakIssuerUrl: "https://keycloak.keycloak.svc.cluster.local:8443/realms/osac"

# --- CA issuer ---
caIssuer:
  enabled: true

# --- Keycloak ---
keycloak:
  enabled: true
  hostname: "https://keycloak.keycloak.svc.cluster.local:8443"
  extraPort: 8443
  # Kind/IT only: seed known passwords for the realm's built-in test users.
  devFixtures:
    enabled: true

# --- Fake CRDs (HyperShift, OVN-K stubs for controllers) ---
fakeCrds:
  enabled: true

# --- CoreDNS *.localhost rewrite ---
coredns:
  localhostRewrite: true
