---
- name: Get noncredential template parameters from cluster order
  ansible.builtin.set_fact:
    cluster_settings_template_parameters: "{{ cluster_order.spec.templateParameters | default('{}') | from_json }}"
  no_log: true

- name: Require a reference and reject inline pull-secret inputs
  ansible.builtin.assert:
    that:
      - cluster_order.spec.pullSecretRef.name | default('') | length > 0
      - cluster_order.spec.pullSecret | default('') | length == 0
      - "'pull_secret' not in cluster_settings_template_parameters"
    fail_msg: Cluster provisioning requires an API pull-secret reference; inline credentials are unsupported
  no_log: true

- name: Resolve public SSH key from API fields or template parameters
  ansible.builtin.set_fact:
    cluster_settings_ssh_public_key: >-
      {{ cluster_order.spec.sshPublicKey
         | default(cluster_settings_template_parameters.ssh_public_key | default('', true), true) }}
  no_log: true

- name: Resolve release image from API fields or template parameters
  when: >-
    (cluster_order.spec.releaseImage | default('', true) | length > 0)
    or (cluster_settings_template_parameters.release_image | default('', true) | length > 0)
  ansible.builtin.set_fact:
    ocp_release_image: >-
      {{ cluster_order.spec.releaseImage
         | default(cluster_settings_template_parameters.release_image | default('', true), true) }}
  no_log: true

- name: Resolve pod CIDR from explicit field
  when: ((cluster_order.spec.network | default({}, true)).podCIDR | default('') | length > 0)
  ansible.builtin.set_fact:
    cluster_settings_pod_cidr: "{{ cluster_order.spec.network.podCIDR }}"

- name: Resolve service CIDR from explicit field
  when: ((cluster_order.spec.network | default({}, true)).serviceCIDR | default('') | length > 0)
  ansible.builtin.set_fact:
    cluster_settings_service_cidr: "{{ cluster_order.spec.network.serviceCIDR }}"

- name: Set reference-only template settings
  ansible.builtin.set_fact:
    cluster_settings_pull_secret_name: "pullsecret-cluster-{{ cluster_order.metadata.name }}"
    template_parameters: >-
      {{ cluster_settings_template_parameters | combine({'ssh_public_key': cluster_settings_ssh_public_key}) }}
  no_log: true
