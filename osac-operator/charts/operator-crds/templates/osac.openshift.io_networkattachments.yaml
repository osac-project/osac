{{- if .Values.install }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    "helm.sh/resource-policy": keep
    controller-gen.kubebuilder.io/version: v0.20.0
  name: networkattachments.osac.openshift.io
spec:
  group: osac.openshift.io
  names:
    kind: NetworkAttachment
    listKind: NetworkAttachmentList
    plural: networkattachments
    shortNames:
    - na
    singular: networkattachment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.target.kind
      name: Kind
      type: string
    - jsonPath: .spec.target.id
      name: Target
      type: string
    - jsonPath: .spec.subnet
      name: Subnet
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NetworkAttachment is OSAC's hub CR for one workload interface's attachment
          to one Subnet and its SecurityGroups. Its name is
          <lowercase target kind>-<target API ID>, it lives in the hub networking
          namespace and carries the osac.openshift.io/tenant annotation. It is not a
          fulfillment API resource.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of NetworkAttachment
            properties:
              interface:
                description: Interface is the attached workload interface.
                properties:
                  macAddress:
                    description: MACAddress is the host interface MAC address, lowercase
                      and colon-separated (physical only).
                    type: string
                    x-kubernetes-validations:
                    - message: macAddress must be a lowercase colon-separated MAC
                        address
                      rule: self.matches('^[0-9a-f]{2}(:[0-9a-f]{2}){5}$')
                  name:
                    description: Name is the host interface name (physical only).
                    minLength: 1
                    type: string
                  type:
                    description: Type is the interface type.
                    enum:
                    - overlay
                    - physical
                    type: string
                required:
                - type
                type: object
              securityGroups:
                description: SecurityGroups lists the selected SecurityGroup API IDs.
                items:
                  type: string
                maxItems: 64
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              subnet:
                description: Subnet is the Subnet API ID.
                minLength: 1
                type: string
              target:
                description: Target is the workload.
                properties:
                  id:
                    description: ID is the workload API ID.
                    minLength: 1
                    type: string
                  kind:
                    description: Kind is the workload kind.
                    enum:
                    - ComputeInstance
                    - BareMetalInstance
                    type: string
                required:
                - id
                - kind
                type: object
            required:
            - interface
            - securityGroups
            - subnet
            - target
            type: object
            x-kubernetes-validations:
            - message: spec is immutable after creation
              rule: self == oldSelf
            - message: interface name and macAddress are set exactly for a physical
                interface
              rule: 'self.interface.type == ''physical'' ? has(self.interface.name)
                && has(self.interface.macAddress) : !has(self.interface.name) && !has(self.interface.macAddress)'
            - message: a ComputeInstance has an overlay interface and a BareMetalInstance
                a physical one
              rule: (self.target.kind == 'ComputeInstance') == (self.interface.type
                == 'overlay')
          status:
            description: status defines the observed state of NetworkAttachment
            properties:
              conditions:
                description: Conditions holds the Ready condition of the NetworkAttachment.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              dhcpLease:
                description: DHCPLease is the accepted dhcp_lease result (physical
                  only).
                properties:
                  ipAddress:
                    description: IPAddress is the leased IPv4 address.
                    type: string
                  macAddress:
                    description: MACAddress is the MAC address that holds the lease.
                    type: string
                required:
                - ipAddress
                - macAddress
                type: object
              jobs:
                description: Jobs tracks the latest job per task and manager (contract
                  §4.7).
                items:
                  description: |-
                    NetworkJobStatus tracks the latest AAP job of one task on one manager
                    (contract §4.7 Job tracking). OSAC never removes an entry.
                  properties:
                    attempt:
                      description: Attempt counts the task's launches on this manager.
                      format: int32
                      minimum: 0
                      type: integer
                    jobID:
                      description: JobID is the AAP job ID; empty until AAP returned
                        it.
                      type: string
                    manager:
                      description: Manager is the manager type the task runs on.
                      enum:
                      - fabric
                      - kubernetes
                      - none
                      type: string
                    message:
                      description: |-
                        Message is the job's osac_error message, the AAP failure text, or why
                        OSAC rejected the result; while retrying it also names the next retry time.
                      type: string
                    state:
                      description: State is the state of the latest job.
                      enum:
                      - Running
                      - Retrying
                      - Succeeded
                      - Failed
                      - Cancelled
                      type: string
                    task:
                      description: Task is the task name, for example create_subnet.
                      minLength: 1
                      type: string
                  required:
                  - attempt
                  - manager
                  - state
                  - task
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - task
                - manager
                x-kubernetes-list-type: map
              networkManagers:
                description: NetworkManagers records the managers copied from the
                  Subnet at create.
                properties:
                  fabric:
                    description: Fabric is the Fabric Manager.
                    properties:
                      ansibleRole:
                        description: AnsibleRole is the fully qualified Ansible role
                          of the manager.
                        minLength: 1
                        type: string
                      name:
                        description: Name is the registration name of the manager.
                        minLength: 1
                        type: string
                    required:
                    - ansibleRole
                    - name
                    type: object
                  kubernetes:
                    description: Kubernetes is the OSAC Kubernetes Manager; absent
                      when none is selected.
                    properties:
                      ansibleRole:
                        description: AnsibleRole is the fully qualified Ansible role
                          of the manager.
                        minLength: 1
                        type: string
                      name:
                        description: Name is the registration name of the manager.
                        minLength: 1
                        type: string
                    required:
                    - ansibleRole
                    - name
                    type: object
                type: object
              networkType:
                description: NetworkType records the network type copied from the
                  Subnet; empty without a Kubernetes Manager.
                enum:
                - evpn
                type: string
              taskInput:
                description: TaskInput is the task input stored before the first job
                  (contract §4.5).
                type: object
                x-kubernetes-preserve-unknown-fields: true
              vmAttachment:
                description: VMAttachment is the accepted vm_attachment result (overlay
                  only).
                properties:
                  namespace:
                    description: Namespace is the hub namespace where VMaaS creates
                      the VM.
                    type: string
                required:
                - namespace
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
