---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: clusterorders.osac.openshift.io
spec:
  group: osac.openshift.io
  names:
    kind: ClusterOrder
    listKind: ClusterOrderList
    plural: clusterorders
    shortNames:
    - cord
    singular: clusterorder
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.templateID
      name: Template
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=="ClusterStorageReady")].status
      name: Cluster Storage
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ClusterOrder is the Schema for the clusterorders API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ClusterOrderSpec defines the desired state of ClusterOrder
            properties:
              addOnOperators:
                description: AddOnOperators lists the stable names of operators requested
                  for the cluster.
                items:
                  type: string
                maxItems: 32
                type: array
              network:
                description: Network contains cluster networking configuration.
                properties:
                  podCIDR:
                    description: |-
                      PodCIDR is the CIDR for the cluster's pod network.
                      Defaults to 10.128.0.0/14 if not specified.
                      Coarse format check only — full CIDR validation (e.g. net.ParseCIDR) is done server-side.
                    pattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$
                    type: string
                  serviceCIDR:
                    description: |-
                      ServiceCIDR is the CIDR for the cluster's service network.
                      Defaults to 172.30.0.0/16 if not specified.
                      Coarse format check only — full CIDR validation (e.g. net.ParseCIDR) is done server-side.
                    pattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$
                    type: string
                type: object
              networkAttachment:
                description: |-
                  NetworkAttachment connects this cluster to a tenant subnet.
                  All node sets share the same subnet; the fabric interface for each
                  node set is resolved from the node set's host type.
                  When omitted, the system populates the field from the tenant's
                  default subnet and security groups during creation.
                properties:
                  securityGroupRefs:
                    description: |-
                      SecurityGroupRefs lists SecurityGroup CR names to apply to the cluster's
                      network attachment. All security groups must belong to the same virtual
                      network as the subnet.
                    items:
                      type: string
                    type: array
                  subnetRef:
                    description: |-
                      SubnetRef is the name of the Subnet CR that the cluster connects to.
                      The subnet must be in Ready state at creation time.
                    maxLength: 253
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: subnetRef is immutable
                      rule: self == oldSelf
                required:
                - subnetRef
                type: object
              nodeRequests:
                description: |-
                  NodeRequests defines the types of nodes and number of each type of node that will be used
                  to build the cluster. This value is optional and if not provided will be filled in with template-provided
                  defaults. The selected template may limit what node types you can request.
                items:
                  properties:
                    bareMetal:
                      description: |-
                        BareMetal holds bare-metal-specific configuration for this node set.
                        When set, this node request targets bare-metal workers.
                        Mutually exclusive with future platform variants (e.g. Virtual).
                      properties:
                        instanceType:
                          description: |-
                            InstanceType names the BareMetalInstanceType (hardware profile) for the
                            nodes in this request.
                          minLength: 1
                          type: string
                      required:
                      - instanceType
                      type: object
                    fabricInterface:
                      description: |-
                        FabricInterface is the host NIC name used for tenant network traffic.
                        When set, IP discovery filters Agent inventory interfaces by this name,
                        preventing the provisioning NIC address from being returned.
                        Resolved from the host type's NetworkInterface list during template
                        expansion; may also be set explicitly.
                      type: string
                    numberOfNodes:
                      description: NumberOfNodes describes the number of nodes you
                        want of the given resource class
                      minimum: 1
                      type: integer
                    resourceClass:
                      description: |-
                        ResourceClass describes the type of node you are requesting.

                        Retained for backward compatibility; superseded by BareMetal.InstanceType and slated
                        for removal in OSAC-4154. New callers should set BareMetal instead.
                      type: string
                  required:
                  - numberOfNodes
                  type: object
                type: array
              pullSecret:
                description: |-
                  PullSecret contains credentials for authenticating to container image repositories.
                  If not provided, the provider's default pull secret is used.
                maxLength: 262144
                type: string
              releaseImage:
                description: |-
                  ReleaseImage is the OCP release image URL that controls the OpenShift version.
                  If not provided, the template's default release image is used.
                maxLength: 512
                pattern: ^.+/.+:.+$
                type: string
              sshPublicKey:
                description: |-
                  SSHPublicKey is an SSH public key installed on cluster worker nodes.
                  If not provided, the provider's default SSH key is used.
                maxLength: 16384
                type: string
              templateID:
                description: TemplateID is the unique identigier of the cluster template
                  to use when creating this cluster
                pattern: ^[a-zA-Z_][a-zA-Z0-9._]*$
                type: string
                x-kubernetes-validations:
                - message: templateID is immutable
                  rule: self == oldSelf
              templateParameters:
                description: |-
                  TemplateParameters is a JSON-encoded map of the parameter values for the
                  selected cluster template.
                type: string
            required:
            - templateID
            type: object
            x-kubernetes-validations:
            - message: addOnOperators is immutable
              rule: has(self.addOnOperators) == has(oldSelf.addOnOperators) && (!has(self.addOnOperators)
                || self.addOnOperators == oldSelf.addOnOperators)
          status:
            description: ClusterOrderStatus defines the observed state of ClusterOrder
            properties:
              apiEndpoint:
                description: |-
                  ApiEndpoint is the internal API server VIP allocated by MetalLB.
                  Written by the CaaS template after VIP discovery.
                type: string
              clusterReference:
                description: Reference to the namespace that contains the HostedCluster
                  resource
                properties:
                  hostedClusterName:
                    type: string
                  namespace:
                    description: Namespace that contains the HostedCluster resource
                    type: string
                  roleBindingName:
                    type: string
                  serviceAccountName:
                    type: string
                required:
                - hostedClusterName
                - namespace
                - roleBindingName
                - serviceAccountName
                type: object
              clusterStorageJobs:
                description: ClusterStorageJobs holds the history of cluster storage
                  provisioning/deprovisioning jobs
                items:
                  description: JobStatus represents the status of a provisioning or
                    deprovisioning job
                  properties:
                    blockDeletionOnFailure:
                      description: |-
                        BlockDeletionOnFailure indicates whether CR deletion should be blocked if this job fails.
                        AAP sets this to true to prevent orphaned cloud resources when deprovisioning fails.
                      type: boolean
                    configVersion:
                      description: |-
                        ConfigVersion is the DesiredConfigVersion at the time this job was triggered.
                        Used to determine retry behavior on failure: if ConfigVersion differs from
                        the current DesiredConfigVersion, a new job is triggered immediately.
                        If they match, the controller retries with exponential backoff.
                      type: string
                    jobID:
                      description: JobID is the AAP job identifier from the provisioning
                        provider API response.
                      type: string
                    message:
                      description: Message provides human-readable status or error
                        information
                      type: string
                    state:
                      description: State is the current state of the job
                      enum:
                      - Pending
                      - Waiting
                      - Running
                      - Succeeded
                      - Failed
                      - Canceled
                      - Unknown
                      type: string
                    target:
                      description: |-
                        Target identifies which manager this job was dispatched to, for resources
                        that provision through multiple managers concurrently (e.g. a Subnet
                        dispatching to both a fabric manager and a k8s manager). Empty for
                        resources with a single provisioning target.
                      type: string
                    timestamp:
                      description: Timestamp when this job was created/triggered
                      format: date-time
                      type: string
                    type:
                      description: Type indicates the operation type
                      enum:
                      - provision
                      - deprovision
                      type: string
                  required:
                  - jobID
                  - state
                  - timestamp
                  - type
                  type: object
                type: array
              conditions:
                description: Conditions holds an array of metav1.Condition that describe
                  the state of the ClusterOrder
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              currentWorkers:
                description: |-
                  CurrentWorkers is the number of workers in a non-terminal phase
                  (Provisioning, WaitingForAgent, Binding, or Ready).
                  Populated by the BareMetalWorkerReconciler.
                format: int32
                type: integer
              desiredConfigVersion:
                description: |-
                  DesiredConfigVersion is a hash of the current spec, used to detect spec changes
                  that require re-provisioning.
                type: string
              desiredWorkers:
                description: |-
                  DesiredWorkers is the total number of workers requested across all node sets.
                  Populated by the BareMetalWorkerReconciler from Workers.
                format: int32
                type: integer
              ingressEndpoint:
                description: |-
                  IngressEndpoint is the internal ingress VIP allocated by MetalLB.
                  Written by the CaaS template after VIP discovery.
                type: string
              nodeRequests:
                description: NodeRequests reflects how many nodes are currently associated
                  with the ClusterOrder
                items:
                  properties:
                    bareMetal:
                      description: |-
                        BareMetal holds bare-metal-specific configuration for this node set.
                        When set, this node request targets bare-metal workers.
                        Mutually exclusive with future platform variants (e.g. Virtual).
                      properties:
                        instanceType:
                          description: |-
                            InstanceType names the BareMetalInstanceType (hardware profile) for the
                            nodes in this request.
                          minLength: 1
                          type: string
                      required:
                      - instanceType
                      type: object
                    fabricInterface:
                      description: |-
                        FabricInterface is the host NIC name used for tenant network traffic.
                        When set, IP discovery filters Agent inventory interfaces by this name,
                        preventing the provisioning NIC address from being returned.
                        Resolved from the host type's NetworkInterface list during template
                        expansion; may also be set explicitly.
                      type: string
                    numberOfNodes:
                      description: NumberOfNodes describes the number of nodes you
                        want of the given resource class
                      minimum: 1
                      type: integer
                    resourceClass:
                      description: |-
                        ResourceClass describes the type of node you are requesting.

                        Retained for backward compatibility; superseded by BareMetal.InstanceType and slated
                        for removal in OSAC-4154. New callers should set BareMetal instead.
                      type: string
                  required:
                  - numberOfNodes
                  type: object
                type: array
              phase:
                description: Phase provides a single-value overview of the state of
                  the ClusterOrder
                enum:
                - Progressing
                - Failed
                - Ready
                - Deleting
                type: string
              provisioningJobs:
                description: |-
                  ProvisioningJobs tracks the history of provision and deprovision operations
                  Ordered chronologically, with latest operations at the end
                  Limited to the last N jobs (configurable via OSAC_MAX_JOB_HISTORY, default 10)
                items:
                  description: JobStatus represents the status of a provisioning or
                    deprovisioning job
                  properties:
                    blockDeletionOnFailure:
                      description: |-
                        BlockDeletionOnFailure indicates whether CR deletion should be blocked if this job fails.
                        AAP sets this to true to prevent orphaned cloud resources when deprovisioning fails.
                      type: boolean
                    configVersion:
                      description: |-
                        ConfigVersion is the DesiredConfigVersion at the time this job was triggered.
                        Used to determine retry behavior on failure: if ConfigVersion differs from
                        the current DesiredConfigVersion, a new job is triggered immediately.
                        If they match, the controller retries with exponential backoff.
                      type: string
                    jobID:
                      description: JobID is the AAP job identifier from the provisioning
                        provider API response.
                      type: string
                    message:
                      description: Message provides human-readable status or error
                        information
                      type: string
                    state:
                      description: State is the current state of the job
                      enum:
                      - Pending
                      - Waiting
                      - Running
                      - Succeeded
                      - Failed
                      - Canceled
                      - Unknown
                      type: string
                    target:
                      description: |-
                        Target identifies which manager this job was dispatched to, for resources
                        that provision through multiple managers concurrently (e.g. a Subnet
                        dispatching to both a fabric manager and a k8s manager). Empty for
                        resources with a single provisioning target.
                      type: string
                    timestamp:
                      description: Timestamp when this job was created/triggered
                      format: date-time
                      type: string
                    type:
                      description: Type indicates the operation type
                      enum:
                      - provision
                      - deprovision
                      type: string
                  required:
                  - jobID
                  - state
                  - timestamp
                  - type
                  type: object
                type: array
              readyWorkers:
                description: |-
                  ReadyWorkers is the number of workers in the Ready phase.
                  Populated by the BareMetalWorkerReconciler.
                format: int32
                type: integer
              workers:
                description: |-
                  Workers holds per-worker lifecycle state for CaaS-managed worker resources.
                  Populated by and owned by the BareMetalWorkerReconciler, which also owns the
                  aggregate counts above.
                items:
                  description: WorkerStatus holds the lifecycle state of a single
                    CaaS-managed worker resource.
                  properties:
                    attemptCount:
                      description: AttemptCount tracks how many times this worker
                        slot has been provisioned.
                      format: int32
                      type: integer
                    creationTimestamp:
                      description: CreationTimestamp is when this worker entry was
                        first created.
                      format: date-time
                      type: string
                    instanceType:
                      description: |-
                        InstanceType is the BareMetalInstanceType (hardware profile) this worker was
                        provisioned from. Exposed as the instance_type metric label; sourced from
                        spec.nodeRequests[].bareMetal.instanceType (not the deprecated resourceClass).
                      type: string
                    kind:
                      description: Kind of the backing resource (e.g. BareMetalInstance).
                      type: string
                    lastFailureMessage:
                      description: LastFailureMessage is a human-readable description
                        of the last failure.
                      type: string
                    lastFailureReason:
                      description: |-
                        LastFailureReason is a machine-readable reason for the last failure
                        (e.g. AgentRegistrationTimeout).
                      type: string
                    lastFailureTime:
                      description: LastFailureTime is when the last failure occurred.
                      format: date-time
                      type: string
                    name:
                      description: Name is the worker slot name (e.g. "bm-cluster-a-worker-0"),
                        unique within the cluster.
                      minLength: 1
                      type: string
                    nextRetryTime:
                      description: NextRetryTime is when the controller will attempt
                        the next retry.
                      format: date-time
                      type: string
                    nodeSet:
                      description: NodeSet identifies which node set this worker belongs
                        to (e.g. "compute", "gpu").
                      type: string
                    phase:
                      description: Phase of the worker lifecycle.
                      enum:
                      - Provisioning
                      - WaitingForAgent
                      - Binding
                      - Ready
                      - Failed
                      - Unbinding
                      - Deleting
                      type: string
                    readySince:
                      description: |-
                        ReadySince is when the worker first transitioned to Ready after the most recent retry.
                        Used to determine when attemptCount can be reset after MinHealthyDuration.
                      format: date-time
                      type: string
                    resourceID:
                      description: ResourceID is the fulfillment-service resource
                        ID of the backing object.
                      type: string
                  required:
                  - attemptCount
                  - creationTimestamp
                  - kind
                  - name
                  - nodeSet
                  - phase
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
