syntax = "proto3";

package osac.public.v1;

import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "osac/public/v1/subscription_type.proto";

// Request for a page of subscriptions.
message SubscriptionsListRequest {
  // Index of the first result. Defaults to zero.
  optional int32 offset = 1;
  // Maximum number of results to return. When omitted, all matches are
  // returned.
  optional int32 limit = 2;
  // CEL expression over `this` (a Subscription, proto field names) and `now`.
  // An empty filter matches all subscriptions.
  optional string filter = 3;
  // Sort key: id, -id, priority, -priority, metadata.name, or
  // -metadata.name. Empty means id ascending.
  optional string order = 4;
}

// Page of subscriptions matching a list request.
message SubscriptionsListResponse {
  // Number of subscriptions in this page.
  int32 size = 1;
  // Total number of subscriptions matching the filter before paging.
  int32 total = 2;
  // Subscriptions in this page.
  repeated Subscription items = 3;
}

// Request for one subscription.
message SubscriptionsGetRequest {
  // Subscription ID (equal to metadata.name).
  string id = 1;
}

// Response containing the subscription and related MaaS state.
message SubscriptionsGetResponse {
  Subscription object = 1;
  // AuthPolicies in the subscription namespace whose modelRefs intersect this
  // subscription's models, including its managed policy when present.
  repeated AuthPolicy auth_policies = 2;
  // MaaSModelRef status for each referenced model that exists.
  repeated ModelRegistration model_registrations = 3;
}

// Request to add a subscription.
message SubscriptionsCreateRequest {
  // Subscription definition. Its ID must match metadata.name.
  Subscription object = 1;
}

// Response containing the subscription and its managed AuthPolicy.
message SubscriptionsCreateResponse {
  Subscription object = 1;
  // MaaSAuthPolicy created with the subscription (<id>-policy).
  AuthPolicy auth_policy = 2;
}

// Request to update selected subscription fields.
message SubscriptionsUpdateRequest {
  // Subscription data containing values for the selected update paths.
  Subscription object = 1;
  // Fields to update. Supported paths include metadata labels and annotations,
  // spec fields, or the entire spec.
  google.protobuf.FieldMask update_mask = 2;
  // If true, reject the update with Aborted when metadata.version is stale.
  bool lock = 3;
}

// Response containing the updated subscription.
message SubscriptionsUpdateResponse {
  Subscription object = 1;
}

// Request to remove a subscription.
message SubscriptionsDeleteRequest {
  // Subscription ID (equal to metadata.name).
  string id = 1;
  // Expected version. When nonzero, delete fails with Aborted unless it
  // matches the current metadata.version. Zero skips the check.
  int32 resource_version = 2;
}

// Empty response returned after the subscription is removed.
message SubscriptionsDeleteResponse {}

// Manages MaaS entitlements and their associated managed AuthPolicies.
service Subscriptions {
  // Lists subscriptions, optionally filtering, ordering, and paging results.
  rpc List(SubscriptionsListRequest) returns (SubscriptionsListResponse) {
    option (google.api.http) = {get: "/api/fulfillment/v1/subscriptions"};
  }

  // Retrieves a subscription, covering auth policies, and model registrations.
  rpc Get(SubscriptionsGetRequest) returns (SubscriptionsGetResponse) {
    option (google.api.http) = {get: "/api/fulfillment/v1/subscriptions/{id}"};
  }

  // Adds a subscription and its managed <id>-policy.
  rpc Create(SubscriptionsCreateRequest) returns (SubscriptionsCreateResponse) {
    option (google.api.http) = {
      post: "/api/fulfillment/v1/subscriptions"
      body: "object"
    };
  }

  // Updates the subscription and its managed policy.
  rpc Update(SubscriptionsUpdateRequest) returns (SubscriptionsUpdateResponse) {
    option (google.api.http) = {
      patch: "/api/fulfillment/v1/subscriptions/{object.id}"
      body: "object"
      response_body: "object"
    };
  }

  // Removes the subscription and its managed policy. MaaS applies the change
  // asynchronously; API access granted only by this subscription is revoked
  // within the five-minute target.
  rpc Delete(SubscriptionsDeleteRequest) returns (SubscriptionsDeleteResponse) {
    option (google.api.http) = {delete: "/api/fulfillment/v1/subscriptions/{id}"};
  }
}
