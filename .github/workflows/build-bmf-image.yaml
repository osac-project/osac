name: Build bare-metal-fulfillment-operator image

# Required check name: Run unit tests (bare-metal-fulfillment-operator)
# No paths on pull_request: a trigger path filter leaves that name pending
# in the merge queue. Skip is on steps. Image build stays gated on should-run.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches:
    - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # Hardcoded rather than github.repository: that now resolves to
  # osac-project/osac for every component's build workflow post-merge,
  # colliding on mutable tags with other components' images. Keeping this
  # component's pre-merge image identity stable instead, same as
  # osac-operator's build-image.yaml and osac-aap's execution-environment.yml do.
  IMAGE_NAME: osac-project/bare-metal-fulfillment-operator


jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # CI_GATING_ENABLED == 'false' is an emergency global override forcing
      # this job to run regardless of the filter result.
      should-run: ${{ vars.CI_GATING_ENABLED == 'false' || (github.event_name != 'pull_request' && github.event_name != 'merge_group') || steps.filter.outputs.build-bare-metal-fulfillment-operator == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        id: filter
        with:
          # Previously missing -- under the default 'someOf' quantifier, a
          # positive pattern plus separate negation entries meant each
          # negation independently OR-matched almost every file. Fixed by
          # migrating to the shared ci-filters.yml, where this filter is
          # written as one brace-alternation entry compatible with 'every'.
          predicate-quantifier: 'every'
          filters: .github/filters/ci-filters.yml

  test:
    name: Run unit tests (bare-metal-fulfillment-operator)
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fail if path filter failed
        if: needs.changes.result != 'success'
        run: exit 1
      - id: should-run
        if: needs.changes.result == 'success' && needs.changes.outputs.should-run == 'true'
        run: echo "run=true" >> "$GITHUB_OUTPUT"
      - name: Checkout repository
        if: steps.should-run.outputs.run
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        if: steps.should-run.outputs.run
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        with:
          go-version-file: 'bare-metal-fulfillment-operator/go.mod'
      - name: Install kind
        if: steps.should-run.outputs.run
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc  # v1
        with:
          install_only: true
      - name: Run unit tests
        if: steps.should-run.outputs.run
        working-directory: bare-metal-fulfillment-operator
        run: make test

  build:
    needs: [changes, test]
    if: >-
      always()
      && needs.changes.result == 'success'
      && needs.changes.outputs.should-run == 'true'
      && needs.test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      operator-digest: ${{ steps.build-operator.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}


      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-operator
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: bare-metal-fulfillment-operator/Containerfile
          push: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Signing gets its own job, granted id-token: write only here, rather than
  # on `build` -- `build` also runs (build-only, no push) on pull_request and
  # merge_group with PR-controlled Containerfile/build context, so it must
  # never hold the OIDC permission that mints Fulcio signing certs.
  sign:
    needs: build
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign image with cosign
        uses: ./.github/actions/cosign-sign-image
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.operator-digest }}
