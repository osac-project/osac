---
# OSAC CSI driver Helm chart install — defaults use this role's own name
# prefix, matching every sibling osac.service role's convention.
# Helm installation is gated by csi_driver_install_enabled (default false).
# When disabled, it skips vendor discovery, lease acquisition, and Helm actions.
# Local StorageClass creation has its own independent opt-in below. Standard
# clusters rely on the osac-installer umbrella chart for CSI driver
# deployment; AAP does not install it during tenant onboarding or VM creation
# to avoid Helm ownership conflicts and lease contention.
csi_driver_install_enabled: false


csi_driver_install_chart_registry: "oci://ghcr.io/osac-project/charts"

# The osac-csi-driver/v0.0.1 release publishes this chart to GHCR.
csi_driver_install_chart_version: "0.0.1"

csi_driver_install_namespace: "osac-csi"
csi_driver_install_backends_namespace: "osac-csi-backends"

# Product routing keys the csi-driver chart can map to its vendor CSI drivers.
# Dispatched providers outside this list are logged and skipped rather than
# failing the whole install.
csi_driver_install_supported_vendors:
  - vast
  - netapp
  - pure

# Provider product key to csi-backends chart vendor key. The product key remains
# the OSAC routing alias; multiple products may share one vendor CSI driver.
csi_driver_install_provider_vendor_names:
  vast: vast
  netapp: trident
  pure: pure

# Per-provider node CSI socket directory, mirroring the csi-driver chart's own
# vendors.<name>.node.socketPath defaults (osac-csi-driver/charts/csi-driver/
# values.yaml). These are chart-version-invariant constants, so the role reads
# them from here instead of fetching the chart's default values over the OCI
# registry on every dispatch. Keep in sync with the chart if a vendor's
# socketPath ever changes there; the role appends '/csi.sock' to each.
csi_driver_install_vendor_node_socket_paths:
  vast: /var/lib/kubelet/plugins/csi.vast.vastdata.com
  netapp: /var/lib/kubelet/plugins/csi.trident.netapp.io
  pure: /var/lib/kubelet/plugins/csi.pure.purestorage.com

# Local-tier StorageClass creation is independent of Helm installation and
# network-vendor enablement: LVMS has no vendor controller Service.
csi_driver_install_lvms_storage_class_enabled: false
# Internal Stage 1 guard: backend setup must defer local StorageClass creation
# until Stage 2 confirms the tenant's storage backend is ready.
csi_driver_install_skip_lvms_storage_class: false
csi_driver_install_local_provider: lvms
csi_driver_install_storage_class_provisioner: csi.osac.openshift.io
csi_driver_install_storage_class_reclaim_policy: Delete
csi_driver_install_storage_class_volume_binding_mode: WaitForFirstConsumer
