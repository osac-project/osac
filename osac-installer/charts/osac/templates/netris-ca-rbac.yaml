{{- if and (eq (toString .Values.global.networking.fabricManager) "netris") (include "osac.netrisCaConfigMapName" .) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "osac.fullname" . }}-netris-ca-read
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: [{{ include "osac.netrisCaConfigMapName" . | quote }}]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "osac.fullname" . }}-netris-ca-read
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "osac.fullname" . }}-netris-ca-read
subjects:
- kind: ServiceAccount
  name: {{ default "osac-sa" .Values.aap.serviceAccounts.osacSa }}
  namespace: {{ .Release.Namespace }}
{{- end }}
