name: Test coverage report

on:
  pull_request:
    paths:
      - "tools/coverage-report/**"
      - "Makefile"
      - ".github/workflows/coverage-report-tests.yml"
  merge_group:

concurrency:
  group: coverage-report-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test-coverage-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # Checks out the coverage report tool and its tests.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install PyYAML
        run: python3 -m pip install pyyaml==6.0.3

      - name: Run coverage report tests
        run: python3 -m unittest discover -s tools/coverage-report/tests
