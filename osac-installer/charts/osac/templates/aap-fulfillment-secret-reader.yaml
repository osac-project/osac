{{- if .Values.service.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: aap-fulfillment-secret-reader
  namespace: {{ .Release.Namespace }}
data:
  OSAC_AAP_SECRET_READER_ISSUER_URL: {{ tpl .Values.service.auth.issuerUrl . | quote }}
  OSAC_AAP_SECRET_READER_API_URL: {{ .Values.aap.configAsCode.fulfillmentInternalApiUrl | quote }}
{{- end }}
