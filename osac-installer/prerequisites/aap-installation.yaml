# These objects are only needed if you don't have AAP installed.
apiVersion: v1
kind: Namespace
metadata:
  name: ansible-aap
  labels:
    openshift.io/cluster-monitoring: "true"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  annotations:
    environment: development
  labels:

    environment: development
  name: dev-ansible-automation-platform-operator
  namespace: ansible-aap
spec: {}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  annotations:
    environment: development
  labels:

    environment: development
  name: dev-ansible-automation-platform
  namespace: ansible-aap
spec:
  channel: stable-2.6-cluster-scoped
  # FIXME(OSAC-5621): installPlanApproval pinned to Manual to prevent
  # auto-upgrade to aap-operator.v2.6.0-0.1789678003+ which ships
  # Automation Controller >=4.7.17. That release (CVE-2026-75884) tightens
  # the pod_spec_override blocklist and breaks OSAC's instance-group
  # secret-mounting patterns. Remove this pin and revert to Automatic once
  # the credential-type migration in OSAC-5621 is complete.
  installPlanApproval: Manual
  name: ansible-automation-platform-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
