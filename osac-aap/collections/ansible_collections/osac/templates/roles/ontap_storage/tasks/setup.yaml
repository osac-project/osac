---
# ONTAP setup: claim pre-provisioned SVMs per dispatched backend.
# The cloud admin pre-provisions per-assignment SVMs, LIFs, accounts, QoS
# policies, and prepared Secrets (netapp-onboarding contract, PR#1553).
# This action only verifies each backend's prepared Secret against the live
# ONTAP cluster and atomically claims the assignment — no ONTAP resources
# are created here. Claim state lives entirely on the prepared Secret's
# annotations, so there is no separate hub lifecycle Secret to maintain.

- name: Include shared tier validation
  ansible.builtin.include_tasks: _validate_tiers.yaml

- name: Validate tenant_name is a valid DNS label
  ansible.builtin.fail:
    msg: >-
      tenant_name '{{ tenant_name }}' is not a valid DNS label.
      Must be 1-63 lowercase alphanumeric characters or hyphens,
      cannot start or end with a hyphen.
  when: tenant_name is not regex('^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$')

- name: Validate tenant_uid is set
  ansible.builtin.fail:
    msg: >-
      tenant_uid must be a non-empty string. The claim stamps it onto the
      prepared Secret so a later recreation of the same tenant name cannot
      silently reuse a retained assignment.
  when: tenant_uid is not defined or tenant_uid | default('') | length == 0

- name: Compute the dispatched backend ids
  ansible.builtin.set_fact:
    _ontap_backend_ids: "{{ _provider_tiers | map(attribute='backend_id') | unique | list }}"

- name: Fail if connection details are missing for a dispatched backend
  ansible.builtin.fail:
    msg: >-
      No entry for backend_id '{{ item }}' in the dispatched backend connections,
      or the entry is missing endpoint, username, or password. osac-operator must
      resolve and pass connection details for every backend_id referenced by the
      tenant's storage tiers.
  loop: "{{ _ontap_backend_ids }}"
  loop_control:
    label: "{{ item }}"
  when: >-
    item not in _provider_backend_connections or
    _provider_backend_connections[item].endpoint is not defined or
    _provider_backend_connections[item].endpoint | default('') | length == 0 or
    _provider_backend_connections[item].username is not defined or
    _provider_backend_connections[item].username | default('') | length == 0 or
    _provider_backend_connections[item].password is not defined or
    _provider_backend_connections[item].password | default('') | length == 0

- name: Initialize the per-backend tenant config accumulator
  ansible.builtin.set_fact:
    _ontap_tenant_configs: {}

- name: Claim the prepared assignment for each dispatched backend
  ansible.builtin.include_tasks: _setup_backend.yaml
  loop: "{{ _ontap_backend_ids }}"
  loop_control:
    loop_var: _ontap_backend_id

- name: Set tenant config output fact
  ansible.builtin.set_fact:
    storage_provider_tenant_config: "{{ _ontap_tenant_configs }}"
