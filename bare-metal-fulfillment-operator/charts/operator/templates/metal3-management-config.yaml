{{- if or .Values.metal3.enabled .Values.netbox.enabled }}
{{- $managementNamespace := "" }}
{{- if .Values.metal3.enabled }}
{{- $managementNamespace = .Values.metal3.namespace }}
{{- else if .Values.netbox.enabled }}
{{- $managementNamespace = .Values.netbox.bmhNamespace }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.managementConfig }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bare-metal-fulfillment-operator.labels" . | nindent 4 }}
type: Opaque
stringData:
  management.yaml: |
    name: metal3-management
    type: metal3
    options:
      metal3:
        namespace: {{ $managementNamespace | quote }}
{{- end }}
