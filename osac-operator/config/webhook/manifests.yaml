---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: osac-operator-validating-webhook-configuration
webhooks:
  - name: vclusterorder.osac.openshift.io
    admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: osac-operator-webhook-service
        namespace: system
        path: /validate-osac-openshift-io-v1alpha1-clusterorder
    failurePolicy: Fail
    rules:
      - apiGroups:
          - osac.openshift.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - clusterorders
    sideEffects: None
