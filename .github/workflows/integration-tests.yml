name: Integration Tests

on:
  pull_request:
    branches:
    - main
  merge_group:
  workflow_dispatch:
  # 2x/day (every 12h). Offset 47 minutes past the hour, not on the hour --
  # GitHub Actions' shared cron scheduler queues everyone's on-the-hour
  # schedules together and can delay/drop them under load (see
  # osac-test-infra's e2e-caas-netris-caller.yml for the same reasoning).
  # Staggered from the other periodic workflows in this repo too, so they
  # don't all land on the same offset simultaneously.
  schedule:
    - cron: '47 */12 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Same ignore list for pull_request and merge_group. schedule /
      # workflow_dispatch always run. Job-level `if:` skip reports success
      # so docs-only PRs (and merge groups) are not blocked.
      should-run: ${{ (github.event_name != 'pull_request' && github.event_name != 'merge_group') || steps.filter.outputs.code == 'true' }}
    steps:
      # dorny/paths-filter uses git diff on merge_group (not the PR Files API),
      # so the repo must be checked out with enough history for base..head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.event_name == 'merge_group'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!**/OWNERS'
              - '!**/LICENSE'
              - '!**/*.md'
              - '!**/docs/**'
              - '!**/.claude/**'
              - '!**/.cursor/**'
              - '!**/.gemini/**'
              - '!.design/**'
              - '!.skillsaw.yaml'
              - '!.pre-commit-config.yaml'

  # fulfillment-service, osac-operator, and bare-metal-fulfillment-operator now
  # all follow the same Kind cluster + root Makefile step sequence (only the
  # go-version-file, integration-test-* target, and diagnostic label selector
  # differ per component); osac-aap uses a distinct Kind cluster + uv/pytest
  # mechanism. These stay separate jobs rather than a matrix for now -- not
  # because there's no shared sequence to parameterize (there increasingly is,
  # for the first three), but that wasn't done here; worth revisiting.
  fulfillment-service:
    name: Run integration test (fulfillment-service)
    needs: changes
    if: needs.changes.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75  # ginkgo --timeout 1h (Makefile) + ~15m for install/setup/log-collection
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-go
      with:
        working-directory: fulfillment-service
    - name: Install Kind
      uses: helm/kind-action@v1
      with:
        install_only: true
    - name: Install Helm
      uses: azure/setup-helm@v4
    - name: Install ginkgo
      run: go install github.com/onsi/ginkgo/v2/ginkgo@v2.32.0  # keep in sync with go.mod's github.com/onsi/ginkgo/v2 version
    - name: Install infrastructure on Kind
      env:
        CONTAINER_TOOL: docker
      run: make -C osac-installer install-infra PLATFORM=kind PROFILE=dev NS=osac
    - name: Run integration tests
      env:
        CONTAINER_TOOL: docker
      run: |
        echo '127.0.0.1 fulfillment-api.osac.svc.cluster.local' | sudo tee -a /etc/hosts
        echo '127.0.0.1 fulfillment-internal-api.osac.svc.cluster.local' | sudo tee -a /etc/hosts
        echo '127.0.0.1 keycloak.keycloak.svc.cluster.local' | sudo tee -a /etc/hosts
        make -C osac-installer test PLATFORM=kind PROFILE=dev NS=osac SUITE=fulfillment
    - name: Collect diagnostic logs
      if: always()
      run: |
        export KUBECONFIG="$HOME/.kube/osac-dev-kind.kubeconfig"
        echo "=== Pods ==="
        kubectl get pods -n osac -o wide
        echo "=== Deployments ==="
        kubectl get deployments -n osac
        echo "=== Operator logs ==="
        kubectl logs -n osac -l control-plane=controller-manager --tail=100
        echo "=== Fulfillment logs ==="
        kubectl logs -n osac -l 'app in (fulfillment-console-proxy,fulfillment-controller,fulfillment-grpc-server,fulfillment-rest-gateway,fulfillment-ingress-proxy)' --tail=100 --all-containers
        echo "=== Events ==="
        kubectl get events -n osac --sort-by='.lastTimestamp' | tail -50
    - if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
      with:
        name: logs
        path: fulfillment-service/logs
        retention-days: 7

  osac-operator:
    name: Run integration test (osac-operator)
    needs: changes
    if: needs.changes.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45  # ginkgo --timeout 30m (Makefile) + ~15m for install/setup/log-collection
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'osac-operator/go.mod'

      - name: Install Kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install ginkgo
        run: go install github.com/onsi/ginkgo/v2/ginkgo@v2.32.0  # keep in sync with go.mod's github.com/onsi/ginkgo/v2 version

      - name: Install infrastructure on Kind
        env:
          CONTAINER_TOOL: docker
        run: make -C osac-installer install-infra PLATFORM=kind PROFILE=dev NS=osac

      - name: Run integration tests
        env:
          CONTAINER_TOOL: docker
        run: make -C osac-installer test PLATFORM=kind PROFILE=dev NS=osac SUITE=operator

      - name: Collect diagnostic logs
        if: always()
        run: |
          export KUBECONFIG="$HOME/.kube/osac-dev-kind.kubeconfig"
          echo "=== Pods ==="
          kubectl get pods -n osac -o wide
          echo "=== Deployments ==="
          kubectl get deployments -n osac
          echo "=== Operator logs ==="
          kubectl logs -n osac -l control-plane=controller-manager --tail=100
          echo "=== Events ==="
          kubectl get events -n osac --sort-by='.lastTimestamp' | tail -50

  bare-metal-fulfillment-operator:
    name: Run integration test (bare-metal-fulfillment-operator)
    needs: changes
    if: needs.changes.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45  # ginkgo --timeout 30m (Makefile) + ~15m for install/setup/log-collection
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'bare-metal-fulfillment-operator/go.mod'

      - name: Install Kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install ginkgo
        run: go install github.com/onsi/ginkgo/v2/ginkgo@v2.32.0  # keep in sync with go.mod's github.com/onsi/ginkgo/v2 version

      - name: Install infrastructure on Kind
        env:
          CONTAINER_TOOL: docker
        run: make -C osac-installer install-infra PLATFORM=kind PROFILE=dev NS=osac

      - name: Run integration tests
        env:
          CONTAINER_TOOL: docker
        run: make -C osac-installer test PLATFORM=kind PROFILE=dev NS=osac SUITE=bmf

      - name: Collect diagnostic logs
        if: always()
        run: |
          export KUBECONFIG="$HOME/.kube/osac-dev-kind.kubeconfig"
          echo "=== Pods ==="
          kubectl get pods -n osac -o wide
          echo "=== Deployments ==="
          kubectl get deployments -n osac
          echo "=== BMF operator logs ==="
          kubectl logs -n osac -l app.kubernetes.io/name=bmf --tail=100
          echo "=== BareMetalPools ==="
          kubectl get baremetalpools -n osac -o yaml
          echo "=== BareMetalInstances ==="
          kubectl get baremetalinstances -n osac -o yaml
          echo "=== BareMetalHosts ==="
          kubectl get baremetalhosts -n osac -o yaml
          echo "=== Events ==="
          kubectl get events -n osac --sort-by='.lastTimestamp' | tail -50

  osac-aap:
    name: Run integration test (osac-aap)
    needs: changes
    if: needs.changes.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: "osac-aap/pyproject.toml"

      - name: Install the project
        working-directory: osac-aap
        run: uv sync --locked --all-extras --group development

      - name: Install Python dependencies for tests
        run: pip install kubernetes openstacksdk

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          cluster_name: osac-test
          install_only: true

      - name: Run integration tests
        working-directory: osac-aap
        run: uv run make test
        env:
          STORAGE_TESTS_ENABLED: "true"

  # osac-installer's own smoke test: deploy the umbrella chart (which
  # composes every other component's chart via file:// dependencies, plus
  # osac-ui's OCI chart dependency) to a local Kind
  # cluster and verify it installs and upgrades idempotently. Distinct from
  # the jobs above, which test one component in isolation -- this is the
  # only place that exercises the umbrella chart's composition of all of
  # them together outside of the heavier OpenShift-based e2e-*-full-install
  # pipelines.
  osac-installer:
    name: Run integration test (osac-installer)
    needs: changes
    if: needs.changes.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      with:
        persist-credentials: false

    - name: Set up Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
      with:
        version: v3.17.0

    - name: Create Kind cluster
      uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc  # v1
      with:
        cluster_name: osac-integration

    - name: Install cert-manager
      run: |
        kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.17.1/cert-manager.yaml
        kubectl wait --for=condition=Available deployment/cert-manager -n cert-manager --timeout=120s
        kubectl wait --for=condition=Available deployment/cert-manager-webhook -n cert-manager --timeout=120s
        kubectl wait --for=condition=Available deployment/cert-manager-cainjector -n cert-manager --timeout=120s

    - name: Build chart dependencies
      working-directory: osac-installer
      run: helm dependency build charts/osac/

    - name: Lint charts
      working-directory: osac-installer
      run: |
        helm lint charts/osac-deps/
        helm lint charts/osac-infra/ --values values/dev/infra.yaml
        helm lint charts/osac/ --values values/dev/instance.yaml \
          --set service.externalHostname=fulfillment-api.osac.svc.cluster.local \
          --set service.internalHostname=fulfillment-internal-api.osac.svc.cluster.local

    - name: Template charts (dry-run validation)
      working-directory: osac-installer
      run: |
        helm template osac-deps charts/osac-deps/ --values values/dev/infra.yaml
        helm template osac-infra charts/osac-infra/ --values values/dev/infra.yaml
        helm template osac charts/osac/ --values values/dev/instance.yaml \
          --set service.externalHostname=fulfillment-api.osac.svc.cluster.local \
          --set service.internalHostname=fulfillment-internal-api.osac.svc.cluster.local

    - name: Deploy charts
      continue-on-error: true
      working-directory: osac-installer
      run: |
        helm install osac-infra charts/osac-infra/ \
          --namespace osac \
          --create-namespace \
          --values values/dev/infra.yaml \
          --timeout 5m \
          --wait
        helm install osac charts/osac/ \
          --namespace osac \
          --values values/dev/instance.yaml \
          --set service.externalHostname=fulfillment-api.osac.svc.cluster.local \
          --set service.internalHostname=fulfillment-internal-api.osac.svc.cluster.local \
          --set validation.enabled=false \
          --set aap.bootstrap.enabled=false \
          --set aap.aap.instance.enabled=false \
          --set dbMigrate.enabled=false \
          --timeout 10m \
          --wait

    - name: Check deployed resources
      if: always()
      run: |
        echo "=== Pods ==="
        kubectl get pods -n osac
        echo "=== Deployments ==="
        kubectl get deployments -n osac
        echo "=== Services ==="
        kubectl get services -n osac
        echo "=== Helm releases ==="
        helm list -n osac

    - name: Test idempotency (helm upgrade with no changes)
      continue-on-error: true
      working-directory: osac-installer
      run: |
        helm upgrade osac charts/osac/ \
          --namespace osac \
          --values values/dev/instance.yaml \
          --set service.externalHostname=fulfillment-api.osac.svc.cluster.local \
          --set service.internalHostname=fulfillment-internal-api.osac.svc.cluster.local \
          --set validation.enabled=false \
          --set aap.bootstrap.enabled=false \
          --set aap.aap.instance.enabled=false \
          --set dbMigrate.enabled=false \
          --timeout 10m \
          --wait
