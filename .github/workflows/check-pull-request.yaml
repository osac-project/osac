name: Check pull request

on:
  workflow_call:

permissions:
  contents: read

jobs:

  # check-pre-commit (fulfillment-service's own .pre-commit-config-ci.yaml) is
  # intentionally removed here: the root pre-commit.yaml workflow now runs the
  # same hook set (trailing-whitespace, yamllint, etc.) repo-wide with
  # correctly component-scoped excludes, making this duplicate redundant.

  check-python-code:
    name: Check Python code
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-python
    - working-directory: fulfillment-service
      run: uv run ruff check

  check-go-code:
    name: Check Go and proto code
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-go
      with:
        working-directory: fulfillment-service
    - uses: ./.github/actions/setup-python
    - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3  # v1
      with:
        version: '1.50.0'
        setup_only: true
    - working-directory: fulfillment-service
      run: |
        uv run dev.py lint

  # check-generated-code (buf generate + diff) now lives in the shared,
  # component-matrixed .github/workflows/check-generated-code.yaml alongside
  # osac-operator's equivalent -- identical steps, only the directory differs.

  build-binaries:
    name: Build binaries
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-go
      with:
        working-directory: fulfillment-service
    - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7
      with:
        workdir: fulfillment-service
        args: build --snapshot --clean
