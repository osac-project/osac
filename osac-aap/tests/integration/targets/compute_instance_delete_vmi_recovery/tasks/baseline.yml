---
# OSAC-6689: Integration tests for stuck VMI recovery during
# ComputeInstance deletion.
#
# Validates nine paths in delete_resources.yaml:
#   1. Normal: VMI absent, VM present — both cleaned up
#      without entering the recovery path.
#   2. Crashed launcher recovery: VMI stuck with deletion
#      timestamp, launcher pod Failed — finalizer removed
#      and VMI deleted.
#   3. Launcher absent recovery: VMI stuck with deletion
#      timestamp, launcher pod already gone — finalizer
#      removed and VMI deleted.
#   4. Recovery refusal: VMI stuck but launcher is still
#      Running — playbook fails to protect data, retaining
#      the finalizer for operator retry.
#   5. Mixed launcher pods: one Failed + one Running —
#      recovery refused because not all launchers are
#      terminal.
#   6. Cross-VMI identity boundary: a Running pod with
#      a mismatched created-by label is excluded by
#      vmi_owned_pods — recovery sees zero owned pods
#      and proceeds; alien pod is untouched.
#   7. No-timestamp refusal: VMI stuck but has no
#      deletionTimestamp — recovery refuses regardless
#      of launcher state. Three sub-cases: no launcher
#      (S7a), Failed launcher (S7b), Running launcher
#      (S7c).
#   8. Owned non-launcher refusal: a Running pod directly
#      controlled by the target VMI (no launcher labels)
#      blocks recovery — proves ownership-based discovery
#      covers non-launcher pods.
#   9. Foreign-controller precedence: a Running pod with
#      a controlling ownerReference to a DIFFERENT real VMI
#      but carrying the target's created-by label does NOT
#      block target VMI recovery.
#
# The post-timeout VMI-already-gone recovery branch is
# structurally checked but is not exercised by this
# controller-disabled integration harness.
#
# The Kind cluster has KubeVirt CRDs (operator scaled to 0),
# so VMI/Pod resources can be created directly.  No real
# virt-launcher or KubeVirt controller runs; the test
# constructs the exact resource states that the recovery
# logic classifies.
#
# Each stuck-VMI scenario overrides the graceful-wait retry
# count (ocp_virt_vm_graceful_wait_retries) to 2 so the
# timeout fires in ~10 s instead of the production 5 min.
# Scenarios pre-create resources in the state that triggers
# recovery and invoke delete_resources.yaml directly, with
# ignore_errors where expected failure is the correct outcome.

# ============================================================
# Scenario 1 — Normal: VMI already absent, no recovery needed
# ============================================================
- name: "Scenario 1: Normal VMI deletion (no recovery)"
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../../common_vars.yml
  vars:
    compute_instance_name: vmi-recovery-normal
    compute_instance_target_namespace: test-subnet
    guest_os_family: linux
    compute_instance:
      spec: {}
  tasks:
    - name: "S1: Run test with cleanup"
      block:
        - name: "S1: Clean up previous resources"
          kubernetes.core.k8s:
            state: absent
            api_version: "{{ item.api }}"
            kind: "{{ item.kind }}"
            name: "{{ item.name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
          loop:
            - api: kubevirt.io/v1
              kind: VirtualMachine
              name: "{{ compute_instance_name }}"
            - api: kubevirt.io/v1
              kind: VirtualMachineInstance
              name: "{{ compute_instance_name }}"
          failed_when: false

        - name: "S1: Create minimal VM fixture"
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: kubevirt.io/v1
              kind: VirtualMachine
              metadata:
                name: "{{ compute_instance_name }}"
                namespace: >-
                  {{
                  compute_instance_target_namespace
                  }}
              spec:
                runStrategy: Always
                template:
                  spec:
                    domain:
                      devices: {}
                      resources:
                        requests:
                          memory: 128Mi

        - name: "S1: Verify VM present, VMI absent"
          kubernetes.core.k8s_info:
            api_version: "{{ item.api }}"
            kind: "{{ item.kind }}"
            name: "{{ compute_instance_name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
          register: _s1_pre
          failed_when: >-
            (item.expect == 'present' and
            _s1_pre.resources | length == 0) or
            (item.expect == 'absent' and
            _s1_pre.resources | length > 0)
          loop:
            - api: kubevirt.io/v1
              kind: VirtualMachine
              expect: present
            - api: kubevirt.io/v1
              kind: VirtualMachineInstance
              expect: absent

        - name: "S1: Run delete_resources"
          ansible.builtin.include_role:
            name: osac.templates.ocp_virt_vm
            tasks_from: delete_resources.yaml

        - name: "S1: Verify VM and VMI absent"
          kubernetes.core.k8s_info:
            api_version: "{{ item.api }}"
            kind: "{{ item.kind }}"
            name: "{{ compute_instance_name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
          register: _s1_post
          failed_when: >-
            _s1_post.resources | length > 0
          loop:
            - api: kubevirt.io/v1
              kind: VirtualMachine
            - api: kubevirt.io/v1
              kind: VirtualMachineInstance

        - name: "S1: Assert normal cleanup succeeded"
          ansible.builtin.debug:
            msg: >-
              Scenario 1 passed: VMI absent, VM
              deleted by normal cleanup path.

      always:
        - name: "S1: Cleanup"
          kubernetes.core.k8s:
            state: absent
            api_version: "{{ item.api }}"
            kind: "{{ item.kind }}"
            name: "{{ item.name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
            delete_options:
              gracePeriodSeconds: 0
          loop:
            - api: kubevirt.io/v1
              kind: VirtualMachine
              name: "{{ compute_instance_name }}"
            - api: kubevirt.io/v1
              kind: VirtualMachineInstance
              name: "{{ compute_instance_name }}"
          failed_when: false

# ============================================================
# Scenario 2 — Crashed launcher: VMI stuck, pod Failed
# ============================================================
- name: "Scenario 2: Crashed launcher recovery"
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../../common_vars.yml
  vars:
    compute_instance_name: vmi-recovery-crashed
    compute_instance_target_namespace: test-subnet
    guest_os_family: linux
    compute_instance:
      spec: {}
    # Override production default (60) to avoid 5-min wait.
    ocp_virt_vm_graceful_wait_retries: 2
  tasks:
    - name: "S2: Run test with cleanup"
      block:
        - name: "S2: Clean up previous test resources"
          kubernetes.core.k8s:
            state: absent
            api_version: "{{ item.api }}"
            kind: "{{ item.kind }}"
            name: "{{ item.name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
          loop:
            - api: kubevirt.io/v1
              kind: VirtualMachine
              name: "{{ compute_instance_name }}"
            - api: kubevirt.io/v1
              kind: VirtualMachineInstance
              name: "{{ compute_instance_name }}"
            - api: v1
              kind: Pod
              name: >-
                virt-launcher-{{
                compute_instance_name }}
            - api: v1
              kind: Service
              name: >-
                {{ compute_instance_name
                }}-load-balancer
            - api: cdi.kubevirt.io/v1beta1
              kind: DataVolume
              name: >-
                {{ compute_instance_name
                }}-root-disk
            - api: v1
              kind: Secret
              name: >-
                {{ compute_instance_name
                }}-cloud-init

        - name: "S2: Create stuck VMI"
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: kubevirt.io/v1
              kind: VirtualMachineInstance
              metadata:
                name: "{{ compute_instance_name }}"
                namespace: >-
                  {{
                  compute_instance_target_namespace
                  }}
                finalizers:
                  - kubevirt.io/foregroundDeleteVirtualMachine
              spec:
                domain:
                  devices: {}
                  resources:
                    requests:
                      memory: 128Mi

        - name: "S2: Request VMI deletion"
          kubernetes.core.k8s:
            state: absent
            api_version: kubevirt.io/v1
            kind: VirtualMachineInstance
            name: "{{ compute_instance_name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
          register: s2_delete_result
          failed_when: false

        - name: "S2: Verify VMI is stuck"
          kubernetes.core.k8s_info:
            api_version: kubevirt.io/v1
            kind: VirtualMachineInstance
            name: "{{ compute_instance_name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
          register: s2_vmi_check
          failed_when: >
            s2_vmi_check.resources | length == 0 or
            (s2_vmi_check.resources[0].metadata.deletionTimestamp
            | default('')) == ''

        - name: "S2: Capture VMI UID for launcher labels"
          ansible.builtin.set_fact:
            _s2_vmi_uid: >-
              {{ s2_vmi_check.resources[0]
                 .metadata.uid }}

        - name: "S2: Create failed launcher pod"
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Pod
              metadata:
                name: >-
                  virt-launcher-{{
                  compute_instance_name }}
                namespace: >-
                  {{
                  compute_instance_target_namespace
                  }}
                ownerReferences:
                  - apiVersion: kubevirt.io/v1
                    kind: VirtualMachineInstance
                    name: "{{ compute_instance_name }}"
                    uid: "{{ _s2_vmi_uid }}"
                    controller: true
                    blockOwnerDeletion: true
                labels:
                  kubevirt.io: virt-launcher
                  kubevirt.io/created-by: >-
                    {{ _s2_vmi_uid }}
                annotations:
                  kubevirt.io/domain: >-
                    {{ compute_instance_name }}
              spec:
                restartPolicy: Never
                containers:
                  - name: compute
                    image: >-
                      registry.k8s.io/pause:3.9
                    command: ["false"]

        - name: "S2: Wait for launcher Failed"
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Pod
            name: >-
              virt-launcher-{{
              compute_instance_name }}
            namespace: >-
              {{ compute_instance_target_namespace }}
          register: s2_launcher_wait
          until: >
            s2_launcher_wait.resources | length > 0 and
            (s2_launcher_wait.resources[0].status.phase
            | default('')) == 'Failed'
          retries: 30
          delay: 2

        - name: "S2: Create minimal VM fixture"
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: kubevirt.io/v1
              kind: VirtualMachine
              metadata:
                name: "{{ compute_instance_name }}"
                namespace: >-
                  {{
                  compute_instance_target_namespace
                  }}
              spec:
                runStrategy: Always
                template:
                  spec:
                    domain:
                      devices: {}
                      resources:
                        requests:
                          memory: 128Mi

        - name: "S2: Create dependent resource fixtures"
          kubernetes.core.k8s:
            state: present
            definition: "{{ item }}"
          loop:
            - apiVersion: v1
              kind: Service
              metadata:
                name: >-
                  {{ compute_instance_name
                  }}-load-balancer
                namespace: >-
                  {{
                  compute_instance_target_namespace
                  }}
              spec:
                ports:
                  - port: 22
                    targetPort: 22
            - apiVersion: cdi.kubevirt.io/v1beta1
              kind: DataVolume
              metadata:
                name: >-
                  {{ compute_instance_name
                  }}-root-disk
                namespace: >-
                  {{
                  compute_instance_target_namespace
                  }}
              spec:
                source:
                  blank: {}
                pvc:
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 1Mi
            - apiVersion: v1
              kind: Secret
              metadata:
                name: >-
                  {{ compute_instance_name
                  }}-cloud-init
                namespace: >-
                  {{
                  compute_instance_target_namespace
                  }}
              type: Opaque
              data:
                userdata: ""

        - name: "S2: Verify fixtures exist"
          kubernetes.core.k8s_info:
            api_version: "{{ item.api }}"
            kind: "{{ item.kind }}"
            name: "{{ item.name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
          register: _s2_fixture_check
          failed_when: >-
            _s2_fixture_check.resources
            | length == 0
          loop:
            - api: v1
              kind: Service
              name: >-
                {{ compute_instance_name
                }}-load-balancer
            - api: cdi.kubevirt.io/v1beta1
              kind: DataVolume
              name: >-
                {{ compute_instance_name
                }}-root-disk
            - api: v1
              kind: Secret
              name: >-
                {{ compute_instance_name
                }}-cloud-init

        - name: "S2: Run delete_resources"
          ansible.builtin.include_role:
            name: osac.templates.ocp_virt_vm
            tasks_from: delete_resources.yaml

        - name: "S2: Verify VMI cleaned up"
          kubernetes.core.k8s_info:
            api_version: kubevirt.io/v1
            kind: VirtualMachineInstance
            name: "{{ compute_instance_name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
          register: s2_vmi_after
          failed_when: >-
            s2_vmi_after.resources | length > 0

        - name: "S2: Verify VM and dependents deleted"
          kubernetes.core.k8s_info:
            api_version: "{{ item.api }}"
            kind: "{{ item.kind }}"
            name: "{{ item.name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
          register: _s2_dep_check
          failed_when: >-
            _s2_dep_check.resources | length > 0
          loop:
            - api: kubevirt.io/v1
              kind: VirtualMachine
              name: "{{ compute_instance_name }}"
            - api: v1
              kind: Service
              name: >-
                {{ compute_instance_name
                }}-load-balancer
            - api: cdi.kubevirt.io/v1beta1
              kind: DataVolume
              name: >-
                {{ compute_instance_name
                }}-root-disk
            - api: v1
              kind: Secret
              name: >-
                {{ compute_instance_name
                }}-cloud-init

        - name: "S2: Assert recovery succeeded"
          ansible.builtin.debug:
            msg: >-
              Scenario 2 passed: crashed launcher VMI
              force-deleted, VM and dependents cleaned
              up successfully.

      always:
        - name: "S2: Read VMI for finalizer removal"
          kubernetes.core.k8s_info:
            api_version: kubevirt.io/v1
            kind: VirtualMachineInstance
            name: "{{ compute_instance_name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
          register: _s2_cleanup_vmi
          failed_when: false

        - name: >-
            S2: Remove foreground-delete finalizer
            for cleanup
          vars:
            _s2_fins: >-
              {{ _s2_cleanup_vmi.resources[0]
                 .metadata.finalizers
                 | default([]) }}
            _s2_target: >-
              kubevirt.io/foregroundDeleteVirtualMachine
          kubernetes.core.k8s_json_patch:
            api_version: kubevirt.io/v1
            kind: VirtualMachineInstance
            name: "{{ compute_instance_name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
            patch:
              - op: test
                path: /metadata/finalizers
                value: "{{ _s2_fins }}"
              - op: replace
                path: /metadata/finalizers
                value: >-
                  {{ _s2_fins
                     | difference([_s2_target]) }}
          when: >-
            _s2_cleanup_vmi.resources | length > 0
            and
            'kubevirt.io/foregroundDeleteVirtualMachine'
            in (_s2_cleanup_vmi.resources[0]
                .metadata.finalizers | default([]))
          failed_when: false

        - name: "S2: Cleanup"
          kubernetes.core.k8s:
            state: absent
            api_version: "{{ item.api }}"
            kind: "{{ item.kind }}"
            name: "{{ item.name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
            delete_options:
              gracePeriodSeconds: 0
          loop:
            - api: kubevirt.io/v1
              kind: VirtualMachine
              name: "{{ compute_instance_name }}"
            - api: kubevirt.io/v1
              kind: VirtualMachineInstance
              name: "{{ compute_instance_name }}"
            - api: v1
              kind: Pod
              name: >-
                virt-launcher-{{
                compute_instance_name }}
            - api: v1
              kind: Service
              name: >-
                {{ compute_instance_name
                }}-load-balancer
            - api: cdi.kubevirt.io/v1beta1
              kind: DataVolume
              name: >-
                {{ compute_instance_name
                }}-root-disk
            - api: v1
              kind: Secret
              name: >-
                {{ compute_instance_name
                }}-cloud-init
          failed_when: false

# ============================================================
# Scenario 3 — Launcher absent: VMI stuck, pod not found
# ============================================================
