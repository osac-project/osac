  detach_external_ip:
    short_description: Delete the DNAT rule of an ExternalIPAttachment
    options:
      osac_job_vars:
        type: dict
        required: true
        description: >-
          Network manager task input (resource and the parents the task needs);
          its content is checked by tasks/_input.yaml.

  create_nat_gateway:
    short_description: Create the SNAT rule of a NATGateway
    options:
      osac_job_vars:
        type: dict
        required: true
        description: >-
          Network manager task input (resource and the parents the task needs);
          its content is checked by tasks/_input.yaml.

  delete_nat_gateway:
    short_description: Delete the SNAT rule of a NATGateway
    options:
      osac_job_vars:
        type: dict
        required: true
        description: >-
          Network manager task input (resource and the parents the task needs);
          its content is checked by tasks/_input.yaml.
