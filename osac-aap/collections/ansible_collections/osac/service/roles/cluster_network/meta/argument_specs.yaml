---
argument_specs:
  main:
    options:
      cluster_network_state:
        type: str
        choices: [present, absent]
      cluster_network_name:
        type: str
        required: true
      cluster_network_namespace:
        type: str
        required: true
      cluster_network_node_requests:
        type: list
        elements: dict
        default: []
      cluster_working_namespace:
        type: str
        required: true
      cluster_order:
        type: dict
        required: true
      cluster_order_label:
        type: str
        required: true
      agent_instance_type_label:
        type: str
        required: true
      default_agent_namespace:
        type: str
        required: true
      cluster_network_infraenv_name:
        type: str
        required: true
        description: "Operator-owned InfraEnv name for this ClusterOrder"
