name: Unit Tests

on:
  pull_request:
    branches:
    - main
  merge_group:
  workflow_dispatch:
  # 2x/day (every 12h). Offset 13 minutes past the hour, not on the hour --
  # GitHub Actions' shared cron scheduler queues everyone's on-the-hour
  # schedules together and can delay/drop them under load (see
  # osac-test-infra's e2e-caas-netris-caller.yml for the same reasoning).
  # Staggered from the other periodic workflows in this repo too, so they
  # don't all land on the same offset simultaneously.
  schedule:
    - cron: '13 */12 * * *'
  # Invoked as a parallel "box" by nightly-build.yaml.
  workflow_call:

permissions:
  contents: read

jobs:

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Same ignore list for pull_request and merge_group. schedule /
      # workflow_dispatch always run. Job-level `if:` skip reports success
      # so docs-only PRs (and merge groups) are not blocked.
      should-run: ${{ (github.event_name != 'pull_request' && github.event_name != 'merge_group') || steps.filter.outputs.code == 'true' }}
      # Per-component narrowing on top of should-run above: a PR touching
      # only e.g. osac-aap/** shouldn't also run fulfillment-service's or
      # osac-metering's unit tests. Same "always true on non-PR/merge_group
      # events" passthrough as should-run, for the same reason (schedule/
      # workflow_dispatch/workflow_call runs skip the filter step entirely,
      # so steps.filter.outputs.* would otherwise be empty, not 'true').
      # Cross-component edges (not just each component's own directory) are
      # real Go module dependencies traced from go.work + each component's
      # go.mod require/replace directives, not guesses -- fulfillment-service
      # imports bare-metal-fulfillment-operator and osac-operator/api,
      # osac-metering/metering-service and osac-metering/adapters both import
      # osac-metering/schema. go.work/go.work.sum are included in every Go
      # component's filter too -- a workspace-level change (Go version bump,
      # a module added/removed from `use`) can affect all of them without
      # touching any single component's own directory. Missing one of these
      # would reproduce exactly the class of bug OSAC-4066 found in graphify
      # ci-select: a real dependency silently absent from the filter, causing
      # a false skip.
      fulfillment-service-relevant: ${{ (github.event_name != 'pull_request' && github.event_name != 'merge_group') || steps.filter.outputs.fulfillment-service == 'true' }}
      osac-metering-relevant: ${{ (github.event_name != 'pull_request' && github.event_name != 'merge_group') || steps.filter.outputs.osac-metering == 'true' }}
      osac-metering-adapters-relevant: ${{ (github.event_name != 'pull_request' && github.event_name != 'merge_group') || steps.filter.outputs.osac-metering-adapters == 'true' }}
      osac-metering-schema-relevant: ${{ (github.event_name != 'pull_request' && github.event_name != 'merge_group') || steps.filter.outputs.osac-metering-schema == 'true' }}
      concurrency-key: ${{ steps.concurrency-key.outputs.key }}
    steps:
      # dorny/paths-filter uses git diff on merge_group (not the PR Files API),
      # so the repo must be checked out with enough history for base..head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.event_name == 'merge_group'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        id: filter
        with:
          # predicate-quantifier: 'every' applies to every filter in this
          # step, not just `code` -- required there to combine a broad '**'
          # match with several negations as an AND. The per-component
          # filters below don't need negations, just "does any of these
          # patterns match", so each is written as ONE brace-alternation
          # entry (not a flat list of separate entries) -- same convention
          # already verified against real repo paths in
          # e2e-suite-selection-poc.yml's own vmaas-clear/caas-clear/etc.
          # filters (that file's own comment: "a flat-list version matched
          # nothing at all" under 'every', since a flat list would require a
          # single file to satisfy every entry simultaneously).
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!**/OWNERS'
              - '!**/LICENSE'
              - '!**/*.md'
              - '!**/docs/**'
              - '!**/.claude/**'
              - '!**/.cursor/**'
              - '!**/.gemini/**'
              - '!.design/**'
              - '!.skillsaw.yaml'
              - '!.pre-commit-config.yaml'
            fulfillment-service:
              - '{fulfillment-service/**,bare-metal-fulfillment-operator/**,osac-operator/api/**,proto/**,go.work,go.work.sum,.github/workflows/unit-tests.yml}'
            osac-metering:
              - '{osac-metering/metering-service/**,osac-metering/schema/**,proto/**,go.work,go.work.sum,.github/workflows/unit-tests.yml}'
            osac-metering-adapters:
              - '{osac-metering/adapters/**,osac-metering/schema/**,go.work,go.work.sum,.github/workflows/unit-tests.yml}'
            osac-metering-schema:
              - '{osac-metering/schema/**,go.work,go.work.sum,.github/workflows/unit-tests.yml}'
      # A job-level `concurrency:` block can reference `needs.*.outputs.*`,
      # unlike a workflow-level one, which is evaluated before any job runs
      # and so cannot depend on a computed value -- this is why the key is
      # computed here and consumed by each test job's own concurrency block
      # below, rather than in a single top-of-file block.
      #
      # github.sha (the merge-preview commit) changes on every GitHub
      # merge-queue rebase, so keying on it can never collapse a stale rerun
      # from an earlier rebase of the same PR. github.ref_name is stable
      # enough to extract from: for merge_group it's
      # gh-readonly-queue/<base>/pr-<number>-<sha>, and the pr-<number>
      # segment stays constant across rebases -- confirmed against this
      # repo's own run history (gh api .../actions/runs?event=merge_group):
      # PR #503 was requeued at .../pr-503-b2986acb...61 and
      # .../pr-503-f05965f9...53 sixteen minutes apart, PR #307 similarly at
      # .../pr-307-18b1c7ed...58 and .../pr-307-0c86346b...c1 -- both pairs
      # extract to the same "pr-<number>" despite the trailing sha differing
      # every time.
      - name: Compute stable per-PR concurrency key
        id: concurrency-key
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            KEY="pr-${PR_NUMBER}"
          elif [[ "${EVENT_NAME}" == "merge_group" ]]; then
            # tail -1 takes the rightmost match, in case the base branch
            # name itself happens to contain a pr-<digits> substring. The
            # `|| true` plus empty-check fallback covers a ref that doesn't
            # match this shape at all -- GitHub Actions runs `run:` steps
            # with `set -eo pipefail`, so an unmatched grep would otherwise
            # abort this step and skip every downstream test job via `needs`.
            KEY=$(echo "${REF_NAME}" | grep -oE 'pr-[0-9]+' | tail -1 || true)
            [[ -z "${KEY}" ]] && KEY="run-${RUN_ID}"
          else
            KEY="run-${RUN_ID}"
          fi
          echo "key=${KEY}" >> "$GITHUB_OUTPUT"

  run-unit-tests:
    name: Run unit tests
    needs: changes
    if: needs.changes.outputs.should-run == 'true' && needs.changes.outputs.fulfillment-service-relevant == 'true'
    concurrency:
      group: run-unit-tests-${{ needs.changes.outputs.concurrency-key }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-go
      with:
        working-directory: fulfillment-service
    - working-directory: fulfillment-service
      run: |
        ginkgo run --timeout 1h -r internal

  run-osac-metering-tests:
    name: Run unit tests (osac-metering)
    needs: changes
    if: needs.changes.outputs.should-run == 'true' && needs.changes.outputs.osac-metering-relevant == 'true'
    concurrency:
      group: run-osac-metering-tests-${{ needs.changes.outputs.concurrency-key }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-go
      with:
        working-directory: osac-metering/metering-service
    - working-directory: osac-metering/metering-service
      run: |
        ginkgo run -r internal

  run-osac-metering-adapters-tests:
    name: Run unit tests (osac-metering/adapters)
    needs: changes
    if: needs.changes.outputs.should-run == 'true' && needs.changes.outputs.osac-metering-adapters-relevant == 'true'
    concurrency:
      group: run-osac-metering-adapters-tests-${{ needs.changes.outputs.concurrency-key }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-go
      with:
        working-directory: osac-metering/adapters
    - working-directory: osac-metering/adapters
      run: |
        ginkgo run -r .

  run-osac-metering-schema-tests:
    name: Run unit tests (osac-metering/schema)
    needs: changes
    if: needs.changes.outputs.should-run == 'true' && needs.changes.outputs.osac-metering-schema-relevant == 'true'
    concurrency:
      group: run-osac-metering-schema-tests-${{ needs.changes.outputs.concurrency-key }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-go
      with:
        working-directory: osac-metering/schema
    - working-directory: osac-metering/schema
      run: |
        ginkgo run -r .
