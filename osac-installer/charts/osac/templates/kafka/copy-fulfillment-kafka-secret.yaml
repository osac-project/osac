{{- if include "osac.provisionFulfillmentKafkaUser" . }}
{{- $srcNs := .Values.kafka.clusterNamespace | default "osac-kafka" }}
{{- $srcSecret := include "osac.fulfillmentKafkaUserName" . }}
{{- $destSecret := include "osac.fulfillmentKafkaSecretName" . }}
{{- $brokers := include "osac.fulfillmentKafkaBrokers" . }}
{{- $user := include "osac.fulfillmentKafkaUserName" . }}
{{/*
Copy the Strimzi KafkaUser secret from the Kafka namespace into the release
namespace in the shape the fulfillment chart expects (brokers, user, password).

This is a regular Job, not a Helm hook. The event publisher mounts the
destination Secret as a required volume, so Helm --wait cannot mark the
release ready until its required keys exist. The empty Secret lets Kubernetes
find the volume source, while its missing projected keys keep the publisher
gated until this Job populates them.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $destSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
type: Opaque
data: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "osac.fullname" . }}-copy-fulfillment-kafka
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
{{/*
The origin-cli image has no non-root USER, so the copy Job pins a non-root UID
for clusters such as Kind that do not assign one. OpenShift's restricted-v2
SCC rejects that fixed UID, so grant this dedicated ServiceAccount only the
permission needed to use the anyuid SCC, matching the existing admin Job
pattern without granting broader cluster access.
*/}}
{{ if .Capabilities.APIVersions.Has "security.openshift.io/v1" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "osac.fullname" . }}-copy-fulfillment-kafka-anyuid-scc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: {{ include "osac.fullname" . }}-copy-fulfillment-kafka
    namespace: {{ .Release.Namespace }}
{{ end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "osac.fullname" . }}-read-fulfillment-kafka
  namespace: {{ $srcNs }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $srcSecret | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "osac.fullname" . }}-read-fulfillment-kafka
  namespace: {{ $srcNs }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "osac.fullname" . }}-read-fulfillment-kafka
subjects:
  - kind: ServiceAccount
    name: {{ include "osac.fullname" . }}-copy-fulfillment-kafka
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "osac.fullname" . }}-write-fulfillment-kafka
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $destSecret | quote }}]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "osac.fullname" . }}-write-fulfillment-kafka
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "osac.fullname" . }}-write-fulfillment-kafka
subjects:
  - kind: ServiceAccount
    name: {{ include "osac.fullname" . }}-copy-fulfillment-kafka
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "osac.fullname" . }}-copy-fulfillment-kafka-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "osac.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "osac.fullname" . }}-copy-fulfillment-kafka
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: copy-secret
          image: {{ .Values.cliImage }}
          command:
            - /bin/bash
            - -euo
            - pipefail
            - -c
            - |
              echo "Waiting for KafkaUser secret ${SRC_SECRET} in ${SRC_NS}..."
              for i in $(seq 1 60); do
                if kubectl get secret "${SRC_SECRET}" -n "${SRC_NS}" \
                  -o jsonpath='{.data.password}' 2>/dev/null | grep -q .; then
                  echo "KafkaUser secret is ready."
                  break
                fi
                if [ "${i}" -eq 60 ]; then
                  echo "ERROR: KafkaUser secret ${SRC_SECRET} not ready after 300s"
                  exit 1
                fi
                echo "  Attempt ${i}: secret not ready, retrying in 5s..."
                sleep 5
              done

              PASSWORD=$(kubectl get secret "${SRC_SECRET}" -n "${SRC_NS}" \
                -o jsonpath='{.data.password}' | base64 -d)
              [[ -n "${PASSWORD}" ]] || { echo "ERROR: KafkaUser secret has no password"; exit 1; }

              echo "Writing ${DEST_SECRET} in ${DEST_NS}..."
              kubectl create secret generic "${DEST_SECRET}" \
                --namespace="${DEST_NS}" \
                --from-literal=brokers="${BROKERS}" \
                --from-literal=user="${USER}" \
                --from-literal=password="${PASSWORD}" \
                --dry-run=client -o yaml | kubectl apply -f -
              echo "Kafka connection secret is ready."
          env:
            - name: HOME
              value: /tmp
            - name: SRC_NS
              value: {{ $srcNs | quote }}
            - name: SRC_SECRET
              value: {{ $srcSecret | quote }}
            - name: DEST_NS
              value: {{ .Release.Namespace | quote }}
            - name: DEST_SECRET
              value: {{ $destSecret | quote }}
            - name: BROKERS
              value: {{ $brokers | quote }}
            - name: USER
              value: {{ $user | quote }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
