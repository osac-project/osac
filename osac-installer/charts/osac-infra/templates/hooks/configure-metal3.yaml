{{- if .Values.metal3.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: osac-infra-configure-metal3
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "10"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: osac-infra-configure-metal3
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "10"
rules:
  - apiGroups: ["metal3.io"]
    resources: ["provisionings"]
    verbs: ["get", "list", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: osac-infra-configure-metal3
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "10"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: osac-infra-configure-metal3
subjects:
  - kind: ServiceAccount
    name: osac-infra-configure-metal3
    namespace: {{ .Release.Namespace }}
---
# The hook waits on pods only in openshift-machine-api, so that grant is
# namespaced. Only the provisionings resource is cluster-scoped.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: osac-infra-configure-metal3
  namespace: openshift-machine-api
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "10"
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: osac-infra-configure-metal3
  namespace: openshift-machine-api
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "10"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: osac-infra-configure-metal3
subjects:
  - kind: ServiceAccount
    name: osac-infra-configure-metal3
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: osac-infra-configure-metal3
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "10"
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "osac-infra.hookLabels" . | nindent 8 }}
    spec:
      serviceAccountName: osac-infra-configure-metal3
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
        - name: scripts
          configMap:
            name: osac-infra-hook-scripts
      containers:
        - name: configure-metal3
          image: {{ .Values.cliImage }}
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: scripts
              mountPath: /scripts
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.hookResources | nindent 12 }}
          command:
            - /bin/bash
            - /scripts/configure-metal3.sh
{{- end }}
