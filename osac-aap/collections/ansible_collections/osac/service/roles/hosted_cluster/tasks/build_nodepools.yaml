---
- name: Require an explicit release image for every requested NodeSet
  no_log: true
  ansible.builtin.assert:
    that:
      - item.releaseImage | default('', true) | length > 0
    fail_msg: >-
      Node set {{ item.nodeSet }} requires an explicit releaseImage;
      the control-plane image is not a node-set fallback.
  loop: "{{ hosted_cluster_node_requests }}"
  loop_control:
    label: "{{ item.nodeSet }}"

- name: Build one NodePool definition per requested NodeSet
  no_log: true
  ansible.builtin.set_fact:
    nodepool_definitions: >-
      {{ nodepool_definitions | default([]) + [{
        'apiVersion': 'hypershift.openshift.io/v1beta1',
        'kind': 'NodePool',
        'metadata': ({
          'name': nodepool_prefix + '-' + item.nodeSet,
          'namespace': hosted_cluster_namespace,
          'labels': {agent_instance_type_label: item.bareMetal.instanceType, agent_node_set_label: item.nodeSet}
            | combine(hosted_cluster_default_cluster_order_label)
        } | combine({'annotations': {'osac.openshift.io/upgrade-attempt-id': hosted_cluster_upgrade_attempt_id}}
          if hosted_cluster_upgrade_attempt_id | length > 0 else {})),
        'spec': {
          'clusterName': hosted_cluster_name,
          'replicas': item.numberOfNodes | int,
          'management': {
            'autoRepair': false,
            'upgradeType': 'InPlace'
          },
          'platform': {
            'type': 'Agent',
            'agent': {
              'agentLabelSelector': {
                'matchLabels': {agent_node_set_label: item.nodeSet} | combine(hosted_cluster_default_cluster_order_label)
              }
            }
          },
          'release': {
            'image': item.releaseImage
          }
        }
      }] }}
  loop: "{{ hosted_cluster_node_requests }}"
  loop_control:
    label: "{{ item.nodeSet }}"
