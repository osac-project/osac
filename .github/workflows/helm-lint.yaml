name: Helm Lint

# Required check names: Check Helm CRD sync (osac-operator),
# Check Helm CRD sync (bare-metal-fulfillment-operator),
# Lint Helm charts (osac-installer)
# No paths on pull_request: a trigger path filter leaves those names pending
# in the merge queue. Skip is on steps (dorny + should-run).

on:
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changes: ${{ steps.filter.outputs.changes || '[]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.event_name == 'merge_group'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: .github/filters/ci-filters.yml

  # Matrixed over every component that generates Helm CRD templates from a
  # kubebuilder config/crd/bases/ source of truth via hack/sync-helm-crds.py
  # + make check-helm-crds (osac-operator and bare-metal-fulfillment-operator
  # share the identical mechanism; fulfillment-service/osac-aap don't have one).
  helm-crds-sync:
    name: Check Helm CRD sync (${{ matrix.component }})
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [osac-operator, bare-metal-fulfillment-operator]
    steps:
    - name: Fail if path filter failed
      if: needs.changes.result != 'success'
      run: exit 1
    - name: Check component changes
      id: should-run
      # CI_GATING_ENABLED == 'false' is an emergency global override forcing
      # this job to run regardless of the filter result. matrix.component
      # values (e.g. "osac-operator") are looked up as "helm-osac-operator"
      # in the shared ci-filters.yml's matched-filters list, since filter
      # names there are namespaced per-consumer to avoid collisions.
      if: >-
        needs.changes.result == 'success' && (
          vars.CI_GATING_ENABLED == 'false' ||
          contains(fromJSON(needs.changes.outputs.changes), format('helm-{0}', matrix.component)))
      run: echo "run=true" >> "$GITHUB_OUTPUT"

    - name: Checkout repository
      if: steps.should-run.outputs.run
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      if: steps.should-run.outputs.run
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
      with:
        go-version: stable

    - name: Verify Helm CRD templates match bases
      if: steps.should-run.outputs.run
      working-directory: ${{ matrix.component }}
      run: make check-helm-crds

  # fulfillment-service's chart guards most values with `required "..." .Values.X`
  # (auth/certs/idp config), so it needs its CI-only charts/service/ci-values.yaml
  # passed via -f to lint/template cleanly -- osac-operator's and osac-aap's
  # charts have no such guards and lint fine bare.
  helm-lint:
    name: Lint Helm chart (${{ matrix.component }}/${{ matrix.chart }})
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: osac-operator
            chart: operator-crds
          - component: osac-operator
            chart: operator
          - component: bare-metal-fulfillment-operator
            chart: operator-crds
          - component: bare-metal-fulfillment-operator
            chart: operator
          - component: fulfillment-service
            chart: service
            values-file: ci-values.yaml
          - component: osac-aap
            chart: aap
          - component: osac-csi-driver
            chart: csi-driver
          - component: osac-csi-driver
            chart: csi-backends
          - component: osac-metering
            chart: osac-metering
    steps:
    - name: Fail if path filter failed
      if: needs.changes.result != 'success'
      run: exit 1
    - name: Check component changes
      id: should-run
      # CI_GATING_ENABLED == 'false' is an emergency global override forcing
      # this job to run regardless of the filter result. matrix.component
      # values are looked up as "helm-<component>" in the shared
      # ci-filters.yml's matched-filters list (namespaced per-consumer to
      # avoid collisions).
      if: >-
        needs.changes.result == 'success' && (
          vars.CI_GATING_ENABLED == 'false' ||
          contains(fromJSON(needs.changes.outputs.changes), format('helm-{0}', matrix.component)))
      run: echo "run=true" >> "$GITHUB_OUTPUT"

    - name: Checkout repository
      if: steps.should-run.outputs.run
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Helm
      if: steps.should-run.outputs.run
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
      with:
        version: v3.22.0

    - name: Lint chart
      if: steps.should-run.outputs.run
      working-directory: ${{ matrix.component }}
      run: |
        if [ -n "${{ matrix.values-file }}" ]; then
          helm lint "charts/${{ matrix.chart }}/" -f "charts/${{ matrix.chart }}/${{ matrix.values-file }}"
        else
          helm lint "charts/${{ matrix.chart }}/"
        fi

    - name: Template chart
      if: steps.should-run.outputs.run
      working-directory: ${{ matrix.component }}
      run: |
        if [ -n "${{ matrix.values-file }}" ]; then
          helm template test "charts/${{ matrix.chart }}/" -f "charts/${{ matrix.chart }}/${{ matrix.values-file }}"
        else
          helm template test "charts/${{ matrix.chart }}/"
        fi

  # osac-installer's own umbrella chart (charts/osac/) composes every other
  # component's chart as a file:// dependency, plus osac-ui as an OCI
  # dependency -- a different thing from linting any one component's chart in
  # isolation above, so this stays a separate job rather than another matrix
  # entry.
  #
  # Skip condition intentionally isn't scoped to osac-installer's own filter
  # alone: charts/osac/ pulls in every other component's chart as a local
  # file:// dependency, so a change to any of them changes what this job
  # actually builds and lints, not just a change under osac-installer/ itself.
  helm-lint-installer:
    name: Lint Helm charts (osac-installer)
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Fail if path filter failed
      if: needs.changes.result != 'success'
      run: exit 1
    - name: Check whether to lint
      id: should-run
      # CI_GATING_ENABLED == 'false' is an emergency global override forcing
      # this job to run regardless of the filter result. Filter names are
      # looked up as "helm-<component>" in the shared ci-filters.yml's
      # matched-filters list (namespaced per-consumer to avoid collisions).
      if: >-
        needs.changes.result == 'success' && (
          vars.CI_GATING_ENABLED == 'false' ||
          contains(fromJSON(needs.changes.outputs.changes), 'helm-osac-installer') ||
          contains(fromJSON(needs.changes.outputs.changes), 'helm-osac-operator') ||
          contains(fromJSON(needs.changes.outputs.changes), 'helm-bare-metal-fulfillment-operator') ||
          contains(fromJSON(needs.changes.outputs.changes), 'helm-fulfillment-service') ||
          contains(fromJSON(needs.changes.outputs.changes), 'helm-osac-aap') ||
          contains(fromJSON(needs.changes.outputs.changes), 'helm-osac-csi-driver') ||
          contains(fromJSON(needs.changes.outputs.changes), 'helm-osac-metering'))
      run: echo "run=true" >> "$GITHUB_OUTPUT"

    - name: Checkout repository
      if: steps.should-run.outputs.run
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      with:
        persist-credentials: false

    - name: Set up Helm
      if: steps.should-run.outputs.run
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
      with:
        version: v3.22.0

    - name: Set up chart-testing
      if: steps.should-run.outputs.run
      uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f  # v2.8.0

    - name: Build chart dependencies
      if: steps.should-run.outputs.run
      working-directory: osac-installer
      run: helm dependency build charts/osac/

    - name: Run chart-testing lint
      if: steps.should-run.outputs.run
      working-directory: osac-installer
      run: ct lint --all --config ct.yaml

    - name: Template with CI values
      if: steps.should-run.outputs.run
      working-directory: osac-installer
      run: |
        set -euo pipefail
        for f in charts/osac/ci/*-values.yaml; do
          echo "--- helm template osac with $(basename "$f") ---"
          helm template osac charts/osac/ --values "$f"
        done

    - name: Template with environment values
      if: steps.should-run.outputs.run
      working-directory: osac-installer
      run: |
        set -euo pipefail
        for d in values/*/; do
          profile=$(basename "$d")
          echo "--- profile: ${profile} ---"
          if [ -f "${d}infra.yaml" ]; then
            helm template osac-deps charts/osac-deps/ --values "${d}infra.yaml"
            helm template osac-infra charts/osac-infra/ --values "${d}infra.yaml"
          fi
          if [ -f "${d}instance.yaml" ]; then
            helm template osac charts/osac/ --values "${d}instance.yaml" \
              --set service.externalHostname=fulfillment-api.example.com \
              --set service.internalHostname=fulfillment-internal-api.example.com
          fi
        done
