---
# Per-backend teardown_backend body, loop-included from teardown_backend.yaml.
# Marks the hub lifecycle Secret (ontap-tenant-<assignment_key>) as 'retained'
# after verifying tenant UID ownership. Never deletes ONTAP SVMs, LIFs,
# accounts, QoS policies, or admin preparation Secrets.

- name: Compute assignment key for dispatched backend
  ansible.builtin.set_fact:
    _assignment_key: >-
      {{ ((_ontap_backend_id ~ '|' ~ tenant_name) | hash('sha256'))[:16] | lower }}
    _lifecycle_secret_name: "ontap-tenant-{{ ((_ontap_backend_id ~ '|' ~ tenant_name) | hash('sha256'))[:16] | lower }}"
  no_log: true

- name: Read and retain the hub lifecycle Secret
  block:
    - name: Read the hub lifecycle Secret from the hub cluster
      kubernetes.core.k8s_info:
        kubeconfig: ~
        api_version: v1
        kind: Secret
        name: "{{ _lifecycle_secret_name }}"
        namespace: "{{ ontap_storage_config_namespace }}"
      register: _lifecycle_secret_result
      no_log: true

    - name: Log when the hub lifecycle Secret is already absent
      ansible.builtin.debug:
        msg: "No hub lifecycle Secret found for this ONTAP assignment — nothing to release."
      when: _lifecycle_secret_result.resources | length == 0

    - name: Retain the hub lifecycle Secret (atomic resourceVersion patch)
      when: >-
        _lifecycle_secret_result.resources | length > 0 and
        (_lifecycle_secret_result.resources[0].data.lifecycle_stage | default('') | b64decode) == 'claimed'
      block:
        - name: Verify lifecycle Secret ownership
          ansible.builtin.fail:
            msg: >-
              Refusing to release the prepared ONTAP assignment: the hub
              lifecycle Secret belongs to a different tenant UID.
          when: >-
            (_lifecycle_secret_result.resources[0].data.tenant_uid | default('') | b64decode) != tenant_uid
          no_log: true

        - name: Patch the hub lifecycle Secret stage to retained
          kubernetes.core.k8s:
            kubeconfig: ~
            state: patched
            api_version: v1
            kind: Secret
            name: "{{ _lifecycle_secret_name }}"
            namespace: "{{ ontap_storage_config_namespace }}"
            resource_definition:
              metadata:
                resourceVersion: "{{ _lifecycle_secret_result.resources[0].metadata.resourceVersion | string }}"
              stringData:
                lifecycle_stage: "retained"
          no_log: true

        - name: Report the release
          ansible.builtin.debug:
            msg: >-
              Released prepared ONTAP assignment — state set to retained.
              ONTAP resources and admin preparation Secrets are kept per the
              netapp-onboarding contract.

  rescue:
    - name: Warn about teardown_backend failure
      ansible.builtin.debug:
        msg: "Failed to release the prepared ONTAP assignment."

    - name: Re-raise teardown_backend failure
      ansible.builtin.fail:
        msg: "teardown_backend failed to release the prepared ONTAP assignment."
      no_log: true

  always:
    - name: Clear credential-bearing facts
      ansible.builtin.set_fact:
        _lifecycle_secret_result: {}
      no_log: true
