name: Unit Tests (osac-ui)

# Carried over from osac-ui's own standalone repo, relocated
# (osac-ui/-prefixed paths). Kept as its own path-scoped workflow rather
# than folded into unit-tests.yml: that file's jobs all share one blanket
# repo-wide filter with no per-component scoping, which would run this
# alongside every other component's tests on every PR instead of only
# osac-ui changes. Named to match unit-tests.yml's own "Run unit tests
# (<component>)" convention for the job itself.
on:
  pull_request:
    paths:
      - 'osac-ui/**'
  # Invoked as a parallel "box" by osac-build-and-publish.yaml, same as
  # unit-tests.yml/integration-tests.yml/codeql.yml -- unconditional there
  # (a release/nightly run always tests osac-ui, regardless of whether this
  # specific run touched it), not gated by the paths filter above.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run unit tests (osac-ui)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4.3.0
        with:
          run_install: false
          package_json_file: osac-ui/package.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: osac-ui/package.json
          cache: pnpm
          cache-dependency-path: osac-ui/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: osac-ui
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: osac-ui
        run: pnpm test
