syntax = "proto3";

package osac.public.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "osac/public/v1/metadata_type.proto";

// TenantBillingAssignment records an association between one OSAC tenant and
// one billing account for a bounded period of time.
message TenantBillingAssignment {
  string id = 1;
  Metadata metadata = 2;
  TenantBillingAssignmentSpec spec = 3;
  TenantBillingAssignmentStatus status = 4;
}

// TenantBillingAssignmentSpec identifies the tenant and billing account for
// this assignment interval.
message TenantBillingAssignmentSpec {
  string tenant_id = 1 [(buf.validate.field).string = {min_len: 1}];
  string billing_account_id = 2 [(buf.validate.field).string = {min_len: 1}];
}

// TenantBillingAssignmentStatus is the observed state of the assignment.
message TenantBillingAssignmentStatus {
  TenantBillingAssignmentConnectionState connection_state = 1;
  google.protobuf.Timestamp effective_from = 2;
  google.protobuf.Timestamp effective_to = 3;
  optional string message = 4;
}

// TenantBillingAssignmentConnectionState describes whether OSAC has verified
// this association with the configured billing provider.
enum TenantBillingAssignmentConnectionState {
  TENANT_BILLING_ASSIGNMENT_CONNECTION_STATE_UNSPECIFIED = 0;
  TENANT_BILLING_ASSIGNMENT_CONNECTION_STATE_PENDING = 1;
  TENANT_BILLING_ASSIGNMENT_CONNECTION_STATE_CONNECTED = 2;
  TENANT_BILLING_ASSIGNMENT_CONNECTION_STATE_FAILED = 3;
}
