[extend]
  # Layer our allowlist on top of gitleaks' bundled default rules instead of
  # replacing them (a config file without this is a full ruleset override).
  useDefault = true

# Add an entry below for each confirmed false positive, so gitleaks stops
# flagging it on every PR instead of it being ignored out of alert fatigue.
# Keep entries narrowly scoped (a specific regex/path, not a broad pattern)
# and always fill in `description` explaining *why* it's safe to ignore, so
# it's auditable in review instead of a silent, unexplained suppression.
#
# If a finding is a real secret instead of a false positive, rotate it at
# its source immediately — do not allowlist it.
#
# [[allowlists]]
#   description = "Why this specific value/pattern is a false positive"
#   regexes = [
#     '''the-false-positive-value-or-pattern''',
#   ]

[[allowlists]]
  description = "Global Allowlist"

  # Ignore based on any subset of the line
  regexes = [
    '''service123''',
  ]

[[allowlists]]
  description = """
Vendored purestorage.flashblade collection (OSAC-5016). Upstream ships
placeholder FlashBlade API tokens in every module's EXAMPLES block — random
UUIDs such as 'e31060a7-21fc-e277-6240-25983c6c4592' in purefb_alert.py — which
trip the generic-api-key rule 219 times. These are documentation samples in
third-party code pinned at v1.26.0 in collections/requirements.yml, not
credentials for any OSAC system, and the tree is re-vendored wholesale rather
than edited, so inline annotations would not survive a version bump.

Scoped by path only, deliberately: a path+regex pair would need
`condition = "AND"`, which older gitleaks silently ignores, degrading to OR and
allowlisting the token regex repo-wide.
"""
  paths = [
    '''^osac-aap/vendor/ansible_collections/purestorage/flashblade/''',
  ]
