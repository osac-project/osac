- name: Get list of existing BareMetalInstance templates
  ansible.builtin.uri:
    url: "{{ publish_templates_bare_metal_instance_api_endpoint }}"
    validate_certs: "{{ publish_templates_validate_certs | default(true) | bool }}"
    headers:
      authorization: Bearer {{ osac_fulfillment_service_token }}
    status_code: [200, 404, 503]
  register: bare_metal_instance_template_check

- name: Skip BareMetalInstance templates when service is disabled
  ansible.builtin.debug:
    msg: "BMaaS service not available (HTTP {{ bare_metal_instance_template_check.status }}) — skipping bare metal instance template publishing"
  when: bare_metal_instance_template_check.status in [404, 503]

- name: Create list of existing BareMetalInstance template IDs
  ansible.builtin.set_fact:
    bare_metal_instance_template_ids: >-
      {{
      bare_metal_instance_template_check | json_query("json.items[].id")
      }}
  when: >-
    bare_metal_instance_template_check.status not in [404, 503]
    and bare_metal_instance_template_check is success
    and bare_metal_instance_template_check.json.get('items', []) | length > 0

- name: Publish BareMetalInstance template records
  ansible.builtin.include_tasks: publish_template_items.yaml
  vars:
    publish_template_items: "{{ osac_bare_metal_instance_templates }}"
    publish_template_existing_ids: "{{ bare_metal_instance_template_ids | default([]) }}"
    publish_template_api_endpoint: "{{ publish_templates_bare_metal_instance_api_endpoint }}"
    publish_template_resource_name: BareMetalInstance template
  when: bare_metal_instance_template_check.status not in [404, 503]
