syntax = "proto3";

package osac.private.v1;

import "buf/validate/validate.proto";
import "cleanapi/cleanapi.proto";
import "osac/private/v1/metadata_type.proto";
import "osac/private/v1/storage_common_type.proto";

option (cleanapi.file).private = true;

// Lifecycle states for StorageTier resources.
enum StorageTierState {
  // State is unknown or has not been determined yet.
  STORAGE_TIER_STATE_UNSPECIFIED = 0;

  // The storage tier is active and available for use by tenants.
  STORAGE_TIER_STATE_ACTIVE = 1;
}

// Represents the association of a storage backend within a storage tier, including bandwidth and
// encryption configuration.
message BackendAssociation {
  // Unique identifier of the associated storage backend.
  string backend_id = 1;

  // Reserved field numbers for removed fields (do not reuse).
  reserved 2, 5;
  reserved "protocol", "quota_gib";

  // Maximum read bandwidth in megabytes per second.
  int32 max_read_bandwidth_mbs = 3;

  // Maximum write bandwidth in megabytes per second.
  int32 max_write_bandwidth_mbs = 4;

  // Whether data at rest is encrypted on this backend.
  bool encryption_enabled = 6;
}

// Represents a storage tier in the OSAC platform.
//
// StorageTier is a platform-scoped entity that groups one or more StorageBackend associations with
// bandwidth and encryption settings under a single protocol. It is managed exclusively by Cloud
// Provider Admins through the private API. Tenants consume storage tiers indirectly when
// provisioning storage-enabled resources.
//
// StorageTier follows the NetworkClass pattern: DB-backed with no Kubernetes CRD and no reconciler.
message StorageTier {
  // Unique identifier of the storage tier.
  string id = 1;

  // Metadata of the storage tier.
  Metadata metadata = 2;

  // Desired configuration of the storage tier (admin-modifiable).
  StorageTierSpec spec = 3;

  // Current operational status of the storage tier.
  StorageTierStatus status = 4;
}

// Defines the desired configuration for a StorageTier.
message StorageTierSpec {
  // Human-readable description of the storage tier.
  string description = 1;

  // List of backend associations that compose this storage tier.
  repeated BackendAssociation backends = 2;

  // Storage protocol used by this storage tier. Must be an explicit protocol (NFS or BLOCK);
  // UNSPECIFIED is rejected.
  StorageProtocol protocol = 3 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
}

// Represents the current operational state of a StorageTier.
message StorageTierStatus {
  // Current lifecycle state of the storage tier.
  StorageTierState state = 1;

  // Human-readable message providing additional details about the current state.
  optional string message = 2;
}
