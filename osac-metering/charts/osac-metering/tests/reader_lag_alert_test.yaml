suite: metering reader lag alert
templates:
  - templates/prometheusrule.yaml
tests:
  - it: reports lag for each configured reader group
    set:
      prometheusRule.enabled: true
      readers:
        - name: billing-reader
          tenant: acme
        - name: audit-reader
          tenant: globex
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.groups[0].rules[?(@.alert == "MeteringReaderLag")].expr
          value: 'kafka_consumergroup_lag{consumergroup=~"billing-reader|audit-reader"} > 15'
      - matchRegex:
          path: spec.groups[0].rules[?(@.alert == "MeteringReaderLag")].annotations.summary
          pattern: '\$labels\.consumergroup'
      - equal:
          path: spec.groups[0].rules[?(@.alert == "MeteringReaderLag")].for
          value: 15m

  - it: quotes a dotted reader name in the group regex
    set:
      prometheusRule.enabled: true
      readers:
        - name: billing.reader
          tenant: acme
    asserts:
      - equal:
          path: spec.groups[0].rules[?(@.alert == "MeteringReaderLag")].expr
          value: 'kafka_consumergroup_lag{consumergroup=~"billing\.reader"} > 15'

  - it: uses the configured lag threshold
    set:
      prometheusRule.enabled: true
      prometheusRule.readerLagThreshold: 5
      readers:
        - name: billing-reader
          tenant: acme
    asserts:
      - equal:
          path: spec.groups[0].rules[?(@.alert == "MeteringReaderLag")].expr
          value: 'kafka_consumergroup_lag{consumergroup=~"billing-reader"} > 5'

  - it: renders no reader alert when no readers are configured
    set:
      prometheusRule.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - lengthEqual:
          path: spec.groups[0].rules
          count: 5
