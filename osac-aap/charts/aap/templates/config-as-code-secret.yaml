apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.configAsCode.secret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-aap.labels" . | nindent 4 }}
stringData:
  AAP_ADDON_OPERATOR_MAX_CONCURRENT_JOBS: {{ .Values.configAsCode.addonOperatorMaxConcurrentJobs | quote }}
  AAP_OSAC_SERVICE_ACCOUNT: {{ .Values.serviceAccounts.osacSa | quote }}
  OSAC_PUBLISH_TEMPLATES_ENABLED: {{ .Values.instanceGroups.publishTemplates.enabled | quote }}
  {{- if .Values.configAsCode.importAgentsEnabled }}
  OSAC_IMPORT_AGENTS_ENABLED: "true"
  {{- end }}
  {{- if .Values.configAsCode.importBcmAgentsEnabled }}
  OSAC_IMPORT_BCM_AGENTS_ENABLED: "true"
  {{- end }}
  {{- with .Values.configAsCode.eeImage }}
  AAP_EE_IMAGE: {{ . | quote }}
  {{- end }}
  {{- with .Values.configAsCode.eeImagePull }}
  AAP_EE_IMAGE_PULL: {{ . | quote }}
  {{- end }}
  {{- with .Values.configAsCode.projectGitUri }}
  AAP_PROJECT_GIT_URI: {{ . | quote }}
  {{- end }}
  {{- with .Values.configAsCode.projectGitBranch }}
  AAP_PROJECT_GIT_BRANCH: {{ . | quote }}
  {{- end }}
  {{- /*
  Installation-owned Netris connection settings of the CaaS Netris steps
  (NETWORK_CLASS=netris). Config-as-code sets them as fixed environment
  variables of the cluster-fulfillment container group and mounts the CA
  ConfigMap there. They come from the Netris settings in
  instanceGroups.networkFulfillment.config, even when that instance group is
  disabled, so CaaS and networking jobs use one Netris controller.
  */}}
  {{- $netris := .Values.instanceGroups.networkFulfillment.config | default dict }}
  {{- /* Main's schema rules: an HTTPS URL and a boolean validation flag
  (config.yml casts any other value, including "", to false). */}}
  {{- with index $netris "NETRIS_CONTROLLER_URL" }}
  {{- if not (regexMatch "^https://[^/\\s:]+(:[0-9]+)?(/[^\\s]*)?$" (toString .)) }}
  {{- fail (printf "instanceGroups.networkFulfillment.config.NETRIS_CONTROLLER_URL must be an https:// URL (got %q)" (toString .)) }}
  {{- end }}
  NETRIS_CONTROLLER_URL: {{ . | quote }}
  {{- end }}
  {{- if hasKey $netris "NETRIS_VALIDATE_CERTS" }}
  {{- $validateCerts := index $netris "NETRIS_VALIDATE_CERTS" | toString | lower }}
  {{- if not (has $validateCerts (list "true" "false")) }}
  {{- fail (printf "instanceGroups.networkFulfillment.config.NETRIS_VALIDATE_CERTS must be \"true\" or \"false\" (got %q)" (index $netris "NETRIS_VALIDATE_CERTS" | toString)) }}
  {{- end }}
  NETRIS_VALIDATE_CERTS: {{ $validateCerts | quote }}
  {{- end }}
  {{- with index $netris "NETRIS_CA_CONFIGMAP" }}
  {{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$" .) }}
  {{- fail (printf "instanceGroups.networkFulfillment.config.NETRIS_CA_CONFIGMAP must be a ConfigMap name (got %q)" .) }}
  {{- end }}
  NETRIS_CA_CONFIGMAP: {{ . | quote }}
  {{- end }}
  {{- with .Values.configAsCode.remoteClusterKubeconfigSecretName }}
  REMOTE_CLUSTER_KUBECONFIG_SECRET_NAME: {{ . | quote }}
  REMOTE_CLUSTER_KUBECONFIG_SECRET_KEY: {{ $.Values.configAsCode.remoteClusterKubeconfigSecretKey | default "kubeconfig" | quote }}
  {{- end }}
