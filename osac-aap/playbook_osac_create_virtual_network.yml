---
- name: Create a VirtualNetwork resource
  hosts: localhost
  gather_facts: false

  vars:
    virtual_network: "{{ osac_job_vars.resource }}"
    virtual_network_name: "{{ osac_job_vars.resource.metadata.name }}"
    # Implementation strategy set by osac-operator from the dispatcher-resolved manager
    implementation_strategy: >-
      {{ osac_job_vars.resource.metadata.annotations
         ['osac.openshift.io/implementation-strategy'] }}
    template_parameters: {}
  pre_tasks:
    - name: Show resource metadata
      ansible.builtin.debug:
        var: osac_job_vars.resource.metadata

  tasks:
    - name: Display VirtualNetwork information
      ansible.builtin.debug:
        msg:
          - "VirtualNetwork name: {{ virtual_network_name }}"
          - "Implementation strategy: {{ implementation_strategy }}"
          - "Template parameters: {{ template_parameters }}"

    - name: Create VirtualNetwork with sanitized Netris failure details
      block:
        - name: Call the selected VirtualNetwork role
          ansible.builtin.include_role:
            name: "osac.templates.{{ implementation_strategy }}"
            tasks_from: create_virtual_network
      rescue:
        - name: Report VirtualNetwork creation failure
          ansible.builtin.include_role:
            name: osac.templates.netris
            tasks_from: _report_failure
          vars:
            _netris_failure_operation: create
            _netris_failure_resource_type: VirtualNetwork
            _netris_failure_resource_name: "{{ virtual_network_name }}"
            _netris_failure_task: "{{ ansible_failed_task.name | default('unknown provider task') }}"
            _netris_failure_result: "{{ ansible_failed_result | default({}) }}"
          when: implementation_strategy == 'netris'
        - name: Re-raise original failure for other networking managers
          ansible.builtin.fail:
            msg: "{{ ansible_failed_result.msg | default(ansible_failed_task.name | default('operation failed')) }}"
          when: implementation_strategy != 'netris'

    - name: Publish VirtualNetwork backend ID as an AAP artifact
      ansible.builtin.set_stats:
        data:
          vpc_id: "{{ vpc_id | string }}"
        per_host: false
      when: vpc_id is defined and vpc_id | string | length > 0
