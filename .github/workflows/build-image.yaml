name: Build container image

# On a pull request or in the merge queue ci.yml calls this (job build-osac-operator)
# when the component changes: the unit tests, then an image build that is not
# pushed. On main it tests, builds, pushes and signs the image.

on:  # yamllint disable-line rule:truthy
  workflow_call:
  workflow_dispatch:
  push:
    branches:
    - main

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # Hardcoded rather than github.repository: that now resolves to
  # osac-project/osac for every component's build workflow post-merge,
  # colliding on mutable tags with fulfillment-service's image. Keeping
  # this component's pre-merge image identity stable instead, same as
  # osac-aap's execution-environment.yml does.
  IMAGE_NAME: osac-project/osac-operator


jobs:
  test:
    name: Run unit tests (osac-operator)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        with:
          go-version-file: 'osac-operator/go.mod'
      - name: Install kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc  # v1
        with:
          install_only: true
      - name: Run unit tests
        working-directory: osac-operator
        run: make test
      - name: Lint Helm charts
        working-directory: osac-operator
        run: make helm-lint

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      operator-digest: ${{ steps.build-operator.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}


      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-operator
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: osac-operator/Containerfile
          push: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Signing gets its own job, granted id-token: write only here, rather than
  # on `build` -- `build` also runs (build-only, no push) on pull_request and
  # merge_group with PR-controlled Containerfile/build context, so it must
  # never hold the OIDC permission that mints Fulcio signing certs.
  sign:
    needs: build
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign image with cosign
        uses: ./.github/actions/cosign-sign-image
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.operator-digest }}
