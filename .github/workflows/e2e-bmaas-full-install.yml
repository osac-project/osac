---
# The BMaaS full-install E2E: one job, no gating. Whether it runs is decided elsewhere:
#   * for a pull request, e2e-pr.yml calls it once the exact commit is approved, no cheap check has failed and the change
#     touches the suite (it does not wait for CI);
#   * for a merge queue entry, e2e-queue.yml calls it;
#   * every 5 hours on main (schedule), and by hand (workflow_dispatch).
# When called, `repo` and `sha` name the exact commit to test (a fork's commit for a fork pull request).
name: E2E BMaaS Full Install

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      repo:
        description: Repository that holds the commit to test, owner/name
        required: true
        type: string
      sha:
        description: The commit to test
        required: true
        type: string
      pr-number:
        description: The pull request, empty for a merge queue entry
        required: false
        type: string
        default: ""
      fork-pr-author:
        description: Login of the author of a fork pull request, empty when the commit is not from a fork
        required: false
        type: string
        default: ""
      fork-pr-author-association:
        description: Author association of a fork pull request, empty when the commit is not from a fork
        required: false
        type: string
        default: ""
  # 5x/day. Offset 23 minutes past the hour, not on the hour -- GitHub
  # Actions' shared cron scheduler queues everyone's on-the-hour
  # schedules together and can delay/drop them under load.
  schedule:
    - cron: "23 2,7,12,17,22 * * *"
  workflow_dispatch:
    inputs:
      test-suite:
        description: "Suite relative to tests/e2e (bmaas/sanity, bmaas/regression, bmaas/serial, or bmaas for all). Default: bmaas/sanity"
        required: false
        default: "bmaas/sanity"
      test-filter:
        description: "pytest -k filter (GHA always also excludes TestBmaasNetworking)"
        required: false
        default: ""
      test-marker:
        description: "pytest -m marker expression (empty uses BMaaS and common reference tests)"
        required: false
        default: ""
      test-infra-ref:
        description: "Branch/ref of osac-test-infra"
        required: false
        default: "main"

jobs:
  e2e-bmaas-full-install:
    permissions:
      contents: read
      # See e2e-vmaas-full-install.yml's identical grant for why this is needed.
      id-token: write
    uses: osac-project/osac-test-infra/.github/workflows/e2e-bmaas-full-install.yml@main
    with:
      # PR/merge_group: full bmaas suite. Schedule: serial (-n 0, inventory
      # exhaust). workflow_dispatch: honor input, else sanity (bmaas/regression
      # for networking, bmaas for all).
      test-suite: >-
        ${{
          inputs.test-suite != '' && inputs.test-suite ||
          inputs.sha != '' && 'bmaas' ||
          github.event_name == 'schedule' && 'bmaas/serial' ||
          'bmaas/sanity'
        }}
      # Networking is Netris-lab only (eth9, virsh, 3 BMIs). GHA never ran it
      # (test-infra tree has lifecycle+inventory only). Overlay of tests/e2e
      # would collect it from regression/; deselect so GHA matches that set.
      test-filter: ${{ inputs.test-filter && format('({0}) and not TestBmaasNetworking and not TestCrossTenantBmaasNetworking', inputs.test-filter) || 'not TestBmaasNetworking and not TestCrossTenantBmaasNetworking' }}
      test-marker: ${{ inputs.test-marker || 'sanity or regression or serial or requires_bmaas or reference_common or reference_networking' }}
      # osac-installer now lives as a subdirectory of this same monorepo checkout
      # (its Chart.yaml deps resolve fulfillment-service/osac-operator/osac-aap/BMF
      # as ../../../<name> siblings within it), so a PR touching those components
      # must deploy from this PR's own fork/ref, not the reusable workflow's
      # standalone-repo default.
      installer-repo: ${{ inputs.repo || github.repository }}
      installer-ref: ${{ inputs.sha || github.sha }}
      # Build all component images from the PR's fork/branch (same monorepo checkout).
      # osac-aap's execution-environment is built twice (aap.bootstrap.image and
      # aap.configAsCode.eeImage): the two are logically the same image but the
      # override mechanism keys strictly off imageKey, one build per key, so this
      # is the only way to get both fields covered without changing that mechanism
      # (which lives in osac-test-infra, not here). See OSAC-3546.
      components: >-
        [
        { "repo": "${{ inputs.repo || github.repository }}", "ref": "${{ inputs.sha || github.sha }}", "containerfile": "fulfillment-service/Containerfile", "context": ".", "imageKey": "service.images.service.repository" },
        { "repo": "${{ inputs.repo || github.repository }}", "ref": "${{ inputs.sha || github.sha }}", "containerfile": "osac-operator/Containerfile", "context": ".", "imageKey": "operator.image.repository" },
        { "repo": "${{ inputs.repo || github.repository }}", "ref": "${{ inputs.sha || github.sha }}", "containerfile": "osac-aap/execution-environment/execution-environment.yaml", "imageKey": "aap.bootstrap.image", "buildType": "ansible-builder" },
        { "repo": "${{ inputs.repo || github.repository }}", "ref": "${{ inputs.sha || github.sha }}", "containerfile": "osac-aap/execution-environment/execution-environment.yaml", "imageKey": "aap.configAsCode.eeImage", "buildType": "ansible-builder" },
        { "repo": "${{ inputs.repo || github.repository }}", "ref": "${{ inputs.sha || github.sha }}", "containerfile": "bare-metal-fulfillment-operator/Containerfile", "context": ".", "imageKey": "bmf.image.repository" },
        { "repo": "${{ inputs.repo || github.repository }}", "ref": "${{ inputs.sha || github.sha }}", "containerfile": "osac-metering/metering-service/Containerfile", "context": ".", "imageKey": "metering.image.repository" },
        { "repo": "${{ inputs.repo || github.repository }}", "ref": "${{ inputs.sha || github.sha }}", "containerfile": "osac-metering/adapters/Containerfile.echo-adapter", "context": ".", "imageKey": "metering.echoAdapter.image.repository" }
        ]
      pr-number: ${{ inputs.pr-number }}
      # A fork pull request is authorized by the suite (an org member, or the ok-to-test label) before it gets any
      # secret. Empty for a commit of this repository.
      fork-pr-author-association: ${{ inputs.fork-pr-author-association }}
      fork-pr-author: ${{ inputs.fork-pr-author }}
      # Checkout osac-test-infra for tests/Containerfile (not the caller repo)
      test-infra-repository: osac-project/osac-test-infra
      test-infra-ref: ${{ inputs.test-infra-ref || 'main' }}
      test-repository: ${{ inputs.repo || github.repository }}
      test-ref: ${{ inputs.sha || github.sha }}
      notify-on-failure: ${{ github.event_name == 'schedule' }}
      # Only a run on main (schedule, or a manual run against main): that is where the workload identity trusts this
      # workflow. A run for a pull request or a queue entry passes inputs.sha and never gets it.
      enable-ai-diagnostic: ${{ github.ref == 'refs/heads/main' && inputs.sha == '' }}
