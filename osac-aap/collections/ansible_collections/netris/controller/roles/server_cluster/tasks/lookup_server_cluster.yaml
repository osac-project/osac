---
- name: Validate ServerCluster backend ID format
  ansible.builtin.assert:
    that:
      - server_cluster_backend_id | string is match('^[1-9][0-9]*$')
    fail_msg: "server_cluster_backend_id must be a positive integer"
  when:
    - server_cluster_backend_id is defined
    - server_cluster_backend_id | string | length > 0

- name: Reset shared ServerCluster lookup results
  ansible.builtin.set_fact:
    _existing_server_cluster: null
    _matching_server_clusters: []
    _server_cluster_lookup_items: []

- name: Select exact ServerCluster lookup endpoint
  ansible.builtin.set_fact:
    _server_cluster_lookup_by_id: >-
      {{ server_cluster_backend_id is defined and server_cluster_backend_id | string | length > 0 }}
    _server_cluster_lookup_url: >-
      {{ netris_controller_url ~ '/api/v2/server-cluster' ~
         ('/' ~ (server_cluster_backend_id | int | string)
          if server_cluster_backend_id is defined and
             server_cluster_backend_id | string | length > 0 else '') }}

- name: Get the exact ServerCluster or the collection for name lookup
  ansible.builtin.uri:
    url: "{{ _server_cluster_lookup_url }}"
    method: GET
    headers:
      Cookie: "connect.sid={{ netris_session_cookie }}"
    return_content: true
    status_code: "{{ [200, 404] if _server_cluster_lookup_by_id else [200] }}"
    timeout: "{{ netris_timeout | default(30) }}"
    validate_certs: "{{ netris_validate_certs | default(true) }}"
  register: _server_cluster_lookup_response
  no_log: true

- name: Normalize exact ServerCluster response
  ansible.builtin.set_fact:
    _server_cluster_lookup_items: "{{ [_server_cluster_lookup_response.json.data] }}"
  when: (_server_cluster_lookup_response.json | default({})).data | default([]) is mapping

- name: Normalize ServerCluster collection response
  ansible.builtin.set_fact:
    _server_cluster_lookup_items: "{{ (_server_cluster_lookup_response.json | default({})).data | default([]) }}"
  when: (_server_cluster_lookup_response.json | default({})).data | default([]) is sequence
        and (_server_cluster_lookup_response.json | default({})).data | default([]) is not mapping
        and (_server_cluster_lookup_response.json | default({})).data | default([]) is not string

- name: Find ServerCluster by backend ID
  ansible.builtin.set_fact:
    _existing_server_cluster: >-
      {{
        _server_cluster_lookup_items
        | selectattr('id', 'equalto', server_cluster_backend_id | int)
        | list | first | default(none)
      }}
  when:
    - _server_cluster_lookup_by_id
    - server_cluster_backend_id is defined
    - server_cluster_backend_id | string | length > 0

- name: Fail when the requested create backend ID was not found
  ansible.builtin.fail:
    msg: "ServerCluster with backend ID {{ server_cluster_backend_id }} was not found; refusing to fall back to a name lookup"
  when:
    - _server_cluster_lookup_missing_backend_id_is_error | bool
    - server_cluster_backend_id is defined
    - server_cluster_backend_id | string | length > 0
    - _existing_server_cluster is not defined or _existing_server_cluster is none

- name: Verify exact-ID ServerCluster belongs to the requested site
  ansible.builtin.assert:
    that:
      - (_existing_server_cluster.site | default({})).id | default(0) | int == server_cluster_site_id | int
    fail_msg: "The ServerCluster backend ID resolves to a different site; refusing to mutate it"
  when:
    - _server_cluster_lookup_by_id
    - _existing_server_cluster is defined
    - _existing_server_cluster is not none
    - server_cluster_site_id is defined

- name: Verify exact-ID ServerCluster belongs to the requested VPC when known
  ansible.builtin.assert:
    that:
      - (_existing_server_cluster.vpc | default({})).id | default(0) | int == server_cluster_vpc_id | int
    fail_msg: "The ServerCluster backend ID resolves to a different VPC; refusing to mutate it"
  when:
    - _server_cluster_lookup_by_id
    - _existing_server_cluster is defined
    - _existing_server_cluster is not none
    - server_cluster_vpc_id is defined
    - server_cluster_vpc_id | int > 0

- name: Require a VPC scope or explicit legacy permission for name-based deletion
  ansible.builtin.assert:
    that:
      - >-
        (server_cluster_vpc_id is defined and server_cluster_vpc_id | int > 0)
        or (server_cluster_vpc_id is not defined and server_cluster_allow_name_only_lookup | default(false) | bool)
    fail_msg: "Deleting a ServerCluster without a backend ID requires a positive VPC ID; legacy name-only lookup must be explicitly enabled"
  when:
    - _server_cluster_lookup_require_scope | bool
    - server_cluster_backend_id is not defined or server_cluster_backend_id | string | length == 0

- name: Find same-name ServerClusters at the target site
  ansible.builtin.set_fact:
    _matching_server_clusters: >-
      {{
        _server_cluster_lookup_items
        | selectattr('name', 'equalto', server_cluster_name)
        | selectattr('site.id', 'equalto', server_cluster_site_id | int)
        | list
      }}
  when:
    - not _server_cluster_lookup_by_id
    - server_cluster_backend_id is not defined or server_cluster_backend_id | string | length == 0

- name: Restrict shared ServerCluster candidates to the requested VPC
  ansible.builtin.set_fact:
    _matching_server_clusters: "{{ _matching_server_clusters | selectattr('vpc.id', 'equalto', server_cluster_vpc_id | int) | list }}"
  when:
    - server_cluster_backend_id is not defined or server_cluster_backend_id | string | length == 0
    - server_cluster_vpc_id is defined
    - server_cluster_vpc_id | int > 0

- name: Refuse unsafe same-site ServerCluster lookup without a VPC
  ansible.builtin.assert:
    that:
      - server_cluster_allow_name_only_lookup | default(false) | bool
      - _matching_server_clusters | length <= 1
    fail_msg: "ServerCluster name lookup without a VPC needs explicit permission and an unambiguous name at the target site"
  when:
    - server_cluster_backend_id is not defined or server_cluster_backend_id | string | length == 0
    - server_cluster_vpc_id is not defined
    - _matching_server_clusters | length > 0

- name: Refuse ambiguous ServerCluster lookup within the requested scope
  ansible.builtin.assert:
    that: _matching_server_clusters | length <= 1
    fail_msg: "Multiple ServerClusters match name {{ server_cluster_name }} at the requested site and VPC; refusing to select an arbitrary one"
  when:
    - server_cluster_backend_id is not defined or server_cluster_backend_id | string | length == 0
    - (server_cluster_vpc_id is defined and server_cluster_vpc_id | int > 0)
      or (server_cluster_vpc_id is not defined and server_cluster_allow_name_only_lookup | default(false) | bool)

- name: Select the uniquely scoped ServerCluster
  ansible.builtin.set_fact:
    _existing_server_cluster: "{{ _matching_server_clusters | first | default(none) }}"
  when:
    - server_cluster_backend_id is not defined or server_cluster_backend_id | string | length == 0
    - (server_cluster_vpc_id is defined and server_cluster_vpc_id | int > 0)
      or (server_cluster_vpc_id is not defined and server_cluster_allow_name_only_lookup | default(false) | bool)
