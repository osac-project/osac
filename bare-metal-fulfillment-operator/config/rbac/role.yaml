---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - metal3.io
  resources:
  - baremetalhosts
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - metal3.io
  resources:
  - hardwaredata
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - osac.openshift.io
  resources:
  - baremetalinstances
  - baremetalpools
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - osac.openshift.io
  resources:
  - baremetalinstances/finalizers
  - baremetalpools/finalizers
  verbs:
  - update
- apiGroups:
  - osac.openshift.io
  resources:
  - baremetalinstances/status
  - baremetalpools/status
  verbs:
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: manager-role
  namespace: osac
rules:
- apiGroups:
  - osac.openshift.io
  resources:
  - fabricdomains
  verbs:
  - get
  - list
- apiGroups:
  - osac.openshift.io
  resources:
  - networkattachments
  verbs:
  - create
  - delete
  - get
  - patch
