---
# ExternalIPPool -> Netris IPAM allocation osac-pool-<pool id> for the one CIDR
# of spec.cidrs, owned by NETRIS_TENANT_ID. Get-or-create by name; an
# allocation of the same name with another prefix or tenant is a final error.
# The ExternalIPs are /32 nat reservations inside it (create_external_ip.yaml).
- name: Register the ExternalIPPool on Netris
  block:
    - name: Check the settings
      ansible.builtin.include_tasks: _settings.yaml
      vars:
        netris_require: [controller, credentials, site, tenant]

    - name: Check the task input
      ansible.builtin.include_tasks: _input.yaml

    - name: Build the object names
      ansible.builtin.include_tasks: _names.yaml

    - name: Check the CIDR of the pool
      ansible.builtin.set_fact:
        _netris_pool: "{{ osac_job_vars | osac.templates.netris_pool_plan }}"

    - name: Stop on an invalid ExternalIPPool input
      vars:
        netris_fail:
          message: "{{ _netris_pool.error }}"
          retryable: false
      when: _netris_pool.error | length > 0
      ansible.builtin.include_tasks: _fail.yaml

    - name: Create the IPAM allocation of the pool
      block:
        - name: Create the allocation
          ansible.builtin.include_role:
            name: netris.controller.ipam
            tasks_from: create_allocation
          vars:
            ipam_name: "{{ netris_names.pool_ipam }}"
            ipam_cidr: "{{ _netris_pool.cidr }}"
            ipam_tenant_id: "{{ netris_tenant_id | int }}"
      rescue:
        # Netris refuses an overlapping or malformed prefix with a 4xx: the
        # same request would fail again, so the error is final.
        - name: Classify a refused CIDR as final
          when: (ansible_failed_result.status | default(0)) in [400, 409, 422]
          vars:
            netris_fail:
              message: >-
                Netris refused the ExternalIPPool CIDR {{ _netris_pool.cidr }}
                ({{ ansible_failed_result | netris.controller.netris_safe_error_detail }}); it can overlap another allocation.
              retryable: false
          ansible.builtin.include_tasks: _fail.yaml

        - name: Pass on any other failure
          ansible.builtin.fail:
            msg: "{{ ansible_failed_result.msg | default('IPAM allocation failed') }}"
  rescue:
    - name: Report the error
      ansible.builtin.include_tasks: _rescue.yaml
