{{- $caBundleConfigMap := required "certs.caBundle.configMap is required" .Values.certs.caBundle.configMap }}
{{- $vaultEndpoint := tpl (required "vault.endpoint is required" .Values.vault.endpoint) . }}
{{- $vaultNamespace := required "vault.namespace is required" .Values.vault.namespace }}
{{- $vaultKVMountPath := required "vault.kvMountPath is required" .Values.vault.kvMountPath }}
{{- $vaultCredentials := required "vault.credentials is required" .Values.vault.credentials }}
{{- $vaultIssuerURL := tpl (required "vault.keycloakIssuerUrl is required" .Values.vault.keycloakIssuerUrl) . }}
{{- $vaultClientID := required "vault.keycloakClientId is required" .Values.vault.keycloakClientId }}

apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace }}
  name: fulfillment-grpc-server
spec:
  selector:
    matchLabels:
      app: fulfillment-grpc-server
  replicas: 1
  strategy:
    type: {{ if .Values.debug }}Recreate{{ else }}RollingUpdate{{ end }}
  template:
    metadata:
      labels:
        app: fulfillment-grpc-server
    spec:
      volumes:
      - name: cas
        configMap:
          name: {{ $caBundleConfigMap }}
      - name: tls
        secret:
          secretName: fulfillment-grpc-server-tls
      - name: token-signer
        secret:
          secretName: fulfillment-token-signer-keypair
      - name: token-encryption-cert
        secret:
          secretName: fulfillment-token-encryption-keypair
          items:
          - key: tls.crt
            path: tls.crt
      - name: vault-credentials
        projected:
          sources:
          {{- range $vaultCredentials }}
          {{- if .configMap }}
          - configMap:
              name: {{ .configMap.name }}
              items:
              {{- range .configMap.items }}
              - key: {{ .key }}
                path: {{ .param }}
              {{- end }}
          {{- end }}
          {{- if .secret }}
          - secret:
              name: {{ .secret.name }}
              items:
              {{- range .secret.items }}
              - key: {{ .key }}
                path: {{ .param }}
              {{- end }}
          {{- end }}
          {{- end }}
      {{- if and .Values.vault.endpoint .Values.vault.caBundle.configMap }}
      - name: vault-cas
        configMap:
          name: {{ .Values.vault.caBundle.configMap }}
      {{- end }}
      - name: database
        projected:
          sources:
          {{ if .Values.database.connection }}
          {{ range .Values.database.connection }}
          {{ if .configMap }}
          - configMap:
              name: {{ .configMap.name }}
              items:
              {{ range .configMap.items }}
              - key: {{ .key }}
                path: {{ .param }}
              {{ end }}
          {{ end }}
          {{ if .secret }}
          - secret:
              name: {{ .secret.name }}
              items:
              {{ range .secret.items }}
              - key: {{ .key }}
                path: {{ .param }}
              {{ end }}
          {{ end }}
          {{ end }}
          {{ else }}
          []
          {{ end }}
      - name: kafka
        projected:
          sources:{{ if not .Values.kafka.connection }} []{{ end }}
          {{ if .Values.kafka.connection }}
          {{ range .Values.kafka.connection }}
          {{ if .configMap }}
          - configMap:
              name: {{ .configMap.name }}
              items:
              {{ range .configMap.items }}
              - key: {{ .key }}
                path: {{ .param }}
              {{ end }}
          {{ end }}
          {{ if .secret }}
          - secret:
              name: {{ .secret.name }}
              items:
              {{ range .secret.items }}
              - key: {{ .key }}
                path: {{ .param }}
              {{ end }}
          {{ end }}
          {{ end }}
          {{ end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: grpc-server
        image: {{ .Values.images.service }}
        imagePullPolicy: {{ .Values.images.pullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: cas
          mountPath: /etc/fulfillment-grpc-server/tls/cas
        - name: vault-credentials
          mountPath: /etc/fulfillment-grpc-server/vault
          readOnly: true
        {{- if and .Values.vault.endpoint .Values.vault.caBundle.configMap }}
        - name: vault-cas
          mountPath: /etc/fulfillment-grpc-server/vault-cas
          readOnly: true
        {{- end }}
        - name: database
          mountPath: /etc/fulfillment-grpc-server/db
          readOnly: true
        - name: kafka
          mountPath: /etc/fulfillment-grpc-server/kafka
          readOnly: true
        - name: tls
          mountPath: /etc/fulfillment-grpc-server/tls
        - name: token-signer
          mountPath: /etc/fulfillment-token-signer
          readOnly: true
        - name: token-encryption-cert
          mountPath: /etc/fulfillment-token-encryption
          readOnly: true
        command:
        {{ if .Values.debug }}
        - dlv
        - exec
        - /usr/local/bin/fulfillment-service
        - --headless
        - --api-version=2
        - --listen=:30001
        - --accept-multiclient
        - --continue
        - --
        {{ else }}
        - /usr/local/bin/fulfillment-service
        {{ end }}
        - start
        - grpc-server
        - --log-level={{ .Values.log.level }}
        - --log-headers={{ .Values.log.headers }}
        - --log-bodies={{ .Values.log.bodies }}
        - --ca-file=/etc/fulfillment-grpc-server/tls/cas
        - --db-url-file=/etc/fulfillment-grpc-server/db
        - --kafka-properties-file=/etc/fulfillment-grpc-server/kafka
        - --grpc-listener-address=0.0.0.0:8000
        - --grpc-listener-tls-crt=/etc/fulfillment-grpc-server/tls/tls.crt
        - --grpc-listener-tls-key=/etc/fulfillment-grpc-server/tls/tls.key
        - --grpc-authn-trusted-token-issuers={{ tpl (required "auth.issuerUrl is required" .Values.auth.issuerUrl) . }}
        - --emergency-service-accounts={{ join "," .Values.auth.emergencyServiceAccounts }}
        - --token-signer-crt=/etc/fulfillment-token-signer/tls.crt
        - --token-signer-key=/etc/fulfillment-token-signer/tls.key
        - --token-encryption-crt=/etc/fulfillment-token-encryption/tls.crt
        - --token-issuer={{ include "fulfillment-api.tokenIssuerUrl" . }}
        - --metrics-listener-address=0.0.0.0:8002
        {{- if include "fulfillment-service.serviceEnabled" (list . "caas") }}
        - --enable-caas
        {{- end }}
        {{- if include "fulfillment-service.serviceEnabled" (list . "vmaas") }}
        - --enable-vmaas
        {{- end }}
        {{- if include "fulfillment-service.serviceEnabled" (list . "bmaas") }}
        - --enable-bmaas
        {{- end }}
        {{- if include "fulfillment-service.serviceEnabled" (list . "maas") }}
        - --enable-maas
        {{- end }}
        - --vault-endpoint={{ $vaultEndpoint }}
        - --vault-namespace={{ $vaultNamespace }}
        - --vault-kv-mount-path={{ $vaultKVMountPath }}
        {{- if .Values.vault.caBundle.configMap }}
        - --vault-ca-cert-file=/etc/fulfillment-grpc-server/vault-cas/bundle.pem
        {{- end }}
        - --vault-keycloak-issuer-url={{ $vaultIssuerURL }}
        - --vault-keycloak-client-id={{ $vaultClientID }}
        - --vault-keycloak-client-secret-file=/etc/fulfillment-grpc-server/vault/client-secret
        ports:
        - name: grpc
          containerPort: 8000
          protocol: TCP
        - name: metrics
          containerPort: 8002
          protocol: TCP
        {{ if .Values.debug }}
        - name: debug
          containerPort: 30001
          hostPort: 30001
          protocol: TCP
        {{ end }}
        {{ if not .Values.debug }}
        livenessProbe:
          exec:
            command:
            - /usr/local/bin/fulfillment-service
            - probe
            - grpc-server
            - --ca-file=/etc/fulfillment-grpc-server/tls/ca.crt
            - --grpc-server-address=localhost:8000
            - --grpc-server-timeout=1s
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          exec:
            command:
            - /usr/local/bin/fulfillment-service
            - probe
            - grpc-server
            - --ca-file=/etc/fulfillment-grpc-server/tls/ca.crt
            - --grpc-server-address=localhost:8000
            - --grpc-server-timeout=1s
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        {{ end }}
