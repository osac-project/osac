---
- name: Select local tiers for the OSAC CSI StorageClass
  ansible.builtin.set_fact:
    _csi_driver_install_local_tiers: >-
      {{ csi_driver_install_tiers | default([])
         | selectattr('provider', 'equalto', csi_driver_install_local_provider)
         | list }}

- name: Validate tenant identity for local CSI StorageClasses
  ansible.builtin.assert:
    that:
      - tenant_name is defined
      - tenant_name | length > 0
      - tenant_name is regex('^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$')
    fail_msg: >-
      tenant_name must be a DNS label when local CSI tiers are configured;
      got {{ tenant_name | default('undefined') }}.
  when: _csi_driver_install_local_tiers | length > 0

- name: Read existing local-tier StorageClasses
  kubernetes.core.k8s_info:
    api_version: storage.k8s.io/v1
    kind: StorageClass
    name: "osac-{{ tenant_name }}-{{ item.name }}"
  loop: "{{ _csi_driver_install_local_tiers }}"
  loop_control:
    label: "osac-{{ tenant_name }}-{{ item.name }}"
  register: _csi_driver_install_existing_classes

- name: Validate immutable fields of existing local-tier StorageClasses
  ansible.builtin.assert:
    that:
      - item.resources[0].provisioner == csi_driver_install_storage_class_provisioner
      - >-
        (item.resources[0].parameters | default({})) ==
        {'osac.tier': item.item.name, 'tenant': tenant_name}
      - item.resources[0].reclaimPolicy == csi_driver_install_storage_class_reclaim_policy
      - item.resources[0].volumeBindingMode == csi_driver_install_storage_class_volume_binding_mode
    fail_msg: >-
      StorageClass osac-{{ tenant_name }}-{{ item.item.name }} has incompatible
      immutable fields and was not deleted or modified. Check existing PVC/PV
      dependencies before explicitly removing and recreating this class for
      the CSI path, or leave csi_driver_install_lvms_storage_class_enabled=false
      to retain legacy provisioning. Changing the selector does not migrate
      existing volumes.
  loop: "{{ _csi_driver_install_existing_classes.results }}"
  loop_control:
    label: "osac-{{ tenant_name }}-{{ item.item.name }}"
  when: item.resources | length > 0

- name: Create local-tier OSAC CSI StorageClasses
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: "osac-{{ tenant_name }}-{{ item.name }}"
        labels:
          osac.openshift.io/tenant: "{{ tenant_name }}"
          osac.openshift.io/storage-tier: "{{ item.name }}"
          app.kubernetes.io/managed-by: osac-aap
      provisioner: "{{ csi_driver_install_storage_class_provisioner }}"
      parameters:
        osac.tier: "{{ item.name }}"
        tenant: "{{ tenant_name }}"
      reclaimPolicy: "{{ csi_driver_install_storage_class_reclaim_policy }}"
      volumeBindingMode: "{{ csi_driver_install_storage_class_volume_binding_mode }}"
  loop: "{{ _csi_driver_install_local_tiers }}"
  loop_control:
    label: "osac-{{ tenant_name }}-{{ item.name }}"
  when: _csi_driver_install_local_tiers | length > 0
