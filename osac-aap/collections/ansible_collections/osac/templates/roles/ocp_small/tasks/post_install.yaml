---
- name: Install cert-manager operator
  ansible.builtin.include_role:
    name: osac.templates.cert_manager
    tasks_from: install

- name: Create production issuer
  kubernetes.core.k8s:
    kubeconfig: "{{ admin_kubeconfig | default(omit) }}"
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: letsencrypt-production-http01
      spec:
        acme:
          privateKeySecretRef:
            name: letsencrypt-production-http01
          server: 'https://acme-v02.api.letsencrypt.org/directory'
          solvers:
            - http01:
                ingress:
                  class: openshift-default
  register: production_issuer_result
  until: production_issuer_result is succeeded
  retries: 30
  delay: 30

- name: Create staging issuer
  kubernetes.core.k8s:
    kubeconfig: "{{ admin_kubeconfig | default(omit) }}"
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: letsencrypt-staging-http01
      spec:
        acme:
          privateKeySecretRef:
            name: letsencrypt-staging-http01
          server: 'https://acme-staging-v02.api.letsencrypt.org/directory'
          solvers:
            - http01:
                ingress:
                  class: openshift-default
  register: staging_issuer_result
  until: staging_issuer_result is succeeded
  retries: 30
  delay: 30
