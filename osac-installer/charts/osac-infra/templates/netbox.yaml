{{- if .Values.netbox.enabled }}
---
# Custom SCC for the NetBox subchart (Bitnami).
# Bitnami hardcodes UID 1000, fsGroup 1000, and sets seccomp RuntimeDefault
# annotations that the built-in anyuid SCC rejects. This SCC allows RunAsAny
# for user/group/fsGroup and permits seccomp so the chart runs unmodified.
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: {{ .Release.Name }}-netbox
  labels:
    {{- include "osac-infra.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/description: "SCC for NetBox subchart — allows Bitnami hardcoded UID 1000 and seccomp"
allowPrivilegedContainer: false
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
readOnlyRootFilesystem: true
allowedCapabilities: []
defaultAddCapabilities: []
requiredDropCapabilities:
- ALL
seccompProfiles:
- runtime/default
- docker/default
allowedUnsafeSysctls: []
fsGroup:
  type: RunAsAny
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
volumes:
- configMap
- downwardAPI
- emptyDir
- persistentVolumeClaim
- projected
- secret
users:
- system:serviceaccount:{{ .Release.Namespace }}:{{ .Release.Name }}-netbox
groups: []
---
{{- if .Capabilities.APIVersions.Has "route.openshift.io/v1" }}
# Edge-terminated Route exposing the NetBox service outside the cluster
# (host is generated by OpenShift). Used for the bmaas_netbox E2E flavor
# to reach the NetBox UI/API from test runners.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: netbox
  labels:
    {{- include "osac-infra.labels" . | nindent 4 }}
spec:
  to:
    kind: Service
    # Same helper the netbox subchart uses for its Service name, so the
    # target tracks fullnameOverride/nameOverride and the release-name
    # collapsing in common.names.fullname (release "netbox" -> Service
    # "netbox", not "netbox-netbox").
    name: {{ include "common.names.fullname" .Subcharts.netbox }}
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
{{- end }}
{{- end }}
