---
# Attach _target_port to the Netris V-Net named _op_vnet_name (idempotent).
# Fails if the V-Net is not found or _target_port is none.
# Waits for the V-Net to become active after attaching.
# Asserts post-condition: port is a member of the target V-Net.

- name: Fail if no port to attach
  ansible.builtin.fail:
    msg: "Cannot attach: server port not resolved for '{{ na_host_name }}' / '{{ na_logical_interface }}'."
  when: _target_port is none

- name: Find V-Net by name
  ansible.builtin.include_role:
    name: netris.controller.vnet
    tasks_from: read
  vars:
    vnet_name: "{{ _op_vnet_name }}"

- name: Scope the V-Net match to the requested identity
  when: vnet_vpc_id | default(0) | int > 0 or vnet_tenant_id | default(0) | int > 0
  block:
    - name: Collect V-Net candidates by name
      ansible.builtin.set_fact:
        _vnet_candidates: >-
          {{ (netris_vnets | default([]))
             | selectattr('name', 'equalto', _op_vnet_name)
             | list }}

    - name: Filter V-Net candidates by VPC
      ansible.builtin.set_fact:
        _vnet_candidates: >-
          {{ _vnet_candidates
             | selectattr('vpc.id', 'defined')
             | selectattr('vpc.id', 'equalto', vnet_vpc_id | int)
             | list }}
      when: vnet_vpc_id | default(0) | int > 0

    - name: Filter V-Net candidates by tenant
      ansible.builtin.set_fact:
        _vnet_candidates: >-
          {{ _vnet_candidates
             | selectattr('tenant.id', 'defined')
             | selectattr('tenant.id', 'equalto', vnet_tenant_id | int)
             | list }}
      when: vnet_tenant_id | default(0) | int > 0

    - name: Fail on an ambiguous V-Net identity
      ansible.builtin.assert:
        that:
          - _vnet_candidates | length <= 1
        fail_msg: >-
          More than one Netris V-Net named '{{ _op_vnet_name }}' matches the
          supplied VPC/tenant identity. Refusing to move a port against an
          ambiguous V-Net.

    - name: Set the scoped V-Net
      ansible.builtin.set_fact:
        netris_vnet: "{{ _vnet_candidates | first | default(none) }}"

- name: Fail if V-Net not found
  ansible.builtin.fail:
    msg: "V-Net '{{ _op_vnet_name }}' not found in Netris controller."
  when: netris_vnet is none

- name: Get V-Net details
  ansible.builtin.include_role:
    name: netris.controller.vnet
    tasks_from: read_by_id
  vars:
    vnet_id: "{{ netris_vnet.id }}"

- name: Check port membership
  ansible.builtin.set_fact:
    _att_already: >-
      {{ netris_vnet_detail | netris.controller.netris_port_on_vnet(_target_port.id) }}

- name: Add port to V-Net
  ansible.builtin.include_role:
    name: netris.controller.vnet
    tasks_from: update
  vars:
    vnet_id: "{{ netris_vnet_detail.id }}"
    vnet_body: >-
      {{ netris_vnet_detail | combine({'ports': (netris_vnet_detail.ports | default([]))
         + [{'id': _target_port.id, 'state': 'active', 'accessMode': true}]}) }}
  when: not (_att_already | bool)

- name: Re-read V-Net details after attach
  when: not (_att_already | bool)
  block:
    - name: Get V-Net details after attach
      ansible.builtin.include_role:
        name: netris.controller.vnet
        tasks_from: read_by_id
      vars:
        vnet_id: "{{ netris_vnet.id }}"

- name: Assert port is on target V-Net
  ansible.builtin.assert:
    that:
      - netris_vnet_detail | netris.controller.netris_port_on_vnet(_target_port.id)
    fail_msg: >-
      Post-condition failed: port '{{ na_logical_interface }}' (id={{ _target_port.id }})
      is not on V-Net '{{ _op_vnet_name }}' after attach.
    success_msg: >-
      Port '{{ na_logical_interface }}' is on V-Net '{{ _op_vnet_name }}'
      {{ (_att_already | bool) | ternary('(already present)', '') }}

- name: Display attach result
  ansible.builtin.debug:
    msg: >-
      Attached port '{{ na_logical_interface }}' to V-Net '{{ _op_vnet_name }}'
      {{ (_att_already | bool) | ternary('(already present)', '') }}

- name: Wait for V-Net to become active after attach
  ansible.builtin.include_role:
    name: netris.controller.vnet
    tasks_from: wait_active
  vars:
    vnet_id: "{{ netris_vnet_detail.id }}"
  when: not (_att_already | bool)
