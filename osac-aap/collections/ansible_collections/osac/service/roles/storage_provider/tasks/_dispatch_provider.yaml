---
# Thin wrapper for per-(provider, backend_id) dispatch. Called via include_tasks
# with loop because Ansible does not support loop: on include_role directly.
#
# Receives from caller (via loop_var or set_fact):
#   _current_pair      — dict with 'provider' and 'backend_id' for this iteration
#   _dispatch_action   — task file to invoke (setup, ensure_storage_class, teardown_cluster_storage, teardown_backend)
#
# Sets (via _resolve_provider_role.yaml):
#   _current_provider, _dispatch_role — provider name and the osac.templates role chosen for it
#
# Uses from play scope:
#   storage_provider_provisioning_target — vmaas (default) or caas; with
#                                          storage_provider_guest_native_providers it decides
#                                          which role serves the provider
#   _storage_provider_tiers              — full tier list, qos_policy-defaulted (filtered here per provider and backend_id)
#   storage_provider_backend_connections — backend connection details keyed by backend_id,
#                                          filtered here to only the backend_id(s) referenced
#                                          by this provider's dispatched tiers, so a role never
#                                          sees credentials for a backend it wasn't dispatched
#   _cluster_name                        — optional target cluster name override (for volume
#                                          naming); ensure_storage_class self-discovers it from
#                                          the target cluster's Infrastructure object when unset
#   storage_provider_target_kubeconfig  — optional kubeconfig for provider-managed
#                                          cluster-side resources; omit to use the worker's
#                                          default context
#   storage_provider_target_kubeconfig_insecure — disable TLS verification for the target
#                                          kubeconfig when the guest API certificate does not
#                                          match its bundled CA
#   _remote_kubeconfig_insecure          — remains the LVMS CaaS-install signal used by its
#                                          direct OLM and LVMCluster operations

- name: "Extract provider and backend_id from current pair"
  ansible.builtin.set_fact:
    _current_provider: "{{ _current_pair.provider }}"
    _current_backend_id: "{{ _current_pair.backend_id | string }}"

- name: "Refuse cluster storage on vmaas for a provider the target does not support"
  vars:
    _vmaas_base: "{{ _current_provider | replace('-', '_') | regex_replace('_storage$', '') }}"
    _vmaas_supported: >-
      {{ storage_provider_vmaas_supported_providers | default(['vast', 'lvms'])
         | map('replace', '-', '_') | map('regex_replace', '_storage$', '') | list }}
    _vmaas_gaps:
      netapp: >-
        the API accepts a netapp StorageBackend only with cspManaged: true
        (netapp_requires_csp_managed)
      pure: its VMaaS template role is not registered yet (osac-project/osac#1531)
  ansible.builtin.fail:
    msg: >-
      Provider '{{ _current_provider }}' (backend '{{ _current_backend_id }}') is not
      supported for {{ _dispatch_action }} on the vmaas target:
      {{ _vmaas_gaps[_vmaas_base] | default('it is not in storage_provider_vmaas_supported_providers') }}.
      Supported on vmaas: {{ _vmaas_supported | join(', ') }}.
  when:
    - storage_provider_provisioning_target | default('vmaas') == 'vmaas'
    - _dispatch_action in ['ensure_storage_class', 'teardown_cluster_storage']
    - _vmaas_base not in _vmaas_supported

- name: "Resolve the role that serves the current provider"
  ansible.builtin.include_tasks: _resolve_provider_role.yaml

- name: "Compute filtered tiers for current provider and backend_id"
  ansible.builtin.set_fact:
    _computed_provider_tiers: []

- name: "Build filtered tier list with backend_id normalization"
  ansible.builtin.set_fact:
    _computed_provider_tiers: "{{ _computed_provider_tiers + [item] }}"
  when:
    - item.provider in [_current_provider, _current_provider | replace('_', '-')]
    - item.backend_id is defined
    - item.backend_id | string == _current_backend_id
  loop: "{{ _storage_provider_tiers }}"
  loop_control:
    label: "{{ item.name | default('tier') }}"

- name: "Build backend connection list for comparison"
  ansible.builtin.set_fact:
    _tier_backend_ids: >-
      {{
        _computed_provider_tiers
        | selectattr('backend_id', 'defined')
        | map(attribute='backend_id')
        | map('string')
        | list
      }}

- name: "Filter backend connections for current provider's dispatched tiers"
  ansible.builtin.set_fact:
    _computed_provider_backend_connections: {}
  no_log: true

- name: "Add matching backend connections with normalized keys"
  ansible.builtin.set_fact:
    _computed_provider_backend_connections: >-
      {{ _computed_provider_backend_connections | combine({item.key | string: item.value}) }}
  when: item.key | string in _tier_backend_ids
  loop: "{{ storage_provider_backend_connections | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true

- name: "Dispatch provider storage action with remote kubeconfig routing"
  module_defaults:
    kubernetes.core.k8s:
      kubeconfig: "{{ storage_provider_target_kubeconfig | default(omit, true) }}"
      validate_certs: "{{ false if (storage_provider_target_kubeconfig_insecure | default(false) | bool) else omit }}"
    kubernetes.core.k8s_info:
      kubeconfig: "{{ storage_provider_target_kubeconfig | default(omit, true) }}"
      validate_certs: "{{ false if (storage_provider_target_kubeconfig_insecure | default(false) | bool) else omit }}"
  block:
    - name: "Include provider storage role"
      ansible.builtin.include_role:
        name: "osac.templates.{{ _dispatch_role }}"
        tasks_from: "{{ _dispatch_action }}"
        public: true
      vars:
        _provider_tiers: "{{ _computed_provider_tiers }}"
        # osac_csi_storage never reads backend connections; do not hand it credentials.
        _provider_backend_connections: "{{ {} if _dispatch_role == 'osac_csi_storage' else _computed_provider_backend_connections }}"
        vast_storage_csi_provisioner_map: "{{ storage_provider_csi_driver_matrix.vast.protocols }}"

- name: "Accumulate tenant config after dispatch (setup only)"
  ansible.builtin.set_fact:
    _all_tenant_configs: >-
      {{ _all_tenant_configs | combine({_current_backend_id: storage_provider_tenant_config}) }}
  when:
    - _dispatch_action == 'setup'
    - storage_provider_tenant_config is defined
    - storage_provider_tenant_config is mapping

- name: "Accumulate StorageClass names after dispatch (ensure_storage_class only)"
  ansible.builtin.set_fact:
    _all_sc_names: "{{ _all_sc_names + (storage_provider_storage_class_names | default([])) }}"
  when:
    - _dispatch_action == 'ensure_storage_class'
