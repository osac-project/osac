syntax = "proto3";

package osac.private.v1;

import "cleanapi/cleanapi.proto";
import "google/api/annotations.proto";
import "osac/private/v1/quota_usage_type.proto";

option (cleanapi.file).package = "osac.public.v1";
option (cleanapi.file).http_route_prefix_map = "private:fulfillment";

message QuotaUsageGetRequest {
  // The tenant whose usage the report covers. The caller must be able to see the tenant. The
  // built-in `shared` and `system` tenants hold no quota state and have no report.
  string tenant = 1;
}

message QuotaUsageGetResponse {
  QuotaUsageReport report = 1;
}

// Serves the quota usage of tenants, counted from the database. Read-only.
service QuotaUsage {
  // Retrieves the usage report of one tenant: each limit, the usage, the room left, and the
  // dimensions over their limit, for the tenant and each of its projects.
  rpc Get(QuotaUsageGetRequest) returns (QuotaUsageGetResponse) {
    option (google.api.http) = {
      get: "/api/private/v1/quota_usage/{tenant}"
      response_body: "report"
    };
  }
}
