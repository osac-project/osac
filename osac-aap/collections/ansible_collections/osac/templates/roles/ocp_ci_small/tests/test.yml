---
- name: CI cluster deletion uses service-owned infrastructure and access tasks
  hosts: localhost
  gather_facts: false
  vars:
    cluster_order:
      metadata:
        name: test-cluster
      spec:
        nodeRequests:
          - nodeSet: workers
            numberOfNodes: 2
            bareMetal:
              instanceType: bm.large
    cluster_working_namespace: test-work
    ocp_release_image: example.test/release:latest
    delete_step_hosted_cluster_override:
      name: osac.workflows.workflow_helpers
      tasks_from: noop.yml
    delete_step_external_access_override:
      name: osac.workflows.workflow_helpers
      tasks_from: noop.yml
  tasks:
    - name: Generate fixture-only cluster credentials
      ansible.builtin.set_fact:
        template_parameters:
          pull_secret: >-
            {{ lookup('ansible.builtin.password', '/dev/null length=32 chars=ascii_letters,digits') }}
          ssh_public_key: "fixture-ssh-public-key"
      no_log: true

    - name: Run CI cluster delete without external calls
      ansible.builtin.include_role:
        name: osac.templates.ocp_ci_small
        tasks_from: delete.yaml

    - name: Verify CI delete uses service-owned external access tasks
      ansible.builtin.assert:
        that:
          - delete_step_cluster_infra_default is not defined
          - delete_step_external_access_default is defined
          - delete_step_external_access_default.name == "osac.service.external_access"
          - delete_step_external_access_default.tasks_from == "caas_delete.yaml"
          - delete_step_cluster_network_default is not defined
