# Netris overlay for the BMaaS CI profile, layered after instance.yaml. The
# Netris backend of osac-test-infra generates the lab values (controller, site,
# excluded ranges, secrets) in netris-runtime.yaml.
global:
  networking:
    provisioningEnabled: true
    fabricManager: netris
    # No Kubernetes Manager: BMaaS SecurityGroups keep their ICMP rules.
    k8sManager: ""

aap:
  instanceGroups:
    networkFulfillment:
      enabled: true
      config:
        NETRIS_USERNAME: "netris"
        NETRIS_VALIDATE_CERTS: "false"
