syntax = "proto3";

package osac.public.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "osac/public/v1/metadata_type.proto";

// Represents a provider-managed cluster registered from an ACM Hub.
message WorkloadCluster {
  string id = 1;
  Metadata metadata = 2;
  WorkloadClusterSpec spec = 3 [(buf.validate.field).required = true];
  WorkloadClusterStatus status = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Desired registration details for a WorkloadCluster.
message WorkloadClusterSpec {
  // Identifier of the OSAC Hub hosting the ManagedCluster resource.
  string source_hub_id = 1 [(buf.validate.field).string.min_len = 1];

  // Name of the ManagedCluster resource on the Hub.
  string managed_cluster_name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
  }];

  // Workload capabilities offered by the registered cluster.
  repeated string supported_workloads = 3 [(buf.validate.field).repeated = {
    min_items: 1
    unique: true
    items: {string: {in: ["maas"]}}
  }];
}

// Observed registration state.
message WorkloadClusterStatus {
  repeated WorkloadClusterCondition conditions = 1;
}

// Describes one aspect of Hub registration state.
message WorkloadClusterCondition {
  string type = 1 [(buf.validate.field).string.min_len = 1];
  string status = 2 [(buf.validate.field).string = {in: ["True", "False", "Unknown"]}];
  string reason = 3;
  string message = 4;
  google.protobuf.Timestamp last_transition_time = 5;
  google.protobuf.Timestamp last_observed_time = 6;
}
