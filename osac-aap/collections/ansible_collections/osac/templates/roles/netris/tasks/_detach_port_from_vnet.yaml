---
# Detach _target_port from the Netris V-Net named _op_vnet_name. No-op if the
# V-Net is absent, the port is unresolved, or the port is not on the V-Net.
# Pass vnet_vpc_id and/or vnet_tenant_id whenever another tenant can own a
# V-Net with the same name; without a scope the name-only read is used only
# when it is unambiguous.
# Asserts post-condition when a detach mutation ran: port is not on the V-Net.

- name: Detach port from V-Net
  when:
    - _target_port is not none
    - _op_vnet_name | length > 0
  block:
    - name: Find V-Net by name
      ansible.builtin.include_role:
        name: netris.controller.vnet
        tasks_from: read
      vars:
        vnet_name: "{{ _op_vnet_name }}"

    - name: Scope the V-Net match to the requested identity
      when: vnet_vpc_id | default(0) | int > 0 or vnet_tenant_id | default(0) | int > 0
      block:
        - name: Collect V-Net candidates by name
          ansible.builtin.set_fact:
            _vnet_candidates: >-
              {{ (netris_vnets | default([]))
                 | selectattr('name', 'equalto', _op_vnet_name)
                 | list }}

        - name: Filter V-Net candidates by VPC
          ansible.builtin.set_fact:
            _vnet_candidates: >-
              {{ _vnet_candidates
                 | selectattr('vpc.id', 'defined')
                 | selectattr('vpc.id', 'equalto', vnet_vpc_id | int)
                 | list }}
          when: vnet_vpc_id | default(0) | int > 0

        - name: Filter V-Net candidates by tenant
          ansible.builtin.set_fact:
            _vnet_candidates: >-
              {{ _vnet_candidates
                 | selectattr('tenant.id', 'defined')
                 | selectattr('tenant.id', 'equalto', vnet_tenant_id | int)
                 | list }}
          when: vnet_tenant_id | default(0) | int > 0

        - name: Fail on an ambiguous V-Net identity
          ansible.builtin.assert:
            that:
              - _vnet_candidates | length <= 1
            fail_msg: >-
              More than one Netris V-Net named '{{ _op_vnet_name }}' matches
              the supplied VPC/tenant identity. Refusing to detach a port
              from an ambiguous V-Net.

        - name: Set the scoped V-Net
          ansible.builtin.set_fact:
            netris_vnet: "{{ _vnet_candidates | first | default(none) }}"

    - name: Fail on an ambiguous unscoped V-Net identity
      ansible.builtin.assert:
        that:
          - >-
            (netris_vnets | default([])
             | selectattr('name', 'equalto', _op_vnet_name)
             | list) | length <= 1
        fail_msg: >-
          More than one Netris V-Net is named '{{ _op_vnet_name }}' and the
          caller supplied no VPC/tenant scope. Refusing an unscoped detach
          against an ambiguous V-Net.
      when:
        - vnet_vpc_id | default(0) | int == 0
        - vnet_tenant_id | default(0) | int == 0

    - name: Treat missing source V-Net as successful detach
      ansible.builtin.debug:
        msg: >-
          V-Net '{{ _op_vnet_name }}' not found; treating detach of
          '{{ na_logical_interface }}' as already complete.
      when: netris_vnet is none

    - name: Remove the port when the V-Net exists
      when: netris_vnet is not none
      block:
        - name: Get V-Net details
          ansible.builtin.include_role:
            name: netris.controller.vnet
            tasks_from: read_by_id
          vars:
            vnet_id: "{{ netris_vnet.id }}"

        - name: Check port membership
          ansible.builtin.set_fact:
            _det_present: >-
              {{ netris_vnet_detail | netris.controller.netris_port_on_vnet(_target_port.id) }}

        - name: Remove port from V-Net
          ansible.builtin.include_role:
            name: netris.controller.vnet
            tasks_from: update
          vars:
            vnet_id: "{{ netris_vnet_detail.id }}"
            # netris_ports_excluding normalizes int/string port ids the same way
            # as netris_port_on_vnet (rejectattr equalto does not).
            vnet_body: >-
              {{ netris_vnet_detail | combine({
                   'ports': (netris_vnet_detail.ports | default([]))
                            | netris.controller.netris_ports_excluding(_target_port.id)
                 }) }}
          when: _det_present | bool

        - name: Re-read V-Net details after detach
          when: _det_present | bool
          block:
            - name: Get V-Net details after detach
              ansible.builtin.include_role:
                name: netris.controller.vnet
                tasks_from: read_by_id
              vars:
                vnet_id: "{{ netris_vnet.id }}"

        - name: Assert port is not on source V-Net
          ansible.builtin.assert:
            that:
              - not (netris_vnet_detail | netris.controller.netris_port_on_vnet(_target_port.id))
            fail_msg: >-
              Post-condition failed: port '{{ na_logical_interface }}' (id={{ _target_port.id }})
              is still on V-Net '{{ _op_vnet_name }}' after detach.
            success_msg: >-
              Port '{{ na_logical_interface }}' is not on V-Net '{{ _op_vnet_name }}'
              {{ (_det_present | bool) | ternary('', '(was not attached)') }}

        - name: Display detach result
          ansible.builtin.debug:
            msg: >-
              Detached port '{{ na_logical_interface }}' from V-Net '{{ _op_vnet_name }}'
              {{ (_det_present | bool) | ternary('', '(was not attached)') }}
