---
argument_specs:
  main:
    short_description: Storage provider interface role
    description: >
      Dispatches storage operations to provider-specific template roles.
      Validates inputs and enforces the provider and protocol allowlists
      before any dynamic role name construction to prevent role-name injection.
    options:
      storage_provider_tiers:
        type: list
        required: true
        description: >
          List of storage tier definitions. Each tier declares its name, protocol,
          provider, backend_id, and optional QoS settings. qos_policy is
          always derived by this role from the tier name — any caller-supplied
          qos_policy value is ignored and discarded, never used. The dispatcher
          groups tiers by provider and dispatches to each provider's template
          role with the filtered tier subset.
          Example: [{name: default, protocol: nfs, provider: vast,
          backend_id: be-001,
          qos_limits: {static_limits: {max_reads_bw_mbps: 100, max_writes_bw_mbps: 100}}}]
      storage_provider_action:
        type: str
        required: true
        choices:
          - setup
          - ensure_storage_class
          - teardown_cluster_storage
          - teardown_backend
        description: >
          Which storage operation to perform. setup provisions provider-side
          resources. ensure_storage_class creates K8s Secret and StorageClass
          on the target cluster. teardown_cluster_storage removes cluster-side
          K8s resources (StorageClasses, VolumeSnapshotClasses, CSI Secret)
          without touching backend resources or hub Secret. teardown_backend
          removes backend resources (VAST tenant, views, quotas) and hub
          Secret without touching cluster-side K8s resources.
      storage_provider_block_encryption_passphrase:
        type: str
        required: false
        default: ""
        description: >
          Passphrase for block encryption. Passed from the Tenant CR event payload.
          When empty, block StorageClasses are created without host encryption.
      storage_provider_snapshots_enabled:
        type: bool
        required: false
        default: true
        description: >
          Whether to create VolumeSnapshotClasses alongside StorageClasses during
          ensure_storage_class. Only takes effect when the VolumeSnapshotClass CRD
          is installed on the target cluster (a live CRD check gates creation
          regardless of this flag).
      storage_provider_backend_connections:
        type: dict
        required: false
        default: {}
        no_log: true
        description: >
          Backend connection details (endpoint, username, password), keyed by backend_id,
          as resolved by osac-operator from the Tier API. Each provider's own
          credential-sourcing logic looks up the entry for the backend_id(s) present in
          its dispatched tier subset. Optional because teardown_cluster_storage never
          needs backend connection details (it only touches cluster-side K8s resources).
          Example: {be-001: {endpoint: vast.example.com:443, username: admin, password: "***"}}
