{{- if and .Values.validation.enabled (eq (toString .Values.global.networking.fabricManager) "netris") (include "osac.netrisCaConfigMapName" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "osac.fullname" . }}-netris-ca-validate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "osac.fullname" . }}-netris-ca-validate-{{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
rules:
- apiGroups: ["authorization.k8s.io"]
  resources: ["subjectaccessreviews"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "osac.fullname" . }}-netris-ca-validate-{{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "osac.fullname" . }}-netris-ca-validate-{{ .Release.Namespace }}
subjects:
- kind: ServiceAccount
  name: {{ include "osac.fullname" . }}-netris-ca-validate
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "osac.fullname" . }}-netris-ca-validate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: [{{ include "osac.netrisCaConfigMapName" . | quote }}]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "osac.fullname" . }}-netris-ca-validate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "osac.fullname" . }}-netris-ca-validate
subjects:
- kind: ServiceAccount
  name: {{ include "osac.fullname" . }}-netris-ca-validate
  namespace: {{ .Release.Namespace }}
{{- end }}
