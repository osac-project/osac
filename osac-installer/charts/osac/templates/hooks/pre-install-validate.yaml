{{- if and .Values.bmf.netbox.enabled (not .Values.validation.enabled) }}
{{- fail "validation.enabled must be true when bmf.netbox.enabled is true; the dedicated BMH Secret namespace must be checked before installing RBAC" }}
{{- end }}
{{- if .Values.validation.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "osac.fullname" . }}-pre-install-validate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        {{- include "osac.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "osac.fullname" . }}-validate
      containers:
      - name: validate
        image: {{ .Values.cliImage }}
{{ if .Values.bmf.netbox.enabled }}
        env:
        - name: BMF_BMH_NAMESPACE
          value: {{ .Values.bmf.metal3.namespace | quote }}
{{ end }}
        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "=== OSAC Pre-install Validation ==="

          # Check that cert-manager CRDs exist
          echo "Checking for cert-manager CRDs..."
          if kubectl get crd certificates.cert-manager.io >/dev/null; then
            echo "  cert-manager CRDs found."
          else
            echo "ERROR: cert-manager CRDs not found."
            echo "Please install cert-manager before deploying OSAC."
            exit 1
          fi

          # Check that a default StorageClass exists
          echo "Checking for default StorageClass..."
          DEFAULT_SC=$(kubectl get sc -o jsonpath='{.items[?(@.metadata.annotations.storageclass\.kubernetes\.io/is-default-class=="true")].metadata.name}')
          if [ -n "$DEFAULT_SC" ]; then
            echo "  Default StorageClass found: $DEFAULT_SC"
          else
            echo "WARNING: No default StorageClass found."
            echo "Some components (PostgreSQL, Keycloak) may fail to create PVCs."
          fi

          {{- if or .Values.bmf.metal3.enabled .Values.bmf.netbox.enabled }}
          # Check that Metal3 BareMetalHost CRD exists
          echo "Checking for Metal3 BareMetalHost CRD..."
          if kubectl get crd baremetalhosts.metal3.io >/dev/null; then
            echo "  BareMetalHost CRD found."
          else
            echo "ERROR: BareMetalHost CRD (baremetalhosts.metal3.io) not found."
            echo "Metal3 BMH management is configured but BareMetalOperator is not installed."
            echo "Install BareMetalOperator before deploying OSAC with Metal3 or NetBox inventory."
            exit 1
          fi

          # Check the canonical provisioning-configuration has watchAllNamespaces enabled
          echo "Checking provisioning-configuration watchAllNamespaces setting..."
          WATCH_ALL=$(kubectl get provisioning provisioning-configuration -o jsonpath='{.spec.watchAllNamespaces}' 2>/dev/null || true)
          if [ -z "$WATCH_ALL" ]; then
            echo "ERROR: provisioning-configuration CR not found."
            echo "Metal3 backend requires provisioning-configuration with watchAllNamespaces: true."
            echo "Configure BareMetalOperator to watch all namespaces for BareMetalHost resources."
            exit 1
          elif [ "$WATCH_ALL" != "true" ]; then
            echo "ERROR: provisioning-configuration has watchAllNamespaces: ${WATCH_ALL}."
            echo "Metal3 backend requires watchAllNamespaces: true on provisioning-configuration."
            echo "Set spec.watchAllNamespaces to true so BMO can discover BareMetalHost resources across namespaces."
            exit 1
          else
            echo "  provisioning-configuration watchAllNamespaces: true."
          fi
          {{- if .Values.bmf.netbox.enabled }}
          # BMF can create and manage per-host BMC Secrets in this namespace.
          # Require an explicit marker that the namespace is dedicated to BMHs and those credentials.
          echo "Checking that the NetBox BMH namespace is dedicated to BMH and BMC Secrets..."
          BMH_NAMESPACE_LABEL=$(kubectl get namespace "$BMF_BMH_NAMESPACE" -o jsonpath='{.metadata.labels.osac\.openshift\.io/bmh-secret-namespace}' 2>/dev/null || true)
          if [ "$BMH_NAMESPACE_LABEL" != "true" ]; then
            echo "ERROR: NetBox requires the BMH namespace to be dedicated to BareMetalHosts and their BMC credential Secrets."
            echo "Label namespace $BMF_BMH_NAMESPACE with osac.openshift.io/bmh-secret-namespace=true."
            exit 1
          fi
          echo "  NetBox BMH namespace is marked as dedicated."
          {{- end }}
          {{- end }}

          echo "=== Validation passed ==="
  backoffLimit: 0
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "osac.fullname" . }}-validate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-11"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "osac.fullname" . }}-validate-{{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-11"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get"]
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses"]
  verbs: ["list"]
{{- if .Values.bmf.netbox.enabled }}
- apiGroups: [""]
  resources: ["namespaces"]
  resourceNames: [{{ .Values.bmf.metal3.namespace | quote }}]
  verbs: ["get"]
{{- end }}
{{- if or .Values.bmf.metal3.enabled .Values.bmf.netbox.enabled }}
- apiGroups: ["metal3.io"]
  resources: ["provisionings"]
  resourceNames: ["provisioning-configuration"]
  verbs: ["get"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "osac.fullname" . }}-validate-{{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-11"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "osac.fullname" . }}-validate-{{ .Release.Namespace }}
subjects:
- kind: ServiceAccount
  name: {{ include "osac.fullname" . }}-validate
  namespace: {{ .Release.Namespace }}
{{- end }}
