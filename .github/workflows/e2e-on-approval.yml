# OSAC-3370: when CodeRabbit approves the PR head, start expensive e2e.
# Listener must live here. Same-repo start is test-infra e2e-on-label.yml.
# Fork pull_request_review is read-only: this file only hands off so
# e2e-on-approval-fork.yml (workflow_run, default-branch YAML) can replay.
# Display name is the workflow_run filter; rename both or fork replay never starts.
# Job id "fork-handoff" is the display name (no name:); must stay top-level
# (not inside a reusable) or the fork replay gate never matches.
name: E2E on CodeRabbit approval

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

concurrency:
  group: e2e-start-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  start-e2e:
    permissions:
      actions: write
      checks: write
      contents: read
      issues: read
      pull-requests: write
    if: >-
      github.event.review.state == 'approved' &&
      github.event.review.user.login == 'coderabbitai[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    uses: osac-project/osac-test-infra/.github/workflows/e2e-on-label.yml@main
    with:
      pr_number: ${{ format('{0}', github.event.pull_request.number) }}
      skip_label_check: true
      event_head_sha: ${{ github.event.review.commit_id }}
      workflows: e2e-vmaas-full-install.yml,e2e-bmaas-full-install.yml,e2e-caas-full-install.yml

  fork-handoff:
    permissions: {}
    if: >-
      github.event.review.state == 'approved' &&
      github.event.review.user.login == 'coderabbitai[bot]' &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Handoff fork approval to workflow_run replay
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          echo "Fork PR ${HEAD_REPO}: pull_request_review cannot rerun workflows."
          echo "e2e-on-approval-fork.yml (workflow_run on the default branch) starts e2e after this run completes."
