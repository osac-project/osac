{{- if and .Values.prometheusRule.enabled .Values.readers }}
{{- /*
The reader lag rule lives in the Kafka namespace. OpenShift user workload
monitoring evaluates a rule against the series in its own namespace, and the
Kafka exporter PodMonitor is in the Kafka namespace, so the rule must be there
to see the lag series.
*/}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "osac-metering.fullname" . }}-readers
  namespace: {{ include "osac-metering.kafkaClusterNamespace" . }}
  labels:
    {{- include "osac-metering.labels" . | nindent 4 }}
    app.kubernetes.io/component: metering
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: osac-metering-readers
      rules:
        {{- range .Values.readers }}
        - alert: MeteringReaderLag
          # One rule per reader, keyed by its consumer group. The exporter
          # reports one lag series per heartbeat topic under that group, so the
          # annotation names the topic that is behind.
          expr: kafka_consumergroup_lag{consumergroup="{{ .name }}"} > {{ $.Values.prometheusRule.readerLagThreshold }}
          for: 15m
          labels:
            severity: warning
            reader: {{ .name | quote }}
          annotations:
            summary: Metering reader {{ .name }} is behind
            description: >-
              Reader {{ .name }} is more than
              {{ $.Values.prometheusRule.readerLagThreshold }} usage events
              behind on {{`{{ $labels.topic }}`}}. Check that the reader is
              running and that its credentials are still granted. A reader
              that has never consumed has no lag series.
        {{- end }}
{{- end }}
