{{- if .Values.clusterVersions.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-cluster-versions
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "30"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        {{- include "osac.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      serviceAccountName: admin
      initContainers:
      {{- include "osac.waitForFulfillment" . | nindent 6 }}
      containers:
      - name: seed-versions
        image: {{ .Values.cliImage }}
        command:
          - /bin/bash
          - -euo
          - pipefail
          - -c
          - |
            AUTH_TOKEN=$(< /var/run/secrets/kubernetes.io/serviceaccount/token)
            API="https://fulfillment-internal-api:8001/api/private/v1"

            create_resource() {
              local collection="$1"
              local name="$2"
              local payload="$3"
              local response="/tmp/seed-response.json"
              local code

              code=$(curl -sS {{ include "osac.fulfillmentCurlTLS" . }} \
                --connect-timeout 5 \
                --max-time 30 \
                -o "${response}" \
                -w '%{http_code}' \
                -X POST \
                -H "Authorization: Bearer ${AUTH_TOKEN}" \
                -H "Content-Type: application/json" \
                --data-binary "${payload}" \
                "${API}/${collection}")

              case "${code}" in
                2??)
                  printf 'Created %s %s.\n' "${collection}" "${name}"
                  ;;
                409)
                  printf '%s %s already exists, skipping.\n' "${collection}" "${name}"
                  ;;
                *)
                  printf 'ERROR: Failed to create %s %s (HTTP %s)\n' "${collection}" "${name}" "${code}" >&2
                  cat "${response}" >&2
                  return 1
                  ;;
              esac
            }

            {{- range .Values.clusterVersions.versions }}
            {{- $spec := dict "version" .version "image" .image "enabled" true "is_default" (.default | default false) }}
            {{- if .diskImage }}
            create_resource disk_images \
              {{ .diskImage.name | replace "'" "'\"'\"'" | squote }} \
              {{ dict "metadata" (dict "name" .diskImage.name "tenant" "shared") "spec" (dict
                  "source_type" "SOURCE_TYPE_REGISTRY"
                  "source_ref" .diskImage.sourceRef
                  "guest_os_family" "GUEST_OS_FAMILY_LINUX"
                  "architecture" (.diskImage.architecture | default (list "ARCHITECTURE_AMD64"))
                ) | toJson | replace "'" "'\"'\"'" | squote }}
            {{- $_ := set $spec "disk_image" (dict "name" .diskImage.name "shared" true) }}
            {{- end }}
            create_resource cluster_versions \
              {{ .version | replace "'" "'\"'\"'" | squote }} \
              {{ dict "metadata" (dict "name" (.version | replace "." "-")) "spec" $spec
                | toJson | replace "'" "'\"'\"'" | squote }}
            {{- end }}
        env:
        - name: HOME
          value: /tmp
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: ca-bundle
          mountPath: /etc/ca-bundle
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: tmp
        emptyDir: {}
      - name: ca-bundle
        configMap:
          name: {{ .Values.service.certs.caBundle.configMap | required "service.certs.caBundle.configMap is required" }}
          items:
          - key: bundle.pem
            path: bundle.pem
      restartPolicy: OnFailure
{{- end }}
