# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
#
# This file configures fullsend for per-repo installation mode.
# See ADR 0033 for details.
version: "1"
roles:
    - review
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
create_issues:
    allow_targets:
        repos:
            - osac-project/osac
            - fullsend-ai/fullsend

# OSAC-specific configuration
# Always include these files in review context
context_files:
    # fullsend review guidance
    - .fullsend/README.md
    - .fullsend/REVIEW_GUIDE.md
    - .fullsend/COMPONENT_MAP.md

    # Root-level architecture docs
    - AGENTS.md
    - CLAUDE.md
    - docs/ARCHITECTURE.md
    - docs/CONVENTIONS.md
    - fulfillment-service/docs/AUTH.md
    - .claude/rules/architecture-patterns.md
    - .claude/rules/networking-design-alignment.md
    - .claude/rules/request-path-tracing.md

    # Component-specific docs (read only for components touched by PR)
    - bare-metal-fulfillment-operator/AGENTS.md
    - fulfillment-service/AGENTS.md
    - osac-aap/AGENTS.md
    - osac-csi-driver/AGENTS.md
    - osac-installer/AGENTS.md
    - osac-operator/AGENTS.md
    - osac-metering/AGENTS.md
