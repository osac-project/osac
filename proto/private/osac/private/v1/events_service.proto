syntax = "proto3";

package osac.private.v1;

import "buf/validate/validate.proto";
import "cleanapi/cleanapi.proto";
import "google/api/annotations.proto";
import "osac/private/v1/event_type.proto";

option (cleanapi.file).package = "osac.public.v1";
option (cleanapi.file).http_route_prefix_map = "private:events";

message EventsWatchRequest {
  // Filter criteria.
  //
  // The value of this parameter is a [CEL](https://cel.dev) boolean expression. The `event` variable will contain the
  // fields of the event. If the result of the expression is `true` then the event will be sent by the server. For
  // example, to receive only the events that indicate that a cluster order has been modified and is now in the
  // fulfilled state:
  //
  // ```
  // event.type == EVENT_TYPE_OBJECT_CREATED && event.cluster_order.status.state == CLUSTER_ORDER_STATE_FULFILLED
  // ```
  //
  // If this isn't provided, or if the value is empty, then all the events that the user has permission to see will be
  // sent by the server.
  optional string filter = 1;

  // Name of the subscription group.
  //
  // When non-empty, must be a valid RFC 1123 DNS label:
  //
  // - Must be between 1 and 63 characters long.
  // - Must only contain lowercase letters (a-z), digits (0-9) and hyphens (-).
  // - Must start and end with an alphanumeric character.
  //
  // Subscriptions with the same non-empty group share event delivery, allowing multiple clients to divide the work.
  // Use the same filter for all subscriptions in a group: an event rejected by its assigned subscription isn't sent
  // to another subscription in that group. Different groups receive events independently.
  //
  // Grouped subscriptions may receive past events, including events produced while clients were disconnected.
  // Clients must tolerate repeated events. Delivery does not acknowledge that the client has processed the event.
  // If absent or empty, the subscription independently watches new events without joining a group.
  optional string group = 2 [
    (cleanapi.field).private = true,
    (buf.validate.field).string = {
      max_len: 63,
      pattern: "^$|^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
    }
  ];
}

message EventsWatchResponse {
  Event event = 1;
}

service Events {
  // Start watching events.
  //
  // Note that the server doesn't make any guarantee about the delivery or order of these events. In particular events
  // that happen while the client is disconnected will not be delivered. Clients should consider using other mechanisms
  // to ensure that they process objects correctly. For example, they can combine this watch mechanism with periodic
  // redconciliation of all the objects.
  rpc Watch(EventsWatchRequest) returns (stream EventsWatchResponse) {
    option (google.api.http) = {get: "/api/private/v1/events/watch"};
  }
}
