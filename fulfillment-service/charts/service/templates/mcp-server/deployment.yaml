{{- if .Values.mcp.enabled }}
{{- $caBundleConfigMap := required "certs.caBundle.configMap is required" .Values.certs.caBundle.configMap }}
{{- $hostname := include "fulfillment-mcp-server.hostname" . }}
{{- $externalPort := include "fulfillment-mcp-server.externalPort" . | int }}
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace }}
  name: fulfillment-mcp-server
spec:
  selector:
    matchLabels:
      app: fulfillment-mcp-server
  replicas: 1
  strategy:
    type: {{ if .Values.debug }}Recreate{{ else }}RollingUpdate{{ end }}
  template:
    metadata:
      labels:
        app: fulfillment-mcp-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: cas
        configMap:
          name: {{ $caBundleConfigMap }}
      - name: tls
        secret:
          secretName: fulfillment-mcp-server-tls
      containers:
      - name: mcp-server
        image: {{ .Values.images.service.repository }}:{{ .Values.images.service.tag }}
        imagePullPolicy: {{ .Values.images.service.pullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          {{- toYaml .Values.mcp.resources | nindent 10 }}
        volumeMounts:
        - name: cas
          mountPath: /etc/fulfillment-mcp-server/tls/cas
        - name: tls
          mountPath: /etc/fulfillment-mcp-server/tls
        command:
        - /usr/local/bin/fulfillment-service
        - start
        - mcp-server
        - --log-level={{ .Values.log.level }}
        # MCP forwards caller tokens and tenant resource data to Fulfillment.
        - --log-headers=false
        - --log-bodies=false
        - --ca-file=/etc/fulfillment-mcp-server/tls/cas
        - --http-listener-address=0.0.0.0:8000
        - --http-listener-tls-crt=/etc/fulfillment-mcp-server/tls/tls.crt
        - --http-listener-tls-key=/etc/fulfillment-mcp-server/tls/tls.key
        - --http-cors-allowed-origins=https://{{ $hostname }}{{ if ne $externalPort 443 }}:{{ $externalPort }}{{ end }}
        - --grpc-server-address=fulfillment-internal-api:8001
        - --grpc-authn-trusted-token-issuers={{ tpl (required "auth.issuerUrl is required" .Values.auth.issuerUrl) . }}
        - --oauth-authorization-server={{ tpl (required "auth.issuerUrl is required" .Values.auth.issuerUrl) . }}
        - --oauth-resource-url=https://{{ $hostname }}{{ if ne $externalPort 443 }}:{{ $externalPort }}{{ end }}
        ports:
        - name: mcp
          containerPort: 8000
          protocol: TCP
        livenessProbe:
          tcpSocket:
            port: mcp
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          tcpSocket:
            port: mcp
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
{{- end }}
