            api_version: operators.coreos.com/v1alpha1
            kind: Subscription
            name: trident-operator
            namespace: trident-operator
          register: _trident_native_csi_subscription

        - name: Assert existing provider Subscriptions are unchanged
          ansible.builtin.assert:
            that:
              - item.resources | length == 1
              - item.resources[0].spec.channel == 'preview'
              - item.resources[0].spec.installPlanApproval == 'Automatic'
              - item.resources[0].spec.name == 'wrong-package'
              - item.resources[0].spec.source == 'community-operators'
              - item.resources[0].spec.sourceNamespace == 'openshift-marketplace'
              - item.resources[0].spec.startingCSV == item.starting_csv
            fail_msg: "{{ item.name }} Subscription changed despite its CSI driver already being registered"
            success_msg: "Existing {{ item.name }} Subscription was left unchanged"
          loop:
            - name: trident-operator
              starting_csv: trident-operator.v25.10.0
              resources: "{{ _trident_native_csi_subscription.resources }}"
            - name: vast-csi-operator
              starting_csv: vast-csi-operator.v2.5.0
              resources: "{{ _vast_native_csi_subscription.resources }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Assert VAST NFS/block driver mappings
          ansible.builtin.assert:
            that:
              - _vast_native_nfs_driver.resources | length == 1
              - _vast_native_block_driver.resources | length == 1
            fail_msg: "VAST NFS/block protocol mapping did not match the configured CSI drivers"
            success_msg: "VAST NFS/block mappings use the configured CSI drivers"

        - name: Clear native driver override log
          ansible.builtin.file:
            path: /tmp/osac_test_overrides.log
            state: absent

        - name: Create empty native driver override log
          ansible.builtin.file:
            path: /tmp/osac_test_overrides.log
            state: touch
            mode: "0600"

        - name: Re-run provider driver ensure with all drivers present
          ansible.builtin.include_role:
            name: osac.service.storage_provider
          vars:
            storage_provider_action: ensure_csi_driver
            storage_provider_tiers:
              - name: trident-block
                protocol: block
                provider: netapp
              - name: shared-files
                protocol: nfs
                provider: vast
                backend_id: be-vast
              - name: fast-block
                protocol: block
                provider: vast
                backend_id: be-vast
            storage_provider_target_kubeconfig: "{{ _vast_native_csi_target_kubeconfig }}"
            storage_provider_target_kubeconfig_insecure: false

        - name: Read native CSI install Lease after ensuring already-registered drivers
          kubernetes.core.k8s_info:
            api_version: coordination.k8s.io/v1
            kind: Lease
            name: provider-native-csi-install-lock
            namespace: "{{ lookup('env', 'POD_NAMESPACE') }}"
          register: _vast_native_csi_noop_lease

        - name: Assert already-registered drivers do not acquire the install Lease
          ansible.builtin.assert:
            that:
              - not (_native_csi_driver_install_lock_acquired | bool)
              - _vast_native_csi_noop_lease.resources | length == 0
            fail_msg: >-
              The native CSI install Lease was acquired or remains present even
              though all required drivers exist
            success_msg: "Already-registered native CSI drivers skipped the install Lease"

        - name: Read override log after VAST idempotent rerun
          ansible.builtin.slurp:
            path: /tmp/osac_test_overrides.log
          register: _vast_native_csi_rerun_log_content

        - name: Assert existing Trident and VAST drivers skip installer invocation
          ansible.builtin.assert:
            that:
              - "'native_csi_driver_install' not in (_vast_native_csi_rerun_log_content.content | b64decode)"
            fail_msg: "A native CSI installer ran even though all required drivers already exist"
            success_msg: "Existing Trident and VAST drivers skipped installation"

        - name: Clear installer log before rejecting an installed unmanaged Subscription
          ansible.builtin.file:
            path: /tmp/osac_test_overrides.log
            state: absent

        - name: Create an empty installer log for the unmanaged Subscription case
          ansible.builtin.file:
            path: /tmp/osac_test_overrides.log
            state: touch
            mode: "0600"

        - name: Remove VAST block CSIDriver to exercise Subscription reconciliation
          kubernetes.core.k8s:
            state: absent
            api_version: storage.k8s.io/v1
            kind: CSIDriver
            name: block.csi.vastdata.com

        - name: Set installedCSV on the existing unmanaged VAST Subscription
          ansible.builtin.command:
            argv:
              - kubectl
              - --kubeconfig
              - "{{ _vast_native_csi_target_kubeconfig }}"
              - patch
              - subscription
              - vast-csi-operator
              - --namespace
              - vast-csi-system
              - --subresource=status
              - --type=merge
              - --patch
              - '{"status":{"installedCSV":"vast-csi-operator.v2.5.0"}}'
          changed_when: true

        - name: Reject an installed unmanaged VAST Subscription
          block:
            - name: Attempt to ensure a VAST driver with an unmanaged installed Subscription
              ansible.builtin.include_role:
                name: osac.service.storage_provider
              vars:
                storage_provider_action: ensure_csi_driver
                storage_provider_tiers:
                  - name: fast-block
                    protocol: block
                    provider: vast
                    backend_id: be-vast
                storage_provider_target_kubeconfig: "{{ _vast_native_csi_target_kubeconfig }}"
                storage_provider_target_kubeconfig_insecure: false

            - name: Fail if the installed unmanaged Subscription was accepted
              ansible.builtin.fail:
                msg: "The native CSI ensure action accepted an installed unmanaged Subscription"
          rescue:
            - name: Assert installed unmanaged Subscription was rejected safely
              ansible.builtin.assert:
                that:
                  - >-
                    'must be pending and match the required stable Manual policy' in
                    ((ansible_failed_result.msg | default('')) ~ ' ' ~
                     (ansible_failed_result.results | default([]) | selectattr('msg', 'defined')
                      | map(attribute='msg') | join(' ')))
                fail_msg: >-
                  The installed unmanaged Subscription failed for an unexpected reason:
                  {{ ansible_failed_result.msg | default('unknown error') }}
                success_msg: "The installed unmanaged Subscription was rejected without patching it"

        - name: Read the VAST Subscription after rejecting the installed unmanaged object
          kubernetes.core.k8s_info:
            api_version: operators.coreos.com/v1alpha1
            kind: Subscription
            name: vast-csi-operator
            namespace: vast-csi-system
          register: _vast_native_installed_subscription

        - name: Assert the installed unmanaged Subscription remains unchanged
          ansible.builtin.assert:
            that:
              - _vast_native_installed_subscription.resources | length == 1
              - _vast_native_installed_subscription.resources[0].status.installedCSV == 'vast-csi-operator.v2.5.0'
              - _vast_native_installed_subscription.resources[0].spec.channel == 'preview'
              - _vast_native_installed_subscription.resources[0].spec.installPlanApproval == 'Automatic'
              - _vast_native_installed_subscription.resources[0].spec.name == 'wrong-package'
              - _vast_native_installed_subscription.resources[0].spec.source == 'community-operators'
              - _vast_native_installed_subscription.resources[0].spec.sourceNamespace == 'openshift-marketplace'
              - _vast_native_installed_subscription.resources[0].spec.startingCSV == 'vast-csi-operator.v2.5.0'
            fail_msg: "The installed unmanaged VAST Subscription was mutated"
            success_msg: "The installed unmanaged VAST Subscription remained unchanged"

        - name: Assert the failed reconcile did not invoke the installer
          ansible.builtin.slurp:
            path: /tmp/osac_test_overrides.log
          register: _vast_native_installed_subscription_log

        - name: Verify the installed unmanaged Subscription stopped before installation
          ansible.builtin.assert:
            that:
              - "'native_csi_driver_install' not in (_vast_native_installed_subscription_log.content | b64decode)"
            fail_msg: "A native CSI installer ran for an installed unmanaged Subscription"
            success_msg: "The installed unmanaged Subscription was rejected before installer invocation"
      always:
        - name: Delete the Trident Subscription fixture
          kubernetes.core.k8s:
            state: absent
            api_version: operators.coreos.com/v1alpha1
            kind: Subscription
            name: trident-operator
            namespace: trident-operator
          failed_when: false

        - name: Delete the Trident OperatorGroup fixture
          kubernetes.core.k8s:
            state: absent
            api_version: operators.coreos.com/v1
            kind: OperatorGroup
            name: trident-operator-group
            namespace: trident-operator
          failed_when: false

        - name: Delete the Trident CSIDriver fixture
          kubernetes.core.k8s:
            state: absent
            api_version: storage.k8s.io/v1
            kind: CSIDriver
            name: csi.trident.netapp.io
          failed_when: false

        - name: Delete the TridentBackendConfig CRD fixture
          kubernetes.core.k8s:
            state: absent
            api_version: apiextensions.k8s.io/v1
            kind: CustomResourceDefinition
            name: tridentbackendconfigs.trident.netapp.io
            wait: true
          failed_when: false

        - name: Delete the Trident operand namespace fixture
          kubernetes.core.k8s:
            state: absent
            api_version: v1
            kind: Namespace
            name: trident
            wait: true
          failed_when: false

        - name: Delete the Trident operator namespace fixture
          kubernetes.core.k8s:
            state: absent
            api_version: v1
            kind: Namespace
            name: trident-operator
            wait: true
          failed_when: false

        - name: Delete the VAST Subscription fixture
          kubernetes.core.k8s:
            state: absent
            api_version: operators.coreos.com/v1alpha1
            kind: Subscription
            name: vast-csi-operator
            namespace: vast-csi-system
          failed_when: false

        - name: Delete VAST CSIDriver fixtures
          kubernetes.core.k8s:
            state: absent
            api_version: storage.k8s.io/v1
            kind: CSIDriver
            name: "{{ item }}"
          loop:
            - csi.vastdata.com
            - block.csi.vastdata.com
          failed_when: false

        - name: Delete the VAST operator namespace fixture
          kubernetes.core.k8s:
            state: absent
            api_version: v1
            kind: Namespace
            name: vast-csi-system
            wait: true
          failed_when: false

        - name: Delete native driver override log
          ansible.builtin.file:
            path: /tmp/osac_test_overrides.log
            state: absent
          failed_when: false
