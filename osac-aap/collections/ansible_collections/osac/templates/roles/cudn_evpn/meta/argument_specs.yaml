# task input (contract section 4.5). Its keys are checked by the
# osac.templates.cudn_evpn_plan filter, which fails as final on an input
# OSAC never sends.
argument_specs:
  create_virtual_network:
    short_description: Kubernetes Manager task create_virtual_network
    options:
      osac_job_vars:
        type: dict
        required: true
        description: Network manager contract task input
