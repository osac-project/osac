name: Verify Python on CentOS

# A push can run this branch-only workflow before it exists on main.
on:
  push:
    branches:
      - test/uv-python-centos
    paths:
      - .github/actions/setup-python/**
      - .github/workflows/verify-python-centos.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: verify-python-centos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-python:
    # The osac-ci runners are available to the upstream repository.
    if: github.repository == 'osac-project/osac'
    runs-on: osac-ci
    timeout-minutes: 10
    permissions:
      contents: read  # Checkout the composite action being verified.
    steps:
      - name: Checkout verification commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Prepare fresh Python installation
        shell: bash
        run: |
          set -euo pipefail
          verify_dir="$(mktemp -d "${RUNNER_TEMP}/osac-python-verify.XXXXXX")"
          {
            printf 'UV_PYTHON_INSTALL_DIR=%s/python\n' "$verify_dir"
            printf 'UV_CACHE_DIR=%s/cache\n' "$verify_dir"
          } >> "$GITHUB_ENV"

      - name: Set up Python for notification
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          python-version: '3.14'

      - name: Verify CentOS and release summary runtime
        shell: bash
        run: |
          set -euo pipefail
          cat /etc/os-release
          uv run --no-project --with pyyaml==6.0.3 python - <<'PY'
          import platform
          import sys

          import yaml

          release = platform.freedesktop_os_release()
          print(sys.executable)
          print(sys.version)
          assert release["ID"] == "centos", release
          assert release["VERSION_ID"] == "10", release
          assert platform.machine() == "x86_64", platform.machine()
          assert sys.version_info[:2] == (3, 14), sys.version
          assert yaml.__version__ == "6.0.3", yaml.__version__
          print("PASS: Python 3.14 and release summary dependencies on CentOS 10")
          PY
