---
argument_specs:
  main:
    options:
      external_access_base_domain:
        type: str
        required: true
      external_access_namespace:
        type: str
        required: true
      external_access_name:
        type: str
        required: true
      external_access_metallb_ingress_range:
        description: Provider-reserved CI guest IPv4 range; defaults to CI_GUEST_INGRESS_IP_RANGE.
        type: str
        required: false
      external_access_vip_registry_namespace:
        description: Shared claim registry namespace; defaults to the AAP pod namespace.
        type: str
        required: false
      external_access_vip_registry_name:
        type: str
        required: false
      external_access_resource_wait_retries:
        type: int
        required: false
      external_access_resource_wait_delay:
        type: int
        required: false
      external_access_dns_ttl:
        type: int
        required: false
      external_access_supported_base_domains:
        type: list
        elements: str
        required: false
      cluster_order_label:
        type: str
        required: false
      dns_class:
        type: str
        required: false
      dns_server:
        type: str
        required: false
      external_access_dns_wait_use_authoritative:
        type: bool
        required: false
      cluster_order:
        type: dict
        required: true
