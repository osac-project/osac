syntax = "proto3";

package osac.public.v1;

import "buf/validate/validate.proto";
import "osac/public/v1/metadata_type.proto";
import "osac/public/v1/storage_common_type.proto";

// Lifecycle states for StorageTier resources.
enum StorageTierState {
  // State is unknown or has not been determined yet.
  STORAGE_TIER_STATE_UNSPECIFIED = 0;

  // The storage tier is active and available for use by tenants.
  STORAGE_TIER_STATE_ACTIVE = 1;
}

// Describes a class of storage service that can be referenced by name when provisioning
// storage-enabled resources.
//
// StorageTiers are admin-managed catalog resources. Tenant users select a tier by name instead of
// specifying raw storage backend details. Cloud Provider Admins control the available tiers through
// the private API.
//
// The `spec` contains the tier's advertised service level. The `status` contains the current state
// of the storage tier, is provided by the system and can't be modified by the user.
message StorageTier {
  // Unique identifier of the storage tier.
  string id = 1;

  // Metadata of the storage tier.
  Metadata metadata = 2;

  // Advertised service level of the storage tier.
  StorageTierSpec spec = 3;

  // Current operational status of the storage tier.
  StorageTierStatus status = 4;
}

// Defines the advertised service level of a StorageTier.
message StorageTierSpec {
  // Human-readable description of the storage tier.
  string description = 1;

  // Storage protocol used by this tier. Always an explicit protocol (NFS or BLOCK); never UNSPECIFIED.
  StorageProtocol protocol = 2 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];

  // Maximum read bandwidth in megabytes per second.
  int32 max_read_bandwidth_mbs = 3;

  // Maximum write bandwidth in megabytes per second.
  int32 max_write_bandwidth_mbs = 4;

  // Whether data at rest is encrypted on this tier.
  bool encryption_enabled = 5;
}

// Contains the system-provided status of a StorageTier.
message StorageTierStatus {
  // Current lifecycle state of the storage tier.
  StorageTierState state = 1;

  // Human-readable message providing additional details about the current state.
  optional string message = 2;
}
