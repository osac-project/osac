---
- name: NodePools keep same-instance-type NodeSets separate
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../../../../../../group_vars/all/osac_common_labels.yaml
  vars:
    nodepool_prefix: nodepool-test
    hosted_cluster_name: test
    hosted_cluster_namespace: test-work
    hosted_cluster_default_cluster_order_label:
      osac.openshift.io/clusterorder: test
    hosted_cluster_node_requests:
      - nodeSet: compute
        numberOfNodes: 2
        releaseImage: example.test/compute:4.16
        bareMetal:
          instanceType: bm.large
      - nodeSet: batch
        numberOfNodes: 3
        releaseImage: example.test/batch:4.15
        bareMetal:
          instanceType: bm.large
  tasks:
    - name: Build NodePools from two independent NodeSets
      ansible.builtin.include_role:
        name: osac.service.hosted_cluster
        tasks_from: build_nodepools.yaml

    - name: Verify separate names, selectors and replica counts
      ansible.builtin.assert:
        that:
          - nodepool_definitions | length == 2
          - nodepool_definitions[0].metadata.name == 'nodepool-test-compute'
          - nodepool_definitions[1].metadata.name == 'nodepool-test-batch'
          - nodepool_definitions[0].spec.replicas == 2
          - nodepool_definitions[1].spec.replicas == 3
          - nodepool_definitions[0].spec.release.image == 'example.test/compute:4.16'
          - nodepool_definitions[1].spec.release.image == 'example.test/batch:4.15'
          - nodepool_definitions[0].metadata.labels['osac.openshift.io/node-set'] == 'compute'
          - nodepool_definitions[1].metadata.labels['osac.openshift.io/node-set'] == 'batch'
          - nodepool_definitions[0].metadata.labels['osac.openshift.io/instance_type'] == 'bm.large'
          - nodepool_definitions[1].metadata.labels['osac.openshift.io/instance_type'] == 'bm.large'
          - nodepool_definitions[0].spec.platform.agent.agentLabelSelector.matchLabels['osac.openshift.io/node-set'] == 'compute'
          - nodepool_definitions[1].spec.platform.agent.agentLabelSelector.matchLabels['osac.openshift.io/node-set'] == 'batch'
          - nodepool_definitions[0].spec.platform.agent.agentLabelSelector.matchLabels['osac.openshift.io/clusterorder'] == 'test'
          - nodepool_definitions[1].spec.platform.agent.agentLabelSelector.matchLabels['osac.openshift.io/clusterorder'] == 'test'

    - name: Reset definitions before independently scaling compute
      ansible.builtin.set_fact:
        nodepool_definitions: []
        hosted_cluster_node_requests:
          - nodeSet: compute
            numberOfNodes: 4
            releaseImage: example.test/compute:4.16
            bareMetal:
              instanceType: bm.large
          - nodeSet: batch
            numberOfNodes: 3
            releaseImage: example.test/batch:4.15
            bareMetal:
              instanceType: bm.large

    - name: Rebuild NodePools after independent scale-up
      ansible.builtin.include_role:
        name: osac.service.hosted_cluster
        tasks_from: build_nodepools.yaml

    - name: Verify scaling one NodeSet preserves the other
      ansible.builtin.assert:
        that:
          - nodepool_definitions | length == 2
          - nodepool_definitions[0].metadata.name == 'nodepool-test-compute'
          - nodepool_definitions[1].metadata.name == 'nodepool-test-batch'
          - nodepool_definitions[0].spec.replicas == 4
          - nodepool_definitions[1].spec.replicas == 3
          - nodepool_definitions[0].spec.release.image == 'example.test/compute:4.16'
          - nodepool_definitions[1].spec.release.image == 'example.test/batch:4.15'

    - name: Set one shared upgrade attempt
      ansible.builtin.set_fact:
        nodepool_definitions: []
        cluster_order:
          metadata:
            annotations:
              osac.openshift.io/upgrade-attempt-id: cluster-id

    - name: Build NodePools with the shared attempt ID
      ansible.builtin.include_role:
        name: osac.service.hosted_cluster
        tasks_from: build_nodepools.yaml

    - name: Verify each NodePool retains the shared ID
      ansible.builtin.assert:
        that:
          - nodepool_definitions[0].metadata.annotations['osac.openshift.io/upgrade-attempt-id'] == 'cluster-id'
          - nodepool_definitions[1].metadata.annotations['osac.openshift.io/upgrade-attempt-id'] == 'cluster-id'

    - name: Verify a missing node release image is rejected
      block:
        - name: Reset definitions before rejecting a missing release image
          ansible.builtin.set_fact:
            nodepool_definitions: []
            hosted_cluster_node_requests:
              - nodeSet: missing-image
                numberOfNodes: 1
                bareMetal:
                  instanceType: bm.large

        - name: Build NodePools with a missing release image
          ansible.builtin.include_role:
            name: osac.service.hosted_cluster
            tasks_from: build_nodepools.yaml

        - name: Fail if the missing release image was accepted
          ansible.builtin.fail:
            msg: The missing node release image should have been rejected.

      rescue:
        - name: Verify the missing release image was rejected
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Require an explicit release image for every requested NodeSet'
