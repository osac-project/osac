---
# Internal helper, not one of the four dispatched actions. Resolves the Realm's
# API token from the admin-pre-created hub Secret named by its PURE_REALM_POOL
# entry.
#
# Receives:
#   _pure_selected_realm — {realm_name, secret_name} chosen by select_realm
#
# Sets:
#   _realm_name, _api_token, _mgmt_endpoint, _nfs_endpoint
#
# setup.yaml's always block clears all four. Every task here is no_log because
# the Secret body carries the Realm's API token.

- name: "Read Realm credential Secret {{ _pure_selected_realm.secret_name }}"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ _pure_selected_realm.secret_name }}"
    namespace: "{{ pure_storage_config_namespace }}"
  register: _pure_realm_secret
  no_log: true

- name: "Fail when the Realm credential Secret is missing"
  ansible.builtin.fail:
    msg: >-
      Realm credential Secret '{{ _pure_selected_realm.secret_name }}' not found in
      namespace '{{ pure_storage_config_namespace }}'. Every PURE_REALM_POOL entry
      must name a Secret created by the Realm provisioning playbook.
  when: _pure_realm_secret.resources | length != 1

# Reduced to a list of field names before reporting: the names are safe to log,
# the values are not, so the failure below can stay readable without no_log.
- name: "Collect missing Realm credential fields"
  ansible.builtin.set_fact:
    _pure_missing_fields: >-
      {{
        ['realm_name', 'api_token', 'mgmt_endpoint', 'nfs_endpoint']
        | reject('in', (_pure_realm_secret.resources[0].data | default({})
                        | dict2items
                        | selectattr('value')
                        | map(attribute='key')
                        | list))
        | list
      }}
  no_log: true

- name: "Fail when the Realm credential Secret is missing required fields"
  ansible.builtin.fail:
    msg: >-
      Realm credential Secret '{{ _pure_selected_realm.secret_name }}' is missing
      required field(s): {{ _pure_missing_fields | join(', ') }}. Required fields:
      realm_name, api_token, mgmt_endpoint, nfs_endpoint.
  when: _pure_missing_fields | length > 0

- name: "Decode Realm credentials"
  ansible.builtin.set_fact:
    _realm_name: "{{ _pure_realm_secret.resources[0].data.realm_name | b64decode }}"
    _api_token: "{{ _pure_realm_secret.resources[0].data.api_token | b64decode }}"
    _mgmt_endpoint: "{{ _pure_realm_secret.resources[0].data.mgmt_endpoint | b64decode }}"
    _nfs_endpoint: "{{ _pure_realm_secret.resources[0].data.nfs_endpoint | b64decode }}"
  no_log: true

# A Secret whose realm_name disagrees with the pool entry means the pool and the
# Secrets have drifted. Provisioning against the wrong Realm would place a
# tenant's filesystems outside the Realm recorded in its hub Secret, so refuse.
- name: "Fail when the Secret's realm_name disagrees with its pool entry"
  ansible.builtin.fail:
    msg: >-
      Realm credential Secret '{{ _pure_selected_realm.secret_name }}' declares realm_name
      '{{ _realm_name }}', but its PURE_REALM_POOL entry declares
      '{{ _pure_selected_realm.realm_name }}'. Correct the Realm pool entry or the Secret.
  when: _realm_name != _pure_selected_realm.realm_name

- name: "Drop the raw Realm credential Secret from play scope"
  ansible.builtin.set_fact:
    _pure_realm_secret: null
  no_log: true
