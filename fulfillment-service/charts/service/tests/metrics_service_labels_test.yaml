suite: metrics selector label on the scraped Services
# ci-values.yaml satisfies this chart's `required` guards; without it every
# case fails rendering an unrelated Deployment rather than asserting anything.
values:
  - ../ci-values.yaml
# ci-values.yaml carries the openshift MCP external port, so pair it with the
# openshift variant; the kind variant rejects that combination.
set:
  variant: openshift
# The ServiceMonitor in templates/servicemonitor.yaml selects on
# osac.openshift.io/metrics rather than on one monitor per component, because
# the components are gated inconsistently. That only holds while exactly the
# Services with a metrics port carry the label, so assert both directions.
tests:
  - it: labels the grpc server
    templates:
      - templates/grpc-server/service.yaml
    asserts:
      - equal:
          path: metadata.labels["osac.openshift.io/metrics"]
          value: "true"
      - contains:
          path: spec.ports
          content:
            name: metrics
            port: 8002
            targetPort: metrics

  - it: labels the controller
    templates:
      - templates/controller/service.yaml
    asserts:
      - equal:
          path: metadata.labels["osac.openshift.io/metrics"]
          value: "true"
      - contains:
          path: spec.ports
          content:
            name: metrics
            port: 8002
            targetPort: metrics

  - it: labels the REST gateway
    templates:
      - templates/rest-gateway/service.yaml
    asserts:
      - equal:
          path: metadata.labels["osac.openshift.io/metrics"]
          value: "true"
      - contains:
          path: spec.ports
          content:
            name: metrics
            port: 8002
            targetPort: metrics

  - it: labels the event publisher when it is enabled
    templates:
      - templates/event-publisher/service.yaml
    set:
      eventPublisher.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.labels["osac.openshift.io/metrics"]
          value: "true"
      - contains:
          path: spec.ports
          content:
            name: metrics
            port: 8002
            targetPort: metrics

  # The gate is negated here, unlike every other component. Nothing has to be
  # restated in the ServiceMonitor: a Service that is not rendered is not
  # selected.
  - it: labels the console proxy unless it is disabled
    templates:
      - templates/console-proxy/service.yaml
    set:
      consoleProxy.disabled: false
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.labels["osac.openshift.io/metrics"]
          value: "true"

  - it: renders no console-proxy Service to scrape when it is disabled
    templates:
      - templates/console-proxy/service.yaml
    set:
      consoleProxy.disabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no event-publisher Service to scrape when it is disabled
    templates:
      - templates/event-publisher/service.yaml
    set:
      eventPublisher.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  # The ingress proxy serves Prometheus metrics on /metrics, not the usual
  # Envoy /stats/prometheus, so it needs no special endpoint.
  - it: labels the ingress-proxy metrics Service only
    templates:
      - templates/ingress-proxy/service.yaml
    asserts:
      - hasDocuments:
          count: 3
      - documentIndex: 2
        equal:
          path: metadata.name
          value: fulfillment-ingress-proxy-metrics
      - documentIndex: 2
        equal:
          path: metadata.labels["osac.openshift.io/metrics"]
          value: "true"
      # fulfillment-api and fulfillment-internal-api select the same pods but
      # expose no metrics port, so they must stay unlabelled and unscraped.
      - documentIndex: 0
        equal:
          path: metadata.name
          value: fulfillment-api
      - documentIndex: 0
        notExists:
          path: metadata.labels
      - documentIndex: 1
        equal:
          path: metadata.name
          value: fulfillment-internal-api
      - documentIndex: 1
        notExists:
          path: metadata.labels

  - it: leaves the MCP server unscraped, as it exposes no metrics port
    templates:
      - templates/mcp-server/service.yaml
    set:
      mcp.enabled: true
    asserts:
      - documentIndex: 0
        notExists:
          path: metadata.labels["osac.openshift.io/metrics"]
