syntax = "proto3";

package osac.private.v1;

import "cleanapi/cleanapi.proto";
import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "osac/private/v1/document_type.proto";

option (cleanapi.file).package = "osac.public.v1";
option (cleanapi.file).http_route_prefix_map = "private:fulfillment";

message DocumentsListRequest {
  optional int32 offset = 1;
  optional int32 limit = 2;
  optional string filter = 3;
  optional string order = 4;
}

message DocumentsListResponse {
  int32 size = 1;
  int32 total = 2;
  repeated Document items = 3;
}

message DocumentsGetRequest {
  string id = 1;
}

message DocumentsGetResponse {
  Document object = 1;
}

message DocumentsCreateRequest {
  option (cleanapi.message).private = true;
  Document object = 1;
}

message DocumentsCreateResponse {
  option (cleanapi.message).private = true;
  Document object = 1;
}

message DocumentsUpdateRequest {
  option (cleanapi.message).private = true;
  Document object = 1;
  google.protobuf.FieldMask update_mask = 2;
  bool lock = 3;
}

message DocumentsUpdateResponse {
  option (cleanapi.message).private = true;
  Document object = 1;
}

message DocumentsDeleteRequest {
  option (cleanapi.message).private = true;
  string id = 1;
}

message DocumentsDeleteResponse {
  option (cleanapi.message).private = true;
}

message DocumentsSignalRequest {
  option (cleanapi.message).private = true;
  string id = 1;
}

message DocumentsSignalResponse {
  option (cleanapi.message).private = true;
}

service Documents {
  rpc List(DocumentsListRequest) returns (DocumentsListResponse) {
    option (google.api.http) = {get: "/api/private/v1/documents"};
  }

  rpc Get(DocumentsGetRequest) returns (DocumentsGetResponse) {
    option (google.api.http) = {
      get: "/api/private/v1/documents/{id}"
      response_body: "object"
    };
  }

  rpc Create(DocumentsCreateRequest) returns (DocumentsCreateResponse) {
    option (cleanapi.method).private = true;
    option (google.api.http) = {
      post: "/api/private/v1/documents"
      body: "object"
      response_body: "object"
    };
  }

  rpc Update(DocumentsUpdateRequest) returns (DocumentsUpdateResponse) {
    option (cleanapi.method).private = true;
    option (google.api.http) = {
      patch: "/api/private/v1/documents/{object.id}"
      body: "object"
      response_body: "object"
    };
  }

  rpc Delete(DocumentsDeleteRequest) returns (DocumentsDeleteResponse) {
    option (cleanapi.method).private = true;
    option (google.api.http) = {delete: "/api/private/v1/documents/{id}"};
  }

  rpc Signal(DocumentsSignalRequest) returns (DocumentsSignalResponse) {
    option (cleanapi.method).private = true;
  }
}
