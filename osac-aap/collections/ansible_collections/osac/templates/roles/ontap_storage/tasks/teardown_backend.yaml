---
# ONTAP teardown_backend: release the prepared assignment. Nothing else.
# Per the netapp-onboarding contract, OSAC never deletes ONTAP resources
# (SVMs, LIFs, accounts, QoS policies stay prepared for reuse); releasing
# flips the prepared Secret's claim annotation to 'retained' so the cloud
# admin can re-prepare or re-assign. Cluster-side resources belong to
# teardown_cluster_storage.
#
# Claim state lives on the prepared Secret itself (found by contract naming
# osac-<assignment_key>-credentials — no hub lifecycle Secret exists).
#
# The delete playbook does not pass tenant_uid, so ownership is verified
# against the annotation's stored tenant uid only when tenant_uid IS
# available; when it is not, the annotation's presence in state 'claimed'
# plus the assignment key's tenant_name binding is the guard.

- name: Validate tenant_name is a valid DNS label
  ansible.builtin.fail:
    msg: >-
      tenant_name '{{ tenant_name }}' is not a valid DNS label.
      Must be 1-63 lowercase alphanumeric characters or hyphens,
      cannot start or end with a hyphen.
  when: tenant_name is not regex('^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$')

- name: Compute the dispatched backend ids
  ansible.builtin.set_fact:
    _ontap_backend_ids: "{{ _provider_tiers | default([]) | map(attribute='backend_id') | select('string') | unique | list }}"

- name: Fail if no backend ids could be resolved
  ansible.builtin.fail:
    msg: >-
      Could not resolve any backend_id from the dispatched tiers. The ONTAP
      provider's prepared-assignment naming requires backend_id on every tier
      to locate the prepared Secret.
  when: _ontap_backend_ids | length == 0

- name: Release the prepared assignment per backend
  ansible.builtin.include_tasks: _teardown_backend_per_backend.yaml
  loop: "{{ _ontap_backend_ids }}"
  loop_control:
    loop_var: _ontap_backend_id
