apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/osac-project/osac?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "push" && target_branch.startsWith("refs/tags/osac-charts-release/")
  labels:
    appstudio.openshift.io/application: osac
    appstudio.openshift.io/component: osac-csi-backends-chart
    pipelines.appstudio.openshift.io/type: build
  name: osac-csi-backends-chart-on-release
  namespace: osac-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/redhat-user-workloads/osac-tenant/osac-csi-backends-chart:{{revision}}
  - name: chart-context
    value: osac-csi-driver/charts/csi-backends
  # Chart version is resolved by tag NAME (resolve-chart-version task
  # below), not by build-helm-chart-oci-ta's own default git-describe/
  # TAG_PREFIX mechanism: that mechanism requires this dedicated
  # osac-csi-backends-chart-vX.Y.Z tag to be reachable via git ancestry from this
  # exact commit, but osac-build-and-publish.yaml's "Create chart release
  # tags" step only pushes it when this chart's owning component is
  # actually bumped this release -- a release that pins everything
  # (the common case) leaves no such tag anywhere in this commit's
  # history (per-release stamping commits are never merged into main),
  # so git describe falls back to a nonsense, non-semver version like
  # "0.1.7392_5f8626895" -- confirmed live, a real release dispatch
  # with nothing bumped produced exactly that and silently published
  # it. tag-prefix is still the dedicated, slash-free tag (not the
  # per-component "<component>/vX.Y.Z" one --
  # see resolve-chart-version's own comment for why slash-free matters).
  - name: tag-prefix
    value: osac-csi-backends-chart-v
  pipelineSpec:
    description: |
      Packages and pushes a Helm chart to an OCI repository using trusted artifacts,
      for a real release. Chart version is computed from the dedicated chart git tag
      already pushed at this exact commit by osac-build-and-publish.yaml's own
      release tagging step.
    params:
    - description: Source Repository URL
      name: git-url
      type: string
    - default: ""
      description: Revision of the Source Repository
      name: revision
      type: string
    - description: Fully Qualified Output Image
      name: output-image
      type: string
    - default: dist/chart/
      description: Path to the Helm chart directory relative to the source root
      name: chart-context
      type: string
    - default: helm-
      description: An identifying prefix on which the version tag is to be matched
      name: tag-prefix
      type: string
    - default: "false"
      description: Execute the build with network isolation
      name: hermetic
      type: string
    - default: ""
      description: Build dependencies to be prefetched
      name: prefetch-input
      type: string
    - default: ""
      description: Image tag expiration time, time values could be something like
        1h, 2d, 3w for hours, days, and weeks, respectively.
      name: image-expires-after
      type: string
    - default: "false"
      description: Enable cache proxy configuration
      name: enable-cache-proxy
    - default: "true"
      description: Use the package registry proxy when prefetching dependencies
      name: enable-package-registry-proxy
      type: string
    results:
    - description: ""
      name: IMAGE_URL
      value: $(tasks.build-helm-chart.results.IMAGE_URL)
    - description: ""
      name: IMAGE_DIGEST
      value: $(tasks.build-helm-chart.results.IMAGE_DIGEST)
    - description: ""
      name: CHAINS-GIT_URL
      value: $(tasks.clone-repository.results.url)
    - description: ""
      name: CHAINS-GIT_COMMIT
      value: $(tasks.clone-repository.results.commit)
    tasks:
    - name: init
      params:
      - name: enable-cache-proxy
        value: $(params.enable-cache-proxy)
      taskRef:
        params:
        - name: name
          value: init
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-init:0.4.3@sha256:aa7ede4ed5470bc128f62701f3d7ba1fce87ba996eed9f59dd65eb62b8de437e
        - name: kind
          value: task
        resolver: bundles
    - name: resolve-chart-version
      params:
      - name: git-url
        value: $(params.git-url)
      - name: tag-prefix
        value: $(params.tag-prefix)
      - name: trigger-ref
        value: '{{target_branch}}'
      runAfter:
      - init
      taskSpec:
        params:
        - name: git-url
          type: string
        - name: tag-prefix
          type: string
        - name: trigger-ref
          type: string
        results:
        - name: CHART_VERSION
          description: The real chart version, resolved by tag name
        steps:
        - name: resolve
          # Same image build-helm-chart-oci-ta's own "package-and-push" step
          # uses -- already has git.
          image: quay.io/konflux-ci/tools@sha256:2112b51ba80d1041c120c32b67b871d371fde4e5775b32a3c7bf01a2f9ec0964
          env:
          - name: TRIGGER_REF
            value: $(params.trigger-ref)
          script: |
            #!/bin/bash
            set -euo pipefail

            # Resolve by tag NAME, not by git ancestry/revision -- see this
            # pipeline's own comment above tag-prefix for the full reasoning
            # (per-release stamping commits are never merged into main, so
            # neither an exact-match nor an ancestor-walking git describe can
            # find this chart's own tag unless it was bumped this exact
            # release). A tag may carry a prerelease suffix (e.g. a
            # release-branch freeze's "-rc.N" build) -- resolve the highest
            # BASE version first, then prefer a bare X.Y.Z tag at that base
            # over any prerelease tag sharing it (real semver precedence: a
            # release always outranks its own prereleases), falling back to
            # the highest prerelease tag only while no bare tag exists yet
            # at that base -- plain `sort -V` alone gets this backwards,
            # since it has no notion of semver precedence and sorts a bare
            # "X.Y.Z" BELOW "X.Y.Z-rc.N".
            #
            # Only tags in the release line of the triggering marker tag
            # are considered: tags are not branch-scoped, so without this
            # a patch release from an older release branch would resolve
            # to a newer line's version. The marker tag carries the
            # umbrella version, dotted (v0.4.1, v0.4.0-rc.2-retry1) or as
            # the prod promotion's dashed slug (v0-4-0-rc-2-prod-r1a1).
            # The version filter below is the grammar of RELEASE_VERSION_RE
            # (osac-installer/scripts/lib.sh). The result is always the
            # highest version in the line, which is why the release
            # workflow refuses to pin a component below its latest.
            if [[ ! "${TRIGGER_REF}" =~ ^refs/tags/osac-charts-release/v([0-9]+)[.-]([0-9]+)[.-][0-9]+ ]]; then
              echo "ERROR: cannot derive a release line from trigger ref ${TRIGGER_REF}" >&2
              exit 1
            fi
            LINE_RE="^${BASH_REMATCH[1]}\\.${BASH_REMATCH[2]}\\."
            echo "Resolving real chart version from $(params.tag-prefix)* in line ${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.x..."
            git clone --filter=blob:none --no-checkout "$(params.git-url)" /tmp/repo
            cd /tmp/repo
            git fetch --tags origin
            ALL_VERSIONS=$(git tag -l "$(params.tag-prefix)*" \
              | sed "s#^$(params.tag-prefix)##" \
              | { grep -E '^(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})(-rc\.[1-9][0-9]{0,5})?$' || true; } \
              | { grep -E "${LINE_RE}" || true; })
            if [ -z "${ALL_VERSIONS}" ]; then
              echo "ERROR: no release tag matching $(params.tag-prefix)* found in that line" >&2
              exit 1
            fi
            MAX_BASE=$(printf '%s\n' "${ALL_VERSIONS}" | sed -E 's/-.*$//' | sort -V | tail -1)
            BARE_AT_MAX=$(printf '%s\n' "${ALL_VERSIONS}" | grep -Fx "${MAX_BASE}" || true)
            if [ -n "${BARE_AT_MAX}" ]; then
              CHART_VERSION="${MAX_BASE}"
            else
              CHART_VERSION=$(printf '%s\n' "${ALL_VERSIONS}" | grep -F -- "${MAX_BASE}-" | sort -V | tail -1)
            fi
            echo "Real chart version: ${CHART_VERSION}"
            echo -n "${CHART_VERSION}" >"$(results.CHART_VERSION.path)"
    - name: clone-repository
      params:
      - name: url
        value: $(params.git-url)
      - name: revision
        value: $(params.revision)
      - name: ociStorage
        value: $(params.output-image).git
      - name: ociArtifactExpiresAfter
        value: $(params.image-expires-after)
      runAfter:
      - init
      taskRef:
        params:
        - name: name
          value: git-clone-oci-ta
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-git-clone-oci-ta:0.2.6@sha256:26fc26a0bde8081ed4244024f56d4fe79dedca6a9ab37fbb09c24e34c02456fc
        - name: kind
          value: task
        resolver: bundles
      workspaces:
      - name: basic-auth
        workspace: git-auth
    - name: prefetch-dependencies
      params:
      - name: input
        value: $(params.prefetch-input)
      - name: SOURCE_ARTIFACT
        value: $(tasks.clone-repository.results.SOURCE_ARTIFACT)
      - name: ociStorage
        value: $(params.output-image).prefetch
      - name: ociArtifactExpiresAfter
        value: $(params.image-expires-after)
      - name: enable-package-registry-proxy
        value: $(params.enable-package-registry-proxy)
      runAfter:
      - clone-repository
      taskRef:
        params:
        - name: name
          value: prefetch-dependencies-oci-ta
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-prefetch-dependencies-oci-ta:0.11.1@sha256:b57b0a2d0a017db019e2312e11298b317e0e943dd0a1dae008c5bf29f8c90a22
        - name: kind
          value: task
        resolver: bundles
      workspaces:
      - name: git-basic-auth
        workspace: git-auth
      - name: netrc
        workspace: netrc
    - name: build-helm-chart
      params:
      - name: IMAGE
        value: $(params.output-image)
      - name: COMMIT_SHA
        value: $(tasks.clone-repository.results.commit)
      - name: SOURCE_ARTIFACT
        value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
      - name: CHART_CONTEXT
        value: $(params.chart-context)
      - name: CHART_VERSION
        value: $(tasks.resolve-chart-version.results.CHART_VERSION)
      runAfter:
      - prefetch-dependencies
      - resolve-chart-version
      taskRef:
        params:
        - name: name
          value: build-helm-chart-oci-ta
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-build-helm-chart-oci-ta:0.4.1@sha256:6f526d1490e7fbbffbab0baa93a30d3ca2c2461642077fc4dded6e9a58831b54
        - name: kind
          value: task
        resolver: bundles
    workspaces:
    - name: git-auth
      optional: true
    - name: netrc
      optional: true
  taskRunTemplate:
    serviceAccountName: build-pipeline-osac-csi-backends-chart
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
