# GPU-enabled Linux Virtual Machine catalog item
# A Linux virtual machine with one NVIDIA GPU attached.

'@type': type.googleapis.com/osac.private.v1.ComputeInstanceCatalogItem
metadata:
  name: linux-vm-gpu
title: Linux Virtual Machine (GPU)
description: A Linux virtual machine with one NVIDIA GPU attached. Suitable for AI/ML workloads and GPU-accelerated
  computing.
template:
  id: osac.templates.ocp_virt_vm
  tenant: shared
published: true
fields:
  instance_type:
    editable:
      default_value:
        name: u1-large
        tenant: shared
  boot_disk:
    size_gib:
      editable:
        default_value: 120
  disk_image:
    editable:
      default_value:
        name: fedora
        tenant: shared
  run_strategy:
    editable:
      default_value: COMPUTE_INSTANCE_RUN_STRATEGY_ALWAYS
  user_data_source:
    editable: {}
