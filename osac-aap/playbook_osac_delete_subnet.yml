---
- name: Delete a Subnet resource
  hosts: localhost
  gather_facts: false

  vars:
    subnet: "{{ osac_job_vars.resource }}"
    subnet_name: "{{ osac_job_vars.resource.metadata.name }}"
    # Implementation strategy set by osac-operator from parent VirtualNetwork spec
    implementation_strategy: >-
      {{ osac_job_vars.resource.metadata.annotations
         ['osac.openshift.io/implementation-strategy'] }}
    template_parameters: {}
  pre_tasks:
    - name: Show resource metadata
      ansible.builtin.debug:
        var: osac_job_vars.resource.metadata

  tasks:
    - name: Display Subnet information
      ansible.builtin.debug:
        msg:
          - "Deleting Subnet: {{ subnet_name }}"
          - "Implementation strategy: {{ implementation_strategy }}"

    - name: Delete Subnet with sanitized Netris failure details
      block:
        - name: Call the selected Subnet role
          ansible.builtin.include_role:
            name: "osac.templates.{{ implementation_strategy }}"
            tasks_from: delete_subnet
      rescue:
        - name: Report Subnet deletion failure
          ansible.builtin.include_role:
            name: osac.templates.netris
            tasks_from: _report_failure
          vars:
            _netris_failure_operation: delete
            _netris_failure_resource_type: Subnet
            _netris_failure_resource_name: "{{ subnet_name }}"
            _netris_failure_task: "{{ ansible_failed_task.name | default('unknown provider task') }}"
            _netris_failure_result: "{{ ansible_failed_result | default({}) }}"
          when: implementation_strategy == 'netris'
        - name: Re-raise original failure for other networking managers
          ansible.builtin.fail:
            msg: "{{ ansible_failed_result.msg | default(ansible_failed_task.name | default('operation failed')) }}"
          when: implementation_strategy != 'netris'
