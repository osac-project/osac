name: Verify shared Python setup

# A push can run this branch-only workflow before it exists on main.
on:
  push:
    branches:
      - test/uv-python-centos
    paths:
      - .github/actions/setup-python/**
      - .github/workflows/verify-python-centos.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: verify-python-centos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-python:
    # The osac-ci runners are available to the upstream repository.
    if: github.repository == 'osac-project/osac'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: osac-ci
            os-id: centos
          - runner: ubuntu-latest
            os-id: ubuntu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read  # Checkout the composite action being verified.
    steps:
      - name: Checkout verification commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Prepare fresh Python installation
        shell: bash
        run: |
          set -euo pipefail
          verify_dir="$(mktemp -d "${RUNNER_TEMP}/osac-python-verify.XXXXXX")"
          {
            printf 'UV_PYTHON_INSTALL_DIR=%s/python\n' "$verify_dir"
            printf 'UV_CACHE_DIR=%s/cache\n' "$verify_dir"
          } >> "$GITHUB_ENV"

      - name: Set up shared Python environment
        uses: ./.github/actions/setup-python

      - name: Verify Python executables and runner platform
        shell: bash
        env:
          EXPECTED_OS_ID: ${{ matrix.os-id }}
        run: |
          set -euo pipefail
          cat /etc/os-release
          for executable in python python3; do
            "$executable" - <<'PY'
          import os
          import platform
          import sys

          release = platform.freedesktop_os_release()
          print(sys.executable)
          print(sys.version)
          assert release["ID"] == os.environ["EXPECTED_OS_ID"], release
          if release["ID"] == "centos":
              assert release["VERSION_ID"] == "10", release
          assert platform.machine() == "x86_64", platform.machine()
          assert sys.version_info[:2] == (3, 14), sys.version
          assert sys.prefix != sys.base_prefix, (sys.prefix, sys.base_prefix)
          PY
          done

      - name: Verify pip and pre-commit console script
        shell: bash
        run: |
          set -euo pipefail
          python -m pip --version
          python -m pip install pre-commit
          python -m pip freeze --local
          pre-commit --version

      - name: Verify Ruff and release summary dependencies
        shell: bash
        run: |
          set -euo pipefail
          ruff_version="$(ruff --version)"
          printf '%s\n' "$ruff_version"
          test "$ruff_version" = 'ruff 0.15.16'
          uv run --no-project --with pyyaml==6.0.3 python - <<'PY'
          import sys

          import yaml

          assert sys.version_info[:2] == (3, 14), sys.version
          assert yaml.__version__ == "6.0.3", yaml.__version__
          print("PASS: Python 3.14 and shared action consumers")
          PY
