---
# Contract tests for config-as-code instance group pod spec templates.

- name: Compute-instance pod spec without remote kubeconfig
  hosts: localhost
  gather_facts: false
  vars:
    aap_ee_image: ghcr.io/osac-project/osac-aap:latest
    osac_sa_name: osac-sa
    remote_cluster_kubeconfig_secret_name: ""
    _template_path: >-
      {{ playbook_dir }}/../../../../../collections/ansible_collections/osac/config_as_code/roles/aap/templates/compute-instance-operations-ig.j2

  tasks:
    - name: Render compute-instance-operations pod spec
      ansible.builtin.set_fact:
        _pod_spec: "{{ lookup('ansible.builtin.template', _template_path) }}"

    - name: Parse rendered pod spec
      ansible.builtin.set_fact:
        _pod: "{{ _pod_spec | from_yaml }}"

    - name: Extract compute-instance secretRef from envFrom
      ansible.builtin.set_fact:
        _compute_secret_ref: >-
          {{
            _pod.spec.containers[0].envFrom
            | selectattr('secretRef', 'defined')
            | map(attribute='secretRef')
            | selectattr('name', 'equalto', 'compute-instance-operations-ig')
            | list
            | first
          }}

    - name: Assert dedicated compute-instance secret is referenced optionally
      ansible.builtin.assert:
        that:
          - _compute_secret_ref is defined
          - _compute_secret_ref.name == 'compute-instance-operations-ig'
          - _compute_secret_ref.optional | default(false) | bool
        fail_msg: Expected optional compute-instance-operations-ig secretRef in pod spec

    - name: Assert cluster-fulfillment secret is not referenced
      ansible.builtin.assert:
        that:
          - "_pod_spec is not search('cluster-fulfillment-ig')"
        fail_msg: Pod spec must not reference cluster-fulfillment-ig

    - name: Assert storage-operations references are retained
      ansible.builtin.assert:
        that:
          - "_pod_spec is search('storage-operations-ig')"
        fail_msg: Expected storage-operations-ig references in pod spec

- name: Compute-instance pod spec with remote kubeconfig
  hosts: localhost
  gather_facts: false
  vars:
    aap_ee_image: ghcr.io/osac-project/osac-aap:latest
    osac_sa_name: osac-sa
    remote_cluster_kubeconfig_secret_name: remote-cluster-kubeconfig
    remote_cluster_kubeconfig_secret_key: kubeconfig
    _template_path: >-
      {{ playbook_dir }}/../../../../../collections/ansible_collections/osac/config_as_code/roles/aap/templates/compute-instance-operations-ig.j2

  tasks:
    - name: Render compute-instance-operations pod spec with remote cluster
      ansible.builtin.set_fact:
        _pod_spec_remote: "{{ lookup('ansible.builtin.template', _template_path) }}"

    - name: Assert remote kubeconfig volume is present when configured
      ansible.builtin.assert:
        that:
          - "_pod_spec_remote is search('remote-cluster-kubeconfig')"
          - "_pod_spec_remote is search('OSAC_REMOTE_CLUSTER_KUBECONFIG')"
        fail_msg: Expected remote cluster kubeconfig mount when secret name is set

- name: Storage operations pod spec without remote kubeconfig
  hosts: localhost
  gather_facts: false
  vars:
    aap_ee_image: ghcr.io/osac-project/osac-aap:latest
    osac_sa_name: osac-sa
    remote_cluster_kubeconfig_secret_name: ""
    remote_cluster_kubeconfig_secret_key: kubeconfig
    _template_path: >-
      {{ playbook_dir }}/../../../../../collections/ansible_collections/osac/config_as_code/roles/aap/templates/storage-operations-ig.j2

  tasks:
    - name: Render storage-operations pod spec without remote cluster
      ansible.builtin.set_fact:
        _storage_pod_spec: "{{ lookup('ansible.builtin.template', _template_path) }}"

    - name: Parse storage-operations pod spec
      ansible.builtin.set_fact:
        _storage_pod: "{{ _storage_pod_spec | from_yaml }}"

    - name: Assert storage credentials remain isolated
      ansible.builtin.assert:
        that:
          - >-
            _storage_pod.spec.containers[0].envFrom
            | selectattr('secretRef', 'defined')
            | map(attribute='secretRef')
            | selectattr('name', 'equalto', 'storage-operations-ig')
            | selectattr('optional', 'defined')
            | list | length == 1
          - "_storage_pod_spec is not search('compute-instance-operations-ig')"
          - "_storage_pod_spec is not search('remote-cluster-kubeconfig')"
        fail_msg: >-
          Storage operations must keep their isolated optional credentials and
          omit the remote kubeconfig mount when no secret is configured.

- name: Storage operations pod spec with remote kubeconfig
  hosts: localhost
  gather_facts: false
  vars:
    aap_ee_image: ghcr.io/osac-project/osac-aap:latest
    osac_sa_name: osac-sa
    remote_cluster_kubeconfig_secret_name: remote-cluster-kubeconfig
    remote_cluster_kubeconfig_secret_key: kubeconfig
    _template_path: >-
      {{ playbook_dir }}/../../../../../collections/ansible_collections/osac/config_as_code/roles/aap/templates/storage-operations-ig.j2

  tasks:
    - name: Render storage-operations pod spec with remote cluster
      ansible.builtin.set_fact:
        _storage_pod_spec_remote: "{{ lookup('ansible.builtin.template', _template_path) }}"

    - name: Parse remote storage-operations pod spec
      ansible.builtin.set_fact:
        _storage_pod_remote: "{{ _storage_pod_spec_remote | from_yaml }}"

    - name: Assert remote kubeconfig is mounted and exported
      ansible.builtin.assert:
        that:
          - >-
            _storage_pod_remote.spec.containers[0].volumeMounts
            | selectattr('name', 'equalto', 'remote-cluster-kubeconfig')
            | selectattr('mountPath', 'equalto', '/etc/osac')
            | list | length == 1
          - >-
            _storage_pod_remote.spec.volumes
            | selectattr('name', 'equalto', 'remote-cluster-kubeconfig')
            | selectattr('secret.secretName', 'equalto', 'remote-cluster-kubeconfig')
            | list | length == 1
          - >-
            _storage_pod_remote.spec.containers[0].env
            | selectattr('name', 'equalto', 'OSAC_REMOTE_CLUSTER_KUBECONFIG')
            | selectattr('value', 'equalto', '/etc/osac/remote-cluster-kubeconfig')
            | list | length == 1
          - "_storage_pod_spec_remote is not search('compute-instance-operations-ig')"
        fail_msg: >-
          Storage operations must mount and export the configured remote kubeconfig
          without including compute-instance credentials.

- name: Networking operations pod spec receives manager settings and CA mount
  hosts: localhost
  gather_facts: false
  vars:
    aap_ee_image: ghcr.io/osac-project/osac-aap:latest
    osac_sa_name: osac-sa
    remote_cluster_kubeconfig_secret_name: remote-cluster-kubeconfig
    remote_cluster_kubeconfig_secret_key: kubeconfig
    netris_ca_config_map_name: customer-netris-ca
    netris_ca_path: /etc/netris/ca/bundle.pem
    _templates_dir: >-
      {{ playbook_dir }}/../../../../../collections/ansible_collections/osac/config_as_code/roles/aap/templates

  tasks:
    - name: Render the networking pod spec
      ansible.builtin.set_fact:
        _networking_pod_spec: "{{ lookup('ansible.builtin.template', _templates_dir ~ '/networking-operations-ig.j2') }}"

    - name: Parse the networking pod spec
      ansible.builtin.set_fact:
        _networking_pod: "{{ _networking_pod_spec | from_yaml }}"

    - name: Assert networking jobs load only the network-fulfillment-ig settings and secrets
      ansible.builtin.assert:
        that:
          - >-
            _networking_pod.spec.containers[0].envFrom
            | selectattr('configMapRef', 'defined')
            | map(attribute='configMapRef.name') | list == ['network-fulfillment-ig']
          - >-
            _networking_pod.spec.containers[0].envFrom
            | selectattr('secretRef', 'defined')
            | map(attribute='secretRef.name') | list == ['network-fulfillment-ig']
          - >-
            _networking_pod.spec.containers[0].envFrom
            | selectattr('secretRef', 'defined')
            | map(attribute='secretRef') | selectattr('optional', 'defined') | list | length == 0
          - _networking_pod.spec.serviceAccountName == 'osac-sa'
        fail_msg: Networking jobs must read the ConfigMap (optional) and the required Secret network-fulfillment-ig.

    - name: Assert networking jobs load only the manager settings and secrets
      ansible.builtin.assert:
        that:
          - >-
            _networking_pod.spec.containers[0].env
            | selectattr('name', 'equalto', 'NETRIS_CA_PATH')
            | selectattr('value', 'equalto', '/etc/netris/ca/bundle.pem')
            | list | length == 1
          - >-
            _networking_pod.spec.containers[0].env
            | selectattr('name', 'equalto', 'ANSIBLE_STRATEGY')
            | list | length == 0
          - >-
            _networking_pod.spec.containers[0].env
            | selectattr('name', 'equalto', 'OSAC_LAUNCH_EXTRA_VARS_PATH')
            | selectattr('value', 'equalto', '/runner/env/extravars')
            | list | length == 1
          - >-
            _networking_pod.spec.containers[0].volumeMounts
            | selectattr('name', 'equalto', 'netris-ca-bundle')
            | selectattr('mountPath', 'equalto', '/etc/netris/ca/bundle.pem')
            | selectattr('readOnly', 'equalto', true)
            | list | length == 1
          - >-
            (_networking_pod.spec.volumes
             | selectattr('name', 'equalto', 'netris-ca-bundle')
             | list | first).configMap.name == 'customer-netris-ca'
          - >-
            (_networking_pod.spec.volumes
             | selectattr('name', 'equalto', 'netris-ca-bundle')
             | list | first).configMap.optional == false
          - "_networking_pod_spec is not search('agentless-net-inventory')"
          - "_networking_pod_spec is not search('remote-cluster-kubeconfig')"
        fail_msg: >-
          Networking jobs must load their settings from network-fulfillment-ig,
          and mount the configured CA bundle.

- name: Networking operations pod spec without a Netris CA
  hosts: localhost
  gather_facts: false
  vars:
    aap_ee_image: ghcr.io/osac-project/osac-aap:latest
    osac_sa_name: osac-sa
    netris_ca_config_map_name: ""
    netris_ca_path: ""
    _template_path: >-
      {{ playbook_dir }}/../../../../../collections/ansible_collections/osac/config_as_code/roles/aap/templates/networking-operations-ig.j2

  tasks:
    - name: Render networking pod spec without a Netris CA
      ansible.builtin.set_fact:
        _networking_pod_no_ca: "{{ lookup('ansible.builtin.template', _template_path) | from_yaml }}"

    - name: Assert networking has no CA mount when none is configured
      ansible.builtin.assert:
        that:
          - >-
            _networking_pod_no_ca.spec.containers[0].env
            | selectattr('name', 'equalto', 'NETRIS_CA_PATH')
            | selectattr('value', 'equalto', '')
            | list | length == 1
          - >-
            _networking_pod_no_ca.spec.volumes
            | selectattr('name', 'equalto', 'netris-ca-bundle')
            | list | length == 0
        fail_msg: >-
          Networking jobs without a configured CA must export an empty CA path
          and omit the CA volume.

- name: Cluster fulfillment pod spec has no provider-specific network settings
  hosts: localhost
  gather_facts: false
  vars:
    aap_ee_image: ghcr.io/osac-project/osac-aap:latest
    osac_sa_name: osac-sa
    netris_ca_config_map_name: customer-netris-ca
    netris_ca_path: /etc/netris/ca/bundle.pem
    _template_path: >-
      {{ playbook_dir }}/../../../../../collections/ansible_collections/osac/config_as_code/roles/aap/templates/cluster-fulfillment-ig.j2

  tasks:
    - name: Render cluster-fulfillment pod spec
      ansible.builtin.set_fact:
        _cluster_pod_spec: "{{ lookup('ansible.builtin.template', _template_path) }}"

    - name: Parse cluster-fulfillment pod spec
      ansible.builtin.set_fact:
        _cluster_pod: "{{ _cluster_pod_spec | from_yaml }}"

    - name: Assert cluster fulfillment does not receive manager settings or credentials
      ansible.builtin.assert:
        that:
          - "_cluster_pod_spec is not search('NETRIS_')"
          - "_cluster_pod_spec is not search('netris-ca-bundle')"
          - "_cluster_pod_spec is not search('netris-credentials')"
          - "_cluster_pod_spec is not search('agentless-net-inventory')"
        fail_msg: >-
          Cluster fulfillment must not carry network-manager settings, secrets,
          or the AgentlessNet inventory.

- name: Config-as-code pod specs honor the configured OSAC service account
  hosts: localhost
  gather_facts: false
  vars:
    aap_ee_image: ghcr.io/osac-project/osac-aap:latest
    osac_sa_name: customer-aap-sa
    remote_cluster_kubeconfig_secret_name: ""
    remote_cluster_kubeconfig_secret_key: kubeconfig
    netris_controller_url: https://managed.example
    netris_ca_config_map_name: ""
    netris_validate_certs: true
    netris_ca_path: ""
    _templates_dir: >-
      {{ playbook_dir }}/../../../../../collections/ansible_collections/osac/config_as_code/roles/aap/templates

  tasks:
    - name: Render every config-as-code pod spec with a configured service account
      ansible.builtin.set_fact:
        _sa_pod_specs: >-
          {{ _sa_pod_specs | default([]) + [
             {'name': item,
              'pod': lookup('ansible.builtin.template', _templates_dir ~ '/' ~ item) | from_yaml}
          ] }}
      loop:
        - cluster-fulfillment-ig.j2
        - compute-instance-operations-ig.j2
        - networking-operations-ig.j2
        - storage-operations-ig.j2
      loop_control:
        label: "{{ item }}"

    - name: Assert every pod spec uses the configured service account
      ansible.builtin.assert:
        that:
          - item.pod.spec.serviceAccountName == 'customer-aap-sa'
        fail_msg: "{{ item.name }} must use the configured OSAC service account"
      loop: "{{ _sa_pod_specs }}"
      loop_control:
        label: "{{ item.name }}"
