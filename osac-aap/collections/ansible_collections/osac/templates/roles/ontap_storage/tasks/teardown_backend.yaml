---
- name: Teardown backend block with always cleanup
  block:
    - name: Compute assignment key for this backend
      ansible.builtin.set_fact:
        _current_backend_id: "{{ _provider_tiers[0].backend_id }}"
        _assignment_key: >-
          {{ ((_provider_tiers[0].backend_id ~ '|' ~ tenant_name)
              | hash('sha256'))[:16] | lower }}

    - name: Discover Hub Lifecycle Secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "ontap-tenant-{{ _assignment_key }}"
        namespace: "{{ ontap_storage_config_namespace }}"
      register: _hub_secret_result
      no_log: true

    - name: Fail if Hub Lifecycle Secret not found
      ansible.builtin.fail:
        msg: "Hub Lifecycle Secret ontap-tenant-{{ _assignment_key }} not found. Cannot teardown backend."
      when: _hub_secret_result.resources | length == 0

    - name: Extract Prepared Secret reference
      ansible.builtin.set_fact:
        _prepared_secret_name: "{{ _hub_secret_result.resources[0].data.prepared_secret_name | b64decode }}"

    - name: Discover Prepared Secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "{{ _prepared_secret_name }}"
        namespace: "{{ ontap_storage_config_namespace }}"
      register: _prepared_secret_result
      no_log: true

    - name: Verify original assignment ownership
      ansible.builtin.set_fact:
        _current_tenant_uid: "{{ _prepared_secret_result.resources[0].metadata.annotations['osac.openshift.io/storage-tenant-uid'] | default('') }}"
      when: _prepared_secret_result.resources | length > 0

    - name: Fail if original tenant does not match
      ansible.builtin.fail:
        msg: "Refusing to teardown backend: Prepared Secret {{ _prepared_secret_name }} is claimed by tenant {{ _current_tenant_uid }}, but expected {{ tenant_uid }}."
      when: >-
        _prepared_secret_result.resources | length > 0 and
        _current_tenant_uid != tenant_uid

    - name: Release claim (atomic patch)
      kubernetes.core.k8s:
        state: patched
        api_version: v1
        kind: Secret
        name: "{{ _prepared_secret_name }}"
        namespace: "{{ ontap_storage_config_namespace }}"
        resource_definition:
          metadata:
            resourceVersion: "{{ _prepared_secret_result.resources[0].metadata.resourceVersion | string }}"
            annotations:
              osac.openshift.io/storage-assignment-state: retained
      when: 
        - _prepared_secret_result.resources | length > 0
        - _prepared_secret_result.resources[0].metadata.annotations['osac.openshift.io/storage-assignment-state'] | default('') == 'claimed'
      no_log: true

  always:
    - name: Clear credential-bearing facts
      ansible.builtin.set_fact:
        _hub_secret_result: {}
        _prepared_secret_result: {}
      no_log: true