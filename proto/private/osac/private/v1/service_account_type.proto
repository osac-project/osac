syntax = "proto3";

package osac.private.v1;

import "buf/validate/validate.proto";
import "cleanapi/cleanapi.proto";
import "osac/private/v1/metadata_type.proto";
import "osac/private/v1/secret_type.proto";

option (cleanapi.file).package = "osac.public.v1";

// A tenant-owned machine identity. Its client credential is stored in a separate Secret resource.
message ServiceAccount {
  option (buf.validate.message).cel = {
    id: "service_account.project"
    message: "service accounts cannot belong to a project"
    expression: "this.metadata.project == ''"
  };

  // Unique identifier assigned by the server.
  string id = 1;

  // Name and tenant ownership. The name is immutable and unique within the tenant, including during deletion.
  Metadata metadata = 2 [(buf.validate.field).required = true];

  // Service-account access is assigned through RoleBindings.
  ServiceAccountSpec spec = 3;

  // Server-controlled identity. Input values are ignored on creation and public updates.
  ServiceAccountStatus status = 4;
}

// ServiceAccountSpec is empty. Access is assigned through RoleBindings.
message ServiceAccountSpec {}

// Current lifecycle state of a service account.
enum ServiceAccountState {
  // The state is not known.
  SERVICE_ACCOUNT_STATE_UNSPECIFIED = 0;
  // The controller is provisioning the Keycloak client and credential Secret.
  SERVICE_ACCOUNT_STATE_PENDING = 1;
  // The Keycloak client and credential Secret are ready for use.
  SERVICE_ACCOUNT_STATE_READY = 2;
  // Provisioning cannot continue without operator action.
  SERVICE_ACCOUNT_STATE_FAILED = 3;
}

// Server-controlled service-account identity. Credential bytes are stored in a separate Secret.
message ServiceAccountStatus {
  // Reference to the tenant Secret containing the client ID and credential. The controller creates
  // this Secret after provisioning the Keycloak client; state is READY once the Secret is available.
  SecretLocalReference client_secret = 1;

  // Current lifecycle state. The account is READY only after its credential Secret is created.
  ServiceAccountState state = 2;

  // Human-readable details about the current state, especially why provisioning failed.
  optional string message = 3;

  // Internal Keycloak client identifier used for lifecycle operations.
  string keycloak_client_uuid = 4 [(cleanapi.field).private = true];

  // Internal Secret reference holding the registration credentials used for client cleanup.
  SecretLocalReference registration_secret = 5 [(cleanapi.field).private = true];
}
