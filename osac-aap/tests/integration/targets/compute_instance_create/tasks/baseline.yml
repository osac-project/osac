---
- name: Compute Instance Create - Baseline Test
  hosts: localhost
  gather_facts: true
  vars_files:
    - ../../../common_vars.yml

  tasks:
    - name: Read ComputeInstance fixture
      ansible.builtin.set_fact:
        test_compute_instance: "{{ lookup('file', '../../../fixtures/computeinstance-test.yaml') | from_yaml }}"

    - name: Set test variables for baseline workflow
      ansible.builtin.set_fact:
        osac_job_vars:
          resource: "{{ test_compute_instance }}"
          vm_network:
            namespace: test-subnet
            networks: [{name: tenant, pod: {}}]
            interfaces: [{name: tenant, binding: {name: l2bridge}}]
            labels: {osac.openshift.io/compute-instance-id: 3c0b9d2e-1111-4a5b-9c7d-2e4f6a8b0c12}
        tenant_storage_class_storage_classes:
          - name: "test-storage-class"
            tier: "local"
        # Override only resource creation to prevent actual VM/DataVolume creation
        create_step_resources_override:
          name: osac.workflows.workflow_helpers
          tasks_from: noop.yml
        # Override wait/annotate since there's no VM to wait for
        create_step_wait_annotate_override:
          name: osac.workflows.workflow_helpers
          tasks_from: noop.yml

- name: Import compute instance create workflow (baseline)
  ansible.builtin.import_playbook: osac.workflows.compute_instance.create

- name: Verify baseline results
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../../common_vars.yml

  tasks:
    - name: Verify compute instance name extracted
      ansible.builtin.assert:
        that:
          - compute_instance_name is defined
          - compute_instance_name == "test-vm"
        fail_msg: "Compute instance name not extracted correctly"

    - name: Verify subnet target namespace supplied
      ansible.builtin.assert:
        that:
          - compute_instance_target_namespace == 'test-subnet'
        fail_msg: >-
          compute_instance_target_namespace is '{{ compute_instance_target_namespace | default('<unset>') }}',
          expected osac_job_vars.vm_network.namespace 'test-subnet'

    - name: Show the VM network wiring
      ansible.builtin.debug:
        msg: >-
          networks={{ vm_template_spec.networks | default('<unset>') }}
          interfaces={{ vm_template_spec.domain.devices.interfaces | default('<unset>') }}
          labels={{ default_vm_labels | default('<unset>') }}

    - name: Verify the VM template spec uses vm_network.networks unchanged
      ansible.builtin.assert:
        that:
          - vm_template_spec.networks == osac_job_vars.vm_network.networks
        fail_msg: >-
          vm_template_spec.networks is {{ vm_template_spec.networks | default('<unset>') }},
          expected osac_job_vars.vm_network.networks {{ osac_job_vars.vm_network.networks }}

    - name: Verify the VM template spec uses vm_network.interfaces unchanged
      ansible.builtin.assert:
        that:
          - vm_template_spec.domain.devices.interfaces == osac_job_vars.vm_network.interfaces
        fail_msg: >-
          vm_template_spec.domain.devices.interfaces is
          {{ vm_template_spec.domain.devices.interfaces | default('<unset>') }},
          expected osac_job_vars.vm_network.interfaces {{ osac_job_vars.vm_network.interfaces }}

    - name: Verify the VM labels carry the compute-instance-id label of vm_network.labels
      ansible.builtin.assert:
        that:
          - >-
            default_vm_labels['osac.openshift.io/compute-instance-id'] | default('')
            == '3c0b9d2e-1111-4a5b-9c7d-2e4f6a8b0c12'
        fail_msg: >-
          default_vm_labels is {{ default_vm_labels | default('<unset>') }}; it must include
          osac.openshift.io/compute-instance-id=3c0b9d2e-1111-4a5b-9c7d-2e4f6a8b0c12 from vm_network.labels

    - name: Exercise namespaced resource creation in the resolved subnet namespace
      block:
        - name: Create a test ConfigMap in the VM target namespace
          kubernetes.core.k8s:
            kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
            state: present
            definition:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: test-vm-placement
                namespace: "{{ compute_instance_target_namespace }}"

        - name: Read the test ConfigMap from the VM target namespace
          kubernetes.core.k8s_info:
            kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
            api_version: v1
            kind: ConfigMap
            name: test-vm-placement
            namespace: "{{ compute_instance_target_namespace }}"
          register: placement_configmap

        - name: Verify resource placement
          ansible.builtin.assert:
            that:
              - placement_configmap.resources | length == 1
              - placement_configmap.resources[0].metadata.namespace == 'test-subnet'
      always:
        - name: Remove the test ConfigMap
          kubernetes.core.k8s:
            kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
            state: absent
            api_version: v1
            kind: ConfigMap
            name: test-vm-placement
            namespace: "{{ compute_instance_target_namespace }}"

    - name: Verify template ID extracted
      ansible.builtin.assert:
        that:
          - template_id is defined
          - template_id == "osac.templates.ocp_virt_vm"
        fail_msg: "Template ID not extracted correctly"

    - name: Verify user-specified spec values override template defaults
      ansible.builtin.assert:
        that:
          - vm_memory == "4Gi"
          - vm_boot_disk_size == "20Gi"
        fail_msg: "User spec values should override template defaults."
