---
name: E2E VMaaS Full Install

permissions:
  contents: read

on:
  workflow_call:
  schedule:
    - cron: "7 0,2,5,7,10,12,14,17,19,22 * * *"
  workflow_dispatch:
    inputs:
      test-suite:
        description: "Test suite (vmaas, caas, or empty for all)"
        required: false
        default: "vmaas"
      test-filter:
        description: "pytest -k filter"
        required: false
        default: ""
      test-infra-ref:
        description: "Branch/ref of osac-test-infra"
        required: false
        default: "main"

jobs:
  # Builds fulfillment-service, osac-operator, osac-aap's execution
  # environment (twice -- once each for aap.bootstrap.image and
  # aap.configAsCode.eeImage, see OSAC-3546), and bare-metal-fulfillment-operator
  # from this PR's current code and installs them together in one cluster --
  # not one "component under test" plus stale pinned images for the others.
  # Runs for any change touching any component (see `changes` above) rather
  # than being path-scoped per component; splitting this by component to
  # avoid running both suites when only one changed is deferred to the future
  # full path-based CI matrix, once its skip-logic pattern is verified.
  #
  # bare-metal-fulfillment-operator's image override (bmf.image.repository)
  # is currently a no-op in this flow specifically: values/vmaas-ci/values.yaml
  # sets bmf.enabled: false, so the chart isn't deployed here at all. Still
  # built from source for consistency with the other 3 components (all 4
  # should build from the PR in every e2e flow, even where one isn't
  # currently deployed) -- revisit if vmaas ever needs BMF enabled.
  e2e-vmaas-full-install:
    uses: osac-project/osac-test-infra/.github/workflows/e2e-vmaas-full-install.yml@main
    with:
      test-suite: ${{ inputs.test-suite || 'vmaas' }}
      test-filter: ${{ inputs.test-filter || '' }}
      # osac-installer now lives as a subdirectory of this same monorepo checkout
      # (its Chart.yaml deps resolve fulfillment-service/osac-operator/osac-aap/BMF
      # as ../../../<name> siblings within it), so a PR touching those components
      # must deploy from this PR's own fork/ref, not the reusable workflow's
      # standalone-repo default.
      installer-repo: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      installer-ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      # Build all component images from the PR's fork/branch (same monorepo checkout).
      # osac-aap's execution-environment is built twice (aap.bootstrap.image and
      # aap.configAsCode.eeImage): the two are logically the same image but the
      # override mechanism keys strictly off imageKey, one build per key, so this
      # is the only way to get both fields covered without changing that mechanism
      # (which lives in osac-test-infra, not here). See OSAC-3546.
      components: '[{"repo":"${{ github.event.pull_request.head.repo.full_name || github.repository }}","ref":"${{ github.event.pull_request.head.ref || github.ref_name }}","containerfile":"fulfillment-service/Containerfile","context":".","imageKey":"service.images.service"},{"repo":"${{ github.event.pull_request.head.repo.full_name || github.repository }}","ref":"${{ github.event.pull_request.head.ref || github.ref_name }}","containerfile":"osac-operator/Containerfile","context":".","imageKey":"operator.image.repository"},{"repo":"${{ github.event.pull_request.head.repo.full_name || github.repository }}","ref":"${{ github.event.pull_request.head.ref || github.ref_name }}","containerfile":"osac-aap/execution-environment/execution-environment.yaml","imageKey":"aap.bootstrap.image","buildType":"ansible-builder"},{"repo":"${{ github.event.pull_request.head.repo.full_name || github.repository }}","ref":"${{ github.event.pull_request.head.ref || github.ref_name }}","containerfile":"osac-aap/execution-environment/execution-environment.yaml","imageKey":"aap.configAsCode.eeImage","buildType":"ansible-builder"},{"repo":"${{ github.event.pull_request.head.repo.full_name || github.repository }}","ref":"${{ github.event.pull_request.head.ref || github.ref_name }}","containerfile":"bare-metal-fulfillment-operator/Containerfile","context":".","imageKey":"bmf.image.repository"},{"repo":"${{ github.event.pull_request.head.repo.full_name || github.repository }}","ref":"${{ github.event.pull_request.head.ref || github.ref_name }}","containerfile":"osac-metering/metering-service/Containerfile","imageKey":"metering.image.repository"},{"repo":"${{ github.event.pull_request.head.repo.full_name || github.repository }}","ref":"${{ github.event.pull_request.head.ref || github.ref_name }}","containerfile":"osac-metering/adapters/Containerfile.echo-adapter","imageKey":"metering.echoAdapter.image.repository"},{"repo":"${{ github.event.pull_request.head.repo.full_name || github.repository }}","ref":"${{ github.event.pull_request.head.ref || github.ref_name }}","containerfile":"osac-csi-driver/Containerfile","context":".","imageKey":"csiDriver.image.repository"}]'
      # Pass author_association for fork PR authorization (empty for non-fork PRs)
      fork-pr-author-association: ${{ github.event.pull_request.head.repo.fork && github.event.pull_request.author_association || '' }}
      fork-pr-author: ${{ github.event.pull_request.head.repo.fork && github.event.pull_request.user.login || '' }}
      pr-number: ${{ github.event.pull_request.number }}
      # Checkout osac-test-infra for tests/Containerfile (not the caller repo)
      test-infra-repository: osac-project/osac-test-infra
      test-infra-ref: ${{ inputs.test-infra-ref || 'main' }}
