name: Test PR dashboard

on:
  pull_request:
    paths:
      - "docs/pr-dashboard/**"
      - "tools/test_pr_dashboard.js"
      - ".github/workflows/pr-dashboard-verify.yml"
  merge_group:

concurrency:
  group: pr-dashboard-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # Checks out the dashboard test and static site source.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Test dashboard link safety
        run: node tools/test_pr_dashboard.js
