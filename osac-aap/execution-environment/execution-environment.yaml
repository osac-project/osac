version: 3

images:
  base_image:
    name: registry.access.redhat.com/ubi10:10.2

dependencies:
  galaxy: ../collections/requirements.yml
  python: requirements.txt
  ansible_core:
    package_pip: ansible-core
  ansible_runner:
    package_pip: ansible-runner
  python_interpreter:
    package_system: "python3.12"
    python_path: "/usr/bin/python3.12"
  system:
    - systemd-libs
    - systemd-devel
    - gcc
    - python3.12-devel
    - git-core
    - bind-utils
    - krb5-devel

options:
  package_manager_path: /usr/bin/dnf

additional_build_files:
  - src: ../collections
    dest: collections
  - src: ../vendor
    dest: vendor

additional_build_steps:
  prepend_base:
    # Workaround: UBI 10 repos have glibc-devel 2.39-126 but the base image
    # ships glibc 2.39-124. Update glibc before system packages are installed.
    - RUN dnf update -y --allowerasing glibc glibc-minimal-langpack && dnf clean all
    # gcc/python3.12-devel are also listed under dependencies.system below,
    # but ansible-builder only installs that list much later (the builder
    # stage, via bindep). This base stage's own `pip install
    # ansible-core ansible-runner` needs them earlier: hermetic sdist
    # builds (no prebuilt wheels) mean PyYAML's own build-time Cython
    # dependency (a transitive build requirement of ansible-core) needs a
    # C compiler and Python headers to compile its C extensions here,
    # confirmed live: "error: command 'gcc' failed: No such file or
    # directory". rust/cargo (prefetched via rpms.in.yaml, but never
    # actually dnf-installed anywhere until now) are needed here too:
    # cryptography (an ansible-core transitive dep, same base-stage pip
    # install) builds via maturin, whose own bootstrap only skips
    # fetching rustup over the network if `shutil.which("cargo")`
    # already succeeds -- confirmed via maturin's real bootstrap.py.
    # Without a real `cargo` on PATH here, it falls through to
    # puccinialin's network-dependent rustup download, which then fails
    # under hermetic network isolation: "httpx.ConnectError: [Errno -2]
    # Name or service not known". openssl-devel/libffi-devel are
    # cryptography's own native build deps (CFFI bindings, linking
    # against system OpenSSL). gcc-c++ is needed too: frozenlist (a
    # main requirements.txt dep, built in the builder stage which FROMs
    # this same base-stage image) has a Cython extension written in
    # C++, confirmed live: "error: command 'g++' failed: No such file
    # or directory" -- plain gcc only provides a C compiler.
    - RUN dnf install -y gcc gcc-c++ python3.12-devel rust cargo openssl-devel libffi-devel && dnf clean all
  prepend_galaxy:
    - COPY _build/collections /usr/share/ansible/collections
    - COPY _build/vendor /usr/share/ansible/collections
    - RUN dnf install -y git  # required to pull non-versioned git collections specified in collections/requirements.yaml
  append_final:
    - RUN chmod 0755 /opt/builder/bin/entrypoint
    - COPY --from=quay.io/openshift/origin-cli:4.19 /usr/bin/oc /usr/local/bin/
    - COPY --from=quay.io/openshift/origin-cli:4.19 /usr/bin/kubectl /usr/local/bin/
    # Multi-stage COPY --from, same pattern and trust model as oc/kubectl
    # above -- not a raw network fetch, so it's unaffected by hermetic
    # builds and isn't subject to Cachi2/Hermeto's "generic" package
    # source tracking (confirmed: no origin-cli/openshift SBOM entries at
    # all in a real Enterprise Contract run, only the true base image gets
    # evaluated). Replaces a previous curl+sha256sum fetch of the same
    # v3.21.4 release, which hermetic builds couldn't satisfy without a
    # Cachi2 "generic" prefetch -- and that prefetch mechanism is itself
    # denied by policy (sbom_spdx.allowed_package_sources, empty allowlist
    # by default). Multi-arch image (amd64/arm64 confirmed), so buildah
    # resolves the right manifest automatically, same as origin-cli.
    - COPY --from=docker.io/alpine/helm:3.21.4 /usr/bin/helm /usr/local/bin/helm
