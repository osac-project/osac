suite: thanos network policies
templates:
  - templates/*.yaml
release:
  name: osac
  namespace: osac
capabilities:
  apiVersions:
    - monitoring.coreos.com/v1
set:
  global.observability.enabled: true
  global.observability.keycloak.issuerUrl: https://keycloak.example.com/realms/osac
  global.observability.objectStorage.secretName: thanos-object-storage
  global.observability.objectStorage.endpoint: https://s3.example.com
  global.observability.objectStorage.bucket: thanos
  global.observability.objectStorage.region: us-east-1
  global.observability.thanos.image.registry: registry.redhat.io
  global.observability.thanos.image.repository: openshift4/ose-thanos-rhel8
  global.observability.thanos.image.tag: test-thanos
  global.observability.services.metricsAuth.tag: test-metrics-auth
  global.observability.services.oauth2Proxy.tag: test-oauth2-proxy
  global.observability.services.openshiftOauthProxy.tag: test-ose-oauth-proxy
  global.observability.thanos.retention: 365d
  global.observability.thanos.resolution.raw: 365d
  global.observability.thanos.resolution.5m: 365d
  global.observability.thanos.resolution.1h: 365d

tests:
  - it: admits only the authorizer and the auth proxy to Query
    template: templates/networkpolicies.yaml
    documentSelector:
      path: metadata.name
      value: thanos-query
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/name"]
          value: thanos
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: query
      - equal:
          path: spec.policyTypes
          value:
            - Ingress
      - notExists:
          path: spec.egress
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchLabels["osac.openshift.io/observability-role"]
          value: authorizer
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 9090
      - equal:
          path: spec.ingress[1].from[0].podSelector.matchLabels["osac.openshift.io/observability-role"]
          value: query-auth-proxy
      - equal:
          path: spec.ingress[1].ports[0].port
          value: 9090
      # Query's own /metrics is on the same 9090. Admitting the whole
      # openshift-monitoring namespace would let any pod in it bypass the
      # authorizer, so the third rule narrows the source to the CMO Prometheus
      # pods by the labels CMO sets on them.
      - equal:
          path: spec.ingress[2].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: openshift-monitoring
      - equal:
          path: spec.ingress[2].from[0].podSelector.matchLabels["prometheus"]
          value: k8s
      - equal:
          path: spec.ingress[2].from[0].podSelector.matchLabels["app.kubernetes.io/name"]
          value: prometheus
      - equal:
          path: spec.ingress[2].ports[0].port
          value: 9090
      - lengthEqual:
          path: spec.ingress
          count: 3
      - isNotEmpty:
          path: spec.ingress[*].from[*].podSelector

  - it: admits only the tenant auth proxy to the authorizer
    template: templates/networkpolicies.yaml
    documentSelector:
      path: metadata.name
      value: thanos-authorizer
    asserts:
      - equal:
          path: spec.podSelector.matchLabels["osac.openshift.io/observability-role"]
          value: authorizer
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchLabels["osac.openshift.io/observability-role"]
          value: tenant-auth-proxy
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 8080

  - it: admits only Query and cluster monitoring to Store
    template: templates/networkpolicies.yaml
    documentSelector:
      path: metadata.name
      value: thanos-store
    asserts:
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: store
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchLabels["app.kubernetes.io/component"]
          value: query
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 10901
      - isNotEmpty:
          path: spec.ingress[*].from[*].podSelector
      - isNotEmpty:
          path: spec.ingress[*].from[*].namespaceSelector
      - equal:
          path: spec.ingress[1].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: openshift-monitoring
      - equal:
          path: spec.ingress[1].ports[0].port
          value: 10902
      - notExists:
          path: spec.ingress[*].from[*].namespaceSelector.matchLabels["osac.openshift.io/tenant"]

  - it: admits writes, scraping and peer replication to Receive
    template: templates/networkpolicies.yaml
    documentSelector:
      path: metadata.name
      value: thanos-receive
    asserts:
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: receive
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: openshift-monitoring
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 19291
      - equal:
          path: spec.ingress[1].ports[0].port
          value: 10902
      - equal:
          path: spec.ingress[2].from[0].podSelector.matchLabels["osac.openshift.io/observability-role"]
          value: write-proxy
      - equal:
          path: spec.ingress[2].ports[0].port
          value: 19291
      - equal:
          path: spec.ingress[3].from[0].podSelector.matchLabels["app.kubernetes.io/component"]
          value: query
      - equal:
          path: spec.ingress[3].ports[0].port
          value: 10901
      - equal:
          path: spec.ingress[4].from[0].podSelector.matchLabels["app.kubernetes.io/component"]
          value: receive
      - equal:
          path: spec.ingress[4].ports[0].port
          value: 10901
      - equal:
          path: spec.ingress[4].ports[1].port
          value: 19291
      - isNotEmpty:
          path: spec.ingress[*].from[*].podSelector
      - isNotEmpty:
          path: spec.ingress[*].from[*].namespaceSelector

  - it: admits only cluster monitoring to the Compactor metrics port
    template: templates/networkpolicies.yaml
    documentSelector:
      path: metadata.name
      value: thanos-compactor
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/name"]
          value: thanos
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: compactor
      - equal:
          path: spec.policyTypes
          value:
            - Ingress
      # The ServiceMonitor scrapes /metrics on 10902; the gRPC port 10901 stays
      # closed to every source, so this is the only admitted rule.
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: openshift-monitoring
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 10902
      - lengthEqual:
          path: spec.ingress
          count: 1
      - notExists:
          path: spec.ingress[0].ports[1]
      - notExists:
          path: spec.egress

  - it: never selects every pod or opens a tenant path
    template: templates/networkpolicies.yaml
    asserts:
      - exists:
          path: spec.podSelector.matchLabels
      - notExists:
          path: spec.ingress[*].from[*].namespaceSelector.matchLabels["osac.openshift.io/tenant"]
      - notExists:
          path: spec.ingress[*].from[*].namespaceSelector.matchExpressions[0].key
      - notExists:
          path: spec.ingress[*].from[*].podSelector.matchExpressions[0].key

  # The gate port is 9092, the container port, not the Service port number
  # 9091. Admitting 9091 here would open the unauthenticated allowlist to any
  # pod that can route to the pod IP.
  - it: admits only the router to the admin gate port
    template: templates/networkpolicies.yaml
    documentSelector:
      path: metadata.name
      value: thanos-query-auth-proxy
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.podSelector.matchLabels["osac.openshift.io/observability-role"]
          value: query-auth-proxy
      - equal:
          path: spec.policyTypes
          value:
            - Ingress
      - equal:
          path: spec.ingress
          value:
            - from:
                - namespaceSelector:
                    matchLabels:
                      network.openshift.io/policy-group: ingress
              ports:
                - protocol: TCP
                  port: 9092
      - notExists:
          path: spec.egress

  - it: renders exactly six policies when cluster remote write is off
    template: templates/networkpolicies.yaml
    asserts:
      - hasDocuments:
          count: 6

  # The tenant remote-write Route enters through the OpenShift router, so the
  # write proxy admits 8443 from that namespace and nothing else. Its 8080
  # health port has no Service and stays closed.
  - it: admits only the router to the write proxy on 8443
    template: templates/networkpolicies.yaml
    set:
      global.observability.clusterRemoteWrite.enabled: true
      global.observability.cliImage: quay.io/openshift/origin-cli:4.20.0
    documentSelector:
      path: metadata.name
      value: thanos-write-proxy
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.podSelector.matchLabels["osac.openshift.io/observability-role"]
          value: write-proxy
      - equal:
          path: spec.policyTypes
          value:
            - Ingress
      # Equality proves there is no second rule and no 8080: the whole ingress
      # list is this one router source on the TLS port.
      - equal:
          path: spec.ingress
          value:
            - from:
                - namespaceSelector:
                    matchLabels:
                      network.openshift.io/policy-group: ingress
              ports:
                - protocol: TCP
                  port: 8443
      - notExists:
          path: spec.egress

  - it: selects the pods Receive actually renders
    template: templates/receive.yaml
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: thanos
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: receive

  - it: selects the pods Store actually renders
    template: templates/store.yaml
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: thanos
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: store

  - it: selects the pods Query actually renders
    template: templates/query.yaml
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: thanos
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: query
