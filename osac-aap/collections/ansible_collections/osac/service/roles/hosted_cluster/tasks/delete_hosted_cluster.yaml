# Leave the HostedCluster, guest credentials and ManagedCluster in place while
# CAP-Agent unbinds Agents. The baremetalworker controller only deletes each
# worker BMI after its Agent has unbound. Skip drain only on terminal cluster
# deletion; CAPI still waits for volume detach and its pre-terminate hook.
- name: Set hosted control-plane namespace
  ansible.builtin.set_fact:
    hosted_control_plane_namespace: "{{ hosted_cluster_namespace }}-{{ hosted_cluster_name }}"

- name: List cluster Machines before NodePool deletion
  kubernetes.core.k8s_info:
    api_version: cluster.x-k8s.io/v1beta1
    kind: Machine
    namespace: "{{ hosted_control_plane_namespace }}"
    label_selectors:
      - "cluster.x-k8s.io/cluster-name={{ hosted_cluster_name }}"
  register: cluster_machines_before
  no_log: true

- name: Validate cluster Machines before NodePool deletion
  ansible.builtin.assert:
    that:
      - item.spec.clusterName == hosted_cluster_name
      - item.metadata.namespace == hosted_control_plane_namespace
      - item.metadata.labels['cluster.x-k8s.io/cluster-name'] == hosted_cluster_name
  loop: "{{ cluster_machines_before.resources }}"
  no_log: true

- name: Skip drain for cluster Machines before NodePool deletion
  kubernetes.core.k8s:
    state: present
    merge_type: [merge]
    definition:
      apiVersion: cluster.x-k8s.io/v1beta1
      kind: Machine
      metadata:
        namespace: "{{ hosted_control_plane_namespace }}"
        name: "{{ item.metadata.name }}"
        annotations:
          machine.cluster.x-k8s.io/exclude-node-draining: ""
  loop: "{{ cluster_machines_before.resources | selectattr('spec.clusterName', 'equalto', hosted_cluster_name) | list }}"
  when: "'machine.cluster.x-k8s.io/exclude-node-draining' not in (item.metadata.annotations | default({}, true))"
  no_log: true

- name: List NodePools owned by this cluster
  kubernetes.core.k8s_info:
    api_version: hypershift.openshift.io/v1beta1
    kind: NodePool
    namespace: "{{ hosted_cluster_namespace }}"
    label_selectors:
      - "{{ cluster_order_label }}={{ hosted_cluster_name }}"
  register: cluster_nodepools

- name: Delete NodePool resources
  kubernetes.core.k8s:
    state: absent
    api_version: hypershift.openshift.io/v1beta1
    kind: NodePool
    namespace: "{{ hosted_cluster_namespace }}"
    name: "{{ item.metadata.name }}"
  loop: "{{ cluster_nodepools.resources }}"
  loop_control:
    label: "Delete NodePool {{ item.metadata.name }}"

# Catch Machines created by an in-flight scale-up between the first list and
# the NodePool deletion; validate ownership again before changing anything.
- name: List cluster Machines after NodePool deletion
  kubernetes.core.k8s_info:
    api_version: cluster.x-k8s.io/v1beta1
    kind: Machine
    namespace: "{{ hosted_control_plane_namespace }}"
    label_selectors:
      - "cluster.x-k8s.io/cluster-name={{ hosted_cluster_name }}"
  register: cluster_machines_after
  no_log: true

- name: Validate cluster Machines after NodePool deletion
  ansible.builtin.assert:
    that:
      - item.spec.clusterName == hosted_cluster_name
      - item.metadata.namespace == hosted_control_plane_namespace
      - item.metadata.labels['cluster.x-k8s.io/cluster-name'] == hosted_cluster_name
  loop: "{{ cluster_machines_after.resources }}"
  no_log: true

- name: Skip drain for cluster Machines after NodePool deletion
  kubernetes.core.k8s:
    state: present
    merge_type: [merge]
    definition:
      apiVersion: cluster.x-k8s.io/v1beta1
      kind: Machine
      metadata:
        namespace: "{{ hosted_control_plane_namespace }}"
        name: "{{ item.metadata.name }}"
        annotations:
          machine.cluster.x-k8s.io/exclude-node-draining: ""
  loop: "{{ cluster_machines_after.resources | selectattr('spec.clusterName', 'equalto', hosted_cluster_name) | list }}"
  when: "'machine.cluster.x-k8s.io/exclude-node-draining' not in (item.metadata.annotations | default({}, true))"
  no_log: true

- name: Wait for NodePool resources to finish deleting
  kubernetes.core.k8s_info:
    api_version: hypershift.openshift.io/v1beta1
    kind: NodePool
    namespace: "{{ hosted_cluster_namespace }}"
    label_selectors:
      - "{{ cluster_order_label }}={{ hosted_cluster_name }}"
  register: remaining_nodepools
  until: remaining_nodepools.resources | length == 0
  retries: 210
  delay: 10

- name: Wait for baremetalworker to finish deleting workers
  kubernetes.core.k8s_info:
    api_version: osac.openshift.io/v1alpha1
    kind: ClusterOrder
    namespace: "{{ cluster_order.metadata.namespace }}"
    name: "{{ hosted_cluster_name }}"
  register: worker_clusterorder
  until: >-
    (worker_clusterorder.resources | length == 0) or
    ('osac.openshift.io/baremetalworker-finalizer' not in
     (worker_clusterorder.resources[0].metadata.finalizers | default([])))
  retries: 210
  delay: 10

- name: Delete Secret resource containing pull-secret
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: secret
    namespace: "{{ hosted_cluster_namespace }}"
    name: "pullscret-cluster-{{ hosted_cluster_name }}"

- name: Delete Secret resource containing ssh-key
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: secret
    namespace: "{{ hosted_cluster_namespace }}"
    name: "sshkey-cluster-{{ hosted_cluster_name }}"

# Manage only the registration this ClusterOrder owns; ideally it would be
# deleted with the HostedCluster, but the hub creates it. Cleanup runs whatever
# the opt-in flag says (hosted_cluster_enable_acm_registration): for a cluster
# provisioned without it this is a no-op, while clusters registered before the
# flag existed, or with it enabled, still get cleaned up (OSAC-6313). Cleanup
# stays independent of the flag but not of ownership: registration refuses a
# foreign object (register_managed_cluster.yaml), so a refused create can leave
# a same-name ManagedCluster behind, and deleting it by name would destroy
# another owner's registration. Reporting such an object instead of failing
# also keeps a squatted name from blocking tenant deletion.
- name: Discard ManagedCluster teardown projections from earlier invocations
  ansible.builtin.set_fact:
    hosted_cluster_teardown_registrations: []

- name: Read ManagedCluster registration before teardown
  kubernetes.core.k8s_info:
    api_version: cluster.open-cluster-management.io/v1
    kind: ManagedCluster
    name: "{{ hosted_cluster_name }}"
  register: hosted_cluster_teardown_registration
  # A registration can hold hub credentials; only the sanitized projection
  # below may report on it.
  no_log: true

- name: Project ManagedCluster teardown ownership
  # Only the fields below may leave this task: an unrelated annotation can hold
  # credential-bearing data, and loop labels do not redact verbose output.
  vars:
    annotations: "{{ item.metadata.annotations | default({}, true) }}"
    tenant: "{{ annotations.get('osac.openshift.io/tenant', '') }}"
    owner_reference: "{{ annotations.get('osac.openshift.io/owner-reference', '') }}"
    # Pre-flag clusters were registered by the hub's own HyperShift auto-import,
    # which writes these Hosted-import markers (hypershift-addon-operator)
    # without OSAC ownership. They are the only positive origin evidence such a
    # registration has; an object carrying none of them is not ours.
    legacy_hosted_import: >-
      {{ tenant == '' and owner_reference == '' and
      annotations.get('open-cluster-management/created-via', '') == 'hypershift' and
      annotations.get('import.open-cluster-management.io/klusterlet-deploy-mode', '') == 'Hosted' and
      (annotations.get('import.open-cluster-management.io/hosting-cluster-name', '') | length > 0) }}
    owned: >-
      {{ tenant == hosted_cluster_acm_registration_annotations['osac.openshift.io/tenant'] and
      owner_reference == hosted_cluster_acm_registration_annotations['osac.openshift.io/owner-reference'] }}
  ansible.builtin.set_fact:
    hosted_cluster_teardown_registrations: >-
      {{ (hosted_cluster_teardown_registrations | default([])) + [{'name': item.metadata.name | default(''),
      'uid': item.metadata.uid | default(''),
      'deletable': (owned | bool) or (legacy_hosted_import | bool)}] }}
  loop: "{{ hosted_cluster_teardown_registration.resources | default([]) }}"
  no_log: true

- name: Report ManagedCluster registrations this ClusterOrder does not own
  ansible.builtin.debug:
    msg: >-
      Leaving ManagedCluster {{ item.name }} in place: its OSAC ownership annotations do
      not identify this ClusterOrder, so teardown does not delete it. Ask the hub
      administrator to review the registration.
  loop: "{{ hosted_cluster_teardown_registrations | default([]) | rejectattr('deletable') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Delete ManagedCluster registration for this ClusterOrder
  kubernetes.core.k8s:
    state: absent
    api_version: cluster.open-cluster-management.io/v1
    kind: ManagedCluster
    name: "{{ item.name }}"
    # The precondition binds the delete to the object inspected above, so a
    # registration replaced in between is never removed.
    delete_options:
      preconditions:
        uid: "{{ item.uid }}"
  loop: "{{ hosted_cluster_teardown_registrations | default([]) | selectattr('deletable') | list }}"
  loop_control:
    label: "{{ item.name }}"
  # The delete returns the object it removed; the projection above is the only
  # place its metadata may be reported.
  no_log: true

- name: Delete HostedCluster resource
  kubernetes.core.k8s:
    state: absent
    api_version: hypershift.openshift.io/v1beta1
    kind: HostedCluster
    namespace: "{{ hosted_cluster_namespace }}"
    name: "{{ hosted_cluster_name }}"

# Wait for the HostedCluster to delete before we proceed; this ensures that we
# don't prematurely destroy infrastructure resources required for the clean
# teardown of the hosted cluster.
- name: Wait for HostedCluster to finish deleting
  kubernetes.core.k8s_info:
    api_version: hypershift.openshift.io/v1beta1
    kind: HostedCluster
    namespace: "{{ hosted_cluster_namespace }}"
    name: "{{ hosted_cluster_name }}"
  register: hosted_cluster_status
  until: (hosted_cluster_status.resources | length == 0)
  retries: 720
  delay: 10
