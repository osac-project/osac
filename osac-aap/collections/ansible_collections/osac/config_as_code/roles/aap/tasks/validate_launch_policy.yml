---
- name: Validate pinned job-template bindings
  ansible.builtin.assert:
    that:
      - item.prevent_instance_group_fallback | default(false) | bool
      - item.execution_environment == aap_prefix + '-ee'
      - item.inventory in [aap_prefix + '-cluster-fulfillment', aap_prefix + '-networking-operations']
      - item.ask_variables_on_launch | default(false) | bool
    fail_msg: >-
      Template {{ item.name }} must use the pinned execution
      environment, approved inventory, launch prompts, and no instance-group fallback.
  loop: "{{ controller_templates }}"
  loop_control:
    label: "{{ item.name }}"
  when: >-
    item.instance_groups | default([])
    | select('search', '(cluster|networking)-fulfillment-ig|networking-operations-ig')
    | list | length > 0

- name: Validate pinned workflow bindings
  ansible.builtin.assert:
    that:
      - item.inventory == aap_prefix + '-cluster-fulfillment'
      - item.ask_variables_on_launch | default(false) | bool
      - item.workflow_nodes | default([]) | length > 0
    fail_msg: >-
      Workflow {{ item.name }} must retain its approved inventory,
      launch prompts, and explicit child nodes.
  loop: "{{ controller_workflows }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.inventory == aap_prefix + '-cluster-fulfillment'

- name: Validate networking job templates follow the network manager contract
  ansible.builtin.assert:
    that:
      - item.playbook == 'osac-aap/playbook_osac_network_task.yml'
      - item.ask_labels_on_launch | default(false) | bool
      - item.timeout | default(0) | int == 3600
    fail_msg: >-
      Networking template {{ item.name }} must run the generic playbook, prompt
      for labels, and time out after 60 minutes.
  loop: "{{ controller_templates }}"
  loop_control:
    label: "{{ item.name }}"
  when: >-
    item.instance_groups | default([])
    | select('search', 'networking-operations-ig')
    | list | length > 0
