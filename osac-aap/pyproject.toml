[project]
name = "osac-aap"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "aiobotocore>=3.9.0",
  "ansible>=14.2.0",
  "boto3>=1.37.0",
  "botocore>=1.37.0",
  "dnspython>=2.8.0",
  "esisdk>=1.5.0",
  "jmespath>=1.1.0",
  "kubernetes>=36.0.3",
  "pydantic>=2.13.4",
  "python-esiclient>=1.3.0",
  "python-esileapclient>=1.0.0",
  "python-ironicclient>=6.2.0",
  "python-openstackclient>=10.2.1",
  "urllib3>=2.7.0",
]

[dependency-groups]
development = [
  "ansible-lint>=26.6.0",
  "antsibull-changelog>=0.35.1",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["collections/ansible_collections/osac/service/plugins/filter"]

[tool.uv.sources]
python-esiclient = { git = "https://github.com/cci-moc/python-esiclient.git", rev = "1.4" }
