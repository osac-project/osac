{{/*
Second copy of the frontend certificate, issued directly into the gateway
namespace. A Gateway in openshift-ingress needs the cert Secret in that
namespace; name reuse alone is not enough. Requires a ClusterIssuer so the
issuer is reachable cross-namespace.
*/}}
{{- if eq .Values.ingress.driver "gatewayapi" }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  namespace: {{ .Values.ingress.gatewayapi.gatewayNamespace }}
  name: fulfillment-api-gateway
spec:
  issuerRef:
    kind: {{ .Values.certs.issuerRef.kind }}
    name: {{ required "certs.issuerRef.name is required" .Values.certs.issuerRef.name }}
  dnsNames:
  - localhost
  - fulfillment-api
  - fulfillment-api.{{ .Release.Namespace }}
  - fulfillment-api.{{ .Release.Namespace }}.svc.cluster.local
  - fulfillment-internal-api
  - fulfillment-internal-api.{{ .Release.Namespace }}
  - fulfillment-internal-api.{{ .Release.Namespace }}.svc.cluster.local
  - {{ include "fulfillment-api.hostname" . | quote }}
  - {{ include "fulfillment-internal-api.hostname" . | quote }}
  secretName: fulfillment-api-tls
  privateKey:
    rotationPolicy: Always
{{- end }}
