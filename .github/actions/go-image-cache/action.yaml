name: Opt-in integration image Go cache
description: Transport only Go mount payloads through the existing default Docker builder
inputs:
  phase:
    description: restore or save
    required: true
  namespace:
    description: Cache namespace; manual experiments use trial-RUN_ID
    default: fulfillment-integration
outputs:
  key:
    description: Exact versioned cache key
    value: ${{ steps.prepare.outputs.key }}
  hit:
    description: Actions restore result, not proof of image consumption
    value: ${{ steps.restore.outputs.cache-hit }}
  ready:
    description: Default Docker builder was available
    value: ${{ steps.prepare.outputs.ready }}
runs:
  using: composite
  steps:
    - id: prepare
      if: inputs.phase == 'restore'
      shell: bash
      env:
        CACHE_NAMESPACE: ${{ inputs.namespace }}
      run: python3 .github/scripts/image_go_cache.py prepare --state "$RUNNER_TEMP/osac-go-image-cache" --namespace "$CACHE_NAMESPACE"
    - id: restore
      if: inputs.phase == 'restore' && steps.prepare.outputs.ready == 'true'
      continue-on-error: true
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ${{ runner.temp }}/osac-go-image-cache/payload
        key: ${{ steps.prepare.outputs.key }}
    - if: inputs.phase == 'restore' && steps.prepare.outputs.ready == 'true'
      shell: bash
      env:
        CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        CACHE_MATCHED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
      run: python3 .github/scripts/image_go_cache.py inject --state "$RUNNER_TEMP/osac-go-image-cache"
    - id: export
      if: >-
        inputs.phase == 'save' && github.event_name == 'workflow_dispatch' &&
        !github.event.repository.private &&
        (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
        inputs.namespace == format('trial-{0}', github.run_id))
      shell: bash
      env:
        CACHE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        CACHE_PUBLIC: ${{ !github.event.repository.private }}
      run: python3 .github/scripts/image_go_cache.py extract --state "$RUNNER_TEMP/osac-go-image-cache"
    - if: inputs.phase == 'save' && steps.export.outputs.ready == 'true'
      continue-on-error: true
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ${{ runner.temp }}/osac-go-image-cache/payload
        key: ${{ steps.export.outputs.key }}
