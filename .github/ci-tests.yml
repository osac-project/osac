# The unit and integration tests, one leg each. ci.yml runs a leg when ALL of its `filters` (from
# .github/filters/ci-filters.yml) match the change; the leg then calls workflows/tests.yml with its `kind`. A leg that is not
# needed does not exist for that run, so it shows no job on the pull request. unit-tests.yml and integration-tests.yml run
# every leg of their group (the `group` field) on a schedule, by hand and from the nightly build.
#
# To add a component's tests: add a leg here (and, for a new kind of test, its steps in workflows/tests.yml), add its
# filter to ci-filters.yml, and nothing else. Changes to this file need a code owner's approval (see CODEOWNERS).
#
# id              the leg's name, shown as the job name
# group           unit | integration
# kind            which steps of tests.yml run
# dir/cmd         go-unit only: the module and the command run in it
# timeout         minutes before the job is cancelled (default 360)
# pr_repetitions  pull requests only: how many times the leg runs, in parallel (default 1). The merge queue, the
#                 schedule, the manual runs and the flake-detection campaigns keep one execution.
- id: Unit tests (fulfillment-service)
  group: unit
  kind: go-unit
  dir: fulfillment-service
  cmd: ginkgo run --timeout 1h -r internal
  filters: [code, unit-tests-fulfillment-service]
- id: Unit tests (osac-metering)
  group: unit
  kind: go-unit
  dir: osac-metering/metering-service
  cmd: ginkgo run -r internal ./cmd
  filters: [code, unit-tests-osac-metering]
- id: Unit tests (osac-metering/adapters)
  group: unit
  kind: go-unit
  dir: osac-metering/adapters
  cmd: ginkgo run -r .
  filters: [code, unit-tests-osac-metering-adapters]
- id: Unit tests (osac-metering/schema)
  group: unit
  kind: go-unit
  dir: osac-metering/schema
  cmd: ginkgo run -r .
  filters: [code, unit-tests-osac-metering-schema]
# Plain go test plus the chart's helm-unittest suites; the images and controller
# are the only Go consumers, and both are covered by these two commands.
- id: Unit tests (osac-observability)
  group: unit
  kind: observability-unit
  filters: [code, unit-tests-osac-observability]
# The generated contract reference and checkable schema file, plus the release gate that a
# published schema file never changes. Not gated on `code`: a hand-edited file under
# docs/contract/ is Markdown and must still fail.
- id: Contract checks (osac-metering)
  group: unit
  kind: metering-contract
  timeout: 20
  filters: [metering-contract]
- id: Unit tests (CaaS integration)
  group: unit
  kind: caas-unit
  filters: [code, unit-tests-caas-integration]
- id: Unit tests (osac-ui)
  group: unit
  kind: ui-unit
  # not `code`: that filter leaves osac-ui out on purpose, so an osac-ui-only change runs just this leg
  filters: [ui]
- id: Unit tests (E2E workflow policy)
  group: unit
  kind: e2e-workflow-policy
  filters: [unit-tests-e2e-policy]
- id: Unit tests (osac-installer)
  group: unit
  kind: helm-unit
  filters: [code, unit-tests-osac-installer]
- id: Integration test (CaaS)
  group: integration
  kind: it-caas
  timeout: 120  # Kind, local image builds, AWX deployment and the 45m Ginkgo suite
  filters: [integration-tests-caas]
- id: Integration test (fulfillment-service)
  group: integration
  kind: it-fulfillment-service
  timeout: 120  # Kind setup, image builds, four serial test phases, and log collection.
  # Five executions of the same commit in parallel on a pull request, so a test that fails once in a while is caught
  # before it merges instead of being retested until it passes. One failure fails CI. The merge queue and every other
  # caller of tests.yml keep one execution.
  pr_repetitions: 5
  filters: [code, integration-tests-fulfillment-service]
- id: Integration test (osac-operator)
  group: integration
  kind: it-osac-operator
  timeout: 45  # ginkgo --timeout 30m (Makefile) + ~15m for install, setup and log collection
  filters: [code, integration-tests-osac-operator]
- id: Integration test (bare-metal-fulfillment-operator)
  group: integration
  kind: it-bare-metal-fulfillment-operator
  timeout: 45  # ginkgo --timeout 30m (Makefile) + ~15m for install, setup and log collection
  filters: [code, integration-tests-bare-metal-fulfillment-operator]
- id: Integration test (osac-aap)
  group: integration
  kind: it-osac-aap
  filters: [code, integration-tests-osac-aap]
- id: Integration test (osac-installer)
  group: integration
  kind: it-osac-installer
  filters: [code]
# The install preflight against a real API server (Kind): fault injection, install, upgrade and failed-hook logs. One
# leg per Helm: 3.18.0 is the oldest Helm that prints a failed hook's log, 3.22.0 is the Helm 3 the rest of CI uses,
# and 4.2.2 is Helm 4. tests.yml picks the Helm version from the kind.
- id: Integration test (osac-installer preflight, Helm 3.18.0)
  group: integration
  kind: it-osac-installer-preflight-helm3
  timeout: 20
  filters: [code, integration-tests-osac-installer-preflight]
- id: Integration test (osac-installer preflight, Helm 3.22.0)
  group: integration
  kind: it-osac-installer-preflight-helm322
  timeout: 20
  filters: [code, integration-tests-osac-installer-preflight]
- id: Integration test (osac-installer preflight, Helm 4.2.2)
  group: integration
  kind: it-osac-installer-preflight-helm4
  timeout: 20
  filters: [code, integration-tests-osac-installer-preflight]
