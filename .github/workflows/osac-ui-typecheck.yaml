name: Typecheck

# osac-ui's typecheck check, run by ci.yml when osac-ui changes (the `ui` filter) and part of the required `CI`.
# It holds no path logic and no concurrency group of its own: ci.yml cancels the older run of a pull request.
on:  # yamllint disable-line rule:truthy
  workflow_call:

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
          package_json_file: osac-ui/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: osac-ui/package.json
          cache: pnpm
          cache-dependency-path: osac-ui/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: osac-ui
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        working-directory: osac-ui
        run: pnpm run typecheck
