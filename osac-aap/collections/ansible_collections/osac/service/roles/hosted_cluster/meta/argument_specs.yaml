argument_specs:
  main:
    options:
      hosted_cluster_state:
        type: str
        required: true
        choices:
          - present
          - absent
      hosted_cluster_name:
        type: str
        required: true
      hosted_cluster_namespace:
        type: str
        required: true
      hosted_cluster_enable_acm_registration:
        type: bool
        required: false
        default: false
        description: >
          Explicitly create a Hosted-mode ManagedCluster and optional ACM addon
          configuration. Default false for regular CaaS; AI MaaS opts in for
          WorkloadCluster import (OSAC-6488). The hub administrator must disable
          HyperShift automatic import independently; labels are not an import gate.
      hosted_cluster_acm_config_namespace:
        type: str
        default: multicluster-engine
        description: Namespace of the administrator-owned hypershift-addon-deploy-config.
      hosted_cluster_acm_hosting_cluster_name:
        type: str
        default: local-cluster
        description: Hub ManagedCluster name used by Hosted-mode registration.
      hosted_cluster_node_requests:
        type: list
        elements: dict
        options:
          nodeSet:
            type: str
            required: true
          numberOfNodes:
            type: int
            required: true
          releaseImage:
            type: str
            required: false
          bareMetal:
            type: dict
            required: true
            options:
              instanceType:
                type: str
                required: true
      hosted_cluster_settings:
        type: dict
        required: true
        options:
          ocp_release_image:
            type: str
            required: true
          pull_secret:
            type: str
            required: true
          ssh_public_key:
            type: str
            required: false
          ovn_kubernetes_mtu:
            type: int
            required: false
      hosted_cluster_controller_availability_policy:
        type: str
        required: false
        choices:
          - HighlyAvailable
          - SingleReplica
      hosted_cluster_infrastructure_availability_policy:
        type: str
        required: false
        choices:
          - HighlyAvailable
          - SingleReplica
