---
# Subnet maps to a Netris IPAM subnet + V-Net
# Creates an IPAM subnet under the parent VN's allocation, then a V-Net with gateway

- name: Normalize task input
  ansible.builtin.include_tasks: _contract_input.yaml
  vars:
    _osac_task_name: create_subnet

- name: Apply the Subnet create provider work
  block:
    - name: Run the Subnet create
      ansible.builtin.include_tasks: _create_subnet_work.yaml
  rescue:
    - name: Preserve the underlying provider failure for the legacy report
      ansible.builtin.include_tasks: _preserve_failure.yaml
    - name: Publish the sanitized Subnet create error and fail
      ansible.builtin.include_tasks: _contract_rescue.yaml
      vars:
        _osac_error_label: Subnet create
