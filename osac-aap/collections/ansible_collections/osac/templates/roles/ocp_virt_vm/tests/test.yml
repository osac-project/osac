# ──────────────────────────────────────────────────────────────
# Test 11: GPU with count=1 produces exactly one hostDevices entry
# Expected: vm_template_spec.domain.devices.hostDevices has 1 entry
#           with name=gpu-0 and deviceName matching spec.gpu.resourceName
# ──────────────────────────────────────────────────────────────
- name: "Test ocp_virt_vm -- GPU single device produces one hostDevices entry"
  hosts: localhost

  collections:
    - osac.templates

  vars:
    compute_instance_label: "osac.openshift.io/computeinstance"

  tasks:
    - when: test_create_gpu_single | default(false) | bool
      block:
        - name: Read ComputeInstance fixture with GPU (count=1)
          ansible.builtin.set_fact:
            compute_instance: "{{ lookup('file', 'fixtures/computeinstance-with-gpu-test.yaml') | from_yaml }}"

        - name: Set compute instance name
          ansible.builtin.set_fact:
            compute_instance_name: "{{ compute_instance.metadata.name }}"

        - name: Run create_validate to extract VM config
          ansible.builtin.include_role:
            name: osac.templates.ocp_virt_vm
            tasks_from: create_validate.yaml

        - name: Run create_build_spec to build VM template spec
          ansible.builtin.include_role:
            name: osac.templates.ocp_virt_vm
            tasks_from: create_build_spec.yaml

        - name: Verify exactly one hostDevices entry
          ansible.builtin.assert:
            that:
              - vm_template_spec.domain.devices.hostDevices is defined
              - vm_template_spec.domain.devices.hostDevices | length == 1
            fail_msg: >-
              Expected 1 hostDevices entry, got
              {{ vm_template_spec.domain.devices.hostDevices | default([]) | length }}

        - name: Verify hostDevices entry has correct name and deviceName
          ansible.builtin.assert:
            that:
              - vm_template_spec.domain.devices.hostDevices[0].name == 'gpu-0'
              - vm_template_spec.domain.devices.hostDevices[0].deviceName == 'nvidia.com/GB100'
            fail_msg: >-
              Expected hostDevices[0] name='gpu-0' deviceName='nvidia.com/GB100',
              got {{ vm_template_spec.domain.devices.hostDevices[0] }}

        - name: Verify Linux GPU VM boots UEFI (large PCI BARs need OVMF, not BIOS)
          ansible.builtin.assert:
            that:
              - vm_template_spec.domain.firmware is defined
              - vm_template_spec.domain.firmware.bootloader.efi is defined
              - vm_template_spec.domain.firmware.bootloader.efi.secureBoot == false
            fail_msg: >-
              Expected Linux GPU VM to set firmware.bootloader.efi (secureBoot=false),
              got {{ vm_template_spec.domain.firmware | default('(no firmware key)') }}

# ──────────────────────────────────────────────────────────────
