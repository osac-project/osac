---
# Decides whether this dispatch runs in tenant-credentials-only mode, where the
# backend job has no VAST admin credentials and must make no VAST calls.
#
# Rule: `_vast_tenant_credentials_only` is true only when ALL of these hold:
#   - `_provider_backend_connections` has the key `_vast_backend_id | string`
#   - that entry is a mapping
#   - its `endpoint` is not blank
#   - its `username` and `password` are both blank
# In every other case, including an absent or malformed entry, it is false, so
# `read_credentials.yaml` keeps rejecting incomplete entries as before.
#
# "Blank" for a value v is exactly:
#   (v is not defined) or (v is none) or (v | string | length == 0)
# `is none` is tested explicitly because `none | string` is the four-character
# string "None". There is no trimming: whitespace, "None", booleans and numbers
# count as present.
#
# Requires:
#   _vast_backend_id                — set by _resolve_backend_id.yaml
#   _provider_backend_connections   — connection details keyed by backend_id
#
# Sets:
#   _vast_tenant_credentials_only   — boolean, assigned on every pass
#
# EVERY entry point that reads `_vast_tenant_credentials_only` MUST include this
# file first, because set_fact values persist across dispatches in one play and
# a stale value from an earlier backend would otherwise be reused.

- name: Detect whether this backend has no VAST admin credentials
  ansible.builtin.set_fact:
    _vast_tenant_credentials_only: >-
      {{
        (_vast_backend_id | string) in (_provider_backend_connections | default({}))
        and (_provider_backend_connections[_vast_backend_id | string] is mapping)
        and not (
          (_provider_backend_connections[_vast_backend_id | string].endpoint is not defined)
          or (_provider_backend_connections[_vast_backend_id | string].endpoint is none)
          or (_provider_backend_connections[_vast_backend_id | string].endpoint | string | length == 0)
        )
        and (
          (_provider_backend_connections[_vast_backend_id | string].username is not defined)
          or (_provider_backend_connections[_vast_backend_id | string].username is none)
          or (_provider_backend_connections[_vast_backend_id | string].username | string | length == 0)
        )
        and (
          (_provider_backend_connections[_vast_backend_id | string].password is not defined)
          or (_provider_backend_connections[_vast_backend_id | string].password is none)
          or (_provider_backend_connections[_vast_backend_id | string].password | string | length == 0)
        )
      }}
  no_log: true
