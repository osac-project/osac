        - name: "S3: Assert recovery succeeded"
          ansible.builtin.debug:
            msg: >-
              Scenario 3 passed: launcher-absent VMI
              force-deleted, VM and dependents cleaned
              up successfully.

      always:
        - name: "S3: Read VMI for finalizer removal"
          kubernetes.core.k8s_info:
            api_version: kubevirt.io/v1
            kind: VirtualMachineInstance
            name: "{{ compute_instance_name }}"
            namespace: >-
