{{- if .Values.ui.enabled }}
{{/* The UI Deployment and Service come from the osac-ui subchart. This
HTTPRoute is the dev-full-specific Kind ingress to that shared Service. */}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: osac-ui
  namespace: {{ .Values.osacNamespace }}
  labels:
    {{- include "osac-devstack.labels" . | nindent 4 }}
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    namespace: envoy-gateway
    name: default
    sectionName: http
  hostnames:
  - ui.osac.localhost
  rules:
  - backendRefs:
    - name: osac-ui
      port: 80
{{- end }}
