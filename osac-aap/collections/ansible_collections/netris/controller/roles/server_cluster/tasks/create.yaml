---
- name: Ensure Netris auth
  ansible.builtin.include_role:
    name: netris.controller.auth
  when: netris_session_cookie is not defined

- name: Reset server cluster lookup results
  ansible.builtin.set_fact:
    _existing_server_cluster: null
    _server_names: []
    _server_cluster_servers: []

- name: Resolve existing ServerCluster by stable identity
  ansible.builtin.include_tasks: lookup_server_cluster.yaml
  vars:
    _server_cluster_lookup_require_scope: false
    _server_cluster_lookup_missing_backend_id_is_error: true

- name: Validate server entry shapes
  ansible.builtin.assert:
    that:
      - >-
        server_cluster_servers | select('string') | list | length == server_cluster_servers | length
        or server_cluster_servers | select('mapping') | list | length == server_cluster_servers | length
    fail_msg: "Servers must be a list of hostnames or a list of mappings with both id and name"

- name: Validate requested server identities
  ansible.builtin.assert:
    that:
      - (item if item is string else item.name | default(none)) is string
      - (item if item is string else item.name) | trim | length > 0
      - item is string or (item.id | default('') | string is match('^[1-9][0-9]*$'))
    fail_msg: "Each server requires a nonempty name and mapping entries require a positive numeric id"
  loop: "{{ server_cluster_servers }}"

- name: Set requested server names
  ansible.builtin.set_fact:
    _server_names: >-
      {{ server_cluster_servers if server_cluster_servers | select('string') | list | length == server_cluster_servers | length
         else server_cluster_servers | map(attribute='name') | list }}

- name: Reject duplicate requested names
  ansible.builtin.assert:
    that: _server_names | unique(case_sensitive=true) | length == _server_names | length
    fail_msg: "Duplicate requested server names are not allowed"

- name: Get Netris inventory servers
  when:
    - server_cluster_servers | length > 0
    - server_cluster_servers[0] is string
  ansible.builtin.uri:
    url: "{{ netris_controller_url }}/api/v2/hw?type=server"
    method: GET
    headers:
      Cookie: "connect.sid={{ netris_session_cookie }}"
    return_content: true
    status_code: 200
    timeout: "{{ netris_timeout | default(30) }}"
    validate_certs: "{{ netris_validate_certs | default(true) }}"
  register: _inv_resp
  no_log: true

- name: Index Netris inventory by exact hostname
  ansible.builtin.set_fact:
    _server_cluster_inventory_by_name: >-
      {{ dict(_inv_resp.json.data | selectattr('name', 'defined') | groupby('name', case_sensitive=true)) }}
    _server_cluster_inventory_has_site_metadata: >-
      {{ _inv_resp.json.data | selectattr('site', 'defined') | list | length > 0 }}
  when:
    - server_cluster_servers | length > 0
    - server_cluster_servers[0] is string

- name: Resolve every requested hostname
  ansible.builtin.include_tasks: resolve_server.yaml
  loop: "{{ _server_names }}"
  loop_control:
    loop_var: _server_cluster_requested_name
  when:
    - server_cluster_servers | length > 0
    - server_cluster_servers[0] is string

- name: Set servers list when already have id
  ansible.builtin.set_fact:
    _server_cluster_servers: "{{ _server_cluster_servers + [{'id': item.id, 'name': item.name}] }}"
  loop: "{{ server_cluster_servers }}"
  when:
    - server_cluster_servers | length > 0
    - server_cluster_servers[0] is mapping

- name: Reject duplicate resolved server IDs
  ansible.builtin.assert:
    that: _server_cluster_servers | map(attribute='id') | map('int') | unique | length == _server_cluster_servers | length
    fail_msg: "Multiple requested names resolve to the same server ID"

- name: Build update body (servers and tags only)
  ansible.builtin.set_fact:
    _update_body:
      servers: "{{ _server_cluster_servers | default([]) }}"
      tags: "{{ server_cluster_tags | default([]) }}"
  when: _existing_server_cluster is defined and _existing_server_cluster is not none

- name: Update existing server cluster
  ansible.builtin.uri:
    url: "{{ netris_controller_url }}/api/v2/server-cluster/{{ _existing_server_cluster.id }}"
    method: PUT
    headers:
      Cookie: "connect.sid={{ netris_session_cookie }}"
      Content-Type: "application/json"
    body_format: json
    body: "{{ _update_body }}"
    return_content: true
    status_code: [200]
    timeout: "{{ netris_timeout | default(30) }}"
    validate_certs: "{{ netris_validate_certs | default(true) }}"
  register: _update_resp
  no_log: true
  when: _existing_server_cluster is defined and _existing_server_cluster is not none

- name: Build create body (base)
  ansible.builtin.set_fact:
    _create_body:
      name: "{{ server_cluster_name }}"
      site: "{{ {'id': server_cluster_site_id | int} }}"
      servers: "{{ _server_cluster_servers | default([]) }}"
      tags: "{{ server_cluster_tags | default([]) }}"
      vpc: >-
        {{
          {'id': server_cluster_vpc_id | int, 'name': server_cluster_vpc_name | default('')}
          if (server_cluster_vpc_id is defined and server_cluster_vpc_id)
          else {'id': 0, 'name': 'Create New'}
        }}
  when: _existing_server_cluster is not defined or _existing_server_cluster is none

- name: Build create body (with template)
  ansible.builtin.set_fact:
    _create_body: "{{ _create_body | default({}) | combine({'srvClusterTemplate': {'id': server_cluster_template_id}}) }}"
  when:
    - _existing_server_cluster is not defined or _existing_server_cluster is none
    - server_cluster_template_id is defined

- name: Build create body (with admin)
  ansible.builtin.set_fact:
    _create_body: "{{ _create_body | default({}) | combine({'admin': {'id': server_cluster_admin_id, 'name': server_cluster_admin_name}}) }}"
  when:
    - _existing_server_cluster is not defined or _existing_server_cluster is none
    - server_cluster_admin_id is defined
    - server_cluster_admin_name is defined

- name: Create new server cluster
  ansible.builtin.uri:
    url: "{{ netris_controller_url }}/api/v2/server-cluster"
    method: POST
    headers:
      Cookie: "connect.sid={{ netris_session_cookie }}"
      Content-Type: "application/json"
    body_format: json
    body: "{{ _create_body }}"
    return_content: true
    status_code: [200, 201]
    timeout: "{{ netris_timeout | default(30) }}"
    validate_certs: "{{ netris_validate_certs | default(true) }}"
  register: _create_resp
  no_log: true
  when: _existing_server_cluster is not defined or _existing_server_cluster is none

- name: Set server_cluster_id from response
  ansible.builtin.set_fact:
    server_cluster_id: >-
      {{
        _existing_server_cluster.id
        if (_existing_server_cluster is defined and _existing_server_cluster is not none)
        else (_create_resp.json.data.id | default(_create_resp.json.data))
      }}
    server_cluster_created: "{{ _existing_server_cluster is not defined or _existing_server_cluster is none }}"

- name: Wait for server cluster to be active
  ansible.builtin.uri:
    url: "{{ netris_controller_url }}/api/v2/server-cluster/{{ server_cluster_id }}"
    method: GET
    headers:
      Cookie: "connect.sid={{ netris_session_cookie }}"
    return_content: true
    status_code: 200
    timeout: "{{ netris_timeout | default(30) }}"
    validate_certs: "{{ netris_validate_certs | default(true) }}"
  register: _state_resp
  no_log: true
  until: _state_resp.json is mapping and ((_state_resp.json.data | default({}))['status'] | default({}))['label'] | default('') == 'Active'
  retries: 30
  delay: 10

- name: Set server_cluster_vpc_id from server cluster
  ansible.builtin.set_fact:
    _server_cluster_confirmed_vpc_id: >-
      {{ (_state_resp.json.data | default({})).vpc.id
         | default((_state_resp.json.data | default({})).vpcId | default(''), true) | string }}
    _server_cluster_confirmed_vpc_name: >-
      {{ (_state_resp.json.data | default({})).vpc.name | default('', true) | string }}
  when: _state_resp.json is mapping

- name: Publish the confirmed ServerCluster VPC for downstream role callers
  ansible.builtin.set_fact:
    server_cluster_vpc_id: "{{ _server_cluster_confirmed_vpc_id }}"
    server_cluster_vpc_name: "{{ _server_cluster_confirmed_vpc_name }}"
  when: _state_resp.json is mapping
