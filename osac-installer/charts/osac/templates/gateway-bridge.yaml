{{/*
Gateway bridge for the gatewayapi ingress driver (OSAC-7866).

In gatewayapi mode the fulfillment-api / fulfillment-internal-api Services are
rendered selectorless by the fulfillment-service chart and the gateway Service
ClusterIP is not known at render time, so this Job resolves it and maintains
the bridge EndpointSlices. Only rendered when the driver is gatewayapi and no
static gatewayAddress was set (the chart renders the EndpointSlices itself in
that case). Envoy mode never sees any of this.

This MUST be a regular chart resource, not a post-install hook: the in-cluster
callers (UI, operator, rest-gateway) dial the selectorless Services at startup
and crash-loop without the bridge, so a post-install hook can never run under
`helm --wait` -- the wait blocks on those very pods, deadlocking the install.
As a chart resource the Job is created with the release, applies the bridge
while the deployments are still rolling, and the pods then converge. The TTL
lets a later upgrade recreate the Job after a script change.
*/}}
{{- if and (eq .Values.service.ingress.driver "gatewayapi") (not .Values.service.ingress.gatewayapi.gatewayAddress) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "osac.fullname" . }}-gateway-bridge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
data:
  gateway-bridge.sh: |
{{ .Files.Get "files/gateway-bridge.sh" | indent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "osac.fullname" . }}-gateway-bridge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "osac.fullname" . }}-gateway-bridge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "osac.fullname" . }}-gateway-bridge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "osac.fullname" . }}-gateway-bridge
subjects:
  - kind: ServiceAccount
    name: {{ include "osac.fullname" . }}-gateway-bridge
    namespace: {{ .Release.Namespace }}
---
# Read-only access to the gateway Service in the gateway namespace. The
# fulfillment-service chart already deploys the gateway Certificate there,
# so the cross-namespace write pattern is established.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "osac.fullname" . }}-gateway-bridge
  namespace: {{ .Values.service.ingress.gatewayapi.gatewayNamespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["services"]
    resourceNames:
      - {{ .Values.service.ingress.gatewayapi.gatewayName }}-{{ .Values.service.ingress.gatewayapi.gatewayClassName }}
    verbs: ["get"]
  # The bridge targets the gateway Pod IPs, read from the gateway
  # Service's own EndpointSlices. An EndpointSlice address may not be
  # another Service's ClusterIP: the API server rejects it for
  # non-privileged identities.
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "osac.fullname" . }}-gateway-bridge
  namespace: {{ .Values.service.ingress.gatewayapi.gatewayNamespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "osac.fullname" . }}-gateway-bridge
subjects:
  - kind: ServiceAccount
    name: {{ include "osac.fullname" . }}-gateway-bridge
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "osac.fullname" . }}-gateway-bridge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 1800
  # Delete the completed Job so a later upgrade with a changed template can
  # recreate it (Job specs are immutable).
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "osac.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "osac.fullname" . }}-gateway-bridge
      restartPolicy: OnFailure
      volumes:
        - name: tmp
          emptyDir: {}
        - name: scripts
          configMap:
            name: {{ include "osac.fullname" . }}-gateway-bridge
      containers:
        - name: gateway-bridge
          image: {{ .Values.cliImage }}
          env:
            - name: HOME
              value: /tmp
            - name: GATEWAY_NAMESPACE
              value: {{ .Values.service.ingress.gatewayapi.gatewayNamespace | quote }}
            - name: GATEWAY_SERVICE
              value: {{ printf "%s-%s" .Values.service.ingress.gatewayapi.gatewayName .Values.service.ingress.gatewayapi.gatewayClassName | quote }}
            - name: RELEASE_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: TIMEOUT_SECONDS
              value: "900"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: scripts
              mountPath: /scripts
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          command:
            - /bin/bash
            - /scripts/gateway-bridge.sh
{{- end }}
