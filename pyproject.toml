[project]
name = "osac-e2e"
version = "0.1.0"
description = "OSAC end-to-end test infrastructure"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "pyyaml>=6.0",
    "websocket-client>=1.6",
]

[tool.setuptools.packages.find]
include = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-n 4 --dist loadfile"
markers = [
    "sanity: fast/essential e2e coverage for PR checks",
    "regression: heavier or cross-flow e2e for periodic runs",
]
log_level = "INFO"
log_cli = true
log_cli_date_format = "%Y-%m-%dT%H:%M:%S%z"
log_cli_format = "%(asctime)s %(levelname)-8s %(message)s"
log_cli_level = "INFO"
log_file = "/tmp/test-output/e2e.log"
log_file_date_format = "%Y-%m-%dT%H:%M:%S%z"
log_file_format = "%(asctime)s %(levelname)-8s %(name)s %(message)s"
log_file_level = "INFO"
log_file_mode = "a"

[tool.basedpyright]
reportUnusedCallResult = false
reportAny = false
reportExplicitAny = false

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "ANN", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN101", "ANN201"]
