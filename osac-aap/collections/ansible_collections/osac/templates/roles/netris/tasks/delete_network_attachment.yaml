---
# Returns a NetworkAttachment's fabric port to the provisioning network.
# Overlay attachments change nothing on the Fabric.

- name: Normalize task input
  ansible.builtin.include_tasks: _contract_input.yaml
  vars:
    _osac_task_name: delete_network_attachment

- name: Validate the interface type
  ansible.builtin.assert:
    that:
      - _osac_interface.type | default('') in ['physical', 'overlay']
    fail_msg: "interface.type must be physical or overlay"

- name: Leave an overlay attachment to the Kubernetes Manager
  ansible.builtin.debug:
    msg: "Overlay attachment: no Fabric change; the Kubernetes Manager removed the VM"
  when: _osac_interface.type | default('') == 'overlay'

- name: Return the bare-metal port to the provisioning network
  when: _osac_interface.type | default('') == 'physical'
  block:
    - name: Validate the physical attachment input
      ansible.builtin.assert:
        that:
          - _osac_target.host_name | default('') | length > 0
          - _osac_interface.name | default('') | length > 0
          - subnet.metadata.name | default('') | length > 0
          - _osac_virtual_network.metadata.name | default('') | length > 0
          - provisioning_vnet | default('') | length > 0
        fail_msg: >-
          A physical attachment delete needs target.host_name, interface.name,
          the Subnet name, the parent VirtualNetwork and the provisioning
          V-Net.

    - name: Look up the tenant VPC for the Subnet segment
      ansible.builtin.include_role:
        name: netris.controller.vpc
        tasks_from: read
      vars:
        vpc_name: "{{ _osac_virtual_network.metadata.name }}"
        vpc_tenant_id: "{{ netris_tenant_id }}"

    - name: Require the tenant VPC
      ansible.builtin.assert:
        that:
          - netris_vpc is mapping
          - netris_vpc.id is defined
        fail_msg: >-
          VirtualNetwork '{{ _osac_virtual_network.metadata.name }}' has no
          Netris VPC; refusing to detach a port from an unresolved segment.

    - name: Move the port back to the provisioning network
      ansible.builtin.include_tasks: _move_port.yaml
      vars:
        network_attachment:
          host_name: "{{ _osac_target.host_name }}"
          logical_interface_name: "{{ _osac_interface.name }}"
          from_vnet_name: "{{ subnet.metadata.name }}"
          from_vpc_id: "{{ netris_vpc.id }}"
          from_tenant_id: "{{ netris_tenant_id }}"
          to_vnet_name: "{{ provisioning_vnet }}"
          to_vpc_id: "{{ netris_mgmt_vpc_id | default(0) | int }}"
