# Open Sovereign AI Cloud - Unified Helm Values
# This values file configures all OSAC components via the umbrella chart.

# global.* is propagated unchanged into every subchart's own .Values, so it's
# the only way to share a single value (like the cluster's ingress domain)
# between the umbrella chart's own templates and its subcharts without
# duplicating it as separate --set flags per value.
global:
  # Required stable identity for this OSAC/fulfillment-service deployment.
  osacDeploymentId: ""
  # [REQUIRED on OpenShift, via --set global.clusterDomain=$(oc get ingresses.config/cluster -o jsonpath='{.spec.domain}')]
  # Backs the tpl-templated defaults below (service.auth.issuerUrl,
  # service.idp.url, service.vault.keycloakIssuerUrl) so they automatically
  # match Keycloak's actual external route hostname (KC_HOSTNAME) on any
  # OpenShift cluster. Leave empty for platforms (e.g. kind) that set these
  # three values explicitly instead.
  clusterDomain: ""
  # Resolved external fulfillment endpoint shared with operator trust sync and
  # tenant-cluster CSI provisioning. Leave empty to derive
  # <service.externalHostname>:443 for OpenShift.
  fulfillment:
    endpoint: ""
  fulfillmentTrust:
    # Enables trust reconciliation for tenant-scoped ClusterOrders.
    # Enable only when tenant CSI trust support is deployed.
    enabled: false
    tenantNamespace: osac-csi
  # --- Service Enablement ---
  # Controls which service tiers are active across all OSAC components.
  # When all are true (the default), OSAC operates as a full-stack cloud.
  # Disabling a tier stops its gRPC/REST endpoints, operator controllers,
  # and dependent infrastructure (e.g. BMF operator for BMaaS).
  services:
    caas:
      enabled: true
    vmaas:
      enabled: true
    bmaas:
      enabled: true
    maas:
      enabled: true
  # Networking settings (unified networking design). provisioningEnabled is
  # fixed at installation. fabricManager names the provider's Fabric Manager
  # registration (a ConfigMap the admin applies; it is not a Helm value) and
  # has no default. The installer's NetworkClass step creates the NetworkClass
  # from these values; none of them can change after installation.
  networking:
    # Run networking jobs through the network managers. false: VirtualNetworks,
    # Subnets, SecurityGroups, ExternalIPPools and FabricDomains become READY
    # without provider work (reason ProvisioningDisabled); ExternalIPs,
    # ExternalIPAttachments and NATGateways are not offered.
    provisioningEnabled: true
    # Canonical IPv4 CIDRs of the provider's infrastructure (management,
    # provisioning and node networks).
    excludedIpv4Cidrs: []
    # [REQUIRED] Registration name of the provider's Fabric Manager.
    fabricManager: ""
    # OSAC Kubernetes Manager; required with VMaaS. "" or cudn_evpn.
    k8sManager: ""
    networkClass:
      defaults:
        virtualNetworkIPv4CIDR: 10.200.0.0/16
        subnetIPv4CIDR: 10.200.0.0/20
        ingressRules: []
        egressRules:
        - protocol: PROTOCOL_ALL
          ipv4Cidr: 0.0.0.0/0
      eastWestCapabilities:
        supportsEastWestEthernet: false
      # Optional Subnet address plan; without it the installer derives one
      # from the enabled services and k8sManager. Shares are multiples of
      # 0.0625 that sum to 1.
      # addressPlan:
      #   overlay: 0.5
      #   fabric: 0.25
      #   lbVip: 0.25

cliImage: quay.io/openshift/origin-cli:4.20.0

# Shared PostgreSQL host for the db-init hook.
dbInit:
  host: "postgres.osac-infra.svc.cluster.local"

# Kafka cluster coordinates for per-instance topic/user creation. Set enabled
# to false when service.kafka.connection targets an external Kafka cluster:
# the chart then renders no fulfillment KafkaUser, no KafkaTopics and no
# kafka secret-copy hook, and service.kafka.connection must name a Secret that
# already exists. The metering subchart needs the same switch,
# metering.kafka.strimziResources=false, for its own KafkaUsers and
# KafkaTopics.
kafka:
  enabled: true
  clusterName: osac-kafka
  clusterNamespace: osac-kafka
  replicas: 3

# --- Operator CRDs ---
operatorCrds:
  install: true

# --- Operator ---
operator:
  enabled: true
  image:
    repository: ghcr.io/osac-project/osac-operator
    tag: latest  # PLACEHOLDER -- overwritten at release time by osac-build-and-publish.yaml
    pullPolicy: Always
  replicaCount: 1
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi
  aap:
    url: ""
    token: ""
    insecureSkipVerify: "true"
    statusPollInterval: "30s"
    templatePrefix: "osac"
  ignition:
    trustIngressCA: false
  stall:
    preparingInfrastructureThreshold: "15m"
    controlPlaneStartingThreshold: "30m"
    workersJoiningThreshold: "20m"
    workersJoiningByInstanceType: {}
  upgradeTimeouts:
    pending: "10m"
    controlPlane: "40m"
    nodePoolPerNode: "20m"
  fulfillment:
    serverAddress: "fulfillment-internal-api:8001"
    credentials:
      secretName: fulfillment-controller-credentials
      clientIdKey: client-id
      clientSecretKey: client-secret
    tls:
      caBundle:
        configMap: ca-bundle
        key: bundle.pem
    configMap:
      name: "osac-fulfillment-config"
      optional: false
  controllers:
    tenant: true
    networking: true
    storage: true
  # Provider-to-endpoint map consumed by the Volume controller. Node-local
  # providers such as LVMS use "none" because they do not dial a vendor gRPC endpoint.
  vendorControllers: {}
  configSecret:
    name: "osac-config"
    optional: true
  # Set together to configure the operator to use a remote VMaaS cluster.
  remoteClusterKubeconfig: ""
  remoteClusterKubeconfigSecretName: ""
  remoteClusterKubeconfigSecretKey: kubeconfig
  hubAccess:
    enabled: false

# --- Fulfillment Service ---
service:
  enabled: true
  # Deployment variant: "openshift" renders OpenShift Routes, "kind" renders
  # Gateway API TLSRoutes, "vcluster" renders neither -- the CI run setup
  # publishes the run's routes in the outer cluster around the vcluster.
  variant: openshift
  controller:
    # Enable full synchronization in fulfillment controllers.
    sync: true
  # [REQUIRED] Hostname for the external API Route (e.g. fulfillment-api-osac.apps.mycluster.example.com)
  externalHostname: ""
  # [REQUIRED] Hostname for the internal API Route (e.g. fulfillment-internal-api-osac.apps.mycluster.example.com)
  internalHostname: ""
  mcp:
    enabled: false
    externalHostname: ""
    # OpenShift Routes use HTTPS port 443; custom external ports are supported on Kind.
    externalPort: 443
    # The OAuth resource URL is the MCP HTTPS root URL ending in /.
    exchangeClientId: ""
    exchangeCredentialsSecret: ""
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  images:
    service:
      repository: ghcr.io/osac-project/fulfillment-service
      tag: latest  # PLACEHOLDER -- overwritten at release time by osac-build-and-publish.yaml
      pullPolicy: Always
    envoy:
      repository: ghcr.io/osac-project/envoy
      tag: v1.33.0
      pullPolicy: IfNotPresent
  eventPublisher:
    enabled: true
    topicRetention: "-1s"
  certs:
    issuerRef:
      kind: ClusterIssuer
      name: default-ca
    caBundle:
      configMap: ca-bundle
  auth:
    # tpl is applied at render time -- {{ .Values.global.clusterDomain }}
    # expands via global.clusterDomain. Platforms that don't set
    # global.clusterDomain (e.g. kind) must override this explicitly instead.
    issuerUrl: "https://keycloak-keycloak.{{ .Values.global.clusterDomain }}/realms/osac"
    controllerCredentials: []
  idp:
    provider: keycloak
    # tpl is applied at render time -- see service.auth.issuerUrl above.
    url: "https://keycloak-keycloak.{{ .Values.global.clusterDomain }}"
    credentials: []
  database:
    connection: []
    # Example:
    # connection:
    # - secret:
    #     name: osac-db-config
    #     items:
    #     - key: url
    #       param: url
  log:
    level: info
    headers: false
    bodies: false
  vault:
    # Vault API endpoint. Points to the osac-infra namespace by default,
    # where bundled OpenBao is deployed after OSAC-4916. Leave empty to
    # disable Vault integration entirely (no --vault-endpoint flag is
    # passed to the controller when endpoint is empty, even if credentials
    # are configured). Override with an external Vault URL when not using
    # the bundled OpenBao.
    endpoint: "https://openbao.osac-infra.svc.cluster.local:8200"
    namespace: osac
    kvMountPath: secret
    # Transit engine mount path within ordinary tenant namespaces.
    transitMountPath: transit
    lifecycleRole: ""
    lifecycleMountPath: "jwt"
    keycloakClientId: ""
    # Must match the issuer URL (iss claim) Keycloak puts in its JWT tokens.
    # tpl is applied at render time -- backed by global.clusterDomain, same as
    # service.auth.issuerUrl above, so this automatically matches Keycloak's
    # actual external route hostname (KC_HOSTNAME) on any OpenShift cluster.
    # Platforms that don't set global.clusterDomain (e.g. kind) must override
    # this explicitly instead.
    keycloakIssuerUrl: "https://keycloak-keycloak.{{ .Values.global.clusterDomain }}/realms/osac"
    keycloakAudience: "osac-api"
    caBundle:
      configMap: ""
    credentials: []
  # Kafka connection used by the fulfillment service. The defaults target the
  # in-cluster cluster named by kafka.clusterName in kafka.clusterNamespace
  # and the Secret copied from the fulfillment KafkaUser. To use an external
  # Kafka cluster, set the top-level kafka.enabled to false and override
  # service.kafka.connection with sources for that cluster. TLS trust uses
  # service.certs.caBundle; include the broker CA in that bundle when it is not
  # already trusted.
  kafka:
    connection:
    - secret:
        name: fulfillment-service-kafka
        items:
        - key: brokers
          param: brokers
        - key: user
          param: user
        - key: password
          param: password

# --- AAP ---
aap:
  aap:
    instance:
      enabled: true
      name: "osac-aap"
      controller:
        disabled: false
      hub:
        disabled: true
      lightspeed:
        disabled: true
      noLog: true
      redisMode: standalone
      routeTlsTerminationMechanism: Edge
      imagePullPolicy: IfNotPresent
  bootstrap:
    enabled: true
    image: ghcr.io/osac-project/osac-aap:latest  # PLACEHOLDER -- overwritten at release time by osac-build-and-publish.yaml
    backoffLimit: 15
    readinessConsecutiveSuccesses: 3
    gateway:
      hostname: ""
    controller:
      hostname: ""
  configAsCode:
    manifestSecret: "config-as-code-manifest-ig"
    secret: "config-as-code-ig"
    # Maximum number of add-on operator jobs allowed to run concurrently.
    addonOperatorMaxConcurrentJobs: 50
    eeImage: ""
    projectGitUri: ""
    projectGitBranch: ""
    remoteClusterKubeconfigSecretName: ""
    remoteClusterKubeconfigSecretKey: kubeconfig
  instanceGroups:
    clusterFulfillment:
      enabled: false
      config:
        DNS_CLASS: "dns.route53.dns"
        DNS_ZONE: ""
        EXTERNAL_ACCESS_BASE_DOMAIN: ""
        EXTERNAL_ACCESS_SUPPORTED_BASE_DOMAINS: ""
        EXTERNAL_ACCESS_API_INTERNAL_NETWORK: ""
        HOSTED_CLUSTER_BASE_DOMAIN: ""
        HOSTED_CLUSTER_CONTROLLER_AVAILABILITY_POLICY: ""
        HOSTED_CLUSTER_INFRASTRUCTURE_AVAILABILITY_POLICY: ""
      secret:
        AWS_ACCESS_KEY_ID: ""
        AWS_SECRET_ACCESS_KEY: ""
    # ConfigMap and Secret network-fulfillment-ig: network manager settings
    # and credentials, written verbatim. Keys start with the registration
    # name in upper case (for example NETRIS_CONTROLLER_URL). Required with
    # provisioningEnabled.
    networkFulfillment:
      enabled: true
      config: {}
      secret: {}
    storageFulfillment:
      enabled: false
      config:
        STORAGE_SNAPSHOTS_ENABLED: ""
    publishTemplates:
      enabled: true
      config:
        OSAC_TEMPLATE_COLLECTIONS: "osac.templates"
        OSAC_FULFILLMENT_SERVICE_URI: "https://fulfillment-internal-api:8001"

# --- UI ---
ui:
  enabled: true
  externalHostname: ""
  route:
    enabled: true
  api:
    fulfillment:
      url: https://fulfillment-internal-api:8001
      certs:
        caBundle:
          configMap: ca-bundle
  auth:
    oidcClientId: osac-ui
    # OIDC issuer URL for gRPC reflection authentication. Must match service.auth.issuerUrl.
    # tpl is NOT applied at render time for subcharts -- set this explicitly in each
    # environment's values file or via --set in the install-osac Makefile target.
    oidcIssuerURL: ""
    certs:
      caBundle:
        configMap: ca-bundle
  log:
    level: info
  images:
    ui: ghcr.io/osac-project/osac-ui:latest  # PLACEHOLDER -- overwritten at release time by osac-build-and-publish.yaml
    pullPolicy: auto

# --- Metering ---
# Always deployed: billing is not optional. The event publisher writes usage
# events unconditionally, so an install without metering silently loses
# revenue. The database wiring points at the secrets this chart's
# workload-db-secrets template creates for the configured DB host.
metering:
  # Deployment variant, like service.variant above: the echo adapter's
  # OpenShift Route renders only with "openshift". "kind" and "vcluster"
  # render none and leave the echo adapter's ingress to the platform or the
  # CI run setup.
  variant: openshift
  image:
    repository: ghcr.io/osac-project/metering-service
    tag: latest  # PLACEHOLDER -- overwritten at release time by osac-build-and-publish.yaml
    pullPolicy: Always
  database:
    connection:
    - secret:
        name: osac-db-metering-config
        items:
        - key: url
          param: url
    - secret:
        name: osac-db-metering-client-cert
        items:
        - key: tls.crt
          param: sslcert
        - key: tls.key
          param: sslkey
        - key: ca.crt
          param: sslrootcert

# --- Bare Metal Fulfillment Operator CRDs ---
bmfCrds: {}

# --- Bare Metal Fulfillment Operator ---
bmf:
  image:
    repository: ghcr.io/osac-project/bare-metal-fulfillment-operator
    tag: latest  # PLACEHOLDER -- overwritten at release time by osac-build-and-publish.yaml
    pullPolicy: Always
  replicaCount: 1
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi
  serviceAccount:
    create: true
    name: ""
  secrets:
    inventoryConfig: "osac-inventory-config"
    managementConfig: "osac-management-config"
    osClouds: "osac-os-clouds"
    netboxToken: "osac-netbox-token"
    netboxCA: "osac-netbox-ca"
  # Kind/IT only -- see templates/bmf-metal3-test-secrets.yaml
  testBackend:
    metal3:
      enabled: false
      namespace: ""
      # Names for the fake Secrets this seeds -- deliberately a separate field
      # from bmf.secrets.* (the real-credential defaults) rather than derived
      # from them, since values/kind/osac.yaml also overrides bmf.secrets.* to
      # point at these same names, and deriving one from the other here would
      # be circular. See templates/bmf-metal3-test-secrets.yaml.
      secretNames:
        inventoryConfig: "osac-inventory-config-metal3-test"
        managementConfig: "osac-management-config-metal3-test"
  configMaps:
    profiles: "osac-profiles"
  env:
    aapInsecureSkipVerify: "true"
  bcm:
    enabled: false
    url: ""
    cert: ""
    key: ""
    caCert: ""
    insecureSkipVerify: false
    hostClass: "bcm"
    bmhNamespace: ""
  secretAPI:
    url: "https://fulfillment-internal-api:8001"
    # Keep aligned with service.auth.issuerUrl; tpl resolves the cluster domain at render time.
    issuerUrl: "https://keycloak-keycloak.{{ .Values.global.clusterDomain }}/realms/osac"
    caBundle:
      configMap: "ca-bundle"
      key: "bundle.pem"
  netbox:
    enabled: false
    bmhNamespace: ""
    url: ""
    tokenSecretKey: "token"
    tokenValue: ""
    caCert: ""
    allowInsecureHTTP: false
  metal3:
    enabled: false
    # Namespace where Metal3 inventory reads BareMetalHost resources.
    namespace: ""
    hostClass: "metal3"

# --- Install preflight ---
# Checks run while Helm renders the chart (helm install, helm upgrade and
# --dry-run=server) and stop the install before anything is created when a
# prerequisite is missing. The report is the ConfigMap <release>-preflight-report
# and, on a failed render, the OSAC-PREFLIGHT-JSON line on stderr.
# validation.enabled=false skips every check; the report still lists them.
# One thing still stops the install in that mode: preflight.skipChecks naming
# a check id that does not exist, because the skip list itself is broken.
validation:
  enabled: true

preflight:
  # enforce: blocking findings stop the install (default).
  # report:  findings are recorded but never stop the install; use with
  #          helm ... --dry-run=server for a read-only report.
  # strict:  warnings stop the install too.
  mode: enforce
  # Skip a check by id, with the reason. Ids are in files/preflight/catalog.yaml.
  # Example:
  #   skip:
  #     cert-issuer-ready: "the issuer is created by GitOps after this install"
  skip: {}
  # Skip checks by id without reasons: a plain list for automation. Each
  # skipped check is reported as skipped with "skipped by preflight.skipChecks"
  # as its reason; prefer skip above when a human-readable reason is useful.
  # An id that matches no check fails the install, so a typo cannot silently
  # disable a check.
  # Example:
  #   skipChecks: [db-init-host-endpoints, default-storageclass]
  skipChecks: []

hubAccess:
  enabled: false

clusterVersions:
  enabled: false
  versions: []
  # Default versions require a diskImage; non-default versions may omit it.
  # DiskImages are shared Linux registry images, created before the version.
  # Existing named records are retained without updates.
  # Example (development/CI image; use your own artifact in production):
  # enabled: true
  # versions:
  # - version: "4.20.0"
  #   image: "quay.io/openshift-release-dev/ocp-release:4.20.0-multi"
  # - version: "4.22.0"
  #   image: "quay.io/openshift-release-dev/ocp-release:4.22.0-multi"
  #   default: true
  #   diskImage:
  #     name: rhcos-4-22
  #     sourceRef: oci://quay.io/osac-project/rhcos:4.22.0
  #     architecture: [ARCHITECTURE_AMD64]

lvms:
  # Register LVMS as a local StorageBackend + StorageTier in the fulfillment service
  # after install. For CI/development environments only — production deployments
  # should use their own storage operators (Ceph, Pure, VAST, etc.).
  enabled: false
