---
- name: Include get remote cluster kubeconfig
  ansible.builtin.include_role:
    name: osac.service.common
    tasks_from: get_remote_cluster_kubeconfig

- name: Validate ExternalIP identity for release
  ansible.builtin.assert:
    that:
      - external_ip.metadata.uid is defined
      - external_ip.metadata.uid | length > 0
      - external_ip.metadata.name is defined
    fail_msg: "ExternalIP UID and name are required to release a MetalLB address."

- name: Set UID-owned LoadBalancer Service identity for release
  ansible.builtin.set_fact:
    ip_name: "{{ external_ip.metadata.name }}"
    ip_uid: "{{ external_ip.metadata.uid }}"
    ip_service_name: "osac-eip-{{ external_ip.metadata.uid }}"
    ip_legacy_service_name: "osac-eip-{{ external_ip.metadata.name }}"
    ip_tenant: >-
      {{ (external_ip.metadata.annotations | default({})).get(
           'osac.openshift.io/tenant', 'shared') }}

- name: Read any legacy display-name MetalLB Service
  kubernetes.core.k8s_info:
    kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
    api_version: v1
    kind: Service
    name: "{{ ip_legacy_service_name }}"
    namespace: metallb-system
  register: lb_legacy_service
  when: ip_legacy_service_name != ip_service_name

- name: Keep release pending while an ambiguous legacy MetalLB Service exists
  ansible.builtin.assert:
    that:
      - (lb_legacy_service.resources | default([]) | length) == 0
    fail_msg: >-
      Legacy MetalLB Service '{{ ip_legacy_service_name }}' has no ExternalIP
      UID ownership. Its owner cannot be proven, so release is blocked until
      an administrator safely migrates or removes that Service.
  when: ip_legacy_service_name != ip_service_name

- name: Read the UID-owned parking Service before release
  kubernetes.core.k8s_info:
    kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
    api_version: v1
    kind: Service
    name: "{{ ip_service_name }}"
    namespace: metallb-system
  register: lb_service_before_delete

- name: Refuse to delete a Service that is not owned by this ExternalIP UID
  ansible.builtin.assert:
    that:
      - >-
        lb_service_before_delete.resources | length == 0 or
        (
          (lb_service_before_delete.resources[0].metadata.labels | default({})).get(
            'osac.openshift.io/externalip-uid', '') == ip_uid and
          (lb_service_before_delete.resources[0].metadata.annotations | default({})).get(
            'osac.openshift.io/tenant', '') == ip_tenant
        )
    fail_msg: >-
      Refusing to delete MetalLB Service '{{ ip_service_name }}': its UID or
      tenant ownership does not match ExternalIP UID '{{ ip_uid }}'.

- name: Delete the UID-owned LoadBalancer Service
  kubernetes.core.k8s:
    kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
    state: absent
    api_version: v1
    kind: Service
    name: "{{ ip_service_name }}"
    namespace: metallb-system
    delete_options:
      preconditions:
        uid: "{{ lb_service_before_delete.resources[0].metadata.uid }}"
    wait: true
    wait_timeout: 300
  when: lb_service_before_delete.resources | length == 1
  register: lb_service_delete_result

- name: Confirm the UID-owned LoadBalancer Service is absent
  kubernetes.core.k8s_info:
    kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
    api_version: v1
    kind: Service
    name: "{{ ip_service_name }}"
    namespace: metallb-system
  register: lb_service_after_delete
  retries: 30
  delay: 2
  until: lb_service_after_delete.resources | length == 0

- name: Display confirmed MetalLB release
  ansible.builtin.debug:
    msg: "MetalLB reservation for ExternalIP UID '{{ ip_uid }}' is absent"
