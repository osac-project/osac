---
# NATGateway -> Netris SNAT rule osac-natgw-<NATGateway id>: the IPv4 CIDR of
# the VirtualNetwork -> external_ip.address, in the VPC osac-vn-<VN id>.
# Get-or-create by name; a rule of the same name in another VPC or with other
# addresses is a final error.
- name: Create the NATGateway on Netris
  block:
    - name: Check the settings
      ansible.builtin.include_tasks: _settings.yaml
      vars:
        netris_require: [controller, credentials, site, tenant]

    - name: Check the task input
      ansible.builtin.include_tasks: _input.yaml
      vars:
        netris_require_parents: [virtual_network]

    - name: Plan the SNAT rule
      ansible.builtin.set_fact:
        _netris_nat: "{{ osac_job_vars | osac.templates.netris_nat_plan }}"

    - name: Stop on an invalid NATGateway input
      vars:
        netris_fail:
          message: "{{ _netris_nat.error }}"
          retryable: false
      when: _netris_nat.error | length > 0
      ansible.builtin.include_tasks: _fail.yaml

    - name: Build the object names
      ansible.builtin.include_tasks: _names.yaml

    - name: Find the VPC of the VirtualNetwork
      ansible.builtin.include_tasks: _nat_vpc.yaml
      vars:
        netris_nat_domain: "{{ _netris_nat.domain }}"
        netris_nat_vpc_required: true

    - name: Create the SNAT rule
      ansible.builtin.include_role:
        name: netris.controller.nat
        tasks_from: create
      vars:
        nat_name: "{{ netris_names.natgw_snat }}"
        nat_site_id: "{{ netris_site_id | int }}"
        nat_vpc_id: "{{ netris_nat_vpc.id }}"
        nat_vpc_name: "{{ netris_nat_vpc.name }}"
        nat_action: snat
        nat_protocol: all
        nat_source_address: "{{ _netris_nat.source }}"
        nat_snat_to_ip: "{{ _netris_nat.external }}/32"
        nat_comment: "OSAC NATGateway {{ netris_in.resource_id }}"
  rescue:
    - name: Report the error
      ansible.builtin.include_tasks: _rescue.yaml
