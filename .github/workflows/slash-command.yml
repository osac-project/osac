---
name: Slash Command

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: write

jobs:
  slash-command:
    if: >-
      github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '/test') ||
       startsWith(github.event.comment.body, '/retest') ||
       startsWith(github.event.comment.body, '/cancel'))
    uses: osac-project/osac-test-infra/.github/workflows/slash-command-handler.yml@f8a96ca7c6b393983a244a4fd439176c8057a362  # v1.0.1
    secrets: inherit
