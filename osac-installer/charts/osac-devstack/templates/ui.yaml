{{- if .Values.ui.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: osac-ui
  namespace: {{ .Values.osacNamespace }}
  labels:
    {{- include "osac-devstack.labels" . | nindent 4 }}
    app: osac-ui
data:
  LOG_LEVEL: {{ .Values.ui.config.logLevel | quote }}
  FULFILLMENT_API_URL: {{ .Values.ui.config.fulfillmentApiUrl | quote }}
  FULFILLMENT_TLS_INSECURE: {{ .Values.ui.config.tlsInsecure | quote }}
  OIDC_TLS_INSECURE: {{ .Values.ui.config.tlsInsecure | quote }}
  OIDC_CLIENT_ID: {{ .Values.ui.config.oidcClientId | quote }}
  OIDC_ISSUER_URL: {{ .Values.ui.config.oidcIssuerUrl | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: osac-ui
  namespace: {{ .Values.osacNamespace }}
  labels:
    {{- include "osac-devstack.labels" . | nindent 4 }}
    app: osac-ui
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      app: osac-ui
  template:
    metadata:
      labels:
        app: osac-ui
    spec:
      automountServiceAccountToken: false
      volumes:
      - name: ui-backend-credentials
        secret:
          secretName: osac-ui-backend-credentials
      - name: tmp
        emptyDir: {}
      initContainers:
      - name: wait-for-credentials
        image: {{ .Values.cliImage }}
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          echo "Waiting for osac-ui-backend client-secret to be populated..."
          until [[ "$(cat /credentials/client-secret)" != "pending" ]]; do
            echo "client-secret is still pending, retrying in 5s..."
            sleep 5
          done
          echo "client-secret ready"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - "ALL"
        volumeMounts:
        - name: ui-backend-credentials
          mountPath: /credentials
          readOnly: true
        - name: tmp
          mountPath: /tmp
      containers:
      - name: osac-ui
        image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
        imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        envFrom:
        - configMapRef:
            name: osac-ui
        env:
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: osac-ui-backend-credentials
              key: client-secret
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 30
        resources:
          {{- toYaml .Values.ui.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: osac-ui
  namespace: {{ .Values.osacNamespace }}
  labels:
    {{- include "osac-devstack.labels" . | nindent 4 }}
    app: osac-ui
spec:
  selector:
    app: osac-ui
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: osac-ui
  namespace: {{ .Values.osacNamespace }}
  labels:
    {{- include "osac-devstack.labels" . | nindent 4 }}
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    namespace: envoy-gateway
    name: default
    sectionName: http
  hostnames:
  - ui.osac.localhost
  rules:
  - backendRefs:
    - name: osac-ui
      port: 80
{{- end }}
