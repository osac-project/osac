---
# Subnet deletion - removes its V-Net, child prefix, then parent IPAM subnet.

- name: Normalize task input
  ansible.builtin.include_tasks: _contract_input.yaml
  vars:
    _osac_task_name: delete_subnet

- name: Apply the Subnet delete provider work
  block:
    - name: Run the Subnet delete
      ansible.builtin.include_tasks: _delete_subnet_work.yaml
  rescue:
    - name: Preserve the underlying provider failure for the legacy report
      ansible.builtin.include_tasks: _preserve_failure.yaml
    - name: Publish the sanitized Subnet delete error and fail
      ansible.builtin.include_tasks: _contract_rescue.yaml
      vars:
        _osac_error_label: Subnet delete
