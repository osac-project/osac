columns:

- header: STATE
  value: this.state
  type: osac.public.v1.BillingProviderState

# Replace C0/C1 controls only in table cells, preserving labels and remediation text.
- header: PROVIDER
  value: >-
    this.provider_key != '' ? this.provider_key.split('').map(c,
      c < ' ' || (c >= '\u007f' && c <= '\u009f') ? ' ' : c).join('') : '-'

- header: MESSAGE
  value: >-
    this.message != '' ? this.message.split('').map(c,
      c < ' ' || (c >= '\u007f' && c <= '\u009f') ? ' ' : c).join('') : '-'

- header: CAPABILITIES
  value: this.supported_capabilities
  type: osac.public.v1.BillingProviderCapability

- header: LAST-SUCCESSFUL-CHECK
  value: "has(this.last_successful_check) ? string(this.last_successful_check) : '-'"

- header: USAGE-DELIVERY
  value: this.usage_delivery_state
  type: osac.public.v1.BillingUsageDeliveryState
