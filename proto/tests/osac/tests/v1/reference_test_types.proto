syntax = "proto3";

package osac.tests.v1;

import "osac/tests/v1/object_type.proto";

// Full reference for cross-tenant/project lookups.
message TestTargetReference {
  string id = 1;
  string name = 2;
  string project = 3;
  bool shared = 4;
}

// Local reference for same-tenant/project lookups.
message TestTargetLocalReference {
  string id = 1;
  string name = 2;
}

// Second local reference type for repeated and oneof testing.
message TestOtherTargetLocalReference {
  string id = 1;
  string name = 2;
}

// Nested message containing reference fields (mirrors ComputeNetworkAttachment).
message TestRefAttachment {
  TestTargetLocalReference subnet = 1;
  repeated TestOtherTargetLocalReference security_groups = 2;
  map<string, TestTargetReference> targets = 3;
}

// Spec with various reference field patterns.
message TestRefSpec {
  TestTargetReference target = 1;
  TestTargetLocalReference local_target = 2;
  TestRefAttachment attachment = 3;
  repeated TestOtherTargetLocalReference other_targets = 4;
  map<string, TestTargetReference> targets = 5;
  map<string, TestRefAttachment> attachments = 6;
  map<int64, TestTargetLocalReference> numbered_targets = 7;
  map<bool, TestTargetReference> enabled_targets = 8;
  map<string, string> labels = 9;
  repeated TestRefAttachment other_attachments = 10;
}

// Spec with oneof containing reference fields.
message TestRefOneofSpec {
  oneof target {
    TestTargetLocalReference compute_instance = 1;
    TestOtherTargetLocalReference cluster = 2;
  }
}

// buf:lint:ignore OSAC_OBJECT_SHAPE
message TestResourceWithRefs {
  string id = 1;
  Metadata metadata = 2;
  TestRefSpec spec = 3;
}

// buf:lint:ignore OSAC_OBJECT_SHAPE
message TestResourceWithOneof {
  string id = 1;
  Metadata metadata = 2;
  TestRefOneofSpec spec = 3;
}

message CreateTestResourceWithRefsRequest {
  TestResourceWithRefs object = 1;
}

message UpdateTestResourceWithRefsRequest {
  TestResourceWithRefs object = 1;
}

message CreateTestResourceWithOneofRequest {
  TestResourceWithOneof object = 1;
}
