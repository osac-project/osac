provider:
  name: osac
resources:
  secret:
    create:
      path: /api/fulfillment/v1/secrets
      method: POST
    read:
      path: /api/fulfillment/v1/secrets/{id}
      method: GET
    update:
      path: /api/fulfillment/v1/secrets/{object.id}
      method: PATCH
    delete:
      path: /api/fulfillment/v1/secrets/{id}
      method: DELETE
data_sources:
  secret:
    read:
      path: /api/fulfillment/v1/secrets/{id}
      method: GET
