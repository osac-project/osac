{{- if .Values.netbox.enabled }}
{{- if not .Values.netbox.useExistingTokenSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.netboxToken }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bare-metal-fulfillment-operator.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.netbox.tokenSecretKey | quote }}: {{ .Values.netbox.tokenValue | quote }}
{{- end }}
{{- if .Values.netbox.caCert }}
{{- if not .Values.netbox.useExistingTokenSecret }}
---
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.netboxCA }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bare-metal-fulfillment-operator.labels" . | nindent 4 }}
type: Opaque
stringData:
  ca.crt: |
{{ .Values.netbox.caCert | nindent 4 }}
{{- end }}
{{- end }}
