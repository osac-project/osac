syntax = "proto3";

package osac.public.v1;

import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "osac/public/v1/quota_threshold_type.proto";

message QuotaThresholdsListRequest {
  // Index of the first result. If not specified the default value will be zero.
  optional int32 offset = 1;

  // Maximum number of results to be returned by the server. When not specified all the results will be returned. Note
  // that there may not be enough results to return, and that the server may decide, for performance reasons, to return
  // less results than requested.
  optional int32 limit = 2;

  // Filter criteria.
  //
  // The value of this parameter is a [CEL](https://cel.dev) expression used to select which objects to return. The
  // built-in `this` variable refers to the object being tested and `now` refers to the current date and time. If the
  // expression evaluates to `true` the object is included in the results. For example, to retrieve all the thresholds
  // of one dimension:
  //
  //     this.spec.dimension == "compute.vcpus"
  //
  // If this isn't provided, or if the value is empty, then all the thresholds that the user has permission to see will
  // be returned. Not all CEL constructs are currently supported for implementation reasons; see the filter
  // documentation (docs/FILTER.md) for the full details.
  optional string filter = 3;

  // Order criteria.
  //
  // The syntax of this parameter is similar to the syntax of the _order by_ clause of a SQL statement, but using the
  // names of the attributes of the threshold instead of the names of the columns of a table. For example, in order to
  // sort the thresholds descending by creation time the value should be:
  //
  //     metadata.created_at desc
  //
  // If the parameter isn't provided, or if the value is empty, then the order of the results is undefined.
  optional string order = 4;
}

message QuotaThresholdsListResponse {
  // Actual number of items returned. Note that this may be smaller than the value requested in the `limit` parameter
  // of the request if there are not enough items, or if the system decides that returning that number of items isn't
  // feasible or convenient for performance reasons.
  int32 size = 1;

  // Total number of items of the collection that match the search criteria, regardless of the number of results
  // requested with the `limit` parameter.
  int32 total = 2;

  // List of results.
  repeated QuotaThreshold items = 3;
}

message QuotaThresholdsGetRequest {
  string id = 1;
}

message QuotaThresholdsGetResponse {
  QuotaThreshold object = 1;
}

message QuotaThresholdsCreateRequest {
  QuotaThreshold object = 1;
}

message QuotaThresholdsCreateResponse {
  QuotaThreshold object = 1;
}

message QuotaThresholdsUpdateRequest {
  QuotaThreshold object = 1;
  google.protobuf.FieldMask update_mask = 2;

  // Lock enables optimistic locking. When set to true, the server verifies that the current version of the object
  // matches the value of the metadata.version field of the submitted object. If they differ the update will be
  // rejected. This is useful to prevent lost updates when multiple clients are modifying the same object concurrently.
  bool lock = 3;
}

message QuotaThresholdsUpdateResponse {
  QuotaThreshold object = 1;
}

message QuotaThresholdsDeleteRequest {
  string id = 1;
}

message QuotaThresholdsDeleteResponse {}

// Manages the warning thresholds of a tenant's projects.
service QuotaThresholds {
  // Retrieves the list of thresholds.
  rpc List(QuotaThresholdsListRequest) returns (QuotaThresholdsListResponse) {
    option (google.api.http) = {get: "/api/fulfillment/v1/quota_thresholds"};
  }

  // Retrieves the details of one specific threshold.
  rpc Get(QuotaThresholdsGetRequest) returns (QuotaThresholdsGetResponse) {
    option (google.api.http) = {
      get: "/api/fulfillment/v1/quota_thresholds/{id}"
      response_body: "object"
    };
  }

  // Creates a new threshold. The project must have a limit on the same dimension.
  rpc Create(QuotaThresholdsCreateRequest) returns (QuotaThresholdsCreateResponse) {
    option (google.api.http) = {
      post: "/api/fulfillment/v1/quota_thresholds"
      body: "object"
      response_body: "object"
    };
  }

  // Updates an existing threshold. Only the value can change; the dimension, tenant, and project
  // are immutable.
  rpc Update(QuotaThresholdsUpdateRequest) returns (QuotaThresholdsUpdateResponse) {
    option (google.api.http) = {
      patch: "/api/fulfillment/v1/quota_thresholds/{object.id}"
      body: "object"
      response_body: "object"
    };
  }

  // Deletes a threshold.
  rpc Delete(QuotaThresholdsDeleteRequest) returns (QuotaThresholdsDeleteResponse) {
    option (google.api.http) = {delete: "/api/fulfillment/v1/quota_thresholds/{id}"};
  }
}
