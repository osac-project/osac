suite: observability namespaces and scrape access
templates:
  - templates/observability/*.yaml
  - templates/hooks/observability-pre-install-validate.yaml
  - templates/hooks/observability-remote-write.yaml
release:
  name: osac
  namespace: osac
set:
  # Required by the chart schema; unrelated to this suite.
  service.internalHostname: fulfillment.osac.svc
  service.externalHostname: fulfillment.example.com
  global.networking.fabricManager: test_fabric
  global.observability.enabled: true
  global.observability.collection.osacControlPlane: "30s"

tests:
  - it: labels the observability namespace for platform monitoring
    template: templates/observability/namespace.yaml
    asserts:
      - isKind:
          of: Namespace
      - equal:
          path: metadata.name
          value: osac-observability
      - equal:
          path: metadata.labels["openshift.io/cluster-monitoring"]
          value: "true"

  - it: renders no observability namespace when disabled
    template: templates/observability/namespace.yaml
    set:
      global.observability.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: labels the release namespace from a pre-install and pre-upgrade hook
    template: templates/observability/label-namespaces.yaml
    documentIndex: 3
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.name
          value: osac-label-namespaces
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded
      - equal:
          path: spec.template.spec.serviceAccountName
          value: osac-label-namespaces
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - contains:
          path: spec.template.spec.containers[0].command
          content: openshift.io/cluster-monitoring=true
      - equal:
          path: spec.template.spec.containers[0].command[3]
          value: osac

  - it: removes the label before the release is deleted
    template: templates/observability/label-namespaces.yaml
    documentIndex: 4
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.name
          value: osac-unlabel-namespaces
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-delete
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded
      - equal:
          path: spec.template.spec.serviceAccountName
          value: osac-label-namespaces
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].command[0]
          value: /bin/bash
      # The script must fail closed: `set -e` must abort on a failed kubectl
      # get, and the get must be its own command (not a $(...) assignment, which
      # a missing set -e would ignore).
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: set -euo pipefail
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: kubectl get namespace "\$ns" .* > /tmp/monitoring-label
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: kubectl label namespace "\$ns" openshift\.io/cluster-monitoring-

  - it: removes a leftover label on upgrade when disabled
    template: templates/observability/label-namespaces.yaml
    set:
      global.observability.enabled: false
    asserts:
      - hasDocuments:
          count: 4
      - isKind:
          of: Job
        documentIndex: 3
      - equal:
          path: metadata.name
          value: osac-unlabel-namespaces
        documentIndex: 3
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-upgrade
        documentIndex: 3

  - it: restricts the namespace label permission to the release namespace
    template: templates/observability/label-namespaces.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: ClusterRole
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade,pre-delete
      - equal:
          path: rules[0].resources[0]
          value: namespaces
      - equal:
          path: rules[0].resourceNames[0]
          value: osac
      - equal:
          path: rules[0].verbs
          value: [get, patch, update]

  - it: binds the label hook to its own service account
    template: templates/observability/label-namespaces.yaml
    documentIndex: 2
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: subjects[0].kind
          value: ServiceAccount
      - equal:
          path: subjects[0].name
          value: osac-label-namespaces
      - equal:
          path: subjects[0].namespace
          value: osac

  - it: grants scrape access in the release namespace only
    template: templates/observability/scrape-rbac.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: Role
      - equal:
          path: metadata.namespace
          value: osac
      - equal:
          path: rules[0].resources
          value: [services, endpoints, pods]
      - equal:
          path: rules[0].verbs
          value: [get, list, watch]

  - it: binds scrape access to prometheus-k8s in the release namespace
    template: templates/observability/scrape-rbac.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: RoleBinding
      - equal:
          path: metadata.namespace
          value: osac
      - equal:
          path: subjects[0].kind
          value: ServiceAccount
      - equal:
          path: subjects[0].name
          value: prometheus-k8s
      - equal:
          path: subjects[0].namespace
          value: openshift-monitoring
      - equal:
          path: roleRef.kind
          value: Role

  - it: grants scrape access in the observability namespace
    template: templates/observability/scrape-rbac.yaml
    documentIndex: 2
    asserts:
      - isKind:
          of: Role
      - equal:
          path: metadata.namespace
          value: osac-observability

  - it: binds scrape access to prometheus-k8s in the observability namespace
    template: templates/observability/scrape-rbac.yaml
    documentIndex: 3
    asserts:
      - isKind:
          of: RoleBinding
      - equal:
          path: metadata.namespace
          value: osac-observability
      - equal:
          path: subjects[0].name
          value: prometheus-k8s

  - it: renders no scrape resources when disabled
    template: templates/observability/scrape-rbac.yaml
    set:
      global.observability.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: scopes the remote-write service account to one ConfigMap
    template: templates/hooks/observability-remote-write.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.namespace
          value: openshift-monitoring

  - it: limits the remote-write role to get, create, update and patch
    template: templates/hooks/observability-remote-write.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: Role
      - equal:
          path: metadata.namespace
          value: openshift-monitoring
      - equal:
          path: rules[0].resourceNames
          value:
            - cluster-monitoring-config
      - equal:
          path: rules[0].verbs
          value:
            - get
            - create
            - update
            - patch

  - it: binds the remote-write role to its service account
    template: templates/hooks/observability-remote-write.yaml
    documentIndex: 2
    asserts:
      - isKind:
          of: RoleBinding
      - equal:
          path: roleRef.kind
          value: Role
      - equal:
          path: subjects[0].kind
          value: ServiceAccount

  - it: runs the remote-write Job after install and upgrade
    template: templates/hooks/observability-remote-write.yaml
    documentIndex: 3
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.name
          value: osac-observability-remote-write
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install,post-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "20"
      - equal:
          path: spec.backoffLimit
          value: 0
      - equal:
          path: spec.activeDeadlineSeconds
          value: 120
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/osac-project/osac-observability:latest
      - equal:
          path: spec.template.spec.containers[0].command[0]
          value: /remote-write-config

  - it: passes the enabled payload to the remote-write Job
    template: templates/hooks/observability-remote-write.yaml
    documentIndex: 3
    set:
      global.observability.collection.infrastructure: 45s
      global.observability.collection.platformNamespaces:
        - osac
        - osac-csi
        - osac-observability
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OBSERVABILITY_ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OBS_SCRAPE_INTERVAL
            value: 45s
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OBS_PLATFORM_NAMESPACES
            value: '["osac","osac-csi","osac-observability"]'
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OBS_RECEIVE_URL
            value: https://thanos-receive.osac-observability.svc.cluster.local:19291/api/v1/receive

  - it: keeps the remote-write Job on the disable path
    template: templates/hooks/observability-remote-write.yaml
    documentIndex: 3
    set:
      global.observability.enabled: false
    asserts:
      - isKind:
          of: Job
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OBSERVABILITY_ENABLED
            value: "false"

  - it: skips the prerequisite gate when observability is disabled
    template: templates/hooks/observability-pre-install-validate.yaml
    set:
      global.observability.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: grants the prerequisite gate only the named Secret and namespace
    template: templates/hooks/observability-pre-install-validate.yaml
    set:
      global.observability.objectStorage.secretName: thanos-object-storage
    documentIndex: 1
    asserts:
      - isKind:
          of: ClusterRole
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded
      - equal:
          path: rules[0].resources
          value: [namespaces]
      - equal:
          path: rules[0].resourceNames
          value: [osac-observability]
      - equal:
          path: rules[0].verbs
          value: [get]
      - equal:
          path: rules[1].resources
          value: [secrets]
      - equal:
          path: rules[1].resourceNames
          value: [thanos-object-storage]
      - equal:
          path: rules[1].verbs
          value: [get]

  - it: binds the prerequisite role to its own service account
    template: templates/hooks/observability-pre-install-validate.yaml
    documentIndex: 2
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: roleRef.kind
          value: ClusterRole
      - equal:
          path: subjects[0].kind
          value: ServiceAccount
      - equal:
          path: subjects[0].namespace
          value: osac

  - it: gates the install before any observability resource is created
    template: templates/hooks/observability-pre-install-validate.yaml
    set:
      global.observability.objectStorage.secretName: thanos-object-storage
      global.observability.objectStorage.endpoint: https://s3.example.com
    documentIndex: 3
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.namespace
          value: osac
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-20"
      - equal:
          path: spec.backoffLimit
          value: 0
      - equal:
          path: spec.activeDeadlineSeconds
          value: 120
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].image
          value: quay.io/openshift/origin-cli:4.20.0
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: observability object-storage Secret .* was not found
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: cert-manager.io/v1 API is not served
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OBS_SECRET_NAME
            value: thanos-object-storage
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OBS_SECRET_NAMESPACE
            value: osac-observability
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OBS_ENDPOINT
            value: https://s3.example.com
