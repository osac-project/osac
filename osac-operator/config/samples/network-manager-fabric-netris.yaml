# Example ConfigMap: Netris Fabric Manager registration (contract section 4.2)
#
# The installer chart renders this registration when
# global.networking.fabricManager=netris. The operator discovers Fabric
# Managers by selecting ConfigMaps with the label
# osac.openshift.io/network-fabric-manager. The data.name value is referenced
# by NetworkClass.fabricManager. The ConfigMap must be immutable and may only
# use the data keys below.
apiVersion: v1
kind: ConfigMap
metadata:
  name: osac-network-fabric-manager-netris
  namespace: osac
  labels:
    osac.openshift.io/network-fabric-manager: "true"
immutable: true
data:
  name: netris
  description: >-
    Netris SDN controller for physical fabric management. Provides EVPN
    networking and Ethernet east-west connectivity for bare-metal servers.
  ansible_role: osac.templates.netris
  network_types: evpn
  capabilities: eastWestEthernet,security_group_icmp
