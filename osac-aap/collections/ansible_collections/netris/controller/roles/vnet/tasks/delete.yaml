---
- name: Ensure Netris auth
  ansible.builtin.include_role:
    name: netris.controller.auth
  when: netris_session_cookie is not defined

- name: Get existing V-Nets
  netris.controller.protected_uri:
    url: "{{ netris_controller_url }}/api/v2/vnet"
    method: GET
    headers:
      Cookie: "connect.sid={{ netris_session_cookie }}"
    return_content: true
    status_code: 200
    validate_certs: "{{ netris_validate_certs | default(true) }}"
    ca_path: "{{ netris_ca_path | default(omit, true) }}"
  register: _vnet_list_resp
  no_log: true

- name: Find V-Nets by name
  ansible.builtin.set_fact:
    _existing_vnets: >-
      {{ (_vnet_list_resp.json.data | default([]))
         | selectattr('name', 'equalto', vnet_name)
         | list }}
  when: _vnet_list_resp.json is mapping

- name: Filter V-Nets by VPC
  ansible.builtin.set_fact:
    _existing_vnets: >-
      {{ _existing_vnets
         | selectattr('vpc.id', 'equalto', vnet_vpc_id | int)
         | list }}
  when: vnet_vpc_id is defined

- name: Filter V-Nets by tenant
  ansible.builtin.set_fact:
    _existing_vnets: >-
      {{ _existing_vnets
         | selectattr('tenant.id', 'equalto', vnet_tenant_id | int)
         | list }}
  when: vnet_tenant_id is defined

- name: Fail if the V-Net deletion identity is ambiguous
  ansible.builtin.assert:
    that:
      - _existing_vnets | length <= 1
    fail_msg: >-
      More than one Netris V-Net named '{{ vnet_name }}' matches the supplied
      VPC/tenant identity. Refusing to delete an ambiguous resource.

- name: Set the matching V-Net
  ansible.builtin.set_fact:
    _existing_vnet: "{{ _existing_vnets | first | default({}) }}"

- name: Delete V-Net
  when: _existing_vnet | length > 0
  netris.controller.protected_uri:
    url: "{{ netris_controller_url }}/api/v2/vnet/{{ _existing_vnet.id }}"
    method: DELETE
    headers:
      Cookie: "connect.sid={{ netris_session_cookie }}"
    # 404 means the V-Net was removed concurrently after the list lookup;
    # the deletion target is already absent, so treat it as deleted.
    status_code: [200, 204, 404]
    validate_certs: "{{ netris_validate_certs | default(true) }}"
    ca_path: "{{ netris_ca_path | default(omit, true) }}"
  register: _vnet_delete_resp
  no_log: true

- name: Report the concurrently removed V-Net
  ansible.builtin.debug:
    msg: >-
      A V-Net was already absent (HTTP 404) at deletion time; treating it
      as deleted.
  when: _vnet_delete_resp is defined and _vnet_delete_resp.status | default(0) == 404
