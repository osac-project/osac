---
# OSAC-4361 overlay cases for the csi_driver_install integration target from
# PR #361. These verify that local StorageClass creation is independently
# opt-in from the network-vendor Helm release.
- name: "CSI Driver Install - Local-tier StorageClass selector defaults off"
  hosts: localhost
  gather_facts: false

  vars:
    csi_driver_install_tiers:
      - name: local
        protocol: block
        provider: lvms
    tenant_name: test-local-tier
    tenant_namespace: test-local-tier-ns

  tasks:
    - name: Remove any previous local-tier StorageClass
      kubernetes.core.k8s:
        state: absent
        api_version: storage.k8s.io/v1
        kind: StorageClass
        name: osac-test-local-tier-local
      failed_when: false

    - name: Call csi_driver_install with generic installation enabled and the local selector unset
      ansible.builtin.include_role:
        name: osac.service.csi_driver_install
      vars:
        csi_driver_install_enabled: true

    - name: Read local-tier StorageClass while the local selector uses its default
      kubernetes.core.k8s_info:
        api_version: storage.k8s.io/v1
        kind: StorageClass
        name: osac-test-local-tier-local
      register: _local_storage_class_default_off

    - name: Assert the default-off local selector does not create a CSI StorageClass
      ansible.builtin.assert:
        that:
          - _local_storage_class_default_off.resources | length == 0
        fail_msg: >-
          The local CSI StorageClass must not be created unless
          csi_driver_install_lvms_storage_class_enabled is enabled.
        success_msg: "The local CSI StorageClass selector defaults off"

    - name: Run legacy LVMS ensure_storage_class with the CSI selector off
      ansible.builtin.include_role:
        name: osac.service.storage_provider
      vars:
        storage_provider_action: ensure_storage_class
        storage_provider_tiers: "{{ csi_driver_install_tiers }}"
        storage_provider_backend_connections: {}

    - name: Read the local-tier StorageClass created by the legacy LVMS dispatch
      kubernetes.core.k8s_info:
        api_version: storage.k8s.io/v1
        kind: StorageClass
        name: osac-test-local-tier-local
      register: _legacy_local_storage_class

    - name: Assert default-off preserves the direct TopoLVM StorageClass
      ansible.builtin.assert:
        that:
          - _legacy_local_storage_class.resources | length == 1
          - _legacy_local_storage_class.resources[0].provisioner == 'topolvm.io'
          - _legacy_local_storage_class.resources[0].parameters['topolvm.io/device-class'] is defined
        fail_msg: >-
          The default-off path must leave local StorageClass creation to the
          legacy TopoLVM provider: {{ _legacy_local_storage_class.resources | to_json }}
        success_msg: "The default-off path created the direct TopoLVM StorageClass"

    - name: Verify CSI opt-in refuses an existing legacy StorageClass
      block:
        - name: Opt into CSI while retaining the legacy class
          ansible.builtin.include_role:
            name: osac.service.csi_driver_install
          vars:
            csi_driver_install_enabled: false
            csi_driver_install_lvms_storage_class_enabled: true

        - name: Reject unexpected migration success
          ansible.builtin.fail:
            msg: The CSI role must refuse an incompatible existing StorageClass
      rescue:
        - name: Assert the failure explains the migration prerequisite
          ansible.builtin.assert:
            that:
              - "'immutable' in (ansible_failed_result | to_json)"
              - "'PVC/PV' in (ansible_failed_result | to_json)"
              - "'not deleted' in (ansible_failed_result | to_json)"

    - name: Read the retained legacy StorageClass
      kubernetes.core.k8s_info:
        api_version: storage.k8s.io/v1
        kind: StorageClass
        name: osac-test-local-tier-local
      register: _retained_legacy_storage_class

    - name: Assert the incompatible class was not changed or replaced
      ansible.builtin.assert:
        that:
          - _retained_legacy_storage_class.resources[0].metadata.uid == _legacy_local_storage_class.resources[0].metadata.uid
          - _retained_legacy_storage_class.resources[0].provisioner == 'topolvm.io'
          - _retained_legacy_storage_class.resources[0].parameters == _legacy_local_storage_class.resources[0].parameters

    - name: Delete legacy local-tier StorageClass
      kubernetes.core.k8s:
        state: absent
        api_version: storage.k8s.io/v1
        kind: StorageClass
        name: osac-test-local-tier-local

- name: "CSI Driver Install - Stage 1 defers local StorageClass creation"
  hosts: localhost
  gather_facts: false

  vars:
    csi_driver_install_tiers:
      - name: local
        protocol: block
        provider: lvms
    tenant_name: test-local-tier

  tasks:
    - name: Remove any previous local-tier StorageClass
      kubernetes.core.k8s:
        state: absent
        api_version: storage.k8s.io/v1
        kind: StorageClass
        name: osac-test-local-tier-local
      failed_when: false

    - name: Call csi_driver_install with the Stage 1 suppression flag
      ansible.builtin.include_role:
        name: osac.service.csi_driver_install
      vars:
        csi_driver_install_enabled: false
        csi_driver_install_lvms_storage_class_enabled: true
        csi_driver_install_skip_lvms_storage_class: true

    - name: Read local-tier StorageClass after the Stage 1 role call
      kubernetes.core.k8s_info:
        api_version: storage.k8s.io/v1
        kind: StorageClass
        name: osac-test-local-tier-local
      register: _local_storage_class_after_stage1

    - name: Assert Stage 1 suppression leaves class creation for Stage 2
      ansible.builtin.assert:
        that:
          - _local_storage_class_after_stage1.resources | length == 0
        fail_msg: >-
          Stage 1 must not create the local CSI StorageClass before backend
          readiness: {{ _local_storage_class_after_stage1.resources | to_json }}
        success_msg: "Stage 1 deferred local CSI StorageClass creation"

- name: "CSI Driver Install - Local-tier StorageClass"
  hosts: localhost
  gather_facts: false

  vars:
    csi_driver_install_tiers:
      - name: local
        protocol: block
        provider: lvms
    tenant_name: test-local-tier
    tenant_namespace: test-local-tier-ns

  tasks:
    - name: Remove any previous local-tier StorageClass
      kubernetes.core.k8s:
        state: absent
        api_version: storage.k8s.io/v1
        kind: StorageClass
        name: osac-test-local-tier-local
      failed_when: false

    - name: Create local-tier StorageClass through csi_driver_install
      ansible.builtin.include_role:
        name: osac.service.csi_driver_install
      vars:
        csi_driver_install_enabled: false
        csi_driver_install_lvms_storage_class_enabled: true

    - name: Read local-tier StorageClass
      kubernetes.core.k8s_info:
        api_version: storage.k8s.io/v1
        kind: StorageClass
        name: osac-test-local-tier-local
      register: _local_storage_class

    - name: Assert local-tier StorageClass contract
      ansible.builtin.assert:
        that:
          - _local_storage_class.resources | length == 1
          - _local_storage_class.resources[0].provisioner == 'csi.osac.openshift.io'
          - _local_storage_class.resources[0].volumeBindingMode == 'WaitForFirstConsumer'
          - _local_storage_class.resources[0].reclaimPolicy == 'Delete'
          - _local_storage_class.resources[0].metadata.labels['osac.openshift.io/tenant'] == tenant_name
          - _local_storage_class.resources[0].metadata.labels['osac.openshift.io/storage-tier'] == 'local'
          - "_local_storage_class.resources[0].parameters == {'osac.tier': 'local', 'tenant': tenant_name}"
          - "'osac.io/device-class' not in _local_storage_class.resources[0].parameters"
          - "'topolvm.io/device-class' not in _local_storage_class.resources[0].parameters"
        fail_msg: >-
          Local-tier StorageClass did not match the OSAC CSI contract:
          {{ _local_storage_class.resources | to_json }}

    - name: Run legacy LVMS ensure_storage_class against the existing CSI class
      ansible.builtin.include_role:
        name: osac.service.storage_provider
      vars:
        storage_provider_action: ensure_storage_class
        storage_provider_tiers: "{{ csi_driver_install_tiers }}"
        storage_provider_backend_connections: {}

    - name: Read local-tier StorageClass after the legacy LVMS dispatch
      kubernetes.core.k8s_info:
        api_version: storage.k8s.io/v1
        kind: StorageClass
        name: osac-test-local-tier-local
      register: _local_storage_class_after_legacy_dispatch

    - name: Assert legacy LVMS dispatch preserves the CSI StorageClass
      ansible.builtin.assert:
        that:
          - _local_storage_class_after_legacy_dispatch.resources | length == 1
          - _local_storage_class_after_legacy_dispatch.resources[0].provisioner == 'csi.osac.openshift.io'
          - >-
            _local_storage_class_after_legacy_dispatch.resources[0].parameters ==
            {'osac.tier': 'local', 'tenant': tenant_name}
        fail_msg: >-
          The legacy LVMS dispatch must not replace the opt-in CSI StorageClass:
          {{ _local_storage_class_after_legacy_dispatch.resources | to_json }}
        success_msg: "The LVMS dispatch left the CSI StorageClass intact"

    - name: Re-run csi_driver_install to verify idempotency
      ansible.builtin.include_role:
        name: osac.service.csi_driver_install
      vars:
        csi_driver_install_enabled: false
        csi_driver_install_lvms_storage_class_enabled: true

    - name: Read local-tier StorageClass after the idempotent re-run
      kubernetes.core.k8s_info:
        api_version: storage.k8s.io/v1
        kind: StorageClass
        name: osac-test-local-tier-local
      register: _local_storage_class_after_rerun

    - name: Assert idempotent re-run leaves one local-tier StorageClass
      ansible.builtin.assert:
        that:
          - _local_storage_class_after_rerun.resources | length == 1
          - _local_storage_class_after_rerun.resources[0].metadata.labels['osac.openshift.io/tenant'] == tenant_name
          - "_local_storage_class_after_rerun.resources[0].parameters == {'osac.tier': 'local', 'tenant': tenant_name}"

    - name: Delete local-tier StorageClass
      kubernetes.core.k8s:
        state: absent
        api_version: storage.k8s.io/v1
        kind: StorageClass
        name: osac-test-local-tier-local
