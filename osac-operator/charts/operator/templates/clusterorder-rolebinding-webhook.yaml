{{- if eq (include "osac-operator.controllerEnabled" (list . "clusterOrder" "caas")) "true" }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "osac-operator.clusterOrderRBACWebhookName" . }}-webhook
  labels:
    {{- include "osac-operator.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: {{ printf "%s/%s" .Release.Namespace (include "osac-operator.clusterOrderRBACWebhookName" .) | quote }}
webhooks:
- name: clusterorder-admin-rolebinding.osac.openshift.io
  admissionReviewVersions:
  - v1
  sideEffects: None
  matchPolicy: Equivalent
  failurePolicy: Fail
  timeoutSeconds: 5
  clientConfig:
    service:
      namespace: {{ .Release.Namespace }}
      name: {{ include "osac-operator.clusterOrderRBACWebhookName" . }}
      path: /validate-clusterorder-admin-rolebinding
      port: 443
  rules:
  - apiGroups:
    - rbac.authorization.k8s.io
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - rolebindings
    scope: Namespaced
  matchConditions:
  - name: osac-operator-manager
    expression: {{ printf "request.userInfo.username == %q" (printf "system:serviceaccount:%s:%s" .Release.Namespace (include "osac-operator.serviceAccountName" .)) | quote }}
{{- end }}
