{{- if .Values.service.enabled }}
{{/* The installer's NetworkClass step (files/network-class-step.py). */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: network-class-step
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "24"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  network-class-step.py: |
{{ .Files.Get "files/network-class-step.py" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-network-class
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "25"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-output-log-policy": hook-failed
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        {{- include "osac.labels" . | nindent 8 }}
      annotations:
        openshift.io/required-scc: restricted-v2
    spec:
      securityContext:
        runAsNonRoot: true
        {{- if not (.Capabilities.APIVersions.Has "security.openshift.io/v1") }}
        runAsUser: 1000
        fsGroup: 1000
        {{- end }}
      automountServiceAccountToken: false
      initContainers:
      {{- include "osac.waitForFulfillment" . | nindent 6 }}
      containers:
      - name: create-network-class
        image: {{ .Values.cliImage }}
        command:
          - /bin/bash
          - -euo
          - pipefail
          - -c
          - |
            {{- include "osac.fulfillmentAccessTokenFunction" . | nindent 12 }}
            AUTH_TOKEN=$(get_fulfillment_access_token)
            export AUTH_TOKEN
            exec python3 /scripts/network-class-step.py
        env:
        - name: HOME
          value: /tmp
        - name: NETWORK_CLASS_STEP_INPUT
          value: {{ include "osac.networking.stepInput" . | quote }}
        - name: FULFILLMENT_URL
          value: https://fulfillment-internal-api:8001
        - name: FULFILLMENT_CA_FILE
          value: /etc/ca-bundle/bundle.pem
        {{- include "osac.fulfillmentAuthEnv" . | nindent 8 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: ca-bundle
          mountPath: /etc/ca-bundle
          readOnly: true
        - name: scripts
          mountPath: /scripts
          readOnly: true
        {{- include "osac.fulfillmentAuthVolumeMount" . | nindent 8 }}
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: tmp
        emptyDir: {}
      - name: scripts
        configMap:
          name: network-class-step
      - name: ca-bundle
        configMap:
          name: {{ .Values.service.certs.caBundle.configMap | required "service.certs.caBundle.configMap is required" }}
          items:
          - key: bundle.pem
            path: bundle.pem
      {{- include "osac.fulfillmentAuthVolume" . | nindent 6 }}
      restartPolicy: OnFailure
{{- end }}
