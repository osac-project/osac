name: Helm Lint

# Called by ci.yml (job helm-lint). `changed` lists the Helm filters from
# .github/filters/ci-filters.yml that matched, as |helm-osac-operator|...|;
# empty means check everything. The charts job picks the matching entries of
# the chart lists below, so a component whose charts did not change gets no
# jobs at all.

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      changed:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  charts:
    name: Pick charts
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      crds: ${{ steps.pick.outputs.crds }}
      lint: ${{ steps.pick.outputs.lint }}
      installer: ${{ steps.pick.outputs.installer }}
    steps:
      - id: pick
        env:
          CHANGED: ${{ inputs.changed }}
        run: |
          set -euo pipefail
          crds='[
            {"component": "osac-operator"},
            {"component": "bare-metal-fulfillment-operator"}
          ]'
          # fulfillment-service's chart guards most values with
          # `required "..." .Values.X` (auth/certs/idp config), so it needs its
          # CI-only charts/service/ci-values.yaml passed via -f to lint and
          # template cleanly. osac-operator's and osac-aap's charts have no such
          # guards and lint fine bare.
          lint='[
            {"component": "osac-operator", "chart": "operator-crds"},
            {"component": "osac-operator", "chart": "operator"},
            {"component": "bare-metal-fulfillment-operator", "chart": "operator-crds"},
            {"component": "bare-metal-fulfillment-operator", "chart": "operator"},
            {"component": "fulfillment-service", "chart": "service", "values-file": "ci-values.yaml"},
            {"component": "osac-aap", "chart": "aap"},
            {"component": "osac-csi-driver", "chart": "csi-driver"},
            {"component": "osac-csi-driver", "chart": "csi-backends"},
            {"component": "osac-metering", "chart": "osac-metering"}
          ]'
          pick() {
            jq -c --arg c "${CHANGED}" \
              'map(. as $m | select($c == "" or ($c | contains("|helm-" + $m.component + "|"))))' <<<"$1"
          }
          echo "crds=$(pick "${crds}")" >> "$GITHUB_OUTPUT"
          echo "lint=$(pick "${lint}")" >> "$GITHUB_OUTPUT"
          # The installer's umbrella chart (charts/osac/) pulls in every other
          # component's chart as a file:// dependency, so a change to any Helm
          # filter changes what it builds and lints.
          if [[ -z "${CHANGED}" || "${CHANGED}" == *"|helm-"* ]]; then
            echo "installer=true" >> "$GITHUB_OUTPUT"
          else
            echo "installer=false" >> "$GITHUB_OUTPUT"
          fi

  helm-crds-sync:
    name: Check Helm CRD sync (${{ matrix.component }})
    needs: charts
    if: needs.charts.outputs.crds != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.charts.outputs.crds) }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
      with:
        go-version: stable

    - name: Verify Helm CRD templates match bases
      working-directory: ${{ matrix.component }}
      run: make check-helm-crds

  helm-lint:
    name: Lint Helm chart (${{ matrix.component }}/${{ matrix.chart }})
    needs: charts
    if: needs.charts.outputs.lint != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.charts.outputs.lint) }}
    steps:

    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
      with:
        version: v3.22.0

    - name: Lint chart
      working-directory: ${{ matrix.component }}
      run: |
        if [ -n "${{ matrix.values-file }}" ]; then
          helm lint "charts/${{ matrix.chart }}/" -f "charts/${{ matrix.chart }}/${{ matrix.values-file }}"
        else
          helm lint "charts/${{ matrix.chart }}/"
        fi

    - name: Template chart
      working-directory: ${{ matrix.component }}
      run: |
        if [ -n "${{ matrix.values-file }}" ]; then
          helm template test "charts/${{ matrix.chart }}/" -f "charts/${{ matrix.chart }}/${{ matrix.values-file }}"
        else
          helm template test "charts/${{ matrix.chart }}/"
        fi

  # osac-installer's own umbrella chart (charts/osac/) composes every other
  # component's chart as a file:// dependency, plus osac-ui as an OCI
  # dependency -- a different thing from linting any one component's chart in
  # isolation above, so this stays a separate job rather than another matrix
  # entry.
  #
  # Skip condition intentionally isn't scoped to osac-installer's own filter
  # alone: charts/osac/ pulls in every other component's chart as a local
  # file:// dependency, so a change to any of them changes what this job
  # actually builds and lints, not just a change under osac-installer/ itself.
  helm-lint-installer:
    name: Lint Helm charts (osac-installer)
    needs: charts
    if: needs.charts.outputs.installer == 'true'
    runs-on: ubuntu-latest
    steps:

    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      with:
        persist-credentials: false

    - name: Set up Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
      with:
        version: v3.22.0

    - name: Set up Python
      uses: ./.github/actions/setup-python

    - name: Set up chart-testing
      uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f  # v2.8.0

    - name: Build chart dependencies
      working-directory: osac-installer
      run: |
        make helm-infra-deps
        helm dependency build charts/osac/

    - name: Test networking values
      working-directory: osac-installer
      run: ./scripts/test-networking-values.sh

    - name: Test MCE rendering
      working-directory: osac-installer
      run: uv run --project .. make mce-render-test

    - name: Test BMF NetBox rendering
      if: steps.should-run.outputs.run
      working-directory: osac-installer
      run: uv run --project .. make bmf-netbox-render-test

    - name: Test chart name independence
      working-directory: osac-installer
      run: make chart-name-independence-render-test

    - name: Run chart-testing lint
      working-directory: osac-installer
      run: ct lint --all --config ct.yaml

    - name: Template with CI values
      working-directory: osac-installer
      run: |
        set -euo pipefail
        for f in charts/osac/ci/*-values.yaml; do
          echo "--- helm template osac with $(basename "$f") ---"
          helm template osac charts/osac/ --values "$f"
        done

    - name: Template with environment values
      working-directory: osac-installer
      run: |
        set -euo pipefail
        # Some profiles are overlays layered on a base profile by the
        # Makefile's value selection (bmaas-netbox-ci layers bmaas-ci);
        # template the same base+overlay combination the installer uses.
        base_profile() {
          case "$1" in
            bmaas-netbox-ci) echo bmaas-ci ;;
            *) echo "" ;;
          esac
        }
        for d in values/*/; do
          profile=$(basename "$d")
          base=$(base_profile "${profile}")
          echo "--- profile: ${profile} ---"
          infra_args=()
          instance_args=()
          if [ -n "${base}" ]; then
            infra_args+=(--values "values/${base}/infra.yaml")
            instance_args+=(--values "values/${base}/instance.yaml")
          fi
          if [ -f "${d}infra.yaml" ]; then
            infra_args+=(--values "${d}infra.yaml")
            helm template osac-deps charts/osac-deps/ "${infra_args[@]}"
            helm template osac-infra charts/osac-infra/ "${infra_args[@]}"
          fi
          if [ -f "${d}instance.yaml" ]; then
            instance_args+=(--values "${d}instance.yaml")
            # The NetBox API token is generated at install time by the
            # osac-infra seed hook; offline templating cannot see the Secret
            # the BMF chart looks up, so supply a placeholder here like the
            # other runtime-injected values set below.
            case "${profile}" in
              bmaas-netbox-ci) instance_args+=(--set "bmf.netbox.tokenValue=ci-render-placeholder") ;;
            esac
            helm template osac charts/osac/ "${instance_args[@]}" \
              --set service.externalHostname=fulfillment-api.example.com \
              --set service.internalHostname=fulfillment-internal-api.example.com \
              --set global.clusterDomain=example.com \
              --set ui.auth.oidcIssuerURL=https://keycloak-keycloak.example.com/realms/osac
          fi
        done
