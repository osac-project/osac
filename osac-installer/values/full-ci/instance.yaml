# Full CI environment -- instance values for osac chart.

# --- Service Enablement ---
global:
  osacDeploymentId: "ci/osac"
  fulfillmentTrust:
    enabled: false
  # Keep clusterFulfillment NETWORK_STEPS_COLLECTION=ci.steps authoritative.
  # Without this, the agentless networking facade overwrites it with
  # agentless_net.steps (see docs/aap-configuration.md).
  expertOverrides:
    aap: true
  services:
    caas:
      enabled: true
    vmaas:
      enabled: true
    bmaas:
      enabled: true
    maas:
      enabled: true

# --- Operator ---
operator:
  image:
    repository: ghcr.io/osac-project/osac-operator
    tag: latest
    pullPolicy: Always
  provisioning:
    provider: "aap"
  # The Volume controller provisions through LVMS in-cluster, like vmaas-ci:
  # without an entry volume provisioning is disabled and no volume ever bills.
  vendorControllers:
    lvms: none
  aap:
    insecureSkipVerify: "true"
    tokenSecret:
      name: osac-aap-api-token
      key: token
  fulfillment:
    serverAddress: "fulfillment-internal-api:8001"
    credentials:
      secretName: fulfillment-controller-credentials
      clientIdKey: client-id
      clientSecretKey: client-secret
  controllers:
    tenant: true
    networking: true
    storage: true
  hubAccess:
    enabled: true
  tenants:
  - name: shared
  - name: osac-e2e-ci

# --- Fulfillment Service ---
service:
  externalHostname: ""  # set dynamically by make install-osac
  internalHostname: ""  # set dynamically by make install-osac
  variant: openshift
  images:
    service:
      repository: ghcr.io/osac-project/fulfillment-service
      tag: latest
      pullPolicy: Always
    envoy:
      repository: ghcr.io/osac-project/envoy
      tag: v1.33.0
      pullPolicy: IfNotPresent
  certs:
    issuerRef:
      kind: ClusterIssuer
      name: default-ca
    caBundle:
      configMap: ca-bundle
  auth:
    # issuerUrl defaults to a global.clusterDomain-backed external route URL
    # (see charts/osac/values.yaml) -- correct automatically once
    # install-osac sets --set global.clusterDomain=$(DOMAIN).
    emergencyServiceAccounts:
    - admin
    - template-publisher
    - osac-metering
    controllerCredentials:
    - secret:
        name: fulfillment-controller-credentials
        items:
        - key: client-id
          param: client-id
        - key: client-secret
          param: client-secret
  idp:
    provider: keycloak
    # url defaults to a global.clusterDomain-backed external route URL (see
    # charts/osac/values.yaml) -- correct automatically once install-osac
    # sets --set global.clusterDomain=$(DOMAIN).
    credentials:
    - secret:
        name: fulfillment-controller-credentials
        items:
        - key: client-id
          param: client-id
        - key: client-secret
          param: client-secret
  database:
    connection:
    - secret:
        name: osac-db-config
        items:
        - key: url
          param: url
    - secret:
        name: osac-db-client-cert
        items:
        - key: tls.crt
          param: sslcert
        - key: tls.key
          param: sslkey
        - key: ca.crt
          param: sslrootcert
  log:
    level: debug
  vault:
    # endpoint and keycloakIssuerUrl both default correctly (see
    # charts/osac/values.yaml) -- no override needed.
    namespace: osac
    kvMountPath: secret
    lifecycleRole: lifecycle
    lifecycleMountPath: jwt
    keycloakClientId: osac-controller
    keycloakAudience: osac-api
    caBundle:
      configMap: ca-bundle
    credentials:
    - secret:
        name: fulfillment-controller-credentials
        items:
        - key: client-secret
          param: client-secret

# --- UI ---
ui:
  enabled: true
  images:
    ui: ghcr.io/osac-project/osac-ui:latest
  api:
    fulfillment:
      certs:
        caBundle:
          configMap: ca-bundle
  auth:
    # oidcIssuerURL defaults to match service.auth.issuerUrl -- set automatically
    # by install-osac via --set ui.auth.oidcIssuerURL when global.clusterDomain is set.
    certs:
      caBundle:
        configMap: ca-bundle

# --- AAP ---
aap:
  aap:
    instance:
      enabled: true
      name: "osac-aap"
  bootstrap:
    enabled: true
    image: ghcr.io/osac-project/osac-aap:latest
    backoffLimit: 15
  configAsCode:
    manifestSecret: "config-as-code-manifest-ig"
    secret: "config-as-code-ig"
    eeImage: "ghcr.io/osac-project/osac-aap:latest"
    projectGitUri: "https://github.com/osac-project/osac"
    projectGitBranch: "main"
  instanceGroups:
    clusterFulfillment:
      enabled: true
      config:
        NETWORK_STEPS_COLLECTION: "ci.steps"
        HOSTED_CLUSTER_CONTROLLER_AVAILABILITY_POLICY: "SingleReplica"
        HOSTED_CLUSTER_INFRASTRUCTURE_AVAILABILITY_POLICY: "SingleReplica"
    networkFulfillment:
      enabled: true
    storageFulfillment:
      # Per-tenant StorageClasses: the tenant storage controller needs this
      # instance group for Tenant ClusterStorageReady to become True.
      enabled: true

# --- Validation ---
validation:
  enabled: true

# --- Bare Metal Fulfillment Operator ---
bmf:
  image:
    repository: ghcr.io/osac-project/bare-metal-fulfillment-operator
    tag: latest
    pullPolicy: Always
  env:
    aapUrl: "http://osac-aap/api/controller"
    aapInsecureSkipVerify: "true"
  metal3:
    # The operator mounts osac-inventory-config and osac-management-config as
    # required volumes; with Metal3 inventory enabled the subchart creates
    # both. The BareMetalHost namespace itself is provisioned by the E2E
    # harness (setup-virtual-bmh.sh), which also activates Ironic.
    enabled: true
    namespace: host-inventory
    hostClass: metal3

# --- LVMS StorageBackend and StorageTier registration ---
lvms:
  # Registers the "local" StorageBackend + StorageTier used by VMaaS disk tests.
  enabled: true

# --- Cluster Versions ---
clusterVersions:
  enabled: true
  versions:
  - version: "4.20.0"
    image: "quay.io/openshift-release-dev/ocp-release:4.20.0-multi"
  - version: "4.22.0"
    image: "quay.io/openshift-release-dev/ocp-release:4.22.0-multi"
    default: true
    diskImage:
      name: rhcos-4-22
      sourceRef: oci://quay.io/osac-project/rhcos:4.22.0

# --- Hub Access ---
hubAccess:
  enabled: true

# --- Metering ---
metering:
  image:
    repository: ghcr.io/osac-project/metering-service
    tag: latest
    pullPolicy: Always
  database:
    connection:
    - secret:
        name: osac-db-metering-config
        items:
        - key: url
          param: url
    - secret:
        name: osac-db-metering-client-cert
        items:
        - key: tls.crt
          param: sslcert
        - key: tls.key
          param: sslkey
        - key: ca.crt
          param: sslrootcert
  echoAdapter:
    # Test-only adapter the metering E2E tests read heartbeats from through
    # METERING_ADAPTER_URL.
    enabled: true
    image:
      repository: ghcr.io/osac-project/metering-echo-adapter
      tag: latest
      pullPolicy: Always
    # Four xdist workers each hold billable VMs for an hour-long session: the
    # assertions read a resource's whole history, so the buffer must hold it.
    maxEvents: 10000
  # Billing can stop while the metering pod stays ready, so the metrics are
  # scraped and the alerts evaluated: OpenShift user-workload monitoring
  # selects both.
  serviceMonitor:
    enabled: true
  prometheusRule:
    enabled: true
  # M360 adapter — disabled in CI: the UAT endpoint is unreachable from CI
  # runners and the API key Secret cannot exist there (the adapter pod mounts
  # it as a required volume, so an enabled adapter without the Secret wedges
  # the install). Enable locally with an overlay that also sets the image and
  # the Secret name, and create the Secret before installing.
  m360Adapter:
    enabled: false
