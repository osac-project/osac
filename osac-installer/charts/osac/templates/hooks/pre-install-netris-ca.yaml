{{- if and .Values.validation.enabled (eq (toString .Values.global.networking.fabricManager) "netris") (include "osac.netrisCaConfigMapName" .) }}
{{- $caConfigMap := include "osac.netrisCaConfigMapName" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "osac.fullname" . }}-netris-ca-preflight
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-11"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "osac.fullname" . }}-netris-ca-preflight
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-11"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: [{{ $caConfigMap | quote }}]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "osac.fullname" . }}-netris-ca-preflight
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-11"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "osac.fullname" . }}-netris-ca-preflight
subjects:
- kind: ServiceAccount
  name: {{ include "osac.fullname" . }}-netris-ca-preflight
  namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "osac.fullname" . }}-netris-ca-preflight
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-output-log-policy": hook-failed
spec:
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "osac.labels" . | nindent 8 }}
      annotations:
        openshift.io/required-scc: restricted-v2
    spec:
      securityContext:
        runAsNonRoot: true
        {{- if not (.Capabilities.APIVersions.Has "security.openshift.io/v1") }}
        runAsUser: 1000
        fsGroup: 1000
        {{- end }}
      restartPolicy: Never
      serviceAccountName: {{ include "osac.fullname" . }}-netris-ca-preflight
      containers:
      - name: validate
        image: {{ .Values.cliImage }}
        env:
        - name: HOME
          value: /tmp
        - name: CA_CONFIGMAP_NAME
          value: {{ $caConfigMap | quote }}
        - name: AAP_NAMESPACE
          value: {{ .Release.Namespace | quote }}
        - name: CA_EXECUTION_IDENTITY
          value: {{ printf "system:serviceaccount:%s:%s" .Release.Namespace (default "osac-sa" .Values.aap.serviceAccounts.osacSa) | quote }}
        - name: CHECK_IDENTITY
          value: "false"
        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "=== Netris CA Pre-install Validation ==="
{{ .Files.Get "files/validate-netris-ca.sh" | nindent 10 }}
          echo "=== Netris CA validation passed ==="
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: tmp
        emptyDir: {}
  backoffLimit: 0
{{- end }}
