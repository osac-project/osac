---
- name: Require Netris configuration for the requested instance type
  ansible.builtin.assert:
    that:
      - cluster_network_node_requests[0].bareMetal.instanceType in netris_resource_class_map
    fail_msg: "No Netris configuration for requested instance type {{ cluster_network_node_requests[0].bareMetal.instanceType }}"

- name: Resolve instance type network configuration
  ansible.builtin.set_fact:
    _netris_rc_config: "{{ netris_resource_class_map[cluster_network_node_requests[0].bareMetal.instanceType] }}"

- name: Set instance type derived values
  ansible.builtin.set_fact:
    _netris_server_cluster_template_id: "{{ _netris_rc_config.server_cluster_template_id }}"
    _server_mgmt_interface: "{{ _netris_rc_config.mgmt_interface }}"
    _server_vpc_interfaces: "{{ _netris_rc_config.vpc_interfaces }}"
