- name: Require a supported CaaS DNS domain
  ansible.builtin.assert:
    that:
      - external_access_base_domain in (external_access_supported_base_domains | default([]))
    fail_msg: >-
      The CaaS DNS base domain must be listed in
      external_access_supported_base_domains.

- name: Set DNS names
  ansible.builtin.set_fact:
    external_access_api_domain: "api.{{ external_access_name }}.{{ external_access_base_domain }}"
    external_access_api_int_domain: "api-int.{{ external_access_name }}.{{ external_access_base_domain }}"
    external_access_ingress_domain: "apps.{{ external_access_name }}.{{ external_access_base_domain }}"
  no_log: true

- name: Publish the API bootstrap DNS records
  ansible.builtin.include_role:
    name: osac.service.external_access
    tasks_from: caas_api_dns_create.yaml

- name: Reserve the CI guest ingress VIP
  ansible.builtin.include_tasks: caas_vip_reserve.yaml

- name: Configure guest ingress with the CI-reserved VIP
  ansible.builtin.include_role:
    name: osac.service.external_access
    tasks_from: caas_ingress_create.yaml
  vars:
    external_access_metallb_ingress_ip: "{{ external_access_vip_claim.address }}"

- name: Publish CaaS endpoints to ClusterOrder
  ansible.builtin.include_role:
    name: osac.service.external_access
    tasks_from: publish.yaml

- name: Wait for cluster network operator to become ready
  when: not (external_access_skip_network_operator_wait | default(false))
  ansible.builtin.include_role:
    name: osac.service.wait_for
    tasks_from: wait_for_network_cluster_operator
  vars:
    wait_for_kubeconfig: "{{ admin_kubeconfig }}"
