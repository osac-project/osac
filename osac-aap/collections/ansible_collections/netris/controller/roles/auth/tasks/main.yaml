---
# Contract 4.3/4.6: these settings come from the network-fulfillment-ig
# ConfigMap/Secret as environment variables. A missing value is retryable,
# because an administrator can repair it and job pods read settings at start.
- name: Require the Netris connection settings
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', 'NETRIS_CONTROLLER_URL', default='') | length > 0
      - lookup('ansible.builtin.env', 'NETRIS_USERNAME', default='') | length > 0
      - lookup('ansible.builtin.env', 'NETRIS_PASSWORD', default='') | length > 0
    fail_msg: >-
      Netris setting error: NETRIS_CONTROLLER_URL, NETRIS_USERNAME and
      NETRIS_PASSWORD must be set for Netris provider calls.

- name: Require a supported Netris controller URL
  ansible.builtin.assert:
    that:
      - >-
        lookup('ansible.builtin.env', 'NETRIS_CONTROLLER_URL', default='')
        | netris.controller.netris_controller_url_valid
    fail_msg: >-
      Netris setting error: NETRIS_CONTROLLER_URL must be an absolute HTTP(S)
      URL with a hostname and valid optional port, without credentials,
      query parameters or a fragment.

- name: Resolve Netris TLS settings from the worker environment
  ansible.builtin.set_fact:
    netris_controller_url: "{{ lookup('ansible.builtin.env', 'NETRIS_CONTROLLER_URL', default='') }}"
    netris_validate_certs: >-
      {{ (lookup('ansible.builtin.env', 'NETRIS_VALIDATE_CERTS')
          | default('true', true) | lower | trim) != 'false' }}
    netris_ca_path: >-
      {{ lookup('ansible.builtin.env', 'NETRIS_CA_PATH', default='') }}

- name: Login to Netris controller
  netris.controller.protected_uri:
    url: "{{ netris_controller_url }}/api/auth"
    method: POST
    body_format: json
    body:
      user: "{{ netris_username }}"
      password: "{{ netris_password }}"
      auth_scheme_id: 1
    validate_certs: "{{ netris_validate_certs | default(true) }}"
    ca_path: "{{ netris_ca_path | default(omit, true) }}"
    timeout: "{{ netris_timeout | default(30) }}"
    status_code: 200
  register: _netris_auth_resp
  no_log: true

- name: Extract session cookie
  ansible.builtin.set_fact:
    netris_session_cookie: "{{ _netris_auth_resp.cookies['connect.sid'] }}"
  no_log: true
