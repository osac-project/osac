---
apiVersion: osac.openshift.io/v1alpha1
kind: ComputeInstance
metadata:
  name: test-vm-gpu
  namespace: osac-system
spec:
  templateID: osac.templates.ocp_virt_vm
  networkAttachments:
    - subnetRef: test-subnet
  cores: 2
  memoryGiB: 4
  bootDisk:
    sizeGiB: 20
    storageTier: local
  image:
    sourceType: registry
    sourceRef: "quay.io/containerdisks/fedora:latest"
  runStrategy: "Always"
  gpu:
    pciDeviceSelector: "10DE:2901"
    resourceName: "nvidia.com/GB100"
    count: 1
status:
  desiredConfigVersion: "1"
