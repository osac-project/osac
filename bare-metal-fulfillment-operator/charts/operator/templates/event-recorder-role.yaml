apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    {{- include "bare-metal-fulfillment-operator.labels" . | nindent 4 }}
  name: {{ include "bare-metal-fulfillment-operator.fullname" . }}-event-recorder-role
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    {{- include "bare-metal-fulfillment-operator.labels" . | nindent 4 }}
  name: {{ include "bare-metal-fulfillment-operator.fullname" . }}-event-recorder-rolebinding
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "bare-metal-fulfillment-operator.fullname" . }}-event-recorder-role
subjects:
- kind: ServiceAccount
  name: {{ include "bare-metal-fulfillment-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
