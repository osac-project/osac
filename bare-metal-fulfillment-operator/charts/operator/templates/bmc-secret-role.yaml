{{- /*
Namespace-scoped access to Secrets for BMC credential lifecycle (BCM and NetBox).

The manager operates on per-host BMC Secrets and does not list or watch Secrets.
Kubernetes RBAC cannot restrict these dynamic Secret names, so it can access
all Secrets in the configured BMH namespace. Keep that namespace dedicated to
BareMetalHosts and their BMC credentials. This Role is namespaced, not a
cluster-wide manager ClusterRole rule. BCM uses bcm.bmhNamespace; NetBox uses
metal3.namespace. The OSAC installer validates this marker before installing the Role.
TODO(OSAC-5945 follow-up): direct installation of this standalone chart can bypass
that check; move namespace validation into this chart before supporting that path.
*/ -}}
{{- $bmhNamespace := "" -}}
{{- if .Values.bcm.enabled -}}
{{- $bmhNamespace = .Values.bcm.bmhNamespace -}}
{{- else if .Values.netbox.enabled -}}
{{- $bmhNamespace = .Values.metal3.namespace -}}
{{- end -}}
{{- if $bmhNamespace }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "bare-metal-fulfillment-operator.fullname" . }}-bmc-secrets
  namespace: {{ $bmhNamespace }}
  labels:
    {{- include "bare-metal-fulfillment-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "bare-metal-fulfillment-operator.fullname" . }}-bmc-secrets
  namespace: {{ $bmhNamespace }}
  labels:
    {{- include "bare-metal-fulfillment-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "bare-metal-fulfillment-operator.fullname" . }}-bmc-secrets
subjects:
- kind: ServiceAccount
  name: {{ include "bare-metal-fulfillment-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
