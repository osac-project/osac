syntax = "proto3";

package osac.public.v1;

import "buf/validate/validate.proto";
import "osac/public/v1/secret_type.proto";

// Selects inline user data or a tenant-local Secret containing a non-empty `userdata` entry.
message UserDataSource {
  oneof source {
    option (buf.validate.oneof).required = true;

    string inline = 1;
    SecretLocalReference secret = 2;
  }
}
