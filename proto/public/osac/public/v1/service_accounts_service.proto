syntax = "proto3";

package osac.public.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "osac/public/v1/service_account_type.proto";

message ServiceAccountsListRequest {
  // Zero-based index of the first result.
  optional int32 offset = 1;
  // Maximum number of results. Zero returns only the total count.
  optional int32 limit = 2;
  // CEL expression selecting visible service accounts.
  optional string filter = 3;
  // Ordering of results.
  optional string order = 4;
}

message ServiceAccountsListResponse {
  int32 size = 1;
  int32 total = 2;
  repeated ServiceAccount items = 3;
}

message ServiceAccountsGetRequest {
  string id = 1;
}

message ServiceAccountsGetResponse {
  ServiceAccount object = 1;
}

message ServiceAccountsCreateRequest {
  ServiceAccount object = 1 [(buf.validate.field).required = true];
}

message ServiceAccountsCreateResponse {
  ServiceAccount object = 1;
  // Initial credential, disclosed only in this response. Empty for dry-run requests.
  string client_secret = 2;
}

message ServiceAccountsUpdateRequest {
  ServiceAccount object = 1;
  google.protobuf.FieldMask update_mask = 2;
  // Reject the update with ABORTED when metadata.version does not match the stored version.
  bool lock = 3;
}

message ServiceAccountsUpdateResponse {
  ServiceAccount object = 1;
}

message ServiceAccountsDeleteRequest {
  string id = 1;
}

message ServiceAccountsDeleteResponse {}

message ServiceAccountsRegenerateSecretRequest {
  string id = 1;
}

message ServiceAccountsRegenerateSecretResponse {
  // Replacement credential, disclosed only in this response.
  string client_secret = 1;
}

// Manages tenant-owned service accounts and their role grants.
service ServiceAccounts {
  rpc List(ServiceAccountsListRequest) returns (ServiceAccountsListResponse) {
    option (google.api.http) = {get: "/api/fulfillment/v1/service_accounts"};
  }
  rpc Get(ServiceAccountsGetRequest) returns (ServiceAccountsGetResponse) {
    option (google.api.http) = {
      get: "/api/fulfillment/v1/service_accounts/{id}"
      response_body: "object"
    };
  }
  // Creates an account and returns its initial credential. The REST response retains the full envelope.
  rpc Create(ServiceAccountsCreateRequest) returns (ServiceAccountsCreateResponse) {
    option (google.api.http) = {
      post: "/api/fulfillment/v1/service_accounts"
      body: "object"
    };
  }
  // Updates display name, description, labels or role grants. Identity and status are server-controlled.
  rpc Update(ServiceAccountsUpdateRequest) returns (ServiceAccountsUpdateResponse) {
    option (google.api.http) = {
      patch: "/api/fulfillment/v1/service_accounts/{object.id}"
      body: "object"
      response_body: "object"
    };
  }
  // Marks the account deleting; cleanup completes asynchronously before archival.
  rpc Delete(ServiceAccountsDeleteRequest) returns (ServiceAccountsDeleteResponse) {
    option (google.api.http) = {delete: "/api/fulfillment/v1/service_accounts/{id}"};
  }
  // Regenerates the credential. The REST response retains the full envelope.
  rpc RegenerateSecret(ServiceAccountsRegenerateSecretRequest) returns (ServiceAccountsRegenerateSecretResponse) {
    option (google.api.http) = {
      post: "/api/fulfillment/v1/service_accounts/{id}:regenerate_secret"
      body: "*"
    };
  }
}
