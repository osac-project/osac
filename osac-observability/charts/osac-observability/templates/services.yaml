{{- if dig "observability" "enabled" false (.Values.global | default dict) }}
{{- $ns := include "osac-observability.namespace" . -}}
{{- $labels := include "osac-observability.labels" . -}}
apiVersion: v1
kind: Service
metadata:
  name: thanos-receive
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    # The service-CA operator fills thanos-receive-tls, which Receive mounts as
    # its remote-write server certificate.
    service.beta.openshift.io/serving-cert-secret-name: thanos-receive-tls
spec:
  type: ClusterIP
  selector:
    {{- include "osac-observability.componentSelectorLabels" (dict "root" . "component" "receive") | nindent 4 }}
  ports:
    - name: remote-write
      port: 19291
      targetPort: remote-write
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: thanos-receive-headless
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  clusterIP: None
  # DNS SRV discovery in Query must see a pod before its readiness gate passes,
  # otherwise a starting replica is never added to the store list.
  publishNotReadyAddresses: true
  selector:
    {{- include "osac-observability.componentSelectorLabels" (dict "root" . "component" "receive") | nindent 4 }}
  ports:
    - name: grpc
      port: 10901
      targetPort: grpc
      protocol: TCP
    - name: http
      port: 10902
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: thanos-store-headless
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "osac-observability.componentSelectorLabels" (dict "root" . "component" "store") | nindent 4 }}
  ports:
    - name: grpc
      port: 10901
      targetPort: grpc
      protocol: TCP
    - name: http
      port: 10902
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: thanos-query
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "osac-observability.componentSelectorLabels" (dict "root" . "component" "query") | nindent 4 }}
  ports:
    - name: http
      port: 9090
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: thanos-compactor-headless
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "osac-observability.componentSelectorLabels" (dict "root" . "component" "compactor") | nindent 4 }}
  ports:
    - name: http
      port: 10902
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 10901
      targetPort: grpc
      protocol: TCP
---
# The admin Routes reach these Services, never Thanos Query directly: each
# Service selects one proxy Deployment by its per-workload instance label and
# sends the request to the authentication proxy first.
apiVersion: v1
kind: Service
metadata:
  name: thanos-query-admin
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/instance: thanos-query-admin
    app.kubernetes.io/component: query-auth-proxy
  ports:
    - name: http
      port: 9091
      targetPort: oauth2-proxy
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: thanos-query-admin-openshift
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/instance: thanos-query-admin-openshift
    app.kubernetes.io/component: query-auth-proxy
  ports:
    - name: http
      port: 9091
      targetPort: oauth-proxy
      protocol: TCP
{{- end }}
