# Ask Copr to rebuild the osac-cli SCM package when fulfillment-service changes
# land on main, on a release branch, or a release tag is pushed.
#
# main pushes use the package's custom webhook, which rebuilds the committish
# configured on the Copr package (main). Release tags use Copr's GitHub
# integration webhook so Copr checks out the tag itself. Any other ref (a
# release branch push or a manual dispatch from the Actions UI) is submitted
# through the Copr API, because the webhooks can only build the committish
# configured on the package, and the release branches need their own commits.
#
# Required repository secrets:
#   COPR_CUSTOM_WEBHOOK_URL  -- the package-specific Copr custom webhook URL,
#       e.g. https://copr.fedorainfracloud.org/webhooks/custom/<id>/<uuid>/osac-cli/
#   COPR_GITHUB_WEBHOOK_URL  -- the Copr GitHub integration webhook URL with the
#       osac-cli package suffix, e.g.
#       https://copr.fedorainfracloud.org/webhooks/github/<id>/<uuid>/osac-cli/
#   COPR_API_LOGIN           -- Copr API login from https://copr.fedorainfracloud.org/api/
#   COPR_API_TOKEN           -- Copr API token for an account that can build in @osac/osac-cli
#
# The Copr project's SCM source settings must point at osac-project/osac
# (the monorepo), with subdirectory fulfillment-service and spec file
# .copr/osac-cli.spec. The GitHub integration URL must come from the project's
# Settings / Integrations page; the package suffix is needed because release
# tags use the component name rather than Copr's package name.

name: Trigger Copr RPM build

on:
  push:
    branches:
      - main
      - 'release-*'
    # paths is evaluated only for branch pushes, not tag pushes -- so tag
    # events matching the tags filter below always fire regardless of which
    # files changed, which is the correct behavior (a release tag should
    # always trigger an RPM build).
    paths:
      - 'fulfillment-service/**'
      - '.copr/**'
    tags:
      - 'fulfillment-service/v*'
  workflow_dispatch:

permissions: {}

jobs:
  trigger-copr:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/heads/main') ||
      startsWith(github.ref, 'refs/heads/release-') ||
      startsWith(github.ref, 'refs/tags/fulfillment-service/v')
    name: Trigger Copr build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # No checkout needed -- the workflow only sends an HTTP request.
    steps:
      - name: Notify Copr
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          COPR_CUSTOM_WEBHOOK_URL: ${{ secrets.COPR_CUSTOM_WEBHOOK_URL }}
        run: |
          if [[ -z "${COPR_CUSTOM_WEBHOOK_URL}" ]]; then
            echo "::error::COPR_CUSTOM_WEBHOOK_URL secret is not set"
            exit 1
          fi

          if [[ "${COPR_CUSTOM_WEBHOOK_URL}" != https://copr.fedorainfracloud.org/webhooks/custom/*/osac-cli/ ]]; then
            echo "::error::COPR_CUSTOM_WEBHOOK_URL must be the osac-cli custom webhook URL from Copr"
            exit 1
          fi

          # The custom webhook requires POST. It selects osac-cli from the URL
          # and triggers a rebuild using the SCM source configured in Copr.
          response=$(curl --silent --show-error --max-time 30 \
            --output response.txt \
            --write-out "%{http_code}" \
            --request POST \
            "${COPR_CUSTOM_WEBHOOK_URL}")

          echo "Copr responded with HTTP ${response}"

          if [[ "${response}" -lt 200 ]] || [[ "${response}" -ge 300 ]]; then
            echo "::error::Copr webhook returned HTTP ${response}"
            exit 1
          fi

          response_body=$(cat response.txt)
          if [[ ! "${response_body}" =~ ^[0-9]+$ ]]; then
            echo "::error::Copr returned HTTP ${response} without a numeric build ID"
            exit 1
          fi

          echo "Copr accepted the osac-cli rebuild request; verify the build in the Copr project"

      - name: Notify Copr about release tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/fulfillment-service/v')
        env:
          COPR_GITHUB_WEBHOOK_URL: ${{ secrets.COPR_GITHUB_WEBHOOK_URL }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [[ -z "${COPR_GITHUB_WEBHOOK_URL}" ]]; then
            echo "::error::COPR_GITHUB_WEBHOOK_URL secret is not set"
            exit 1
          fi

          if [[ "${COPR_GITHUB_WEBHOOK_URL}" != https://copr.fedorainfracloud.org/webhooks/github/*/osac-cli/ ]]; then
            echo "::error::COPR_GITHUB_WEBHOOK_URL must be the osac-cli GitHub integration URL from Copr"
            exit 1
          fi

          # Copr's GitHub integration builds the pushed tag only when the push
          # payload says ref_type=tag; without it Copr takes the branch/commit
          # path and silently matches nothing. The explicit package suffix
          # selects the osac-cli package regardless of the tag name.
          payload=$(jq -n \
            --arg ref "${GITHUB_REF}" \
            --arg after "${GITHUB_SHA}" \
            --arg clone_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" \
            --arg full_name "${GITHUB_REPOSITORY}" \
            --arg html_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            '{ref: $ref, ref_type: "tag", before: "0000000000000000000000000000000000000000", after: $after, created: true, deleted: false, forced: false, commits: [], repository: {clone_url: $clone_url, full_name: $full_name, html_url: $html_url}}')

          response=$(curl --silent --show-error --max-time 30 \
            --output response.txt \
            --write-out "%{http_code}" \
            --request POST \
            --header "Content-Type: application/json" \
            --header "X-GitHub-Event: push" \
            --data "${payload}" \
            "${COPR_GITHUB_WEBHOOK_URL}")

          echo "Copr responded with HTTP ${response}"

          if [[ "${response}" -lt 200 ]] || [[ "${response}" -ge 300 ]]; then
            echo "::error::Copr GitHub webhook returned HTTP ${response}"
            exit 1
          fi

          echo "Copr accepted the osac-cli release-tag build request; verify the build in the Copr project"

      - name: Submit Copr SCM build for the selected ref
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/release-')
        env:
          COPR_API_LOGIN: ${{ secrets.COPR_API_LOGIN }}
          COPR_API_TOKEN: ${{ secrets.COPR_API_TOKEN }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ -z "${COPR_API_LOGIN}" ]] || [[ -z "${COPR_API_TOKEN}" ]]; then
            echo "::error::COPR_API_LOGIN and COPR_API_TOKEN secrets are required to build ${GITHUB_REF_NAME}"
            exit 1
          fi

          # The webhook paths rebuild the committish configured on the Copr
          # package, which is main. Build this exact commit through the API so
          # release branches and dispatched refs get their own source.
          payload=$(jq -n \
            --arg clone_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" \
            --arg committish "${GITHUB_SHA}" \
            '{ownername: "@osac", projectname: "osac-cli", scm_type: "git", source_build_method: "make_srpm", clone_url: $clone_url, committish: $committish, subdirectory: "fulfillment-service", spec: ""}')

          response=$(curl --silent --show-error --max-time 30 \
            --output response.json \
            --write-out "%{http_code}" \
            --user "${COPR_API_LOGIN}:${COPR_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --request POST \
            --data "${payload}" \
            https://copr.fedorainfracloud.org/api_3/build/create/scm)

          echo "Copr responded with HTTP ${response} for ${GITHUB_REF_NAME} (${GITHUB_SHA})"

          if [[ "${response}" -lt 200 ]] || [[ "${response}" -ge 300 ]]; then
            cat response.json
            echo "::error::Copr API returned HTTP ${response}"
            exit 1
          fi

          build_id=$(jq -r '.id // empty' response.json)
          if [[ -z "${build_id}" ]]; then
            cat response.json
            echo "::error::Copr API did not return a build ID"
            exit 1
          fi

          echo "Copr build ${build_id} submitted for ${GITHUB_REF_NAME}"
