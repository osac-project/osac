name: Check image tags match submodules

on:
  pull_request:
    paths:
      - 'osac-installer/**'
      - '!osac-installer/OWNERS'
      - '!osac-installer/LICENSE'
      - '!osac-installer/**/*.md'
      - '!osac-installer/docs/**'

concurrency:
  group: "check-image-tags-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

jobs:
  check-image-tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          submodules: recursive
      - name: Verify image tags match submodule commits
        working-directory: osac-installer
        run: bash scripts/sync-image-tags.sh
