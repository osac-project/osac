---
# Input validation fires here, before any include_tasks dispatch.
# This is the single point of validation — provider roles must never be called
# directly via include_role from playbooks, bypassing this dispatcher.
# Provider storage operations are discovered dynamically (the role must exist as
# osac.templates.{provider}_storage), and protocols are validated by each provider
# role via meta/osac.yaml. Native CSI driver setup uses explicit provider mappings.

- name: Validate storage_provider_tiers is a non-empty list
  ansible.builtin.fail:
    msg: >-
      storage_provider_tiers must be a non-empty list of dicts with name, protocol, and provider.
      Got: {{ storage_provider_tiers | default('undefined') | to_json }}
  when: >-
    storage_provider_tiers is not defined
    or storage_provider_tiers | length == 0

- name: Validate each tier has required fields (name, protocol, provider)
  ansible.builtin.fail:
    msg: >-
      Each tier in storage_provider_tiers must have 'name', 'protocol', and 'provider' fields.
      Invalid tier: {{ item | to_json }}
  loop: "{{ storage_provider_tiers }}"
  when: >-
    item.name is not defined or item.name | length == 0
    or item.protocol is not defined or item.protocol | length == 0
    or item.provider is not defined or item.provider | length == 0

- name: Validate tier names are valid DNS labels (lowercase alphanumeric + hyphens, 1-63 chars)
  ansible.builtin.fail:
    msg: >-
      Tier name '{{ item.name }}' is not a valid DNS label.
      Must be 1-63 characters, lowercase alphanumeric and hyphens only,
      no leading or trailing hyphens.
  loop: "{{ storage_provider_tiers }}"
  when: item.name is not defined or not (item.name | regex_search('^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'))

# A tier name can be a valid 1-63 char DNS label on its own yet still be unusable: tiers
# with configured qos_limits get a derived qos_policy of '<name>-qos' below, which must
# ALSO be a valid (<=63 char) DNS label. Caught here, at the same point as the other
# tier-name checks, rather than surfacing later as a confusing failure on the derived
# value. The has-QoS-limits condition itself is computed once, below, and shared with
# the derivation step so the two can't drift out of sync.
- name: Compute QoS-enabled tier names (single source for length-guard and derivation)
  ansible.builtin.set_fact:
    _qos_enabled_tier_names: >-
      {% set _names = [] -%}
      {% for _tier in storage_provider_tiers -%}
      {% if _tier.qos_limits is defined and _tier.qos_limits.static_limits is defined and
            ((_tier.qos_limits.static_limits.max_reads_bw_mbps | default(0) | int) > 0 or
             (_tier.qos_limits.static_limits.max_writes_bw_mbps | default(0) | int) > 0) -%}
      {% set _ = _names.append(_tier.name) -%}
      {% endif -%}
      {% endfor -%}
      {{ _names }}

- name: Validate QoS-enabled tier names leave room for the derived '-qos' suffix
  ansible.builtin.fail:
    msg: >-
      Tier name '{{ item.name }}' is {{ item.name | length }} characters. Tiers with
      configured qos_limits get a derived qos_policy of '{{ item.name }}-qos', which must
      also be a valid DNS label (max 63 characters) — so tier names with QoS limits
      configured are capped at 59 characters (63 minus the 4-character '-qos' suffix).
  loop: "{{ storage_provider_tiers }}"
  loop_control:
    label: "{{ item.name }}"
  when: >-
    (item.name | length > 59) and (item.name in _qos_enabled_tier_names)

- name: Validate tier names are unique across the entire list
  ansible.builtin.fail:
    msg: >-
      storage_provider_tiers contains duplicate tier names.
      Names must be unique. Got: {{ storage_provider_tiers | map(attribute='name') | list | to_json }}
  when: >-
    (storage_provider_tiers | map(attribute='name') | list | unique | length)
    != (storage_provider_tiers | length)

- name: Validate each tier's provider name is a valid DNS label
  ansible.builtin.fail:
    msg: >-
      Invalid provider '{{ item.provider }}' in tier '{{ item.name }}'.
      Must be a valid DNS label (1-63 chars, lowercase alphanumeric and hyphens).
  loop: "{{ storage_provider_tiers }}"
  when: item.provider is not regex('^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$')

- name: Validate each tier's protocol is a non-empty string
  ansible.builtin.fail:
    msg: >-
      Invalid protocol '{{ item.protocol }}' in tier '{{ item.name }}'.
      Must be a non-empty string. Valid protocols are provider-specific
      (declared in each provider role's meta/osac.yaml capabilities).
  loop: "{{ storage_provider_tiers }}"
  when: item.protocol | length == 0

# qos_policy is entirely system-derived — any caller-supplied value is ignored and
# discarded, never inspected or preserved, consistent with how every other field not
# in this role's schema is treated (storage_provider_tiers has no elements:/options:
# schema, so unrecognized tier fields are already silently ignored rather than
# rejected; qos_policy previously broke that pattern by preserving a caller's value
# as-is). This is what guarantees every caller actually gets consistent naming, rather
# than merely being true by convention as long as no caller happens to set it.
#
# Written to a role-internal fact, not storage_provider_tiers itself: role/include_role
# params outrank set_fact for the lifetime of the role invocation, so reassigning
# storage_provider_tiers here would silently keep the caller-supplied, un-derived value.
#
# Only derived for tiers with a configured (non-zero) qos_limits — a tier with no
# read/write bandwidth limits is treated as "no QoS enforcement wanted" and ends up
# with no qos_policy at all, even if the caller supplied one. The Tier API always sends
# a qos_limits block (defaulting to zero when unconfigured), so zero-in-both-directions
# is the only "opt out" signal available without a dedicated field on the tier definition.
- name: Derive qos_policy for tiers with configured QoS limits, discarding any caller-supplied value
  ansible.builtin.set_fact:
    _storage_provider_tiers: >-
      {% set _tiers = [] -%}
      {% for _tier in storage_provider_tiers -%}
      {% set _tier_without_qos_policy = _tier | dict2items | rejectattr('key', 'equalto', 'qos_policy') | items2dict -%}
      {% set _ = _tiers.append(
           (_tier_without_qos_policy | combine({'qos_policy': _tier.name + '-qos'})) if (_tier.name in _qos_enabled_tier_names)
           else _tier_without_qos_policy
         ) -%}
      {% endfor -%}
      {{ _tiers }}

- name: Validate derived qos_policy is a valid DNS label
  ansible.builtin.fail:
    msg: >-
      Tier '{{ item.name }}' has an invalid qos_policy: '{{ item.qos_policy }}'.
      Must be a non-empty string matching DNS label rules (1-63 chars, lowercase alphanumeric and hyphens).
  loop: "{{ _storage_provider_tiers }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.qos_policy is defined
    - item.qos_policy is not regex('^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$')

- name: Validate tenant_name is set
  ansible.builtin.fail:
    msg: "tenant_name must be a non-empty string (set at play level from the Tenant CR or ComputeInstance tenant reference)."
  when: tenant_name is not defined or tenant_name | length == 0

- name: Validate tenant_namespace is set
  ansible.builtin.fail:
    msg: "tenant_namespace must be a non-empty string (set at play level from the Tenant CR or ComputeInstance tenant reference)."
  when: tenant_namespace is not defined or tenant_namespace | length == 0

- name: Validate storage_provider_action is supported
  ansible.builtin.fail:
    msg: >-
      Invalid storage_provider_action '{{ storage_provider_action }}'. Must be one of:
      setup, ensure_csi_driver, ensure_storage_class, teardown_cluster_storage, teardown_backend.
  when: storage_provider_action not in ['setup', 'ensure_csi_driver', 'ensure_storage_class', 'teardown_cluster_storage', 'teardown_backend']

- name: Validate the native CSI installer matrix before cluster mutation
  when: storage_provider_action == 'ensure_csi_driver'
  ansible.builtin.assert:
    that:
      - storage_provider_csi_driver_matrix.keys() | sort == ['lvms', 'netapp', 'vast']
      - >-
        storage_provider_csi_driver_matrix.netapp.protocols
        == {'block': 'csi.trident.netapp.io'}
      - >-
        storage_provider_csi_driver_matrix.netapp.installer == {
          'method': 'olm',
          'package': 'trident-operator',
          'channel': 'stable',
          'namespace': 'trident-operator',
          'operator_group': 'trident-operator-group',
          'install_plan_approval': 'Manual',
          'catalog_source': 'certified-operators',
          'catalog_namespace': 'openshift-marketplace',
          'trident_namespace': 'trident'
        }
      - >-
        storage_provider_csi_driver_matrix.vast.protocols == {
          'nfs': 'csi.vastdata.com',
          'block': 'block.csi.vastdata.com'
        }
      - >-
        storage_provider_csi_driver_matrix.vast.installer == {
          'method': 'olm',
          'namespace': 'vast-csi-system',
          'package': 'vast-csi-operator',
          'channel': 'stable',
          'install_plan_approval': 'Manual',
          'catalog_source': 'certified-operators',
          'catalog_namespace': 'openshift-marketplace'
        }
      - storage_provider_csi_driver_matrix.lvms == {}
    fail_msg: >-
      Native CSI installation settings are configured in defaults and cannot be supplied
      or overridden by a job caller.

- name: Extract unique providers from tier list
  ansible.builtin.set_fact:
    _unique_providers: "{{ _storage_provider_tiers | map(attribute='provider') | map('replace', '-', '_') | unique | sort | list }}"

- name: Set dispatch action
  ansible.builtin.set_fact:
    _dispatch_action: "{{ storage_provider_action }}"

- name: Dispatch to storage action task file
  ansible.builtin.include_tasks: "{{ storage_provider_action }}.yaml"
  when: storage_provider_action != 'ensure_csi_driver'

- name: Select providers for native CSI driver setup
  when: storage_provider_action == 'ensure_csi_driver'
  ansible.builtin.set_fact:
    _native_csi_driver_install_lock_holder: ""
    _native_csi_driver_install_lock_acquired: false
    _native_csi_driver_install_needed: false
    _native_csi_driver_unknown_providers: >-
      {{ _unique_providers | difference(storage_provider_csi_driver_matrix.keys() | list) }}
    _native_csi_driver_netapp_protocols: >-
      {{ storage_provider_csi_driver_matrix.netapp.protocols.keys() | list }}
    _native_csi_driver_vast_protocols_supported: >-
      {{ storage_provider_csi_driver_matrix.vast.protocols.keys() | list }}
    _native_csi_driver_netapp_tiers: >-
      {{ _storage_provider_tiers | selectattr('provider', 'equalto', 'netapp') | list }}
    _native_csi_driver_vast_tiers: >-
      {{ _storage_provider_tiers | selectattr('provider', 'equalto', 'vast') | list }}
    _native_csi_driver_vast_protocols: >-
      {{ _storage_provider_tiers
         | selectattr('provider', 'equalto', 'vast')
         | map(attribute='protocol') | unique | sort | list }}

- name: Skip providers without a native CSI setup handler
  when:
    - storage_provider_action == 'ensure_csi_driver'
    - _native_csi_driver_unknown_providers | length > 0
  ansible.builtin.debug:
    msg: >-
      Skipping provider-native CSI installation for provider(s) without a native CSI setup handler:
      {{ _native_csi_driver_unknown_providers | join(', ') }}.

- name: Validate the selected native CSI provider matrix
  when: storage_provider_action == 'ensure_csi_driver'
  vars:
    _native_csi_driver_provider_configs:
      - name: NetApp
        tiers: "{{ _native_csi_driver_netapp_tiers }}"
        protocols: "{{ _native_csi_driver_netapp_protocols }}"
        installer_method: "{{ storage_provider_csi_driver_matrix.netapp.installer.method }}"
      - name: VAST
        tiers: "{{ _native_csi_driver_vast_tiers }}"
        protocols: "{{ _native_csi_driver_vast_protocols_supported }}"
        installer_method: "{{ storage_provider_csi_driver_matrix.vast.installer.method }}"
  block:
    - name: Reject unsupported native CSI provider protocols before cluster mutation
      when:
        - item.tiers | length > 0
        - item.tiers | rejectattr('protocol', 'in', item.protocols) | list | length > 0
      ansible.builtin.fail:
        msg: >-
          {{ item.name }} native CSI setup supports protocol(s)
          {{ item.protocols | join(', ') }}. Unsupported tier(s):
          {{ item.tiers | rejectattr('protocol', 'in', item.protocols) | map(attribute='name') | join(', ') }}.
      loop: "{{ _native_csi_driver_provider_configs }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Reject unsupported native CSI installer methods
      when:
        - item.tiers | length > 0
        - item.installer_method != 'olm'
      ansible.builtin.fail:
        msg: "{{ item.name }} CSI installer method '{{ item.installer_method }}' is not supported."
      loop: "{{ _native_csi_driver_provider_configs }}"
      loop_control:
        label: "{{ item.name }}"

- name: Build the required native CSI driver names
  when: storage_provider_action == 'ensure_csi_driver'
  ansible.builtin.set_fact:
    _native_csi_driver_required_names: >-
      {% set names = [] -%}
      {% if _native_csi_driver_netapp_tiers | length > 0 -%}
      {% set _ = names.append(storage_provider_csi_driver_matrix.netapp.protocols.block) -%}
      {% endif -%}
      {% for protocol in _native_csi_driver_vast_protocols -%}
      {% set _ = names.append(storage_provider_csi_driver_matrix.vast.protocols[protocol]) -%}
      {% endfor -%}
      {{ names | unique | sort | list }}

- name: Require an explicit target kubeconfig for native CSI drivers
  when:
    - storage_provider_action == 'ensure_csi_driver'
    - _native_csi_driver_required_names | length > 0
  ansible.builtin.assert:
    that:
      - storage_provider_target_kubeconfig | default('', true) | length > 0
    fail_msg: >-
      storage_provider_target_kubeconfig is required when native CSI drivers
      must be checked or installed.

- name: Check required native CSI drivers before acquiring the install lock
  when:
    - storage_provider_action == 'ensure_csi_driver'
    - _native_csi_driver_required_names | length > 0
  kubernetes.core.k8s_info:
    api_version: storage.k8s.io/v1
    kind: CSIDriver
    name: "{{ item }}"
    kubeconfig: "{{ storage_provider_target_kubeconfig | default(omit) }}"
    validate_certs: "{{ false if (storage_provider_target_kubeconfig_insecure | default(false) | bool) else omit }}"
  loop: "{{ _native_csi_driver_required_names }}"
  loop_control:
    label: "{{ item }}"
  register: _native_csi_driver_precheck

- name: Determine whether any required native CSI driver is missing
  when: storage_provider_action == 'ensure_csi_driver'
  ansible.builtin.set_fact:
    _native_csi_driver_install_needed: >-
      {{ (_native_csi_driver_precheck.results | default([])
          | selectattr('resources', 'equalto', []) | list | length) > 0 }}

- name: Log that all required native CSI drivers are already present
  when:
    - storage_provider_action == 'ensure_csi_driver'
    - _native_csi_driver_required_names | length > 0
    - not (_native_csi_driver_install_needed | bool)
  ansible.builtin.debug:
    msg: >-
      Required native CSI drivers are already present:
      {{ _native_csi_driver_required_names | join(', ') }}. No install lock or OLM changes are needed.

# AAP can run Stage 2 and ComputeInstance JIT jobs concurrently against the
# same VMaaS cluster. Serialize the check-create-install sequence so both jobs
# cannot observe a missing CSIDriver and reconcile the same OLM Subscription.
# The shared AAP-side Lease intentionally serializes all target clusters.
- name: Set native CSI driver install lock holder identity
  when:
    - storage_provider_action == 'ensure_csi_driver'
    - _native_csi_driver_install_needed | bool
  ansible.builtin.set_fact:
    _native_csi_driver_install_lock_holder: >-
      native-csi-driver-install-{{ awx_job_id | default('unknown') }}-{{
        lookup('community.general.random_string', special=false, numbers=false, upper=false)
      }}
    _native_csi_driver_install_lock_acquired: false

- name: Acquire native CSI driver install lock
  when:
    - storage_provider_action == 'ensure_csi_driver'
    - _native_csi_driver_install_lock_holder | default('') | length > 0
  ansible.builtin.include_role:
    name: osac.service.lease
  vars:
    lease_state: present
    lease_name: "provider-native-csi-install-lock"
    lease_holder: "{{ _native_csi_driver_install_lock_holder }}"
    lease_retries: 240
    lease_delay: 5

- name: Mark native CSI driver install lock as acquired
  when:
    - storage_provider_action == 'ensure_csi_driver'
    - _native_csi_driver_install_lock_holder | default('') | length > 0
  ansible.builtin.set_fact:
    _native_csi_driver_install_lock_acquired: true

- name: Ensure native Trident CSI driver on the selected VMaaS cluster
  when:
    - storage_provider_action == 'ensure_csi_driver'
    - _native_csi_driver_install_needed | bool
    - _native_csi_driver_netapp_tiers | length > 0
  module_defaults:
    kubernetes.core.k8s:
      kubeconfig: "{{ storage_provider_target_kubeconfig | default(omit) }}"
      validate_certs: "{{ false if (storage_provider_target_kubeconfig_insecure | default(false) | bool) else omit }}"
    kubernetes.core.k8s_info:
      kubeconfig: "{{ storage_provider_target_kubeconfig | default(omit) }}"
      validate_certs: "{{ false if (storage_provider_target_kubeconfig_insecure | default(false) | bool) else omit }}"
  vars:
    storage_provider_olm_subscription_name: "{{ storage_provider_csi_driver_matrix.netapp.installer.package }}"
    storage_provider_olm_subscription_namespace: "{{ storage_provider_csi_driver_matrix.netapp.installer.namespace }}"
    storage_provider_olm_subscription_channel: "{{ storage_provider_csi_driver_matrix.netapp.installer.channel }}"
    storage_provider_olm_subscription_install_plan_approval: "{{ storage_provider_csi_driver_matrix.netapp.installer.install_plan_approval }}"
    storage_provider_olm_subscription_package: "{{ storage_provider_csi_driver_matrix.netapp.installer.package }}"
    storage_provider_olm_subscription_catalog_source: "{{ storage_provider_csi_driver_matrix.netapp.installer.catalog_source }}"
    storage_provider_olm_subscription_catalog_namespace: "{{ storage_provider_csi_driver_matrix.netapp.installer.catalog_namespace }}"
    storage_provider_olm_subscription_installer: "{{ storage_provider_csi_driver_matrix.netapp.installer }}"
    storage_provider_olm_subscription_provider: netapp
  block:
    - name: Check for the native Trident CSI driver
      kubernetes.core.k8s_info:
        api_version: storage.k8s.io/v1
        kind: CSIDriver
        name: "{{ storage_provider_csi_driver_matrix.netapp.protocols.block }}"
      register: _netapp_trident_driver_check

    - name: Log that the existing Trident driver is left unchanged
      when: _netapp_trident_driver_check.resources | length > 0
      ansible.builtin.debug:
        msg: >-
          Trident CSIDriver {{ storage_provider_csi_driver_matrix.netapp.protocols.block }}
          is already present; leaving its operator Subscription and version unchanged.

    - name: Install Trident through OLM when the driver is absent
      when: _netapp_trident_driver_check.resources | length == 0
      vars:
        _netapp_trident_test_install_override_active: >-
          {{ lookup('env', 'OSAC_AAP_ENABLE_TEST_INSTALL_OVERRIDES', default='false') | bool
             and storage_provider_netapp_trident_install_override is defined }}
      block:
        - name: Ensure the Trident OLM namespace exists
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: "{{ storage_provider_csi_driver_matrix.netapp.installer.namespace }}"

        # The certified Trident CSV supports AllNamespaces only. Isolate its
        # Subscription from unrelated Manual InstallPlans in openshift-operators.
        - name: Ensure the Trident AllNamespaces OperatorGroup exists
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: operators.coreos.com/v1
              kind: OperatorGroup
              metadata:
                name: "{{ storage_provider_csi_driver_matrix.netapp.installer.operator_group }}"
                namespace: "{{ storage_provider_csi_driver_matrix.netapp.installer.namespace }}"
              spec:
                targetNamespaces: []

        - name: Ensure the Trident operand namespace exists
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: "{{ storage_provider_csi_driver_matrix.netapp.installer.trident_namespace }}"

        - name: Check the certified operator catalog before creating the Trident Subscription
          when: >-
            not (_netapp_trident_test_install_override_active | bool)
          kubernetes.core.k8s_info:
            api_version: operators.coreos.com/v1alpha1
            kind: CatalogSource
            name: "{{ storage_provider_csi_driver_matrix.netapp.installer.catalog_source }}"
            namespace: "{{ storage_provider_csi_driver_matrix.netapp.installer.catalog_namespace }}"
          register: _netapp_trident_catalog

        - name: Require the certified operator catalog before installing Trident
          when:
            - >-
              not (_netapp_trident_test_install_override_active | bool)
            - _netapp_trident_catalog.resources | length == 0
          ansible.builtin.fail:
            msg: >-
              CatalogSource '{{ storage_provider_csi_driver_matrix.netapp.installer.catalog_source }}'
              was not found in namespace
              '{{ storage_provider_csi_driver_matrix.netapp.installer.catalog_namespace }}'
              on the VMaaS target cluster.

        - name: Invoke the Trident OLM installer override when configured
          when: _netapp_trident_test_install_override_active | bool
          ansible.builtin.include_role:
            name: "{{ storage_provider_netapp_trident_install_override.name }}"
            tasks_from: "{{ storage_provider_netapp_trident_install_override.tasks_from }}"
          vars:
            native_csi_driver_install_tiers: "{{ _native_csi_driver_netapp_tiers }}"
            native_csi_driver_names:
              - "{{ storage_provider_csi_driver_matrix.netapp.protocols.block }}"
            native_csi_driver_package: "{{ storage_provider_csi_driver_matrix.netapp.installer.package }}"
            native_csi_driver_channel: "{{ storage_provider_csi_driver_matrix.netapp.installer.channel }}"
            native_csi_driver_install_plan_approval: "{{ storage_provider_csi_driver_matrix.netapp.installer.install_plan_approval }}"

        - name: Install the Trident OLM operator from the stable channel when no test override is active
          tags: [provider_csi_driver_install]
          when: not (_netapp_trident_test_install_override_active | bool)
          block:
            - name: Ensure the Trident OLM Subscription uses the stable certified channel
              ansible.builtin.include_tasks:
                file: reconcile_olm_subscription.yaml
                apply:
                  tags: [provider_csi_driver_install]
              tags: [provider_csi_driver_install]

            - name: Resolve and approve the initial Trident operator InstallPlan
              ansible.builtin.include_tasks:
                file: install_pinned_olm_operator.yaml
                apply:
                  tags: [provider_csi_driver_install]
              vars:
                storage_provider_olm_operator_subscription: "{{ storage_provider_csi_driver_matrix.netapp.installer.package }}"
                storage_provider_olm_operator_namespace: "{{ storage_provider_csi_driver_matrix.netapp.installer.namespace }}"
                storage_provider_olm_operator_package: "{{ storage_provider_csi_driver_matrix.netapp.installer.package }}"

            - name: Select the Trident operand image from the OLM-selected bundle
              ansible.builtin.set_fact:
                _netapp_trident_operand_images: >-
                  {{ _storage_provider_olm_csv.resources[0].spec.relatedImages | default([])
                     | selectattr('name', 'equalto', 'trident')
                     | map(attribute='image') | list }}

            - name: Require a digest-pinned Trident operand image in the selected OLM bundle
              ansible.builtin.assert:
                that:
                  - _netapp_trident_operand_images | length == 1
                  - "'@sha256:' in _netapp_trident_operand_images[0]"
                fail_msg: >-
                  The installed Trident CSV must provide exactly one digest-pinned related image
                  named 'trident'.

            - name: Wait for the TridentOrchestrator CRD
              kubernetes.core.k8s_info:
                api_version: apiextensions.k8s.io/v1
                kind: CustomResourceDefinition
                name: tridentorchestrators.trident.netapp.io
              register: _netapp_trident_orchestrator_crd
              retries: 30
              delay: 10
              until: _netapp_trident_orchestrator_crd.resources | length > 0

            - name: Ensure the TridentOrchestrator uses the operator bundle's default operand
              kubernetes.core.k8s:
                state: present
                definition:
                  apiVersion: trident.netapp.io/v1
                  kind: TridentOrchestrator
                  metadata:
                    name: trident
                    namespace: "{{ storage_provider_csi_driver_matrix.netapp.installer.namespace }}"
                  spec:
                    debug: false
                    imagePullPolicy: IfNotPresent
                    nodePrep: []
                    namespace: "{{ storage_provider_csi_driver_matrix.netapp.installer.trident_namespace }}"
                    silenceAutosupport: true
                    tridentImage: "{{ _netapp_trident_operand_images[0] }}"

            - name: Wait for the TridentOrchestrator to report Installed
              kubernetes.core.k8s_info:
                api_version: trident.netapp.io/v1
                kind: TridentOrchestrator
                name: trident
                namespace: "{{ storage_provider_csi_driver_matrix.netapp.installer.namespace }}"
              register: _netapp_trident_orchestrator
              retries: 30
              delay: 10
              until: >-
                _netapp_trident_orchestrator.resources | length > 0
                and _netapp_trident_orchestrator.resources[0].status.status | default('') == 'Installed'

    - name: Wait for native Trident CSI registration
      when:
        - storage_provider_action == 'ensure_csi_driver'
        - _native_csi_driver_netapp_tiers | default([]) | length > 0
        - _netapp_trident_driver_check is defined
        - _netapp_trident_driver_check.resources | length == 0
      kubernetes.core.k8s_info:
        api_version: storage.k8s.io/v1
        kind: CSIDriver
        name: "{{ storage_provider_csi_driver_matrix.netapp.protocols.block }}"
      register: _netapp_trident_driver_ready
      retries: 30
      delay: 10
      until: _netapp_trident_driver_ready.resources | length > 0

    - name: Wait for the TridentBackendConfig API
      when:
        - storage_provider_action == 'ensure_csi_driver'
        - _native_csi_driver_netapp_tiers | default([]) | length > 0
        - _netapp_trident_driver_check is defined
        - _netapp_trident_driver_check.resources | length == 0
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: tridentbackendconfigs.trident.netapp.io
      register: _netapp_trident_backend_config_api
      retries: 30
      delay: 10
      until: _netapp_trident_backend_config_api.resources | length > 0

    - name: Wait for the Trident controller Deployment
      when:
        - storage_provider_action == 'ensure_csi_driver'
        - _native_csi_driver_netapp_tiers | default([]) | length > 0
        - _netapp_trident_driver_check is defined
        - _netapp_trident_driver_check.resources | length == 0
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: trident-controller
        namespace: "{{ storage_provider_csi_driver_matrix.netapp.installer.trident_namespace }}"
      register: _netapp_trident_controller
      retries: 30
      delay: 10
      until: >-
        _netapp_trident_controller.resources | length > 0
        and (_netapp_trident_controller.resources[0].status.availableReplicas | default(0) | int) > 0

    - name: Wait for the Trident node DaemonSet on all eligible nodes
      when:
        - storage_provider_action == 'ensure_csi_driver'
        - _native_csi_driver_netapp_tiers | default([]) | length > 0
        - _netapp_trident_driver_check is defined
        - _netapp_trident_driver_check.resources | length == 0
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: DaemonSet
        name: trident-node-linux
        namespace: "{{ storage_provider_csi_driver_matrix.netapp.installer.trident_namespace }}"
      register: _netapp_trident_node
      retries: 30
      delay: 10
      until: >-
        _netapp_trident_node.resources | length > 0
        and (_netapp_trident_node.resources[0].status.desiredNumberScheduled | default(0) | int) > 0
        and (_netapp_trident_node.resources[0].status.numberReady | default(0) | int)
            >= (_netapp_trident_node.resources[0].status.desiredNumberScheduled | default(0) | int)

- name: Ensure VAST CSI drivers required by the resolved tiers on the selected cluster
  when:
    - storage_provider_action == 'ensure_csi_driver'
    - _native_csi_driver_install_needed | bool
    - _native_csi_driver_vast_protocols | length > 0
  module_defaults:
    kubernetes.core.k8s:
      kubeconfig: "{{ storage_provider_target_kubeconfig | default(omit) }}"
      validate_certs: "{{ false if (storage_provider_target_kubeconfig_insecure | default(false) | bool) else omit }}"
    kubernetes.core.k8s_info:
      kubeconfig: "{{ storage_provider_target_kubeconfig | default(omit) }}"
      validate_certs: "{{ false if (storage_provider_target_kubeconfig_insecure | default(false) | bool) else omit }}"
  block:
    - name: Include the VAST driver ensure tasks
      ansible.builtin.include_role:
        name: osac.templates.vast_storage
        tasks_from: ensure_csi_operator.yaml
        apply:
          tags: [provider_csi_driver_install]
      vars:
        _provider_tiers: "{{ _native_csi_driver_vast_tiers }}"
        _vast_required_protocols: "{{ _native_csi_driver_vast_protocols }}"
        vast_storage_csi_provisioner_map: "{{ storage_provider_csi_driver_matrix.vast.protocols }}"
        vast_storage_csi_operator_namespace: "{{ storage_provider_csi_driver_matrix.vast.installer.namespace }}"
        vast_storage_csi_operator_package: "{{ storage_provider_csi_driver_matrix.vast.installer.package }}"
        vast_storage_csi_operator_channel: "{{ storage_provider_csi_driver_matrix.vast.installer.channel }}"
        vast_storage_csi_operator_approval: "{{ storage_provider_csi_driver_matrix.vast.installer.install_plan_approval }}"
        vast_storage_csi_operator_catalog_source: "{{ storage_provider_csi_driver_matrix.vast.installer.catalog_source }}"
        vast_storage_csi_operator_catalog_namespace: "{{ storage_provider_csi_driver_matrix.vast.installer.catalog_namespace }}"
        storage_provider_olm_subscription_name: "{{ storage_provider_csi_driver_matrix.vast.installer.package }}"
        storage_provider_olm_subscription_namespace: "{{ storage_provider_csi_driver_matrix.vast.installer.namespace }}"
        storage_provider_olm_subscription_channel: "{{ storage_provider_csi_driver_matrix.vast.installer.channel }}"
        storage_provider_olm_subscription_install_plan_approval: "{{ storage_provider_csi_driver_matrix.vast.installer.install_plan_approval }}"
        storage_provider_olm_subscription_package: "{{ storage_provider_csi_driver_matrix.vast.installer.package }}"
        storage_provider_olm_subscription_catalog_source: "{{ storage_provider_csi_driver_matrix.vast.installer.catalog_source }}"
        storage_provider_olm_subscription_catalog_namespace: "{{ storage_provider_csi_driver_matrix.vast.installer.catalog_namespace }}"
        storage_provider_olm_subscription_installer: "{{ storage_provider_csi_driver_matrix.vast.installer }}"
        storage_provider_olm_subscription_provider: vast

# On task failure, the lease owner reference lets Kubernetes remove the lock
# when the AAP job pod exits. Successful runs release it immediately here.
- name: Release native CSI driver install lock
  when:
    - storage_provider_action == 'ensure_csi_driver'
    - _native_csi_driver_install_lock_acquired | default(false)
  ansible.builtin.include_role:
    name: osac.service.lease
  vars:
    lease_state: absent
    lease_name: "provider-native-csi-install-lock"
    lease_holder: "{{ _native_csi_driver_install_lock_holder }}"
