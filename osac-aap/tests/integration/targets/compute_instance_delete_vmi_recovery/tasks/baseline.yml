              name: "{{ compute_instance_name }}"
            - api: kubevirt.io/v1
              kind: VirtualMachineInstance
              name: "{{ compute_instance_name }}"
            - api: v1
              kind: Pod
              name: >-
                virt-launcher-{{
                compute_instance_name }}-alien
            - api: v1
              kind: Service
              name: >-
                {{ compute_instance_name
                }}-load-balancer
            - api: cdi.kubevirt.io/v1beta1
              kind: DataVolume
              name: >-
                {{ compute_instance_name
                }}-root-disk
            - api: v1
              kind: Secret
              name: >-
                {{ compute_instance_name
                }}-cloud-init
          failed_when: false


# ============================================================
# Scenario 7 — No-timestamp refusal: VMI stuck but has no
# deletionTimestamp — recovery refuses BEFORE pod lookup,
# regardless of launcher state.  Three sub-cases verify
# refusal with no launcher, a Failed launcher, and a
# Running launcher.
# ============================================================
- name: >-
    Scenario 7: No-timestamp refusal (three launcher
    states)
  hosts: localhost
  gather_facts: false
  vars:
    compute_instance_name: test-vmi-s7
    compute_instance_target_namespace: test-subnet
    guest_os_family: linux
    compute_instance:
      spec: {}
    ocp_virt_vm_graceful_wait_retries: 2
