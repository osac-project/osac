syntax = "proto3";

package osac.private.v1;

import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "osac/private/v1/disk_image_type.proto";

message DiskImagesListRequest {
  optional int32 offset = 1;
  optional int32 limit = 2;
  optional string filter = 3;
  optional string order = 4;
}

message DiskImagesListResponse {
  int32 size = 1;
  int32 total = 2;
  repeated DiskImage items = 3;
}

message DiskImagesGetRequest {
  string id = 1;
}

message DiskImagesGetResponse {
  DiskImage object = 1;
}

message DiskImagesCreateRequest {
  DiskImage object = 1;
}

message DiskImagesCreateResponse {
  DiskImage object = 1;
}

message DiskImagesUpdateRequest {
  DiskImage object = 1;
  google.protobuf.FieldMask update_mask = 2;

  // Lock enables optimistic locking. When set to true, the server verifies that the current version of the object
  // matches the value of the metadata.version field of the submitted object. If they differ the update will be
  // rejected. This is useful to prevent lost updates when multiple clients are modifying the same object concurrently.
  bool lock = 3;
}

message DiskImagesUpdateResponse {
  DiskImage object = 1;
}

message DiskImagesDeleteRequest {
  string id = 1;
}

message DiskImagesDeleteResponse {}

message DiskImagesSignalRequest {
  string id = 1;
}

message DiskImagesSignalResponse {}

service DiskImages {
  rpc List(DiskImagesListRequest) returns (DiskImagesListResponse) {
    option (google.api.http) = {get: "/api/private/v1/disk_images"};
  }
  rpc Get(DiskImagesGetRequest) returns (DiskImagesGetResponse) {
    option (google.api.http) = {
      get: "/api/private/v1/disk_images/{id}"
      response_body: "object"
    };
  }
  rpc Create(DiskImagesCreateRequest) returns (DiskImagesCreateResponse) {
    option (google.api.http) = {
      post: "/api/private/v1/disk_images"
      body: "object"
      response_body: "object"
    };
  }
  rpc Update(DiskImagesUpdateRequest) returns (DiskImagesUpdateResponse) {
    option (google.api.http) = {
      patch: "/api/private/v1/disk_images/{object.id}"
      body: "object"
      response_body: "object"
    };
  }
  rpc Delete(DiskImagesDeleteRequest) returns (DiskImagesDeleteResponse) {
    option (google.api.http) = {delete: "/api/private/v1/disk_images/{id}"};
  }

  // Indicates that something changed in the object or the system that may require reconciling the object.
  rpc Signal(DiskImagesSignalRequest) returns (DiskImagesSignalResponse) {}
}
