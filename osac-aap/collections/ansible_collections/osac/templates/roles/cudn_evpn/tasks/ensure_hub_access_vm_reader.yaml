---
- name: Grant hub-access read-only VirtualMachine access in the workload namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: osac-hub-access-vm-reader
        namespace: "{{ hub_access_vm_reader_namespace }}"
        annotations:
          osac.openshift.io/tenant: "{{ tenant_id }}"
          osac.openshift.io/owner-reference: "Subnet/{{ hub_access_vm_reader_namespace }}"
      rules:
        - apiGroups:
            - kubevirt.io
          resources:
            - virtualmachines
          verbs:
            - list

- name: Bind hub-access to the workload namespace VirtualMachine reader
  kubernetes.core.k8s:
    kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: osac-hub-access-vm-reader
        namespace: "{{ hub_access_vm_reader_namespace }}"
        annotations:
          osac.openshift.io/tenant: "{{ tenant_id }}"
          osac.openshift.io/owner-reference: "Subnet/{{ hub_access_vm_reader_namespace }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: osac-hub-access-vm-reader
      subjects:
        - kind: ServiceAccount
          name: hub-access
          namespace: "{{ subnet.metadata.namespace }}"
