{{- /* Grants the metering ServiceAccount read access to KafkaUser
     secrets in the Kafka cluster namespace. The initContainer uses this
     to fetch SASL credentials at startup. TLS trust uses the shared
     ca-bundle ConfigMap, not the Strimzi cluster CA. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "osac-metering.fullname" . }}-read-kafka-secrets
  namespace: {{ include "osac-metering.kafkaClusterNamespace" . }}
  labels:
    {{- include "osac-metering.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ include "osac-metering.kafkaSaslSecretName" . }}
      {{- if .Values.echoAdapter.enabled }}
      - osac-metering-echo-adapter
      {{- end }}
      {{- if include "osac-metering.m360AdapterEnabled" . }}
      - osac-metering-m360-adapter
      {{- end }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "osac-metering.fullname" . }}-read-kafka-secrets
  namespace: {{ include "osac-metering.kafkaClusterNamespace" . }}
  labels:
    {{- include "osac-metering.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "osac-metering.fullname" . }}-read-kafka-secrets
subjects:
  - kind: ServiceAccount
    name: {{ include "osac-metering.fullname" . }}
    namespace: {{ .Release.Namespace }}
