---
# Query DHCP leases for a subnet and match a server port MAC address
# to find the DHCP-assigned IP. Generic for any resource type that
# receives IPs via fabric DHCP (bare-metal instances, CaaS agents).
#
# Input: dhcp_lease_query dict with subnet_ref (Subnet UUID) and port_mac.
# Output: discovered_ip_address fact set to the matched IP.
#
# Netris runs Kea DHCP on softgate nodes, one instance per VPC (VRF).
# This task resolves Subnet → V-Net → VPC, then queries the Kea
# control socket on each softgate until the MAC is found.

- name: Extract DHCP lease query parameters
  ansible.builtin.set_fact:
    _dq_subnet_ref: "{{ dhcp_lease_query.subnet_ref }}"
    _dq_port_mac: "{{ dhcp_lease_query.port_mac | lower }}"

- name: Validate port MAC format
  ansible.builtin.assert:
    that:
      - _dq_port_mac is regex('^([0-9a-f]{2}:){5}[0-9a-f]{2}$')
    fail_msg: "Invalid MAC address format: '{{ _dq_port_mac }}'"

- name: Look up Subnet CR by UUID label
  kubernetes.core.k8s_info:
    api_version: osac.openshift.io/v1alpha1
    kind: Subnet
    label_selectors:
      - "osac.openshift.io/subnet-uuid={{ _dq_subnet_ref }}"
  register: _dq_subnet_lookup

- name: Fail if Subnet CR not found
  ansible.builtin.fail:
    msg: >-
      Subnet with UUID '{{ _dq_subnet_ref }}' not found.
      Ensure the Subnet has been created before querying DHCP leases.
  when: _dq_subnet_lookup.resources | length == 0

- name: Set subnet name
  ansible.builtin.set_fact:
    _dq_subnet_name: "{{ _dq_subnet_lookup.resources[0].metadata.name }}"

- name: Display DHCP lease query parameters
  ansible.builtin.debug:
    msg:
      - "Querying DHCP lease for MAC '{{ _dq_port_mac }}'"
      - "Subnet: {{ _dq_subnet_name }} (UUID: {{ _dq_subnet_ref }})"

- name: Ensure Netris auth
  ansible.builtin.include_role:
    name: netris.controller.auth
  when: netris_session_cookie is not defined

- name: Get V-Net list
  ansible.builtin.uri:
    url: "{{ netris_controller_url }}/api/v2/vnet"
    method: GET
    headers:
      Cookie: "connect.sid={{ netris_session_cookie }}"
    return_content: true
    status_code: 200
    timeout: "{{ netris_timeout | default(30) }}"
    validate_certs: "{{ netris_validate_certs | default(true) }}"
  register: _dq_vnet_list_resp
  no_log: true

- name: Find V-Net by subnet name
  ansible.builtin.set_fact:
    _dq_target_vnet: >-
      {{ (_dq_vnet_list_resp.json.data | default([]))
         | selectattr('name', 'equalto', _dq_subnet_name)
         | list | first | default(none) }}

- name: Fail if V-Net not found
  ansible.builtin.fail:
    msg: >-
      V-Net '{{ _dq_subnet_name }}' not found in Netris controller.
      Ensure the Subnet has been provisioned before querying DHCP leases.
  when: _dq_target_vnet is none

- name: Set VPC ID for VRF lookup
  ansible.builtin.set_fact:
    _dq_vpc_id: "{{ _dq_target_vnet.vpc.id }}"

- name: Get softgate inventory from Netris
  ansible.builtin.uri:
    url: "{{ netris_controller_url }}/api/v2/hw?type=softgate"
    method: GET
    headers:
      Cookie: "connect.sid={{ netris_session_cookie }}"
    return_content: true
    status_code: 200
    timeout: "{{ netris_timeout | default(30) }}"
    validate_certs: "{{ netris_validate_certs | default(true) }}"
  register: _dq_softgate_resp

- name: Fail if no softgates found
  ansible.builtin.fail:
    msg: "No softgates found in Netris inventory."
  when: _dq_softgate_resp.json.data | default([]) | length == 0

- name: Query Kea DHCP for MAC on each softgate
  ansible.builtin.shell:
    cmd: >-
      ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5
      -i {{ netris_softgate_ssh_key | default('/root/.ssh/id_rsa') }}
      root@{{ item.mgmtAddress }}
      'echo "{\"command\": \"lease4-get-by-hw-address\", \"arguments\": {\"hw-address\": \"{{ _dq_port_mac }}\"}}"
      | socat - UNIX-CONNECT:/tmp/kea4-Vrf_{{ _dq_vpc_id }}-ctrl-socket 2>/dev/null || true'
  loop: "{{ _dq_softgate_resp.json.data }}"
  loop_control:
    label: "{{ item.name }}"
  register: _dq_kea_results
  changed_when: false
  failed_when: false
  no_log: true

- name: Initialize matched IP
  ansible.builtin.set_fact:
    _dq_matched_ip: ""

- name: Extract IP from first successful Kea response
  ansible.builtin.set_fact:
    _dq_matched_ip: >-
      {{ (item.stdout | from_json).arguments.leases[0]['ip-address'] }}
  loop: "{{ _dq_kea_results.results }}"
  when:
    - _dq_matched_ip | trim | length == 0
    - item.stdout | default('') | trim | length > 0
    - (item.stdout | from_json).result | default(1) == 0
    - ((item.stdout | from_json).arguments.leases | default([])) | length > 0
  loop_control:
    label: "{{ item.item.name | default('unknown') }}"
  no_log: true

- name: Fail if no DHCP lease matches
  ansible.builtin.fail:
    msg: >-
      No DHCP lease found for MAC '{{ _dq_port_mac }}' on V-Net
      '{{ _dq_subnet_name }}' (VPC ID: {{ _dq_vpc_id }}).
      Ensure the host has booted and received a DHCP lease.
      Checked {{ _dq_kea_results.results | length }} softgate(s).
  when: _dq_matched_ip is none or _dq_matched_ip | trim | length == 0

- name: Set discovered IP address
  ansible.builtin.set_fact:
    discovered_ip_address: "{{ _dq_matched_ip | trim }}"

- name: Display DHCP lease query result
  ansible.builtin.debug:
    msg: >-
      DHCP lease found: MAC '{{ _dq_port_mac }}' → IP '{{ discovered_ip_address }}'
      on V-Net '{{ _dq_subnet_name }}'
