---
# Publishes a sanitized osac_error for a failed contract task, then re-fails.
# Callers set _osac_error_label (plain words) and may set
# _osac_error_retryable_default when the task's failures are transient.

- name: Publish the sanitized contract error
  ansible.builtin.include_tasks: _fail_task.yaml
  vars:
    _osac_error_message: >-
      {{ ansible_failed_result.msg
         | default('The Netris ' ~ _osac_error_label ~ ' failed') }}
    _osac_error_retryable: >-
      {{ ansible_failed_result.retryable
         | default(_osac_error_retryable_default | default(true)) }}
  when: _osac_contract | default(false) | bool

- name: Fail the task after the rescue
  ansible.builtin.fail:
    msg: >-
      {{ _osac_error_message | default(ansible_failed_result.msg
         | default('Netris ' ~ _osac_error_label ~ ' failed')) }}
