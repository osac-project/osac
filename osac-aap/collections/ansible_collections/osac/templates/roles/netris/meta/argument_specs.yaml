---
argument_specs:
  create_virtual_network:
    short_description: Create the VPC and IPAM allocation of a VirtualNetwork
    options:
      osac_job_vars:
        type: dict
        required: true
        description: >-
          Network manager task input (resource, virtual_network, ipam,
          network_type); its content is checked by tasks/_input.yaml.

  delete_virtual_network:
    short_description: Delete the IPAM allocation and VPC of a VirtualNetwork
    options:
      osac_job_vars:
        type: dict
        required: true
        description: >-
          Network manager task input (resource, virtual_network, ipam,
          network_type); its content is checked by tasks/_input.yaml.

  create_subnet:
    short_description: Create the IPAM subnet and V-Net of a Subnet
    options:
      osac_job_vars:
        type: dict
        required: true
        description: >-
          Network manager task input (resource, virtual_network, ipam,
          network_type); its content is checked by tasks/_input.yaml.

  delete_subnet:
    short_description: Delete the V-Net and IPAM subnet of a Subnet
    options:
      osac_job_vars:
        type: dict
        required: true
        description: >-
          Network manager task input (resource, virtual_network, ipam,
          network_type); its content is checked by tasks/_input.yaml.

  create_security_group:
    short_description: No-op, the Kubernetes manager enforces SecurityGroups
    options:
      osac_job_vars:
        type: dict
        required: true
        description: >-
          Network manager task input (resource, virtual_network, ipam,
          network_type); its content is checked by tasks/_input.yaml.

  delete_security_group:
    short_description: No-op, the Kubernetes manager enforces SecurityGroups
    options:
      osac_job_vars:
        type: dict
        required: true
        description: >-
          Network manager task input (resource, virtual_network, ipam,
          network_type); its content is checked by tasks/_input.yaml.

  apply_network_attachment:
    short_description: Move the fabric ports of a physical attachment, no-op for overlay
    options:
      osac_job_vars:
        type: dict
        required: true
        description: >-
          Network manager task input (resource, target, network_attachment,
          virtual_network, subnet, ipam, network_type); its content is checked
          by tasks/_input.yaml and the netris_attachment_plan filter.

  delete_network_attachment:
    short_description: Move the fabric ports of a physical attachment back, no-op for overlay
    options:
      osac_job_vars:
        type: dict
        required: true
        description: >-
          Network manager task input (resource, target, network_attachment,
          virtual_network, subnet, ipam, network_type); its content is checked
          by tasks/_input.yaml and the netris_attachment_plan filter.

  query_dhcp_lease:
    short_description: Read the DHCP lease of the interface MAC of a physical attachment
    options:
      osac_job_vars:
        type: dict
        required: true
        description: >-
          Network manager task input (resource, target, network_attachment,
          virtual_network, subnet, ipam, network_type); its content is checked
          by tasks/_input.yaml and the netris_attachment_plan filter.

  create_fabric_domain:
    short_description: Create the Server Cluster of a FabricDomain
    options:
      osac_job_vars:
        type: dict
        required: true
        description: >-
          Network manager task input (resource, virtual_network, network_type);
          its content is checked by tasks/_input.yaml.

  delete_fabric_domain:
    short_description: Delete the Server Cluster of a FabricDomain
    options:
      osac_job_vars:
        type: dict
        required: true
        description: >-
          Network manager task input (resource, virtual_network, network_type);
          its content is checked by tasks/_input.yaml.

  reserve_cluster_ingress_ip:
    short_description: Final error, cluster ingress is not supported yet
    options:
      osac_job_vars:
        type: dict
        required: true
        description: >-
          Network manager task input (resource, virtual_network, network_type);
          its content is checked by tasks/_input.yaml.

  release_cluster_ingress_ip:
    short_description: No-op, nothing is reserved on Netris
    options:
      osac_job_vars:
        type: dict
        required: true
        description: >-
          Network manager task input (resource, virtual_network, network_type);
          its content is checked by tasks/_input.yaml.

  create_external_ip_pool:
    short_description: Create the IPAM allocation of an ExternalIPPool
    options:
      osac_job_vars:
        type: dict
        required: true
        description: >-
          Network manager task input (resource and the parents the task needs);
          its content is checked by tasks/_input.yaml.

  delete_external_ip_pool:
    short_description: Delete the IPAM allocation of an ExternalIPPool
    options:
      osac_job_vars:
        type: dict
        required: true
        description: >-
          Network manager task input (resource and the parents the task needs);
          its content is checked by tasks/_input.yaml.

  create_external_ip:
