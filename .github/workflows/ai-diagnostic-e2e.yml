---
# workflow_run only fires for runs that happened in the repo that OWNS the
# listener file, so this repo needs its own trigger -- but the actual logic
# (resolving the PR, running the diagnosis, posting the status/comment)
# lives exactly once in osac-test-infra's own copy of this same-named
# workflow, invoked here via workflow_call rather than duplicated
# script-for-script. See that file's header comment for the full
# explanation, including why no `with:` inputs are needed here at all
# (github.event/github.repository inside the called workflow reflect this
# repo's own triggering event, same mechanism the e2e-*-full-install.yml
# reusable workflows already rely on for their own cross-repo calls).
#
# MERGE-ORDER DEPENDENCY: osac-test-infra's ai-diagnostic-e2e.yml must
# declare `workflow_call` in its own `on:` on main BEFORE this file merges
# -- `uses:` below is pinned to @main, and GitHub validates a called
# reusable workflow's trigger declaration at run time.
name: AI diagnostic (E2E fork PR failures)

on:
  workflow_run:  # zizmor: ignore[dangerous-triggers] -- delegates entirely to a trusted, pinned reusable workflow; no fork code touched here either.
    workflows:
      - E2E CaaS Full Install
      - E2E BMaaS Full Install
      - E2E VMaaS Full Install
    types: [completed]

permissions: {}

jobs:
  # Union of what osac-test-infra's resolve/diagnose/comment-success jobs
  # each declare internally -- a caller's grant here is a ceiling on what
  # the called workflow's own jobs can use, so this must cover all three
  # even though any single triggering run only ever exercises one or two
  # of them.
  diagnose:
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    uses: osac-project/osac-test-infra/.github/workflows/ai-diagnostic-e2e.yml@main
    secrets:
      AI_DIAGNOSTIC_TOKEN: ${{ secrets.AI_DIAGNOSTIC_TOKEN }}
