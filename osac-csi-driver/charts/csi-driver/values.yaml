namespace: osac-csi

driverName: csi.osac.openshift.io

image:
  repository: ghcr.io/osac-project/osac-csi-driver
  tag: main  # PLACEHOLDER -- overwritten at release time
  pullPolicy: Always

controller:
  replicas: 1
  clusterID: ""
  vendorSockets: ""
  # Connection to the OSAC fulfillment-service (runs on the hub / control plane cluster).
  # The CSI driver runs on tenant clusters and needs credentials that the
  # fulfillment-service recognises. AAP provisions a Secret with a bearer token
  # onto each tenant cluster during cluster setup.
  fulfillment:
    # gRPC endpoint of the fulfillment-service (e.g. "fulfillment-api.osac.svc:8000").
    # Leave empty to use in-memory stubs.
    endpoint: ""
    # Secret containing a bearer token for fulfillment-service authentication.
    # The Secret must exist in the release namespace before the chart is installed.
    credentials:
      # Name of the Kubernetes Secret (required when endpoint is set).
      secretName: ""
      # Key inside the Secret that holds the bearer token.
      key: "token"
    tls:
      # Skip server certificate verification (use for self-signed certs).
      insecureSkipVerify: false
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  leaderElection: true

node:
  privileged: true
  vendorSockets: ""
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

sidecars:
  provisioner:
    image:
      repository: registry.k8s.io/sig-storage/csi-provisioner
      tag: v5.1.0
  attacher:
    image:
      repository: registry.k8s.io/sig-storage/csi-attacher
      tag: v4.7.0
  registrar:
    image:
      repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
      tag: v2.12.0

serviceAccount:
  controller:
    create: true
    name: ""
  node:
    create: true
    name: ""

vendors:
  trident:
    enabled: false
    image:
      repository: registry.connect.redhat.com/netapp/trident
      tag: 25.10.0
    config:
      certsSecret: ""
    node:
      socketPath: /var/lib/kubelet/plugins/csi.trident.netapp.io

  vast:
    enabled: false
    image:
      repository: docker.io/vastdataorg/csi
      tag: v2.6.5
    config:
      vmsHost: ""
      vipPoolName: ""
      nfsExport: /k8s
      viewPolicy: default
      verifySsl: "true"
      credentialsSecret: ""
    node:
      socketPath: /var/lib/kubelet/plugins/csi.vast.vastdata.com

  pure:
    enabled: false
    image:
      repository: docker.io/portworx/px-pure-csi-driver
      tag: "26.2.0"
    config:
      credentialsSecret: ""
      clusterUuid: ""
    node:
      socketPath: /var/lib/kubelet/plugins/csi.pure.purestorage.com
      sanType: "ISCSI"
      clusterName: ""
