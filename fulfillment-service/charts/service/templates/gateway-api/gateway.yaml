{{- if eq .Values.ingress.driver "gatewayapi" }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  namespace: {{ .Values.ingress.gatewayapi.gatewayNamespace }}
  name: {{ .Values.ingress.gatewayapi.gatewayName }}
spec:
  gatewayClassName: {{ .Values.ingress.gatewayapi.gatewayClassName }}
  listeners:
  {{- range $l := list (dict "name" "external" "hostname" (include "fulfillment-api.hostname" $)) (dict "name" "internal" "hostname" (include "fulfillment-internal-api.hostname" $)) (dict "name" "ext-svc" "hostname" "fulfillment-api") (dict "name" "int-svc" "hostname" "fulfillment-internal-api") }}
  - name: {{ $l.name }}
    hostname: {{ $l.hostname | quote }}
    port: 443
    protocol: HTTPS
    tls:
      mode: Terminate
      certificateRefs:
      - name: fulfillment-api-tls
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            kubernetes.io/metadata.name: {{ $.Release.Namespace }}
  {{- end }}
{{- end }}
