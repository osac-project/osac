name: Typecheck

# Carried over as-is from osac-ui's own standalone repo at merge time, only
# relocated (osac-ui/-prefixed paths) and path-scoped so it runs only on
# osac-ui changes -- not yet wired into this repo's own CI conventions.
# That's a follow-up, not this move.
on:
  pull_request:
    paths:
      - 'osac-ui/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          run_install: false
          package_json_file: osac-ui/package.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: osac-ui/package.json
          cache: pnpm
          cache-dependency-path: osac-ui/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: osac-ui
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        working-directory: osac-ui
        run: pnpm run typecheck
