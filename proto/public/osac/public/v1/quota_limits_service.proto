syntax = "proto3";

package osac.public.v1;

import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "osac/public/v1/quota_limit_type.proto";

message QuotaLimitsListRequest {
  // Index of the first result. If not specified the default value will be zero.
  optional int32 offset = 1;

  // Maximum number of results to be returned by the server. When not specified all the results will be returned. Note
  // that there may not be enough results to return, and that the server may decide, for performance reasons, to return
  // less results than requested.
  optional int32 limit = 2;

  // Filter criteria.
  //
  // The value of this parameter is a [CEL](https://cel.dev) expression used to select which objects to return. The
  // built-in `this` variable refers to the object being tested and `now` refers to the current date and time. If the
  // expression evaluates to `true` the object is included in the results. For example, to retrieve all the limits of
  // one dimension:
  //
  //     this.spec.dimension == "compute.vcpus"
  //
  // If this isn't provided, or if the value is empty, then all the limits that the user has permission to see will be
  // returned. Not all CEL constructs are currently supported for implementation reasons; see the filter documentation
  // (docs/FILTER.md) for the full details.
  optional string filter = 3;

  // Order criteria.
  //
  // The syntax of this parameter is similar to the syntax of the _order by_ clause of a SQL statement, but using the
  // names of the attributes of the limit instead of the names of the columns of a table. For example, in order to sort
  // the limits descending by creation time the value should be:
  //
  //     metadata.created_at desc
  //
  // If the parameter isn't provided, or if the value is empty, then the order of the results is undefined.
  optional string order = 4;
}

message QuotaLimitsListResponse {
  // Actual number of items returned. Note that this may be smaller than the value requested in the `limit` parameter
  // of the request if there are not enough items, or if the system decides that returning that number of items isn't
  // feasible or convenient for performance reasons.
  int32 size = 1;

  // Total number of items of the collection that match the search criteria, regardless of the number of results
  // requested with the `limit` parameter.
  int32 total = 2;

  // List of results.
  repeated QuotaLimit items = 3;
}

message QuotaLimitsGetRequest {
  string id = 1;
}

message QuotaLimitsGetResponse {
  QuotaLimit object = 1;
}

message QuotaLimitsCreateRequest {
  QuotaLimit object = 1;
}

message QuotaLimitsCreateResponse {
  QuotaLimit object = 1;
}

message QuotaLimitsUpdateRequest {
  QuotaLimit object = 1;
  google.protobuf.FieldMask update_mask = 2;

  // Lock enables optimistic locking. When set to true, the server verifies that the current version of the object
  // matches the value of the metadata.version field of the submitted object. If they differ the update will be
  // rejected. This is useful to prevent lost updates when multiple clients are modifying the same object concurrently.
  bool lock = 3;
}

message QuotaLimitsUpdateResponse {
  QuotaLimit object = 1;
}

message QuotaLimitsDeleteRequest {
  string id = 1;
}

message QuotaLimitsDeleteResponse {}

message QuotaLimitsListDefaultsRequest {
  // Index of the first result. If not specified the default value will be zero.
  optional int32 offset = 1;

  // Maximum number of results to be returned by the server. When not specified all the results will be returned. Note
  // that there may not be enough results to return, and that the server may decide, for performance reasons, to return
  // less results than requested.
  optional int32 limit = 2;

  // Filter criteria.
  //
  // The value of this parameter is a [CEL](https://cel.dev) expression used to select which objects to return. The
  // built-in `this` variable refers to the object being tested and `now` refers to the current date and time. If the
  // expression evaluates to `true` the object is included in the results. For example, to retrieve all the defaults of
  // one dimension:
  //
  //     this.spec.dimension == "compute.vcpus"
  //
  // If this isn't provided, or if the value is empty, then all the default limits will be returned. Not all CEL
  // constructs are currently supported for implementation reasons; see the filter documentation (docs/FILTER.md) for
  // the full details.
  optional string filter = 3;
}

message QuotaLimitsListDefaultsResponse {
  // Actual number of items returned. Note that this may be smaller than the value requested in the `limit` parameter
  // of the request if there are not enough items, or if the system decides that returning that number of items isn't
  // feasible or convenient for performance reasons.
  int32 size = 1;

  // Total number of items of the collection that match the search criteria, regardless of the number of results
  // requested with the `limit` parameter.
  int32 total = 2;

  // List of results.
  repeated QuotaDefaultLimit items = 3;
}

message QuotaLimitsGetDefaultRequest {
  string id = 1;
}

message QuotaLimitsGetDefaultResponse {
  QuotaDefaultLimit object = 1;
}

message QuotaLimitsSetDefaultRequest {
  QuotaDefaultLimit object = 1;
}

message QuotaLimitsSetDefaultResponse {
  QuotaDefaultLimit object = 1;
}

message QuotaLimitsClearDefaultRequest {
  string id = 1;
}

message QuotaLimitsClearDefaultResponse {}

// Manages quota limits: tenant overrides, project limits, and the defaults for all tenants.
service QuotaLimits {
  // Retrieves the list of limits, tenant overrides and project limits alike.
  rpc List(QuotaLimitsListRequest) returns (QuotaLimitsListResponse) {
    option (google.api.http) = {get: "/api/fulfillment/v1/quota_limits"};
  }

  // Retrieves the details of one specific limit.
  rpc Get(QuotaLimitsGetRequest) returns (QuotaLimitsGetResponse) {
    option (google.api.http) = {
      get: "/api/fulfillment/v1/quota_limits/{id}"
      response_body: "object"
    };
  }

  // Creates a new limit. A limit with no project is a tenant override, which only a Cloud Provider
  // Admin may set; a limit with a project is a project limit, which a Tenant Admin may set.
  rpc Create(QuotaLimitsCreateRequest) returns (QuotaLimitsCreateResponse) {
    option (google.api.http) = {
      post: "/api/fulfillment/v1/quota_limits"
      body: "object"
      response_body: "object"
    };
  }

  // Updates an existing limit. Only the value can change; the dimension, tenant, and project are
  // immutable.
  rpc Update(QuotaLimitsUpdateRequest) returns (QuotaLimitsUpdateResponse) {
    option (google.api.http) = {
      patch: "/api/fulfillment/v1/quota_limits/{object.id}"
      body: "object"
      response_body: "object"
    };
  }

  // Deletes a limit, so its dimension falls back to the next scope in the resolution order.
  rpc Delete(QuotaLimitsDeleteRequest) returns (QuotaLimitsDeleteResponse) {
    option (google.api.http) = {delete: "/api/fulfillment/v1/quota_limits/{id}"};
  }

  // Retrieves the list of default limits.
  rpc ListDefaults(QuotaLimitsListDefaultsRequest) returns (QuotaLimitsListDefaultsResponse) {
    option (google.api.http) = {get: "/api/fulfillment/v1/quota_default_limits"};
  }

  // Retrieves the details of one specific default limit.
  rpc GetDefault(QuotaLimitsGetDefaultRequest) returns (QuotaLimitsGetDefaultResponse) {
    option (google.api.http) = {
      get: "/api/fulfillment/v1/quota_default_limits/{id}"
      response_body: "object"
    };
  }

  // Sets the default limit of a dimension for all tenants. A dimension that already has a default
  // has its value replaced. Only a Cloud Provider Admin may set a default.
  rpc SetDefault(QuotaLimitsSetDefaultRequest) returns (QuotaLimitsSetDefaultResponse) {
    option (google.api.http) = {
      post: "/api/fulfillment/v1/quota_default_limits"
      body: "object"
      response_body: "object"
    };
  }

  // Clears the default limit of a dimension, so the dimension has limit 0 in every tenant without
  // an override.
  rpc ClearDefault(QuotaLimitsClearDefaultRequest) returns (QuotaLimitsClearDefaultResponse) {
    option (google.api.http) = {delete: "/api/fulfillment/v1/quota_default_limits/{id}"};
  }
}
