apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: osac-operator-clusterorder-rbac-webhook
  annotations:
    cert-manager.io/inject-ca-from: osac-devel/osac-operator-clusterorder-rbac
webhooks:
- name: clusterorder-admin-rolebinding.osac.openshift.io
  admissionReviewVersions:
  - v1
  sideEffects: None
  matchPolicy: Equivalent
  failurePolicy: Fail
  timeoutSeconds: 5
  clientConfig:
    service:
      name: osac-operator-clusterorder-rbac
      namespace: osac-devel
      path: /validate-clusterorder-admin-rolebinding
      port: 443
  rules:
  - apiGroups:
    - rbac.authorization.k8s.io
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - rolebindings
    scope: Namespaced
  matchConditions:
  - name: osac-serviceaccounts-in-manager-namespace
    expression: request.userInfo.username.startsWith("system:serviceaccount:osac-devel:")
