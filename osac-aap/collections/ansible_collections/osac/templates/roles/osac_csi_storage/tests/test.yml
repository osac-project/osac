---
# Test playbook for osac.templates.osac_csi_driver / osac_csi_storage role.
#
# Scenarios:
#   Test 1 (hub-cluster path rejected when _remote_kubeconfig is absent):
#     ansible-playbook ... -e test_hub_path_rejected=true
#
#   Test 1b (input validation for tenant_name and _provider_tiers):
#     ansible-playbook ... -e test_input_validation=true
#
#   Test 3 (setup action sets required storage_provider_tenant_config):
#     ansible-playbook ... -e test_setup_contract=true
#
#   Test 4 (storage_provider dispatcher integration for osac-csi / osac-csi-driver):
#     ansible-playbook ... -e test_dispatcher_integration=true
#
#   Test 5 (StorageClass entry and vendor derivation):
#     ansible-playbook ... -e test_sc_derivation=true
#
#   Test 6 (Helm values rendered for the driver install, with and without
#   osac_csi_driver_extra_values; renders through the role's _render_driver_values
#   task file and publishes the result in the fact _osac_csi_driver_helm_values):
#     ansible-playbook ... -e test_install_driver_values=true

# ──────────────────────────────────────────────────────────────
# Test 1: Hub-cluster path is rejected (no _remote_kubeconfig)
# ──────────────────────────────────────────────────────────────
- name: Test osac_csi_driver -- hub path rejected (no remote kubeconfig)
  hosts: localhost
  gather_facts: false

  vars:
    tenant_name: tenant-beta
    tenant_namespace: osac-tenants
    _provider_tiers:
      - name: default
        protocol: nfs
        provider: osac_csi_driver

  tasks:
    - name: Run hub-path-rejected test
      when: test_hub_path_rejected | default(false) | bool
      block:
        - name: Call ensure_storage_class without _remote_kubeconfig (expected to fail)
          ansible.builtin.include_role:
            name: osac.templates.osac_csi_driver
            tasks_from: ensure_storage_class

        - name: This should not be reached
          ansible.builtin.fail:
            msg: "Role should have failed when _remote_kubeconfig is absent"

      rescue:
        - name: Verify failure message mentions kubeconfig requirement
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('admin_kubeconfig')
            fail_msg: "Expected failure about admin_kubeconfig, got: {{ ansible_failed_result.msg }}"
            success_msg: "Hub-path correctly rejected with actionable error"

        # ignore_errors on include_role does not cover failures of the role's own tasks,
        # so capture the expected failure with block/rescue instead.
        - name: Call teardown_cluster_storage without _remote_kubeconfig (expected to fail)
          block:
            - name: Include teardown_cluster_storage
              ansible.builtin.include_role:
                name: osac.templates.osac_csi_driver
                tasks_from: teardown_cluster_storage
          rescue:
            - name: Capture the expected teardown failure
              ansible.builtin.set_fact:
                teardown_result: "{{ ansible_failed_result }}"

        - name: Verify teardown failure message mentions kubeconfig requirement
          ansible.builtin.assert:
            that:
              - teardown_result.msg is search('admin_kubeconfig')
            fail_msg: "Expected teardown failure about admin_kubeconfig, got: {{ teardown_result.msg | default('') }}"
            success_msg: "Teardown hub-path correctly rejected with actionable error"


# ──────────────────────────────────────────────────────────────
# Test 1b: Input Validation
# ──────────────────────────────────────────────────────────────
- name: Test osac_csi_driver -- input validation
  hosts: localhost
  gather_facts: false

  vars:
    _remote_kubeconfig: hack/tmp/fake.kubeconfig

  tasks:
    - name: Run input validation tests
      when: test_input_validation | default(false) | bool
      block:
        # ignore_errors on include_role does not cover failures of the role's own tasks,
        # so capture each expected failure with block/rescue instead.
        - name: Call ensure_storage_class with invalid tenant_name
          block:
            - name: Include ensure_storage_class with invalid tenant_name
              ansible.builtin.include_role:
                name: osac.templates.osac_csi_driver
                tasks_from: ensure_storage_class
              vars:
                tenant_name: "Invalid_Name!"
                _provider_tiers:
                  - name: default
                    protocol: nfs
                    provider: osac_csi_driver
          rescue:
            - name: Capture the expected invalid tenant_name failure
              ansible.builtin.set_fact:
                name_result: "{{ ansible_failed_result }}"

        - name: Call ensure_storage_class with empty _provider_tiers
          block:
            - name: Include ensure_storage_class with empty _provider_tiers
              ansible.builtin.include_role:
                name: osac.templates.osac_csi_driver
                tasks_from: ensure_storage_class
              vars:
                tenant_name: valid-name
                _provider_tiers: []
          rescue:
            - name: Capture the expected empty _provider_tiers failure
              ansible.builtin.set_fact:
                tiers_result: "{{ ansible_failed_result }}"

        - name: Verify input validation failures
          ansible.builtin.assert:
            that:
              - name_result.msg is search('not a valid DNS label')
              - tiers_result.msg is search('_provider_tiers must be provided')
            success_msg: "Input validation successfully guarded invalid inputs"

# ──────────────────────────────────────────────────────────────
# Test 3: Setup contract (sets storage_provider_tenant_config)
# ──────────────────────────────────────────────────────────────
- name: Test osac_csi_driver -- setup contract
  hosts: localhost
  gather_facts: false

  vars:
    tenant_name: tenant-delta
    tenant_namespace: osac-tenants

  tasks:
    - name: Run setup action directly
      when: test_setup_contract | default(false) | bool
      block:
        - name: Include setup action
          ansible.builtin.include_role:
            name: osac.templates.osac_csi_driver
            tasks_from: setup

        - name: Verify storage_provider_tenant_config is populated
          ansible.builtin.assert:
            that:
              - storage_provider_tenant_config is defined
              - storage_provider_tenant_config is mapping
            success_msg: "Setup contract satisfied: storage_provider_tenant_config is defined"

# ──────────────────────────────────────────────────────────────
# Test 4: Dispatcher integration (storage_provider dispatch)
# ──────────────────────────────────────────────────────────────
- name: Test osac_csi_driver -- storage_provider dispatcher integration
  hosts: localhost
  gather_facts: false

  vars:
    tenant_name: tenant-epsilon
    tenant_namespace: osac-tenants

  tasks:
    - name: Run dispatcher integration test for both osac-csi and osac_csi_driver
      when: test_dispatcher_integration | default(false) | bool
      block:
        # backend_id is mandatory on every tier for every provider family: the
        # storage_provider dispatcher hard-fails tiers without one and uses
        # (provider, backend_id) as the dispatch key. The OSAC CSI driver family
        # writes no backend-scoped hub Secret, but its tiers still reference a
        # fulfillment-service StorageBackend, so they still carry its id.
        - name: Test storage_provider setup with provider osac-csi
          ansible.builtin.include_role:
            name: osac.service.storage_provider
          vars:
            storage_provider_action: setup
            storage_provider_tiers:
              - name: gold
                protocol: nfs
                provider: osac-csi
                backend_id: be-csi-gold

        - name: Test storage_provider setup with provider osac_csi_driver
          ansible.builtin.include_role:
            name: osac.service.storage_provider
          vars:
            storage_provider_action: setup
            storage_provider_tiers:
              # Hyphenated: the dispatcher validates provider as a DNS label and
              # normalizes hyphens to underscores when resolving the role name
              # (osac-csi-driver -> osac.templates.osac_csi_driver_storage).
              - name: silver
                protocol: block
                provider: osac-csi-driver
                backend_id: be-csi-silver

        - name: Verify dispatcher keyed the merged tenant configs by backend_id
          ansible.builtin.assert:
            that:
              - storage_provider_tenant_configs is defined
              - storage_provider_tenant_configs is mapping
              - "'be-csi-silver' in storage_provider_tenant_configs"
            fail_msg: >-
              storage_provider_tenant_configs must be keyed by backend_id, got:
              {{ storage_provider_tenant_configs | default('undefined') | list }}
            success_msg: "storage_provider dispatched to osac_csi role and keyed configs by backend_id"

# ──────────────────────────────────────────────────────────────
# Test 5: StorageClass name and parameter derivation
# ──────────────────────────────────────────────────────────────
- name: Test osac_csi_driver -- StorageClass derivation
  hosts: localhost
  gather_facts: false

  vars:
    tenant_name: tenant-zeta
    _provider_tiers:
      - name: default
        protocol: nfs
        provider: osac-csi
      - name: fast
        protocol: block
        provider: osac-csi

  tasks:
    - name: Test SC entry derivation
      when: test_sc_derivation | default(false) | bool
      block:
        - name: Derive expected SC entries
          ansible.builtin.set_fact:
            _derived: >-
              {% set entries = [] -%}
              {% for tier in _provider_tiers -%}
              {% set _ = entries.append({'name': 'osac-' ~ tenant_name ~ '-' ~ tier.name, 'tier': tier.name, 'protocol': tier.protocol}) -%}
              {% endfor -%}
              {{ entries }}

        - name: Assert derived entries are correct
          ansible.builtin.assert:
            that:
              - _derived | length == 2
              - _derived[0].name == 'osac-tenant-zeta-default'
              - _derived[1].name == 'osac-tenant-zeta-fast'
              - _derived[0].protocol == 'nfs'
              - _derived[1].protocol == 'block'
            success_msg: "StorageClass entries derived correctly"

        - name: Derive vendor sockets
          ansible.builtin.set_fact:
            osac_csi_driver_vendor_node_socket_paths:
              vast: /var/lib/kubelet/plugins/vast.csi.com
              netapp: /var/lib/kubelet/plugins/trident.csi.com
              pure-flashblade: /var/lib/kubelet/plugins/pure.csi.com/csi.sock
              pure-flasharray: /var/lib/kubelet/plugins/pure.csi.com/csi.sock
            _derived_sockets: >-
              {% set _pairs = [] -%}
              {% for _k, _v in osac_csi_driver_vendor_node_socket_paths.items() -%}
              {% set _sock = _v if _v.endswith('.sock') else (_v ~ '/csi.sock') -%}
              {% set _ = _pairs.append(_k ~ '=' ~ _sock) -%}
              {% endfor -%}
              {{ _pairs | sort | join(',') }}

        - name: Assert vendor sockets derived correctly
          ansible.builtin.assert:
            that:
              - >-
                _derived_sockets ==
                'netapp=/var/lib/kubelet/plugins/trident.csi.com/csi.sock,' ~
                'pure-flasharray=/var/lib/kubelet/plugins/pure.csi.com/csi.sock,' ~
                'pure-flashblade=/var/lib/kubelet/plugins/pure.csi.com/csi.sock,' ~
                'vast=/var/lib/kubelet/plugins/vast.csi.com/csi.sock'
            success_msg: "Vendor sockets derived correctly"

# ──────────────────────────────────────────────────────────────
# Test 6: Helm values rendered for the driver install
#
# Renders through the role's _render_driver_values task file, which the
# install entry point includes before its Helm task, and reads the result from
# the fact _osac_csi_driver_helm_values. Needs no cluster. Extra values are
# passed only through include_role vars, the way a caller supplies them.
# ──────────────────────────────────────────────────────────────
- name: Test osac_csi_storage -- driver Helm values rendering
  hosts: localhost
  gather_facts: false

  vars:
    _values_fulfillment_endpoint: fulfillment-api.test.example:443
    _values_issuer_url: https://keycloak.test.example/realms/osac

  tasks:
    - name: Run driver Helm values tests
      when: test_install_driver_values | default(false) | bool
      block:
        # Case A: no extra values. The rendered values are exactly what the role's
        # Helm deployment used before extra values existed, with the role defaults.
        - name: Render driver values with the default (empty) extra values
          ansible.builtin.include_role:
            name: osac.templates.osac_csi_storage
            tasks_from: _render_driver_values
          vars:
            fulfillment_endpoint: "{{ _values_fulfillment_endpoint }}"
            fulfillment_issuer_url: "{{ _values_issuer_url }}"

        - name: Assert the default render equals the literal values dict
          ansible.builtin.assert:
            that:
              - _osac_csi_driver_helm_values is mapping
              - _osac_csi_driver_helm_values == _expected_default_values
              - _osac_csi_driver_helm_values.controller.fulfillment.tls.insecureSkipVerify is sameas false
            fail_msg: >-
              Default render differs from the expected values.
              Got: {{ _osac_csi_driver_helm_values | default('undefined') | to_json }}
            success_msg: "Default render matches the literal values dict"
          vars:
            _expected_default_values:
              driverName: csi.osac.openshift.io
              namespace: osac-csi
              controller:
                fulfillment:
                  endpoint: fulfillment-api.test.example:443
                  issuerUrl: https://keycloak.test.example/realms/osac
                  credentials:
                    secretName: osac-csi-driver-credentials
                    clientIdKey: client-id
                    clientSecretKey: client-secret
                  tls:
                    insecureSkipVerify: false
              node:
                vendorSockets: >-
                  netapp=/var/lib/kubelet/plugins/csi.trident.netapp.io/csi.sock,pure=/var/lib/kubelet/plugins/csi.pure.purestorage.com/csi.sock,vast=/var/lib/kubelet/plugins/csi.vast.vastdata.com/csi.sock

        # Case B: nested extra values merge into the computed values; the siblings of
        # the merged keys stay and the new keys appear.
        - name: Render driver values with nested extra values
          ansible.builtin.include_role:
            name: osac.templates.osac_csi_storage
            tasks_from: _render_driver_values
          vars:
            fulfillment_endpoint: "{{ _values_fulfillment_endpoint }}"
            fulfillment_issuer_url: "{{ _values_issuer_url }}"
            osac_csi_driver_extra_values:
              controller:
                fulfillment:
                  tls:
                    caSecretName: test-ca
                replicas: 2

        - name: Assert extra values merged without dropping siblings
          ansible.builtin.assert:
            that:
              - _osac_csi_driver_helm_values.controller.fulfillment.tls.caSecretName == 'test-ca'
              - _osac_csi_driver_helm_values.controller.fulfillment.tls.insecureSkipVerify is sameas false
              - _osac_csi_driver_helm_values.controller.replicas == 2
              - _osac_csi_driver_helm_values.controller.fulfillment.endpoint == _values_fulfillment_endpoint
              - _osac_csi_driver_helm_values.controller.fulfillment.issuerUrl == _values_issuer_url
              - _osac_csi_driver_helm_values.controller.fulfillment.credentials.secretName == 'osac-csi-driver-credentials'
              - _osac_csi_driver_helm_values.driverName == 'csi.osac.openshift.io'
              - _osac_csi_driver_helm_values.node.vendorSockets is search('^netapp=')
            fail_msg: >-
              Extra values were not merged as expected.
              Got: {{ _osac_csi_driver_helm_values | default('undefined') | to_json }}
            success_msg: "Nested extra values merged and siblings were preserved"

        # Case C: guest-node install. fulfillment_endpoint and fulfillment_issuer_url
        # are unset (optional for install_driver); the render must succeed and leave
        # both keys out of the values instead of failing on an undefined variable.
        - name: Render driver values with endpoint and issuer URL unset (guest node mode)
          ansible.builtin.include_role:
            name: osac.templates.osac_csi_storage
            tasks_from: _render_driver_values
          vars:
            osac_csi_driver_extra_values:
              node:
                mode: guestNode

        - name: Assert the render omits endpoint and issuerUrl and keeps the rest
          ansible.builtin.assert:
            that:
              - _osac_csi_driver_helm_values is mapping
              - _osac_csi_driver_helm_values.controller.fulfillment.endpoint is not defined
              - _osac_csi_driver_helm_values.controller.fulfillment.issuerUrl is not defined
              - _osac_csi_driver_helm_values.controller.fulfillment.credentials.secretName == 'osac-csi-driver-credentials'
              - _osac_csi_driver_helm_values.controller.fulfillment.credentials.clientIdKey == 'client-id'
              - _osac_csi_driver_helm_values.controller.fulfillment.credentials.clientSecretKey == 'client-secret'
              - _osac_csi_driver_helm_values.controller.fulfillment.tls.insecureSkipVerify is sameas false
              - _osac_csi_driver_helm_values.node.mode == 'guestNode'
              - _osac_csi_driver_helm_values.node.vendorSockets is search('^netapp=')
              - _osac_csi_driver_helm_values.driverName == 'csi.osac.openshift.io'
            fail_msg: >-
              Guest-node render is wrong.
              Got: {{ _osac_csi_driver_helm_values | default('undefined') | to_json }}
            success_msg: "Render without endpoint and issuer URL omits both keys"
