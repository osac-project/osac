---
- name: Read primary Subnet reference for networking validation
  ansible.builtin.set_fact:
    _placement_subnet_ref: >-
      {{ (compute_instance.spec.networkAttachments | default([])
          | first | default({})).get('subnetRef', '') }}

- name: Validate explicit Subnet placement
  when: _placement_subnet_ref | length > 0
  block:
    - name: Read requested Subnet from the management API
      kubernetes.core.k8s_info:
        api_version: osac.openshift.io/v1alpha1
        kind: Subnet
        namespace: "{{ compute_instance.metadata.namespace }}"
        name: "{{ _placement_subnet_ref }}"
      register: _placement_subnet_lookup

    - name: Read Subnet eligibility and readiness
      ansible.builtin.set_fact:
        _placement_subnet: "{{ _placement_subnet_lookup.resources | first | default({}) }}"

    - name: Determine whether networking is permanently unsupported
      ansible.builtin.set_fact:
        _placement_unsupported: >-
          {{ (_placement_subnet.get('status', {}).get('computeInstanceSupported', none) is sameas false)
             or (_placement_subnet.get('metadata', {}).get('annotations', {}).get(
               'osac.openshift.io/compute-instance-supported', '') == 'false')
             or (_placement_subnet.get('metadata', {}).get('annotations', {}).get(
               'osac.openshift.io/skip-k8s-manager', '') == 'true') }}
        _placement_ready: >-
          {{ _placement_subnet.get('status', {}).get('computeInstanceSupported', none) is sameas true
             and _placement_subnet.get('status', {}).get('phase', '') == 'Ready'
             and not _placement_subnet.get('metadata', {}).get('deletionTimestamp') }}

    - name: Publish unsupported or waiting networking failure
      ansible.builtin.set_stats:
        data:
          osac_error:
            message: >-
              NetworkAttachmentFailed: Subnet {{ _placement_subnet_ref }}:
              {{ _placement_subnet.get('status', {}).get('computeInstanceUnsupportedReason', '')
                 or ('does not support VMs' if _placement_unsupported else 'waiting for networking readiness') }}
            retryable: "{{ not _placement_unsupported }}"
      when: _placement_unsupported or not _placement_ready

    - name: Refuse VM provisioning before Subnet networking is supported and ready
      ansible.builtin.fail:
        msg: "Subnet {{ _placement_subnet_ref }} is not supported and ready for VM placement"
      when: _placement_unsupported or not _placement_ready

    - name: Validate the persisted EVPN owner for supported placement
      when: >-
        (_placement_subnet.metadata.annotations | default({})).get(
          'osac.openshift.io/k8s-implementation-strategy', '') == 'cudn_evpn'
      block:
        - name: Read shared EVPN owner Lease
          kubernetes.core.k8s_info:
            api_version: coordination.k8s.io/v1
            kind: Lease
            namespace: "{{ compute_instance.metadata.namespace }}"
            name: "cudn-evpn-{{ _placement_subnet.spec.virtualNetwork | hash('sha1') }}"
          register: _placement_lease

        - name: Verify the exact requested Subnet remains the EVPN owner
          ansible.builtin.assert:
            that:
              - _placement_lease.resources | length == 1
              - >-
                (_placement_lease.resources[0].metadata.annotations | default({})).get(
                  'osac.openshift.io/cudn-owner-subnet', '') == _placement_subnet_ref
              - >-
                (_placement_lease.resources[0].metadata.annotations | default({})).get(
                  'osac.openshift.io/cudn-owner-cleaned', '') != 'true'
            fail_msg: NetworkAttachmentFailed; EVPN owner changed, refusing resource creation.
