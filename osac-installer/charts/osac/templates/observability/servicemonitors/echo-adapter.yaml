{{- if and .Values.observability.enabled .Values.metering.enabled (dig "echoAdapter" "enabled" false .Values.metering) (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/ServiceMonitor") }}
{{- include "osac.serviceMonitor" (dict
  "root" .
  "name" "echo-adapter"
  "jobLabel" "app.kubernetes.io/component"
  "selector" (dict
    "app.kubernetes.io/name" "osac-metering"
    "app.kubernetes.io/instance" .Release.Name
    "app.kubernetes.io/component" "echo-adapter")
  "port" "http") }}
{{- end }}
