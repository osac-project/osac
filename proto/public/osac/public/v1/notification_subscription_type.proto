syntax = "proto3";

package osac.public.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "osac/public/v1/metadata_type.proto";
import "osac/public/v1/secret_type.proto";

// Desired state of a Tenant Admin webhook subscription.
message NotificationSubscriptionSpec {
  // HTTPS webhook endpoint. Validated against the SSRF policy on create and update.
  string webhook_url = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];

  // CEL filter evaluated against incoming CloudEvent attributes (kind, severity, event_type, …).
  string filter = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];

  // When true, matches create retained deliveries and no HTTP POST is sent until unpaused.
  bool paused = 3;
}

// Observed state of a webhook subscription.
message NotificationSubscriptionStatus {
  // Last terminal delivery outcome observed for this subscription (for example delivered or failed).
  string last_delivery_status = 1;

  // Set when sustained delivery failure auto-pauses the subscription.
  bool auto_paused = 2;

  // Tenant Secret (VALUE) holding the Standard Webhooks signing material under data key "value".
  // Created on subscription Create; plaintext is returned once on CreateResponse.signing_secret.
  SecretLocalReference signing_secret = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A Tenant Admin webhook subscription.
//
// buf:lint:ignore OSAC_OBJECT_SHAPE
message NotificationSubscription {
  // Unique identifier of the subscription.
  string id = 1;

  // Metadata of the subscription.
  Metadata metadata = 2 [(buf.validate.field).required = true];

  // Desired state.
  NotificationSubscriptionSpec spec = 3 [(buf.validate.field).required = true];

  // Observed state.
  NotificationSubscriptionStatus status = 4;
}

// Local reference to a NotificationSubscription (same tenant; subscriptions are
// not project-scoped in this iteration).
message NotificationSubscriptionLocalReference {
  string id = 1;
  string name = 2;
}

// CloudEvent identity that produced a delivery.
message NotificationSubscriptionDeliveryEvent {
  string id = 1 [(google.api.field_behavior) = IMMUTABLE];
  string source = 2 [(google.api.field_behavior) = IMMUTABLE];
}

// Delivery lifecycle state.
enum NotificationSubscriptionDeliveryState {
  NOTIFICATION_SUBSCRIPTION_DELIVERY_STATE_UNSPECIFIED = 0;
  NOTIFICATION_SUBSCRIPTION_DELIVERY_STATE_PENDING = 1;
  NOTIFICATION_SUBSCRIPTION_DELIVERY_STATE_RETAINED = 2;
  NOTIFICATION_SUBSCRIPTION_DELIVERY_STATE_DELIVERED = 3;
  NOTIFICATION_SUBSCRIPTION_DELIVERY_STATE_FAILED = 4;
}

// Desired state of a subscription delivery (system-created).
message NotificationSubscriptionDeliverySpec {
  // Subscription that matched.
  NotificationSubscriptionLocalReference subscription = 1 [(google.api.field_behavior) = IMMUTABLE];

  // CloudEvent that produced this delivery.
  NotificationSubscriptionDeliveryEvent event = 2 [(google.api.field_behavior) = IMMUTABLE];
}

// Observed state of a subscription delivery.
message NotificationSubscriptionDeliveryStatus {
  NotificationSubscriptionDeliveryState state = 1;

  // Number of HTTP attempts so far.
  int32 attempt_count = 2;

  // Last HTTP status from the webhook, or 0 when none.
  int32 last_http_status = 3;

  // Last error message from a failed attempt.
  string last_error = 4;

  // When the next retry may run (RFC3339). Empty when not scheduled.
  string next_attempt_time = 5;

  // When the first failed attempt occurred (RFC3339). Used for the 5-day sustained-failure window.
  string first_failure_time = 6;
}

// A webhook delivery for one subscription match.
//
// buf:lint:ignore OSAC_OBJECT_SHAPE
message NotificationSubscriptionDelivery {
  // Unique identifier of the delivery.
  string id = 1;

  // Metadata of the delivery.
  Metadata metadata = 2 [(buf.validate.field).required = true];

  // Desired state.
  NotificationSubscriptionDeliverySpec spec = 3 [(buf.validate.field).required = true];

  // Observed state.
  NotificationSubscriptionDeliveryStatus status = 4;
}
