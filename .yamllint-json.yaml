# JSON is valid YAML, so key-duplicates covers it. check-json only validates
# syntax: it keeps the last duplicate key and silently drops the rest.
# key-duplicates exempts `<<` because it is the YAML merge key, but in JSON it
# is an ordinary key, so duplicated `<<` entries have to be reported too.
rules:
  key-duplicates:
    forbid-duplicated-merge-keys: true
