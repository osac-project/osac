                    image: >-
                      registry.k8s.io/pause:3.9

        - name: "S5: Wait for Running pod"
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Pod
            name: >-
              virt-launcher-{{
              compute_instance_name }}-running
            namespace: >-
              {{ compute_instance_target_namespace }}
          register: s5_running_wait
          until: >
            s5_running_wait.resources | length > 0
            and
            (s5_running_wait.resources[0].status.phase
            | default('')) == 'Running'
          retries: 30
          delay: 2

        - name: "S5: Create minimal VM fixture"
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: kubevirt.io/v1
              kind: VirtualMachine
              metadata:
                name: "{{ compute_instance_name }}"
                namespace: >-
                  {{
                  compute_instance_target_namespace
                  }}
              spec:
                runStrategy: Always
                template:
                  spec:
                    domain:
                      devices: {}
                      resources:
                        requests:
                          memory: 128Mi

        - name: "S5: Expect delete_resources to fail"
          block:
            - name: "S5: Run delete_resources"
              ansible.builtin.include_role:
                name: osac.templates.ocp_virt_vm
                tasks_from: delete_resources.yaml

            - name: "S5: Record unexpected success"
              ansible.builtin.set_fact:
                _s5_unexpected_success: true

          rescue:
            - name: >-
                S5: Assert failure is from launcher
                guard
              ansible.builtin.assert:
                that:
                  - >-
                    'virt-launcher is still in phase'
                    in (ansible_failed_result.msg
                        | default(''))
                fail_msg: >-
                  delete_resources failed for an
                  unexpected reason:
                  {{ ansible_failed_result.msg
                     | default('unknown') }}

        - name: >-
            S5: Assert delete_resources did not succeed
          ansible.builtin.assert:
            that:
              - >-
                _s5_unexpected_success is not defined
            fail_msg: >-
              delete_resources should have failed with
              mixed terminal and running launcher pods.

        - name: "S5: Verify VMI still exists"
          kubernetes.core.k8s_info:
            api_version: kubevirt.io/v1
            kind: VirtualMachineInstance
            name: "{{ compute_instance_name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
          register: s5_vmi_after
          failed_when: >-
            s5_vmi_after.resources | length == 0

        - name: "S5: Assert data preserved"
          ansible.builtin.debug:
            msg: >-
              Scenario 5 passed: recovery correctly
              refused with mixed launcher pod states
              (Failed + Running), VMI preserved.

      always:
        # Remove the foreground-delete finalizer so the
        # subsequent grace-period-0 delete completes
        # instead of leaving a terminating VMI that
        # blocks reruns.
        - name: "S5: Read VMI for finalizer removal"
          kubernetes.core.k8s_info:
            api_version: kubevirt.io/v1
            kind: VirtualMachineInstance
            name: "{{ compute_instance_name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
          register: _s5_cleanup_vmi
          failed_when: false

        - name: >-
            S5: Remove foreground-delete finalizer
            for cleanup
          vars:
            _s5_fins: >-
              {{ _s5_cleanup_vmi.resources[0]
                 .metadata.finalizers
                 | default([]) }}
            _s5_target: >-
              kubevirt.io/foregroundDeleteVirtualMachine
          kubernetes.core.k8s_json_patch:
            api_version: kubevirt.io/v1
            kind: VirtualMachineInstance
            name: "{{ compute_instance_name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
            patch:
              - op: test
                path: /metadata/finalizers
                value: "{{ _s5_fins }}"
              - op: replace
                path: /metadata/finalizers
                value: >-
                  {{ _s5_fins
                     | difference([_s5_target]) }}
          when: >-
            _s5_cleanup_vmi.resources | length > 0
            and
            'kubevirt.io/foregroundDeleteVirtualMachine'
            in (_s5_cleanup_vmi.resources[0]
                .metadata.finalizers | default([]))
          failed_when: false

        - name: "S5: Cleanup"
          kubernetes.core.k8s:
            state: absent
            api_version: "{{ item.api }}"
            kind: "{{ item.kind }}"
            name: "{{ item.name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
            delete_options:
              gracePeriodSeconds: 0
          loop:
            - api: kubevirt.io/v1
              kind: VirtualMachine
              name: "{{ compute_instance_name }}"
            - api: kubevirt.io/v1
              kind: VirtualMachineInstance
              name: "{{ compute_instance_name }}"
            - api: v1
              kind: Pod
              name: >-
                virt-launcher-{{
                compute_instance_name }}-failed
            - api: v1
              kind: Pod
              name: >-
                virt-launcher-{{
                compute_instance_name }}-running
          failed_when: false

# Scenario 6 — Cross-VMI identity boundary: a RUNNING
# launcher pod labelled with a DIFFERENT VMI UID must not
# be matched by the recovery selector.  Recovery should
# see "launcher absent" (zero pods match) and proceed
# with cleanup.  If the UID selector were omitted, this
# Running pod would be matched, _launcher_terminal would
# be false, and recovery would incorrectly refuse.

- name: >-
    Scenario 6: Cross-VMI identity boundary
    (wrong UID ignored)
  hosts: localhost
  gather_facts: false
  vars:
    compute_instance_name: test-vmi-s6
    compute_instance_target_namespace: test-subnet
    compute_instance:
      spec: {}
    ocp_virt_vm_graceful_wait_retries: 2
  tasks:
    - name: "S6: Run test with cleanup"
      block:
        - name: "S6: Clean up previous resources"
          kubernetes.core.k8s:
            state: absent
            api_version: "{{ item.api }}"
            kind: "{{ item.kind }}"
            name: "{{ item.name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
          loop:
            - api: kubevirt.io/v1
              kind: VirtualMachine
              name: "{{ compute_instance_name }}"
            - api: kubevirt.io/v1
              kind: VirtualMachineInstance
              name: "{{ compute_instance_name }}"
            - api: v1
              kind: Pod
              name: >-
                virt-launcher-{{
                compute_instance_name }}-alien
          failed_when: false

        - name: "S6: Create stuck VMI"
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: kubevirt.io/v1
              kind: VirtualMachineInstance
              metadata:
                name: "{{ compute_instance_name }}"
                namespace: >-
                  {{
                  compute_instance_target_namespace
                  }}
                finalizers:
                  - >-
                    kubevirt.io/foregroundDeleteVirtualMachine
              spec:
                domain:
                  devices: {}
                  resources:
                    requests:
                      memory: 128Mi

        - name: "S6: Request VMI deletion"
          kubernetes.core.k8s:
            state: absent
            api_version: kubevirt.io/v1
            kind: VirtualMachineInstance
            name: "{{ compute_instance_name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
          register: s6_delete_result
          failed_when: false

        - name: "S6: Verify VMI is stuck"
          kubernetes.core.k8s_info:
            api_version: kubevirt.io/v1
            kind: VirtualMachineInstance
            name: "{{ compute_instance_name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
          register: s6_vmi_check
          failed_when: >
            s6_vmi_check.resources | length == 0 or
            (s6_vmi_check.resources[0]
            .metadata.deletionTimestamp
            | default('')) == ''

        - name: "S6: Capture VMI UID"
          ansible.builtin.set_fact:
            _s6_vmi_uid: >-
              {{ s6_vmi_check.resources[0]
                 .metadata.uid }}

        - name: >-
            S6: Create Running launcher with WRONG UID
          # This pod carries kubevirt.io=virt-launcher
          # but kubevirt.io/created-by points to a
          # fabricated UID that does not belong to our
          # VMI.  It stays Running (pause image), so if
          # the selector omits created-by, this pod
          # would match and _launcher_terminal would be
          # false, blocking recovery — exactly what the
          # correct selector must avoid.
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Pod
              metadata:
                name: >-
                  virt-launcher-{{
                  compute_instance_name }}-alien
                namespace: >-
                  {{
                  compute_instance_target_namespace
                  }}
                labels:
                  kubevirt.io: virt-launcher
                  kubevirt.io/created-by: >-
                    00000000-0000-0000-0000-ffffffffffff
                annotations:
                  kubevirt.io/domain: >-
                    {{ compute_instance_name }}
              spec:
                restartPolicy: Never
                containers:
                  - name: compute
                    image: >-
                      registry.k8s.io/pause:3.9

        - name: "S6: Wait for alien launcher Running"
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Pod
            name: >-
              virt-launcher-{{
              compute_instance_name }}-alien
            namespace: >-
              {{ compute_instance_target_namespace }}
          register: s6_alien_wait
          until: >
            s6_alien_wait.resources | length > 0 and
            (s6_alien_wait.resources[0].status.phase
            | default('')) == 'Running'
          retries: 30
          delay: 2

        - name: >-
            S6: Assert alien pod has wrong UID and is
            Running
          ansible.builtin.assert:
            that:
              - >-
                s6_alien_wait.resources[0].status.phase
                == 'Running'
              - >-
                s6_alien_wait.resources[0]
                .metadata.labels['kubevirt.io/created-by']
                != (_s6_vmi_uid | trim)
            fail_msg: >-
              Alien launcher fixture must be Running
              with a UID that differs from the target
              VMI.

        - name: "S6: Create minimal VM fixture"
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: kubevirt.io/v1
              kind: VirtualMachine
              metadata:
                name: "{{ compute_instance_name }}"
                namespace: >-
                  {{
                  compute_instance_target_namespace
                  }}
              spec:
                runStrategy: Always
                template:
                  spec:
                    domain:
                      devices: {}
                      resources:
                        requests:
                          memory: 128Mi

        - name: "S6: Run delete_resources"
          ansible.builtin.include_role:
            name: osac.templates.ocp_virt_vm
            tasks_from: delete_resources.yaml

        - name: "S6: Verify VMI cleaned up"
          kubernetes.core.k8s_info:
            api_version: kubevirt.io/v1
            kind: VirtualMachineInstance
            name: "{{ compute_instance_name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
          register: s6_vmi_after
          failed_when: >-
            s6_vmi_after.resources | length > 0

        - name: >-
            S6: Verify alien pod still Running
          # The Running alien launcher must still exist
          # and still be Running — the UID selector
          # must not have matched it.
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Pod
            name: >-
              virt-launcher-{{
              compute_instance_name }}-alien
            namespace: >-
              {{ compute_instance_target_namespace }}
          register: s6_alien_after
          failed_when: >-
            s6_alien_after.resources | length == 0 or
            s6_alien_after.resources[0].status.phase
            != 'Running'

        - name: "S6: Assert identity boundary"
          ansible.builtin.debug:
            msg: >-
              Scenario 6 passed: recovery ignored
              Running wrong-UID launcher (still
              Running), recovered target VMI via
              absent-launcher path.

      always:
        - name: "S6: Cleanup"
          kubernetes.core.k8s:
            state: absent
            api_version: "{{ item.api }}"
            kind: "{{ item.kind }}"
            name: "{{ item.name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
            delete_options:
              gracePeriodSeconds: 0
          loop:
            - api: kubevirt.io/v1
              kind: VirtualMachine
              name: "{{ compute_instance_name }}"
            - api: kubevirt.io/v1
              kind: VirtualMachineInstance
              name: "{{ compute_instance_name }}"
            - api: v1
              kind: Pod
              name: >-
                virt-launcher-{{
                compute_instance_name }}-alien
          failed_when: false
