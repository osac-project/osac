---
# Self-test of the test-only kubernetes.core.k8s_json_patch fixture, not of
# the role: removing a JSON pointer that does not exist must fail, the way
# the real API server rejects it (RFC 6902). The pointer targets a synthetic
# annotation key so it can never collide with a path the role really manages.
- name: Exercise the fake kubernetes.core.k8s_json_patch boundary
  hosts: localhost
  gather_facts: false
  environment:
    OSAC_BM_HOST_PROVISIONING_STATE: "{{ bm_test_state_file }}"
  tasks:
    - name: Remove a JSON pointer that does not exist in the stored resource
      kubernetes.core.k8s_json_patch:
        api_version: metal3.io/v1alpha1
        kind: BareMetalHost
        namespace: metal3-test
        name: test-bmh
        patch:
          - op: remove
            path: /metadata/annotations/osac.test~1never-present
