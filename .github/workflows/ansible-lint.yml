---
name: "Ansible Lint"

on:  # yamllint disable-line rule:truthy
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: "osac-aap/pyproject.toml"

      - name: Install the project
        working-directory: osac-aap
        run: uv sync --locked --all-extras --group development

      - name: Run ansible-lint
        working-directory: osac-aap
        # Explicit "." is required: without a target path, ansible-lint
        # discovers files via `git ls-files` against the whole repo (not
        # CWD-scoped), which in this monorepo pulls in unrelated
        # fulfillment-service/osac-operator YAML and produces spurious
        # failures.
        run: uv run ansible-lint .
