name: 'Stale Issue and PR Lifecycle'

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch: {}

concurrency:
  group: stale-issue-pr-lifecycle
  cancel-in-progress: false

permissions: {}

jobs:
  stale:
    name: 'Mark stale issues and PRs'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639  # v9.1.0
        with:
          days-before-stale: 30
          days-before-close: -1
          stale-issue-label: 'lifecycle/stale'
          stale-pr-label: 'lifecycle/stale'
          exempt-issue-labels: 'lifecycle/frozen,pinned,lifecycle/rotten'
          exempt-pr-labels: 'lifecycle/frozen,pinned,lifecycle/rotten'
          stale-issue-message: |
            This issue has been automatically labeled as `lifecycle/stale` because it has not had any activity for 30 days.

            **Lifecycle timeline:**
            - After 7 more days of inactivity, this issue will be labeled `lifecycle/rotten`.
            - After 14 more days of inactivity, this issue will be automatically closed.

            **To keep this issue active:**
            - Add a comment or make an update to reset the lifecycle timer.
            - The `lifecycle/stale` label will be automatically removed when activity is detected.

            **To prevent automatic lifecycle management:**
            - Apply the `lifecycle/frozen` label to this issue.

            Closed issues can be reopened at any time if they are still relevant.
          stale-pr-message: |
            This pull request has been automatically labeled as `lifecycle/stale` because it has not had any activity for 30 days.

            **Lifecycle timeline:**
            - After 7 more days of inactivity, this PR will be labeled `lifecycle/rotten`.
            - After 14 more days of inactivity, this PR will be automatically closed.

            **To keep this PR active:**
            - Add a comment, push a commit, or make an update to reset the lifecycle timer.
            - The `lifecycle/stale` label will be automatically removed when activity is detected.

            **To prevent automatic lifecycle management:**
            - Apply the `lifecycle/frozen` label to this PR.

            Closed PRs can be reopened at any time if they are still relevant.

  rotten:
    name: 'Mark rotten issues and PRs'
    needs: stale
    runs-on: ubuntu-latest
    permissions:
      actions: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639  # v9.1.0
        with:
          only-issue-labels: 'lifecycle/stale'
          only-pr-labels: 'lifecycle/stale'
          days-before-stale: 7
          days-before-close: -1
          stale-issue-label: 'lifecycle/rotten'
          stale-pr-label: 'lifecycle/rotten'
          labels-to-remove-when-stale: 'lifecycle/stale'
          exempt-issue-labels: 'lifecycle/frozen,pinned'
          exempt-pr-labels: 'lifecycle/frozen,pinned'
          stale-issue-message: |
            This issue has been automatically labeled as `lifecycle/rotten` because it has had no activity for 37+ days (30 days stale + 7 days without further activity).

            **This issue will be automatically closed in 7 days if no further activity occurs.**

            **To keep this issue open:**
            - Add a comment or make an update to reset the lifecycle timer.
            - The `lifecycle/rotten` label will be automatically removed when activity is detected.

            **To prevent automatic lifecycle management:**
            - Apply the `lifecycle/frozen` label to this issue.

            Closed issues can be reopened at any time if they are still relevant.
          stale-pr-message: |
            This pull request has been automatically labeled as `lifecycle/rotten` because it has had no activity for 37+ days (30 days stale + 7 days without further activity).

            **This PR will be automatically closed in 7 days if no further activity occurs.**

            **To keep this PR open:**
            - Add a comment, push a commit, or make an update to reset the lifecycle timer.
            - The `lifecycle/rotten` label will be automatically removed when activity is detected.

            **To prevent automatic lifecycle management:**
            - Apply the `lifecycle/frozen` label to this PR.

            Closed PRs can be reopened at any time if they are still relevant.

  close:
    name: 'Close rotten issues and PRs'
    needs: rotten
    runs-on: ubuntu-latest
    permissions:
      actions: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639  # v9.1.0
        with:
          only-issue-labels: 'lifecycle/rotten'
          only-pr-labels: 'lifecycle/rotten'
          stale-issue-label: 'lifecycle/rotten'
          stale-pr-label: 'lifecycle/rotten'
          days-before-stale: -1
          days-before-close: 7
          exempt-issue-labels: 'lifecycle/frozen,pinned'
          exempt-pr-labels: 'lifecycle/frozen,pinned'
          close-issue-message: |
            This issue has been automatically closed after 44+ days of inactivity (30 days until stale, 7 days until rotten, 7 days until close).

            If this issue is still relevant, you can reopen it at any time. To prevent future automatic closure, apply the `lifecycle/frozen` label.
          close-pr-message: |
            This pull request has been automatically closed after 44+ days of inactivity (30 days until stale, 7 days until rotten, 7 days until close).

            If this PR is still relevant, you can reopen it at any time. To prevent future automatic closure, apply the `lifecycle/frozen` label.
