{{- if .Values.networkClass.enabled }}
{{- $fm := .Values.global.fabricManager | default dict -}}
{{- $km := .Values.global.k8sManager | default dict -}}
{{- $expert := .Values.global.expertOverrides | default dict -}}
{{- $netris := $fm.netris | default dict -}}
{{- $agentless := $km.agentlessNet | default dict -}}
{{- $fabricManager := .Values.networkClass.fabricManager | default "" -}}
{{- $k8sManager := .Values.networkClass.k8sManager | default "" -}}
{{- $title := .Values.networkClass.title -}}
{{- $netExpertNetworkClass := $expert.networkClass | default false -}}
{{- if not $netExpertNetworkClass -}}
{{- if $netris.enabled -}}
{{- $fabricManager = "netris" -}}
{{- $k8sManager = "" -}}
{{- if not $title }}{{- $title = "Netris Network Implementation" -}}{{- end }}
{{- else if $agentless.enabled -}}
{{- $fabricManager = "" -}}
{{- $k8sManager = "k8s_only" -}}
{{- if not $title }}{{- $title = "Agentless Network Implementation" -}}{{- end }}
{{- end }}
{{- end }}
{{- $egressRules := list -}}
{{- range .Values.networkClass.defaults.egressRules }}
{{- $rule := dict "protocol" .protocol -}}
{{- if .ipv4Cidr }}{{ $_ := set $rule "ipv4_cidr" .ipv4Cidr }}{{ end -}}
{{- if .ipv6Cidr }}{{ $_ := set $rule "ipv6_cidr" .ipv6Cidr }}{{ end -}}
{{- if .portFrom }}{{ $_ := set $rule "port_from" .portFrom }}{{ end -}}
{{- if .portTo }}{{ $_ := set $rule "port_to" .portTo }}{{ end -}}
{{- $egressRules = append $egressRules $rule -}}
{{- end }}
{{- $identity := $fabricManager | default $k8sManager -}}
{{- $body := dict
      "title" (required "networkClass.title is required when networkClass.enabled is true" $title)
      "is_default" .Values.networkClass.isDefault
      "spec" (dict "defaults" (dict
        "virtual_network_ipv4_cidr" .Values.networkClass.defaults.virtualNetworkIPv4CIDR
        "subnet_ipv4_cidr" .Values.networkClass.defaults.subnetIPv4CIDR
        "enable_nat_gateway" .Values.networkClass.defaults.enableNatGateway
        "egress_rules" $egressRules
      ))
    -}}
{{- if .Values.networkClass.description }}{{ $_ := set $body "description" .Values.networkClass.description }}{{ end -}}
{{- if $k8sManager }}{{ $_ := set $body "k8s_manager" $k8sManager }}{{ end -}}
{{- if $fabricManager }}{{ $_ := set $body "fabric_manager" $fabricManager }}{{ end -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: create-network-class
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "25"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        {{- include "osac.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      serviceAccountName: admin
      initContainers:
      {{- include "osac.waitForFulfillment" . | nindent 6 }}
      containers:
      - name: create-network-class
        image: {{ .Values.cliImage }}
        command:
          - /bin/bash
          - -euo
          - pipefail
          - -c
          - |
            AUTH_TOKEN=$(< /var/run/secrets/kubernetes.io/serviceaccount/token)
            API="https://fulfillment-internal-api:8001/api/private/v1/network_classes"
            RESPONSE=/tmp/nc-response.json

            # metadata.name is auto-derived deterministically server-side from
            # fabric_manager/k8s_manager when not set explicitly (see
            # PrivateNetworkClassesServer.Create), so POSTing the same body again
            # on every install/upgrade hits a name collision on the second run.
            # That collision surfaces as a misleading FailedPrecondition/HTTP 400
            # ("concurrent default NetworkClass change detected") rather than a
            # plain 409, since the server's is_default default-swap logic assumes
            # any AlreadyExists there is a concurrent race, not a repeat create.
            # Check for an existing NetworkClass for this identity first instead
            # of relying on the create call's error code, and PATCH it if found so
            # values.yaml changes are applied on upgrade instead of silently ignored.
            EXISTING=$(curl -skS --connect-timeout 5 --max-time 30 \
              -H "Authorization: Bearer ${AUTH_TOKEN}" \
              "${API}")
            EXISTING_ID=$(echo "${EXISTING}" | python3 -c "
            import json, os, sys
            identity = os.environ['NC_IDENTITY']
            items = json.load(sys.stdin).get('items', [])
            match = next((i for i in items if i.get('fabric_manager') == identity or i.get('k8s_manager') == identity), None)
            print(match['id'] if match else '')
            ")

            if [[ -n "${EXISTING_ID}" ]]; then
              echo "NetworkClass for '${NC_IDENTITY}' already exists (id: ${EXISTING_ID}), updating..."
              METHOD=PATCH
              URL="${API}/${EXISTING_ID}"
            else
              METHOD=POST
              URL="${API}"
            fi

            CODE=$(curl -skS \
              --connect-timeout 5 --max-time 30 \
              -o "${RESPONSE}" -w '%{http_code}' \
              -X "${METHOD}" "${URL}" \
              -H "Authorization: Bearer ${AUTH_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary {{ $body | toJson | quote }})

            case "${CODE}" in
              2??)
                if [[ "${METHOD}" == "PATCH" ]]; then
                  echo "NetworkClass updated."
                else
                  echo "NetworkClass created."
                fi
                ;;
              409)
                echo "NetworkClass already exists, skipping."
                ;;
              *)
                echo "ERROR: Failed to ${METHOD} NetworkClass (HTTP ${CODE})" >&2
                cat "${RESPONSE}" >&2
                exit 1
                ;;
            esac
        env:
        - name: HOME
          value: /tmp
        - name: NC_IDENTITY
          value: {{ required "networkClass.fabricManager or networkClass.k8sManager is required when networkClass.enabled is true" $identity | quote }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: tmp
        emptyDir: {}
      restartPolicy: OnFailure
{{- end }}
