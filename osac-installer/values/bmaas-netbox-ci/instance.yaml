# BMaaS-NetBox CI overlay — applied on top of bmaas-ci/instance.yaml.
# Contains only the values that differ from the bmaas-ci base profile.
#
# Disables the Metal3 inventory backend and points the bare-metal-
# fulfillment-operator at the NetBox instance deployed by osac-infra
# (bmaas-netbox-ci/infra.yaml). NetBox supplies hardware inventory while
# Metal3 still handles BareMetalHost lifecycle, so BMHs and their BMC
# Secrets continue to live in host-inventory.

bmf:
  metal3:
    enabled: false
  netbox:
    enabled: true
    bmhNamespace: host-inventory
    url: http://osac-infra-netbox.osac-infra.svc.cluster.local
    # NetBox is served over plain HTTP inside the cluster.
    allowInsecureHTTP: true
  secrets:
    # osac-infra's netbox-token-seed hook writes the API token into the
    # osac namespace as netbox-api-token; the chart default
    # (osac-netbox-token) is not what this profile seeds.
    netboxToken: netbox-api-token
