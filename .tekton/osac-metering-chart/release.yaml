apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/osac-project/osac?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "push" && target_branch.startsWith("refs/tags/osac-release/")
  labels:
    appstudio.openshift.io/application: osac
    appstudio.openshift.io/component: osac-metering-chart
    pipelines.appstudio.openshift.io/type: build
  name: osac-metering-chart-on-release
  namespace: osac-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/redhat-user-workloads/osac-tenant/osac-metering-chart:{{revision}}
  - name: chart-context
    value: osac-metering/charts/osac-metering
  # No chart-version override here -- build-helm-chart-oci-ta's default
  # git-describe/TAG_PREFIX mechanism resolves cleanly to the dedicated
  # osac-metering-chart-vX.Y.Z tag osac-build-and-publish.yaml's "Create chart
  # release tags" step pushes before the osac-release/v* marker tag that
  # triggers this build. NOT the existing per-component "<component>/vX.Y.Z" tag
  # format -- this task's version-computation script does
  # `sed -e "s/^${TAG_PREFIX}//"`, and since sed uses "/" as its own
  # delimiter, a "/"-containing TAG_PREFIX breaks that command outright
  # (confirmed live: "unknown option to `s'"). Hence the dedicated,
  # slash-free tag instead of reusing the existing per-component one.
  - name: tag-prefix
    value: osac-metering-chart-v
  # build-helm-chart-oci-ta packages whatever's committed in
  # osac-metering/charts/osac-metering/values.yaml verbatim -- which is a GHCR dev
  # placeholder (e.g. "ghcr.io/osac-project/<component>:sha-<short>"), never
  # the real registry.stage.redhat.io image, since osac-build-and-publish.yaml's
  # own re-stamp to the final value only ever happens in a throwaway,
  # never-committed checkout (see rewrite-registry-image-refs task below,
  # which fixes this post-build instead). owning-component-tag-prefix
  # reuses the EXISTING osac-metering/vX.Y.Z tag (not the dedicated chart tag
  # above) since that's what identifies the real released *image* version.
  - name: owning-component-tag-prefix
    value: osac-metering/v
  - name: registry-image
    value: registry.stage.redhat.io/cloud-extensions/metering-service-rhel10
  # Operates on "${CHART_NAME}/values.yaml" -- build-helm-chart-oci-ta
  # renames the chart root to the Konflux component name (e.g.
  # "osac-metering-chart"), so the extracted .tgz's internal layout is flat,
  # not the original monorepo-nested "osac-metering/charts/osac-metering/values.yaml" path.
  - name: image-rewrite-yq
    value: |
      TARGET_IMAGE="${TARGET_IMAGE}" TARGET_REPO="${TARGET_IMAGE%:*}" TARGET_TAG="${TARGET_IMAGE##*:}" yq -i '.image.repository = strenv(TARGET_REPO) | .image.tag = strenv(TARGET_TAG)' "${CHART_NAME}/values.yaml"
                  M360_REPO="registry.stage.redhat.io/cloud-extensions/metering-m360-adapter-rhel10" TARGET_TAG="${TARGET_IMAGE##*:}" yq -i '.m360Adapter.image.repository = strenv(M360_REPO) | .m360Adapter.image.tag = strenv(TARGET_TAG)' "${CHART_NAME}/values.yaml"
  pipelineSpec:
    description: |
      Packages and pushes a Helm chart to an OCI repository using trusted artifacts,
      for a real release. Chart version is computed from the dedicated chart git tag
      already pushed at this exact commit by osac-build-and-publish.yaml's own
      release tagging step.
    params:
    - description: Source Repository URL
      name: git-url
      type: string
    - default: ""
      description: Revision of the Source Repository
      name: revision
      type: string
    - description: Fully Qualified Output Image
      name: output-image
      type: string
    - default: dist/chart/
      description: Path to the Helm chart directory relative to the source root
      name: chart-context
      type: string
    - default: helm-
      description: An identifying prefix on which the version tag is to be matched
      name: tag-prefix
      type: string
    - default: "false"
      description: Execute the build with network isolation
      name: hermetic
      type: string
    - default: ""
      description: Build dependencies to be prefetched
      name: prefetch-input
      type: string
    - default: ""
      description: Image tag expiration time, time values could be something like
        1h, 2d, 3w for hours, days, and weeks, respectively.
      name: image-expires-after
      type: string
    - default: "false"
      description: Enable cache proxy configuration
      name: enable-cache-proxy
    - default: "true"
      description: Use the package registry proxy when prefetching dependencies
      name: enable-package-registry-proxy
      type: string
    - description: Existing per-component tag prefix identifying the real released image version
      name: owning-component-tag-prefix
      type: string
    - description: Fully qualified registry.stage.redhat.io image (no tag) this chart should reference
      name: registry-image
      type: string
    - description: Full yq command rewriting this chart's own image value field(s), given $TARGET_IMAGE
      name: image-rewrite-yq
      type: string
    results:
    - description: ""
      name: IMAGE_URL
      value: $(tasks.rewrite-registry-image-refs.results.IMAGE_URL)
    - description: ""
      name: IMAGE_DIGEST
      value: $(tasks.rewrite-registry-image-refs.results.IMAGE_DIGEST)
    - description: ""
      name: CHAINS-GIT_URL
      value: $(tasks.clone-repository.results.url)
    - description: ""
      name: CHAINS-GIT_COMMIT
      value: $(tasks.clone-repository.results.commit)
    tasks:
    - name: init
      params:
      - name: enable-cache-proxy
        value: $(params.enable-cache-proxy)
      taskRef:
        params:
        - name: name
          value: init
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-init:0.4.3@sha256:c6c414a3b5dcd827720f3443a128a02d27a0a5071ea3e4dc0063d578f1f73a74
        - name: kind
          value: task
        resolver: bundles
    - name: clone-repository
      params:
      - name: url
        value: $(params.git-url)
      - name: revision
        value: $(params.revision)
      - name: ociStorage
        value: $(params.output-image).git
      - name: ociArtifactExpiresAfter
        value: $(params.image-expires-after)
      runAfter:
      - init
      taskRef:
        params:
        - name: name
          value: git-clone-oci-ta
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-git-clone-oci-ta:0.2.6@sha256:a3678910c2bf9187a66a96066193cb41046fbb7097160bf2be6a374ed5e49d30
        - name: kind
          value: task
        resolver: bundles
      workspaces:
      - name: basic-auth
        workspace: git-auth
    - name: prefetch-dependencies
      params:
      - name: input
        value: $(params.prefetch-input)
      - name: SOURCE_ARTIFACT
        value: $(tasks.clone-repository.results.SOURCE_ARTIFACT)
      - name: ociStorage
        value: $(params.output-image).prefetch
      - name: ociArtifactExpiresAfter
        value: $(params.image-expires-after)
      - name: enable-package-registry-proxy
        value: $(params.enable-package-registry-proxy)
      runAfter:
      - clone-repository
      taskRef:
        params:
        - name: name
          value: prefetch-dependencies-oci-ta
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-prefetch-dependencies-oci-ta:0.10.3@sha256:0c386f2c26b46b978280c5c54caac26bcd524975f8f7cc06bb080ba00eae3ad4
        - name: kind
          value: task
        resolver: bundles
      workspaces:
      - name: git-basic-auth
        workspace: git-auth
      - name: netrc
        workspace: netrc
    - name: build-helm-chart
      params:
      - name: IMAGE
        value: $(params.output-image)
      - name: COMMIT_SHA
        value: $(tasks.clone-repository.results.commit)
      - name: SOURCE_ARTIFACT
        value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
      - name: CHART_CONTEXT
        value: $(params.chart-context)
      - name: TAG_PREFIX
        value: $(params.tag-prefix)
      runAfter:
      - prefetch-dependencies
      taskRef:
        params:
        - name: name
          value: build-helm-chart-oci-ta
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-build-helm-chart-oci-ta:0.3@sha256:cc59ae16baa756d23f3e5f8328cd9f8ba39a388f8eafbb9db666dea694814d25
        - name: kind
          value: task
        resolver: bundles
    - name: rewrite-registry-image-refs
      params:
      - name: git-url
        value: $(params.git-url)
      - name: revision
        value: $(tasks.clone-repository.results.commit)
      - name: chart-image
        value: $(tasks.build-helm-chart.results.IMAGE_URL)
      - name: owning-component-tag-prefix
        value: $(params.owning-component-tag-prefix)
      - name: registry-image
        value: $(params.registry-image)
      - name: image-rewrite-yq
        value: $(params.image-rewrite-yq)
      runAfter:
      - build-helm-chart
      taskSpec:
        params:
        - name: git-url
          type: string
        - name: revision
          type: string
        - name: chart-image
          type: string
        - name: owning-component-tag-prefix
          type: string
        - name: registry-image
          type: string
        - name: image-rewrite-yq
          type: string
        results:
        - name: IMAGE_URL
          description: The chart image URL after rewriting its embedded image reference(s)
        - name: IMAGE_DIGEST
          description: The chart image digest after rewriting its embedded image reference(s)
        steps:
        - name: rewrite-and-push
          # Same image build-helm-chart-oci-ta's own "package-and-push" step
          # uses -- already has git, yq, and helm.
          image: quay.io/konflux-ci/tools@sha256:2112b51ba80d1041c120c32b67b871d371fde4e5775b32a3c7bf01a2f9ec0964
          script: |
            #!/bin/bash
            set -euo pipefail

            CHART_IMAGE="$(params.chart-image)"
            CHART_REPO="${CHART_IMAGE%:*}"
            CHART_TAG="${CHART_IMAGE##*:}"
            CHART_NAME="${CHART_REPO##*/}"
            REGISTRY_IMAGE="$(params.registry-image)"

            # Resolve the real per-component image version from the
            # EXISTING osac-build-and-publish.yaml-pushed per-component tag
            # (e.g. osac-metering/vX.Y.Z) -- not the dedicated chart tag, which
            # identifies the chart's own version, a different number.
            # A blobless (--filter=blob:none) clone already carries full
            # commit/tag history (unlike a shallow --depth clone), so no
            # --unshallow dance is needed here -- an explicit tags fetch is
            # just a cheap belt-and-suspenders in case the remote's default
            # refspec ever didn't include them.
            echo "Resolving real image version from $(params.owning-component-tag-prefix)*..."
            git clone --filter=blob:none --no-checkout "$(params.git-url)" /tmp/repo
            cd /tmp/repo
            git fetch --tags origin
            # Resolve by tag NAME, not by git ancestry/revision: this
            # release's own stamping commit (and the owning image
            # component's own stamping commit, if that component wasn't
            # rebuilt this release) each live on their own throwaway
            # per-release branch that's never merged into main, so neither
            # `--exact-match` on params.revision nor an ancestor-walking
            # `git describe` can find a component's tag unless that exact
            # component was bumped in this exact release. Tags are
            # monotonically increasing per component, so the highest
            # version by semver sort is always the real, currently-released
            # one, bumped this release or not.
            REAL_VERSION=$(git tag -l "$(params.owning-component-tag-prefix)*" \
              | sed "s#^$(params.owning-component-tag-prefix)##" \
              | sort -V | tail -1)
            if [ -z "${REAL_VERSION}" ]; then
              echo "ERROR: no tag matching $(params.owning-component-tag-prefix)* found" >&2
              exit 1
            fi
            TARGET_IMAGE="${REGISTRY_IMAGE}:${REAL_VERSION}"
            echo "Real image version: ${REAL_VERSION} -> ${TARGET_IMAGE}"

            # Pull the chart build-helm-chart just pushed, rewrite its
            # known image reference field(s) to point at the real staging
            # image instead of the committed GHCR dev placeholder, then
            # re-package and re-push at the exact same version/tag --
            # overwriting the OCI manifest in place before EC/integration
            # tests evaluate it.
            mkdir -p /tmp/chart-rewrite && cd /tmp/chart-rewrite
            helm pull "oci://${CHART_REPO}" --version "${CHART_TAG}" --destination .
            tar xzf "${CHART_NAME}-${CHART_TAG}.tgz"

            $(params.image-rewrite-yq)

            helm package "${CHART_NAME}" --version "${CHART_TAG}" --app-version "${CHART_TAG}"

            # Same auth-scoping technique build-helm-chart-oci-ta's own
            # script uses -- plain helm push can pick the wrong credential
            # when ~/.docker/config.json has multiple registries configured.
            REGISTRY_HOST="${CHART_REPO%/*}"
            jq --arg registry "${REGISTRY_HOST}" '.auths[$registry]' ~/.docker/config.json |
              jq -n --arg registry "${REGISTRY_HOST}" '{auths:{($registry):inputs}}' \
                >scoped_authfile.json

            # helm push writes its "Pushed:"/"Digest:" lines to stderr, not
            # stdout -- 2>&1 is required or the digest grep below finds nothing.
            PUSH_OUTPUT=$(helm push "${CHART_NAME}-${CHART_TAG}.tgz" "oci://${REGISTRY_HOST}" \
              --registry-config scoped_authfile.json 2>&1)
            echo "${PUSH_OUTPUT}"
            DIGEST=$(echo "${PUSH_OUTPUT}" | grep -oP 'Digest: \K\S+')

            echo -n "${CHART_IMAGE}" >"$(results.IMAGE_URL.path)"
            echo -n "${DIGEST}" >"$(results.IMAGE_DIGEST.path)"
    workspaces:
    - name: git-auth
      optional: true
    - name: netrc
      optional: true
  taskRunTemplate:
    serviceAccountName: build-pipeline-osac-metering-chart
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
