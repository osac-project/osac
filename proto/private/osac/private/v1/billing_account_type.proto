syntax = "proto3";

package osac.private.v1;

import "buf/validate/validate.proto";
import "cleanapi/cleanapi.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "osac/private/v1/metadata_type.proto";

option (cleanapi.file).package = "osac.public.v1";

enum BillingAccountState {
  // Unset. Never reported by the server.
  BILLING_ACCOUNT_STATE_UNSPECIFIED = 0;

  // The last observed state is active: the provider reports an account eligible for a new assignment, and it can be
  // linked for new priced publish and launch.
  BILLING_ACCOUNT_STATE_ACTIVE = 1;

  // The last observed state is inactive: the account cannot be newly linked and new assignments are not permitted,
  // though existing resources keep running and usage submission continues.
  BILLING_ACCOUNT_STATE_INACTIVE = 2;

  // The last observed state could not be classified: OSAC did not recognize the provider's native value, or a complete
  // inventory did not observe the account.
  BILLING_ACCOUNT_STATE_UNKNOWN = 3;
}

// An account discovered from the configured billing provider. Discovery owns its metadata and observed status;
// this object does not expose a provider-account mutation API.
message BillingAccount {
  // OSAC-generated opaque identifier used by APIs and tenant assignments. It is not the provider's account id.
  string id = 1;

  // System-owned metadata: tenant is `system`, project is empty, and name is `ba-` followed by the first 60
  // lowercase hexadecimal characters of SHA-256 over the UTF-8 OSAC id. Provider labels do not determine identity.
  Metadata metadata = 2;

  BillingAccountSpec spec = 3;

  // System-provided, read-only observations.
  BillingAccountStatus status = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Former flat fields are not aliases. Reusing tags 2-4 for the standard envelope is a breaking amendment.
  reserved 5 to 8;
  reserved "provider_key", "display_name", "base_currency", "state", "status_observed_at", "correlation_id",
    "external_billing_account_id", "provider_account_reference";
}

// Discovered accounts have no user-configurable desired state.
message BillingAccountSpec {}

// Last provider observations and locally retained attribution for a discovered account.
message BillingAccountStatus {
  // Adapter that discovered the account, such as `m360`. This is not the provider-native account identity.
  string provider_key = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Provider-supplied display label, not a stable OSAC or provider-native identifier.
  string display_name = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // ISO-4217 currency used to interpret this account's prices, provider-supplied. Empty when the provider has no
  // currency field (M360) or does not supply one; a missing currency is never invented or defaulted.
  string base_currency = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Last normalized provider-account state.
  BillingAccountState state = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Start of the OSAC observation that supplied the stored state. Not the provider's transition time or the
  // completion time of the provider read; older observations cannot replace newer evidence.
  google.protobuf.Timestamp state_observation_timestamp = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Locally retained provider-agnostic attribution token, distinct from OSAC id, display label and native account
  // reference. It may be established while an assignment is PENDING and absent from M360's `externalId`.
  // Assignment validation checks for a unique provider-side carrier; this field alone is not evidence of a
  // native identity or metering integration. Absence and a present empty value are distinct; raw bytes are retained.
  optional string external_billing_account_id = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Provider-native account id used for backend calls. Never returned to ordinary clients.
  string provider_account_reference = 7 [
    (cleanapi.field).private = true,
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // The raw external ID reported by the provider in the latest inventory, independent of the OSAC attribution token.
  // Unset if the account was not observed or the provider adapter reported no value.
  optional string provider_external_id = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Platform-scoped reference to a discovered billing account by immutable OSAC id, stable name, or both.
// When both are supplied they must identify the same account. Neither token nor provider label is a reference.
message BillingAccountReference {
  option (buf.validate.message).cel = {
    id: "billing_account_reference_identity",
    message: "at least one of id or name is required",
    expression: "this.id != '' || this.name != ''"
  };

  string id = 1;
  string name = 2 [(buf.validate.field).string = {
    max_len: 63,
    pattern: "^$|^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
  }];
}
