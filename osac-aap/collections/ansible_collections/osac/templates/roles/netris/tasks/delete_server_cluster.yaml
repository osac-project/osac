---
- name: Validate ServerCluster deletion identity
  ansible.builtin.assert:
    that:
      - >-
        (server_cluster.spec.backendId | default('') | string is match('^[1-9][0-9]*$'))
        or
        (server_cluster.spec.backendId | default('') | string == ''
        and server_cluster.spec.vpcId | default('') | string is match('^[1-9][0-9]*$'))
    fail_msg: "ServerCluster deletion requires a positive numeric backendId, or a VPC ID for scoped lookup"

- name: Delete ServerCluster from Netris
  ansible.builtin.include_role:
    name: netris.controller.server_cluster
    tasks_from: delete
  vars:
    server_cluster_name: "{{ server_cluster.metadata.name }}"
    server_cluster_site_id: "{{ server_cluster.spec.siteId | default((netris_region_site_map | default({}))[server_cluster.spec.region | default('')] | default(netris_site_id)) | int }}"
    server_cluster_backend_id: "{{ server_cluster.spec.backendId | default('') }}"
    server_cluster_vpc_id: "{{ server_cluster.spec.vpcId | default(0) | int }}"
