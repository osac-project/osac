            name: "{{ compute_instance_name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
          register: s7a_vmi_check
          failed_when: >
            s7a_vmi_check.resources | length == 0 or
            (s7a_vmi_check.resources[0]
            .metadata.deletionTimestamp
            | default('')) != ''

        - name: "S7a: Create minimal VM fixture"
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: kubevirt.io/v1
              kind: VirtualMachine
              metadata:
                name: "{{ compute_instance_name }}"
                namespace: >-
                  {{
                  compute_instance_target_namespace
                  }}
