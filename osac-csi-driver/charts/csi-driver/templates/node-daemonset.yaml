{{- $fulfillment := .Values.controller.fulfillment -}}
{{- $endpoint := $fulfillment.endpoint | default "" -}}
{{- $issuerURL := $fulfillment.issuerUrl | default "" -}}
{{- $configMapName := $fulfillment.configMap.name | default "" -}}
{{- $configured := or $configMapName (and $endpoint $issuerURL) -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "csi-driver.fullname" . }}-node
  namespace: {{ include "csi-driver.namespace" . }}
  labels:
    {{- include "csi-driver.labels" . | nindent 4 }}
    app.kubernetes.io/component: node
spec:
  selector:
    matchLabels:
      {{- include "csi-driver.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: node
  template:
    metadata:
      labels:
        {{- include "csi-driver.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: node
    spec:
      serviceAccountName: {{ include "csi-driver.nodeServiceAccountName" . }}
      containers:
        - name: osac-csi-driver
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--csi-endpoint=unix:///csi/osac/csi.sock"
            - "--node-id=$(KUBE_NODE_NAME)"
            {{- if $configMapName }}
            - "--fulfillment-endpoint=$(OSAC_FULFILLMENT_ENDPOINT)"
            - "--fulfillment-issuer-url=$(OSAC_FULFILLMENT_ISSUER_URL)"
            {{- else if and $endpoint $issuerURL }}
            - "--fulfillment-endpoint={{ $endpoint }}"
            - "--fulfillment-issuer-url={{ $issuerURL }}"
            {{- end }}
            {{- if $configured }}
            - "--fulfillment-client-id=$(FULFILLMENT_CLIENT_ID)"
            - "--fulfillment-client-secret-file=/etc/osac-csi/credentials/client-secret"
            {{- if $fulfillment.tls.insecureSkipVerify }}
            - "--grpc-insecure"
            {{- end }}
            {{- end }}
            {{- if $fulfillment.allowStub }}
            - "--allow-stub"
            {{- end }}
            {{- if .Values.node.vendorSockets }}
            - "--vendor-sockets={{ .Values.node.vendorSockets }}"
            {{- end }}
            - "--v=2"
          env:
            # KUBE_NODE_NAME preserves the upstream node-id argument; NodeGetInfo
            # reads NODE_NAME. Both are sourced from the Kubernetes node name.
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OSAC_LVMS_NODE_SOCKET
              value: {{ .Values.node.lvmsNodeSocket | quote }}
            {{- if $configured }}
            {{- if $configMapName }}
            - name: OSAC_FULFILLMENT_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: {{ $configMapName }}
                  key: {{ $fulfillment.configMap.endpointKey }}
                  optional: false
            - name: OSAC_FULFILLMENT_ISSUER_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ $configMapName }}
                  key: {{ $fulfillment.configMap.issuerUrlKey }}
                  optional: false
            {{- end }}
            - name: FULFILLMENT_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $fulfillment.credentials.secretName }}
                  key: {{ $fulfillment.credentials.clientIdKey }}
            {{- end }}
          volumeMounts:
            - name: osac-socket-dir
              mountPath: /csi/osac
            - name: kubelet-dir
              mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
            - name: lvms-socket-dir
              mountPath: {{ .Values.node.lvmsNodeSocketDir }}
              readOnly: true
            {{- if $configured }}
            - name: fulfillment-credentials
              mountPath: /etc/osac-csi/credentials
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.node.resources | nindent 12 }}
          securityContext:
            privileged: {{ .Values.node.privileged }}
            runAsUser: 0

        - name: csi-node-driver-registrar
          image: "{{ .Values.sidecars.registrar.image.repository }}:{{ .Values.sidecars.registrar.image.tag }}"
          args:
            - "--csi-address=/csi/osac/csi.sock"
            - "--kubelet-registration-path=/var/lib/kubelet/plugins/{{ .Values.driverName }}/csi.sock"
            - "--v=2"
          volumeMounts:
            - name: osac-socket-dir
              mountPath: /csi/osac
            - name: registration-dir
              mountPath: /registration
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

      volumes:
        - name: osac-socket-dir
          hostPath:
            path: /var/lib/kubelet/plugins/{{ .Values.driverName }}
            type: DirectoryOrCreate
        - name: kubelet-dir
          hostPath:
            path: /var/lib/kubelet
            type: Directory
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
        - name: lvms-socket-dir
          hostPath:
            path: {{ .Values.node.lvmsNodeSocketDir }}
            type: DirectoryOrCreate
        {{- if $configured }}
        - name: fulfillment-credentials
          secret:
            secretName: {{ $fulfillment.credentials.secretName }}
            items:
              - key: {{ $fulfillment.credentials.clientSecretKey }}
                path: client-secret
        {{- end }}
