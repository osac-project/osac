          failed_when: >-
            s6_alien_after.resources | length == 0 or
            s6_alien_after.resources[0].status.phase
            != 'Running'

        - name: "S6: Verify VM and dependents deleted"
          kubernetes.core.k8s_info:
            api_version: "{{ item.api }}"
            kind: "{{ item.kind }}"
            name: "{{ item.name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
          register: _s6_dep_check
          failed_when: >-
            _s6_dep_check.resources | length > 0
          loop:
            - api: kubevirt.io/v1
              kind: VirtualMachine
              name: "{{ compute_instance_name }}"
            - api: v1
