---
# The merge queue's E2E: plans the suites for the queue entry from its changed files (a documentation-only entry needs
# none), runs them on the entry's speculative commit, and writes the required `E2E` check of that commit. The plan, the
# cancelling of superseded runs and the check are the shared workflows of osac-ci (pinned by commit, release tag in a
# comment); the suite jobs are this repository's, named after the suite ids of .github/e2e-policy.yml.
name: E2E for the merge queue

on:
  merge_group:

permissions: {}

jobs:
  plan:
    uses: osac-project/osac-ci/.github/workflows/e2e-queue-plan.yml@5bfcd1ff220362171967451de7aaabb9e027d855  # v1.3.6
    permissions:
      contents: read
      actions: write

  # The pull request of the entry, for the ci-observe capture. A merge_group event carries no pull request number: the
  # only place GitHub exposes it is the temporary branch it creates for the entry,
  # "gh-readonly-queue/<base>/pr-<N>-<sha>" (the monitoring backfill of the CI dashboard reads the number from the same
  # branch). The suites get it as `pr-number`, so a queue attempt is captured as "pull request N" (`caas-pr<N>-...`,
  # with osac.ci.pr=<N> on every signal) and the Pull requests dashboard can link the attempt to that capture.
  entry:
    runs-on: ubuntu-latest
    outputs:
      pr-number: ${{ steps.derive.outputs.number }}
    steps:
      - name: Derive the pull request number from the queue branch
        id: derive
        # Telemetry never decides whether the entry passes: a number this step cannot read leaves the suites running,
        # with a capture named as it is on main, instead of stopping the required E2E check.
        continue-on-error: true
        env:
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          # <base> may contain "/" itself (release/4.20), so match the anchored pr-<N>-<sha> suffix and not one path
          # segment. No match leaves the number empty: the suite then runs as it does on main, under no pull request.
          if [[ "${HEAD_REF}" =~ ^gh-readonly-queue/.+/pr-([0-9]+)-[0-9a-f]+$ ]]; then
            echo "number=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "number=" >> "$GITHUB_OUTPUT"
            echo "::warning::no pull request number in the queue branch '${HEAD_REF}'; the capture will be named main"
          fi

  vmaas:
    needs: [plan, entry]
    if: contains(needs.plan.outputs.suites, '"vmaas"')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/e2e-vmaas-full-install.yml
    with:
      repo: ${{ github.repository }}
      sha: ${{ github.event.merge_group.head_sha }}
      pr-number: ${{ needs.entry.outputs.pr-number }}
      # This workflow runs for a queue entry only, so telemetry is always on here: every attempt leaves a capture the
      # Pull requests dashboard can link to. The suite is called once, so no capture runs twice.
      ci-observe: true
    secrets:
      CI_OBSERVE_OTLP_PASSWORD: ${{ secrets.CI_OBSERVE_OTLP_PASSWORD }}

  caas:
    needs: [plan, entry]
    if: contains(needs.plan.outputs.suites, '"caas"')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/e2e-caas-full-install.yml
    with:
      repo: ${{ github.repository }}
      sha: ${{ github.event.merge_group.head_sha }}
      pr-number: ${{ needs.entry.outputs.pr-number }}
      # Always on here: this workflow runs for a queue entry only (see the vmaas job).
      ci-observe: true
    secrets:
      CI_OBSERVE_OTLP_PASSWORD: ${{ secrets.CI_OBSERVE_OTLP_PASSWORD }}

  bmaas:
    needs: [plan, entry]
    if: contains(needs.plan.outputs.suites, '"bmaas"')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/e2e-bmaas-full-install.yml
    with:
      repo: ${{ github.repository }}
      sha: ${{ github.event.merge_group.head_sha }}
      pr-number: ${{ needs.entry.outputs.pr-number }}
      # Always on here: this workflow runs for a queue entry only (see the vmaas job).
      ci-observe: true
    secrets:
      CI_OBSERVE_OTLP_PASSWORD: ${{ secrets.CI_OBSERVE_OTLP_PASSWORD }}

  # One job that looks after the queue entry: it watches the suites and the other required checks of the commit (the
  # unit and integration tests of CI, the Jira check), writes the required E2E check at once when one of them fails, and
  # stops everything that still runs for the commit, so the entry leaves the queue instead of holding its place until
  # every suite has ended. It also writes E2E when everything passed. See osac-ci's docs/CALLERS.md.
  result:
    needs: plan
    if: always()
    uses: osac-project/osac-ci/.github/workflows/e2e-queue-result.yml@5bfcd1ff220362171967451de7aaabb9e027d855  # v1.3.6
    permissions:
      actions: write
      contents: read
    with:
      sha: ${{ github.event.merge_group.head_sha }}
      branch: ${{ github.event.merge_group.base_ref }}
      plan-result: ${{ needs.plan.result }}
      suites: ${{ needs.plan.outputs.suites }}
    secrets:
      OSAC_CI_APP_PRIVATE_KEY: ${{ secrets.OSAC_CI_APP_PRIVATE_KEY }}
