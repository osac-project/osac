columns:

- header: ID
  value: this.id

- header: NAME
  value: "has(this.metadata.name)? this.metadata.name: '-'"

- header: TENANT
  value: "has(this.metadata.tenant)? this.metadata.tenant: '-'"

- header: TIER
  value: "has(this.spec.storage_tier)? this.spec.storage_tier: '-'"

- header: SIZE (GIB)
  value: "has(this.spec.size_gib)? string(this.spec.size_gib): '-'"

- header: CLUSTER
  value: "has(this.spec.cluster)? this.spec.cluster: '-'"

- header: BACKEND
  value: "has(this.status.backend) && this.status.backend != ''? this.status.backend: '-'"

- header: STATE
  value: this.status.state
  type: osac.private.v1.VolumeState
