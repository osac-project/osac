images:
  ee: ghcr.io/osac-project/osac-aap:latest
  eePullPolicy: IfNotPresent
imagePullSecrets: []
project:
  url: https://github.com/osac-project/osac.git
  # The installer selects the checkout revision; direct Helm use requires a commit.
  commit: ""
bootstrap:
  enabled: false
networking:
  # Include the production network task templates and execution group in AWX.
  enabled: false
  # Profile expectations are written to caas-it-configuration for suite checks.
  profileName: custom
  services: ""
  expectedFabricManager: ""
  expectedK8sManager: ""
