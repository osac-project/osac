syntax = "proto3";

package osac.private.v1;

import "cleanapi/cleanapi.proto";
import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "osac/private/v1/baremetal_instance_type_type.proto";

option (cleanapi.file).package = "osac.public.v1";
option (cleanapi.file).http_route_prefix_map = "private:fulfillment";

message BareMetalInstanceTypesListRequest {
  // Index of the first result. If not specified the default value will be zero.
  optional int32 offset = 1;

  // Maximum number of results to be returned by the server. When not specified all the results will be returned. Note
  // that there may not be enough results to return, and that the server may decide, for performance reasons, to return
  // less results than requested.
  optional int32 limit = 2;

  // Filter criteria.
  //
  // The value of this parameter is a [CEL](https://cel.dev) expression used to select which objects to return. The
  // built-in `this` variable refers to the object being tested and `now` refers to the current date and time. If the
  // expression evaluates to `true` the object is included in the results. For example, to retrieve all bare metal
  // instance types with names starting with `gpu`:
  //
  //     this.metadata.name.startsWith("gpu")
  //
  // If this isn't provided, or if the value is empty, then all the bare metal instance types that the user has
  // permission to see will be returned. Not all CEL constructs are currently supported for implementation reasons; see
  // the filter documentation (docs/FILTER.md) for the full details.
  optional string filter = 3;

  // Order criteria.
  //
  // The syntax of this parameter is similar to the syntax of the _order by_ clause of a SQL statement, but using the
  // names of the attributes of the bare metal instance type instead of the names of the columns of a table. For
  // example, in order to sort the bare metal instance types descending by name the value should be:
  //
  //     name desc
  //
  // If the parameter isn't provided, or if the value is empty, then the order of the results is undefined.
  optional string order = 4;
}

message BareMetalInstanceTypesListResponse {
  // Actual number of items returned. Note that this may be smaller than the value requested in the `limit` parameter
  // of the request if there are not enough items, or of the system decides that returning that number of items isn't
  // feasible or convenient for performance reasons.
  int32 size = 1;

  // Total number of items of the collection that match the search criteria, regardless of the number of results
  // requested with the `limit` parameter.
  int32 total = 2;

  // List of results.
  repeated BareMetalInstanceType items = 3;
}

message BareMetalInstanceTypesGetRequest {
  // Unique identifier of the bare metal instance type.
  string id = 1;
}

message BareMetalInstanceTypesGetResponse {
  BareMetalInstanceType object = 1;
}

message BareMetalInstanceTypesCreateRequest {
  option (cleanapi.message).private = true;
  BareMetalInstanceType object = 1;
}

message BareMetalInstanceTypesCreateResponse {
  option (cleanapi.message).private = true;
  BareMetalInstanceType object = 1;
}

message BareMetalInstanceTypesUpdateRequest {
  option (cleanapi.message).private = true;
  BareMetalInstanceType object = 1;
  google.protobuf.FieldMask update_mask = 2;

  // Lock enables optimistic locking. When set to true, the server verifies that the current version of the object
  // matches the value of the metadata.version field of the submitted object. If they differ the update will be
  // rejected. This is useful to prevent lost updates when multiple clients are modifying the same object concurrently.
  bool lock = 3;
}

message BareMetalInstanceTypesUpdateResponse {
  option (cleanapi.message).private = true;
  BareMetalInstanceType object = 1;
}

message BareMetalInstanceTypesDeleteRequest {
  option (cleanapi.message).private = true;
  // Unique identifier of the bare metal instance type.
  string id = 1;
}

message BareMetalInstanceTypesDeleteResponse {
  option (cleanapi.message).private = true;
}

message BareMetalInstanceTypesSignalRequest {
  option (cleanapi.message).private = true;
  // Unique identifier of the bare metal instance type.
  string id = 1;
}

message BareMetalInstanceTypesSignalResponse {
  option (cleanapi.message).private = true;
}

service BareMetalInstanceTypes {
  // Retrieves the list of bare metal instance types.
  rpc List(BareMetalInstanceTypesListRequest) returns (BareMetalInstanceTypesListResponse) {
    option (google.api.http) = {get: "/api/private/v1/bare_metal_instance_types"};
  }

  // Retrieves the details of one specific bare metal instance type.
  rpc Get(BareMetalInstanceTypesGetRequest) returns (BareMetalInstanceTypesGetResponse) {
    option (google.api.http) = {
      get: "/api/private/v1/bare_metal_instance_types/{id}"
      response_body: "object"
    };
  }
  rpc Create(BareMetalInstanceTypesCreateRequest) returns (BareMetalInstanceTypesCreateResponse) {
    option (cleanapi.method).private = true;
    option (google.api.http) = {
      post: "/api/private/v1/bare_metal_instance_types"
      body: "object"
      response_body: "object"
    };
  }
  rpc Update(BareMetalInstanceTypesUpdateRequest) returns (BareMetalInstanceTypesUpdateResponse) {
    option (cleanapi.method).private = true;
    option (google.api.http) = {
      patch: "/api/private/v1/bare_metal_instance_types/{object.id}"
      body: "object"
      response_body: "object"
    };
  }
  rpc Delete(BareMetalInstanceTypesDeleteRequest) returns (BareMetalInstanceTypesDeleteResponse) {
    option (cleanapi.method).private = true;
    option (google.api.http) = {delete: "/api/private/v1/bare_metal_instance_types/{id}"};
  }

  // Indicates that something changed in the object or the system that may require reconciling the object.
  rpc Signal(BareMetalInstanceTypesSignalRequest) returns (BareMetalInstanceTypesSignalResponse) {
    option (cleanapi.method).private = true;
  }
}
