syntax = "proto3";

package osac.private.v1;

import "cleanapi/cleanapi.proto";
import "google/protobuf/descriptor.proto";

// This file is private: metering reads the annotations from the private protos, and the public
// API doesn't need them.
option (cleanapi.file).private = true;

// Metering bills usage by folding the event log into facts: for every billable resource, the
// fields metering dimensions usage on, and the times those fields changed. The annotations
// defined here mark those fields, so the list lives with the resource definitions instead of
// in a second place that can drift apart from them.
//
// The annotations feed a shared registry, the Go package `proto/metering`. At startup the
// registry walks the compiled proto descriptors of this package, collects every field carrying
// a `metering` annotation, validates it (the transition time of a varying field must name a
// real timestamp field of the resource), and exposes the result as a plain list per resource.
// Two consumers read that one list:
//
// - Fulfillment's database. `MeteringTableFields` maps the resources to their tables, the
//   migration tests compare the installed trigger configuration against the registry (the
//   drift test), and the schema check refuses to start when a tracked table lacks the
//   source-contract trigger. The triggers themselves embed a copy of the list, because SQL
//   cannot import Go; the drift test is what keeps the copy honest.
// - The metering service. The fold decides which fields of each event payload update a
//   resource's history, and the rules reference the same field paths in their dimensions.
//
// So adding a tracked field is: annotate the field here, extend the table mapping in
// `fulfillment-service/internal/database/metering.go`, and extend the tracked-field mapping in
// the migration that installs the trigger. The drift test and the schema check fail until all
// three agree.
//
// The kinds, with examples from the annotated resources:
//
// - CONSTANT: set when the resource is created and never changed afterwards. Examples: a
//   compute instance's boot disk size and disk image, a cluster's template, a volume's storage
//   tier and protocol, a NAT gateway's external IP and virtual network. Only annotate a field
//   this way when the API already rejects changing it; otherwise the trigger would reject
//   legitimate writes.
//
// - VARIES: the value changes over the life of the resource, and another field of the resource
//   records when it last changed. Examples: every resource's state (with
//   `status.state_transition_time`), a compute instance's running instance type (with
//   `status.instance_type_transition_time`), a cluster's version (with
//   `status.version_transition_time`), an external IP's attachment and attribution (with
//   `status.attachment_transition_time`). The database enforces the pairing: a changed value
//   must carry a later change time, and a write that changes the time without the value keeps
//   the old one.
//
// - FIXED_ONCE_SET: starts empty, is set once when the system first observes the value, and
//   never changes after that. Its value is treated as known from creation, which is safe
//   because metering only uses it while the resource is billable, and it is set by then.
//   Examples: a volume's vendor volume ID and provisioned capacity, an external IP's allocated
//   address, a bare metal instance's cluster and node set.
enum MeteringFieldKind {
  // The field is not tracked. Never used on an annotated field.
  METERING_FIELD_KIND_UNSPECIFIED = 0;

  // The field's value varies over the life of the resource, and another field holds the time
  // of each change, for example a resource's state with its `state_transition_time`. A changed
  // value must carry a later change time; a write that changes the time without the value
  // keeps the old time.
  METERING_FIELD_KIND_VARIES = 1;

  // The field is set when the resource is created and never changes, for example a compute
  // instance's boot disk size or a volume's storage tier. Only annotate a field this way when
  // the API already rejects changing it.
  METERING_FIELD_KIND_CONSTANT = 2;

  // The field starts empty, is set once, and never changes after, for example a volume's
  // vendor volume ID or an external IP's allocated address. Its value is treated as known from
  // creation.
  METERING_FIELD_KIND_FIXED_ONCE_SET = 3;
}

// Options of a field that metering tracks.
message MeteringFieldOptions {
  // How metering tracks the field. See `MeteringFieldKind` for the meaning and examples of
  // each kind.
  MeteringFieldKind kind = 1;

  // Proto field path, relative to the resource message, of the timestamp field that holds the
  // time of the last change of this field. Required for varying fields, empty for the other
  // kinds. Example: the state of a compute instance names
  // `status.state_transition_time`.
  string transition_time = 2;

  // Names the resource type this field's reference points at, when the field carries the
  // resource's ownership root: for example a bare metal instance's cluster names "Cluster".
  // Metering resolves the root by this annotation, gates the resource's billing on the
  // root's states, and attributes the resource's usage under it. The field must be fixed
  // once set, and the value metering uses is the reference's id, which never changes.
  string owner_resource = 3;
}

extend google.protobuf.FieldOptions {
  MeteringFieldOptions metering = 50002;
}
