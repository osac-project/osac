---
- name: Verify Netris parent-network deletion handles concurrent removal
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Exercise the VirtualNetwork and ExternalIPPool delete playbooks
      ansible.builtin.command:
        argv:
          - uv
          - run
          - python
          - "{{ playbook_dir }}/../files/verify_parent_delete.py"
      args:
        chdir: "{{ playbook_dir }}/../../../../../"
      changed_when: false
