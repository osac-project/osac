namespace: osac-csi-backends

imagePullSecrets: []

trident:
  enabled: false
  image:
    repository: registry.connect.redhat.com/netapp/trident
    tag: 25.10.0
  service:
    port: 50051
  config:
    certsSecret: ""

vast:
  enabled: false
  image:
    repository: docker.io/vastdataorg/csi
    tag: v2.6.8
  service:
    port: 50051
  # VAST serves one plugin type per process, so each enabled protocol runs its
  # own controller. The plugin name is the protocol key; the image accepts only
  # "block", "nfs" and "cosi". The block controller is named vast-csi-controller
  # and the NFS controller vast-csi-controller-nfs.
  protocols:
    block:
      enabled: true
    nfs:
      enabled: false
  config:
    # X_CSI_MODE for the vendor controller:
    #   "controller"           -> controller-only; the operator issues only
    #                             controller RPCs, so node-side NVMe probes
    #                             (which need the host FS at /host) are skipped.
    #   "controller_and_node"  -> vendor default; crashes for the block plugin
    #                             where /host is unavailable.
    mode: controller
    vmsHost: ""
    vipPoolName: ""
    nfsExport: /k8s
    viewPolicy: default
    verifySsl: "true"
    credentialsSecret: ""

pure:
  enabled: false
  image:
    repository: docker.io/portworx/px-pure-csi-driver
    tag: "26.2.2"
  service:
    port: 50051
  config:
    credentialsSecret: ""
    clusterUuid: ""
    nodePluginNamespace: ""
