---
# Run after importing one BMH inventory server and one BCM server with
# resource_class = bm.large into a disposable cluster with Agent CRDs.
- name: Verify imported Agents carry the selectable instance type
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Require imported Agent names and namespace
      ansible.builtin.assert:
        that:
          - import_agent_namespace is defined
          - bmh_imported_agent_name is defined
          - bcm_imported_agent_name is defined

    - name: Read BMH and BCM imported Agents
      kubernetes.core.k8s_info:
        api_version: agent-install.openshift.io/v1beta1
        kind: Agent
        name: "{{ item }}"
        namespace: "{{ import_agent_namespace }}"
      loop:
        - "{{ bmh_imported_agent_name }}"
        - "{{ bcm_imported_agent_name }}"
      register: imported_agents

    - name: Verify each Agent selects the requested BMIT only
      ansible.builtin.assert:
        that:
          - item.resources | length == 1
          - item.resources[0].metadata.labels['osac.openshift.io/instance_type'] == 'bm.large'
          - "'osac.openshift.io/resource_class' not in item.resources[0].metadata.labels"
      loop: "{{ imported_agents.results }}"
      loop_control:
        label: "{{ item.item }}"
