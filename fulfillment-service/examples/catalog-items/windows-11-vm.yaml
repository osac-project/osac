# Windows 11 Virtual Machine catalog item
# A Windows 11 desktop virtual machine.

'@type': type.googleapis.com/osac.private.v1.ComputeInstanceCatalogItem
metadata:
  name: windows-11-vm
title: Windows 11 Virtual Machine
description: A Windows 11 desktop virtual machine with customizable resources.
template:
  id: osac.templates.ocp_virt_vm
  shared: true
published: true
fields:
  instance_type:
    editable:
      default_value:
        name: u1-medium
        shared: true
  boot_disk:
    size_gib:
      editable:
        default_value: 120
  disk_image:
    editable:
      default_value:
        name: windows-11
        shared: true
  run_strategy:
    editable:
      default_value: COMPUTE_INSTANCE_RUN_STRATEGY_ALWAYS
  user_data:
    editable: {}
