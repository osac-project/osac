name: Check Floating Image Tags

on:
  workflow_call:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      changes: ${{ steps.filter.outputs.changes || '[]' }}
    steps:
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4.0.2
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            fulfillment-service:
              - 'fulfillment-service/charts/**/values.yaml'
              - '.github/scripts/check-floating-tags.sh'
              - '.github/workflows/check-floating-tags.yaml'
            osac-operator:
              - 'osac-operator/charts/**/values.yaml'
              - '.github/scripts/check-floating-tags.sh'
              - '.github/workflows/check-floating-tags.yaml'
            bare-metal-fulfillment-operator:
              - 'bare-metal-fulfillment-operator/charts/**/values.yaml'
              - '.github/scripts/check-floating-tags.sh'
              - '.github/workflows/check-floating-tags.yaml'
            osac-installer:
              - 'osac-installer/charts/**/values.yaml'
              - '.github/scripts/check-floating-tags.sh'
              - '.github/workflows/check-floating-tags.yaml'
            osac-aap:
              - 'osac-aap/charts/**/values.yaml'
              - '.github/scripts/check-floating-tags.sh'
              - '.github/workflows/check-floating-tags.yaml'

  check-floating-tags:
    name: Reject unmarked floating tags (${{ matrix.component }})
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.changes) }}
    if: needs.changes.outputs.changes != '[]'
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Check for unmarked floating image tags
      working-directory: ${{ matrix.component }}
      run: bash ../.github/scripts/check-floating-tags.sh
