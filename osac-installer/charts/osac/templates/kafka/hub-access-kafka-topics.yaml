{{/*
The fulfillment onboarding reconciler creates each tenant's Kafka topics
through the hub-access identity, the same identity it uses for the local
cluster's Tenant resources and namespaces. The role grants only what the
reconciler does: topics are created and corrected, never deleted, so the
delete verb is absent. Topic deletion belongs to the future offboarding flow
that runs after a tenant's final invoice.
*/}}
{{- if and .Values.kafka.enabled .Values.service.enabled .Values.hubAccess.enabled }}
{{- $ns := .Values.kafka.clusterNamespace | default "osac-kafka" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Namespace }}-hub-access-kafka-topics
  namespace: {{ $ns }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - kafka.strimzi.io
    resources:
      - kafkatopics
    verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Namespace }}-hub-access-kafka-topics
  namespace: {{ $ns }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Namespace }}-hub-access-kafka-topics
subjects:
  - kind: ServiceAccount
    name: hub-access
    namespace: {{ .Release.Namespace }}
{{- end }}
