---
name: osac-csi-storage
title: OSAC CSI Storage Provider
description: >
  Creates per-tier StorageClasses for the OSAC CSI driver (csi.osac.openshift.io) on a
  CaaS tenant cluster. Requires the driver to be registered on that cluster and does not
  install it. Places no credentials on the cluster. Volume requests are routed through
  the hub-side OSAC fulfillment service.

template_type: storage_provider
implementation_strategy: osac_csi
capabilities:
  supported_protocols:
    - nfs    # NOTE: NFS volumes will provision but metering and policy enforcement are not yet implemented
    - block
  provisioning_targets:
    - caas
