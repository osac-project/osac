---
# Per-backend teardown_backend body, loop-included from teardown_backend.yaml.
# Marks the hub lifecycle Secret (ontap-tenant-<assignment_key>) — and any
# fallback annotation-based prepared Secret (osac-<assignment_key>-credentials) —
# as 'retained' after verifying tenant UID ownership when available. Never
# deletes ONTAP SVMs, LIFs, accounts, QoS policies, or admin preparation Secrets.

- name: Compute assignment key for backend {{ _ontap_backend_id }}
  ansible.builtin.set_fact:
    _assignment_key: >-
      {{ ((_ontap_backend_id ~ '|' ~ tenant_name) | hash('sha256'))[:16] | lower }}
    _lifecycle_secret_name: "ontap-tenant-{{ ((_ontap_backend_id ~ '|' ~ tenant_name) | hash('sha256'))[:16] | lower }}"
    _prepared_secret_name: "osac-{{ ((_ontap_backend_id ~ '|' ~ tenant_name) | hash('sha256'))[:16] | lower }}-credentials"

- name: Read the hub lifecycle Secret and fallback prepared Secret
  block:
    - name: Read the hub lifecycle Secret from the hub cluster
      kubernetes.core.k8s_info:
        kubeconfig: ~
        api_version: v1
        kind: Secret
        name: "{{ _lifecycle_secret_name }}"
        namespace: "{{ storage_provider_config_namespace }}"
      register: _lifecycle_secret_result
      no_log: true

    - name: Retain the hub lifecycle Secret (atomic resourceVersion patch)
      when: >-
        _lifecycle_secret_result.resources | length > 0 and
        (_lifecycle_secret_result.resources[0].data.lifecycle_stage | default('') | b64decode) == 'claimed'
      block:
        - name: Verify lifecycle Secret ownership when tenant_uid is available
          ansible.builtin.fail:
            msg: >-
              Refusing to release the prepared assignment
              '{{ _assignment_key }}': the hub lifecycle Secret belongs to a
              different tenant UID.
          when: >-
            tenant_uid is defined and tenant_uid | default('') | length > 0 and
            (_lifecycle_secret_result.resources[0].data.tenant_uid | default('') | b64decode) | length > 0 and
            (_lifecycle_secret_result.resources[0].data.tenant_uid | default('') | b64decode) != tenant_uid

        - name: Patch the hub lifecycle Secret stage to retained
          kubernetes.core.k8s:
            kubeconfig: ~
            state: patched
            api_version: v1
            kind: Secret
            name: "{{ _lifecycle_secret_name }}"
            namespace: "{{ storage_provider_config_namespace }}"
            resource_definition:
              metadata:
                resourceVersion: "{{ _lifecycle_secret_result.resources[0].metadata.resourceVersion | string }}"
              stringData:
                lifecycle_stage: "retained"
          no_log: true

    - name: Read the fallback prepared Secret from the hub cluster
      kubernetes.core.k8s_info:
        kubeconfig: ~
        api_version: v1
        kind: Secret
        name: "{{ _prepared_secret_name }}"
        namespace: "{{ storage_provider_config_namespace }}"
      register: _prepared_secret_result
      no_log: true

    - name: Release the fallback prepared Secret claim (atomic resourceVersion patch)
      when: >-
        _prepared_secret_result.resources | length > 0 and
        _prepared_secret_result.resources[0].metadata.annotations is defined and
        _prepared_secret_result.resources[0].metadata.annotations['osac.openshift.io/storage-assignment-state'] | default('') == 'claimed'
      block:
        - name: Verify fallback prepared Secret ownership when tenant_uid is available
          ansible.builtin.fail:
            msg: >-
              Refusing to release the prepared assignment
              '{{ _assignment_key }}': the prepared Secret is claimed by a
              different tenant UID.
          when: >-
            tenant_uid is defined and tenant_uid | default('') | length > 0 and
            _prepared_secret_result.resources[0].metadata.annotations['osac.openshift.io/storage-tenant-uid'] | default('') != tenant_uid

        - name: Patch the fallback prepared Secret assignment state to retained
          kubernetes.core.k8s:
            kubeconfig: ~
            state: patched
            api_version: v1
            kind: Secret
            name: "{{ _prepared_secret_name }}"
            namespace: "{{ storage_provider_config_namespace }}"
            resource_definition:
              metadata:
                resourceVersion: "{{ _prepared_secret_result.resources[0].metadata.resourceVersion | string }}"
                annotations:
                  osac.openshift.io/storage-assignment-state: retained
          no_log: true

    - name: Report the release
      ansible.builtin.debug:
        msg: >-
          Released prepared assignment '{{ _assignment_key }}' (backend
          '{{ _ontap_backend_id }}') — state set to retained. ONTAP resources
          and admin preparation Secrets are kept per the netapp-onboarding
          contract.

  rescue:
    - name: Warn about teardown_backend failure
      ansible.builtin.debug:
        msg: >-
          Failed to release the prepared assignment for backend
          '{{ _ontap_backend_id }}'.
          Error: {{ ansible_failed_result.msg | default('unknown') }}

  always:
    - name: Clear credential-bearing facts
      ansible.builtin.set_fact:
        _lifecycle_secret_result: {}
        _prepared_secret_result: {}
      no_log: true
