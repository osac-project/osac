---
# NetApp teardown_backend: retain pre-provisioned ONTAP backend resources.
# The SVM, its LIFs, runtime accounts, and QoS policy groups are prepared by
# the storage administrator and never created by this role, so this role
# never deletes them; releasing a prepared SVM assignment is the caller's
# responsibility. This role writes no hub Secret, so there is none to remove.
# Cluster-side K8s resources belong to teardown_cluster_storage.

- name: Fail if any dispatched tier has an invalid backend_id
  ansible.builtin.fail:
    msg: >-
      Every tier dispatched to the ONTAP provider must provide a non-empty
      string backend_id before teardown can run.
  when: >-
    (
      _provider_tiers | default([])
      | selectattr('backend_id', 'defined')
      | map(attribute='backend_id')
      | select('string')
      | map('trim')
      | reject('equalto', '')
      | list | length
    ) != (_provider_tiers | default([]) | length)
  no_log: true

- name: Fail if no backend ids could be resolved
  ansible.builtin.fail:
    msg: >-
      Could not resolve any backend_id from the dispatched tiers. The ONTAP
      provider requires backend_id on every tier.
  when: >-
    (_provider_tiers | default([]) | map(attribute='backend_id') | select('string') | map('trim') | reject('equalto', '') | unique(case_sensitive=true) | list | length) == 0
  no_log: true

- name: Report retention of pre-provisioned ONTAP backend resources
  ansible.builtin.debug:
    msg: >-
      Retaining administrator-prepared ONTAP SVMs, accounts, and QoS policy
      groups; this role does not create or delete them.
