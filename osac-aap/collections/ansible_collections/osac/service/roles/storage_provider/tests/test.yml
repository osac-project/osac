              - "'default' in osac_storage_provider_failures[0].tiers"
              - "'be-999' in osac_storage_provider_failures[0].backend_ids"
              - "\"No entry for backend_id 'be-999'\" in osac_storage_provider_failures[0].message"
            fail_msg: >-
