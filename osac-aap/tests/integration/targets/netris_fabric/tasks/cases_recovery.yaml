  vars:
    nf_task: attach_external_ip
    sft_label: eiprec-attach-lost-response
    sft_expect: retryable
    nf_job: "{{ nf_eipa_job }}"

- name: EIP recovery - the rerun adopts the DNAT rule
  ansible.builtin.include_tasks: run_task.yaml
  vars:
    nf_task: attach_external_ip
    sft_label: eiprec-attach-rerun
    sft_expect: success
    nf_job: "{{ nf_eipa_job }}"
    nf_result: {}

- name: EIP recovery - one DNAT rule
  ansible.builtin.assert:
    that:
      - nf_state.nats | selectattr('name', 'equalto', 'osac-eipa-' ~ nf_ids.eipa) | list | length == 1
      - nf_writes == []
