image:
  repository: ghcr.io/osac-project/metering-service
  tag: latest
  pullPolicy: Always

# Fulfillment address is auto-derived from release namespace.
# Override fulfillment.address for cross-namespace/cross-cluster (OSAC-3537).

database:
  connection: []

heartbeat:
  interval: "60s"

reconciliation:
  interval: "60m"

certs:
  caBundle:
    configMap: ca-bundle

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Kafka connection and topic naming. Override to point at a different
# Kafka cluster or to prefix topics for per-instance isolation.
kafka:
  brokers: ""          # default: osac-kafka-kafka-bootstrap.osac-kafka.svc.cluster.local:9093
  clusterName: ""      # default: osac-kafka
  clusterNamespace: "" # default: osac-kafka
  caSecret: ""         # default: osac-kafka-cluster-ca-cert

# Prefix prepended to all topic names (e.g. "pr101" -> "pr101.osac.metering.lifecycle").
# When set, this chart skips KafkaTopic/KafkaUser creation (the parent chart owns them).

## Echo adapter — test/development tool only, not for production use.
## Enable and configure via environment-specific values (e.g., values/vmaas-ci/values.yaml).
echoAdapter:
  enabled: false
  # image:
  #   repository: ghcr.io/osac-project/metering-echo-adapter
  #   tag: latest
  #   pullPolicy: Always

## M360 adapter — forwards metering events to Monetize360 Usage API.
m360Adapter:
  enabled: false
  image:
    repository: ghcr.io/osac-project/metering-m360-adapter
    tag: latest
    pullPolicy: Always
  m360:
    apiUrl: ""
    apiKeySecret: ""     # name of K8s Secret with key "api-key"
    apiVersion: "v1"

## Cost Management adapter — batches canonical CloudEvents into Cost's
## durable ingress endpoint. The API token is mounted from a Secret.
costManagementAdapter:
  enabled: false
  image:
    repository: ghcr.io/osac-project/metering-cost-management-adapter
    tag: latest
    pullPolicy: Always
  costManagement:
    apiUrl: ""
    apiTokenSecret: "" # name of a K8s Secret with key "api-token"
