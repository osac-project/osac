---
# Delete the Netris objects of a VirtualNetwork: the IPAM allocation, then the
# VPC, which frees the L3 VNI. An object that is already gone is a success.
# OSAC owns the delete ordering, so there is no default-network refusal here.
- name: Delete the VirtualNetwork from Netris
  block:
    - name: Check the settings
      ansible.builtin.include_tasks: _settings.yaml
      vars:
        netris_require: [controller, credentials, tenant]

    - name: Check the task input
      ansible.builtin.include_tasks: _input.yaml

    - name: Build the object names
      ansible.builtin.include_tasks: _names.yaml

    - name: Look up the VPC
      ansible.builtin.include_role:
        name: netris.controller.vpc
        tasks_from: read
      vars:
        vpc_name: "{{ netris_names.vpc }}"
        vpc_tenant_id: "{{ netris_tenant_id | int }}"

    - name: Delete the IPAM allocation
      ansible.builtin.include_role:
        name: netris.controller.ipam
        tasks_from: delete_allocation
      vars:
        ipam_name: "{{ netris_names.vn_ipam }}"
        ipam_vpc_id: "{{ netris_vpc.id }}"
        ipam_expected_fields:
          "tenant.id": "{{ netris_tenant_id | int }}"
          "vpc.id": "{{ netris_vpc.id }}"
      when: netris_vpc is mapping

    - name: Delete the VPC
      ansible.builtin.include_role:
        name: netris.controller.vpc
        tasks_from: delete
      vars:
        vpc_name: "{{ netris_names.vpc }}"
        vpc_tenant_id: "{{ netris_tenant_id | int }}"
      when: netris_vpc is mapping
  rescue:
    - name: Report the error
      ansible.builtin.include_tasks: _rescue.yaml
