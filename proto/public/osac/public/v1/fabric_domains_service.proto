syntax = "proto3";

package osac.public.v1;

import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "osac/public/v1/fabric_domain_type.proto";

message FabricDomainsListRequest {
  optional int32 offset = 1;
  optional int32 limit = 2;
  optional string filter = 3;
  optional string order = 4;
}

message FabricDomainsListResponse {
  int32 size = 1;
  int32 total = 2;
  repeated FabricDomain items = 3;
}

message FabricDomainsGetRequest { string id = 1; }
message FabricDomainsGetResponse { FabricDomain object = 1; }
message FabricDomainsCreateRequest { FabricDomain object = 1; }
message FabricDomainsCreateResponse { FabricDomain object = 1; }

message FabricDomainsUpdateRequest {
  FabricDomain object = 1;
  google.protobuf.FieldMask update_mask = 2;
  bool lock = 3;
}

message FabricDomainsUpdateResponse { FabricDomain object = 1; }
message FabricDomainsDeleteRequest { string id = 1; }
message FabricDomainsDeleteResponse {}

service FabricDomains {
  rpc List(FabricDomainsListRequest) returns (FabricDomainsListResponse) {
    option (google.api.http) = {get: "/api/fulfillment/v1/fabric_domains"};
  }
  rpc Get(FabricDomainsGetRequest) returns (FabricDomainsGetResponse) {
    option (google.api.http) = {get: "/api/fulfillment/v1/fabric_domains/{id}" response_body: "object"};
  }
  rpc Create(FabricDomainsCreateRequest) returns (FabricDomainsCreateResponse) {
    option (google.api.http) = {post: "/api/fulfillment/v1/fabric_domains" body: "object" response_body: "object"};
  }
  rpc Update(FabricDomainsUpdateRequest) returns (FabricDomainsUpdateResponse) {
    option (google.api.http) = {patch: "/api/fulfillment/v1/fabric_domains/{object.id}" body: "object" response_body: "object"};
  }
  rpc Delete(FabricDomainsDeleteRequest) returns (FabricDomainsDeleteResponse) {
    option (google.api.http) = {delete: "/api/fulfillment/v1/fabric_domains/{id}"};
  }
}
