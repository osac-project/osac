# Kind dev-full overlay -- layered on top of kind-instance.yaml (PROFILE=dev-full).
#
# Keep Subnet provisioning enabled so every tenant's cudn_net AAP job creates
# its target namespace and ClusterUserDefinedNetwork object. Kind installs an
# API-only fake CUDN CRD from kind-infra.yaml; it accepts the object but does not
# provide a CUDN/OVN dataplane or validate tenant subnet isolation. VMs continue
# to use Kind's default pod network and the cluster-wide l2bridge binding.
operator:
  image:
    pullPolicy: IfNotPresent
  controllers:
    networkingProvisioning: true
    storage: true
    volume: true

# Reuse the local storage registration hook so tenant onboarding provisions a
# tenant-labeled TopoLVM StorageClass for the existing "local" storage tier.
lvms:
  enabled: true

# --- Browser-reachable endpoints (dev-full only) ---
# dev-full drives the full "create a VM from the UI" flow in a real browser, so
# the fulfillment API and the OIDC issuer must be reachable *from the host* without
# any /etc/hosts editing. Any `*.localhost` name resolves to 127.0.0.1 host-side,
# and CoreDNS rewrites `*.localhost` back to the in-cluster service names, so these
# names resolve correctly BOTH from the browser (→ gateway on :8443) and in-cluster
# (→ the real service). The plain `dev`/IT profile keeps the *.svc.cluster.local
# names (kind-instance.yaml) because its test client uses /etc/hosts.
#
# The public and internal API hostnames both use localhost so their TLSRoutes
# can be reached through the host port mapping. CoreDNS rewrites these names
# back to the in-cluster Services for controller traffic.
service:
  externalHostname: fulfillment-api.osac.localhost
  internalHostname: fulfillment-internal-api.osac.localhost
  images:
    service:
      pullPolicy: IfNotPresent
    envoy:
      pullPolicy: IfNotPresent
  auth:
    issuerUrl: https://keycloak.osac.localhost:8443/realms/osac
  idp:
    url: https://keycloak.osac.localhost:8443
  vault:
    keycloakIssuerUrl: "https://keycloak.osac.localhost:8443/realms/osac"
