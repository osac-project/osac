            state: absent
            api_version: "{{ item.api }}"
            kind: "{{ item.kind }}"
            name: "{{ item.name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
          loop:
            - api: kubevirt.io/v1
              kind: VirtualMachine
              name: "{{ compute_instance_name }}"
            - api: kubevirt.io/v1
              kind: VirtualMachineInstance
              name: "{{ compute_instance_name }}"
            - api: v1
              kind: Pod
              name: >-
                virt-launcher-{{
                compute_instance_name }}
