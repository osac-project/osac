  1.28.0:
    changes:
      bugfixes:
      - purefb_bucket - Fixed a task that does not specify ``versioning`` silently
        suspending versioning on an existing versioned bucket, because the parameter
        defaulted to ``absent``.
      - purefb_bucket - Fixed idempotency error when ``versioning`` is ``absent``
        and the bucket's versioning is already ``suspended``. The module sent the
        literal string ``absent`` to the API, which rejected it with "Versioning can
        only be set to 'enabled' or 'suspended'".
      - purefb_info - Fix AttributeError in `policies` subset when any policy exists;
        `snapshot_policies` now reports snapshot policies with rules and `policies`
        reports a cross-type policy summary
      - purefb_info - Fix AttributeError in `snapshot_policies` subset when a policy
        has no rules, or when an older py-pure-client returns a policy object without
        a `rules` attribute
      - purefb_info - Fix default subset version gating so encryption, network access
        protocol and remote assist duration details are reported when the array supports
        them
      - purefb_info - Fixed the ``arrays`` subset raising ``AttributeError`` on any
        array with a replication connection. The loop variable was rebound to the
        remote array name before every field was read from it, so ``gather_subset=all``
        failed too.
      - purefb_info - Fixed the ``policies`` subset raising ``AttributeError`` when
        a bucket access policy exists. ``BucketAccessPolicy`` has no ``description``
        field, unlike the object store access policy reported alongside it; the key
        is now reported as null.
      - purefb_info - The ``default`` subset's ``api_versions`` value now reports
        the highest REST API version the array supports, rather than the lowest. It
        previously read the first entry of the supported-versions list.
      - purefb_kmip - Fixed ``state=test`` reporting ``changed=true`` for what is
        a read-only connectivity check.
      - purefb_kmip - Fixed the 3000 character limit being applied to ``certificate``,
        a name, rather than to the certificate text it was documented against.
      - purefb_kmip - Fixed the module being entirely non-functional. ``ca_certificate``
        was sent as certificate text where the API expects a reference to a certificate
        already on the array, raising ``ValidationError``; ``certificate`` was sent
        as a field that does not exist on any REST version, so it was silently discarded;
        and reading it back raised ``AttributeError``, so updates could not complete
        at all.
      - purefb_network - Added ``attached_server`` parameter so a network interface
        can be attached to a specific server rather than always landing on the default
        server, and so an existing interface can be moved to another server. Requires
        REST API 2.16 or higher.
      - purefb_realm - Pass the new optional ``without_default_access_list`` parameter
        (default false) to post_realms, as required by py-pure-client when creating
        a realm
      - purefb_server - Correct the ``directory_service`` update path which wrote
        to ``Server.dns`` instead of ``Server.directory_services`` and could silently
        replace the DNS list.
      - "purefb_server - Fix ``ValidationError`` on ``state=present`` when ``dns``
        or ``directory_service`` is set \u2014 the update path passed the whole list
        to ``Reference(name=...)`` instead of iterating."
      - purefb_server - Fixed ``dns`` and ``directory_service`` updates being applied
        to the array even when running in check mode.
      - purefb_server - When a server existed and it should update the existing server.
        This will use the dns variable from the loop instead of referencing it.
      - purefb_userpolicy - Fix adding a policy to an existing user silently failing
        to persist on REST 2.17+ while still reporting changed, due to a stray second
        non-context POST
      deprecated_features:
      - purefb_fs - Deprecate ``client_policy`` in favour of ``purefb_export`` (uses
        File System Exports); Purity//FB marks the underlying ``smb.client_policy``
        as deprecated. Removed in 2.0.0
      - purefb_fs - Deprecate ``export_policy`` in favour of ``purefb_export`` (uses
        File System Exports); Purity//FB marks the underlying ``nfs.export_policy``
        as deprecated. Removed in 2.0.0
      - purefb_fs - Deprecate ``share_policy`` in favour of ``purefb_export`` (uses
        File System Exports); Purity//FB marks the underlying ``smb.share_policy``
        as deprecated. Removed in 2.0.0
      - purefb_info - Deprecate ``filesystems`` subset keys ``nfs_rules``, ``export_policy``,
        ``smb_client_policy`` and ``smb_share_policy``; use ``file_system_exports``
        instead. Removed in 2.0.0
