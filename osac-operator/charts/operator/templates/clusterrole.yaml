apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "osac-operator.fullname" . }}-manager
  labels:
    {{- include "osac-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  - serviceaccounts
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  # The controller reconciles tenant ClusterOrder namespaces and dynamically
  # created per-order probe namespaces. A static RoleBinding cannot enumerate
  # that namespace set; keep this grant limited to the owned probe names in
  # controller code and validate tenant/owner references before mutation.
  verbs:
  - create
  - delete
  - get
  - list
  - update
  - watch
# Only read the OpenShift-managed ingress trust bundle (no Secret access).
# ClusterOrder management Route probes use it independently of ignition trust.
- apiGroups:
  - ""
  resources:
  - configmaps
  resourceNames:
  - default-ingress-cert
  verbs:
  - get
- apiGroups:
  - agent-install.openshift.io
  resources:
  - agents
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  # Probe Pods are created in dynamic ClusterOrder namespaces; see the Secret
  # rule above for why this remains a cluster role rather than a fixed Role.
  verbs:
  - create
  - delete
  - get
  - list
  - watch
- apiGroups:
  - cdi.kubevirt.io
  resources:
  - datavolumes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - agent-install.openshift.io
  resources:
  - agents
  verbs:
  - delete
  - get
  - list
  - patch
  - watch
- apiGroups:
  - agent-install.openshift.io
  resources:
  - infraenvs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - agent-install.openshift.io
  resources:
  - nmstateconfigs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - capi-provider.agent-install.openshift.io
  resources:
  - agentmachines
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - hypershift.openshift.io
  resources:
  - hostedclusters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - hypershift.openshift.io
  resources:
  - nodepools
  verbs:
  - get
  - list
  - patch
  - update
  - watch
# HostedControlPlane access is cached by the storage controller.
- apiGroups:
  - hypershift.openshift.io
  resources:
  - hostedcontrolplanes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - route.openshift.io
  resources:
  - routes
  verbs:
  - get
  - list
- apiGroups:
  - kubevirt.io
  resources:
  - virtualmachineinstances
  - virtualmachines
  verbs:
  - delete
  - get
  - list
  - watch
- apiGroups:
  - osac.openshift.io
  resources:
  - baremetalinstances
  - clusterorders
  - computeinstances
  - externalipattachments
  - externalippools
  - externalips
  - natgateways
  - networkattachments
  - securitygroups
  - subnets
  - tenants
  - virtualnetworks
  - volumes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - osac.openshift.io
  resources:
  - fabricdomains
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - osac.openshift.io
  resources:
  - baremetalinstances/finalizers
  - clusterorders/finalizers
  - computeinstances/finalizers
  - externalipattachments/finalizers
  - externalippools/finalizers
  - externalips/finalizers
  - natgateways/finalizers
  - networkattachments/finalizers
  - securitygroups/finalizers
  - subnets/finalizers
  - tenants/finalizers
  - virtualnetworks/finalizers
  - volumes/finalizers
  verbs:
  - update
- apiGroups:
  - osac.openshift.io
  resources:
  - fabricdomains/finalizers
  verbs:
  - update
- apiGroups:
  - osac.openshift.io
  resources:
  - baremetalinstances/status
  - clusterorders/status
  - computeinstances/status
  - externalipattachments/status
  - externalippools/status
  - externalips/status
  - natgateways/status
  - networkattachments/status
  - securitygroups/status
  - subnets/status
  - tenants/status
  - virtualnetworks/status
  - volumes/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - osac.openshift.io
  resources:
  - fabricdomains/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - osac.openshift.io
  resources:
  - networkclasses
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - osac.openshift.io
  resources:
  - networkclasses/finalizers
  verbs:
  - update
- apiGroups:
  - osac.openshift.io
  resources:
  - networkclasses/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - rolebindings
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - storage.k8s.io
  resources:
  - storageclasses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - topolvm.io
  resources:
  - logicalvolumes
  verbs:
  - create
  - delete
  - get
  - list
  - watch
- nonResourceURLs:
  - /metrics
  verbs:
  - get
