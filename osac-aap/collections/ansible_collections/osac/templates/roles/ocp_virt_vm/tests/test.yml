            compute_instance: "{{ lookup('file', 'fixtures/computeinstance-missing-vcpus-test.yaml') | from_yaml }}"

        - name: Set compute instance name
          ansible.builtin.set_fact:
            compute_instance_name: "{{ compute_instance.metadata.name }}"

        - name: Run create_validate (expect failure — no spec.vcpus/memoryGiB)
          block:
