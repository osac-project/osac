{{- if .Values.testAdapter.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "osac-metering.fullname" . }}-test-adapter
  labels:
    {{- include "osac-metering.labels" . | nindent 4 }}
    app.kubernetes.io/component: test-adapter
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "osac-metering.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: test-adapter
{{- end }}
