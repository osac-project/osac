- name: Get list of existing AddOnOperators
  ansible.builtin.uri:
    url: "{{ publish_templates_addon_operator_api_endpoint }}"
    validate_certs: "{{ publish_templates_validate_certs | default(true) | bool }}"
    headers:
      authorization: Bearer {{ osac_fulfillment_service_token }}
    status_code: [200, 404]
  register: addon_operator_check
  no_log: true

- name: Skip AddOnOperators when service is disabled
  ansible.builtin.debug:
    msg: "CaaS service not available (HTTP 404) - skipping AddOnOperator publishing"
  when: addon_operator_check.status == 404

- name: Create list of existing AddOnOperator IDs  # noqa: jinja[invalid]
  ansible.builtin.set_fact:
    addon_operator_ids: >-
      {{ addon_operator_check | json_query("json.items[].id") }}
  when: addon_operator_check.status != 404 and addon_operator_check is success and addon_operator_check.json.get('items', []) | length > 0

- name: Update existing AddOnOperator
  loop: "{{ osac_addon_operator_templates | default([]) }}"
  loop_control:
    label: "{{ template.id }}"
    loop_var: template
  when: addon_operator_check.status != 404 and addon_operator_ids is defined and template.id in addon_operator_ids
  ansible.builtin.uri:
    url: "{{ publish_templates_addon_operator_api_endpoint }}/{{ template.id }}?update_mask={{ publish_templates_addon_operator_update_mask }}"
    validate_certs: "{{ publish_templates_validate_certs | default(true) | bool }}"
    method: PATCH
    headers:
      authorization: Bearer {{ osac_fulfillment_service_token }}
    body_format: json
    body: "{{ template }}"
  no_log: true

- name: Create new AddOnOperator
  loop: "{{ osac_addon_operator_templates | default([]) }}"
  loop_control:
    label: "{{ template.id }}"
    loop_var: template
  when: addon_operator_check.status != 404 and (addon_operator_ids is not defined or template.id not in addon_operator_ids)
  ansible.builtin.uri:
    url: "{{ publish_templates_addon_operator_api_endpoint }}"
    validate_certs: "{{ publish_templates_validate_certs | default(true) | bool }}"
    method: POST
    headers:
      authorization: Bearer {{ osac_fulfillment_service_token }}
    body_format: json
    body: "{{ template }}"
  no_log: true
