---
- name: Assert the workload kubeconfig reaches a distinct Kubernetes API
  hosts: localhost
  gather_facts: true

  vars:
    tenant_name: storage-route-native-driver
    tenant_namespace: osac-system
    storage_provider_netapp_trident_install_override:
      name: osac.test_overrides.csi_driver_install_hooks
      tasks_from: install.yaml

  tasks:
    - name: Read any pre-existing native CSI install Lease on the management cluster
      kubernetes.core.k8s_info:
        api_version: coordination.k8s.io/v1
        kind: Lease
        name: provider-native-csi-install-lock
        namespace: osac-system
      register: _routing_existing_native_csi_lease

    - name: Require the native CSI install Lease to be clear before routing test
      ansible.builtin.assert:
        that:
          - _routing_existing_native_csi_lease.resources | length == 0
        fail_msg: >-
          The isolated storage target-routing test requires an unused native CSI
          install Lease on the management cluster.

    - name: Verify workload API routing and native CSI installation
      block:
        - name: Create a marker namespace on the workload API
          kubernetes.core.k8s:
            kubeconfig: "{{ routing_test_kubeconfig_path }}"
            state: present
            definition:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: "{{ routing_test_marker_namespace }}"

        - name: Check the marker namespace is absent from management
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Namespace
            name: "{{ routing_test_marker_namespace }}"
          register: _routing_management_marker

        - name: Check the marker namespace exists on workload
          kubernetes.core.k8s_info:
            kubeconfig: "{{ routing_test_kubeconfig_path }}"
            api_version: v1
            kind: Namespace
            name: "{{ routing_test_marker_namespace }}"
          register: _routing_workload_marker

        - name: Assert the API endpoints are distinct
          ansible.builtin.assert:
            that:
              - _routing_management_marker.resources | length == 0
              - _routing_workload_marker.resources | length == 1
            fail_msg: >-
              Workload marker namespace must exist only on the workload API; observed
              management/workload counts {{ _routing_management_marker.resources | length }}/
              {{ _routing_workload_marker.resources | length }}.

        # This isolated workload Kind cluster has no OLM controller. The installer
        # override avoids real OLM work, but the production path still creates the
        # Trident OperatorGroup before reaching that override, so provide only the
        # CRD API surface required by the routing test.
        - name: Create the minimal OperatorGroup CRD on the workload API
          kubernetes.core.k8s:
            kubeconfig: "{{ routing_test_kubeconfig_path }}"
            state: present
            definition:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: operatorgroups.operators.coreos.com
              spec:
                group: operators.coreos.com
                scope: Namespaced
                names:
                  plural: operatorgroups
                  singular: operatorgroup
                  kind: OperatorGroup
                  listKind: OperatorGroupList
                versions:
                  - name: v1
                    served: true
                    storage: true
                    schema:
                      openAPIV3Schema:
                        type: object
                        properties:
                          spec:
                            type: object
                            properties:
                              targetNamespaces:
                                type: array
                                items:
                                  type: string

        - name: Wait for the workload OperatorGroup API to be established
          kubernetes.core.k8s_info:
            kubeconfig: "{{ routing_test_kubeconfig_path }}"
            api_version: apiextensions.k8s.io/v1
            kind: CustomResourceDefinition
            name: operatorgroups.operators.coreos.com
          register: _routing_workload_operator_group_crd
          retries: 30
          delay: 1
          until: >-
            _routing_workload_operator_group_crd.resources | length > 0 and
            (_routing_workload_operator_group_crd.resources[0].status.conditions
             | default([])
             | selectattr('type', 'equalto', 'Established')
             | selectattr('status', 'equalto', 'True')
             | list | length > 0)

        - name: Ensure the NetApp block driver through the selected workload kubeconfig
          ansible.builtin.include_role:
            name: osac.service.storage_provider
          vars:
            storage_provider_action: ensure_csi_driver
            storage_provider_tiers:
              - name: fast
                protocol: block
                provider: netapp
                backend_id: be-routing-test
            storage_provider_target_kubeconfig: "{{ routing_test_kubeconfig_path }}"
            storage_provider_target_kubeconfig_insecure: false

        - name: Check Trident CSIDriver on the workload API
          kubernetes.core.k8s_info:
            kubeconfig: "{{ routing_test_kubeconfig_path }}"
            api_version: storage.k8s.io/v1
            kind: CSIDriver
            name: csi.trident.netapp.io
          register: _routing_workload_trident_driver

        - name: Check Trident CSIDriver on the management API
          kubernetes.core.k8s_info:
            api_version: storage.k8s.io/v1
            kind: CSIDriver
            name: csi.trident.netapp.io
          register: _routing_management_trident_driver

        - name: Assert native driver setup changed only the workload cluster
          ansible.builtin.assert:
            that:
              - _routing_workload_trident_driver.resources | length == 1
              - _routing_management_trident_driver.resources | length == 0
            fail_msg: >-
              Trident must be registered only on the selected workload API; observed
              workload/management counts {{ _routing_workload_trident_driver.resources | length }}/
              {{ _routing_management_trident_driver.resources | length }}.
      always:
        - name: Delete the test Trident OperatorGroup from the workload API
          kubernetes.core.k8s:
            kubeconfig: "{{ routing_test_kubeconfig_path }}"
            state: absent
            api_version: operators.coreos.com/v1
            kind: OperatorGroup
            name: trident-operator-group
            namespace: trident-operator
          failed_when: false

        - name: Delete the test Trident CSIDriver from the workload API
          kubernetes.core.k8s:
            kubeconfig: "{{ routing_test_kubeconfig_path }}"
            state: absent
            api_version: storage.k8s.io/v1
            kind: CSIDriver
            name: csi.trident.netapp.io
          failed_when: false

        - name: Delete the test TridentBackendConfig CRD from the workload API
          kubernetes.core.k8s:
            kubeconfig: "{{ routing_test_kubeconfig_path }}"
            state: absent
            api_version: apiextensions.k8s.io/v1
            kind: CustomResourceDefinition
            name: tridentbackendconfigs.trident.netapp.io
            wait: true
          failed_when: false

        - name: Delete the test Trident namespace from the workload API
          kubernetes.core.k8s:
            kubeconfig: "{{ routing_test_kubeconfig_path }}"
            state: absent
            api_version: v1
            kind: Namespace
            name: trident
            wait: true
          failed_when: false

        - name: Delete the test Trident operator namespace from the workload API
          kubernetes.core.k8s:
            kubeconfig: "{{ routing_test_kubeconfig_path }}"
            state: absent
            api_version: v1
            kind: Namespace
            name: trident-operator
            wait: true
          failed_when: false

        - name: Delete the test OperatorGroup CRD from the workload API
          kubernetes.core.k8s:
            kubeconfig: "{{ routing_test_kubeconfig_path }}"
            state: absent
            api_version: apiextensions.k8s.io/v1
            kind: CustomResourceDefinition
            name: operatorgroups.operators.coreos.com
            wait: true
          failed_when: false

        - name: Delete the native driver override log
          ansible.builtin.file:
            path: /tmp/osac_test_overrides.log
            state: absent
          failed_when: false

        - name: Remove the workload marker namespace
          kubernetes.core.k8s:
            kubeconfig: "{{ routing_test_kubeconfig_path }}"
            state: absent
            api_version: v1
            kind: Namespace
            name: "{{ routing_test_marker_namespace }}"
          failed_when: false

        # The test runner keeps its owner Pod alive for later lock-contention
        # scenarios. Remove this test's Lease even when installer tasks fail.
        - name: Delete the native CSI install Lease from the management cluster
          kubernetes.core.k8s:
            state: absent
            api_version: coordination.k8s.io/v1
            kind: Lease
            name: provider-native-csi-install-lock
            namespace: osac-system
          failed_when: false
