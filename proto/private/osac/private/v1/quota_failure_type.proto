syntax = "proto3";

package osac.private.v1;

import "cleanapi/cleanapi.proto";
import "osac/private/v1/quota_limit_type.proto";

option (cleanapi.file).package = "osac.public.v1";

// Explains why a request was refused by the quota check.
//
// The check attaches one QuotaFailure, with an ErrorInfo whose reason is `QUOTA_EXCEEDED`, to the
// `FAILED_PRECONDITION` error of a request that would take a scope over one of its limits. The
// request writes nothing, and can pass only after a delete, a higher limit, or a shrink that
// frees the room it needs.
message QuotaFailure {
  // The scope that refused the request: the tenant, the request's project, or one of the
  // request's project's ancestors.
  QuotaScope scope = 1;

  // The tenant of the failing scope.
  string tenant = 2;

  // The project of the failing scope. Empty for the tenant scope.
  string project = 3;

  // The dimension that would go over its limit, such as `compute.vcpus`.
  string dimension = 4;

  // The limit of the dimension in the failing scope.
  int64 limit = 5;

  // The usage of the failing scope and the projects inside it, before the request.
  int64 usage = 6;

  // What the request adds to the dimension.
  int64 added = 7;

  // The parts of the request that add to the dimension. Each entry names what adds to the
  // dimension: the kind's own name for a dimension of the kind itself, such as `Cluster`, or a
  // dotted proto field path for a dimension of one of its fields, such as
  // `spec.node_sets.compute`, with a map item's key as the last segment.
  repeated string sources = 8;
}
