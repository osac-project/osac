---
# Never derive ACL ownership from the position of a Subnet in a mutable list.
- name: Ensure Netris auth
  ansible.builtin.include_role:
    name: netris.controller.auth
  when: netris_session_cookie is not defined

- name: Read ACL rules before Subnet cleanup
  netris.controller.protected_uri:
    url: "{{ netris_controller_url }}/api/acl"
    method: GET
    headers:
      Cookie: "connect.sid={{ netris_session_cookie }}"
    return_content: true
    status_code: 200
    timeout: "{{ netris_timeout | default(30) }}"
    validate_certs: "{{ netris_validate_certs | default(true) }}"
    ca_path: "{{ netris_ca_path | default(omit, true) }}"
  register: _subnet_acl_before
  no_log: true

- name: Select ACL IDs owned by this Subnet
  ansible.builtin.set_fact:
    _subnet_acl_ids: >-
      {{ _subnet_acl_before.json.data | netris.controller.subnet_acl_ids(
           acl_vpc_id, acl_subnet_cidr, acl_security_group_names) }}
  no_log: true

- name: Delete only this Subnet's SecurityGroup ACL rules
  netris.controller.protected_uri:
    url: "{{ netris_controller_url }}/api/acl"
    method: DELETE
    headers:
      Cookie: "connect.sid={{ netris_session_cookie }}"
      Content-Type: application/json
    body_format: json
    body:
      id: "{{ _subnet_acl_ids }}"
    status_code: [200, 204, 404]
    timeout: "{{ netris_timeout | default(30) }}"
    validate_certs: "{{ netris_validate_certs | default(true) }}"
    ca_path: "{{ netris_ca_path | default(omit, true) }}"
  when: _subnet_acl_ids | length > 0
  no_log: true

- name: Read ACL rules after Subnet cleanup
  netris.controller.protected_uri:
    url: "{{ netris_controller_url }}/api/acl"
    method: GET
    headers:
      Cookie: "connect.sid={{ netris_session_cookie }}"
    return_content: true
    status_code: 200
    timeout: "{{ netris_timeout | default(30) }}"
    validate_certs: "{{ netris_validate_certs | default(true) }}"
    ca_path: "{{ netris_ca_path | default(omit, true) }}"
  register: _subnet_acl_after
  no_log: true

- name: Require Subnet ACL cleanup before removing its network
  ansible.builtin.assert:
    that:
      - >-
        (_subnet_acl_after.json.data | netris.controller.subnet_acl_ids(
          acl_vpc_id, acl_subnet_cidr, acl_security_group_names) | length) == 0
    fail_msg: Subnet SecurityGroup ACL rules remain; refusing to remove its provider network.
  no_log: true
