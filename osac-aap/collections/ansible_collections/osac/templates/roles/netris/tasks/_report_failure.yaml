---
- name: Report a sanitized Netris job failure
  ansible.builtin.fail:
    msg: >-
      Netris {{ _netris_failure_operation }} for
      {{ _netris_failure_resource_type }} '{{ _netris_failure_resource_name }}'
      failed in task '{{ _netris_failure_origin_task | default(_netris_failure_task) }}'
      ({{ _netris_failure_origin_detail
          | default(_netris_failure_detail
                    | default('no provider diagnostic detail was preserved')) }}).
