# SNO full-stack instance values: VMaaS + CaaS + BMaaS
# Instance values for the osac umbrella chart (phase 2).

# --- Service Enablement ---
global:
  osacDeploymentId: "sno/osac"
  fulfillmentTrust:
    enabled: false
  services:
    caas:
      enabled: true
    vmaas:
      enabled: true
    bmaas:
      enabled: true
    maas:
      enabled: false
  # Set provisioningEnabled: true and configure fabricManager/k8sManager
  # when a physical fabric manager (Netris or equivalent) is connected.
  # With provisioningEnabled: false, networking resources reach READY
  # without provider work — suitable for initial bring-up.
  networking:
    provisioningEnabled: false
    fabricManager: netris
    k8sManager: cudn_evpn

# --- Operator ---
operator:
  image:
    repository: ghcr.io/osac-project/osac-operator
    tag: latest
    pullPolicy: Always
  provisioning:
    provider: "aap"
  vendorControllers:
    lvms: none
  aap:
    insecureSkipVerify: "true"
    tokenSecret:
      name: osac-aap-api-token
      key: token
  fulfillment:
    serverAddress: "fulfillment-internal-api:8001"
    credentials:
      secretName: fulfillment-controller-credentials
      clientIdKey: client-id
      clientSecretKey: client-secret
  controllers:
    tenant: true
    networking: true
    storage: true
  # MCE's Assisted Service ignition URL uses the OpenShift ingress Route;
  # trust its cluster-managed CA instead of bypassing TLS verification.
  ignition:
    trustIngressCA: true
  hubAccess:
    enabled: true
  tenants:
    - name: shared

# --- Fulfillment Service ---
service:
  externalHostname: ""   # set dynamically by make install-osac
  internalHostname: ""   # set dynamically by make install-osac
  variant: openshift
  images:
    service:
      repository: ghcr.io/osac-project/fulfillment-service
      tag: latest
      pullPolicy: Always
    envoy:
      repository: ghcr.io/osac-project/envoy
      tag: v1.33.0
      pullPolicy: IfNotPresent
  certs:
    issuerRef:
      kind: ClusterIssuer
      name: default-ca
    caBundle:
      configMap: ca-bundle
  auth:
    emergencyServiceAccounts:
      - admin
      - template-publisher
      - osac-metering
    controllerCredentials:
      - secret:
          name: fulfillment-controller-credentials
          items:
            - key: client-id
              param: client-id
            - key: client-secret
              param: client-secret
  idp:
    provider: keycloak
    credentials:
      - secret:
          name: fulfillment-controller-credentials
          items:
            - key: client-id
              param: client-id
            - key: client-secret
              param: client-secret
  database:
    connection:
      - secret:
          name: osac-db-config
          items:
            - key: url
              param: url
      - secret:
          name: osac-db-client-cert
          items:
            - key: tls.crt
              param: sslcert
            - key: tls.key
              param: sslkey
            - key: ca.crt
              param: sslrootcert
  log:
    level: info
  vault:
    namespace: osac
    kvMountPath: secret
    lifecycleRole: lifecycle
    lifecycleMountPath: jwt
    keycloakClientId: osac-controller
    keycloakAudience: osac-api
    caBundle:
      configMap: ca-bundle
    credentials:
      - secret:
          name: fulfillment-controller-credentials
          items:
            - key: client-secret
              param: client-secret

# --- UI ---
ui:
  enabled: true
  images:
    ui: ghcr.io/osac-project/osac-ui:latest
  api:
    fulfillment:
      certs:
        caBundle:
          configMap: ca-bundle
  auth:
    certs:
      caBundle:
        configMap: ca-bundle

# --- AAP ---
aap:
  aap:
    instance:
      enabled: true
      name: "osac-aap"
  bootstrap:
    enabled: true
    image: ghcr.io/osac-project/osac-aap:latest
    backoffLimit: 15
  configAsCode:
    manifestSecret: "config-as-code-manifest-ig"
    secret: "config-as-code-ig"
    eeImage: "ghcr.io/osac-project/osac-aap:latest"
    projectGitUri: "https://github.com/osac-project/osac"
    projectGitBranch: "main"
  instanceGroups:
    clusterFulfillment:
      enabled: true
      config:
        HOSTED_CLUSTER_CONTROLLER_AVAILABILITY_POLICY: "SingleReplica"
        HOSTED_CLUSTER_INFRASTRUCTURE_AVAILABILITY_POLICY: "SingleReplica"
        # Bare metal: no Route 53. OSAC skips DNS management; create the
        # three records per cluster yourself (api, api-int, *.apps).
        # Fixed at installation — do not change while any Cluster exists.
        DNS_CLASS: "dns.noop.dns"
        EXTERNAL_ACCESS_BASE_DOMAIN: ""           # set in values/stg/instance-secrets.yaml
        HOSTED_CLUSTER_BASE_DOMAIN: ""            # set in values/stg/instance-secrets.yaml
        EXTERNAL_ACCESS_SUPPORTED_BASE_DOMAINS: "" # set in values/stg/instance-secrets.yaml
    networkFulfillment:
      enabled: true
    storageFulfillment:
      enabled: true

# --- Validation ---
validation:
  enabled: true

# --- Hub Access ---
hubAccess:
  enabled: true

# --- Bare Metal Fulfillment Operator ---
bmf:
  image:
    repository: ghcr.io/osac-project/bare-metal-fulfillment-operator
    tag: latest
    pullPolicy: Always
  env:
    aapUrl: "http://osac-aap/api/controller"
    aapInsecureSkipVerify: "true"
  metal3:
    enabled: true
    namespace: host-inventory
    hostClass: metal3

# --- LVMS StorageBackend + StorageTier registration ---
lvms:
  enabled: true

# --- CaaS cluster versions ---
# Update version/image/diskImage to match the OCP release you plan to provision.
clusterVersions:
  enabled: true
  versions:
    - version: "4.22.0"
      image: "quay.io/openshift-release-dev/ocp-release:4.22.0-multi"
      default: true
      diskImage:
        name: rhcos-4-22
        sourceRef: oci://quay.io/osac-project/rhcos:4.22.0

# --- Metering ---
metering:
  image:
    repository: ghcr.io/osac-project/metering-service
    tag: latest
    pullPolicy: Always
  database:
    connection:
      - secret:
          name: osac-db-metering-config
          items:
            - key: url
              param: url
      - secret:
          name: osac-db-metering-client-cert
          items:
            - key: tls.crt
              param: sslcert
            - key: tls.key
              param: sslkey
            - key: ca.crt
              param: sslrootcert
  m360Adapter:
    enabled: false
