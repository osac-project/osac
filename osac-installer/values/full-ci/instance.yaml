# Full CI environment -- instance values for osac chart.

# --- Operator ---
operator:
  image:
    repository: ghcr.io/osac-project/osac-operator
    tag: sha-3a511a6
    pullPolicy: Always
  provisioning:
    provider: "aap"
  aap:
    insecureSkipVerify: "true"
    tokenSecret:
      name: osac-aap-api-token
      key: token
  fulfillment:
    serverAddress: "fulfillment-internal-api:8001"
    tokenFile: "/var/run/secrets/kubernetes.io/serviceaccount/token"
  controllers:
    clusterOrder: true
    computeInstance: true
    tenant: true
    networking: true
    storage: true
    bareMetalInstance: true
  hubAccess:
    enabled: true
  tenants:
    - name: shared
    - name: osac-e2e-ci
# --- Fulfillment Service ---
service:
  externalHostname: "" # set dynamically by make install-osac
  internalHostname: "" # set dynamically by make install-osac
  variant: openshift
  images:
    service: ghcr.io/osac-project/fulfillment-service:sha-3a511a6
    envoy: ghcr.io/osac-project/envoy:v1.33.0
  certs:
    issuerRef:
      kind: ClusterIssuer
      name: default-ca
    caBundle:
      configMap: ca-bundle
  auth:
    # issuerUrl defaults to a global.clusterDomain-backed external route URL
    # (see charts/osac/values.yaml) -- correct automatically once
    # install-osac sets --set global.clusterDomain=$(DOMAIN).
    emergencyServiceAccounts:
      - admin
      - osac-operator
      - osac-operator-controller-manager
      - template-publisher
      - osac-metering
    controllerCredentials:
      - secret:
          name: fulfillment-controller-credentials
          items:
            - key: client-id
              param: client-id
            - key: client-secret
              param: client-secret
  idp:
    provider: keycloak
    # url defaults to a global.clusterDomain-backed external route URL (see
    # charts/osac/values.yaml) -- correct automatically once install-osac
    # sets --set global.clusterDomain=$(DOMAIN).
    credentials:
      - secret:
          name: fulfillment-controller-credentials
          items:
            - key: client-id
              param: client-id
            - key: client-secret
              param: client-secret
  database:
    connection:
      - secret:
          name: osac-db-config
          items:
            - key: url
              param: url
      - secret:
          name: osac-db-client-cert
          items:
            - key: tls.crt
              param: sslcert
            - key: tls.key
              param: sslkey
            - key: ca.crt
              param: sslrootcert
  log:
    level: debug
  vault:
    # endpoint and keycloakIssuerUrl both default correctly (see
    # charts/osac/values.yaml) -- no override needed.
    namespace: osac
    kvMountPath: secret
    lifecycleRole: lifecycle
    lifecycleMountPath: jwt
    keycloakClientId: osac-controller
    keycloakAudience: osac-api
    caBundle:
      configMap: ca-bundle
    credentials:
      - secret:
          name: fulfillment-controller-credentials
          items:
            - key: client-secret
              param: client-secret
# --- UI ---
ui:
  enabled: true
  images:
    ui: ghcr.io/osac-project/osac-ui:sha-d047c4a
  api:
    fulfillment:
      certs:
        caBundle:
          configMap: ca-bundle
  auth:
    certs:
      caBundle:
        configMap: ca-bundle
# --- AAP ---
aap:
  aap:
    instance:
      enabled: true
      name: "osac-aap"
  bootstrap:
    enabled: true
    image: ghcr.io/osac-project/osac-aap:sha-3a511a6
    backoffLimit: 15
  configAsCode:
    manifestSecret: "config-as-code-manifest-ig"
    secret: "config-as-code-ig"
    eeImage: "ghcr.io/osac-project/osac-aap:sha-3a511a6"
    projectGitUri: "https://github.com/osac-project/osac"
    projectGitBranch: "3a511a6e9f6f55b659cf8da55aa5ad8e6bbf734a"
  instanceGroups:
    clusterFulfillment:
      enabled: true
      config:
        NETWORK_STEPS_COLLECTION: "ci.steps"
        HOSTED_CLUSTER_CONTROLLER_AVAILABILITY_POLICY: "SingleReplica"
        HOSTED_CLUSTER_INFRASTRUCTURE_AVAILABILITY_POLICY: "SingleReplica"
    networkFulfillment:
      enabled: true
# --- Validation ---
validation:
  enabled: true
# --- Bare Metal Fulfillment Operator ---
bmf:
  enabled: true
  image:
    repository: ghcr.io/osac-project/bare-metal-fulfillment-operator
    tag: sha-3a511a6
    pullPolicy: Always
  env:
    aapUrl: "http://osac-aap/api/controller"
    aapInsecureSkipVerify: "true"
# --- Cluster Versions ---
clusterVersions:
  enabled: true
  versions:
    - version: "4.20.0"
      image: "quay.io/openshift-release-dev/ocp-release:4.20.0-multi"
    - version: "4.22.0"
      image: "quay.io/openshift-release-dev/ocp-release:4.22.0-multi"
      default: true
# --- Hub Access ---
hubAccess:
  enabled: true
# --- Metering ---
metering:
  enabled: true
  database:
    connection:
      - secret:
          name: osac-db-metering-config
          items:
            - key: url
              param: url
      - secret:
          name: osac-db-metering-client-cert
          items:
            - key: tls.crt
              param: sslcert
            - key: tls.key
              param: sslkey
            - key: ca.crt
              param: sslrootcert
# --- Bundled OpenBao (Vault-compatible secret store) ---
bundledVault:
  # Override podSecurityContext for OpenShift restricted-v2 SCC: omit numeric
  # runAsUser/runAsGroup/fsGroup — the SCC allocates UIDs from the namespace UID
  # range and resolves the named user automatically. A non-nil value here fully
  # replaces the template default (runAsUser:100/runAsGroup:1000/fsGroup:1000).
  podSecurityContext:
    runAsNonRoot: true
