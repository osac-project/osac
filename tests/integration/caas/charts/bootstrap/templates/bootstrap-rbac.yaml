{{- if .Values.bootstrap.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: caas-it-bootstrap
  namespace: {{ .Release.Namespace | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: caas-it-bootstrap
  namespace: {{ .Release.Namespace | quote }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [kube-root-ca.crt, caas-it-configuration, openshift-service-ca.crt]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [openshift-service-ca.crt]
    verbs: [patch]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [awx-token]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps, secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: caas-it-bootstrap
  namespace: {{ .Release.Namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: caas-it-bootstrap
subjects:
  - kind: ServiceAccount
    name: caas-it-bootstrap
    namespace: {{ .Release.Namespace | quote }}
{{- end }}
