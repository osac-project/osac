---
# Integration test for the osac_csi_storage role reached through the
# osac.service.storage_provider dispatcher (provider osac-csi, the same call the
# tenant cluster storage playbook makes for a ClusterOrder).
#
# Contract under test: on a guest cluster the role only creates and deletes
# per-tier StorageClasses. It requires the CSI driver to be registered already
# (a CSIDriver object), it never creates the driver namespace or any Secret in it,
# and teardown leaves the driver namespace, its contents and other tenants'
# StorageClasses alone.
#
# The "guest" cluster is this same Kind cluster, reached through a kubeconfig path
# (as targets/tenant_cluster_storage_csi_driver_install_gate does). The CSIDriver
# object is a fixture: no OSAC CSI driver, PVC provisioning or HCP guest cluster
# runs here. Installing the driver on a guest is OSAC-7841.
#
# The driver name and namespace are isolated from the hub install test, which uses
# namespace osac-csi and driver csi.osac.openshift.io on the same cluster.
#
# Plays: 0 guard, 1 clean slate, 2 driver not registered, 3 driver registered,
# 4 idempotent, 5 teardown, 6 VAST block refused on CLaaS, 7 cleanup. Play 1
# establishes a clean slate; plays 3-5 build on each other.

# ── Play 0: refuse to run against anything but the Kind test cluster ──
# This target creates and deletes cluster-scoped objects (CSIDriver, StorageClass,
# Namespace). There is deliberately no fallback to ~/.kube/config.
- name: "OSAC CSI StorageClass - Guard: run only against the Kind test cluster"
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Assert KUBECONFIG points at the Kind test kubeconfig
      ansible.builtin.assert:
        that:
          - lookup('env', 'KUBECONFIG') is regex('kubeconfig-osac-test$')
        fail_msg: >-
          KUBECONFIG must end with kubeconfig-osac-test (run through run_tests.sh or the
          documented focused run). Got: '{{ lookup('env', 'KUBECONFIG') }}'
        success_msg: "Running against the Kind test kubeconfig"

    - name: Assert K8S_AUTH_KUBECONFIG cannot redirect the modules to another cluster
      ansible.builtin.assert:
        that:
          - >-
            lookup('env', 'K8S_AUTH_KUBECONFIG') | length == 0
            or lookup('env', 'K8S_AUTH_KUBECONFIG') == lookup('env', 'KUBECONFIG')
        fail_msg: >-
          K8S_AUTH_KUBECONFIG must be unset or equal KUBECONFIG. Got:
          '{{ lookup('env', 'K8S_AUTH_KUBECONFIG') }}'
        success_msg: "K8S_AUTH_KUBECONFIG is unset or matches KUBECONFIG"

# ── Play 1: clean slate ──
- name: "OSAC CSI StorageClass - Clean slate"
  hosts: localhost
  gather_facts: false
  vars: &csi_sc_vars
    osac_csi_driver_name: csi.sc-test.osac.openshift.io
    osac_csi_driver_namespace: osac-csi-sc-test
    tenant_name: test-osac-csi-sc
    tenant_namespace: openshift-osac-storage
    _remote_kubeconfig: "{{ lookup('env', 'KUBECONFIG') }}"
    _csi_sc_tiers:
      - name: gold
        protocol: nfs
        provider: osac-csi
        backend_id: be-sc-test
      # netapp resolves to the same osac_csi_storage role through the dispatcher's
      # CSI-managed provider list, so one run covers both provider spellings.
      - name: silver
        protocol: block
        provider: netapp
        backend_id: be-sc-netapp

  tasks:
    - name: Delete the test CSIDriver
      kubernetes.core.k8s:
        kubeconfig: "{{ _remote_kubeconfig }}"
        state: absent
        api_version: storage.k8s.io/v1
        kind: CSIDriver
        name: csi.sc-test.osac.openshift.io
        wait: true

    - name: Delete the driver namespace
      kubernetes.core.k8s:
        kubeconfig: "{{ _remote_kubeconfig }}"
        state: absent
        api_version: v1
        kind: Namespace
        name: osac-csi-sc-test
        wait: true

    - name: Delete the tenant StorageClasses
      kubernetes.core.k8s:
        kubeconfig: "{{ _remote_kubeconfig }}"
        state: absent
        api_version: storage.k8s.io/v1
        kind: StorageClass
        name: "{{ item }}"
        wait: true
      loop:
        - osac-test-osac-csi-sc-gold
        - osac-test-osac-csi-sc-silver

    - name: Delete the other tenant's StorageClasses
      kubernetes.core.k8s:
        kubeconfig: "{{ _remote_kubeconfig }}"
        state: absent
        api_version: storage.k8s.io/v1
        kind: StorageClass
        name: "{{ item }}"
        wait: true
      loop:
        - osac-test-other-tenant-gold
        - osac-test-other-tenant-silver

# ── Play 2: driver not registered ──
- name: "OSAC CSI StorageClass - Driver not registered"
  hosts: localhost
  gather_facts: false
  vars: *csi_sc_vars

  tasks:
    - name: Call ensure_storage_class with the driver absent
      block:
        - name: List this tenant's labelled Secrets in all namespaces (unreg_before)
          kubernetes.core.k8s_info:
            kubeconfig: "{{ _remote_kubeconfig }}"
            api_version: v1
            kind: Secret
            label_selectors:
              - "osac.openshift.io/tenant={{ tenant_name }}"
          register: _tenant_secrets_unreg_before
          no_log: true

        - name: List Secrets in the tenant namespace (unreg_before)
          kubernetes.core.k8s_info:
            kubeconfig: "{{ _remote_kubeconfig }}"
            api_version: v1
            kind: Secret
            namespace: "{{ tenant_namespace }}"
          register: _tenant_ns_secrets_unreg_before
          no_log: true

        - name: Record Secret names (unreg_before)
          ansible.builtin.set_fact:
            _secret_names_unreg_before: >-
              {% set ns = namespace(names=[]) -%}
              {% for r in _tenant_secrets_unreg_before.resources + _tenant_ns_secrets_unreg_before.resources -%}
              {% set ns.names = ns.names + [r.metadata.namespace ~ '/' ~ r.metadata.name] -%}
              {% endfor -%}
              {{ ns.names | unique | list }}

        - name: Run ensure_storage_class through the storage_provider dispatcher
          ansible.builtin.include_role:
            name: osac.service.storage_provider
          vars:
            storage_provider_action: ensure_storage_class
            storage_provider_tiers: "{{ _csi_sc_tiers }}"
            storage_provider_backend_connections: {}
            storage_provider_target_kubeconfig: "{{ _remote_kubeconfig }}"
            storage_provider_target_kubeconfig_insecure: false

        - name: This should not be reached
          ansible.builtin.fail:
            msg: "ensure_storage_class should have failed: the CSI driver is not registered"

      rescue:
        - name: Assert the failure names the driver and says it is not registered
          ansible.builtin.assert:
            that:
              - "'csi.sc-test.osac.openshift.io' in ansible_failed_result.msg"
              - "'not registered' in ansible_failed_result.msg"
            fail_msg: "Unexpected failure: {{ ansible_failed_result.msg | default('') }}"
            success_msg: "ensure_storage_class refused an unregistered driver"

        # The dispatcher loops over (provider, backend_id) pairs sorted by provider
        # (netapp before osac_csi) and the first dispatch fails the run, so the
        # record describes the netapp pair only: the osac-csi pair is never reached.
        - name: Assert the structured failure record
          ansible.builtin.assert:
            that:
              - osac_storage_provider_failures is defined
              - osac_storage_provider_failures | length == 1
              - osac_storage_provider_failures[0].reason == 'csi_driver_not_registered'
              - osac_storage_provider_failures[0].tiers == ['silver']
              - osac_storage_provider_failures[0].backend_ids == ['be-sc-netapp']
              - "'not registered' in osac_storage_provider_failures[0].message"
            fail_msg: >-
              Unexpected osac_storage_provider_failures:
              {{ osac_storage_provider_failures | default('undefined') | to_json }}
            success_msg: "csi_driver_not_registered recorded for tier silver and backend be-sc-netapp"

    - name: List this tenant's labelled Secrets in all namespaces (unreg_after)
      kubernetes.core.k8s_info:
        kubeconfig: "{{ _remote_kubeconfig }}"
        api_version: v1
        kind: Secret
        label_selectors:
          - "osac.openshift.io/tenant={{ tenant_name }}"
      register: _tenant_secrets_unreg_after
      no_log: true

    - name: List Secrets in the tenant namespace (unreg_after)
      kubernetes.core.k8s_info:
        kubeconfig: "{{ _remote_kubeconfig }}"
        api_version: v1
        kind: Secret
        namespace: "{{ tenant_namespace }}"
      register: _tenant_ns_secrets_unreg_after
      no_log: true

    - name: Record Secret names (unreg_after)
      ansible.builtin.set_fact:
        _secret_names_unreg_after: >-
          {% set ns = namespace(names=[]) -%}
          {% for r in _tenant_secrets_unreg_after.resources + _tenant_ns_secrets_unreg_after.resources -%}
          {% set ns.names = ns.names + [r.metadata.namespace ~ '/' ~ r.metadata.name] -%}
          {% endfor -%}
          {{ ns.names | unique | list }}

    - name: Assert no Secret appeared for the tenant (unreg_after)
      ansible.builtin.assert:
        that:
          - _secret_names_unreg_after | difference(_secret_names_unreg_before) | length == 0
        fail_msg: >-
          New Secrets appeared: {{ _secret_names_unreg_after | difference(_secret_names_unreg_before) }}
        success_msg: "No tenant-labelled or tenant-namespace Secret was created"

    - name: Read the tenant StorageClasses
      kubernetes.core.k8s_info:
        kubeconfig: "{{ _remote_kubeconfig }}"
        api_version: storage.k8s.io/v1
        kind: StorageClass
        label_selectors:
          - "osac.openshift.io/tenant={{ tenant_name }}"
      register: _sc_unregistered

    - name: Read the driver namespace
      kubernetes.core.k8s_info:
        kubeconfig: "{{ _remote_kubeconfig }}"
        api_version: v1
        kind: Namespace
        name: osac-csi-sc-test
      register: _ns_unregistered

    - name: Read Secrets in the driver namespace
      kubernetes.core.k8s_info:
        kubeconfig: "{{ _remote_kubeconfig }}"
        api_version: v1
        kind: Secret
        namespace: osac-csi-sc-test
      register: _secrets_unregistered

    - name: Assert nothing was created
      ansible.builtin.assert:
        that:
          - _sc_unregistered.resources | length == 0
          - _ns_unregistered.resources | length == 0
          - _secrets_unregistered.resources | length == 0
        fail_msg: >-
          A failed ensure_storage_class must leave no StorageClass, driver namespace or
          Secret behind.
        success_msg: "No StorageClass, driver namespace or Secret was created"

# ── Play 3: driver registered ──
- name: "OSAC CSI StorageClass - Driver registered"
  hosts: localhost
  gather_facts: false
  vars: *csi_sc_vars

  tasks:
    - name: Register the CSIDriver fixture
      kubernetes.core.k8s:
        kubeconfig: "{{ _remote_kubeconfig }}"
        state: present
        definition:
          apiVersion: storage.k8s.io/v1
          kind: CSIDriver
          metadata:
            name: csi.sc-test.osac.openshift.io
          spec:
            attachRequired: false

    - name: List this tenant's labelled Secrets in all namespaces (reg_before)
      kubernetes.core.k8s_info:
        kubeconfig: "{{ _remote_kubeconfig }}"
        api_version: v1
        kind: Secret
        label_selectors:
          - "osac.openshift.io/tenant={{ tenant_name }}"
      register: _tenant_secrets_reg_before
      no_log: true

    - name: List Secrets in the tenant namespace (reg_before)
      kubernetes.core.k8s_info:
        kubeconfig: "{{ _remote_kubeconfig }}"
        api_version: v1
        kind: Secret
        namespace: "{{ tenant_namespace }}"
      register: _tenant_ns_secrets_reg_before
      no_log: true

    - name: Record Secret names (reg_before)
      ansible.builtin.set_fact:
        _secret_names_reg_before: >-
          {% set ns = namespace(names=[]) -%}
          {% for r in _tenant_secrets_reg_before.resources + _tenant_ns_secrets_reg_before.resources -%}
          {% set ns.names = ns.names + [r.metadata.namespace ~ '/' ~ r.metadata.name] -%}
          {% endfor -%}
          {{ ns.names | unique | list }}

    - name: Run ensure_storage_class through the storage_provider dispatcher
      ansible.builtin.include_role:
        name: osac.service.storage_provider
      vars:
        storage_provider_action: ensure_storage_class
        storage_provider_tiers: "{{ _csi_sc_tiers }}"
        storage_provider_backend_connections: {}
        storage_provider_target_kubeconfig: "{{ _remote_kubeconfig }}"
        storage_provider_target_kubeconfig_insecure: false

    - name: List this tenant's labelled Secrets in all namespaces (reg_after)
      kubernetes.core.k8s_info:
        kubeconfig: "{{ _remote_kubeconfig }}"
        api_version: v1
        kind: Secret
        label_selectors:
          - "osac.openshift.io/tenant={{ tenant_name }}"
      register: _tenant_secrets_reg_after
      no_log: true

    - name: List Secrets in the tenant namespace (reg_after)
      kubernetes.core.k8s_info:
        kubeconfig: "{{ _remote_kubeconfig }}"
        api_version: v1
        kind: Secret
        namespace: "{{ tenant_namespace }}"
      register: _tenant_ns_secrets_reg_after
      no_log: true

    - name: Record Secret names (reg_after)
      ansible.builtin.set_fact:
        _secret_names_reg_after: >-
          {% set ns = namespace(names=[]) -%}
          {% for r in _tenant_secrets_reg_after.resources + _tenant_ns_secrets_reg_after.resources -%}
          {% set ns.names = ns.names + [r.metadata.namespace ~ '/' ~ r.metadata.name] -%}
          {% endfor -%}
          {{ ns.names | unique | list }}

    - name: Assert no Secret appeared for the tenant (reg_after)
      ansible.builtin.assert:
        that:
          - _secret_names_reg_after | difference(_secret_names_reg_before) | length == 0
        fail_msg: >-
          New Secrets appeared: {{ _secret_names_reg_after | difference(_secret_names_reg_before) }}
        success_msg: "No tenant-labelled or tenant-namespace Secret was created"

    - name: Read the tenant StorageClasses
      kubernetes.core.k8s_info:
        kubeconfig: "{{ _remote_kubeconfig }}"
        api_version: storage.k8s.io/v1
        kind: StorageClass
        label_selectors:
          - "osac.openshift.io/tenant={{ tenant_name }}"
      register: _sc_registered

    - name: Read the driver namespace
      kubernetes.core.k8s_info:
        kubeconfig: "{{ _remote_kubeconfig }}"
        api_version: v1
        kind: Namespace
        name: osac-csi-sc-test
      register: _ns_registered

    - name: Read Secrets in the driver namespace
      kubernetes.core.k8s_info:
        kubeconfig: "{{ _remote_kubeconfig }}"
        api_version: v1
        kind: Secret
        namespace: osac-csi-sc-test
      register: _secrets_registered

    - name: Assert each tier's StorageClass has the expected shape
      ansible.builtin.assert:
        that:
          - _sc_registered.resources | length == 2
          - _sc_by_tier | length == 2
          - _sc_by_tier.keys() | sort | list == ['gold', 'silver']
          - _sc_by_tier[item].metadata.name == 'osac-test-osac-csi-sc-' ~ item
          - _sc_by_tier[item].provisioner == 'csi.sc-test.osac.openshift.io'
          - _sc_by_tier[item].parameters.tier == item
          - _sc_by_tier[item].parameters.tenant == 'test-osac-csi-sc'
          - _sc_by_tier[item].allowVolumeExpansion is defined
          - _sc_by_tier[item].allowVolumeExpansion is sameas false
          - >-
            _sc_by_tier[item].parameters.keys()
            | select('match', '^csi\.storage\.k8s\.io/') | list | length == 0
          - >-
            ('osac-test-osac-csi-sc-' ~ item) in
            (storage_provider_storage_class_names | map(attribute='name') | list)
        fail_msg: "Unexpected StorageClass for tier {{ item }}: {{ _sc_registered.resources | to_json }}"
        success_msg: "StorageClass for tier {{ item }} created with the expected provisioner and parameters"
      loop:
        - gold
        - silver
      vars:
        _sc_by_tier: >-
          {{ dict(_sc_registered.resources | map(attribute='parameters.tier') | zip(_sc_registered.resources)) }}

    - name: Assert the accumulated StorageClass names cover both providers
      ansible.builtin.assert:
        that:
          - >-
            storage_provider_storage_class_names | map(attribute='name') | sort | list
            == ['osac-test-osac-csi-sc-gold', 'osac-test-osac-csi-sc-silver']
        fail_msg: >-
          Unexpected storage_provider_storage_class_names:
          {{ storage_provider_storage_class_names | default('undefined') | to_json }}
        success_msg: "Both the osac-csi and the netapp tier produced a StorageClass name"

    - name: Assert the role installed nothing into the driver namespace
      ansible.builtin.assert:
        that:
          - _ns_registered.resources | length == 0
          - _secrets_registered.resources | length == 0
        fail_msg: >-
          ensure_storage_class must not create the driver namespace or any Secret in it.
        success_msg: "Driver namespace still absent and no Secret created"

# ── Play 4: idempotent ──
- name: "OSAC CSI StorageClass - Idempotent"
  hosts: localhost
  gather_facts: false
  vars: *csi_sc_vars

  tasks:
    - name: Read the StorageClasses before the second run
      kubernetes.core.k8s_info:
        kubeconfig: "{{ _remote_kubeconfig }}"
        api_version: storage.k8s.io/v1
        kind: StorageClass
        label_selectors:
          - "osac.openshift.io/tenant={{ tenant_name }}"
      register: _sc_before

    - name: Run ensure_storage_class a second time
      ansible.builtin.include_role:
        name: osac.service.storage_provider
      vars:
        storage_provider_action: ensure_storage_class
        storage_provider_tiers: "{{ _csi_sc_tiers }}"
        storage_provider_backend_connections: {}
        storage_provider_target_kubeconfig: "{{ _remote_kubeconfig }}"
        storage_provider_target_kubeconfig_insecure: false

    - name: Read the StorageClasses after the second run
      kubernetes.core.k8s_info:
        kubeconfig: "{{ _remote_kubeconfig }}"
        api_version: storage.k8s.io/v1
        kind: StorageClass
        label_selectors:
          - "osac.openshift.io/tenant={{ tenant_name }}"
      register: _sc_after

    - name: Assert neither StorageClass was recreated
      ansible.builtin.assert:
        that:
          - _sc_before.resources | length == 2
          - _sc_after.resources | length == 2
          - _before_versions | length == 2
          - _before_versions == _after_versions
        fail_msg: "A StorageClass uid or resourceVersion changed between runs"
        success_msg: "Second run left both StorageClasses untouched"
      vars:
        _before_versions: >-
          {% set ns = namespace(v=[]) -%}
          {% for r in _sc_before.resources | sort(attribute='metadata.name') -%}
          {% set ns.v = ns.v + [r.metadata.name ~ '/' ~ r.metadata.uid ~ '/' ~ r.metadata.resourceVersion] -%}
          {% endfor -%}
          {{ ns.v }}
        _after_versions: >-
          {% set ns = namespace(v=[]) -%}
          {% for r in _sc_after.resources | sort(attribute='metadata.name') -%}
          {% set ns.v = ns.v + [r.metadata.name ~ '/' ~ r.metadata.uid ~ '/' ~ r.metadata.resourceVersion] -%}
          {% endfor -%}
          {{ ns.v }}

# ── Play 5: teardown leaves the install and other tenants alone ──
- name: "OSAC CSI StorageClass - Teardown leaves the install and other tenants alone"
  hosts: localhost
  gather_facts: false
  vars: *csi_sc_vars

  tasks:
    - name: Create the driver namespace as if the driver were installed
      kubernetes.core.k8s:
        kubeconfig: "{{ _remote_kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: osac-csi-sc-test

    - name: Create a ConfigMap owned by someone else in the driver namespace
      kubernetes.core.k8s:
        kubeconfig: "{{ _remote_kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: owned-by-someone-else
            namespace: osac-csi-sc-test
          data:
            owner: someone-else

    - name: Create a pre-existing credentials Secret in the driver namespace
      kubernetes.core.k8s:
        kubeconfig: "{{ _remote_kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: osac-csi-driver-credentials
            namespace: osac-csi-sc-test
          type: Opaque
          stringData:
            fixture: placeholder
      no_log: true

    - name: Create another tenant's StorageClasses for the same driver (one per tier)
      kubernetes.core.k8s:
        kubeconfig: "{{ _remote_kubeconfig }}"
        state: present
        definition:
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: "osac-test-other-tenant-{{ item }}"
            labels:
              osac.openshift.io/managed-by: osac-csi-driver
              osac.openshift.io/tenant: test-other-tenant
          provisioner: csi.sc-test.osac.openshift.io
      loop:
        - gold
        - silver

    - name: Run teardown_cluster_storage through the storage_provider dispatcher
      ansible.builtin.include_role:
        name: osac.service.storage_provider
      vars:
        storage_provider_action: teardown_cluster_storage
        storage_provider_tiers: "{{ _csi_sc_tiers }}"
        storage_provider_backend_connections: {}
        storage_provider_target_kubeconfig: "{{ _remote_kubeconfig }}"
        storage_provider_target_kubeconfig_insecure: false

    - name: Read the tenant StorageClasses
      kubernetes.core.k8s_info:
        kubeconfig: "{{ _remote_kubeconfig }}"
        api_version: storage.k8s.io/v1
        kind: StorageClass
        label_selectors:
          - "osac.openshift.io/tenant={{ tenant_name }}"
      register: _sc_torn_down

    - name: Read the other tenant's StorageClasses
      kubernetes.core.k8s_info:
        kubeconfig: "{{ _remote_kubeconfig }}"
        api_version: storage.k8s.io/v1
        kind: StorageClass
        label_selectors:
          - "osac.openshift.io/tenant=test-other-tenant"
      register: _sc_other_tenant

    - name: Read the CSIDriver
      kubernetes.core.k8s_info:
        kubeconfig: "{{ _remote_kubeconfig }}"
        api_version: storage.k8s.io/v1
        kind: CSIDriver
        name: csi.sc-test.osac.openshift.io
      register: _csidriver_after_teardown

    - name: Read the driver namespace
      kubernetes.core.k8s_info:
        kubeconfig: "{{ _remote_kubeconfig }}"
        api_version: v1
        kind: Namespace
        name: osac-csi-sc-test
      register: _ns_after_teardown

    - name: Read the ConfigMap in the driver namespace
      kubernetes.core.k8s_info:
        kubeconfig: "{{ _remote_kubeconfig }}"
        api_version: v1
        kind: ConfigMap
        name: owned-by-someone-else
        namespace: osac-csi-sc-test
      register: _cm_after_teardown

    - name: Read the credentials Secret in the driver namespace
      kubernetes.core.k8s_info:
        kubeconfig: "{{ _remote_kubeconfig }}"
        api_version: v1
        kind: Secret
        name: osac-csi-driver-credentials
        namespace: osac-csi-sc-test
      register: _secret_after_teardown
      no_log: true

    - name: Assert teardown removed only this tenant's StorageClasses
      ansible.builtin.assert:
        that:
          - _sc_torn_down.resources | length == 0
          - >-
            _sc_other_tenant.resources | map(attribute='metadata.name') | sort | list
            == ['osac-test-other-tenant-gold', 'osac-test-other-tenant-silver']
        fail_msg: >-
          teardown_cluster_storage must delete this tenant's StorageClasses (gold and
          silver) and leave other tenants' StorageClasses alone.
        success_msg: "Only this tenant's StorageClasses were deleted"

    - name: Assert teardown left the driver namespace and its contents alone
      ansible.builtin.assert:
        that:
          - _csidriver_after_teardown.resources | length == 1
          - _ns_after_teardown.resources | length == 1
          - _cm_after_teardown.resources | length == 1
          - _secret_after_teardown.resources | length == 1
        fail_msg: >-
          teardown_cluster_storage must not delete the CSIDriver, the driver namespace, its
          ConfigMap or its credentials Secret.
        success_msg: "CSIDriver, driver namespace, ConfigMap and credentials Secret survived teardown"

# ── Play 6: VAST block tier refused on CLaaS ──
# On the caas target vast reaches osac_csi_storage. VAST has no block protocol
# support there, so a vast block tier is refused with a structured failure, while
# the other tiers of the same backend still get their StorageClass.
- name: "OSAC CSI StorageClass - VAST block tier refused on CLaaS"
  hosts: localhost
  gather_facts: false
  vars: *csi_sc_vars

  tasks:
    - name: Delete the VAST test StorageClasses (clean slate)
      kubernetes.core.k8s:
        kubeconfig: "{{ _remote_kubeconfig }}"
        state: absent
        api_version: storage.k8s.io/v1
        kind: StorageClass
        name: "{{ item }}"
        wait: true
      loop:
        - osac-test-osac-csi-sc-nfsgold
        - osac-test-osac-csi-sc-blkgold

    - name: Register the CSIDriver fixture
      kubernetes.core.k8s:
        kubeconfig: "{{ _remote_kubeconfig }}"
        state: present
        definition:
          apiVersion: storage.k8s.io/v1
          kind: CSIDriver
          metadata:
            name: csi.sc-test.osac.openshift.io
          spec:
            attachRequired: false

    - name: Call ensure_storage_class with a VAST block tier on the caas target
      block:
        - name: Run ensure_storage_class through the storage_provider dispatcher
          ansible.builtin.include_role:
            name: osac.service.storage_provider
          vars:
            storage_provider_action: ensure_storage_class
            storage_provider_tiers:
              - name: nfsgold
                protocol: nfs
                provider: vast
                backend_id: be-sc-vast
              - name: blkgold
                protocol: block
                provider: vast
                backend_id: be-sc-vast
            storage_provider_backend_connections: {}
            storage_provider_provisioning_target: caas
            storage_provider_target_kubeconfig: "{{ _remote_kubeconfig }}"
            storage_provider_target_kubeconfig_insecure: false

        - name: This should not be reached
          ansible.builtin.fail:
            msg: "ensure_storage_class should have failed: VAST block is refused on CLaaS"

      rescue:
        - name: Assert the job failed naming the tier and the CLaaS limitation
          ansible.builtin.assert:
            that:
              - "'blkgold' in ansible_failed_result.msg"
              - "'not supported on CLaaS' in ansible_failed_result.msg"
              - "'nfsgold' not in ansible_failed_result.msg"
              - "'must be a non-empty string' not in ansible_failed_result.msg"
              - "'not a valid DNS label' not in ansible_failed_result.msg"
            fail_msg: "Unexpected failure: {{ ansible_failed_result.msg | default('') }}"
            success_msg: "ensure_storage_class refused the VAST block tier"

        - name: Assert the structured failure record
          ansible.builtin.assert:
            that:
              - osac_storage_provider_failures is defined
              - osac_storage_provider_failures | length == 1
              - osac_storage_provider_failures[0].reason == 'vast_block_unsupported_on_caas'
              - osac_storage_provider_failures[0].tiers == ['blkgold']
              - osac_storage_provider_failures[0].backend_ids == ['be-sc-vast']
              - "'blkgold' in osac_storage_provider_failures[0].message"
              - "'not supported on CLaaS' in osac_storage_provider_failures[0].message"
            fail_msg: >-
              Unexpected osac_storage_provider_failures:
              {{ osac_storage_provider_failures | default('undefined') | to_json }}
            success_msg: "vast_block_unsupported_on_caas recorded for tier blkgold"

    - name: Read the nfsgold StorageClass
      kubernetes.core.k8s_info:
        kubeconfig: "{{ _remote_kubeconfig }}"
        api_version: storage.k8s.io/v1
        kind: StorageClass
        name: osac-test-osac-csi-sc-nfsgold
      register: _sc_vast_nfs

    - name: Read the blkgold StorageClass
      kubernetes.core.k8s_info:
        kubeconfig: "{{ _remote_kubeconfig }}"
        api_version: storage.k8s.io/v1
        kind: StorageClass
        name: osac-test-osac-csi-sc-blkgold
      register: _sc_vast_block

    - name: Assert the NFS tier got a StorageClass and the block tier did not
      ansible.builtin.assert:
        that:
          - _sc_vast_nfs.resources | length == 1
          - _sc_vast_block.resources | length == 0
        fail_msg: >-
          The VAST nfs tier must still get its StorageClass and the refused VAST block
          tier must get none.
        success_msg: "nfsgold StorageClass exists, blkgold StorageClass does not"

# ── Play 7: cleanup ──
- name: "OSAC CSI StorageClass - Cleanup"
  hosts: localhost
  gather_facts: false
  vars: *csi_sc_vars

  tasks:
    - name: Delete the test CSIDriver
      kubernetes.core.k8s:
        kubeconfig: "{{ _remote_kubeconfig }}"
        state: absent
        api_version: storage.k8s.io/v1
        kind: CSIDriver
        name: csi.sc-test.osac.openshift.io
        wait: true

    - name: Delete the driver namespace
      kubernetes.core.k8s:
        kubeconfig: "{{ _remote_kubeconfig }}"
        state: absent
        api_version: v1
        kind: Namespace
        name: osac-csi-sc-test
        wait: true

    - name: Delete the other tenant's StorageClasses
      kubernetes.core.k8s:
        kubeconfig: "{{ _remote_kubeconfig }}"
        state: absent
        api_version: storage.k8s.io/v1
        kind: StorageClass
        name: "{{ item }}"
        wait: true
      loop:
        - osac-test-other-tenant-gold
        - osac-test-other-tenant-silver

    - name: Delete any leftover tenant StorageClasses
      kubernetes.core.k8s:
        kubeconfig: "{{ _remote_kubeconfig }}"
        state: absent
        api_version: storage.k8s.io/v1
        kind: StorageClass
        name: "{{ item }}"
        wait: true
      loop:
        - osac-test-osac-csi-sc-gold
        - osac-test-osac-csi-sc-silver
        - osac-test-osac-csi-sc-nfsgold
        - osac-test-osac-csi-sc-blkgold
