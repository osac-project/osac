name: Bump pinned refs

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.OSAC_BOT_PAT }}

      # osac-operator, fulfillment-service, osac-aap,
      # bare-metal-fulfillment-operator, and osac-ui are all either part
      # of this mono-repo's own commit history or a real released OCI
      # chart/image dependency now -- there is no submodule left under
      # base/ to bump a commit pin toward (only osac-csi-driver remains a
      # submodule, and it isn't bumped by this workflow). The "check
      # published images, checkout submodule, sync-image-tags --fix"
      # steps that used to live here were removed for that reason, not
      # just trimmed -- there's nothing left for them to do. Only the
      # osac-test-infra pin bump below still applies.
      - name: Bump pinned osac-test-infra reusable-workflow SHA(s)
        id: pins
        env:
          GH_TOKEN: ${{ secrets.OSAC_BOT_PAT }}
        run: |
          set -euo pipefail

          LATEST=$(gh api repos/osac-project/osac-test-infra/commits?sha=main\&per_page=1 --jq '.[0].sha')
          echo "Latest osac-test-infra main: ${LATEST}"

          if ! [[ "${LATEST}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: could not resolve a valid osac-test-infra main SHA (got: '${LATEST}')" >&2
            exit 1
          fi

          # osac-test-infra publishes no tags/releases, so Dependabot's github-actions
          # ecosystem has nothing to track — these SHA pins (used for supply-chain
          # hardening) need bumping here instead, or they silently go stale.
          # Matches: osac-project/osac-test-infra/.github/workflows/<name>.yml@<40-char-sha>
          PIN_RE='osac-test-infra/\.github/workflows/[A-Za-z0-9_.-]+\.ya?ml@[0-9a-f]{40}'
          FILES=$(grep -lRE "${PIN_RE}" .github/workflows/ || true)

          changed=false
          summary=""
          for f in ${FILES}; do
            # Check every distinct pin in the file, not just the first, so a
            # file with multiple references gets fully updated in one pass.
            while read -r CURRENT; do
              [[ -z "${CURRENT}" || "${CURRENT}" == "${LATEST}" ]] && continue
              sed -i -E "s#(osac-test-infra/\.github/workflows/[A-Za-z0-9_.-]+\.ya?ml@)${CURRENT}#\1${LATEST}#g" "${f}"
              changed=true
              summary="${summary}- **osac-test-infra pin** (\`${f}\`): ${CURRENT:0:7} → ${LATEST:0:7}\n"
              echo "${f}: ${CURRENT:0:7} -> ${LATEST:0:7}"
            done < <(grep -oE "${PIN_RE}" "${f}" | grep -oE '[0-9a-f]{40}' | sort -u)
          done

          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          echo -e "${summary}" >> /tmp/bump-summary.txt

      - name: Create or update PR
        if: steps.pins.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.OSAC_BOT_PAT }}
        run: |
          BRANCH="auto/bump-pinned-refs"
          git config user.name "osac-dev-bot"
          git config user.email "osac-dev-bot@users.noreply.github.com"
          git add -A

          # Skip if bump branch already has identical content
          git fetch origin "${BRANCH}" || true
          EXISTING_TREE=$(git rev-parse "refs/remotes/origin/${BRANCH}^{tree}" || echo "")
          NEW_TREE=$(git write-tree)
          if [[ -n "${EXISTING_TREE}" && "${NEW_TREE}" == "${EXISTING_TREE}" ]]; then
            echo "Bump branch already up to date, skipping"
            exit 0
          fi

          git commit -m "bump pinned osac-test-infra refs"
          git push origin "HEAD:${BRANCH}" --force

          BODY=$(cat <<BODY_EOF
          ## Automated pinned-ref bump

          $(cat /tmp/bump-summary.txt)

          \`osac-test-infra\` pin bumps track its \`main\` branch directly,
          since that repo publishes no tags for Dependabot to track.
          Runs every 3 hours via [bump-pinned-refs workflow](../actions/workflows/bump-submodules.yaml).
          BODY_EOF
          )

          EXISTING=$(gh pr list --head "${BRANCH}" --json number --jq '.[0].number // empty')
          if [[ -n "${EXISTING}" ]]; then
            gh pr edit "${EXISTING}" --body "${BODY}"
            echo "Updated existing PR #${EXISTING}"
          else
            gh pr create \
              --title "bump pinned refs" \
              --body "${BODY}" \
              --base main \
              --head "${BRANCH}"
          fi
