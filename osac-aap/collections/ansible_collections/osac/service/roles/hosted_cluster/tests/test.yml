---
- name: NodePools select agents using the requested instance type
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../../../../../../group_vars/all/osac_common_labels.yaml
  vars:
    nodepool_prefix: nodepool-test
    hosted_cluster_name: test
    hosted_cluster_namespace: test-work
    hosted_cluster_default_cluster_order_label:
      osac.openshift.io/clusterorder: test
    ocp_release_image: example.test/release:latest
    hosted_cluster_node_requests:
      - numberOfNodes: 2
        bareMetal:
          instanceType: bm.large
  tasks:
    - name: Build NodePools from instance types
      ansible.builtin.include_role:
        name: osac.service.hosted_cluster
        tasks_from: build_nodepools.yaml

    - name: Verify NodePool name and selectors
      ansible.builtin.assert:
        that:
          - nodepool_definitions | length == 1
          - nodepool_definitions[0].metadata.name == 'nodepool-test-bm.large'
          - nodepool_definitions[0].metadata.labels['osac.openshift.io/instance_type'] == 'bm.large'
          - nodepool_definitions[0].spec.platform.agent.agentLabelSelector.matchLabels['osac.openshift.io/instance_type'] == 'bm.large'
          - "'osac.openshift.io/resource_class' not in nodepool_definitions[0].metadata.labels"
          - "'osac.openshift.io/resource_class' not in nodepool_definitions[0].spec.platform.agent.agentLabelSelector.matchLabels"
          - nodepool_definitions[0].spec.replicas == 2

- name: NodePools aggregate multiple node sets using the same instance type
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../../../../../../group_vars/all/osac_common_labels.yaml
  vars:
    nodepool_prefix: nodepool-test
    hosted_cluster_name: test
    hosted_cluster_namespace: test-work
    hosted_cluster_default_cluster_order_label:
      osac.openshift.io/clusterorder: test
    ocp_release_image: example.test/release:latest
    hosted_cluster_node_requests:
      - numberOfNodes: 2
        bareMetal:
          instanceType: bm.large
      - numberOfNodes: 3
        bareMetal:
          instanceType: bm.large
  tasks:
    - name: Clear NodePools from the previous test play
      ansible.builtin.set_fact:
        nodepool_definitions: []

    - name: Build NodePools from two node sets
      ansible.builtin.include_role:
        name: osac.service.hosted_cluster
        tasks_from: build_nodepools.yaml

    - name: Verify shared instance type has the sum of requested nodes
      ansible.builtin.assert:
        that:
          - nodepool_definitions | length == 1
          - nodepool_definitions[0].metadata.name == 'nodepool-test-bm.large'
          - nodepool_definitions[0].spec.replicas == 5
