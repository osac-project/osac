cliImage: quay.io/openshift/origin-cli:4.20.0

# origin-cli has a root image default. OpenShift's restricted SCC provides an
# arbitrary UID; Kind profiles supply their compatible numeric UID override.
cliJobPodSecurityContext:
  runAsNonRoot: true

# OLM CatalogSource for operator Subscriptions.
# Override these when using a mirrored catalog in disconnected environments.
catalogSource: redhat-operators
catalogSourceNamespace: openshift-marketplace

certManager:
  enabled: true
  channel: "stable-v1"

trustManager:
  enabled: true

aapOperator:
  enabled: true
  channel: stable-2.6-cluster-scoped

lvms:
  enabled: false
  channel: "stable-4.22"

metallb:
  enabled: false
  channel: "stable"

cnv:
  enabled: false
  channel: "stable"

evpn:
  enabled: false
  nmstate:
    install: true
    channel: stable

mce:
  # Opt in only when this installation owns the multicluster engine lifecycle.
  enabled: false
  channel: "stable-2.17"

kafka:
  enabled: false
  channel: "stable"
