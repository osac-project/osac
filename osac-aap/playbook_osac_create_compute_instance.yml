---
- name: Create a compute instance from a ComputeInstance
  hosts: localhost
  gather_facts: false

  vars:
    compute_instance: "{{ osac_job_vars.resource }}"
    compute_instance_name: "{{ osac_job_vars.resource.metadata.name }}"
    template_id: "{{ osac_job_vars.resource.spec.templateID }}"
    template_parameters: {}
    tenant_storage_classes: "{{ osac_job_vars.tenant_storage_classes | default([]) }}"
    # Overridable so tests can stub out the real Helm install while still
    # exercising this playbook's own when: gate and vars: mapping, matching
    # the pattern osac.templates.ocp_virt_vm already uses for its
    # create_step_* hooks.
    csi_driver_install_default:
      name: osac.service.csi_driver_install
      tasks_from: main.yaml

  pre_tasks:
    - name: Show resource metadata
      ansible.builtin.debug:
        var: osac_job_vars.resource.metadata

    - name: Set tenant identity from ComputeInstance tenant reference
      ansible.builtin.set_fact:
        tenant_name: "{{ compute_instance.status.tenantReference.name }}"
        tenant_namespace: "{{ compute_instance.status.tenantReference.namespace }}"

    - name: Set storage classes context for downstream roles
      ansible.builtin.set_fact:
        tenant_storage_class_storage_classes: "{{ tenant_storage_classes }}"
        tenant_storage_class_tenant_name: >-
          {{
            compute_instance.status.tenantReference.name
            if compute_instance.status is defined and compute_instance.status.tenantReference is defined
            else (compute_instance.metadata.annotations | default({})).get('osac.openshift.io/tenant', 'unknown')
          }}

    - name: Validate optional storage_tier_definitions type
      ansible.builtin.fail:
        msg: >-
          osac_job_vars.storage_tier_definitions must be an array when provided.
          Example: [{"name":"default","protocol":"nfs","provider":"vast","backend_id":"be-001"}]
      when: >-
        osac_job_vars.storage_tier_definitions is defined and
        (osac_job_vars.storage_tier_definitions is not sequence or
         osac_job_vars.storage_tier_definitions is string or
         osac_job_vars.storage_tier_definitions is mapping)

    - name: Collect unique storage tiers from CR payload
      ansible.builtin.set_fact:
        _cr_requested_tiers: >-
          {{ ([compute_instance.spec.bootDisk.storageTier | default('')]
              + (compute_instance.spec.additionalDisks | default([]) | map(attribute='storageTier', default='') | list))
             | map('trim') | map('lower') | select | unique | list }}

    - name: Filter storage tier definitions to requested tiers for JIT storage
      when: (osac_job_vars.storage_tier_definitions | default([])) | length > 0
      block:
        - name: Filter to only the requested tiers
          ansible.builtin.set_fact:
            _jit_storage_tiers: >-
              {% set _matched = [] -%}
              {% for _td in osac_job_vars.storage_tier_definitions -%}
              {% if (_td.name | default('') | string | trim | lower) in _cr_requested_tiers -%}
              {% set _ = _matched.append(_td) -%}
              {% endif -%}
              {% endfor -%}
              {{ _matched }}

        - name: Warn if no requested tiers found in storage_tier_definitions
          ansible.builtin.debug:
            msg: >-
              None of the requested storage tiers {{ _cr_requested_tiers | to_json }}
              found in storage_tier_definitions.
              Available tiers: {{ osac_job_vars.storage_tier_definitions | map(attribute='name') | list | to_json }}.
              JIT storage provisioning will be skipped.
          when: _jit_storage_tiers | length == 0

    - name: Get configured remote cluster kubeconfig for compute instance storage
      ansible.builtin.include_role:
        name: osac.service.common
        tasks_from: get_remote_cluster_kubeconfig.yaml

    - name: Ensure storage is provisioned for tenant (JIT)
      when: _jit_storage_tiers is defined and _jit_storage_tiers | length > 0
      ansible.builtin.include_role:
        name: osac.service.storage_provider
      vars:
        storage_provider_action: ensure_storage_class
        storage_provider_tiers: "{{ _jit_storage_tiers }}"
        storage_provider_backend_connections: "{{ osac_job_vars.storage_backend_connections | default({}) }}"
        storage_provider_provisioning_target: vmaas
        storage_provider_target_kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
        storage_provider_block_encryption_passphrase: "{{ osac_job_vars.resource.spec.blockEncryptionPassphrase | default('') }}"

    - name: Add JIT-provisioned StorageClasses to resolution list
      ansible.builtin.set_fact:
        tenant_storage_class_storage_classes: >-
          {{ tenant_storage_class_storage_classes + (storage_provider_storage_class_names | default([])) }}
      when:
        - storage_provider_storage_class_names is defined
        - storage_provider_storage_class_names | length > 0

    - name: Fail if tenant storage classes not available
      ansible.builtin.fail:
        msg: >-
          ComputeInstance '{{ compute_instance_name }}' has no tenant_storage_classes
          available. Either the osac-operator CI controller should inject the resolved
          storageClasses list before triggering provisioning (check Tenant StorageReady
          and ClusterStorageReady conditions), or JIT storage provisioning via
          storage_tier_definitions must succeed.
      when:
        - tenant_storage_class_storage_classes | length == 0
        - _jit_storage_tiers is not defined or _jit_storage_tiers | length == 0

    - name: Deduplicate resolved tenant storage classes
      ansible.builtin.set_fact:
        tenant_storage_class_storage_classes: >-
          {% set _normalized = [] -%}
          {% for _sc in tenant_storage_class_storage_classes -%}
          {% set _ = _normalized.append(_sc | combine({'tier': (_sc.tier | default('') | string | trim | lower)})) -%}
          {% endfor -%}
          {{ _normalized | unique | list }}
        _resolved_valid_tiers: >-
          {{ tenant_storage_class_storage_classes
             | selectattr('name', 'defined')
             | rejectattr('name', 'equalto', '')
             | map(attribute='tier')
             | map('trim')
             | map('lower')
             | reject('equalto', '')
             | unique
             | list }}

    - name: Check requested storage tier coverage and ambiguity
      ansible.builtin.set_fact:
        _missing_requested_tiers: "{{ _cr_requested_tiers | difference(_resolved_valid_tiers) }}"
        _ambiguous_requested_tiers: >-
          {% set _ambiguous = [] -%}
          {% for _tier in _cr_requested_tiers -%}
          {% set _names = (tenant_storage_class_storage_classes | selectattr('tier', 'equalto', _tier) | selectattr('name', 'defined') | map(attribute='name') | reject('equalto', '') | unique | sort | list) -%}
          {% if (_names | length) > 1 -%}
          {% set _ = _ambiguous.append(_tier ~ ' (' ~ (_names | join(', ')) ~ ')') -%}
          {% endif -%}
          {% endfor -%}
          {{ _ambiguous }}

    - name: Fail if any requested storage tier is not resolved
      ansible.builtin.fail:
        msg: >-
          ComputeInstance '{{ compute_instance_name }}' for tenant
          '{{ tenant_storage_class_tenant_name }}' requested storage tier(s)
          {{ _missing_requested_tiers | to_json }} that are not available in
          resolved tenant_storage_classes (available tiers:
          {{ _resolved_valid_tiers | sort | join(', ') | default('none', true) }}).
      when: _missing_requested_tiers | length > 0

    - name: Fail if any requested storage tier maps to multiple conflicting StorageClasses
      ansible.builtin.fail:
        msg: >-
          ComputeInstance '{{ compute_instance_name }}' for tenant
          '{{ tenant_storage_class_tenant_name }}' has ambiguous StorageClass
          mappings for requested tier(s): {{ _ambiguous_requested_tiers | join('; ') }}.
      when: _ambiguous_requested_tiers | length > 0

  tasks:
    - name: Display compute instance information
      ansible.builtin.debug:
        msg:
          - "Compute instance name: {{ compute_instance_name }}"
          - "Template ID: {{ template_id }}"
          - "Template parameters: {{ template_parameters }}"

    - name: "Set the finalizer on the OSAC compute instance {{ compute_instance_name }}"
      ansible.builtin.include_role:
        name: osac.service.finalizer
      vars:
        finalizer_state: present
        finalizer_name: "{{ compute_instance_osac_finalizer }}"
        finalizer_target:
          api_version: osac.openshift.io/v1alpha1
          kind: ComputeInstance
          namespace: "{{ compute_instance.metadata.namespace }}"
          name: "{{ compute_instance_name }}"

    - name: Call the selected compute instance template
      ansible.builtin.include_role:
        name: "{{ template_id }}"
        tasks_from: "create"
