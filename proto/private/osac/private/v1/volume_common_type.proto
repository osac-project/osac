syntax = "proto3";

package osac.private.v1;

import "buf/validate/validate.proto";
import "cleanapi/cleanapi.proto";

option (cleanapi.file).package = "osac.public.v1";

// Type of the workload that owns a volume.
enum VolumeOwnerType {
  // Owner type is unknown or has not been specified.
  VOLUME_OWNER_TYPE_UNSPECIFIED = 0;

  // The volume is owned by a ComputeInstance.
  VOLUME_OWNER_TYPE_COMPUTE_INSTANCE = 1;
}

// Owning workload of a volume. Volumes created through the private API on
// behalf of a workload carry this reference so that the volume's lifecycle
// is bound to its owner.
message VolumeOwner {
  // Type of the owning workload.
  VolumeOwnerType type = 1 [(buf.validate.field).enum.defined_only = true];

  // Identifier of the owning workload record (for a ComputeInstance, its
  // identifier, for example "ci-...").
  string reference = 2 [(buf.validate.field).string.min_len = 1];
}
