---
- name: Create storage backend resources for a tenant (Stage 1)
  hosts: localhost
  gather_facts: false

  vars:
    tenant_name: "{{ osac_job_vars.resource.metadata.name }}"
    tenant_namespace: "{{ osac_job_vars.resource.metadata.namespace }}"
    tenant_uid: "{{ osac_job_vars.resource.metadata.uid }}"
  pre_tasks:
    - name: Show resource metadata
      ansible.builtin.debug:
        var: osac_job_vars.resource.metadata

    - name: Validate tenant payload is present
      ansible.builtin.fail:
        msg: "tenant must be provided via osac_job_vars.resource with metadata.name, metadata.namespace, and metadata.uid set"
      when: >-
        osac_job_vars is not defined or
        osac_job_vars.resource.metadata.name is not defined or
        osac_job_vars.resource.metadata.name | length == 0 or
        osac_job_vars.resource.metadata.namespace is not defined or
        osac_job_vars.resource.metadata.namespace | length == 0 or
        osac_job_vars.resource.metadata.uid is not defined or
        osac_job_vars.resource.metadata.uid | length == 0

    - name: Validate storage_tier_definitions is a non-empty array in the EDA event
      ansible.builtin.fail:
        msg: >-
          osac_job_vars.storage_tier_definitions must be a non-empty array, populated
          by osac-operator from the Tenant's resolved storage tiers.
          Example: [{"name":"default","protocol":"nfs","provider":"vast","backend_id":"be-001"}]
      when: >-
        osac_job_vars.storage_tier_definitions is not defined or
        osac_job_vars.storage_tier_definitions is not sequence or
        osac_job_vars.storage_tier_definitions is string or
        osac_job_vars.storage_tier_definitions is mapping or
        osac_job_vars.storage_tier_definitions | length == 0

  tasks:
    - name: Configure tenant storage backend
      ansible.builtin.include_role:
        name: osac.service.storage_provider
      vars:
        storage_provider_action: setup
        storage_provider_tiers: "{{ osac_job_vars.storage_tier_definitions }}"
        storage_provider_backend_connections: "{{ osac_job_vars.storage_backend_connections | default({}) }}"
        storage_provider_block_encryption_passphrase: "{{ osac_job_vars.resource.spec.blockEncryptionPassphrase | default('') }}"

    # The umbrella installer owns the shared csi-backends controller Services under
    # OSAC-4252. AAP's csi_driver_install role consumes those Services and fails fast
    # if the umbrella has not provisioned the requested vendor yet.
    # Gated by csi_driver_install_enabled (default false).
    - name: Install OSAC CSI driver (once per dispatch, regardless of provider count)
      when: csi_driver_install_enabled | default(false) | bool
      block:
        - name: Resolve the CSI installer target
          ansible.builtin.include_role:
            name: osac.service.csi_driver_install
            tasks_from: select_test_override_target.yaml
          vars:
            csi_driver_install_tiers: "{{ osac_job_vars.storage_tier_definitions }}"

        - name: Install the test-only CSI driver override
          when:
            - lookup('env', 'OSAC_AAP_ENABLE_TEST_INSTALL_OVERRIDES', default='false') | bool
            - csi_driver_install_override is defined
          ansible.builtin.include_role:
            name: "{{ csi_driver_install_override.name }}"
            tasks_from: "{{ csi_driver_install_override.tasks_from }}"
          vars:
            csi_driver_install_tiers: "{{ osac_job_vars.storage_tier_definitions }}"
            # StorageClasses belong to Stage 2, after backend readiness is confirmed.
            csi_driver_install_skip_lvms_storage_class: true

        - name: Install the production OSAC CSI driver role
          when: >-
            not (lookup('env', 'OSAC_AAP_ENABLE_TEST_INSTALL_OVERRIDES', default='false') | bool
                 and csi_driver_install_override is defined)
          ansible.builtin.include_role:
            name: osac.service.csi_driver_install
            tasks_from: main.yaml
          vars:
            csi_driver_install_tiers: "{{ osac_job_vars.storage_tier_definitions }}"
            csi_driver_install_skip_lvms_storage_class: true
