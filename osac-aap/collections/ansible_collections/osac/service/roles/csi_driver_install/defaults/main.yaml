---
# OSAC CSI driver Helm chart install — defaults use this role's own name
# prefix, matching every sibling osac.service role's convention.

csi_driver_install_chart_registry: "oci://ghcr.io/osac-project/charts"

# PLACEHOLDER -- no osac-csi-driver/vX.Y.Z release tag has been cut yet, so no
# real chart version exists. Override once one is published.
csi_driver_install_chart_version: "0.0.0"

csi_driver_install_namespace: "osac-csi"
csi_driver_install_backends_namespace: "osac-csi-backends"

# Vendors the csi-driver chart knows how to enable. Dispatched providers
# outside this list are logged and skipped rather than failing the whole
# install, since storage_provider's own provider validation is separate
# from what this chart happens to support today.
csi_driver_install_supported_vendors:
  - vast
  - pure
  - trident

# Per-vendor node CSI socket directory, mirroring the csi-driver chart's own
# vendors.<name>.node.socketPath defaults (osac-csi-driver/charts/csi-driver/
# values.yaml). These are chart-version-invariant constants, so the role reads
# them from here instead of fetching the chart's default values over the OCI
# registry on every dispatch. Keep in sync with the chart if a vendor's
# socketPath ever changes there; the role appends '/csi.sock' to each.
csi_driver_install_vendor_node_socket_paths:
  vast: /var/lib/kubelet/plugins/csi.vast.vastdata.com
  pure: /var/lib/kubelet/plugins/csi.pure.purestorage.com
  trident: /var/lib/kubelet/plugins/csi.trident.netapp.io
