        api_version: storage.k8s.io/v1
        kind: StorageClass
        name: "{{ _sc_extreme }}"
      register: _nf_bound_sc
      no_log: true

    - name: Assert StorageClass was recreated with storagePools when TBC became Bound
      ansible.builtin.assert:
        that:
          - _nf_bound_sc.resources | length == 1
          - _nf_bound_sc.resources[0].parameters['backendType'] == 'ontap-san'
          - _nf_bound_sc.resources[0].parameters['selector'] == 'performance=extreme'
          - _nf_bound_sc.resources[0].parameters['storagePools'] == 'osiscsibackend:.*'
        fail_msg: "StorageClass was not updated with storagePools when customer TBC became Bound"
        success_msg: "StorageClass recreated with storagePools after NotFound -> Bound transition"
      no_log: true

