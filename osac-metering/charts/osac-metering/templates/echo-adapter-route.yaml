{{- /* The echo adapter's ingress. OpenShift Route only: kind and vcluster
     have no Route API, and their ingress (or the CI run setup) exposes the
     Service by other means. */}}
{{- if and .Values.echoAdapter.enabled (eq .Values.variant "openshift") }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "osac-metering.fullname" . }}-echo-adapter
  labels:
    {{- include "osac-metering.labels" . | nindent 4 }}
    app.kubernetes.io/component: echo-adapter
spec:
  to:
    kind: Service
    name: {{ include "osac-metering.fullname" . }}-echo-adapter
  port:
    targetPort: http
  tls:
    termination: edge
{{- end }}
