suite: image tag validation
templates:
  - templates/*.yaml
release:
  name: osac
  namespace: osac
capabilities:
  apiVersions:
    - monitoring.coreos.com/v1
set:
  global.observability.enabled: true
  global.observability.objectStorage.secretName: thanos-object-storage
  global.observability.objectStorage.endpoint: https://s3.example.com
  global.observability.objectStorage.bucket: thanos
  global.observability.objectStorage.region: us-east-1
  global.observability.thanos.image.registry: registry.redhat.io
  global.observability.thanos.image.repository: openshift4/ose-thanos-rhel8
  global.observability.thanos.image.tag: test-thanos
  global.observability.services.metricsAuth.tag: test-metrics-auth
  global.observability.services.oauth2Proxy.tag: test-oauth2-proxy
  global.observability.services.openshiftOauthProxy.tag: test-ose-oauth-proxy
  global.observability.keycloak.issuerUrl: https://keycloak.example.com/realms/osac

tests:
  # An empty tag used to fall back to "latest", which pulls whatever the
  # registry happens to hold. Every image the chart runs must be pinned.
  - it: fails the render when the Thanos image tag is empty
    template: templates/validate.yaml
    set:
      global.observability.thanos.image.tag: ""
    asserts:
      - failedTemplate:
          errorMessage: "observability image tags must be set when observability is enabled: global.observability.thanos.image.tag"

  - it: fails the render when the metrics-auth image tag is empty
    template: templates/validate.yaml
    set:
      global.observability.services.metricsAuth.tag: ""
    asserts:
      - failedTemplate:
          errorMessage: "observability image tags must be set when observability is enabled: global.observability.services.metricsAuth.tag"

  - it: fails the render when the oauth2-proxy image tag is empty
    template: templates/validate.yaml
    set:
      global.observability.services.oauth2Proxy.tag: ""
    asserts:
      - failedTemplate:
          errorMessage: "observability image tags must be set when observability is enabled: global.observability.services.oauth2Proxy.tag"

  - it: fails the render when the OpenShift oauth-proxy image tag is empty
    template: templates/validate.yaml
    set:
      global.observability.services.openshiftOauthProxy.tag: ""
    asserts:
      - failedTemplate:
          errorMessage: "observability image tags must be set when observability is enabled: global.observability.services.openshiftOauthProxy.tag"

  # An empty issuer renders an empty --oidc-issuer-url, which would accept a
  # token from any realm, so the render fails and names the key.
  - it: fails the render when the Keycloak issuer is empty
    template: templates/validate.yaml
    set:
      global.observability.keycloak.issuerUrl: ""
    asserts:
      - failedTemplate:
          errorMessage: 'global.observability.keycloak.issuerUrl must be set (with global.clusterDomain resolvable) when observability is enabled (got "")'

  - it: fails the render when the issuer tpl default has no cluster domain
    template: templates/validate.yaml
    set:
      global.observability.keycloak.issuerUrl: "https://keycloak-keycloak.{{ .Values.global.clusterDomain }}/realms/osac"
      global.clusterDomain: ""
    asserts:
      - failedTemplate:
          errorMessage: 'global.observability.keycloak.issuerUrl must be set (with global.clusterDomain resolvable) when observability is enabled (got "https://keycloak-keycloak./realms/osac")'

  - it: renders no document when every image tag is set
    template: templates/validate.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: does not require image tags when observability is disabled
    template: templates/validate.yaml
    set:
      global.observability.enabled: false
      global.observability.thanos.image.tag: ""
      global.observability.services.metricsAuth.tag: ""
      global.observability.services.oauth2Proxy.tag: ""
      global.observability.services.openshiftOauthProxy.tag: ""
    asserts:
      - hasDocuments:
          count: 0
