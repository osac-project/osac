---
- name: Teardown a hosted control plane cluster from a ClusterOrder
  hosts: localhost
  gather_facts: false

  vars:
    cluster_order: "{{ osac_job_vars.resource }}"

  pre_tasks:
    - name: Apply default settings
      ansible.builtin.include_role:
        name: osac.service.cluster_settings

    - name: Extract template info
      ansible.builtin.include_role:
        name: osac.service.extract_template_info

    - name: Determine working namespace
      ansible.builtin.include_role:
        name: osac.service.cluster_working_namespace
      vars:
        cluster_working_namespace_cluster_order_name: >-
          {{ cluster_order.metadata.name }}
        cluster_working_namespace_allow_missing: true

  tasks:
    - name: Call the selected template
      ansible.builtin.include_role:
        name: "{{ template_id }}"
        tasks_from: "delete"
      when: cluster_working_namespace is defined

    - name: Remove ClusterOrder infrastructure finalizer
      ansible.builtin.include_role:
        name: osac.service.finalizer
      vars:
        finalizer_state: absent
        finalizer_name: "{{ cluster_order_infrastructure_finalizer }}"
        finalizer_target:
          api_version: osac.openshift.io/v1alpha1
          kind: ClusterOrder
          namespace: "{{ lookup('env', 'POD_NAMESPACE') }}"
          name: "{{ cluster_order.metadata.name }}"

    - name: Remove Namespace infrastructure finalizer
      ansible.builtin.include_role:
        name: osac.service.finalizer
      vars:
        finalizer_state: absent
        finalizer_name: "{{ cluster_order_infrastructure_finalizer }}"
        finalizer_target:
          api_version: v1
          kind: Namespace
          name: "{{ cluster_working_namespace }}"
      when: cluster_working_namespace is defined
