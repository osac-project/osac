{{- $ns := include "osac-metering.kafkaClusterNamespace" . -}}
{{- $cluster := include "osac-metering.kafkaClusterName" . -}}
{{- $replicas := include "osac-metering.kafkaReplicas" . | int -}}
{{- $minIsr := min $replicas 2 -}}
{{- $prefix := .Values.topicPrefix -}}
{{- range list
  (dict "name" (printf "%s.metering.lifecycle"   $prefix) "partitions" 3 "retentionDays" 30)
  (dict "name" (printf "%s.metering.heartbeat"   $prefix) "partitions" 3 "retentionDays" 30)
  (dict "name" (printf "%s.metering.inference"   $prefix) "partitions" 3 "retentionDays" 30)
  (dict "name" (printf "%s.metering.corrections" $prefix) "partitions" 3 "retentionDays" 30)
  (dict "name" (printf "%s.metering.dlq"         $prefix) "partitions" 1 "retentionDays" 90)
}}
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: {{ .name }}
  namespace: {{ $ns }}
  labels:
    strimzi.io/cluster: {{ $cluster }}
spec:
  partitions: {{ .partitions }}
  replicas: {{ $replicas }}
  config:
    retention.ms: "{{ mul .retentionDays 86400000 }}"
    min.insync.replicas: "{{ $minIsr }}"
    cleanup.policy: delete
---
{{- end }}
