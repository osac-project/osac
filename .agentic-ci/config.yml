# agentic-ci configuration for coding-agent runs (Red Hat's Jira autofix bot)
# on this repository.
#
# `sandbox:` is a repo overlay for the agentic-ci sandbox profile, read from
# the base branch before the agent runs. See
# https://github.com/opendatahub-io/agentic-ci/blob/main/docs/sandbox-profiles.md
# An overlay may pin catalog toolchains, open only the goproxy, npm and pypi
# egress presets, run `setup` steps in the sandbox before the agent and
# `validate` steps after it, declare `skips` and set `env`. Anything wider
# (more hosts, resources) is configured centrally in autofix.
#
# Versions mirror the repo's own pins: go.work (go), tools/golangci-lint.mk
# (golangci-lint), helm-lint.yaml (helm), osac-ui/package.json packageManager
# (pnpm), osac-aap/.python-version (python). Bump them here when those move.
# Validate steps only check the components a change touches: the diff
# against the merge base with origin/HEAD (or origin/HEAD itself when the
# history is too shallow). Without origin/HEAD, component checks run for
# every component and the file-level checks are skipped.

sandbox:
  toolchains:
    go: "1.26.3"             # go.work (no go.mod at the repo root, so no auto)
    golangci-lint: "2.13.2"  # tools/golangci-lint.mk
    helm: "3.22.0"           # .github/workflows/helm-lint.yaml
    node: "22.23.3"          # osac-ui Containerfile builds on Node.js 22
    pnpm: "9.15.9"           # osac-ui/package.json packageManager
    python: "3.13.16"        # osac-aap/.python-version (fulfillment-service uses the image's 3.14)

  egress:
    - goproxy
    - npm
    - pypi

  env:
    GOFLAGS: "-modcacherw"
    UV_PYTHON_DOWNLOADS: "never"
    # Keep the Makefile-installed tools (controller-gen, golangci-lint) out of
    # the workdir: both Makefile variables are `?=`.
    LOCALBIN: "/sandbox/.local/share/osac/bin"
    GOLANGCI_LINT_BIN: "/sandbox/.local/share/osac/golangci-lint"

  setup:
    - name: go-modules
      timeout: 1200
      run: |
        set -euo pipefail
        # Download what every workspace module's packages and tests import
        # (`go mod download` would fetch the whole module graph, several GB).
        for dir in $(go list -m -f '{{.Dir}}'); do
          (cd "$dir" && go list -deps -test ./... >/dev/null)
        done
    - name: go-tools
      timeout: 900
      run: |
        set -euo pipefail
        mkdir -p "$GOLANGCI_LINT_BIN" "$HOME/.local/bin"
        # Reuse the catalog golangci-lint when it matches tools/golangci-lint.mk;
        # otherwise the make target below go-installs the pinned version.
        want=$(sed -n 's/^GOLANGCI_LINT_VERSION ?= *//p' tools/golangci-lint.mk)
        if [ "v$(golangci-lint version --short)" = "$want" ]; then
          ln -sf "$(command -v golangci-lint)" "$GOLANGCI_LINT_BIN/golangci-lint-$want"
        fi
        make -C osac-operator golangci-lint controller-gen
        make -C bare-metal-fulfillment-operator controller-gen
        # ginkgo at the version fulfillment-service/go.mod requires (as CI does).
        (cd fulfillment-service && GOBIN="$HOME/.local/bin" go install github.com/onsi/ginkgo/v2/ginkgo)
    - name: python
      timeout: 900
      run: |
        set -euo pipefail
        uv tool install ruff==0.15.16  # .github/actions/setup-python
        uv tool install yamllint==1.35.1  # .pre-commit-config.yaml
        (cd fulfillment-service && uv sync --locked)
        # python-esiclient comes from a GitHub git source (not an egress
        # preset); ansible-lint and the unit tests do not import it.
        (cd osac-aap && uv sync --locked --all-extras --group development \
          --no-install-package python-esiclient)
    - name: osac-ui-deps
      timeout: 900
      run: cd osac-ui && pnpm install --frozen-lockfile

  validate:
    - name: hygiene
      kind: lint
      timeout: 300
      run: |
        set -euo pipefail
        base=$(git merge-base origin/HEAD HEAD 2>/dev/null || git rev-parse -q --verify origin/HEAD || true)
        if [ -z "$base" ]; then echo "no origin/HEAD to diff against; skipped"; exit 0; fi
        # Same scope as .pre-commit-config.yaml: skip vendored and generated trees.
        excl=(':!osac-aap/vendor' ':!osac-aap/charts' ':!osac-installer/charts' ':!osac-ui/libs/types/src')
        # Trailing whitespace, blank lines at EOF and conflict markers in added lines.
        git -c core.whitespace=trailing-space,blank-at-eof,-space-before-tab,-indent-with-non-tab \
          diff --check "$base" -- . "${excl[@]}"
        mapfile -t files < <( { git diff --name-only --diff-filter=d "$base" -- . "${excl[@]}";
          git ls-files --others --exclude-standard -- . "${excl[@]}"; } | sort -u)
        yaml=() json=()
        for f in "${files[@]}"; do
          case "$f" in
            */templates/*|osac-operator/config/*|bare-metal-fulfillment-operator/config/*) ;;
            *.yaml|*.yml) yaml+=("$f") ;;
            *.json) json+=("$f") ;;
          esac
        done
        if [ "${#yaml[@]}" -gt 0 ]; then yamllint --strict "${yaml[@]}"; fi
        for f in "${json[@]}"; do python3 -m json.tool "$f" >/dev/null; done
    - name: go-lint
      kind: lint
      timeout: 1200
      run: |
        set -euo pipefail
        base=$(git merge-base origin/HEAD HEAD 2>/dev/null || git rev-parse -q --verify origin/HEAD || true)
        changed() { [ -z "$base" ] && return 0
          { git diff --name-only "$base" -- "$@"; git ls-files --others --exclude-standard -- "$@"; } | grep -q .; }
        rc=0
        # The pre-commit golangci-lint hooks, without --fix.
        if changed 'fulfillment-service/*.go' 'fulfillment-service/.golangci.yml'; then
          (cd fulfillment-service && uv run dev.py lint go) || rc=1
        fi
        for m in osac-operator bare-metal-fulfillment-operator osac-csi-driver \
                 osac-metering/metering-service osac-metering/adapters osac-metering/schema; do
          if changed "$m/*.go" "$m/.golangci.yml" "$m/go.mod"; then make -C "$m" lint || rc=1; fi
        done
        if changed 'osac-ui/proxy/*.go' 'osac-ui/proxy/.golangci.yml'; then
          (cd osac-ui/proxy && golangci-lint run) || rc=1  # osac-ui-lint.yaml
        fi
        exit "$rc"
    - name: go-test
      kind: test
      timeout: 1800
      run: |
        set -euo pipefail
        base=$(git merge-base origin/HEAD HEAD 2>/dev/null || git rev-parse -q --verify origin/HEAD || true)
        changed() { [ -z "$base" ] && return 0
          { git diff --name-only "$base" -- "$@"; git ls-files --others --exclude-standard -- "$@"; } | grep -q .; }
        # Unit tests as in unit-tests.yml / the component Makefiles, minus the
        # packages that need envtest assets or a podman database/Kafka and
        # one spec that needs the internet (see skips).
        rc=0
        run_tests() {
          local dir=$1; shift
          mapfile -t pkgs < <(cd "$dir" && go list -f '{{.ImportPath}} {{.Dir}}' "$@" |
            while read -r pkg pdir; do
              case "$pkg" in */test/integration*|*/fulfillment-service/internal/trust) continue ;; esac
              if ! grep -qE 'envtest\.|NewContainer\(' "$pdir"/*_test.go 2>/dev/null; then echo "$pkg"; fi
            done)
          (cd "$dir" && go test -count=1 "${pkgs[@]}") || rc=1
        }
        everything=false
        if changed 'proto/*' 'go.work'; then everything=true; fi
        for spec in fulfillment-service:./internal/... osac-operator:./... \
                    bare-metal-fulfillment-operator:./... osac-csi-driver:./... \
                    osac-metering/metering-service:./internal/... osac-metering/adapters:./... \
                    osac-metering/schema:./... osac-ui/proxy:./...; do
          m=${spec%%:*}
          paths=("$m/*.go" "$m/go.mod" "$m/go.sum" "$m/*testdata*")
          # osac-operator pkg/ and api/ have external consumers (osac-operator/AGENTS.md).
          if [ "$m" = bare-metal-fulfillment-operator ]; then
            paths+=('osac-operator/pkg/*.go' 'osac-operator/api/*.go')
          fi
          if $everything || changed "${paths[@]}"; then
            run_tests "$m" "${spec#*:}"
            if [ "$m" = fulfillment-service ]; then
              (cd fulfillment-service && go test -count=1 ./internal/trust \
                -ginkgo.skip='load system certificates if explicitly disabled') || rc=1
            fi
          fi
        done
        exit "$rc"
    - name: crd-sync
      kind: generated
      timeout: 900
      run: |
        set -euo pipefail
        base=$(git merge-base origin/HEAD HEAD 2>/dev/null || git rev-parse -q --verify origin/HEAD || true)
        changed() { [ -z "$base" ] && return 0
          { git diff --name-only "$base" -- "$@"; git ls-files --others --exclude-standard -- "$@"; } | grep -q .; }
        # `make manifests generate helm-crds` must leave the tree unchanged
        # (helm-lint.yaml runs check-helm-crds). Run it on a snapshot of the
        # working tree so this check never rewrites the agent's files.
        snap=$(mktemp -d)
        # Cleanup never fails the check.
        trap 'chmod -R u+w "$snap" 2>/dev/null; rm -rf "$snap" 2>/dev/null || true' EXIT
        snapshot() {
          git ls-files -z --cached --others --exclude-standard |
            tar --null --ignore-failed-read -T - -cf - 2>/dev/null | tar -xf - -C "$snap"
          # No background maintenance: it would still write to .git at cleanup.
          git -C "$snap" init -q && git -C "$snap" config gc.auto 0 &&
            git -C "$snap" config maintenance.auto false && git -C "$snap" add -A &&
            git -C "$snap" -c user.name=v -c user.email=v@localhost commit -qm snapshot
        }
        taken=false
        for m in osac-operator bare-metal-fulfillment-operator; do
          if changed "$m/api" "$m/internal" "$m/config" "$m/charts/operator-crds" "$m/hack"; then
            $taken || { snapshot; taken=true; }
            make -C "$snap/$m" manifests generate helm-crds >/dev/null
            if [ -n "$(git -C "$snap" status --porcelain -- "$m")" ]; then
              echo "$m: generated files are stale; run 'make manifests generate helm-crds' in $m:"
              git -C "$snap" status --porcelain -- "$m"
              exit 1
            fi
          fi
        done
    - name: helm-lint
      kind: lint
      timeout: 300
      run: |
        set -euo pipefail
        base=$(git merge-base origin/HEAD HEAD 2>/dev/null || git rev-parse -q --verify origin/HEAD || true)
        changed() { [ -z "$base" ] && return 0
          { git diff --name-only "$base" -- "$@"; git ls-files --others --exclude-standard -- "$@"; } | grep -q .; }
        # Charts from the helm-lint.yaml matrix.
        for chart in osac-operator/charts/operator-crds osac-operator/charts/operator \
                     bare-metal-fulfillment-operator/charts/operator-crds \
                     bare-metal-fulfillment-operator/charts/operator \
                     fulfillment-service/charts/service osac-aap/charts/aap \
                     osac-csi-driver/charts/csi-driver osac-csi-driver/charts/csi-backends \
                     osac-metering/charts/osac-metering; do
          if changed "$chart"; then
            values=()
            if [ -f "$chart/ci-values.yaml" ]; then values=(-f "$chart/ci-values.yaml"); fi
            helm lint "$chart" "${values[@]}"
            helm template test "$chart" "${values[@]}" >/dev/null
          fi
        done
    - name: python-lint
      kind: lint
      timeout: 300
      run: |
        set -euo pipefail
        base=$(git merge-base origin/HEAD HEAD 2>/dev/null || git rev-parse -q --verify origin/HEAD || true)
        changed() { [ -z "$base" ] && return 0
          { git diff --name-only "$base" -- "$@"; git ls-files --others --exclude-standard -- "$@"; } | grep -q .; }
        if changed 'fulfillment-service/*.py' 'fulfillment-service/pyproject.toml'; then
          (cd fulfillment-service && ruff check)
        fi
        # tests/e2e/AGENTS.md: ruff check + format --check. Only the changed files:
        # main has findings that CI does not enforce.
        if [ -n "$base" ]; then
          mapfile -t e2e < <( { git diff --name-only --diff-filter=d "$base" -- 'tests/e2e/*.py';
            git ls-files --others --exclude-standard -- 'tests/e2e/*.py'; } | sort -u)
          if [ "${#e2e[@]}" -gt 0 ]; then
            ruff check "${e2e[@]}"
            ruff format --check "${e2e[@]}"
          fi
        fi
    - name: ansible
      kind: lint
      timeout: 900
      run: |
        set -euo pipefail
        base=$(git merge-base origin/HEAD HEAD 2>/dev/null || git rev-parse -q --verify origin/HEAD || true)
        changed() { [ -z "$base" ] && return 0
          { git diff --name-only "$base" -- "$@"; git ls-files --others --exclude-standard -- "$@"; } | grep -q .; }
        if changed osac-aap ':!osac-aap/vendor' ':!osac-aap/charts'; then
          cd osac-aap
          # --offline: collections are vendored and galaxy is not reachable.
          # --no-sync: setup synced .venv without the GitHub-only python-esiclient.
          uv run --no-sync ansible-lint --offline .
          uv run --no-sync pytest -q tests/unit
        fi
    - name: osac-ui
      kind: test
      timeout: 900
      run: |
        set -euo pipefail
        base=$(git merge-base origin/HEAD HEAD 2>/dev/null || git rev-parse -q --verify origin/HEAD || true)
        changed() { [ -z "$base" ] && return 0
          { git diff --name-only "$base" -- "$@"; git ls-files --others --exclude-standard -- "$@"; } | grep -q .; }
        if changed osac-ui ':!osac-ui/proxy' ':!osac-ui/charts'; then
          cd osac-ui
          # AGENTS.md pre-submit sequence (each is a separate CI job). Vitest
          # runs only the tests related to the change; CI runs them all.
          pnpm run typecheck
          pnpm lint
          if [ -n "$base" ]; then
            (cd apps/app-frontend && pnpm exec vitest run --changed "$base")
          else
            pnpm test
          fi
        fi

  skips:
    - match: "make test (envtest), go test ./internal/controller in osac-operator and bare-metal-fulfillment-operator"
      reason: "setup-envtest downloads Kubernetes control-plane binaries from GitHub, which is not an overlay egress preset; go-test runs every other package"
    - match: "fulfillment-service internal/{auth,database,servers,kafka,cmd/service/start/grpcserver}, osac-metering internal/projection"
      reason: "These suites start PostgreSQL or Kafka with podman; the sandbox has no container runtime"
    - match: "fulfillment-service internal/trust spec \"Doesn't load system certificates if explicitly disabled\""
      reason: "It sends a request to https://www.google.com, which the sandbox cannot reach; the rest of the suite runs"
    - match: "python-esiclient in the osac-aap venv"
      reason: "uv.lock pins it to a GitHub git source, which is not an overlay egress preset; ansible-lint and tests/unit do not import it"
    - match: "make -C proto generate, make -C proto lint, uv run dev.py lint proto, check-generated-code"
      reason: "buf resolves deps and remote plugins from buf.build, which is not an overlay egress preset"
    - match: "make integration-tests, fulfillment-service it/, osac-aap make test, osac-installer make test"
      reason: "Need a Kind cluster, kubectl and a deployed OSAC stack"
    - match: "tests/e2e pytest suites"
      reason: "End-to-end journeys run against a live cluster and services"
    - match: "image-build, kind-load-image, execution-environment-build, osac-ui container build"
      reason: "No podman or docker in the sandbox"
    - match: "osac-installer helm-validate, ct lint, fulfillment-trust-render-test"
      reason: "helm dependency build pulls the osac-ui chart from an OCI registry that is not an overlay egress preset"
    - match: "ansible-playbook runs, tests/integration in osac-aap"
      reason: "Playbooks act on real clusters and hosts"
    - match: "pre-commit run (gitleaks)"
      reason: "pre-commit clones hook repos from GitHub; hygiene runs the same whitespace, yamllint and JSON checks, and gitleaks only scans staged changes"
    - match: "pnpm playwright"
      reason: "Manual harness against a live, deployed cluster"
