{{- if .Values.echoAdapter.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "osac-metering.fullname" . }}-echo-adapter
  labels:
    {{- include "osac-metering.labels" . | nindent 4 }}
    app.kubernetes.io/component: echo-adapter
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "osac-metering.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: echo-adapter
  template:
    metadata:
      labels:
        {{- include "osac-metering.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: echo-adapter
    spec:
      serviceAccountName: {{ include "osac-metering.fullname" . }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: kafka-secrets
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: ca-bundle
          configMap:
            name: {{ .Values.certs.caBundle.configMap }}
        - name: tmp
          emptyDir:
            sizeLimit: 10Mi
      initContainers:
        {{- include "osac-metering.kafkaSecretsInitContainer" (list . "osac-metering-echo-adapter") | nindent 8 }}
      containers:
        - name: echo-adapter
          image: "{{ .Values.echoAdapter.image.repository }}:{{ .Values.echoAdapter.image.tag }}"
          imagePullPolicy: {{ .Values.echoAdapter.image.pullPolicy }}
          env:
            - name: KAFKA_BROKERS
              value: {{ include "osac-metering.kafkaBrokers" . | quote }}
            - name: KAFKA_TLS_CA_CERT
              value: /etc/ca-bundle/bundle.pem
            - name: KAFKA_SASL_USERNAME
              value: osac-metering-echo-adapter
            - name: KAFKA_CONSUMER_GROUP
              value: osac-metering-echo-adapter
            - name: KAFKA_SASL_PASSWORD_FILE
              value: /etc/kafka-secrets/password
            - name: METRICS_ADDR
              value: ":8080"
            {{- with .Values.echoAdapter.maxEvents }}
            # The ring buffer keeps the most recent heartbeats for the E2E
            # assertions; a long parallel session evicts old events, so size it
            # for the session, not for a single test.
            - name: ECHO_BUFFER_SIZE
              value: {{ . | quote }}
            {{- end }}
          volumeMounts:
            - name: kafka-secrets
              mountPath: /etc/kafka-secrets
              readOnly: true
            - name: ca-bundle
              mountPath: /etc/ca-bundle
              readOnly: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
{{- end }}
