---
# Playbook: deploy MaaS on RHOAI 3.5 GA (OCP 4.21.x) via the ocp_4_20_ai_maas
# template role. Runs the role's task files directly against a live cluster.
#
# Deploy only (verification is a SEPARATE playbook — see
# playbook_osac_verify_maas_deployment.yml):
#   ansible-playbook playbook_osac_create_maas_deployment.yml --tags full -v
#   ansible-playbook playbook_osac_create_maas_deployment.yml --tags operators
#   ansible-playbook playbook_osac_create_maas_deployment.yml --tags maas
#   ansible-playbook playbook_osac_create_maas_deployment.yml --tags cleanup
#
# The `verify` tag still runs verification inline if explicitly requested
# (--tags verify), but it is NOT part of `full`.

- name: Deploy MaaS on RHOAI 3.5 GA
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    # Simulate admin_kubeconfig (normally set by ocp_small pipeline)
    admin_kubeconfig: "{{ lookup('env', 'KUBECONFIG') | default('~/.kube/config', true) }}"

  pre_tasks:
    - name: Clean up leftover external subscriptions from prior runs
      kubernetes.core.k8s:
        kubeconfig: "{{ admin_kubeconfig }}"
        state: absent
        api_version: maas.opendatahub.io/v1alpha1
        kind: MaaSSubscription
        name: "{{ item.name }}-sub"
        namespace: models-as-a-service
      loop: "{{ ocp_4_20_ai_maas_external_models | default([]) }}"
      loop_control:
        label: "{{ item.name }}-sub"
      failed_when: false
      when: ocp_4_20_ai_maas_external_models | default([]) | length > 0
      tags: [always]

    - name: Clean up leftover external auth policies from prior runs
      kubernetes.core.k8s:
        kubeconfig: "{{ admin_kubeconfig }}"
        state: absent
        api_version: maas.opendatahub.io/v1alpha1
        kind: MaaSAuthPolicy
        name: "{{ item.name }}-access"
        namespace: models-as-a-service
      loop: "{{ ocp_4_20_ai_maas_external_models | default([]) }}"
      loop_control:
        label: "{{ item.name }}-access"
      failed_when: false
      when: ocp_4_20_ai_maas_external_models | default([]) | length > 0
      tags: [always]

  tasks:
    # --- Install Operators (BOM) ---
    - name: Install platform operators
      ansible.builtin.include_role:
        name: osac.templates.ocp_4_20_ai_maas
        tasks_from: install_operators.yaml
        apply:
          tags:
            - operators
            - full
      tags:
        - operators
        - full

    # --- Configure cluster (domain, observability, hardware profiles) ---
    - name: Configure cluster
      ansible.builtin.include_role:
        name: osac.templates.ocp_4_20_ai_maas
        tasks_from: configure_cluster.yaml
        apply:
          tags:
            - cluster
            - maas
            - full
      tags:
        - cluster
        - maas
        - full

    # --- Configure MaaS (0..n tenants) ---
    - name: Configure MaaS platform
      ansible.builtin.include_role:
        name: osac.templates.ocp_4_20_ai_maas
        tasks_from: configure_maas.yaml
        apply:
          tags:
            - maas
            - full
      tags:
        - maas
        - full
      when: ocp_4_20_ai_maas_enable_maas | default(true) | bool

    # --- Configure External Models (optional) ---
    - name: Configure external models
      ansible.builtin.include_role:
        name: osac.templates.ocp_4_20_ai_maas
        tasks_from: configure_external_models.yaml
        apply:
          tags:
            - external
            - full
      tags:
        - external
        - full
      when:
        - ocp_4_20_ai_maas_enable_maas | default(true) | bool
        - ocp_4_20_ai_maas_external_models | default([]) | length > 0

    # --- Verification (opt-in only; NOT part of `full`) ---
    # Prefer the standalone playbook_osac_verify_maas_deployment.yml. This inline
    # hook runs only when --tags verify is passed explicitly.
    - name: Run verification tests
      ansible.builtin.include_role:
        name: osac.templates.ocp_4_20_ai_maas
        tasks_from: verify.yaml
        apply:
          tags:
            - verify
            - never
      tags:
        - verify
        - never
      when: ocp_4_20_ai_maas_run_verify | default(true) | bool

    # --- Cleanup ---
    - name: Undeploy everything
      ansible.builtin.include_role:
        name: osac.templates.ocp_4_20_ai_maas
        tasks_from: delete.yaml
        apply:
          tags:
            - cleanup
            - never
      tags:
        - cleanup
        - never
