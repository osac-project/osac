---
- name: Create StorageClasses and CSI driver on target cluster (Stage 2)
  hosts: localhost
  gather_facts: false

  vars:
    # This template is triggered from two different call sites in storage_controller.go,
    # sharing the same AAP job template but passing different resource kinds as payload:
    #   - handleClusterStorageProvisioning (hub storage) sends a Tenant object, whose own
    #     metadata.namespace is "osac-tenants" — correct as-is, matches the live
    #     vast-csi-<tenant> Secret's actual location on the hub.
    #   - handleCaaSUpdate (CaaS/guest-cluster storage) sends a ClusterOrder object, whose
    #     metadata.namespace ("osac-devel") is hub-side bookkeeping with no relation to the
    #     guest cluster. For that case we target a fixed OSAC system namespace on the guest
    #     cluster instead (mirrors vast_storage_csi_operator_namespace's "vast-csi-system"
    #     pattern; openshift-* is appropriate here since OSAC is a Red Hat product).
    tenant_name: >-
      {%- if osac_job_vars.resource.kind == 'ClusterOrder' -%}
      {{ osac_job_vars.resource.metadata.annotations['osac.openshift.io/tenant'] }}
      {%- elif osac_job_vars.resource.kind == 'Tenant' -%}
      {{ osac_job_vars.resource.metadata.name }}
      {%- endif -%}
    tenant_namespace: >-
      {%- if osac_job_vars.resource.kind == 'ClusterOrder' -%}
      openshift-osac-storage
      {%- elif osac_job_vars.resource.kind == 'Tenant' -%}
      {{ osac_job_vars.resource.metadata.namespace }}
      {%- endif -%}
    tenant_uid: "{{ osac_job_vars.resource.metadata.uid }}"
    # ClusterOrder is the legacy CaaS guest-cluster path. Keep its VAST CSI
    # installation in the VAST provider role until OSAC CSI is ready for CaaS;
    # the separate provider-native install action below remains Tenant/VMaaS-only.
    storage_provider_caas_legacy_vast_csi_install_enabled: >-
      {{ osac_job_vars.resource.kind == 'ClusterOrder' }}
  pre_tasks:
    - name: Show resource metadata
      tags: [always]
      ansible.builtin.debug:
        var: osac_job_vars.resource.metadata

    - name: Validate tenant payload is present
      tags: [always]
      ansible.builtin.fail:
        msg: "tenant must be provided via osac_job_vars.resource with metadata.name, metadata.namespace, and metadata.uid set"
      when: >-
        osac_job_vars is not defined or
        osac_job_vars.resource.metadata.name is not defined or
        osac_job_vars.resource.metadata.name | length == 0 or
        osac_job_vars.resource.metadata.namespace is not defined or
        osac_job_vars.resource.metadata.namespace | length == 0 or
        osac_job_vars.resource.metadata.uid is not defined or
        osac_job_vars.resource.metadata.uid | length == 0

    - name: Validate storage_tier_definitions is a non-empty array in the EDA event
      tags: [always]
      ansible.builtin.fail:
        msg: >-
          osac_job_vars.storage_tier_definitions must be a non-empty array, populated
          by osac-operator from the Tenant's resolved storage tiers.
          Example: [{"name":"default","protocol":"nfs","provider":"vast","backend_id":"be-001"}]
      when: >-
        osac_job_vars.storage_tier_definitions is not defined or
        osac_job_vars.storage_tier_definitions is not sequence or
        osac_job_vars.storage_tier_definitions is string or
        osac_job_vars.storage_tier_definitions is mapping or
        osac_job_vars.storage_tier_definitions | length == 0

    - name: Write admin_kubeconfig to temporary file when provided
      tags: [always]
      when: >-
        osac_job_vars.admin_kubeconfig is defined and
        osac_job_vars.admin_kubeconfig | length > 0
      ansible.builtin.set_fact:
        _remote_kubeconfig: "{{ osac_job_vars.admin_kubeconfig | osac.service.to_temp_file(suffix='.kubeconfig') }}"
        # HCP guest-cluster kubeconfigs are typically accessed via an external Route whose
        # serving cert doesn't match the CA bundled in the admin kubeconfig.
        _remote_kubeconfig_insecure: true

    - name: Use the ClusterOrder admin kubeconfig for storage class operations
      tags: [always]
      ansible.builtin.set_fact:
        _storage_target_kubeconfig: "{{ _remote_kubeconfig }}"
        _storage_target_kubeconfig_insecure: true
      when:
        - osac_job_vars.resource.kind == 'ClusterOrder'
        - _remote_kubeconfig is defined

    - name: Get configured remote cluster kubeconfig for Tenant storage
      tags: [always]
      ansible.builtin.include_role:
        name: osac.service.common
        tasks_from: get_remote_cluster_kubeconfig.yaml
        apply:
          tags: [always]
      when: osac_job_vars.resource.kind == 'Tenant'

    - name: Set Tenant storage target kubeconfig when configured
      tags: [always]
      ansible.builtin.set_fact:
        _storage_target_kubeconfig: "{{ remote_cluster_kubeconfig }}"
      when:
        - osac_job_vars.resource.kind == 'Tenant'
        - remote_cluster_kubeconfig is defined

    - name: Fail when guest-cluster storage is requested without admin_kubeconfig
      tags: [always]
      ansible.builtin.fail:
        msg: >-
          admin_kubeconfig is required in the job vars for ClusterOrder
          (guest-cluster) storage provisioning; without it this play would
          target the controller's default cluster instead of the intended
          guest cluster.
      when: >-
        osac_job_vars.resource.kind == 'ClusterOrder' and
        (_remote_kubeconfig is not defined or _remote_kubeconfig | length == 0)

  tasks:
    # Tenant storage uses the selected VMaaS target resolved above. ClusterOrder
    # storage is the separate CaaS guest-cluster path and does not run this new
    # provider-native setup action. Existing VAST ClusterOrders retain their
    # legacy install through ensure_storage_class, enabled explicitly below.
    - name: Ensure provider-native CSI drivers on the selected VMaaS cluster
      tags: [provider_csi_driver_install]
      when: osac_job_vars.resource.kind == 'Tenant'
      ansible.builtin.include_role:
        name: osac.service.storage_provider
        apply:
          tags: [provider_csi_driver_install]
      vars:
        storage_provider_action: ensure_csi_driver
        storage_provider_tiers: "{{ osac_job_vars.storage_tier_definitions }}"
        storage_provider_target_kubeconfig: "{{ _storage_target_kubeconfig | default(omit) }}"
        storage_provider_target_kubeconfig_insecure: "{{ _storage_target_kubeconfig_insecure | default(false) }}"

    # The optional OSAC CSI role uses the AAP execution environment's default
    # context, so keep it separate from native provider driver setup and never
    # invoke it for ClusterOrder guest-cluster storage.
    - name: Install OSAC CSI driver or create local-tier StorageClasses on the hub
      when:
        - >-
          (csi_driver_install_enabled | default(false) | bool) or
          (csi_driver_install_lvms_storage_class_enabled | default(false) | bool)
        - osac_job_vars.resource.kind == 'Tenant'
      block:
        - name: Resolve the CSI installer target
          ansible.builtin.include_role:
            name: osac.service.csi_driver_install
            tasks_from: select_test_override_target.yaml
          vars:
            csi_driver_install_tiers: "{{ osac_job_vars.storage_tier_definitions }}"

        - name: Install the test-only CSI driver override
          when:
            - lookup('env', 'OSAC_AAP_ENABLE_TEST_INSTALL_OVERRIDES', default='false') | bool
            - csi_driver_install_override is defined
          ansible.builtin.include_role:
            name: "{{ csi_driver_install_override.name }}"
            tasks_from: "{{ csi_driver_install_override.tasks_from }}"
          vars:
            csi_driver_install_tiers: "{{ osac_job_vars.storage_tier_definitions }}"

        - name: Install the production OSAC CSI driver role
          when: >-
            not (lookup('env', 'OSAC_AAP_ENABLE_TEST_INSTALL_OVERRIDES', default='false') | bool
                 and csi_driver_install_override is defined)
          ansible.builtin.include_role:
            name: osac.service.csi_driver_install
            tasks_from: main.yaml
          vars:
            csi_driver_install_tiers: "{{ osac_job_vars.storage_tier_definitions }}"

    # Keep the provider dispatch even when the CSI role created the LVMS class:
    # it provisions network classes and publishes the common class-name output.
    # The LVMS ensure task checks the tenant-managed class name and creates only
    # missing classes, so it leaves the CSI provisioner intact for an opted-in tier.
    - name: Provision StorageClasses for all configured tiers
      block:
        - name: Create StorageClasses on target cluster
          ansible.builtin.include_role:
            name: osac.service.storage_provider
          vars:
            storage_provider_action: ensure_storage_class
            storage_provider_tiers: "{{ osac_job_vars.storage_tier_definitions }}"
            storage_provider_backend_connections: "{{ osac_job_vars.storage_backend_connections | default({}) }}"
            storage_provider_block_encryption_passphrase: "{{ osac_job_vars.resource.spec.blockEncryptionPassphrase | default('') }}"
            storage_provider_target_kubeconfig: "{{ _storage_target_kubeconfig | default(omit) }}"
            storage_provider_target_kubeconfig_insecure: "{{ _storage_target_kubeconfig_insecure | default(false) }}"
      rescue:
        - name: Warn about StorageClass creation failure
          ansible.builtin.debug:
            msg: >-
              StorageClass creation failed on first attempt (task: {{ ansible_failed_task.name | default('unknown') }}).
              Retrying once.

        - name: Retry StorageClass creation
          ansible.builtin.include_role:
            name: osac.service.storage_provider
          vars:
            storage_provider_action: ensure_storage_class
            storage_provider_tiers: "{{ osac_job_vars.storage_tier_definitions }}"
            storage_provider_backend_connections: "{{ osac_job_vars.storage_backend_connections | default({}) }}"
            storage_provider_block_encryption_passphrase: "{{ osac_job_vars.resource.spec.blockEncryptionPassphrase | default('') }}"
            storage_provider_target_kubeconfig: "{{ _storage_target_kubeconfig | default(omit) }}"
            storage_provider_target_kubeconfig_insecure: "{{ _storage_target_kubeconfig_insecure | default(false) }}"
