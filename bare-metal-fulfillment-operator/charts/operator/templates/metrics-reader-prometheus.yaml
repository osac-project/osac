{{- if include "bare-metal-fulfillment-operator.serviceMonitorEnabled" . }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "bare-metal-fulfillment-operator.fullname" . }}-metrics-reader-prometheus
  labels:
    {{- include "bare-metal-fulfillment-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "bare-metal-fulfillment-operator.fullname" . }}-metrics-reader
subjects:
- kind: ServiceAccount
  name: prometheus-k8s
  namespace: {{ .Values.serviceMonitor.prometheusNamespace | default "openshift-monitoring" }}
{{- end }}
