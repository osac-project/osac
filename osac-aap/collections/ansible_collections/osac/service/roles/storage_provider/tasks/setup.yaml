---
# Dispatches setup once per (provider, backend_id) pair in the tier list.
# Accumulates per-backend tenant configs into a single dict keyed by backend_id.
# Credential clearing happens in the always block.

- name: Initialize tenant config accumulator
  ansible.builtin.set_fact:
    _all_tenant_configs: {}

- name: Deploy vendor CSI controllers on hub
  ansible.builtin.include_tasks: ensure_csi_backends.yaml

- name: Dispatch setup to each provider backend pair
  block:
    - name: Run setup per provider backend pair
      ansible.builtin.include_tasks: _dispatch_provider.yaml
      loop: "{{ _provider_backend_pairs }}"
      loop_control:
        loop_var: _current_pair

    - name: Set merged tenant configs output
      ansible.builtin.set_fact:
        storage_provider_tenant_configs: "{{ _all_tenant_configs }}"

    - name: Validate each backend produced a tenant config
      ansible.builtin.fail:
        msg: >-
          Backend '{{ item.backend_id }}' (provider '{{ item.provider }}') did not set
          the required output fact 'storage_provider_tenant_config' after setup.
      loop: "{{ _provider_backend_pairs }}"
      loop_control:
        loop_var: item
      when: item.backend_id not in _all_tenant_configs
