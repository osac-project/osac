---
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
      fulfillment-service: ${{ github.event_name != 'pull_request' || steps.filter.outputs.fulfillment-service == 'true' }}
      osac-operator: ${{ github.event_name != 'pull_request' || steps.filter.outputs.osac-operator == 'true' }}
      osac-aap: ${{ github.event_name != 'pull_request' || steps.filter.outputs.osac-aap == 'true' }}
      charts: ${{ github.event_name != 'pull_request' || steps.filter.outputs.charts == 'true' }}
    steps:
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4.0.2
        if: github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!**/OWNERS'
              - '!**/LICENSE'
              - '!**/*.md'
              - '!**/docs/**'
              - '!**/.claude/**'
              - '!**/.cursor/**'
              - '!**/.gemini/**'
              - '!.design/**'
              - '!.skillsaw.yaml'
              - '!.pre-commit-config.yaml'
            fulfillment-service:
              - 'fulfillment-service/**'
              - '!fulfillment-service/OWNERS'
              - '!fulfillment-service/LICENSE'
              - '!fulfillment-service/**/*.md'
              - '!fulfillment-service/docs/**'
              - '!fulfillment-service/.claude/**'
            osac-operator:
              - 'osac-operator/**'
              - '!osac-operator/OWNERS'
              - '!osac-operator/LICENSE'
              - '!osac-operator/**/*.md'
              - '!osac-operator/docs/**'
              - '!osac-operator/.claude/**'
            osac-aap:
              - 'osac-aap/**'
              - '!osac-aap/OWNERS'
              - '!osac-aap/LICENSE'
              - '!osac-aap/**/*.md'
              - '!osac-aap/docs/**'
            charts:
              - 'osac-operator/api/**'
              - 'osac-operator/charts/**'
              - 'osac-operator/config/crd/bases/**'
              - 'osac-operator/hack/sync-helm-crds.py'
              - 'osac-operator/Makefile'
              - 'bare-metal-fulfillment-operator/api/**'
              - 'bare-metal-fulfillment-operator/charts/**'
              - 'bare-metal-fulfillment-operator/config/crd/bases/**'
              - 'bare-metal-fulfillment-operator/hack/sync-helm-crds.py'
              - 'bare-metal-fulfillment-operator/Makefile'
              - 'fulfillment-service/charts/**'
              - 'osac-aap/charts/**'
              - 'osac-csi-driver/charts/**'
              - 'osac-metering/charts/**'
              - 'osac-installer/**'
              - '.github/scripts/check-floating-tags.sh'
              - '.github/workflows/helm-lint.yaml'
              - '.github/workflows/check-floating-tags.yaml'

  pre-commit:
    uses: ./.github/workflows/pre-commit.yaml
    permissions:
      contents: read
      issues: write

  check-pr:
    needs: changes
    if: needs.changes.outputs.fulfillment-service == 'true'
    uses: ./.github/workflows/check-pull-request.yaml

  check-generated-code:
    needs: changes
    if: needs.changes.outputs.fulfillment-service == 'true' || needs.changes.outputs.osac-operator == 'true'
    uses: ./.github/workflows/check-generated-code.yaml

  check-floating-tags:
    needs: changes
    if: needs.changes.outputs.charts == 'true'
    uses: ./.github/workflows/check-floating-tags.yaml

  unit-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/unit-tests.yml

  integration-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/integration-tests.yml

  helm-lint:
    needs: changes
    if: needs.changes.outputs.charts == 'true'
    uses: ./.github/workflows/helm-lint.yaml

  ansible-lint:
    needs: changes
    if: needs.changes.outputs.osac-aap == 'true'
    uses: ./.github/workflows/ansible-lint.yml

  codeql:
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read

  dependency-review:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/dependency-review.yml

  label-gate:
    uses: ./.github/workflows/label-gate.yml
    with:
      caller-event: ${{ github.event_name }}

  e2e-vmaas:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/e2e-vmaas-full-install.yml
    secrets: inherit

  e2e-bmaas:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/e2e-bmaas-full-install.yml
    secrets: inherit

  e2e-caas:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/e2e-caas-full-install.yml
    secrets: inherit

  check:
    if: always()
    needs:
      - changes
      - pre-commit
      - check-pr
      - check-generated-code
      - check-floating-tags
      - unit-tests
      - integration-tests
      - helm-lint
      - ansible-lint
      - codeql
      - dependency-review
      - label-gate
      - e2e-vmaas
      - e2e-bmaas
      - e2e-caas
    runs-on: ubuntu-latest
    steps:
      - name: Verify all checks passed or were skipped
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -e '
            to_entries | map(select(.value.result == "failure" or .value.result == "cancelled")) | length == 0
          '
