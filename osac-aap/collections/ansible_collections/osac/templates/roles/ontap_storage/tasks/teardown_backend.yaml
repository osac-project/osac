---
# ONTAP teardown_backend: release the prepared assignment per backend.
# Per the netapp-onboarding contract, OSAC never deletes ONTAP resources
# (SVMs, LIFs, accounts, QoS policies, or admin preparation Secrets stay
# prepared); releasing marks the hub lifecycle Secret (ontap-tenant-<assignment_key>)
# as 'retained' after verifying tenant_uid ownership.
# Cluster-side K8s resources belong to teardown_cluster_storage.

- name: Validate tenant_name is a valid DNS label
  ansible.builtin.fail:
    msg: >-
      tenant_name is not a valid DNS label. Must be 1-63 lowercase
      alphanumeric characters or hyphens, cannot start or end with a hyphen.
  when: tenant_name is not regex('^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$')
  no_log: true

- name: Validate tenant_uid is set
  ansible.builtin.fail:
    msg: >-
      tenant_uid must be a non-empty string so teardown_backend can verify the
      hub lifecycle record belongs to the original tenant instance before
      marking it retained.
  when: tenant_uid is not defined or tenant_uid | default('') | length == 0
  no_log: true

- name: Compute the dispatched backend ids
  ansible.builtin.set_fact:
    _ontap_backend_ids: "{{ _provider_tiers | default([]) | map(attribute='backend_id') | select('string') | unique | list }}"
  no_log: true

- name: Fail if no backend ids could be resolved
  ansible.builtin.fail:
    msg: >-
      Could not resolve any backend_id from the dispatched tiers. The ONTAP
      provider requires backend_id on every tier to locate the assignment's
      hub lifecycle record.
  when: _ontap_backend_ids | length == 0
  no_log: true

- name: Release the prepared assignment per backend
  ansible.builtin.include_tasks: _teardown_backend_per_backend.yaml
  loop: "{{ _ontap_backend_ids }}"
  loop_control:
    loop_var: _ontap_backend_id
    label: "ontap-backend"
