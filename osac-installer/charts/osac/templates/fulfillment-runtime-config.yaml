{{/*
This hub-side ConfigMap supplies the operator with the non-secret fulfillment
endpoint and issuer. The operator passes them to AAP jobs that configure
tenant-cluster CSI provisioning. Tenant CSI credentials are provisioned
separately by AAP.
*/}}
{{- if and .Values.operator.enabled .Values.service.enabled }}
{{- $endpoint := .Values.global.fulfillment.endpoint }}
{{- if not $endpoint }}
{{- $externalHostname := required "service.externalHostname is required when operator and fulfillment service are enabled" .Values.service.externalHostname }}
{{- $endpoint = printf "%s:443" $externalHostname }}
{{- end }}
{{- $issuer := tpl (required "service.auth.issuerUrl is required when operator and fulfillment service are enabled" .Values.service.auth.issuerUrl) . }}
{{- $operatorConfigMapName := required "operator.fulfillment.configMap.name is required when operator and fulfillment service are enabled" .Values.operator.fulfillment.configMap.name }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $operatorConfigMapName }}
  namespace: {{ .Release.Namespace }}
data:
  OSAC_FULFILLMENT_ENDPOINT: {{ $endpoint | quote }}
  OSAC_FULFILLMENT_ISSUER_URL: {{ $issuer | quote }}
{{- end }}
