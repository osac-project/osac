                        requests:
                          memory: 128Mi

        - name: "S3: Create dependent resource fixtures"
          kubernetes.core.k8s:
            state: present
            definition: "{{ item }}"
          loop:
            - apiVersion: v1
              kind: Service
              metadata:
                name: >-
                  {{ compute_instance_name
                  }}-load-balancer
                namespace: >-
                  {{
                  compute_instance_target_namespace
                  }}
              spec:
                ports:
                  - port: 22
                    targetPort: 22
            - apiVersion: cdi.kubevirt.io/v1beta1
              kind: DataVolume
              metadata:
                name: >-
                  {{ compute_instance_name
                  }}-root-disk
                namespace: >-
                  {{
                  compute_instance_target_namespace
                  }}
              spec:
                source:
                  blank: {}
                pvc:
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 1Mi
            - apiVersion: v1
              kind: Secret
              metadata:
                name: >-
                  {{ compute_instance_name
                  }}-cloud-init
                namespace: >-
                  {{
                  compute_instance_target_namespace
                  }}
              type: Opaque
              data:
                userdata: ""

        - name: "S3: Verify fixtures exist"
          kubernetes.core.k8s_info:
            api_version: "{{ item.api }}"
            kind: "{{ item.kind }}"
            name: "{{ item.name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
          register: _s3_fixture_check
          failed_when: >-
            _s3_fixture_check.resources
            | length == 0
          loop:
            - api: v1
              kind: Service
              name: >-
                {{ compute_instance_name
                }}-load-balancer
            - api: cdi.kubevirt.io/v1beta1
              kind: DataVolume
              name: >-
                {{ compute_instance_name
                }}-root-disk
            - api: v1
              kind: Secret
              name: >-
                {{ compute_instance_name
                }}-cloud-init

        - name: "S3: Run delete_resources"
          ansible.builtin.include_role:
            name: osac.templates.ocp_virt_vm
            tasks_from: delete_resources.yaml

        - name: "S3: Verify VMI cleaned up"
          kubernetes.core.k8s_info:
            api_version: kubevirt.io/v1
            kind: VirtualMachineInstance
            name: "{{ compute_instance_name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
          register: s3_vmi_after
          failed_when: >-
            s3_vmi_after.resources | length > 0

        - name: "S3: Verify VM and dependents deleted"
          kubernetes.core.k8s_info:
            api_version: "{{ item.api }}"
            kind: "{{ item.kind }}"
            name: "{{ item.name }}"
            namespace: >-
              {{ compute_instance_target_namespace }}
          register: _s3_dep_check
          failed_when: >-
            _s3_dep_check.resources | length > 0
          loop:
            - api: kubevirt.io/v1
              kind: VirtualMachine
              name: "{{ compute_instance_name }}"
            - api: v1
              kind: Service
              name: >-
