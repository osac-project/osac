# VMaaS CI environment -- instance values for osac chart.

# --- CSI Driver ---
csiDriver:
  enabled: true
# --- Operator ---
operator:
  image:
    repository: ghcr.io/osac-project/osac-operator
    tag: sha-3a511a6
    pullPolicy: Always
  provisioning:
    provider: "aap"
  aap:
    insecureSkipVerify: "true"
    tokenSecret:
      name: osac-aap-api-token
      key: token
  fulfillment:
    serverAddress: "fulfillment-internal-api:8001"
    tokenFile: "/var/run/secrets/kubernetes.io/serviceaccount/token"
  controllers:
    clusterOrder: false
    computeInstance: true
    tenant: true
    networking: true
    storage: true
  hubAccess:
    enabled: true
  tenants:
    - name: shared
    - name: osac-e2e-ci
  # VMaaS has no physical fabric. Register k8s_only so the dispatcher can
  # stamp ExternalIP/VN/SG onto the composite role (CUDN + NetworkPolicy +
  # MetalLB L2) instead of fabricManager cudn_net, which cannot provision
  # ExternalIP pools.
  networkManagers:
    k8sManagers:
      k8s_only:
        enabled: true
        capabilities: "ipv4,ipv6,dualStack"
# --- Fulfillment Service ---
service:
  externalHostname: "" # Set dynamically by make install-osac
  internalHostname: "" # Set dynamically by make install-osac
  variant: openshift
  images:
    service: ghcr.io/osac-project/fulfillment-service:sha-3a511a6
    envoy: ghcr.io/osac-project/envoy:v1.33.0
  certs:
    issuerRef:
      kind: ClusterIssuer
      name: default-ca
    caBundle:
      configMap: ca-bundle
  auth:
    # issuerUrl defaults to a global.clusterDomain-backed external route URL
    # (see charts/osac/values.yaml) -- correct automatically once
    # install-osac sets --set global.clusterDomain=$(DOMAIN).
    emergencyServiceAccounts:
      - admin
      - osac-operator
      - osac-operator-controller-manager
      - template-publisher
      - osac-metering
    controllerCredentials:
      - secret:
          name: fulfillment-controller-credentials
          items:
            - key: client-id
              param: client-id
            - key: client-secret
              param: client-secret
  idp:
    provider: keycloak
    # url defaults to a global.clusterDomain-backed external route URL (see
    # charts/osac/values.yaml) -- correct automatically once install-osac
    # sets --set global.clusterDomain=$(DOMAIN).
    credentials:
      - secret:
          name: fulfillment-controller-credentials
          items:
            - key: client-id
              param: client-id
            - key: client-secret
              param: client-secret
  database:
    connection:
      - secret:
          name: osac-db-config
          items:
            - key: url
              param: url
      - secret:
          name: osac-db-client-cert
          items:
            - key: tls.crt
              param: sslcert
            - key: tls.key
              param: sslkey
            - key: ca.crt
              param: sslrootcert
  log:
    level: debug
  vault:
    # endpoint and keycloakIssuerUrl both default correctly (see
    # charts/osac/values.yaml) -- no override needed.
    namespace: osac
    kvMountPath: secret
    lifecycleRole: lifecycle
    lifecycleMountPath: jwt
    keycloakClientId: osac-controller
    keycloakAudience: osac-api
    caBundle:
      configMap: ca-bundle
    credentials:
      - secret:
          name: fulfillment-controller-credentials
          items:
            - key: client-secret
              param: client-secret
# --- UI ---
ui:
  enabled: true
  images:
    ui: ghcr.io/osac-project/osac-ui:sha-d047c4a
  api:
    fulfillment:
      certs:
        caBundle:
          configMap: ca-bundle
  auth:
    certs:
      caBundle:
        configMap: ca-bundle
# --- AAP ---
aap:
  aap:
    instance:
      enabled: true
      name: "osac-aap"
  bootstrap:
    enabled: true
    image: ghcr.io/osac-project/osac-aap:sha-3a511a6
    backoffLimit: 15
  configAsCode:
    manifestSecret: "config-as-code-manifest-ig"
    secret: "config-as-code-ig"
    # NOTE: e2e's COMPONENT_BUILD_RESULTS image-override step overrides
    # bootstrap.image with this PR's own built image but does not touch
    # eeImage, so the two can diverge at e2e runtime even though they're
    # the same base value here. Extending that override to cover eeImage
    # too is tracked separately (OSAC-3545), since it lives in
    # osac-test-infra, not this repo.
    eeImage: "ghcr.io/osac-project/osac-aap:sha-3a511a6"
    projectGitUri: "https://github.com/osac-project/osac"
    projectGitBranch: "3a511a6e9f6f55b659cf8da55aa5ad8e6bbf734a"
  instanceGroups:
    storageFulfillment:
      enabled: true
# --- Validation ---
validation:
  enabled: true
# --- Bare Metal Fulfillment Operator ---
bmf:
  enabled: false
# --- Hub Access ---
hubAccess:
  enabled: true
# --- Metering ---
metering:
  enabled: true
  reconciliation:
    interval: "5m"
  # Echo adapter -- test/development tool only. Consumes metering events from
  # Kafka and exposes them via HTTP for E2E test assertions.
  echoAdapter:
    enabled: true
    image:
      repository: ghcr.io/osac-project/metering-echo-adapter
      tag: sha-3a511a6
      pullPolicy: Always
  m360Adapter:
    enabled: false
    image:
      repository: ghcr.io/osac-project/metering-m360-adapter
      tag: sha-3a511a6
      pullPolicy: Always
    m360:
      apiUrl: "api-url" # Set to your Monetize360 Usage API endpoint
      apiKeySecret: "m360-api-key" # K8s Secret with key "api-key" — create before deploying
      apiVersion: "v1"
  database:
    connection:
      - secret:
          name: osac-db-metering-config
          items:
            - key: url
              param: url
      - secret:
          name: osac-db-metering-client-cert
          items:
            - key: tls.crt
              param: sslcert
            - key: tls.key
              param: sslkey
            - key: ca.crt
              param: sslrootcert
# --- LVMS StorageBackend registration ---
lvms:
  enabled: true
# Default NetworkClass for VMaaS-without-fabric (create-network-class hook).
# Must clear fabricManager — chart defaults leave cudn_net, and Helm merge
# would stamp both managers
networkClass:
  enabled: true
  title: "K8s-only networking"
  description: >-
    VMaaS overlay without a physical fabric. VirtualNetwork/Subnet use CUDN, SecurityGroup uses NetworkPolicy, ExternalIP uses MetalLB L2.
  fabricManager: ""
  k8sManager: "k8s_only"
  isDefault: true
# --- Bundled OpenBao (Vault-compatible secret store) ---
bundledVault:
  # Override podSecurityContext for OpenShift restricted-v2 SCC: omit numeric
  # runAsUser/runAsGroup/fsGroup — the SCC allocates UIDs from the namespace UID
  # range and resolves the named user automatically. A non-nil value here fully
  # replaces the template default (runAsUser:100/runAsGroup:1000/fsGroup:1000).
  podSecurityContext:
    runAsNonRoot: true
