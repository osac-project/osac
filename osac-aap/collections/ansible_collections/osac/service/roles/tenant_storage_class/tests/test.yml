---
# Test playbook for osac.service.tenant_storage_class role.
# Each play is guarded by a `when` condition -- only the play whose controlling
# variable is defined will run. Pass exactly one variable per invocation.
#
# The role receives a pre-resolved storageClasses list (injected via extra_vars
# by the ComputeInstance controller) and selects a StorageClass by tier.
# No K8s API calls are made.
#
#   Test 1 (happy path -- resolve "fast" tier):
#     ansible-playbook ... -e test_happy_path=true
#
#   Test 2 (requested tier not available):
#     ansible-playbook ... -e test_tier_not_available=true
#
#   Test 3 (empty storageClasses list):
#     ansible-playbook ... -e test_empty_list=true
#
#   Test 4 (conflicting duplicate tiers -- fail closed):
#     ansible-playbook ... -e test_duplicate_tier=true
#
#   Test 5 (disk label appears in tier-not-available error):
#     ansible-playbook ... -e test_disk_label=true
#
#   Test 6 (identical duplicate {name, tier} entries -- deduplicated):
#     ansible-playbook ... -e test_identical_duplicate_tier=true
#
#   Test 7 (CSP-filtered multi-disk tiers + playbook_osac_create_compute_instance.yml pre_tasks validation):
#     ansible-playbook ... -e test_csp_filtered_tiers=true

# ──────────────────────────────────────────────────────────────
# Test 1: Resolve requested tier (happy path)
# Expected: role succeeds, tenant_storage_class_name set
# ──────────────────────────────────────────────────────────────
- name: Test tenant_storage_class role -- resolve tier (happy path)
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Discover StorageClass for requested tier
      ansible.builtin.include_role:
        name: osac.service.tenant_storage_class
      vars:
        tenant_storage_class_tenant_name: "tenant-acme"
        tenant_storage_class_storage_classes:
          - name: "ceph-acme-default"
            tier: "default"
          - name: "ceph-acme-fast"
            tier: "fast"
        tenant_storage_class_storage_tier: "fast"
      when: test_happy_path | default(false) | bool

    - name: Verify discovered StorageClass name is set
      ansible.builtin.assert:
        that:
          - tenant_storage_class_name is defined
          - tenant_storage_class_name == "ceph-acme-fast"
        fail_msg: "Expected 'ceph-acme-fast' but got '{{ tenant_storage_class_name | default('undefined') }}'"
        success_msg: "Discovered StorageClass: {{ tenant_storage_class_name }}"
      when: test_happy_path | default(false) | bool

# ──────────────────────────────────────────────────────────────
# Test 2: Requested tier not available -- error path
# Expected: role fails with message listing available tiers and tenant name
# ──────────────────────────────────────────────────────────────
- name: Test tenant_storage_class role -- tier not available (should fail)
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Run tier-not-available failure test
      when: test_tier_not_available | default(false) | bool
      block:
        - name: Attempt to discover StorageClass for unavailable tier (expected to fail)
          ansible.builtin.include_role:
            name: osac.service.tenant_storage_class
          vars:
            tenant_storage_class_tenant_name: "tenant-acme"
            tenant_storage_class_storage_classes:
              - name: "ceph-acme-default"
                tier: "default"
              - name: "ceph-acme-standard"
                tier: "standard"
            tenant_storage_class_storage_tier: "gpu"

        - name: This task should not be reached -- role should have failed
          ansible.builtin.fail:
            msg: "Role did not fail as expected when tier is not available"

      rescue:
        - name: Verify role failed with expected tier-not-available message
          ansible.builtin.assert:
            that:
              - "'is not available' in ansible_failed_result.msg"
              - "'tenant-acme' in ansible_failed_result.msg"
              - "'Available tiers' in ansible_failed_result.msg"
            fail_msg: "Role failed but with unexpected message: {{ ansible_failed_result.msg }}"
            success_msg: "Role failed as expected: {{ ansible_failed_result.msg }}"

# ──────────────────────────────────────────────────────────────
# Test 3: Empty storageClasses list -- error path
# Expected: role fails with "empty" message including tenant name
# ──────────────────────────────────────────────────────────────
- name: Test tenant_storage_class role -- empty storageClasses (should fail)
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Run empty-storageClasses failure test
      when: test_empty_list | default(false) | bool
      block:
        - name: Attempt to discover StorageClass when storageClasses is empty (expected to fail)
          ansible.builtin.include_role:
            name: osac.service.tenant_storage_class
          vars:
            tenant_storage_class_tenant_name: "tenant-acme"
            tenant_storage_class_storage_classes: []
            tenant_storage_class_storage_tier: "default"

        - name: This task should not be reached -- role should have failed
          ansible.builtin.fail:
            msg: "Role did not fail as expected when storageClasses is empty"

      rescue:
        - name: Verify role failed with expected empty message
          ansible.builtin.assert:
            that:
              - "'empty' in ansible_failed_result.msg"
              - "'tenant-acme' in ansible_failed_result.msg"
            fail_msg: "Role failed but with unexpected message: {{ ansible_failed_result.msg }}"
            success_msg: "Role failed as expected: {{ ansible_failed_result.msg }}"

# ──────────────────────────────────────────────────────────────
# Test 4: Conflicting duplicate tiers in list -- fail-closed
# Expected: role fails listing all conflicting StorageClass names
# ──────────────────────────────────────────────────────────────
- name: Test tenant_storage_class role -- conflicting duplicate tiers (should fail)
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Run conflicting duplicate-tier failure test
      when: test_duplicate_tier | default(false) | bool
      block:
        - name: Attempt to resolve StorageClass when conflicting duplicate tiers exist (expected to fail)
          ansible.builtin.include_role:
            name: osac.service.tenant_storage_class
          vars:
            tenant_storage_class_tenant_name: "tenant-acme"
            tenant_storage_class_storage_classes:
              - name: "ceph-fast-primary"
                tier: "fast"
              - name: "ceph-fast-secondary"
                tier: "fast"
            tenant_storage_class_storage_tier: "fast"

        - name: This task should not be reached -- role should have failed
          ansible.builtin.fail:
            msg: "Role did not fail as expected when conflicting duplicate tiers exist"

      rescue:
        - name: Verify role failed with expected ambiguous-tier message
          ansible.builtin.assert:
            that:
              - "'is ambiguous' in ansible_failed_result.msg"
              - "'ceph-fast-primary' in ansible_failed_result.msg"
              - "'ceph-fast-secondary' in ansible_failed_result.msg"
            fail_msg: "Role failed but with unexpected message: {{ ansible_failed_result.msg }}"
            success_msg: "Conflicting duplicate tier rejected as expected: {{ ansible_failed_result.msg }}"

# ──────────────────────────────────────────────────────────────
# Test 5: Disk label included in tier-not-available error
# Expected: role fails with message containing the disk label
# ──────────────────────────────────────────────────────────────
- name: Test tenant_storage_class role -- disk label in error message
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Run disk-label error test
      when: test_disk_label | default(false) | bool
      block:
        - name: Attempt to discover StorageClass with disk label (expected to fail)
          ansible.builtin.include_role:
            name: osac.service.tenant_storage_class
          vars:
            tenant_storage_class_tenant_name: "tenant-acme"
            tenant_storage_class_storage_classes:
              - name: "ceph-acme-default"
                tier: "default"
            tenant_storage_class_storage_tier: "fast"
            tenant_storage_class_disk_label: "additional disk 2"

        - name: This task should not be reached -- role should have failed
          ansible.builtin.fail:
            msg: "Role did not fail as expected when tier is not available"

      rescue:
        - name: Verify error message includes disk label
          ansible.builtin.assert:
            that:
              - "'additional disk 2' in ansible_failed_result.msg"
              - "'is not available' in ansible_failed_result.msg"
            fail_msg: "Error message missing disk label: {{ ansible_failed_result.msg }}"
            success_msg: "Disk label found in error: {{ ansible_failed_result.msg }}"

# ──────────────────────────────────────────────────────────────
# Test 6: Identical duplicate {name, tier} entries -- deduplicated
# Expected: role succeeds when pre-resolved and JIT entries are identical
# ──────────────────────────────────────────────────────────────
- name: Test tenant_storage_class role -- identical duplicate tier entries
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Resolve StorageClass when identical duplicate {name, tier} entries exist
      ansible.builtin.include_role:
        name: osac.service.tenant_storage_class
      vars:
        tenant_storage_class_tenant_name: "tenant-acme"
        tenant_storage_class_storage_classes:
          - name: "ceph-fast-primary"
            tier: "fast"
          - name: "ceph-fast-primary"
            tier: "fast"
        tenant_storage_class_storage_tier: "fast"
      when: test_identical_duplicate_tier | default(false) | bool

    - name: Verify deduplicated StorageClass name is set
      ansible.builtin.assert:
        that:
          - tenant_storage_class_name is defined
          - tenant_storage_class_name == "ceph-fast-primary"
        fail_msg: "Expected 'ceph-fast-primary' but got '{{ tenant_storage_class_name | default('undefined') }}'"
        success_msg: "Identical duplicate tier deduplicated: {{ tenant_storage_class_name }}"
      when: test_identical_duplicate_tier | default(false) | bool

# ──────────────────────────────────────────────────────────────
# Test 7: CSP-filtered multi-disk tiers + playbook_osac_create_compute_instance.yml pre_tasks validation
# Expected: role resolves CSP boot disk and OSAC additional disk; playbook pre_tasks pass on valid
#           deduplicated tiers and fail closed before tasks:/finalizer on missing or ambiguous tiers
# ──────────────────────────────────────────────────────────────
- name: Test tenant_storage_class role and create_compute_instance pre_tasks -- CSP-filtered tiers
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Run CSP-filtered multi-disk and playbook pre_tasks validation
      when: test_csp_filtered_tiers | default(false) | bool
      block:
        - name: Resolve CSP-managed boot disk StorageClass (gold)
          ansible.builtin.include_role:
            name: osac.service.tenant_storage_class
          vars:
            tenant_storage_class_tenant_name: "tenant-acme"
            tenant_storage_class_storage_classes:
              - name: "netapp-gold-sc"
                tier: "gold"
              - name: "vast-fast-sc"
                tier: "fast"
            tenant_storage_class_storage_tier: "gold"
            tenant_storage_class_disk_label: "bootDisk"

        - name: Assert CSP boot disk StorageClass resolved
          ansible.builtin.assert:
            that:
              - tenant_storage_class_name == "netapp-gold-sc"
            fail_msg: "Expected 'netapp-gold-sc' for boot disk tier 'gold', got '{{ tenant_storage_class_name | default('undefined') }}'"

        - name: Resolve OSAC-managed additional disk StorageClass (fast)
          ansible.builtin.include_role:
            name: osac.service.tenant_storage_class
          vars:
            tenant_storage_class_tenant_name: "tenant-acme"
            tenant_storage_class_storage_classes:
              - name: "netapp-gold-sc"
                tier: "gold"
              - name: "vast-fast-sc"
                tier: "fast"
            tenant_storage_class_storage_tier: "fast"
            tenant_storage_class_disk_label: "additional disk 1"

        - name: Assert OSAC additional disk StorageClass resolved
          ansible.builtin.assert:
            that:
              - tenant_storage_class_name == "vast-fast-sc"
            fail_msg: "Expected 'vast-fast-sc' for additional disk tier 'fast', got '{{ tenant_storage_class_name | default('undefined') }}'"

        - name: Execute playbook_osac_create_compute_instance.yml with valid CSP + OSAC + identical JIT duplicate
          ansible.builtin.command:
            argv:
              - ansible-playbook
              - --inventory
              - localhost,
              - --connection
              - local
              - "{{ playbook_dir }}/../../../../../../../playbook_osac_create_compute_instance.yml"
              - -e
              - >-
                {{
                  {
                    "osac_job_vars": {
                      "resource": {
                        "metadata": {"name": "vm-csp-test", "namespace": "default"},
                        "status": {"tenantReference": {"name": "tenant-acme", "namespace": "default"}},
                        "spec": {
                          "templateID": "osac.templates.ocp_virt_vm",
                          "bootDisk": {"sizeGiB": 30, "storageTier": "gold"},
                          "additionalDisks": [{"sizeGiB": 50, "storageTier": "fast"}]
                        }
                      },
                      "tenant_storage_classes": [
                        {"name": "netapp-gold-sc", "tier": "gold"},
                        {"name": "vast-fast-sc", "tier": "fast"}
                      ]
                    },
                    "storage_provider_storage_class_names": [
                      {"name": "vast-fast-sc", "tier": "fast"}
                    ]
                  } | to_json
                }}
            chdir: "{{ playbook_dir }}/../../../../../../../"
          environment:
            KUBECONFIG: "/dev/null"
            K8S_AUTH_KUBECONFIG: "/dev/null"
          register: _valid_playbook_run
          changed_when: false
          failed_when: false

        - name: Assert valid CSP + OSAC + JIT duplicate passed pre_tasks and reached Display compute instance information
          ansible.builtin.assert:
            that:
              - "'Compute instance name: vm-csp-test' in (_valid_playbook_run.stdout + _valid_playbook_run.stderr)"
            fail_msg: >-
              Expected playbook pre_tasks to succeed and reach 'Display compute instance information',
              got: {{ _valid_playbook_run.stdout + _valid_playbook_run.stderr }}

        - name: Execute playbook_osac_create_compute_instance.yml with missing requested tier (silver)
          ansible.builtin.command:
            argv:
              - ansible-playbook
              - --inventory
              - localhost,
              - --connection
              - local
              - "{{ playbook_dir }}/../../../../../../../playbook_osac_create_compute_instance.yml"
              - -e
              - >-
                {{
                  {
                    "osac_job_vars": {
                      "resource": {
                        "metadata": {"name": "vm-csp-test", "namespace": "default"},
                        "status": {"tenantReference": {"name": "tenant-acme", "namespace": "default"}},
                        "spec": {
                          "templateID": "osac.templates.ocp_virt_vm",
                          "bootDisk": {"sizeGiB": 30, "storageTier": "gold"},
                          "additionalDisks": [{"sizeGiB": 20, "storageTier": "silver"}]
                        }
                      },
                      "tenant_storage_classes": [
                        {"name": "netapp-gold-sc", "tier": "gold"},
                        {"name": "vast-fast-sc", "tier": "fast"}
                      ]
                    }
                  } | to_json
                }}
            chdir: "{{ playbook_dir }}/../../../../../../../"
          environment:
            KUBECONFIG: "/dev/null"
            K8S_AUTH_KUBECONFIG: "/dev/null"
          register: _missing_tier_playbook_run
          changed_when: false
          failed_when: false

        - name: Assert missing requested tier failed in pre_tasks before tasks:/finalizer
          ansible.builtin.assert:
            that:
              - _missing_tier_playbook_run.rc != 0
              - "'silver' in (_missing_tier_playbook_run.stdout + _missing_tier_playbook_run.stderr)"
              - "'fast, gold' in (_missing_tier_playbook_run.stdout + _missing_tier_playbook_run.stderr)"
              - "'Display compute instance information' not in (_missing_tier_playbook_run.stdout + _missing_tier_playbook_run.stderr)"
            fail_msg: >-
              Expected missing tier 'silver' to fail in pre_tasks before tasks:,
              got (rc={{ _missing_tier_playbook_run.rc }}):
              {{ _missing_tier_playbook_run.stdout + _missing_tier_playbook_run.stderr }}

        - name: Execute playbook_osac_create_compute_instance.yml with ambiguous requested tier (fast)
          ansible.builtin.command:
            argv:
              - ansible-playbook
              - --inventory
              - localhost,
              - --connection
              - local
              - "{{ playbook_dir }}/../../../../../../../playbook_osac_create_compute_instance.yml"
              - -e
              - >-
                {{
                  {
                    "osac_job_vars": {
                      "resource": {
                        "metadata": {"name": "vm-csp-test", "namespace": "default"},
                        "status": {"tenantReference": {"name": "tenant-acme", "namespace": "default"}},
                        "spec": {
                          "templateID": "osac.templates.ocp_virt_vm",
                          "bootDisk": {"sizeGiB": 30, "storageTier": "gold"},
                          "additionalDisks": [{"sizeGiB": 20, "storageTier": "fast"}]
                        }
                      },
                      "tenant_storage_classes": [
                        {"name": "netapp-gold-sc", "tier": "gold"},
                        {"name": "vast-fast-1", "tier": "fast"},
                        {"name": "vast-fast-2", "tier": "fast"}
                      ]
                    }
                  } | to_json
                }}
            chdir: "{{ playbook_dir }}/../../../../../../../"
          environment:
            KUBECONFIG: "/dev/null"
            K8S_AUTH_KUBECONFIG: "/dev/null"
          register: _ambiguous_tier_playbook_run
          changed_when: false
          failed_when: false

        - name: Assert ambiguous requested tier failed in pre_tasks before tasks:/finalizer
          ansible.builtin.assert:
            that:
              - _ambiguous_tier_playbook_run.rc != 0
              - "'is ambiguous for tenant' in (_ambiguous_tier_playbook_run.stdout + _ambiguous_tier_playbook_run.stderr)"
              - "'vast-fast-1, vast-fast-2' in (_ambiguous_tier_playbook_run.stdout + _ambiguous_tier_playbook_run.stderr)"
              - "'Display compute instance information' not in (_ambiguous_tier_playbook_run.stdout + _ambiguous_tier_playbook_run.stderr)"
            fail_msg: >-
              Expected ambiguous tier 'fast' to fail in pre_tasks before tasks:,
              got (rc={{ _ambiguous_tier_playbook_run.rc }}):
              {{ _ambiguous_tier_playbook_run.stdout + _ambiguous_tier_playbook_run.stderr }}
