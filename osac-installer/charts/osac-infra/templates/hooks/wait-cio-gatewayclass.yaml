{{/*
Block install-infra until the CIO-managed GatewayClass (created by
cio-gatewayclass.yaml in this release) is Accepted with its controller
installed, and fail fast when a Service Mesh subscription makes the embedded
gateway impossible. Script comes from the shared osac-infra-hook-scripts
ConfigMap, like every other infra hook.
*/}}
{{- if .Values.gatewayapi.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: osac-infra-wait-cio-gatewayclass
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "11"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: osac-infra-wait-cio-gatewayclass
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "11"
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gatewayclasses"]
    resourceNames: ["{{ .Values.gatewayapi.gatewayClassName }}"]
    verbs: ["get"]
  - apiGroups: ["operators.coreos.com"]
    resources: ["subscriptions"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: osac-infra-wait-cio-gatewayclass
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "11"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: osac-infra-wait-cio-gatewayclass
subjects:
  - kind: ServiceAccount
    name: osac-infra-wait-cio-gatewayclass
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: osac-infra-wait-cio-gatewayclass
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-output-log-policy": hook-failed
    "helm.sh/hook-weight": "11"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        {{- include "osac-infra.hookLabels" . | nindent 8 }}
    spec:
      serviceAccountName: osac-infra-wait-cio-gatewayclass
      restartPolicy: OnFailure
      volumes:
        - name: tmp
          emptyDir: {}
        - name: scripts
          configMap:
            name: osac-infra-hook-scripts
      containers:
        - name: wait-cio-gatewayclass
          image: {{ .Values.cliImage }}
          env:
            - name: HOME
              value: /tmp
            - name: GATEWAYCLASS_NAME
              value: {{ .Values.gatewayapi.gatewayClassName | quote }}
            - name: TIMEOUT_SECONDS
              value: "900"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: scripts
              mountPath: /scripts
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.hookResources | nindent 12 }}
          command:
            - /bin/bash
            - /scripts/wait-cio-gatewayclass.sh
{{- end }}
