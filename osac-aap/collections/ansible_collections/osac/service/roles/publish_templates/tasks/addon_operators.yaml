- name: Get first page of existing AddOnOperators
  ansible.builtin.uri:
    url: "{{ publish_templates_addon_operator_api_endpoint }}?limit=100&offset=0"
    validate_certs: "{{ publish_templates_validate_certs | default(true) | bool }}"
    headers:
      authorization: Bearer {{ osac_fulfillment_service_token }}
    status_code: [200, 404, 503]
  register: addon_operator_check

- name: Skip AddOnOperators when service is disabled
  ansible.builtin.debug:
    msg: "CaaS service not available (HTTP 404/503) - skipping AddOnOperator publishing"
  when: addon_operator_check.status in [404, 503]

- name: Initialize existing AddOnOperator IDs and pagination
  ansible.builtin.set_fact:
    addon_operator_ids: "{{ addon_operator_check.json.get('items', []) | map(attribute='id') | list }}"
    addon_operator_total: "{{ addon_operator_check.json.get('total', addon_operator_check.json.get('items', []) | length) | int }}"
    addon_operator_next_offset: "{{ addon_operator_check.json.get('size', addon_operator_check.json.get('items', []) | length) | int }}"
    addon_operator_pagination_ok: >-
      {{ (addon_operator_check.json.get('total', addon_operator_check.json.get('items', []) | length) | int) == 0
         or (addon_operator_check.json.get('size', addon_operator_check.json.get('items', []) | length) | int) > 0 }}
  when: addon_operator_check.status not in [404, 503]

- name: Fetch remaining AddOnOperator pages
  ansible.builtin.include_tasks: paginate_addon_operators.yaml
  when: addon_operator_check.status not in [404, 503] and addon_operator_next_offset < addon_operator_total

- name: Update existing AddOnOperator
  loop: "{{ osac_addon_operator_templates | default([]) }}"
  loop_control:
    label: "{{ template.id }}"
    loop_var: template
  when:
    - addon_operator_check.status not in [404, 503]
    - addon_operator_pagination_ok | default(false) | bool
    - addon_operator_ids is defined
    - template.id in addon_operator_ids
  ansible.builtin.uri:
    url: "{{ publish_templates_addon_operator_api_endpoint }}/{{ template.id }}?update_mask={{ publish_templates_addon_operator_update_mask }}"
    validate_certs: "{{ publish_templates_validate_certs | default(true) | bool }}"
    method: PATCH
    headers:
      authorization: Bearer {{ osac_fulfillment_service_token }}
    body_format: json
    body: "{{ template }}"

- name: Create new AddOnOperator
  loop: "{{ osac_addon_operator_templates | default([]) }}"
  loop_control:
    label: "{{ template.id }}"
    loop_var: template
  when:
    - addon_operator_check.status not in [404, 503]
    - addon_operator_pagination_ok | default(false) | bool
    - addon_operator_ids is not defined or template.id not in addon_operator_ids
  ansible.builtin.uri:
    url: "{{ publish_templates_addon_operator_api_endpoint }}"
    validate_certs: "{{ publish_templates_validate_certs | default(true) | bool }}"
    method: POST
    headers:
      authorization: Bearer {{ osac_fulfillment_service_token }}
    body_format: json
    body: "{{ template }}"
