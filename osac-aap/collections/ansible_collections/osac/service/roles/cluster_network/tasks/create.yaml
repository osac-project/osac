---
# Step-collection delegation was removed in OSAC-2351.
# CaaS networking now goes through the OSAC Networking API and dispatcher;
# step-collection delegation is no longer used.
#
# The cluster_network role remains as the logical entry point for cluster
# network creation but no longer dispatches to a backend step collection.
# CI-specific agent-binding logic is now inlined in the template's
# ci_cluster_infra_create.yaml task file.
