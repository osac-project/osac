{{- if dig "observability" "enabled" false (.Values.global | default dict) }}
{{- $observability := .Values.global.observability | default dict -}}
{{- $image := ($observability.services | default dict).metricsAuth | default dict -}}
{{- $ns := include "osac-observability.namespace" . -}}
{{- $name := "osac-observability-admin-credentials" -}}
{{- /* The gate fetches the OIDC discovery document and the JWK set from the
       identity provider, whose certificate is signed by a cluster CA the image
       does not trust. The Keycloak chart distributes that bundle into its own
       namespace, and a volume cannot cross namespaces, so this Job copies it
       beside the gate. The copy is idempotent: an upgrade that changes nothing
       writes nothing, so the gate is not restarted for an unchanged bundle. */ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: keycloak
  labels:
    {{- include "osac-observability.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    # Below the Job's weight 30: Helm runs equal weights together, and the
    # Job's backoffLimit 0 turns a 403 from a not-yet-created Role into a
    # failed release.
    "helm.sh/hook-weight": "29"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  # The trust bundle the Keycloak chart publishes, read so it can be copied
  # beside the gate.
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - ca-bundle
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: keycloak
  labels:
    {{- include "osac-observability.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    # With the Role, below the Job.
    "helm.sh/hook-weight": "29"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $ns }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "osac-observability.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    # Before an upgrade applies its workloads, so the bundle is in place before
    # the gate pods that mount it start. On a fresh install it runs after the
    # resources, once the namespace exists.
    "helm.sh/hook-weight": "30"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        {{- include "osac-observability.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      securityContext:
        {{- include "osac-observability.podSecurityContext" . | nindent 8 }}
      containers:
        - name: admin-credentials
          image: "{{ $image.repository }}:{{ $image.tag }}"
          imagePullPolicy: IfNotPresent
          command:
            - /admin-credentials
          env:
            - name: OBS_NAMESPACE
              value: {{ $ns | quote }}
          securityContext:
            {{- include "osac-observability.containerSecurityContext" . | nindent 12 }}
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
{{- end }}
