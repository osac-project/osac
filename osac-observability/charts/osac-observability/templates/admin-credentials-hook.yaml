{{- if dig "observability" "enabled" false (.Values.global | default dict) }}
{{- $observability := .Values.global.observability | default dict -}}
{{- $keycloak := $observability.keycloak | default dict -}}
{{- $image := ($observability.services | default dict).metricsAuth | default dict -}}
{{- $ns := include "osac-observability.namespace" . -}}
{{- $name := "osac-observability-admin-credentials" -}}
{{- /* The cookie secrets are generated once and then left alone: Helm cannot
       own them because a template would rotate the value on every upgrade and
       log every admin out. The client secret is a copy of the Keycloak one, so
       it is read from the same Secret the Keycloak provisioning maintains, and
       the trust bundle is a copy for the same reason. */ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: keycloak
  labels:
    {{- include "osac-observability.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    # Below the Job's weight 30: Helm runs equal weights together, and the
    # Job's backoffLimit 0 turns a 403 from a not-yet-created Role into a
    # failed release.
    "helm.sh/hook-weight": "29"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - keycloak-client-secrets
    verbs:
      - get
  # The trust bundle the Keycloak chart publishes to the same namespace, read so
  # it can be copied beside the proxies.
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - ca-bundle
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: keycloak
  labels:
    {{- include "osac-observability.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    # With the Role, below the Job.
    "helm.sh/hook-weight": "29"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $ns }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "osac-observability.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    # Before an upgrade applies its workloads, so a Secret this job rewrites is
    # in place before the pods that read it start. On a fresh install it runs
    # after the resources, once the namespace exists.
    "helm.sh/hook-weight": "30"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        {{- include "osac-observability.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      securityContext:
        {{- include "osac-observability.podSecurityContext" . | nindent 8 }}
      containers:
        - name: admin-credentials
          image: "{{ $image.repository }}:{{ $image.tag }}"
          imagePullPolicy: IfNotPresent
          command:
            - /admin-credentials
          env:
            - name: KEYCLOAK_NAMESPACE
              value: keycloak
            - name: KEYCLOAK_SECRET_NAME
              value: keycloak-client-secrets
            - name: KEYCLOAK_SECRET_KEY
              value: {{ $keycloak.adminClientId | default "thanos-admin" | quote }}
            - name: OBS_NAMESPACE
              value: {{ $ns | quote }}
            - name: ADMIN_CLIENT_SECRET_NAME
              value: thanos-admin-client-secret
            - name: ADMIN_CLIENT_SECRET_KEY
              value: client-secret
            # oauth2-proxy decodes base64url from its environment variable,
            # which cannot carry binary bytes; ose-oauth-proxy decodes standard
            # base64 from the file it mounts.
            - name: ADMIN_COOKIE_SECRETS
              value: {{ list (dict "name" "thanos-admin-oauth2-proxy") (dict "name" "thanos-admin-openshift-oauth" "base64" true) | toJson | quote }}
            - name: ADMIN_COOKIE_SECRET_KEY
              value: cookie-secret
          securityContext:
            {{- include "osac-observability.containerSecurityContext" . | nindent 12 }}
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
{{- end }}
