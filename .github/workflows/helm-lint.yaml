name: Helm Lint

on:
  pull_request:
    paths:
      - 'osac-operator/api/**'
      - 'osac-operator/charts/**'
      - 'osac-operator/config/crd/bases/**'
      - 'osac-operator/hack/sync-helm-crds.py'
      - 'osac-operator/Makefile'
      - 'bare-metal-fulfillment-operator/api/**'
      - 'bare-metal-fulfillment-operator/charts/**'
      - 'bare-metal-fulfillment-operator/config/crd/bases/**'
      - 'bare-metal-fulfillment-operator/hack/sync-helm-crds.py'
      - 'bare-metal-fulfillment-operator/Makefile'
      - 'fulfillment-service/charts/**'
      - 'osac-aap/charts/**'
      - 'osac-installer/charts/**'
      - 'osac-installer/values/**'
      - 'osac-installer/ct.yaml'
      - '.github/workflows/helm-lint.yaml'

permissions:
  contents: read

jobs:
  # Matrixed over every component that generates Helm CRD templates from a
  # kubebuilder config/crd/bases/ source of truth via hack/sync-helm-crds.py
  # + make check-helm-crds (osac-operator and bare-metal-fulfillment-operator
  # share the identical mechanism; fulfillment-service/osac-aap don't have one).
  helm-crds-sync:
    name: Check Helm CRD sync (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [osac-operator, bare-metal-fulfillment-operator]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: stable

    - name: Verify Helm CRD templates match bases
      working-directory: ${{ matrix.component }}
      run: make check-helm-crds

  # fulfillment-service's chart guards most values with `required "..." .Values.X`
  # (auth/certs/idp config), so it needs its CI-only charts/service/ci-values.yaml
  # passed via -f to lint/template cleanly -- osac-operator's and osac-aap's
  # charts have no such guards and lint fine bare.
  helm-lint:
    name: Lint Helm chart (${{ matrix.component }}/${{ matrix.chart }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: osac-operator
            chart: operator-crds
          - component: osac-operator
            chart: operator
          - component: bare-metal-fulfillment-operator
            chart: operator-crds
          - component: bare-metal-fulfillment-operator
            chart: operator
          - component: fulfillment-service
            chart: service
            values-file: ci-values.yaml
          - component: osac-aap
            chart: aap
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Helm
      uses: azure/setup-helm@v5
      with:
        version: v3.17.0

    - name: Lint chart
      working-directory: ${{ matrix.component }}
      run: |
        if [ -n "${{ matrix.values-file }}" ]; then
          helm lint "charts/${{ matrix.chart }}/" -f "charts/${{ matrix.chart }}/${{ matrix.values-file }}"
        else
          helm lint "charts/${{ matrix.chart }}/"
        fi

    - name: Template chart
      working-directory: ${{ matrix.component }}
      run: |
        if [ -n "${{ matrix.values-file }}" ]; then
          helm template test "charts/${{ matrix.chart }}/" -f "charts/${{ matrix.chart }}/${{ matrix.values-file }}" > /dev/null
        else
          helm template test "charts/${{ matrix.chart }}/" > /dev/null
        fi

  # osac-installer's own umbrella chart (charts/osac/) composes every other
  # component's chart as a file:// dependency plus osac-ui/osac-csi-driver's
  # real submodule/OCI dependencies -- a different thing from linting any one
  # component's chart in isolation above, so this stays a separate job rather
  # than another matrix entry. Needs the actual submodules checked out (unlike
  # the jobs above) since helm dependency build resolves osac-ui/osac-csi-driver
  # from base/ on disk.
  helm-lint-installer:
    name: Lint Helm charts (osac-installer)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      with:
        submodules: recursive
        persist-credentials: false

    - name: Set up Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
      with:
        version: v3.17.0

    - name: Set up chart-testing
      uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f  # v2.8.0

    - name: Build chart dependencies
      working-directory: osac-installer
      run: helm dependency build charts/osac/

    - name: Run chart-testing lint
      working-directory: osac-installer
      run: ct lint --all --config ct.yaml

    - name: Template with CI values
      working-directory: osac-installer
      run: |
        set -euo pipefail
        for f in charts/osac/ci/*-values.yaml; do
          echo "--- helm template with $(basename "$f") ---"
          helm template osac charts/osac/ --values "$f" > /dev/null
        done

    - name: Template with environment values
      working-directory: osac-installer
      run: |
        set -euo pipefail
        for f in values/*/values.yaml; do
          echo "--- helm template with $(dirname "$f" | xargs basename) ---"
          helm template osac charts/osac/ --values "$f" \
            --set service.externalHostname=fulfillment-api.example.com \
            --set service.internalHostname=fulfillment-internal-api.example.com \
            > /dev/null
        done

    - name: Validate values schema
      working-directory: osac-installer
      run: python3 -m json.tool charts/osac/values.schema.json > /dev/null
