---
- name: Apply templates for clusters
  ansible.builtin.include_tasks: clusters.yaml

- name: Apply templates for compute instances
  ansible.builtin.include_tasks: compute_instances.yaml

- name: Apply templates for bare metal instances
  ansible.builtin.include_tasks: bare_metal_instances.yaml

- name: Skip AddOnOperator publishing when no templates were discovered
  ansible.builtin.debug:
    msg: "No AddOnOperator templates discovered; skipping AddOnOperator publishing"
  when: osac_addon_operator_templates | default([]) | length == 0

- name: Apply templates for add-on operators
  ansible.builtin.include_tasks: addon_operators.yaml
  when: osac_addon_operator_templates | default([]) | length > 0
