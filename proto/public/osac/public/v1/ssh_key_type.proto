syntax = "proto3";

package osac.public.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "osac/public/v1/metadata_type.proto";

// Represents a tenant-scoped OpenSSH public key that can be reused by other objects.
message SshKey {
  // Unique identifier of the SSH key.
  string id = 1;

  // Metadata of the SSH key, including its tenant-scoped name.
  Metadata metadata = 2;

  // The immutable public key material in OpenSSH authorized_keys format.
  SshKeySpec spec = 3;

  // Current state of the SSH key.
  SshKeyStatus status = 4;
}

// Desired configuration of an SSH key.
message SshKeySpec {
  // Public key material in OpenSSH authorized_keys format.
  string public_key = 1 [
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = IMMUTABLE
  ];
}

// Current state of an SSH key.
message SshKeyStatus {}

// Reference to a tenant-scoped SSH key.
message SshKeyReference {
  // Unique identifier of the referenced SSH key.
  string id = 1;

  // Tenant-scoped name of the referenced SSH key.
  string name = 2;
}
