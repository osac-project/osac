# Repo-local overrides for osac.
# Inherits all other settings (path_filters, labeling_instructions,
# request_changes_workflow, base_branches, etc.) from the central
# osac-project/coderabbit/.coderabbit.yaml.
#
# Schema: https://coderabbit.ai/integrations/schema.v2.json
#
# Why: osac-ci already handles allowed auto-approvals for dependency
# bot PRs.  Reviewing them with CodeRabbit is redundant noise.
# osac-dev-bot is preserved from the inherited central config because
# a locally defined ignore_usernames replaces the parent array.
inheritance: true

reviews:
  auto_review:
    ignore_usernames:
      - "osac-dev-bot"
      - "dependabot[bot]"
      - "red-hat-konflux-kflux-prd-rh02[bot]"
