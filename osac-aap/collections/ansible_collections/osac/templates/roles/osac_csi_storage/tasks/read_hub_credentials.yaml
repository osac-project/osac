---
# Reads the tenant-scoped OSAC CSI service-identity credentials written by OSAC-4197
# from the hub cluster.  Uses kubeconfig: ~ (null) to explicitly target the hub cluster
# regardless of _remote_kubeconfig being set in the play scope.
#
# CALLER CONTRACT: callers MUST clear output facts in their always block:
#   _osac_csi_client_id, _osac_csi_client_secret, _osac_csi_issuer_url,
#   _osac_csi_fulfillment_endpoint
#
# Sets output facts:
#   _osac_csi_client_id
#   _osac_csi_client_secret
#   _osac_csi_issuer_url
#   _osac_csi_fulfillment_endpoint

- name: Validate hub secret namespace is set
  ansible.builtin.assert:
    that:
      - osac_csi_driver_hub_secret_namespace is defined
      - osac_csi_driver_hub_secret_namespace | length > 0
    fail_msg: >-
      osac_csi_driver_hub_secret_namespace must be set to the hub namespace holding
      the tenant credential Secret (via OSAC_STORAGE_CONFIG_NAMESPACE or service account).

- name: Read tenant CSI credential Secret from hub cluster
  kubernetes.core.k8s_info:
    kubeconfig: ~
    validate_certs: true
    api_version: v1
    kind: Secret
    name: "{{ osac_csi_driver_hub_secret_prefix }}{{ tenant_name }}"
    namespace: "{{ osac_csi_driver_hub_secret_namespace }}"
  register: _osac_csi_hub_secret
  no_log: true
  when: _osac_csi_hub_secret is not defined or _osac_csi_hub_secret is none or (_osac_csi_hub_secret | length == 0)

- name: Fail if tenant CSI credential Secret is missing
  ansible.builtin.fail:
    msg: >-
      Tenant CSI credential Secret '{{ osac_csi_driver_hub_secret_prefix }}{{ tenant_name }}'
      not found in namespace '{{ osac_csi_driver_hub_secret_namespace }}' on the hub cluster.
      This Secret is created by OSAC-4197 during tenant onboarding.  Ensure OSAC-4197 has
      completed for tenant '{{ tenant_name }}' before provisioning CaaS cluster storage.
  when: (_osac_csi_hub_secret.resources | default([])) | length == 0

- name: Fail if Secret is missing required credential keys
  ansible.builtin.fail:
    msg: >-
      Hub Secret '{{ osac_csi_driver_hub_secret_prefix }}{{ tenant_name }}' is missing one
      or more required keys: client-id, client-secret, issuer-url, fulfillment-endpoint.
      Re-run OSAC-4197 setup for tenant '{{ tenant_name }}'.
  when: >-
    _osac_csi_hub_secret.resources[0].data is not defined or
    _osac_csi_hub_secret.resources[0].data is none or
    'client-id' not in _osac_csi_hub_secret.resources[0].data or
    ((_osac_csi_hub_secret.resources[0].data['client-id'] | default('', true)) | b64decode | length) == 0 or
    'client-secret' not in _osac_csi_hub_secret.resources[0].data or
    ((_osac_csi_hub_secret.resources[0].data['client-secret'] | default('', true)) | b64decode | length) == 0 or
    'issuer-url' not in _osac_csi_hub_secret.resources[0].data or
    ((_osac_csi_hub_secret.resources[0].data['issuer-url'] | default('', true)) | b64decode | length) == 0 or
    'fulfillment-endpoint' not in _osac_csi_hub_secret.resources[0].data or
    ((_osac_csi_hub_secret.resources[0].data['fulfillment-endpoint'] | default('', true)) | b64decode | length) == 0
  no_log: true
- name: Extract tenant CSI credentials from hub Secret
  ansible.builtin.set_fact:
    _osac_csi_client_id: "{{ (_osac_csi_hub_secret.resources[0].data['client-id'] | default('', true)) | b64decode }}"
    _osac_csi_client_secret: "{{ (_osac_csi_hub_secret.resources[0].data['client-secret'] | default('', true)) | b64decode }}"
    _osac_csi_issuer_url: "{{ (_osac_csi_hub_secret.resources[0].data['issuer-url'] | default('', true)) | b64decode }}"
    _osac_csi_fulfillment_endpoint: "{{ (_osac_csi_hub_secret.resources[0].data['fulfillment-endpoint'] | default('', true)) | b64decode }}"
  no_log: true

- name: Clear raw hub Secret object from facts
  ansible.builtin.set_fact:
    _osac_csi_hub_secret: {}
