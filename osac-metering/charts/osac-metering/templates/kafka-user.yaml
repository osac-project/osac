{{- /* Strimzi KafkaUser — creates SCRAM-SHA-512 credentials and a Secret
     with the same name as the user. The metering service mounts this Secret
     for Kafka authentication. Metering reads every tenant's event topic,
     reads and writes every tenant's heartbeat topic, and creates the
     heartbeat and dead-letter topics of the tenants it serves, verifying
     the retention of the topics it finds. */}}
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: {{ include "osac-metering.kafkaSaslUsername" . }}
  namespace: {{ include "osac-metering.kafkaClusterNamespace" . }}
  labels:
    strimzi.io/cluster: {{ include "osac-metering.kafkaClusterName" . }}
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: osac.events.
          patternType: prefix
        operations:
          - Read
          - Describe
        host: "*"
      - resource:
          type: topic
          name: osac.metering.heartbeat.
          patternType: prefix
        operations:
          - Create
          - Read
          - Write
          - Describe
          - DescribeConfigs
        host: "*"
      - resource:
          type: topic
          name: osac.metering.dlq.
          patternType: prefix
        operations:
          - Create
          - Describe
          - DescribeConfigs
        host: "*"
