syntax = "proto3";

package osac.public.v1;

import "buf/validate/validate.proto";
import "osac/public/v1/metadata_type.proto";
import "osac/public/v1/role_type.proto";

// A tenant-owned machine identity. Credentials are returned separately when created or regenerated.
message ServiceAccount {
  option (buf.validate.message).cel = {
    id: "service_account.project"
    message: "service accounts cannot belong to a project"
    expression: "this.metadata.project == ''"
  };

  // Unique identifier assigned by the server.
  string id = 1;

  // Name and tenant ownership. The name is immutable and unique within the tenant, including during deletion.
  Metadata metadata = 2 [(buf.validate.field).required = true];

  // Desired role grants.
  ServiceAccountSpec spec = 3;

  // Server-controlled identity. Input values are ignored on creation and public updates.
  ServiceAccountStatus status = 4;
}

// Desired state of a service account.
message ServiceAccountSpec {
  // Unordered set of predefined role IDs. References by name, project or shared scope are not supported.
  repeated RoleReference roles = 1 [
    (buf.validate.field).repeated.max_items = 4,
    (buf.validate.field).cel = {
      id: "service_account.role_ids"
      message: "roles must contain only nonempty ID references"
      expression: "this.all(r, r.id != '' && r.name == '' && r.project == '' && !r.shared)"
    },
    (buf.validate.field).cel = {
      id: "service_account.unique_roles"
      message: "role IDs must be unique"
      expression: "this.size() <= 4 ? this.all(r, this.filter(other, other.id == r.id).size() == 1) : true"
    }
  ];
}

// Server-controlled service-account identity. This message never contains credentials.
message ServiceAccountStatus {
  // OAuth client ID assigned by the server.
  string client_id = 1;
}
