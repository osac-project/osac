# ──────────────────────────────────────────────────────────────
# Test 15: Windows VM with user-data — pre-secrets base spec
# Expected: vm_user_data_secret_ref extracted, Windows template spec built
#           (EFI, no cloudInitNoCloud), base spec has only root-disk before
#           create_secrets runs.
# The actual sysprep Secret copy, SATA CD-ROM disk/volume injection,
# destination Secret reference, and byte-identical userdata→Unattend.xml
# assertions are covered by the Kind-backed sysprep_secret_copy scenario
# (tests/integration/targets/compute_instance_create/tasks/
# sysprep_secret_copy.yml), which exercises the real create_secrets.yaml
# path end-to-end.
# ──────────────────────────────────────────────────────────────
- name: "Test ocp_virt_vm -- Windows VM with user-data pre-secrets base spec"
  hosts: localhost

  collections:
    - osac.templates

  vars:
    compute_instance_label: "osac.openshift.io/computeinstance"

  tasks:
    - when: test_windows_userdata_sysprep | default(false) | bool
      block:
        - name: Load ocp_virt_vm role defaults (Windows profile maps)
          ansible.builtin.include_vars:
            file: "{{ playbook_dir }}/../defaults/main.yaml"

        - name: Load Windows fixture with userDataSecretRef
          ansible.builtin.set_fact:
            compute_instance: "{{ lookup('file', 'fixtures/computeinstance-windows-userdata-test.yaml') | from_yaml }}"
            guest_os_family: windows
            default_spec: "{{ _guest_os_windows_default_spec }}"
            default_arg_specs: "{{ _guest_os_windows_default_arg_specs }}"
            template_parameters: {}

        - name: Set compute instance name
          ansible.builtin.set_fact:
            compute_instance_name: "{{ compute_instance.metadata.name }}"

        - name: Run create_validate to extract VM config
          ansible.builtin.include_role:
            name: osac.templates.ocp_virt_vm
            tasks_from: create_validate.yaml

        - name: Run create_build_spec to build VM template spec
          ansible.builtin.include_role:
            name: osac.templates.ocp_virt_vm
            tasks_from: create_build_spec.yaml

        - name: Verify vm_user_data_secret_ref extracted from spec
          ansible.builtin.assert:
            that:
              - vm_user_data_secret_ref is defined
              - vm_user_data_secret_ref == "win-admin-creds"
            fail_msg: >-
              Expected vm_user_data_secret_ref='win-admin-creds',
              got {{ vm_user_data_secret_ref | default('undefined') }}

        - name: Verify sysprep path preconditions (Windows + non-empty user-data ref)
          ansible.builtin.assert:
            that:
              - guest_os_family == 'windows'
              - vm_user_data_secret_ref | length > 0
            fail_msg: >-
              Sysprep path requires guest_os_family='windows' and non-empty
              vm_user_data_secret_ref; got guest_os_family='{{ guest_os_family }}'
              vm_user_data_secret_ref='{{ vm_user_data_secret_ref }}'

        - name: Verify Windows template spec includes EFI secure boot
          ansible.builtin.assert:
            that:
              - vm_template_spec.domain.firmware.bootloader.efi.secureBoot == true
            fail_msg: >-
              Expected Windows EFI secureBoot=true,
              got {{ vm_template_spec.domain.firmware | default('undefined') }}

        - name: Verify base template spec has only root-disk volume (no cloudInitNoCloud)
          ansible.builtin.assert:
            that:
              - vm_template_spec.volumes | length == 1
              - vm_template_spec.volumes[0].name == 'root-disk'
            fail_msg: >-
              Expected only root-disk volume before create_secrets runs,
              got {{ vm_template_spec.volumes }}

# ──────────────────────────────────────────────────────────────
# Test 16: Windows VM without user-data — no sysprep created
# Expected: vm_user_data_secret_ref is empty, base template spec has only
#           root-disk volume, no sysprep or cloudInitNoCloud volumes
# ──────────────────────────────────────────────────────────────
- name: "Test ocp_virt_vm -- Windows VM without user-data skips sysprep"
  hosts: localhost

  collections:
    - osac.templates

  vars:
    compute_instance_label: "osac.openshift.io/computeinstance"

  tasks:
    - when: test_windows_no_userdata | default(false) | bool
      block:
        - name: Load ocp_virt_vm role defaults (Windows profile maps)
          ansible.builtin.include_vars:
            file: "{{ playbook_dir }}/../defaults/main.yaml"

        - name: Load Windows fixture without userDataSecretRef
          ansible.builtin.set_fact:
            compute_instance: "{{ lookup('file', 'fixtures/computeinstance-windows-with-image-test.yaml') | from_yaml }}"
            guest_os_family: windows
            default_spec: "{{ _guest_os_windows_default_spec }}"
            default_arg_specs: "{{ _guest_os_windows_default_arg_specs }}"
            template_parameters: {}

        - name: Set compute instance name
          ansible.builtin.set_fact:
            compute_instance_name: "{{ compute_instance.metadata.name }}"

        - name: Run create_validate to extract VM config
          ansible.builtin.include_role:
            name: osac.templates.ocp_virt_vm
            tasks_from: create_validate.yaml

        - name: Run create_build_spec to build VM template spec
          ansible.builtin.include_role:
            name: osac.templates.ocp_virt_vm
            tasks_from: create_build_spec.yaml

        - name: Verify vm_user_data_secret_ref is empty (no userDataSecretRef on CR)
          ansible.builtin.assert:
            that:
              - vm_user_data_secret_ref is defined
              - vm_user_data_secret_ref | length == 0
            fail_msg: >-
              Expected empty vm_user_data_secret_ref when userDataSecretRef is absent,
              got '{{ vm_user_data_secret_ref | default('undefined') }}'

        - name: Verify sysprep path is skipped (empty ref fails condition)
          ansible.builtin.assert:
            that:
              - not (guest_os_family == 'windows' and vm_user_data_secret_ref | length > 0)
            fail_msg: >-
              Sysprep path condition should be false; got guest_os_family='{{ guest_os_family }}'
              vm_user_data_secret_ref='{{ vm_user_data_secret_ref }}'

        - name: Verify only root-disk volume in template spec (no sysprep, no cloudInit)
          ansible.builtin.assert:
            that:
              - vm_template_spec.volumes | length == 1
              - vm_template_spec.volumes[0].name == 'root-disk'
            fail_msg: >-
              Expected only root-disk volume when no user-data is provided,
              got {{ vm_template_spec.volumes }}

        - name: Verify no sysprep disk in devices
          ansible.builtin.assert:
            that:
              - vm_template_spec.domain.devices.disks | selectattr('name', 'equalto', 'sysprep-disk') | list | length == 0
            fail_msg: >-
              Expected no sysprep-disk when userDataSecretRef is absent,
              but found one in {{ vm_template_spec.domain.devices.disks }}

# ──────────────────────────────────────────────────────────────
# Test 17: Linux VM with user-data — cloud-init path (regression check)
# Expected: vm_user_data_secret_ref extracted, Linux template spec built
#           (no EFI/clock), cloud-init patch adds cloudInitNoCloud volume
#           with virtio bus, no sysprep volume present
# ──────────────────────────────────────────────────────────────
- name: "Test ocp_virt_vm -- Linux VM with user-data uses cloud-init path"
  hosts: localhost

  collections:
    - osac.templates

  vars:
    compute_instance_label: "osac.openshift.io/computeinstance"

  tasks:
    - when: test_linux_userdata_cloudinit | default(false) | bool
      block:
        - name: Load ocp_virt_vm role defaults
          ansible.builtin.include_vars:
            file: "{{ playbook_dir }}/../defaults/main.yaml"

        - name: Build Linux ComputeInstance with userDataSecretRef
          ansible.builtin.set_fact:
            compute_instance:
              apiVersion: osac.openshift.io/v1alpha1
              kind: ComputeInstance
              metadata:
                name: test-linux-cloudinit
                namespace: osac-system
              spec:
                templateID: osac.templates.ocp_virt_vm
                vcpus: 2
                memoryGiB: 2
                networkAttachments:
                  - subnetRef: test-subnet
                userDataSecretRef:
                  name: linux-cloud-init
            guest_os_family: linux

        - name: Set compute instance name
          ansible.builtin.set_fact:
            compute_instance_name: "{{ compute_instance.metadata.name }}"

        - name: Run create_validate to extract VM config
          ansible.builtin.include_role:
            name: osac.templates.ocp_virt_vm
            tasks_from: create_validate.yaml

        - name: Run create_build_spec to build VM template spec
          ansible.builtin.include_role:
            name: osac.templates.ocp_virt_vm
            tasks_from: create_build_spec.yaml

        - name: Verify vm_user_data_secret_ref extracted from spec
          ansible.builtin.assert:
            that:
              - vm_user_data_secret_ref is defined
              - vm_user_data_secret_ref == "linux-cloud-init"
            fail_msg: >-
              Expected vm_user_data_secret_ref='linux-cloud-init',
              got {{ vm_user_data_secret_ref | default('undefined') }}

        - name: Verify cloud-init path preconditions (non-Windows + non-empty user-data ref)
          ansible.builtin.assert:
            that:
              - guest_os_family != 'windows'
              - vm_user_data_secret_ref | length > 0
            fail_msg: >-
              Cloud-init path requires guest_os_family!='windows' and non-empty
              vm_user_data_secret_ref; got guest_os_family='{{ guest_os_family }}'
              vm_user_data_secret_ref='{{ vm_user_data_secret_ref }}'

        - name: Verify Linux template spec has no Windows-specific firmware or clock
          ansible.builtin.assert:
            that:
              - vm_template_spec.domain.firmware is not defined
              - vm_template_spec.domain.clock is not defined
            fail_msg: >-
              Linux VM should not have Windows firmware/clock blocks,
              got firmware={{ vm_template_spec.domain.firmware | default('(absent)') }}
              clock={{ vm_template_spec.domain.clock | default('(absent)') }}

        - name: Verify base template spec has only root-disk volume (no sysprep)
          ansible.builtin.assert:
            that:
              - vm_template_spec.volumes | length == 1
              - vm_template_spec.volumes[0].name == 'root-disk'
            fail_msg: >-
              Expected only root-disk volume before create_secrets runs,
              got {{ vm_template_spec.volumes }}

        - name: Apply cloud-init patch (offline replay of create_secrets combine logic)
          ansible.builtin.set_fact:
            cloudinit_patched_spec: "{{ vm_template_spec | combine(cloud_init_patch, recursive=True, list_merge='append') }}"
          vars:
            cloud_init_patch:
              domain:
                devices:
                  disks:
                    - name: cloud-init-disk
                      disk:
                        bus: virtio
                      serial: cloud-init
              volumes:
                - name: cloud-init-disk
                  cloudInitNoCloud:
                    secretRef:
                      name: "{{ compute_instance_name }}-user-data"

        - name: Verify cloud-init disk uses virtio bus
          ansible.builtin.assert:
            that:
              - cloudinit_patched_spec.domain.devices.disks | selectattr('name', 'equalto', 'cloud-init-disk') | list | length == 1
              - (cloudinit_patched_spec.domain.devices.disks | selectattr('name', 'equalto', 'cloud-init-disk') | first).disk.bus == 'virtio'
            fail_msg: >-
              Expected cloud-init-disk with disk.bus=virtio,
              got {{ cloudinit_patched_spec.domain.devices.disks }}

        - name: Verify cloudInitNoCloud volume references correct secret
          ansible.builtin.assert:
            that:
              - cloudinit_patched_spec.volumes | selectattr('name', 'equalto', 'cloud-init-disk') | list | length == 1
              - (cloudinit_patched_spec.volumes | selectattr('name', 'equalto', 'cloud-init-disk') | first).cloudInitNoCloud.secretRef.name == "test-linux-cloudinit-user-data"
            fail_msg: >-
              Expected cloudInitNoCloud volume with secret 'test-linux-cloudinit-user-data',
              got {{ cloudinit_patched_spec.volumes }}

        - name: Verify no sysprep disk in patched spec
          ansible.builtin.assert:
            that:
              - cloudinit_patched_spec.domain.devices.disks | selectattr('name', 'equalto', 'sysprep-disk') | list | length == 0
            fail_msg: >-
              Expected no sysprep-disk for Linux VM,
              but found one in {{ cloudinit_patched_spec.domain.devices.disks }}
