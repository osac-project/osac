---
# OSAC CSI driver ensure_storage_class:
#   1. Read tenant-scoped OAuth2 credentials from hub Secret (OSAC-4197).
#   2. Deploy the OSAC CSI driver + NodePlugin to the tenant cluster via Helm.
#   3. Propagate the OAuth2 credential Secret to the tenant cluster.
#   4. Create per-tier opaque StorageClasses with provisioner csi.osac.openshift.io.
#
# This task file MUST only be called via _dispatch_provider.yaml when a CaaS
# admin_kubeconfig is present (_remote_kubeconfig defined).  It raises an explicit
# error when called in a hub-cluster (VMaaS) context because the OSAC CSI driver
# belongs on tenant clusters only — hub-side provisioning uses vendor-specific roles.
#
# Idempotent: Helm upgrade --install is a no-op when the release is unchanged;
# existing StorageClasses and the credential Secret are left untouched.

- name: Assert _provider_tiers is defined and non-empty
  ansible.builtin.assert:
    that:
      - _provider_tiers is defined
      - _provider_tiers | length > 0
    fail_msg: _provider_tiers must be provided by the service role dispatcher.

- name: Fail when called without a guest-cluster kubeconfig (hub path unsupported)
  ansible.builtin.fail:
    msg: >-
      osac_csi_driver ensure_storage_class requires a guest-cluster admin_kubeconfig
      (_remote_kubeconfig must be set).  The OSAC CSI meta-driver is only deployed to
      CaaS tenant clusters, not to the hub cluster.  Remove 'osac_csi_driver' from the
      storage tiers for this Tenant if VMaaS-only storage is intended.
  when: _remote_kubeconfig is not defined or _remote_kubeconfig | length == 0

- name: Validate tenant_name is a valid DNS label
  ansible.builtin.fail:
    msg: "tenant_name '{{ tenant_name }}' is not a valid DNS label."
  when: tenant_name is not regex('^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$')

- name: Build expected StorageClass entries
  ansible.builtin.set_fact:
    _osac_csi_expected_sc_entries: >-
      {% set entries = [] -%}
      {% for tier in _provider_tiers -%}
      {% set _ = entries.append({'name': 'osac-' ~ tenant_name ~ '-' ~ tier.name, 'tier': tier.name, 'protocol': tier.protocol}) -%}
      {% endfor -%}
      {{ entries }}


- name: Provision OSAC CSI driver and StorageClasses on guest cluster
  block:

    - name: Ensure OSAC CSI driver namespace exists on guest cluster
      kubernetes.core.k8s:
        kubeconfig: "{{ _remote_kubeconfig }}"
        validate_certs: "{{ false if (_remote_kubeconfig_insecure | default(false) | bool) else omit }}"
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ osac_csi_driver_namespace }}"
            labels:
              app.kubernetes.io/managed-by: osac-aap
              osac.openshift.io/tenant: "{{ tenant_name }}"
              pod-security.kubernetes.io/enforce: privileged
              pod-security.kubernetes.io/warn: privileged
      no_log: true


    - name: Derive OSAC CSI driver vendor sockets configuration
      ansible.builtin.set_fact:
        _osac_csi_derived_vendor_sockets: >-
          {% set _pairs = [] -%}
          {% for _k, _v in osac_csi_driver_vendor_node_socket_paths.items() -%}
          {% set _sock = _v if _v.endswith('.sock') else (_v ~ '/csi.sock') -%}
          {% set _ = _pairs.append(_k ~ '=' ~ _sock) -%}
          {% endfor -%}
          {{ _pairs | sort | join(',') }}

    - name: Deploy OSAC CSI driver via Helm on guest cluster
      kubernetes.core.helm:
        kubeconfig: "{{ _remote_kubeconfig }}"
        validate_certs: "{{ false if (_remote_kubeconfig_insecure | default(false) | bool) else omit }}"
        release_name: "{{ osac_csi_driver_helm_release }}"
        chart_ref: "{{ osac_csi_driver_chart_ref }}"
        chart_version: "{{ osac_csi_driver_chart_version }}"
        release_namespace: "{{ osac_csi_driver_namespace }}"
        create_namespace: false
        wait: true
        wait_timeout: 5m
        values:
          driverName: "{{ osac_csi_driver_name }}"
          namespace: "{{ osac_csi_driver_namespace }}"
          controller:
            fulfillment:
              endpoint: "{{ osac_csi_driver_fulfillment_endpoint | default('http://fulfillment-service.osac-system.svc.cluster.local:8080') }}"
              issuerUrl: "{{ osac_csi_driver_issuer_url | default('http://keycloak.osac-system.svc.cluster.local:8080/realms/osac') }}"
              credentials:
                secretName: "{{ osac_csi_driver_credentials_secret_name }}"
                clientIdKey: client-id
                clientSecretKey: client-secret
              tls:
                insecureSkipVerify: "{{ osac_csi_driver_fulfillment_tls_insecure | bool }}"
          node:
            vendorSockets: "{{ _osac_csi_derived_vendor_sockets }}"
      no_log: true

    - name: Create per-tier OSAC CSI StorageClasses on guest cluster
      kubernetes.core.k8s:
        kubeconfig: "{{ _remote_kubeconfig }}"
        validate_certs: "{{ false if (_remote_kubeconfig_insecure | default(false) | bool) else omit }}"
        state: present
        definition:
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: "{{ item.name }}"
            labels:
              app.kubernetes.io/managed-by: osac-aap
              osac.openshift.io/managed-by: osac-csi-driver
              osac.openshift.io/tenant: "{{ tenant_name }}"
              osac.openshift.io/storage-tier: "{{ item.tier }}"
              osac.openshift.io/storage-protocol: "{{ item.protocol }}"
          provisioner: "{{ osac_csi_driver_name }}"
          parameters:
            tier: "{{ item.tier }}"
            tenant: "{{ tenant_name }}"
            osac.openshift.io/tenant: "{{ tenant_name }}"
            osac.openshift.io/storage-tier: "{{ item.tier }}"
          reclaimPolicy: "{{ osac_csi_driver_reclaim_policy }}"
          volumeBindingMode: "{{ osac_csi_driver_volume_binding_mode }}"
          allowVolumeExpansion: true
      loop: "{{ _osac_csi_expected_sc_entries }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true

    - name: Set StorageClass names output
      ansible.builtin.set_fact:
        storage_provider_storage_class_names: "{{ _osac_csi_expected_sc_entries }}"


