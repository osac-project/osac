{{- if eq (include "osac-operator.controllerEnabled" (list . "clusterOrder" "caas")) "true" }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "osac-operator.clusterOrderRBACWebhookName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-operator.labels" . | nindent 4 }}
spec:
  issuerRef:
    kind: {{ .Values.certs.issuerRef.kind }}
    name: {{ required "certs.issuerRef.name is required" .Values.certs.issuerRef.name }}
  dnsNames:
  - {{ include "osac-operator.clusterOrderRBACWebhookName" . }}
  - {{ include "osac-operator.clusterOrderRBACWebhookName" . }}.{{ .Release.Namespace }}
  - {{ include "osac-operator.clusterOrderRBACWebhookName" . }}.{{ .Release.Namespace }}.svc
  - {{ include "osac-operator.clusterOrderRBACWebhookName" . }}.{{ .Release.Namespace }}.svc.cluster.local
  secretName: {{ include "osac-operator.clusterOrderRBACWebhookName" . }}-tls
  privateKey:
    rotationPolicy: Always
{{- end }}
