global:
  networking:
    # Set at installation; when false the operator runs no networking job.
    provisioningEnabled: true
  fulfillmentTrust:
    enabled: false
    tenantNamespace: osac-csi
  # Mirrors the osac-observability chart's global values. The umbrella chart
  # supplies them; these defaults keep a standalone operator install consistent.
  observability:
    # Must match the namespace the osac-observability chart renders into.
    namespace: osac-observability
    collection:
      # How often a tenant cluster scrapes; also the interval the operator
      # writes into the tenant's cluster monitoring configuration.
      infrastructure: 30s
    clusterRemoteWrite:
      # When false the operator configures no tenant cluster and needs no
      # write-path RBAC, and the osac-observability chart renders no proxy.
      enabled: false
      writeCAIssuer: osac-metrics-write-ca
      # Shared denylist of withdrawn certificate serials the write proxy reads
      # on every request.
      revocationConfigMap: osac-metrics-write-revocation
      routeName: thanos-receive-managed
      certificateDuration: 90d
      renewBefore: 30d
      # One definition for the proxy's drop rule and the cluster-side copy the
      # operator writes, so the two cannot drift.
      dropRule:
        keepKubePrefix: kube_node_
        dropPrefixes: [container_, claim, mount, kserve_, vllm_, dcgm_]

image:
  repository: ghcr.io/osac-project/osac-operator
  tag: latest  # PLACEHOLDER -- overwritten at release time by osac-build-and-publish.yaml
  pullPolicy: Always

replicaCount: 1

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 10m
    memory: 128Mi

aap:
  url: ""
  token: ""
  insecureSkipVerify: "true"
  statusPollInterval: "30s"
  templatePrefix: "osac"
  organization: "osac"

stall:
  preparingInfrastructureThreshold: "15m"
  controlPlaneStartingThreshold: "30m"
  workersJoiningThreshold: "20m"
  workersJoiningByInstanceType: {}

upgradeTimeouts:
  pending: "10m"
  controlPlane: "40m"
  nodePoolPerNode: "20m"

# On OpenShift, trust the platform-managed ingress CA when fetching Assisted
# Service discovery ignition through its HTTPS Route.
ignition:
  trustIngressCA: false

fulfillment:
  serverAddress: ""
  credentials:
    secretName: fulfillment-controller-credentials
    clientIdKey: client-id
    clientSecretKey: client-secret
  tls:
    caBundle:
      configMap: ca-bundle
      key: bundle.pem
  configMap:
    name: ""
    optional: true

controllers:
  tenant: true
  networking: true
  storage: true
  # The Volume controller provisions volumes via the vendor CSI controllers.
  # Safe to leave enabled even without a vendor backend: when vendorControllers
  # is empty the controller starts with provisioning disabled (Volumes stay in
  # Progressing) and never fails operator startup.
  volume: true

# vendorControllers maps provider identifiers to their vendor CSI controller
# gRPC endpoints, rendered into OSAC_VENDOR_CONTROLLERS for the Volume
# controller. Optional: leave empty on setups with no vendor storage backend.
# For non-production LVMS/dev, use the same provider key as the CSI route:
#   vendorControllers:
#     lvms: none
# Example:
#   vendorControllers:
#     vast: vast-csi-controller.osac-csi-backends.svc:50051
vendorControllers: {}

configSecret:
  name: "osac-config"
  optional: true

serviceAccount:
  create: true
  name: ""

consoleProxy:
  disabled: false
  vmClusterMode: auto
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

certs:
  issuerRef:
    kind: ClusterIssuer
    name: default-ca

# Path and Secret used to connect controllers to a remote VMaaS cluster.
# Set both values to enable remote-cluster mode; leave both empty for local mode.
remoteClusterKubeconfig: ""
remoteClusterKubeconfigSecretName: ""
remoteClusterKubeconfigSecretKey: kubeconfig

hubAccess:
  enabled: false

tenants: []

# Admin-managed FabricDomain inventory: exact Netris hostname -> private API
# BareMetalInstanceType ID. Rendered as osac-fabric-domain-inventory in the
# release/networking namespace only when nonempty. Contains no credentials.
# Example:
# fabricDomainInventory:
#   gpu-01.example.com: "gpu-bmit-id"
#   gpu-02.example.com: "gpu-bmit-id"
fabricDomainInventory: {}

# --- Network Manager Registration ---
# ConfigMaps that register networking managers for the two-manager model.
# The operator discovers managers by selecting ConfigMaps with labels
# osac.openshift.io/network-fabric-manager or osac.openshift.io/network-k8s-manager.
networkManagers:
  enabled: true
  # capabilitiesSyncInterval controls how often the operator recomputes NetworkClass
  # capabilities from the fabric/k8s manager ConfigMaps (in addition to reacting
  # immediately to ConfigMap changes).
  capabilitiesSyncInterval: "5m"
  # IP capabilities are IPv4-only for the current release. The fabric-only token
  # eastWestEthernet publishes NetworkClass.capabilities.supports_east_west_ethernet;
  # the k8s manager need not advertise it. Set the corresponding
  # NetworkClass.spec.disable_capabilities field to true to suppress publication.
  fabricManagers:
    cudn_net:
      enabled: true
      description: >-
        CUDN-based isolated networking (ClusterUserDefinedNetwork). Leaf overlay
        role for VirtualNetwork/Subnet — not a physical fabric manager. VMaaS
        without a fabric uses k8sManagers.k8s_only as the NetworkClass manager,
        which delegates overlay work here. Capabilities: ipv4 only.
      capabilities:
      - ipv4
  k8sManagers:
    k8s_only:
      enabled: false
      description: >-
        Composite k8s-native networking (CUDN, Kubernetes NetworkPolicy, MetalLB
        L2) with no separate physical fabric. Delegates each resource type to an
        existing k8s-native implementation — see osac-aap's osac.templates.k8s_only
        role. Capabilities: ipv4 only.
      capabilities:
      - ipv4

# Standalone ServiceMonitor override. The umbrella chart enables scrapes
# through global.observability; when both are off, neither the ServiceMonitor
# nor its Prometheus ClusterRoleBinding renders.
serviceMonitor:
  enabled: false
  # When empty, global.observability.collection.osacControlPlane is used.
  interval: ""
  prometheusNamespace: openshift-monitoring
