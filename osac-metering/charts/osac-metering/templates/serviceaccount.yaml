apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "osac-metering.fullname" . }}
  labels:
    {{- include "osac-metering.labels" . | nindent 4 }}
    app.kubernetes.io/component: metering
---
# Metering only reads rule revision ConfigMaps; only cluster administrators
# create them, and an admission policy blocks deleting them. The read grant
# covers every ConfigMap in the namespace because resourceNames cannot match
# the revision prefix, and future revisions must work without a chart change.
# The service reads revisions from ConfigMaps in its own namespace, which is
# the release namespace, so the grant lives there.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "osac-metering.fullname" . }}-rules-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-metering.labels" . | nindent 4 }}
    app.kubernetes.io/component: metering
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "osac-metering.fullname" . }}-rules-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-metering.labels" . | nindent 4 }}
    app.kubernetes.io/component: metering
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "osac-metering.fullname" . }}-rules-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "osac-metering.fullname" . }}
    namespace: {{ .Release.Namespace }}
