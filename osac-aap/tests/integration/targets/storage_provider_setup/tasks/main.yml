---
# Integration test for osac.service.storage_provider setup action.
# Exercises the full tenant storage setup flow against a mock VMS server.
# Requires: mock VMS server on 127.0.0.1:18443, kind cluster with osac-system namespace.

# ── Test: Full tenant storage setup ──
- name: "Storage Provider Setup - Run setup"
  hosts: localhost
  gather_facts: false

  environment:
    VAST_VIP_POOL_SUPERNET: "10.0.0.0/24"
    OSAC_STORAGE_CONFIG_NAMESPACE: "osac-system"

  vars:
    vast_storage_config_namespace: osac-system
    tenant_name: "test-setup"
    tenant_namespace: "osac-system"
    tenant_uid: "test-uid-setup"
    storage_provider_tiers:
      - name: default
        protocol: nfs
        provider: vast
        backend_id: be-test
        # qos_policy intentionally omitted: the role always derives it from the tier
        # name now, discarding any caller-supplied value.
        qos_limits:
          static_limits:
            max_reads_bw_mbps: 100
            max_writes_bw_mbps: 100
    storage_provider_backend_connections:
      be-test:
        endpoint: "127.0.0.1:18443"
        username: "admin"
        password: "mock-admin-password"
    storage_provider_action: setup
    storage_provider_provisioning_target: vmaas
    vast_storage_validate_certs: false

  tasks:
    - name: Run storage provider setup
      block:
        - name: Delete any pre-existing hub Secret (clean slate)
          kubernetes.core.k8s:
            state: absent
            api_version: v1
            kind: Secret
            name: "vast-tenant-config-test-setup-be-test"
            namespace: "osac-system"

        - name: Call storage_provider role with setup action
          ansible.builtin.include_role:
            name: osac.service.storage_provider
          vars:
            storage_provider_action: setup

      rescue:
        - name: Capture setup failure details
          ansible.builtin.set_fact:
            _setup_test_failed: true
            _setup_test_error: "{{ ansible_failed_result | default({}) }}"

        - name: Fail with context
          ansible.builtin.fail:
            msg: "Storage provider setup failed: {{ _setup_test_error }}"

# ── Verify: Hub Secret created correctly ──
- name: "Storage Provider Setup - Verify results"
  hosts: localhost
  gather_facts: false

  environment:
    OSAC_STORAGE_CONFIG_NAMESPACE: "osac-system"

  vars:
    vast_storage_config_namespace: osac-system
    tenant_name: "test-setup"

  tasks:
    - name: Read hub Secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "vast-tenant-config-test-setup-be-test"
        namespace: "osac-system"
      register: _hub_secret

    - name: Assert hub Secret exists
      ansible.builtin.assert:
        that:
          - _hub_secret.resources | length == 1
        fail_msg: "Hub Secret 'vast-tenant-config-test-setup-be-test' was not created"
        success_msg: "Hub Secret exists"

    - name: Decode hub Secret fields
      ansible.builtin.set_fact:
        _secret_data:
          tenant_manager_name: "{{ _hub_secret.resources[0].data.tenant_manager_name | b64decode }}"
          tenant_manager_username: "{{ _hub_secret.resources[0].data.tenant_manager_username | b64decode }}"
          tenant_manager_password: "{{ _hub_secret.resources[0].data.tenant_manager_password | b64decode }}"
          tenant_manager_id: "{{ _hub_secret.resources[0].data.tenant_manager_id | b64decode }}"
          tenant_role_id: "{{ _hub_secret.resources[0].data.tenant_role_id | b64decode }}"
          vast_tenant_id: "{{ _hub_secret.resources[0].data.vast_tenant_id | b64decode }}"
          vast_local_provider_id: "{{ _hub_secret.resources[0].data.vast_local_provider_id | b64decode }}"
          vip_pool_name: "{{ _hub_secret.resources[0].data.vip_pool_name | b64decode }}"
          vast_endpoint: "{{ _hub_secret.resources[0].data.vast_endpoint | b64decode }}"
          storage_provider_type: "{{ _hub_secret.resources[0].data.storage_provider_type | b64decode }}"
          tenant_uid_hash: "{{ _hub_secret.resources[0].data.tenant_uid_hash | b64decode }}"

    - name: Assert hub Secret has tenant manager name
      ansible.builtin.assert:
        that:
          - _secret_data.tenant_manager_name == "osac-test-setup-be-test"
        fail_msg: "Expected tenant_manager_name 'osac-test-setup-be-test', got '{{ _secret_data.tenant_manager_name }}'"
        success_msg: "tenant_manager_name correct"

    - name: Assert hub Secret has manager credentials (non-empty)
      ansible.builtin.assert:
        that:
          - _secret_data.tenant_manager_username | length > 0
          - _secret_data.tenant_manager_password | length > 0
        fail_msg: "tenant_manager_username or tenant_manager_password is empty"
        success_msg: "tenant_manager credentials present"

    - name: Assert hub Secret has tenant ID (non-empty)
      ansible.builtin.assert:
        that:
          - _secret_data.vast_tenant_id | string | length > 0
          - _secret_data.vast_tenant_id | string != ""
        fail_msg: "vast_tenant_id is empty"
        success_msg: "vast_tenant_id present: {{ _secret_data.vast_tenant_id }}"

    - name: Assert hub Secret has VIP pool name
      ansible.builtin.assert:
        that:
          - _secret_data.vip_pool_name == "osac-test-setup-vippool"
        fail_msg: "Expected vip_pool_name 'osac-test-setup-vippool', got '{{ _secret_data.vip_pool_name }}'"
        success_msg: "vip_pool_name correct"

    - name: Assert hub Secret has endpoint
      ansible.builtin.assert:
        that:
          - _secret_data.vast_endpoint == "127.0.0.1:18443"
        fail_msg: "Expected vast_endpoint '127.0.0.1:18443', got '{{ _secret_data.vast_endpoint }}'"
        success_msg: "vast_endpoint correct"

    - name: Assert hub Secret has storage provider type
      ansible.builtin.assert:
        that:
          - _secret_data.storage_provider_type == "vast"
        fail_msg: "Expected storage_provider_type 'vast', got '{{ _secret_data.storage_provider_type }}'"
        success_msg: "storage_provider_type correct"

    - name: Assert hub Secret has tenant UID hash
      ansible.builtin.assert:
        that:
          - _secret_data.tenant_uid_hash == "6ee13f1b"
        fail_msg: "Expected tenant_uid_hash '6ee13f1b', got '{{ _secret_data.tenant_uid_hash }}'"
        success_msg: "tenant_uid_hash correct"

    - name: Assert hub Secret labels
      ansible.builtin.assert:
        that:
          - _hub_secret.resources[0].metadata.labels['app.kubernetes.io/managed-by'] == 'osac-aap'
          - _hub_secret.resources[0].metadata.labels['osac.openshift.io/tenant'] == 'test-setup'
          - _hub_secret.resources[0].metadata.labels['osac.openshift.io/storage-backend-id'] == 'be-test'
          - _hub_secret.resources[0].metadata.labels['osac.openshift.io/storage-provider'] == 'vast'
        fail_msg: "Hub Secret labels incorrect"
        success_msg: "Hub Secret labels correct"

    - name: Assert storage_provider_tenant_configs output was set
      ansible.builtin.assert:
        that:
          - storage_provider_tenant_configs is defined
          - storage_provider_tenant_configs is mapping
          - "'be-test' in storage_provider_tenant_configs"
          - storage_provider_tenant_configs['be-test'].vast_tenant_id is defined
          - storage_provider_tenant_configs['be-test'].vip_pool_name == "osac-test-setup-vippool"
        fail_msg: "storage_provider_tenant_configs output not set correctly: {{ storage_provider_tenant_configs | default('undefined') }}"
        success_msg: "storage_provider_tenant_configs output correct"

# ── Test: Re-run setup to verify idempotency (Secret count stays at 1) ──
- name: "Storage Provider Setup - Re-run setup"
  hosts: localhost
  gather_facts: false

  environment:
    VAST_VIP_POOL_SUPERNET: "10.0.0.0/24"
    OSAC_STORAGE_CONFIG_NAMESPACE: "osac-system"

  vars:
    vast_storage_config_namespace: osac-system
    tenant_name: "test-setup"
    tenant_namespace: "osac-system"
    tenant_uid: "test-uid-setup"
    storage_provider_tiers:
      - name: default
        protocol: nfs
        provider: vast
        backend_id: be-test
        qos_limits:
          static_limits:
            max_reads_bw_mbps: 100
            max_writes_bw_mbps: 100
    storage_provider_backend_connections:
      be-test:
        endpoint: "127.0.0.1:18443"
        username: "admin"
        password: "mock-admin-password"
    storage_provider_action: setup
    storage_provider_provisioning_target: vmaas
    vast_storage_validate_certs: false

  tasks:
    - name: Call storage_provider role with setup action (second run)
      ansible.builtin.include_role:
        name: osac.service.storage_provider
      vars:
        storage_provider_action: setup

- name: "Storage Provider Setup - Verify idempotency"
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Read hub Secrets by label
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: "osac-system"
        label_selectors:
          - "osac.openshift.io/tenant=test-setup"
          - "osac.openshift.io/storage-provider=vast"
          - "osac.openshift.io/storage-backend-id=be-test"
      register: _hub_secrets_after_rerun

    - name: Assert exactly one hub Secret exists after re-run
      ansible.builtin.assert:
        that:
          - _hub_secrets_after_rerun.resources | length == 1
        fail_msg: "Expected exactly 1 hub Secret after re-run, got {{ _hub_secrets_after_rerun.resources | length }}"
        success_msg: "Re-run idempotent: exactly 1 hub Secret"

# ── Continue verification ──
- name: "Storage Provider Setup - Verify results (continued)"
  hosts: localhost
  gather_facts: false

  environment:
    OSAC_STORAGE_CONFIG_NAMESPACE: "osac-system"

  vars:
    vast_storage_config_namespace: osac-system
    tenant_name: "test-setup"

  tasks:
    # ── Verify mock server received expected API calls ──
    - name: Get mock server call log
      ansible.builtin.uri:
        url: "https://127.0.0.1:18443/_calls"
        validate_certs: false
        method: GET
        return_content: true
      register: _mock_calls

    - name: Parse mock call log
      ansible.builtin.set_fact:
        _call_log: "{{ _mock_calls.json }}"

    - name: Extract API methods and paths from call log
      ansible.builtin.set_fact:
        _call_summaries: >-
          {{ _call_log | map(attribute='method') | zip(_call_log | map(attribute='path')) | map('join', ' ') | list }}

    - name: Assert VIP pool was created
      ansible.builtin.assert:
        that:
          - >-
            _call_log | selectattr('path', 'search', 'vippools')
            | selectattr('method', 'equalto', 'POST') | list | length > 0
            or _call_log | selectattr('path', 'search', 'vippools')
            | selectattr('method', 'equalto', 'GET') | list | length > 0
        fail_msg: "No VIP pool API call found in mock call log"
        success_msg: "VIP pool API call detected"

    - name: Assert tenant was created
      ansible.builtin.assert:
        that:
          - _call_log | selectattr('path', 'search', 'tenants') | list | length > 0
        fail_msg: "No tenant creation API call found in mock call log"
        success_msg: "Tenant creation API call detected"

    - name: Assert admin auth was performed
      ansible.builtin.assert:
        that:
          - _call_log | selectattr('path', 'search', 'token') | selectattr('method', 'equalto', 'POST') | list | length > 0
        fail_msg: "No admin auth call found in mock call log"
        success_msg: "Admin auth API call detected"

    - name: Assert manager was created
      ansible.builtin.assert:
        that:
          - _call_log | selectattr('path', 'search', 'managers') | list | length > 0
        fail_msg: "No manager creation API call found in mock call log"
        success_msg: "Manager creation API call detected"

    # The re-run above only proved the hub Secret count stays at 1, which a
    # second provisioning pass would also satisfy (the Secret is just rewritten).
    # Count the manager POSTs instead: create_tenant_manager.yaml must take its
    # hub-Secret idempotency short-circuit on the second run.
    - name: Count tenant-manager POSTs across both setup runs
      ansible.builtin.set_fact:
        _manager_post_count: >-
          {% set _n = [] -%}
          {% for _c in _call_log -%}
          {% if _c.method == 'POST' and 'managers' in _c.path
                and (_c.body | default({})).get('username', '') == 'osac-test-setup-be-test' -%}
          {% set _ = _n.append(1) -%}
          {% endif -%}
          {% endfor -%}
          {{ _n | length }}

    - name: Assert the tenant VMS manager was created exactly once across both runs
      ansible.builtin.assert:
        that:
          - _manager_post_count | int == 1
        fail_msg: >-
          Expected exactly 1 POST /api/managers/ for 'osac-test-setup-be-test' across the
          initial setup and the re-run, got {{ _manager_post_count }}. The re-run
          must reuse the credentials already in the hub Secret.
        success_msg: "Re-run idempotent: the VMS manager was created exactly once"

# ── Test: tenant-credentials-only setup makes no VAST calls ──
# A connection entry with an endpoint and no username or password selects the
# mode. The mock VMS call log must stay empty and no hub Secret may be written.
# The run has no block/rescue: a role failure is the RED signal.
- name: "Storage Provider Setup - Tenant-credentials-only setup"
  hosts: localhost
  gather_facts: false

  environment:
    VAST_VIP_POOL_SUPERNET: "10.0.0.0/24"
    OSAC_STORAGE_CONFIG_NAMESPACE: "osac-system"

  vars:
    vast_storage_config_namespace: osac-system
    tenant_name: "test-setup-tco"
    tenant_namespace: "osac-system"
    tenant_uid: "test-uid-setup-tco"
    storage_provider_tiers:
      - name: default
        protocol: nfs
        provider: vast
        backend_id: be-setup-tco
    storage_provider_backend_connections:
      be-setup-tco:
        endpoint: "127.0.0.1:18443"
    storage_provider_action: setup
    storage_provider_provisioning_target: vmaas
    vast_storage_validate_certs: false

  tasks:
    - name: Clean slate for tenant-credentials-only setup
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Secret
        name: "vast-tenant-config-test-setup-tco-be-setup-tco"
        namespace: "osac-system"

    - name: Reset mock VMS server for tenant-credentials-only setup
      ansible.builtin.uri:
        url: "https://127.0.0.1:18443/_reset"
        validate_certs: false
        method: POST

    - name: Call storage_provider role with setup action and no admin credentials
      ansible.builtin.include_role:
        name: osac.service.storage_provider

    - name: Get mock server call log after credential-less setup
      ansible.builtin.uri:
        url: "https://127.0.0.1:18443/_calls"
        validate_certs: false
        method: GET
        return_content: true
      register: _tco_setup_calls

    - name: Read hub Secret after credential-less setup
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "vast-tenant-config-test-setup-tco-be-setup-tco"
        namespace: "osac-system"
      register: _tco_setup_secret

    - name: Assert setup made no VAST calls, wrote no hub Secret and reported the mode
      ansible.builtin.assert:
        that:
          - _tco_setup_calls.json | length == 0
          - _tco_setup_secret.resources | length == 0
          - storage_provider_tenant_configs['be-setup-tco'].tenant_credentials_only is sameas true
        fail_msg: >-
          Credential-less setup must make no VAST calls (saw {{ _tco_setup_calls.json | length }}),
          write no hub Secret and report tenant_credentials_only: true.
        success_msg: "Credential-less setup made no VAST calls and wrote no hub Secret"

# ── Test: credential-less setup refuses when admin-flow leftovers exist ──
# The hub Secret of an earlier admin-credentials run records VAST objects that
# only admin credentials can remove, so setup must fail rather than report
# success. The dispatcher does not swallow setup failures (only teardown_backend
# is included with ignore_errors), so the failure is observed through the
# storage_provider role itself.
- name: "Storage Provider Setup - Tenant-credentials-only setup with leftovers"
  hosts: localhost
  gather_facts: false

  environment:
    VAST_VIP_POOL_SUPERNET: "10.0.0.0/24"
    OSAC_STORAGE_CONFIG_NAMESPACE: "osac-system"

  vars:
    vast_storage_config_namespace: osac-system
    tenant_name: "test-setup-tco-b"
    tenant_namespace: "osac-system"
    tenant_uid: "test-uid-setup-tco-b"
    _tco_b_secret_name: "vast-tenant-config-test-setup-tco-b-be-setup-tco-b"
    storage_provider_tiers:
      - name: default
        protocol: nfs
        provider: vast
        backend_id: be-setup-tco-b
    storage_provider_backend_connections:
      be-setup-tco-b:
        endpoint: "127.0.0.1:18443"
    storage_provider_action: setup
    storage_provider_provisioning_target: vmaas
    vast_storage_validate_certs: false

  tasks:
    - name: Clean slate for tenant-credentials-only setup with leftovers
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ _tco_b_secret_name }}"
            namespace: "osac-system"
            labels:
              app.kubernetes.io/managed-by: osac-aap
              osac.openshift.io/tenant: "test-setup-tco-b"
              osac.openshift.io/storage-provider: vast
              osac.openshift.io/storage-backend-id: be-setup-tco-b
          type: Opaque
          stringData:
            vast_tenant_id: "1"
            vast_local_provider_id: "1"
            vip_pool_name: "osac-test-pool"
            vast_endpoint: "127.0.0.1:18443"
            storage_provider_type: "vast"
            tenant_manager_name: "osac-test-setup-tco-b"
            tenant_manager_id: "7"
            tenant_role_id: "8"
      no_log: true

    - name: Reset mock VMS server for setup with leftovers
      ansible.builtin.uri:
        url: "https://127.0.0.1:18443/_reset"
        validate_certs: false
        method: POST

    - name: Run setup with admin-flow leftovers and no admin credentials
      block:
        - name: Call storage_provider role with setup action
          ansible.builtin.include_role:
            name: osac.service.storage_provider

        - name: Fail test if setup succeeded despite leftovers
          ansible.builtin.fail:
            msg: "Setup must fail when a hub Secret exists and no admin credentials were supplied"

      rescue:
        - name: Get mock server call log after refused setup
          ansible.builtin.uri:
            url: "https://127.0.0.1:18443/_calls"
            validate_certs: false
            method: GET
            return_content: true
          register: _tco_b_calls

        - name: Read hub Secret after refused setup
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Secret
            name: "{{ _tco_b_secret_name }}"
            namespace: "osac-system"
          register: _tco_b_secret

        - name: Assert setup refused, named the Secret, made no VAST calls and kept the Secret
          ansible.builtin.assert:
            that:
              - "'no admin credentials' in (ansible_failed_result.msg | default(''))"
              - "_tco_b_secret_name in (ansible_failed_result.msg | default(''))"
              - _tco_b_calls.json | length == 0
              - _tco_b_secret.resources | length == 1
            fail_msg: >-
              Setup with leftovers must refuse naming the hub Secret, make no VAST calls
              and leave the Secret in place. Message: {{ ansible_failed_result.msg | default('unknown error') }}
            success_msg: "Setup refused to proceed past admin-flow leftovers"

# ── Test: credential-less setup refuses when the hub Secret cannot be read ──
# Pointing the hub Secret lookup at an address nothing listens on leaves its
# result without resources. Setup must treat that as unreadable, not as absent.
- name: "Storage Provider Setup - Tenant-credentials-only setup with unreadable hub secret"
  hosts: localhost
  gather_facts: false

  environment:
    VAST_VIP_POOL_SUPERNET: "10.0.0.0/24"
    OSAC_STORAGE_CONFIG_NAMESPACE: "osac-system"

  vars:
    vast_storage_config_namespace: osac-system
    tenant_name: "test-setup-tco-c"
    tenant_namespace: "osac-system"
    tenant_uid: "test-uid-setup-tco-c"
    storage_provider_tiers:
      - name: default
        protocol: nfs
        provider: vast
        backend_id: be-setup-tco-c
    storage_provider_backend_connections:
      be-setup-tco-c:
        endpoint: "127.0.0.1:18443"
    storage_provider_action: setup
    storage_provider_provisioning_target: vmaas
    vast_storage_validate_certs: false

  tasks:
    - name: Clean slate for tenant-credentials-only setup with unreadable hub secret
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Secret
        name: "vast-tenant-config-test-setup-tco-c-be-setup-tco-c"
        namespace: "osac-system"

    - name: Reset mock VMS server for setup with unreadable hub secret
      ansible.builtin.uri:
        url: "https://127.0.0.1:18443/_reset"
        validate_certs: false
        method: POST

    - name: Run setup with an unreachable hub API
      module_defaults:
        kubernetes.core.k8s_info:
          host: "https://127.0.0.1:9"
          validate_certs: false
      block:
        - name: Call storage_provider role with setup action
          ansible.builtin.include_role:
            name: osac.service.storage_provider

        - name: Fail test if setup succeeded without reading the hub Secret
          ansible.builtin.fail:
            msg: "Setup must fail when the hub Secret cannot be read"

      rescue:
        - name: Get mock server call log after refused setup
          ansible.builtin.uri:
            url: "https://127.0.0.1:18443/_calls"
            validate_certs: false
            method: GET
            return_content: true
          register: _tco_c_calls

        - name: Assert setup refused as unreadable and made no VAST calls
          ansible.builtin.assert:
            that:
              - "'could not read hub secret' in (ansible_failed_result.msg | default('') | lower)"
              - _tco_c_calls.json | length == 0
            fail_msg: >-
              Setup with an unreadable hub Secret must refuse and make no VAST calls.
              Message: {{ ansible_failed_result.msg | default('unknown error') }}
            success_msg: "Setup refused to proceed with an unreadable hub Secret"

# ── Cleanup ──
- name: "Storage Provider Setup - Cleanup"
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Delete hub Secrets
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Secret
        name: "{{ item }}"
        namespace: "osac-system"
      loop:
        - "vast-tenant-config-test-setup-be-test"
        - "vast-tenant-config-test-setup-tco-be-setup-tco"
        - "vast-tenant-config-test-setup-tco-b-be-setup-tco-b"
        - "vast-tenant-config-test-setup-tco-c-be-setup-tco-c"
      failed_when: false
