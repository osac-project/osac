name: Lint

# Carried over as-is from osac-ui's own standalone repo at merge time, only
# relocated (osac-ui/-prefixed paths) and path-scoped so it runs only on
# osac-ui changes -- not yet wired into this repo's own lint tooling or
# required-check conventions. That's a follow-up, not this move.
on:
  pull_request:
    paths:
      - 'osac-ui/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
          package_json_file: osac-ui/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: osac-ui/package.json
          cache: pnpm
          cache-dependency-path: osac-ui/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: osac-ui
        run: pnpm install --frozen-lockfile

      - name: Run lint
        working-directory: osac-ui
        run: pnpm run lint

  lint-proxy:
    name: Lint proxy (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: osac-ui/proxy/go.mod
          cache: false

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: osac-ui/proxy
