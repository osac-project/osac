# Bundled-postgres scenario: validates that the osac chart renders correctly
# when bundled PostgreSQL is deployed by osac-infra (this values file tests the
# osac chart in isolation -- bundledPostgres has moved to osac-infra).

ui:
  enabled: true
  api:
    fulfillment:
      certs:
        caBundle:
          configMap: ca-bundle
  auth:
    certs:
      caBundle:
        configMap: ca-bundle

service:
  externalHostname: fulfillment-api.example.com
  internalHostname: fulfillment-internal-api.example.com
  auth:
    issuerUrl: https://keycloak.example.com/realms/osac
    controllerCredentials:
    - secret:
        name: fulfillment-controller-credentials
        items:
        - key: client-id
          param: client-id
  idp:
    url: https://keycloak.example.com
    credentials:
    - secret:
        name: fulfillment-controller-credentials
        items:
        - key: client-id
          param: client-id
  database:
    connection:
    - secret:
        name: osac-db-config
        items:
        - key: url
          param: url
    - secret:
        name: osac-db-client-cert
        items:
        - key: tls.crt
          param: sslcert
        - key: tls.key
          param: sslkey
        - key: ca.crt
          param: sslrootcert
