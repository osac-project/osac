{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.osacNamespace }}
  labels:
    {{- include "osac-infra.labels" . | nindent 4 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: osac-ui-backend-credentials
  namespace: {{ .Values.osacNamespace }}
  labels:
    {{- include "osac-infra.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-id: osac-ui-backend
  client-secret: pending
{{- end }}
