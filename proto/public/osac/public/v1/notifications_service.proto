syntax = "proto3";

package osac.public.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "osac/public/v1/notification_type.proto";

message NotificationsListRequest {
  // Zero-based index of the first result.
  optional int32 offset = 1;

  // Maximum number of results.
  optional int32 limit = 2;

  // CEL expression selecting which notifications to return.
  optional string filter = 3;

  // Ordering of results.
  optional string order = 4;
}

message NotificationsListResponse {
  // Number of items returned.
  int32 size = 1;

  // Total matching items regardless of limit.
  int32 total = 2;

  // Result items.
  repeated Notification items = 3;
}

message NotificationsGetRequest {
  string id = 1;
}

message NotificationsGetResponse {
  Notification object = 1;
}

message NotificationsCreateRequest {
  Notification object = 1 [(buf.validate.field).required = true];
}

message NotificationsCreateResponse {
  Notification object = 1;
}

message NotificationsUpdateRequest {
  Notification object = 1;
  google.protobuf.FieldMask update_mask = 2;

  // Reject the update with ABORTED when metadata.version does not match the stored version.
  bool lock = 3;
}

message NotificationsUpdateResponse {
  Notification object = 1;
}

message NotificationsDeleteRequest {
  string id = 1;
}

message NotificationsDeleteResponse {}

// Manages durable inbox notifications and announcements.
service Notifications {
  // Lists notifications visible to the caller.
  rpc List(NotificationsListRequest) returns (NotificationsListResponse) {
    option (google.api.http) = {get: "/api/fulfillment/v1/notifications"};
  }

  // Retrieves one notification by id.
  rpc Get(NotificationsGetRequest) returns (NotificationsGetResponse) {
    option (google.api.http) = {
      get: "/api/fulfillment/v1/notifications/{id}"
      response_body: "object"
    };
  }

  // Creates a notification. Public callers create announcements; controllers create inbox rows.
  rpc Create(NotificationsCreateRequest) returns (NotificationsCreateResponse) {
    option (google.api.http) = {
      post: "/api/fulfillment/v1/notifications"
      body: "object"
      response_body: "object"
    };
  }

  // Updates an event-driven inbox item. Only spec.state is mutable.
  rpc Update(NotificationsUpdateRequest) returns (NotificationsUpdateResponse) {
    option (google.api.http) = {
      patch: "/api/fulfillment/v1/notifications/{object.id}"
      body: "object"
      response_body: "object"
    };
  }

  // Deletes the caller's inbox item or an announcement per role rules.
  rpc Delete(NotificationsDeleteRequest) returns (NotificationsDeleteResponse) {
    option (google.api.http) = {delete: "/api/fulfillment/v1/notifications/{id}"};
  }
}
