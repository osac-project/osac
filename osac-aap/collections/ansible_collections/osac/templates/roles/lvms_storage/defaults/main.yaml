---
# Hub Secret prefix for per-tenant lifecycle markers.
lvms_storage_tenant_config_secret_prefix: "lvms-tenant-config-"

# Namespace for hub-cluster config Secrets. Resolution order:
#   1. OSAC_STORAGE_CONFIG_NAMESPACE env var (explicit override).
#   2. Pod's own namespace via downward API (always available in-cluster).
# No hardcoded fallback — fail loudly if neither source is available
# rather than silently targeting a wrong namespace.
lvms_storage_config_namespace: >-
  {{ lookup('env', 'OSAC_STORAGE_CONFIG_NAMESPACE')
     | default(lookup('file', '/var/run/secrets/kubernetes.io/serviceaccount/namespace', errors='ignore'), true) }}

# topolvm StorageClass provisioner name.
lvms_storage_provisioner: "topolvm.io"

# Tenant StorageClass name prefix. A run ID (shared-infrastructure E2E:
# several runs share the outer cluster and use the same tenant names) sits
# between "osac-" and the tenant so two runs never map one StorageClass
# name; without one the prefix is today's "osac-".
lvms_storage_storage_class_prefix: >-
  {{ 'osac-' ~ osac_instance_id ~ '-' if osac_instance_id | default('') else 'osac-' }}

# Extra label selectors scoping tenant StorageClass lookups to this run, so
# one run's tenant teardown never deletes another run's classes with the
# same tenant name in the shared outer cluster. Empty without a run ID.
lvms_storage_instance_selectors: >-
  {{ ['osac.openshift.io/instance=' ~ osac_instance_id]
     if osac_instance_id | default('') else [] }}

# LVMCluster device class name created by osac-installer's configure-lvms.sh hook.
lvms_storage_device_class: "vg1"

# OLM subscription channel for LVMS operator — used when installing LVMS on CaaS
# guest clusters. When empty (default), the role queries the lvms-operator
# PackageManifest on the guest cluster and uses its defaultChannel, which OLM
# sets automatically for the running OCP version. Set explicitly via extra_vars
# or the storage-operations-ig ConfigMap to pin a specific channel (e.g.
# "stable-4.18") and override auto-detection.
lvms_storage_operator_channel: ""

# Namespace where the LVMS operator is installed via OLM.
lvms_storage_operator_namespace: "openshift-storage"

# OLM CatalogSource for LVMS operator. Override for disconnected clusters that
# mirror operators to a custom catalog.
lvms_storage_operator_catalog_source: "redhat-operators"
lvms_storage_operator_catalog_namespace: "openshift-marketplace"

# Block device path to bind to the LVMCluster deviceSelector on CaaS guest clusters
# (e.g. /dev/vdb for the worker's attached data disk).
# Empty (default): LVMS auto-discovers all eligible block devices.
lvms_storage_data_device: ""
