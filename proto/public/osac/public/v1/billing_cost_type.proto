syntax = "proto3";

package osac.public.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// BillingCost is an aggregated, provider-calculated cost for one OSAC service,
// project, and resource over the requested period.
// buf:lint:ignore OSAC_OBJECT_SHAPE
message BillingCost {
  // OSAC project name. A present empty value identifies the tenant's default project;
  // an absent value means the provider did not supply project attribution.
  optional string project_id = 1;
  // OSAC resource identifier. Absent when the provider cannot attribute the cost to a resource.
  optional string resource_id = 2;
  // OSAC service name, such as "compute_instance" or "cluster".
  string service = 3 [(buf.validate.field).string = {min_len: 1}];
  // Total amount returned by the provider for this grouping and period.
  string amount = 4 [(buf.validate.field).string = {min_len: 1}];
  string currency_code = 5 [(buf.validate.field).string = {len: 3}];
  string period_start = 6;
  string period_end = 7;
  // Time OSAC successfully fetched this cost result from the provider.
  google.protobuf.Timestamp as_of = 8;
}
