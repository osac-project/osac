---
name: cudn-net
title: CUDN Network Implementation
description: >
  Provisions networking resources using ClusterUserDefinedNetwork (CUDN) on OpenShift.
  Handles both VirtualNetwork (logical grouping) and Subnet (CUDN + Namespace creation).

template_type: network

# NetworkClass registration fields
implementation_strategy: cudn_net
fabric_manager: cudn_net
k8s_manager: cudn_localnet
is_default: true
capabilities:
  supports_ipv4: true
  supports_ipv6: true
  supports_dual_stack: true
defaults:
  virtual_network_ipv4_cidr: "10.200.0.0/16"
  subnet_ipv4_cidr: "10.200.0.0/20"
  enable_nat_gateway: false
  egress_rules:
    - protocol: PROTOCOL_ALL
      ipv4_cidr: "0.0.0.0/0"
