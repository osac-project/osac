---
# ONTAP setup: validate each dispatched backend's inputs, in Shared-TBC mode
# (provider_config.profiles) or Dedicated-SVM mode (endpoint +
# tenant_preparation.provider_config), and output
# storage_provider_tenant_config. Makes no cluster or ONTAP calls: only the
# target cluster, where Trident runs, reaches the ONTAP management LIF.

- name: Validate ONTAP settings
  ansible.builtin.include_tasks: _validate_settings.yaml

- name: Compute the dispatched backend ids
  ansible.builtin.set_fact:
    _netapp_backend_ids: "{{ _provider_tiers | map(attribute='backend_id') | unique(case_sensitive=true) | list }}"
  no_log: true

- name: Fail if no connection details were provided for a dispatched backend
  ansible.builtin.fail:
    msg: >-
      No entry for a dispatched backend_id in storage_backend_connections.
      osac-operator must resolve and pass connection details (endpoint and
      tenant_preparation, or provider_config.profiles) for every backend_id
      referenced by storage_tier_definitions.
  when: >-
    (_netapp_backend_ids | difference((_provider_backend_connections | default({}, true)).keys() | list) | length) > 0
  no_log: true

- name: Initialize the per-backend tenant config accumulator
  ansible.builtin.set_fact:
    _netapp_tenant_configs: {}
  no_log: true

- name: Validate the prepared SVM assignment for each dispatched backend
  ansible.builtin.include_tasks: _setup_backend.yaml
  loop: "{{ _netapp_backend_ids }}"
  loop_control:
    loop_var: _netapp_backend_id
    label: "netapp-backend"

- name: Set tenant config output fact
  ansible.builtin.set_fact:
    storage_provider_tenant_config: "{{ _netapp_tenant_configs }}"
  no_log: true
