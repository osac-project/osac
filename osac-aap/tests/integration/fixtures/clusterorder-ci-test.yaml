---
apiVersion: osac.openshift.io/v1alpha1
kind: ClusterOrder
metadata:
  name: test-cluster
  namespace: osac-system
spec:
  templateID: osac.templates.ocp_ci_small
  templateParameters: |
    {
      "pull_secret": "test-pull-secret-content"
    }
  nodeRequests:
    - nodeSet: workers
      numberOfNodes: 1
      bareMetal:
        instanceType: ci-worker
