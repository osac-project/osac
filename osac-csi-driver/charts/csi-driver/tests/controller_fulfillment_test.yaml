suite: controller fulfillment args
templates:
  - templates/controller-deployment.yaml
tests:
  - it: should not include fulfillment args when endpoint is empty
    set:
      controller.fulfillment.endpoint: ""
    asserts:
      - isKind:
          of: Deployment
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "--fulfillment-endpoint="
        any: true
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "--fulfillment-client-id=$(FULFILLMENT_CLIENT_ID)"
        any: true
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--allow-stub"

  - it: should include fulfillment args when endpoint is set
    set:
      controller.fulfillment.endpoint: "fulfillment-api.osac.svc:8000"
      controller.fulfillment.issuerUrl: "https://keycloak.example.com/realms/myrealm"
      controller.fulfillment.credentials.secretName: "osac-csi-credentials"
      controller.fulfillment.credentials.clientIdKey: "client-id"
      controller.fulfillment.credentials.clientSecretKey: "client-secret"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--fulfillment-endpoint=fulfillment-api.osac.svc:8000"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--fulfillment-client-id=$(FULFILLMENT_CLIENT_ID)"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--fulfillment-client-secret-file=/etc/osac-csi/credentials/client-secret"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--fulfillment-issuer-url=https://keycloak.example.com/realms/myrealm"

  - it: should read fulfillment endpoint and issuer from a ConfigMap
    set:
      namespace: osac-csi
      controller.fulfillment.configMap.name: osac-fulfillment-config
      controller.fulfillment.credentials.secretName: osac-csi-driver-credentials
      controller.fulfillment.allowStub: false
    asserts:
      - equal:
          path: metadata.namespace
          value: osac-csi
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--fulfillment-endpoint=$(OSAC_FULFILLMENT_ENDPOINT)"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--fulfillment-issuer-url=$(OSAC_FULFILLMENT_ISSUER_URL)"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OSAC_FULFILLMENT_ENDPOINT
            valueFrom:
              configMapKeyRef:
                name: osac-fulfillment-config
                key: OSAC_FULFILLMENT_ENDPOINT
                optional: false
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OSAC_FULFILLMENT_ISSUER_URL
            valueFrom:
              configMapKeyRef:
                name: osac-fulfillment-config
                key: OSAC_FULFILLMENT_ISSUER_URL
                optional: false

  - it: should reject endpoint without issuerUrl
    set:
      controller.fulfillment.endpoint: "fulfillment-api.osac.svc:8000"
      controller.fulfillment.credentials.secretName: ""
    asserts:
      - failedTemplate:
          errorMessage: "controller.fulfillment.endpoint and issuerUrl must be provided together"

  - it: should include grpc-insecure flag when insecureSkipVerify is true
    set:
      controller.fulfillment.endpoint: "fulfillment-api.osac.svc:8000"
      controller.fulfillment.issuerUrl: "https://keycloak.example.com/realms/myrealm"
      controller.fulfillment.credentials.secretName: "osac-csi-credentials"
      controller.fulfillment.tls.insecureSkipVerify: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--grpc-insecure"

  - it: should not include grpc-insecure flag when insecureSkipVerify is false
    set:
      controller.fulfillment.endpoint: "fulfillment-api.osac.svc:8000"
      controller.fulfillment.issuerUrl: "https://keycloak.example.com/realms/myrealm"
      controller.fulfillment.credentials.secretName: "osac-csi-credentials"
      controller.fulfillment.tls.insecureSkipVerify: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "--grpc-insecure"

  - it: should mount credentials volume when endpoint and secretName are set
    set:
      controller.fulfillment.endpoint: "fulfillment-api.osac.svc:8000"
      controller.fulfillment.issuerUrl: "https://keycloak.example.com/realms/myrealm"
      controller.fulfillment.credentials.secretName: "osac-csi-credentials"
      controller.fulfillment.credentials.clientSecretKey: "client-secret"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: fulfillment-credentials
            mountPath: /etc/osac-csi/credentials
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: fulfillment-credentials
            secret:
              secretName: osac-csi-credentials
              items:
                - key: client-secret
                  path: client-secret

  - it: should reject credentials without fulfillment configuration
    set:
      controller.fulfillment.endpoint: ""
      controller.fulfillment.credentials.secretName: "osac-csi-credentials"
    asserts:
      - failedTemplate:
          errorMessage: "controller.fulfillment.credentials.secretName requires fulfillment configuration"

  - it: should set FULFILLMENT_CLIENT_ID env var from secret
    set:
      controller.fulfillment.endpoint: "fulfillment-api.osac.svc:8000"
      controller.fulfillment.issuerUrl: "https://keycloak.example.com/realms/myrealm"
      controller.fulfillment.credentials.secretName: "osac-csi-credentials"
      controller.fulfillment.credentials.clientIdKey: "client-id"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FULFILLMENT_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: osac-csi-credentials
                key: client-id
