{{- if dig "observability" "enabled" false (.Values.global | default dict) }}
{{- $ns := include "osac-observability.namespace" . -}}
{{- $name := "osac-observability-admin-credentials" -}}
{{- /* The service account is a normal resource and the grant is a hook. Helm
       applies an upgrade's normal resources only after its pre-upgrade hooks,
       so a permission the job newly needs would be missing on the first
       upgrade that introduces it, and backoffLimit 0 would fail the release.
       The grant covers exactly the trust bundle the job copies. */ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "osac-observability.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "osac-observability.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    # Below the Job's weight 30, so the grant exists when the Job starts.
    "helm.sh/hook-weight": "28"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  # A create request carries no resource name, so resourceNames can never match
  # it: the create verb needs its own unnarrowed rule, or a fresh install cannot
  # create the ConfigMap at all. The grant is namespace-scoped.
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - create
  # Every other verb is limited to the one ConfigMap.
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - keycloak-ca-bundle
    verbs:
      - get
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "osac-observability.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    # With the Role, below the Job.
    "helm.sh/hook-weight": "28"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $ns }}
{{- end }}
