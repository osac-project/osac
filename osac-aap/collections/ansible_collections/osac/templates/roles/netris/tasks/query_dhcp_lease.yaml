---
# The DHCP lease of the interface MAC of a physical NetworkAttachment: the one
# host of the IPAM subnet osac-sn-<Subnet ID> (this tenant and VPC) whose MAC
# matches. Read-only. No lease yet, or several matches, is retryable. The
# result's mac_address is the input MAC as it came.
- name: Query the DHCP lease on Netris
  block:
    - name: Check the interface of the attachment
      ansible.builtin.set_fact:
        _netris_att: "{{ osac_job_vars | osac.templates.netris_attachment_plan }}"

    - name: Stop on an invalid attachment input
      vars:
        netris_fail:
          message: "{{ _netris_att.error if _netris_att.error | length > 0 else 'Netris invalid task input: query_dhcp_lease needs a physical interface' }}"
          retryable: false
      when: _netris_att.kind != 'physical'
      ansible.builtin.include_tasks: _fail.yaml

    - name: Check the settings
      ansible.builtin.include_tasks: _settings.yaml
      vars:
        netris_require: [controller, credentials, tenant]

    - name: Check the task input
      ansible.builtin.include_tasks: _input.yaml
      vars:
        netris_require_parents: [virtual_network, subnet]

    - name: Check the network type
      ansible.builtin.include_tasks: _network_type.yaml

    - name: Build the object names
      ansible.builtin.include_tasks: _names.yaml

    - name: Look up the VPC of the VirtualNetwork
      ansible.builtin.include_role:
        name: netris.controller.vpc
        tasks_from: read
      vars:
        vpc_name: "{{ netris_names.vpc }}"
        vpc_tenant_id: "{{ netris_tenant_id | int }}"

    - name: Wait for the VPC of the VirtualNetwork
      vars:
        netris_fail:
          message: "Netris VPC {{ netris_names.vpc }} does not exist yet. OSAC retries the task."
          retryable: true
      when: netris_vpc is not mapping
      ansible.builtin.include_tasks: _fail.yaml

    - name: List the IPAM subnets
      ansible.builtin.include_role:
        name: netris.controller.ipam
        tasks_from: read_subnets

    - name: Pick the IPAM subnet of this tenant and VPC
      ansible.builtin.set_fact:
        _netris_ipam_pick: "{{ netris_ipam_subnets | osac.templates.netris_owned_pick(netris_names.subnet_ipam, netris_vpc.id, netris_tenant_id) }}"

    - name: Stop on an IPAM subnet that is not ours or is ambiguous
      vars:
        netris_fail:
          message: >-
            Netris IPAM subnet {{ netris_names.subnet_ipam }}:
            {{ _netris_ipam_pick.error if _netris_ipam_pick.error | length > 0 else 'its VPC or tenant is not reported; refusing to use it' }}.
            OSAC does not retry.
          retryable: false
      when: _netris_ipam_pick.error | length > 0 or _netris_ipam_pick.unverified
      ansible.builtin.include_tasks: _fail.yaml

    - name: Wait for the IPAM subnet
      vars:
        netris_fail:
          message: "Netris IPAM subnet {{ netris_names.subnet_ipam }} does not exist yet. OSAC retries the task."
          retryable: true
      when: _netris_ipam_pick.id | string | length == 0
      ansible.builtin.include_tasks: _fail.yaml

    - name: Read the hosts of the IPAM subnet
      ansible.builtin.include_role:
        name: netris.controller.ipam
        tasks_from: read_hosts
      vars:
        ipam_subnet_id: "{{ _netris_ipam_pick.id }}"

    - name: Find the host with the interface MAC
      ansible.builtin.set_fact:
        _netris_lease: "{{ netris_ipam_hosts | osac.templates.netris_dhcp_lease(_netris_att.mac) }}"

    - name: Wait for the lease
      vars:
        netris_fail:
          message: "Netris has {{ _netris_lease.error }} in {{ netris_names.subnet_ipam }}. OSAC retries the task."
          retryable: true
      when: _netris_lease.error | length > 0
      ansible.builtin.include_tasks: _fail.yaml

    - name: Return the lease to OSAC
      ansible.builtin.include_tasks: _publish.yaml
      vars:
        netris_result:
          dhcp_lease:
            ip_address: "{{ _netris_lease.ip_address }}"
            mac_address: "{{ osac_job_vars.network_attachment.interface.mac_address }}"
  rescue:
    - name: Report the error
      ansible.builtin.include_tasks: _rescue.yaml
