# ── Native CSI action: provider selection, install, and idempotency ──
- name: "Native CSI Driver Ensure - Setup (clean slate)"
  hosts: localhost
  gather_facts: true

  tasks:
    - name: Create provider Subscription namespaces
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ item }}"
      loop:
        - trident-operator
        - vast-csi-system

    - name: Delete provider Subscription fixtures
      kubernetes.core.k8s:
        state: absent
        api_version: operators.coreos.com/v1alpha1
        kind: Subscription
        name: "{{ item.name }}"
        namespace: "{{ item.namespace }}"
      loop:
        - {name: trident-operator, namespace: trident-operator}
        - {name: vast-csi-operator, namespace: vast-csi-system}
      failed_when: false

    - name: Delete provider CSIDriver fixtures
      kubernetes.core.k8s:
        state: absent
        api_version: storage.k8s.io/v1
        kind: CSIDriver
        name: "{{ item }}"
      loop:
        - csi.trident.netapp.io
        - csi.vastdata.com
        - block.csi.vastdata.com
      failed_when: false

    - name: Delete TridentBackendConfig CRD fixture
      kubernetes.core.k8s:
        state: absent
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: tridentbackendconfigs.trident.netapp.io
        wait: true
      failed_when: false

    - name: Delete Trident operand namespace fixture
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Namespace
        name: trident
        wait: true
      failed_when: false

    - name: Clear override log
      ansible.builtin.file:
        path: /tmp/osac_test_overrides.log
        state: absent

    - name: Create empty override log
      ansible.builtin.file:
        path: /tmp/osac_test_overrides.log
        state: touch
        mode: "0600"

    - name: Set provider action inputs for NetApp, VAST, LVMS, and OSAC CSI tiers
      ansible.builtin.set_fact:
        _native_csi_test_tiers:
          - name: fast-block
            protocol: block
            provider: netapp
            backend_id: be-netapp
          - name: legacy-nfs
            protocol: nfs
            provider: vast
            backend_id: be-vast
          - name: shared-block
            protocol: block
            provider: vast
            backend_id: be-vast
          - name: local
            protocol: block
            provider: lvms
          - name: osac-csi-block
            protocol: block
            provider: osac-csi
        _native_csi_test_target_kubeconfig: >-
          {{ lookup('env', 'KUBECONFIG') | default(lookup('env', 'HOME') + '/.kube/config', true) }}
        storage_provider_netapp_trident_install_override:
          name: osac.test_overrides.csi_driver_install_hooks
          tasks_from: install.yaml
        vast_storage_csi_operator_install_override:
          name: osac.test_overrides.csi_driver_install_hooks
          tasks_from: install.yaml

- name: "Native CSI Driver Ensure - Install missing NetApp and VAST drivers"
  hosts: localhost
  gather_facts: false

  vars:
    tenant_name: test-native-csi
    tenant_namespace: osac-system

  tasks:
    - name: Ensure native drivers from resolved provider tiers
      ansible.builtin.include_role:
        name: osac.service.storage_provider
      vars:
        storage_provider_action: ensure_csi_driver
        storage_provider_tiers: "{{ _native_csi_test_tiers }}"
        storage_provider_target_kubeconfig: "{{ _native_csi_test_target_kubeconfig }}"
        storage_provider_target_kubeconfig_insecure: false

    - name: Read native CSI driver installation lease after ensure
      kubernetes.core.k8s_info:
        api_version: coordination.k8s.io/v1
        kind: Lease
        name: provider-native-csi-install-lock
        namespace: "{{ lookup('env', 'POD_NAMESPACE') }}"
      register: _native_csi_install_lease

    - name: Assert native CSI driver installation lease was released
      ansible.builtin.assert:
        that:
          - _native_csi_install_lease.resources | length == 0
        fail_msg: "Native CSI driver installation left its cluster-wide Lease behind"
        success_msg: "Native CSI driver installation Lease was released"

- name: "Native CSI Driver Ensure - Verify install and readiness"
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Read Trident installer override log
      ansible.builtin.slurp:
        path: /tmp/osac_test_overrides.log
      register: _native_csi_install_log_content

    - name: Parse Trident installer override log
      ansible.builtin.set_fact:
        _native_csi_install_log: "{{ _native_csi_install_log_content.content | b64decode }}"

    - name: Assert NetApp and VAST selected their stable Manual OLM subscriptions
      ansible.builtin.assert:
        that:
          - "'native_csi_driver_install' in _native_csi_install_log"
          - "'drivers=[\"csi.trident.netapp.io\"]' in _native_csi_install_log"
          - "'package=trident-operator' in _native_csi_install_log"
          - "'channel=stable' in _native_csi_install_log"
          - "'install-plan-approval=Manual' in _native_csi_install_log"
          - "'providers=[\"netapp\"]' in _native_csi_install_log"
          - "'drivers=[\"block.csi.vastdata.com\", \"csi.vastdata.com\"]' in _native_csi_install_log"
          - "'package=vast-csi-operator' in _native_csi_install_log"
        fail_msg: "Native provider installers did not use the stable Manual OLM policy: {{ _native_csi_install_log }}"
        success_msg: "Native provider installers selected the latest stable bundle with Manual initial approval"

    - name: Read Trident CSIDriver registration
      kubernetes.core.k8s_info:
        api_version: storage.k8s.io/v1
        kind: CSIDriver
        name: csi.trident.netapp.io
      register: _native_csi_trident_driver

    - name: Read the Trident AllNamespaces OperatorGroup
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1
        kind: OperatorGroup
        name: trident-operator-group
        namespace: trident-operator
      register: _native_csi_trident_operator_group

    - name: Assert Trident uses an isolated AllNamespaces OperatorGroup
      ansible.builtin.assert:
        that:
          - _native_csi_trident_operator_group.resources | length == 1
          - _native_csi_trident_operator_group.resources[0].spec.targetNamespaces | default([]) | length == 0
          - _native_csi_trident_operator_group.resources[0].spec.selector | default({}) | length == 0
        fail_msg: "Trident must use an AllNamespaces OperatorGroup in its dedicated namespace"
        success_msg: "Trident uses an isolated AllNamespaces OperatorGroup"

    - name: Read Trident operand namespace
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
        name: trident
      register: _native_csi_trident_namespace

    - name: Assert the driver ensure action created the Trident operand namespace
      ansible.builtin.assert:
        that:
          - _native_csi_trident_namespace.resources | length == 1
        fail_msg: "The Trident operand namespace was not created before installation"
        success_msg: "The Trident operand namespace exists"

    - name: Assert Trident registered its CSI driver
      ansible.builtin.assert:
        that:
          - _native_csi_trident_driver.resources | length == 1
        fail_msg: "The native Trident install override did not register csi.trident.netapp.io"
        success_msg: "Trident CSIDriver is registered"

    - name: Read TridentBackendConfig CRD
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: tridentbackendconfigs.trident.netapp.io
      register: _native_csi_tbc_crd

    - name: Assert TridentBackendConfig API is ready for the following provider action
      ansible.builtin.assert:
        that:
          - _native_csi_tbc_crd.resources | length == 1
        fail_msg: "The TridentBackendConfig API was not made available by driver installation"
        success_msg: "TridentBackendConfig CRD is available"

    - name: Read VAST NFS CSIDriver registration
      kubernetes.core.k8s_info:
        api_version: storage.k8s.io/v1
        kind: CSIDriver
        name: csi.vastdata.com
      register: _native_csi_vast_nfs_driver

    - name: Read VAST block CSIDriver registration
      kubernetes.core.k8s_info:
        api_version: storage.k8s.io/v1
        kind: CSIDriver
        name: block.csi.vastdata.com
      register: _native_csi_vast_block_driver

    - name: Assert VAST registered both required protocols
      ansible.builtin.assert:
        that:
          - _native_csi_vast_nfs_driver.resources | length == 1
          - _native_csi_vast_block_driver.resources | length == 1
        fail_msg: "VAST did not register both required CSI protocols"
        success_msg: "VAST NFS and block drivers are registered"

    - name: Read Trident controller Deployment
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: trident-controller
        namespace: trident
      register: _native_csi_trident_controller

    - name: Read Trident node DaemonSet
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: DaemonSet
        name: trident-node-linux
        namespace: trident
      register: _native_csi_trident_node

    - name: Assert Trident controller and node workloads are ready
      ansible.builtin.assert:
        that:
          - _native_csi_trident_controller.resources | length == 1
          - _native_csi_trident_controller.resources[0].status.availableReplicas | default(0) | int > 0
          - _native_csi_trident_node.resources | length == 1
          - _native_csi_trident_node.resources[0].status.desiredNumberScheduled | default(0) | int > 0
          - >-
            (_native_csi_trident_node.resources[0].status.numberReady | default(0) | int)
            >=
            (_native_csi_trident_node.resources[0].status.desiredNumberScheduled | default(0) | int)
        fail_msg: "Trident controller or node workload is not ready"
        success_msg: "Trident controller and node workloads are ready"

- name: "Native CSI Driver Ensure - Verify existing driver skips installation"
  hosts: localhost
  gather_facts: false

  vars:
    tenant_name: test-native-csi
    tenant_namespace: osac-system

  tasks:
    - name: Clear override log before the idempotent rerun
      ansible.builtin.file:
        path: /tmp/osac_test_overrides.log
        state: absent

    - name: Create empty override log for the idempotent rerun
      ansible.builtin.file:
        path: /tmp/osac_test_overrides.log
        state: touch
        mode: "0600"

    - name: Re-run driver ensure with Trident already present
      ansible.builtin.include_role:
        name: osac.service.storage_provider
      vars:
        storage_provider_action: ensure_csi_driver
        storage_provider_tiers: "{{ _native_csi_test_tiers }}"
        storage_provider_target_kubeconfig: "{{ _native_csi_test_target_kubeconfig }}"
        storage_provider_target_kubeconfig_insecure: false

    - name: Read installer log after the idempotent rerun
      ansible.builtin.slurp:
        path: /tmp/osac_test_overrides.log
      register: _native_csi_rerun_log_content

    - name: Assert the existing Trident driver skips installation
      ansible.builtin.assert:
        that:
          - "'native_csi_driver_install' not in (_native_csi_rerun_log_content.content | b64decode)"
        fail_msg: "The native Trident installer ran even though the CSIDriver already exists"
        success_msg: "The existing Trident CSIDriver skipped installation"

- name: "Native CSI Driver Ensure - Skip unsupported providers and reject NetApp NFS"
  hosts: localhost
  gather_facts: false

  vars:
    tenant_name: test-native-csi
    tenant_namespace: osac-system

  tasks:
    - name: Skip provider without a native CSI handler
      ansible.builtin.include_role:
        name: osac.service.storage_provider
      vars:
        storage_provider_action: ensure_csi_driver
        storage_provider_tiers:
          - name: unsupported
            protocol: block
            provider: pure

    - name: Assert provider without a native CSI handler was skipped
      ansible.builtin.assert:
        that:
          - _native_csi_driver_unknown_providers == ['pure']

    - name: Reject native CSI setup without a target kubeconfig
      block:
        - name: Call driver ensure for NetApp without a target kubeconfig
          ansible.builtin.include_role:
            name: osac.service.storage_provider
          vars:
            storage_provider_action: ensure_csi_driver
            storage_provider_tiers:
              - name: fast-block
                protocol: block
                provider: netapp

        - name: Fail if native CSI setup used the ambient kubeconfig
          ansible.builtin.fail:
            msg: "The native CSI ensure action accepted a missing target kubeconfig"
      rescue:
        - name: Assert missing target kubeconfig was rejected before cluster access
          ansible.builtin.assert:
            that:
              - >-
                'storage_provider_target_kubeconfig is required' in
                (ansible_failed_result.msg | default(''))
            fail_msg: >-
              Native CSI setup failed for an unexpected reason:
              {{ ansible_failed_result.msg | default('unknown error') }}
            success_msg: "Native CSI setup rejected a missing target kubeconfig before API access"

    - name: Reject NetApp NFS
      block:
        - name: Call driver ensure for a NetApp NFS tier
          ansible.builtin.include_role:
            name: osac.service.storage_provider
          vars:
            storage_provider_action: ensure_csi_driver
            storage_provider_tiers:
              - name: nfs
                protocol: nfs
                provider: netapp

        - name: Fail if NetApp NFS was accepted
          ansible.builtin.fail:
            msg: "The driver ensure action accepted NetApp NFS"
      rescue:
        - name: Assert NetApp NFS failure is actionable
          ansible.builtin.assert:
            that:
              - >-
                'NetApp native CSI setup supports protocol' in
                (ansible_failed_result.results | default([]) | selectattr('msg', 'defined') | map(attribute='msg') | join(' | '))
            fail_msg: >-
              Role failed but with unexpected message:
              {{ ansible_failed_result.results | default(ansible_failed_result.msg) | default('unknown') }}

