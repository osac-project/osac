# CUDN EVPN/Netris VMaaS E2E profile -- infrastructure values for osac-deps
# and osac-infra charts.
#
# The installer configures the OpenShift side of EVPN when evpn.enabled is set
# in a private infra values file. Fabric links, switch ASN configuration, and
# other Netris-side settings remain external and are site-specific.

# --- OLM Subscriptions (osac-deps) ---
certManager:
  enabled: true
trustManager:
  enabled: true
aapOperator:
  enabled: true
lvms:
  enabled: true
metallb:
  enabled: true
cnv:
  enabled: true
evpn:
  enabled: false
mce:
  enabled: false

# --- Infrastructure (osac-infra) ---
caIssuer:
  enabled: true
keycloak:
  enabled: true
  devFixtures:
    enabled: true
kafka:
  enabled: true

# --- Bundled PostgreSQL ---
# Bundled PostgreSQL for testing only; not intended for production.
bundledPostgres:
  enabled: true
  database:
    name: service

# --- Bundled OpenBao ---
# Bundled OpenBao for testing and CI. Not for production.
bundledVault:
  enabled: true
  keycloakIssuerUrl: "https://keycloak.example.com/realms/osac"
  podSecurityContext:
    runAsNonRoot: true
