syntax = "proto3";

package osac.public.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "osac/public/v1/baremetal_instance_type.proto";
import "osac/public/v1/cluster_type.proto";
import "osac/public/v1/compute_instance_type.proto";
import "osac/public/v1/external_ip_type.proto";
import "osac/public/v1/metadata_type.proto";
import "osac/public/v1/subnet_type.proto";
import "osac/public/v1/virtual_network_type.proto";

// Kind of notification content.
enum NotificationKind {
  // The kind is unspecified.
  NOTIFICATION_KIND_UNSPECIFIED = 0;

  // An event-driven inbox notification.
  NOTIFICATION_KIND_EVENT = 1;

  // An announcement banner.
  NOTIFICATION_KIND_ANNOUNCEMENT = 2;
}

// Severity of a notification.
enum NotificationSeverity {
  // The severity is unspecified.
  NOTIFICATION_SEVERITY_UNSPECIFIED = 0;

  // Informational; no action required. Example: a compute instance became ready.
  NOTIFICATION_SEVERITY_INFO = 1;

  // Needs attention soon. Example: quota usage crossed a warning threshold.
  NOTIFICATION_SEVERITY_WARNING = 2;

  // Urgent. Example: provisioning failed or a quota hard limit was hit.
  NOTIFICATION_SEVERITY_CRITICAL = 3;
}

// Audience scope for an announcement.
enum NotificationScope {
  // The scope is unspecified.
  NOTIFICATION_SCOPE_UNSPECIFIED = 0;

  // An announcement for one tenant.
  NOTIFICATION_SCOPE_TENANT = 1;

  // An announcement for the whole platform.
  NOTIFICATION_SCOPE_PLATFORM = 2;
}

// Read state of an inbox notification.
enum NotificationState {
  // The state is unknown.
  NOTIFICATION_STATE_UNSPECIFIED = 0;

  // The inbox item is unread.
  NOTIFICATION_STATE_UNREAD = 1;

  // The inbox item is read.
  NOTIFICATION_STATE_READ = 2;
}

// Optional reference to a related API object (for deep links and visibility).
// Uses full (non-local) references because Notifications are tenant-scoped, not
// project-scoped, and may point at objects in any project within the tenant.
message NotificationObjectReference {
  oneof object {
    // Related cluster.
    ClusterReference cluster = 1;

    // Related compute instance.
    ComputeInstanceReference compute_instance = 2;

    // Related bare metal instance.
    BareMetalInstanceReference bare_metal_instance = 3;

    // Related subnet.
    SubnetReference subnet = 4;

    // Related virtual network.
    VirtualNetworkReference virtual_network = 5;

    // Related external IP.
    ExternalIPReference external_ip = 6;
  }
}

// Desired configuration for a Notification.
message NotificationSpec {
  // EVENT for a per-user inbox item, or ANNOUNCEMENT for a tenant/platform banner.
  NotificationKind kind = 1 [
    (google.api.field_behavior) = IMMUTABLE,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  // How urgent the notice is for the user (INFO, WARNING, or CRITICAL).
  NotificationSeverity severity = 2 [
    (google.api.field_behavior) = IMMUTABLE,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  // Type string in the form osac.notification.<kind>.<name>.
  string type = 3 [
    (google.api.field_behavior) = IMMUTABLE,
    (buf.validate.field).string = {
      pattern: "^osac\\.notification\\.[a-z]+\\.[a-z0-9_]+$"
    }
  ];

  // Producer of an EVENT notification. Example: `osac-fulfillment`,
  // `osac-metering`. Empty for ANNOUNCEMENT.
  string source = 4 [(google.api.field_behavior) = IMMUTABLE];

  // OSAC user id of the inbox recipient. Empty for ANNOUNCEMENT.
  // Example: recipient_id = "user-123".
  string recipient_id = 5 [(google.api.field_behavior) = IMMUTABLE];

  // Scope of an announcement.
  NotificationScope scope = 6 [
    (google.api.field_behavior) = IMMUTABLE,
    (buf.validate.field).enum.defined_only = true
  ];

  // Title of the notification.
  string title = 7 [
    (google.api.field_behavior) = IMMUTABLE,
    (buf.validate.field).string.min_len = 1
  ];

  // Description of the notification.
  string description = 8 [(google.api.field_behavior) = IMMUTABLE];

  // Related API object for deep links and visibility checks. Optional.
  NotificationObjectReference object = 9 [(google.api.field_behavior) = IMMUTABLE];

  // Optional producer-defined key/value metadata for UIs and clients.
  //
  // Keys are not a closed schema: producers may add kind-specific entries.
  // Common examples from fulfillment and metering publishers:
  //   lifecycle = "created" | "failed" | ...
  //   project_id = "proj-9"
  //   name = "vm-42"
  //   used = "180"
  //   limit = "200"
  //   threshold_percent = "90"
  // Announcements often leave this map empty.
  map<string, string> details = 10 [(google.api.field_behavior) = IMMUTABLE];

  // Read state of an inbox notification.
  NotificationState state = 11 [(buf.validate.field).enum.defined_only = true];
}

// An inbox item or announcement.
//
// buf:lint:ignore OSAC_OBJECT_SHAPE
message Notification {
  // Unique identifier of the notification.
  string id = 1;

  // Metadata of the notification.
  Metadata metadata = 2 [(buf.validate.field).required = true];

  // Spec of the notification.
  NotificationSpec spec = 3 [(buf.validate.field).required = true];
}
