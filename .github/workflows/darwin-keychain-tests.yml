# The rest of this repo's CI runs on ubuntu-latest only (see unit-tests.yml,
# integration-tests.yml), so fulfillment-service/it/it_keychain_darwin.go's
# //go:build darwin path never compiles or runs there -- NewCLIHomeDir always
# resolves to the it_keychain_other.go no-op stub in CI. This workflow closes
# that gap for just the files that matter, on a macos-latest runner, instead
# of moving the whole IT suite (or unit-tests.yml) to macOS.
name: Darwin Keychain Tests

on:
  pull_request:
    branches:
    - main
    paths:
    - 'fulfillment-service/it/it_keychain_darwin.go'
    - 'fulfillment-service/it/it_keychain_darwin_test.go'
    - 'fulfillment-service/it/it_keychain_other.go'
    - 'fulfillment-service/it/it_tool.go'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-darwin-keychain-tests:
    name: Run darwin keychain tests
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-go
      with:
        working-directory: fulfillment-service
    - working-directory: fulfillment-service
      run: |
        go test -run 'TestProvisionTestKeychain|TestNewCLIHomeDir' -v ./it/...
