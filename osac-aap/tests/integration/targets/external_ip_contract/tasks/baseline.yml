---
- name: Verify Netris ExternalIP allocation and release use UID-owned reservations
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    netris_port: 18446
    netris_url: "http://127.0.0.1:{{ netris_port }}"
    pool_name: "external-ip-contract-pool"
    pool_fulfillment_id: "11111111-1111-4111-8111-111111111111"
    pool_cidr: "198.51.100.0/29"
    tenant_id: "external-ip-contract-tenant"
  tasks:
    - name: Run the Netris ExternalIP contract scenarios
      block:
        - name: Stop a stale Netris fixture
          ansible.builtin.shell: "pkill -f '[m]ock_netris.py {{ netris_port }}' 2>/dev/null || true"
          changed_when: false

        - name: Verify the test Kind kubeconfig is selected
          ansible.builtin.assert:
            that:
              - lookup('env', 'KUBECONFIG') is search('kubeconfig-osac-test')
              - lookup('env', 'K8S_AUTH_KUBECONFIG') is search('kubeconfig-osac-test')

        - name: Start the Netris IPAM fixture
          ansible.builtin.command:
            argv:
              - python3
              - "{{ playbook_dir }}/../files/mock_netris.py"
              - "{{ netris_port }}"
          changed_when: false
          async: 600
          poll: 0

        - name: Wait for the Netris fixture
          ansible.builtin.wait_for:
            host: 127.0.0.1
            port: "{{ netris_port }}"
            timeout: 30

        - name: Create a unique fixture namespace
          ansible.builtin.tempfile:
            state: directory
            prefix: osac-eip-contract-
          register: eip_contract_tempdir

        - name: Set namespace and temporary file paths
          ansible.builtin.set_fact:
            eip_contract_namespace: >-
              {{ ('osac-eip-' ~ (eip_contract_tempdir.path | basename))[:63]
                 | regex_replace('[^a-z0-9-]', '-') | regex_replace('-+$', '') }}
            eip_contract_vars_file: "{{ eip_contract_tempdir.path }}/extra-vars.json"

        - name: Create the fixture namespace
          kubernetes.core.k8s:
            api_version: v1
            kind: Namespace
            name: "{{ eip_contract_namespace }}"
            state: present

        - name: Ensure the MetalLB Service namespace exists for the fixture
          kubernetes.core.k8s:
            api_version: v1
            kind: Namespace
            name: metallb-system
            state: present

        - name: Start the deterministic MetalLB assignment fixture
          ansible.builtin.command:
            argv:
              - uv
              - run
              - python
              - "{{ playbook_dir }}/../files/fake_metallb.py"
          environment:
            KUBECONFIG: "{{ lookup('env', 'KUBECONFIG') }}"
            OSAC_EIP_STATUS_MUTATION_NAMESPACE: "{{ eip_contract_namespace }}"
            OSAC_EIP_STATUS_MUTATION_NAME: external-ip-contract-metallb
          changed_when: false
          async: 600
          poll: 0

        - name: Create the ExternalIPPool CR
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: osac.openshift.io/v1alpha1
              kind: ExternalIPPool
              metadata:
                name: "{{ pool_name }}"
                namespace: "{{ eip_contract_namespace }}"
                labels:
                  osac.openshift.io/externalippool-uuid: "{{ pool_fulfillment_id }}"
                annotations:
                  osac.openshift.io/tenant: "{{ tenant_id }}"
              spec:
                ipFamily: IPv4
                cidrs:
                  - "{{ pool_cidr }}"

        - name: Create the first ExternalIP CR
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: osac.openshift.io/v1alpha1
              kind: ExternalIP
              metadata:
                name: external-ip-contract-one
                namespace: "{{ eip_contract_namespace }}"
                labels:
                  osac.openshift.io/externalip-uuid: "22222222-2222-4222-8222-222222222222"
                annotations:
                  osac.openshift.io/externalippool-name: "{{ pool_name }}"
                  osac.openshift.io/implementation-strategy: netris
                  osac.openshift.io/tenant: "{{ tenant_id }}"
                  osac.openshift.io/externalip-contract-version: v1
              spec:
                pool: "{{ pool_fulfillment_id }}"

        - name: Create the second ExternalIP CR
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: osac.openshift.io/v1alpha1
              kind: ExternalIP
              metadata:
                name: external-ip-contract-two
                namespace: "{{ eip_contract_namespace }}"
                annotations:
                  osac.openshift.io/externalippool-name: "{{ pool_name }}"
                  osac.openshift.io/implementation-strategy: netris
              spec:
                pool: "{{ pool_fulfillment_id }}"

        - name: Create an ExternalIP with an ambiguous legacy Netris reservation
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: osac.openshift.io/v1alpha1
              kind: ExternalIP
              metadata:
                name: external-ip-contract-legacy-netris
                namespace: "{{ eip_contract_namespace }}"
                annotations:
                  osac.openshift.io/externalippool-name: "{{ pool_name }}"
                  osac.openshift.io/implementation-strategy: netris
              spec:
                pool: "{{ pool_fulfillment_id }}"

        - name: Create an ExternalIP with an ambiguous legacy MetalLB Service
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: osac.openshift.io/v1alpha1
              kind: ExternalIP
              metadata:
                name: external-ip-contract-legacy-metallb
                namespace: "{{ eip_contract_namespace }}"
                annotations:
                  osac.openshift.io/externalippool-name: "{{ pool_name }}"
                  osac.openshift.io/implementation-strategy: k8s_only
              spec:
                pool: "{{ pool_fulfillment_id }}"

        - name: Create a Service using the legacy name-based MetalLB identity
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Service
              metadata:
                name: osac-eip-external-ip-contract-legacy-metallb
                namespace: metallb-system
                labels:
                  osac.openshift.io/externalip: external-ip-contract-legacy-metallb
                  osac.openshift.io/managed-by: osac-fulfillment
              spec:
                type: LoadBalancer
                selector: {}
                ports:
                  - name: placeholder
                    protocol: TCP
                    port: 65535
                    targetPort: 65535

        - name: Read the pool and ExternalIP identities from Kubernetes
          kubernetes.core.k8s_info:
            api_version: osac.openshift.io/v1alpha1
            kind: "{{ item.kind }}"
            namespace: "{{ eip_contract_namespace }}"
            name: "{{ item.name }}"
          loop:
            - {kind: ExternalIPPool, name: "{{ pool_name }}"}
            - {kind: ExternalIP, name: external-ip-contract-one}
            - {kind: ExternalIP, name: external-ip-contract-two}
            - {kind: ExternalIP, name: external-ip-contract-legacy-netris}
            - {kind: ExternalIP, name: external-ip-contract-legacy-metallb}
          register: eip_contract_cr_reads

        - name: Save the persisted objects
          ansible.builtin.set_fact:
            eip_contract_first: "{{ eip_contract_cr_reads.results[1].resources[0] }}"
            eip_contract_pool: "{{ eip_contract_cr_reads.results[0].resources[0] }}"
            eip_contract_pool_context:
              fulfillment_id: "{{ pool_fulfillment_id }}"
              kubernetes_uid: "{{ eip_contract_cr_reads.results[0].resources[0].metadata.uid }}"
              tenant_id: "{{ tenant_id }}"
              cidr: "{{ pool_cidr }}"
              phase: Ready
            eip_contract_second: "{{ eip_contract_cr_reads.results[2].resources[0] }}"
            eip_contract_legacy_netris: "{{ eip_contract_cr_reads.results[3].resources[0] }}"
            eip_contract_legacy_metallb: "{{ eip_contract_cr_reads.results[4].resources[0] }}"
            eip_contract_first_before: "{{ eip_contract_cr_reads.results[1].resources[0] }}"

        - name: Verify no pool allocation Lease exists in the fresh namespace
          kubernetes.core.k8s_info:
            api_version: coordination.k8s.io/v1
            kind: Lease
            namespace: "{{ eip_contract_namespace }}"
            name: "external-ip-{{ eip_contract_pool.metadata.uid | hash('sha1') }}"
          register: eip_contract_lease_before_unallocated_release

        - name: Assert the fresh namespace has no allocation Lease yet
          ansible.builtin.assert:
            that:
              - eip_contract_lease_before_unallocated_release.resources | length == 0

        - name: Release an ExternalIP without a prior allocation in the fresh namespace
          ansible.builtin.include_tasks: run_external_ip_playbook.yaml
          vars:
            eip_contract_operation: delete
            eip_contract_resource: "{{ eip_contract_first }}"
            eip_contract_netris_url: "{{ netris_url }}"
            eip_contract_should_succeed: true

        - name: Read the pool allocation Lease after no-op release
          kubernetes.core.k8s_info:
            api_version: coordination.k8s.io/v1
            kind: Lease
            namespace: "{{ eip_contract_namespace }}"
            name: "external-ip-{{ eip_contract_pool.metadata.uid | hash('sha1') }}"
          register: eip_contract_lease_after_unallocated_release

        - name: Assert release created and left the pool allocation Lease unlocked
          ansible.builtin.assert:
            that:
              - eip_contract_lease_after_unallocated_release.resources | length == 1
              - >-
                eip_contract_lease_after_unallocated_release.resources[0].spec.holderIdentity
                | default('') == ''

        - name: Build an ExternalIP snapshot with an absent labels map
          ansible.builtin.set_fact:
            eip_contract_missing_labels: >-
              {{ eip_contract_first | combine(
                   {'metadata': eip_contract_first.metadata | combine({'labels': none})},
                   recursive=true) }}

        - name: Report a clear validation error for absent ExternalIP labels
          ansible.builtin.include_tasks: run_external_ip_playbook.yaml
          vars:
            eip_contract_operation: create
            eip_contract_resource: "{{ eip_contract_missing_labels }}"
            eip_contract_netris_url: "{{ netris_url }}"
            eip_contract_should_succeed: false
            eip_contract_expected_failure: >-
              ExternalIP v1 operations require the current resource identity
              and its matching pool snapshot

        - name: Configure a concurrent claim on the first Netris candidate
          ansible.builtin.uri:
            url: "{{ netris_url }}/_config"
            method: POST
            body_format: json
            body:
              conflict_once: true
              status_update_once:
                name: external-ip-contract-one
                namespace: "{{ eip_contract_namespace }}"
                status:
                  phase: Progressing
              allocations:
                - name: "{{ pool_name }}"
                  prefix: "{{ pool_cidr }}"
              subnets:
                - id: 800
                  name: external-ip-contract-legacy-netris
                  prefix: 198.51.100.6/32
            status_code: 200

        - name: Refuse ambiguous legacy Netris reservations on allocation and release
          block:
            - name: Refuse allocation from an ambiguous name-keyed reservation
              ansible.builtin.include_tasks: run_external_ip_playbook.yaml
              vars:
                eip_contract_operation: create
                eip_contract_resource: "{{ eip_contract_legacy_netris }}"
                eip_contract_netris_url: "{{ netris_url }}"
                eip_contract_should_succeed: false
                eip_contract_expected_failure: 'allocation is blocked'

            - name: Refuse release while the legacy reservation remains
              ansible.builtin.include_tasks: run_external_ip_playbook.yaml
              vars:
                eip_contract_operation: delete
                eip_contract_resource: "{{ eip_contract_legacy_netris }}"
                eip_contract_netris_url: "{{ netris_url }}"
                eip_contract_should_succeed: false
                eip_contract_expected_failure: 'release is blocked'

            - name: Read Netris state after rejecting the legacy reservation
              ansible.builtin.uri:
                url: "{{ netris_url }}/_state"
                method: GET
                status_code: 200
              register: eip_contract_legacy_netris_state

            - name: Verify the ambiguous reservation remains untouched
              ansible.builtin.assert:
                that:
                  - >-
                    eip_contract_legacy_netris_state.json.subnets
                    | selectattr('name', 'equalto', eip_contract_legacy_netris.metadata.name)
                    | list | length == 1
                  - >-
                    eip_contract_legacy_netris_state.json.subnets
                    | selectattr('name', 'equalto', 'osac-eip-' ~ eip_contract_legacy_netris.metadata.uid)
                    | list | length == 0

        - name: Create the first UID-owned reservation and retry after a claim conflict
          ansible.builtin.include_tasks: run_external_ip_playbook.yaml
          vars:
            eip_contract_operation: create
            eip_contract_resource: "{{ eip_contract_first }}"
            eip_contract_netris_url: "{{ netris_url }}"
            eip_contract_should_succeed: true

        - name: Read the first ExternalIP after provisioning
          kubernetes.core.k8s_info:
            api_version: osac.openshift.io/v1alpha1
            kind: ExternalIP
            namespace: "{{ eip_contract_namespace }}"
            name: external-ip-contract-one
          register: eip_contract_first_after_create

        - name: Read Netris reservations after the first claim
          ansible.builtin.uri:
            url: "{{ netris_url }}/_state"
            method: GET
            status_code: 200
          register: eip_contract_first_netris_state

        - name: Verify conflict retry, UID ownership, and artifact-only handoff
          ansible.builtin.assert:
            that:
              - eip_contract_result.data.address == '198.51.100.2'
              - eip_contract_first_after_create.resources[0].metadata.annotations == eip_contract_first_before.metadata.annotations
              - >-
                'osac.openshift.io/allocated-address' not in
                eip_contract_first_after_create.resources[0].metadata.annotations
              - eip_contract_first_after_create.resources[0].spec == eip_contract_first_before.spec
              - eip_contract_first_after_create.resources[0].status.phase == 'Progressing'
              - >-
                eip_contract_first_after_create.resources[0].metadata.resourceVersion !=
                eip_contract_first_before.metadata.resourceVersion
              - >-
                eip_contract_first_after_create.resources[0].metadata.generation ==
                eip_contract_first_before.metadata.generation
              - >-
                eip_contract_first_netris_state.json.subnets
                | selectattr('name', 'equalto', 'osac-eip-' ~ eip_contract_first.metadata.uid)
                | list | length == 1

        - name: Retry the same ExternalIP allocation
          ansible.builtin.include_tasks: run_external_ip_playbook.yaml
          vars:
            eip_contract_operation: create
            eip_contract_resource: "{{ eip_contract_first_after_create.resources[0] }}"
            eip_contract_netris_url: "{{ netris_url }}"
            eip_contract_should_succeed: true

        - name: Read Netris reservations after same-UID retry
          ansible.builtin.uri:
            url: "{{ netris_url }}/_state"
            method: GET
            status_code: 200
          register: eip_contract_retry_state

        - name: Verify same-UID retry reused the durable reservation
          ansible.builtin.assert:
            that:
              - >-
                eip_contract_retry_state.json.subnets
                | selectattr('name', 'equalto', 'osac-eip-' ~ eip_contract_first.metadata.uid)
                | list | length == 1
              - >-
                eip_contract_retry_state.json.calls
                | selectattr('method', 'equalto', 'POST') | list | length == 2

        - name: Prepare a stale-generation copy of the allocated ExternalIP
          ansible.builtin.set_fact:
            eip_contract_stale_generation: >-
              {{ eip_contract_first_after_create.resources[0]
                 | combine({'metadata': eip_contract_first_after_create.resources[0].metadata
                    | combine({'generation': (eip_contract_first_after_create.resources[0].metadata.generation | int) + 1})},
                   recursive=true) }}

        - name: Reject a stale-generation manager result
          ansible.builtin.include_tasks: run_external_ip_playbook.yaml
          vars:
            eip_contract_operation: create
            eip_contract_resource: "{{ eip_contract_stale_generation }}"
            eip_contract_netris_url: "{{ netris_url }}"
            eip_contract_should_succeed: false
            eip_contract_expected_failure: 'refusing to create a provider reservation for a stale resource'

        - name: Prepare a stale-UID copy of the allocated ExternalIP
          ansible.builtin.set_fact:
            eip_contract_stale_uid: >-
              {{ eip_contract_first_after_create.resources[0]
                 | combine({'metadata': eip_contract_first_after_create.resources[0].metadata
                    | combine({'uid': 'stale-external-ip-uid'})}, recursive=true) }}

        - name: Reject a stale-UID allocation before creating a provider reservation
          ansible.builtin.include_tasks: run_external_ip_playbook.yaml
          vars:
            eip_contract_operation: create
            eip_contract_resource: "{{ eip_contract_stale_uid }}"
            eip_contract_netris_url: "{{ netris_url }}"
            eip_contract_should_succeed: false
            eip_contract_expected_failure: 'refusing to create a provider reservation for a stale resource'

        - name: Read Netris state after stale allocation attempts
          ansible.builtin.uri:
            url: "{{ netris_url }}/_state"
            method: GET
            status_code: 200
          register: eip_contract_stale_requests_state

        - name: Verify stale allocation attempts made no extra reservation
          ansible.builtin.assert:
            that:
              - >-
                eip_contract_stale_requests_state.json.subnets
                | selectattr('name', 'equalto', 'osac-eip-' ~ eip_contract_first.metadata.uid)
                | list | length == 1
              - >-
                eip_contract_stale_requests_state.json.subnets
                | selectattr('name', 'equalto', 'osac-eip-stale-external-ip-uid')
                | list | length == 0

        - name: Create a distinct ExternalIP reservation
          ansible.builtin.include_tasks: run_external_ip_playbook.yaml
          vars:
            eip_contract_operation: create
            eip_contract_resource: "{{ eip_contract_second }}"
            eip_contract_netris_url: "{{ netris_url }}"
            eip_contract_should_succeed: true

        - name: Read the second ExternalIP and current provider state
          block:
            - name: Read the second ExternalIP
              kubernetes.core.k8s_info:
                api_version: osac.openshift.io/v1alpha1
                kind: ExternalIP
                namespace: "{{ eip_contract_namespace }}"
                name: external-ip-contract-two
              register: eip_contract_second_after_create

            - name: Read the provider state
              ansible.builtin.uri:
                url: "{{ netris_url }}/_state"
                method: GET
                status_code: 200
              register: eip_contract_two_state

        - name: Verify distinct UIDs receive unique pool addresses
          ansible.builtin.assert:
            that:
              - >-
                eip_contract_second_after_create.resources[0].metadata.annotations[
                  'osac.openshift.io/allocated-address'] == '198.51.100.3'
              - >-
                eip_contract_two_state.json.subnets
                | selectattr('name', 'equalto', 'osac-eip-' ~ eip_contract_first.metadata.uid)
                | list | length == 1
              - >-
                eip_contract_two_state.json.subnets
                | selectattr('name', 'equalto', 'osac-eip-' ~ eip_contract_second.metadata.uid)
                | list | length == 1

        - name: Release only the first UID-owned reservation
          ansible.builtin.include_tasks: run_external_ip_playbook.yaml
          vars:
            eip_contract_operation: delete
            eip_contract_resource: "{{ eip_contract_first_after_create.resources[0] }}"
            eip_contract_netris_url: "{{ netris_url }}"
            eip_contract_should_succeed: true

        - name: Read provider state after release
          ansible.builtin.uri:
            url: "{{ netris_url }}/_state"
            method: GET
            status_code: 200
          register: eip_contract_release_state

        - name: Verify release leaves the other UID reservation intact
          ansible.builtin.assert:
            that:
              - >-
                eip_contract_release_state.json.subnets
                | selectattr('name', 'equalto', 'osac-eip-' ~ eip_contract_second.metadata.uid)
                | list | length == 1
              - >-
                eip_contract_release_state.json.subnets
                | selectattr('name', 'equalto', 'osac-eip-' ~ eip_contract_first.metadata.uid)
                | list | length == 0

        - name: Create an ExternalIP that uses the k8s_only MetalLB manager
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: osac.openshift.io/v1alpha1
              kind: ExternalIP
              metadata:
                name: external-ip-contract-metallb
                namespace: "{{ eip_contract_namespace }}"
                labels:
                  osac.openshift.io/externalip-uuid: "33333333-3333-4333-8333-333333333333"
                annotations:
                  osac.openshift.io/externalippool-name: "{{ pool_name }}"
                  osac.openshift.io/implementation-strategy: k8s_only
                  osac.openshift.io/tenant: "{{ tenant_id }}"
                  osac.openshift.io/externalip-contract-version: v1
              spec:
                pool: "{{ pool_fulfillment_id }}"

        - name: Read the persisted MetalLB ExternalIP identity
          kubernetes.core.k8s_info:
            api_version: osac.openshift.io/v1alpha1
            kind: ExternalIP
            namespace: "{{ eip_contract_namespace }}"
            name: external-ip-contract-metallb
          register: eip_contract_metallb_before

        - name: Create the v1 k8s_only ExternalIP through the top-level playbook
          ansible.builtin.include_tasks: run_external_ip_playbook.yaml
          vars:
            eip_contract_operation: create
            eip_contract_resource: "{{ eip_contract_metallb_before.resources[0] }}"
            eip_contract_netris_url: "{{ netris_url }}"
            eip_contract_should_succeed: true

        - name: Read the MetalLB ExternalIP and UID-owned parking Service
          block:
            - name: Read the MetalLB ExternalIP
              kubernetes.core.k8s_info:
                api_version: osac.openshift.io/v1alpha1
                kind: ExternalIP
                namespace: "{{ eip_contract_namespace }}"
                name: external-ip-contract-metallb
              register: eip_contract_metallb_after_create

            - name: Read the parking Service
              kubernetes.core.k8s_info:
                api_version: v1
                kind: Service
                namespace: metallb-system
                name: "osac-eip-{{ eip_contract_metallb_before.resources[0].metadata.uid }}"
              register: eip_contract_metallb_service

        - name: Verify MetalLB UID ownership, result artifact, and pool selection
          ansible.builtin.assert:
            that:
              - eip_contract_result.data.address == '198.51.100.6'
              - eip_contract_metallb_after_create.resources[0].metadata.annotations == eip_contract_metallb_before.resources[0].metadata.annotations
              - >-
                'osac.openshift.io/allocated-address' not in
                eip_contract_metallb_after_create.resources[0].metadata.annotations
              - eip_contract_metallb_after_create.resources[0].status.phase == 'Progressing'
              - >-
                eip_contract_metallb_after_create.resources[0].metadata.resourceVersion !=
                eip_contract_metallb_before.resources[0].metadata.resourceVersion
              - >-
                eip_contract_metallb_after_create.resources[0].metadata.generation ==
                eip_contract_metallb_before.resources[0].metadata.generation
              - eip_contract_metallb_service.resources | length == 1
              - >-
                eip_contract_metallb_service.resources[0].metadata.labels[
                  'osac.openshift.io/externalip-uid'] ==
                eip_contract_metallb_before.resources[0].metadata.uid
              - >-
                eip_contract_metallb_service.resources[0].metadata.annotations[
                  'metallb.universe.tf/address-pool'] == pool_name

        - name: Retry the same MetalLB allocation
          ansible.builtin.include_tasks: run_external_ip_playbook.yaml
          vars:
            eip_contract_operation: create
            eip_contract_resource: "{{ eip_contract_metallb_after_create.resources[0] }}"
            eip_contract_netris_url: "{{ netris_url }}"
            eip_contract_should_succeed: true

        - name: Verify the MetalLB retry reused one UID-owned Service
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Service
            namespace: metallb-system
            name: "osac-eip-{{ eip_contract_metallb_before.resources[0].metadata.uid }}"
          register: eip_contract_metallb_service_after_retry

        - name: Assert the MetalLB retry kept the reservation present
          ansible.builtin.assert:
            that:
              - eip_contract_metallb_service_after_retry.resources | length == 1

        - name: Create a ComputeInstance for the MetalLB attachment lifecycle
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: osac.openshift.io/v1alpha1
              kind: ComputeInstance
              metadata:
                name: external-ip-contract-vm
                namespace: "{{ eip_contract_namespace }}"
                labels:
                  osac.openshift.io/computeinstance-uuid: "44444444-4444-4444-8444-444444444444"
                annotations:
                  osac.openshift.io/tenant: "{{ tenant_id }}"
              spec:
                templateID: osac.templates.ocp_virt_vm
                vcpus: 2
                memoryGiB: 4
                bootDisk:
                  sizeGiB: 20
                  storageTier: local
                image:
                  sourceType: registry
                  sourceRef: quay.io/containerdisks/fedora:latest
                runStrategy: Always

        - name: Build the ExternalIPAttachment fixture with the parent UID
          ansible.builtin.set_fact:
            eip_contract_attachment:
              apiVersion: osac.openshift.io/v1alpha1
              kind: ExternalIPAttachment
              metadata:
                name: external-ip-contract-metallb-attachment
                namespace: "{{ eip_contract_namespace }}"
                annotations:
                  osac.openshift.io/implementation-strategy: k8s_only
                  osac.openshift.io/externalip-name: external-ip-contract-metallb
                  osac.openshift.io/externalip-uid: >-
                    {{ eip_contract_metallb_before.resources[0].metadata.uid }}
                  osac.openshift.io/externalippool-name: "{{ pool_name }}"
                  osac.openshift.io/externalip-target-namespace: "{{ eip_contract_namespace }}"
                  osac.openshift.io/tenant: "{{ tenant_id }}"
              spec:
                externalIP: "33333333-3333-4333-8333-333333333333"
                computeInstance: "44444444-4444-4444-8444-444444444444"

        - name: Attach the ExternalIP using its Kubernetes UID
          ansible.builtin.include_tasks: run_external_ip_attachment_playbook.yaml
          vars:
            eip_contract_attachment_operation: attach

        - name: Wait for the ingress Service address before detaching
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Service
            namespace: "{{ eip_contract_namespace }}"
            name: osac-eip-external-ip-contract-metallb-ingress
          register: eip_contract_ingress_service
          retries: 20
          delay: 1
          until: >-
            eip_contract_ingress_service.resources | length == 1 and
            eip_contract_ingress_service.resources[0].status.loadBalancer.ingress
            | default([]) | length == 1

        - name: Verify attach moved the UID-owned reservation to the ingress Service
          block:
            - name: Read the parking Service after attach
              kubernetes.core.k8s_info:
                api_version: v1
                kind: Service
                namespace: metallb-system
                name: "osac-eip-{{ eip_contract_metallb_before.resources[0].metadata.uid }}"
              register: eip_contract_parking_after_attach

            - name: Verify the reservation moved to the ingress Service
              ansible.builtin.assert:
                that:
                  - eip_contract_parking_after_attach.resources | length == 0
                  - eip_contract_ingress_service.resources | length == 1
                  - >-
                    eip_contract_ingress_service.resources[0].metadata.labels[
                      'osac.openshift.io/externalip-uid'] ==
                    eip_contract_metallb_before.resources[0].metadata.uid
                  - >-
                    eip_contract_ingress_service.resources[0].metadata.annotations[
                      'osac.openshift.io/tenant'] == tenant_id
                  - >-
                    eip_contract_ingress_service.resources[0].metadata.annotations[
                      'osac.openshift.io/owner-reference'] ==
                    'ExternalIP/external-ip-contract-metallb'

        - name: Detach the ExternalIP and restore its UID-owned reservation
          ansible.builtin.include_tasks: run_external_ip_attachment_playbook.yaml
          vars:
            eip_contract_attachment_operation: detach

        - name: Read the restored UID-owned parking Service
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Service
            namespace: metallb-system
            name: "osac-eip-{{ eip_contract_metallb_before.resources[0].metadata.uid }}"
          register: eip_contract_parking_after_detach

        - name: Read the ingress Service after detach
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Service
            namespace: "{{ eip_contract_namespace }}"
            name: osac-eip-external-ip-contract-metallb-ingress
          register: eip_contract_ingress_after_detach

        - name: Verify detach restored the UID-owned reservation and removed ingress
          ansible.builtin.assert:
            that:
              - eip_contract_parking_after_detach.resources | length == 1
              - eip_contract_ingress_after_detach.resources | length == 0
              - >-
                eip_contract_parking_after_detach.resources[0].metadata.labels[
                  'osac.openshift.io/externalip-uid'] ==
                eip_contract_metallb_before.resources[0].metadata.uid
              - >-
                eip_contract_parking_after_detach.resources[0].metadata.annotations[
                  'metallb.universe.tf/loadBalancerIPs'] == '198.51.100.6'
              - >-
                eip_contract_parking_after_detach.resources[0].metadata.annotations[
                  'osac.openshift.io/tenant'] == tenant_id
              - >-
                eip_contract_parking_after_detach.resources[0].metadata.annotations[
                  'osac.openshift.io/owner-reference'] ==
                'ExternalIP/external-ip-contract-metallb'

        - name: Refuse ambiguous legacy MetalLB ownership on create and release
          block:
            - name: Read the legacy MetalLB ExternalIP
              kubernetes.core.k8s_info:
                api_version: osac.openshift.io/v1alpha1
                kind: ExternalIP
                namespace: "{{ eip_contract_namespace }}"
                name: external-ip-contract-legacy-metallb
              register: eip_contract_legacy_metallb_before

            - name: Refuse to create beside the legacy MetalLB Service
              ansible.builtin.include_tasks: run_external_ip_playbook.yaml
              vars:
                eip_contract_operation: create
                eip_contract_resource: "{{ eip_contract_legacy_metallb_before.resources[0] }}"
                eip_contract_netris_url: "{{ netris_url }}"
                eip_contract_should_succeed: false
                eip_contract_expected_failure: 'allocation is blocked until an administrator safely migrates or removes that Service'

            - name: Refuse release while the legacy MetalLB Service remains
              ansible.builtin.include_tasks: run_external_ip_playbook.yaml
              vars:
                eip_contract_operation: delete
                eip_contract_resource: "{{ eip_contract_legacy_metallb_before.resources[0] }}"
                eip_contract_netris_url: "{{ netris_url }}"
                eip_contract_should_succeed: false
                eip_contract_expected_failure: 'release is blocked until an administrator safely migrates or removes that Service'

            - name: Read the legacy and UID-owned MetalLB Services
              kubernetes.core.k8s_info:
                api_version: v1
                kind: Service
                namespace: metallb-system
                name: "{{ item }}"
              loop:
                - osac-eip-external-ip-contract-legacy-metallb
                - "osac-eip-{{ eip_contract_legacy_metallb_before.resources[0].metadata.uid }}"
              register: eip_contract_legacy_metallb_services

            - name: Verify the legacy Service remains without a replacement
              ansible.builtin.assert:
                that:
                  - eip_contract_legacy_metallb_services.results[0].resources | length == 1
                  - eip_contract_legacy_metallb_services.results[1].resources | length == 0

        - name: Release the k8s_only MetalLB ExternalIP through the top-level playbook
          ansible.builtin.include_tasks: run_external_ip_playbook.yaml
          vars:
            eip_contract_operation: delete
            eip_contract_resource: "{{ eip_contract_metallb_after_create.resources[0] }}"
            eip_contract_netris_url: "{{ netris_url }}"
            eip_contract_should_succeed: true

        - name: Confirm the MetalLB parking Service was removed
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Service
            namespace: metallb-system
            name: "osac-eip-{{ eip_contract_metallb_before.resources[0].metadata.uid }}"
          register: eip_contract_metallb_service_after_delete

        - name: Verify the UID-owned parking Service is absent
          ansible.builtin.assert:
            that:
              - eip_contract_metallb_service_after_delete.resources | length == 0
      always:
        - name: Stop the MetalLB assignment fixture
          ansible.builtin.shell: "pkill -f '[f]ake_metallb.py' 2>/dev/null || true"
          changed_when: false

        - name: Remove the test UID-owned MetalLB Service
          kubernetes.core.k8s:
            api_version: v1
            kind: Service
            name: "osac-eip-{{ eip_contract_metallb_before.resources[0].metadata.uid }}"
            namespace: metallb-system
            state: absent
          when:
            - eip_contract_metallb_before is defined
            - eip_contract_metallb_before.resources | default([]) | length > 0
          failed_when: false

        - name: Remove the test namespace
          kubernetes.core.k8s:
            api_version: v1
            kind: Namespace
            name: "{{ eip_contract_namespace | default('osac-eip-contract-cleanup') }}"
            state: absent
            wait: true
            wait_timeout: 60
          failed_when: false

        - name: Stop the Netris fixture
          ansible.builtin.shell: "pkill -f '[m]ock_netris.py {{ netris_port }}' 2>/dev/null || true"
          changed_when: false

        - name: Remove the legacy MetalLB fixture Service
          kubernetes.core.k8s:
            api_version: v1
            kind: Service
            name: osac-eip-external-ip-contract-legacy-metallb
            namespace: metallb-system
            state: absent
          failed_when: false
