---
# Thin wrapper for per-provider dispatch. Called via include_tasks with loop
# because Ansible does not support loop: on include_role directly.
#
# Receives from caller (via loop_var or set_fact):
#   _current_provider  — the provider name for this iteration (e.g. 'vast')
#   _dispatch_action   — task file to invoke (setup, ensure_storage_class, teardown_cluster_storage, teardown_backend)
#
# Uses from play scope:
#   _storage_provider_tiers              — full tier list, qos_policy-defaulted (filtered here per provider)
#   storage_provider_backend_connections — backend connection details keyed by backend_id,
#                                          filtered here to only the backend_id(s) referenced
#                                          by this provider's dispatched tiers, so a role never
#                                          sees credentials for a backend it wasn't dispatched
#   _cluster_name                        — optional target cluster name override (for volume
#                                          naming); ensure_storage_class self-discovers it from
#                                          the target cluster's Infrastructure object when unset
#   storage_provider_target_kubeconfig  — optional kubeconfig for provider-managed
#                                          cluster-side resources; omit to use the worker's
#                                          default context
#   storage_provider_target_kubeconfig_insecure — disable TLS verification for the target
#                                          kubeconfig when the guest API certificate does not
#                                          match its bundled CA
#   _remote_kubeconfig_insecure          — remains the LVMS CaaS-install signal used by its
#                                          direct OLM and LVMCluster operations

- name: "Reset per-provider output facts before dispatch"
  # These are host facts, so they outlive the loop iteration that set them. A
  # provider role that fails to write its output would otherwise inherit the
  # previous provider's value — accumulating another provider's tenant config
  # under its own key, or re-appending StorageClass names it never produced.
  # tenant_config is nulled rather than emptied so "provider produced nothing"
  # stays distinguishable from "provider produced an empty mapping": the
  # accumulator below skips null, letting setup.yaml's validation fail the run.
  ansible.builtin.set_fact:
    storage_provider_tenant_config: null
    storage_provider_storage_class_names: []

- name: "Compute filtered tiers for current provider"
  ansible.builtin.set_fact:
    _computed_provider_tiers: >-
      {{ _storage_provider_tiers | selectattr('provider', 'in', [_current_provider, _current_provider | replace('_', '-')]) | list }}

- name: "Compute filtered backend connections for current provider's dispatched tiers"
  ansible.builtin.set_fact:
    _computed_provider_backend_connections: >-
      {{
        storage_provider_backend_connections
        | default({})
        | dict2items
        | selectattr(
            'key',
            'in',
            (_computed_provider_tiers
             | selectattr('backend_id', 'defined')
             | map(attribute='backend_id')
             | list)
          )
        | items2dict
      }}
  no_log: true

- name: "Dispatch provider storage action with remote kubeconfig routing"
  module_defaults:
    kubernetes.core.k8s:
      kubeconfig: "{{ storage_provider_target_kubeconfig | default(omit) }}"
      validate_certs: "{{ false if (storage_provider_target_kubeconfig_insecure | default(false) | bool) else omit }}"
    kubernetes.core.k8s_info:
      kubeconfig: "{{ storage_provider_target_kubeconfig | default(omit) }}"
      validate_certs: "{{ false if (storage_provider_target_kubeconfig_insecure | default(false) | bool) else omit }}"
  block:
    - name: "Include provider storage role"
      ansible.builtin.include_role:
        name: >-
          {% set _clean = _current_provider | replace('-', '_') -%}
          osac.templates.{{ _clean if _clean.endswith('_storage') else (_clean ~ '_storage') }}
        tasks_from: "{{ _dispatch_action }}"
        public: true
      vars:
        _provider_tiers: "{{ _computed_provider_tiers }}"
        _provider_backend_connections: "{{ _computed_provider_backend_connections }}"

- name: "Accumulate tenant config after dispatch (setup only)"
  ansible.builtin.set_fact:
    _all_tenant_configs: >-
      {{ _all_tenant_configs | combine({_current_provider: storage_provider_tenant_config}) }}
  when:
    - _dispatch_action == 'setup'
    - storage_provider_tenant_config is defined
    - storage_provider_tenant_config is mapping

- name: "Accumulate StorageClass names after dispatch (ensure_storage_class only)"
  ansible.builtin.set_fact:
    _all_sc_names: "{{ _all_sc_names + (storage_provider_storage_class_names | default([])) }}"
  when:
    - _dispatch_action == 'ensure_storage_class'
