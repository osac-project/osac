---
name: ontap-storage
title: NetApp ONTAP Storage Provider
description: >
  Validates pre-provisioned ONTAP SVMs and capped-tier QoS policies for OSAC
  tenants and drives NetApp Trident to serve block volumes. Consumes
  operator-resolved tenant preparation credentials, creates a
  TridentBackendConfig with per-tier labeled virtual pools and its CSI Secret
  in the Trident namespace, and manages tenant StorageClasses. ONTAP is
  block-only; discovery credentials never enter tenant-scoped Secrets.

template_type: storage_provider
implementation_strategy: ontap
capabilities:
  supported_protocols:
    - block
  provisioning_targets:
    - vmaas
