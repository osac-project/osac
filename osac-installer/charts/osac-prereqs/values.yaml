  enabled: true
  realmOverwrite: true
  hostname: "keycloak.keycloak.svc.cluster.local"
  adminUsername: admin
  adminPassword: admin
  defaultUserPassword: foobar
  route:
    hostname: ""
    publicIngress: false
  images:
    keycloak: quay.io/keycloak/keycloak:26.6.4
    postgres: quay.io/sclorg/postgresql-18-c10s@sha256:6be2c9d855f06fb665257a6b0911676a38d740be7022cc61acee1c99a832b1b2

aapOperator:
  enabled: true
  channel: stable-2.6-cluster-scoped

lvms:
  enabled: false
  channel: "stable-4.22"

metallb:
  enabled: false
  channel: "stable"

cnv:
  enabled: false
  channel: "stable"

mce:
  enabled: false
  channel: "stable-2.17"
  osImages: []

kafka:
  enabled: false
  replicas: 3
  storage:
    size: 100Gi
  version: "4.2.0"
  metadataVersion: "4.2-IV0"
