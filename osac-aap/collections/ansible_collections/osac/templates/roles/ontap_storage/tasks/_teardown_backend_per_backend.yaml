---
# Per-backend teardown_backend body, loop-included from teardown_backend.yaml
# (blocks cannot carry loop; the dispatcher's other actions use this same
# include-file pattern, e.g. setup's _setup_backend.yaml).

- name: Compute assignment key for backend {{ _ontap_backend_id }}
  ansible.builtin.set_fact:
    _assignment_key: >-
      {{ ((_ontap_backend_id ~ '|' ~ tenant_name) | hash('sha256'))[:16] | lower }}
    _prepared_secret_name: "osac-{{ ((_ontap_backend_id ~ '|' ~ tenant_name) | hash('sha256'))[:16] | lower }}-credentials"

- name: Read the prepared Secret from the hub cluster
  kubernetes.core.k8s_info:
    kubeconfig: ~
    api_version: v1
    kind: Secret
    name: "{{ _prepared_secret_name }}"
    namespace: "{{ ontap_storage_config_namespace }}"
  register: _prepared_secret_result
  no_log: true

- name: Log when the prepared Secret is already gone
  ansible.builtin.debug:
    msg: >-
      Prepared Secret '{{ _prepared_secret_name }}' not found in namespace
      '{{ ontap_storage_config_namespace }}' — nothing to release for backend
      '{{ _ontap_backend_id }}'. The admin may have already re-claimed the
      prepared resources.
  when: _prepared_secret_result.resources | length == 0

- name: Release the claim (atomic resourceVersion patch)
  when: >-
    _prepared_secret_result.resources | length > 0 and
    _prepared_secret_result.resources[0].metadata.annotations['osac.openshift.io/storage-assignment-state'] | default('') == 'claimed'
  block:
    - name: Verify original assignment ownership when tenant_uid is available
      ansible.builtin.fail:
        msg: >-
          Refusing to release the prepared assignment
          '{{ _assignment_key }}': the prepared Secret is claimed by tenant
          uid '{{ _prepared_secret_result.resources[0].metadata.annotations['osac.openshift.io/storage-tenant-uid'] | default('') }}',
          but expected '{{ tenant_uid }}'.
      when: >-
        tenant_uid is defined and tenant_uid | default('') | length > 0 and
        _prepared_secret_result.resources[0].metadata.annotations['osac.openshift.io/storage-tenant-uid'] | default('') != tenant_uid

    - name: Patch the assignment state to retained
      kubernetes.core.k8s:
        kubeconfig: ~
        state: patched
        api_version: v1
        kind: Secret
        name: "{{ _prepared_secret_name }}"
        namespace: "{{ ontap_storage_config_namespace }}"
        resource_definition:
          metadata:
            resourceVersion: "{{ _prepared_secret_result.resources[0].metadata.resourceVersion | string }}"
            annotations:
              osac.openshift.io/storage-assignment-state: retained
      no_log: true

    - name: Report the release
      ansible.builtin.debug:
        msg: >-
          Released prepared assignment '{{ _assignment_key }}' (backend
          '{{ _ontap_backend_id }}', tenant '{{ tenant_name }}') — state set
          to retained. ONTAP resources are kept prepared per the
          netapp-onboarding contract; the cloud admin can re-assign them.

  rescue:
    - name: Warn about teardown_backend failure
      ansible.builtin.debug:
        msg: >-
          Failed to release the prepared assignment for backend
          '{{ _ontap_backend_id }}' (tenant '{{ tenant_name }}').
          Error: {{ ansible_failed_result.msg | default('unknown') }}

  always:
    - name: Clear credential-bearing facts
      ansible.builtin.set_fact:
        _prepared_secret_result: {}
      no_log: true
