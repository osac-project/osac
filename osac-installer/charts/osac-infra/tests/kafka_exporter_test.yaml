suite: kafka exporter on the Kafka resource
templates:
  - templates/kafka.yaml
tests:
  - it: enables Strimzi's Kafka exporter when lag monitoring is on
    set:
      kafka.enabled: true
      kafka.exporter.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["kafka-cluster.yaml"]
          pattern: 'kafkaExporter: \{\}'

  - it: leaves the exporter off by default
    set:
      kafka.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - notMatchRegex:
          path: data["kafka-cluster.yaml"]
          pattern: 'kafkaExporter'

  - it: renders no Kafka resource when Kafka is disabled
    set:
      kafka.enabled: false
      kafka.exporter.enabled: true
    asserts:
      - hasDocuments:
          count: 0
